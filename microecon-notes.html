nal social cost）</strong>：MPC + MEC，邊際社會成本(p.524)。</li></ul>\n<h4 class=\"sub3\">四、外部成本（負的外部性）之情況</h4>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>座標軸：縱軸 <span class=\"fx\">P</span>、橫軸 <span class=\"fx\">Q</span>。</li><li>曲線：MSC(Q)=MPC(Q)+MEC(Q)（正斜率、較陡）、<span class=\"fx\">MPC(Q)</span>（正斜率、較平）、MPB(Q)=MSB(Q)（負斜率；假設 <span class=\"fx\">MEB=0</span>）。</li><li>交點：</li><li>社會最適點 <span class=\"fx\">d</span>：MSC 與 MSB 相交，對應 <span class=\"fx\">Q<sup>*</sup></span>、<span class=\"fx\">P<sup>*</sup></span>；</li><li>個人最適點 <span class=\"fx\">c</span>：MPC 與 MPB 相交，對應 Q<span class=\"fx\">′</span>、P<span class=\"fx\">′</span>。</li><li>個人角度下生產量 Q<span class=\"fx\">′</span> 比社會最適 <span class=\"fx\">Q<sup>*</sup></span> 大；在 <span class=\"fx\">Q<sup>*</sup></span> 到 Q<span class=\"fx\">′</span> 之間，MSC 大於 MSB，產生 <span class=\"fx\">bcd</span> 三角形的社會無謂損失（D.L.）(p.525–p.526)。</li></ul>\n<h5 class=\"sub4\">福利比較表（外部成本）</h5>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th></th><th>個人角度（MPC 決策）</th><th>社會角度（MSC 決策）</th></tr></thead><tbody><tr><td><span class=\"fx\">P</span></td><td>P<span class=\"fx\">′</span></td><td><span class=\"fx\">P<sup>*</sup></span></td></tr><tr><td><span class=\"fx\">Q</span></td><td>Q<span class=\"fx\">′</span></td><td><span class=\"fx\">Q<sup>*</sup></span></td></tr><tr><td>C.S.</td><td>acP<span class=\"fx\">′</span></td><td><span class=\"fx\">adP<sup>*</sup></span></td></tr><tr><td>P.S.</td><td>P<span class=\"fx\">′</span>cO</td><td><span class=\"fx\">P<sup>*</sup>de</span></td></tr><tr><td>TEC</td><td><span class=\"fx\">ebcO</span></td><td><span class=\"fx\">0</span></td></tr><tr><td>S.W.</td><td><span class=\"fx\">ade-bcd</span></td><td><span class=\"fx\">ade</span></td></tr><tr><td>D.L.</td><td><span class=\"fx\">bcd</span></td><td><span class=\"fx\">-</span></td></tr></tbody></table></div>\n<p>(p.526)</p>\n<h4 class=\"sub3\">五、外部利益（正的外部性）之情況</h4>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>座標軸：縱軸 <span class=\"fx\">P</span>、橫軸 <span class=\"fx\">Q</span>。</li><li>曲線：MSC(Q)=MPC(Q)（正斜率；假設 <span class=\"fx\">MEC=0</span>）、MSB(Q)=MPB(Q)+MEB(Q)（負斜率、較高）、<span class=\"fx\">MPB(Q)</span>（負斜率、較低）。</li><li>交點：</li><li>社會最適點 <span class=\"fx\">c</span>：MSC 與 MSB 相交，對應 <span class=\"fx\">Q<sup>*</sup></span>、<span class=\"fx\">P<sup>*</sup></span>；</li><li>個人最適點 <span class=\"fx\">d</span>：MPC 與 MPB 相交，對應 Q<span class=\"fx\">′</span>、P<span class=\"fx\">′</span>。</li><li>個人角度下生產量 Q<span class=\"fx\">′</span> 比社會最適 <span class=\"fx\">Q<sup>*</sup></span> 小；在 Q<span class=\"fx\">′</span> 到 <span class=\"fx\">Q<sup>*</sup></span> 之間，MSB 大於 MSC，產生 <span class=\"fx\">bcd</span> 三角形的社會無謂損失(p.526–p.527)。</li></ul>\n<h5 class=\"sub4\">福利比較表（外部利益）</h5>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th></th><th>個人角度（MPB 決策）</th><th>社會角度（MSB 決策）</th></tr></thead><tbody><tr><td><span class=\"fx\">P</span></td><td>P<span class=\"fx\">′</span></td><td><span class=\"fx\">P<sup>*</sup></span></td></tr><tr><td><span class=\"fx\">Q</span></td><td>Q<span class=\"fx\">′</span></td><td><span class=\"fx\">Q<sup>*</sup></span></td></tr><tr><td>C.S.</td><td>edP<span class=\"fx\">′</span></td><td><span class=\"fx\">acP<sup>*</sup></span></td></tr><tr><td>P.S.</td><td>P<span class=\"fx\">′</span>df</td><td><span class=\"fx\">P<sup>*</sup>cf</span></td></tr><tr><td>TEB</td><td><span class=\"fx\">abde</span></td><td><span class=\"fx\">0</span></td></tr><tr><td>S.W.</td><td><span class=\"fx\">abdf</span></td><td><span class=\"fx\">acf</span></td></tr><tr><td>D.L.</td><td><span class=\"fx\">bcd</span></td><td><span class=\"fx\">-</span></td></tr></tbody></table></div>\n<p>(p.527)</p>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.1</strong>： (1) 下列何種行為可能擁有正的外部效果？選項含買房子、請會計師報稅、打預防針、開車、買牛肉麵。<br>(2) 下列何種行為可能擁有負的外部效果？選項含國防、公眾教育、空氣汙染、吃牛肉麵。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.2</strong>： 題目：When a commodity generates substantial beneficial externalities and no harmful externalities, then firms producing theirs commodity will（？）選項含補貼下生產太少/沒補貼下生產太少/沒課稅下生產太多/補貼下生產太多。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>"}, {"id": "17.3", "title": "外部性的糾正方式（印刷頁 p.528–p.542）", "body": "\n<h4 class=\"sub3\">一、污染稅（Pigouvian tax）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>由皮古（A. C. Pigou）提出；向造成汙染的一方課徵每單位 <span class=\"fx\">t</span> 元的汙染稅，強迫生產者將外部性考慮入自身決策，將生產量由 Q<span class=\"fx\">′</span> 矯正回社會最適 <span class=\"fx\">Q<sup>*</sup></span>。</li><li>出現外部利益時，皮古稅變為<strong>皮古補貼（負的皮古稅）</strong>(p.528)。</li></ul>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>最適皮古稅條件：<span class=\"fx\">\\left.MSB(Q)=MPC(Q)+t|<sub>Q=Q<sup>*</sup></sub></span>(p.528)</li><li>最適 <span class=\"fx\">t</span>：<span class=\"fx\">t<sup>*</sup>=-\\dfrac∂ C<sub>A</sub>(X<sup>*</sup>)∂ X=\\dfrac∂ C<sub>B</sub>(X<sup>*</sup>)∂ X</span>(p.533)</li><li>最適稅額即為在社會最適水準 <span class=\"fx\">X<sup>*</sup></span> 上的邊際外部成本（MEC）(p.533)。</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>座標軸：縱軸 <span class=\"fx\">P</span>、橫軸 <span class=\"fx\">Q</span>。</li><li>曲線：MSC(Q)=MPC(Q)+MEC(Q)、<span class=\"fx\">MPC(Q)+t</span>（在 MPC 上方）、<span class=\"fx\">MPC(Q)</span>、MPB(Q)=MSB(Q)。</li><li>個人最適：MPC 與 MSB 交點 <span class=\"fx\">E</span>，決定 Q<span class=\"fx\">′</span>。</li><li>課稅後均衡：<span class=\"fx\">MPC+t</span> 與 MSB 交點 <span class=\"fx\">E<sup>*</sup></span>，決定 <span class=\"fx\">Q<sup>*</sup></span>、<span class=\"fx\">P<sup>*</sup></span>。</li><li>最適 <span class=\"fx\">t</span> 為在 <span class=\"fx\">Q<sup>*</sup></span> 上 MSC 與 MPC 的垂直距離(p.528)。</li></ul>\n<h4 class=\"sub3\">二、數理模型討論（兩廠商上下游）</h4>\n<h5 class=\"sub4\">模型假設</h5>\n<ul><li><span class=\"fx\">A</span> 廠商（鋼鐵廠）成本函數 <span class=\"fx\">C<sub>A</sub>=C<sub>A</sub>(Q<sub>A</sub>,X)</span>，<span class=\"fx\">∂ C<sub>A</sub>/∂ Q<sub>A</sub>>0</span>、<span class=\"fx\">∂ C<sub>A</sub>/∂ X<0</span>（<span class=\"fx\">X</span> 排放汙染可減少防污成本）。</li><li><span class=\"fx\">B</span> 廠商（魚池）成本函數 <span class=\"fx\">C<sub>B</sub>=C<sub>B</sub>(Q<sub>B</sub>,X)</span>，<span class=\"fx\">∂ C<sub>B</sub>/∂ Q<sub>B</sub>>0</span>、<span class=\"fx\">∂ C<sub>B</sub>/∂ X>0</span>（<span class=\"fx\">X</span> 增加使 <span class=\"fx\">B</span> 成本上升）(p.530)。</li></ul>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>個別決策（A 廠商）：<span class=\"fx\">\\max<sub>Q<sub>A</sub>,X</sub>π<sub>A</sub>=P<sub>A</sub>Q<sub>A</sub>-C<sub>A</sub>(Q<sub>A</sub>,X)</span></li><li>F.O.C.：<span class=\"fx\">P<sub>A</sub>-∂ C<sub>A</sub>/∂ Q<sub>A</sub>=0</span>；<span class=\"fx\">-∂ C<sub>A</sub>/∂ X=0</span>（A 將 <span class=\"fx\">X</span> 排放到邊際私人利益 <span class=\"fx\">MPB(X)=-∂ C<sub>A</sub>/∂ X=0</span>）。</li><li>社會最適（合併兩廠）：<span class=\"fx\">\\max<sub>Q<sub>A</sub>,Q<sub>B</sub>,X</sub>Ω=π<sub>A</sub>+π<sub>B</sub></span></li><li>F.O.C.：<span class=\"fx\">∂Ω/∂ X=-∂ C<sub>A</sub>/∂ X-∂ C<sub>B</sub>/∂ X=0</span></li><li>即 <span class=\"fx\">-\\dfrac∂ C<sub>A</sub>∂ X=\\dfrac∂ C<sub>B</sub>∂ X</span>；左邊為 MPB（A 排放汙染的邊際私人利益），右邊為 MSD（A 排放一單位 <span class=\"fx\">X</span> 對 B 造成的邊際外部社會損害）(p.531)。</li></ul>\n<h5 class=\"sub4\">圖形概念（最適排放）</h5>\n<ul><li>座標軸：縱軸 <span class=\"fx\">P<sub>X</sub></span>、橫軸 <span class=\"fx\">X</span>（排放量）。</li><li>曲線：<span class=\"fx\">MSD(X)=∂ C<sub>B</sub>/∂ X</span>（正斜率）、<span class=\"fx\">MPB(X)=-∂ C<sub>A</sub>/∂ X</span>（負斜率）。</li><li>社會最適點 <span class=\"fx\">E<sup>*</sup></span>：兩線相交，對應 <span class=\"fx\">X<sup>*</sup></span>、<span class=\"fx\">P<sub>X</sub><sup>*</sup></span>。</li><li>個人最適點 E<span class=\"fx\">′</span>：MPB 與橫軸交點，對應 X<span class=\"fx\">′</span>（且 <span class=\"fx\">X'>X<sup>*</sup></span>）。</li><li>社會福利損失：<span class=\"fx\">E<sup>*</sup></span>、E<span class=\"fx\">′</span> 與兩曲線所圍成的三角形面積(p.531)。</li></ul>\n<h4 class=\"sub3\">三、直接管製</h4>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>皮古稅理論上完美，但實務操作上政府難以正確估計 <span class=\"fx\">X<sup>*</sup></span> 位置；汙染方會避重就輕，受害者會誇大損害；現實中受眾多受害者，責任歸屬困難。</li><li>政府若知道最適汙染量 <span class=\"fx\">\\overlineX</span>，最有效直接方法是透過立法直接規定 <span class=\"fx\">\\overlineX</span>，強制廠商只能生產該數量的汙染量。</li><li><strong>皮古稅 vs 直接管製比較</strong>（資訊不完全下）：</li><li>兩廠商邊際污染利益不同時，皮古稅可讓兩廠分別生產 <span class=\"fx\">X<sub>A</sub><sup>*</sup></span> 與 <span class=\"fx\">X<sub>B</sub><sup>*</sup></span>，總量 <span class=\"fx\">X<sub>A</sub><sup>*</sup>+X<sub>B</sub><sup>*</sup></span>。</li><li>直接管製若要求兩廠排放相同量 <span class=\"fx\">\\overlineX=(X<sub>A</sub><sup>*</sup>+X<sub>B</sub><sup>*</sup>)/2</span>，則對 A 排放太多、對 B 排放太少。</li><li>邊際調整：A 減少 <span class=\"fx\">(\\overlineX-X<sub>A</sub><sup>*</sup>)</span> 汙染，總利益減少 <span class=\"fx\">E<sub>A</sub><sup>*</sup>\\overlineXX<sub>A</sub><sup>*</sup></span> 面積；B 增加 <span class=\"fx\">(X<sub>B</sub><sup>*</sup>-\\overlineX)</span> 汙染，總利益增加 <span class=\"fx\">E<sub>B</sub><sup>*</sup>bX<sub>B</sub><sup>*</sup>\\overlineX</span> 面積；後者面積大於前者，故<strong>皮古稅比直接管製有效率</strong>。</li><li>原因：皮古稅課徵未完全破壞市場機能，廠商在給定單位污染稅下，透過極大化自身利潤選擇排放多少，有<strong>誘因機制設計</strong>；直接管製剝奪了廠商決定自身排放多少的選擇權，<strong>沒有誘因機制</strong>(p.534)。</li></ul>\n<h4 class=\"sub3\">四、可交易排放許可證</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>由政府機關決定每年汙染總量，分配到固定配額；廠商可在市場購買不足或販售多餘配額。最適汙染許可證價格出現在汙染需求與汙染許可證供給之交點。</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>邊際收益操作：均衡出現在廠商由汙染許可證所得到的邊際收益相等處，即 <span class=\"fx\">MPB<sub>A</sub>=MPB<sub>B</sub></span>(p.536)。</li><li>自身減量污染成本操作：廠商只有在自身汙染成本大於市場汙染許可證價格時，才會誘因購買許可證；若價格大於自身汙染成本，則會誘因販售許可證(p.536)。</li></ul>\n<h4 class=\"sub3\">五、寇斯定理（Coase Theorem）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>在 1930–1960 年代，寇斯（R. H. Coase）批評皮古稅不但沒有必要，甚至會造成經濟體系偏離最適境界。</li><li><strong><strong class=\"proper\">寇斯定理</strong></strong>：在假設交易成本與協商成本為零的情況下，只要財產權界定明確，則交易雙方透過交易或協商（bargaining）所達到的均衡，必定會滿足經濟效率(p.536)。</li></ul>\n<h5 class=\"sub4\">進一步討論</h5>\n<ol><li>寇斯定理僅要求財產權界定明確，並不會牽扯到對錯、正確與否、是否公平。</li><li>寇斯定理只提及協商後的均衡必定是經濟效率，但<strong>本身並未牽扯到不同財產權的界定是否會有相同均衡點</strong>——此即<strong>弱寇斯定理</strong>。</li><li>其他教科書可能出現「無論財產權界定為何，最後均衡都相同」的<strong>強寇斯定理</strong>，為史提格勒（G. Stigler）於 1960 年提出並發展(p.537)。</li></ol>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>座標軸：縱軸 <span class=\"fx\">P<sub>A</sub></span>、橫軸 <span class=\"fx\">Q<sub>A</sub></span>（鋼鐵廠產量）。</li><li>曲線：<span class=\"fx\">MPC<sub>A</sub>(Q<sub>A</sub>)=∂ C<sub>A</sub>/∂ Q<sub>A</sub></span>（正斜率）、<span class=\"fx\">MSC(Q<sub>A</sub>)=∂ C<sub>A</sub>/∂ Q<sub>A</sub>+∂ C<sub>B</sub>/∂ Q<sub>A</sub></span>（正斜率、在 MPC 上方）。</li><li>社會最適點 <span class=\"fx\">E<sup>*</sup></span>：MSC 與 <span class=\"fx\">P<sup>*</sup></span> 水平線相交，對應 <span class=\"fx\">Q<sup>*</sup></span>。</li><li>個人最適點 <span class=\"fx\">b</span>：MPC 與 <span class=\"fx\">P<sup>*</sup></span> 水平線相交，對應 <span class=\"fx\">Q<sub>1</sub></span>。</li></ul>\n<h5 class=\"sub4\">兩種財產權歸屬下的協商過程</h5>\n<ul><li><strong>魚池擁有河流的財產權</strong>：魚池會要求鋼鐵廠不要生產（<span class=\"fx\">Q<sub>A</sub>=0</span>）；若鋼鐵廠要生產，必須給魚池補貼，補貼額至少為損害 <span class=\"fx\">(MSC-MPC<sub>A</sub>)</span> 的垂直距離，且不超過鋼鐵廠利得 <span class=\"fx\">(P<sup>*</sup>-MPC<sub>A</sub>)</span> 的垂直距離。協商一直到 <span class=\"fx\">P<sup>*</sup>-MPC<sub>A</sub></span> 等於 <span class=\"fx\">MSC-MPC<sub>A</sub></span>，即 <span class=\"fx\">E<sup>*</sup></span> 點，滿足 <span class=\"fx\">P=MSC</span>，達經濟效率(p.537–p.538)。</li><li><strong>鋼鐵廠擁有河流的財產權</strong>：鋼鐵廠希望生產到 <span class=\"fx\">P<sub>A</sub>=MPC<sub>A</sub></span> 的 <span class=\"fx\">Q<sub>1</sub></span>；魚池要降低鋼鐵廠生產，必須給鋼鐵廠補貼，補貼額至少為鋼鐵廠因減產損失的利潤 <span class=\"fx\">(P-MPC<sub>A</sub>)</span>，最高不超過魚池受損 <span class=\"fx\">(MSC-MPC<sub>A</sub>)</span>。協商持續到 <span class=\"fx\">MSC-MPC<sub>A</sub></span> 等於 <span class=\"fx\">P-MPC<sub>A</sub></span>，即 <span class=\"fx\">E<sup>*</sup></span> 點，滿足 <span class=\"fx\">P=MSC</span>，達經濟效率(p.538)。</li><li><strong>強寇斯定理</strong>：只要財產權歸屬明確定義，透過協商皆可達到均衡且滿足經濟效率；無論歸屬給誰，結果皆相同(p.538)。</li><li>數理分析顯示：財產權歸屬會影響所得分配；在一般需求下，不同歸屬雖皆達效率，但均衡點可能不同，<strong>強寇斯定理不一定成立</strong>；若要求強寇斯定理仍成立，必須假設污染或造成污染的商品需求不具所得效果(p.539)。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.3</strong>： 題目：某完全競爭廠商邊際成本 <span class=\"fx\">0.1X</span>，每單位產出產生 1 單位汙染物 <span class=\"fx\">Y</span>，每單位汙染成本 <span class=\"fx\">0.4X</span>；需求 <span class=\"fx\">P=5-2X</span>。政府要課汙染稅外部成本內部化，每單位 <span class=\"fx\">X</span> 應課多少？此時產量為何？詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.4</strong>： 題目：流感疫苗有正外部性 $12/劑，政府補貼生產者 $15/劑，則均衡數量與社會最適數量關係為？選項含相等/均衡大於/小於/資訊不足。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.5</strong>： 題目：廠商 mc=2，邊際損害 md=5q；逆需求 p=20-q，完全競爭市場。廠商會生產幾單位？最適社會福利下政府應課皮古稅多少？詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.6</strong>： （中山企研）：題目：T 國為價格接受者，國際價格 $50/單位；私人總成本 $400+0.01Q^2；外部成本10/單位。下列哪個政策能矯正市場失靈並達社會最適？選項含 $5 從量稅/減產 500 單位/上限 1000 單位/至少出口 500 單位。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.7</strong>： （109 中央企研）：題目：A 生產 X 成本 <span class=\"fx\">C<sub>A</sub>=ax<sup>2</sup></span>；B 生產 Y，受 A 汙染影響 <span class=\"fx\">C<sub>B</sub>=by<sup>2</sup>+dxy</span>。(1) 不能協商下各自最適產量；<br>(2) 可協商下聯合極大利潤各自產量；<br>(3) 政府對 A 課稅 tx 矯正外部性，稅率 t 為何？詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.8</strong>： （政大商學院）：題目：George 養狗吠叫，鄰居 Mary 受害；養狗對 George 價值 $500，Mary 成本 $700。可能的私人解決是？選項含 Mary 付 George $450 解決狗/George 付 Mary $650 補償不便/Mary 付 George $650 解決狗/殺掉狗。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.9</strong>： （政大商學院）：題目：河川上游養豬場、下游遊樂園；養豬邊際成本 <span class=\"fx\">MC=2Q</span>、邊際效益 <span class=\"fx\">MB=60-Q</span>；遊樂園邊際處理成本 <span class=\"fx\">SMC=Q</span>。(1) 只顧自己利潤養幾頭？<br>(2) 同時考慮遊樂園應養幾頭？<br>(3) 河川水權判給養豬場，交易成本可忽略下養幾頭？<br>(4) 水權判給遊樂園下養幾頭？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：最適 <span class=\"fx\">MB=MC+SMC⇒ 60-Q=2Q+Q=3Q⇒ Q<sub>S</sub><sup>*</sup>=15</span>；兩種財產權歸屬下皆達同樣最適水準（寇斯定理），詳解見書末 QR。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.10</strong>： （政大商學院）：題目：鐵路燃煤火車行經農田造成火災，每次作物損失 $200；私人邊際成本 $100n$（<span class=\"fx\">n</span> 為次數）；每班次收入 $400。(1) 社會最適班次？<br>(2) 無補償且交易成本太高下公司開幾班？利潤？<br>(3) 無補償但無交易成本下公司開幾班？利潤？<br>(4) 法律規定公司要賠 $200/班，公司開幾班？利潤？詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>"}, {"id": "17.4", "title": "公共財（印刷頁 p.543–p.552）", "body": "\n<h4 class=\"sub3\">一、財貨分類</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li><strong>敵對性（Rival）</strong>：財貨讓某消費者消費後，就無法讓其他消費者所使用。</li><li><strong>非敵對性（Nonrival）</strong>：又稱共享性；財貨可以同時給眾人共同消費，多增加一人消費不會使其他人消費此財貨效用減少，也不會使該產品成本增加。</li><li><strong>排他性（Excludability）</strong>：生產者可在技術上讓某些人可以消費、某些人無法消費。</li><li><strong>無排他性（Nonexcludability）</strong>：生產者無法在技術上讓某些人消費、某些人無法消費；他人可不付代價坐享其成(p.543)。</li></ul>\n<h5 class=\"sub4\">財貨四分類表</h5>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th></th><th>敵對性（rival）</th><th>非敵對性（nonrival）</th></tr></thead><tbody><tr><td><strong>排他性（excludability）</strong></td><td>（純粹）私有財（Private goods）</td><td>準公共財（或俱樂部財）（Quasi-Public goods）</td></tr><tr><td><strong>無排他性（nonexcludability）</strong></td><td>共有財（或準私有財）（Common goods）</td><td>（純粹）公共財（Public goods）</td></tr></tbody></table></div>\n<p>(p.543)</p>\n<h5 class=\"sub4\">各類財貨說明</h5>\n<ol><li><strong>（純粹）私有財（Private good）</strong>：同時具有敵對性與排他性。例：衣物、私人汽車、自己買的化妝品。</li><li><strong>準公共財（Quasi-Public goods）</strong>：不具敵對性，但可透過某個機制排除他人使用。例：電影院、非尖峰時段的收費公路、健身俱樂部。</li><li><strong>共有財（或準私有財）（Common goods）</strong>：具有敵對性，但無法排除他人使用。例：任意捕撈的公海。</li><li><strong>（純粹）公共財（Public goods）</strong>：不具有敵對性與排他性。例：國防(p.543)。</li></ol>\n<h5 class=\"sub4\">以人數與利益共享程度再區分</h5>\n<ol><li>純私有財：無法與別人共享（具敵對），消費也是屬於自己。</li><li>純公共財：可共同消費人數最多，共享利益最大。</li><li>準公共財（俱樂部財）：在一定人數範圍內共享利益較大，但仍存在少許敵對性。</li><li><strong>擁擠性財貨</strong>：消費人數可增加，但到某程度後因資源受限無法再增加，此時共享利益會因人數提高而擁擠，使消費利益降低(p.544)。</li></ol>\n<h4 class=\"sub3\">二、公共財（Public good）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>其他情況不變，此財貨同時滿足無排他性以及非敵對性兩種特徵；又稱「純粹」公共財(p.544)。</li></ul>\n<h5 class=\"sub4\">財貨特性</h5>\n<ol><li>非排他性與非敵對性：無法透過某些機制阻止其他人消費（或阻止需付出高額代價）；只要公共財生產出來，每個人無論是否付出代價皆可消費同等數量；消費利益不會因消費者人數增加而減少。</li><li><strong>搭便車者（Free rider）與偏好隱藏問題</strong>：因公共財有非排他性，個別消費者除非「佛心來著」，否則在自利動機下多數人不會主動支付代價，只想坐享其成，產生「餓鬼裝矜持」——明明對公共財有需求卻隱藏需求，公共財提供後又因無排他性而進入消費；結果私人生產或提供公共財常發生數量不足。</li><li>通常必須由政府提供：</li></ol>\n<ul><li>因不具排他性，民眾會免費共享的僥倖心態，隱藏偏好，市場無法有效提供；</li><li>因公共財具不可分割性，無法對個別需求提供；</li><li>因不具敵對性，增加一人消費的邊際成本 <span class=\"fx\">MC=0</span>；在 <span class=\"fx\">P=MC=0</span> 下，沒有廠商願意提供，必須由政府提供(p.544)。</li></ul>\n<h4 class=\"sub3\">三、公共財的均衡數量決定模型（Bowen 部分均衡分析法）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>由鮑文（H. R. Bowen）所提出。</li><li><strong>操作原則</strong>：社會對公共財的需求線，為個人對公共財的需求線<strong>垂直加總</strong>（在給定數量下加總價格）。公共財的均衡出現在社會需求線與社會供給線（一般為公共財的邊際成本）之交點處(p.545)。</li><li>對照：私有財市場需求線為個人需求線<strong>水平加總</strong>（在給定價格下加總數量）(p.545 註 2)。</li></ul>\n<h5 class=\"sub4\">公式</h5>\n<ul><li><span class=\"fx\">\\displaystyle∑<sub>X<sub>i</sub>=1</sub><sup>N</sup>P<sub>Xi</sub><sup>d</sup>=MC<sub>X</sub></span>(p.546)</li><li>其中 <span class=\"fx\">P<sub>Xi</sub><sup>d</sup></span> 為市場上消費者對公共財的需求；<span class=\"fx\">MC<sub>X</sub></span> 為公共財的邊際成本；市場對公共財的需求為個人對公共財需求的垂直加總。</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>上圖：消費者 A 需求線 <span class=\"fx\">P<sub>A</sub>(X)</span>，在 <span class=\"fx\">X<sup>*</sup></span> 下對應 <span class=\"fx\">P<sub>X</sub><sup>A*</sup></span>。</li><li>中圖：消費者 B 需求線 <span class=\"fx\">P<sub>B</sub>(X)</span>，在 <span class=\"fx\">X<sup>*</sup></span> 下對應 <span class=\"fx\">P<sub>X</sub><sup>B*</sup></span>。</li><li>下圖：社會需求線為兩線垂直加總，<span class=\"fx\">P<sub>X</sub><sup>*</sup>=P<sub>X</sub><sup>A*</sup>+P<sub>X</sub><sup>B*</sup></span>；與水平線 <span class=\"fx\">MC</span> 相交決定 <span class=\"fx\">X<sup>*</sup></span>。</li><li>個別負擔：A 負擔 <span class=\"fx\">P<sub>X</sub><sup>A*</sup></span>、B 負擔 <span class=\"fx\">P<sub>X</sub><sup>B*</sup></span>(p.545)。</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>公共財因非排他性會出現三個問題：</li></ul>\n<ol><li>消費者會隱藏其需求；</li><li>會有許多搭便車者（free-rider）；</li><li>私人生產者生產公共財的意願偏低，只好靠政府接手生產(p.546)。</li></ol>\n<h4 class=\"sub3\">四、純粹公共財模型（薩謬爾遜條件）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>由薩謬爾遜（P. A. Samuelson）所提出。</li><li>柏拉圖邊界條件原本為 <span class=\"fx\">MRS<sub>XY</sub><sup>A</sup>=MRS<sub>XY</sub><sup>B</sup>=MRT<sub>XY</sub></span>；但當 <span class=\"fx\">X</span> 為公共財、<span class=\"fx\">Y</span> 為私有財時，該條件需要修正(p.547)。</li></ul>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>模型設定：</li><li><span class=\"fx\">A</span>、<span class=\"fx\">B</span> 效用函數分別 <span class=\"fx\">U<sub>A</sub>(X,Y<sub>A</sub>)</span>、<span class=\"fx\">U<sub>B</sub>(X,Y<sub>B</sub>)</span>；</li><li><span class=\"fx\">X</span> 為公共財、<span class=\"fx\">Y</span> 為私有財；總公共財數量為 <span class=\"fx\">X</span>、私有財 <span class=\"fx\">Y=Y<sub>A</sub>+Y<sub>B</sub></span>；</li><li>生產可能曲線 <span class=\"fx\">\\overlineF=F(X,Y)</span>。</li><li>最適化：<span class=\"fx\">\\max<sub>X,Y<sub>A</sub></sub>U<sub>A</sub>=U<sub>A</sub>(X,Y<sub>A</sub>)</span> s.t. <span class=\"fx\">\\overlineU<sub>B</sub>=U<sub>B</sub>(X,Y<sub>B</sub>)</span>、<span class=\"fx\">Y=Y<sub>A</sub>+Y<sub>B</sub></span>、<span class=\"fx\">\\overlineF=F(X,Y)</span>。</li><li>一階條件化簡得：</li><li><strong>薩謬爾遜條件（Samuelson condition）</strong>：</li><li><span class=\"fx\">MRS<sub>XY</sub><sup>A</sup>+MRS<sub>XY</sub><sup>B</sup>=MRT<sub>XY</sub></span>(p.548)</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>若 <span class=\"fx\">X</span> 為公共財，則柏拉圖最適或經濟效率條件為：<span class=\"fx\">A</span>、<span class=\"fx\">B</span> 兩位消費者的邊際替代率加總，與 <span class=\"fx\">XY</span> 兩商品的邊際轉換率相同。</li><li>直觀解釋：</li><li>因 <span class=\"fx\">X</span> 為公共財，<span class=\"fx\">A</span> 與 <span class=\"fx\">B</span> 消費數量相同，整個社會增加一單位公共財的邊際評價，就是 <span class=\"fx\">A</span>、<span class=\"fx\">B</span> 兩人邊際評價的加總（即 <span class=\"fx\">MRS<sub>XY</sub><sup>A</sup>+MRS<sub>XY</sub><sup>B</sup></span>）；</li><li><span class=\"fx\">MRT<sub>XY</sub></span> 代表增加一單位 <span class=\"fx\">X</span> 所必須放棄的 <span class=\"fx\">Y</span> 生產量，即以 <span class=\"fx\">Y</span> 財衡量的 <span class=\"fx\">X</span> 邊際成本。</li><li>若社會邊際評價大於邊際成本，應多生產 <span class=\"fx\">X</span>；小於則少生產；兩者相等時即達柏拉圖最適境界或經濟效率(p.548)。</li></ul>\n<h5 class=\"sub4\">以價格與成本表示</h5>\n<ul><li>因 <span class=\"fx\">MRS<sub>YX</sub><sup>1</sup>+MRS<sub>YX</sub><sup>2</sup>=P<sub>Y1</sub><sup>d</sup>+P<sub>Y2</sub><sup>d</sup>=MRT<sub>YX</sub>=MC<sub>Y</sub></span>（因 <span class=\"fx\">MC<sub>X</sub>=1</span>）(p.550)。</li><li>與完全競爭私有財比較：</li><li>不符合交換效率：交換效率條件 <span class=\"fx\">MRS<sub>1</sub>=MRS<sub>2</sub></span>；</li><li>不符合混合效率：混合效率條件 <span class=\"fx\">MRS<sub>1</sub>=MRS<sub>2</sub>=MRT</span>(p.550)。</li></ul>\n<h4 class=\"sub3\">五、公共財市場失靈的詳細討論</h4>\n<h5 class=\"sub4\">(1) 林達爾價格（Lindahl price）</h5>\n<ul><li>由拍賣者提出一個最適合價格，此組價格為個別消費者對此公共財的負擔比例；爾後以投票方式，投票表決是否同意該分攤比例；此負擔比例即為林達爾價格(p.550)。</li><li>數理：消費者 1 負擔比例 <span class=\"fx\">t</span>，面對問題 <span class=\"fx\">\\max<sub>X<sub>1</sub>,Y</sub>U<sub>1</sub>=U<sub>1</sub>(X<sub>1</sub>,Y)</span> s.t. <span class=\"fx\">M=X<sub>1</sub>+tP<sub>Y</sub>Y</span>；均衡條件 <span class=\"fx\">U<sub>Y</sub><sup>1</sup>/U<sub>X<sub>1</sub></sub><sup>1</sup>=P<sub>Y1</sub><sup>d</sup>=tP<sub>Y</sub></span>；消費者 2 負擔 <span class=\"fx\">1-t</span>，條件 <span class=\"fx\">U<sub>Y</sub><sup>2</sup>/U<sub>X<sub>2</sub></sub><sup>2</sup>=P<sub>Y2</sub><sup>d</sup>=(1-t)P<sub>Y</sub></span>。</li><li>加總：<span class=\"fx\">MRS<sub>YX</sub><sup>1</sup>+MRS<sub>YX</sub><sup>2</sup>=tP<sub>Y</sub>+(1-t)P<sub>Y</sub>=MRT<sub>YX</sub>=MC<sub>Y</sub></span>，此定價法滿足 Samuelson 條件(p.551)。</li><li>操作困境：</li><li>因要求每個消費者必須誠實透露自己對公共財的偏好，若有人為搭便車而隱瞞偏好，此機制就無法順利運作；</li><li>負擔比例由投票選出，必須保證投票過程中能找到共識；</li><li>最大問題：消費者有誘因隱藏對公共財的偏好(p.551)。</li></ul>\n<h5 class=\"sub4\">(2) 克拉克稅（Clarke tax）</h5>\n<ul><li>操作想法：將欺騙與隱藏的成本內部化；若某消費者因欺騙或隱瞞造成社會生產公共財的決策出現「轉折」（原本要生產變不生產，或原本不生產變要生產；此消費者稱為關鍵消費者），此轉折造成其他消費者蒙受損失，必須由這位關鍵消費者所承擔(p.551)。</li><li>因此，克拉克稅將消費者欺騙或隱瞞的成本內部化，使消費者在害怕被罰錢懲罰下有誘因透露真實需求。</li><li>必須注意：克拉克稅要能使用，必須假設消費者的偏好為準線性；且懲罰是以課稅處理，因此在政府介入課稅下，克拉克稅的操作就無法達到柏拉圖最適(p.552)。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.11</strong>： 題目：Bob、Chris、Dennis 三人同住，討論把冷氣溫度分別降低 1、2、3、4 度；每降 1 度電費增加 $15；邊際效益表（Bob/Chris/Dennis 各度）。從社會觀點應降幾度？詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.12</strong>： 題目：A、B 對公共財需求 <span class=\"fx\">X<sup>A</sup>=12-P</span>、<span class=\"fx\">X<sup>B</sup>=12-1/2P</span>；社會生產 <span class=\"fx\">X</span> 總成本 <span class=\"fx\">TC<sup>X</sup>=X<sup>2</sup>+6X</span>。求社會最適 <span class=\"fx\">X</span> 產量與價格。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.13</strong>： （108 中央企研）：題目：兩室友 X、Y 蚊子擾人，需購買防蚊噴霧（純公共財）；需求 <span class=\"fx\">Q<sub>A</sub>=100-P</span>、<span class=\"fx\">Q<sub>B</sub>=200-2P</span>；邊際成本 80。求均衡價格與數量。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.14</strong>： （109 台大商研）：題目：Albert、Bill、Chris 消費餅乾（純私有財）與音樂（純公共財）；效用 <span class=\"fx\">U<sub>A</sub>(C<sub>A</sub>,m)=C<sub>A</sub>· m</span>、<span class=\"fx\">U<sub>B</sub>=C<sub>B</sub>· m</span>、<span class=\"fx\">U<sub>C</sub>=C<sub>C</sub>· m</span>；餅乾 $1/個；音樂 $10/小時；三人財富 $30、$50、$20。最適音樂小時數？選項含 2、3、4、5、6。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>"}, {"id": "17.5", "title": "共有資源理論（印刷頁 p.553）", "body": "\n<h4 class=\"sub3\">一、意義</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>由於某些稀少性資源缺乏財產權，導致該資源可任意使用而不需支付代價；因此經濟個體（使用者）站在自利動機下，必定過分使用該資源，導致該資源的利得被消耗殆盡。</li><li>例如漁民大量撒網捕魚、牧羊人大肆放牧；這些資源則稱為<strong>共有資源（Common）</strong>或<strong>草原的悲劇（Tragedy of the common）</strong>(p.553)。</li></ul>\n<h4 class=\"sub3\">二、性質</h4>\n<h5 class=\"sub4\">重點與結論</h5>\n<ol><li><strong>不具有排他性</strong>：由於未界定財產權，因此無須付費即可使用。</li><li><strong>具有敵對性</strong>：由於資源有限，使用者越多，使用者所得到的效益越小。</li><li><strong>具有耗竭性</strong>：該資源會因為使用次數提高，而逐漸耗竭。</li><li><strong>具有外部不經濟</strong>：由於不須付費，因此通常會過度使用(p.553)。</li></ol>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.15</strong>： 題目：An overcrowded beach is an example of（？）選項含 positive externality、tragedy of the common、environmentally inefficient allocation、economically unsound allocation。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 17.16</strong>： 題目：捕鯨產業已使某些鯨魚物種瀕臨滅絕，但牛在世界各地牧場仍持續繁衍；兩者差異最主要原因？選項含鯨魚懷孕期長、更有價值會回應經濟誘因、捕鯨技術進步較快、捕鯨是國際產業但牛是本地養殖、<strong>鯨魚是共有資源而牛是私有財</strong>。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n</div>"}], "18": [{"id": "18.1", "title": "前言(p.557)", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc9\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">對稱訊息（symmetric information）</div><div class=\"mc-body\"><div class=\"mc-formula\">先前各章節皆假設買賣雙方對訊息皆「瞭若指掌」，或皆一無所知。</div><div class=\"mc-detail\">先前各章節皆假設買賣雙方對訊息皆「瞭若指掌」，或皆一無所知。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc10\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">資訊不對稱</div><div class=\"mc-body\"><div class=\"mc-formula\">日常交易中，買方與賣方掌握的訊息並不相同。</div><div class=\"mc-detail\">日常交易中，買方與賣方掌握的訊息並不相同。擁有較多訊息的一方會利用此優勢剝削擁有較少訊息的一方，而導致效率上的損失。</div></div></div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>對稱訊息的假設過度強烈；現實中買賣雙方存在資訊不對稱（如：炸雞腿便當的沙拉油是否新鮮、託居照顧寵物會否被善待）。</li></ul>\n</div>\n</div>"}, {"id": "18.2", "title": "資訊不對稱之種類與討論(p.558–563)", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc8\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">資訊不對稱</div><div class=\"mc-body\"><div class=\"mc-formula\">交易的雙方所知道的訊息不相同，一方知道較多資訊，另一方知道較少資訊。</div><div class=\"mc-detail\">交易的雙方所知道的訊息不相同，一方知道較多資訊，另一方知道較少資訊。</div></div></div>\n<h4 class=\"sub3\">兩大類型（考試必考：判斷屬於哪一類）</h4>\n<ul><li><strong class=\"term\">隱藏訊息（hidden information）</strong></li><li>意義：交易雙方之間，有一方完全清楚商品的性質，但另一方對該性質一無所知。該性質在交易進行的當下已經存在，只是交易的另一方無法察覺，或須付出代價才能取得。</li><li>時點：發生在<strong>交易發生之前</strong>，會造成 <strong class=\"term\">逆向選擇（Adverse selection）</strong>。</li><li><strong class=\"term\">隱藏行為（hidden action）</strong></li><li>意義：交易確定進行後，交易的一方會採取某些行為來影響雙方利益，但被影響的一方卻無法直接察覺該行為。</li><li>時點：發生在<strong>交易發生之後</strong>，會造成 <strong class=\"term\">道德危機（moral hazard）</strong>。</li></ul>\n<h4 class=\"sub3\">討論：隱藏訊息 vs 隱藏行為</h4>\n<ul><li>隱藏訊息牽涉的純粹是「資訊傳遞」問題：訊息在交易當下已存在，並非擁有者「理性決策」後產生（例：本來就有糖尿病，除非主動昭告天下，否則他人不會知道）。</li><li>隱藏行為牽涉的是「誘因（incentives）」問題：行為是交易發生後一方基於理性決策所採取，另一方因無法有效監督而受損。</li><li>兩者在同一次交易中可能同時存在，有時根本無法明確區分。</li></ul>\n<h4 class=\"sub3\">一、逆向選擇（adverse selection）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>當商品或勞務具有隱藏訊息時，擁有資訊較充足的交易方，會透過某些行為，使擁有資訊較不足的交易方蒙受損失。</li></ul>\n<h5 class=\"sub4\">案例</h5>\n<ol><li><strong class=\"term\">Akerlof 二手車市場（檸檬市場）</strong>：買方不知商品真正價值，只能依「平均價格」判斷平均質量並只願付平均價格。提供好車者吃虧、提供壞車者得益 → 好車逐步退出市場 → 平均質量下降 → 平均價格再降 → 真實價值高於平均價格的車也退出 → 最後只剩壞車；消費者對高價好車也抱懷疑而寧可選壞車。</li><li><strong class=\"term\">人力資源市場（僱用前）</strong>：勞工知道自己生產力（訊息充足），僱主不知道（訊息不足）；受僱前勞工隱藏生產力使僱主受騙。→ 逆向選擇常發生在交易發生前。</li><li><strong class=\"term\">保險市場（購買前）</strong>：保戶知道自身健康狀況（訊息充足），保險公司不知情（訊息不足）。</li></ol>\n<h5 class=\"sub4\">解決方法</h5>\n<ul><li><strong class=\"term\">訊息不足一方：篩選（Screening）</strong></li><li>公司要求求職者提出學歷或證照證明；保險公司要求保戶做身體健康檢查。</li><li><strong class=\"term\">訊息充足一方：示信（Signaling）</strong></li><li>賣者提出品質保證（須具備：①能與較低品質商品成功區隔出區隔效果 screening effect、②廠商不會為維持保證而招致損失）；</li><li>利用經年累月的商譽（good-will）保證服務；</li><li>利用政府團體的品質認證（例如 GMP）。</li><li>要求全體一致的措施（如汽機車強制險）。</li><li>法令的規範。</li></ul>\n<h5 class=\"sub4\">固定品質的二手車市場模型(p.560–561)</h5>\n<ul><li>假設：消費者人數眾多，對低品質車保留價格 <span class=\"fx\">P<sub>L</sub><sup>D</sup></span>（需求線水平 <span class=\"fx\">D<sub>L</sub></span>）、對高品質車保留價格 <span class=\"fx\">P<sub>H</sub><sup>D</sup></span>（需求線水平 <span class=\"fx\">D<sub>H</sub></span>）；供給者有限，高低品質供給量最多為 <span class=\"fx\">Q<sub>H</sub></span>、<span class=\"fx\">Q<sub>L</sub></span>；供給者保留價格 <span class=\"fx\">P<sub>L</sub>=P<sub>L</sub><sup>S</sup></span>、<span class=\"fx\">P<sub>H</sub>=P<sub>H</sub><sup>S</sup></span>。</li><li><strong>完全訊息下</strong>：低品質在 <span class=\"fx\">e<sub>1</sub></span>（價 <span class=\"fx\">P<sub>L</sub><sup>D</sup></span>、量 <span class=\"fx\">Q<sub>L</sub></span>），高品質在 <span class=\"fx\">E<sub>1</sub></span>（價 <span class=\"fx\">P<sub>H</sub><sup>D</sup></span>、量 <span class=\"fx\">Q<sub>H</sub></span>）；高低品質市場完全區隔，各自達成均衡 → <strong class=\"term\">分離均衡（Separating equilibrium）</strong>，市場有效率。</li><li><strong>雙方對稱無訊息、風險中立</strong>：消費者期望（最高願付）價格</li></ul>\n<p><span class=\"fx\">P<sub>E</sub><sup>D</sup> = \\dfracQ<sub>L</sub>Q<sub>L</sub>+Q<sub>H</sub>P<sub>L</sub><sup>D</sup> + \\dfracQ<sub>H</sub>Q<sub>L</sub>+Q<sub>H</sub>P<sub>H</sub><sup>D</sup> = s<sub>L</sub> P<sub>L</sub><sup>D</sup> + s<sub>H</sub> P<sub>H</sub><sup>D</sup></span>(p.560)，其中 <span class=\"fx\">s<sub>L</sub>=\\dfracQ<sub>L</sub>Q<sub>L</sub>+Q<sub>H</sub></span>、<span class=\"fx\">s<sub>H</sub>=\\dfracQ<sub>H</sub>Q<sub>L</sub>+Q<sub>H</sub></span> 為市占比例(p.561)。</p>\n<p>供給者期望（最低願收）價格：</p>\n<p><span class=\"fx\">P<sub>E</sub><sup>S</sup> = s<sub>L</sub> P<sub>L</sub><sup>S</sup> + s<sub>H</sub> P<sub>H</sub><sup>S</sup></span>(p.561)。</p>\n<p>因 <span class=\"fx\">P<sub>L</sub><sup>S</sup>\\lt P<sub>L</sub><sup>D</sup></span>、<span class=\"fx\">P<sub>H</sub><sup>S</sup>\\lt P<sub>H</sub><sup>D</sup></span>，故 <span class=\"fx\">P<sub>E</sub><sup>D</sup>>P<sub>E</sub><sup>S</sup></span>，所有車子都願出售；但市場只剩一個 <strong class=\"term\">混和均衡（Pooling equilibrium）</strong>。</p>\n<ul><li><strong>賣方較買方有資訊優勢</strong>：</li><li>若 <span class=\"fx\">P<sub>E1</sub><sup>D</sup> > P<sub>H</sub><sup>S</sup> > P<sub>L</sub><sup>S</sup></span>：高低品質車都以 <span class=\"fx\">P<sub>E1</sub><sup>D</sup></span> 出售，仍為混和均衡，但<strong>不會有市場失靈</strong>。</li><li>若 <span class=\"fx\">P<sub>E2</sub><sup>D</sup></span> 滿足 <span class=\"fx\">P<sub>H</sub><sup>S</sup> > P<sub>E2</sub><sup>D</sup> > P<sub>L</sub><sup>S</sup></span>：高品質供給者不願賣，只有低品質有交易 → <strong>高品質市場失靈</strong>。</li><li>高品質比例 <span class=\"fx\">s<sub>H</sub></span> 須多大才能讓所有車子皆出售？</li></ul>\n<p><span class=\"fx\">P<sub>E</sub><sup>D</sup> = P<sub>L</sub><sup>D</sup> + s<sub>H</sub>(P<sub>H</sub><sup>D</sup>-P<sub>L</sub><sup>D</sup>) > P<sub>H</sub><sup>S</sup> ⇒ s<sub>H</sub> > \\dfracP<sub>H</sub><sup>S</sup> - P<sub>L</sub><sup>D</sup>P<sub>H</sub><sup>D</sup> - P<sub>L</sub><sup>S</sup></span>(p.561)。</p>\n<h5 class=\"sub4\">圖形概念（逆向選擇／二手車）</h5>\n<ul><li>座標軸：左圖橫軸 <span class=\"fx\">L</span>（低品質數量）、縱軸 <span class=\"fx\">P</span>；右圖橫軸 <span class=\"fx\">H</span>（高品質數量）、縱軸 <span class=\"fx\">P</span>。</li><li>曲線：水平需求線 <span class=\"fx\">D<sub>L</sub></span>（高 <span class=\"fx\">P<sub>L</sub><sup>D</sup></span> 高度）、<span class=\"fx\">D<sub>H</sub></span>（高 <span class=\"fx\">P<sub>H</sub><sup>D</sup></span> 高度）；垂直供給線 <span class=\"fx\">S<sub>L</sub></span>（在 <span class=\"fx\">Q<sub>L</sub></span>）、<span class=\"fx\">S<sub>H</sub></span>（在 <span class=\"fx\">Q<sub>H</sub></span>）。</li><li>面積/點：完全訊息下均衡 <span class=\"fx\">e<sub>1</sub></span>（低）、<span class=\"fx\">E<sub>1</sub></span>（高）；對稱無訊息下期望價格 <span class=\"fx\">P<sub>E1</sub><sup>D</sup></span>、<span class=\"fx\">P<sub>E2</sub><sup>D</sup></span> 為水平虛線。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 18.1</strong>： 高級車二手車市場，買方評價優質 50 萬、劣等 5 萬；賣方評價優質 40 萬、劣等 5 萬；品質只有賣方知道。全體賣方中 <span class=\"fx\">Y</span> 比例為劣等，問 <span class=\"fx\">Y</span> 大於何臨界值後發生逆向選擇（選項落在 [10,25%)／[25%,50%)／[50%,75%)／[75%,90%)／以上皆非）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：買方期望價 <span class=\"fx\">=(1-Y)×50+Y×5</span>；高品質賣方願賣條件為期望價 <span class=\"fx\">≥ 40</span>，解出臨界比例（詳解見書末 QR）。 (p.562)</div></li><li><strong class=\"term\">例題 18.2(p.562，110 中山財管)</strong>：Joe 的可靠 Honda Civic 售價 $13,000；風險中立的 Lauren 願付 $14,000（可靠）、$10,000（不可靠），但市場僅 20% 可靠。問哪一叙述 NOT true（含長期價格上升／品質下降／costly-to-fake 為 warranty 等）。</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 18.3</strong>： (1) 解決反向選擇何者最無效（提高保單保費 vs 學歷／體檢／連帶保證人）；<br>(2) Carlos 不懂營建請 Joe 整修，兩年後因 Joe 使用劣質材而牆崩，屬 moral hazard / optimal contract / monitoring / adverse selection。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.563)</div></li></ul>\n<h4 class=\"sub3\">二、道德危機（moral hazard）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>交易確定進行後，一方採取某些行為影響雙方利益，被影響一方無法直接察覺。保險文獻亦稱「道德風險」。</li></ul>\n<h5 class=\"sub4\">案例</h5>\n<ol><li><strong class=\"term\">人力資源市場（僱用後）</strong>：僱主希望勞工努力，但無法時時盯著，勞工隱藏偷懶行為使僱主受害 → 道德危機，常發生在交易發生後。</li><li><strong class=\"term\">保險市場（購買後）</strong>：保戶把風險完全轉嫁給保險公司而缺乏謹慎誘因，保險公司無法時刻觀察，保戶隱藏私下行為使保險公司受害。</li><li><strong class=\"term\">代理人問題（Principal-Agent）</strong>：雇主（Principal）透過董事會選出執行長／代理人（agent），以契約（contract）經營公司；雇主無法有效監督時，代理人可能採利己行為使雇主受損。</li></ol>\n<h5 class=\"sub4\">解決方法</h5>\n<ul><li><strong class=\"term\">共保條款（Co-insurance）</strong>：損害發生時保險公司僅在投保額度內賠償部分損害，其餘由保戶自擔，以維持謹慎誘因。</li><li><strong class=\"term\">自行負擔額度（deductible）</strong>：事先約定一定損害金額內由保戶自擔，超過後保險公司賠至投保金額為止。</li><li><strong>雇主與代理人之間</strong>：雇主設定最低利潤下界，保證至少有一定利潤。</li></ul>\n<h5 class=\"sub4\">考試重點</h5>\n<ul><li>一定要會「判斷」隱藏訊息（→逆向選擇，交易前）vs 隱藏行為（→道德危機，交易後）。</li><li>篩選（Screening，訊息不足方主動）vs 示信（Signaling，訊息充足方主動）的方向要分辨清楚。</li><li>分離均衡 vs 混和均衡；資訊不對稱下高品質被趕出市場的「檸檬市場」機制。</li></ul>\n</div>"}], "19": [{"id": "19.1", "title": "前言(p.567–568)", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc4\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">國際貿易（International trade）</div><div class=\"mc-body\"><div class=\"mc-formula\">各國以其不同商品互相買賣的情況。</div><div class=\"mc-detail\">各國以其不同商品互相買賣的情況。研究國與國之間相互交易現象的學科即國際貿易理論（為國際經濟學中偏向個體分析的一支）。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc5\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">貿易利得（Gains from trade）</div><div class=\"mc-body\"><div class=\"mc-formula\">貿易後得到的額外好處。</div><div class=\"mc-detail\">貿易後得到的額外好處。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc6\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">貿易型態（patterns of trade）</div><div class=\"mc-body\"><div class=\"mc-formula\">何種國家出口何種商品。</div><div class=\"mc-detail\">何種國家出口何種商品。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc7\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">貿易條件（terms of trade）</div><div class=\"mc-body\"><div class=\"mc-formula\">一國出口商品價格與進口商品價格的比值（=出口一單位商品在國際市場換回的進口商品數量）。</div><div class=\"mc-detail\">一國出口商品價格與進口商品價格的比值（=出口一單位商品在國際市場換回的進口商品數量）。比值上升稱貿易條件改善，下降稱惡化。</div></div></div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>國際貿易理論三大議題：①國與國為何貿易（貿易利得根源與分配）；②貿易型態的決定；③貿易條件。</li><li>解釋貿易利得的理論演進：傳統=<strong>比較利益（comparative advantage）</strong>；1980 後新貿易理論（new trade theory）=<strong>規模經濟</strong>；2000 後新新貿易理論（new new trade theory）=廠商<strong>異質性（heterogeneity）</strong>下資源重分配（高生產力廠商出口、低生產力廠商被淘汰）。彼此互補而非替代。</li><li>傳統理論為<strong>產業間貿易（inter-industry trade）</strong>；新／新新貿易理論為<strong>產業內貿易（intra-industry trade）</strong>。本章只介紹李嘉圖與新古典模型。</li></ul>\n</div>\n</div>"}, {"id": "19.2", "title": "古典貿易理論(p.569–582)", "body": "\n<h4 class=\"sub3\">一、早期貿易理論(p.569)</h4>\n<ul><li><strong>重商主義（Mercantilism）</strong>：16–18 世紀中期歐洲盛行，認為財富（金銀）累積是強盛象徵，全世界金銀固定，故一國致富須建立在他國財富減少上；主張藉<strong>貿易順差</strong>累積金銀，政府應<strong>補貼出口、管制進口</strong>。</li><li><strong>休姆（Hume）價格-貨幣機制（Price-Specie-Flow Mechanism）</strong>：貿易順差 → 國內貨幣供給增加 → 工資物價上漲 → 出口競爭力下跌；逆差則相反。故一國無法長期維持順差／累積財富。</li></ul>\n<h4 class=\"sub3\">二、絕對利益原理（The Principle of Absolute Advantage，亞當·斯密，p.570–572）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>在投入相同生產要素下，若該國能生產比他國更多同產品（平均生產力 average productivity 較高），或生產同量商品所投入要素比他國少（要素投入係數 input-output coefficient 較低），則該國在該產品具<strong>絕對利益</strong>。</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>亞當·斯密主張<strong>自由放任（Laissez faire）</strong>、移除貿易障礙；分工使各國專業化生產具絕對利益商品再交換，貿易由「零和賽局（Zero-sum game）」變成<strong>正和遊戲（Positive-sum game）</strong>。</li><li><strong>貿易型態</strong>：A 在 X、B 在 Y 各具絕對利益 → A 專業化生產並出口 X，B 專業化生產並出口 Y。</li></ul>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>假設工資率 <span class=\"fx\">W</span>、勞動投入係數 <span class=\"fx\">α<sub>LX</sub></span>、<span class=\"fx\">α<sub>LY</sub></span> 為常數；由勞動價值說與完全競爭：</li></ul>\n<p><span class=\"fx\">P<sub>X</sub> = W·α<sub>LX</sub>, P<sub>Y</sub> = W·α<sub>LY</sub></span>(p.571)</p>\n<ul><li><strong>貿易條件</strong> <span class=\"fx\">TOT<sub>XY</sub> = \\dfracP<sub>X</sub>P<sub>Y</sub> = \\dfracα<sub>LX</sub>α<sub>LY</sub></span>(p.571，等於 X 與 Y 的勞動係數比)。</li><li><strong>均衡貿易條件（Equilibrium terms of trade）</strong>：使兩國願意出口量＝願意進口量的出口價格與進口價格比；古典理論只討論供給面，故僅能得知 TOT 區間落在<strong>兩國貿易前國內均衡價格比之間</strong>(p.572)。</li><li><strong>缺點</strong>：必須具備絕對利益才能貿易，與事實不符（例 1970 年台灣製造技術不如歐美但出口大增）。故<strong>絕對利益既非必要亦非充分條件</strong>；貿易的必要條件是兩國「相對成本」存在差異，充分條件是國際相對價格落在兩國相對成本之間(p.572)。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 19.1</strong>： A、B 生產一單位所需勞動力：A(X=12,Y=4)、B(X=4,Y=6)。以絕對利益角度問誰出口什麼。要點：比較每單位勞動投入（投入少者具絕對利益）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.570)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 19.2</strong>： A(X=3,Y=5)、B(X=2,Y=12)。(1) 絕對利益下誰出口什麼；<br>(2) 均衡貿易條件區間。要點：TOT 須介於兩國自給自足相對價格比之間。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.572)</div></li></ul>\n<h4 class=\"sub3\">三、比較利益原理（The Principle of Comparative Advantage，李嘉圖 David Ricardo，p.573–582）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>就算一國在所有產品技術上都比他國差，只要劣勢程度有差異，仍可出口劣勢較低、進口劣勢較高的產品而獲利。</li><li>比較利益：一國生產某產品的<strong>機會成本</strong>相對於他國較低。以要素投入係數比表示：</li></ul>\n<p>若 <span class=\"fx\">\\dfracα<sub>LX</sub><sup>A</sup>α<sub>LY</sub><sup>A</sup> < \\dfracα<sub>LX</sub><sup>B</sup>α<sub>LY</sub><sup>B</sup></span>，則 <strong>A 國在生產 X 上具有比較利益</strong>(p.574)。</p>\n<h5 class=\"sub4\">假設（李嘉圖模型）</h5>\n<ol><li>兩國、兩財（X,Y）、勞動（Labor）唯一要素；</li><li>生產一單位 X、Y 的勞動投入為 <span class=\"fx\">α<sub>LX</sub></span>、<span class=\"fx\">α<sub>LY</sub></span>（即 input-output coefficient，其倒數為勞動平均生產力），皆常數；</li><li>要素供給總量 <span class=\"fx\">L</span> 固定、國內可自由移動、國際間不可移動、充分就業；</li><li>勞動價值說為基礎，商品價值以勞動投入多寡衡量；</li><li>商品與要素市場皆完全競爭；</li><li>消費者偏好以邊際替代率嚴格遞減的社會無異曲線代表。</li></ol>\n<ul><li>隱含<strong>固定規模報酬</strong>（要素變動幾倍、產量跟著變動幾倍）。</li></ul>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>充分就業（勞動結清）條件，即生產可能線（PPC，為直線）：</li></ul>\n<p><span class=\"fx\">L = α<sub>LX</sub> X + α<sub>LY</sub> Y</span>(p.575)</p>\n<p>Y 軸截距 <span class=\"fx\">\\dfracLα<sub>LY</sub></span>，X 軸截距 <span class=\"fx\">\\dfracLα<sub>LX</sub></span>，斜率 <span class=\"fx\">-\\dfracα<sub>LX</sub>α<sub>LY</sub></span>。</p>\n<ul><li>全微分斜率：<span class=\"fx\">\\dfracdYdX = -\\dfracα<sub>LX</sub>α<sub>LY</sub><0</span>；增加一單位 X 的代價為 <span class=\"fx\">\\dfracα<sub>LX</sub>α<sub>LY</sub></span> 單位 Y(p.576)。</li><li><strong>邊際轉換率 MRT</strong>：</li></ul>\n<p><span class=\"fx\">MRT<sub>XY</sub> = -\\dfracdYdX = \\dfracα<sub>LX</sub>α<sub>LY</sub> = \\dfracP<sub>X</sub>P<sub>Y</sub> = \\dfracMC<sub>X</sub>MC<sub>Y</sub></span>(p.576；貿易前相對價格、邊際成本比)。</p>\n<ul><li>自給自足均衡（無異曲線切 PPC）條件：</li></ul>\n<p><span class=\"fx\">MRS<sub>XY</sub> = \\dfrac∂ U/∂ X∂ U/∂ Y = \\dfracMC<sub>X</sub>MC<sub>Y</sub> = MRT<sub>XY</sub> = \\dfracP<sub>X</sub>P<sub>Y</sub></span>(p.577)。</p>\n<ul><li><strong>等 GDP 線（iso-GDP line）</strong>：<span class=\"fx\">GDP = P<sub>X</sub> X + P<sub>Y</sub> Y</span>，斜率 <span class=\"fx\">-\\dfracP<sub>X</sub>P<sub>Y</sub></span>(p.578)。</li><li>當 <span class=\"fx\">\\dfracP<sub>X</sub>P<sub>Y</sub>>\\dfracα<sub>LX</sub>α<sub>LY</sub></span>：全數生產 X；</li><li>當 <span class=\"fx\">\\dfracP<sub>X</sub>P<sub>Y</sub><\\dfracα<sub>LX</sub>α<sub>LY</sub></span>：全數生產 Y；</li><li>當 <span class=\"fx\">\\dfracP<sub>X</sub>P<sub>Y</sub>=\\dfracα<sub>LX</sub>α<sub>LY</sub></span>：整條 PPC 皆均衡(p.579)。</li><li>兩國專業化條件（本國出口 X、外國出口 Y）：</li></ul>\n<p><span class=\"fx\">(\\dfracP<sub>X</sub><sup>*</sup>P<sub>Y</sub><sup>*</sup>=\\dfracα<sub>LX</sub><sup>*</sup>α<sub>LY</sub><sup>*</sup>) > (\\dfracP<sub>X</sub><sup>T</sup>P<sub>Y</sub><sup>T</sup>) > (\\dfracP<sub>X</sub>P<sub>Y</sub>=\\dfracα<sub>LX</sub>α<sub>LY</sub>)</span>(p.580)。</p>\n<h5 class=\"sub4\">圖形概念（李嘉圖 PPC 與貿易三角）</h5>\n<ul><li>自給自足：直線 PPC 與社會無異曲線切於 E，對應 <span class=\"fx\">(X<sup>*</sup>,Y<sup>*</sup>)</span>。</li><li>貿易後：世界價格線 <span class=\"fx\">-P<sub>X</sub><sup>T</sup>/P<sub>Y</sub><sup>T</sup></span> 較陡，本國專業化至 X 軸端點 A；新等值 GDP 線過 A，與較高無異曲線切於 E。<strong>貿易三角形</strong>：本國 <span class=\"fx\">AX<sub>E</sub>E</span>、外國 <span class=\"fx\">A<sup>*</sup>Y<sub>E</sub><sup>*</sup>E<sup>*</sup></span>；本國出口 <span class=\"fx\">AX<sub>E</sub></span>、進口 <span class=\"fx\">X<sub>E</sub>E</span>；兩國貿易三角形全等(p.581)。</li><li>兩限制：①一期靜態模型無法借貸 → <strong>貿易平衡（Trade balanced）</strong>，進出口總值相等；②兩國模型，一國出口量＝他國進口量。</li></ul>\n<h5 class=\"sub4\">等成本差異（Equal cost-difference）</h5>\n<ul><li>一國在兩商品都有絕對利益，但若貿易前兩國國內相對價格比相同 → 無比較利益 → 不會貿易(p.574)。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 19.3</strong>： (1) 泰國一天 10 公斤米或 5 公尺布；台灣一天 20 公斤米或 15 公尺布。問各國比較利益、絕對利益。<br>(2) 美國（電腦 1h、手機 0.5h）；台灣（電腦 0.4h、手機 2h），各在哪項具比較利益。要點：算機會成本（生產一單位某財所放棄另一財數量）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.574)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 19.4</strong>： A(X=2,Y=3)、B(X=5,Y=6)。(1) 比較利益下誰出口何項；<br>(2) 均衡 TOT 區間。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.574)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 19.5</strong>： A(X=10,Y=14)、B(X=20,Y=28)（每單位勞動產量）。比較利益下誰出口何項。要點：兩國相對生產力比相同（10/14=20/28）→ 等成本差異、無比較利益、不貿易。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.575)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 19.6(p.581，110 中山企研)</strong>： A 一週可產 20 timber 或 8 cars；C 可產 15 timber 或 4 cars。求 A 國可行 terms of trade（選 4/3/0.4/0.33）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 19.7</strong>： 魯賓遜（每時 5 魚或 2 椰子）、星期五（每時 2 魚或 5 椰子），每天各 12 小時，效用 <span class=\"fx\">U=X<sup>1/3</sup>Y<sup>2/3</sup></span>。(1) 各自給自足均衡；<br>(2) 合作誰捕魚／誰摘椰子；<br>(3) 專業化後交換條件與數量使效用極大。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.582)</div></li></ul>\n</div>"}, {"id": "19.3", "title": "新古典貿易理論(p.583–592)", "body": "\n<h4 class=\"sub3\">一、李嘉圖模型的缺陷(p.583)</h4>\n<ol><li>只用勞動一種要素、投入產出係數為常數，忽略貿易的<strong>所得重分配</strong>問題；</li><li>常數係數使 PPC 為一直線，導致一國「極端」只生產單一商品，不符實證；</li><li>比較利益完全源自技術差異、與資源多寡（稟賦）無關，無法解釋實際貿易型態。</li></ol>\n<h4 class=\"sub3\">二、凹向原點的 PPC 導出（機會成本遞增，p.583–584）</h4>\n<ul><li>範例：三名工人每天工作 8 小時。老林（20X 或 10Y）、老陳（30X 或 20Y）、老黃（36X 或 12Y）。</li><li>各人機會成本：</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"></colgroup><thead><tr><th>工人</th><th>生產 X</th><th>X 的機會成本</th><th>生產 Y</th><th>Y 的機會成本</th></tr></thead><tbody><tr><td>老林</td><td>20X</td><td><span class=\"fx\">\\frac12 Y</span></td><td>10Y</td><td><span class=\"fx\">2X</span></td></tr><tr><td>老陳</td><td>30X</td><td><span class=\"fx\">\\frac23 Y</span></td><td>20Y</td><td><span class=\"fx\">\\frac32 X</span></td></tr><tr><td>老黃</td><td>36X</td><td><span class=\"fx\">\\frac13 Y</span></td><td>12Y</td><td><span class=\"fx\">3X</span></td></tr></tbody></table></div>\n<ul><li><strong>生產順序（比較機會成本優先）</strong>：X 由老黃→老林→老陳；Y 由老陳→老林→老黃。</li><li>最大產量：<span class=\"fx\">X<sub>Max</sub>=20·8+30·8+36·8=688</span>；<span class=\"fx\">Y<sub>Max</sub>=10·8+20·8+12·8=336</span>。</li><li>折點座標：<span class=\"fx\">a(0,336)→ b(288,240)→ c(448,160)→ d(688,0)</span>，連接成<strong>凹向原點</strong>的 PPC。</li><li>結論：機會成本遞增 → 一國不會像李嘉圖模型般極端只生產一項，而會<strong>部分專業化</strong>。</li></ul>\n<h4 class=\"sub3\">三、新古典一般均衡(p.585–589)</h4>\n<h5 class=\"sub4\">貿易前：自給自足（Autarky）</h5>\n<ul><li>模型：<span class=\"fx\">Max_\\X,Y\\ U=U(X,Y) s.t. \\bar F=f(X,Y)</span>。</li><li>一階條件（Lagrange）：<span class=\"fx\">\\dfrac∂ U∂ X=λ\\dfrac∂ f∂ X</span>、<span class=\"fx\">\\dfrac∂ U∂ Y=λ\\dfrac∂ f∂ Y</span>。</li><li>均衡：<span class=\"fx\">MRS<sub>XY</sub>=\\dfrac∂ U/∂ X∂ U/∂ Y=\\dfracMC<sub>X</sub>MC<sub>Y</sub>=MRT<sub>XY</sub></span>，即無異曲線切 PPC(p.585)。</li></ul>\n<h5 class=\"sub4\">貿易後</h5>\n<ul><li><strong>先決定生產量（收入極大）</strong>：<span class=\"fx\">Max_\\X,Y\\ GDP=P<sub>X</sub> X+P<sub>Y</sub> Y s.t. \\bar F=f(X,Y)</span>，一階條件</li></ul>\n<p><span class=\"fx\">\\dfracP<sub>X</sub>P<sub>Y</sub>=\\dfracf<sub>X</sub>f<sub>Y</sub>=\\dfracMC<sub>X</sub>MC<sub>Y</sub>=MRT<sub>XY</sub></span>，即等值 GDP 線切 PPC(p.586)。</p>\n<p>最適條件亦可寫 <span class=\"fx\">TOT<sup>*</sup>=\\dfracP<sub>X</sub>P<sub>Y</sub>=\\dfracMC<sub>X</sub>MC<sub>Y</sub></span>(p.587)。</p>\n<ul><li><strong>再決定消費量（效用極大）</strong>：<span class=\"fx\">Max U=U(X,Y) s.t. GDP=P<sub>X</sub> X+P<sub>Y</sub> Y</span>，一階條件</li></ul>\n<p><span class=\"fx\">\\dfracMU<sub>X</sub>MU<sub>Y</sub>=MRS<sub>XY</sub>=\\dfracP<sub>X</sub>P<sub>Y</sub></span>，即無異曲線切等值 GDP 線(p.587–588)。</p>\n<p>最適條件 <span class=\"fx\">TOT<sup>*</sup>=\\dfracP<sub>X</sub>P<sub>Y</sub>=\\dfracMU<sub>X</sub>MU<sub>Y</sub></span>(p.588)。</p>\n<h5 class=\"sub4\">幾何分析(p.588–589)</h5>\n<ul><li>座標軸：橫 X、縱 Y；凹向原點 PPC。</li><li>貿易前：無異曲線 <span class=\"fx\">U<sub>0</sub></span> 切 PPC 於 A（生產=消費），福利 <span class=\"fx\">U<sub>0</sub></span>，國內 TOT＝A 點切線斜率絕對值。</li><li>貿易後：世界 TOT 線（斜率 <span class=\"fx\">-P<sub>X</sub>/P<sub>Y</sub>=-TOT<sub>XY</sub></span>）切 PPC 於 B（生產點，量 <span class=\"fx\">X<sub>P</sub>,Y<sub>P</sub></span>）；較高無異曲線 <span class=\"fx\">U<sub>1</sub></span> 切該預算線於 C（消費點，量 <span class=\"fx\">X<sub>C</sub>,Y<sub>C</sub></span>）。國內過剩的 <span class=\"fx\">\\overlineX<sub>P</sub> X<sub>C</sub></span> 出口、不足的 <span class=\"fx\">\\overlineY<sub>P</sub> Y<sub>C</sub></span> 進口。</li></ul>\n<h4 class=\"sub3\">四、貿易利得的拆解(p.590)</h4>\n<ul><li><strong>交易利得（Gains from exchange）</strong>：維持原生產點 E，僅因相對價格改變而按新價格交易，效用由 <span class=\"fx\">U<sub>0</sub>→ U<sub>0</sub>'</span>（消費者以便宜財取代昂貴財）。</li><li><strong>專業化生產利得（Gains from specialization）／資源重分配利得（Gains from resource reallocation）</strong>：在固定 TOT 下生產者改變生產點至比較利益部門，效用由 <span class=\"fx\">U<sub>0</sub>'→ U<sub>1</sub></span>。</li></ul>\n<h4 class=\"sub3\">五、貿易發生的兩種根源(p.591–592)</h4>\n<ul><li><strong>(一) 生產條件差異、需求條件相同</strong>：兩國 PPC 不同（<span class=\"fx\">PPC<sub>A</sub></span>、<span class=\"fx\">PPC<sub>B</sub></span>）、社會無異曲線相同。貿易前均衡 <span class=\"fx\">E<sub>0</sub><sup>A</sup>,E<sub>0</sub><sup>B</sup></span>；貿易後生產點 <span class=\"fx\">E<sub>P</sub><sup>A</sup>,E<sub>P</sub><sup>B</sup></span> 不同、消費點 <span class=\"fx\">E<sub>C</sub><sup>A</sup>=E<sub>C</sub><sup>B</sup></span> 相同 → 因生產點不同而貿易。</li><li><strong>(二) 需求條件差異</strong>：兩國 PPC 相同（<span class=\"fx\">PPC<sub>B</sub>=PPC<sub>A</sub></span>）、但無異曲線 <span class=\"fx\">U<sup>A</sup>,U<sup>B</sup></span> 不同。貿易前 <span class=\"fx\">E<sub>0</sub><sup>A</sup>,E<sub>0</sub><sup>B</sup></span>；貿易後生產點相同 <span class=\"fx\">E<sub>P</sub><sup>A</sup>=E<sub>P</sub><sup>B</sup></span>、消費點 <span class=\"fx\">E<sub>C</sub><sup>A</sup>,E<sub>C</sub><sup>B</sup></span> 不同 → 因消費點不同而貿易。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 19.8</strong>： Kristen（15 wristbands 或 3 potholders／時）、Anna（12 或 2／時）。(1) 各生產一 potholder 的機會成本，誰具比較利益；<br>(2) 各工作 20 小時下 joint PPC；<br>(3) wristbands 價 1、potholders 價 5.5 時如何生產。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.589)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 19.9</strong>： 本國（小型經濟體）<span class=\"fx\">Q<sub>X</sub><sup>2</sup>+Q<sub>Y</sub><sup>2</sup>=200</span>，效用 <span class=\"fx\">U=C<sub>X</sub> C<sub>Y</sub></span>。(1) 無貿易下生產消費量與相對價格 <span class=\"fx\">P<sub>X</sub>/P<sub>Y</sub></span>；<br>(2) 國際相對價格 <span class=\"fx\">=2</span>，自由貿易下出口／進口何財及數量；<br>(3) 貿易後效用及與貿易前比較。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.589)</div></li></ul>\n</div>"}], "20": [{"id": "20.1", "title": "前言(p.595)", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc1\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">貿易政策（Trade Policy）</div><div class=\"mc-body\"><div class=\"mc-formula\">各國基於不同目的直接或間接干預貿易進行的政策。</div><div class=\"mc-detail\">各國基於不同目的直接或間接干預貿易進行的政策。分兩大類：<strong class=\"term\">關稅（Tariff）</strong>與<strong class=\"term\">非關稅（Non-Tariff）</strong>政策。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc2\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">封閉經濟（Closed Economy）／開放經濟（Open Economy）</div><div class=\"mc-body\"><div class=\"mc-formula\">能否完全自給自足（autarky）而不需與外國貿易。</div><div class=\"mc-detail\">能否完全自給自足（autarky）而不需與外國貿易。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc3\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">大國（Large country）／小國（Small country）</div><div class=\"mc-body\"><div class=\"mc-formula\">以「對國際價格是否有影響力」區分，而非國土或人口。</div><div class=\"mc-detail\">以「對國際價格是否有影響力」區分，而非國土或人口。國際價格接受者為小國；能影響國際價格者為大國。</div></div></div>\n</div>"}, {"id": "20.2", "title": "進口需求與出口供給(p.596–597)", "body": "\n<h4 class=\"sub3\">定義與公式</h4>\n<ul><li><strong>進口需求線（超額需求線 <span class=\"fx\">ED<sub>X</sub></span>）</strong>：本國在價格低於自給自足價 <span class=\"fx\">P<sub>X0</sub></span> 時，國內需求減國內供給的超額需求：</li></ul>\n<p><span class=\"fx\">ED<sub>X</sub> = IM<sub>X</sub>(P<sub>X</sub>) = D<sub>X</sub>(P<sub>X</sub>) - S<sub>X</sub>(P<sub>X</sub>), P<sub>X</sub>≤ P<sub>X0</sub></span>(p.596)。</p>\n<ul><li><strong>出口供給線（超額供給線 <span class=\"fx\">ES<sub>X</sub></span>）</strong>：外國在價格高於其自給自足價 <span class=\"fx\">P<sub>X</sub><sup>0*</sup></span> 時，國內供給減國內需求的超額供給：</li></ul>\n<p><span class=\"fx\">ES<sub>X</sub><sup>*</sup> = EX<sub>X</sub>(P<sub>X</sub>) = S<sub>X</sub><sup>*</sup>(P<sub>X</sub>) - D<sub>X</sub><sup>*</sup>(P<sub>X</sub>), P<sub>X</sub>≥ P<sub>X</sub><sup>0*</sup></span>(p.597)。</p>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><text x=\"115\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6c7684\">本國 X 市場</text><line x1=\"60\" y1=\"230\" x2=\"200\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"40\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"70\" y1=\"60\" x2=\"190\" y2=\"210\" stroke=\"#1f3a5f\" stroke-width=\"2\"></line><text x=\"170\" y=\"70\" font-size=\"10\" fill=\"#1f3a5f\">D_X</text><line x1=\"70\" y1=\"210\" x2=\"190\" y2=\"60\" stroke=\"#b5542e\" stroke-width=\"2\"></line><text x=\"150\" y=\"205\" font-size=\"10\" fill=\"#b5542e\">S_X</text><circle cx=\"130\" cy=\"135\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"95\" y=\"128\" font-size=\"9\" fill=\"#1e7d32\">(X0,PX0)</text><text x=\"320\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6c7684\">左：超額需求 ED_X</text><line x1=\"250\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"250\" y1=\"230\" x2=\"250\" y2=\"40\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"260\" y1=\"60\" x2=\"400\" y2=\"200\" stroke=\"#6b4e8e\" stroke-width=\"2.2\"></line><text x=\"404\" y=\"200\" font-size=\"10\" fill=\"#6b4e8e\">ED_X</text><line x1=\"250\" y1=\"135\" x2=\"410\" y2=\"135\" stroke=\"#1e7d32\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\"></line><text x=\"360\" y=\"128\" font-size=\"9\" fill=\"#1e7d32\">PX1</text></svg><p class=\"figcap\">國際價 PX1<px0 時，本國需求減供給＝進口量，繪成向下傾斜的超額需求 ed_x。(p.560)< p>\n</div>\n</div>"}, {"id": "20.3", "title": "部分均衡的自由貿易模型(p.598–600)", "body": "\n<h4 class=\"sub3\">一、小國進口國(p.598–599)</h4>\n<ul><li>小國為價格接受者，面對水平的世界供給線 <span class=\"fx\">ES<sub>X</sub></span>，國際價 <span class=\"fx\">P<sub>X</sub><sup>*</sup>\\lt P<sub>X0</sub></span>。進口量 <span class=\"fx\">IM<sub>X</sub> = X<sub>D</sub> - X<sub>S</sub></span>（國內需求 <span class=\"fx\">X<sub>D</sub></span>－國內供給 <span class=\"fx\">X<sub>S</sub></span>）。</li><li><strong>福利（BT＝貿易前；AT＝自由貿易後）</strong>：</li></ul>\n<p><span class=\"fx\">C.S<sub>BT</sub>=abP<sub>X0</sub>, P.S<sub>BT</sub>=P<sub>X0</sub>be, S.W<sub>BT</sub>=abe</span>(p.598)</p>\n<p><span class=\"fx\">C.S<sub>AT</sub>=acP<sub>X</sub><sup>*</sup>, P.S<sub>AT</sub>=P<sub>X</sub><sup>*</sup>de, S.W<sub>AT</sub>=abcde</span>(p.598)</p>\n<ul><li>社會福利提高 <strong><span class=\"fx\">bcd</span></strong>（=貿易利得；亦等於世界市場圖的 <span class=\"fx\">P<sub>X0</sub>fP<sub>X</sub><sup>*</sup></span>）(p.599)。</li></ul>\n<h4 class=\"sub3\">二、小國出口國(p.599–600)</h4>\n<ul><li>小國面對水平世界需求線 <span class=\"fx\">ED<sub>X</sub></span>，國際價 <span class=\"fx\">P<sub>X</sub><sup>*</sup>>P<sub>X</sub><sup>0</sup></span>。出口量 <span class=\"fx\">ES<sub>X</sub> = X<sub>S</sub> - X<sub>D</sub></span>。</li><li><span class=\"fx\">C.S<sub>BT</sub>=adP<sub>X</sub><sup>0</sup>, P.S<sub>BT</sub>=P<sub>X</sub><sup>0</sup>deO, S.W<sub>BT</sub>=adeO</span>(p.599)</li><li><span class=\"fx\">C.S<sub>AT</sub>=abP<sub>X</sub><sup>*</sup>, P.S<sub>AT</sub>=P<sub>X</sub><sup>*</sup>ceO, S.W<sub>AT</sub>=abcdeO</span>(p.599)</li><li>社會福利同樣提高 <strong><span class=\"fx\">bcd</span></strong>（＝<span class=\"fx\">P<sub>X</sub><sup>0</sup>fP<sub>X</sub><sup>*</sup></span>）(p.600)。</li></ul>\n<h4 class=\"sub3\">三、大國角度(p.600)</h4>\n<ul><li>大國面對的 <span class=\"fx\">ED<sub>X</sub></span>、<span class=\"fx\">ES<sub>X</sub></span> 皆為斜線，相交決定世界均衡價；本國進口量＝cd 段、外國出口量＝ab 段。福利分析與小國同法。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 20.1(p.600，110 政大商學院)</strong>： 本國 inverse demand <span class=\"fx\">P<sub>x</sub>=5-D<sub>x</sub></span>、supply <span class=\"fx\">P<sub>x</sub>=3+Q<sub>x</sub></span>。(1) 自給自足均衡價；<br>(2) 小國、國際價 3，進口或出口及數量；<br>(3) 自給自足與貿易下 CS、PS 及貿易利得。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>"}, {"id": "20.4", "title": "進口關稅(p.601–607)", "body": "\n<h4 class=\"sub3\">關稅種類(p.601)</h4>\n<ul><li><strong>從量稅（Specific tax）</strong>：每單位課 <span class=\"fx\">t<sub>1</sub></span> 元，<span class=\"fx\">P=P<sup>*</sup>+t<sub>1</sub></span>。</li><li><strong>從價稅（Advalorem tax）</strong>：按價格課比例 <span class=\"fx\">t<sub>2</sub></span>，<span class=\"fx\">P=(1+t<sub>2</sub>)P<sup>*</sup>=P<sup>*</sup>+t<sub>2</sub>P<sup>*</sup></span>。</li></ul>\n<h4 class=\"sub3\">一、小國課進口關稅(p.601–603)</h4>\n<ul><li>小國無法影響世界價，關稅完全反映在國內價。世界供給線由 <span class=\"fx\">ES<sub>X</sub></span> 上移至 <span class=\"fx\">ES<sub>X</sub>+t<sub>1</sub></span>，均衡 <span class=\"fx\">f→ f'</span>。國內價升為 <span class=\"fx\">P<sub>X</sub><sup>t</sup>=P<sub>X</sub><sup>*</sup>+t<sub>1</sub></span>；需求量降至 <span class=\"fx\">X<sub>D<sub>t1</sub></sub></span>、供給量升至 <span class=\"fx\">X<sub>S<sub>t1</sub></sub></span>，進口量 <span class=\"fx\">IM<sub>X<sub>t1</sub></sub>=X<sub>D<sub>t1</sub></sub>-X<sub>S<sub>t1</sub></sub></span>，關稅收入 <span class=\"fx\">=t<sub>1</sub>· IM<sub>X<sub>t1</sub></sub></span>。</li><li><strong>福利表(p.602)</strong>：</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"></colgroup><thead><tr><th></th><th>封閉</th><th>自由貿易</th><th>課關稅</th></tr></thead><tbody><tr><td><span class=\"fx\">P</span></td><td><span class=\"fx\">P<sub>X0</sub></span></td><td><span class=\"fx\">P<sub>X</sub><sup>*</sup></span></td><td><span class=\"fx\">P<sub>X</sub><sup>*</sup>+t<sub>1</sub></span></td></tr><tr><td><span class=\"fx\">C.S</span></td><td><span class=\"fx\">abP<sub>X0</sub></span></td><td><span class=\"fx\">acP<sub>X</sub><sup>*</sup></span></td><td><span class=\"fx\">ac'(P<sub>X</sub><sup>*</sup>+t<sub>1</sub>)</span></td></tr><tr><td><span class=\"fx\">P.S</span></td><td><span class=\"fx\">P<sub>X0</sub>be</span></td><td><span class=\"fx\">P<sub>X</sub><sup>*</sup>de</span></td><td><span class=\"fx\">(P<sub>X</sub><sup>*</sup>+t<sub>1</sub>)d'e</span></td></tr><tr><td>關稅收入</td><td>–</td><td>–</td><td>d<span class=\"fx\">′</span>c<span class=\"fx\">′</span>hg</td></tr><tr><td><span class=\"fx\">S.W</span></td><td><span class=\"fx\">abe</span></td><td><span class=\"fx\">abcde</span></td><td>abcd<span class=\"fx\">′</span>e+d<span class=\"fx\">′</span>c<span class=\"fx\">′</span>hg</td></tr><tr><td><span class=\"fx\">Δ S.W</span></td><td>–</td><td>提高 <span class=\"fx\">bcd</span></td><td>相對自由貿易<strong>降低</strong> (dd<span class=\"fx\">′</span>g+c<span class=\"fx\">′</span>ch)</td></tr></tbody></table></div>\n<ul><li><strong>無謂損失（Deadweight Loss）</strong>＝兩塊三角形：</li><li>c<span class=\"fx\">′</span>ch＝<strong>消費扭曲損失（Consumption distortion loss）</strong>（消費者面對較高價而減少消費）。</li><li>dd<span class=\"fx\">′</span>g＝<strong>生產扭曲損失（Production distortion loss）</strong>（國內多生產的成本 <span class=\"fx\">dd'gX<sub>S<sub>t1</sub></sub>X<sub>S</sub></span> 高於直接由外國進口的成本 <span class=\"fx\">dgX<sub>S<sub>t1</sub></sub>X<sub>S</sub></span>）。</li><li>兩三角恰等於 f<span class=\"fx\">′</span>fi。</li><li>小國最適關稅 <span class=\"fx\">t<sup>*</sup>=0</span>（無貿易條件改善，只有扭曲損失）。</li></ul>\n<h4 class=\"sub3\">二、大國課進口關稅(p.603–605)</h4>\n<ul><li>大國進口減少會使世界價下降，故稅後：國內價 <span class=\"fx\">P<sub>X</sub><sup>**</sup>=P<sub>X</sub><sup>**'</sup>+t<sub>1</sub></span>，其中付給外國的價格降為 <span class=\"fx\">P<sub>X</sub><sup>**'</sup>\\lt P<sub>X</sub><sup>*</sup></span>（<strong>貿易條件改善</strong>）。</li><li><strong>福利表(p.604)</strong>：</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"></colgroup><thead><tr><th></th><th>封閉</th><th>自由貿易</th><th>課關稅</th></tr></thead><tbody><tr><td><span class=\"fx\">P</span></td><td><span class=\"fx\">P<sub>X0</sub></span></td><td><span class=\"fx\">P<sub>X</sub><sup>*</sup></span></td><td><span class=\"fx\">P<sub>X<sub>t1</sub></sub><sup>*</sup></span></td></tr><tr><td><span class=\"fx\">C.S</span></td><td><span class=\"fx\">abP<sub>X0</sub></span></td><td><span class=\"fx\">acP<sub>X</sub><sup>*</sup></span></td><td><span class=\"fx\">ac'(P<sub>X</sub><sup>*</sup>+t<sub>1</sub>)</span></td></tr><tr><td><span class=\"fx\">P.S</span></td><td><span class=\"fx\">P<sub>X0</sub>be</span></td><td><span class=\"fx\">P<sub>X</sub><sup>*</sup>de</span></td><td><span class=\"fx\">(P<sub>X</sub><sup>*</sup>+t<sub>1</sub>)d'e</span></td></tr><tr><td>關稅收入</td><td>–</td><td>–</td><td>d<span class=\"fx\">′</span>c<span class=\"fx\">′</span>hg</td></tr><tr><td><span class=\"fx\">S.W</span></td><td><span class=\"fx\">abe</span></td><td><span class=\"fx\">abcde</span></td><td>abc<span class=\"fx\">′</span>d<span class=\"fx\">′</span>de+d<span class=\"fx\">′</span>c<span class=\"fx\">′</span>hg</td></tr><tr><td><span class=\"fx\">Δ S.W</span></td><td>–</td><td>提高 <span class=\"fx\">bcd</span></td><td>少了 (dd<span class=\"fx\">′</span>g+c<span class=\"fx\">′</span>ch)、多了 (gg<span class=\"fx\">′</span>h<span class=\"fx\">′</span>h)</td></tr></tbody></table></div>\n<ul><li><strong>淨福利變化</strong>：</li></ul>\n<p><span class=\"fx\">Δ SW = gg'h'h - (dd'g+c'ch)</span>(p.604)。</p>\n<ul><li>即大國除兩塊扭曲損失外，多了貿易條件利益（每單位進口從 <span class=\"fx\">P<sub>X</sub><sup>*</sup></span> 降到 <span class=\"fx\">P<sub>X<sub>t1</sub></sub><sup>*</sup></span> 所省的 <span class=\"fx\">(P<sub>X</sub><sup>*</sup>-P<sub>X<sub>t1</sub></sub><sup>*</sup>)× IM<sub>X<sub>t1</sub></sub></span>），福利可升可降；關稅由進出口國依彈性分擔。</li></ul>\n<h4 class=\"sub3\">三、最適關稅（Optimum Tariff，p.605–607）</h4>\n<ul><li>模型：<span class=\"fx\">ED<sub>X</sub>=α-β P<sub>X</sub><sup>D</sup></span>、<span class=\"fx\">ES<sub>X</sub>=γ+δ P<sub>X</sub><sup>S</sup></span>，關稅 <span class=\"fx\">P<sub>X</sub><sup>D</sup>-P<sub>X</sub><sup>S</sup>=t<sub>1</sub></span>。聯立得</li></ul>\n<p><span class=\"fx\">P<sub>X</sub><sup>S</sup>=\\dfracα-γβ+δ-\\dfracββ+δt<sub>1</sub></span>、<span class=\"fx\">P<sub>X</sub><sup>D</sup>=\\dfracα-γβ+δ+\\dfracδβ+δt<sub>1</sub></span>、<span class=\"fx\">IM=\\dfracαδ+βγβ+δ-\\dfracβδβ+δt<sub>1</sub></span>(p.606)。</p>\n<ul><li>自由貿易（<span class=\"fx\">t<sub>1</sub>=0</span>）：<span class=\"fx\">P<sub>X</sub><sup>*</sup>=\\dfracα-γβ+δ</span>、<span class=\"fx\">IM<sub>X</sub>=\\dfracαδ+βγβ+δ</span>。</li><li>最適稅率 <span class=\"fx\">t<sub>1</sub><sup>*</sup></span> 使 <span class=\"fx\">Δ SW</span> 極大（<span class=\"fx\">Δ SW</span>＝貿易條件利益面積 <span class=\"fx\">ϖ</span> 減去扭曲面積 <span class=\"fx\">ξ</span>）。</li><li><strong>禁止性關稅（Prohibitive tariff）</strong>：稅率升至 <span class=\"fx\">\\bar t</span> 時，福利回到自給自足水準、貿易停止。</li><li>小國沒有 <span class=\"fx\">ϖ</span>（世界價不變），最適關稅即 <span class=\"fx\">t<sup>*</sup>=0</span>＝自由貿易。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 20.2(p.603，108 政大院)</strong>： 小國以 $10/bag 進口蘋果，$D=400-10P、S=50+5P$，課從量稅使進口＝50 bags。求 (1) 稅額、(2) 關稅收入、(3) 消費扭曲損失、(4) 生產扭曲損失。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 20.3(p.605，108 交大財金)</strong>： Home（$D=360-20P,S=200+20P$）、Foreign（<span class=\"fx\">D<sup>*</sup>=420-20P<sup>*</sup>,S<sup>*</sup>=100+20P<sup>*</sup></span>）。(1) 自由貿易世界價與交易量；<br>(2) Foreign 課從量稅 2：各國價、交易量、對 Foreign 消費者福利影響、繪圖算總福利。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>"}, {"id": "20.5", "title": "出口補貼(p.608–611)", "body": "\n<h4 class=\"sub3\">一、小國使用出口補貼(p.608–609)</h4>\n<ul><li>每單位出口補貼 <span class=\"fx\">s<sub>1</sub></span>：出口品在外國售價升至 <span class=\"fx\">P<sub>X</sub><sup>*</sup>+s<sub>1</sub></span>；因小國無法影響世界價，世界價仍 <span class=\"fx\">P<sub>X</sub><sup>*</sup></span>，本國生產者實收 <span class=\"fx\">P<sub>X</sub><sup>*</sup>+s<sub>1</sub></span>。本國出口供給線下移 <span class=\"fx\">s<sub>1</sub></span> 成 <span class=\"fx\">ES<sub>X</sub>-s<sub>1</sub></span>；本國需求量降至 <span class=\"fx\">X<sub>DS<sub>1</sub></sub></span>、供給量升至 <span class=\"fx\">X<sub>SS<sub>1</sub></sub></span>，出口量 <span class=\"fx\">ES<sub>X<sub>S<sub>1</sub></sub></sub>=X<sub>SS<sub>1</sub></sub>-X<sub>DS<sub>1</sub></sub></span>，補貼支出 <span class=\"fx\">=s<sub>1</sub>· ES<sub>X<sub>S<sub>1</sub></sub></sub></span>。</li><li>社會福利須<strong>扣除</strong>政府補貼支出（挖東牆補西牆）。</li><li><strong>福利表(p.609)</strong>：</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"></colgroup><thead><tr><th></th><th>封閉</th><th>自由貿易</th><th>出口補貼</th></tr></thead><tbody><tr><td><span class=\"fx\">P</span></td><td><span class=\"fx\">P<sub>X0</sub></span></td><td><span class=\"fx\">P<sub>X</sub><sup>*</sup></span></td><td><span class=\"fx\">P<sub>X</sub><sup>*</sup>+s<sub>1</sub></span></td></tr><tr><td><span class=\"fx\">C.S</span></td><td><span class=\"fx\">adP<sub>X</sub><sup>0</sup></span></td><td><span class=\"fx\">abP<sub>X</sub><sup>*</sup></span></td><td><span class=\"fx\">ab'(P<sub>X</sub><sup>*</sup>+s<sub>1</sub>)</span></td></tr><tr><td><span class=\"fx\">P.S</span></td><td><span class=\"fx\">P<sub>X</sub><sup>0</sup>deO</span></td><td><span class=\"fx\">P<sub>X</sub><sup>*</sup>ceO</span></td><td><span class=\"fx\">(P<sub>X</sub><sup>*</sup>+s<sub>1</sub>)c'eO</span></td></tr><tr><td>補貼支出</td><td>–</td><td>–</td><td>b<span class=\"fx\">′</span>c<span class=\"fx\">′</span>hg</td></tr><tr><td><span class=\"fx\">S.W</span></td><td><span class=\"fx\">adeO</span></td><td><span class=\"fx\">abcdeO</span></td><td>ab<span class=\"fx\">′</span>gbcdeO−cc<span class=\"fx\">′</span>h</td></tr><tr><td><span class=\"fx\">Δ S.W</span></td><td>–</td><td>提高 <span class=\"fx\">bcd</span></td><td>相對自由貿易<strong>降低</strong> (bb<span class=\"fx\">′</span>g+c<span class=\"fx\">′</span>ch)</td></tr></tbody></table></div>\n<ul><li>無謂損失＝消費扭曲 bb<span class=\"fx\">′</span>g＋生產扭曲 c<span class=\"fx\">′</span>ch（＝f<span class=\"fx\">′</span>fi）。</li></ul>\n<h4 class=\"sub3\">二、大國使用出口補貼(p.609–611)</h4>\n<ul><li>大國補貼使世界價下降為 <span class=\"fx\">P<sub>X<sub>s1</sub></sub><sup>*′</sup></span> → <strong>貿易條件惡化</strong>。</li><li><strong>福利表(p.610)</strong>：相對自由貿易降低 b<span class=\"fx\">′</span>bcc<span class=\"fx\">′</span>h<span class=\"fx\">′</span>g<span class=\"fx\">′</span>；除 bb<span class=\"fx\">′</span>g、c<span class=\"fx\">′</span>ch 兩扭曲三角外，多了貿易條件惡化損失面積 ghh<span class=\"fx\">′</span>g<span class=\"fx\">′</span>（收入下跌 <span class=\"fx\">(P<sub>X</sub><sup>*</sup>-P<sub>X<sub>s1</sub></sub><sup>*′</sup>)×(X<sub>S<sub>s1</sub></sub>-X<sub>D<sub>s1</sub></sub>)</span>）。</li><li>結論：<strong>出口補貼是必輸之賭</strong>——除生產、消費扭曲損失外，大國下還因貿易條件惡化進一步折損福利(p.611)。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 20.4(p.611，105 交大財金)</strong>： Home（D=280−20P<span class=\"mpunct\">,</span>S=120+20P）、Foreign（<span class=\"fx\">D<sup>*</sup>=400-20P<sup>*</sup>,S<sup>*</sup>=80+20P<sup>*</sup></span>）。(1) 自由貿易世界價；<br>(2) Home 對出口給從量補貼 2：各國價與量、對 Home 消費者影響、繪圖算總福利。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>"}, {"id": "20.6", "title": "進口配額與自動出口設限(p.612–616)", "body": "\n<h4 class=\"sub3\">一、進口配額（Import Quota，p.612–613）</h4>\n<ul><li><strong>意義</strong>：政府對進口到國內商品做<strong>數量上的直接管制</strong>。</li><li>設配額 <span class=\"fx\">IM<sub>Q</sub>\\lt IM<sub>X</sub></span>：本國進口需求線 <span class=\"fx\">ED<sub>X</sub></span> 超過 <span class=\"fx\">IM<sub>Q</sub></span> 後失效（變成 <span class=\"fx\">P<sub>X0</sub>f'i'iIM<sub>Q</sub></span>）。世界市場均衡於 i，世界價降為 <span class=\"fx\">P<sub>XQ</sub><sup>*'</sup></span>（貿易條件改善）；為消除國內超額需求，國內價升至 <span class=\"fx\">P<sub>XQ</sub><sup>*</sup></span>。生產量升、消費量降，保護效果與關稅同。</li><li><strong>配額租（Quota Rent, QR）</strong>：國內價高於世界價的單位利潤</li></ul>\n<p><span class=\"fx\">QR=(P<sub>XQ</sub><sup>*</sup>-P<sub>XQ</sub><sup>*'</sup>)× IM<sub>Q</sub></span>，即圖中 d<span class=\"fx\">′</span>c<span class=\"fx\">′</span>hg 面積；若進口權授與本國廠商，則配額租歸本國。</p>\n<ul><li>配額後社會福利：<span class=\"fx\">SW<sub>Q</sub>=C.S<sub>Q</sub>+P.S<sub>Q</sub>+QR=ac'P<sub>XQ</sub><sup>*</sup>+P<sub>XQ</sub><sup>*</sup>d'e+d'c'hg</span>。</li><li>大國 <span class=\"fx\">Δ S.W=(gg'h'h)-(dd'g+c'ch)</span>（與大國關稅同式，貿易條件利益 vs 兩扭曲損失）；小國配額無貿易條件改善，只有扭曲損失，福利必降。</li></ul>\n<h4 class=\"sub3\">二、自動出口設限（Voluntary Export Restraint, VER，p.614–616）</h4>\n<ul><li><strong>意義</strong>：進出口國協商，出口國「自願性」限制出口量；實際多在進口國威嚇下被迫接受（例：1981 年美國要求日本對美自動設限）。</li><li><strong>圖形與結果</strong>：本國面對的出口供給線在 <span class=\"fx\">IM<sub>Q</sub></span> 後垂直（變 ii<span class=\"fx\">′</span>f<span class=\"fx\">′</span>VER 段），世界均衡於 f<span class=\"fx\">′</span>，本國消費與生產面對價格同為 <span class=\"fx\">P<sub>XQ</sub><sup>*</sup></span>，生產／消費數量與配額相同。</li><li><strong>與配額最大差異＝配額租的歸屬</strong>：VER 下世界價提高、本國貿易條件惡化，<strong>配額租雙手奉上給外國</strong>（外國由原本 <span class=\"fx\">P<sub>XQ</sub><sup>*′′</sup>ijO</span> 梯形變為 <span class=\"fx\">P<sub>XQ</sub><sup>*</sup>f'i'ijO</span>，多得的 <span class=\"fx\">P<sub>XQ</sub><sup>*</sup>f'i'P<sub>XQ</sub><sup>*′′</sup></span> 恰為配額下國內可得的限額租）。</li><li>VER 下本國社會福利 <span class=\"fx\">SW<sub>VER</sub>=C.S<sub>VER</sub>+P.S<sub>VER</sub>=ac'P<sub>XQ</sub><sup>*</sup>+P<sub>XQ</sub><sup>*</sup>d'e</span>（不含配額租）；相對自由貿易 <span class=\"fx\">Δ S.W=-d'dcc'</span>，<strong>必然使進口國福利下降</strong>。</li><li>政策面：VER 處 WTO/GATT 灰色地帶（無條款禁止、但進口配額不被允許）；進口國又可把「配額如何分配」及競租行為（Rent seeking）的麻煩丟給出口國。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 20.5</strong>： 本國冷氣機，本國供給 Q=100+10P，外國以每台 10 元無限供應，需求 Q=800−20P。(1) 求進口量；<br>(2) 設 100 單位進口配額，求 ①國內均衡價、②配額租。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.613)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 20.6</strong>： 需求 <span class=\"fx\">Q=100-P</span>、供給 <span class=\"fx\">Q=P</span>，自由貿易價跌到 30，設進口配額上限 20。判斷 CS／PS／社會無謂損失／成交量各選項。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.614)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 20.7</strong>： 同供需，價跌到 30 後每單位課 $10 關稅。判斷 CS 減少、PS 減少、關稅收入、社會無謂損失各選項。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.614)</div></li></ul>\n</div>"}, {"id": "20.7", "title": "關稅與配額等價分析(p.617–623)", "body": "\n<h4 class=\"sub3\">一、完全競爭市場下的關稅與配額</h4>\n<ul><li>若配額量＝某從量關稅下的均衡進口量 <span class=\"fx\">IM<sub>Q</sub>=IM<sub>t1</sub></span>，則兩者造成的生產量、消費量、進口量完全相同；只要配額租收歸本國所有，福利變化也相同：</li></ul>\n<p><span class=\"fx\">Δ SW=gg'h'h-(dd'g+c'ch)</span>。</p>\n<ul><li><strong>結論：在完全競爭市場假設下，關稅與配額是等價（Equivalence of tariff and quota）的</strong>(p.618)。</li></ul>\n<h4 class=\"sub3\">二、關稅與配額的不等價(p.618–620)</h4>\n<ul><li>等價只在「完全競爭＋靜態」下成立。打破靜態、考慮調整過程：當國內需求變化（本書以小國為例），關稅下國內價格固定（＝世界價＋稅）、進口量隨需求變動；配額下進口量固定、國內價格隨需求變動——兩者在調整過程與所得分配上不再完全一樣。</li><li>延續上文：自由貿易下國內價格為 <span class=\"fx\">P<sub>X</sub><sup>*</sup>+t<sub>1</sub></span>（原文接「此時國內的進口數量為 <span class=\"fx\">\\overlinea<sub>1</sub>b<sub>1</sub></span> 線段」）；但若是實施配額，且仍規定在 <span class=\"fx\">IM<sub>Q</sub></span>，那麼新的進口需求線會與 <span class=\"fx\">ES<sub>X</sub></span> 交在 <span class=\"fx\">E<sub>Q</sub>'</span>，世界市場的價格仍為 <span class=\"fx\">P<sub>X</sub><sup>*</sup></span>，但是國內價格會上升至 <span class=\"fx\">P<sub>XQ</sub><sup>*</sup></span>（較關稅下的國內價格高）。此時會發現，兩種政策對國內消費者與生產者的影響不再相同，<strong>關稅與配額的等價就此消失</strong>(p.619)。</li></ul>\n<h4 class=\"sub3\">（二）國內市場並非完全競爭(p.619–620)</h4>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"80\" y1=\"50\" x2=\"380\" y2=\"200\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></line><text x=\"386\" y=\"200\" font-size=\"11\" fill=\"#1f3a5f\">D</text><line x1=\"80\" y1=\"200\" x2=\"380\" y2=\"50\" stroke=\"#b5542e\" stroke-width=\"2.2\"></line><text x=\"386\" y=\"52\" font-size=\"11\" fill=\"#b5542e\">S</text><line x1=\"60\" y1=\"150\" x2=\"410\" y2=\"150\" stroke=\"#1e7d32\" stroke-width=\"1.6\"></line><text x=\"330\" y=\"144\" font-size=\"10\" fill=\"#1e7d32\">Pw 自由貿易</text><line x1=\"60\" y1=\"115\" x2=\"410\" y2=\"115\" stroke=\"#c89632\" stroke-width=\"1.6\"></line><text x=\"330\" y=\"109\" font-size=\"10\" fill=\"#c89632\">Pw+t 關稅</text><polygon points=\"150,132 200,115 200,150\" fill=\"rgba(181,84,46,0.3)\"></polygon><text x=\"150\" y=\"125\" font-size=\"9\" fill=\"#b5542e\">a 生產者剩餘↑</text><polygon points=\"250,132 300,115 300,150\" fill=\"rgba(30,125,50,0.25)\"></polygon><text x=\"255\" y=\"128\" font-size=\"9\" fill=\"#1e7d32\">c 政府稅收</text><polygon points=\"200,115 250,132 200,150\" fill=\"rgba(107,78,142,0.3)\"></polygon><text x=\"178\" y=\"170\" font-size=\"9\" fill=\"#6b4e8e\">b,d 無謂損失</text></svg><p class=\"figcap\">小國關稅：Pw→Pw+t，生產者剩餘增 a、政府稅收 c、消費者剩餘減(a+b+c+d)、無謂損失 b+d。(p.600)</p>\n</div>\n<p><strong>自由貿易下</strong>：本國廠商無法將價格訂超過 <span class=\"fx\">P<sub>X</sub><sup>*</sup></span>，否則沒有消費者會願意向本國廠商購買；故廠商被迫接受世界價格 <span class=\"fx\">P<sub>X</sub><sup>*</sup></span>，變為價格接受者，以 <span class=\"fx\">P<sub>X</sub><sup>*</sup>=MC<sub>X</sub></span> 生產至 <span class=\"fx\">X<sub>S</sub></span>，國內需求量為 <span class=\"fx\">X<sub>D</sub></span>，進口量 <span class=\"fx\">=X<sub>D</sub>-X<sub>S</sub></span>(p.619)。</p>\n<p><strong>課從量關稅 <span class=\"fx\">t<sub>1</sub></span> 後</strong>：小國假設下國內價格變為 <span class=\"fx\">P<sub>X</sub><sup>*</sup>+t<sub>1</sub></span>，廠商生產量為 <span class=\"fx\">X<sub>St</sub></span>、需求量為 <span class=\"fx\">X<sub>Dt</sub></span>，進口量 <span class=\"fx\">\\overlineb<sub>1</sub>c<sub>1</sub>=X<sub>Dt</sub>-X<sub>St</sub></span>(p.619)。</p>\n<figure class=\"svgfig\"><figcaption>不完全競爭下：關稅 vs 配額——配額用盡後廠商恢復獨占力，國內價格升至 <span class=\"fx\">P<sub>XQ</sub><sup>*</sup></span>（示意，對應書 p.619 圖）</figcaption>\n<svg viewbox=\"0 0 400 270\" role=\"img\" aria-label=\"不完全競爭下關稅與配額\">\n<line x1=\"45\" y1=\"235\" x2=\"380\" y2=\"235\" class=\"ax\"></line><line x1=\"45\" y1=\"235\" x2=\"45\" y2=\"25\" class=\"ax\"></line>\n<text x=\"384\" y=\"239\" class=\"axl\">X</text><text x=\"30\" y=\"24\" class=\"axl\">P_X</text>\n<line x1=\"120\" y1=\"185\" x2=\"365\" y2=\"185\" class=\"wl\"></line><text x=\"352\" y=\"181\" class=\"lb\">ES_X</text>\n<line x1=\"120\" y1=\"140\" x2=\"365\" y2=\"140\" class=\"wl\"></line><text x=\"345\" y=\"136\" class=\"lb\">ES_X+t1</text>\n<line x1=\"60\" y1=\"95\" x2=\"330\" y2=\"95\" stroke=\"#b04a3a\" stroke-width=\"1.2\" stroke-dasharray=\"5 3\"></line>\n<text x=\"300\" y=\"91\" class=\"lb\">P_XQ*</text>\n<path d=\"M60,55 L330,225\" class=\"dline\"></path><text x=\"332\" y=\"222\" class=\"lb\">D</text>\n<path d=\"M60,80 L195,235\" class=\"sline\"></path><text x=\"198\" y=\"230\" class=\"lb\">MR</text>\n<path d=\"M60,100 L160,235\" stroke=\"#6b4e8e\" stroke-width=\"1.8\" fill=\"none\"></path><text x=\"150\" y=\"222\" class=\"lb\">MR_Q</text>\n<path d=\"M75,235 L255,55\" class=\"mc\"></path><text x=\"252\" y=\"55\" class=\"lb\">MC_X</text>\n<circle cx=\"135\" cy=\"190\" r=\"4\" class=\"eqpt\"></circle><text x=\"140\" y=\"186\" class=\"lb\">E</text>\n<line x1=\"120\" y1=\"185\" x2=\"120\" y2=\"235\" stroke=\"#9a8f78\" stroke-dasharray=\"3 3\"></line>\n<line x1=\"150\" y1=\"190\" x2=\"150\" y2=\"235\" stroke=\"#9a8f78\" stroke-dasharray=\"3 3\"></line>\n<line x1=\"175\" y1=\"95\" x2=\"175\" y2=\"235\" stroke=\"#9a8f78\" stroke-dasharray=\"3 3\"></line>\n<line x1=\"210\" y1=\"140\" x2=\"210\" y2=\"235\" stroke=\"#9a8f78\" stroke-dasharray=\"3 3\"></line>\n<line x1=\"330\" y1=\"225\" x2=\"330\" y2=\"235\" stroke=\"#9a8f78\"></line>\n<text x=\"112\" y=\"249\" class=\"axl\">X_S</text>\n<text x=\"138\" y=\"249\" class=\"axl\">X_SQ</text>\n<text x=\"167\" y=\"249\" class=\"axl\">X_DQ</text>\n<text x=\"200\" y=\"249\" class=\"axl\">X_Dt</text>\n<text x=\"322\" y=\"249\" class=\"axl\">X_D</text>\n<circle cx=\"215\" cy=\"140\" r=\"3.5\" class=\"eqpt\"></circle><text x=\"218\" y=\"134\" class=\"lb\">b1</text>\n<circle cx=\"205\" cy=\"140\" r=\"3.5\" class=\"eqpt\"></circle><text x=\"188\" y=\"134\" class=\"lb\">C1</text>\n<circle cx=\"175\" cy=\"95\" r=\"3.5\" class=\"eqpt\"></circle><text x=\"180\" y=\"88\" class=\"lb\">b_Q/C_Q</text>\n</svg></figure>\n<p><strong>改採配額並維持關稅下進口量 <span class=\"fx\">\\overlineb<sub>1</sub>c<sub>1</sub></span></strong>：此時國內廠商面對的需求線變為 <span class=\"fx\">\\overlineab<sub>1</sub>D<sub>Q</sub>ES<sub>X</sub></span>；因是小國，配額下世界價格仍維持 <span class=\"fx\">P<sub>X</sub><sup>*</sup></span>。在世界價格仍為 <span class=\"fx\">P<sub>X</sub><sup>*</sup></span> 的前提下，國內出現「剩餘的需求」等待廠商滿足，又因廠商並非完全競爭，其會利用 <span class=\"fx\">D<sub>Q</sub></span> 找出 <span class=\"fx\">MR<sub>Q</sub></span>，並以 <span class=\"fx\">MR<sub>Q</sub>=MC<sub>X</sub></span> 生產；此時獨占廠商決策在 <span class=\"fx\">E</span> 點，生產量 <span class=\"fx\">X<sub>SQ</sub></span>、國內價格訂為 <span class=\"fx\">P<sub>XQ</sub><sup>*</sup></span>。當國內價格為 <span class=\"fx\">P<sub>XQ</sub><sup>*</sup></span> 時，國內消費量 <span class=\"fx\">X<sub>DQ</sub></span> 恰好等於生產者產量 <span class=\"fx\">X<sub>SQ</sub></span> 加上配額（進口數量）<span class=\"fx\">\\overlineb<sub>1</sub>c<sub>1</sub>=\\overlineb<sub>Q</sub>c<sub>Q</sub></span>(p.619–620)。</p>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>以進口配額取代關稅，縱使進口量完全一樣，<strong>國內價格卻較關稅下提高、消費量較關稅下降低</strong>，與完全競爭市場下的等價結果不一致；當國內市場並非完全競爭，<strong>使用關稅的福利水準會較配額高</strong>(p.620)。</li>\n<li><strong>關稅壓制獨占力</strong>：若課關稅後價格為 15 元（<span class=\"fx\">P<sub>X</sub><sup>*</sup>+t<sub>1</sub></span>），廠商一旦訂超過 15 元就會「失信」於國內消費者，使消費者大量向外國購買而失去國內市場；故關稅有效壓制獨占廠商在國內的獨占力量（Monopoly power），如雙手被綁，不敢隨意漲價(p.620)。</li>\n<li><strong>配額維持獨占力</strong>：配額數量固定，配額用盡後，無論消費者如何羨慕世界市場的便宜商品也「看得到、吃不到」；配額用盡（五分鐘時間到了），廠商就回復獨占力，利用獨占力壓榨消費者剩餘、增加自身利潤(p.620)。</li></ul></div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<div class=\"probitem\"><div class=\"pq\"><strong>例題 20.8(p.620，書頁僅題目、無詳解)</strong>：財貨 <span class=\"fx\">X</span> 的國內市場需求為 <span class=\"fx\">P=140-Q</span>，<span class=\"fx\">Q</span> 為市場銷售總量。國內只有廠商 <span class=\"fx\">Y</span> 製造財貨 <span class=\"fx\">X</span>，廠商沒有固定成本，邊際成本函數 MC(q)=20+q，<span class=\"fx\">q</span> 為廠商 <span class=\"fx\">Y</span> 的產量；財貨 <span class=\"fx\">X</span> 若由國外進口，無論進口數量多少，每單位價格均為 50，且有很多進口商可以進口財貨 <span class=\"fx\">X</span>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：本書此題僅列題目、未附詳解（詳解見書末 QR）。</div></div>\n<ul><li>(1) 假設進口商可進口任意數量的財貨 <span class=\"fx\">X</span>，則 <span class=\"fx\">X</span> 國內銷售量為何？廠商利潤為何？</li>\n<li>(2) 若政府規定進口配額為 30，則財貨 <span class=\"fx\">X</span> 的國內市場價格為何？</li></ul></div>\n<h4 class=\"sub3\">三、其他討論(p.620–623)</h4>\n<h4 class=\"sub3\">（一）傾銷 Dumping(p.620)</h4>\n<p class=\"def-note\">以低於生產成本或國內售價之價格，或在政府介入補貼下，將本國商品大量銷售至外國市場之行為。某些國家為防止此事發生，通常會對實施傾銷的出口國家課徵<strong>反傾銷稅</strong>（或稱平衡稅）來克制(p.620)。</p>\n<h4 class=\"sub3\">（二）保護幼稚產業 Infant Industry(p.621)</h4>\n<p>通常關稅與配額的設定，會減少外來進口品之競爭，使國內正在萌芽階段的幼稚產業得以順利成長。但是否為幼稚產業必須滿足以下條件：</p>\n<ol><li>所保護的產業必須是具有發展潛力的產業。</li>\n<li>只能短期保護，不可以長期支持。</li>\n<li>其成長後所帶來的整體益處必須大於保護期間的成本損失(p.621)。</li></ol>\n<h4 class=\"sub3\">（三）貿易條件 Term of Trade(p.621)</h4>\n<p class=\"def-note\">一單位出口品在國際市場上所能換得的進口品數量，稱為貿易條件；以相對價格說明則為出口品價格與進口品價格之比率。</p>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<p><span class=\"fx\">\\mathitTerm\\ of\\ trade≡ TOT=\\dfrac出口品價格進口品價格× 100\\%</span></p>\n<ul><li>一單位出口品可換得之進口品數量越多，稱貿易條件改善（<span class=\"fx\">TOT\\uparrow</span>），反之則為惡化（<span class=\"fx\">TOT\\downarrow</span>）(p.621)。</li></ul></div>\n<h4 class=\"sub3\">（四）TOT 必介於兩國貿易前相對價格比之間(p.621–622)</h4>\n<p>假設 <span class=\"fx\">A</span> 國與 <span class=\"fx\">B</span> 國生產一單位 <span class=\"fx\">X</span> 與 <span class=\"fx\">Y</span> 所消耗的要素數量如下表，且 <span class=\"fx\">A</span>、<span class=\"fx\">B</span> 國皆有 <span class=\"fx\">\\bar F</span> 單位勞動力：</p>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:25\"><col style=\"width:37.5%\"><col style=\"width:37.5%\"></colgroup>\n<thead><tr><th></th><th
