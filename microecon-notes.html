價格高於 <span class=\"fx\">MC</span>，存在寡占利潤。</li></ul>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P2</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P1</text><line x1=\"80\" y1=\"210\" x2=\"390\" y2=\"60\" stroke=\"#1e7d32\" stroke-width=\"2\"></line><text x=\"330\" y=\"80\" font-size=\"10\" fill=\"#1e7d32\">45° 線 P1=P2</text><circle cx=\"200\" cy=\"150\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"206\" y=\"146\" font-size=\"9\" fill=\"#b5542e\">(c,c) 邊際成本定價</text></svg><p class=\"figcap\">貝特蘭同質財：均衡落在 45° 線上 (c,c)，價格鬥爭至邊際成本。(p.410)</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.11</strong>： (p.430)：廠商 A、B 邊際成本分別為 5、9，Bertrand 競爭下市場均衡價格？<div class=\"opts\"><div>(A) 9</div><div>(B) 4</div><div>(C) 5</div><div>(D) 14</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：低成本廠商訂 <span class=\"fx\">P=MC<sub>2</sub>-ε</span>，故均衡價格趨近 <strong>9</strong>（答案 A）。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.13</strong>： (p.430)：為何寡占市場無法帶來 Pareto efficiency？（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.14</strong>： (p.430)：四家同質廠商、MC=\\100、P=500-2Q$<br>(1) 市場均衡數量？<br>(2) 均衡價格？<br>(3) 各廠利潤？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：Bertrand 下 $P=MC=100$，每家利潤 0。（詳解見書末 QR）</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.15</strong>： (p.431)：<span class=\"fx\">Q<sub>1</sub>=75-P<sub>1</sub>+0.5P<sub>2</sub></span>、<span class=\"fx\">Q<sub>2</sub>=75-P<sub>2</sub>+0.5P<sub>1</sub></span>、<span class=\"fx\">AC=MC=30</span><br>(1) 兩廠最適價格反應函數？<br>(2) 均衡價格？（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>必考：Bertrand 悖論（兩家同質 = 完全競價）。</li><li>成本不對稱時的均衡：低成本廠商訂在「對手 <span class=\"fx\">MC</span> 減一點點」，獨占市場。</li><li>異質產品時，Bertrand 反應函數為正斜率（價格互補），均衡價格 > <span class=\"fx\">MC</span>。</li></ul>\n</div>\n</div>"}, {"id": "13.6", "title": "價格領袖模型（Price-Leadership Model）(p.432–p.433)", "body": "\n<p class=\"def-note\">市場上存在一個<strong>優勢（領導）廠商</strong>有能力用價格策略排除競爭者，但礙於法律無法直接排除，因此訂一個價格讓追隨廠商共存。</p>\n<p class=\"def-note\">無形勾結（有線電視、報紙為例）。</p>\n<h4 class=\"sub3\">假設</h4>\n<ol><li>同質寡占市場。</li><li>領導廠商先訂價，其他廠商追隨。</li><li>無形勾結。</li></ol>\n<h4 class=\"sub3\">公式與邏輯</h4>\n<ul><li>市場需求 <span class=\"fx\">P<sup>d</sup>=AR</span>，追隨廠商總供給 <span class=\"fx\">S<sub>F</sub>=∑ MC<sub>F</sub></span>。</li><li>領導者面對的<strong>剩餘需求</strong>：</li></ul>\n<p><span class=\"fx\">P<sup>L</sup>=P<sup>d</sup>-S<sub>F</sub></span>(p.432)</p>\n<ul><li>由剩餘需求導出 <span class=\"fx\">MR<sup>L</sup></span>，再令 <span class=\"fx\">MC<sup>L</sup>=MR<sup>L</sup></span> 決定領導者最適產量 <span class=\"fx\">Q<sub>L</sub><sup>*</sup></span>。</li><li>帶回剩餘需求決定均衡價格 <span class=\"fx\">P<sup>*</sup></span>；追隨者按 <span class=\"fx\">P<sup>*</sup></span> 代入自身供給線 <span class=\"fx\">S<sub>F</sub></span> 決定 <span class=\"fx\">Q<sub>F</sub><sup>*</sup></span>。</li></ul>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>價格上下限：<span class=\"fx\">P</span> 不得高於 <span class=\"fx\">\\bar P</span>（否則追隨者沒有生產空間）、不得低於 <span class=\"fx\">\\underline P</span>（否則追隨者也沒有生產空間）。</li><li>作法四步驟：</li></ul>\n<ol><li>市場需求減追隨者供給 → 剩餘需求。</li><li>由剩餘需求導出領導者 <span class=\"fx\">MR<sup>L</sup></span>。</li><li><span class=\"fx\">MC<sup>L</sup>=MR<sup>L</sup></span> 決定領導者產量，帶回剩餘需求決定 <span class=\"fx\">P<sup>*</sup></span>。</li><li>追隨者按 <span class=\"fx\">P<sup>*</sup></span> 代入自身供給線決定 <span class=\"fx\">Q<sub>F</sub><sup>*</sup></span>。</li></ol>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div><svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"90\" y1=\"50\" x2=\"380\" y2=\"190\" stroke=\"#1e7d32\" stroke-width=\"2\"></line><text x=\"386\" y=\"186\" font-size=\"10\" fill=\"#1e7d32\">Pd=AR</text><line x1=\"90\" y1=\"210\" x2=\"300\" y2=\"80\" stroke=\"#b5542e\" stroke-width=\"1.8\"></line><text x=\"306\" y=\"84\" font-size=\"10\" fill=\"#b5542e\">SF=∑MC</text><line x1=\"60\" y1=\"130\" x2=\"410\" y2=\"130\" stroke=\"#c89632\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"></line><text x=\"330\" y=\"124\" font-size=\"9\" fill=\"#c89632\">P̄</text><circle cx=\"230\" cy=\"150\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"238\" y=\"146\" font-size=\"9\" fill=\"#6b4e8e\">E*</text></svg><p class=\"figcap\">價格領袖：領導者剩餘需求有折點、MR 有缺口，MRL=MCL 定價。(p.415)</p></div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.16</strong>： (p.433)：</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n<p>(1) 寡占下 <span class=\"fx\">Q=250-P</span>、小廠總供給 <span class=\"fx\">Q=230+9P</span>、強力大廠 <span class=\"fx\">MC=Q</span>，求強力大廠利潤極大化產量。</p>\n<p>(2) GTP 手機照相鏡頭市場：<span class=\"fx\">P=10000-10Q<sub>T</sub></span>、<span class=\"fx\">MC<sub>L</sub>=100+3Q<sub>L</sub></span>、<span class=\"fx\">MC<sub>S</sub>=50+Q<sub>S</sub></span>（六家小廠），求 GTP 最大利潤產量與市場價格。</p>\n<p>書中解法要點：先求小廠供給線 → 市場需求減小廠供給 = GTP 剩餘需求 → 找 <span class=\"fx\">MR<sup>L</sup>=MC<sub>L</sub></span>。（詳解見書末 QR）</p>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>與 Stackelberg（數量領先）對照：價格領袖是<strong>價格決策先後</strong>，追隨者如同完全競爭廠商是價格接受者。</li><li>剩餘需求曲線的折點形狀（折點對應 <span class=\"fx\">\\bar P</span>）是常考圖形。</li></ul>\n</div>\n</div>"}, {"id": "13.7", "title": "Sweezy 模型（拗折需求曲線模型）(p.434–p.436)", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc18\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">拗折需求曲線（Kinked Demand curve）</div><div class=\"mc-body\"><div class=\"mc-formula\">解釋寡占市場價格波動不頻繁、甚至僵固的現象。</div><div class=\"mc-detail\">解釋寡占市場價格波動不頻繁、甚至僵固的現象。</div></div></div>\n<h4 class=\"sub3\">基本假設</h4>\n<ol><li>產品同質。</li><li>廠商間有「<strong>跟跌不跟漲</strong>」的價格型態（註：p.435 另討論「跟漲不跟跌」反向型態）。</li></ol>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong>跟跌不跟漲</strong>：</li><li>若單一廠商降價，其他廠商跟著降價 → 需求量不會如預期般大幅上升。</li><li>若單一廠商漲價，其他廠商不跟著漲 → 需求量大幅下降。</li><li>故在現價 <span class=\"fx\">a</span> 點處需求曲線拗折；<span class=\"fx\">MR</span> 在拗折點處斷成兩段，出現 <span class=\"fx\">bc</span> 的缺口。</li><li>均衡點決定：</li><li><span class=\"fx\">Q<sub>1</sub>\\lt Q<sup>*</sup></span>：<span class=\"fx\">MR(Q<sub>1</sub>)>MC(Q<sub>1</sub>)</span>，有誘因增產。</li><li><span class=\"fx\">Q<sub>2</sub>>Q<sup>*</sup></span>：<span class=\"fx\">MR(Q<sub>2</sub>)\\lt MC(Q<sub>2</sub>)</span>，有誘因減產。</li><li>故產量停在 <span class=\"fx\">MR</span> 斷裂缺口 <span class=\"fx\">bc</span> 處。</li><li><strong>本模型是眾多廠商決策模型中，唯一不滿足 <span class=\"fx\">MR=MC</span> 條件的均衡</strong>。</li><li><strong>價格僵固性</strong>：</li><li>成本變動：<span class=\"fx\">MC</span> 上移至 MC<span class=\"fx\">′</span>，只要仍與斷裂段相交，廠商自行吸收成本，<strong>價格不變</strong>。</li><li>需求變動：需求線平移後，新 <span class=\"fx\">MR</span> 斷裂段仍與原 <span class=\"fx\">MC</span> 相交時，價格仍維持 <span class=\"fx\">P<sup>*</sup></span>。</li><li>缺點：拗折需求曲線解釋了價格僵固，但<strong>無法解釋初始均衡價格與數量如何決定</strong>。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<div class=\"tblwrap\"><table style=\"width:300px\"><caption>同時賽局報償矩陣（列 payoff, 行 payoff）</caption><colgroup><col style=\"width:100px\"><col style=\"width:100px\"><col style=\"width:100px\"></colgroup><thead><tr><th></th><th>列者 L</th><th>列者 R</th></tr></thead><tbody><tr><th>行者 U</th><td>(列,行)</td><td>(列,行)</td></tr><tr><th>行者 D</th><td>(列,行)</td><td>(列,行)</td></tr></tbody></table></div><p class=\"figcap\">同時賽局以報償矩陣呈現；動態賽局用賽局樹（root→分枝→終點標 payoff），相同資訊集以虛線連接。(p.430)</p></div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>必考：為何寡占價格僵固？→ <span class=\"fx\">MR</span> 缺口吸納成本變動。</li><li>「跟跌不跟漲」的不對稱反應是拗折的由來。</li><li>記住：本模型均衡不一定 <span class=\"fx\">MR=MC</span>。</li></ul>\n</div>\n</div>"}, {"id": "13.8", "title": "賽局理論（Game Theory）(p.437–p.456)", "body": "\n<p class=\"def-note\">賽局：每個參賽者（Player）必須做策略（Strategy）選擇，賽局出象（Outcome）取決於所有人的策略；賽局理論研究策略交互運作的關係。</p>\n<p class=\"def-note\">組成三要素：<strong class=\"term\">參賽者、策略、報償（Payoff）</strong>。</p>\n<h4 class=\"sub3\">賽局種類</h4>\n<ul><li>依行動順序：</li><li><strong class=\"term\">靜態賽局（Static game）/ 同時賽局（Simultaneous move）</strong>：參賽者同時決策，互不知道對手策略。庫諾、Bertrand 屬此。</li><li><strong class=\"term\">動態賽局（Dynamic game）/ 先後次序賽局（Sequential move）</strong>：先動者在考慮後動者反應後決策。Stackelberg、價格領袖屬此。</li><li><strong class=\"term\">合作賽局（Cooperative game）</strong>：參賽者彼此合作或勾結（卡特爾）。</li><li>依報酬：</li><li><strong class=\"term\">零和賽局（Zero-sum）</strong>：勝者之利 = 敗者之失。</li><li><strong class=\"term\">非零和賽局（Non-zero-sum）</strong>：勝負無固定正負關係。</li><li>依資訊：</li><li><strong class=\"term\">共同知識（Common knowledge）</strong>：所有參賽者都了解別人知道什麼，也知道別人知道自己知道（Rasmusen, 1994）。</li><li><strong class=\"term\">完全訊息（Complete information）</strong>：每個參賽者都知道自己與別人策略組合對應的報酬。</li><li><strong class=\"term\">完美訊息（Perfect information）</strong>：參賽者對其他參賽者的行動可完全瞭解。</li><li><strong>完美訊息必為完全訊息；完全訊息不一定為完美訊息</strong>。</li></ul>\n<h4 class=\"sub3\">賽局表示法</h4>\n<ul><li><strong class=\"term\">標準型（Normal / strategic form）</strong>：以報償矩陣（Payoff matrix）表示。</li><li>範例(p.439)：</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th>A \\ B</th><th>Go</th><th>Walk</th></tr></thead><tbody><tr><td><strong>Up</strong></td><td>2, 1</td><td>0, 0</td></tr><tr><td><strong>Down</strong></td><td>0, 0</td><td>1, 2</td></tr></tbody></table></div>\n<p>左欄報償為 A、右欄為 B。</p>\n<ul><li><strong class=\"term\">擴展型（Extensive form）/ 賽局樹（game tree）</strong>：以樹狀圖表示先後順序，由結（node）與分枝（branch）組成。</li><li>決策結（decision node）、終止結（terminal node，附 payoff）。</li><li>若為同時決策，則以虛線或虛圈圈出同一資訊集合（information set）。</li><li>行動（action）vs. 策略（strategy）：</li><li>行動是物理選擇；策略是<strong>在每一個決策結/資訊集合下的完整行動計畫</strong>（contingent action plan）。</li><li>靜態賽局中策略與行動相同。</li></ul>\n<h4 class=\"sub3\">優勢策略（Dominant Strategy）</h4>\n<ul><li><strong>意義</strong>：不論對手採何策略，對自己都是最適的策略。</li><li><strong class=\"term\">嚴格優勢（strictly dominates）</strong>：對手所有策略下，<span class=\"fx\">S<sub>1</sub></span> 的報酬嚴格高於 <span class=\"fx\">S<sub>2</sub></span>。</li><li><strong class=\"term\">弱優勢（weakly dominates）</strong>：<span class=\"fx\">S<sub>1</sub></span> 報酬不會低於 <span class=\"fx\">S<sub>2</sub></span>。</li><li>若雙方都有嚴格優勢策略，則「嚴格優勢策略均衡」必為聶許均衡。</li></ul>\n<h4 class=\"sub3\">聶許均衡（Nash Equilibrium）</h4>\n<ul><li><strong>定義</strong>：在既定對手策略下，每個參賽者都已做最適選擇；沒有人想單方面改變策略。</li><li>性質：</li><li>優勢策略組合必為聶許均衡，但反過來不一定。</li><li>聶許均衡不一定唯一(p.445 例子：(Up, Go) 與 (Down, Walk) 兩個 NE)。</li><li>有時候純粹聶許均衡不存在。</li></ul>\n<h4 class=\"sub3\">囚犯的困境（Prisoner's Dilemma）</h4>\n<ul><li>範例(p.446)：A、B 兩人被隔離偵訊，可招供（Confess）或不招供（Deny）。</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th>A \\ B</th><th>招供</th><th>不招供</th></tr></thead><tbody><tr><td><strong>招供</strong></td><td><span class=\"fx\">-6,-6</span></td><td><span class=\"fx\">0,-9</span></td></tr><tr><td><strong>不招供</strong></td><td><span class=\"fx\">-9,0</span></td><td><span class=\"fx\">-1,-1</span></td></tr></tbody></table></div>\n<ul><li>A、B 的優勢策略都是「招供」，故 NE 為 (招供, 招供) <span class=\"fx\">=(-6,-6)</span>。</li><li>即使雙方都知道都不招供較佳（<span class=\"fx\">-1,-1</span>），但基於自利動機與互信缺乏，仍會得到最不利結果 → <strong>不合作賽局的重要特性</strong>。</li></ul>\n<h4 class=\"sub3\">動態賽局：逆推式求解（Backward Induction）</h4>\n<ul><li>基本結（Basic node）：每一分枝只有一個終止結。</li><li>瑣碎結（Trivial node）：基本結只有一個分枝。</li><li>複雜結：非基本結，每一分枝有多個終止結。</li><li>步驟：</li></ul>\n<ol><li>從終止結往前回推。</li><li>每個基本決策結上，找出決策者最適行動，刪除非最適分枝。</li><li>反覆直到賽局根。</li><li>收集各參賽者最適策略。</li></ol>\n<ul><li>範例（Y 先 Kiss/Hug，L 再 Run/Warning，payoff 見 p.443/447）：</li><li><span class=\"fx\">L<sub>1</sub></span>（Y 選 Kiss）下：Warning=0 > Run=<span class=\"fx\">-25</span>，故 L 選 Warning。</li><li><span class=\"fx\">L<sub>2</sub></span>（Y 選 Hug）下：Run=10 > Warning=0，故 L 選 Run。</li><li>Y 比較：Kiss→(43,0)、Hug→(40,10)，Y 選 <strong>Kiss</strong>。</li><li>子賽局完美聶許均衡（SPNE）：{Kiss, (Warning, Run)}。</li><li>完全訊息動態賽局下，逆推解必為聶許均衡。</li><li><strong class=\"term\">可信威脅（credible threat）vs. 不可信威脅（incredible threat）</strong>：把擴展型轉成標準型後可能找到多個 NE，必須用逆推/提煉（refinement）刪除不可信威脅，留下有約束力的威脅（binding threat）。</li><li>範例中 {Hug, (Run, Run)} 雖為 NE，但 L 在 Kiss 下選 Run 得 <span class=\"fx\">-25</span>，不如 Warning 得 0，故為不可信威脅，排除；唯一 SPNE 為 {Kiss, (W,R)}。</li></ul>\n<h4 class=\"sub3\">零和賽局與大小取捨</h4>\n<ul><li>零和賽局只需寫一人報酬（另一人為負）。</li><li><strong class=\"term\">大中取小（minimax）/ 小中取大（maximin）</strong>：保守原則。</li><li>範例(p.451)：</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th>A \\ B</th><th>B1</th><th>B2</th></tr></thead><tbody><tr><td>A1</td><td>4</td><td>9</td></tr><tr><td>A2</td><td>7</td><td>11</td></tr></tbody></table></div>\n<ul><li>A 小中取大：A1 最差 4、A2 最差 7 → 選 A2。</li><li>B 大中取小（損失）：B1 最多損 7、B2 最多損 11 → 選 B1。</li><li>均衡 (A2, B1)。</li></ul>\n<h4 class=\"sub3\">純粹策略與混和策略</h4>\n<ul><li><strong class=\"term\">純粹策略（Pure strategy）</strong>：一定選某策略；可能不存在純粹 NE。</li><li><strong class=\"term\">混和策略（Mixed strategy）</strong>：以某機率分配選策略；<strong>混和策略下必存在 NE</strong>。</li><li>範例（性別戰，p.454–p.455）：</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th>男 \\ 女</th><th>旅館 H</th><th>美術館 A</th></tr></thead><tbody><tr><td><strong>旅館 H</strong></td><td>(2,1)</td><td>(0,0)</td></tr><tr><td><strong>美術館 A</strong></td><td>(0,0)</td><td>(1,2)</td></tr></tbody></table></div>\n<ul><li>男以 <span class=\"fx\">p</span> 選旅館、女以 <span class=\"fx\">q</span> 選旅館：</li><li>男旅館期望 <span class=\"fx\">2q</span>、美術館期望 <span class=\"fx\">1-q</span>；<span class=\"fx\">2q=1-q⇒ q=1/3</span>。</li><li>女旅館期望 <span class=\"fx\">p</span>、美術館期望 <span class=\"fx\">2-2p</span>；<span class=\"fx\">p=2-2p⇒ p=2/3</span>。</li><li>反應函數交點除兩個純粹 NE（(旅館,旅館)、(美術館,美術館)）外，另有混和 NE (p=2/3<span class=\"mpunct\">,</span>q=1/3)。</li></ul>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div><div class=\"tblwrap\"><table style=\"width:300px\"><caption>同時賽局報償矩陣</caption><colgroup><col style=\"width:100px\"><col style=\"width:100px\"><col style=\"width:100px\"></colgroup><thead><tr><th></th><th>列者 L</th><th>列者 R</th></tr></thead><tbody><tr><th>行者 U</th><td>(列,行)</td><td>(列,行)</td></tr><tr><th>行者 D</th><td>(列,行)</td><td>(列,行)</td></tr></tbody></table></div><p class=\"figcap\">同時賽局用報償矩陣；動態賽局用賽局樹（root→UP/DOWN→終點標 payoff），相同資訊集以虛線連接。(p.430)</p></div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.17</strong>： (p.438)：一場賽局的組成不包含？<div class=\"opts\"><div>(A) pure strategy Nash equilibrium</div><div>(B) 每個結果的 payoff function</div><div>(C) 一組 players</div><div>(D) 一組 actions</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<strong>(A)</strong> 是解而非組成。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.18</strong>： (p.438)：賽局理論的獨特元素是？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<strong>rules, strategies, payoffs, outcomes</strong>。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.19</strong>： (p.451)：Dominant strategy 定義。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<strong>不論其他人採何策略，都能使自己得到最高報酬的策略</strong>。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.20</strong>： (p.452)：2×2 報償 (0,0)/(-15,15)/(15,-1)/(-100,100)，求 NE。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：對每格做最適反應，得 (0,0) 與 (15,-15)（對照選項）。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.21</strong>： (p.452)：Peter & John 搬重物矩陣：</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th>John \\ Peter</th><th>Work</th><th>Lazy</th></tr></thead><tbody><tr><td>Work</td><td>(4,4)</td><td>(-2,2)</td></tr><tr><td>Lazy</td><td>(2,-2)</td><td>(0,0)</td></tr></tbody></table></div>\n<p>求純粹 NE。書中解法要點：(Work,Lazy) 與 (Lazy,Work)。</p>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.22</strong>： (p.452)：囚犯困境均衡？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<strong>(D) 是 Nash 且雙方都招供</strong>。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.23</strong>： (p.453)：巴王借璧給蜀王的兩階段動態賽局<br>(1) 畫賽局樹並推論巴王是否借<br>(2) 加入王后為人質的再協議。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：逆推求解，比較可信威脅。（詳解見書末 QR）</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.24</strong>： (p.453)：戚總兵（火攻/水攻）先動、荒木大佐（備水龍/備沙袋）後動，payoff (10,-3)、(21,-9)、(7,-1)、(6,1)。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：畫樹後逆推。（詳解見書末 QR）</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.25</strong>： (p.454)：球隊 A 與球員 B 薪資談判：A 先決定加薪 1 萬或不加；不加時 B 決定留任或退休<br>(1) 擴展型找 SPNE<br>(2) 標準型找 NE<br>(3) 比較 NE 與 SPNE。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：動態賽局以 SPNE 為解。（詳解見書末 QR）</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.26</strong>： (p.456)：Chicken game：</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th>A \\ B</th><th>Stay</th><th>Swerve</th></tr></thead><tbody><tr><td><strong>Stay</strong></td><td><span class=\"fx\">(-3,-3)</span></td><td><span class=\"fx\">(2,0)</span></td></tr><tr><td><strong>Swerve</strong></td><td><span class=\"fx\">(0,2)</span></td><td><span class=\"fx\">(1,0)</span></td></tr></tbody></table></div>\n<p>(1) 純粹 NE<br>(2) 混和 NE。書中解法要點：純粹 NE 為 (Stay, Swerve)、(Swerve, Stay)；混和以期望報酬相等求機率。（詳解見書末 QR）</p>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.27</strong>： (p.456)：A、B 兩廠 green/Blue 報償 <span class=\"fx\">(5+a,5)</span>、(10<span class=\"mpunct\">,</span>20+b)、<span class=\"fx\">(20,10)</span>、<span class=\"fx\">(5,5)</span>。已知 B 用 <span class=\"fx\">Pr(green)=1/2</span> 求 <span class=\"fx\">a</span>；A 用 <span class=\"fx\">Pr(blue)=2/3</span> 求 <span class=\"fx\">b</span>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：混和 NE 下對手兩策略期望報酬相等。（詳解見書末 QR）</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>必考：2×2 矩陣找嚴格優勢策略、NE、SPNE、混和 NE。</li><li>囚犯困境、性別戰、Chicken game 三種經典賽局的 payoff 結構與均衡。</li><li>逆推法步驟 + 可信威脅 vs. 不可信威脅（與 Stackelberg 的「先動承諾」概念連結）。</li><li>完全訊息 vs. 完美訊息的詞意分辨。</li></ul>\n</div>\n</div>"}], "14": [{"id": "14.1", "title": "獨占性競爭廠商的特質(p.459–p.460)", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc17\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">獨占性競爭（Monopolistic competition）</div><div class=\"mc-body\"><div class=\"mc-formula\">由 Chamberlin E. 提出，介於完全競爭與獨占之間，同時具「獨占力」與「自由進出」的市場結構。</div><div class=\"mc-detail\">由 Chamberlin E. 提出，介於完全競爭與獨占之間，同時具「獨占力」與「自由進出」的市場結構。</div></div></div>\n<p class=\"def-note\">例子：街頭巷尾補習班、早餐店等「小而巧」的廠商。</p>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<p>六大特色：</p>\n<ol><li><strong>廠商家數很多、市占率很低，彼此沒有依存性</strong>。</li><li><strong>商品異質</strong>：廠商對價格有影響力，但商品間有很強的替代性。所謂異質是消費者「主觀上」認定有差異；長期下廠商數目 = 市場上商品種類數。</li><li><strong>長期不存在進入障礙</strong>：短期可能因廠房等無法立即進出，但長期可自由進出。</li><li><strong>主觀需求（Subjective demand, <span class=\"fx\">SD</span>）vs. 客觀需求（Objective demand, <span class=\"fx\">OD</span>）</strong>：</li></ol>\n<ul><li><span class=\"fx\">SD</span>：廠商自以為降價後需求量會大增（較平）。</li><li><span class=\"fx\">OD</span>：實際市場需求反應較陡（較陡），所有廠商同時降價時個別廠商賣不到想像的量。</li><li>真正市場反應落在 <span class=\"fx\">OD</span> 上。</li></ul>\n<ol><li><strong>長期下個別廠商只賺得正常利潤</strong>。</li><li><strong>對稱性假設</strong>：各廠商儘管產品異質，但有相同的需求函數與成本結構（代表性分析法）。</li></ol>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">L</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">W</text><line x1=\"80\" y1=\"230\" x2=\"360\" y2=\"120\" stroke=\"#b5542e\" stroke-width=\"2\"></line><text x=\"366\" y=\"124\" font-size=\"11\" fill=\"#b5542e\">AFC=S_L</text><line x1=\"130\" y1=\"230\" x2=\"360\" y2=\"70\" stroke=\"#6b4e8e\" stroke-width=\"2\"></line><text x=\"366\" y=\"74\" font-size=\"11\" fill=\"#6b4e8e\">MFC</text><path d=\"M100 60 Q200 130 360 200\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></path><text x=\"366\" y=\"200\" font-size=\"11\" fill=\"#1f3a5f\">MRP</text><circle cx=\"230\" cy=\"120\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"180\" y=\"112\" font-size=\"10\" fill=\"#1e7d32\">MFC=MRP 定Lm</text><line x1=\"230\" y1=\"120\" x2=\"230\" y2=\"185\" stroke=\"#6c7684\" stroke-dasharray=\"3 3\"></line><text x=\"236\" y=\"180\" font-size=\"10\" fill=\"#b5542e\">Wm（由供給線定）</text></svg><p class=\"figcap\">獨買：MFC 在供給線(AFC)上方；依 MFC=MRP 定�用量，再由供給線定工資，低於完全競爭。(p.490)</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 14.1</strong>： (p.460)：完全競爭與壟斷性競爭的差異僅在廠商數目多寡？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：錯，還有「產品同質 vs. 異質」的差異。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 14.2</strong>： (p.460)：何者不是壟斷性競爭市場特徵？<div class=\"opts\"><div>(A) 個別廠商為價格接受者</div><div>(B) 廠商利潤一定為零</div><div>(C) 可自由進入</div><div>(D) 可自由退出</div><div>(E) 生產異質產品</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<strong>(A) 個別廠商為價格接受者不是</strong>（它們面對負斜率需求線）。</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>與完全競爭的關鍵差異：產品異質（需求線負斜率 vs. 水平線）。</li><li>主觀 <span class=\"fx\">SD</span> 與客觀 <span class=\"fx\">OD</span> 兩條需求線的概念是 14.2 短期調整的基礎。</li></ul>\n</div>\n</div>"}, {"id": "14.2", "title": "獨占競爭廠商的短期均衡(p.461–p.462)", "body": "\n<p class=\"def-note\">獨占競爭廠商在短期有兩個目的：(1) 追求利潤極大；(2) 追求存貨消失（使主觀預期與客觀實際一致）。</p>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>利潤極大：</li></ul>\n<p><span class=\"fx\">\\max_\\Q\\π=P<sub>SD</sub>(Q,\\bar n)× Q-TC(Q), n 為常數</span></p>\n<p><span class=\"fx\">(∂π)/(∂ Q)=(∂[P<sub>SD</sub>(Q,\\bar n)× Q])/(∂ Q)-(∂ TC(Q))/(∂ Q)=0</span>(p.462)</p>\n<ul><li>短期均衡條件：</li></ul>\n<ol><li><span class=\"fx\">MR<sub>SD</sub>(Q<sup>*</sup>)=MC(Q<sup>*</sup>)</span>。</li><li><span class=\"fx\">MR'<sub>SD</sub>(Q<sup>*</sup>)\\lt MC'(Q<sup>*</sup>)</span>（二階條件）。</li><li><span class=\"fx\">OD</span> 與 <span class=\"fx\">SD</span> 於 <span class=\"fx\">P<sup>*</sup></span>、<span class=\"fx\">Q<sup>*</sup></span> 相交。</li><li>均衡點必須 <span class=\"fx\">P≥ AVC</span>。</li></ol>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>廠商先用主觀需求 <span class=\"fx\">SD</span> 導出 <span class=\"fx\">MR<sub>SD</sub></span>，按 <span class=\"fx\">MR<sub>SD</sub>=MC</span> 決定 <span class=\"fx\">Q<sub>SD</sub><sup>*</sup></span>、<span class=\"fx\">P<sup>*</sup></span>。</li><li>但市場真實購買量反應在 <span class=\"fx\">OD</span> 上，產量與實際消費量不一致 → 出現存貨（或缺貨）。</li><li>廠商調降 <span class=\"fx\">SD</span> 至 SD<span class=\"fx\">′</span>，重複上述流程，直到 <span class=\"fx\">SD</span> 與 <span class=\"fx\">OD</span> 相交於 <span class=\"fx\">MR<sub>SD</sub>=MC</span> 的產量上，短期均衡達成。</li><li>短期利潤可為正、零、負；小於零時只要 <span class=\"fx\">P≥ AVC</span> 仍續生產。</li><li><strong>短期下供給曲線不存在</strong>。</li></ul>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"90\" y1=\"50\" x2=\"380\" y2=\"190\" stroke=\"#1e7d32\" stroke-width=\"2\"></line><text x=\"386\" y=\"186\" font-size=\"10\" fill=\"#1e7d32\">SD</text><line x1=\"90\" y1=\"70\" x2=\"380\" y2=\"210\" stroke=\"#b5542e\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"></line><text x=\"386\" y=\"206\" font-size=\"10\" fill=\"#b5542e\">SD′</text><line x1=\"90\" y1=\"90\" x2=\"380\" y2=\"170\" stroke=\"#6b4e8e\" stroke-width=\"1.6\"></line><text x=\"386\" y=\"166\" font-size=\"10\" fill=\"#6b4e8e\">OD</text><line x1=\"180\" y1=\"230\" x2=\"260\" y2=\"80\" stroke=\"#1f3a5f\" stroke-width=\"1.8\"></line><text x=\"266\" y=\"84\" font-size=\"10\" fill=\"#1f3a5f\">MC</text><circle cx=\"230\" cy=\"140\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"238\" y=\"136\" font-size=\"9\" fill=\"#1e7d32\">Q*：MR_SD=MC</text></svg><p class=\"figcap\">斷折需求：主觀需求 SD 與客觀需求 OD 交於 Q*，MR 有缺口。(p.455)</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 14.3</strong>： (p.462)：短期下獨占性競爭廠商？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<strong>(D) can earn an economic profit</strong>（短期可有超額利潤）。</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>短期 <span class=\"fx\">SD</span> 與 <span class=\"fx\">OD</span> 必須相交；這是與獨占廠商最大的不同。</li><li>短期供給曲線不存在（與獨占同）。</li></ul>\n</div>\n</div>"}, {"id": "14.3", "title": "獨占性競爭廠商的長期均衡(p.463–p.468)", "body": "\n<p class=\"def-note\">長期下主觀需求與客觀需求重合；廠商可自由進出市場，故長期利潤為零。</p>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>一階條件：</li></ul>\n<p><span class=\"fx\">MR=MC</span></p>\n<ul><li>自由進出：</li></ul>\n<p><span class=\"fx\">π=0⇒ P=AR=LAC</span></p>\n<ul><li>長期均衡條件式：</li></ul>\n<p><span class=\"fx\">P=AR=LAC=SAC>MR=LMC=SMC</span>(p.463)</p>\n<ul><li>模型：</li></ul>\n<p><span class=\"fx\">\\max_\\Q\\π=P(Q,n)× Q-TC(Q)</span></p>\n<p><span class=\"fx\">(∂π)/(∂ Q)=(∂[P<sub>SD</sub>(Q,\\bar n)× Q])/(∂ Q)-(∂ TC(Q))/(∂ Q)=MR(Q,n)-LMC(Q)=0</span></p>\n<p><span class=\"fx\">π=0 ⇒ P(Q,n)-LAC(Q)=0</span>(p.463)</p>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>當有超額利潤 → 新廠商進入 → 個別廠商客觀需求左移、利潤下跌。</li><li>當有虧損 → 廠商退出 → 客觀需求右移、利潤上升。</li><li>直到長期均衡：個別廠商利潤為零，無廠商意願進出。</li><li>此時需求線與 <span class=\"fx\">LAC</span> <strong>相切於 <span class=\"fx\">LAC</span> 遞減處</strong>（而非最低點）。</li></ul>\n</div>\n<h4 class=\"sub3\">與完全競爭廠商的比較(p.464 表)</h4>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th></th><th>獨占性競爭</th><th>完全競爭</th></tr></thead><tbody><tr><td>相同</td><td>廠商家數很多；皆以利潤極大化為目標 <span class=\"fx\">MR=MC</span>；長期無進入障礙、只賺正常利潤 <span class=\"fx\">AR=AC</span></td><td>同左</td></tr><tr><td>相異 1</td><td>產品異質</td><td>產品同質</td></tr><tr><td>相異 2</td><td>面對負斜率需求線</td><td>面對水平需求線</td></tr><tr><td>相異 3</td><td><span class=\"fx\">P=AR>MR</span></td><td><span class=\"fx\">P=AR=MR</span></td></tr><tr><td>相異 4</td><td>資訊不完全</td><td>資訊完全</td></tr><tr><td>相異 5</td><td>價格偏高、數量偏少</td><td>價格較低、數量較多</td></tr><tr><td>相異 6</td><td><span class=\"fx\">P=AR=AC\\gt MR=MC</span></td><td>P=AR=AC=MR=MC</td></tr><tr><td>相異 7</td><td><span class=\"fx\">P>MC</span>，存在無謂損失</td><td><span class=\"fx\">P=MC</span>，社會福利最大</td></tr><tr><td>相異 8</td><td>產量小於最適規模，有<strong>超額產能</strong></td><td>產量為最適規模</td></tr><tr><td>相異 9</td><td>設備利用率不足</td><td>設備利用率最佳</td></tr><tr><td>相異 10</td><td>處於 <span class=\"fx\">LAC</span> 遞減階段</td><td>處於最適規模階段</td></tr></tbody></table></div>\n<h4 class=\"sub3\">超額產能（Excess Production Capacity）</h4>\n<ul><li>獨占性競爭廠商面對負斜率需求線，長期均衡點落在 <span class=\"fx\">LAC</span> 遞減處，而非 <span class=\"fx\">LAC</span> 最低點。</li><li>若提高產量可降低平均成本，但因需求線負斜率不會這麼做 → 閒置的產能即為超額產能（圖中 <span class=\"fx\">Q<sup>*</sup>\\bar Q'</span> 處）。</li><li>例子：不動產經紀公司閒置業務員、早餐店空座位。</li></ul>\n<h4 class=\"sub3\">重要性質(p.465)</h4>\n<ol><li>長期因自由進出只有正常利潤。</li><li>出現超額產能。</li><li>缺乏經濟效率。</li><li>帶來消費多樣化的效益。</li></ol>\n<h4 class=\"sub3\">主客觀需求不重合時的調整過程(p.467–p.468)</h4>\n<ul><li>廠商進入市場 → 客觀需求線左移；廠商退出 → 客觀需求線右移。</li><li>動態：短期 <span class=\"fx\">P<sub>1</sub>,Q<sub>1</sub>,SD<sub>1</sub>,OD<sub>1</sub>,π>0</span> → 新廠進入使 <span class=\"fx\">OD</span> 左移至 <span class=\"fx\">OD<sub>2</sub></span>，新短期均衡 <span class=\"fx\">SD<sub>2</sub></span> 交 <span class=\"fx\">OD<sub>2</sub></span> 於 <span class=\"fx\">Q<sub>2</sub></span>、<span class=\"fx\">P<sub>2</sub></span>；但廠商按 <span class=\"fx\">SD<sub>2</sub></span> 想降到 <span class=\"fx\">P<sub>2</sub>'</span> 增產，實際 <span class=\"fx\">OD<sub>2</sub></span> 使它面對虧損 → 廠商退出 → <span class=\"fx\">OD</span> 右移至 <span class=\"fx\">OD<sub>3</sub></span>。</li><li>直到 <span class=\"fx\">SD<sub>3</sub></span> 與 <span class=\"fx\">LAC</span> 相切、<span class=\"fx\">SD<sub>3</sub></span> 交 <span class=\"fx\">OD<sub>3</sub></span> 於 <span class=\"fx\">P<sup>*</sup>,Q<sup>*</sup>,π=0</span>，長期均衡達成。</li></ul>\n<h4 class=\"sub3\">一些競爭的概念(p.468)</h4>\n<ul><li><strong>競爭行為（Competitive behavior）</strong>：廠商間彼此牽制、互相「競價」的敵對行為。</li><li><strong>競爭性</strong>：個別廠商對市場價格的影響力；影響力越小越接近完全競爭。</li><li><strong>完全競爭市場結構</strong>：廠商對價格「完全」沒有影響力，但仍可有競爭性，須有可競爭之環境。</li><li><strong>可競爭市場理論（Contestable market theory）</strong>：</li><li>市場中無論既有廠商多少，只要可自由進出（潛在進入者面對相同成本結構）且可自由退出（退出不需太多成本），即為可競爭市場。</li><li>此時每家廠商行為如完全競爭，最後價格訂在 <span class=\"fx\">P=AC=MC</span>。</li><li>即使只有一家廠商，因潛在競爭者威脅，其行為仍像完全競爭而非獨占。</li></ul>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P</text><path d=\"M120 180 Q220 120 320 200\" fill=\"none\" stroke=\"#b5542e\" stroke-width=\"1.8\"></path><text x=\"326\" y=\"200\" font-size=\"11\" fill=\"#b5542e\">LAC</text><line x1=\"110\" y1=\"80\" x2=\"350\" y2=\"190\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></line><text x=\"356\" y=\"190\" font-size=\"11\" fill=\"#1f3a5f\">D=AR</text><line x1=\"110\" y1=\"80\" x2=\"230\" y2=\"230\" stroke=\"#6c7684\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"></line><text x=\"150\" y=\"215\" font-size=\"10\" fill=\"#6c7684\">MR</text><circle cx=\"230\" cy=\"145\" r=\"4\" fill=\"#1e7d32\"></circle><text x=\"180\" y=\"135\" font-size=\"11\" fill=\"#1e7d32\">切點(Q*,P*)：利潤=0</text></svg><p class=\"figcap\">獨占性競爭長期：D 切 LAC，P=LAC 無超額利潤。(p.450)</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 14.4</strong>： (p.465)：長期下獨占性競爭廠商經營於？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<strong>(D) some point along the downward sloping portion of its ATC</strong>（在 ATC 遞減段）。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 14.5</strong>： (p.465)：獨占性競爭廠商長期均衡時？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：長期 <span class=\"fx\">P=LAC</span> 且 <span class=\"fx\">P>LMC</span>（對照選項 B）。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 14.6</strong>： (p.465)：長期均衡下？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<strong>(B) <span class=\"fx\">P=LAC</span> 且 <span class=\"fx\">P>LMC</span></strong>。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 14.7</strong>： (p.465)：<span class=\"fx\">TC=Q<sup>3</sup>-6Q<sup>2</sup>+12Q</span>、長期價格 4，求長期均衡產量？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：長期 <span class=\"fx\">P=AC</span> 且 <span class=\"fx\">P=MR</span> 決定 <span class=\"fx\">Q</span>（詳解見書末 QR）。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 14.8</strong>： (p.466)：長期下獨占性競爭與完全競爭利潤？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<strong>(C) 兩者長期利潤皆為 0</strong>。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 14.9</strong>： (p.466)：Q=(30−2P)/n、<span class=\"fx\">Q=Min\\√ L,K<sup>2</sup>\\</span>、<span class=\"fx\">w=1</span>、<span class=\"fx\">r=10</span>，求長期 <span class=\"fx\">Q<sup>*</sup>,n<sup>*</sup></span>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：長期 <span class=\"fx\">P=AC=MC</span>，自由進出使 <span class=\"fx\">π=0</span>。（詳解見書末 QR）</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 14.10</strong>： (p.466)：<span class=\"fx\">Q=1/n-P</span>、<span class=\"fx\">TC=1+Q</span>，求 <span class=\"fx\">Q</span>、<span class=\"fx\">P</span>、<span class=\"fx\">n</span>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">MR=MC</span> 得最適 <span class=\"fx\">Q</span>，再由 <span class=\"fx\">π=0</span> 解 <span class=\"fx\">n</span>。（詳解見書末 QR）</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 14.11</strong>： (p.466)：獨占性競爭廠商長期訂價？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<strong>(D) price is equal to average total cost</strong>（長期 <span class=\"fx\">P=ATC</span>）。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 14.12</strong>： (p.467)：為何獨占性競爭無法達成生產效率與配置效率？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：長期在 <span class=\"fx\">LAC</span> 遞減段（非最低點）→ 無生產效率；<span class=\"fx\">P>MC</span> → 無配置效率。（詳解見書末 QR）</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 14.13</strong>： (p.467)：獨占性競爭相對於純競爭的好處？I. 低價 II. 多樣化商品 III. 提供資訊的廣告。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<strong>(D) II and III only</strong>。</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>必考：長期均衡條件 <span class=\"fx\">P=AR=LAC=SAC\\gt MR=LMC=SMC</span>。</li><li>切點位置：<span class=\"fx\">LAC</span> 遞減段（不是最低點）→ 超額產能。</li><li>與完全競爭長期的比較（<span class=\"fx\">P>MC</span> 有無謂損失 vs. <span class=\"fx\">P=MC</span> 福利最大）。</li><li>自由進出使 <span class=\"fx\">π=0</span> 的調整機制。</li><li>可競爭市場理論：即使一家廠商也會被潛在進入者威脅到 <span class=\"fx\">P=AC=MC</span>。</li></ul>\n</div>\n</div>"}], "15": [{"id": "15.1", "title": "前言（印刷頁 p.471–p.472）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc15\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">引申需求（Derived demand）</div><div class=\"mc-body\"><div class=\"mc-formula\">廠商對要素的需求，是透過要素投入所生產出來的商品會被消費者所需要，因此廠商進而需要這些要素來生產商品，故稱廠商對要素的需求為引申需求。</div><div class=\"mc-detail\">廠商對要素的需求，是透過要素投入所生產出來的商品會被消費者所需要，因此廠商進而需要這些要素來生產商品，故稱廠商對要素的需求為引申需求。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc16\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">最終需求（Final demand）</div><div class=\"mc-body\"><div class=\"mc-formula\">消費者透過消費商品直接獲取滿足感或滿足慾望，稱消費者對商品需求為最終需求。</div><div class=\"mc-detail\">消費者透過消費商品直接獲取滿足感或滿足慾望，稱消費者對商品需求為最終需求。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>家戶部門（商品需求者）最適條件：<span class=\"fx\">MRS<sub>XY</sub>=\\dfracP<sub>X</sub>P<sub>Y</sub></span>(p.471)</li><li>家戶部門（要素供給者）最適條件：<span class=\"fx\">MRS<sub>LY</sub>=\\dfracWP<sub>Y</sub></span>(p.471)</li><li>廠商部門（商品供給者）最適條件：<span class=\"fx\">MR=MC</span>(p.471)</li><li>廠商部門（要素需求者）最適條件：<span class=\"fx\">MRP<sub>L</sub>=MFC<sub>L</sub></span>、<span class=\"fx\">MRP<sub>K</sub>=MFC<sub>K</sub></span>(p.471)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>家戶部門決策目標：追求效用極大；廠商部門決策目標：追求利潤極大。</li><li>本章將要素的需求與供給合併討論，先介紹第十五章與前面章節對決策準則的差異，再針對不同情況市場進行討論。</li></ul>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 15.1</strong>： 題目：Which of the following is <strong>not</strong> an example of derived demand？選項含（A）人們想種花園→鋤頭需求增加；（B）演唱會門票熱賣→加開場次與售票員需求；（C）機器人使用增加→勞動需求減少；（D）玉米替代燃料發展→玉米需求增加。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：判斷何者並非「因商品需求而引申出要素需求」，詳解見書末 QR。</div></li></ul>\n</div>\n</div>"}, {"id": "15.2", "title": "要素市場追求利潤極大化（印刷頁 p.473–p.477）", "body": "\n<h4 class=\"sub3\">一、廠商之收入面</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li><strong>平均產值（Value of the average product, VAP）</strong>：平均每單位要素的商品收入。</li><li><strong>邊際產值（Value of the marginal product, VMP）</strong>：多僱用一單位要素，所增加商品的市場價值；為每單位勞動對廠商的貢獻。</li><li><strong>邊際生產收益（Marginal revenue product, MRP）</strong>：額外僱用一單位生產要素使得總產值或總收入的增加額。</li></ul>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>平均產值：<span class=\"fx\">VAP<sub>L</sub>=\\dfracTRL=\\dfracPQL=P× AP<sub>L</sub></span>(p.473)</li><li>邊際產值：<span class=\"fx\">VMP<sub>L</sub>=P× MP<sub>L</sub></span>(p.473)</li><li>邊際生產收益：<span class=\"fx\">MRP<sub>L</sub>=\\dfrac∂ TR[Q(L)]∂ L=\\dfrac∂ TR∂ Q×\\dfrac∂ Q∂ L=MR× MP<sub>L</sub></span>(p.473)</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li><strong>商品市場完全競爭</strong>：<span class=\"fx\">P=AR=MR</span>，故 <span class=\"fx\">VMP<sub>L</sub>=MRP<sub>L</sub></span>(p.473)。</li><li><strong>商品市場不完全競爭</strong>：<span class=\"fx\">P=AR>MR</span>，故 <span class=\"fx\">VMP<sub>L</sub>>MRP<sub>L</sub></span>(p.473)。</li><li>完全競爭下，價格 <span class=\"fx\">P</span> 為外生變數；當市場價格改變時，整條 <span class=\"fx\">VMP<sub>L</sub>=MRP<sub>L</sub></span> 線上移，但移動並非水平上移，而是<strong>比例上移</strong>(p.474)。</li><li>不完全競爭下，價格 <span class=\"fx\">P</span> 為廠商之內生變數；價格改變時，是 <span class=\"fx\">VMP<sub>L</sub></span> 及 <span class=\"fx\">MRP<sub>L</sub></span> <strong>線上點的移動</strong>(p.475)。</li><li>因 <span class=\"fx\">P</span> 下降幅度較 <span class=\"fx\">MR</span> 小，故 <span class=\"fx\">VMP<sub>L</sub></span> 下降幅度較 <span class=\"fx\">MRP<sub>L</sub></span> 小，<span class=\"fx\">VMP<sub>L</sub></span> 較為平坦(p.475)。</li></ul>\n<h4 class=\"sub3\">二、廠商之成本面</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li><strong>平均要素成本（Average factor cost, AFC）</strong>：平均每單位要素僱用量所需支付的成本，即實際付給勞動的工資。</li><li><strong>邊際要素成本（Marginal factor cost, MFC）</strong>：生產者增加一單位生產要素的僱用量，所支付總要素成本的增加額。</li></ul>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>平均要素成本：<span class=\"fx\">AFC=\\dfracTFCL=\\dfracWLL=W</span>(p.475)</li><li>邊際要素成本：<span class=\"fx\">MFC=\\dfrac∂ TFC∂ L</span>(p.475)</li><li>展開：<span class=\"fx\">MFC=\\dfrac∂ W(L)∂ LL+W(L)=W[1+\\dfrac1\\varnothing<sup>s</sup>]</span>(p.475)</li><li>其中 <span class=\"fx\">\\varnothing<sup>s</sup>=\\dfrac∂ L/∂ L∂ W/W=\\dfracWL\\dfrac∂ L∂ W</span> 為勞動的供給彈性：工資變動百分一時會使得勞動供給變動百分之幾(p.475)。</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li><strong>勞動市場完全競爭</strong>：廠商為市場要素價格之接受者，故 MFC=W=AFC，為水平線(p.476)。</li><li><strong>勞動市場不完全競爭</strong>：<span class=\"fx\">MFC=W[1+\\dfrac1\\varnothing<sup>s</sup>]>AFC</span>，<span class=\"fx\">MFC</span> 會比 <span class=\"fx\">AFC</span> 高；隨勞動僱用量增加，差距會拉大(p.476)。</li></ul>\n<h4 class=\"sub3\">三、要素市場利潤極大化條件式</h4>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>目標式：<span class=\"fx\">π=TR[Q(L)]-TC[Q(L)]</span>(p.477)</li><li>F.O.C.：<span class=\"fx\">\\dfrac∂π∂ L=\\dfrac∂ TR∂ L-\\dfrac∂ TFC∂ L=0 ⇒ MRP<sub>L</sub>=MFC<sub>L</sub></span>(p.477)</li><li>S.O.C.：<span class=\"fx\">\\dfrac∂<sup>2</sup>π∂ L<sup>2</sup>=\\dfrac∂ MRP<sub>L</sub>∂ L-\\dfrac∂ MFC<sub>L</sub>∂ L<0</span>(p.477)</li><li>若要素市場完全競爭，<span class=\"fx\">MFC<sub>L</sub>=AFC<sub>L</sub>=W</span> 為常數，<span class=\"fx\">\\dfrac∂ MFC<sub>L</sub>∂ L=0</span>，此時 <span class=\"fx\">\\dfrac∂ MRP<sub>L</sub>∂ L<0</span>，表示極大化利潤廠商的 <span class=\"fx\">MRP<sub>L</sub></span> 線必為負斜率(p.477)。</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>收入面兩圖：左圖（完全競爭）<span class=\"fx\">MRPL</span> 與 <span class=\"fx\">VMPL</span> 重合為一條由左上向右下傾斜的線；右圖（不完全競爭）<span class=\"fx\">VMPL</span> 較平坦、<span class=\"fx\">MRPL</span> 較陡，兩線皆負斜率。</li><li>成本面兩圖：左圖（完全競爭）MFC=AFC=W 為水平線；右圖（不完全競爭）<span class=\"fx\">AFC=W<sup>s</sup></span> 為正斜率供給線，<span class=\"fx\">MFC</span> 在 <span class=\"fx\">AFC</span> 上方且更陡。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 15.2</strong>： 題目：廠商多僱用一單位生產要素（例如勞動量）所能多獲得的收益，稱為？選項為（A）邊際產量（B）邊際產出（C）邊際產值（D）邊際收益。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：對照 MRP 定義，詳解見書末 QR。</div></li></ul>\n</div>"}, {"id": "15.3", "title": "要素市場均衡（印刷頁 p.478–p.485）", "body": "\n<h4 class=\"sub3\">一、商品市場完全競爭，要素市場完全競爭</h4>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>條件式：<span class=\"fx\">VMP<sub>L</sub>=MRP<sub>L</sub>=MFC<sub>L</sub>=AFC<sub>L</sub></span>(p.478)</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>座標軸：縱軸 <span class=\"fx\">W</span>、橫軸 <span class=\"fx\">L</span>。</li><li>曲線：水平線 <span class=\"fx\">MFC=ADFC=W<sup>*</sup></span>；負斜率線 <span class=\"fx\">MRP<sub>L</sub>=VMP<sub>L</sub></span>。</li><li>均衡點：兩線交點，對應僱用量 <span class=\"fx\">L<sup>*</sup></span>。</li><li>廠商要素需求線：當勞動市場完全競爭，廠商為價格接受者；要素需求線為 <span class=\"fx\">VAP<sub>L</sub></span> 最高點以下之 <span class=\"fx\">MRP<sub>L</sub></span> 線(p.478)。</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>當工資水準為 <span class=\"fx\">W<sub>1</sub></span> 時，廠商利潤最大的要素僱用量為 <span class=\"fx\">L<sub>1</sub></span>，利潤 <span class=\"fx\">π=VAP<sub>L1</sub>E<sub>1</sub>'L<sub>1</sub>O-W<sub>1</sub>E<sub>1</sub>'L<sub>1</sub>O<0</span>，廠商不會僱用要素。</li><li>當工資為 <span class=\"fx\">W<sub>2</sub></span>（剛好對應 <span class=\"fx\">VAP<sub>L</sub></span> 最高點），利潤 <span class=\"fx\">π=0</span>，可僱用也可不僱用（停止營業點）。</li><li>當工資為 <span class=\"fx\">W<sub>3</sub></span>，利潤 <span class=\"fx\">π=VAP<sub>L3</sub>E<sub>3</sub>'L<sub>3</sub>O-W<sub>3</sub>E<sub>3</sub>'L<sub>3</sub>O>0</span>，廠商會僱用要素生產。</li><li>市場給定要素價格大於 <span class=\"fx\">VAP<sub>L</sub></span>，就不會僱用要素生產。</li><li>因二階條件成立，<span class=\"fx\">MRP<sub>L</sub></span> 線必為負斜率；勞動需求不會出現違反需求法則，<strong>不會出現季芬要素（Giffen factor）</strong>(p.480)。</li></ul>\n<h4 class=\"sub3\">二、商品市場完全競爭，要素市場不完全競爭</h4>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>條件式：<span class=\"fx\">VMP<sub>L</sub>=MRP<sub>L</sub>=MFC>AFC</span>(p.481)</li><li>存在<strong>專買性剝削（monopsonistic exploitation）</strong>，<span class=\"fx\">uf</span> 為圖中 <span class=\"fx\">ab</span> 線段(p.481)。</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>座標軸：縱軸 <span class=\"fx\">W</span>、橫軸 <span class=\"fx\">L</span>。</li><li>曲線：<span class=\"fx\">MRP<sub>L</sub>=VMP<sub>L</sub></span>（負斜率）、<span class=\"fx\">AFC=W<sup>s</sup></span>（正斜率）、<span class=\"fx\">MFC</span>（正斜率且在 AFC 上方）。</li><li>均衡點：<span class=\"fx\">MFC</span> 與 <span class=\"fx\">MRP<sub>L</sub></span> 交點為 <span class=\"fx\">a</span>，決定 <span class=\"fx\">L<sup>*</sup></span>；由 <span class=\"fx\">AFC</span> 決定實付工資 <span class=\"fx\">W<sup>*</sup></span>（點 <span class=\"fx\">b</span>）。</li><li>剝削：每單位勞動對廠商貢獻反映在 <span class=\"fx\">VMP<sub>L</sub></span> 上為 <span class=\"fx\">\\overlineaL<sup>*</sup></span>；實際報酬反映在 <span class=\"fx\">AFC</span> 上為 <span class=\"fx\">\\overlinebL<sup>*</sup></span>；<span class=\"fx\">\\overlineab</span> 即專買性剝削。</li><li>當要素市場不是完全競爭，<span class=\"fx\">MRP<sub>L</sub></span> 並非廠商之要素需求線(p.481)。</li></ul>\n<h4 class=\"sub3\">三、商品市場不完全競爭，要素市場完全競爭</h4>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>條件式：<span class=\"fx\">VMP<sub>L</sub>>MRP<sub>L</sub>=MFC=AFC</span>(p.481)</li><li>存在<strong>單位專賣性剝削（monopolistic exploitation）</strong>(p.481)。</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>座標軸：縱軸 <span class=\"fx\">W</span>、橫軸 <span class=\"fx\">L</span>。</li><li>曲線：<span class=\"fx\">VMP<sub>L</sub></span>（負斜率、較平坦）、<span class=\"fx\">MRP<sub>L</sub></span>（負斜率、較陡）、水平線 <span class=\"fx\">MFC=AFC=W<sup>*</sup></span>。</li><li>均衡點：<span class=\"fx\">MRP<sub>L</sub></span> 與水平線交點為 <span class=\"fx\">b</span>，決定 <span class=\"fx\">L<sup>*</sup></span>；<span class=\"fx\">a</span> 在 <span class=\"fx\">VMP<sub>L</sub></span> 上。</li><li>剝削：每單位勞動貢獻為 <span class=\"fx\">\\overlineaL<sup>*</sup></span>；實付報酬為 <span class=\"fx\">\\overlinebL<sup>*</sup></span>；<span class=\"fx\">\\overlineab</span> 為商品市場專賣造成的剝削。</li></ul>\n<h4 class=\"sub3\">四、商品市場不完全競爭，要素市場不完全競爭</h4>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>條件式：<span class=\"fx\">VMP<sub>L</sub>>MRP<sub>L</sub>=MFC>AFC</span>(p.482)</li><li>同時存在專賣性剝削與專買性剝削，分別為圖中 <span class=\"fx\">\\overlineab</span> 與 <span class=\"fx\">\\overlinebc</span> 線段(p.482)。</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>同一圖上同時有 <span class=\"fx\">VMP<sub>L</sub></span>、<span class=\"fx\">MRP<sub>L</sub></span>、<span class=\"fx\">MFC</span>、<span class=\"fx\">AFC=W<sup>s</sup></span> 四條線；由上到下在 <span class=\"fx\">L<sup>*</sup></span> 處對應點分別為 <span class=\"fx\">a</span>、<span class=\"fx\">b</span>、<span class=\"fx\">c</span>。</li></ul>\n<h4 class=\"sub3\">五、勞動市場中雙邊獨占（Bilateral monopoly）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>當勞動市場中，只有一個勞動專買者（monopolistic buyer）也只有一個勞動專賣者（monopolistic seller），通常發生在勞動組織成工會，由工會代替勞工向雇主協商工資。</li><li>工會為工會成員謀福利之方式：(1) 與雇主協商較高工資；(2) 透過法令與規則降低勞動供給；(3) 透過限制進口或宣傳工會工廠之商品來提高勞動之引申需求(p.483)。</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>工會角度：把廠商的 <span class=\"fx\">MRP<sub>L</sub></span> 線當作面對工會的需求線 <span class=\"fx\">AR<sub>S</sub></span>，再導出 <span class=\"fx\">MR<sub>S</sub></span>；工會自身邊際成本線 <span class=\"fx\">MC<sub>s</sub>=AFC</span>；由 <span class=\"fx\">MC<sub>s</sub>=MR<sub>S</sub></span> 決定最適勞動供給量 <span class=\"fx\">L<sub>S</sub></span>，對應工資 <span class=\"fx\">W<sub>S</sub></span>。</li><li>廠商角度：把工會供給線 <span class=\"fx\">AFC</span> 當作面對的供給線，導出 <span class=\"fx\">MFC</span>，由 <span class=\"fx\">MRP<sub>L</sub>=MFC<sub>S</sub></span> 決定最適需求量 <span class=\"fx\">L<sup>*</sup></span>，對應工資 <span class=\"fx\">W<sup>*</sup></span>。</li><li>合併來看：廠商願意付出的工資率 <span class=\"fx\">W<sup>*</sup></span> 比工會要求得來的 <span class=\"fx\">W<sub>S</sub></span> 低；若無交易成本，雙方可經談判決定一個介於 <span class=\"fx\">W<sub>S</sub></span> 與 <span class=\"fx\">W<sup>*</sup></span> 之間的價格，實際位置視雙方相對議價力而定(p.484)。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 15.3</strong>： 題目：If there is only one variable input, the firm's demand curve for an input is obtained by multiplying（？）選項含 MP 與 MR 等。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：對照 <span class=\"fx\">MRP=MR× MP</span>，詳解見書末 QR。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 15.4</strong>： 題目：生產函數 <span class=\"fx\">Q=12L-L<sup>2</sup></span>、<span class=\"fx\">0≤ L≤ 6</span>，產品完全競爭市價 10 元。(1) 求勞動需求線；<br>(2) 當 <span class=\"fx\">W=40</span> 時僱用多少人？詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 15.5</strong>： 題目：A 君餐廳處完全競爭市場，表格列員工人數 0–5 與套餐份數 0/90/170/220/250/270；日薪 250 元、套餐售價 5 元。(1) 求邊際產值 VMP；<br>(2) 利潤極大下最適僱用人數。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 15.6</strong>： 題目：X 商品完全競爭，供需函數 <span class=\"fx\">Q<sub>X</sub><sup>D</sup>=18000-300P<sub>X</sub></span>、<span class=\"fx\">Q<sub>X</sub><sup>S</sup>=-7000+200P<sub>X</sub></span>；A 廠商短期固定 <span class=\"fx\">K=20</span>，<span class=\"fx\">TP<sub>L</sub>=10L-0.2L<sup>2</sup></span>，A 為 <span class=\"fx\">L</span> 唯一買主，<span class=\"fx\">L<sup>s</sup>=-10+0.5P<sub>L</sub></span>。(1) 求邊際生產收益量；<br>(2) 短期均衡僱用多少 <span class=\"fx\">L</span>；<br>(3) 何種剝削、多大？詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 15.7</strong>： 題目：獨占廠商需求 <span class=\"fx\">P=100-Q</span>，生產函數 <span class=\"fx\">Q=2L</span>，求勞動需求。選項含 <span class=\"fx\">w=200-8L</span>、<span class=\"fx\">w=200-4L</span>、<span class=\"fx\">w=100-L</span>、<span class=\"fx\">w=2L</span>。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 15.8</strong>： 題目：產品及勞動市場皆完全競爭，統一公司達利潤最大時，下列何者為非？選項含 <span class=\"fx\">VMP=P× MP</span>、<span class=\"fx\">P=W/MP</span>、<span class=\"fx\">MP=P/W</span>、<span class=\"fx\">VMP=W</span>。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 15.9</strong>： 題目：Which would cause a rightward shift in the labor demand curve？選項含 Manna from heaven、wage rise、marginal productivity rise、nonlabor income decline。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 15.10</strong>： 題目：勞動與資本為互補，若資本財價格上升，可推得勞動需求左移。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：互補要素價格變動之引申效果，詳解見書末 QR。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 15.11</strong>： 題目：<span class=\"fx\">MP<sub>N</sub>=400-0.2N</span>，勞動供給 <span class=\"fx\">500+10(1-τ)w</span>，<span class=\"fx\">τ=50\\%</span>，求稅前均衡工資率。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>"}, {"id": "15.4", "title": "成本最小與利潤最大條件式（印刷頁 p.486）", "body": "\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>假設：<span class=\"fx\">Q=Q(L)</span>、<span class=\"fx\">Q<sub>L</sub>=\\dfrac∂ Q∂ L>0</span>、<span class=\"fx\">\\dfrac∂<sup>2</sup> Q∂ L<sup>2</sup><0</span>；<span class=\"fx\">W=W(L)</span>(p.486)</li><li>目標：<span class=\"fx\">π=P(Q)Q-W(L)L</span></li><li>F.O.C.：<span class=\"fx\">MP<sub>L</sub>\\dfrac∂ P∂ QQ(L)+P[Q(L)]=MP<sub>L</sub>× MR=\\dfrac∂ W∂ LL+W</span>(p.486)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論（四種組合整理表）</div>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th></th><th>商品市場完全競爭 <span class=\"fx\">∂ P/∂ Q=0</span></th><th>商品市場獨賣 <span class=\"fx\">∂ P/∂ Q<0</span></th></tr></thead><tbody><tr><td><strong>要素市場完全競爭</strong> <span class=\"fx\">∂ W/∂ L=0</span></td><td><span class=\"fx\">MP<sub>L</sub>× P[Q(L)]=W</span><br><span class=\"fx\">P=\\dfracWMP<sub>L</sub>=MC</span></td><td><span class=\"fx\">MP<sub>L</sub>× MR=W</span><br><span class=\"fx\">MR=\\dfracWMP<sub>L</sub>=MC</span></td></tr><tr><td><strong>要素市場獨買</strong> <span class=\"fx\">∂ W/∂ L<0</span></td><td><span class=\"fx\">MP<sub>L</sub>× P[Q(L)]=\\dfrac∂ W∂ LL+W</span><br><span class=\"fx\">P=\\dfrac(∂ W)/(∂ L)L+WMP<sub>L</sub>=MC</span></td><td><span class=\"fx\">MP<sub>L</sub>× MR=\\dfrac∂ W∂ LL+W</span><br><span class=\"fx\">MR=\\dfrac(∂ W)/(∂ L)L+WMP<sub>L</sub>=MC</span></td></tr></tbody></table></div>\n<p>(p.486)</p>\n</div>\n</div>"}, {"id": "15.5", "title": "最低工資的影響（印刷頁 p.487–p.488）", "body": "\n<h4 class=\"sub3\">一、勞動市場完全競爭：會出現非自願失業</h4>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>座標軸：縱軸 <span class=\"fx\">W</span>、橫軸 <span class=\"fx\">L</span>。</li><li>曲線：正斜率勞動供給 <span class=\"fx\">W<sup>s</sup></span>、負斜率勞動需求 <span class=\"fx\">W<sup>d</sup></span>；原均衡點供需交點決定 <span class=\"fx\">W<sup>*</sup></span>、<span class=\"fx\">L<sup>*</sup></span>。</li><li>效果：政府訂定有效最低工資 <span class=\"fx\">\\overlineW</span>（高於 <span class=\"fx\">W<sup>*</sup></span>），勞動需求減少至 <span class=\"fx\">L<sup>d</sup></span>，勞動供給為 <span class=\"fx\">L<sup>s</sup></span>，出現超額供給，失業率提高。</li><li>失業量：<span class=\"fx\">L<sup>s</sup>-L<sup>d</sup></span>(p.487)。</li></ul>\n<h4 class=\"sub3\">二、勞動市場非完全競爭</h4>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>若勞動市場非完全競爭，廠商利用 <span class=\"fx\">MFC=MRP<sub>L</sub></span> 決策；當政府規定最低工資，如同訂定一個工資率強迫廠商接受，廠商轉變為工資接受者，以 <span class=\"fx\">\\overlineW=MRP<sub>L</sub></span> 決策，<strong>就業量會上升</strong>(p.487)。</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>座標軸：縱軸 <span class=\"fx\">W</span>、橫軸 <span class=\"fx\">L</span>。</li><li>曲線：<span class=\"fx\">MFC</span>（陡正斜率）、<span class=\"fx\">AFC</span>（正斜率）、<span class=\"fx\">MRPL</span>（負斜率）。</li><li>原均衡：<span class=\"fx\">MFC</span> 與 <span class=\"fx\">MRPL</span> 交點決定 <span class=\"fx\">L<sup>*</sup></span>；由 <span class=\"fx\">AFC</span> 決定 <span class=\"fx\">W<sup>*</sup></span>。</li><li>訂定最低工資 <span class=\"fx\">\\overlineW</span>：變成水平線與 <span class=\"fx\">MRPL</span> 交點決定 L<span class=\"fx\">′</span>，且 <span class=\"fx\">L'>L<sup>*</sup></span>。</li><li>通常低技術勞工或年輕勞工較接近完全競爭，最低工資或工會力量強大對這兩者影響較大(p.487)。</li></ul>\n<h4 class=\"sub3\">三、造成工資差異之原因</h4>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li><strong>經驗與工作能力之不同</strong>：新鮮人無經驗，工資率較低。</li><li><strong>工作環境不同</strong>：夜班、危險工作場所工資較高，稱為<strong>補償性工資差異（Compensation differential）</strong>(p.488)。</li></ul>\n</div>"}], "16": [{"id": "16.1", "title": "前言（印刷頁 p.491）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc13\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">部分均衡分析法（Partial equilibrium analysis）</div><div class=\"mc-body\"><div class=\"mc-formula\">僅考慮分析重點侷限於特定市場均衡，不考慮不同市場之間相互關聯或互相影響的分析。</div><div class=\"mc-detail\">僅考慮分析重點侷限於特定市場均衡，不考慮不同市場之間相互關聯或互相影響的分析。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc14\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">一般均衡分析法（General equilibrium analysis）</div><div class=\"mc-body\"><div class=\"mc-formula\">同時考慮對不同市場的影響，才能得到比較可靠的理論。</div><div class=\"mc-detail\">同時考慮對不同市場的影響，才能得到比較可靠的理論。</div></div></div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>本章先介紹不包含生產活動的交換經濟（Exchange economy），說明一般均衡中效率（Efficiency）、柏拉圖最適（Pareto optimum）、競爭均衡（Competitive equilibrium）等概念，爾後再擴展到包含生產活動的一般均衡模型(p.491)。</li></ul>\n</div>\n</div>"}, {"id": "16.2", "title": "交換經濟（印刷頁 p.492–p.498）", "body": "\n<h4 class=\"sub3\">一、為什麼要交換</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>兩人兩商品體系：<span class=\"fx\">A</span> 擁有原賦 <span class=\"fx\">(X<sub>A</sub>,Y<sub>A</sub>)</span>；<span class=\"fx\">B</span> 擁有原賦 <span class=\"fx\">(X<sub>B</sub>,Y<sub>B</sub>)</span>。</li><li><strong>慾望雙重巧合（Double coincident of want）</strong>：<span class=\"fx\">A</span> 對 <span class=\"fx\">X</span> 偏好程度低於 <span class=\"fx\">B</span> 對 <span class=\"fx\">X</span> 的偏好，或 <span class=\"fx\">A</span> 對 <span class=\"fx\">Y</span> 偏好高於 <span class=\"fx\">B</span> 對 <span class=\"fx\">Y</span> 的偏好，此時 <span class=\"fx\">A</span> 與 <span class=\"fx\">B</span> 有誘因進行交換以增進雙方利益。</li></ul>\n<h4 class=\"sub3\">二、專有名詞介紹</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li><strong>原賦配置（Initial endowment allocation）</strong>：雙方進行交易前所擁有的原始財貨量之配置關係。</li><li><strong>可行配置（Feasible allocation）</strong>：雙方可以進行的任意配置；每個財貨總和必須等於原始財富量總合，亦即箱子的長與寬，交換必須在箱子中進行。</li><li><strong>最終配置（Final allocation）</strong>：交易結束後的配置。</li><li><strong>互惠區（Region of mutual advantage）</strong>：雙方無異曲線所圍成的區域；在此區域中，可以在給定另一個人效用不變下，使另一個人變得更好(p.493)。</li></ul>\n<h4 class=\"sub3\">三、交換效率</h4>\n<h5 class=\"sub4\">模型假設</h5>\n<ul><li>經濟體系中僅有兩個經濟個體 <span class=\"fx\">A</span> 與 <span class=\"fx\">B</span>；原賦固定的兩種商品 <span class=\"fx\">XY</span>；<span class=\"fx\">X<sub>A</sub>+X<sub>B</sub>=\\overlineX</span>、<span class=\"fx\">Y<sub>A</sub>+Y<sub>B</sub>=\\overlineY</span>；兩種商品市場皆為完全競爭。</li></ul>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>模型：在給定 <span class=\"fx\">U<sub>B</sub></span> 效用值下，找 <span class=\"fx\">X<sub>A</sub>,Y<sub>A</sub></span> 使 <span class=\"fx\">U<sub>A</sub></span> 最大：</li><li><span class=\"fx\">\\max<sub>X<sub>A</sub>,Y<sub>A</sub>,X<sub>B</sub>,Y<sub>B</sub></sub> u<sub>A</sub>=U<sub>A</sub>(X<sub>A</sub>,Y<sub>A</sub>)</span></li><li><span class=\"fx\">s.t. u<sub>B</sub>=U<sub>B</sub>(X<sub>B</sub>,Y<sub>B</sub>)</span>、<span class=\"fx\">X<sub>A</sub>+X<sub>B</sub>=\\overlineX</span>、<span class=\"fx\">Y<sub>A</sub>+Y<sub>B</sub>=\\overlineY</span></li><li>拉格朗日：<span class=\"fx\">\\mathcalL=U<sub>A</sub>(X<sub>A</sub>,Y<sub>A</sub>)+λ[u<sub>B</sub>-U<sub>B</sub>(\\overlineX-X<sub>A</sub>,\\overlineY-Y<sub>A</sub>)]</span></li><li>F.O.C. 化簡得：</li><li><span class=\"fx\">\\dfrac∂ U<sub>A</sub>/∂ X<sub>A</sub>∂ U<sub>A</sub>/∂ Y<sub>A</sub>=\\dfrac∂ U<sub>B</sub>/∂ X<sub>B</sub>∂ U<sub>B</sub>/∂ Y<sub>B</sub> \\Leftrightarrow MRS<sub>A</sub>=MRS<sub>B</sub></span>(p.494)</li></ul>\n<h4 class=\"sub3\">四、柏拉圖最適（Pareto Optimum）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li><strong>柏拉圖最適</strong>：經濟社會已達到無法在使無人受害的情況下再使有人得利的境界。</li><li><strong>契約線（Contract curve）</strong>：所有滿足交換效率的點連接而成的線，即所有滿足 <span class=\"fx\">MRS<sub>A</sub>=MRS<sub>B</sub></span> 的點連接而成，且不一定會是直線。</li><li><strong>交易核（Transaction core）</strong>：在互惠區域中的契約線(p.494)。</li><li><strong>柏拉圖改善（Pareto improvement）</strong>：資源配置可使社會中至少一人變得更好，且在該人變更好之同時不會有人因而變得更差(p.495)。</li></ul>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>交換效率條件：<span class=\"fx\">MRS<sub>A</sub>=MRS<sub>B</sub></span>(p.494)</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>柏拉圖最適的四種等價說法：</li></ul>\n<ol><li>沒有任何方法可以讓所有人同時變好；</li><li>沒有任何方法可以在無人受害下讓有人得利；</li><li>所有交易利得會全消耗殆盡；</li><li>沒有互利的交易可以再進行(p.494)。</li></ol>\n<h5 class=\"sub4\">圖形概念（艾吉渥斯方形圖）</h5>\n<ul><li>座標軸：左下角為 <span class=\"fx\">0<sub>A</sub></span>，橫軸向右為 <span class=\"fx\">X<sub>A</sub></span>、縱軸向上為 <span class=\"fx\">Y<sub>A</sub></span>；右上角為 <span class=\"fx\">0<sub>B</sub></span>，橫軸向左為 <span class=\"fx\">X<sub>B</sub></span>、縱軸向下為 <span class=\"fx\">Y<sub>B</sub></span>。</li><li>原賦點 <span class=\"fx\">IE</span>：座標 <span class=\"fx\">(X<sub>A</sub>,Y<sub>A</sub>)</span> 同時也是 <span class=\"fx\">B</span> 的 <span class=\"fx\">(\\overlineX-X<sub>A</sub>,\\overlineY-Y<sub>A</sub>)</span>。</li><li>曲線：通過 <span class=\"fx\">IE</span> 的兩條無異曲線 <span class=\"fx\">U<sub>0A</sub></span>、<span class=\"fx\">U<sub>0B</sub></span> 所圍成的「互惠區」；契約線為連接所有 <span class=\"fx\">MRS<sub>A</sub>=MRS<sub>B</sub></span> 切點的曲線（由 <span class=\"fx\">0<sub>A</sub></span> 附近往 <span class=\"fx\">0<sub>B</sub></span> 附近延伸）。</li><li>移動方向：<span class=\"fx\">A</span> 的效用函數越往東北方移動、<span class=\"fx\">B</span> 的效用函數越往西南方移動，雙方效用都會增加(p.492)。</li></ul>\n<h4 class=\"sub3\">五、競爭均衡</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li><strong>瓦拉斯均衡（Walrasian Equilibrium）</strong>：經濟體系存在一組均衡價格 <span class=\"fx\">(P<sub>x</sub>,P<sub>y</sub>)</span>，或一個均衡相對價格 <span class=\"fx\">P<sub>x</sub>/P<sub>y</sub></span>，使得兩財貨市場不存在超額需求或超額供給（又稱市場結清）。</li></ul>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>均衡條件：<span class=\"fx\">MRS<sub>A</sub>=MRS<sub>B</sub>=\\dfracP<sub>X</sub>P<sub>Y</sub></span>(p.496)</li><li>瓦拉斯法則（Walras' law）：所有市場超額需求價值加總為零；若經濟社會存在 <span class=\"fx\">n</span> 個市場，當前面 <span class=\"fx\">n-1</span> 個市場已結清時，能保證最後第 <span class=\"fx\">n</span> 個市場必定結清。</li><li><span class=\"fx\">\\displaystyle∑<sub>i=1</sub><sup>n</sup>P<sub>i</sub>(Q<sub>i</sub><sup>d</sup>-Q<sub>i</sub><sup>s</sup>)=∑<sub>i=1</sub><sup>n</sup>P<sub>i</sub>ED<sub>i</sub>=0</span>(p.496)</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>艾吉渥斯方形圖中，通過原賦點 <span class=\"fx\">IE</span> 的一條直線（預算線），其斜率為 <span class=\"fx\">-P<sub>X</sub>/P<sub>Y</sub></span>；該線同時與 <span class=\"fx\">A</span>、<span class=\"fx\">B</span> 無異曲線相切於契約線上同一點，即競爭均衡點。</li></ul>\n<h4 class=\"sub3\">六、福利經濟學二大基本定理</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li><strong>第一基本定理（First theorem of welfare economics）</strong>：在市場機能運作狀態下達到瓦拉斯均衡（競爭均衡）時，經濟體系也必定達到柏拉圖最適。但達成柏拉圖最適不一定代表為瓦拉斯均衡——瓦拉斯均衡是眾多柏拉圖最適中可使市場結清的點（亞當·斯密「看不見的手」）(p.497)。</li><li><strong>第二基本定理（Second theorem of welfare economics）</strong>：在適當條件下，若能將原始原賦點做適當分配，市場機能自由運作下不但能達到柏拉圖最適，更能達到瓦拉斯均衡(p.498)。</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>在缺乏「瓦拉斯均衡存在且唯一」的假設下，第二定理必須修正成「當消費者的偏好滿足嚴格凸時，契約線上任何一點，在適當資源重分配下，均有成為瓦拉斯均衡的<strong>可能</strong>」，而非「必定」(p.498)。</li></ul>\n<h4 class=\"sub3\">七、效用可能曲線（Utility Possibility Frontier, UPF）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>所有滿足交換效率下兩人效用水準組合軌跡；或在給定一人效用不變下，另一個人所能達到的最大效用。UPF 上每一點都對應到消費契約線上一點(p.498)。</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>上圖：艾吉渥斯方形圖，繪出數條契約線上切點。</li><li>下圖：橫軸 <span class=\"fx\">U<sub>A</sub></span>、縱軸 <span class=\"fx\">U<sub>B</sub></span>，由上圖各切點投射出 UPF（負斜率、凹向原點）。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 16.1</strong>： (1) 30 個餅乾給 30 學生，何者為 Pareto efficient？選項含均分/全給一人/只分給女生/前 15 名給 2 個/以上皆可。<br>(2) 所謂 Pareto improvement 是指某人經濟福利改善而其他人？選項含消費者剩餘增加/減少/不變/所受損害小於福利改善程度。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 16.2</strong>： 兩人偏好相同，原賦 A:(100<span class=\"mpunct\">,</span>0)、B:(0<span class=\"mpunct\">,</span>100)；<span class=\"fx\">U<sub>A</sub>=X<sub>A</sub>Y<sub>A</sub></span>、<span class=\"fx\">U<sub>B</sub>=X<sub>B</sub>Y<sub>B</sub></span>。求 (1) 契約線、(2) 均衡交換價格。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 16.3</strong>： Sheldon <span class=\"fx\">U<sub>S</sub>=X<sub>S</sub><sup>1/4</sup>Y<sub>S</sub><sup>3/4</sup></span>、Leonard <span class=\"fx\">U<sub>L</sub>=X<sub>L</sub><sup>3/4</sup>Y<sub>L</sub><sup>1/4</sup></span>，原賦 <span class=\"fx\">E<sub>S</sub>=(60,60)</span>、<span class=\"fx\">E<sub>L</sub>=(60,60)</span>。求 (1) 契約線、(2) 競爭均衡價格與配置。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>"}, {"id": "16.3", "title": "生產經濟（印刷頁 p.499–p.505）", "body": "\n<h4 class=\"sub3\">一、模型用意</h4>\n<ul><li>討論經濟社會存在一個生產者與兩種生產要素時，如何依要素分配使得生產兩項產品產量達到最適。概念上類似交換經濟，但<strong>沒有原賦點</strong>。</li><li>假設：經濟體系有兩種生產要素 <span class=\"fx\">L</span>、<span class=\"fx\">K</span>；兩種商品 <span class=\"fx\">X</span>、<span class=\"fx\">Y</span>；<span class=\"fx\">L<sub>X</sub>+L<sub>Y</sub>=\\overlineL</span>、<span class=\"fx\">K<sub>X</sub>+K<sub>Y</sub>=\\overlineK</span>；兩種要素市場皆完全競爭(p.499)。</li></ul>\n<h4 class=\"sub3\">二、條件式</h4>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>生產效率條件：<span class=\"fx\">MRTS<sub>LK</sub><sup>X</sup>=MRTS<sub>LK</sub><sup>Y</sup></span>(p.499)</li><li>生產競爭均衡條件：<span class=\"fx\">MRTS<sub>LK</sub><sup>X</sup>=MRTS<sub>LK</sub><sup>Y</sup>=\\dfracWr</span>(p.499)</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>生產的艾吉渥斯方形圖：左下角為 <span class=\"fx\">0<sub>X</sub></span>、右上角為 <span class=\"fx\">0<sub>Y</sub></span>；橫軸 <span class=\"fx\">L</span>、縱軸 <span class=\"fx\">K</span>。</li><li>曲線：<span class=\"fx\">Q<sub>X</sub></span>、<span class=\"fx\">Q<sub>Y</sub></span> 為兩族等產量線；切點連線即為<strong>生產契約線</strong> <span class=\"fx\">O<sub>X</sub>O<sub>Y</sub></span>。</li></ul>\n<h4 class=\"sub3\">三、生產可能曲線（Production Possibility Curve, PPC）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>在給定資源稟賦與技術水準下，生產者所可能生產出來的最佳財貨組合軌跡，又稱生產可能前緣（Production Possibility Frontier）(p.500)。</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>假設：資源稟賦給定但用途不限；技術水準不變；只生產 <span class=\"fx\">X</span>、<span class=\"fx\">Y</span>；資源會充分利用使生產組合最大。</li><li>三種點：</li><li><span class=\"fx\">B</span> 點落在 PPC 上：<strong>技術效率點（Technology efficiency）</strong>；</li><li><span class=\"fx\">A</span> 點在 PPC 內部：<strong>技術不效率點（Technology inefficiency）</strong>；</li><li><span class=\"fx\">C</span> 點在 PPC 外部：<strong>技術不可能點（Unreachable point）</strong>(p.501)。</li></ul>\n<h4 class=\"sub3\">四、PPC 斜率與邊際轉換率</h4>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>數理推導（只勞動生產）：</li><li><span class=\"fx\">\\left.\\dfracdYdX|<sub>PPC</sub>=\\dfrac∂ F<sub>2</sub>/∂ L<sub>Y</sub>∂ F<sub>1</sub>/∂ L<sub>X</sub>\\dfracdL<sub>Y</sub>dL<sub>X</sub>=\\dfracMP<sub>L<sub>Y</sub></sub>(-dL<sub>X</sub>)MP<sub>L<sub>X</sub></sub>dL<sub>X</sub>=-\\dfracMP<sub>L<sub>Y</sub></sub>MP<sub>L<sub>X</sub></sub></span>(p.501)</li><li>上下同乘 <span class=\"fx\">W</span>：</li><li><span class=\"fx\">\\left.\\dfracdYdX|<sub>PPC</sub>=-\\dfracW/MP<sub>L<sub>X</sub></sub>W/MP<sub>L<sub>Y</sub></sub>=-\\dfracMC<sub>X</sub>MC<sub>Y</sub><0</span>(p.501)</li><li><strong>邊際轉換率（Marginal rate of transformation, MRT）</strong>：在給定資源稟賦與技術結構下，增加一單位 <span class=\"fx\">X</span> 之生產，必須犧牲 <span class=\"fx\">Y</span> 之產量；即生產 <span class=\"fx\">X</span> 之機會成本：</li><li><span class=\"fx\">MRT<sub>XY</sub>=-\\dfracdYdX=\\dfracMC<sub>X</sub>MC<sub>Y</sub></span>(p.502)</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>三種 PPC 型態：</li><li><span class=\"fx\">PPC<sub>1</sub></span>：隨 <span class=\"fx\">X</span> 上升切線越來越陡，故 <span class=\"fx\">MRT</span> 遞增，<strong>機會成本遞增</strong>；</li><li><span class=\"fx\">PPC<sub>2</sub></span>：切線不變，<span class=\"fx\">MRT</span> 不變，<strong>機會成本固定</strong>；</li><li><span class=\"fx\">PPC<sub>3</sub></span>：切線越來越平，<span class=\"fx\">MRT</span> 遞減，<strong>機會成本遞減</strong>(p.502)。</li></ul>\n<h5 class=\"sub4\">比較靜態分析</h5>\n<ul><li>生產 <span class=\"fx\">X</span> 技術進步：固定 <span class=\"fx\">Y</span> 最大產量，<span class=\"fx\">X</span> 最大產量向右移。</li><li>生產 <span class=\"fx\">Y</span> 技術進步：固定 <span class=\"fx\">X</span> 最大產量，<span class=\"fx\">Y</span> 最大產量向上移。</li><li>中性技術進步（<span class=\"fx\">X</span>、<span class=\"fx\">Y</span> 皆進步）：PPC 整條向外移(p.503)。</li></ul>\n<h4 class=\"sub3\">五、等收益線（Iso-revenue curve）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>在給定特定收益 <span class=\"fx\">TR</span> 及面對 <span class=\"fx\">X</span> 財價格 <span class=\"fx\">P<sub>X</sub></span> 與 <span class=\"fx\">Y</span> 財價格 <span class=\"fx\">P<sub>Y</sub></span> 下，生產者所能賣出的 <span class=\"fx\">X</span> 與 <span class=\"fx\">Y</span> 商品組合點軌跡(p.504)。</li></ul>\n<h5 class=\"sub4\">公式</h5>\n<ul><li><span class=\"fx\">TR=P<sub>X</sub>X+P<sub>Y</sub>Y</span>；<span class=\"fx\">dTR=P<sub>X</sub>dX+P<sub>Y</sub>dY=0</span>；<span class=\"fx\">\\dfracdYdX=-\\dfracP<sub>X</sub>P<sub>Y</sub></span>(p.504)</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>座標軸：縱軸 <span class=\"fx\">Y</span>、橫軸 <span class=\"fx\">X</span>；縱截距 <span class=\"fx\">TR/P<sub>Y</sub></span>、橫截距 <span class=\"fx\">TR/P<sub>X</sub></span>；斜率 <span class=\"fx\">-P<sub>X</sub>/P<sub>Y</sub></span>。</li></ul>\n<h4 class=\"sub3\">六、最適產出的決定</h4>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>一階（必要）條件：<span class=\"fx\">\\dfracP<sub>X</sub>P<sub>Y</sub>=\\dfracMC<sub>X</sub>MC<sub>Y</sub>=MRT</span>(p.505)</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>PPC 與等收益線 <span class=\"fx\">TR<sub>1</sub></span> 相切之點 <span class=\"fx\">A</span> 為最適產出 <span class=\"fx\">(X<sup>*</sup>,Y<sup>*</sup>)</span>；B 點雖在 PPC 上滿足技術效率，但收益 <span class=\"fx\">TR<sub>0</sub></span> 非最大(p.505)。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 16.4</strong>： 題目：If the opportunity cost of raising your economic grade is zero, you（？）選項含「studying too hard」、「must be on the PPC」、「must be inside the PPC」、「must be producing more of other goods than optimal」。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：零機會成本代表在 PPC 內部（閒置資源），詳解見書末 QR。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 16.5</strong>： 題目：橘子和蘋果邊際轉換率為 3 個橘子換 1 個蘋果，且 1 個蘋果相對價格為 2 個橘子，則廠商會？選項含生產更多蘋果/轉換生產方向等。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>"}, {"id": "16.4", "title": "全面均衡分析（印刷頁 p.506–p.515）", "body": "\n<h4 class=\"sub3\">一、前言</h4>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>當生產組合在 PPC 上時，生產會達到技術效率。</li><li>一旦生產組合點決定，也間接決定經濟社會的箱子大小；此時只要商品分配在契約線上，就能達到含生產活動的一般均衡體系中的柏拉圖最適(p.506)。</li></ul>\n<h4 class=\"sub3\">二、三個效率條件</h4>\n<h5 class=\"sub4\">公式</h5>\n<ol><li><strong>技術效率（生產要素配置效率）</strong>：<span class=\"fx\">MRTS<sub>LK</sub><sup>X</sup>=MRTS<sub>LK</sub><sup>Y</sup></span></li><li><strong>交換效率</strong>：<span class=\"fx\">MRS<sub>XY</sub><sup>A</sup>=MRS<sub>XY</sub><sup>B</sup></span></li><li><strong>全面效率</strong>（又稱配置效率 Allocation efficiency 或商品混合效率 efficiency in product mix）：</li></ol>\n<ul><li><span class=\"fx\">MRS<sub>XY</sub><sup>A</sup>=MRS<sub>XY</sub><sup>B</sup>=MRT<sub>XY</sub></span>(p.507)</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>上圖：PPC 上生產點 <span class=\"fx\">a</span> 決定 <span class=\"fx\">(\\overlineX,\\overlineY)</span>；艾吉渥斯方形圖中點 <span class=\"fx\">b</span> 與 a<span class=\"fx\">′</span> 為契約線上的切點。</li><li>幾何意義：生產 <span class=\"fx\">X</span> 的機會成本（PPC 斜率）必須等於 <span class=\"fx\">A</span>、<span class=\"fx\">B</span> 兩人主觀上願意放棄 <span class=\"fx\">Y</span> 換 <span class=\"fx\">X</span> 的數量（無異曲線斜率），此時才達到含生產活動的柏拉圖最適(p.506)。</li></ul>\n<h4 class=\"sub3\">三、瓦拉斯均衡下的條件整合</h4>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>生產均衡條件：<span class=\"fx\">\\dfracWr=MRTS<sub>LK</sub><sup>X</sup>=MRTS<sub>LK</sub><sup>Y</sup></span></li><li>交換均衡條件：<span class=\"fx\">\\dfracP<sub>X</sub>P<sub>Y</sub>=MRS<sub>XY</sub><sup>A</sup>=MRS<sub>XY</sub><sup>B</sup></span></li><li>完全競爭下：<span class=\"fx\">MC<sub>X</sub>=\\dfracWMP<sub>L</sub><sup>X</sup>=\\dfracrMP<sub>K</sub><sup>X</sup>=P<sub>X</sub></span>；<span class=\"fx\">MC<sub>Y</sub>=\\dfracWMP<sub>L</sub><sup>Y</sup>=\\dfracrMP<sub>K</sub><sup>Y</sup>=P<sub>Y</sub></span></li><li>整合：<span class=\"fx\">MRS<sub>XY</sub><sup>A</sup>=MRS<sub>XY</sub><sup>B</sup>=MRT<sub>XY</sub>=-\\left.\\dfracdYdX|<sub>PPC</sub>=\\dfracMC<sub>X</sub>MC<sub>Y</sub>=\\dfracP<sub>X</sub>P<sub>Y</sub></span>(p.508)</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>福利經濟學兩大基本定理在含生產活動的瓦拉斯均衡下仍然成立；透過看不見的手可達到柏拉圖最適，也能透過適當資源重分配來達到瓦拉斯最適(p.508)。</li></ul>\n<h4 class=\"sub3\">四、總效用可能曲線（Grand Utility Possibility Frontier, GUPF）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>描繪出符合交換與生產效率的所有效用組合軌跡。PPC 上每一生產點產生一個長寬不同的箱子，每個箱子可畫出一條 UPF；連接所有同時滿足 <span class=\"fx\">MRS<sub>XY</sub><sup>A</sup>=MRS<sub>XY</sub><sup>B</sup>=MRT<sub>XY</sub></span> 的點，即為 GUPF；GUPF 上每一點都滿足全面效率(p.509)。</li></ul>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>左圖：PPC 上生產點 <span class=\"fx\">a</span>、<span class=\"fx\">b</span> 分別對應不同長寬的箱子與契約線 <span class=\"fx\">\\overlineoa</span>、<span class=\"fx\">\\overlineob</span>。</li><li>右圖：橫軸 <span class=\"fx\">U<sub>A</sub></span>、縱軸 <span class=\"fx\">U<sub>B</sub></span>；<span class=\"fx\">UPF<sub>oa</sub></span>、<span class=\"fx\">UPF<sub>ob</sub></span> 為不同箱子對應的效用可能曲線；GUPF 為所有 UPF 的包絡線。</li></ul>\n<h4 class=\"sub3\">五、社會選擇理論</h4>\n<h5 class=\"sub4\">社會偏好函數之設定</h5>\n<p>##### (1) 公平主義（Egalitarian）</p>\n<ul><li><strong>消費量均等論</strong>：每個人都要有相同消費量，均衡點應在箱子長寬中點上。</li><li><strong>效用均等論</strong>：每個人獲得的效用都要相同，均衡點會在 GUPF 與 45° 線之交點(p.510)。</li></ul>\n<p>##### (2) 羅氏準則（Rawlsian criterion）</p>\n<ul><li>讓社會上最弱勢的族群達到效用最高的分配。</li><li><span class=\"fx\">S.W(U<sub>A</sub>,U<sub>B</sub>)=\\min(U<sub>A</sub>,U<sub>B</sub>)</span>(p.510)</li></ul>\n<p>##### (3) 古典功利主義（Utilitarian）準則</p>\n<ul><li>英國哲學家邊沁（Jeremy Bentham）提出，要求最多數人最多的幸福。</li><li><span class=\"fx\">S.W(U<sub>A</sub>,U<sub>B</sub>)=U<sub>A</sub>+U<sub>B</sub></span>；<span class=\"fx\">SW</span> 斜率為 <span class=\"fx\">-1</span>，均衡點發生在 GUPF 切線斜率為 <span class=\"fx\">-1</span> 處(p.511)。</li><li>一般化（不同人效用不同權重）：<span class=\"fx\">S.W(U<sub>A</sub>,U<sub>B</sub>)=α U<sub>A</sub>+(1-α)U<sub>B</sub></span>，<span class=\"fx\">0≤α≤ 1</span>(p.511)。</li></ul>\n<p>##### (4) 柏拉圖準則（Pareto criterion）</p>\n<ul><li>只要在 UPF 上皆滿足交換效率，若由 UPF 上任一點往右上方移動則可視為柏拉圖增進；反之若往右上方以外方向移動，則為柏拉圖無法比較(p.511)。</li></ul>\n<p>##### (5) 卡洛準則（Kaldor criterion）</p>\n<ul><li>只要獲利一方會對招致損失的一方予以補償，則結果會比原先情況還要好；此補償是否透過金錢支付則不重要(p.511)。</li></ul>\n<p>##### (6) 柏克遜-森謬爾森社會福利函數（Bergson-Samuelson）</p>\n<ul><li>在消費沒外部性下，<span class=\"fx\">S.W=S.W[U<sub>A</sub>(X<sub>A</sub>,Y<sub>A</sub>),U<sub>B</sub>(X<sub>B</sub>,Y<sub>B</sub>)]=S.W(X,Y)</span>。</li><li>社會福利極大：<span class=\"fx\">\\max<sub>X,Y</sub>S.W=S.W(X,Y)</span> s.t. <span class=\"fx\">\\overlineF=F(X,Y)</span>；均衡點發生在 <span class=\"fx\">SW</span> 與 PPC 相切點，切點上的相對價格即競爭均衡的相對價格(p.512)。</li></ul>\n<h4 class=\"sub3\">六、亞羅不可能定理（Arrow's Impossibility Theorem）</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li>透過多數決投票（majority voting）來說明社會選擇過程中所發生的基本困境。</li></ul>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li><strong>投票矛盾（The voting paradox）/孔多塞矛盾（Condorcet voting paradox）</strong>：</li><li>例：甲 <span class=\"fx\">A\\underlineGB\\underlineGC</span>、乙 <span class=\"fx\">B\\underlineGC\\underlineGA</span>、丙 <span class=\"fx\">C\\underlineGA\\underlineGB</span>。</li><li><span class=\"fx\">A</span> vs <span class=\"fx\">B</span>：甲丙認為 <span class=\"fx\">A</span> 比 <span class=\"fx\">B</span> 好，故 <span class=\"fx\">A\\underlineGB</span>。</li><li><span class=\"fx\">B</span> vs <span class=\"fx\">C</span>：甲乙認為 <span class=\"fx\">B</span> 比 <span class=\"fx\">C</span> 好，故 <span class=\"fx\">B\\underlineGC</span>。</li><li><span class=\"fx\">A</span> vs <span class=\"fx\">C</span>：乙丙認為 <span class=\"fx\">C</span> 比 <span class=\"fx\">A</span> 好，故 <span class=\"fx\">C\\underlineGA</span>。</li><li>違反遞移性；且可透過投票順序安排讓特定議案過關(p.513)。</li><li><strong>次序投票（Borda count）</strong>：給每人對不同議案一個數字，最喜歡給 1、次喜歡給 2……，加總後總值最低者為社會最喜歡。例：甲 <code>(1,2,3)</code>、乙 <code>(3,1,2)</code>、丙 <code>(1,3,2)</code>，加總 <code>(5,6,7)</code>，社會偏好順序 <span class=\"fx\">A\\underlineGB\\underlineGC</span>(p.513)。</li></ul>\n<h5 class=\"sub4\">亞羅四條件</h5>\n<ol><li><strong>無限制原則（Unrestricted）</strong>：任何滿足偏好基本性質的人都必須被採納在社會偏好中，接受所有形式的偏好。</li><li><strong>柏拉圖原則（Pareto principle）</strong>：必須社會中每個人都認為 A 議案優於 B 議案才行。</li><li><strong>獨立性（Independence）</strong>：A 與 B 議案的排列順序不會因為出現 C 議案而改變。</li><li><strong>非獨裁（Nondictatorship）</strong>：社會偏好的決定不能有某些特定人士的偏好來決定(p.514)。</li></ol>\n<h5 class=\"sub4\">重點與結論</h5>\n<ul><li>亞羅（Kenneth Arrow）證明：要找到一個同時滿足上述四個條件的社會偏好，幾乎是不可能的；即使滿足前三個條件，社會可能必會是一個獨裁的社會。一個合理的社會偏好決定卻與民主機制的精神有違背時，必須捨棄其中一些條件(p.514)。</li></ul>\n<h5 class=\"sub4\">例題摘要</h5>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 16.6</strong>： （110 清大計財）：三人看電影，偏好 A>B>C、B>C>A、C>A>B。若先對 A vs B 投，再對贏家 vs C 投，誰會贏？若先對 A vs C 投，再對贏家 vs B 投，誰會贏？這是什麼？選項含 B/C/impossibility、C/B/voting paradox、A/C/voting paradox、A/B/majority rule voting。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 16.7</strong>： Manyville 預算短缺，要從三運動（Hockey/Football/Basketball）中留一個；選民結構 Type A 20%（H>F>B）、Type B 42%（F>B>H）、Type C 38%（B>H>F）。行政長是籃球迷，要設計投票順序讓籃球勝出，應如何安排？選項含各種配對順序/不可能（Arrow）。詳解見書末 QR。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>"}], "17": [{"id": "17.1", "title": "前言（印刷頁 p.519–p.520）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc11\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">市場失靈（Market failure）</div><div class=\"mc-body\"><div class=\"mc-formula\">只要在市場自由運行情況下，若柏拉圖最適的三個條件任何一個環節無法成立，經濟效率就無法順利達成，進而產生市場失靈。</div><div class=\"mc-detail\">只要在市場自由運行情況下，若柏拉圖最適的三個條件任何一個環節無法成立，經濟效率就無法順利達成，進而產生市場失靈。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc12\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">不完全市場（Incomplete market）</div><div class=\"mc-body\"><div class=\"mc-formula\">某些市場可能不存在（如汙染權市場、戀愛市場、潔淨空氣市場）。</div><div class=\"mc-detail\">某些市場可能不存在（如汙染權市場、戀愛市場、潔淨空氣市場）。</div></div></div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>福利經濟學第一基本定理的成立，要求所有市場（商品、勞務、生產要素）必須完全競爭。</li><li>市場失靈兩大類型：</li></ul>\n<ol><li>市場可能並非完全競爭，導致買方與賣方價格議價能力不同；</li><li>某些市場可能不存在（不完全市場）。</li></ol>\n<ul><li>政府介入並非萬靈丹；政府與市場一樣並非全能全知，可能造成<strong>政府失靈（Government failure）</strong>。</li><li>本章重點：外部性（Externalities）所帶來的效率損失，及政府如何透過機制設計去糾正外部性(p.520)。</li></ul>\n</div>\n</div>"}, {"id": "17.2", "title": "外部性（Externalities）（印刷頁 p.521–p.527）", "body": "\n<h4 class=\"sub3\">一、定義</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li><strong>外部性</strong>：一個經濟個體（或單位）的行為，直接影響到另外一個經濟個體（或單位）的福利之現象；而較為口語的意義：在經濟行為使交易雙方得利的同時，也使得雙方以外的第三者承受利得或損失，而這些受影響第三者不需（或無法）針對其影響進行付費或求償(p.521)。</li></ul>\n<h5 class=\"sub4\">討論原則</h5>\n<ol><li>外部性必須至少牽扯到兩個（或以上）經濟個體；不一定是生產者對消費者，也能是消費者對消費者、消費者對生產者、生產者對生產者。</li><li>外部性可以是提高別人利益（正的外部性），也可以造成別人損失（負的外部性）。</li><li>外部性指的是生產或消費行為對其他經濟個體的「直接影響」，而非透過價格機能傳遞（透過價格機能調整後的不算外部性）。</li><li>外部性具有<strong>相互性（Reciprocal nature）</strong>，會牽扯到財產權（Property right）觀念(p.521)。</li></ol>\n<h4 class=\"sub3\">二、外部性的種類</h4>\n<h5 class=\"sub4\">分類</h5>\n<ul><li><strong>金融外部性（Pecuniary externalities）</strong>：由 Viner 所提出；透過市場價格機能調整，價格對福利水準產生影響，進而導致不同經濟個體之間實質所得的移轉(p.522)。</li><li><strong>技術外部性</strong>：經濟個體決策行為對他人發生影響，但並未透過價格機能反應，導致個人並未因為利他行為而得到報酬或因為損害他人行為而付出代價，使市場偏離資源配置效率的產出水準(p.522)。</li><li><strong>網路外部性（Network Externality）</strong>：當商品的消費人數增加，影響到個別消費者的需求線之效果；又稱消費外部性或需求外部性。一般具有兩種特性：</li></ul>\n<ol><li><strong>標準化</strong>：具有網路外部性的財貨必須考慮市場接受度及周邊商品相容性；</li><li><strong>內鎖效果（Lock-in effect）</strong>：由於標準化，長期使用及普及之下，即使後來有性能較佳的商品問世，原商品也不容易被取代(p.523)。</li></ol>\n<ul><li><strong>負的外部性（外部成本 External cost）</strong>：除了創造經濟行為雙方以外，有第三者因為此經濟行為被迫分擔的成本。實證例子：二手菸、空氣汙染與廢水排放、過度擁擠的道路、過度捕撈使資源枯竭、半夜飆車族吵鬧引擎聲(p.523)。</li><li><strong>正的外部性（外部利益 External benefit）</strong>：除了創造經濟行為雙方以外，有第三者因為此經濟行為而享受到的利益。實證例子：預防針施打免於傳染病、蜂農與果農的互惠、陽台種花花香四溢、科學園區群聚效應、教育普及讓不理性選民變少(p.523)。</li></ul>\n<h4 class=\"sub3\">三、出現外部性的決策依據與社會福利狀態</h4>\n<h5 class=\"sub4\">公式</h5>\n<ul><li>總社會福利（Total social benefit, TSB）= 總私人利益（TPB）+ 總外部利益（TEB）</li><li>總社會成本（Total social cost, TSC）= 總私人成本（TPC）+ 總外部成本（TEC）</li><li>社會福利 SW=TSB−TSC</li><li>私人利潤 <span class=\"fx\">π=TPB-TPC</span>(p.523)</li><li>社會最適 F.O.C.：</li><li>MSB(Q)=MPB(Q)+MEB(Q)=MPC(Q)+MEC(Q)=MSC(Q)(p.524)</li><li>個人利潤極大 F.O.C.：</li><li>MPB(Q)=MPC(Q)(p.525)</li></ul>\n<h5 class=\"sub4\">定義</h5>\n<ul><li><strong>MPB（Marginal private benefit）</strong>：增加一單位 <span class=\"fx\">Q</span> 的生產所增加的總個人利益。</li><li><strong>MEB（Marginal External benefit）</strong>：增加一單位 <span class=\"fx\">Q</span> 的生產所增加的總外部利益。</li><li><strong>MSB（Marginal social benefit）</strong>：MPB + MEB，邊際社會利益。</li><li><strong>MPC（Marginal private cost）</strong>：增加一單位 <span class=\"fx\">Q</span> 的生產所增加的總個人成本。</li><li><strong>MEC（Marginal External cost）</strong>：增加一單位 <span class=\"fx\">Q</span> 的生產所增加的總外部成本。</li><li><strong>MSC（Margi
