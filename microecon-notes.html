rmula\"><div class=\"clabel\">公式</div>\n<ul><li>長期利潤極大條件：P=AR=MR=LMC(p.352)。</li><li>長期零經濟利潤條件：<span class=\"fx\">TR=LTC</span>，即 P=AR=MR=LAC(p.352)。</li><li><strong>長期均衡完整條件</strong>：P=AR=MR=SAC=SMC=LAC=LMC(p.352)。</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:50.00%\"><col style=\"width:50.00%\"></colgroup><thead><tr><th>條件式</th><th>經濟意涵</th></tr></thead><tbody><tr><td><span class=\"fx\">P=AR=MR</span></td><td>廠商為價格接受者；產品同質</td></tr><tr><td><span class=\"fx\">AR=LAC</span></td><td>廠商無超額利潤，只有正常利潤</td></tr><tr><td><span class=\"fx\">MR=LMC</span></td><td>廠商追求利潤極大化</td></tr><tr><td><span class=\"fx\">LMC=LAC</span></td><td>廠商在最適規模下生產且無超額產能</td></tr><tr><td><span class=\"fx\">SAC=SMC</span></td><td>廠商短期時設備利用率最佳</td></tr><tr><td><span class=\"fx\">P=LMC</span></td><td>社會福利最大（<span class=\"fx\">D.L=0</span>）；柏拉圖最適</td></tr></tbody></table></div>\n</div>\n<h4 class=\"sub3\">數理模型(p.353)</h4>\n<ul><li><span class=\"fx\">\\Max_\\q\\π=Pq-LTC(q)</span></li><li>F.O.C：<span class=\"fx\">\\dfrac∂π∂ q=P-LMC(q)=0⇒ P=LMC(q)</span> 決定 <span class=\"fx\">q<sup>*</sup><sub>LR</sub></span>。</li><li>S.O.C：<span class=\"fx\">\\dfrac∂<sup>2</sup>π∂ q<sup>2</sup>=-LMC'(q<sup>*</sup>)<0⇒ LMC'(q<sup>*</sup>)>0</span>。</li><li>零利潤條件：<span class=\"fx\">P<sup>*</sup>=LAC(q<sup>*</sup>)</span>；綜合得 <span class=\"fx\">P<sup>*</sup>=LAC(q<sup>*</sup>)=LMC(q<sup>*</sup>)</span>，即 <span class=\"fx\">q<sup>*</sup></span> 出現在 <strong>LAC 最低點（最小效率規模，Minimum efficient scale）</strong>。</li></ul>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"90\" y1=\"230\" x2=\"380\" y2=\"200\" stroke=\"#b5542e\" stroke-width=\"2\"></line><line x1=\"200\" y1=\"230\" x2=\"380\" y2=\"180\" stroke=\"#b5542e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"></line><line x1=\"90\" y1=\"50\" x2=\"280\" y2=\"200\" stroke=\"#1e7d32\" stroke-width=\"2\"></line><line x1=\"160\" y1=\"50\" x2=\"360\" y2=\"210\" stroke=\"#1e7d32\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"></line><circle cx=\"185\" cy=\"160\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"150\" y=\"155\" font-size=\"9\" fill=\"#6b4e8e\">A</text><circle cx=\"280\" cy=\"170\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"286\" y=\"166\" font-size=\"9\" fill=\"#6b4e8e\">B</text><line x1=\"185\" y1=\"160\" x2=\"280\" y2=\"170\" stroke=\"#b5542e\" stroke-width=\"2\"></line><text x=\"200\" y=\"185\" font-size=\"9\" fill=\"#b5542e\">水平長期供給</text></svg><p class=\"figcap\">固定成本產業：需求右移，長期 LAC 不變，接 A、B 得水平長期產業供給線。(p.358)</p>\n<h4 class=\"sub3\">效率問題(p.355)</h4>\n<ul><li><strong>經濟效率（Economic efficiency）= 柏拉圖效率（Pareto efficiency）</strong>：資源配置已達無法在沒人受傷下讓任何人得利的境界（Pareto Optimality）。</li><li>社會福利最大條件：<span class=\"fx\">P=MU=LMC</span>（假設貨幣邊際效用 <span class=\"fx\">MU<sub>m</sub>=1</span>）。</li><li><strong>技術效率</strong>：廠商以最少量要素投入組合來生產特定產量。</li><li><strong>經濟效率</strong>：在產量給定下，以最小成本組合生產。</li><li>經濟效率必含技術效率；反之則不然。</li></ul>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.7</strong>： (p.354)：長期均衡條件對應：(1) 賺正常利潤→(D) LRAC=AR=P<br>(2) 社會福利最大→(B) MR=MC<br>(3) 利潤最大→(B) MR=MC<br>(4) 資源配置效率→(E) LRMC=LRAC<br>(5) 最適產能下生產→(E)。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.8</strong>： (p.354)：完全競爭產業，<span class=\"fx\">LTC=q<sup>2</sup>+10q+100</span>，總需求 <span class=\"fx\">Q=120-P</span>。求長期均衡價格、交易量及廠商家數。解法要點：LMC=2q+10，LAC=q+10+100/q，令 <span class=\"fx\">LMC=LAC</span> 得 <span class=\"fx\">q=10</span>，<span class=\"fx\">P=20</span>，<span class=\"fx\">Q=100</span>，<span class=\"fx\">n=10</span>。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.9</strong>： (p.354)：廠商在 efficient scale 生產時：<div class=\"opts\"><div>(A) AR 必大於 ATC 最低</div><div>(B) AR 必等於 ATC 最低</div><div>(C) AC 遞減</div><div>(D) AC 遞增。<strong>答案</div><div>(B) </strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.10</strong>： (p.354)：經濟學家說某財貨生產不足，通常意指：<div class=\"opts\"><div>(A) 非人人負擔得起</div><div>(B) P>MC</div><div>(C) CS=0</div><div>(D) 有些人想买卻買不到。<strong>答案</div><div>(B) </strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.11</strong>： (p.355)：何者均衡產出水準可滿足社會福利最大？<strong><div class=\"opts\"><div>(A) 完全競爭市場</strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.12</strong>： (p.355)：產出組合最有效率的條件，在於達成每項產品的：<div class=\"opts\"><div>(A) P=TC</div><div>(B) P=AC</div><div>(C) P=MC</div><div>(D) MR=MC。<strong>答案</div><div>(C) </strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.13</strong>： (p.356)：Q(p)=500−50P，200 家相同廠商，<span class=\"fx\">TC(q)=4+0.02nq+q<sup>2</sup></span><br>(1) 短期均衡各廠利潤？<br>(2) 長期廠商家數、各廠產量、MC？解法要點：(1) 短期 <span class=\"fx\">n=200</span> 代入<br>(2) 長期零利潤 <span class=\"fx\">P=LAC</span> 最低。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>長期均衡：P=MR=MC=AC（切在 LAC 最低點），經濟利潤 = 0。</li><li>完全競爭長期均衡滿足柏拉圖最適（<span class=\"fx\">P=MC</span>，無謂損失 <span class=\"fx\">DL=0</span>）。</li><li>最小效率規模 = LAC 最低點對應產量。</li></ul>\n</div>\n</div>"}, {"id": "11.5", "title": "長期供給曲線與產業供給曲線（印刷頁 357–360）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc26\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">市場</div><div class=\"mc-body\"><div class=\"mc-formula\">同質商品的買方與賣方集合。</div><div class=\"mc-detail\">同質商品的買方與賣方集合。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc27\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">產業</div><div class=\"mc-body\"><div class=\"mc-formula\">生產同質商品的廠商集合，即市場的供給面。</div><div class=\"mc-detail\">生產同質商品的廠商集合，即市場的供給面。</div></div></div>\n<h4 class=\"sub3\">個別廠商長期供給線</h4>\n<ul><li>個別完全競爭廠商的長期供給線為 <strong>LAC 最低點以上的 LMC 曲線</strong>(p.357)。</li></ul>\n<h4 class=\"sub3\">三種產業類型</h4>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th>產業類型</th><th>定義</th><th>長期產業供給線斜率</th></tr></thead><tbody><tr><td>固定成本產業（constant cost industries）</td><td>長期平均成本不隨產業規模變化</td><td><strong>水平</strong>（價格不變）</td></tr><tr><td>遞增成本產業（increasing cost industries）</td><td>長期平均成本隨產業規模擴大而上移（外部不經濟）</td><td><strong>正斜率</strong>（價格上升）</td></tr><tr><td>遞減成本產業（decreasing cost industries）</td><td>長期平均成本隨產業規模擴大而下移（外部經濟）</td><td><strong>負斜率</strong>（價格下降）</td></tr></tbody></table></div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div><svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"90\" y1=\"230\" x2=\"380\" y2=\"200\" stroke=\"#b5542e\" stroke-width=\"2\"></line><line x1=\"200\" y1=\"230\" x2=\"380\" y2=\"180\" stroke=\"#b5542e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"></line><line x1=\"90\" y1=\"50\" x2=\"280\" y2=\"200\" stroke=\"#1e7d32\" stroke-width=\"2\"></line><line x1=\"160\" y1=\"50\" x2=\"360\" y2=\"210\" stroke=\"#1e7d32\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"></line><circle cx=\"185\" cy=\"160\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"150\" y=\"155\" font-size=\"9\" fill=\"#6b4e8e\">A</text><circle cx=\"280\" cy=\"170\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"286\" y=\"166\" font-size=\"9\" fill=\"#6b4e8e\">B</text><line x1=\"185\" y1=\"160\" x2=\"280\" y2=\"170\" stroke=\"#b5542e\" stroke-width=\"2\"></line><text x=\"200\" y=\"185\" font-size=\"9\" fill=\"#b5542e\">平平长期体点</text></svg><p class=\"figcap\">固定成本產業：需求右移長期 LAC 不變，接 A、B 得水平長期供給線。(p.358)</p></div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.14</strong>： (p.360)：完全競爭產業長期供給線為正斜率，是因為：<div class=\"opts\"><div>(A) 外部不經濟</div><div>(B) 外部經濟</div><div>(C) 外部規模經濟</div><div>(D) 內部不經濟。<strong>答案</div><div>(A) </strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.15</strong>： (p.360)：長期下需求增加導致廠商家數增加、價格上升、且廠商有永久經濟利潤——此敘述對錯？解法要點：長期下自由進出使經濟利潤歸零，「永久經濟利潤」錯誤。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.16</strong>： (p.360)：成本遞增產業需求增加：<div class=\"opts\"><div>(A) 短期較高價格，長期下降到高於原來水準</div><div>(B) 短期有利潤但長期有損失</div><div>(C) 長期利潤增加</div><div>(D) 要素價格提高使 AC 下移。<strong>答案</div><div>(A) </strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>長期產業供給線斜率取決於產業擴張時要素價格的變化（外部經濟/不經濟）。</li><li>固定成本產業長期供給水平；遞增成本正斜率；遞減成本負斜率。</li></ul>\n</div>\n</div>"}, {"id": "11.6", "title": "政府對完全競爭廠商的管制（印刷頁 361–369）", "body": "\n<p class=\"def-note\">假設：固定成本產業，要素價格不變，焦點放在課稅本身。</p>\n<p class=\"def-note\">符號：<span class=\"fx\">P<sup>d</sup></span> 需求價格（消費者最高願付價格）；<span class=\"fx\">P<sup>s</sup></span> 供給價格（生產者最低願收價格）；<span class=\"fx\">P<sub>t</sub><sup>d</sup></span>、<span class=\"fx\">P<sub>t</sub><sup>s</sup></span> 為課稅後價格。</p>\n<h4 class=\"sub3\">一、定額稅（Lump sum tax）(p.361–362)</h4>\n<p><strong>模型</strong>：<span class=\"fx\">\\Max_\\q\\π=TR-LTC-\\barT=P<sup>d</sup>q-(LTC+\\barT)</span></p>\n<p><strong>一階條件</strong>：<span class=\"fx\">\\dfrac∂π∂ q=P<sup>d</sup>-LMC=0⇒ P<sup>d</sup>=LMC</span>(p.361)</p>\n<p><strong>曲線變化</strong>：</p>\n<ul><li><span class=\"fx\">LAC'=LAC+\\dfrac\\barTq</span>，課稅後 LAC<span class=\"fx\">′</span> 上移，最低點位置改變。</li><li><span class=\"fx\">\\dfrac∂ LAC'∂ q=\\dfrac∂ LAC∂ q-\\dfrac\\barTq<sup>2</sup>≠\\dfrac∂ LAC∂ q</span>(p.361)。</li><li>LMC<span class=\"fx\">′</span>=LMC，<strong>課徵定額稅不會影響 LMC</strong>。</li></ul>\n<p><strong>效果</strong>：</p>\n<ul><li>短期：LMC 不變→市場供給線不變→均衡產量與價格不變；廠商獨自負擔租稅。</li><li>長期：廠商在 LAC<span class=\"fx\">′</span> 最低點生產，個別產量 <span class=\"fx\">q<sub>1</sub>>q<sub>0</sub></span>；部分廠商退出，<span class=\"fx\">n</span> 下降，市場供給左移，價格 <span class=\"fx\">P<sub>1</sub></span> 上升；長期下廠商將定額稅完全轉嫁給消費者。</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"></colgroup><thead><tr><th>項目</th><th>課稅前</th><th>課稅後</th><th>變化</th></tr></thead><tbody><tr><td>市場價格</td><td><span class=\"fx\">P<sub>o</sub></span></td><td><span class=\"fx\">P<sub>1</sub></span></td><td>上升</td></tr><tr><td>市場產量</td><td><span class=\"fx\">Q<sub>o</sub></span></td><td><span class=\"fx\">Q<sup>*</sup></span></td><td>下降</td></tr><tr><td>個別產量</td><td><span class=\"fx\">q<sub>o</sub></span></td><td><span class=\"fx\">q<sub>1</sub></span></td><td>上升</td></tr><tr><td>廠商家數</td><td><span class=\"fx\">n<sub>o</sub></span></td><td><span class=\"fx\">n<sub>1</sub></span></td><td>下降</td></tr><tr><td>利潤</td><td>0</td><td>短期下降，長期為 0</td><td>—</td></tr></tbody></table></div>\n<h4 class=\"sub3\">二、從量稅（Specific / Quantity tax）(p.363–365)</h4>\n<p><strong>（一）對廠商課徵每單位 <span class=\"fx\">t</span> 之從量稅</strong></p>\n<p>模型：<span class=\"fx\">\\Max_\\q\\π=TR-LTC-tq=P<sup>d</sup>q-(LTC+tq)</span></p>\n<p>一階條件：<span class=\"fx\">P<sup>d</sup>=LMC'=LMC+t</span>(p.363)</p>\n<p>曲線變化：</p>\n<ul><li>LAC<span class=\"fx\">′</span>=LAC+t，垂直上移。</li><li>LMC<span class=\"fx\">′</span>=LMC+t，垂直上移，且與 <span class=\"fx\">LAC</span> 上移幅度相同。</li></ul>\n<p>效果：短期供給左移，價格上升 <span class=\"fx\">P<sub>d</sub>'</span>，廠商與消費者各負擔一部分（依供需彈性相對大小）；長期廠商退出，<span class=\"fx\">n</span> 下降，個別產量回到 <span class=\"fx\">q<sub>0</sub></span>，價格上升幅度等於 LMC<span class=\"fx\">′</span> 上移幅度，<strong>長期完全轉嫁給消費者</strong>。</p>\n<p><strong>（二）對消費者課徵每單位 <span class=\"fx\">t</span> 之從量稅</strong></p>\n<p>模型：<span class=\"fx\">\\Maxπ=TR<sub>t</sub>-LTC=P<sub>t</sub><sup>d</sup> q-LTC</span>，其中 <span class=\"fx\">P<sub>t</sub><sup>d</sup>=P<sup>d</sup>-t</span>(p.364)。</p>\n<p>成本結構不改變，但需求線垂直下移 <span class=\"fx\">t</span> 單位。短期價格下降至 <span class=\"fx\">P<sub>s</sub>'</span>，廠商與消費者分擔；長期價格 <span class=\"fx\">P<sub>1</sub></span> 上升，長期下從量稅完全轉嫁給消費者。</p>\n<h4 class=\"sub3\">三、從價稅（Value tax, Ad valorem tax）(p.366–369)</h4>\n<p><strong>（一）對消費者課徵每單位 <span class=\"fx\">t</span> 之從價稅</strong>（單位稅收為 <span class=\"fx\">tP<sup>d</sup></span>）</p>\n<p>模型：<span class=\"fx\">\\Maxπ=TR<sub>t</sub>-LTC=P<sub>t</sub><sup>d</sup> q-LTC</span>，其中 <span class=\"fx\">P<sub>t</sub><sup>d</sup>=P<sup>d</sup>-tP<sup>d</sup>=(1-t)P<sup>d</sup></span>(p.366)。</p>\n<p>一階條件：<span class=\"fx\">(1-t)P<sup>d</sup>=LMC</span>(p.366)。</p>\n<p>需求線固定橫軸截距並旋轉下移（斜率變為 <span class=\"fx\">(1-t)\\dfracdP<sup>d</sup>(Q)dQ</span>）。短期廠商與消費者分擔；長期廠商退出，價格上升幅度約等於從價稅幅度，<strong>長期完全轉嫁給消費者</strong>。</p>\n<p><strong>（二）對廠商課徵每單位 <span class=\"fx\">t</span> 之從價稅</strong>（單位稅收為 <span class=\"fx\">tP<sup>s</sup></span>）</p>\n<p>模型：<span class=\"fx\">\\Maxπ=TR-LTC-tP<sup>s</sup> q=P<sup>d</sup>q-(LTC+tP<sup>s</sup> q)</span>(p.367)。</p>\n<p>一階條件：<span class=\"fx\">P<sup>d</sup>=LMC+tP<sup>s</sup></span>；又 <span class=\"fx\">P<sup>s</sup>=LMC</span>，故 <span class=\"fx\">P<sup>d</sup>=LMC+tLMC=(1+t)LMC=(1+t)P<sup>s</sup></span>(p.367)。</p>\n<p>曲線變化：</p>\n<ul><li><span class=\"fx\">LAC'=LAC+tP<sup>s</sup></span>，上移。</li><li>LMC<span class=\"fx\">′</span>=(1+t)LMC，上移幅度隨 <span class=\"fx\">q</span> 增加而變大。</li></ul>\n<p><strong>從價稅效果比較</strong>(p.369)：</p>\n<ul><li>對消費者課：<span class=\"fx\">P<sub>1</sub><sup>d</sup>=\\dfrac11-t× MC</span>。</li><li>對廠商課：<span class=\"fx\">P<sub>2</sub><sup>d</sup>=(1+t)MC</span>。</li><li>比較：<span class=\"fx\">P<sub>1</sub><sup>d</sup>-P<sub>2</sub><sup>d</sup>=[\\dfrac11-t-(1+t)]× P<sup>s</sup>=\\dfract<sup>2</sup>1-tP<sup>s</sup>>0</span>(p.369)。</li><li>結論：對消費者課從價稅後的需求價格高於對廠商課從價稅後的需求價格，因此前者的市場均衡數量低於後者。</li></ul>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>定額稅：短期由廠商獨自負擔（LMC 不變）；長期完全轉嫁。</li><li>從量稅（對廠商或對消費者課）：長期下完全轉嫁給消費者；短期分擔比例取決於供需彈性。</li><li>從價稅：對消費者課與對廠商課效果不同，後者市場均衡數量較高。</li></ul>\n</div>\n</div>"}], "12": [{"id": "12.1", "title": "獨占市場的特色與進入障礙（印刷頁 373–375）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc24\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">獨占市場（Monopoly Market）</div><div class=\"mc-body\"><div class=\"mc-formula\">市場上只有一位生產者，面對眾多無法影響價格的消費者。</div><div class=\"mc-detail\">市場上只有一位生產者，面對眾多無法影響價格的消費者。廠商面對的需求曲線就是（負斜率的）市場需求曲線，故 <span class=\"fx\">P</span> 為 <span class=\"fx\">P(Q)</span>，是變數而非常數。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc25\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">Price maker（價格決定者）</div><div class=\"mc-body\"><div class=\"mc-formula\">獨占廠商可藉由控制價格來操控市場銷售量。</div><div class=\"mc-detail\">獨占廠商可藉由控制價格來操控市場銷售量。</div></div></div>\n<h4 class=\"sub3\">獨占廠商 vs 完全競爭廠商比較</h4>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th>比較項目</th><th>獨占廠商</th><th>完全競爭廠商</th></tr></thead><tbody><tr><td>廠商家數</td><td>只有一家</td><td>無限多家</td></tr><tr><td>對總體產業</td><td>(1) 代表整體產業 (2) Price maker (3) 面對需求線為負斜率 (4) 市場需求線為負斜率</td><td>(1) 對總體產業毫無影響力 (2) Price taker (3) 面對需求線為水平線 (4) 市場需求線為負斜率</td></tr><tr><td>替代品</td><td>不存在「近似的」替代品</td><td>產品同質</td></tr><tr><td>進入障礙</td><td>存在 entry barrier，長期保有超額利潤</td><td>不存在，長期只賺正常利潤</td></tr><tr><td>資訊</td><td>不完全</td><td>完全</td></tr></tbody></table></div>\n<h4 class=\"sub3\">進入障礙（Entry barrier）</h4>\n<ul><li><strong>定義</strong>：市場中存在某一特定機制，使得新廠商無法順利進入市場。</li></ul>\n<p><strong>形成原因</strong>：</p>\n<ol><li><strong>法令保護</strong>：政府法令、專利及智慧財產權保護。</li><li><strong>生產時出現相當大規模的規模經濟</strong> → <strong class=\"term\">自然獨占（natural monopoly）</strong>：</li></ol>\n<ul><li>廠商長期最適規模產量足以滿足市場需求。</li><li>特色：(a) 平均成本隨產量上升而遞減；(b) 高額啟動成本（Set-up cost），變動成本相對低，故 LAC 遞減。例如台灣高鐵、自來水公司。</li><li>平均成本遞減是自然獨占的<strong>充分條件而非必要條件</strong>；即使某產量後 LAC 已遞增，只要市場需求量不超過 <span class=\"fx\">Q<sub>LAC'</sub></span>，該廠商仍為自然獨占廠商。</li></ul>\n<ol><li><strong>握有稀有生產因素的控制</strong>。</li><li><strong>對特殊生產祕訣（Know-how）之掌握</strong>。</li><li><strong>多個廠商間相互勾結</strong>。</li><li><strong>商品的異質化</strong>：不存在近似替代品。</li></ol>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">AC</text><path d=\"M80 60 Q240 130 400 200\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></path><text x=\"386\" y=\"196\" font-size=\"11\" fill=\"#1f3a5f\">LAC 持續遞減</text><path d=\"M150 200 Q240 130 330 200\" fill=\"none\" stroke=\"#b5542e\" stroke-width=\"1.8\" stroke-dasharray=\"5 4\"></path><text x=\"300\" y=\"215\" font-size=\"10\" fill=\"#b5542e\">LAC′（U形）</text><text x=\"90\" y=\"90\" font-size=\"10\" fill=\"#6c7684\">大規模才有效率→自然獨占</text></svg><p class=\"figcap\">自然獨占：LAC 在市場需求範圍內仍遞減，一家廠商供給成本最低。(p.370)</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.1</strong>： (p.375)：自然獨占廠商具備何種生產結構？<div class=\"opts\"><div>(A) 外部性</div><div>(B) 利潤極大</div><div>(C) 規模報酬</div><div>(D) 規模經濟。<strong>答案</div><div>(D) </strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>獨占廠商是 price maker，面對負斜率需求線。</li><li>自然獨占成因：規模經濟（LAC 遞減）+ 高固定成本。</li><li>自然獨占 ⊃ 規模經濟（充分非必要條件）。</li></ul>\n</div>\n</div>"}, {"id": "12.2", "title": "獨占廠商的均衡（印刷頁 376–386）", "body": "\n<p class=\"def-note\">獨占廠商短期就算有虧損，也不得超過總固定成本，故必須滿足 <span class=\"fx\">P≥ AVC</span>。</p>\n<p class=\"def-note\">長期可獲得超額利潤，原因在於存在進入障礙，其他廠商無法進場瓜分。</p>\n<h4 class=\"sub3\">專有名詞</h4>\n<p><strong class=\"term\">（一）平均收益曲線（AR）</strong></p>\n<p><span class=\"fx\">AR=\\dfracTRQ=\\dfracPQQ=P(Q)</span>(p.376)</p>\n<ul><li>獨占廠商面對的需求曲線即為其平均收益線。</li></ul>\n<p><strong>（二）邊際收益（MR）——數理分析</strong>(p.376)</p>\n<p>因 <span class=\"fx\">P</span> 受產量 <span class=\"fx\">Q</span> 影響，微分須用乘法公式：</p>\n<p><span class=\"fx\">MR=\\dfracd(P(Q)Q)dQ=\\dfracdPdQQ+P\\dfracdQdQ=\\dfracdPdQ×\\dfracQP× P+P</span></p>\n<p><span class=\"fx\">MR=P(\\dfracdPdQ×\\dfracQP+1)=P[1-(-1)\\dfracdQdQ×\\dfracQP]=P(1-\\dfrac1E<sup>d</sup>)</span></p>\n<ul><li><span class=\"fx\">E<sup>d</sup>>1\\Leftrightarrow MR>0</span>：產量與收入同向變動。</li><li><span class=\"fx\">E<sup>d</sup>=1\\Leftrightarrow MR=0</span>：收入最高處（需求彈性等於 1 的位置，即需求線中點）。</li><li><span class=\"fx\">E<sup>d</sup><1\\Leftrightarrow MR<0</span>：產量與收入反向變動。</li></ul>\n<h4 class=\"sub3\">AR 與 MR 之關係（適用於 AR 為負斜率直線）(p.377)</h4>\n<p>若 P=AR=a−bQ（<span class=\"fx\">a,b>0</span>）：</p>\n<p><span class=\"fx\">MR=\\dfracdTRdQ=\\dfracd(aQ-bQ<sup>2</sup>)dQ</span></p>\n<p><span class=\"fx\">\\therefore MR=a-2bQ</span></p>\n<ul><li><strong>直線型 AR 下，MR 比 AR 陡，且斜率絕對值為 AR 之兩倍</strong>。</li><li>AR 橫軸截距為 <span class=\"fx\">a/b</span>；MR 橫軸截距為 <span class=\"fx\">a/(2b)</span>。</li><li>獨占廠商在沒有差別取價下，不會在需求彈性小於一（<span class=\"fx\">E<sup>d</sup><1</span>）處生產。</li></ul>\n<h4 class=\"sub3\">獨占廠商均衡分析(p.378)</h4>\n<p><strong>F.O.C</strong>：</p>\n<p><span class=\"fx\">\\Max_\\Q\\π=TR-TC</span></p>\n<p><span class=\"fx\">\\dfrac∂π∂ Q=\\dfrac∂ TR∂ Q-\\dfrac∂ TC∂ Q=0</span></p>\n<p><span class=\"fx\">⇒ MR(Q)=MC(Q)</span>，解 <span class=\"fx\">Q<sup>*</sup></span>。</p>\n<p><strong>S.O.C</strong>：</p>\n<p><span class=\"fx\">\\dfrac∂<sup>2</sup>π∂ Q<sup>2</sup>=MR'(Q<sup>*</sup>)-MC'(Q<sup>*</sup>)<0</span></p>\n<p><span class=\"fx\">\\therefore MR'(Q<sup>*</sup>)\\lt MC'(Q<sup>*</sup>)</span>(p.378)。</p>\n<p><strong>停業條件</strong>：短期若 <span class=\"fx\">P≤ AVC</span> 則關門，<span class=\"fx\">Q<sup>*</sup>=0</span>；長期若 <span class=\"fx\">P≤ LAC</span> 則關門，<span class=\"fx\">Q<sup>*</sup>=0</span>。</p>\n<p><strong>代入 MR 公式</strong>：</p>\n<p><span class=\"fx\">P<sup>*</sup>=\\dfracMC(Q<sup>*</sup>)(1-\\dfrac1E<sup>d</sup>)=\\dfrac1(1-\\dfrac1|E<sup>d</sup>|)× MC(Q<sup>*</sup>)</span></p>\n<p><span class=\"fx\">P(Q<sup>*</sup>)>MR(Q<sup>*</sup>)=MC(Q<sup>*</sup>)</span>(p.378)。</p>\n<ul><li>此即<strong class=\"term\">加成訂價法（Markup pricing / Markup pricing over marginal cost）</strong>，又稱<strong class=\"term\">單一價格定價（Single Price Policy）</strong>。</li></ul>\n<p><strong>MR=MC 的直覺</strong>：</p>\n<ul><li>若 <span class=\"fx\">MR(Q<sub>1</sub>)>MC(Q<sub>1</sub>)</span>：增產所增加收入大於成本，應增產。</li><li>若 <span class=\"fx\">MR(Q<sub>2</sub>)\\lt MC(Q<sub>2</sub>)</span>：增產所增加收入小於成本，應減產。</li><li>故 <span class=\"fx\">MR=MC</span> 時無誘因改變產量。</li></ul>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"80\" y1=\"50\" x2=\"380\" y2=\"200\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></line><text x=\"386\" y=\"200\" font-size=\"12\" fill=\"#1f3a5f\">D=AR</text><line x1=\"80\" y1=\"50\" x2=\"230\" y2=\"230\" stroke=\"#b5542e\" stroke-width=\"2\"></line><text x=\"150\" y=\"200\" font-size=\"11\" fill=\"#b5542e\">MR</text><line x1=\"150\" y1=\"230\" x2=\"330\" y2=\"80\" stroke=\"#1e7d32\" stroke-width=\"2.2\"></line><text x=\"336\" y=\"82\" font-size=\"12\" fill=\"#1e7d32\">MC</text><circle cx=\"205\" cy=\"180\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"150\" y=\"172\" font-size=\"10\" fill=\"#6b4e8e\">MR=MC 定 Qm</text><line x1=\"205\" y1=\"180\" x2=\"205\" y2=\"230\" stroke=\"#6c7684\" stroke-dasharray=\"3 3\"></line><text x=\"190\" y=\"245\" font-size=\"10\" fill=\"#6b4e8e\">Qm</text><circle cx=\"205\" cy=\"112\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"212\" y=\"108\" font-size=\"10\" fill=\"#b5542e\">Pm(由D)</text><polygon points=\"205,180 260,150 260,195\" fill=\"rgba(181,84,46,0.25)\" stroke=\"#b5542e\"></polygon><text x=\"266\" y=\"170\" font-size=\"10\" fill=\"#b5542e\">無謂損失</text></svg><p class=\"figcap\">獨占：MR 在 D 下方、橫軸截距為一半；MR=MC 定 Qm，垂直上 D 得 Pm；相對完全競爭有無謂損失。(p.380)</p>\n</div>\n<h4 class=\"sub3\">短期 AC 曲線與獨占均衡的關係(p.381)</h4>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"></colgroup><thead><tr><th>AC 位置</th><th>產量</th><th>定價</th><th>利潤</th></tr></thead><tbody><tr><td><span class=\"fx\">AC<sub>1</sub></span></td><td><span class=\"fx\">Q<sup>*</sup></span></td><td><span class=\"fx\">P<sup>*</sup></span></td><td>超額利潤</td></tr><tr><td><span class=\"fx\">AC<sub>2</sub></span></td><td><span class=\"fx\">Q<sup>*</sup></span></td><td><span class=\"fx\">P<sup>*</sup></span></td><td>正常利潤</td></tr><tr><td><span class=\"fx\">AC<sub>3</sub></span></td><td><span class=\"fx\">Q<sup>*</sup></span></td><td><span class=\"fx\">P<sup>*</sup></span></td><td>虧損</td></tr></tbody></table></div>\n<ul><li>固定成本變動使 AC 移動，MC 不變，故最適產量 <span class=\"fx\">Q<sup>*</sup></span> 不變。</li></ul>\n<h4 class=\"sub3\">與完全競爭之比較——社會福利(p.382)</h4>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th></th><th>完全競爭</th><th>獨占</th></tr></thead><tbody><tr><td><span class=\"fx\">P</span></td><td><span class=\"fx\">P<sup>*</sup></span></td><td>P<span class=\"fx\">′</span></td></tr><tr><td><span class=\"fx\">Q</span></td><td><span class=\"fx\">Q<sup>*</sup></span></td><td>Q<span class=\"fx\">′</span></td></tr><tr><td>C.S</td><td>1.2.3.5.7</td><td>1.2</td></tr><tr><td>P.S</td><td>4.6.8</td><td>3.4.5.6</td></tr><tr><td>S.W</td><td>1.2.3.4.5.6.7.8</td><td>1.2.3.4.5.6</td></tr><tr><td>D.L</td><td>—</td><td>7.8</td></tr></tbody></table></div>\n<ul><li>獨占透過剝奪消費者剩餘提高自身利潤或生產者剩餘。</li><li><strong>社會福利最大條件</strong>：<span class=\"fx\">MU=P=MC</span>(p.383)。</li><li>獨占在未進行第一、二級差別取價下 <span class=\"fx\">P>MC</span>，故<strong>非社會福利極大化</strong>，有無謂損失。</li></ul>\n<h4 class=\"sub3\">獨占廠商不存在供給曲線(p.384)</h4>\n<ul><li>獨占廠商的價格與數量是在利潤極大化時同時決定的，價格與數量皆為內生變數。</li><li>對一個不同的市場需求狀況可得另一組供給量與價格，無法在「其他情況不變」下，面對不同價格找到對應供給量。</li><li>因此<strong>獨占廠商沒有供給曲線</strong>。</li></ul>\n<h4 class=\"sub3\">多工廠獨占(p.385–386)</h4>\n<ul><li>假設獨占廠商有兩個工廠，產量分別為 <span class=\"fx\">Q<sub>1</sub></span>、<span class=\"fx\">Q<sub>2</sub></span>。</li><li>利潤函數：<span class=\"fx\">π=TR(Q<sub>1</sub>+Q<sub>2</sub>)-TC<sub>1</sub>(Q<sub>1</sub>)-TC<sub>2</sub>(Q<sub>2</sub>)</span>。</li><li>極大化：<span class=\"fx\">\\dfrac∂π∂ Q<sub>1</sub>=MR(Q<sub>1</sub>+Q<sub>2</sub>)-MC<sub>1</sub>(Q<sub>1</sub>)=0</span>；<span class=\"fx\">\\dfrac∂π∂ Q<sub>2</sub>=MR(Q<sub>1</sub>+Q<sub>2</sub>)-MC<sub>2</sub>(Q<sub>2</sub>)=0</span>。</li><li><strong>均衡條件</strong>：<span class=\"fx\">MR(Q<sub>1</sub>+Q<sub>2</sub>)=MC<sub>1</sub>(Q<sub>1</sub>)=MC<sub>2</sub>(Q<sub>2</sub>)</span>(p.386)。</li></ul>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.2</strong>： (p.380)：獨占廠商 TC=100+16Q，需求 <span class=\"fx\">P=80-4Q</span>。求利潤極大數量與利潤。解法要點：<span class=\"fx\">MR=80-8Q</span>，<span class=\"fx\">MC=16</span>，令 <span class=\"fx\">MR=MC</span> 得 <span class=\"fx\">Q=8</span>，<span class=\"fx\">P=48</span>，<span class=\"fx\">π=TR-TC=384-228=156</span>。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.3</strong>： (p.380)：(i) 競爭廠商多賣一單位收益增加小於價格；(ii) 獨占廠商多賣一單位收益增加小於價格；(iii) AR=P 對兩種廠商都成立。何者正確？<strong>答案 (D) (ii) and (iii) only</strong>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.4</strong>： (p.380)：(1) 長期均衡下 P=2MC，求需求彈性？解法要點：由 P=MC/(1−1/∣E∣) 得 <span class=\"fx\">1-1/|E|=1/2</span>，<span class=\"fx\">|E|=2</span>。<br>(2) MR=$20，$E^d=-2.0，求profit−maximizingprice？解法要點：MR=P(1-1/|E|)=P(1-1/2)=P/2=20，P=40$。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.5</strong>： (p.380)：獨占廠商利潤極大在需求線的何段？<div class=\"opts\"><div>(A) elastic; P=MC</div><div>(B) elastic; MR=MC</div><div>(C) inelastic; P=MC</div><div>(D) inelastic; MR=MC。<strong>答案</div><div>(B) </strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.6</strong>： (p.381)：Cobb-Douglas <span class=\"fx\">Q=L<sup>0.5</sup>K<sup>0.5</sup></span>，需求 <span class=\"fx\">P=100-Q</span>，<span class=\"fx\">P<sub>L</sub>=4</span>，<span class=\"fx\">P<sub>K</sub>=1</span><br>(1) 求 TC 與 TR<br>(2) 利潤極大產量<br>(3) 最適 L*, K*<br>(4) 最大利潤。解法要點：先求最適要素組合，再推 TC。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.7</strong>： (p.384)：為何市場獨占廠商沒有供給曲線？解法要點：因獨占廠商是 price maker，價格與數量同時決定，無法在其他條件不變下給出不同價格對應的供給量。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.8</strong>： (p.384)：完全競爭 MC=Q+50，需求 P=350-2Q<br>(1) 均衡；<br>(2) C.S、P.S、S.W<br>(3) 變獨占後最適量價<br>(4) 此時 C.S、P.S、S.W<br>(5) 比較無謂損失。解法要點：(1) P=MC 得 Q=100, P=150；<br>(3) MR=350-4Q=Q+50 得 Q=60, P=230<br>(5) 無謂損失為三角形面積。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.9</strong>： (p.384)：獨占與競爭皆成立的是：<div class=\"opts\"><div>(A) 無市場供給線</div><div>(B) 經濟利潤鼓勵進入</div><div>(C) 虧損大於固定成本時停業</div><div>(D) 經濟利潤可長期維持。<strong>答案</div><div>(C) </strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.10</strong>： (p.386)：廠商 A 獨占財貨 X，需求 P=38-Q，兩工廠：<span class=\"fx\">TC(q<sub>1</sub>)=4q<sub>1</sub>+0.5q<sub>1</sub><sup>2</sup></span>，<span class=\"fx\">TC(q<sub>2</sub>)=2q<sub>2</sub>+q<sub>2</sub><sup>2</sup></span>。求最適總產量、價格、利潤。解法要點：<span class=\"fx\">MR=MC<sub>1</sub>=MC<sub>2</sub></span>。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>獨占均衡條件：<span class=\"fx\">MR=MC</span>（S.O.C：<span class=\"fx\">MC</span> 斜率大於 <span class=\"fx\">MR</span> 斜率），再由需求線決定 <span class=\"fx\">P<sup>*</sup></span>。</li><li><strong>獨占 MR 曲線在需求線（AR）下方</strong>；直線型需求下，MR 較陡兩倍，橫軸截距為 AR 一半。</li><li>獨占廠商必在 <span class=\"fx\">|E<sup>d</sup>|>1</span> 處生產（MR>0）。</li><li>加成訂價公式：<span class=\"fx\">P<sup>*</sup>=MC/(1-1/|E<sup>d</sup>|)</span>。</li><li>獨占造成無謂損失（DL），社會福利非最大。</li><li>獨占廠商<strong>沒有供給曲線</strong>。</li></ul>\n</div>\n</div>"}, {"id": "12.3", "title": "差別取價（印刷頁 387–396）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc23\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">差別取價（Price discrimination）</div><div class=\"mc-body\"><div class=\"mc-formula\">對於同產品，按照不同消費者、消費量，或不同市場/地區，收取不同價格。</div><div class=\"mc-detail\">對於同產品，按照不同消費者、消費量，或不同市場/地區，收取不同價格。</div></div></div>\n<p class=\"def-note\">差別取價是因消費者需求不同，為剝奪消費者剩餘而出現；<strong>並非</strong>因生產成本不同。</p>\n<p class=\"def-note\">只要有價格控制力的廠商（除完全競爭外）皆可在適當條件下採取差別取價。</p>\n<h4 class=\"sub3\">適用條件（三條件）</h4>\n<ol><li><strong class=\"term\">廠商必須為價格決定者（Price maker）</strong>：面對的需求線必須為負斜率（才有消費者剩餘可剝奪）。</li><li><strong>廠商必須有辦法防止消費者轉售商品</strong>：否則消費者可低價買高價賣套利，廠商失去差別訂價能力。</li><li><strong>廠商必須針對不同的消費者</strong>：消費者對商品的需求彈性必須不同。</li></ol>\n<h4 class=\"sub3\">三、差別取價種類分析</h4>\n<h5 class=\"sub4\">（一）第一級差別取價（完全差別取價，Perfect Price discrimination）(p.388–390)</h5>\n<p><strong>意義</strong>：廠商完全了解每一消費者之需求曲線，按照消費者每單位最高願意支付價格來取價。此時消費者需求曲線即為廠商的邊際收益曲線。</p>\n<p><strong>均衡條件</strong>：<span class=\"fx\">P=MR=MC</span>(p.388)。</p>\n<p><strong>模型</strong>：</p>\n<p><span class=\"fx\">\\Max_\\Q\\π=TR(Q)-TC(Q)=∫<sub>0</sub><sup>Q</sup> P(t)dQ-TC(Q)</span></p>\n<p><span class=\"fx\">\\dfracdπdQ=\\dfracd∫<sub>0</sub><sup>Q</sup> P(t)dtdQ-\\dfracdTC(Q)dQ=MR(Q)-\\dfracdTC(Q)dQ=0</span></p>\n<p><span class=\"fx\">\\therefore P(Q)=MR(Q)=MC(Q)</span> 決定 <span class=\"fx\">Q<sup>*</sup></span>(p.388)。</p>\n<p><strong>結論</strong>：</p>\n<ol><li>廠商長期皆賺得超額利潤。</li><li><strong>完全剝削消費者剩餘，<span class=\"fx\">SW=PS</span></strong>(p.389)。</li><li>以 <span class=\"fx\">P=MC</span> 決定產量，符合資源配置最佳，<strong><span class=\"fx\">DL=0</span></strong>。</li><li>不一定在需求彈性大於一處生產。</li><li>只有均衡數量，沒有均衡價格。</li><li>雖達資源配置最佳，但分配極度不公平（<span class=\"fx\">CS=0</span>）。</li></ol>\n<p><strong>與完全競爭及單一定價的比較</strong>(p.389)：</p>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:14.29%\"><col style=\"width:14.29%\"><col style=\"width:14.29%\"><col style=\"width:14.29%\"><col style=\"width:14.29%\"><col style=\"width:14.29%\"><col style=\"width:14.29%\"></colgroup><thead><tr><th>市場型態</th><th><span class=\"fx\">Q</span></th><th><span class=\"fx\">P</span></th><th>C.S</th><th>P.S</th><th>S.W</th><th>D.L</th></tr></thead><tbody><tr><td>完全競爭</td><td><span class=\"fx\">Q<sub>C</sub></span></td><td><span class=\"fx\">P<sub>C</sub></span></td><td>1+2+3+4+7</td><td>4+6+8</td><td>1~8</td><td>無</td></tr><tr><td>單一定價</td><td><span class=\"fx\">Q<sub>M</sub></span></td><td><span class=\"fx\">P<sub>M</sub></span></td><td>1+2</td><td>3+4+5+6</td><td>1~6</td><td>7+8</td></tr><tr><td>1st 差別取價</td><td><span class=\"fx\">Q<sub>C</sub></span></td><td>每單位需求價格</td><td>無</td><td>1~8</td><td>1~8</td><td>無</td></tr></tbody></table></div>\n<ul><li>完全差別取價下 <span class=\"fx\">P=MC</span> 可求出 <span class=\"fx\">Q<sup>*</sup></span>（不存在單一 <span class=\"fx\">P<sup>*</sup></span>），與完全競爭相同具有經濟效率、社會福利最大；但所得分配極度不平均（<span class=\"fx\">CS=0</span>）。</li></ul>\n<h5 class=\"sub4\">（二）第二級差別取價(p.390–391)</h5>\n<p><strong>意義</strong>：廠商按照不同數量範圍訂定不同價格。例如夜市地攤一件 300、三件 500。又稱<strong class=\"term\">數量差別取價（Quantity discrimination）</strong>或<strong class=\"term\">區間定價法（block pricing）</strong>，亦稱<strong class=\"term\">非線性定價法（Nonlinear pricing）</strong>。</p>\n<p><strong>幾何分析</strong>(p.391)：</p>\n<ul><li>兩段價格：第一段價格 <span class=\"fx\">P<sub>0</sub></span>、數量 <span class=\"fx\">Q<sub>0</sub></span>；第二段價格 <span class=\"fx\">P<sub>1</sub></span>、數量 <span class=\"fx\">Q<sub>1</sub></span>。</li><li>生產者剩餘為 <span class=\"fx\">P<sub>0</sub>bdc0</span> 的面積；消費者剩餘為 <span class=\"fx\">aP<sub>0</sub>b</span> 與 <span class=\"fx\">bdc</span> 的三角形面積加總。</li><li>消費者不會像第一級差別取價一樣完全沒有剩餘。</li><li>若區段分的越細，越接近第一級差別取價。</li></ul>\n<p><strong>模型</strong>（兩段定價）：</p>\n<p><span class=\"fx\">\\Max_\\Q<sub>0</sub>,Q<sub>1</sub>\\π=P(Q<sub>0</sub>)× Q<sub>0</sub>+P(Q<sub>1</sub>)(Q<sub>1</sub>-Q<sub>0</sub>)-TC(Q<sub>1</sub>)</span></p>\n<p><span class=\"fx\">\\dfrac∂π∂ Q<sub>0</sub>=0</span>；<span class=\"fx\">\\dfrac∂π∂ Q<sub>1</sub>=0</span></p>\n<p>聯立解出 <span class=\"fx\">Q<sub>0</sub><sup>*</sup>, Q<sub>1</sub><sup>*</sup></span>，代入需求線得 <span class=\"fx\">P<sub>0</sub><sup>*</sup>, P<sub>1</sub><sup>*</sup></span>(p.391)。</p>\n<h5 class=\"sub4\">（三）第三級差別取價（市場分割定價，Market separating pricing）(p.392–394)</h5>\n<p><strong>意義</strong>：廠商將市場分成不同群，根據每一群顧客之需求彈性訂定不同價格。</p>\n<p><strong>模型</strong>：假設面對 1、2 兩群消費者：</p>\n<p><span class=\"fx\">π=TR<sub>1</sub>(Q<sub>1</sub>)+TR<sub>2</sub>(Q<sub>2</sub>)-TC(Q<sub>1</sub>+Q<sub>2</sub>)</span></p>\n<p><span class=\"fx\">\\dfrac∂π∂ Q<sub>1</sub>=MR<sub>1</sub>(Q<sub>1</sub>)-\\dfrac∂ TC∂(Q<sub>1</sub>+Q<sub>2</sub>)\\dfrac∂(Q<sub>1</sub>+Q<sub>2</sub>)∂ Q<sub>1</sub>=MR<sub>1</sub>(Q<sub>1</sub>)-MC=0</span></p>\n<p><span class=\"fx\">\\dfrac∂π∂ Q<sub>2</sub>=MR<sub>2</sub>(Q<sub>2</sub>)-MC=0</span></p>\n<p><strong>均衡條件</strong>：<span class=\"fx\">MR<sub>1</sub>(Q<sub>1</sub>)=MR<sub>2</sub>(Q<sub>2</sub>)=MC</span>(p.392)。</p>\n<p><strong>直覺</strong>：</p>\n<ul><li><span class=\"fx\">MR<sub>1</sub>>MR<sub>2</sub></span>：將商品從市場 2 轉到市場 1 可增加利潤。</li><li><span class=\"fx\">MR<sub>1</sub>\\lt MR<sub>2</sub></span>：將商品從市場 1 轉到市場 2。</li><li>利潤極大時兩市場 MR 相等，再與 MC 相等決定總產量。</li></ul>\n<p><strong>代入 MR 公式</strong>：</p>\n<p><span class=\"fx\">P<sub>1</sub>(1-\\dfrac1E<sub>1</sub><sup>d</sup>)=P<sub>2</sub>(1-\\dfrac1E<sub>2</sub><sup>d</sup>)=MC</span></p>\n<p><span class=\"fx\">\\therefore P<sub>i</sub>=\\dfracMC(1-\\dfrac1E<sub>i</sub><sup>d</sup>)</span>(p.392)。</p>\n<ul><li><strong>需求彈性越大，價格越低</strong>（對需求富彈性的市場訂低價；對需求缺乏彈性的市場訂高價）。</li></ul>\n<p><strong>幾何分析</strong>(p.393)：</p>\n<ul><li>三個圖：左圖市場 1（<span class=\"fx\">P<sub>1</sub>, Q<sub>1</sub></span>）、中圖市場 2（<span class=\"fx\">P<sub>2</sub>, Q<sub>2</sub></span>）、右圖總圖（<span class=\"fx\">MR, MC</span>）。</li><li>將兩市場的 MR 水平加總得 <span class=\"fx\">∑ Q(MR)</span>，與 MC 交於 <span class=\"fx\">E<sup>*</sup></span> 決定總產量 <span class=\"fx\">Q<sup>*</sup>=Q<sub>1</sub><sup>*</sup>+Q<sub>2</sub><sup>*</sup></span>。</li><li>再將 <span class=\"fx\">E<sup>*</sup></span> 的 MR 高度回帶到兩個市場，得 <span class=\"fx\">Q<sub>1</sub><sup>*</sup>, Q<sub>2</sub><sup>*</sup></span>；由各市場需求線得 <span class=\"fx\">P<sub>1</sub><sup>*</sup>, P<sub>2</sub><sup>*</sup></span>。</li><li>消費者剩餘分別為 <span class=\"fx\">a<sub>1</sub>E<sub>1</sub><sup>*</sup>P<sub>1</sub><sup>*</sup></span> 與 <span class=\"fx\">a<sub>2</sub>E<sub>2</sub><sup>*</sup>P<sub>2</sub><sup>*</sup></span>。</li></ul>\n<p><strong>有運輸成本時</strong>(p.393)：若兩市場間有轉售成本 <span class=\"fx\">t<sub>c</sub></span>，廠商必須防止價差高於轉售成本：</p>\n<p><span class=\"fx\">\\Max_\\Q<sub>1</sub>,Q<sub>2</sub>\\π=TR<sub>1</sub>(Q<sub>1</sub>)+TR<sub>2</sub>(Q<sub>2</sub>)-TC(Q<sub>1</sub>+Q<sub>2</sub>)</span></p>\n<p><code>s.t. <span class=\"fx\">|P<sub>2</sub>-P<sub>1</sub>|=t<sub>c</sub></span></code></p>\n<h5 class=\"sub4\">（四）統一定價法（Uniform pricing）(p.395–396)</h5>\n<p><strong>定義</strong>：對於不同市場皆收取相同價格。雖然利潤較第三級差別取價低，但節省蒐集消費者資料與市場區隔的交易成本。</p>\n<p><strong>作法</strong>：</p>\n<ol><li>先將個別市場需求線水平加總為總需求 <span class=\"fx\">Q<sup>d</sup>=∑<sub>i=1</sub><sup>n</sup> Q<sub>i</sub><sup>d</sup></span>（以 <span class=\"fx\">b</span> 點為拗折處）。</li><li>將 <span class=\"fx\">Q<sup>d</sup></span> 轉換成 P 開頭的 AR 線 <span class=\"fx\">P=AR(Q<sup>d</sup>)</span>（以 <span class=\"fx\">\\barQ</span> 為拗折處）。</li><li>導出在 <span class=\"fx\">\\barQ</span> 分離的 MR 線。</li><li>以 <span class=\"fx\">MR=MC</span> 決定 <span class=\"fx\">Q<sup>*</sup></span>，代回 <span class=\"fx\">P=AR(Q<sup>d</sup>)</span> 決定統一價 <span class=\"fx\">P<sup>*</sup></span>。</li><li>若 MC 與 MR 有兩個交點，須比較利潤選擇大的生產點；若只交在較陡的 MR，則放棄其中一個市場。</li></ol>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.11</strong>： (p.390)：獨占廠商線性需求 Q=200−20P，MC=$4 固定，固定成本 $80。完全差別取價下，求 TR、生產者剩餘？資源配置是否有效率？解法要點：完全差別取價下 <span class=\"fx\">P=MC</span>，產量由需求線與 MC 交點決定。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.12</strong>： (p.390)：<span class=\"fx\">Q<sup>d</sup>=26-2P</span>，SMC=3+Q/3，完全差別取價下：<div class=\"opts\"><div>(A) CS=\\24</div><div>(B) PS=\\24</div><div>(C) 總剩餘 \\60</div><div>(D) DL=\\60</div><div>(E) DL=$36。解法要點：完全差別取價下 $P=MC$，DL=0。（詳解見書末 QR）</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.13</strong>： (p.391)：$P=120-10Q$，<span class=\"fx\">TC=20Q</span>，第二級差別取價指定兩種價格，如何訂價使利潤最大？解法要點：兩段定價模型，聯立 <span class=\"fx\">∂π/∂ Q<sub>0</sub>=0</span> 與 <span class=\"fx\">∂π/∂ Q<sub>1</sub>=0</span>。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.14</strong>： (p.393)：兩市場 <span class=\"fx\">q<sub>1</sub>=-2P<sub>1</sub>+6</span>，<span class=\"fx\">q<sub>2</sub>=-2P<sub>2</sub>+4</span>，<span class=\"fx\">STC=0.5+(q<sub>1</sub>+q<sub>2</sub>)</span>，求需求較富彈性市場的利潤極大價格。解法要點：<span class=\"fx\">MR<sub>1</sub>=MR<sub>2</sub>=MC</span>。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.15</strong>： (p.394)：鄉村 <span class=\"fx\">|E<sup>d</sup>|=2</span>，都市 <span class=\"fx\">|E<sup>d</sup>|=3</span>，都市定價 450 元，則鄉村定價為？<div class=\"opts\"><div>(A) 500</div><div>(B) 550</div><div>(C) 600</div><div>(D) 650。解法要點：<span class=\"fx\">P<sub>1</sub>/(1-1/|E<sub>1</sub>|)=P<sub>2</sub>/(1-1/|E<sub>2</sub>|)</span>，即 <span class=\"fx\">450/(1-1/3)=P/(1-1/2)</span>，得 <span class=\"fx\">P=675</span> 附近。（詳解見書末 QR）</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.16</strong>： (p.394)：新書 <span class=\"fx\">P<sub>N</sub>=120-2Q<sub>N</sub></span>，舊書 <span class=\"fx\">P<sub>U</sub>=80-Q<sub>U</sub></span>，<span class=\"fx\">TC=10+2(Q<sub>N</sub>+Q<sub>U</sub>)<sup>2</sup></span>。何者正確？解法要點：分別在兩市場 MR=MC。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.17</strong>： (p.394)：<span class=\"fx\">Q<sub>1</sub>=55-p<sub>1</sub></span>，<span class=\"fx\">Q<sub>2</sub>=70-2p<sub>2</sub></span>，MC=$5 固定<br>(1) 可分割時各市場價格與利潤？<br>(2) 若消費者可花 $2 運費跨市場購買，答案如何變化？解法要點：(1) 第三級差別取價<br>(2) 受轉售成本限制 <span class=\"fx\">|P<sub>1</sub>-P<sub>2</sub>|≤ 2</span>。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.18</strong>： (p.396)：跨國藥廠 MC=2，<span class=\"fx\">Q<sub>1</sub>=16-2P<sub>1</sub></span>，<span class=\"fx\">Q<sub>2</sub>=10-P<sub>2</sub></span><br>(1) 禁止轉售時兩國獨占價格？<br>(2) 受國際協定無法差別取價，最適獨占價格？是否放棄一國市場？解法要點：(1) 第三級差別取價<br>(2) 統一定價。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>三級差別取價條件：<span class=\"fx\">MR<sub>1</sub>=MR<sub>2</sub>=MC</span>；<span class=\"fx\">P<sub>i</sub>=MC/(1-1/|E<sub>i</sub>|)</span>；需求彈性大者訂低價。</li><li>第一級差別取價：<span class=\"fx\">P=MR=MC</span>，<span class=\"fx\">CS=0</span>，<span class=\"fx\">DL=0</span>，社會福利與完全競爭相同但分配最不均。</li><li>第二級差別取價：按數量區間訂價（block pricing），區段越細越接近第一級。</li><li>差別取價前提：廠商有市場力、可防止轉售、各市場需求彈性不同。</li></ul>\n</div>\n</div>"}, {"id": "12.4", "title": "壟斷力的測量（印刷頁 397–398）", "body": "\n<h4 class=\"sub3\">一、婁勒指標（Lerner index）(p.397)</h4>\n<p><span class=\"fx\">L<sub>I</sub>=\\dfracP-MCP</span></p>\n<ul><li>與加成訂價法類似。</li><li>若稍做整理：</li></ul>\n<p><span class=\"fx\">P<sup>*</sup>=(\\dfrac11-LI)MC</span></p>\n<ul><li>進一步：</li></ul>\n<p><span class=\"fx\">L<sub>I</sub>=\\dfracP-MCP=1-\\dfracMCP=1-\\dfracMC\\dfracMC1-(1)/(E<sup>d</sup>)=\\dfrac1E<sup>d</sup></span></p>\n<p><span class=\"fx\">\\therefore E<sup>d</sup>\\uparrow⇒ L<sub>I</sub>\\downarrow</span>(p.397)。</p>\n<ul><li>意涵：需求價格彈性越大，獨占力越小（<span class=\"fx\">L<sub>I</sub></span> 越小）。</li></ul>\n<h4 class=\"sub3\">二、班恩指標（Bain index）(p.397)</h4>\n<ul><li>因 MC 難以估計，改用平均成本 AC 取代：</li></ul>\n<p><span class=\"fx\">B<sub>i</sub>=\\dfracP-ACP</span></p>\n<p><span class=\"fx\">B<sub>i</sub>=\\dfracP-ACP=\\dfracP× Q-AC× QP× Q=\\dfracπTR</span></p>\n<p><span class=\"fx\">\\therefore π\\uparrow⇒ B.I\\uparrow</span>(p.397)。</p>\n<h4 class=\"sub3\">三、市場集中度（Concentration rate）(p.397)</h4>\n<ul><li>銷售額占該產業全體廠商總銷售額之比例。</li><li>可分為<strong>四家廠商集中度（Four-firm concentration ratio）</strong>與<strong>八家廠商集中度（Eight-firm concentration ratio）</strong>。</li><li>操作方式：市場銷售額最大的前幾家廠商，其銷售量總額占市場總銷售額的比率。</li></ul>\n<h4 class=\"sub3\">四、賀芬達指數（Herfindahl index, HHI）(p.397)</h4>\n<ul><li>市占率平方後加總：</li></ul>\n<p>HHI=<span class=\"mop\"><span class=\"mop op-symbol small-op\" style=\"position:relative;top:0em;\">∑</span><span class=\"fx\">i</span>=1<span class=\"fx\">n</span></span>​(市占率)<span class=\"fx\">2</span>×10000(p.397)。</p>\n<ul><li>比率介於 0 與 1 之間，0 代表無壟斷力可言，值越大代表壟斷力越大。</li></ul>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.19</strong>： (p.398)：廠商面對需求曲線愈價格無彈性，表示：<div class=\"opts\"><div>(A) 市場力越小</div><div>(B) 銷售額在價格上升時減少越多</div><div>(C) 市場力越大</div><div>(D) 價格與邊際收益差異越小</div><div>(E) 減價增加收益可能性越大。<strong>答案</div><div>(C) </strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.20</strong>： (p.398)：六家廠商市占率 30%、25%、20%、15%、5%、5%，求 HHI？解法要點：<span class=\"fx\">HHI=(30<sup>2</sup>+25<sup>2</sup>+20<sup>2</sup>+15<sup>2</sup>+5<sup>2</sup>+5<sup>2</sup>)× 10000/10000=(900+625+400+225+25+25)=2200</span>。<strong>答案 (D) 2200</strong>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>勒納指數 <span class=\"fx\">L=(P-MC)/P=1/|E<sup>d</sup>|</span>，介於 0~1 之間，越大壟斷力越強。</li><li>班恩指數 <span class=\"fx\">B=(P-AC)/P=π/TR</span>。</li><li>HHI = 市占率平方和 × 10000。</li></ul>\n</div>\n</div>"}, {"id": "12.5", "title": "政府對獨占廠商的管制（印刷頁 399–409）", "body": "\n<h4 class=\"sub3\">一、定價法種類</h4>\n<p><strong>（一）獨占定價法</strong>（最大利潤定價法）</p>\n<ul><li>最適產量出現在利潤極大位置，決策準則為 <span class=\"fx\">MR=MC</span>(p.399)。</li></ul>\n<p><strong>（二）平均成本定價法</strong></p>\n<ul><li>要求廠商將價格訂於 <span class=\"fx\">P=AC</span> 的位置，會使獨占廠商的<strong>超額利潤消失</strong>（只剩正常利潤）(p.399)。</li></ul>\n<p><strong>（三）邊際成本定價法</strong></p>\n<ul><li>要求廠商將價格訂於 <span class=\"fx\">P=MC</span> 的位置，會使<strong>社會福利極大</strong>，即無謂損失消失(p.399)。</li></ul>\n<h4 class=\"sub3\">二、定價管制幾何討論與比較</h4>\n<p><strong>自然獨占情況</strong>（AC 隨產量遞增而一路遞減，MC 為固定常數）(p.399–400)：</p>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"></colgroup><thead><tr><th></th><th>獨占定價法 (<span class=\"fx\">E<sub>1</sub></span>)</th><th>平均成本定價法 (<span class=\"fx\">E<sub>2</sub></span>)</th><th>邊際成本定價法 (<span class=\"fx\">E<sub>3</sub></span>)</th></tr></thead><tbody><tr><td>條件</td><td><span class=\"fx\">MR=MC</span></td><td><span class=\"fx\">P=AC</span></td><td><span class=\"fx\">P=MC</span></td></tr><tr><td><span class=\"fx\">P</span></td><td><span class=\"fx\">P<sub>1</sub></span></td><td><span class=\"fx\">P<sub>2</sub></span></td><td><span class=\"fx\">P<sub>3</sub></span></td></tr><tr><td><span class=\"fx\">Q</span></td><td><span class=\"fx\">Q<sub>1</sub></span></td><td><span class=\"fx\">Q<sub>2</sub></span></td><td><span class=\"fx\">Q<sub>3</sub></span></td></tr><tr><td><span class=\"fx\">π</span></td><td><span class=\"fx\">P<sub>1</sub>E<sub>1</sub>db</span>（正）</td><td>0</td><td><span class=\"fx\">-cfE<sub>3</sub>P<sub>3</sub></span>（負）</td></tr><tr><td><span class=\"fx\">P.S</span></td><td><span class=\"fx\">P<sub>1</sub>E<sub>1</sub>eP<sub>3</sub></span></td><td><span class=\"fx\">P<sub>2</sub>E<sub>2</sub>gP<sub>3</sub></span></td><td>0</td></tr><tr><td><span class=\"fx\">S.W</span></td><td><span class=\"fx\">aE<sub>1</sub>eP<sub>3</sub></span></td><td><span class=\"fx\">aE<sub>2</sub>gP<sub>3</sub></span></td><td><span class=\"fx\">aE<sub>3</sub>P<sub>3</sub></span></td></tr><tr><td><span class=\"fx\">D.L</span></td><td><span class=\"fx\">E<sub>1</sub>eE<sub>3</sub></span></td><td><span class=\"fx\">E<sub>2</sub>gE<sub>3</sub></span></td><td>0</td></tr></tbody></table></div>\n<p><strong>討論</strong>：</p>\n<ol><li><strong>獨占定價法（<span class=\"fx\">E<sub>1</sub></span>）</strong>：優點：利潤最大，有充裕財源收入。缺點：價格過高、產量太少；<span class=\"fx\">P>MC</span>，社會資源運用無效率，產生無謂損失。</li><li><strong>邊際成本定價法（<span class=\"fx\">E<sub>3</sub></span>）</strong>：優點：社會福利最大，無謂損失為 0；價格最低、產量最高。缺點：自然獨占廠商將出現虧損；廠商不再珍惜成本使用，出現比平均成本定價法更嚴重的技術無效率；廠商有誘因隱瞞成本結構。<strong>通常搭配兩階段定價法</strong>（先對消費者收入場費，再以邊際成本定價）解決虧損問題。</li><li><strong>平均成本定價法（<span class=\"fx\">E<sub>2</sub></span>）</strong>：優點：可改善廠商虧損，使廠商獲得正常利潤；無謂損失相較獨占定價法為低，是維持預算平衡下的最小犧牲。缺點：廠商有誘因隱藏成本結構；出現隨意耗用成本的現象，外部不經濟使平均成本上移，產生技術無效率。</li></ol>\n<p><strong>X 無效率（X-inefficiency）</strong>：由於廠商的生產不效率所造成的平均成本高過完全競爭之現象(p.400)。</p>\n<p><strong>一般獨占定價管制</strong>（非自然獨占，AC 為 U 型）(p.401)：</p>\n<ul><li><span class=\"fx\">E<sub>1</sub></span>（MR=MC）：獨占定價，<span class=\"fx\">P<sub>1</sub>, Q<sub>1</sub></span>。</li><li><span class=\"fx\">E<sub>2</sub></span>（P=AC）：平均成本定價，<span class=\"fx\">P<sub>2</sub>, Q<sub>2</sub></span>，<span class=\"fx\">π=0</span>。</li><li><span class=\"fx\">E<sub>3</sub></span>（P=MC）：邊際成本定價，<span class=\"fx\">P<sub>3</sub>, Q<sub>3</sub></span>。</li><li>對非自然獨占的獨占企業進行價格管制，價格應訂在需求線與平均成本線交點處（即 <span class=\"fx\">P=AC</span>），以維持廠商繼續經營且消除超額利潤。</li></ul>\n<h4 class=\"sub3\">三、對獨占廠商課稅</h4>\n<p><strong>（一）定額稅(p.403)</strong></p>\n<p>模型：<span class=\"fx\">\\Max_\\Q\\π=TR-LTC-\\barT</span></p>\n<p>一階條件：<span class=\"fx\">MR=LMC</span>（與未課稅相同）。</p>\n<p>曲線變化：</p>\n<ul><li><span class=\"fx\">LAC'=LAC+\\dfrac\\barTQ</span>，上移，最低點位置改變。</li><li>LMC<span class=\"fx\">′</span>=LMC，<strong>課徵定額稅不影響 LMC</strong>。</li></ul>\n<p>效果：AC 上移至 <span class=\"fx\">AC<sub>t</sub></span>，但 MR 與 MC 皆不變，故價格與數量維持在 <span class=\"fx\">P<sup>*</sup></span> 與 <span class=\"fx\">Q<sup>*</sup></span>，但因平均成本上升，稅後利潤下降。<strong>若對獨占廠商課徵定額稅，稅收負擔完全由生產者負擔，不會轉嫁給消費者</strong>。</p>\n<p><strong>利潤稅(p.404)</strong>：針對利潤收取 <span class=\"fx\">t</span> 比例之稅。</p>\n<p>模型：<span class=\"fx\">\\Maxπ<sub>t</sub>=(1-t)π=(1-t)(TR-LTC)</span></p>\n<p>F.O.C：(1−t)(MR−MC)=0</p>\n<ul><li>利潤稅<strong>不影響廠商的生產決策</strong>，和定額稅一樣，稅額完全由廠商負擔；最適產量點下移。</li></ul>\n<p><strong>（二）對廠商課徵每單位 <span class=\"fx\">t</span> 之從量稅(p.405)</strong></p>\n<p>模型：<span class=\"fx\">\\Maxπ=TR-LTC-tQ=P<sup>d</sup>(Q)Q-(LTC+tQ)</span></p>\n<p>一階條件：MR=LMC<span class=\"fx\">′</span>=LMC+t。</p>\n<p>曲線變化：</p>\n<ul><li>LAC<span class=\"fx\">′</span>=LAC+t，垂直上移。</li><li>LMC<span class=\"fx\">′</span>=MC+t，垂直上移，且與 <span class=\"fx\">LAC</span> 上移幅度相同。</li></ul>\n<p>效果：MC 上移至 <span class=\"fx\">MC+t</span>，但 MR 不變。此時價格上升至 <span class=\"fx\">P<sub>t</sub><sup>d</sup></span>，數量下降至 <span class=\"fx\">Q<sub>t</sub></span>，消費者負擔稅額為 <span class=\"fx\">P<sub>t</sub><sup>d</sup>-P<sup>*</sup></span>。</p>\n<p><strong>（三）對消費者課徵每單位 <span class=\"fx\">t</span> 之從量稅(p.406)</strong></p>\n<p>模型：<span class=\"fx\">\\Maxπ=TR<sub>t</sub>-LTC=P<sub>t</sub><sup>d</sup>(Q)Q-LTC</span>，其中 <span class=\"fx\">P<sub>t</sub><sup>d</sup>(Q)=P<sup>d</sup>(Q)-t</span>。</p>\n<p>一階條件：<span class=\"fx\">MR<sub>t</sub>=LMC</span>，其中 <span class=\"fx\">MR<sub>t</sub>=\\dfracdTR<sub>t</sub>dQ=\\dfracd(P<sup>d</sup>(Q)-t)QdQ=MR-t</span>。</p>\n<p>成本結構不改變，但需求線與 MR 線垂直下移 <span class=\"fx\">t</span> 單位。</p>\n<p><strong>數理推導——負擔比例</strong>(p.407)：</p>\n<ul><li>假設 <span class=\"fx\">P=α-β Q</span>，故 <span class=\"fx\">MR=α-2β Q</span>。</li><li><span class=\"fx\">MC=σ+ϕ Q</span>（<span class=\"fx\">ϕ>0</span> MC 正斜率；<span class=\"fx\">ϕ=0</span> MC 水平；<span class=\"fx\">ϕ<0</span> MC 負斜率）。</li><li>對生產者課稅，稅後 <span class=\"fx\">MC'=σ+t+ϕ Q</span>。</li></ul>\n<p>課税前：</p>\n<p><span class=\"fx\">MR=MC⇒α-2β Q=σ+ϕ Q</span></p>\n<p><span class=\"fx\">Q<sup>*</sup>=\\dfracα-σϕ+2β</span></p>\n<p><span class=\"fx\">P<sup>*</sup>=α-β\\dfracα-σϕ+2β=\\dfracαϕ+αβ+βσϕ+2β</span></p>\n<p>課稅後：</p>\n<p><span class=\"fx\">MR=MC'⇒α-2β Q=σ+t+ϕ Q</span></p>\n<p><span class=\"fx\">Q'=\\dfracα-σ-tϕ+2β</span></p>\n<p><span class=\"fx\">P'=\\dfracαϕ+αβ+βσ+β tϕ+2β</span></p>\n<p><span class=\"fx\">\\therefore P<sup>*</sup>-P'=\\dfracβ tϕ+2β</span></p>\n<ul><li><span class=\"fx\">ϕ>0</span>（MC 正斜率）：<span class=\"fx\">P<sup>*</sup>-P'=\\dfracβ tϕ+2β<\\dfract2</span>，消費者負擔不到一半。</li><li><span class=\"fx\">ϕ=0</span>（MC 水平）：<span class=\"fx\">P<sup>*</sup>-P'=\\dfracβ t0+2β=\\dfract2</span>，消費者負擔一半。</li><li><span class=\"fx\">ϕ<0</span>（MC 負斜率）：<span class=\"fx\">P<sup>*</sup>-P'=\\dfracβ t0+2β>\\dfract2</span>，消費者負擔超過一半。</li></ul>\n<p><strong>結論</strong>：對獨占廠商課徵從量稅，其稅收負擔須視 MC 曲線而定(p.407)。</p>\n<p><strong>（四）對消費者課徵每單位 <span class=\"fx\">t</span> 之從價稅</strong>(p.407–408)</p>\n<p>模型：<span class=\"fx\">\\Maxπ=TR<sub>t</sub>-LTC=P<sub>t</sub><sup>d</sup>(Q)Q-LTC</span>，其中 <span class=\"fx\">P<sub>t</sub><sup>d</sup>(Q)=P<sup>d</sup>(Q)-tP<sup>d</sup>(Q)=(1-t)P<sup>d</sup>(Q)</span>。</p>\n<p>一階條件：<span class=\"fx\">MR<sub>t</sub>=(1-t)MR=LMC</span>。</p>\n<p>需求線與 MR 固定橫軸截距並旋轉下移。</p>\n<p><strong>（五）對廠商課徵每單位 <span class=\"fx\">t</span> 之從價稅</strong>(p.408–409)</p>\n<p>模型：<span class=\"fx\">\\Maxπ=TR-LTC=\\dfracP<sup>d</sup>(Q)1+tQ-LTC</span></p>\n<p>一階條件：<span class=\"fx\">\\dfracMR1+t=LMC</span>。</p>\n<p>稅後收益面：</p>\n<ul><li><span class=\"fx\">TR'=\\dfracTR1+t</span></li><li><span class=\"fx\">AR'=\\dfracAR1+t</span></li><li><span class=\"fx\">MR'=\\dfracMR1+t</span></li></ul>\n<p>需求線與 MR 固定橫軸截距並旋轉下移，但下移比例與對消費者課徵時不同。</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.21</strong>： (p.402)：自然壟斷廠商營運狀況何者正確？<div class=\"opts\"><div>(A) 定價在需求彈性為 1 處利潤最大</div><div>(B) 長期 AC 曲線存在遞減階段</div><div>(C) 政府要求邊際成本定價會使其倒閉</div><div>(D) 追求利潤最大也能同時達到營業收益最大。<strong>答案</div><div>(B) </strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.22</strong>： (p.402)：可競爭市場（contestable market）是指：<div class=\"opts\"><div>(A) 退出有顯著交易成本</div><div>(B) 進入很難但退出沒成本</div><div>(C) 進入很容易且退出不需高成本</div><div>(D) 互相競爭的寡占者從事掠奪性定價。<strong>答案</div><div>(C) </strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.23</strong>： (p.402)：政府對非自然獨占性質獨占企業價格管制，價格應訂在：<div class=\"opts\"><div>(A) 需求線與 AC 交點</div><div>(B) 需求線與 MC 交點</div><div>(C) MR 與 MC 交點</div><div>(D) 階段定價。<strong>答案</div><div>(A) </strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.24</strong>： (p.402)：何謂自然獨占？成因？政府規範自然獨占產量以達社會福利最大時，廠商面臨何種問題？如何解決？解法要點：自然獨占因規模經濟使 LAC 遞減；邊際成本定價法下廠商會虧損，可搭配兩階段定價（收入場費+邊際成本定價）。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.25</strong>： (p.402)：LMC:LAC=6−Q/2；<span class=\"fx\">LMC=6-Q</span>；需求 Q=4.5−P/2。何者正確？<div class=\"opts\"><div>(A) 平均成本訂價 P=$5，利潤 $1.5</div><div>(B) 完全可競爭市場下獨占租 $1.5</div><div>(C) 獨占租 $0</div><div>(D) 邊際成本訂價 P=$3，利潤 0</div><div>(E) 邊際成本訂價 P=$3，利潤 -4.5。解法要點：邊際成本訂價 P=MC 代入。（詳解見書末 QR）</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 12.26</strong>： (p.409)：獨占產業 <span class=\"fx\">P=630-2Q</span>，<span class=\"fx\">C(Q)=Q<sup>2</sup>/2</span><br>(1) 從量稅 $30/單位，政府稅收？<br>(2) 改從價稅 $\\tau，使產量與(1)相同，求\\tau$ 與稅收？<br>(3) 同 (2)，求稅收。解法要點：(1) 令 MC'=MC+30<br>(2) 令 MR=(1-\\tau)P，使數量同 (1)。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>三種定價法比較：獨占定價（MR=MC）利潤最大但有 DL；平均成本定價（P=AC）消除超額利潤、DL 較小；邊際成本定價（P=MC）社會福利最大但自然獨占廠商虧損。</li><li>自然獨占管制問題：邊際成本定價會使廠商虧損→解決之道為兩階段定價（收入場費）。</li><li>對獨占廠商課定額稅/利潤稅：不影響最適決策，完全由廠商吸收。</li><li>對獨占廠商課從量稅：MC 上移，價格上升、數量下降；消費者負擔比例視 MC 斜率而定。</li></ul>\n</div>\n</div>"}], "13": [{"id": "13.1", "title": "寡占廠商的特質(p.413)", "body": "\n<p class=\"def-note\">寡占（Oligopoly）：某一個產業只存在<strong>少數幾個賣者</strong>的市場組織。</p>\n<p class=\"def-note\">同質寡占（pure oligopoly）：產品同質。</p>\n<p class=\"def-note\">異質寡占（differentiated oligopoly）：產品異質。</p>\n<p class=\"def-note\">介於完全競爭與獨占兩極端之間的「混合體」，貼近真實市場（補習班、電信業、水泥、鋼鐵業等）。</p>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<p>寡占廠商五大特質：</p>\n<ol><li><strong>廠商數目很少，但大於 1</strong>。</li><li><strong>廠商間存在高依存性</strong>（Interaction）：彼此互相牽制、互相影響；這與完全競爭、獨占、獨占性競爭下「廠商互相獨立」的本質不同。</li><li><strong>存在進入障礙</strong>，但進入的難度<strong>沒有獨占那麼難</strong>。</li><li><strong>策略選擇</strong>的三個面向：</li></ol>\n<ul><li>(一) 選擇變數：<strong>數量競爭</strong> vs. <strong>價格競爭</strong>。</li><li>(二) 時間點：<strong>同時決策（Simultaneous）</strong> vs. <strong>先後順序（Sequential）</strong>。</li><li>(三) 勾結（collude）：合作（cooperative）vs. 不合作。</li></ul>\n<ol><li><strong>實務上沒有一個模型可以涵蓋所有寡占市場</strong>，必須依市場特性選模型。</li></ol>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>判斷市場結構是否為寡占時，「廠商互相依存性」是最關鍵的辨識特徵（對照例題 13.1）。</li><li>章節地圖：數量競爭 → 庫諾（同時）、史塔伯克（先後）、卡特爾（合作）；價格競爭 → 貝銓（同時）、價格領袖（先後）、Sweezy（價格僵固）；背後共同邏輯 → 賽局理論。</li></ul>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.1</strong>： 在一個寡占市場中，<div class=\"opts\"><div>(A) 廠商為價格尋找者</div><div>(B) 廠商間有互相依存性</div><div>(C) 有某種程度的進入障礙</div><div>(D) 以上皆是</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n<p>書中解法要點：本題正解為 <strong>(D) 以上皆是</strong>（詳解見書末 QR）。</p>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.2</strong>： 台灣主要電信業者（中華電信、台灣大哥大、遠傳、台灣之星）的市場結構？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n<p>書中解法要點：屬<strong>同質寡占（或少數賣者的寡占）</strong>，廠商間高度依存、有進入障礙（詳解見書末 QR）。</p>\n</div>\n</div>"}, {"id": "13.2", "title": "庫諾（Cournot）模型(p.414–p.416)", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc22\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\"><strong class=\"proper\">庫諾模型</strong></div><div class=\"mc-body\"><div class=\"mc-formula\">寡占市場中生產同質商品的廠商，<strong>同時</strong>把對手產量視為固定，各自追求利潤極大化的一次性數量競爭賽局。</div><div class=\"mc-detail\">寡占市場中生產同質商品的廠商，<strong>同時</strong>把對手產量視為固定，各自追求利潤極大化的一次性數量競爭賽局。</div></div></div>\n<h4 class=\"sub3\">模型假設</h4>\n<ol><li>一個產業只有兩個廠商，其他廠商無法加入。</li><li>產品同質，各自追求利潤極大化。</li><li>兩廠商<strong>同時</strong>做出產量決策，為<strong>數量競爭、非價格競爭</strong>，且為一次性賽局。</li><li>雙方<strong>無勾結行為</strong>。</li><li>廠商彼此間猜測變量為零：</li></ol>\n<p><span class=\"fx\">(∂ Q<sub>i</sub>)/(∂ Q<sub>j</sub>)=0, (∂ Q<sub>j</sub>)/(∂ Q<sub>i</sub>)=0</span></p>\n<p>亦即廠商「認為」自己改變產量時，對手不會跟著改變產量。</p>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>市場需求與成本：</li></ul>\n<p><span class=\"fx\">P=a-bQ, Q=q<sub>1</sub>+q<sub>2</sub>, MC<sub>1</sub>=MC<sub>2</sub>=c</span>(p.414)</p>\n<ul><li>1 號廠商利潤極大化：</li></ul>\n<p><span class=\"fx\">π<sub>1</sub>=Pq<sub>1</sub>-TC<sub>1</sub>=[a-b(q<sub>1</sub>+q<sub>2</sub>)]q<sub>1</sub>-cq<sub>1</sub></span></p>\n<p><span class=\"fx\">(∂π<sub>1</sub>)/(∂ q<sub>1</sub>)=a-2bq<sub>1</sub>-bq<sub>2</sub>-c=0 ⇒ q<sub>1</sub>=(a-c)/(2b)-1/2q<sub>2</sub></span>(p.414)</p>\n<ul><li>2 號廠商利潤極大化：</li></ul>\n<p><span class=\"fx\">q<sub>2</sub>=(a-c)/(2b)-1/2q<sub>1</sub></span>(p.414)</p>\n<ul><li><strong class=\"term\">反應函數（Reaction function）</strong>：給定對手產量（視為外生常數）下，自身利潤極大化的產量：</li></ul>\n<p><span class=\"fx\">q<sub>1</sub>=(a-c)/(2b)-1/2q<sub>2</sub>=R<sub>1</sub>(q<sub>2</sub>)</span></p>\n<p><span class=\"fx\">q<sub>2</sub>=(a-c)/(2b)-1/2q<sub>1</sub>=R<sub>2</sub>(q<sub>1</sub>)</span>(p.414)</p>\n<ul><li><strong>庫諾均衡</strong>：兩條反應函數之交點，</li></ul>\n<p><span class=\"fx\">q<sub>1</sub><sup>c</sup>=q<sub>2</sub><sup>c</sup>=(a-c)/(3b)</span>(p.415)</p>\n<ul><li>等利潤曲線（Iso-profit curve）：</li></ul>\n<p><span class=\"fx\">π<sub>1</sub>=Pq<sub>1</sub>-TC<sub>1</sub>=[a-b(q<sub>1</sub>+q<sub>2</sub>)]q<sub>1</sub>-cq<sub>1</sub></span></p>\n<p>等高線通過自身反應函數最高點；對 1 廠商而言等利潤線凹向橫軸（<span class=\"fx\">q<sub>1</sub></span> 軸），對 2 廠商凹向縱軸（<span class=\"fx\">q<sub>2</sub></span> 軸）；對手產量越小，自身利潤越高（圖示 <span class=\"fx\">π<sub>1</sub>'>π<sub>1</sub></span>）。(p.415–p.416)</p>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>庫諾均衡是「在給定對手產量下，所有廠商都沒有誘因單方面改變自身產量」的交集。</li><li>兩家廠商對稱下，各生產 (a−c)/(3b)；總產量 <span class=\"fx\">2(a-c)/(3b)</span>，介於完全競爭 Q=(a−c)/b 與獨占 Q=(a−c)/(2b) 之間。</li><li>等利潤曲線與反應函數的關係：<strong>反應函數通過自身所有等利潤線的最高點</strong>。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div><svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">q1</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">q2</text><line x1=\"120\" y1=\"50\" x2=\"360\" y2=\"200\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></line><text x=\"366\" y=\"200\" font-size=\"12\" fill=\"#1f3a5f\">R1(q2)</text><line x1=\"80\" y1=\"180\" x2=\"300\" y2=\"60\" stroke=\"#b5542e\" stroke-width=\"2.2\"></line><text x=\"306\" y=\"60\" font-size=\"12\" fill=\"#b5542e\">R2(q1)</text><circle cx=\"190\" cy=\"135\" r=\"4\" fill=\"#1e7d32\"></circle><text x=\"198\" y=\"131\" font-size=\"11\" fill=\"#1e7d32\">Nash 屇內 E*</text></svg><p class=\"figcap\">庫諾模型：兩反應函數交點即納許均衡。(p.395)</p></div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>必考：從需求線 <span class=\"fx\">P=a-bQ</span>、<span class=\"fx\">MC=c</span> 推導反應函數與庫諾均衡數量。</li><li>記憶口訣：雙占同質 + 對稱成本 → 各做 <span class=\"fx\">(a-c)/3b</span>；獨占做 <span class=\"fx\">(a-c)/2b</span>；完全競爭做 <span class=\"fx\">(a-c)/b</span>。</li><li>等利潤線圖形解讀：領先者會選「使自身等利潤線與對手反應函數相切」的點（連結 13.3）。</li></ul>\n</div>\n</div>"}, {"id": "13.3", "title": "史塔伯克（Stackelberg）模型(p.417–p.422)", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc21\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">史塔伯克模型</div><div class=\"mc-body\"><div class=\"mc-formula\">兩家廠商的產量決策有「先後順序」，是一個<strong>有先動（first-move）優勢</strong>的數量領導/追隨模型。</div><div class=\"mc-detail\">兩家廠商的產量決策有「先後順序」，是一個<strong>有先動（first-move）優勢</strong>的數量領導/追隨模型。</div></div></div>\n<p class=\"def-note\">領導者（Leader）先決定產量，追隨者（Follower）觀察到後再決定。</p>\n<h4 class=\"sub3\">模型假設</h4>\n<ol><li>一產業只有兩個廠商。</li><li>產品同質，追求利潤極大化。</li><li>一家廠商先做產量決策，另一家觀察後再做。</li><li>追隨者把對手產量視為固定並利潤極大化；領導者把追隨者的反應函數納入自身利潤函數。</li><li>一次性賽局。</li></ol>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>市場需求與成本：<span class=\"fx\">P=a-bQ</span>、<span class=\"fx\">Q=q<sub>1</sub>+q<sub>2</sub></span>、<span class=\"fx\">MC<sub>1</sub>=MC<sub>2</sub>=c</span>。</li><li>追隨者反應函數（同庫諾）：</li></ul>\n<p><span class=\"fx\">q<sub>2</sub>=(a-c)/(2b)-1/2q<sub>1</sub></span>(p.418)</p>\n<ul><li>領導者極大化：把追隨者反應函數代入：</li></ul>\n<p><span class=\"fx\">\\max<sub>q<sub>1</sub></sub>π<sub>1</sub>=[a-b(q<sub>1</sub>+q<sub>2</sub>)]q<sub>1</sub>-cq<sub>1</sub> s.t. q<sub>2</sub>=(a-c)/(2b)-1/2q<sub>1</sub></span></p>\n<p><span class=\"fx\">(∂π<sub>1</sub>)/(∂ q<sub>1</sub>)=a-c/2-bq<sub>1</sub>=0</span>(p.418)</p>\n<ul><li><strong>1 號為領導者、2 號為追隨者</strong>之均衡：</li></ul>\n<p><span class=\"fx\">q<sub>1</sub><sup>S,Leader</sup>=(a-c)/(2b),\\qquad q<sub>2</sub><sup>S,Follower</sup>=(a-c)/(4b)</span>(p.418)</p>\n<ul><li>反向（2 號領先、1 號跟隨）：</li></ul>\n<p><span class=\"fx\">q<sub>2</sub><sup>S,Leader</sup>=(a-c)/(2b),\\qquad q<sub>1</sub><sup>S,Follower</sup>=(a-c)/(4b)</span>(p.419)</p>\n<ul><li><strong class=\"term\">史塔伯克失衡（Stackelberg disequilibrium）</strong>：若兩家都自認為領導者，則雙方都生產</li></ul>\n<p><span class=\"fx\">q<sub>1</sub><sup>disequilibrium</sup>=q<sub>2</sub><sup>disequilibrium</sup>=(a-c)/(2b)</span>(p.420)</p>\n<p>此時互相破頭，均衡不穩定。</p>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong>先動者利益（first-mover advantage）</strong>：在數量競爭模型下，先發者利潤較高。</li><li>對照庫諾(p.421)：</li><li>庫諾：q=(a−c)/3b，總量 <span class=\"fx\">Q<sup>*</sup>=2(a-c)/3b</span>，<span class=\"fx\">P<sup>*</sup>=(a+2c)/3</span>，個別利潤 <span class=\"fx\">π<sub>c</sub>=(a-c)<sup>2</sup>/9b</span>。</li><li>史塔伯克（領先者先動）：<span class=\"fx\">q<sub>L</sub>=(a-c)/2b</span>，追隨者 <span class=\"fx\">q<sub>f</sub>=(a-c)/4b</span>，總量 <span class=\"fx\">Q<sup>*</sup>=3(a-c)/4b</span>，<span class=\"fx\">P<sup>*</sup>=(a+3c)/4</span>，</li></ul>\n<p><span class=\"fx\">π<sub>L</sub>=((a-c)<sup>2</sup>)/(8b)>π<sub>c</sub>,\\qquad π<sub>f</sub>=((a-c)<sup>2</sup>)/(16b)<π<sub>c</sub></span></p>\n<ul><li>若追隨者「硬幹」與領先者同產量 <span class=\"fx\">q<sub>L</sub>=q<sub>f</sub>=(a-c)/2b</span>，則 <span class=\"fx\">Q<sup>*</sup>=(a-c)/b</span>、<span class=\"fx\">P<sup>*</sup>=c=MC</span>，雙方利潤 <span class=\"fx\">π<sub>L</sub>=π<sub>f</sub>=0</span>。</li><li>兩害相權取其輕：追隨者「乖乖當追隨者」的利潤仍高於玉石俱焚，因此會乖乖反應；領先者的產量決策構成「<strong>可信的威脅（credible threat）</strong>」。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">q1</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">q2</text><line x1=\"120\" y1=\"50\" x2=\"360\" y2=\"200\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></line><text x=\"366\" y=\"200\" font-size=\"12\" fill=\"#1f3a5f\">R1(q2)</text><line x1=\"80\" y1=\"180\" x2=\"300\" y2=\"60\" stroke=\"#b5542e\" stroke-width=\"2.2\"></line><text x=\"306\" y=\"60\" font-size=\"12\" fill=\"#b5542e\">R2(q1)</text><circle cx=\"190\" cy=\"135\" r=\"4\" fill=\"#1e7d32\"></circle><text x=\"198\" y=\"131\" font-size=\"11\" fill=\"#1e7d32\">Nash 均衡 E*</text></svg><p class=\"figcap\">庫諾模型：兩廠反應函數交點即納許均衡。(p.395)</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.3</strong>： (p.421)：兩家同質雙占，<span class=\"fx\">C<sub>1</sub>=30Q<sub>1</sub></span>、<span class=\"fx\">C<sub>2</sub>=30Q<sub>2</sub></span>、<span class=\"fx\">P=150-Q</span>、<span class=\"fx\">Q=Q<sub>1</sub>+Q<sub>2</sub></span>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n<p>(1) Cournot 均衡數量？(2) 廠商 1 先決定、廠商 2 跟進，市場產量？(3) 組成卡特爾追求聯合利潤極大，市場產量？(4) 比較利潤大小。</p>\n<p>書中解法要點：分別帶入 Cournot、Stackelberg、Cartel 三套公式，比較 <span class=\"fx\">π<sub>Cournot</sub></span>、<span class=\"fx\">π<sub>L</sub></span>、<span class=\"fx\">π<sub>f</sub></span>、<span class=\"fx\">π<sub>Cartel</sub></span>。（詳解見書末 QR）</p>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.4</strong>： (p.422)：台達、棕游兩家汽油供應商，<span class=\"fx\">MC<sub>1</sub>=1</span>、<span class=\"fx\">MC<sub>2</sub>=2</span>、<span class=\"fx\">Q=15-P</span>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n<p>(A) Cournot 下 <span class=\"fx\">q<sub>1</sub><sup>*</sup></span>、<span class=\"fx\">q<sub>2</sub><sup>*</sup></span>、<span class=\"fx\">P<sup>*</sup></span>？(B) 無謂損失？(C) Stackelberg（效率較佳者為 leader）<span class=\"fx\">q<sub>1</sub><sup>*</sup></span>、<span class=\"fx\">q<sub>2</sub><sup>*</sup></span>？(D) 合併後無謂損失？</p>\n<p>書中解法要點：先反應函數 → 聯立求 Cournot；成本較低者為 leader 代入追隨者反應函數；合併後按獨占 <span class=\"fx\">MR=MC</span>。（詳解見書末 QR）</p>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>必考：Stackelberg 領先者「把對方反應函數代入自身利潤函數」的推導流程。</li><li>先動者利益 vs. 後動者劣勢的利潤比較（<span class=\"fx\">π<sub>L</sub>>π<sub>c</sub>>π<sub>f</sub></span>）。</li><li>「可信威脅」概念是與 13.8 賽局理論連結的橋樑。</li></ul>\n</div>\n</div>"}, {"id": "13.4", "title": "卡特爾（Cartel）模型(p.423–p.427)", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc20\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">卡特爾</div><div class=\"mc-body\"><div class=\"mc-formula\">廠商間為降低競爭、以公開或祕密方式結合，協商統一價格與銷售配額，追求<strong>聯合利潤極大化</strong>的合作組織。</div><div class=\"mc-detail\">廠商間為降低競爭、以公開或祕密方式結合，協商統一價格與銷售配額，追求<strong>聯合利潤極大化</strong>的合作組織。</div></div></div>\n<p class=\"def-note\">各國多以反托拉斯法（美 Antitrust law；台公平交易法）禁止。</p>\n<p class=\"def-note\">常見案例：各類工會組織、OPEC。</p>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>聯合利潤極大化：</li></ul>\n<p><span class=\"fx\">\\max_\\Q<sub>1</sub>,Q<sub>2</sub>\\π<sub>Joint</sub>=TR(Q<sub>1</sub>+Q<sub>2</sub>)-TC<sub>1</sub>(Q<sub>1</sub>)-TC<sub>2</sub>(Q<sub>2</sub>)</span></p>\n<p>一階條件：</p>\n<p><span class=\"fx\">MR=(∂ TR(Q<sub>1</sub>+Q<sub>2</sub>))/(∂(Q<sub>1</sub>+Q<sub>2</sub>))·(∂(Q<sub>1</sub>+Q<sub>2</sub>))/(∂ Q<sub>1</sub>)=MC<sub>1</sub></span></p>\n<p><span class=\"fx\">MR=(∂ TR(Q<sub>1</sub>+Q<sub>2</sub>))/(∂(Q<sub>1</sub>+Q<sub>2</sub>))·(∂(Q<sub>1</sub>+Q<sub>2</sub>))/(∂ Q<sub>2</sub>)=MC<sub>2</sub></span></p>\n<p>故最適條件：</p>\n<p><span class=\"fx\">MR=MC<sub>1</sub>=MC<sub>2</sub></span>(p.423)</p>\n<ul><li>個別廠商「背叛」利潤極大化（視對手產量固定）：</li></ul>\n<p><span class=\"fx\">MR<sub>1</sub>=(∂ P)/(∂(Q<sub>1</sub>+Q<sub>2</sub>))·(∂(Q<sub>1</sub>+Q<sub>2</sub>))/(∂ Q<sub>1</sub>)Q<sub>1</sub>+P=MC<sub>1</sub></span></p>\n<p><span class=\"fx\">MR<sub>2</sub>=(∂ P)/(∂(Q<sub>1</sub>+Q<sub>2</sub>))·(∂(Q<sub>1</sub>+Q<sub>2</sub>))/(∂ Q<sub>2</sub>)Q<sub>2</sub>+P=MC<sub>2</sub></span>(p.424)</p>\n<p>→ 個別利潤極大化與聯合利潤極大化的條件不同，<strong>因此廠商有誘因違背組織規定</strong>。</p>\n<ul><li><strong>Chamberline（秦柏霖）的寡占解</strong>（若兩廠默契合作如卡特爾）：</li></ul>\n<p><span class=\"fx\">P=a-bQ, Q=q<sub>1</sub>+q<sub>2</sub>, MC<sub>1</sub>=MC<sub>2</sub>=c</span></p>\n<p><span class=\"fx\">π<sub>Joint</sub>=[a-b(q<sub>1</sub>+q<sub>2</sub>)](q<sub>1</sub>+q<sub>2</sub>)-c(q<sub>1</sub>+q<sub>2</sub>)</span></p>\n<p><span class=\"fx\">(∂π<sub>Joint</sub>)/(∂ q<sub>1</sub>)=(∂π<sub>Joint</sub>)/(∂ q<sub>2</sub>)=a-2b(q<sub>1</sub>+q<sub>2</sub>)-c=0</span></p>\n<p>得</p>\n<p><span class=\"fx\">q<sub>1</sub><sup>Chamberline</sup>=q<sub>2</sub><sup>Chamberline</sup>=(a-c)/(4b)</span>(p.426)</p>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>卡特爾運作兩件事：(1) 決定統一價格（成員如同完全競爭廠商是價格接受者，<span class=\"fx\">P=MC</span> 決定個別配額）；(2) 依 <span class=\"fx\">∑ MC</span> 水平加總後再分配銷售配額（<strong>非平均分</strong>）。</li><li>圖形機制(p.424)：把兩家 <span class=\"fx\">MC<sub>1</sub></span>、<span class=\"fx\">MC<sub>2</sub></span> 水平加總成 <span class=\"fx\">∑ Q(MC)</span>，與市場 <span class=\"fx\">MR</span> 交於 <span class=\"fx\">E<sup>*</sup></span> 決定總產 <span class=\"fx\">Q<sup>*</sup></span>、價格 <span class=\"fx\">P<sup>*</sup></span>，再將 <span class=\"fx\">P<sup>*</sup></span> 高度分回各廠，得 <span class=\"fx\">E<sub>1</sub><sup>*</sup></span>、<span class=\"fx\">E<sub>2</sub><sup>*</sup></span> 與 <span class=\"fx\">Q<sub>1</sub><sup>*</sup></span>、<span class=\"fx\">Q<sub>2</sub><sup>*</sup></span>；生產者剩餘分別為 <span class=\"fx\">P<sup>*</sup>b<sub>1</sub>E<sub>1</sub><sup>*</sup>a<sub>1</sub></span> 與 <span class=\"fx\">P<sup>*</sup>b<sub>2</sub>E<sub>2</sub><sup>*</sup>a<sub>2</sub></span>。</li><li><strong>欺騙（Cheating）誘因</strong>(p.425)：</li><li>若按組織配額生產，利潤 <span class=\"fx\">P<sub>2</sub>b'b''AC</span>。</li><li>個別廠商會私下按 <span class=\"fx\">P<sub>2</sub>=MC<sub>i</sub></span> 增產到 <span class=\"fx\">Q<sub>3</sub><sup>c</sup></span>，自以為可賺 <span class=\"fx\">(c'-c)× Q<sub>3</sub><sup>c</sup>>P<sub>2</sub>b'b''AC</span>。</li><li>但所有人都這麼做 → 市場產量增至 <span class=\"fx\">Q<sub>3</sub></span>、價格跌至 <span class=\"fx\">P<sub>3</sub></span>，個別利潤 <strong>< 0</strong>。</li><li>四種情境比較表(p.426)：</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"></colgroup><thead><tr><th></th><th>完全競爭</th><th>卡特爾</th><th>單獨欺騙</th><th>所有人皆欺騙</th></tr></thead><tbody><tr><td><span class=\"fx\">P</span></td><td><span class=\"fx\">P<sub>1</sub></span></td><td><span class=\"fx\">P<sub>2</sub></span></td><td><span class=\"fx\">P<sub>2</sub></span></td><td><span class=\"fx\">P<sub>3</sub></span></td></tr><tr><td><span class=\"fx\">Q<sub>i</sub></span></td><td><span class=\"fx\">Q<sub>1</sub><sup>a</sup></span></td><td><span class=\"fx\">Q<sub>2</sub><sup>b</sup></span></td><td><span class=\"fx\">Q<sub>3</sub><sup>c</sup></span></td><td><span class=\"fx\">Q<sub>3</sub><sup>c</sup></span></td></tr><tr><td><span class=\"fx\">Q</span></td><td><span class=\"fx\">Q<sub>1</sub></span></td><td><span class=\"fx\">Q<sub>2</sub></span></td><td><span class=\"fx\">Q<sub>2</sub>'</span></td><td><span class=\"fx\">Q<sub>3</sub></span></td></tr><tr><td>利潤</td><td><span class=\"fx\">0</span></td><td><span class=\"fx\">P<sub>2</sub>b'b''AC</span></td><td><span class=\"fx\">>P<sub>2</sub>b'b''AC</span></td><td><span class=\"fx\"><0</span></td></tr></tbody></table></div>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><text x=\"110\" y=\"18\" text-anchor=\"middle\" font-size=\"10\" fill=\"#6c7684\">卡特爾 MC 水平加總</text><line x1=\"60\" y1=\"230\" x2=\"200\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.3\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"40\" stroke=\"#2b251d\" stroke-width=\"1.3\"></line><line x1=\"70\" y1=\"60\" x2=\"190\" y2=\"210\" stroke=\"#1e7d32\" stroke-width=\"1.8\"></line><line x1=\"70\" y1=\"210\" x2=\"190\" y2=\"80\" stroke=\"#b5542e\" stroke-width=\"1.8\"></line><text x=\"310\" y=\"18\" text-anchor=\"middle\" font-size=\"10\" fill=\"#6c7684\">MR 決定 Q* 價格分回</text><line x1=\"240\" y1=\"230\" x2=\"380\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.3\"></line><line x1=\"240\" y1=\"230\" x2=\"240\" y2=\"40\" stroke=\"#2b251d\" stroke-width=\"1.3\"></line><line x1=\"250\" y1=\"60\" x2=\"370\" y2=\"200\" stroke=\"#1e7d32\" stroke-width=\"1.8\"></line><line x1=\"250\" y1=\"60\" x2=\"370\" y2=\"160\" stroke=\"#b5542e\" stroke-width=\"1.6\"></line><circle cx=\"300\" cy=\"150\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"306\" y=\"146\" font-size=\"9\" fill=\"#6b4e8e\">MR=∑MC</text></svg><p class=\"figcap\">卡特爾如獨占：∑MC 與 MR 交點定 Q*、P*，再分配配額。(p.405)</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.5</strong>： (p.426)：<span class=\"fx\">P=110-0.5(Q<sub>1</sub>+Q<sub>2</sub>)</span>、<span class=\"fx\">MC=10</span>、<span class=\"fx\">FC=0</span>，兩廠勾結求聯合利潤極大。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">π<sub>Joint</sub>=P(Q<sub>1</sub>+Q<sub>2</sub>)-10(Q<sub>1</sub>+Q<sub>2</sub>)</span>，一階條件 <span class=\"fx\">MR=10</span>。（詳解見書末 QR）</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.6</strong>： (p.426)：<span class=\"fx\">C<sub>1</sub>=60Q<sub>1</sub></span>、<span class=\"fx\">C<sub>2</sub>=60Q<sub>2</sub></span>、<span class=\"fx\">P=300-Q</span>。Cournot-Nash 下廠商 2 利潤 (1)；Cartel 下總產 (2)、各廠利潤 (3)。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.7</strong>： (p.427)：卡特爾長期無法維持的最重要原因？<div class=\"opts\"><div>(A) 利潤反而降低</div><div>(B) 消費者抵制</div><div>(C) 組織內廠商有互相欺騙的誘因</div><div>(D) 其他廠商無法加入</div><div>(E) 政府管制</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<strong>(C)</strong>。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.8</strong>： (p.427)：Cartel 非重複賽局的優勢策略均衡？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<strong>雙方都違反協議（both firms cheat）</strong>，即囚犯困境。（詳解見書末 QR）</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.9</strong>： (p.427)：<span class=\"fx\">P=150-0.4(q<sub>1</sub>+q<sub>2</sub>)</span>、<span class=\"fx\">C<sub>1</sub>=8q<sub>1</sub></span>、<span class=\"fx\">C<sub>2</sub>=10q<sub>2</sub></span><br>(1) 同時決定產量的均衡總產？<br>(2) 廠商 1 先決定、廠商 2 觀察後再決定？（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 13.10</strong>： (p.427)：<span class=\"fx\">P=460-2(q<sub>R</sub>+q<sub>M</sub>)</span>、<span class=\"fx\">C<sub>R</sub>=25+10q<sub>R</sub>+q<sub>R</sub><sup>2</sup></span>、<span class=\"fx\">C<sub>M</sub>=60+24q<sub>M</sub>+2q<sub>M</sub><sup>2</sup></span><br>(1) 聯合壟斷下 <span class=\"fx\">q<sub>R</sub></span>、<span class=\"fx\">P</span>？<br>(2) Cournot 下 <span class=\"fx\">q<sub>R</sub></span>、<span class=\"fx\">q<sub>M</sub></span>？（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>必考：卡特爾最適條件 <span class=\"fx\">MR=MC<sub>1</sub>=MC<sub>2</sub></span> 與個別背叛條件的差異。</li><li>為什麼卡特爾長期不穩定？→ 個別 <span class=\"fx\">P>MC<sub>i</sub></span> 時，私下增產的邊際利潤 > 邊際成本，每個廠商都有欺騙誘因。</li><li>連結 13.8：卡特爾就是一次賽局下的囚犯困境。</li></ul>\n</div>\n</div>"}, {"id": "13.5", "title": "貝銓（Bertrand）模型(p.428–p.431)", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc19\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\"><strong class=\"proper\">貝銓模型</strong></div><div class=\"mc-body\"><div class=\"mc-formula\">寡占廠商以<strong>價格</strong>為決策變數的同時競爭模型（車商間價格戰為典型）。</div><div class=\"mc-detail\">寡占廠商以<strong>價格</strong>為決策變數的同時競爭模型（車商間價格戰為典型）。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式（商品同質）</div>\n<ul><li>假設：所有廠商成本結構相同、<span class=\"fx\">MC=0</span>；每家產能足以獨自供應整個市場。</li><li>市場價格：</li></ul>\n<p><span class=\"fx\">P<sup>*</sup>=Min\\P<sub>1</sub>,P<sub>2</sub>\\</span></p>\n<ul><li>個別廠商面對的需求：</li></ul>\n<p><span class=\"fx\">q<sub>i</sub>=\\begincasesQ(P<sub>i</sub>)&P<sub>i</sub><p<sub>j</sub>\\\\ \\dfracQ(P)2&P<sub>i</sub>=P<sub>j</sub>\\\\ 0&P<sub>i</sub>>P<sub>j</sub>\\endcases</span>(p.428)</p>\n<ul><li>雙方成本相同 <span class=\"fx\">MC<sub>1</sub>=MC<sub>2</sub>=c</span> 時：</li><li>個別利潤：</li></ul>\n<p><span class=\"fx\">π<sub>i</sub>=(P<sub>i</sub>-c)Q(P<sub>i</sub>) if P<sub>i</sub><p<sub>j</sub></span></p>\n<p><span class=\"fx\">π<sub>i</sub>=\\tfrac12(P<sub>i</sub>-c)Q(P<sub>i</sub>) if P<sub>i</sub>=P<sub>j</sub></span></p>\n<p><span class=\"fx\">π<sub>i</sub>=0 if P<sub>i</sub>>P<sub>j</sub></span>(p.429)</p>\n<ul><li><strong>貝銓均衡</strong>：</li></ul>\n<p><span class=\"fx\">P<sub>1</sub><sup>*</sup>=P<sub>2</sub><sup>*</sup>=c=MC</span>(p.429)</p>\n<ul><li>成本不盡相同 <span class=\"fx\">MC<sub>2</sub>>MC<sub>1</sub></span> 時：</li></ul>\n<p><span class=\"fx\">P<sub>2</sub><sup>*</sup>=MC<sub>2</sub>, P<sub>1</sub><sup>*</sup>=MC<sub>2</sub>-ε, ∀ε>0</span></p>\n<p><span class=\"fx\">Q<sub>2</sub><sup>*</sup>=0, Q<sub>1</sub><sup>*</sup>=Q<sup>d</sup>(P<sub>1</sub><sup>*</sup>)=Q<sup>d</sup>(MC<sub>2</sub>-ε)</span></p>\n<p><span class=\"fx\">π<sub>1</sub>=P<sub>1</sub><sup>*</sup>Q<sup>d</sup>-MC<sub>1</sub>Q<sup>d</sup>>0</span>(p.429)</p>\n</div>\n<div class=\"callout formula\"><div class=\"clabel\">公式（商品異質）</div>\n<ul><li>範例(p.430–p.431)：</li></ul>\n<p><span class=\"fx\">Q<sub>A</sub>=10-2P<sub>A</sub>+P<sub>B</sub>,\\qquad Q<sub>B</sub>=12-2P<sub>B</sub>+P<sub>A</sub></span></p>\n<p><span class=\"fx\">C<sub>A</sub>=5+Q<sub>A</sub>,\\qquad C<sub>B</sub>=10+3Q<sub>B</sub></span></p>\n<ul><li>利潤：</li></ul>\n<p><span class=\"fx\">π<sub>A</sub>=P<sub>A</sub>Q<sub>A</sub>-C<sub>A</sub>=12P<sub>A</sub>-2P<sub>A</sub><sup>2</sup>+P<sub>A</sub>P<sub>B</sub>-15-P<sub>B</sub></span></p>\n<p><span class=\"fx\">π<sub>B</sub>=P<sub>B</sub>Q<sub>B</sub>-C<sub>B</sub>=18P<sub>B</sub>-2P<sub>B</sub><sup>2</sup>+P<sub>A</sub>P<sub>B</sub>-46-3P<sub>A</sub></span></p>\n<ul><li>反應函數：</li></ul>\n<p><span class=\"fx\">(∂π<sub>A</sub>)/(∂ P<sub>A</sub>)=12-4P<sub>A</sub>+P<sub>B</sub>=0 ⇒ P<sub>A</sub>=3+P<sub>B</sub>/4=γ<sub>R</sub>(P<sub>B</sub>)</span></p>\n<p><span class=\"fx\">(∂π<sub>B</sub>)/(∂ P<sub>B</sub>)=18-4P<sub>B</sub>+P<sub>A</sub>=0 ⇒ P<sub>B</sub>=18/4+P<sub>A</sub>/4=γ<sub>B</sub>(P<sub>A</sub>)</span>(p.431)</p>\n<ul><li>聯立解：</li></ul>\n<p><span class=\"fx\">P<sub>A</sub><sup>*</sup>=4.4,\\qquad P<sub>B</sub><sup>*</sup>=5.6</span>(p.431)</p>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong>貝銓矛盾（Bertrand paradox）</strong>：同質 + <span class=\"fx\">MC</span> 相同下，<strong>僅兩家廠商</strong>的價格競爭結果竟與完全競爭相同（<span class=\"fx\">P=MC</span>），但「兩家或少數廠商有競爭性」在現實很難成立。</li><li>同質下的削價競爭（undercutting）：只要比對手便宜一點點就能獨吞市場，故雙方不斷降價直到 <span class=\"fx\">P=MC</span>。</li><li>異質下，價格是策略互補（<span class=\"fx\">P<sub>A</sub></span> 上升會引起 <span class=\"fx\">P<sub>B</sub></span> 上升），均衡
