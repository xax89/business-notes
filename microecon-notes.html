<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微觀天地 學個經｜研究所複習筆記</title>
<style>

:root{
  --fs:16px;
  --paper:#f6f0e2;
  --ink:#2b251d;
  --panel:#fffdf6;
  --line:#e4d9bf;
  --muted:#6f6555;
  --nav-bg:#f1e9d5;
  --nav-ink:#4a4234;
  --nav-hover:#e7dcc0;
  --nav-active:#3c6e8f;
  --accent:#b5542e;
  --accent-soft:#fbeae2;
  --teal:#2c6e9e;
  --teal-soft:#eef3f4;
  --green:#1e7d32;
  --hl:#ffe94a;
  --radius:12px;
  --blue:#2c6e9e;--green2:#3a7d44;--orange:#c06a24;--purple:#6b4e8e;--brown:#8a5a3b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Serif TC","PMingLiU","PingFang TC",serif;
  font-size:var(--fs);
  background:var(--paper);
  color:var(--ink);
  line-height:1.8;
  display:flex;
  min-height:100vh;
}
body.dark{
  --paper:#16130d;--ink:#e6e0d2;--panel:#201c14;--line:#3a3325;
  --muted:#a0937a;--nav-bg:#1f1a10;--nav-ink:#cfc4ad;--nav-hover:#332b1b;
  --nav-active:#4a8ab5;--accent:#e08a55;--accent-soft:#2f2014;
  --teal:#5f9fc0;--teal-soft:#14242e;--green:#5cb56e;--hl:#5a4a1e;
  --blue:#5f9fc0;--green2:#5cb56e;--orange:#d98a4a;--purple:#9b7fc0;--brown:#b08a5a;
}
/* ===== 側邊目錄（兩層） ===== */
.sidebar{
  width:280px;flex-shrink:0;background:var(--nav-bg);color:var(--nav-ink);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 18px 40px;
  border-right:1px solid var(--line);
}
.sidebar .brand{font-weight:700;font-size:15px;letter-spacing:.02em;line-height:1.4;margin-bottom:4px;color:var(--ink)}
.sidebar .brand .t2{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.nav-chapter{
  display:flex;align-items:center;gap:8px;width:100%;padding:4px 10px;border-radius:6px;
  cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);
  border:none;background:none;text-align:left;margin-top:8px;font-family:inherit;line-height:1.45;
}
.nav-chapter:hover{background:var(--nav-hover)}
.nav-chapter.active{background:var(--nav-active);color:#fff}
.nav-chapter .num{font-size:11px;font-weight:600;opacity:.65;width:26px;flex-shrink:0}
.nav-chapter.active .num{opacity:.9}
.nav-chapter .tag{margin-left:auto;font-size:10px;opacity:.55;letter-spacing:.05em;font-weight:400}
.nav-chapter .tag.done{color:var(--green2);opacity:1}
.nav-sub{
  display:block;width:100%;padding:3px 10px 3px 34px;border-radius:6px;
  cursor:pointer;font-size:12.5px;color:var(--muted);border:none;background:none;text-align:left;font-family:inherit;line-height:1.45;
}
.nav-sub:hover{background:var(--nav-hover);color:var(--ink)}
.nav-sub.active{color:var(--nav-active);font-weight:700}
.nav-gloss{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:6px;margin-top:10px;
  cursor:pointer;font-size:13.5px;font-weight:700;color:#8a6d1a;border:1.5px dashed #d9b84a;background:#fffaf0;
  text-align:left;font-family:inherit;line-height:1.45;transition:all .15s;
}
.nav-gloss:hover{border-color:#c9a227;color:#c9a227;background:#fff6dd}
.nav-gloss svg{width:15px;height:15px;flex-shrink:0}
.nav-gloss.active{background:#c9a227;color:#fff;border-style:solid}
.search-panel{
  position:fixed;top:66px;left:50%;transform:translateX(-50%);width:min(680px,92vw);max-height:62vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.16);z-index:60;
}
.search-panel .sp-item{display:block;width:100%;text-align:left;padding:10px 16px;border:none;border-bottom:1px solid var(--line);background:none;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);line-height:1.5}
.search-panel .sp-item:hover{background:var(--nav-hover)}
.search-panel .sp-tag{display:inline-block;font-size:11px;color:var(--teal);font-weight:700;margin-right:8px;letter-spacing:.03em;white-space:nowrap}
.search-panel .sp-item b{display:block;font-size:13.5px;margin:2px 0}
.search-panel .sp-snip{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-panel .sp-count{padding:8px 16px;font-size:12px;color:var(--muted);text-align:center}
.search-panel .sp-empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:13.5px}
body.dark .search-panel{background:#26221a;border-color:#4a4234}
/* ===== 主內容 ===== */
.main{flex:1;min-width:0;padding:28px 34px 80px}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);padding:10px 0 14px;margin-bottom:18px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.searchbox{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.searchbox svg{width:16px;height:16px;opacity:.45;flex-shrink:0}
.searchbox input{border:none;outline:none;background:none;font-size:14px;width:100%;color:var(--ink);font-family:inherit}
.toolbtn{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit;transition:all .15s;
}
.toolbtn:hover{border-color:var(--teal);color:var(--teal)}
.toolbtn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.toolbtn svg{width:15px;height:15px}
/* 章頭 */
.chapter-head{border-left:8px solid var(--teal);padding:6px 0 10px 18px;margin:30px 0 18px}
.chapter-head .kicker{display:inline-block;font-size:12px;letter-spacing:.15em;color:var(--teal);font-family:"Noto Sans TC",sans-serif;font-weight:600}
.chapter-head h1{font-family:"Noto Serif TC",serif;font-size:27px;line-height:1.25;margin:2px 0 4px}
.chapter-head p{color:var(--muted);font-size:14.5px;max-width:760px;margin-top:6px}
/* 小節 */
.section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.section-head{
  display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none;
  font-family:"Noto Serif TC",serif;font-size:19px;font-weight:600;border-bottom:2px solid transparent;transition:border-color .15s;
}
.section.open .section-head{border-bottom-color:var(--teal)}
.section-head .sec-num{color:var(--teal);font-size:12.5px;font-weight:700;font-family:"Noto Sans TC",sans-serif;letter-spacing:.08em;flex-shrink:0}
.section-head .chev{width:18px;height:18px;margin-left:auto;transition:transform .2s;flex-shrink:0}
.section.open .section-head .chev{transform:rotate(180deg)}
.section-body{display:none;padding:4px 20px 18px}
.section.open .section-body{display:block}
.section-body p{margin:10px 0;font-size:14.8px}
.section-body ul{margin:8px 0;padding-left:24px}
.section-body li{margin:3px 0}
/* callout 盒子（參考章節筆記風格） */
.section-body .note{background:#fdf0c2;border-left:4px solid #d9a514;padding:12px 16px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.section-body .note::before{content:"重點與結論";display:block;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#8a6d1a;margin-bottom:4px}
.section-body .warn{background:var(--accent-soft);border-left:4px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.section-body .warn::before{content:"考試重點";display:block;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin-bottom:4px}
.section-body .src{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
.section-body .src summary{cursor:pointer;font-size:12.5px;color:var(--teal)}
.section-body .src pre{white-space:pre-wrap;font-family:"Noto Serif TC",serif;font-size:13px;color:var(--muted);margin-top:8px;max-height:280px;overflow-y:auto}
/* 公式卡 */
.formula{background:#fbf4e6;border:1px dashed #c9b88f;border-radius:8px;padding:14px 18px;margin:12px 0;font-size:15.5px;text-align:center;font-family:"Noto Serif TC",serif}
.formula .f-label{display:block;font-size:11.5px;color:#9a6a1f;letter-spacing:.08em;margin-bottom:4px;font-family:"Noto Sans TC",sans-serif;font-weight:700}
.formula .f-note{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-family:"Noto Sans TC",sans-serif}
/* 術語 */
.term{color:var(--green);font-weight:700;cursor:pointer;border-bottom:1.5px dashed color-mix(in srgb,var(--green) 55%,transparent);border-radius:3px;padding:0 2px;transition:all .15s}
.term:hover{background:var(--green);color:#fff;border-bottom:none}
/* 專有名詞（人名／事件）深紫粗體 */
.proper{color:#7b2cbf;font-weight:700;cursor:pointer;border-bottom:1.5px dashed color-mix(in srgb,#7b2cbf 50%,transparent);border-radius:3px;padding:0 2px;transition:background .15s}
.proper:hover{background:#7b2cbf;color:#fff;border-bottom:none}
body.dark .proper{color:#b39ddb}
body.dark .proper:hover{background:#b39ddb;color:#1a1420}
/* 術語列表與知識卡：人物/書名類紫色粗體 */
#termModalEn{color:var(--green)}
#termModalEn.proper,#termModalZh.proper{color:#7b2cbf}
body.dark #termModalEn.proper,body.dark #termModalZh.proper{color:#b39ddb}
#termModalDef .proper{color:#7b2cbf;font-weight:700;border-bottom:1.5px dashed color-mix(in srgb,#7b2cbf 50%,transparent)}
body.dark #termModalDef .proper{color:#b39ddb}
.gloss-en.proper,.gloss-zh.proper{color:#7b2cbf}
body.dark .gloss-en.proper,body.dark .gloss-zh.proper{color:#b39ddb}
/* 例題 */
.problem{background:#eae6da;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:14px 0}
.problem .p-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;color:var(--teal);margin-bottom:8px}
.problem .p-body{font-size:14.5px}
.problem .opts{margin:10px 0 4px;display:grid;gap:6px}
.problem .opts div{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.8px;background:var(--panel)}
body.dark .problem{background:#26221a}
.ans-btn{
  margin-top:12px;display:inline-flex;align-items:center;gap:8px;background:none;border:1.5px solid var(--teal);
  color:var(--teal);border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .15s;
}
.ans-btn:hover{background:var(--teal);color:#fff}
.fav{
  margin-left:auto;background:none;border:1.5px solid var(--line);color:var(--muted);border-radius:8px;
  padding:3px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;
}
.fav:hover{border-color:#c9a227;color:#c9a227}
.fav.on{border-color:#c9a227;background:#fffaf0;color:#c9a227;font-weight:700}
body.dark .fav.on{background:#3a3320}
.ans{display:none;margin-top:12px;background:var(--teal-soft);border-radius:8px;padding:12px 16px;font-size:14px}
.ans.show{display:block}
.ans .a-label{font-weight:700;color:var(--teal);font-size:13px}
.ans ul{margin:6px 0 2px;padding-left:22px}
.ans li{margin:3px 0}
.ans b{font-weight:700}
/* 術語卡區 */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin:16px 0}
.flip-card{perspective:900px;height:150px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);padding:12px;text-align:center}
.flip-front{background:var(--panel)}
.flip-front .en{font-size:16px;font-weight:700;color:var(--teal);word-break:break-word}
.flip-front .zh{font-size:13px;color:var(--muted)}
.flip-back{background:var(--teal);color:#fff;transform:rotateY(180deg)}
.flip-back .def{font-size:13px;line-height:1.6}
.flip-hint{font-size:11px;opacity:.5;margin-top:4px}
/* ===== 術語表（列表形式） ===== */
.gloss-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.gloss-cats{display:flex;gap:6px;flex-wrap:wrap}
.gloss-cat-btn{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 13px;font-size:12.5px;cursor:pointer;color:var(--muted);transition:all .15s}
.gloss-cat-btn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.gloss-progress{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.gloss-progress .bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.gloss-progress .fill{height:100%;background:var(--teal);width:0%;transition:width .3s}
.gloss-progress .label{font-size:13px;color:var(--muted);white-space:nowrap}
.gloss-group{margin-bottom:16px}
.gloss-group h3{font-size:14px;color:var(--teal);margin:14px 0 8px;padding-left:10px;border-left:3px solid var(--teal);letter-spacing:.04em}
.gloss-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:8px 0;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s}
.gloss-item.starred{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gloss-check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;cursor:pointer;display:grid;place-items:center;margin-top:2px;transition:all .15s;background:none;padding:0}
.gloss-check svg{width:14px;height:14px;display:none;color:#fff}
.gloss-check.done{background:var(--teal);border-color:var(--teal)}
.gloss-check.done svg{display:block}
.gloss-item.done .gloss-en{text-decoration:line-through;opacity:.55}
.gloss-main{flex:1;min-width:0}
.gloss-en{font-weight:700;color:var(--green);font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gloss-zh{font-size:15px;color:var(--green);font-weight:700;margin-left:2px}
.gloss-def{font-size:13.5px;margin-top:4px;line-height:1.8}
.gloss-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.gloss-btn{border:1px solid var(--line);background:none;border-radius:7px;padding:3px 10px;font-size:11.5px;cursor:pointer;color:var(--muted);transition:all .15s}
.gloss-btn:hover{color:var(--teal);border-color:var(--teal)}
.gloss-btn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.gloss-note{display:none;margin-top:8px}
.gloss-note.show{display:block}
.gloss-note textarea{width:100%;min-height:56px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--paper);color:var(--ink);font-family:inherit;resize:vertical}
.gloss-note textarea:focus{outline:none;border-color:var(--teal)}
.gloss-data-actions{display:flex;gap:8px;margin-left:auto}
/* 搜尋高亮 */
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
mark.hl{background:var(--hl)}
/* 重點高亮（使用者標記） */
.userhl{background:var(--hl);border-radius:3px;cursor:pointer;box-shadow:0 0 0 2px var(--hl)}
/* 畫記模式 */
body.marking{cursor:crosshair}
body.marking .section-body p,body.marking .section-body li,body.marking .section-body .note,body.marking .section-body .warn,body.marking .problem .p-body{cursor:crosshair;border-radius:3px;transition:box-shadow .12s}
body.marking .section-body p:hover,body.marking .section-body li:hover,body.marking .section-body .note:hover,body.marking .section-body .warn:hover,body.marking .problem .p-body:hover{box-shadow:0 0 0 2px rgba(255,233,74,.45);background:rgba(255,233,74,.12)}
/* 進度條 */
.progress-strip{display:flex;gap:6px;margin:14px 0 6px}
.progress-strip i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress-strip i.done{background:var(--teal)}
.progress-strip i.na{background:none;border:1px dashed var(--line);height:3px}
.progress-label{font-size:12px;color:var(--muted);margin-top:4px}
.p-head .done-btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted);font-family:inherit;flex-shrink:0;transition:all .15s}
.p-head .done-btn:hover{border-color:var(--green);color:var(--green)}
.p-head .done-btn.on{background:#e3f0e3;border-color:var(--green);color:var(--green);font-weight:700}
body.dark .p-head .done-btn.on{background:#1d2b1d}
.prob-progress{font-size:13px;font-weight:600;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--teal-soft);color:var(--teal);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:500}
/* 提示條 */
.banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px;padding:14px 18px;font-size:13.5px;color:var(--ink);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:18px;height:18px;flex-shrink:0;color:var(--accent);margin-top:2px}
/* 空狀態 */
.empty{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
.empty.show{display:block}
.empty .big{font-size:40px;margin-bottom:10px}
.chpage{font-size:12.5px;color:var(--muted);font-family:"Noto Sans TC",sans-serif}
.chapter-head .ch-points{margin:10px 0 0;padding-left:22px;font-size:14.5px;color:var(--ink)}
.chapter-head .ch-points li{margin:3px 0}
/* 方法學習卡（左打勾＋方法名＋公式說明，底下例子） */
.method-card{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;margin:12px 0;background:var(--panel);overflow:hidden;transition:opacity .2s}
.method-card .mc-check{width:64px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--panel)}
.method-card .mc-check input{width:19px;height:19px;accent-color:var(--green);cursor:pointer}
.method-card .mc-check .mc-lbl{font-size:11px;color:var(--muted)}
.method-card .mc-check:has(input:checked){background:#eef7ec}
.method-card .mc-check:has(input:checked) .mc-lbl{color:var(--green);font-weight:700}
.method-card .mc-left{width:34px;flex-shrink:0;background:var(--teal-soft);border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:8px 2px;font-family:"Noto Sans TC",sans-serif;font-weight:700;color:var(--teal);font-size:13px;text-align:center;line-height:1.4;writing-mode:vertical-rl;letter-spacing:.08em}
.method-card .mc-body{flex:1;padding:12px 16px;font-size:14px;min-width:0}
.method-card .mc-formula{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.method-card .mc-detail{font-size:13px;color:var(--muted)}
.method-card .mc-ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
/* 學會：刪除線＋黯淡 */
.method-card.learned{opacity:.55}
.method-card.learned .mc-formula,.method-card.learned .mc-detail,.method-card.learned .mc-ex{text-decoration:line-through;text-decoration-thickness:1.5px}
/* 標題式學習卡（標題橫排） */
.method-card.mc-title .mc-left{writing-mode:initial;width:auto;min-width:96px;padding:10px 8px;font-size:13px}
body.dark .method-card .mc-check:has(input:checked){background:#16241a}
@media (max-width:900px){
  .method-card{flex-wrap:wrap}
  .method-card .mc-check{width:56px;border-right:1px solid var(--line);border-bottom:none;flex-direction:column;padding:6px}
  .method-card .mc-left{flex:0 0 auto;width:auto;min-width:88px;border-right:1px solid var(--line);border-bottom:none;padding:8px 14px}

/* 左右布局公式卡（左說明＋右公式＋底例子） */
.f-split{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0;background:var(--panel)}
.f-split .fs-row{display:flex;flex-wrap:wrap;align-items:stretch}
.f-split .fs-left{flex:1 1 250px;padding:14px 16px;font-size:14px}
.f-split .fs-label{font-family:"Noto Sans TC",sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--teal);margin-bottom:6px}
.f-split .fs-left p{margin:0;font-size:14px}
.f-split .fs-right{flex:1 1 280px;padding:14px 16px;border-left:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.f-split .fs-right .formula{margin:0;width:100%}
.f-split .fs-ex{padding:10px 16px;border-top:1px dashed var(--line);background:#f6f1e3;font-size:13.5px}

/* 比較表格 */
.tblwrap{overflow-x:auto;margin:14px 0}
.tblwrap table{border-collapse:separate;border-spacing:0;border:1px solid #e0d5ba;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(120,100,50,.10);width:100%;table-layout:fixed;background:var(--panel);font-size:13.5px}
.tblwrap caption{caption-side:top;text-align:left;font-weight:800;font-size:14px;color:#4a3f2a;padding:2px 2px 8px;letter-spacing:.02em}
.tblwrap th,.tblwrap td{border-right:1px solid #e8dfc8;border-bottom:1px solid #e8dfc8;padding:8px 10px;vertical-align:top;word-break:break-word}
.tblwrap th{background:#e9dcb8;color:#4a3f2a;font-size:13px}
.tblwrap th:last-child,.tblwrap td:last-child{border-right:none}
.tblwrap tbody tr:last-child td{border-bottom:none}
.tblwrap tbody tr:nth-child(even){background:#faf6ea}
.tblwrap tbody tr:hover{background:#f5eeda}
body.dark .tblwrap table{border-color:#3a3325;background:#201c14}
body.dark .tblwrap th{background:#3a3325;color:#e6e0d2}
body.dark .tblwrap caption{color:#cfc4ad}
body.dark .tblwrap tbody tr:nth-child(even){background:#262119}
/* SVG 示意圖 */

.svgfig figcaption{font-size:12.5px;color:var(--muted);margin-bottom:8px;font-family:"Noto Sans TC",sans-serif;line-height:1.5}
.svgfig svg{width:100%;height:auto;display:block}
.ax{stroke:#9a8f78;stroke-width:1.2}
.axl{font-size:11px;fill:#6f6555;font-family:"Noto Sans TC",sans-serif}
.lb{font-size:12px;fill:#2b251d;font-family:"Noto Sans TC",sans-serif}
body.dark .lb{fill:#e6e0d2}
/* 深色模式的 callout 覆蓋 */
body.dark .section-body .note{background:#332b1b;border-left-color:#d9a514}
body.dark .section-body .note::before{color:#e5c15a}
body.dark .formula{background:#2a2418;border-color:#8a7a50}
body.dark .formula .f-label{color:#d8b36a}
/* 響應式 */
/* 行動端：側欄改為漢堡抽屜 */
.nav-toggle{display:none}
.nav-mask{display:none}
@media (max-width:900px){
  body{flex-direction:column}
  .nav-toggle{display:flex}
  .nav-mask{position:fixed;inset:0;background:rgba(20,16,8,.42);z-index:65;display:none}
  body.nav-open .nav-mask{display:block}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;height:100vh;width:min(320px,86vw);z-index:70;
    transform:translateX(-105%);transition:transform .28s ease;
    border-right:1px solid var(--line);padding:24px 18px 48px;overflow-y:auto;
  }
  body.nav-open .sidebar{transform:translateX(0)}
  .sidebar .brand{width:100%;padding-bottom:8px;margin-bottom:6px}
  .nav-chapter{width:100%;margin:4px 0;padding:6px 10px}
  .nav-chapter .tag{display:inline-block;margin-left:auto;font-size:11px;flex-shrink:0}
  .nav-sub{width:100%;display:block;padding:5px 10px 5px 32px;margin:2px 0}
  .nav-gloss{width:100%;margin-top:12px}
  .main{padding:18px 14px 60px}
  .cards-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .search-panel{top:58px;width:calc(100vw - 24px)}

  .sidebar,.topbar,.banner,.no-print{display:none!important}
  .section-body{display:block!important}

  .main{padding:0}

const CH_SECTIONS = {"1": [{"id": "1.1", "title": "進入經濟學的世界(p.3)", "body": "\n<p class=\"def-note\">經濟學是將生活中遇到的所有問題，透過「模型」與「分析」具象化的一門學科。</p>\n<p class=\"def-note\">現代經濟社會中常見的經濟問題：\n<ul class=\"sublist\">\n<li>物價改變時，如何調整消費或投資行為</p>\n<p class=\"def-note\">失業率與物價膨脹的關係</p>\n<p class=\"def-note\">市場管制為何造成搶購或過剩</p>\n<p class=\"def-note\">金融危機、次貸危機、歐債危機的預防機制</p>\n<p class=\"def-note\">開放國外投資或外匯波動對經濟指標的影響</p>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>經濟學的核心在於透過模型與分析，解釋現實經濟現象背後的根本原因及其影響程度。</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>本節為導論性質，無直接考點，但須理解經濟學「模型化分析」的本質。</li></ul>\n</div>\n</div>"}, {"id": "1.2", "title": "經濟學的意義(p.4-5)", "body": "\n\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>無特定公式。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>稀少性是一個相對的概念：若某種資源或商品無法讓人們「想要多少，就拿多少」，就會出現稀少性。</li></ul>\n<div class=\"tblwrap\"><table style=\"width:360px\"><caption>經濟財與自由財的比較</caption><colgroup><col style=\"width:115px\"><col style=\"width:240px\"></colgroup><thead><tr><th>財貨（英文）</th><th>定義</th></tr></thead><tbody>\n<tr><td><strong class=\"term\">經濟財</strong><br><span class=\"term\">economic goods</span></td><td>具有<strong>稀少性</strong>，取得時必須<strong>放棄某些東西作為代價</strong></td></tr>\n<tr><td><strong class=\"term\">自由財</strong><br><span class=\"term\">free goods</span></td><td>不具<strong>稀少性</strong>，取得時<strong>不需要付出代價</strong></td></tr>\n</tbody></table></div>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 1.1</strong>：經濟學是教導人們從事 \\_\\_\\_\\_ 行為的科學。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：答案為「選擇」。消費者追求極大化滿足感，生產者追求極大化利潤；想要的遠大於要得起的，即相對稀少性原則；做任何事的好處＝代價（均衡）。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 1.2</strong>：Economics is best defined as the study of how people <div class=\"opts\"><div>(A) attain wealth</div><div>(B) use their infinite resources</div><div>(C) choose abundance over scarcity</div><div>(D) make choices to cope with scarcity</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：正確答案為 (D)。</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>經濟學的核心定義（研究選擇與稀少性）。</li><li>理性假設的內涵（效率＋一致性）。</li><li>稀少性原則與抵換關係的意義。</li><li>經濟財 vs 自由財的區別。</li></ul>\n</div>\n</div>"}, {"id": "1.3", "title": "經濟問題(p.6)", "body": "\n<p class=\"def-note\">因為稀少性的存在，人們或整體社會都必須進行選擇，包含三個層次的基本經濟問題：</p>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc156\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">生產什麼（what to produce）</div><div class=\"mc-body\"><div class=\"mc-formula\">決定生產哪些商品及生產多少。</div><div class=\"mc-detail\">決定生產哪些商品及生產多少。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc157\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">如何生產（how to produce）</div><div class=\"mc-body\"><div class=\"mc-formula\">決定生產組合與生產方法。</div><div class=\"mc-detail\">決定生產組合與生產方法。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc158\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">為誰生產（for whom）</div><div class=\"mc-body\"><div class=\"mc-formula\">決定財貨如何分配到每一個經濟個體手上。</div><div class=\"mc-detail\">決定財貨如何分配到每一個經濟個體手上。</div></div></div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong class=\"term\">集權式經濟（centralized economy）</strong>：所有經濟決策由一個中央（如政府或神）決定。例如魯賓遜一人流落荒島的狀況。</li><li><strong class=\"term\">市場經濟（market economy）</strong>：經濟活動由消費者與生產者的互動來決定。</li><li>不同時代對三個基本經濟問題有不同的解決方法。</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>三大基本經濟問題（生產什麼、如何生產、為誰生產）。</li><li>集權式經濟 vs 市場經濟的區分。</li></ul>\n</div>\n</div>"}, {"id": "1.4", "title": "經濟學的分類與模型建構(p.7-8)", "body": "\n\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong class=\"term\">名目變數（nominal）</strong>以<strong>價格</strong>與<strong>金額</strong>衡量；<strong class=\"term\">實質變數（real）</strong>以實際商品數量衡量。</li><li><strong>月薪 1,000 元</strong>為名目工資；若<strong>價格水準為 100</strong>，則 10 單位商品為實質工資。</li><li><strong>模型建構的步驟：</strong></li></ul>\n<ul class=\"sublist\" style=\"padding-left:46px;\"><li>(1) 先知道要觀察的現象或主體；</li><li>(2) 歸納所有可能影響的因素，屏除非關鍵因素；</li><li>(3) 集中討論關鍵性因素間的關係；</li><li>(4) 透過實證資料檢驗模型預測能力。</li><li>建構單一個體行為模型時須把握最適化原則；建構個體間互動模型時須依循均衡原則。</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>個體 vs 總體經濟學的定義與別稱（價格理論 vs 所得理論）。</li><li>實證 vs 規範分析的區分（what it is vs what it should be）。</li><li>內生 vs 外生變數的區分。</li><li>最適化原則與均衡原則的適用時機。</li></ul>\n</div>\n</div>"}, {"id": "1.5", "title": "經濟學的邏輯謬誤(p.9)", "body": "\n<p class=\"def-note\">僅憑「直覺」學習經濟學，很可能會犯以下三種邏輯謬誤：</p>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<div class=\"tblwrap\"><table style=\"width:620px\"><caption>三種邏輯謬誤的比較</caption><colgroup><col style=\"width:185px\"><col style=\"width:105px\"><col style=\"width:250px\"></colgroup><thead><tr><th>謬誤（英文）</th><th>推理方向</th><th>說明</th></tr></thead><tbody>\n<tr><td><strong class=\"term\">合成推理謬論</strong><br><span class=\"term\">Fallacy of composition</span></td><td>個體→總體</td><td>僅證明對<strong>個體行為</strong>正確（或不正確），即率性推論<strong>總體行為</strong>也正確（或不正確）</td></tr>\n<tr><td><strong class=\"term\">分離推理謬論</strong><br><span class=\"term\">Fallacy of division</span></td><td>總體→個體</td><td>僅證明<strong>總體情況</strong>正確（或不正確），即率性推論<strong>個體現象</strong>也正確（或不正確）</td></tr>\n<tr><td><strong class=\"term\">因果推理謬論</strong><br><span class=\"term\">Fallacy of course</span></td><td>時間先後→因果</td><td>僅觀察到<strong>兩事先後發生</strong>，即誤認其間必有<strong>前因後果</strong>關係（<strong>因果顛倒</strong>）</td></tr>\n</tbody></table></div>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>三種邏輯謬誤的定義與區分（非常常考選擇題）。</li></ul>\n</div>\n</div>"}, {"id": "1.6", "title": "經濟活動循環流轉(p.10-11)", "body": "\n\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>無特定公式。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>家戶部門的支出＝廠商的收入；廠商購買要素的支出變成家戶部門的所得，形成循環。</li><li><strong>內圈箭頭</strong>：貨幣循環流（Monetary flow）的方向。</li><li><strong>外圈箭頭</strong>：實體商品流動（physical goods flow）的方向。</li><li>市場機制自動解決三大經濟問題：</li><li>商品市場交易 → 決定「生產什麼」。</li><li>要素市場交易 → 決定「如何生產」（廠商買哪些要素）。</li><li>要素提供者獲得所得 → 決定「為誰生產」（誰有錢買商品）。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\">\n<rect x=\"150\" y=\"20\" width=\"140\" height=\"56\" rx=\"6\" fill=\"#eef3f4\" stroke=\"#2c6e9e\"></rect>\n<text x=\"220\" y=\"44\" text-anchor=\"middle\" font-size=\"12\">商品與勞務市場</text>\n<text x=\"220\" y=\"62\" text-anchor=\"middle\" font-size=\"10\" fill=\"#6c7684\">（實體流：供給／需求）</text>\n<rect x=\"150\" y=\"204\" width=\"140\" height=\"56\" rx=\"6\" fill=\"#eef3f4\" stroke=\"#2c6e9e\"></rect>\n<text x=\"220\" y=\"228\" text-anchor=\"middle\" font-size=\"12\">生產要素市場</text>\n<text x=\"220\" y=\"246\" text-anchor=\"middle\" font-size=\"10\" fill=\"#6c7684\">（工資地租利息）</text>\n<rect x=\"20\" y=\"112\" width=\"120\" height=\"56\" rx=\"6\" fill=\"#fdf0c2\" stroke=\"#c89632\"></rect>\n<text x=\"80\" y=\"136\" text-anchor=\"middle\" font-size=\"12\">家戶部門</text>\n<text x=\"80\" y=\"152\" text-anchor=\"middle\" font-size=\"10\" fill=\"#8a6d1a\">Household</text>\n<rect x=\"300\" y=\"112\" width=\"120\" height=\"56\" rx=\"6\" fill=\"#f4eef6\" stroke=\"#6b4e8e\"></rect>\n<text x=\"360\" y=\"136\" text-anchor=\"middle\" font-size=\"12\">廠商部門</text>\n<text x=\"360\" y=\"152\" text-anchor=\"middle\" font-size=\"10\" fill=\"#6b4e8e\">Firm</text>\n\n<path d=\"M140 130 Q100 60 150 48\" fill=\"none\" stroke=\"#2c6e9e\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"></path>\n<path d=\"M290 48 Q340 60 300 130\" fill=\"none\" stroke=\"#2c6e9e\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"></path>\n<path d=\"M300 150 Q340 220 290 232\" fill=\"none\" stroke=\"#2c6e9e\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"></path>\n<path d=\"M150 232 Q100 220 140 150\" fill=\"none\" stroke=\"#2c6e9e\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"></path>\n<text x=\"220\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" fill=\"#2c6e9e\">實體流（外圈）</text>\n<text x=\"220\" y=\"156\" text-anchor=\"middle\" font-size=\"10\" fill=\"#b5542e\">貨幣流（內圈反向）</text>\n<defs><marker id=\"ar\" markerwidth=\"8\" markerheight=\"8\" refx=\"6\" refy=\"3\" orient=\"auto\"><path d=\"M0 0L6 3L0 6z\" fill=\"#2c6e9e\"></path></marker></defs>\n</svg>\n<p class=\"figcap\">外圈＝實體流（商品／要素順時針）；內圈＝貨幣流（支出／所得反向）。</p>\n</div>\n<div class=\"bookfig-grid\"><figure class=\"bookfig wide\"><svg viewbox=\"0 0 480 430\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:520px;height:auto;display:block;margin:10px auto;\">\n<defs>\n  <marker id=\"a1\" viewbox=\"0 0 10 10\" refx=\"8\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"#2c6e9e\"></path></marker>\n  <marker id=\"a2\" viewbox=\"0 0 10 10\" refx=\"8\" refy=\"5\" markerwidth=\"6\" markerheight=\"6\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"#1e7d32\"></path></marker>\n</defs>\n<rect x=\"4\" y=\"4\" width=\"472\" height=\"422\" fill=\"none\" stroke=\"#c9c2ae\" stroke-width=\"1\" rx=\"10\"></rect>\n<rect x=\"42\" y=\"20\" width=\"176\" height=\"74\" rx=\"8\" fill=\"#eef4f9\" stroke=\"#2c6e9e\" stroke-width=\"1.5\"></rect>\n<text x=\"130\" y=\"52\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#173a54\">商品與勞務市場</text>\n<text x=\"130\" y=\"72\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5a6f7e\">Goods and service market</text>\n<rect x=\"262\" y=\"20\" width=\"176\" height=\"74\" rx=\"8\" fill=\"#eef4f9\" stroke=\"#2c6e9e\" stroke-width=\"1.5\"></rect>\n<text x=\"350\" y=\"52\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#173a54\">家戶部門</text>\n<text x=\"350\" y=\"72\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5a6f7e\">Household</text>\n<rect x=\"42\" y=\"336\" width=\"176\" height=\"74\" rx=\"8\" fill=\"#eef4f9\" stroke=\"#2c6e9e\" stroke-width=\"1.5\"></rect>\n<text x=\"130\" y=\"368\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#173a54\">廠商部門</text>\n<text x=\"130\" y=\"388\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5a6f7e\">Firm</text>\n<rect x=\"262\" y=\"336\" width=\"176\" height=\"74\" rx=\"8\" fill=\"#eef4f9\" stroke=\"#2c6e9e\" stroke-width=\"1.5\"></rect>\n<text x=\"350\" y=\"368\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"700\" fill=\"#173a54\">生產要素市場</text>\n<text x=\"350\" y=\"388\" text-anchor=\"middle\" font-size=\"10.5\" fill=\"#5a6f7e\">Factor market</text>\n<path d=\"M350 12 L118 12\" stroke=\"#2c6e9e\" stroke-width=\"2.6\" marker-end=\"url(#a1)\"></path>\n<text x=\"234\" y=\"8\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2c6e9e\">商品需求 Demand for goods</text>\n<path d=\"M34 48 L34 348\" stroke=\"#2c6e9e\" stroke-width=\"2.6\" marker-end=\"url(#a1)\"></path>\n<text x=\"20\" y=\"200\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2c6e9e\" transform=\"rotate(-90 20 200)\">商品供給 Supply of goods</text>\n<path d=\"M130 418 L378 418\" stroke=\"#2c6e9e\" stroke-width=\"2.6\" marker-end=\"url(#a1)\"></path>\n<text x=\"254\" y=\"428\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2c6e9e\">要素需求 Demand for factors</text>\n<path d=\"M446 382 L446 82\" stroke=\"#2c6e9e\" stroke-width=\"2.6\" marker-end=\"url(#a1)\"></path>\n<text x=\"468\" y=\"235\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" fill=\"#2c6e9e\" transform=\"rotate(90 468 235)\">要素供給 Supply of factors</text>\n<path d=\"M350 24 L140 24\" stroke=\"#1e7d32\" stroke-width=\"2.2\" stroke-dasharray=\"6 4\" marker-end=\"url(#a2)\"></path>\n<text x=\"246\" y=\"42\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1e7d32\">消費支出</text>\n<path d=\"M46 66 L46 330\" stroke=\"#1e7d32\" stroke-width=\"2.2\" stroke-dasharray=\"6 4\" marker-end=\"url(#a2)\"></path>\n<text x=\"58\" y=\"200\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1e7d32\" transform=\"rotate(-90 58 200)\">銷貨收入</text>\n<path d=\"M130 402 L360 402\" stroke=\"#1e7d32\" stroke-width=\"2.2\" stroke-dasharray=\"6 4\" marker-end=\"url(#a2)\"></path>\n<text x=\"246\" y=\"394\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1e7d32\">成本支出</text>\n<path d=\"M434 370 L434 100\" stroke=\"#1e7d32\" stroke-width=\"2.2\" stroke-dasharray=\"6 4\" marker-end=\"url(#a2)\"></path>\n<text x=\"420\" y=\"235\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#1e7d32\" transform=\"rotate(90 420 235)\">所得</text>\n</svg><div class=\"clabel\">考試重點</div>\n<ul><li>循環流轉圖的兩個市場、兩個部門。</li><li>貨幣流（內圈）vs 實體流（外圈）的方向對應。</li><li>市場機制如何解決三大基本經濟問題。</li></ul>\n</div>\n"}], "2": [{"id": "2.1", "title": "需求函數與市場需求(p.15-26)", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc600\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\"><strong class=\"term\">需求</strong><br><span class=\"term\">Demand</span></div><div class=\"mc-body\"><div class=\"mc-formula\">願意且能夠購買的數量關係</div><div class=\"mc-detail\">其他情況不變，消費者在給定不同價格下願意且能夠購買的數量之<strong>集合</strong>；須同時主觀願意、客觀能夠。(p.15)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc601\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\"><strong class=\"term\">需求量</strong><br><span class=\"term\">Quantity demanded</span></div><div class=\"mc-body\"><div class=\"mc-formula\">給定單一價格下的單一數量</div><div class=\"mc-detail\">在給定某價格下願意且能夠購買的<strong>單一數量</strong>；需求是集合、需求量是單一數量，兩者必考。(p.15)</div></div></div>\n<div class=\"formula\"><div class=\"f-label\">需求函數 / 需求法則 (p.16-17)</div><span class=\"fx\">Q = a/b - P/b = f(P; P<sub>Y</sub>, M, P<sup>e</sup>, ρ), (Δ Q)/(Δ P)<0</span><div class=\"f-detail\">逆需求：P = a - bQ；分號左為內生變數（本財 P、Q），右為外生變數。需求價格＝買者的<strong>保留價格</strong>。</div></div>\n<div class=\"tblwrap\"><table style=\"width:420px\"><caption>需求量變動 vs 需求變動</caption><colgroup><col style=\"width:130px\"><col style=\"width:120px\"><col style=\"width:160px\"></colgroup><thead><tr><th>類型（英文）</th><th>起因</th><th>圖形意涵</th></tr></thead><tbody>\n<tr><td><strong class=\"term\">需求量變動</strong><br><span class=\"term\">Movement</span></td><td>本財價格（內生）變動</td><td>同一條 D 線上<strong>點的移動</strong></td></tr>\n<tr><td><strong class=\"term\">需求變動</strong><br><span class=\"term\">Shift</span></td><td>價格外的外生變數變動</td><td>整條 D 線<strong>平移</strong></td></tr>\n</tbody></table></div>\n<div class=\"tblwrap\"><table style=\"width:460px\"><caption>影響需求線移動的因素總表</caption><colgroup><col style=\"width:130px\"><col style=\"width:180px\"><col style=\"width:150px\"></colgroup><thead><tr><th>因素（英文）</th><th>子分類</th><th>對需求線影響</th></tr></thead><tbody>\n<tr><td><strong class=\"term\">其他財貨價格</strong><br><span class=\"term\">P_Y</span></td><td><span class=\"term\">替代品</span>>0；<span class=\"term\">互補品</span><0；<span class=\"term\">無關品</span>=0</td><td>替代右移／互補左移</td></tr>\n<tr><td><strong class=\"term\">所得</strong><br><span class=\"term\">Income M</span></td><td><span class=\"term\">正常財</span>>0；<span class=\"term\">劣等財</span><0；<span class=\"term\">中性財</span>=0</td><td>正常右移／劣等左移</td></tr>\n<tr><td><strong class=\"term\">偏好</strong><br><span class=\"term\">Preference</span></td><td>偏好增強／減弱</td><td>右移／左移</td></tr>\n<tr><td><strong class=\"term\">預期</strong><br><span class=\"term\">Expectation</span></td><td>預期漲價／預期所得增加</td><td>現在右移</td></tr>\n<tr><td><strong class=\"term\">消費者人數</strong><br><span class=\"term\">N</span></td><td>人數增加</td><td>市場需求右移</td></tr>\n<tr><td><strong class=\"proper\">隨波逐流效果</strong><br><span class=\"proper\">bandwagon</span></td><td>正網路外部性：人增需求線更平</td><td>市場需求更平坦</td></tr>\n<tr><td><strong class=\"proper\">標新立異效果</strong><br><span class=\"proper\">snob effect</span></td><td>負網路外部性：人減需求線更陡</td><td>市場需求更陡峭</td></tr>\n</tbody></table></div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div><svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"90\" y1=\"50\" x2=\"360\" y2=\"200\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></line><text x=\"366\" y=\"200\" font-size=\"12\" fill=\"#1f3a5f\">D</text><circle cx=\"150\" cy=\"88\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"120\" y=\"82\" font-size=\"10\" fill=\"#b5542e\">a(P0,Q0)</text><circle cx=\"290\" cy=\"160\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"296\" y=\"156\" font-size=\"10\" fill=\"#1e7d32\">b(P1,Q1)</text><line x1=\"90\" y1=\"50\" x2=\"340\" y2=\"180\" stroke=\"#b5542e\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"></line><text x=\"250\" y=\"170\" font-size=\"10\" fill=\"#b5542e\">D1 右移</text></svg><p class=\"figcap\">需求法則：P 下降由 a 沿 D 移至 b（需求量變動）；外生因素改變使整線 D↔D1 平移（需求變動）。(p.16)</p><svg viewbox=\"0 0 440 280\" class=\"figsvg\"><text x=\"105\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6c7684\">個人需求 d1</text><line x1=\"60\" y1=\"230\" x2=\"160\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"40\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"65\" y1=\"60\" x2=\"150\" y2=\"210\" stroke=\"#1f3a5f\" stroke-width=\"1.8\"></line><text x=\"315\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6c7684\">個人需求 d2</text><line x1=\"230\" y1=\"230\" x2=\"330\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"230\" y1=\"230\" x2=\"230\" y2=\"40\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"235\" y1=\"60\" x2=\"320\" y2=\"210\" stroke=\"#1f3a5f\" stroke-width=\"1.8\"></line><text x=\"395\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6c7684\">市場需求 D</text><line x1=\"360\" y1=\"230\" x2=\"430\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"360\" y1=\"230\" x2=\"360\" y2=\"40\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"365\" y1=\"60\" x2=\"425\" y2=\"210\" stroke=\"#b5542e\" stroke-width=\"2.2\"></line><text x=\"200\" y=\"255\" font-size=\"10\" fill=\"#6b4e8e\">水平加總：固定 P，加總各 d 的 Q</text></svg><p class=\"figcap\">市場需求＝個人需求的水平加總（固定價格加總數量），Q⊇=∑q⊇。(p.18)</p></div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div><ul>\n<li class=\"probitem\"><div class=\"pq\"><strong>例題 2.1</strong>：所謂「需求」，就是在其他條件不變時，對應某一價格、在一定期間內消費者願意且能夠購買的商品數量。</div><button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button><div class=\"pans\"><strong>書中解法要點</strong>：錯。需求是給定不同價格 P 下願意且能夠購買的 Q 之<strong>關係</strong>；題述只給單一價格，應稱「需求量」。</div></li>\n<li class=\"probitem\"><div class=\"pq\"><strong>例題 2.3</strong>：兩類消費者需求反函數 P1=10−½q1、P2=20−2q2。(1) 僅第一類 100 位，求市場需求；(2) 兩類各一位，求市場需求。</div><button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button><div class=\"pans\"><strong>書中解法要點</strong>：先將反函數改寫為 Q 開頭（q1=20−2P、q2=10−0.5P），再<strong>固定價格水平加總</strong>數量。</div></li>\n<li class=\"probitem\"><div class=\"pq\"><strong>例題 2.4</strong>：A movement downward and to the right along a demand curve is called<div class=\"opts\"><div>(A) increase in demand</div><div>(B) decrease in demand</div><div>(C) decrease in quantity demanded</div><div>(D) increase in quantity demanded</div></div></div><button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button><div class=\"pans\"><strong>書中解法要點</strong>：沿需求線向右下移動＝<strong>需求量增加</strong>（點的移動），選 (D)。</div></li>\n<li class=\"probitem\"><div class=\"pq\"><strong>例題 2.5</strong>：下列何者會使特定財貨之市場「需求量」發生改變？<div class=\"opts\"><div>(A) 消費者所得增加</div><div>(B) 消費者對該財貨喜好增加</div><div>(C) 廠商提高該財貨之售價</div><div>(D) 該財貨互補財價格上升</div></div></div><button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button><div class=\"pans\"><strong>書中解法要點</strong>：只有<strong>本財價格</strong>變動才造成需求量變動；(A)(B)(D) 皆為需求變動（整線移動），選 (C)。</div></li>\n</ul></div>\n<div class=\"callout key\"><div class=\"clabel\">考試重點</div><ul><li>需求 vs 需求量、需求法則 ΔQ/ΔP<0。</li><li>市場需求＝水平加總（固定價格加總數量）。</li><li>替代/互補/無關看 ∂Q/∂P_Y；正常/劣等/中性看 ∂Q/∂M 正負。</li><li><span class=\"proper\">韋伯倫財</span>（炫耀性）與<span class=\"term\">季芬財</span>違反需求法則。</li></ul></div>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><span class=\"hl\">「其他情況不變（Other things being equal, Ceteris paribus）」</span>的內涵：</li></ul>\n<ol>\n<li><span class=\"term\">偏好結構（Preference, ρ）</span>不變</li>\n<li><span class=\"term\">其他相關財貨價格（P_Y）</span>不變</li>\n<li><span class=\"term\">消費者對未來之預期（P^e, M^e）</span>不變</li>\n<li><span class=\"term\">所得（Money income, M）</span>不變</li>\n<li>若是市場需求，則同一條市場需求上<span class=\"term\">消費者人數（N）</span>不變</li>\n</ol>\n<ul>\n<li><strong>需求量之變動</strong>：其他情況不變，當財貨本身價格（<span class=\"term\">內生變數</span>）發生改變時，使得財貨需求量發生改變，為同一條需求曲線上<strong>點的移動（Movement）</strong>。</li>\n<li><strong>需求之變動</strong>：當財貨本身價格以外的變數（<span class=\"term\">外生變數</span>）改變時，會使得財貨需求量發生改變，為整條<strong>需求曲線的移動（Shift）</strong>。</li>\n</ul>\n</div>\n"}, {"id": "2.2", "title": "需求價格彈性(p.27-33)", "body": "\n<p class=\"def-note\">E=<span class=\"fx\">自變數變動百分比</span><span class=\"fx\">應變數變動百分比</span>​</p>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc155\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">需求價格彈性</div><div class=\"mc-body\"><div class=\"mc-formula\">其他情況不變，當財貨價格變動百分之一時，會使得消費量變動百分之幾。</div><div class=\"mc-detail\">其他情況不變，當財貨價格變動百分之一時，會使得消費量變動百分之幾。常以 <span class=\"fx\">E<sup>d</sup></span> 表示。因彈性使用百分比消除掉單位因素，故不受單位改變影響。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>需求價格彈性定義式：<span class=\"fx\">E<sup>d</sup> = ([(Δ Q<sup>d</sup>)/(Q<sup>d</sup>)])/([(Δ P<sup>d</sup>)/(P<sup>d</sup>)]) = -((dQ<sup>d</sup>)/(Q<sup>d</sup>))/(dP<sup>d</sup>/P) = -(dQ<sup>d</sup>)/(dP) × (P)/(Q<sup>d</sup>)</span>(p.27)</li><li>因需求法則下 <span class=\"fx\">dQ<sup>d</sup>/dP < 0</span>，為方便起見習慣加負號或取絕對值使 <span class=\"fx\">E<sup>d</sup> > 0</span>。</li></ul>\n</div>\n<h5 class=\"sub4\">幾何彈性（直線型需求曲線）</h5>\n<ul><li>對於負斜率直線需求曲線上任一點，三種公式(p.28)：</li><li><strong>縱軸公式</strong>：<span class=\"fx\">E<sup>d</sup> = (OP<sub>1</sub>)/(P<sub>1</sub>a)</span>（該點到縱軸截距段／該點到原點段）</li><li><strong>橫軸公式</strong>：<span class=\"fx\">E<sup>d</sup> = (Q<sub>1</sub>C)/(OO<sub>1</sub>) = (Cb)/(ba)</span>（該點到橫軸截距段／該點到原點段）</li><li><strong>斜邊公式</strong>：<span class=\"fx\">E<sup>d</sup> = (OP<sub>1</sub>)/(R<sub>1</sub>a)</span></li><li>一般性公式：E<span class=\"fx\">d</span>=<span class=\"fx\">需求曲線斜率值加負號</span><span class=\"fx\">原點出發射線角度值</span>​(p.30)</li></ul>\n<h5 class=\"sub4\">線性負斜率需求曲線的五段分類(p.28-29)</h5>\n<div class=\"tblwrap\"><table style=\"width:620px\"><caption>需求價格彈性的型態</caption><colgroup><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"></colgroup><thead><tr><th>點</th><th>位置</th><th>彈性值</th><th>名稱</th></tr></thead><tbody><tr><td><span class=\"term\">a</span></td><td>縱軸截距</td><td><span class=\"fx\">E<sup>d</sup> = ∞</span></td><td>完全彈性<br><span class=\"term\">perfect elastic</span></td></tr><tr><td><span class=\"term\">b</span></td><td>中點上方</td><td><span class=\"fx\">E<sup>d</sup> > 1</span></td><td>富於彈性<br><span class=\"term\">elastic</span></td></tr><tr><td><span class=\"term\">c</span></td><td>中點</td><td><span class=\"fx\">E<sup>d</sup> = 1</span></td><td>單一彈性<br><span class=\"term\">unitary elastic</span></td></tr><tr><td><span class=\"term\">d</span></td><td>中點下方</td><td><span class=\"fx\">E<sup>d</sup> < 1</span></td><td>缺乏彈性<br><span class=\"term\">inelastic</span></td></tr><tr><td><span class=\"term\">e</span></td><td>橫軸截距</td><td><span class=\"fx\">E<sup>d</sup> = 0</span></td><td>完全無彈性<br><span class=\"term\">perfect inelastic</span>、零彈性</td></tr></tbody></table></div>\n<ul><li>若 c 為中點，則中點以上 <span class=\"fx\">ca</span> 段 <span class=\"fx\">E<sup>d</sup> > 1</span>，價格小變動造成需求量大變動。</li><li>中點以下 <span class=\"fx\">ce</span> 段 <span class=\"fx\">E<sup>d</sup> < 1</span>，價格大變動只造成需求量小變動。</li><li>直線需求曲線上價格越高，需求彈性越大。</li></ul>\n<h5 class=\"sub4\">特殊型態</h5>\n<ul><li>垂直線（D₁）：<span class=\"fx\">E<sup>d</sup> = 0</span>（完全無彈性）</li><li>水平線（D₂）：<span class=\"fx\">E<sup>d</sup> → ∞</span>（完全彈性）</li></ul>\n<p>(p.30)</p>\n<h5 class=\"sub4\">點彈性（Point Elasticity）</h5>\n<ul><li>當價格變化極小時使用：<span class=\"fx\">E<sup>d</sup> = -(dQ<sup>d</sup>)/(dP) × (P)/(Q<sup>d</sup>) = -(d \\ln Q<sup>d</sup>)/(d \\ln P)</span>(p.31)</li><li>對數微分性質：<span class=\"fx\">d \\ln x = 1/x dx</span></li></ul>\n<h5 class=\"sub4\">弧彈性（Arc price elasticity，中點法 mid-point method）</h5>\n<ul><li>僅有兩筆資料時使用，取兩點中點為基期：</li><li><span class=\"fx\">E<sup>d</sup> = -(((Q<sub>1</sub> - Q<sub>0</sub>))/([(Q<sub>1</sub> + Q<sub>0</sub>) ÷ 2]))/(((P<sub>1</sub> - P<sub>0</sub>))/([(P<sub>1</sub> + P<sub>0</sub>) ÷ 2])) = -((Δ Q)/((Q<sub>1</sub>+Q<sub>0</sub>)/2))/((Δ P)/((P<sub>1</sub>+P<sub>0</sub>)/2))</span>(p.32)</li></ul>\n<h5 class=\"sub4\">個別需求與市場需求之關係</h5>\n<ul><li>市場需求價格彈性為個別需求價格彈性之<strong>加權平均</strong>，權重為個別需求量占市場需求之比例：</li><li><span class=\"fx\">E<sup>d</sup> = s<sub>1</sub> ε<sup>d</sup><sub>1</sub> + s<sub>2</sub> ε<sup>d</sup><sub>2</sub> + \\cdots + s<sub>n</sub> ε<sup>d</sup><sub>n</sub> = ∑<sub>i=1</sub><sup>n</sup> s<sub>i</sub> ε<sup>d</sup><sub>i</sub></span>(p.33)</li><li>其中 <span class=\"fx\">s<sub>i</sub> = q<sub>i</sub>/Q</span> 為第 i 位消費者需求量占市場需求之比例。</li></ul>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>幾何彈性比較原則：</li></ul>\n<ol><li>固定縱軸截距比較：原點出發射線角度相同時，斜率絕對值越小（線越平）彈性越大。</li><li>固定斜率比較：原點出發射線角度值越大，彈性越大。</li></ol>\n<ul><li>需求曲線越陡峭（斜率絕對值越大）→需求彈性越小；越平緩→彈性越大。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.5\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.5\"></line><text x=\"404\" y=\"246\" font-size=\"13\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"54\" y=\"42\" font-size=\"13\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"90\" y1=\"55\" x2=\"390\" y2=\"205\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></line><circle cx=\"90\" cy=\"55\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"96\" y=\"50\" font-size=\"11\" fill=\"#b5542e\">a（交縱軸） Ed=∞</text><circle cx=\"240\" cy=\"130\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"248\" y=\"126\" font-size=\"11\" fill=\"#1e7d32\">中點 b：Ed=1</text><circle cx=\"390\" cy=\"205\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"316\" y=\"224\" font-size=\"11\" fill=\"#b5542e\">c（交橫軸） Ed=0</text><line x1=\"60\" y1=\"130\" x2=\"240\" y2=\"130\" stroke=\"#6c7684\" stroke-width=\"1\" stroke-dasharray=\"3 3\"></line><line x1=\"240\" y1=\"130\" x2=\"240\" y2=\"230\" stroke=\"#6c7684\" stroke-width=\"1\" stroke-dasharray=\"3 3\"></line><text x=\"96\" y=\"90\" font-size=\"10\" fill=\"#c89632\">a~b 段：Ed>1（富於彈性）</text><text x=\"248\" y=\"170\" font-size=\"10\" fill=\"#c89632\">b~c 段：Ed<1（缺乏彈性）</text></svg><p class=\"figcap\">直線需求線：交縱軸處 Ed=∞、中點 Ed=1、交橫軸處 Ed=0；上段富有彈性、下段缺乏彈性。垂直需求線 Ed=0、水平需求線 Ed=∞。</p>\n</div>\n<div class=\"bookfig-grid\"><figure class=\"bookfig\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJ z2WC2R/dpWj05PH7U+wbeCcQO56/nHf4roIg57LBbGOz8FC8jp5g3/vyt9jGxt2saGtHYDAUoUBaNVSXCadzobiKeLjDGwBxHryT/AHLeCIOb9nXADi8zZ94Yz/cn2fc8ki8O9gadnC6SIOZ8BdcH+OP/AOs3/FSLZXn796qDz+jFGP7iukiDnGzF/L7lcXfSUN/cAvP8m6Rzi581c9x7uqn8ftXVRBzfsGFv8nWXFnTgVTz+8ldENAaGnkYxz3Uog0H2ryXuloJBTOdy6MjMT/q3t9RhecldcKQ5nt7p2/06Zwd/4Tg/vXTRByvyiovuyippyf8AnIXNx+xQ3UVtBaz4oyF3QNYST+oLrEZ68qAxoOQAPwQVlt3q57nE6jtlwZStJMj5GuzJxwGtJwPqV0jc7pKQILO9uf0p5WtA/Vkrqp3QcGSyXG7PxeayP4XP/qlKC1j/AGeTy4e3AXagpoaWJkMETIo2DDWMGA0ewXoiAn7EUHqPRBOe6A5TgoOiAiIgIiICIiAiIgIiICIiAiIgIiICIgyByclAREQf/9k=\" alt=\"課本圖\"><figcaption>課本 p.28｜直線需求曲線的五段彈性</figcaption></figure></div><div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.12</strong>：若任一對於 X 財貨的需求彈性是完全無彈性時 <div class=\"opts\"><div>(A)不論價格怎麼變化，需求量皆不會變化</div><div>(B)價格小幅變動造成數量大變動</div><div>(C)價格與需求量同幅度變動</div><div>(D)價格變動幅度是需求量變動幅度的兩倍</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：完全無彈性＝垂直線，需求量不受價格影響。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.13</strong>：The demand curve for a good is vertical when it is: <div class=\"opts\"><div>(A)perfectly inelastic</div><div>(B)unitary elastic</div><div>(C)perfectly elastic</div><div>(D)inferior good</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：垂直線＝完全無彈性。【政大商院】</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.14</strong>：下列敘述何者錯誤？ <div class=\"opts\"><div>(A)高鐵需求彈性等於 0</div><div>(B)糧食的需求價格彈性比米食大</div><div>(C)負斜率直線型需求曲線中點的價格彈性剛好等於一</div><div>(D)負斜率直線型需求曲線中點的總收益會最高</div><div>(E)負斜率直線型需求曲線其上各點的價格彈性一定都不同</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：需逐一判斷。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.15</strong>：假設競爭市場中的需求線為 <span class=\"fx\">Q = 10 - 1/2P</span>，則價格為 12、數量為 4 時的需求彈性為何？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">E<sup>d</sup> = -(dQ)/(dP) · P/Q = -(-1/2) · 12/4 = 1.5</span>。【成大財金】</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.16</strong>：令 X 為需求量，P 為價格，α, β 為正的常數。若需求曲線為 <span class=\"fx\">X = 1.2α - β P</span>，則當需求的價格彈性為 0.2 時，X 應該為多少？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：代入點彈性公式求解。【中興企管】</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.17</strong>：<span class=\"fx\">Q = I/P</span> 表示。</div></div>\n</div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>點交叉彈性：</li><li><span class=\"fx\">E<sub>XY</sub> = ((dQ<sub>X</sub>)/(Q<sub>X</sub>))/((dP<sub>Y</sub>)/(P<sub>Y</sub>)) = (dQ<sub>X</sub>)/(dP<sub>Y</sub>) × (P<sub>Y</sub>)/(Q<sub>X</sub>) = (d \\ln Q<sub>X</sub>)/(d \\ln P<sub>Y</sub>)</span>(p.37)</li><li>弧交叉彈性（中點法）：</li><li><span class=\"fx\">E<sub>XY</sub> = ((Q<sup>1</sup><sub>X</sub> - Q<sup>0</sup><sub>X</sub>)/((Q<sup>1</sup><sub>X</sub> + Q<sup>0</sup><sub>X</sub>)/2))/((P<sup>1</sup><sub>Y</sub> - P<sup>0</sup><sub>Y</sub>)/((P<sup>1</sup><sub>Y</sub> + P<sup>0</sup><sub>Y</sub>)/2))</span>(p.37)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<div class=\"tblwrap\"><table style=\"width:560px\"><caption>交叉彈性與財貨關係</caption><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th>交叉彈性</th><th>財貨關係</th><th>意義</th></tr></thead><tbody><tr><td><span class=\"fx\">E<sub>XY</sub> > 0</span></td><td>替代品<br><span class=\"term\">Substitutes</span></td><td>Y 價格上升→X 需求增加</td></tr><tr><td><span class=\"fx\">E<sub>XY</sub> < 0</span></td><td>互補品<br><span class=\"term\">Complements</span></td><td>Y 價格上升→X 需求減少</td></tr><tr><td><span class=\"fx\">E<sub>XY</sub> = 0</span></td><td>無關品<br><span class=\"term\">Independents</span></td><td>Y 價格變動不影響 X 需求</td></tr></tbody></table></div>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.24</strong>：如果台北高雄間火車票價由 800 元上漲至 1,000 元，機票銷售量由每天 1,000 張增至 1,500 張，問機票與火車票間的交叉彈性為何？兩者為何種關係？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：弧彈性計算 <span class=\"fx\">E<sub>XY</sub>=1.8</span>，為替代品。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.25</strong>：<span class=\"fx\">Q<sub>X</sub> = 250 - 0.25P<sub>X</sub> + 0.5P<sub>Y</sub> + 0.01I</span>，<span class=\"fx\">P<sub>X</sub>=200, P<sub>Y</sub>=200, I=10,000</span>。<div class=\"opts\"><div>(A)X 是劣等財</div><div>(B)Y 與 X 互為替代品</div><div>(C)交叉彈性 0.125</div><div>(D)所得彈性 0.25</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：代入計算各彈性。【台北大學】</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.26</strong>：If cross-price elasticity of coffee demand w.r.t. milk price is 0.5, then coffee and milk are (1)____. An increase of 4% in milk price would cause coffee demand to (2)____ by (3)____%.</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">E<sub>XY</sub>=0.5>0</span> 為替代品，milk 漲 4%→coffee 需求增加 2%。【中財財金】</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.27</strong>：<span class=\"fx\">Q<sub>X</sub> = 1000 P<sub>X</sub><sup>-2</sup> P<sub>Y</sub><sup>0.5</sup> M<sup>1.5</sup></span>，(1)X 是否滿足需求法則？(2)X 需求彈性？(3)交叉彈性？(4)所得彈性？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：對數微分法，<span class=\"fx\">E<sup>d</sup><sub>X</sub>=2</span>，<span class=\"fx\">E<sub>XY</sub>=0.5</span>，<span class=\"fx\">η<sub>X</sub>=1.5</span>。</div></li></ul>\n<p>（詳解見書末 QR）</p>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>交叉彈性公式與正負號判讀替代品／互補品／無關品（必考）。</li><li>對數型函數直接取冪次為彈性值。</li></ul>\n</div>\n"}, {"id": "2.3", "title": "需求價格彈性對消費者支出的影響(p.34-36)", "body": "\n\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>對 P 做一階微分：</li><li><span class=\"fx\">(dTE)/(dP) = (dP)/(dP) × Q(P) + P × (dQ(P))/(dP) = Q + P (dQ)/(dP) = Q [ 1 + (dQ)/(dP) × P/Q ] = Q(1 - E<sup>d</sup>)</span>​ 表示。</div></div>\n"}, {"id": "2.4", "title": "交叉彈性(p.37-38)", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc602\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\"><strong class=\"term\">需求的交叉彈性</strong><br><span class=\"term\">Cross elasticity of demand</span></div><div class=\"mc-body\"><div class=\"mc-formula\">他財價格變動% → 本財需求變動%</div><div class=\"mc-detail\">一種財價格變動百分比所引起另一種財需求量變動百分比的關係，記 E_XY。(p.37)</div></div></div>\n<div class=\"formula\"><div class=\"f-label\">點／弧交叉彈性 (p.37)</div><span class=\"fx\">E<sub>XY</sub> = (dQ<sub>X</sub>)/(dP<sub>Y</sub>)·(P<sub>Y</sub>)/(Q<sub>X</sub>) = (d\\ln Q<sub>X</sub>)/(d\\ln P<sub>Y</sub>)</span><div class=\"f-detail\">弧彈性用中點法；對數型函數直接取冪次即彈性值。</div></div>\n<div class=\"tblwrap\"><table style=\"width:440px\"><caption>交叉彈性正負與財貨關係</caption><colgroup><col style=\"width:120px\"><col style=\"width:150px\"><col style=\"width:160px\"></colgroup><thead><tr><th>E_XY 符號</th><th>財貨關係（英文）</th><th>經濟意義</th></tr></thead><tbody>\n<tr><td><span class=\"fx\">E<sub>XY</sub>>0</span></td><td><strong class=\"term\">替代品</strong><br><span class=\"term\">Substitutes</span></td><td>P_Y↑ → Q_X↑</td></tr>\n<tr><td><span class=\"fx\">E<sub>XY</sub><0</span></td><td><strong class=\"term\">互補品</strong><br><span class=\"term\">Complements</span></td><td>P_Y↑ → Q_X↓</td></tr>\n<tr><td><span class=\"fx\">E<sub>XY</sub>=0</span></td><td><strong class=\"term\">無關品</strong><br><span class=\"term\">Independents</span></td><td>P_Y 變動不影響 Q_X</td></tr>\n</tbody></table></div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div><svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q_X</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P_Y</text><text x=\"120\" y=\"70\" font-size=\"10\" fill=\"#1e7d32\">E_XY>0 替代品：P_Y↑→Q_X↑（X線右移）</text><line x1=\"90\" y1=\"60\" x2=\"380\" y2=\"200\" stroke=\"#1e7d32\" stroke-width=\"1.8\"></line><line x1=\"90\" y1=\"60\" x2=\"400\" y2=\"170\" stroke=\"#1e7d32\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"></line><text x=\"280\" y=\"150\" font-size=\"10\" fill=\"#b5542e\">E_XY<0 互補品：P_Y↑→Q_X↓（X線左移）</text></svg><p class=\"figcap\">交叉彈性正負判定財貨關係：>0 替代、<0 互補、=0 無關。(p.37)</p></div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div><ul>\n<li class=\"probitem\"><div class=\"pq\"><strong>例題 2.24</strong>：火車票價由 800 漲至 1,000 元，機票日銷由 1,000 張增至 1,500 張。求交叉彈性並判斷關係。</div><button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button><div class=\"pans\"><strong>書中解法要點</strong>：弧彈性 E_XY=1.8>0，為<strong>替代品</strong>。</div></li>\n<li class=\"probitem\"><div class=\"pq\"><strong>例題 2.25</strong>：Q_X=250−0.25P_X+0.5P_Y+0.01I，P_X=P_Y=200、I=10,000。<div class=\"opts\"><div>(A) X 是劣等財</div><div>(B) Y 與 X 互為替代品</div><div>(C) 交叉彈性 0.125</div><div>(D) 所得彈性 0.25</div></div></div><button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button><div class=\"pans\"><strong>書中解法要點</strong>：代入計算各彈性；交叉項係數為正故 Y、X 互為替代品。</div></li>\n<li class=\"probitem\"><div class=\"pq\"><strong>例題 2.26</strong>：咖啡需求對牛奶價的交叉彈性為 0.5。(1) 兩財關係？(2)(3) 牛奶漲 4%，咖啡需求變動？</div><button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button><div class=\"pans\"><strong>書中解法要點</strong>：E_XY=0.5>0 為<strong>替代品</strong>；牛奶漲 4%→咖啡需求<strong>增加 2%</strong>。</div></li>\n</ul></div>\n<div class=\"callout key\"><div class=\"clabel\">考試重點</div><ul><li>交叉彈性公式與正負號判讀替代／互補／無關（必考）。</li><li>對數型函數直接取冪次為彈性值。</li></ul></div>\n</div>"}, {"id": "2.5", "title": "需求量與所得的關係(p.39-42)", "body": "\n\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>所得彈性定義式：</li><li><span class=\"fx\">η = (Δ Q/Q)/(Δ M/M) = (dQ)/(dM) × M/Q = (d \\ln Q)/(d \\ln M)</span>"}, {"id": "2.6", "title": "影響需求價格彈性的因素(p.43-45)", "body": "\n<p class=\"def-note\">影響需求價格彈性大小的六項因素。</p>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<div class=\"tblwrap\"><table style=\"width:620px\"><caption>影響需求價格彈性的六大因素</caption><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th>因素</th><th>影響方向</th><th>說明</th></tr></thead><tbody><tr><td>1. 替代品多寡</td><td>替代品越多→彈性越大</td><td>替代品多→價格上漲時消費者容易改買替代品</td></tr><tr><td>2. 互補品多寡</td><td>互補品越多→彈性越小</td><td>互補品多→消費上較麻煩，不太能調整數量</td></tr><tr><td>3. 財貨性質</td><td>奢侈性越大→彈性越大</td><td>必需品彈性小，奢侈品彈性大</td></tr><tr><td>4. 時間長短</td><td>時間越長→彈性越大</td><td>非耐久財：時間長→替代品多→彈性大；耐久財：時間長→彈性小</td></tr><tr><td>5. 支出比例 α</td><td>α 越小→彈性越小；α 越大→彈性越大</td><td>占支出比例小的財貨漲價對預算影響小</td></tr><tr><td>6. 定義域大小</td><td>定義域越大→彈性越小</td><td>食物的定義域比稻米大，彈性較小</td></tr></tbody></table></div>\n<ul><li><strong class=\"proper\">史勒斯基方程式</strong>：<span class=\"fx\">E<sup>d</sup><sub>X</sub> = ε<sup>d</sup><sub>X</sub> + α × η<sub>X</sub></span>(p.43)</li></ul>\n</div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li><strong class=\"proper\">馬歇爾需求函數之零階齊次（Homogeneous of degree zero）性質</strong>：</li><li>零階齊次表示當變數同時變動 λ 倍時，函數仍為原函數：<span class=\"fx\">Z = f(X,Y) = f(λ X, λ Y)</span></li><li>在馬歇爾需求函數中，當本身商品價格、其他商品價格與所得同時改變 λ 倍時，本身商品需求量不變：<span class=\"fx\">Q<sub>X</sub> = Q<sub>X</sub>(λ P<sub>X</sub>, λ P<sub>Y</sub>, λ M)</span></li><li>據此可推論：<span class=\"fx\">0 = E<sup>d</sup><sub>X</sub> + E<sub>XY</sub> + η<sub>X</sub></span>(p.44)</li><li>即需求價格彈性（未加負號）＋交叉彈性＋所得彈性之加總為 0。</li></ul>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.32</strong>：The price elasticity of demand for a good will be greater (in absolute value) the \\_\\_\\_\\_ the item in the budget and the \\_\\_\\_\\_ the number of substitutes. <div class=\"opts\"><div>(A)smaller;greater</div><div>(B)larger;greater</div><div>(C)smaller;smaller</div><div>(D)larger;smaller</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：占預算越大、替代品越多→彈性越大。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.33</strong>：若某物品的替代品越多，該物品之需求彈性：<div class=\"opts\"><div>(A)越大</div><div>(B)越小</div><div>(C)不變</div><div>(D)不一定</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：替代品越多→彈性越大。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.34</strong>：Why is price elasticity of demand for food greater in poor nations than in rich nations?</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：落後國家食物占支出比例高。【中興企管】</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.35</strong>：請說明食鹽的需求彈性偏低的各種可能</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：替代品少、占支出比例小、必需品、定義域小。【台科大企管】</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.36</strong>：<span class=\"fx\">Q<sub>X</sub> = P<sub>X</sub><sup>-1</sup> P<sub>Y</sub><sup>a</sup> M<sup>0.6</sup></span>，(1)需求彈性？(2)所得彈性？(3)交叉彈性？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：對數微分法直接取冪次。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 2.37</strong>：<span class=\"fx\">X = (M)/(P<sub>X</sub> + P<sub>Y</sub>)</span>"}], "3": [{"id": "3.1", "title": "供給函數與市場供給(p.49-58)", "body": "\n<p class=\"def-note\">供給成立的前提：在其他情況不變下，生產者面對</p>\n<p class=\"def-note\">生產技術（technology, σ）不變</p>\n<p class=\"def-note\">其他相關財貨（P_r）不變</p>\n<p class=\"def-note\">生產者對未來之預期（P^e）不變</p>\n<p class=\"def-note\">要素（factor）價格（P_f）不變</p>\n<p class=\"def-note\">若是市場供給，則同一條市場供給上生產者人數（N）不變</p>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>供給函數：<span class=\"fx\">Q = (c)/(-d) + P/d = f(P; P<sub>Y</sub>, P<sub>e</sub>, σ, P<sub>f</sub>); c, d > 0</span>(p.50)</li><li>範例：Q=−12+2P，<span class=\"fx\">(dQ)/(dP) = 2 > 0</span></li><li><strong class=\"term\">供給法則（Law of supply）</strong>：<span class=\"fx\">(Δ Q<sub>X</sub>)/(Δ P<sub>X</sub>) > 0</span>(p.50)</li><li>價格上升→生產者願意且能夠供給的數量增加；價格下降→供給量減少。</li><li>注意：在供給中不會出現違反供給法則的商品。</li><li><strong>供給價格</strong>：其他情況不變，在給定某個數量之下，生產者願意且能夠收取的最低價格，又稱<strong class=\"term\">賣者的保留價格（seller's reservation price）</strong>。</li><li>逆供給函數（Inverse supply function）：<span class=\"fx\">P = c + dQ = g(Q); c, d > 0</span>(p.50)</li><li>範例：<span class=\"fx\">P = 6 + Q/2</span></li><li><strong class=\"term\">市場供給（Market supply）</strong>：某一特定期期內，在各種可能價格下，所有生產某商品的生產者願意且能夠供給的該商品數量，為個別廠商供給的<strong>水平加總</strong>。</li><li><span class=\"fx\">Q<sup>S</sup><sub>X</sub> = ∑<sub>i=1</sub><sup>n</sup> q<sup>S</sup><sub>xi</sub></span>(p.51)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong>供給量之變動</strong>：其他情況不變，當財貨本身價格（內生變數）發生改變時，為同一條供給曲線上<strong>點的移動（Movement）</strong>。</li><li><strong>供給之變動</strong>：當財貨本身價格以外的變數（外生變數）改變時，為整條<strong>供給曲線的移動（Shift）</strong>。</li></ul>\n</div>\n<h5 class=\"sub4\">影響供給線移動的因素</h5>\n<div class=\"tblwrap\"><table style=\"width:100%\">\n<caption>影響供給線移動（外生變數）總表（p.53–54）</caption>\n<colgroup><col style=\"width:20%\"><col style=\"width:40%\"><col style=\"width:24%\"><col style=\"width:16%\"></colgroup>\n<thead><tr><th>因素（英文）</th><th>內涵／子分類</th><th>對供給線的影響</th><th>偏導數符號</th></tr></thead><tbody>\n<tr>\n<td rowspan=\"3\"><strong class=\"term\">其他財貨價格</strong><br><span class=\"term\">Prices of other goods, P_Y</span></td>\n<td><strong class=\"term\">生產互補品／聯產品（Joint product）</strong>：同生產要素、同生產過程（如牛皮與牛肉）；市場需求須垂直加總</td>\n<td>P_Y↑→Y 供給量↑→X 供給量↑→<strong>X 供給線右移</strong></td>\n<td>∂Qˢ<sub>X</sub>/∂P<sub>Y</sub> > 0</td>\n</tr>\n<tr>\n<td><strong class=\"term\">生產品替代品（Production substitutes）</strong>：不同生產要素、不同生產過程</td>\n<td>P_Y↑→廠商轉產 Y→X 供給減少→<strong>X 供給線左移</strong></td>\n<td>∂Qˢ<sub>X</sub>/∂P<sub>Y</sub> < 0</td>\n</tr>\n<tr>\n<td><strong class=\"term\">無關品／獨立品（Independent goods）</strong>：生產上無關</td>\n<td>P_Y 變動<strong>不影響</strong> X 供給</td>\n<td>∂Qˢ<sub>X</sub>/∂P<sub>Y</sub> = 0</td>\n</tr>\n<tr>\n<td><strong class=\"term\">技術的變化</strong><br><span class=\"term\">Technology</span></td>\n<td><strong class=\"term\">技術進步</strong>（Technological improvement）／技術退步</td>\n<td>技術進步→<strong>供給線右移</strong>；技術退步→<strong>左移</strong></td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong class=\"term\">要素價格</strong><br><span class=\"term\">Input price</span></td>\n<td>生產要素（P<sub>f</sub>）價格上升／下降</td>\n<td>要素價格↑→成本↑→<strong>供給線垂直上移或水平左移</strong>；下降則反之</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong class=\"term\">對未來的預期</strong><br><span class=\"term\">Expectation</span></td>\n<td>預期未來價格上漲／下跌</td>\n<td>預期漲價→惜售→<strong>左移</strong>；預期跌價→脫售→<strong>右移</strong></td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong class=\"term\">供給者人數</strong><br><span class=\"term\">Number of sellers</span></td>\n<td>市場上廠商家數增減</td>\n<td>廠商數↑→<strong>市場供給右移</strong>；↓則左移</td>\n<td>—</td>\n</tr>\n</tbody></table></div>\n<p style=\"font-size:13px;color:#6b614a;margin-top:6px;\">注意：生產上的互補品或替代品，不一定是消費上的互補品或替代品。</p>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.5\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.5\"></line><text x=\"404\" y=\"246\" font-size=\"13\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"54\" y=\"42\" font-size=\"13\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"90\" y1=\"205\" x2=\"390\" y2=\"60\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></line><text x=\"395\" y=\"64\" font-size=\"12\" fill=\"#1f3a5f\">S</text><line x1=\"120\" y1=\"220\" x2=\"410\" y2=\"90\" stroke=\"#1e7d32\" stroke-width=\"1.6\" stroke-dasharray=\"6 4\"></line><text x=\"360\" y=\"104\" font-size=\"11\" fill=\"#1e7d32\">S′（供給增加·右移）</text><circle cx=\"240\" cy=\"140\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"248\" y=\"136\" font-size=\"11\" fill=\"#b5542e\">點沿線＝供給量變動</text></svg><p class=\"figcap\">正斜率供給線 S；點沿線移動為「供給量變動」（自身 P）；整線右移 S′ 為「供給變動」（技術進步／要素價格下跌／生產互補 P_Y↑）。</p>\n</div>\n<div class=\"bookfig-grid\"><figure class=\"bookfig\"><img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wAARCAFfAWkDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAQIEAwcI/8QAUxAAAQMDAgQBBwcEDQkJAQAAAQACAwQFEQYhEjFBURMHFBYiMmHRFUJScYGRlCMnVbMXM0ZWYmRldIOEoaOxNTdDREVjcoLCJCUmNFNUc7Th8P/EABQBAQAAAAAAAAAAAAAAAAAAAAD/xAAUEQEAAAAAAAAAAAAAAAAAAAAA/9oADAMBAAIRAxEAPwD9UoiICIgIO43QEREBERARY4sdFnOAgIscbe4WQcjKAiJnPLdAREQEREBEOcbYymdslAREQEQnAygyd0BEzlEBEByEJAQETP3oDkcsICIiAiIgIiICIiAiIgIiICIiAiIg86eoiq4IqiCRskUrA9j2nIc0jIIWZpWQRPlkOGMBc49guWy2uOyWihtsTi6Ojp2QNceZDWgZ/sS8z1NNbaiSjYHzhvqAsLxn3gc0FUq/KVEy0VtbS07HPj4XUscsoBqY/EawyADcDJP3KWtGs6O73WahjDWRB3h08zngecvaPyjWt5+rkAnuvmNVZq4229SUMjaycMliqYo6FzC1wHG1jSTthwGw7le1tmuLL/T3WCXx57oIauF8NI0ZZxN8VrWk5ALTxFw5nmg+qXu+OtNTRQRUr6qWrkLeBp3awAlzsdcBBqKmaMmnr8O70z/gqrqSmrGa+oa6S r;\">重置</button>\n</div>\n<svg viewbox=\"0 0 360 260\" style=\"width:100%;max-width:420px;display:block;margin:0 auto;\">\n<line x1=\"50\" y1=\"220\" x2=\"330\" y2=\"220\" stroke=\"#333\" stroke-width=\"1.5\"></line>\n<line x1=\"50\" y1=\"220\" x2=\"50\" y2=\"30\" stroke=\"#333\" stroke-width=\"1.5\"></line>\n<text x=\"335\" y=\"224\" font-size=\"13\">Q</text>\n<text x=\"40\" y=\"26\" font-size=\"13\">P</text>\n<line id=\"s0\" x1=\"90\" y1=\"200\" x2=\"250\" y2=\"60\" stroke=\"#1e7d32\" stroke-width=\"2.2\"></line>\n<line id=\"s1\" x1=\"90\" y1=\"200\" x2=\"250\" y2=\"60\" stroke=\"#b5542e\" stroke-width=\"2.2\" stroke-dasharray=\"6 4\"></line>\n<text x=\"255\" y=\"62\" font-size=\"12\" fill=\"#1e7d32\">S_X(原)</text>\n<text id=\"s1lab\" x=\"255\" y=\"80\" font-size=\"12\" fill=\"#b5542e\"></text>\n</svg>\n<p id=\"prodNote\" style=\"margin:6px 0 0;font-size:14px;\">點上方按鈕觀察：<strong class=\"term\">生產互補品／聯產品</strong>（同生產要素、同生產過程）與<strong class=\"term\">生產品替代品</strong>在 P_Y 變動下的不同方向。</p>\n</div>\n"}, {"id": "3.2", "title": "供給價格彈性與其他相關彈性(p.59-63)", "body": "\n\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>供給價格彈性定義式：</li><li><span class=\"fx\">E<sup>s</sup> = ((dQ<sup>s</sup>)/(Q<sup>s</sup>))/((dP<sup>s</sup>)/(P<sup>s</sup>))</span>(p.59)</li><li>點彈性：</li><li><span class=\"fx\">E<sup>s</sup> = (dQ<sup>s</sup>)/(dP<sup>s</sup>) × (P<sup>s</sup>)/(Q<sup>s</sup>) = (d \\ln Q<sup>s</sup>)/(d \\ln P<sup>s</sup>)</span>(p.59)</li><li>弧彈性（中點法，僅有兩點資料時）：</li><li><span class=\"fx\">E<sup>s</sup> = (((Q<sub>1</sub> - Q<sub>0</sub>))/([(Q<sub>1</sub> + Q<sub>0</sub>)/2]))/(((P<sub>1</sub> - P<sub>0</sub>))/([(P<sub>1</sub> + P<sub>0</sub>)/2]))</span>(p.59)</li><li>幾何彈性：</li><li><span class=\"fx\">E<sup>s</sup> = ((Δ Q<sup>s</sup>)/(Q<sup>s</sup>))/((Δ P<sup>s</sup>)/(P<sup>s</sup>)) = (Q<sup>s</sup>/P<sup>s</sup>)/(dP/dQ<sup>s</sup>) = (θ)/(m<sub>s,c</sub>)</span>(p.59)</li><li>即供給彈性為供給曲線上任一點之原點出發射線值與該點切線斜率之比。</li></ul>\n</div>\n<h5 class=\"sub4\">供給彈性的分類（直線型供給線）</h5>\n<div class=\"tblwrap\"><table style=\"width:560px\"><caption>供給價格彈性的型態</caption><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th>供給線型態</th><th>彈性值</th><th>名稱</th></tr></thead><tbody><tr><td>縱軸出發直線</td><td><span class=\"fx\">E<sup>s</sup> > 1</span></td><td>富於彈性，隨供給量增加彈性變小</td></tr><tr><td>橫軸出發直線</td><td><span class=\"fx\">E<sup>s</sup> < 1</span></td><td>缺乏彈性，隨供給量增加彈性變大</td></tr><tr><td>原點出發直線</td><td><span class=\"fx\">E<sup>s</sup> = 1</span></td><td>單一彈性，不隨消費量改變</td></tr><tr><td>垂直線</td><td><span class=\"fx\">E<sup>s</sup> = 0</span></td><td>完全缺乏彈性</td></tr><tr><td>水平線</td><td><span class=\"fx\">E<sup>s</sup>→∞</span></td><td>完全彈性</td></tr></tbody></table></div>\n<h5 class=\"sub4\">供給交叉彈性</h5>\n<ul><li><span class=\"fx\">E<sub>XY</sub> = ((dQ<sub>X</sub>)/(Q<sub>X</sub>))/((dP<sub>Y</sub>)/(P<sub>Y</sub>)) = (d \\ln Q<sub>X</sub>)/(d \\ln P<sub>Y</sub>)</span>(p.62)</li><li>弧彈性形式同理使用中點法。</li><li><span class=\"fx\">E<sub>XY</sub> < 0</span>：生產品替代品。</li><li><span class=\"fx\">E<sub>XY</sub> > 0</span>：生產互補品。</li><li><span class=\"fx\">E<sub>XY</sub> = 0</span>：生產無關品。</li></ul>\n<h5 class=\"sub4\">供給的成本彈性</h5>\n<ul><li>當成本變動百分之一，會使得供給量變動百分之幾：</li><li><span class=\"fx\">E<sub>SC</sub> = ((∂C)/(C))/((∂Q)/(Q)) = (∂C)/(∂Q) × (Q)/(C) = (d ln C)/(d ln Q) = (邊際成本)/(平均成本)</span>(p.63)</li></ul>\n<h5 class=\"sub4\">影響供給彈性的因素</h5>\n<ol><li><strong>投入生產要素用途的多寡</strong>：投入用途越多→彈性越大。</li><li><strong>生產成本隨產量變化的敏感度</strong>：成本隨產量反應越敏感→彈性越小；若 ΔAC/ΔQ = 2，代表多生產一單位使成本上升兩單位；成本對產量敏感度越大→供給線相對較陡→供給彈性越小。</li><li><strong>生產技術的高低</strong>：技術越高→彈性越大。</li><li><strong>生產規模（廠房或設備數量）的大小</strong>：規模越大→彈性越大。</li><li><strong>可提供生產者作決策時間的長短</strong>：時間越長→彈性越大。</li><li><strong>商品之保存容易度</strong>：越容易保存→越能因應價格變化調整產量→彈性越大。</li><li><strong>定義範圍大小</strong>：定義範圍越小→供給彈性越大；範圍越大→彈性越小。</li></ol>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>供給價格彈性公式（點彈性、弧彈性、幾何彈性）。</li><li>五種直線型供給線的彈性分類（必考）。</li><li>供給交叉彈性的正負號判讀生產替代品／互補品。</li><li>影響供給彈性的七項因素。</li><li>供給成本彈性 <span class=\"fx\">E<sub>SC</sub> = AC/MC</span>。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\">\n<line x1=\"50\" y1=\"240\" x2=\"420\" y2=\"240\" stroke=\"#2b251d\" stroke-width=\"1.5\"></line>\n<line x1=\"50\" y1=\"240\" x2=\"50\" y2=\"20\" stroke=\"#2b251d\" stroke-width=\"1.5\"></line>\n<text x=\"412\" y=\"258\" font-size=\"13\" font-style=\"italic\" text-anchor=\"end\">Q</text>\n<text x=\"42\" y=\"30\" font-size=\"13\" font-style=\"italic\" text-anchor=\"end\">P</text>\n<line x1=\"50\" y1=\"240\" x2=\"330\" y2=\"60\" stroke=\"#b5542e\" stroke-width=\"2.2\"></line>\n<text x=\"336\" y=\"66\" font-size=\"11\" fill=\"#b5542e\">E&gt;1 縱軸出發（較陡）</text>\n<line x1=\"70\" y1=\"240\" x2=\"350\" y2=\"80\" stroke=\"#2c6e9e\" stroke-width=\"2.2\"></line>\n<text x=\"356\" y=\"86\" font-size=\"11\" fill=\"#2c6e9e\">E=1 原點出發</text>\n<line x1=\"110\" y1=\"240\" x2=\"380\" y2=\"100\" stroke=\"#1e7d32\" stroke-width=\"2.2\"></line>\n<text x=\"386\" y=\"106\" font-size=\"11\" fill=\"#1e7d32\">E&lt;1 橫軸出發（較平）</text>\n<line x1=\"200\" y1=\"240\" x2=\"200\" y2=\"40\" stroke=\"#6b4e8e\" stroke-width=\"2\"></line>\n<text x=\"206\" y=\"50\" font-size=\"11\" fill=\"#6b4e8e\">垂直線 E=0</text>\n<line x1=\"60\" y1=\"120\" x2=\"400\" y2=\"120\" stroke=\"#8a5a3b\" stroke-width=\"2\"></line>\n<text x=\"320\" y=\"112\" font-size=\"11\" fill=\"#8a5a3b\">水平線 E=∞</text>\n</svg>\n<p class=\"figcap\">五種直線型供給線：斜率愈陡（縱軸出發）彈性愈大（E&gt;1）；斜率愈平（橫軸出發）彈性愈小（E&lt;1）；原點出發 E=1；垂直線 E=0；水平線 E=∞。(p.59-60)</p>\n</div>"}], "4": [{"id": "4.1", "title": "市場均衡（印刷頁 67–75）", "body": "\n<div class=\"method-card\">\n    <label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"eq\"><span class=\"mc-lbl\">學會</span></label>\n    <div class=\"mc-left\"><span class=\"term\" data-term=\"Equilibrium\">均衡（Equilibrium）</span></div>\n    <div class=\"mc-body\">\n      <div class=\"mc-formula\">供給與需求兩股力量達到平衡的狀態，對應 <span class=\"term\">市場結清（Market clearing）</span></div>\n      <div class=\"mc-detail\">在沒有外力干擾下，目前的情況可以一直維持下去。其他情況不變下，生產者願意且能夠接受的價格＝消費者願意且能夠付出的價格（或數量相等），此時市場上不存在多餘的買者與賣者。(p.66-67)</div>\n      <div class=\"mc-ex\"><b>例子：</b>超額需求或超額供給都不存在、價格不再變動，即市場結清。</div>\n    </div>\n  </div>\n  <div class=\"method-card\">\n    <label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"pm\"><span class=\"mc-lbl\">學會</span></label>\n    <div class=\"mc-left\"><span class=\"term\" data-term=\"Price mechanism\">價格機能（Price mechanism）</span></div>\n    <div class=\"mc-body\">\n      <div class=\"mc-formula\">透過價格變動使市場回到均衡的機制＝<span class=\"proper\">亞當·斯密（Adam Smith）</span>「<span class=\"term\">看不見的手（invisible hand）</span>」</div>\n      <div class=\"mc-detail\">價格是調節供需的訊號：供過於求時價格下跌、供不應求時價格上升，直到市場結清。(p.66,68)</div>\n      <div class=\"mc-ex\"><b>例子：</b>颱風後菜價上漲 → 需求減少、供給增加 → 回到均衡。</div>\n    </div>\n  </div>\n  <div class=\"method-card\">\n    <label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"se\"><span class=\"mc-lbl\">學會</span></label>\n    <div class=\"mc-left\"><span class=\"term\" data-term=\"Stable equilibrium\">穩定均衡（Stable equilibrium）</span></div>\n    <div class=\"mc-body\">\n      <div class=\"mc-formula\">偏離均衡後，在沒有外力干擾下自動回到原均衡</div>\n      <div class=\"mc-detail\">價格機能保證穩定：價格高於均衡 → 過剩 → 價格下降；價格低於均衡 → 短缺 → 價格上升。(p.68)</div>\n      <div class=\"mc-ex\"><b>例子：</b>供給線正斜率、需求線負斜率的正常市場為穩定均衡。</div>\n    </div>\n  </div>\n  <div class=\"method-card\">\n    <label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"cp\"><span class=\"mc-lbl\">學會</span></label>\n    <div class=\"mc-left\"><span class=\"term\" data-term=\"Correspondence principle\">對應原理（Correspondence principle）</span></div>\n    <div class=\"mc-body\">\n      <div class=\"mc-formula\">比較靜態的結果與動態分析結果必須一致，模型才穩定</div>\n      <div class=\"mc-detail\">由 <span class=\"proper\">Paul Samuelson</span> 提出：比較靜態分析結果與動態分析結果一致 → 穩定均衡；反之為不穩定模型。(p.72)</d
