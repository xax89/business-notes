s=\"fx\">q\\lt L</span>。</li></ul>\n</div>\n</div>"}], "10": [{"id": "10.1", "title": "前言（印刷頁 275）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc71\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">廠商（Firm）</div><div class=\"mc-body\"><div class=\"mc-formula\">透過生產技術（technology）將生產要素（Production factors，如土地、勞動、資本）轉換成可供消費的最終商品及勞務的經濟單位；利潤（Profit）＝收入－成本。</div><div class=\"mc-detail\">透過生產技術（technology）將生產要素（Production factors，如土地、勞動、資本）轉換成可供消費的最終商品及勞務的經濟單位；利潤（Profit）＝收入－成本(p.275)。</div></div></div>\n<p class=\"def-note\">廠商目標：極大化本身利潤（必定保證極小化本身成本），與消費者極大化效用異曲同工(p.275)。</p>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>本章分兩部分：(1) 生產理論（要素轉換成實體財貨、如何獲得最大產量）；(2) 成本結構理論（使用要素須付成本、成本與產量關係、如何達最低成本）。</li><li>本章不考慮市場結構與商品需求（留待第 11–14 章），生產與成本理論是所有廠商無論規模或市場結構所相通的部分(p.275)。</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>廠商＝技術轉換單位；利潤極大＝成本極小＋收入極大的雙面。</li></ul>\n</div>\n</div>"}, {"id": "10.2", "title": "生產函數（Production Function）（印刷頁 276–278）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc66\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">固定投入（fixed input）</div><div class=\"mc-body\"><div class=\"mc-formula\">市場變化需產量改變時，投入量無法立即改變的投入。</div><div class=\"mc-detail\">市場變化需產量改變時，投入量無法立即改變的投入(p.276)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc67\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">變動投入（variable input）</div><div class=\"mc-body\"><div class=\"mc-formula\">市場變化需產量改變時，投入量可立即改變的投入。</div><div class=\"mc-detail\">市場變化需產量改變時，投入量可立即改變的投入(p.276)。</div></div></div>\n<p class=\"def-note\">生產五要素：土地（自然資源）、資本（實體資本 Physical capital：機器設備廠房；金融資本 Financial capital）、勞動（Labor）、企業家精神（Entrepreneurship）(p.276)。</p>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc68\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">技術（Technology）</div><div class=\"mc-body\"><div class=\"mc-formula\">給定生產數量下可用來生產的方式；技術效率＝在給定產量限制下極小化要素使用投入量。</div><div class=\"mc-detail\">給定生產數量下可用來生產的方式；技術效率＝在給定產量限制下極小化要素使用投入量(p.276)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc69\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">短期（Short run）</div><div class=\"mc-body\"><div class=\"mc-formula\">同時存在固定生產要素與變動生產要素；<strong class=\"term\">長期（Long run）</strong>：只有變動生產要素。</div><div class=\"mc-detail\">同時存在固定生產要素與變動生產要素；<strong class=\"term\">長期（Long run）</strong>：只有變動生產要素(p.276)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc70\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">生產函數（Production function）</div><div class=\"mc-body\"><div class=\"mc-formula\">其他情況不變，現有技術下要素投入量與種類對應的最大可能產量。</div><div class=\"mc-detail\">其他情況不變，現有技術下要素投入量與種類對應的最大可能產量。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>依期間長短分類(p.277)：</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:16.67%\"><col style=\"width:16.67%\"><col style=\"width:16.67%\"><col style=\"width:16.67%\"><col style=\"width:16.67%\"><col style=\"width:16.67%\"></colgroup><thead><tr><th>期間</th><th><span class=\"fx\">L</span></th><th><span class=\"fx\">K</span></th><th>技術</th><th><span class=\"fx\">Q</span></th><th>函數表達</th></tr></thead><tbody><tr><td>極短期（市場期）</td><td>固定</td><td>固定</td><td>固定</td><td>固定</td><td><span class=\"fx\">\\barQ=F(\\barL,\\barK)</span></td></tr><tr><td>短期</td><td>可變</td><td>固定</td><td>固定</td><td>可變</td><td><span class=\"fx\">Q=F(L,\\barK)</span></td></tr><tr><td>長期</td><td>可變</td><td>可變</td><td>固定</td><td>可變</td><td><span class=\"fx\">Q=F(L,K)</span></td></tr><tr><td>極長期</td><td>可變</td><td>可變</td><td>可變</td><td>可變</td><td>—</td></tr></tbody></table></div>\n<ul><li><strong>規模報酬（Returns to scale）</strong>：所有要素同比例變動時總產量變化情形。設 <span class=\"fx\">Q<sub>0</sub>=F(L<sub>0</sub>,K<sub>0</sub>)</span>，所有要素乘 <span class=\"fx\">λ</span> 倍：<span class=\"fx\">Q=F(λ L<sub>0</sub>,λ K<sub>0</sub>)</span>(p.277)：</li></ul>\n<ol><li><span class=\"fx\">F(λ L<sub>0</sub>,λ K<sub>0</sub>)=λ F(L<sub>0</sub>,K<sub>0</sub>)=λ Q<sub>0</sub>,\\ ∀λ>0</span> → <strong>固定規模報酬（CRS）</strong>，此生產函數為一階齊次（Homogeneous of degree one）；</li><li><span class=\"fx\">F(λ L<sub>0</sub>,λ K<sub>0</sub>)>λ F(L<sub>0</sub>,K<sub>0</sub>)=λ Q<sub>0</sub>,\\ ∀λ>1</span> → <strong>規模報酬遞增（IRS）</strong>；</li><li><span class=\"fx\">F(λ L<sub>0</sub>,λ K<sub>0</sub>)<λ F(L<sub>0</sub>,K<sub>0</sub>)=λ Q<sub>0</sub></span> → <strong>規模報酬遞減（DRS）</strong>(p.277)。</li></ol>\n<ul><li>與齊次函數關係：<span class=\"fx\">F(λ L<sub>0</sub>,λ K<sub>0</sub>)=λ<sup>k</sup>Q</span>(p.278)：</li><li><span class=\"fx\">k=1\\Leftrightarrow CRS</span>；<span class=\"fx\">k>1⇒ IRS</span>；<span class=\"fx\">k<1⇒ DRS</span>。</li><li>注意：<strong>CRS 與一階齊次互為充要；IRS 與 DRS 不保證必為齊次函數</strong>(p.278)。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong>規模報酬 vs. 邊際報酬</strong>：規模報酬是所有要素都變（長期技術分析）；邊際報酬是存在固定要素下只變一要素（短期現象）。兩者是不同分析期間的概念(p.278)。</li></ul>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.1</strong>： (p.278)：判斷六個生產函數屬何種規模報酬：(1) <span class=\"fx\">Q=L<sup>0.6</sup>K<sup>0.6</sup></span>；<br>(2) <span class=\"fx\">Q=20√(LK)</span>；<br>(3) <span class=\"fx\">Q=4L+5K</span>；<br>(4) <span class=\"fx\">Q=4√(L)+5√(K)</span>；<br>(5) <span class=\"fx\">Q=L<sup>2</sup>+K<sup>3</sup></span>；<br>(6) <span class=\"fx\">Q=10[0.2L<sup>-2</sup>+0.8K<sup>-2</sup>]^-1/2</span>。解法要點：代入 <span class=\"fx\">F(λ L,λ K)</span> 與 <span class=\"fx\">λ F(L,K)</span> 比較。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.2</strong>： (p.278，交大企金、政大商院)：一般 Cobb–Douglas 函數 <span class=\"fx\">q=AL<sup>a</sup>K<sup>b</sup></span>，在何種條件下呈 DRS、CRS、IRS？要點：<span class=\"fx\">a+b\\lesseqgtr1</span> 判斷。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>規模報酬三型態判斷（齊次次數 <span class=\"fx\">k</span>；Cobb–Douglas 看 <span class=\"fx\">α+β</span>）。</li><li>規模報酬（長期、全要素同比例）≠ 邊際報酬遞減（短期、單一要素）。</li></ul>\n</div>\n</div>"}, {"id": "10.3", "title": "短期生產結構（印刷頁 279–290）", "body": "\n<p class=\"def-note\">短期假設至少有一種固定要素（資本 <span class=\"fx\">\\barK</span>），只有勞動 <span class=\"fx\">L</span> 可變：<span class=\"fx\">Q=F(L,\\barK)=TP<sub>L</sub></span>(p.279)。</p>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc62\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">總產量（TP, total physical product）</div><div class=\"mc-body\"><div class=\"mc-formula\">給定期間內隨變動要素投入不同所能獲得最大產量，<span class=\"fx\">\\barK</span> 稱為固定規模（Scale）。</div><div class=\"mc-detail\">給定期間內隨變動要素投入不同所能獲得最大產量，<span class=\"fx\">\\barK</span> 稱為固定規模（Scale）(p.279)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc63\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">平均產量（AP, average product）</div><div class=\"mc-body\"><div class=\"mc-formula\">每一單位變動要素的產量。</div><div class=\"mc-detail\">每一單位變動要素的產量(p.279)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc64\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">邊際產量（MP, marginal product）</div><div class=\"mc-body\"><div class=\"mc-formula\">增加一單位變動要素使用量使總產增加的數量。</div><div class=\"mc-detail\">增加一單位變動要素使用量使總產增加的數量(p.280)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc65\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">邊際報酬遞減法則（Law of diminishing marginal returns）</div><div class=\"mc-body\"><div class=\"mc-formula\">又稱變比法則、邊際生產力遞減法則；技術給定且短期至少一種固定要素下，當某變動要素投入超過某水準後其邊際產量遞減。</div><div class=\"mc-detail\">又稱變比法則、邊際生產力遞減法則；技術給定且短期至少一種固定要素下，當某變動要素投入超過某水準後其邊際產量遞減(p.284)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li><span class=\"fx\">TP<sub>L</sub>=Q=F(L,\\barK)</span>(p.279)。</li><li><span class=\"fx\">AP<sub>L</sub>=\\dfracTP<sub>L</sub>L</span>：<span class=\"fx\">TP<sub>L</sub></span> 上任一點與原點連線的射線角度/斜率(p.279–280)。</li><li><span class=\"fx\">MP<sub>L</sub>=\\dfracΔ TPΔ L=\\dfrac∂ TP<sub>L</sub>∂ L</span>：<span class=\"fx\">TP<sub>L</sub></span> 上任一點的切線斜率(p.280–281)。</li><li><span class=\"fx\">AP<sub>L</sub></span> 與 <span class=\"fx\">MP<sub>L</sub></span> 關係(p.282)：</li></ul>\n<p><span class=\"fx\">\\dfracdAP<sub>L</sub>dL=\\dfracd(TP<sub>L</sub>/L)dL=\\dfrac\\dfrac∂ TP<sub>L</sub>∂ LL-TP<sub>L</sub>L<sup>2</sup>=\\dfracMP<sub>L</sub>-AP<sub>L</sub>L</span></p>\n<ul><li><span class=\"fx\">MP<sub>L</sub>>AP<sub>L</sub>\\Leftrightarrow\\dfracdAP<sub>L</sub>dL>0</span>（<span class=\"fx\">AP<sub>L</sub></span> 遞增）；</li><li><span class=\"fx\">MP<sub>L</sub>=AP<sub>L</sub>\\Leftrightarrow\\dfracdAP<sub>L</sub>dL=0</span>（<span class=\"fx\">AP<sub>L</sub></span> 最高點）；</li><li><span class=\"fx\">MP<sub>L</sub>\\lt AP<sub>L</sub>\\Leftrightarrow\\dfracdAP<sub>L</sub>dL\\lt 0</span>（<span class=\"fx\">AP<sub>L</sub></span> 遞減）。</li><li><strong>要素產量彈性（Output elasticity）</strong>：</li></ul>\n<p>勞動 <span class=\"fx\">ε<sub>L</sub>=\\dfrac∂ Q/∂ LQ/L=\\dfrac∂ Q∂ L×\\dfracLQ=MP<sub>L</sub>×\\dfracLQ</span>；</p>\n<p>資本 <span class=\"fx\">ε<sub>K</sub>=MP<sub>K</sub>×\\dfracKQ</span>(p.284)。</p>\n<ul><li>互補性/替代性/無關要素(p.285)：<span class=\"fx\">\\dfrac∂ MP<sub>L</sub>∂ K>0</span> 互補；<span class=\"fx\"><0</span> 替代；<span class=\"fx\">=0</span> 無關。</li><li><strong>邊際生產力付酬法則</strong>（完全競爭，<span class=\"fx\">P</span>、<span class=\"fx\">w</span>、<span class=\"fx\">r</span> 給定）：利潤極大 <span class=\"fx\">\\maxπ=PQ(L,K)-wL-rK</span>，一階條件：</li></ul>\n<p><span class=\"fx\">\\dfrac∂ Q(L,K)∂ L=MP<sub>L</sub>=\\dfracwP</span>；<span class=\"fx\">\\dfrac∂ Q(L,K)∂ K=MP<sub>K</sub>=\\dfracrP</span>；</p>\n<p>合寫 <span class=\"fx\">\\dfrac1P=\\dfracMP<sub>L</sub>w=\\dfracMP<sub>K</sub>r</span>(p.285)。</p>\n<ul><li><strong>尤拉方程（Euler）</strong>：<span class=\"fx\">k</span> 階齊次函數下 <span class=\"fx\">kQ=\\dfrac∂ Q∂ LL+\\dfrac∂ Q∂ KK=MP<sub>L</sub>L+MP<sub>K</sub>K</span>，即<strong>邊際生產力分配理論</strong>；<span class=\"fx\">k=1</span> 完全分配、<span class=\"fx\">k>1</span> 分配有餘、<span class=\"fx\">k<1</span> 分配不足(p.286)。</li><li>由一階齊次推 <span class=\"fx\">MP<sub>K</sub>=\\dfracQK-\\dfracTP<sub>L</sub>K=\\dfracLK(AP<sub>L</sub>-MP<sub>L</sub>)</span>(p.287)。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong>TP/AP/MP 三線對應（核心）</strong>(p.281、p.288)：</li><li><span class=\"fx\">B</span> 點＝<span class=\"fx\">TP<sub>L</sub></span> 反曲點（inflection）→ <span class=\"fx\">MP<sub>L</sub></span> 最高點（<span class=\"fx\">MP<sub>L</sub></span> 先升後降的峰）。</li><li>從原點發出射線與 <span class=\"fx\">TP<sub>L</sub></span> 相切之點（<span class=\"fx\">B</span> 在 AP 圖上）→ <span class=\"fx\">AP<sub>L</sub></span> 最高點，此時 <span class=\"fx\">MP<sub>L</sub></span> 穿過 <span class=\"fx\">AP<sub>L</sub></span> 最高點。</li><li><span class=\"fx\">C</span> 點＝<span class=\"fx\">TP<sub>L</sub></span> 最高點（切線水平）→ <span class=\"fx\">\\dfrac∂ TP<sub>L</sub>∂ L=MP<sub>L</sub>=0</span>；過此 <span class=\"fx\">MP<sub>L</sub><0</span>。</li><li>三結論(p.283)：(1) 邊際量高於平均量，平均量遞增；(2) 邊際量低於平均量，平均量遞減；(3) 邊際量等於平均量，平均量不變（最高/最低點）。</li><li><strong>合理生產階段（第二階段）</strong>(p.287–288)：</li><li>第一階段：<span class=\"fx\">MP<sub>L</sub>>AP<sub>L</sub>>0</span>、<span class=\"fx\">AP<sub>L</sub></span> 遞增；此時 <span class=\"fx\">MP<sub>K</sub>=\\dfracLK(AP<sub>L</sub>-MP<sub>L</sub>)<0</span>（資本邊際產量為負），雇主不會用這階段。</li><li>第二階段（合理）：<span class=\"fx\">AP<sub>L</sub>>MP<sub>L</sub>>0</span>，<span class=\"fx\">AP<sub>L</sub></span> 最高點起至 <span class=\"fx\">MP<sub>L</sub>=0</span> 處；<span class=\"fx\">MP<sub>K</sub>>0</span>，兩要素邊際產量皆正。</li><li>第三階段：<span class=\"fx\">MP<sub>L</sub><0</span>；存在<strong>隱藏性失業（disguised unemployment）</strong>——表面有工作、實際與失業者一樣不增加社會總產出。</li><li><strong>合理生產階段＝第二階段＝<span class=\"fx\">AP<sub>L</sub></span> 最高點至 <span class=\"fx\">MP<sub>L</sub>=0</span></strong>。</li><li><strong>粗耕 vs. 精耕</strong>(p.289–290)：粗耕＝資本密集（Capital intensive，美國、澳洲地廣人稀），極大化 <span class=\"fx\">TP<sub>K</sub></span>、<span class=\"fx\">\\dfrac∂ TP<sub>K</sub>∂ K=MP<sub>K</sub>=0</span>（對應 <span class=\"fx\">AP<sub>L</sub></span> 最高點）；精耕＝勞動密集（Labor intensive，台灣、日本地狹人稠），極大化 <span class=\"fx\">TP<sub>L</sub></span>、<span class=\"fx\">\\dfrac∂ TP<sub>L</sub>∂ L=MP<sub>L</sub>=0</span>。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">L</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><path d=\"M70 230 Q150 150 220 90 Q300 40 360 90\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></path><text x=\"366\" y=\"92\" font-size=\"12\" fill=\"#1f3a5f\">TP</text><circle cx=\"150\" cy=\"160\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"110\" y=\"150\" font-size=\"10\" fill=\"#b5542e\">B 反曲點(MP最大)</text><circle cx=\"300\" cy=\"60\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"270\" y=\"52\" font-size=\"10\" fill=\"#1e7d32\">C(MP=0)</text></svg><p class=\"figcap\">TP 先凸後凹；反曲點 B 對應 MP 最大，最高點 C 對應 MP=0。(p.279)</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.3</strong>： (p.283)：TP/MP/AP 關係，何者錯誤：<div class=\"opts\"><div>(A) <span class=\"fx\">MP>0</span> 則 TP 遞增</div><div>(B) <span class=\"fx\">AP>MP>0</span> 則 AP 遞減</div><div>(C) TP 最大時 <span class=\"fx\">MP=0</span></div><div>(D) <span class=\"fx\">MP</span> 在遞減階段時 TP 也必在遞減階段</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.4–10.6</strong>： (p.283)：AP 最大發生時機（答案：邊際與平均生產力相等處）；MP 在何處與 AP 相交及原因；AP 遞減時 MP 小於 AP。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.7</strong>： (p.284)：<span class=\"fx\">Q=6LR<sup>2</sup>-0.1L<sup>3</sup>R<sup>5</sup></span>，原料 <span class=\"fx\">R</span> 固定 10 單位，求 (1) TP 函數、(2) AP 函數、(3) MP 函數。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.8</strong>： (p.290)：何者為真——(D) 邊際產量為零時總產量最大。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><strong>必考</strong>：TP 反曲點↔MP 最高；射線切 TP↔AP 最高（MP 穿過）；TP 最高↔MP=0。</li><li>合理生產第二階段範圍；隱藏性失業；粗耕（<span class=\"fx\">MP<sub>K</sub>=0</span>）/精耕（<span class=\"fx\">MP<sub>L</sub>=0</span>）。</li><li><span class=\"fx\">\\dfracdAP<sub>L</sub>dL=\\dfracMP<sub>L</sub>-AP<sub>L</sub>L</span> 的推導與應用。</li></ul>\n</div>\n</div>"}, {"id": "10.4", "title": "長期生產結構（印刷頁 291–297）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc57\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">長期生產函數</div><div class=\"mc-body\"><div class=\"mc-formula\">所有要素皆可變下，<span class=\"fx\">Q=F(L,K)</span>。</div><div class=\"mc-detail\">所有要素皆可變下，<span class=\"fx\">Q=F(L,K)</span>(p.291)。</div></div></div>\n<p class=\"def-note\">良好技術假設：(1) <strong>單調性</strong>（邊際生產力大於零）；(2) <strong>嚴格凸性</strong>（生產函數嚴格準凹，任兩組要素線性組合的產量大於任單一組）(p.291)。</p>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc58\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">等產量線（Isoquant）</div><div class=\"mc-body\"><div class=\"mc-formula\">其他情況不變，生產者為達特定產量所必須投入的要素組合軌跡。</div><div class=\"mc-detail\">其他情況不變，生產者為達特定產量所必須投入的要素組合軌跡(p.291)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc59\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">邊際技術替代率（MRTS, Marginal rate of technical substitution）</div><div class=\"mc-body\"><div class=\"mc-formula\">產量不變下，增加某要素投入時技術上必須減少另一要素的投入量。</div><div class=\"mc-detail\">產量不變下，增加某要素投入時技術上必須減少另一要素的投入量(p.292)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc60\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">等成本線（Isocost curve）</div><div class=\"mc-body\"><div class=\"mc-formula\">成本 <span class=\"fx\">TC</span> 與要素價格 <span class=\"fx\">(P<sub>L</sub>,P<sub>K</sub>)=(w,r)</span> 給定下，所能雇用 <span class=\"fx\">L</span> 與 <span class=\"fx\">K</span> 的兩種要素組合軌跡。</div><div class=\"mc-detail\">成本 <span class=\"fx\">TC</span> 與要素價格 <span class=\"fx\">(P<sub>L</sub>,P<sub>K</sub>)=(w,r)</span> 給定下，所能雇用 <span class=\"fx\">L</span> 與 <span class=\"fx\">K</span> 的兩種要素組合軌跡(p.295)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc61\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">生產者均衡（Production equilibrium）</div><div class=\"mc-body\"><div class=\"mc-formula\">給定成本限制下使產量最大，或給定產量限制下使成本最小的要素組合點；位於等產量線與等成本線相切點。</div><div class=\"mc-detail\">給定成本限制下使產量最大，或給定產量限制下使成本最小的要素組合點；位於等產量線與等成本線相切點(p.296)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>等產量線全微分：<span class=\"fx\">d\\barQ=\\dfrac∂ F∂ LdL+\\dfrac∂ F∂ KdK=MP<sub>L</sub>dL+MP<sub>K</sub>dK=0</span></li></ul>\n<p><span class=\"fx\">⇒\\dfracdKdL=-\\dfracMP<sub>L</sub>MP<sub>K</sub><0</span>(p.292)。</p>\n<ul><li><span class=\"fx\">MRTS<sub>LK</sub>=-\\dfracdKdL=\\dfracMP<sub>L</sub>MP<sub>K</sub></span>(p.292)。</li><li>常見生產函數(p.293)：</li><li>Cobb–Douglas：<span class=\"fx\">Q=AL<sup>α</sup>K<sup>β</sup></span>；</li><li>Linear（完全替代）：<span class=\"fx\">Q=\\dfracLα+\\dfracKβ</span>（<span class=\"fx\">α</span> 單位勞動等於 <span class=\"fx\">β</span> 單位資本）；</li><li>Leontief（完全互補）：<span class=\"fx\">Q=\\operatornameMin\\dfracLα,\\dfracKβ</span>（<span class=\"fx\">α</span> 單位勞動搭配 <span class=\"fx\">β</span> 單位資本）。</li><li>特殊函數 <span class=\"fx\">Q=\\max[\\dfracLα,\\dfracKβ]</span>：<span class=\"fx\">\\dfracLα>\\dfracKβ⇒ Q=\\dfracLα⇒ L=α Q</span>；反之 <span class=\"fx\">K=β Q</span>(p.293)。</li><li>Stone–Gary 型：<span class=\"fx\">Q=(L-\\barL)<sup>α</sup>(K-\\barK)<sup>β</sup></span>(p.294)。</li><li>CES（固定替代彈性）：<span class=\"fx\">Q=A[α L<sup>-ρ</sup>+(1-α)K<sup>-ρ</sup>]^-1/ρ</span>；<span class=\"fx\">A</span> 效率參數、<span class=\"fx\">α</span> 分配參數（0~1）；為一階齊次(p.294)。</li><li>等成本線：<span class=\"fx\">TC=P<sub>L</sub>L+P<sub>K</sub>K=wL+rK</span>；<span class=\"fx\">dTC=w dL+r dK</span>；<span class=\"fx\">\\dfracdKdL=-\\dfracP<sub>L</sub>P<sub>K</sub>=-\\dfracwr</span>；橫軸截距 <span class=\"fx\">\\dfracTCw</span>、縱軸截距 <span class=\"fx\">\\dfracTCr</span>、斜率 <span class=\"fx\">-\\dfracP<sub>L</sub>P<sub>K</sub></span>(p.295)。</li><li>兩大模型(p.296)：</li><li>極大化產量：<span class=\"fx\">\\max_\\L,K\\Q=F(L,K)</span> s.t. <span class=\"fx\">TC=wL+rK</span>，解 <span class=\"fx\">L<sup>*</sup>=L(w,r,TC)</span>、<span class=\"fx\">K<sup>*</sup>=K(w,r,TC)</span>；</li><li>極小化成本：<span class=\"fx\">\\min_\\L,K\\TC=wL+rK</span> s.t. <span class=\"fx\">\\barQ=F(L,K)</span>，解 L=L(w<span class=\"mpunct\">;</span>r<span class=\"mpunct\">,</span>Q)、K=K(w<span class=\"mpunct\">;</span>r<span class=\"mpunct\">,</span>Q)。</li><li><strong>生產者均衡條件（邊際生產力均等法則）</strong>：</li></ul>\n<p><span class=\"fx\">MRTS<sub>LK</sub>=\\dfracMP<sub>L</sub>MP<sub>K</sub>=\\dfracP<sub>L</sub>P<sub>K</sub>=\\dfracwr\\Leftrightarrow\\dfracMP<sub>L</sub>w=\\dfracMP<sub>K</sub>r</span>(p.296)——花在每種要素最後一塊錢回收的邊際產出相等。</p>\n<ul><li>不均衡調整(p.297)：</li><li>若 <span class=\"fx\">MRTS<sub>LK</sub>=\\dfracMP<sub>L</sub>MP<sub>K</sub>>\\dfracwr\\Leftrightarrow\\dfracMP<sub>L</sub>w>\\dfracMP<sub>K</sub>r</span>：增加 <span class=\"fx\">L</span>、減少 <span class=\"fx\">K</span>（如圖 <span class=\"fx\">A</span> 點）；</li><li>若 <span class=\"fx\">\\dfracMP<sub>L</sub>MP<sub>K</sub><\\dfracwr\\Leftrightarrow\\dfracMP<sub>L</sub>w<\\dfracMP<sub>K</sub>r</span>：減少 <span class=\"fx\">L</span>、增加 <span class=\"fx\">K</span>（如圖 <span class=\"fx\">B</span> 點）。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>良好技術下等產量線特色(p.292)：(1) 負斜率；(2) 凸向原點（隨 <span class=\"fx\">L</span> 增加 <span class=\"fx\">MRTS</span> 遞減，邊際技術替代率遞減法則）；(3) 任兩條不相交；(4) 越向東北方產量水準越高。</li><li>等產量線 vs. 異曲線差異(p.292 補充)：(1) 定義空間不同——異曲線在財品空間、等產量線在要素空間；(2) 數列序列不同——異曲線強調偏好順序（序數），等產量線強調絕對數字（基數），線上產量值有意義。</li><li><span class=\"fx\">A</span> 點資本勞動比 <span class=\"fx\">\\dfracK<sub>0</sub>L<sub>0</sub></span> 大於 <span class=\"fx\">B</span> 點 <span class=\"fx\">\\dfracK<sub>1</sub>L<sub>1</sub></span>：<span class=\"fx\">A</span> 為資本密集（Capital intensive）生產點、<span class=\"fx\">B</span> 為勞動密集（Labor intensive）生產點；同一條等產量線上產量水準相同(p.291)。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">L</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">K</text><path d=\"M110 50 Q150 130 360 200\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></path><text x=\"366\" y=\"200\" font-size=\"12\" fill=\"#1f3a5f\">Q</text><circle cx=\"180\" cy=\"120\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"150\" y=\"112\" font-size=\"10\" fill=\"#1e7d32\">A 陡(資本密集)</text><circle cx=\"300\" cy=\"175\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"280\" y=\"195\" font-size=\"10\" fill=\"#6b4e8e\">B 平(勞動密集)</text></svg><p class=\"figcap\">等產量線負斜率凸向原點，MRTS 遞減。(p.291)</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.9</strong>： (p.292)：何謂 Isoquant？與 Indifference curve 的異同點。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.10</strong>： (p.294，中山企管)：每部汽車需要一引擎 <span class=\"fx\">E</span> 與四輪 <span class=\"fx\">T</span>，生產函數為何？（答 Leontief <span class=\"fx\">Q=\\min\\E,T/4\\</span>）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.11</strong>： (p.295，中正企管)：<span class=\"fx\">Q=L^1/2K^3/2</span>，(1) 規模報酬性質？<br>(2) 短期 <span class=\"fx\">K</span> 固定下 <span class=\"fx\">MP<sub>L</sub></span> 是否遞減？<br>(3) 短期 <span class=\"fx\">L</span> 固定下 <span class=\"fx\">MP<sub>K</sub></span> 是否遞減？<br>(4) 求 <span class=\"fx\">MRTS</span> 並驗證是否遞減。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.12</strong>： (p.297)：<span class=\"fx\">\\dfracMP<sub>L</sub>P<sub>L</sub>=\\dfracMP<sub>K</sub>P<sub>K</sub></span> 主要經濟意涵？（答：成本最低）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.13</strong>： (p.297)：<span class=\"fx\">Q=√(KL)</span>、<span class=\"fx\">w=2</span>、<span class=\"fx\">r=1</span>，成本最小下生產 <span class=\"fx\">Q=100</span> 雇用多少 <span class=\"fx\">L,K</span>？成本限制 100 下極大化產量雇用多少 <span class=\"fx\">K</span>？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><span class=\"fx\">MRTS<sub>LK</sub>=MP<sub>L</sub>/MP<sub>K</sub>=-dK/dL<0</span> 及遞減。</li><li>三種極端生產函數（完全替代 Linear、完全互補 Leontief、Cobb–Douglas）等產量線形狀。</li><li>生產者均衡條件 <span class=\"fx\">\\dfracMP<sub>L</sub>w=\\dfracMP<sub>K</sub>r</span>（邊際生產力均等法則）及不均衡時要素調整方向。</li></ul>\n</div>\n</div>"}, {"id": "10.5", "title": "擴張線（Expansion Path）（印刷頁 298–301）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc56\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">擴張線</div><div class=\"mc-body\"><div class=\"mc-formula\">其他情況不變，生產規模變化時生產者均衡點移動的軌跡；以橫軸變數（通常 <span class=\"fx\">L</span>）為自變數、縱軸變數（通常 <span class=\"fx\">K</span>）為應變數的函數型態。</div><div class=\"mc-detail\">其他情況不變，生產規模變化時生產者均衡點移動的軌跡；以橫軸變數（通常 <span class=\"fx\">L</span>）為自變數、縱軸變數（通常 <span class=\"fx\">K</span>）為應變數的函數型態(p.298)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>以 Cobb–Douglas <span class=\"fx\">Q=θ L<sup>α</sup>K<sup>β</sup></span> 為例(p.298)：</li></ul>\n<p><span class=\"fx\">MP<sub>L</sub>=θα L<sup>α-1</sup>K<sup>β</sup></span>；<span class=\"fx\">MP<sub>K</sub>=θβ L<sup>α</sup>K<sup>β-1</sup></span>；</p>\n<p>均衡 <span class=\"fx\">\\dfracMP<sub>L</sub>MP<sub>K</sub>=\\dfracθα L<sup>α-1</sup>K<sup>β</sup>θβ L<sup>α</sup>K<sup>β-1</sup>=\\dfracα Kβ L=\\dfracP<sub>L</sub>P<sub>K</sub></span></p>\n<p><span class=\"fx\">⇒ K=\\dfracβα\\dfracP<sub>L</sub>P<sub>K</sub>L</span>，且 <span class=\"fx\">\\dfracβα\\dfracP<sub>L</sub>P<sub>K</sub>=</span> 常數。</p>\n<ul><li>若 <span class=\"fx\">Q=θ L<sup>α</sup>K<sup>β</sup></span> 且 <span class=\"fx\">α+β=1</span>（一階齊次），擴張線為自原點出發射線(p.298)。</li><li>通式一階齊次：Q=LF(1<span class=\"mpunct\">,</span>K/L)=Lf(k)，k=K/L=g(W/r)，故 K=g(W/r)L=CL（<span class=\"fx\">C</span> 常數）(p.299)。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>擴張線上每點皆為生產者均衡，對應給定產量下最小成本要素組合，可對應到長期平均成本與長期總成本(p.298)。</li><li><strong>所有一階齊次生產函數單調轉換而成的齊序函數（homothetic），擴張線皆為原點出發之射線</strong>(p.298)。</li><li><strong>齊序函數（Homothetic function）</strong>：將齊次函數做單調遞增轉換即得；由原點出發射線與函數各交點之 <span class=\"fx\">MRTS</span> 皆相同(p.300–301)。齊次函數必為齊序函數，反之不一定。</li></ul>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">L</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">K</text><line x1=\"120\" y1=\"60\" x2=\"300\" y2=\"150\" stroke=\"#b5542e\" stroke-width=\"1.4\"></line><line x1=\"160\" y1=\"50\" x2=\"360\" y2=\"150\" stroke=\"#b5542e\" stroke-width=\"1.4\"></line><path d=\"M130 90 Q200 120 320 150\" fill=\"none\" stroke=\"#1e7d32\" stroke-width=\"1.6\"></path><path d=\"M150 70 Q230 105 350 130\" fill=\"none\" stroke=\"#1e7d32\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"></path><circle cx=\"175\" cy=\"105\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"140\" y=\"100\" font-size=\"9\" fill=\"#6b4e8e\">E*</text><circle cx=\"260\" cy=\"120\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"266\" y=\"118\" font-size=\"9\" fill=\"#6b4e8e\">E1</text><path d=\"M175 105 L260 120\" stroke=\"#b5542e\" stroke-width=\"2.2\"></path><text x=\"200\" y=\"95\" font-size=\"9\" fill=\"#b5542e\">EP 擴張線</text></svg><p class=\"figcap\">擴張線：各規模下等成本線與等產量線切點連線，自原點東北延伸。(p.299)</p>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>擴張線＝各生產者均衡連線＝長期成本對應之要素組合；齊序函數擴張線為直線射線。</li></ul>\n</div>\n</div>"}, {"id": "10.6", "title": "替代彈性（Elasticity of substitution）（印刷頁 302–306）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc54\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">替代彈性 <span class=\"fx\">σ</span></div><div class=\"mc-body\"><div class=\"mc-formula\">給定產量下，當要素的 <span class=\"fx\">MRTS</span> 變動百分之一時，要素比例變動百分之幾；衡量要素間替代的難易度；<span class=\"fx\">σ</span> 越大代表替代性越高、等產量線越平滑。</div><div class=\"mc-detail\">給定產量下，當要素的 <span class=\"fx\">MRTS</span> 變動百分之一時，要素比例變動百分之幾；衡量要素間替代的難易度；<span class=\"fx\">σ</span> 越大代表替代性越高、等產量線越平滑(p.302)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc55\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">生產力彈性（elasticity of productivity）</div><div class=\"mc-body\"><div class=\"mc-formula\">所有要素投入變動百分之一使產量變動百分之幾。</div><div class=\"mc-detail\">所有要素投入變動百分之一使產量變動百分之幾(p.304)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>定義式：<span class=\"fx\">σ=\\dfracd(K/L)/(K/L)dMRTS/MRTS=\\dfracd\\ln(K/L)d\\ln MRTS=\\dfracd\\ln(K/L)d\\ln(W/r)</span>(p.302)。</li><li><strong>Cobb–Douglas <span class=\"fx\">Q=L<sup>α</sup>K<sup>β</sup></span></strong>：<span class=\"fx\">MRTS=\\dfracα Kβ L</span>，<span class=\"fx\">\\ln MRTS=\\ln\\dfracαβ+\\ln\\dfracKL</span>，故 <span class=\"fx\">σ=\\dfracd\\ln(K/L)d\\ln MRTS=1</span>(p.302)。</li><li><strong>直線型（完全替代）<span class=\"fx\">Q=\\dfracLα+\\dfracKβ</span></strong>：<span class=\"fx\">MRTS=\\dfracβα</span> 固定，<span class=\"fx\">\\dfracdMRTSMRTS=0</span>，故 <span class=\"fx\">σ→∞</span>(p.303)。</li><li><strong>李昂鐵夫型（完全互補）<span class=\"fx\">Q=\\min\\L/α,K/β\\</span></strong>：<span class=\"fx\">\\dfracKL=\\dfracβα</span> 固定，<span class=\"fx\">d(K/L)=0</span>，故 <span class=\"fx\">σ=0</span>(p.303)。</li><li><strong>CES</strong>：<span class=\"fx\">Q=θ[α L<sup>-ρ</sup>+β K<sup>-ρ</sup>]^-1/ρ</span>，<span class=\"fx\">MRTS=\\dfracαβ(\\dfracKL)<sup>ρ+1</sup></span>，<span class=\"fx\">\\ln MRTS=\\ln\\dfracαβ+(ρ+1)\\ln\\dfracKL</span>，</li></ul>\n<p><span class=\"fx\">σ=\\dfracd\\ln(K/L)d\\ln MRTS=\\dfrac1ρ+1</span>；</p>\n<p><span class=\"fx\">ρ=0⇒σ=1</span>（退化成 Cobb–Douglas）；<span class=\"fx\">ρ→∞⇒σ→0</span>（趨近 Leontief）；<span class=\"fx\">ρ→-1⇒σ→∞</span>（趨近 Linear）(p.304)。</p>\n<ul><li><strong>生產力彈性</strong>：<span class=\"fx\">ε=\\dfracΔ Q/QΔλ/λ=ε<sub>L</sub>+ε<sub>K</sub></span>；若為 <span class=\"fx\">k</span> 階齊次函數 <span class=\"fx\">F(λ L,λ K)=λ<sup>k</sup>Q</span>，則 <span class=\"fx\">ε=\\dfracdQ/Qdλ/λ=kλ<sup>k-1</sup>Q×\\dfracλλ<sup>k</sup>Q=k</span>，即<strong>規模彈性係數</strong>(p.304–305)。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>三個特例記憶：完全替代 <span class=\"fx\">σ=∞</span>；Cobb–Douglas <span class=\"fx\">σ=1</span>；完全互補 <span class=\"fx\">σ=0</span>。</li><li><strong>技術進步的種類（Hicks 定義）</strong>(p.305)：</li><li>勞動節約型（資本多用型）：<span class=\"fx\">MP<sub>K</sub></span> 增加使生產函數斜率變平，給定成本限制下 <span class=\"fx\">K</span> 使用量增加；</li><li>資本節約型（勞動多用型）：<span class=\"fx\">MP<sub>L</sub></span> 增加使斜率變陡，給定成本限制下 <span class=\"fx\">L</span> 使用量增加。</li><li>技術進步使 <span class=\"fx\">TP<sub>L</sub></span> 函數上移；若資本與勞動互補，資本增加亦使 <span class=\"fx\">TP<sub>L</sub></span> 上移(p.306)。</li></ul>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><text x=\"80\" y=\"20\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1f3a5f\">C-D 平滑凸</text><text x=\"220\" y=\"20\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1f3a5f\">Linear 直線</text><text x=\"360\" y=\"20\" text-anchor=\"middle\" font-size=\"10\" fill=\"#1f3a5f\">Leontief 直角</text><path d=\"M50 40 Q90 120 120 200\" fill=\"none\" stroke=\"#b5542e\" stroke-width=\"1.8\"></path><line x1=\"160\" y1=\"40\" x2=\"280\" y2=\"200\" stroke=\"#b5542e\" stroke-width=\"1.8\"></line><path d=\"M330 40 L330 130 L400 130\" fill=\"none\" stroke=\"#b5542e\" stroke-width=\"1.8\"></path><line x1=\"40\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.2\"></line><text x=\"120\" y=\"248\" font-size=\"9\" fill=\"#6c7684\">σ=1</text><text x=\"220\" y=\"248\" font-size=\"9\" fill=\"#6c7684\">σ→∞</text><text x=\"350\" y=\"248\" font-size=\"9\" fill=\"#6c7684\">σ=0</text></svg><p class=\"figcap\">替代彈性三型：Cobb-Douglas σ=1、Linear σ→∞、Leontief σ=0。(p.302)</p>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>替代彈性定義與三種極端值；CES 參數 <span class=\"fx\">ρ</span> 與 <span class=\"fx\">σ=\\dfrac1ρ+1</span> 的對應。</li><li>生產力彈性 <span class=\"fx\">ε=ε<sub>L</sub>+ε<sub>K</sub>=k</span>（齊次次數）。</li></ul>\n</div>\n</div>"}, {"id": "10.7", "title": "成本結構理論（印刷頁 307–309）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc49\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">會計成本（會計成本/外顯成本 explicit cost）</div><div class=\"mc-body\"><div class=\"mc-formula\">使用外在生產要素所產生的成本，會顯現在會計帳上。</div><div class=\"mc-detail\">使用外在生產要素所產生的成本，會顯現在會計帳上(p.307)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc50\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">內含成本（隱藏成本 implicit cost）</div><div class=\"mc-body\"><div class=\"mc-formula\">使用自有生產要素雖不需支付，但犧牲該要素其他用途所產生的成本，不顯現在會計帳上。</div><div class=\"mc-detail\">使用自有生產要素雖不需支付，但犧牲該要素其他用途所產生的成本，不顯現在會計帳上(p.307)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc51\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">機會成本（Opportunity cost）</div><div class=\"mc-body\"><div class=\"mc-formula\">(1) 當外顯成本為零時＝把資源投入某用途後放棄其他用途所能獲取的最大淨利（等於內含成本）；(2) 當外顯成本不為零時＝內含成本＋外顯成本。</div><div class=\"mc-detail\">(1) 當外顯成本為零時＝把資源投入某用途後放棄其他用途所能獲取的最大淨利（等於內含成本）；(2) 當外顯成本不為零時＝內含成本＋外顯成本(p.307)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc52\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">沉沒成本（Sunk cost）</div><div class=\"mc-body\"><div class=\"mc-formula\">決策當時已支付且無論做何決策皆無法回收之成本；是事後概念，不影響決策。</div><div class=\"mc-detail\">決策當時已支付且無論做何決策皆無法回收之成本；是事後概念，不影響決策(p.307 註)。</div></div></div>\n<p class=\"def-note\"><strong class=\"term\">經濟利潤（Economic profit）</strong>＝收入（Total Revenue）－機會成本＝收入－(外顯＋內含)＝會計利潤－內含成本；<strong>經濟利潤必小於會計利潤</strong>；會計利潤小於零時經濟利潤必小於零，但兩者非等價(p.308)。</p>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc53\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">正常利潤（Normal profit）</div><div class=\"mc-body\"><div class=\"mc-formula\">經濟利潤為零時所賺的會計利潤剛好等於內含成本；<strong class=\"term\">純粹租（Pure rent）</strong>：收入等於生產者剩餘時供給線垂直。</div><div class=\"mc-detail\">經濟利潤為零時所賺的會計利潤剛好等於內含成本；<strong class=\"term\">純粹租（Pure rent）</strong>：收入等於生產者剩餘時供給線垂直(p.308)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>經濟利潤＝會計利潤－內含成本(p.308)。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>後續章節成本皆指<strong>經濟成本（機會成本）</strong>，非會計成本(p.307)。</li></ul>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.14</strong>： (p.307)：三個工作飲料店正職 10,000、行銷經理 25,000、補習班暑期助教 30,000，選補習班助教的機會成本＝放棄的最高選項 25,000。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.15</strong>： (p.308)：已支出且無論如何都無法回收的支出稱為 sunk cost。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.16</strong>： (p.308)：Tara 開藥局，現職年薪 $50,000（內含成本＝$50,000）；另租金 $6,000、助理 $25,000 為外顯。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.17</strong>： (p.308)：土地可年租 $8,000 或賣 $75,000 投資於年息 15% 債券；保留土地不租的年機會成本＝$8,000（放棄的租金，即為次佳用途）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.18–10.21</strong>： (p.309)：漢堡店、花店 Bud（考慮放棄年薪 $30,000、存款利息）、老王賣麵（月薪 50,000 機會成本）、Lora 餐飲（$40,000 教職放棄＋$20,000 存款利息）等計算會計利潤與經濟利潤。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>機會成本＝次佳放棄選項；外顯＋內含；沉沒成本不影響決策；經濟利潤＝會計利潤－內含成本；正常利潤屬內含成本。</li></ul>\n</div>\n</div>"}, {"id": "10.8", "title": "短期成本結構（印刷頁 310–320）", "body": "\n<p class=\"def-note\">短期模型：生產者只用 <span class=\"fx\">L</span>（工資率 <span class=\"fx\">w</span>）與 <span class=\"fx\">K</span>（利率 <span class=\"fx\">r</span>），資本固定 <span class=\"fx\">\\barK</span>，給定產量下極小化成本(p.310)。</p>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc42\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">短期總成本（STC）</div><div class=\"mc-body\"><div class=\"mc-formula\">短期使用變動要素與固定要素所需付費，為總變動成本加總固定成本。</div><div class=\"mc-detail\">短期使用變動要素與固定要素所需付費，為總變動成本加總固定成本(p.311)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc43\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">總變動成本（TVC）</div><div class=\"mc-body\"><div class=\"mc-formula\">使用變動生產要素產生、隨產量改變的成本；<strong class=\"term\">總固定成本（TFC）</strong>：使用固定生產要素產生、不隨產量改變的成本。</div><div class=\"mc-detail\">使用變動生產要素產生、隨產量改變的成本；<strong class=\"term\">總固定成本（TFC）</strong>：使用固定生產要素產生、不隨產量改變的成本(p.311)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc44\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">準固定成本（Quasi fixed cost）</div><div class=\"mc-body\"><div class=\"mc-formula\">與固定成本類似不隨產量變，但為廠商決定開始生產時才必須支付的成本（如消防設備）。</div><div class=\"mc-detail\">與固定成本類似不隨產量變，但為廠商決定開始生產時才必須支付的成本（如消防設備）(p.311 補充)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc45\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">短期平均成本（SAC）</div><div class=\"mc-body\"><div class=\"mc-formula\">短期平均每單位產量負擔的成本。</div><div class=\"mc-detail\">短期平均每單位產量負擔的成本(p.311)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc46\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">平均變動成本（AVC）</div><div class=\"mc-body\"><div class=\"mc-formula\">短期平均每單位產量負擔的變動成本。</div><div class=\"mc-detail\">短期平均每單位產量負擔的變動成本(p.312)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc47\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">平均固定成本（AFC）</div><div class=\"mc-body\"><div class=\"mc-formula\">短期平均每單位產量負擔的固定成本。</div><div class=\"mc-detail\">短期平均每單位產量負擔的固定成本(p.312)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc48\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">邊際成本（SMC）</div><div class=\"mc-body\"><div class=\"mc-formula\">短期每增加一單位產量所造成成本增加額。</div><div class=\"mc-detail\">短期每增加一單位產量所造成成本增加額(p.312)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>模型：<span class=\"fx\">\\min_\\L\\STC=wL+r\\barK</span> s.t. <span class=\"fx\">Q=F(L,\\barK)</span>；解出 <span class=\"fx\">L<sup>*</sup>=L(Q,\\barK)</span>（有條件要素需求函數）；<span class=\"fx\">STC=wL<sup>*</sup>+r\\barK=wL(Q,\\barK)+r\\barK</span>(p.310)。</li><li><span class=\"fx\">STC=TVC+TFC=wL(Q,\\barK)+r\\barK</span>；其中 <span class=\"fx\">Q</span> 為內生變數、<span class=\"fx\">w,r,\\barK</span> 為外生變數(p.311)。</li><li><span class=\"fx\">SAC=\\dfracSTC(Q;w,r,\\barK)Q=\\dfracTVC+TFCQ=\\dfracwL(Q,\\barK)Q+\\dfracr\\barKQ=AVC(Q;w,\\barK)+AFC(Q;r,\\barK)</span>(p.311)。</li><li><span class=\"fx\">AVC=\\dfracTVCQ=\\dfracwLQ=\\dfracwQ/L=\\dfracwAP<sub>L</sub></span>；<strong>故 <span class=\"fx\">AP<sub>L</sub></span> 最高時 <span class=\"fx\">AVC</span> 為相對最低點</strong>(p.312)。</li><li><span class=\"fx\">AFC=\\dfracTFCQ</span>：等軸雙曲線，隨 <span class=\"fx\">Q</span> 增加 <span class=\"fx\">AFC</span> 下降(p.312)。</li><li><span class=\"fx\">SMC=\\dfrac∂ STC∂ Q=\\dfrac∂(TVC+TFC)∂ Q=\\dfrac∂ TVC∂ Q+0=\\dfrac∂ TVC∂ Q</span>；</li></ul>\n<p><span class=\"fx\">SMC=\\dfrac∂ TVC∂ Q=\\dfrac∂ wL∂ Q=\\dfracw∂ Q/∂ L=\\dfracwMP<sub>L</sub></span>；<strong>故 <span class=\"fx\">MP<sub>L</sub></span> 最高時 <span class=\"fx\">SMC</span> 為相對最低點</strong>；<span class=\"fx\">SMC</span> 為 <span class=\"fx\">STC</span> 之切線斜率(p.312–313)。</p>\n<ul><li><span class=\"fx\">SAC</span> 與 <span class=\"fx\">SMC</span> 關係(p.316)：<span class=\"fx\">\\dfracdSACdQ=\\dfracd(STC/Q)dQ=\\dfrac\\dfracdSTCdQQ-STCQ<sup>2</sup>=\\dfracSMC-SACQ</span></li><li><span class=\"fx\">SMC>SAC\\Leftrightarrow\\dfracdSACdQ>0</span>（<span class=\"fx\">SAC</span> 遞增）；</li><li><span class=\"fx\">SMC=SAC\\Leftrightarrow\\dfracdSACdQ=0</span>（<span class=\"fx\">SAC</span> 最低點）；</li><li><span class=\"fx\">SMC\\lt SAC\\Leftrightarrow\\dfracdSACdQ\\lt 0</span>（<span class=\"fx\">SAC</span> 遞減）。</li></ul>\n<p>即 <strong>SMC 穿過 SAC 最低點</strong>。</p>\n<ul><li><span class=\"fx\">AVC</span> 與 <span class=\"fx\">SMC</span> 關係(p.316–317)：<span class=\"fx\">\\dfracdAVCdQ=\\dfracSMC-AVCQ</span></li><li><span class=\"fx\">SMC>AVC⇒ AVC</span> 遞增；<span class=\"fx\">SMC=AVC</span>（<span class=\"fx\">AVC</span> 最低點）；<span class=\"fx\">SMC\\lt AVC⇒ AVC</span> 遞減。</li></ul>\n<p>即 <strong>SMC 穿過 AVC 最低點</strong>。</p>\n<ul><li>SAC=AVC+AFC；因 <span class=\"fx\">AFC</span> 隨 <span class=\"fx\">Q</span> 遞減，<span class=\"fx\">SAC</span> 與 <span class=\"fx\">AVC</span> 垂直差距隨 <span class=\"fx\">Q</span> 上升而縮短(p.317)。</li><li><span class=\"fx\">SAC</span> 呈 U 形的兩假設：(1) 邊際生產力遞減成立；(2) <span class=\"fx\">AFC</span> 遞減成立(p.317)。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong>TVC 與 TP 互為鏡像</strong>：<span class=\"fx\">TVC=wL(Q,\\barK)</span>；<span class=\"fx\">TP<sub>L</sub></span> 上的反曲點（<span class=\"fx\">A</span>）對應 <span class=\"fx\">TVC</span> 反曲點；<span class=\"fx\">TP<sub>L</sub></span> 射線切點（<span class=\"fx\">B</span>）對應 <span class=\"fx\">TVC</span> 射線切點；<span class=\"fx\">TP<sub>L</sub></span> 水平切點（<span class=\"fx\">C</span>）對應 <span class=\"fx\">TVC</span> 垂直切點(p.313–314)。</li><li>STC=TVC+TFC：<span class=\"fx\">TFC</span> 為水平線；<span class=\"fx\">STC</span> 與 <span class=\"fx\">TVC</span> 垂直距離永遠等於 <span class=\"fx\">TFC</span>(p.315)。</li><li><span class=\"fx\">AVC</span> 為 <span class=\"fx\">TVC</span> 上點與原點連線之射線斜率；<span class=\"fx\">AFC</span> 為 <span class=\"fx\">TFC</span> 上點與原點連線之射線斜率（持續遞減）(p.315–316)。</li><li>對應生產點(p.320)：<span class=\"fx\">A</span> 點為 <span class=\"fx\">TP<sub>L</sub></span> 反曲點＝<span class=\"fx\">MP<sub>L</sub></span> 最高＝<span class=\"fx\">SMC</span> 最低；<span class=\"fx\">B</span> 點為 <span class=\"fx\">TP<sub>L</sub></span> 射線切點＝<span class=\"fx\">AP<sub>L</sub></span> 最高＝<span class=\"fx\">AVC</span> 最低。<span class=\"fx\">SMC</span> 遞增的原因是 <span class=\"fx\">MP<sub>L</sub></span> 遞減；<span class=\"fx\">AVC</span> 遞增的原因是 <span class=\"fx\">AP<sub>L</sub></span> 遞減。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">cost</text><path d=\"M120 200 Q180 180 240 120\" fill=\"none\" stroke=\"#b5542e\" stroke-width=\"2.2\"></path><text x=\"246\" y=\"118\" font-size=\"12\" fill=\"#b5542e\">SMC</text><path d=\"M110 120 Q200 90 300 150 Q360 180 400 200\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2\"></path><text x=\"386\" y=\"200\" font-size=\"12\" fill=\"#1f3a5f\">SAC</text><path d=\"M130 150 Q220 125 300 160 Q360 185 395 195\" fill=\"none\" stroke=\"#1e7d32\" stroke-width=\"1.8\" stroke-dasharray=\"5 4\"></path><text x=\"360\" y=\"180\" font-size=\"11\" fill=\"#1e7d32\">AVC</text><circle cx=\"220\" cy=\"132\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"150\" y=\"128\" font-size=\"10\" fill=\"#1e7d32\">穿AVC最低(停止點)</text><circle cx=\"280\" cy=\"140\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"286\" y=\"136\" font-size=\"10\" fill=\"#6b4e8e\">穿SAC最低(損益兩平)</text></svg><p class=\"figcap\">SMC 由下而上穿過 AVC、SAC 最低點；SAC 在 AVC 上方，差距=AFC 遞減。(p.317)</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.22</strong>： (p.311)：<span class=\"fx\">TC=0.05Q<sup>3</sup>-5Q<sup>2</sup>+500Q+5000</span>，求 TVC、AVC、AFC、SAC、SMC，以及 AVC、MC、SAC 各自最低之產量。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.23</strong>： (p.312)：<span class=\"fx\">Q=√(KL)</span>，<span class=\"fx\">K</span> 固定 100、資本租金每小時 10 元、工資率 5 元，求短期總成本函數。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.24</strong>： (p.312)：<span class=\"fx\">Q=\\min(K,2L/3)</span>，燒錄機 <span class=\"fx\">K</span> 每台 11 元、勞工每人 6 元、<span class=\"fx\">K</span> 固定 10 台，求短期總成本函數。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.25–10.27</strong>： (p.318)：MC 與 AVC/SAC 增減關係判斷（正確：<span class=\"fx\">MC=AC</span> 時 <span class=\"fx\">AC</span> 最低；<span class=\"fx\">MC>AVC</span> 時 <span class=\"fx\">AVC</span> 上升）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.28</strong>： (p.319)：AVC 為水平線時——短期邊際成本必為水平線（B）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.29</strong>： (p.319，台大國企)：<span class=\"fx\">Q=100</span> 時 SAC 與 AVC 差額 2 元，求 <span class=\"fx\">Q=50</span> 時差額（SAC−AVC=AFC=TFC/Q，<span class=\"fx\">Q=100</span> 時 <span class=\"fx\">AFC=2⇒ TFC=200</span>；<span class=\"fx\">Q=50</span> 時 AFC=200/50=4 元）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.30</strong>： (p.320)：何者錯誤——<div class=\"opts\"><div>(A) 當 <span class=\"fx\">MP<sub>L</sub></span> 上升時 <span class=\"fx\">MC</span> 也上升（錯，應下降）</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><strong>必考</strong>：<span class=\"fx\">SMC=w/MP<sub>L</sub></span>、<span class=\"fx\">AVC=w/AP<sub>L</sub></span> 的對應；<span class=\"fx\">MP<sub>L</sub></span> 最高↔<span class=\"fx\">SMC</span> 最低；<span class=\"fx\">AP<sub>L</sub></span> 最高↔<span class=\"fx\">AVC</span> 最低。</li><li><span class=\"fx\">SMC</span> 依序穿過 <span class=\"fx\">AVC</span> 最低點、<span class=\"fx\">SAC</span> 最低點；<span class=\"fx\">SAC</span> 與 <span class=\"fx\">AVC</span> 差距＝<span class=\"fx\">AFC</span> 遞減。</li><li>AFC=TFC/Q 雙曲線計算（如例 10.29）。</li></ul>\n</div>\n</div>"}, {"id": "10.9", "title": "長期成本結構（印刷頁 321–327）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc39\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">長期成本</div><div class=\"mc-body\"><div class=\"mc-formula\">所有要素皆可調整，廠商在每個既定產量下選擇成本最小的要素組合；長期成本必定不高於短期總成本。</div><div class=\"mc-detail\">所有要素皆可調整，廠商在每個既定產量下選擇成本最小的要素組合；長期成本必定不高於短期總成本(p.321–322)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc40\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">包絡線（Envelope curve）</div><div class=\"mc-body\"><div class=\"mc-formula\">長期總成本曲線為對應每個生產數量下最小短期總成本所構成，即 STC 的外包絡；同理 LAC 為 SAC 的外包絡。</div><div class=\"mc-detail\">長期總成本曲線為對應每個生產數量下最小短期總成本所構成，即 STC 的外包絡；同理 LAC 為 SAC 的外包絡(p.322)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc41\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">最小效率規模（MES, Minimum efficient scale）</div><div class=\"mc-body\"><div class=\"mc-formula\">LAC 最低點，又稱最適資本數量/最適產能。</div><div class=\"mc-detail\">LAC 最低點，又稱最適資本數量/最適產能(p.324 註)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>長期模型：<span class=\"fx\">\\min_\\L,K\\LTC=wL+rK</span> s.t. <span class=\"fx\">Q=F(L,K)</span>；解得有條件要素需求 <span class=\"fx\">L<sub>d</sub><sup>*</sup>=L(Q,w,r)</span>、<span class=\"fx\">K<sub>d</sub><sup>*</sup>=K(Q,w,r)</span>；帶回得 LTC=wL(Q<span class=\"mpunct\">,</span>w<span class=\"mpunct\">,</span>r)+rK(Q<span class=\"mpunct\">,</span>w<span class=\"mpunct\">,</span>r)(p.321)。</li><li><span class=\"fx\">LAC=\\dfracLTCQ=\\dfrac[wL(Q,w,r)+rK(Q,w,r)]Q</span>；<span class=\"fx\">LMC=\\dfrac∂ LTC∂ Q</span>(p.321)。</li><li><span class=\"fx\">LTC(Q)=\\min_\\K\\STC(Q,\\barK)</span>，且 <span class=\"fx\">\\dfrac∂ STC(\\barK)∂\\barK=0</span> 決定最適 <span class=\"fx\">K<sup>*</sup>=f(Q)</span>(p.323)。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>長期成本為 STC 族之下包絡線；LAC 為 SAC 族之下包絡線(p.322–323)。</li><li>在 <span class=\"fx\">Q<sup>*</sup></span>（LAC 最低點）：<span class=\"fx\">LTC=STC(K<sub>1</sub>)</span> 且兩者相切，<span class=\"fx\">LAC=SAC(K<sub>1</sub>)</span>，此為 <span class=\"fx\">SAC(K<sub>1</sub>)</span> 與 <span class=\"fx\">LAC</span> 共同最低點(p.324)。</li><li>在 <span class=\"fx\">Q<sub>0</sub>\\lt Q<sup>*</sup></span>：<span class=\"fx\">STC(K<sub>0</sub>)</span> 與 <span class=\"fx\">LTC</span> 相切但<strong>非</strong>切於 <span class=\"fx\">SAC(K<sub>0</sub>)</span> 最低點，而是在 <span class=\"fx\">SAC(K<sub>0</sub>)</span> 遞減段與 <span class=\"fx\">LAC</span> 相切；在 <span class=\"fx\">Q<sub>2</sub>>Q<sup>*</sup></span>：<span class=\"fx\">SAC(K<sub>2</sub>)</span> 遞增段與 <span class=\"fx\">LAC</span> 相切(p.324)。</li><li><strong>長期邊際成本 LMC</strong> 與短期 SMC 關係(p.325)：在每個 STC 與 LTC 相切之處，對應的 SMC 必與 LMC 相交。</li><li><strong>四個等式結論</strong>(p.325)：</li></ul>\n<ol><li>最適規模 <span class=\"fx\">Q<sup>*</sup></span> 時 SAC=LAC=SMC=LMC；</li><li><span class=\"fx\">Q\\lt Q<sup>*</sup></span> 時 <span class=\"fx\">SAC=LAC\\gt SMC=LMC</span>；</li><li><span class=\"fx\">Q>Q<sup>*</sup></span> 時 <span class=\"fx\">SAC=LAC\\lt SMC=LMC</span>。</li></ol>\n<ul><li>包絡定理：長期總成本為所有短期總成本中最小者，故 LTC 為 STC 外包絡(p.324 補充)。</li></ul>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">TC</text><path d=\"M90 90 Q150 160 210 90\" fill=\"none\" stroke=\"#ccc\" stroke-width=\"1.4\"></path><path d=\"M180 70 Q250 150 320 80\" fill=\"none\" stroke=\"#ccc\" stroke-width=\"1.4\"></path><path d=\"M280 80 Q340 150 390 110\" fill=\"none\" stroke=\"#ccc\" stroke-width=\"1.4\"></path><path d=\"M85 95 Q240 160 395 115\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></path><text x=\"396\" y=\"110\" font-size=\"11\" fill=\"#1f3a5f\">LTC</text></svg><p class=\"figcap\">LTC 為各 STC 曲線的下方包絡線。(p.322)</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.31–10.33</strong>： (p.326)：LAC 為 SAC 外包絡，不一定通過 SAC 最低點（正確答案：(C)）；STC 與 LTC 相切處 <span class=\"fx\">SMC=LMC</span>；LAC 縱軸截距非原點。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.34</strong>： (p.326)：<span class=\"fx\">Q=\\min(5K,10L)</span>、<span class=\"fx\">w=3</span>、<span class=\"fx\">r=2</span>，求 LTC、LAC、LMC。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.35</strong>： (p.327)：<span class=\"fx\">Q=√(LK)</span>、<span class=\"fx\">w=5</span>、<span class=\"fx\">r=10</span><br>(1) 短期 <span class=\"fx\">K=4</span> 求 <span class=\"fx\">MP<sub>L</sub></span> 與 STC<br>(2) 求 LTC。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>LTC/LAC 為 STC/SAC 外包絡；LAC 最低點才切 SAC 最低點，其餘切點不在 SAC 最低。</li><li>最適規模 SAC=LAC=SMC=LMC；<span class=\"fx\">Q\\lt Q<sup>*</sup></span> 時 <span class=\"fx\">SMC=LMC\\lt SAC=LAC</span>；<span class=\"fx\">Q>Q<sup>*</sup></span> 時反之。</li><li>LMC 穿過 LAC 最低點。</li></ul>\n</div>\n</div>"}, {"id": "10.10", "title": "規模經濟（Economies of Scale）（印刷頁 328–332）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc33\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">內部規模經濟（Internal economies of scale）</div><div class=\"mc-body\"><div class=\"mc-formula\">生產規模擴大時廠商內部有利因素使平均成本降低（<span class=\"fx\">Q</span> 升、<span class=\"fx\">LAC</span> 降），為 LAC 線上點的移動。</div><div class=\"mc-detail\">生產規模擴大時廠商內部有利因素使平均成本降低（<span class=\"fx\">Q</span> 升、<span class=\"fx\">LAC</span> 降），為 LAC 線上點的移動(p.328)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc34\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">內部規模不經濟（Internal diseconomies of scale）</div><div class=\"mc-body\"><div class=\"mc-formula\">規模擴大時內部不利因素使平均成本上升（<span class=\"fx\">Q</span> 升、<span class=\"fx\">LAC</span> 升）。</div><div class=\"mc-detail\">規模擴大時內部不利因素使平均成本上升（<span class=\"fx\">Q</span> 升、<span class=\"fx\">LAC</span> 升）(p.328)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc35\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">外部規模經濟（External economies of scale）</div><div class=\"mc-body\"><div class=\"mc-formula\">廠商 LAC 整條線下移；常見原因：技術進步、要素價格下跌、學習效果（Learning effect）。</div><div class=\"mc-detail\">廠商 LAC 整條線下移；常見原因：技術進步、要素價格下跌、學習效果（Learning effect）(p.329)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc36\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">外部規模不經濟（External diseconomies of scale）</div><div class=\"mc-body\"><div class=\"mc-formula\">LAC 整條線上移。</div><div class=\"mc-detail\">LAC 整條線上移(p.329)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc37\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">學習曲線（Learning curve）</div><div class=\"mc-body\"><div class=\"mc-formula\">隨累積產量增加提升勞工經驗與效率，每單位產出投入時間減少，導致平均成本減少。</div><div class=\"mc-detail\">隨累積產量增加提升勞工經驗與效率，每單位產出投入時間減少，導致平均成本減少(p.329 註)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc38\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">範疇經濟（Economies of scope）</div><div class=\"mc-body\"><div class=\"mc-formula\">單一廠商同時生產兩種產品的總成本，比各由別廠分別生產的成本總和還少。</div><div class=\"mc-detail\">單一廠商同時生產兩種產品的總成本，比各由別廠分別生產的成本總和還少(p.329)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>範疇經濟條件：<span class=\"fx\">TC(X,Y)≤ TC<sub>1</sub>(X)+TC<sub>2</sub>(Y)</span>，<span class=\"fx\">\\therefore AC(X,Y)≤ AC<sub>1</sub>(X)+AC<sub>2</sub>(Y)</span>(p.329)。</li><li>範疇經濟程度：<span class=\"fx\">SC=\\dfrac[TC<sub>1</sub>(X)+TC<sub>2</sub>(Y)-TC(X,Y)]TC(X,Y)</span>；<span class=\"fx\">SC>0</span> 範疇經濟、<span class=\"fx\">SC<0</span> 範疇不經濟(p.330)。</li><li>規模經濟與規模報酬關聯(p.330–331)：若生產函數為 CRS，則 <span class=\"fx\">LAC=LMC</span> 固定；IRS 則 LAC 遞減（出現規模經濟），此時 <span class=\"fx\">LAC>LMC</span>；DRS 則 LAC 遞增（規模不經濟），<span class=\"fx\">LAC\\lt LMC</span>。反向推論不一定成立。</li><li>齊次函數邊際生產力分配：<span class=\"fx\">kQ=MP<sub>L</sub>L+MP<sub>K</sub>K</span>；<span class=\"fx\">k=\\dfracMP<sub>L</sub>LQ+\\dfracMP<sub>K</sub>KQ=α<sub>L</sub>+α<sub>K</sub>=ε<sub>L</sub>+ε<sub>K</sub></span>(p.331)。</li><li>成本極小下 <span class=\"fx\">\\dfracMP<sub>L</sub>w=\\dfracMP<sub>K</sub>r=\\dfrac1λ=\\dfrac1LMC</span>，可推得 <span class=\"fx\">k=\\dfracLACLMC</span>(p.332)：</li><li><span class=\"fx\">k>1\\Leftrightarrow LAC>LMC</span>：規模經濟，LAC 隨產量遞減；</li><li><span class=\"fx\">k=1\\Leftrightarrow LAC=LMC</span>：最有效率規模，LAC 為常數；</li><li><span class=\"fx\">k\\lt 1\\Leftrightarrow LAC\\lt LMC</span>：規模不經濟，LAC 隨產量遞增。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>LAC 呈 U 形的原因：同時發生內部規模經濟（左半）與內部規模不經濟（右半）(p.328)。</li><li>內部規模經濟成因(p.328 註)：(1) 多角化經營水平/垂直整合；(2) 專業分工；(3) 利用多餘技術生產相關產品；(4) 上下游原料再利用。</li><li>內部規模不經濟成因：(1) 太過度精細分工；(2) 管理效率過低。</li><li>外部經濟/不經濟是<strong>整條 LAC 移動</strong>（線的移動），內部經濟/不經濟是<strong>沿 LAC 點移動</strong>。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">LAC</text><path d=\"M100 100 Q200 70 245 80 Q340 95 400 150\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2.4\"></path><text x=\"386\" y=\"140\" font-size=\"12\" fill=\"#1f3a5f\">LAC</text><circle cx=\"245\" cy=\"80\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"252\" y=\"76\" font-size=\"10\" fill=\"#b5542e\">最低點 Q*</text><text x=\"110\" y=\"90\" font-size=\"10\" fill=\"#6c7684\">左：內部經濟(規模經濟)</text><text x=\"300\" y=\"110\" font-size=\"10\" fill=\"#6c7684\">右：內部不經濟</text></svg><p class=\"figcap\">LAC U 形：最低點左規模經濟、右規模不經濟。(p.328)</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.36</strong>： (p.330)：Economic of scale 發生時 long-run average total cost falls as output increase（C）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.37</strong>： (p.330)：存在 diseconomies of scale 時 LAC 必為正斜率（B）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>內部 vs. 外部規模經濟（點移動 vs. 線移動）；學習曲線。</li><li>範疇經濟條件 <span class=\"fx\">TC(X,Y)≤ TC<sub>1</sub>(X)+TC<sub>2</sub>(Y)</span> 與 <span class=\"fx\">SC</span> 公式。</li><li>k=LAC/LMC 判斷規模經濟（<span class=\"fx\">k>1</span> 經濟、<span class=\"fx\">k=1</span> MES、<span class=\"fx\">k<1</span> 不經濟）。</li></ul>\n</div>\n</div>"}, {"id": "10.11", "title": "要素價格與成本結構（印刷頁 333–334）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc32\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">正常要素</div><div class=\"mc-body\"><div class=\"mc-formula\">財貨 <span class=\"fx\">Q</span> 需求增加使該要素 <span class=\"fx\">L</span> 需求增加，<span class=\"fx\">\\dfrac∂ L∂ Q>0</span>；<strong>中性要素</strong>：<span class=\"fx\">\\dfrac∂ L∂ Q=0</span>；<strong>劣等要素</strong>：<span class=\"fx\">Q</span> 增加使 <span class=\"fx\">L</span> 需求下降，<span class=\"fx\">\\dfrac∂ L∂ Q<0</span>。</div><div class=\"mc-detail\">財貨 <span class=\"fx\">Q</span> 需求增加使該要素 <span class=\"fx\">L</span> 需求增加，<span class=\"fx\">\\dfrac∂ L∂ Q>0</span>；<strong>中性要素</strong>：<span class=\"fx\">\\dfrac∂ L∂ Q=0</span>；<strong>劣等要素</strong>：<span class=\"fx\">Q</span> 增加使 <span class=\"fx\">L</span> 需求下降，<span class=\"fx\">\\dfrac∂ L∂ Q<0</span>(p.333)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>要素價格上升對總成本與平均成本的影響：無論何種要素，要素價格上升，長期平均成本線都會上移（等成本線外移，TC 上升，AC 上升）(p.334)。</li><li><strong>Shephard's Lemma</strong>：<span class=\"fx\">\\dfrac∂ TC∂ w=L</span>（<span class=\"fx\">TC=wL<sup>d</sup>+rK<sup>d</sup></span>）(p.334)。</li><li>配合楊氏定理（交叉導數相等）：<span class=\"fx\">\\dfrac∂ L∂ Q=\\dfrac∂(∂ TC/∂ w)∂ Q=\\dfrac∂(∂ TC/∂ Q)∂ w=\\dfrac∂ MC∂ w</span>(p.334)。</li><li>正常要素 <span class=\"fx\">\\dfrac∂ L∂ Q=\\dfrac∂ MC∂ w>0</span>：要素價格上升，LMC 上移；</li><li>中性要素 <span class=\"fx\">=0</span>：LMC 不變；</li><li>劣等要素 <span class=\"fx\"><0</span>：LMC 下移。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>整理表(p.334)：</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:16.67%\"><col style=\"width:16.67%\"><col style=\"width:16.67%\"><col style=\"width:16.67%\"><col style=\"width:16.67%\"><col style=\"width:16.67%\"></colgroup><thead><tr><th>要素種類</th><th><span class=\"fx\">∂ L/∂ Q</span></th><th><span class=\"fx\">w</span>↑</th><th>LTC</th><th>LAC</th><th>LMC</th></tr></thead><tbody><tr><td>正常要素</td><td><span class=\"fx\">>0</span></td><td>↑</td><td>上移</td><td>上移</td><td>上移</td></tr><tr><td>中性要素</td><td><span class=\"fx\">=0</span></td><td>↑</td><td>上移</td><td>上移</td><td>不變</td></tr><tr><td>劣等要素</td><td><span class=\"fx\"><0</span></td><td>↑</td><td>上移</td><td>上移</td><td>下移</td></tr></tbody></table></div>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">L</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">K</text><line x1=\"120\" y1=\"50\" x2=\"360\" y2=\"200\" stroke=\"#1f3a5f\" stroke-width=\"2\"></line><text x=\"300\" y=\"215\" font-size=\"9\" fill=\"#1f3a5f\">原等成本線</text><line x1=\"150\" y1=\"50\" x2=\"360\" y2=\"130\" stroke=\"#b5542e\" stroke-width=\"1.8\" stroke-dasharray=\"5 4\"></line><text x=\"300\" y=\"125\" font-size=\"9\" fill=\"#b5542e\">w↑ 變陡新線</text><path d=\"M200 100 Q260 120 300 140\" fill=\"none\" stroke=\"#1e7d32\" stroke-width=\"1.4\"></path><text x=\"250\" y=\"95\" font-size=\"9\" fill=\"#1e7d32\">等產量線</text></svg><p class=\"figcap\">工資率 w 上升，等成本線橫軸截距變小、變陡。(p.333)</p>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>正常/中性/劣等要素的判定；要素價格變動對 LTC、LAC、LMC 的不同影響（LMC 才會因劣等要素下移）。</li><li>Shephard's Lemma <span class=\"fx\">∂ TC/∂ w=L</span>。</li></ul>\n</div>\n</div>"}, {"id": "10.12", "title": "附錄 廠商行為（印刷頁 335–337）", "body": "\n<p class=\"def-note\">兩階段決策：(1) 給定產量極小化成本 → 有條件要素需求；(2) 給定成本極大化產量；或 (2') 極大化利潤 <span class=\"fx\">π=PQ-TC(Q)</span> → 無條件要素需求(p.336)。</p>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li><strong>給定產量極小化成本</strong>：<span class=\"fx\">\\min_\\L,K\\TC=wL+rK</span> s.t. <span class=\"fx\">\\barQ=F(L,K)</span>。</li></ul>\n<p>拉氏式 <span class=\"fx\">\\mathcalL=wL+rK+λ[\\barQ-F(L,K)]</span>：</p>\n<p><span class=\"fx\">\\mathcalL<sub>L</sub>=w-λ MP<sub>L</sub>=0</span>；<span class=\"fx\">\\mathcalL<sub>K</sub>=r-λ MP<sub>K</sub>=0</span>；<span class=\"fx\">\\mathcalL_λ=\\barQ-F(L,K)=0</span>。</p>\n<p>解出有條件要素需求 <span class=\"fx\">L<sub>C</sub><sup>d</sup>=L<sup>d</sup>(w;r,q)</span>、<span class=\"fx\">K<sub>C</sub><sup>d</sup>=K<sup>d</sup>(r;w,Q)</span> 及 <span class=\"fx\">λ<sup>*</sup></span>(p.335)。</p>\n<ul><li>Shephard's Lemma：<span class=\"fx\">L<sub>C</sub><sup>d</sup>=\\dfrac∂ TC(Q;w,r)∂ w</span>；<span class=\"fx\">K<sub>C</sub><sup>d</sup>=\\dfrac∂ TC(Q;w,r)∂ r</span>(p.335)。</li><li>對 <span class=\"fx\">Q</span> 微分，配合限制式 <span class=\"fx\">MP<sub>L</sub>\\dfrac∂ L<sup>d</sup>∂ Q+MP<sub>K</sub>\\dfrac∂ K<sup>d</sup>∂ Q=1</span>，得 <span class=\"fx\">\\dfrac∂ TC(Q;w,r)∂ Q=MC=λ<sup>*</sup></span>——<strong><span class=\"fx\">λ<sup>*</sup></span> 為生產者均衡時生產一單位產量的邊際成本</strong>(p.336)。</li><li><strong>給定成本極大化產量</strong>：<span class=\"fx\">\\max_\\L,K\\Q=F(L,K)</span> s.t. <span class=\"fx\">TC=wL+rK</span>(p.336)。</li><li><strong>利潤極大化（兩階段合一）</strong>：<span class=\"fx\">\\max_\\L,K\\π=PQ(L,K)-wL-rK</span>，一階條件：</li></ul>\n<p><span class=\"fx\">P\\dfrac∂ Q∂ L-w=0</span>；<span class=\"fx\">P\\dfrac∂ Q∂ K-r=0</span>；即 <span class=\"fx\">P· MP<sub>L</sub>=w</span>、<span class=\"fx\">P· MP<sub>K</sub>=r</span>(p.336)。</p>\n<p>解出無條件要素需求 <span class=\"fx\">L<sup>d</sup>=L<sup>d</sup>(w;r,P)</span>、<span class=\"fx\">K<sup>d</sup>=K<sup>d</sup>(w;r,P)</span>。</p>\n<ul><li><strong>Hotelling Lemma</strong>：<span class=\"fx\">\\dfrac∂π∂ w=-L<sup>d</sup></span>；<span class=\"fx\">\\dfrac∂π∂ r=-K<sup>d</sup></span>；<span class=\"fx\">\\dfrac∂π∂ P=Q<sup>s</sup></span>（為商品供給線）(p.337)。</li><li>利潤極大必定成本極小，但成本極小不一定利潤極大；利潤極大條件 <span class=\"fx\">\\dfrac1P=\\dfracMP<sub>L</sub>w=\\dfracMP<sub>K</sub>r</span>(p.337)。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>利潤極大 <span class=\"fx\">\\Leftrightarrow</span> 成本極小＋價格等於邊際成本（<span class=\"fx\">P=MC</span>）。</li><li>Shephard's Lemma（成本函數對要素價格微分＝要素需求）與 Hotelling Lemma（利潤函數對要素價格微分＝負要素需求；對產品價格微分＝供給量）為考熱點。</li></ul>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 10.38</strong>： (p.337)：完全競爭業 50 家，每廠 <span class=\"fx\">q=\\ln L</span>，<span class=\"fx\">w=3</span>、<span class=\"fx\">p=12</span>，求產業雇用總人數。解法要點：廠商 <span class=\"fx\">p· MP<sub>L</sub>=w⇒ 12×(1/L)=3⇒ L=4</span> 人/廠，共 <span class=\"fx\">50×4=200</span> 人。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>拉氏條件 <span class=\"fx\">λ<sup>*</sup>=MC</span>；Shephard's Lemma 與 Hotelling Lemma 的形式；完全競爭廠商要素僱用條件 <span class=\"fx\">P· MP=w</span>。</li></ul>\n<p>> 覆範圍說明：Ch9 實際正文 p.259–271(p.272–274 為空白 Note 頁)；Ch10 實際正文 p.275–337(p.338–340 為空白 Note 頁)。所有詳解於書末 QR 補充，本筆記僅摘題目與書中解法要點。</p>\n</div>\n</div>"}], "11": [{"id": "11.1", "title": "市場分類（印刷頁 341）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc29\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">市場結構（Market structure）</div><div class=\"mc-body\"><div class=\"mc-formula\">依廠商家數（n）與商品性質，可區分為四種市場型態。</div><div class=\"mc-detail\">依廠商家數（n）與商品性質，可區分為四種市場型態。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc30\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">同質商品（Homogeneous products）</div><div class=\"mc-body\"><div class=\"mc-formula\">商品的品質或帶給消費者的主觀感受無法分辨些微差異，代表商品之價格、形狀、大小等帶給消費者感受相同；此時 <span class=\"fx\">MRS<sub>XY</sub>=1</span>。</div><div class=\"mc-detail\">商品的品質或帶給消費者的主觀感受無法分辨些微差異，代表商品之價格、形狀、大小等帶給消費者感受相同；此時 <span class=\"fx\">MRS<sub>XY</sub>=1</span>。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc31\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">異質商品（Differentiated products）</div><div class=\"mc-body\"><div class=\"mc-formula\">消費者可分辨商品品質差異，進而改變對這些商品的偏好，商品帶給消費者的感受不同。</div><div class=\"mc-detail\">消費者可分辨商品品質差異，進而改變對這些商品的偏好，商品帶給消費者的感受不同。</div></div></div>\n<h4 class=\"sub3\">四種市場結構比較表</h4>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"></colgroup><thead><tr><th>市場特徵</th><th>完全競爭</th><th>獨占</th><th>寡占</th><th>獨占性競爭</th></tr></thead><tbody><tr><td>消費者人數</td><td>多</td><td>多</td><td>多</td><td>多</td></tr><tr><td>供給者人數</td><td>多</td><td>一位</td><td>少數</td><td>多</td></tr><tr><td>商品性質</td><td>同質</td><td>異質</td><td>同質或異質</td><td>異質</td></tr><tr><td>資訊情況</td><td>完全</td><td>不完全</td><td>不完全</td><td>不完全</td></tr><tr><td>買賣方對價格之影響</td><td>雙方皆無</td><td>供給者可決定市場價格</td><td>具有相互影響</td><td>賣方對價格具有些微影響力</td></tr><tr><td>例子</td><td>考生市場</td><td>菸酒專賣局</td><td>包裏業、運輸公司</td><td>雜貨店、小餐廳</td></tr></tbody></table></div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>完全競爭：同質、完全資訊、眾多廠商、雙方皆無議價力。</li><li>獨占：單一廠商、無近似替代品、存在進入障礙。</li></ul>\n</div>\n</div>"}, {"id": "11.2", "title": "完全競爭廠商的特色（印刷頁 342–343）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc28\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">完全競爭（Perfect competition）</div><div class=\"mc-body\"><div class=\"mc-formula\">市場商品為同質商品，且個別廠商數量太多，彼此之間基本上不意識到彼此之間的競爭；只要符合條件與要求，所有廠商皆可進入市場供給商品。</div><div class=\"mc-detail\">市場商品為同質商品，且個別廠商數量太多，彼此之間基本上不意識到彼此之間的競爭；只要符合條件與要求，所有廠商皆可進入市場供給商品。</div></div></div>\n<h4 class=\"sub3\">兩大特色</h4>\n<p><strong class=\"term\">（一）對於價格沒有任何影響力，為市場價格之接受者（Price taker）</strong></p>\n<p>個別廠商面對的需求線為水平線（完全彈性）。要成為價格接受者須具備以下條件：</p>\n<ol><li>市場訊息完全（Perfect information）：買賣雙方皆有完全訊息（Complete information）。</li><li>商品帶給消費者的主觀感受相同，亦即同質商品。</li><li>商品與要素在市場中可以自由移動（free mobility）。</li><li>交易雙方不會有差別待遇（no discrimination）之行為。</li><li>每個廠商的規模相對於整體產業很小。</li></ol>\n<p><strong class=\"term\">（二）不存在進入障礙（Entry barrier）：長期可自由進出（Free entry and exit）</strong></p>\n<ul><li>有利可圖時新廠商自由加入；虧損時舊廠商無牽掛地退出。</li><li>「自由進出」是<strong>長期</strong>特色；短期由於設備廠房無法調整，外在廠商無法順利加入。</li></ul>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li><strong class=\"term\">總收益（Total revenue）</strong>：<span class=\"fx\">TR(q)=P× q</span>，因 P 為常數，TR 圖形為原點出發之射線，斜率為 <span class=\"fx\">P</span>(p.343)。</li><li><strong class=\"term\">平均收益（Average revenue）</strong>：<span class=\"fx\">AR=\\dfracTRq=\\dfracP× qq=P</span>(p.343)。</li><li><strong class=\"term\">邊際收益（Marginal revenue）</strong>：<span class=\"fx\">MR(q)=\\dfrac∂ TR∂ q=\\dfrac∂(P× q)∂ q=P×\\dfrac∂ q∂ q=P</span>(p.343)。</li><li><strong>完全競爭廠商核心等式</strong>：<span class=\"fx\">P=AR=MR</span>(p.343)。</li></ul>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><text x=\"110\" y=\"18\" text-anchor=\"middle\" font-size=\"10\" fill=\"#6c7684\">市場</text><line x1=\"60\" y1=\"230\" x2=\"200\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.3\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"40\" stroke=\"#2b251d\" stroke-width=\"1.3\"></line><line x1=\"70\" y1=\"60\" x2=\"190\" y2=\"210\" stroke=\"#1e7d32\" stroke-width=\"1.8\"></line><line x1=\"70\" y1=\"210\" x2=\"190\" y2=\"60\" stroke=\"#b5542e\" stroke-width=\"1.8\"></line><text x=\"310\" y=\"18\" text-anchor=\"middle\" font-size=\"10\" fill=\"#6c7684\">個別廠商</text><line x1=\"240\" y1=\"230\" x2=\"380\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.3\"></line><line x1=\"240\" y1=\"230\" x2=\"240\" y2=\"40\" stroke=\"#2b251d\" stroke-width=\"1.3\"></line><line x1=\"245\" y1=\"120\" x2=\"375\" y2=\"120\" stroke=\"#1e7d32\" stroke-width=\"1.8\"></line><text x=\"290\" y=\"112\" font-size=\"9\" fill=\"#1e7d32\">P*=AR=MR</text><text x=\"395\" y=\"18\" text-anchor=\"middle\" font-size=\"10\" fill=\"#6c7684\">TR</text><line x1=\"400\" y1=\"230\" x2=\"430\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.3\"></line><line x1=\"400\" y1=\"230\" x2=\"400\" y2=\"40\" stroke=\"#2b251d\" stroke-width=\"1.3\"></line><line x1=\"405\" y1=\"225\" x2=\"430\" y2=\"60\" stroke=\"#b5542e\" stroke-width=\"1.8\"></line></svg><p class=\"figcap\">完全競爭：市場決定 P*，個別廠商為 P=AR=MR 水平線，TR 為過原點射線。(p.340)</p>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>完全競爭廠商是價格接受者，<span class=\"fx\">P=AR=MR</span>，個別廠商需求線為水平線。</li><li>廠商家數越多，個別廠商面對的需求彈性越大，需求線越平。</li></ul>\n</div>\n</div>"}, {"id": "11.3", "title": "完全競爭廠商的短期均衡（印刷頁 344–351）", "body": "\n<p class=\"def-note\">短期：資本等固定生產要素數量固定，廠商只能調整變動生產要素來調整產量；廠商家數 <span class=\"fx\">n</span> 為外生給定。</p>\n<p class=\"def-note\">廠商目標：追求利潤 <span class=\"fx\">π(q)=TR(q)-TC(q)</span> 極大化。</p>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<p><strong>（一）利潤極大化之一階條件（F.O.C）</strong></p>\n<p><span class=\"fx\">\\Max_\\q\\π(q)=TR(q)-TC(q)</span></p>\n<p><span class=\"fx\">\\dfrac∂π∂ q=\\dfrac∂ TR(q)∂ q-\\dfrac∂ TC(q)∂ q=0</span></p>\n<p><span class=\"fx\">\\therefore P=AR=MR=MC</span>，解 <span class=\"fx\">q<sup>*</sup><sub>SR</sub></span>(p.344)</p>\n<p><strong>（二）二階條件（S.O.C）</strong></p>\n<p><span class=\"fx\">\\dfrac∂<sup>2</sup>π∂ q<sup>2</sup>=\\dfrac∂<sup>2</sup> TR∂ q<sup>2</sup>-\\dfrac∂<sup>2</sup> TC∂ q<sup>2</sup><0</span></p>\n<p><span class=\"fx\">\\dfrac∂ MR(q)∂ q-\\dfrac∂ MC(q)∂ q=0-\\dfrac∂ MC(q)∂ q<0</span></p>\n<p><span class=\"fx\">\\therefore MC'(q)>0</span>(p.345)</p>\n<ul><li>意涵：MR 斜率小於 MC 斜率才為利潤極大；利潤極大時 MC 線為正斜率。若 MR 斜率大於 MC 斜率，則為利潤極小。</li></ul>\n</div>\n<h4 class=\"sub3\">五個價格水準的生產決策(p.347–349)</h4>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"></colgroup><thead><tr><th>價格</th><th>生產點 <span class=\"fx\">P=SMC</span></th><th>利潤 <span class=\"fx\">π=TR-TVC-TFC</span></th><th>停產利潤</th><th>決策</th></tr></thead><tbody><tr><td><span class=\"fx\">P<sub>0</sub></span></td><td><span class=\"fx\">q<sub>0</sub></span></td><td><span class=\"fx\">π<sub>0</sub>=P<sub>0</sub> q<sub>0</sub>-TVC(q<sub>0</sub>)-TFC>0</span></td><td><span class=\"fx\">-TFC</span></td><td>生產 <span class=\"fx\">q<sub>0</sub></span>，超額利潤</td></tr><tr><td><span class=\"fx\">P<sub>1</sub></span></td><td><span class=\"fx\">q<sub>1</sub></span></td><td><span class=\"fx\">π<sub>1</sub>=P<sub>1</sub> q<sub>1</sub>-TVC(q<sub>1</sub>)-TFC=0</span></td><td><span class=\"fx\">-TFC</span></td><td>生產 <span class=\"fx\">q<sub>1</sub></span>，損益兩平點（Break-even point）</td></tr><tr><td><span class=\"fx\">P<sub>2</sub></span></td><td><span class=\"fx\">q<sub>2</sub></span></td><td><span class=\"fx\">AVC(q<sub>2</sub>)\\lt P<sub>2</sub>\\lt SAC(q<sub>2</sub>)</span>，正額<span class=\"fx\">-TFC\\gt -TFC</span></td><td><span class=\"fx\">-TFC</span></td><td>生產 <span class=\"fx\">q<sub>2</sub></span>，雖虧損但繼續經營</td></tr><tr><td><span class=\"fx\">P<sub>3</sub></span></td><td><span class=\"fx\">q<sub>3</sub></span></td><td><span class=\"fx\">P<sub>3</sub>=AVC(q<sub>3</sub>)</span>，<span class=\"fx\">0-TFC=-TFC</span></td><td><span class=\"fx\">-TFC</span></td><td>可生產也可不生產（<strong>歇業點/停止營業點</strong>，Shut-down point）</td></tr><tr><td><span class=\"fx\">P<sub>4</sub></span></td><td><span class=\"fx\">q<sub>4</sub></span></td><td><span class=\"fx\">P<sub>4</sub>\\lt AVC(q<sub>4</sub>)</span>，負額<span class=\"fx\">-TFC\\lt -TFC</span></td><td><span class=\"fx\">-TFC</span></td><td>不生產</td></tr></tbody></table></div>\n<h4 class=\"sub3\">短期供給曲線</h4>\n<ul><li><strong>完全競爭廠商的短期供給線 = AVC 曲線最低點以上的 SMC 曲線</strong>(p.347, 349)。</li><li>市場短期供給線：在要素價格不變下，將個別廠商供給線水平加總：<span class=\"fx\">Q<sup>s</sup>=∑<sub>n</sub> q<sup>s</sup>(P)=∑<sub>n</sub> SMC<sup>-1</sup>(P)</span>(p.350)。</li><li>在 <span class=\"fx\">P<sub>AVC\\min</sub></span> 處，個別廠商供給線可包含 <span class=\"fx\">0∼ nq<sub>AVC\\min</sub></span> 的淡色水平段（廠商可選擇歇業或生產 <span class=\"fx\">q<sub>AVC\\min</sub></span>）。</li></ul>\n<h4 class=\"sub3\">利潤與生產者剩餘</h4>\n<ul><li>存在固定成本時：<span class=\"fx\">π=TR-TVC-TFC</span>(p.350)。</li><li>存在固定成本之生產者剩餘：<span class=\"fx\">PS=TR-∫<sub>0</sub><sup>q</sup> MC(t)dt=TR-TVC(q)=π+TFC</span>(p.350)。</li><li>不存在固定成本時：<span class=\"fx\">PS=TR-TC(q)=π</span>(p.350)。</li></ul>\n<h4 class=\"sub3\">小結（短期存在固定成本時，保證廠商繼續生產的條件）</h4>\n<ol><li><span class=\"fx\">TR≥ TVC</span>；即 <span class=\"fx\">P≥ AVC</span>(p.351)。</li><li><span class=\"fx\">π>-TFC⇒π+TFC=PS>0</span>(p.351)。</li></ol>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">q</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"60\" y1=\"90\" x2=\"410\" y2=\"90\" stroke=\"#1e7d32\" stroke-width=\"2\"></line><text x=\"330\" y=\"84\" font-size=\"11\" fill=\"#1e7d32\">P*=AR=MR</text><path d=\"M120 180 Q200 150 240 90 Q300 40 360 60\" fill=\"none\" stroke=\"#b5542e\" stroke-width=\"2.2\"></path><text x=\"366\" y=\"62\" font-size=\"12\" fill=\"#b5542e\">SMC</text><path d=\"M130 140 Q220 120 300 160\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"1.8\"></path><text x=\"306\" y=\"158\" font-size=\"11\" fill=\"#1f3a5f\">AVC</text><circle cx=\"240\" cy=\"90\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"248\" y=\"86\" font-size=\"10\" fill=\"#6b4e8e\">P=MC 決定q*</text></svg><p class=\"figcap\">短期：P=AR=MR，依 P=SMC 決定 q*；D 點=AVC 最低停止營業點。(p.340)</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.1</strong>： (p.346)：競爭廠商成本函數 <span class=\"fx\">C=50+5q+q<sup>2</sup></span>，市價 $35。求利潤極大產量、總收益、利潤。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：令 $P=MC$ 解 <span class=\"fx\">q</span>，再算 TR=Pq 與 π=TR−TC。（詳解見書末 QR）</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.2</strong>： (p.346)：化學公司 <span class=\"fx\">TC=1/3q<sup>3</sup>+5q<sup>2</sup>+10q+10</span>，價格 49 時應生產多少？解法要點：<span class=\"fx\">MC=q<sup>2</sup>+10q+10</span>，令 <span class=\"fx\">P=MC</span> 解二次式。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.3</strong>： (p.351)：100 家網紅，<span class=\"fx\">TC=32.4+5q+0.1q<sup>2</sup></span>，總需求 Q=7500−500P。求市場價格及各網紅產量。解法要點：個別供給 P=MC=5+0.2q，水平加總 <span class=\"fx\">Q<sup>s</sup>=100q</span>，令 <span class=\"fx\">Q<sup>d</sup>=Q<sup>s</sup></span>。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.4</strong>： (p.351)：完全競爭廠商短期供給曲線為何？（A) AC 曲線高於停業點以上 (B) MC 曲線高於停業點以上 (C) AC 曲線高於水平軸 (D) MC 曲線高於水平軸。<strong>答案 (B)</strong>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.5</strong>： (p.351)：廠商決定停業最可能因為：<div class=\"opts\"><div>(A) MC>AVC</div><div>(B) 價格低於 AVC 最低點</div><div>(C) 固定成本大於變動成本</div><div>(D) AFC 上升。<strong>答案</div><div>(B) </strong></div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 11.6</strong>： (p.351)：(1) 虧損是否一定要關門？<br>(2) 跳樓大拍賣底點為何？解法要點：(1) 只要 <span class=\"fx\">P≥ AVC</span> 即使虧損仍繼續生產（可分攤固定成本）<br>(2) 底點為 <span class=\"fx\">P=\\min AVC</span>，低於此點不如關門。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>短期均衡條件：P=AR=MR=SMC 且 <span class=\"fx\">SMC'\\gt 0</span>。</li><li>停止營業點：<span class=\"fx\">P=\\min AVC</span>；損益兩平點：<span class=\"fx\">P=\\min SAC</span>。</li><li>短期供給線 = SMC 高於 min AVC 之部分。</li><li>虧損仍生產的條件：<span class=\"fx\">P≥ AVC</span>（此時雖虧損但可減少固定成本損失）。</li></ul>\n</div>\n</div>"}, {"id": "11.4", "title": "完全競爭廠商的長期均衡（印刷頁 352–356）", "body": "\n<p class=\"def-note\">長期無進入障礙：有利可圖吸引新廠商進入，出現虧損時舊廠商退出。</p>\n<p class=\"def-note\">長期均衡時經濟利潤為零（只剩正常利潤），無進出誘因。</p>\n<div class=\"callout fo
