00\" stroke=\"#1f3a5f\" stroke-width=\"1.6\"></line><line x1=\"150\" y1=\"60\" x2=\"360\" y2=\"200\" stroke=\"#b5542e\" stroke-width=\"1.6\"></line><line x1=\"130\" y1=\"60\" x2=\"350\" y2=\"200\" stroke=\"#1e7d32\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"></line><circle cx=\"180\" cy=\"115\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"150\" y=\"108\" font-size=\"10\" fill=\"#6b4e8e\">A</text><circle cx=\"220\" cy=\"130\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"226\" y=\"126\" font-size=\"10\" fill=\"#1e7d32\">BH</text><circle cx=\"250\" cy=\"140\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"256\" y=\"138\" font-size=\"10\" fill=\"#b5542e\">BS</text></svg><p class=\"figcap\">P_X↑：Hicks 補償至 BH、Slutsky 通過 A 至 BS；正常財 BS>BH，總效果=替代+所得。(p.183)</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.1（台大財金，p.174）</strong>： <span class=\"fx\">U(X,Y)=XY<sup>2</sup></span>，<span class=\"fx\">I=100</span>，<span class=\"fx\">P<sub>X</sub>=P<sub>Y</sub>=10</span>，<span class=\"fx\">P<sub>X</sub></span> 降為 5，求 Hicks 替代效果與 <span class=\"fx\">CV</span>。解法要點：先求舊均衡 <span class=\"fx\">X<sub>A</sub></span>，再以支出函數/補償預算線求維持 <span class=\"fx\">U<sup>*</sup></span> 下新均衡 <span class=\"fx\">X<sub>BH</sub></span>，兩者之差為 SE，所得差為 CV。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.2</strong>： <span class=\"fx\">U(X,Y)=2√(X)+Y</span>，所得 10，<span class=\"fx\">P<sub>X</sub>=P<sub>Y</sub>=2</span>，<span class=\"fx\">X</span> 降價為 1，求 X 的替代與所得效果。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.175)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.3</strong>： <span class=\"fx\">U(x,y)=\\min\\x,y\\</span>，所得 600，<span class=\"fx\">P<sub>Y</sub>=1</span>、<span class=\"fx\">P<sub>X</sub>=1/2</span>，X 每單位漲 2 元，求 SE 與 IE。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.175)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.4</strong>： 咖啡與巧克力皆正常財，咖啡價格上升，純所得效果使消費？（D：less coffee and more chocolate）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.175)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.5</strong>： 替代效果定義——相對價格改變、維持效用水準不變。（B）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.175)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.6</strong>： 咖啡與奶精固定比例（完全互補），咖啡漲價——只有所得效果、沒有替代效果。（B）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.175)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.7</strong>： 游泳池需求 <span class=\"fx\">Q=0.1y(P)<sup>-1</sup></span>，<span class=\"fx\">y=1000</span>，價格 40 降至 20，求 SE 與 IE。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.176)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.8（台大財金、交大财金，p.176）</strong>： <span class=\"fx\">U=XY<sup>2</sup></span>，<span class=\"fx\">I=100</span>，<span class=\"fx\">P<sub>X</sub>=P<sub>Y</sub>=10</span>，<span class=\"fx\">P<sub>X</sub></span> 降為 5，求 Slutsky 替代效果與成本差額 <span class=\"fx\">CD</span>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.9</strong>： 價格上升時所得效果的表現——在新相對價格下減少所得以由舊無異曲線移至新無異曲線。（C）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.176)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.10（政大商院，p.176）</strong>： 拉麵為劣等財、教科書為正常財，拉麵降價的替代效果本身——替代效果恆使拉麵增加、教科書減少。（B）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.11（政大商院，p.180）</strong>： 某財貨漲價時 SE 恆為負、IE 可正可負；故「後者（SE）恆非正，前者（IE）可正可負」。（C）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.12</strong>： 見上公式，<span class=\"fx\">EV=29.29</span>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.181)</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>比較 <strong>Hicks（維持原效用 <span class=\"fx\">U<sup>*</sup></span>）vs Slutsky（維持原購買組合 <span class=\"fx\">A</span>）</strong> 兩種替代效果的操作差異；價格下降時 Slutsky 預算線比 Hicks 預算線更往外，故 <span class=\"fx\">X<sub>BS</sub>>X<sub>BH</sub></span>。</li><li><span class=\"fx\">CV</span>（補償變量，對應舊效用 <span class=\"fx\">U<sup>*</sup></span>）與 <span class=\"fx\">EV</span>（相等變量，對應新效用 U<span class=\"fx\">′</span>）的定義口徑不可混淆；本書價格上升時 <span class=\"fx\">CV>EV</span>（圖 p.177 縱軸標註）。</li><li>完全互補偏好（Leontief）下替代效果為 0；完全替代偏好下所得效果為 0（由例題 7.3、7.6 可延伸）。</li></ul>\n</div>\n</div>"}, {"id": "7.2", "title": "普通與受補償需求曲線（印刷頁 182–195）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc108\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">普通需求線（Ordinary demand curve / 馬歇爾 Marshallian 需求線）</div><div class=\"mc-body\"><div class=\"mc-formula\">其他財貨價格與所得固定下所導出；具有價格效果，包含替代與所得效果，故又稱<strong>未受補償的需求曲線</strong>。</div><div class=\"mc-detail\">其他財貨價格與所得固定下所導出；具有價格效果，包含替代與所得效果，故又稱<strong>未受補償的需求曲線</strong>(p.182)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc109\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">受補償需求線（Compensated demand curve / 希克斯 Hicksian 需求線）</div><div class=\"mc-body\"><div class=\"mc-formula\">在其他財貨價格不變及<strong class=\"term\">實質所得不變（即希克斯實質所得不變＝維持原效用）</strong>下所導出；只含替代效果，又稱<strong>補受補償的需求曲線</strong>。</div><div class=\"mc-detail\">在其他財貨價格不變及<strong class=\"term\">實質所得不變（即希克斯實質所得不變＝維持原效用）</strong>下所導出；只含替代效果，又稱<strong>補受補償的需求曲線</strong>(p.182)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>普通需求（效用極大）：<span class=\"fx\">\\max<sub>X,Y</sub> U=U(X,Y) s.t. M=P<sub>X</sub> X+P<sub>Y</sub> Y</span>；<span class=\"fx\">X<sub>M</sub><sup>d</sup>=X(P<sub>X</sub>;P<sub>Y</sub>,M)</span>、<span class=\"fx\">Y<sub>M</sub><sup>d</sup>=Y(P<sub>X</sub>;P<sub>Y</sub>,M)</span>(p.182)</li><li>受補償需求（支出極小）：<span class=\"fx\">\\min<sub>X,Y</sub> E=P<sub>X</sub> X+P<sub>Y</sub> Y s.t. U=U(X,Y)</span>；<span class=\"fx\">X<sub>H</sub><sup>d</sup>=X(P<sub>X</sub>;P<sub>Y</sub>,U)</span>、<span class=\"fx\">Y<sub>H</sub><sup>d</sup>=Y(P<sub>X</sub>;P<sub>Y</sub>,U)</span>(p.182)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>正常財價格下降：馬歇爾需求量增加最多；Hicks 受補償需求只含 SE；Slutsky 需求介於兩者之間(p.184)。</li><li><strong>劣等財（inferior goods）</strong>：SE 與 IE 反向，且 <strong>SE 幅度大於 IE 幅度</strong>——馬歇爾需求線仍滿足需求法則（負斜率）(p.187–188)。</li><li><strong>季芬財（Giffen goods）</strong>：SE 與 IE 反向，且 <strong>SE 幅度小於 IE 幅度</strong>——馬歇爾需求線正斜率、違反需求法則；季芬矛盾定義：「當某財貨價格改變後，其所得效果的力道大到足以使得最後的總需求量與價格呈現同向變化的現象」(p.189–190)。</li><li><strong>需求曲線垂直</strong>：SE 與 IE 反向且絕對值相等，代表該財為劣等財；<span class=\"fx\">X<sub>C</sub>=X<sub>A</sub></span>，馬歇爾需求線垂直、價格彈性為 0(p.191–192)。</li><li><strong>所得中性財</strong>：價格變動時只有 SE 無 IE；馬歇爾需求線負斜率，且未受補償與受補償需求線重合（<span class=\"fx\">B<sub>H</sub>=B<sub>S</sub>=C</span>、<span class=\"fx\">X<sub>H</sub>=X<sub>S</sub>=X<sub>M</sub></span>）(p.193–194)。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div><svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">X</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Y</text><line x1=\"110\" y1=\"60\" x2=\"330\" y2=\"200\" stroke=\"#1f3a5f\" stroke-width=\"1.6\"></line><line x1=\"150\" y1=\"60\" x2=\"360\" y2=\"200\" stroke=\"#b5542e\" stroke-width=\"1.6\"></line><line x1=\"130\" y1=\"60\" x2=\"350\" y2=\"200\" stroke=\"#1e7d32\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"></line><circle cx=\"180\" cy=\"115\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"150\" y=\"108\" font-size=\"10\" fill=\"#6b4e8e\">A</text><circle cx=\"220\" cy=\"130\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"226\" y=\"126\" font-size=\"10\" fill=\"#1e7d32\">BH</text><circle cx=\"250\" cy=\"140\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"256\" y=\"138\" font-size=\"10\" fill=\"#b5542e\">BS</text></svg><p class=\"figcap\">P_X↓：Hicks 補償至 BH、Slutsky 通過 A 至 BS；正常財 BS>BH。(p.183)</p></div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.13（政大商學院，p.184）</strong>： 正常財價格下跌，普通 vs 受補償需求線何者反應量大？——普通（馬歇爾）需求線因多了同向所得效果，需求量增加較大。（A）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.14（中正財金，p.194）</strong>： <span class=\"fx\">x</span> 正常、<span class=\"fx\">y</span> 劣等，<span class=\"fx\">x</span> 跌價後新均衡——<span class=\"fx\">x</span> 必增加（替代＋所得皆使 x 增）。（C）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.15（108 清大科管，p.194）</strong>： 季芬財漲價時何者為誤？——「替代效果凌駕所得效果」為誤（應為所得效果凌駕替代效果）。（C）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.16</strong>： 季芬財描述——所得效果大於替代效果。（C）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.194)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.17（是非題，p.195）</strong>： (1) SE 與 IE 反方向才會正斜率需求線（須 IE 大於 SE）<br>(2) 價格消費線垂直代表 X 為劣等財。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.18（中山企管，p.195）</strong>： 解釋替代與所得效果，並據以說明需求法則。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.19（中山企管，p.195）</strong>： 何謂劣等財？何謂季芬財？「季芬一定劣等，劣等不一定季芬」。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>三條需求線相對位置：<strong>馬歇爾（含 IE）最平、Slutsky 次之、Hicks 最陡</strong>（正常財下需求量反應 <span class=\"fx\">X<sub>M</sub>>X<sub>S</sub>>X<sub>H</sub></span>）。</li><li>季芬財必為劣等財，但劣等財不一定為季芬財；季芬財需求線為正斜率。</li><li>完全替代（L 型無異曲線相反）下 SE 極大；完全互補下 SE 為 0。</li></ul>\n</div>\n</div>"}, {"id": "7.3", "title": "所得與價格消費曲線（印刷頁 196–203）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc105\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">所得消費曲線（Income consumption curve, ICC）</div><div class=\"mc-body\"><div class=\"mc-formula\">其他情況不變，對於特定商品在各種不同所得水準下，消費者均衡點移動的組合軌跡；又稱<strong class=\"term\">所得擴張線（Income expansion path）</strong>。</div><div class=\"mc-detail\">其他情況不變，對於特定商品在各種不同所得水準下，消費者均衡點移動的組合軌跡；又稱<strong class=\"term\">所得擴張線（Income expansion path）</strong>。ICC 上僅反應所得效果（相對價格不變，預算線平行外移）；通常由原點出發（至於是否為射線則不一定）(p.196)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc106\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">價格消費曲線（Price consumption curve, PCC）</div><div class=\"mc-body\"><div class=\"mc-formula\">其他情況不變，財貨相對價格改變時，使消費者均衡移動的軌跡；PCC 上反應替代與所得效果。</div><div class=\"mc-detail\">其他情況不變，財貨相對價格改變時，使消費者均衡移動的軌跡；PCC 上反應替代與所得效果(p.200)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc107\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">恩格爾曲線（Engel Curve, EC）</div><div class=\"mc-body\"><div class=\"mc-formula\">反映所得 <span class=\"fx\">M</span> 與某財貨 <span class=\"fx\">X</span> 消費量之關係，即將 <span class=\"fx\">X</span> 的馬歇爾需求函數整理成 <span class=\"fx\">M=f(X;P<sub>X</sub>,\\dots)</span> 之函數。</div><div class=\"mc-detail\">反映所得 <span class=\"fx\">M</span> 與某財貨 <span class=\"fx\">X</span> 消費量之關係，即將 <span class=\"fx\">X</span> 的馬歇爾需求函數整理成 <span class=\"fx\">M=f(X;P<sub>X</sub>,\\dots)</span> 之函數(p.199)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>ICC 方程式（由消費者均衡 <span class=\"fx\">MRS(Y/X)=P<sub>X</sub>/P<sub>Y</sub></span>）：<span class=\"fx\">Y = MRS<sup>-1</sup>(\\dfracP<sub>X</sub>P<sub>Y</sub>)× X</span>(p.198)</li><li>Cobb-Douglas 效用 <span class=\"fx\">U=X^α Y^β</span>：<span class=\"fx\">MRS=\\dfracα Yβ X=\\dfracP<sub>X</sub>P<sub>Y</sub></span> ⇒ ICC：<span class=\"fx\">Y=\\dfracβ P<sub>X</sub>α P<sub>Y</sub>X</span>（為原點發射之射線）(p.198)</li><li>恩格爾曲線（Cobb-Douglas，<span class=\"fx\">X<sub>M</sub><sup>d</sup>=\\dfracαα+β\\dfracMP<sub>X</sub></span>）：<span class=\"fx\">M = P<sub>X</sub>\\dfracα+βαX</span>（記為 <span class=\"fx\">EC<sub>X</sub></span>）(p.199)</li><li>準線型效用 <span class=\"fx\">U=α\\ln X+β Y</span>：<span class=\"fx\">MRS=\\dfracαβ X=\\dfracP<sub>X</sub>P<sub>Y</sub></span> ⇒ <span class=\"fx\">P<sub>X</sub>=\\dfracα P<sub>Y</sub>β X</span>；代入預算線 <span class=\"fx\">M=\\dfracα P<sub>Y</sub>β+ P<sub>Y</sub> Y</span> ⇒ PCC：<span class=\"fx\">Y=\\dfracMP<sub>Y</sub>-\\dfracαβ</span>（為水平線）(p.202)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong>ICC 形狀判讀</strong>：</li></ul>\n<ol><li>正斜率：兩軸財貨皆正常財(p.197)。</li><li>負斜率：兩財貨間有一個為劣等財；依恩格爾加總定理，另一必為奢侈品(p.197)。</li><li>垂直或水平：兩財貨間必有一財為中性財(p.197)。</li><li>正斜率且為原點發出之射線：<span class=\"fx\">X</span> 與 <span class=\"fx\">Y</span> 皆正常財，且所得彈性等於 1（Cobb-Douglas 屬之）(p.198–199)。</li></ol>\n<ul><li><strong>PCC 形狀判讀</strong>（X 價格下降時）：</li></ul>\n<ol><li>正斜率：橫軸 X 與縱軸 Y 為<strong>互補品</strong>，且 X 需求彈性 <strong><1</strong>（缺乏彈性）(p.200–201)。</li><li>水平線：X 與 Y 為<strong>無關品</strong>，X 需求彈性 <strong>=1</strong>（單一彈性）(p.201)。</li><li>負斜率：X 與 Y 為<strong>替代品</strong>，X 需求彈性 <strong>>1</strong>（富於彈性）(p.201)。</li><li>特例——PCC 垂直線：代表 X 必為<strong>劣等財</strong>（IE 反向且幅度＝SE），此時需求曲線垂直(p.203)。</li></ol>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><defs><marker id=\"ar\" markerwidth=\"8\" markerheight=\"8\" refx=\"6\" refy=\"3\" orient=\"auto\"><path d=\"M0 0L6 3L0 6z\" fill=\"#b5542e\"></path></marker></defs><line x1=\"80\" y1=\"220\" x2=\"360\" y2=\"80\" stroke=\"#1f3a5f\" stroke-width=\"1.4\"></line><line x1=\"80\" y1=\"200\" x2=\"390\" y2=\"120\" stroke=\"#1f3a5f\" stroke-width=\"1.4\"></line><line x1=\"80\" y1=\"180\" x2=\"410\" y2=\"160\" stroke=\"#1f3a5f\" stroke-width=\"1.4\"></line><circle cx=\"200\" cy=\"150\" r=\"3.5\" fill=\"#b5542e\"></circle><circle cx=\"250\" cy=\"160\" r=\"3.5\" fill=\"#b5542e\"></circle><circle cx=\"310\" cy=\"175\" r=\"3.5\" fill=\"#b5542e\"></circle><path d=\"M200 150 Q250 160 310 175\" fill=\"none\" stroke=\"#1e7d32\" stroke-width=\"2.2\"></path><text x=\"316\" y=\"178\" font-size=\"11\" fill=\"#1e7d32\">PCC</text></svg><p class=\"figcap\">P_X 下降使預算線更平，切點連線即價格消費曲線 PCC；投影至 P_X-X 圖得馬歇爾需求線。所得增加平行外移切點連線為 ICC。</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.20</strong>： <span class=\"fx\">MRS<sub>C</sub>=\\dfracyx</span>，<span class=\"fx\">P<sub>x</sub>=5</span>、<span class=\"fx\">P<sub>y</sub>=1</span>，求所得擴張線與 <span class=\"fx\">x</span> 的恩格爾曲線。解法要點：均衡 <span class=\"fx\">MRS=y/x=P<sub>x</sub>/P<sub>y</sub>=5</span> ⇒ <span class=\"fx\">y=5x</span> 為 IEP；再由預算線 <span class=\"fx\">M=5x+y</span> 代入得 EC。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.200)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 7.21</strong>： ICC 圖先正斜率上升、到 <span class=\"fx\">X<sup>*</sup></span> 後轉彎負斜率，請說明 X 與 Y 的財貨性質隨所得上升如何改變。解法要點：所得低時兩者皆正常；超過 <span class=\"fx\">X<sup>*</sup></span> 後其中一財轉劣等。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.200)</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><strong>ICC 斜率 ↔ 正常/劣等/中性財；PCC 斜率 ↔ 互補/無關/替代 × 需求彈性大小</strong>，此對應關係幾乎年年考。</li><li>PCC 垂直 ⇔ X 劣等財（IE＝SE 反向）；PCC 水平 ⇔ X 為單一彈性、與 Y 獨立。</li></ul>\n</div>\n</div>"}, {"id": "7.4", "title": "史勒斯基方程式（Slutsky equation）（印刷頁 204–207）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc103\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">毛（總）效果（Gross effect）</div><div class=\"mc-body\"><div class=\"mc-formula\">包含替代效果與所得效果，為普通（馬歇爾）需求線斜率 <span class=\"fx\">∂ X/∂ P<sub>X</sub></span>。</div><div class=\"mc-detail\">包含替代效果與所得效果，為普通（馬歇爾）需求線斜率 <span class=\"fx\">∂ X/∂ P<sub>X</sub></span>(p.204)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc104\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">淨效果（Net effect）</div><div class=\"mc-body\"><div class=\"mc-formula\">只有替代效果，為受補償（Hicks）需求線斜率 <span class=\"fx\">∂ X/∂ P<sub>X</sub>|<sub>\\bar U</sub></span>。</div><div class=\"mc-detail\">只有替代效果，為受補償（Hicks）需求線斜率 <span class=\"fx\">∂ X/∂ P<sub>X</sub>|<sub>\\bar U</sub></span>(p.205)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>由價格效果分解：<span class=\"fx\">\\dfrac∂ X∂ P<sub>X</sub>=\\left.\\dfrac∂ X∂ P<sub>X</sub>|<sub>\\bar U</sub>+[\\dfrac∂ X∂ P<sub>X</sub>]<sub>IE</sub></span>(p.204)</li><li>所得變動推導：消費者購買原數量 <span class=\"fx\">X<sub>0</sub></span> 因價格變動 <span class=\"fx\">dP<sub>X</sub></span> 而生的所得變動 <span class=\"fx\">dM=(-dP<sub>X</sub>)X ⇒ dP<sub>X</sub>=-\\dfracdMX</span>(p.204)</li><li><strong>史勒斯基方程式（Slutsky equation）</strong>：<span class=\"fx\">\\dfrac∂ X∂ P<sub>X</sub>=\\left.\\dfrac∂ X∂ P<sub>X</sub>|<sub>\\bar U</sub>+(-X\\dfrac∂ X∂ M)</span>(p.204)</li><li>另一財價格變化版：<span class=\"fx\">\\dfrac∂ X∂ P<sub>Y</sub>=\\left.\\dfrac∂ X∂ P<sub>Y</sub>|<sub>\\bar U</sub>-Y\\dfrac∂ X∂ M</span>(p.205)</li><li>對偶性證明：受限制效用極大＝支出極小，故 <span class=\"fx\">X<sup>M</sup>[P<sub>X</sub>,P<sub>Y</sub>,E(P<sub>X</sub>,P<sub>Y</sub>,\\bar U)]=X<sup>H</sup>(P<sub>X</sub>,P<sub>Y</sub>,\\bar U)</span>；對 <span class=\"fx\">P<sub>X</sub></span> 微分得 <span class=\"fx\">\\dfrac∂ X<sup>M</sup>∂ P<sub>X</sub>=\\dfrac∂ X<sup>H</sup>∂ P<sub>X</sub>-X<sup>M</sup>\\dfrac∂ X<sup>M</sup>∂ E</span>(p.205)</li><li><strong>彈性式</strong>：<span class=\"fx\">E<sub>X</sub><sup>d</sup>=ε<sub>X</sub><sup>d</sup>+α<sub>X</sub>η<sub>X</sub></span>；交叉式 <span class=\"fx\">E<sub>XY</sub><sup>d</sup>=ε<sub>XY</sub><sup>d</sup>+α<sub>Y</sub>η<sub>X</sub></span>（其中 <span class=\"fx\">ε<sup>d</sup></span> 為只有替代效果之淨效果彈性，<span class=\"fx\">α<sub>X</sub></span> 為 X 支出佔所得比例，<span class=\"fx\">η<sub>X</sub></span> 為 X 所得彈性）(p.206)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>受補償需求線斜率永遠為負；只要 X 不是劣等財，普通需求線必為負斜率；當 X 是劣等財且所得效果力道超過替代效果，普通需求線轉正斜率，隱含季芬財(p.204)。</li><li>季芬財理論上可能，但現實中難觀察：所得效果那一項前乘上 <span class=\"fx\">X</span>，須消費占所得比例極大的財才可能，而耐久財/房屋這類財通常又不是劣等財(p.204)。</li><li><strong>三財質判讀表</strong>（<span class=\"fx\">P<sub>X</sub></span> 下降時）(p.205)：</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"><col style=\"width:25.00%\"></colgroup><thead><tr><th>財質</th><th>總效果 PE</th><th>替代效果</th><th>所得效果</th></tr></thead><tbody><tr><td>正常財</td><td><span class=\"fx\">X\\uparrow</span>（與價格負向）</td><td><span class=\"fx\">X\\uparrow</span>（與價格負向）</td><td><span class=\"fx\">(M)/(P<sub>X</sub>)\\uparrow⇒ X\\uparrow</span>，所得效果為負</td></tr><tr><td>中性財</td><td><span class=\"fx\">X\\uparrow</span></td><td><span class=\"fx\">X\\uparrow</span></td><td><span class=\"fx\">(M)/(P<sub>X</sub>)\\uparrow⇒ \\bar X</span>，沒有所得效果</td></tr><tr><td>劣等財</td><td>視 <span class=\"fx\">\\lvert SE\\rvert</span> 與 <span class=\"fx\">\\lvert IE\\rvert</span> 力量而定</td><td><span class=\"fx\">X\\uparrow</span></td><td><span class=\"fx\">(M)/(P<sub>X</sub>)\\uparrow⇒ \\bar X\\downarrow</span>，所得效果為正</td></tr></tbody></table></div>\n<ul><li><strong>毛替代 vs 淨替代</strong>：毛替代指 <span class=\"fx\">∂ X/∂ P<sub>Y</sub>>0</span>（不等於反向的 <span class=\"fx\">Y</span> 對 <span class=\"fx\">X</span> 亦毛替代）；淨替代指 <span class=\"fx\">∂ X/∂ P<sub>Y</sub>|<sub>\\bar U</sub>>0</span>（對稱，<span class=\"fx\">Y</span> 對 <span class=\"fx\">X</span> 必亦淨替代）。毛互補、淨互補定義反向(p.206–207)。</li><li><strong>Hicks 第三法則（本書稱「定理」）</strong>：不可能所有財貨全為淨互補品，至少要有一組財貨為淨替代品。證明：一般需求函數 <span class=\"fx\">X<sub>1</sub>=f(P<sub>1</sub>,P<sub>2</sub>,P<sub>3</sub>,M)</span> 為零齊次，由尤拉定理 <span class=\"fx\">\\dfrac∂ X<sub>1</sub>∂ P<sub>1</sub>P<sub>1</sub>+\\dfrac∂ X<sub>1</sub>∂ P<sub>2</sub>P<sub>2</sub>+\\dfrac∂ X<sub>1</sub>∂ P<sub>3</sub>P<sub>3</sub>+\\dfrac∂ X<sub>1</sub>∂ MM=0</span>；代入 Slutsky 式整理後得 <span class=\"fx\">\\left.\\dfrac∂ X<sub>1</sub>∂ P<sub>1</sub>|<sub>\\bar U</sub>+\\left.\\dfrac∂ X<sub>1</sub>∂ P<sub>2</sub>|<sub>\\bar U</sub>+\\left.\\dfrac∂ X<sub>1</sub>∂ P<sub>3</sub>|<sub>\\bar U</sub>=0</span>；因自身淨替代項恆負，故至少一交叉淨替代項為正(p.207)。</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>記熟 Slutsky 方程式三個版本：水準式、彈性式 <span class=\"fx\">E<sub>X</sub><sup>d</sup>=ε<sub>X</sub><sup>d</sup>+α<sub>X</sub>η<sub>X</sub></span>、交叉式。</li><li>由彈性式可知：X 支出比例 <span class=\"fx\">α<sub>X</sub></span> 越大、財貨越奢侈，本身需求彈性越大(p.206)。</li><li>淨替代對稱、毛替代不對稱；Hicks 淨替代非零定理。</li></ul>\n</div>\n</div>"}], "8": [{"id": "8.1", "title": "補貼或課稅對消費者之影響（印刷頁 211–217）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc98\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">從量補貼</div><div class=\"mc-body\"><div class=\"mc-formula\">對每單位 <span class=\"fx\">X</span> 補貼 <span class=\"fx\">S</span> 元，消費者每單位實際支付 <span class=\"fx\">(P<sub>X</sub>-S)</span> 元。</div><div class=\"mc-detail\">對每單位 <span class=\"fx\">X</span> 補貼 <span class=\"fx\">S</span> 元，消費者每單位實際支付 <span class=\"fx\">(P<sub>X</sub>-S)</span> 元(p.211)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc99\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">從價補貼</div><div class=\"mc-body\"><div class=\"mc-formula\">對每單位 <span class=\"fx\">X</span> 補貼單位價格的 <span class=\"fx\">S</span> 比例，實際支付 <span class=\"fx\">(P<sub>X</sub>-SP<sub>X</sub>)</span> 元。</div><div class=\"mc-detail\">對每單位 <span class=\"fx\">X</span> 補貼單位價格的 <span class=\"fx\">S</span> 比例，實際支付 <span class=\"fx\">(P<sub>X</sub>-SP<sub>X</sub>)</span> 元(p.211)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc100\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">所得補貼</div><div class=\"mc-body\"><div class=\"mc-formula\">直接補貼消費者 <span class=\"fx\">\\bar M</span> 的金額消費。</div><div class=\"mc-detail\">直接補貼消費者 <span class=\"fx\">\\bar M</span> 的金額消費(p.211–212)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc101\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">數量補貼</div><div class=\"mc-body\"><div class=\"mc-formula\">政府直接補貼消費者 <span class=\"fx\">\\bar X</span> 數量的 <span class=\"fx\">X</span> 財貨。</div><div class=\"mc-detail\">政府直接補貼消費者 <span class=\"fx\">\\bar X</span> 數量的 <span class=\"fx\">X</span> 財貨(p.212)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc102\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">從量稅</div><div class=\"mc-body\"><div class=\"mc-formula\">每單位課 <span class=\"fx\">t</span> 元；<strong>從價稅</strong>：從價格課 <span class=\"fx\">tP<sub>X</sub></span>；<strong class=\"term\">所得稅（定額稅）</strong>：直接課 <span class=\"fx\">\\bar T</span>。</div><div class=\"mc-detail\">每單位課 <span class=\"fx\">t</span> 元；<strong>從價稅</strong>：從價格課 <span class=\"fx\">tP<sub>X</sub></span>；<strong class=\"term\">所得稅（定額稅）</strong>：直接課 <span class=\"fx\">\\bar T</span>。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>從量補貼預算線：<span class=\"fx\">M=(P<sub>X</sub>-S)X+P<sub>Y</sub> Y</span>(p.211)</li><li>從價補貼預算線：<span class=\"fx\">M=(1-S)P<sub>X</sub> X+P<sub>Y</sub> Y</span>(p.211)</li><li>所得補貼預算線：<span class=\"fx\">M+\\bar M=P<sub>X</sub> X+P<sub>Y</sub> Y</span>（平行外移）(p.212)</li><li>數量補貼（無法轉售）預算線：<span class=\"fx\">M=P<sub>X</sub>(X-\\bar X)+P<sub>Y</sub> Y</span> if <span class=\"fx\">Y≤\\dfracMP<sub>Y</sub></span>（前段水平線段）；若可轉售則同所得補貼平行外移為 <span class=\"fx\">M+P<sub>X</sub>\\bar X=P<sub>X</sub> X+P<sub>Y</sub> Y</span>(p.212)</li><li>從量稅：<span class=\"fx\">M=(P<sub>X</sub>+t)X+P<sub>Y</sub> Y</span>；從價稅：<span class=\"fx\">M=(P<sub>X</sub>+tP<sub>X</sub>)X+P<sub>Y</sub> Y</span>；所得稅：<span class=\"fx\">M-T=P<sub>X</sub> X+P<sub>Y</sub> Y</span>(p.216–217)</li><li>補貼金額計算：數理 SX<span class=\"fx\">′</span> 或 <span class=\"fx\">SP<sub>X</sub> X'</span>；幾何為補貼後均衡 E<span class=\"fx\">′</span> 與補貼前相對價格下支出的縱軸差距 <span class=\"fx\">Y'\\bar Y=E'\\bar E</span>(p.213)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>從量／從價補貼皆使預算線因為 <span class=\"fx\">X</span> 價格下降而變平坦且外移（旋轉）；所得補貼使預算線平行外移(p.211–214)。</li><li><strong>同等補貼金額下，消費者較偏好所得補貼</strong>：圖 p.216 中從量補貼均衡 <span class=\"fx\">B<sub>P</sub></span>（效用 <span class=\"fx\">U<sub>P</sub></span>），將同額補貼 <span class=\"fx\">B<sub>P</sub> B<sub>P</sub>'</span> 改為所得補貼使預算線平行外移，新均衡 <span class=\"fx\">B<sub>M</sub></span>（效用 <span class=\"fx\">U<sub>M</sub></span>），<span class=\"fx\">U<sub>M</sub></span> 在 <span class=\"fx\">U<sub>P</sub></span> 東北方；惟政策制定者若欲使 <span class=\"fx\">X</span> 消費變多，會較偏好從量補貼(p.216)。</li><li>課稅操作與補貼類似，數學與幾何方向相反(p.216)。</li></ul>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">X</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Y</text><line x1=\"110\" y1=\"90\" x2=\"330\" y2=\"200\" stroke=\"#1f3a5f\" stroke-width=\"1.6\"></line><text x=\"250\" y=\"215\" font-size=\"9\" fill=\"#1f3a5f\">原預算線</text><line x1=\"110\" y1=\"90\" x2=\"380\" y2=\"180\" stroke=\"#b5542e\" stroke-width=\"1.8\"></line><text x=\"330\" y=\"172\" font-size=\"9\" fill=\"#b5542e\">從量補貼(旋轉)</text><line x1=\"130\" y1=\"70\" x2=\"360\" y2=\"190\" stroke=\"#1e7d32\" stroke-width=\"1.4\" stroke-dasharray=\"5 4\"></line><text x=\"250\" y=\"66\" font-size=\"9\" fill=\"#1e7d32\">同額所得補貼(平行外移)</text><circle cx=\"220\" cy=\"140\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"180\" y=\"135\" font-size=\"9\" fill=\"#6b4e8e\">BP</text></svg><p class=\"figcap\">同額補貼下，所得補貼可達較高效用；從量補貼扭曲相對價格。(p.216)</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.1（台大財金，p.215）</strong>： <span class=\"fx\">U=5\\ln X+3\\ln Y</span>，P_X=\\10、P_Y=\\<span class=\"fx\">2</span>、E=\\96$<br>(1) 求均衡<br>(2) 邊際所得效用；<br>(3) X 配給 $X_r=5$ 時 Y 為何；<br>(4) ①X 每單位從量稅 <span class=\"fx\">2</span> 之稅收與 Y 均衡；②定額稅 T=10 下 X、Y；<br>(5) X 每單位補貼 <span class=\"fx\">2</span> 時總補貼 <span class=\"fx\">S</span>。解法要點：對數直線型一階條件 <span class=\"fx\">5/X=P<sub>X</sub>λ</span>、<span class=\"fx\">3/Y=P<sub>Y</sub>λ</span>，內解為 X=5E/(8P<span class=\"fx\">X</span>​)、Y=3E/(8P<span class=\"fx\">Y</span>​)；Corner/配給與稅後代入新預算線。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><strong>等量補貼下所得補貼 > 從量補貼（效用面），但從量補貼更能刺激 <span class=\"fx\">X</span> 消費</strong>——此為最常考的政策福利比較。</li><li>數量補貼可否轉售決定預算線形狀（有無水平段）。</li></ul>\n</div>\n</div>"}, {"id": "8.2", "title": "勞動與休閒的選擇（印刷頁 218–228）", "body": "\n<p class=\"def-note\">消費者效用受消費 <span class=\"fx\">C</span> 與休閒 <span class=\"fx\">l</span> 影響：<span class=\"fx\">U=U(C,l)</span>；時間稟賦 <span class=\"fx\">\\bar T</span>，工作時間 <span class=\"fx\">N</span>，休閒 <span class=\"fx\">l</span>，故 <span class=\"fx\">l+N=\\bar T</span>；工資率 <span class=\"fx\">W</span>(p.218)。</p>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc96\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">非勞動所得（Non-Labor income, NI）</div><div class=\"mc-body\"><div class=\"mc-formula\">工作以外的所得（中獎、贈與等）。</div><div class=\"mc-detail\">工作以外的所得（中獎、贈與等）。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc97\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">全額所得（full income／內含所得 implicit income）</div><div class=\"mc-body\"><div class=\"mc-formula\"><span class=\"fx\">W\\bar T+NI</span>，為時間稟賦價值與非勞動所得之總值。</div><div class=\"mc-detail\"><span class=\"fx\">W\\bar T+NI</span>，為時間稟賦價值與非勞動所得之總值(p.219)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>無非勞動所得預算線：<span class=\"fx\">WN=PC</span>；<span class=\"fx\">N=\\bar T-l</span> 代入 <span class=\"fx\">⇒ W(\\bar T-l)=PC</span> ⇒ <strong><span class=\"fx\">W\\bar T=Wl+PC</span></strong>(p.218)</li><li>有非勞動所得預算線：<span class=\"fx\">WN+NI=PC</span> ⇒ <strong><span class=\"fx\">W\\bar T+NI=Wl+PC</span></strong>(p.219)</li><li>最適化一階條件：<span class=\"fx\">\\mathcal L=U(C,l)+λ(W\\bar T+NI-Wl-PC)</span>；<span class=\"fx\">∂ U/∂ C=λ P</span>、<span class=\"fx\">∂ U/∂ l=λ W</span>；故 <span class=\"fx\">MRS<sub>lC</sub>=\\dfracMU<sub>l</sub>MU<sub>c</sub>=\\dfracWP</span>(p.220)</li><li>工作供給：<span class=\"fx\">N<sup>*</sup>=\\bar T-l<sup>*</sup></span>(p.221)</li><li>對勞動課比例稅（稅率 <span class=\"fx\">t</span>）：<span class=\"fx\">(1-t)W\\bar T=(1-t)Wl+PC</span>；一階條件 <span class=\"fx\">MRS<sub>lC</sub>=\\dfracMU<sub>l</sub>MU<sub>c</sub>=\\dfracW'P=\\dfrac(1-t)WP</span>(p.225)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>休閒的價格即為單位工資率 <span class=\"fx\">W</span>（休閒的機會成本）；縱軸若為金額則 <span class=\"fx\">P=1</span>(p.218)。</li><li>消費者獲得非勞動所得，或時間稟賦增加，均使預算線平行外移；若休閒與消費皆正常，則休閒與消費同增加(p.222)。</li><li><strong>後彎勞動供給曲線（Backward-bending Labor supply curve）</strong>：</li></ul>\n<ol><li><span class=\"fx\">|SE|\\gt |IE|</span>：工資率較低、休閒為正常財時，替代效果幅度大於所得效果——工資上升使工作時間增加，供給曲線<strong>正斜率</strong>(p.223)。</li><li><span class=\"fx\">|SE|\\lt |IE|</span>：工資率較高時，替代效果幅度小於所得效果——工資上升使工作時間減少，供給曲線<strong>負斜率</strong>（後彎）。</li></ol>\n<ul><li>後彎必備兩條件：(1) 休閒為正常財；(2) 替代效果幅度小於所得效果幅度(p.225)。</li><li>對工資課比例稅：稅後工資率下降，預算線變平坦；若休閒為正常財，SE 使工作時間減少、IE 使工作時間增加，總效果方向視力量而定；若休閒為劣等財，SE、IE 皆使工作時間減少(p.225–226)。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">工作時間 L</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">W/P</text><path d=\"M80 200 Q200 120 260 110 Q330 105 400 150\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></path><text x=\"380\" y=\"145\" font-size=\"12\" fill=\"#1f3a5f\">後彎供給</text><circle cx=\"260\" cy=\"110\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"230\" y=\"98\" font-size=\"10\" fill=\"#b5542e\">臨界工資（彎折點）</text><text x=\"90\" y=\"190\" font-size=\"10\" fill=\"#6c7684\">較低工資：替代效果主導</text><text x=\"300\" y=\"180\" font-size=\"10\" fill=\"#6c7684\">較高工資：所得效果主導←</text></svg><p class=\"figcap\">工資低時 W↑→L↑（替代效果）；工資高時所得效果主導，L↓，供給曲線後彎。</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.2</strong>： 後彎勞動供給線的原因——高工資下所得效果大於替代效果。（A）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.226)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.3</strong>： Josh 加薪後工作時數增加——替代效果凌駕所得效果。（A）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.227)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.4</strong>： 王老五被查稅後從工作七天變五天——最可能為所得效果使王老五減少工作（稅後實質所得下降，若休閒正常…，本書選項指向所得效果主導）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.227)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.5</strong>： James 工資 $15/時、非勞動所得 $720/週、每週可用 72 小時、U(C<span class=\"mpunct\">,</span>R)=CR，求每週工作時數。解法要點：<span class=\"fx\">MRS=MU<sub>R</sub>/MU<sub>C</sub>=C/R=W/P=15</span> ⇒ <span class=\"fx\">C=15R</span>；全額所得 <span class=\"fx\">W\\bar T+NI=15×72+720=1800</span>；代入 <span class=\"fx\">W\\bar T+NI=Wl+PC</span>（<span class=\"fx\">P=1</span>）解 <span class=\"fx\">R<sup>*</sup></span>，工作時數 <span class=\"fx\">N<sup>*</sup>=72-R<sup>*</sup></span>。（詳解見書末 QR）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.227)</div></li><li><strong>解決後彎的方法(p.227–228)</strong>：(1) 找視休閒為劣等財的勞動者（SE、IE 同向使供給線恆正斜率）<br>(2) 對加班時數加給（在 <span class=\"fx\">l<sup>*</sup></span> 之後的部分給較高工資，預算線折點使均衡由 <span class=\"fx\">E<sup>*</sup></span> 移至 E<span class=\"fx\">′</span>，延長工作時間）。</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>休閒視為正常財是後彎的必要條件；後彎段所得效果 > 替代效果。</li><li>比較「非勞動所得增加」與「工資率上升」的預算線移動差異（前者平移、後者旋轉）。</li><li>勞動課稅的 SE/IE 分解、最適工作時數求解（如例題 8.5 的 Cobb-Douglas 型）。</li></ul>\n</div>\n</div>"}, {"id": "8.3", "title": "跨期消費理論（Intertemporal consumption theory）（印刷頁 229–244）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc92\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">時間偏好（time preference）</div><div class=\"mc-body\"><div class=\"mc-formula\">消費者第 1 期消費得到的邊際效用大於第 2 期；主因對未來消費充滿未知。</div><div class=\"mc-detail\">消費者第 1 期消費得到的邊際效用大於第 2 期；主因對未來消費充滿未知。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc93\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">時間偏好率（the rate of time preference, <span class=\"fx\">ρ</span>）</div><div class=\"mc-body\"><div class=\"mc-formula\">未來效用的折現率；相對的，市場實質利率 <span class=\"fx\">r</span> 為客觀利率，<span class=\"fx\">ρ</span> 為主觀利率。</div><div class=\"mc-detail\">未來效用的折現率；相對的，市場實質利率 <span class=\"fx\">r</span> 為客觀利率，<span class=\"fx\">ρ</span> 為主觀利率(p.230)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc94\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">借款人（borrower）</div><div class=\"mc-body\"><div class=\"mc-formula\"><span class=\"fx\">C<sub>1</sub><sup>*</sup>>Y<sub>1</sub></span>，第一期消費不足部分靠借款，第二期償還本利和。</div><div class=\"mc-detail\"><span class=\"fx\">C<sub>1</sub><sup>*</sup>>Y<sub>1</sub></span>，第一期消費不足部分靠借款，第二期償還本利和(p.235)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc95\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">存款人／贷款人（lender）</div><div class=\"mc-body\"><div class=\"mc-formula\"><span class=\"fx\">C<sub>1</sub><sup>*</sup>\\lt Y<sub>1</sub></span>，第一期多餘的錢存入銀行收息，第二期領回本利和。</div><div class=\"mc-detail\"><span class=\"fx\">C<sub>1</sub><sup>*</sup>\\lt Y<sub>1</sub></span>，第一期多餘的錢存入銀行收息，第二期領回本利和(p.235)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>兩期原賦點 <span class=\"fx\">(Y<sub>1</sub>,Y<sub>2</sub>)</span>；名目利率 <span class=\"fx\">R</span>、物價水準 <span class=\"fx\">P<sub>1</sub>,P<sub>2</sub></span>(p.229)。</li><li><strong>時間偏好率</strong>：<span class=\"fx\">ρ=\\dfracMU<sub>C<sub>1</sub></sub>(C<sub>1</sub>,C<sub>2</sub>)-MU<sub>C<sub>2</sub></sub>(C<sub>1</sub>,C<sub>2</sub>)MU<sub>C<sub>2</sub></sub>(C<sub>1</sub>,C<sub>2</sub>)</span>；故 <span class=\"fx\">MRS<sub>C<sub>1</sub>C<sub>2</sub></sub>=\\dfracMU<sub>C<sub>1</sub></sub>MU<sub>C<sub>2</sub></sub>=1+ρ</span>(p.230)</li><li><strong>名目跨期預算線</strong>：<span class=\"fx\">P<sub>1</sub> C<sub>1</sub>+\\dfracP<sub>2</sub> C<sub>2</sub>1+R=P<sub>1</sub> Y<sub>1</sub>+\\dfracP<sub>2</sub> Y<sub>2</sub>1+R</span>（無遺贈、無接贈）(p.230)</li><li><strong>費雪方程式</strong>：<span class=\"fx\">(1+R)=(1+r)(1+π) ⇒ \\dfrac1+π1+R=\\dfrac11+r</span>；故<strong>實質跨期預算線</strong>：<span class=\"fx\">C<sub>1</sub>+\\dfracC<sub>2</sub>1+r=Y<sub>1</sub>+\\dfracY<sub>2</sub>1+r</span>(p.231)</li><li>預算線斜率：<span class=\"fx\">\\dfracdC<sub>2</sub>dC<sub>1</sub>=-(1+r)<0</span>——增加一單位現在消費，必須犧牲 <span class=\"fx\">(1+r)</span> 單位未來消費(p.231)</li><li>借貸利率不等（借款利率 <span class=\"fx\">r<sub>Borrow</sub></span>>存款利率 <span class=\"fx\">r<sub>Lend</sub></span>）時，預算線自原賦點 <span class=\"fx\">(Y<sub>1</sub>,Y<sub>2</sub>)</span> 折拗(p.231–232)。</li><li><strong>時間不可分最適條件</strong>：<span class=\"fx\">MRS<sub>C<sub>1</sub>C<sub>2</sub></sub>=\\dfracMU<sub>C<sub>1</sub></sub>MU<sub>C<sub>2</sub></sub>=1+ρ=1+r</span> ⇒ 均衡時 <span class=\"fx\">ρ=r</span>(p.234–235)</li><li>儲蓄函數：<span class=\"fx\">S<sub>1</sub>=Y<sub>1</sub>-C<sub>1</sub><sup>*</sup></span>、<span class=\"fx\">S<sub>2</sub>=Y<sub>2</sub>-C<sub>2</sub><sup>*</sup></span>(p.234)</li><li><strong>時間可分型效用</strong>：<span class=\"fx\">U(C<sub>1</sub>,C<sub>2</sub>)=U<sub>1</sub>(C<sub>1</sub>)+\\dfrac11+ρU<sub>2</sub>(C<sub>2</sub>)=U(C<sub>1</sub>)+β U(C<sub>2</sub>)</span>，其中 <span class=\"fx\">β=\\dfrac11+ρ∈(0,1)</span> 為折現因子（discount factor）(p.238)</li><li><strong>Euler 方程式（跨期一階條件）</strong>：<span class=\"fx\">\\dfrac∂ U(C<sub>1</sub>)∂ C<sub>1</sub>=β\\dfrac∂ U(C<sub>2</sub>)∂ C<sub>2</sub>(1+r)</span>(p.239)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>不均衡點判讀：若 <span class=\"fx\">\\dfracMU<sub>C<sub>1</sub></sub>MU<sub>C<sub>2</sub></sub>=1+ρ>1+r</span>（A 點），消費者會增加第一期消費、減少第二期；若 <span class=\"fx\">1+ρ<1+r</span>（B 點）則反向(p.234–235)。</li><li><strong>實質利率上升對借款人</strong>：SE 使 <span class=\"fx\">C<sub>1</sub></span> 下降；因借款人為正常財下 IE 亦使 <span class=\"fx\">C<sub>1</sub></span> 下降，總效果 <span class=\"fx\">C<sub>1</sub></span> 降、儲蓄增；最後效果落點決定身分——<span class=\"fx\">\\overlineαγ</span> 間轉為存款者，<span class=\"fx\">γ</span> 上不借不存，<span class=\"fx\">\\overlineγβ</span> 間仍為借款人(p.236)。</li><li><strong>實質利率上升對存款人</strong>：SE 使 <span class=\"fx\">C<sub>1</sub></span> 降、IE 使 <span class=\"fx\">C<sub>1</sub></span> 升，方向相反：</li></ul>\n<ol><li>SE 力道較大 ⇒ <span class=\"fx\">C<sub>1</sub>'</span>，第一期消費減少、儲蓄上升。</li><li>SE 力道＝IE ⇒ <span class=\"fx\">C<sub>1</sub>''</span>，兩者不變。</li><li>SE 力道較小 ⇒ <span class=\"fx\">C<sub>1</sub>'''</span>，第一期消費增加、儲蓄下降。</li></ol>\n<p>但存款人不可能因利率上升轉為借款人（<span class=\"fx\">C<sub>1</sub></span> 再增也不會超過 <span class=\"fx\">Y<sub>1</sub></span>）(p.237)。</p>\n<ul><li><strong><span class=\"fx\">β(1+r)</span> 三種情況</strong>（時間可分型，p.241–243）：</li></ul>\n<ol><li><span class=\"fx\">β(1+r)=1</span>（<span class=\"fx\">r=ρ</span>）：<span class=\"fx\">C<sub>1</sub><sup>*</sup>=C<sub>2</sub><sup>*</sup></span>，均衡點在 45 度線上，消費平穩（consumption smoothing）。</li><li><span class=\"fx\">β(1+r)>1</span>（<span class=\"fx\">r>ρ</span>）：第一期邊際效用 <span class=\"fx\">></span> 第二期，<span class=\"fx\">C<sub>1</sub><sup>*</sup>\\lt C<sub>2</sub><sup>*</sup></span>，均衡點在 45 度線<strong>上</strong>方。</li><li><span class=\"fx\">β(1+r)<1</span>（<span class=\"fx\">r<ρ</span>）：<span class=\"fx\">C<sub>1</sub><sup>*</sup>>C<sub>2</sub><sup>*</sup></span>，均衡點在 45 度線<strong>下</strong>方。</li></ol>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"410\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">C1（當期）</text><text x=\"52\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">C2（未來）</text><line x1=\"80\" y1=\"50\" x2=\"360\" y2=\"230\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></line><text x=\"200\" y=\"200\" font-size=\"11\" fill=\"#1f3a5f\">斜率=-(1+r)</text><circle cx=\"200\" cy=\"140\" r=\"4\" fill=\"#b5542e\"></circle><text x=\"208\" y=\"136\" font-size=\"11\" fill=\"#b5542e\">原賦點 (Y1,Y2)</text><text x=\"70\" y=\"46\" font-size=\"10\" fill=\"#6c7684\">縱截距 Y1(1+r)+Y2</text><text x=\"300\" y=\"246\" font-size=\"10\" fill=\"#6c7684\">橫截距 Y1+Y2/(1+r)</text></svg><p class=\"figcap\">跨期預算線過原賦點，斜率 -(1+r)；左側借款、右側儲蓄。</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.6（中山財管，p.237）</strong>： <span class=\"fx\">U(C<sub>1</sub>,C<sub>2</sub>)=C<sub>1</sub>^α C<sub>2</sub><sup>1-α</sup></span>，<span class=\"fx\">α=0.4</span>，<span class=\"fx\">y<sub>1</sub>=150</span>、<span class=\"fx\">y<sub>2</sub>=140</span>，定額稅 <span class=\"fx\">t<sub>1</sub>=50</span>、<span class=\"fx\">t<sub>2</sub>=20</span><br>(1) 導一期、二期消費與儲蓄函數；<br>(2) <span class=\"fx\">r=20\\%</span> 下兩期最適消費<br>(3) 判別 lender/borrower。解法要點：課稅後可支配所得 <span class=\"fx\">(y<sub>1</sub>-t<sub>1</sub>,y<sub>2</sub>-t<sub>2</sub>)</span> 代入 Cobb-Douglas 跨期最適，<span class=\"fx\">C<sub>1</sub><sup>*</sup>=α(y<sub>1</sub>-t<sub>1</sub>+\\dfracy<sub>2</sub>-t<sub>2</sub>1+r)</span>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.7</strong>： 時間偏好率小於利率時消費者會——多儲蓄（<span class=\"fx\">r>ρ</span>，現在消費的機會成本高）。（C）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.238)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.8</strong>： 兩期模型敘述——對金主（lender）而言當期利率上升，當期儲蓄可能增加；對信用卡借錢者利率下降時負儲蓄增加；永生者 <span class=\"fx\">MRS<sub>C<sub>1</sub>C<sub>2</sub></sub>=1</span> 等。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.238)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.9（110 成大經研總經，p.240）</strong>： <span class=\"fx\">u(c<sub>1</sub>,c<sub>2</sub>)=\\log c<sub>1</sub>+β\\log c<sub>2</sub></span>，(1) 導 Euler<br>(2) 一期最適<br>(3) 二期最適。解法要點：Euler 式 <span class=\"fx\">\\dfrac1c<sub>1</sub>=β\\dfrac1c<sub>2</sub>(1+r)</span>；配合預算線解出 <span class=\"fx\">c<sub>1</sub><sup>*</sup>=\\dfrac11+β(y<sub>1</sub>+\\dfracy<sub>2</sub>1+r)</span>、<span class=\"fx\">c<sub>2</sub><sup>*</sup>=\\dfracβ(1+r)1+β(y<sub>1</sub>+\\dfracy<sub>2</sub>1+r)</span>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.10（台大經研、台大商研，p.244）</strong>： 兩期模型，期初債券 <span class=\"fx\">B<sub>0</sub></span>，第 1 期利息收入 <span class=\"fx\">rB<sub>0</sub></span>；<span class=\"fx\">U(C<sub>1</sub>,C<sub>2</sub>)=U(C<sub>1</sub>)+β U(C<sub>2</sub>)</span><br>(1) 逐期預算限制；<br>(2) <span class=\"fx\">B<sub>2</sub>=0</span> 時跨期預算線<br>(3) 一階條件。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.11（中央企管，p.244）</strong>： <span class=\"fx\">U=u(c<sub>1</sub>)+β u(c<sub>2</sub>)</span>，利率 5%，<span class=\"fx\">u'\\gt 0</span>、<span class=\"fx\">u''\\lt 0</span><br>(1) 寫極大化問題<br>(2) 判斷第一期與第二期何者消費較多（須比較 <span class=\"fx\">β</span> 與 <span class=\"fx\">1/(1+r)</span>）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><strong>費雪方程式 <span class=\"fx\">1+r=(1+R)/(1+π)</span></strong>；跨期預算線斜率 <span class=\"fx\">-(1+r)</span> 的經濟意義。</li><li><strong>借款人／存款人面對利率上升的效果分解方向不同</strong>：借款人 SE、IE 同向（<span class=\"fx\">C<sub>1</sub></span> 必降）；存款人 SE、IE 反向。</li><li>Euler equation 推導；<span class=\"fx\">β(1+r)</span> 與 1 的三種大小對應 <span class=\"fx\">C<sub>1</sub><sup>*</sup></span>、<span class=\"fx\">C<sub>2</sub><sup>*</sup></span> 大小與 45 度線位置。</li></ul>\n</div>\n</div>"}, {"id": "8.4", "title": "顯示性偏好理論（Revealed preference theorem）（印刷頁 245–250）", "body": "\n<p class=\"def-note\">由<strong>薩謬爾遜（Paul Samuelson）於 1938 年</strong>提出：消費者的偏好情況可以由市場上實際購買的選擇推算，而不必探討個人的效用函數(p.245)。</p>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc87\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">顯示性偏好</div><div class=\"mc-body\"><div class=\"mc-formula\">當消費者在某組既定價格、既定所得下，能夠買得起 B 商品組合卻不選，而選擇了 A，則稱 A 比 B 有顯示性偏好。</div><div class=\"mc-detail\">當消費者在某組既定價格、既定所得下，能夠買得起 B 商品組合卻不選，而選擇了 A，則稱 A 比 B 有顯示性偏好(p.245)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc88\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">直接顯示性偏好（Direct revealed preference）</div><div class=\"mc-body\"><div class=\"mc-formula\">若 <span class=\"fx\">P<sub>X</sub><sup>0</sup> X<sub>0</sub>+P<sub>Y</sub><sup>0</sup> Y<sub>0</sub>≥ P<sub>X</sub><sup>0</sup> X<sub>1</sub>+P<sub>Y</sub><sup>0</sup> Y<sub>1</sub></span>，則 <span class=\"fx\">A(X<sub>0</sub>,Y<sub>0</sub>)</span> 比 <span class=\"fx\">B(X<sub>1</sub>,Y<sub>1</sub>)</span> 有直接顯示性偏好。</div><div class=\"mc-detail\">若 <span class=\"fx\">P<sub>X</sub><sup>0</sup> X<sub>0</sub>+P<sub>Y</sub><sup>0</sup> Y<sub>0</sub>≥ P<sub>X</sub><sup>0</sup> X<sub>1</sub>+P<sub>Y</sub><sup>0</sup> Y<sub>1</sub></span>，則 <span class=\"fx\">A(X<sub>0</sub>,Y<sub>0</sub>)</span> 比 <span class=\"fx\">B(X<sub>1</sub>,Y<sub>1</sub>)</span> 有直接顯示性偏好(p.245)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc89\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">間接顯示性偏好（Indirect revealed preference）</div><div class=\"mc-body\"><div class=\"mc-formula\">A 直接比 B、B 直接比 C，則 A 間接比 C。</div><div class=\"mc-detail\">A 直接比 B、B 直接比 C，則 A 間接比 C(p.246)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc90\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">顯示性偏好弱公理（WARP）</div><div class=\"mc-body\"><div class=\"mc-formula\">若 A 比 B 有直接顯示性偏好、且兩個組合並非同一個，則就不會發生 B 比 A 有直接顯示性偏好（保證偏好一致性）。</div><div class=\"mc-detail\">若 A 比 B 有直接顯示性偏好、且兩個組合並非同一個，則就不會發生 B 比 A 有直接顯示性偏好（保證偏好一致性）(p.246)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc91\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">顯示性偏好強公理（SARP）</div><div class=\"mc-body\"><div class=\"mc-formula\">若 A 直接比 B、B 直接比 C，則 A 間接比 C，那麼就不可能發生 C 比 A 間接顯示性偏好。</div><div class=\"mc-detail\">若 A 直接比 B、B 直接比 C，則 A 間接比 C，那麼就不可能發生 C 比 A 間接顯示性偏好。由 Houthakker 於 1950 年提出；<strong>若且唯若消費者行為滿足 SARP，則該行為可由一個良好偏好導出</strong>(p.249)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>直接顯示性偏好條件：<span class=\"fx\">P<sub>X</sub><sup>0</sup> X<sub>0</sub>+P<sub>Y</sub><sup>0</sup> Y<sub>0</sub>≥ P<sub>X</sub><sup>0</sup> X<sub>1</sub>+P<sub>Y</sub><sup>0</sup> Y<sub>1</sub></span> ⇒ A <span class=\"fx\">\\succeq</span> B（直接）(p.245)</li><li>WARP 邏輯：<span class=\"fx\">P<sub>X</sub><sup>0</sup> X<sub>0</sub>+P<sub>Y</sub><sup>0</sup> Y<sub>0</sub>≥ P<sub>X</sub><sup>0</sup> X<sub>1</sub>+P<sub>Y</sub><sup>0</sup> Y<sub>1</sub></span>（A 直接勝 B）且 <span class=\"fx\">P<sub>X</sub><sup>1</sup> X<sub>0</sub>+P<sub>Y</sub><sup>1</sup> Y<sub>0</sub>>P<sub>X</sub><sup>1</sup> X<sub>1</sub>+P<sub>Y</sub><sup>1</sup> Y<sub>1</sub></span>（在新價格下 B 買不起 A，故選 B）—— 兩式並存即滿足 WARP(p.246)。</li><li>SARP 數學表示：A 直接勝 B（上式）、B 直接勝 C（<span class=\"fx\">P<sub>X</sub><sup>1</sup> X<sub>1</sub>+P<sub>Y</sub><sup>1</sup> Y<sub>1</sub>≥ P<sub>X</sub><sup>1</sup> X<sub>2</sub>+P<sub>Y</sub><sup>1</sup> Y<sub>2</sub></span>），則 A 間接勝 C，且不可反向(p.249)。</li><li><strong>支出矩陣驗證法</strong>：做不同價格對不同消費組合的支出矩陣 <span class=\"fx\">\\beginbmatrixP<sub>0</sub>Q<sub>0</sub>&P<sub>0</sub>Q<sub>1</sub>&P<sub>0</sub>Q<sub>2</sub>\\\\P<sub>1</sub>Q<sub>0</sub>&P<sub>1</sub>Q<sub>1</sub>&P<sub>1</sub>Q<sub>2</sub>\\\\P<sub>2</sub>Q<sub>0</sub>&P<sub>2</sub>Q<sub>1</sub>&P<sub>2</sub>Q<sub>2</sub>\\endbmatrix</span>，對角線為真正選擇支出；每列與對角線比較，較小或相等者標 ※（表示該價格下被選組合比另一組合便宜）；檢查間接顯示性偏好；若第 <span class=\"fx\">i</span> 列第 <span class=\"fx\">j</span> 行有 ※、而第 <span class=\"fx\">j</span> 列第 <span class=\"fx\">i</span> 列無 ※（或反向）則違反 SARP(p.249)。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>圖形判斷通則（橫軸 <span class=\"fx\">X</span>、縱軸 <span class=\"fx\">Y</span>；<span class=\"fx\">Q<sub>1</sub></span> 為 <span class=\"fx\">P<sub>1</sub></span> 價格下選擇、<span class=\"fx\">Q<sub>2</sub></span> 為 <span class=\"fx\">P<sub>2</sub></span> 價格下選擇；<span class=\"fx\">P<sub>i</sub> Q<sub>j</sub></span> 表在價格 <span class=\"fx\">P<sub>i</sub></span> 下購買 <span class=\"fx\">Q<sub>j</sub></span> 之支出）(p.247–249)：</li></ul>\n<ol><li><span class=\"fx\">P<sub>1</sub>Q<sub>1</sub>\\lt P<sub>1</sub>Q<sub>2</sub></span>（<span class=\"fx\">Q<sub>1</sub></span> 便宜，非偏好 <span class=\"fx\">Q<sub>1</sub></span>）；<span class=\"fx\">P<sub>2</sub>Q<sub>1</sub>>P<sub>2</sub>Q<sub>2</sub></span>（偏好 <span class=\"fx\">Q<sub>2</sub></span>）—— 無法證明矛盾，<strong>滿足 WARP</strong>。</li><li><span class=\"fx\">P<sub>1</sub>Q<sub>1</sub>>P<sub>1</sub>Q<sub>2</sub></span>（偏好 <span class=\"fx\">Q<sub>1</sub></span>）；<span class=\"fx\">P<sub>2</sub>Q<sub>1</sub>\\lt P<sub>2</sub>Q<sub>2</sub></span>（偏好 <span class=\"fx\">Q<sub>2</sub></span>）—— 矛盾，<strong>違反 WARP</strong>。</li><li><span class=\"fx\">P<sub>1</sub>Q<sub>1</sub>=P<sub>1</sub>Q<sub>2</sub></span>（偏好 <span class=\"fx\">Q<sub>1</sub></span>）；<span class=\"fx\">P<sub>2</sub>Q<sub>1</sub>>P<sub>2</sub>Q<sub>2</sub></span>（<span class=\"fx\">Q<sub>2</sub></span> 便宜）—— 一致，<strong>滿足 WARP</strong>；若 <span class=\"fx\">Q<sub>1</sub></span>、<span class=\"fx\">Q<sub>2</sub></span> 為兩期，則 <span class=\"fx\">U(Q<sub>1</sub>)>U(Q<sub>2</sub>)</span>，第二期生活水準較第一期降低。</li><li><span class=\"fx\">P<sub>1</sub>Q<sub>1</sub>\\lt P<sub>1</sub>Q<sub>2</sub></span>；<span class=\"fx\">P<sub>2</sub>Q<sub>1</sub>=P<sub>2</sub>Q<sub>2</sub></span>（偏好 <span class=\"fx\">Q<sub>2</sub></span>）—— 滿足 WARP；<span class=\"fx\">U(Q<sub>1</sub>)\\lt U(Q<sub>2</sub>)</span>，第二期生活水準提高。</li><li><span class=\"fx\">P<sub>1</sub>Q<sub>1</sub>>P<sub>1</sub>Q<sub>2</sub></span>（偏好 <span class=\"fx\">Q<sub>1</sub></span>）；<span class=\"fx\">P<sub>2</sub>Q<sub>1</sub>>P<sub>2</sub>Q<sub>2</sub></span>（<span class=\"fx\">Q<sub>2</sub></span> 便宜，非偏好）—— 滿足；<span class=\"fx\">U(Q<sub>1</sub>)>U(Q<sub>2</sub>)</span>。</li><li><span class=\"fx\">P<sub>1</sub>Q<sub>1</sub>=P<sub>1</sub>Q<sub>2</sub></span>（偏好 <span class=\"fx\">Q<sub>1</sub></span>）；<span class=\"fx\">P<sub>2</sub>Q<sub>1</sub>\\lt P<sub>2</sub>Q<sub>2</sub></span>（偏好 <span class=\"fx\">Q<sub>2</sub></span>）—— 矛盾，<strong>違反 WARP</strong>。</li></ol>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><defs><marker id=\"ar\" markerwidth=\"8\" markerheight=\"8\" refx=\"6\" refy=\"3\" orient=\"auto\"><path d=\"M0 0L6 3L0 6z\" fill=\"#b5542e\"></path></marker></defs><line x1=\"80\" y1=\"70\" x2=\"330\" y2=\"230\" stroke=\"#1f3a5f\" stroke-width=\"1.8\"></line><text x=\"335\" y=\"228\" font-size=\"10\" fill=\"#1f3a5f\">P1</text><line x1=\"120\" y1=\"230\" x2=\"380\" y2=\"60\" stroke=\"#b5542e\" stroke-width=\"1.8\"></line><text x=\"386\" y=\"62\" font-size=\"10\" fill=\"#b5542e\">P2</text><circle cx=\"180\" cy=\"150\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"150\" y=\"146\" font-size=\"11\" fill=\"#1e7d32\">Q1</text><circle cx=\"280\" cy=\"150\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"286\" y=\"146\" font-size=\"11\" fill=\"#6b4e8e\">Q2</text></svg><p class=\"figcap\">WARP：若買得起 Q2 卻選 Q1，則在 P2 下不應再選買得起的 Q1。兩預算線交叉區判斷偏好一致性。(p.247)</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.12</strong>： <span class=\"fx\">(P<sub>x1</sub>,P<sub>y1</sub>)=(40,20)</span>、<span class=\"fx\">(x<sub>0</sub>,y<sub>0</sub>)=(4,4)</span>；<span class=\"fx\">(P<sub>x1</sub>,P<sub>y1</sub>)=(20,40)</span>、<span class=\"fx\">(x<sub>1</sub>,y<sub>1</sub>)=(5,2)</span>，問是否滿足 WARP。解法要點：在 <span class=\"fx\">P<sup>0</sup>=(40,20)</span> 下，<span class=\"fx\">P<sup>0</sup>Q<sub>0</sub>=40×4+20×4=240</span>、<span class=\"fx\">P<sup>0</sup>Q<sub>1</sub>=40×5+20×2=240</span>（相等，<span class=\"fx\">Q<sub>0</sub></span> 直接勝 <span class=\"fx\">Q<sub>1</sub></span>）；在 <span class=\"fx\">P<sup>1</sup>=(20,40)</span> 下，<span class=\"fx\">P<sup>1</sup>Q<sub>1</sub>=20×5+40×2=180</span>、<span class=\"fx\">P<sup>1</sup>Q<sub>0</sub>=20×4+40×4=240</span>（<span class=\"fx\">Q<sub>1</sub></span> 買不起 <span class=\"fx\">Q<sub>0</sub></span>，故選 <span class=\"fx\">Q<sub>1</sub></span>）—— 兩式不矛盾，<strong>滿足 WARP</strong>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.246)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.13</strong>： 三財貨三組合資料，問是否滿足 WARP 與 SARP。解法要點：建支出矩陣，逐列與對角線比較標 ※，檢查直接與間接顯示性偏好循環。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.250)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.14（中山企管，p.250）</strong>： 何者代表 SARP——若 A 直接或間接顯示勝 B，則不可能 B 直接或間接顯示勝 A。（D）</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><strong>WARP 只管「直接」雙向矛盾；SARP 把「間接」也納入循環檢查</strong>。SARP 是可積分／可導出良好偏好的充要條件。</li><li>圖形題關鍵：被選組合是否落在對方預算線「之內」（買得起卻不選才算顯示性偏好）。</li><li>配合 8.5 節：WARP/SARP 可用來比較兩期生活水準（<span class=\"fx\">U(Q<sub>1</sub>)</span> vs <span class=\"fx\">U(Q<sub>2</sub>)</span>）。</li></ul>\n</div>\n</div>"}, {"id": "8.5", "title": "皮氏與拉氏指數（Index）（印刷頁 251–255）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc81\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">生活標準（Standard of living）</div><div class=\"mc-body\"><div class=\"mc-formula\">任意選定的一個效用水準。</div><div class=\"mc-detail\">任意選定的一個效用水準(p.251)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc82\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">生活成本（Cost of living）</div><div class=\"mc-body\"><div class=\"mc-formula\">為維持某個生活水準下，必須的最低貨幣支出額。</div><div class=\"mc-detail\">為維持某個生活水準下，必須的最低貨幣支出額(p.251)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc83\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">真實物價指數（True price index, TPI）</div><div class=\"mc-body\"><div class=\"mc-formula\">為維持在某一固定生活標準下，當期（current period）所必須支出的最小總額，與基期（base period）必須支出的最小總額之比。</div><div class=\"mc-detail\">為維持在某一固定生活標準下，當期（current period）所必須支出的最小總額，與基期（base period）必須支出的最小總額之比(p.251)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc84\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">支出指數（Expenditure index, <span class=\"fx\">e</span>）</div><div class=\"mc-body\"><div class=\"mc-formula\">消費者當期實際總支出與基期實際總支出之比；若每期花光所得，亦代表當期所得與基期所得之比。</div><div class=\"mc-detail\">消費者當期實際總支出與基期實際總支出之比；若每期花光所得，亦代表當期所得與基期所得之比(p.253)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc85\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">拉氏指數（Laspeyres index, <span class=\"fx\">L<sub>P</sub></span>）</div><div class=\"mc-body\"><div class=\"mc-formula\">用<strong>基期</strong>消費數量 <span class=\"fx\">E<sub>0</sub><sup>*</sup>(X<sub>0</sub><sup>*</sup>,Y<sub>0</sub><sup>*</sup>)</span> 當權重。</div><div class=\"mc-detail\">用<strong>基期</strong>消費數量 <span class=\"fx\">E<sub>0</sub><sup>*</sup>(X<sub>0</sub><sup>*</sup>,Y<sub>0</sub><sup>*</sup>)</span> 當權重(p.254)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc86\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">皮氏指數（Paasche index, <span class=\"fx\">P<sub>P</sub></span>，本書記作 <span class=\"fx\">L<sub>P</sub></span> 於皮氏段）</div><div class=\"mc-body\"><div class=\"mc-formula\">用<strong>當期</strong>消費數量 <span class=\"fx\">E<sub>1</sub><sup>*</sup>(X<sub>1</sub><sup>*</sup>,Y<sub>1</sub><sup>*</sup>)</span> 當權重。</div><div class=\"mc-detail\">用<strong>當期</strong>消費數量 <span class=\"fx\">E<sub>1</sub><sup>*</sup>(X<sub>1</sub><sup>*</sup>,Y<sub>1</sub><sup>*</sup>)</span> 當權重(p.255)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>符號：基期 <span class=\"fx\">(P<sub>X</sub><sup>0</sup>,P<sub>Y</sub><sup>0</sup>)</span>、最適點 <span class=\"fx\">E<sub>0</sub><sup>*</sup>(X<sub>0</sub><sup>*</sup>,Y<sub>0</sub><sup>*</sup>)</span>、效用 <span class=\"fx\">U<sub>0</sub><sup>*</sup></span>；當期 <span class=\"fx\">(P<sub>X</sub><sup>1</sup>,P<sub>Y</sub><sup>1</sup>)</span>、最適點 <span class=\"fx\">E<sub>1</sub><sup>*</sup>(X<sub>1</sub><sup>*</sup>,Y<sub>1</sub><sup>*</sup>)</span>、效用 <span class=\"fx\">U<sub>1</sub><sup>*</sup></span>(p.251)。</li><li><strong>真實物價指數（固定在基期效用 <span class=\"fx\">U<sub>0</sub><sup>*</sup></span>）</strong>：<span class=\"fx\">TPI<sub>0</sub>=\\left.\\dfracP<sub>X</sub><sup>1</sup> X<sub>2</sub><sup>*</sup>+P<sub>Y</sub><sup>1</sup> Y<sub>2</sub><sup>*</sup>P<sub>X</sub><sup>0</sup> X<sub>0</sub><sup>*</sup>+P<sub>Y</sub><sup>0</sup> Y<sub>0</sub><sup>*</sup>|<sub>U<sub>0</sub><sup>*</sup></sub></span>（<span class=\"fx\">E<sub>2</sub><sup>*</sup></span> 為當期價格下維持 <span class=\"fx\">U<sub>0</sub><sup>*</sup></span> 的最低支出點）(p.252)</li><li><strong>真實物價指數（固定在當期效用 <span class=\"fx\">U<sub>1</sub><sup>*</sup></span>）</strong>：<span class=\"fx\">TPI<sub>1</sub>=\\left.\\dfracP<sub>X</sub><sup>1</sup> X<sub>1</sub><sup>*</sup>+P<sub>Y</sub><sup>1</sup> Y<sub>1</sub><sup>*</sup>P<sub>X</sub><sup>0</sup> X<sub>3</sub><sup>*</sup>+P<sub>Y</sub><sup>0</sup> Y<sub>3</sub><sup>*</sup>|<sub>U<sub>1</sub><sup>*</sup></sub></span>（<span class=\"fx\">E<sub>3</sub><sup>*</sup></span> 為基期價格下維持 <span class=\"fx\">U<sub>1</sub><sup>*</sup></span> 的最低支出點）(p.252)</li><li><span class=\"fx\">TPI>1</span> 真實生活成本提高；<span class=\"fx\">TPI<1</span> 降低；<span class=\"fx\">=1</span> 不變(p.252)。</li><li><strong>支出指數</strong>：e=P<span class=\"fx\">X</span><span class=\"fx\">0</span>​X<span class=\"fx\">0</span>​+P<span class=\"fx\">Y</span><span class=\"fx\">0</span>​Y<span class=\"fx\">0</span>​P<span class=\"fx\">X</span><span class=\"fx\">1</span>​X<span class=\"fx\">1</span>​+P<span class=\"fx\">Y</span><span class=\"fx\">1</span>​Y<span class=\"fx\">1</span>​​=基期實際總支出當期實際總支出​(p.253)</li><li>福利判斷：<span class=\"fx\">e>TPI</span> 所得上升幅度大於生活成本上升幅度，福利水準提高；<span class=\"fx\">e\\lt TPI</span> 福利降低；<span class=\"fx\">e=TPI</span> 福利不變(p.253)。</li><li><strong><strong class=\"proper\">拉氏指數</strong></strong>：<span class=\"fx\">L<sub>P</sub>=\\dfracP<sub>X</sub><sup>1</sup> X<sub>0</sub><sup>*</sup>+P<sub>Y</sub><sup>1</sup> Y<sub>0</sub><sup>*</sup>P<sub>X</sub><sup>0</sup> X<sub>0</sub><sup>*</sup>+P<sub>Y</sub><sup>0</sup> Y<sub>0</sub><sup>*</sup></span>(p.254)；本書結論 <span class=\"fx\">L<sub>P</sub>=\\dfracP<sub>X</sub><sup>1</sup> X<sub>0</sub><sup>*</sup>+P<sub>Y</sub><sup>1</sup> Y<sub>0</sub><sup>*</sup>P<sub>X</sub><sup>0</sup> X<sub>0</sub><sup>*</sup>+P<sub>Y</sub><sup>0</sup> Y<sub>0</sub><sup>*</sup>>TPI<sub>0</sub>=\\left.\\dfracP<sub>X</sub><sup>1</sup> X<sub>2</sub><sup>*</sup>+P<sub>Y</sub><sup>1</sup> Y<sub>2</sub><sup>*</sup>P<sub>X</sub><sup>0</sup> X<sub>0</sub><sup>*</sup>+P<sub>Y</sub><sup>0</sup> Y<sub>0</sub><sup>*</sup>|<sub>U<sub>0</sub><sup>*</sup></sub></span>——<strong>拉氏指數高估生活成本</strong>(p.254)。</li><li><strong><strong class=\"proper\">皮氏指數</strong></strong>：<span class=\"fx\">P<sub>P</sub>=\\dfracP<sub>X</sub><sup>1</sup> X<sub>1</sub><sup>*</sup>+P<sub>Y</sub><sup>1</sup> Y<sub>1</sub><sup>*</sup>P<sub>X</sub><sup>0</sup> X<sub>1</sub><sup>*</sup>+P<sub>Y</sub><sup>0</sup> Y<sub>1</sub><sup>*</sup></span>(p.255)；本書結論 <span class=\"fx\">P<sub>P</sub>=\\dfracP<sub>X</sub><sup>1</sup> X<sub>1</sub><sup>*</sup>+P<sub>Y</sub><sup>1</sup> Y<sub>1</sub><sup>*</sup>P<sub>X</sub><sup>0</sup> X<sub>1</sub><sup>*</sup>+P<sub>Y</sub><sup>0</sup> Y<sub>1</sub><sup>*</sup>\\lt TPI<sub>1</sub>=\\left.\\dfracP<sub>X</sub><sup>1</sup> X<sub>1</sub><sup>*</sup>+P<sub>Y</sub><sup>1</sup> Y<sub>1</sub><sup>*</sup>P<sub>X</sub><sup>0</sup> X<sub>3</sub><sup>*</sup>+P<sub>Y</sub><sup>0</sup> Y<sub>3</sub><sup>*</sup>|<sub>U<sub>1</sub><sup>*</sup></sub></span>——<strong>皮氏指數低估生活成本</strong>(p.255)。</li><li>福利推論：<span class=\"fx\">L<sub>P</sub>\\lt e</span> 表生活水準上升（反之無法推得）；<span class=\"fx\">P<sub>P</sub>>e</span> 表生活水準下降（反之無法推得）(p.255)。</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>真實物價指數理論上理想，但須知道效用函數才能求 <span class=\"fx\">E<sub>2</sub><sup>*</sup></span>、<span class=\"fx\">E<sub>3</sub><sup>*</sup></span>，實務上難算，故以拉氏、皮氏代替(p.252–253)。</li><li><strong>拉氏指數（固定基期數量）高估生活成本</strong>：因為它不允許消費者相對價格改變後以便宜財替代，高估了為維持基期效用所需的支出。</li><li><strong>皮氏指數（固定當期數量）低估生活成本</strong>：方向相反。</li><li>支出成本的變高或降低，代表消費者福利水準跟著變高或降低(p.252 思考題)。</li></ul>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">X</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Y</text><line x1=\"130\" y1=\"70\" x2=\"330\" y2=\"180\" stroke=\"#1f3a5f\" stroke-width=\"1.6\"></line><line x1=\"110\" y1=\"70\" x2=\"300\" y2=\"200\" stroke=\"#b5542e\" stroke-width=\"1.6\"></line><path d=\"M120 90 Q200 120 300 180\" fill=\"none\" stroke=\"#1e7d32\" stroke-width=\"1.6\"></path><path d=\"M140 80 Q210 110 280 150\" fill=\"none\" stroke=\"#6b4e8e\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"></path><circle cx=\"200\" cy=\"120\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"160\" y=\"112\" font-size=\"9\" fill=\"#1e7d32\">E0*</text><circle cx=\"230\" cy=\"115\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"236\" y=\"112\" font-size=\"9\" fill=\"#b5542e\">E1*</text></svg><p class=\"figcap\">TPI：以當期價格平行移動切基期效用，衡量物價指數變動。(p.251)</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 8.15</strong>： <span class=\"fx\">(P<sub>x0</sub>,P<sub>y0</sub>)=(40,20)</span>、<span class=\"fx\">(x<sub>0</sub>,y<sub>0</sub>)=(4,4)</span>；<span class=\"fx\">(P<sub>x1</sub>,P<sub>y1</sub>)=(20,40)</span>、<span class=\"fx\">(x<sub>1</sub>,y<sub>1</sub>)=(5,2)</span>，第 0 期為基期，請算皮氏與拉氏指數。解法要點：</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(p.255)</div></li><li>拉氏（用基期數量 <span class=\"fx\">Q<sub>0</sub>=(4,4)</span>）：<span class=\"fx\">L<sub>P</sub>=\\dfrac20×4+40×440×4+20×4=\\dfrac240240=1</span>。</li><li>皮氏（用當期數量 <span class=\"fx\">Q<sub>1</sub>=(5,2)</span>）：<span class=\"fx\">P<sub>P</sub>=\\dfrac20×5+40×240×5+20×2=\\dfrac180240=0.75</span>。</li><li>支出指數 <span class=\"fx\">e=\\dfrac20×5+40×240×4+20×4=\\dfrac180240=0.75</span>（恰與皮氏同值，因題目結構使然）。</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><strong>記口訣：拉氏（基期數量）高估、皮氏（當期數量）低估真實生活成本</strong>；兩者與支出指數 <span class=\"fx\">e</span> 比較可單向推論福利升降。</li><li>與 8.4 節連結：顯示性偏好可在不知效用函數下近似 <span class=\"fx\">TPI</span>。</li><li>考計算時注意分子分母「哪一期價格、哪一期數量」不可寫錯。</li></ul>\n</div>\n</div>"}], "9": [{"id": "9.1", "title": "賭局與期望效用（印刷頁 259–261）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc77\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">風險（Risk）</div><div class=\"mc-body\"><div class=\"mc-formula\">對出象（Outcome）的情況未知，但出象的發生機率已知；例：投擲一公平硬幣的遊戲。</div><div class=\"mc-detail\">對出象（Outcome）的情況未知，但出象的發生機率已知；例：投擲一公平硬幣的遊戲(p.259)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc78\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">不確定（Uncertainty）</div><div class=\"mc-body\"><div class=\"mc-formula\">對出象的情況未知，且發生機率也未知；例：天災。</div><div class=\"mc-detail\">對出象的情況未知，且發生機率也未知；例：天災(p.259)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc79\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">公平賭局（Fair game）</div><div class=\"mc-body\"><div class=\"mc-formula\">遊戲所得的貨幣期望值等於原始貨幣持有量，亦即參與賭局的期望利潤為零。</div><div class=\"mc-detail\">遊戲所得的貨幣期望值等於原始貨幣持有量，亦即參與賭局的期望利潤為零(p.259)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc80\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">期望效用（Expected utility, EU）</div><div class=\"mc-body\"><div class=\"mc-formula\">Cramer 最早提出，1940 年左右由 Von Neumann 與 Morgenstern 系統化發展；把消費者在不確定狀態下的可能選擇都當成一個賭局來分析。</div><div class=\"mc-detail\">Cramer 最早提出，1940 年左右由 Von Neumann 與 Morgenstern 系統化發展；把消費者在不確定狀態下的可能選擇都當成一個賭局來分析(p.260)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>設原始貨幣持有量為 <span class=\"fx\">M</span>，贏得賭局得 <span class=\"fx\">A</span> 元（機率 <span class=\"fx\">p</span>），輸了損失 <span class=\"fx\">B</span> 元（機率 <span class=\"fx\">q=1-p</span>），則期望貨幣值為：</li></ul>\n<p>EM=p(M+A)+q(M−B)=pM+pA+(1−p)M−(1−p)B=M+pA−(1−p)B(p.259)</p>\n<ul><li>其中 pA−(1−p)B 定義為參加賭局的期望利潤(p.259)：</li></ul>\n<ol><li><span class=\"fx\">pA-(1-p)B=0 ⇒ EM=M</span>，為<strong>公平賭局（Fair game）</strong>；</li><li><span class=\"fx\">pA-(1-p)B>0 ⇒ EM>M</span>，為<strong>有利賭局（Favorable game）</strong>；</li><li><span class=\"fx\">pA-(1-p)B\\lt 0 ⇒ EM\\lt M</span>，為<strong>不利賭局（Unfavorable game）</strong>(p.259)。</li></ol>\n<ul><li><strong>聖彼得堡之矛盾（St. Petersburg paradox）</strong>：投擲公平硬幣，第 <span class=\"fx\">n</span> 次出現正面得 <span class=\"fx\">2<sup>n</sup></span> 元，</li></ul>\n<p><span class=\"fx\">EM=1/2×2<sup>1</sup>+(1)/(2<sup>2</sup>)×2<sup>2</sup>+\\cdots+(1)/(2<sup>n</sup>)2<sup>n</sup>+\\cdots=∑<sub>n=1</sub><sup>∞</sup>(1)/(2<sup>n</sup>)2<sup>n</sup>→∞</span>(p.260)。</p>\n<p>雖期望報酬無窮大，卻少有人願付高價參加——單純用貨幣期望值評價並不正確，消費者追求的是<strong>效用極大化</strong>而非貨幣數量極大化。</p>\n<ul><li>賭局 <span class=\"fx\">A</span> 為「以機率 <span class=\"fx\">p</span> 獲得貨幣 <span class=\"fx\">x</span>、以機率 <span class=\"fx\">q=(1-p)</span> 獲得貨幣 <span class=\"fx\">y</span>」，展望為 <span class=\"fx\">P<sub>r</sub>=[(p,q);(x,y)]</span>，期望效用函數：</li></ul>\n<p>EU(p<span class=\"mpunct\">,</span>q<span class=\"mpunct\">;</span>x<span class=\"mpunct\">,</span>y)=pU(x)+qU(y)，且 <span class=\"fx\">U'(x)>0, U'(y)>0</span>(p.260)。</p>\n<ul><li>賭局 <span class=\"fx\">A</span> 優於賭局 <span class=\"fx\">B</span>（<span class=\"fx\">P<sub>r</sub>=[(p',q');(x',y')]</span>）若且唯若：</li></ul>\n<p><span class=\"fx\">EU(p,q;x,y)=pU(x)+qU(y)\\gt EU(p',q';x',y')=p'U(x')+q'U(y')</span>(p.260)。</p>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>期望效用函數有兩項重要假設(p.261)：</li></ul>\n<ol><li><strong>狀態獨立（independent states）</strong>：<span class=\"fx\">x</span> 與 <span class=\"fx\">y</span> 兩種結果並不互相影響。</li><li>效用函數的「單調遞增線性轉換（Positive affine transformation）」後具有相同偏好結構（一般效用函數的單調遞增轉換保留偏好在此不成立，但線性轉換可以）。</li></ol>\n<ul><li>關鍵思維：消費者追求<strong>期望效用極大化</strong>，不是期望貨幣極大化(p.260)。</li></ul>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li>本節無獨立例題。</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>風險 vs. 不確定的定義區分；公平/有利/不利賭局的判斷（看 <span class=\"fx\">EM</span> 與 <span class=\"fx\">M</span> 或期望利潤正負）。</li><li>聖彼得堡矛盾的教訓：必須用「效用」而非「貨幣」決策。</li></ul>\n</div>\n</div>"}, {"id": "9.2", "title": "面對風險下之決策（印刷頁 262–271）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc72\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">風險趨避者（Risk averse）</div><div class=\"mc-body\"><div class=\"mc-formula\">貨幣邊際效用隨貨幣量增加而遞減，效用函數凹狀（Concave）。</div><div class=\"mc-detail\">貨幣邊際效用隨貨幣量增加而遞減，效用函數凹狀（Concave）(p.262)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc73\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">風險喜好者（Risk lover）</div><div class=\"mc-body\"><div class=\"mc-formula\">貨幣邊際效用隨貨幣量增加而遞增，效用函數凸狀（Convex）。</div><div class=\"mc-detail\">貨幣邊際效用隨貨幣量增加而遞增，效用函數凸狀（Convex）(p.264)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc74\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">風險中立者（Risk neutral）</div><div class=\"mc-body\"><div class=\"mc-formula\">貨幣邊際效用不隨貨幣變化而改變，效用函數為線性。</div><div class=\"mc-detail\">貨幣邊際效用不隨貨幣變化而改變，效用函數為線性(p.265)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc75\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">確定性等值（Certainty equivalence, C.E.）</div><div class=\"mc-body\"><div class=\"mc-formula\">在一個確定狀態下的所得水準，此水準所對應得到的效用，等於處於不確定狀態下所得到的預期效用水準。</div><div class=\"mc-detail\">在一個確定狀態下的所得水準，此水準所對應得到的效用，等於處於不確定狀態下所得到的預期效用水準(p.262)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc76\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">風險溢價（Risk premium, <span class=\"fx\">ρ</span>）</div><div class=\"mc-body\"><div class=\"mc-formula\">為了避免風險所願意支付的最大財富值；亦可視為風險的成本（Cost of risk）。</div><div class=\"mc-detail\">為了避免風險所願意支付的最大財富值；亦可視為風險的成本（Cost of risk）(p.263)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>風險趨避者特色(p.262)：</li></ul>\n<ol><li><span class=\"fx\">\\dfrac∂ MU<sub>m</sub>∂ M<0</span>（凹函數）；</li><li><span class=\"fx\">EU\\lt U(M<sub>0</sub>)</span>（期望貨幣值的效用大於效用的期望值）；</li><li>不參加公平賭局，願付風險溢價換取確定效用。</li></ol>\n<ul><li>風險溢價數學式：<span class=\"fx\">ρ=EM-C.E</span>，且 <span class=\"fx\">U(EM-ρ)=EU</span>；公平賭局下 <span class=\"fx\">EM=M<sub>0</sub></span>，故 <span class=\"fx\">U(M<sub>0</sub>-ρ)=EU</span>(p.263)。</li><li><strong>Arrow-Pratt 絕對風險趨避量度</strong>：<span class=\"fx\">R<sub>a</sub>(M)=-\\dfrac∂<sup>2</sup>U/∂ M<sup>2</sup>∂ U/∂ M</span>(p.263)。</li><li><strong>Arrow-Pratt 相對風險趨避量度</strong>：<span class=\"fx\">R<sub>r</sub>(M)=-\\dfrac∂<sup>2</sup>U/∂ M<sup>2</sup>∂ U/∂ M× M</span>(p.263)。</li></ul>\n<p>可化簡為 <span class=\"fx\">R<sub>r</sub>(M)=-\\dfracU''U'M=\\dfracd\\ln U'd\\ln M</span>，解讀為「所得邊際效用的所得彈性」(p.264)。</p>\n<ul><li>風險喜好者特色(p.264)：<span class=\"fx\">\\dfrac∂ MU<sub>m</sub>∂ M>0</span>（凸函數）；<span class=\"fx\">EU>U(M<sub>0</sub>)</span>；會參加公平賭局，其 C.E. 大於 <span class=\"fx\">EM</span>、風險溢價為負（要給予補償才不玩）。</li><li>風險中立者特色(p.265)：<span class=\"fx\">\\dfrac∂ MU<sub>m</sub>∂ M=0</span>（線性）；<span class=\"fx\">EU=U(EM)</span>；參加不參加公平賭局無差異，<span class=\"fx\">C.E.=EM</span>，風險溢價為 <span class=\"fx\">0</span>。</li><li><strong>Friedman–Savage 命題</strong>：貨幣效用函數在低所得時為凹函數、隨後變凸函數、高所得水準又變凹函數，有兩個反曲點 <span class=\"fx\">R<sub>1</sub></span> 與 <span class=\"fx\">R<sub>2</sub></span>——解釋同一人既買保險（趨避風險）又買彩券（喜好風險）(p.268)。</li><li><strong>保險決策（設定）</strong>：起始財富 <span class=\"fx\">M<sub>0</sub></span>；有 <span class=\"fx\">P</span> 機率損失 <span class=\"fx\">L</span>（財富變 <span class=\"fx\">M<sub>0</sub>-L</span>）；<span class=\"fx\">1-P</span> 機率無損失。</li></ul>\n<p><span class=\"fx\">EM=P(M<sub>0</sub>-L)+(1-P)M<sub>0</sub>=M<sub>0</sub>-PL\\lt M<sub>0</sub></span>（不利賭局，故風險趨避者會尋取保險）(p.268)。</p>\n<ul><li><strong>全險最適保費 <span class=\"fx\">Q<sup>*</sup></span></strong>：付 <span class=\"fx\">Q</span> 買全險，損失時得 <span class=\"fx\">L</span> 理賠，兩狀態財富皆為 <span class=\"fx\">M<sub>0</sub>-Q</span>，故</li></ul>\n<p><span class=\"fx\">U(M<sub>0</sub>-Q)=EU=P× U(M<sub>0</sub>-L)+(1-P)× U(M<sub>0</sub>)</span>(p.269)。</p>\n<ul><li><strong>部分理賠（Coverage <span class=\"fx\">q</span>，每單位保費 <span class=\"fx\">r</span>）</strong>：</li></ul>\n<p>損失狀態 <span class=\"fx\">M=M<sub>0</sub>-L+q-rq</span>；無損失狀態 <span class=\"fx\">M=M<sub>0</sub>-rq</span>（<span class=\"fx\">rq</span> 為保費）(p.270)。</p>\n<p>消費者最適化：<span class=\"fx\">\\max_\\q\\EU=P· U(M<sub>0</sub>-L+q-rq)+(1-P)U(M<sub>0</sub>-rq)</span></p>\n<p>FOC：<span class=\"fx\">\\dfrac∂ EU∂ q=0\\Leftrightarrow PU'(M<sub>0</sub>-L+q-rq)(q-r)=(1-P)U'(M<sub>0</sub>-rq)r</span>(p.270)。</p>\n<p>保險公司損益平衡：<span class=\"fx\">E(TR)=P(rq-q)+(1-P)rq=0⇒ r<sup>*</sup>=P</span>；帶回 FOC 得 <span class=\"fx\">M<sub>0</sub>-L+q-rq=M<sub>0</sub>-rq⇒ L=q</span>（<strong>公平保費下買全險</strong>）(p.270)。</p>\n<p>若保險公司要有利潤：<span class=\"fx\">E(TR)>0⇒ r<sup>*</sup>>P</span>，此時 <span class=\"fx\">M<sub>0</sub>-L+q-rq\\lt M<sub>0</sub>-rq⇒ q\\lt L</span>（<strong>買部分險</strong>）(p.271)。</p>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>三種態度比較表（公平賭局下）：</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"><col style=\"width:20.00%\"></colgroup><thead><tr><th>態度</th><th>函數形狀</th><th>邊際效用</th><th>關係式</th><th>是否參加公平賭局</th></tr></thead><tbody><tr><td>風險趨避</td><td>凹 Concave</td><td>遞減</td><td><span class=\"fx\">EU\\lt U(EM)=U(M<sub>0</sub>)</span></td><td>不參加</td></tr><tr><td>風險中立</td><td>直線</td><td>固定</td><td><span class=\"fx\">EU=U(EM)</span></td><td>無差異</td></tr><tr><td>風險喜好</td><td>凸 Convex</td><td>遞增</td><td><span class=\"fx\">EU>U(EM)=U(M<sub>0</sub>)</span></td><td>參加</td></tr></tbody></table></div>\n<ul><li><strong>非公平賭局下的決策</strong>(p.266–267)：</li><li>有利賭局 <span class=\"fx\">EM>M<sub>0</sub></span>：風險喜好者、中立者必參加；<strong>風險趨避者</strong>要分兩種——小利賭局 <span class=\"fx\">EM<sub>1</sub>>M<sub>0</sub></span> 但 <span class=\"fx\">EU</span> 仍小於確定效用故不參加；大利賭局 <span class=\"fx\">EM<sub>2</sub>>M<sub>0</sub></span> 且 <span class=\"fx\">EU</span> 大於確定效用才參加（利益大過一定程度才玩）。</li><li>不利賭局 <span class=\"fx\">EM\\lt M<sub>0</sub></span>：風險趨避者、中立者必不參加；<strong>風險喜好者</strong>要分兩種——小不利賭局 <span class=\"fx\">EM<sub>1</sub>\\lt M<sub>0</sub></span> 但 <span class=\"fx\">EU</span> 仍大於確定效用故仍參加；大不利賭局 <span class=\"fx\">EM<sub>2</sub>\\lt M<sub>0</sub></span> 且 <span class=\"fx\">EU</span> 小於確定效用才不參加（損失大過一定程度才不玩）。</li><li>幾何上風險溢價 <span class=\"fx\">ρ</span> 為 <span class=\"fx\">EM</span> 與 <span class=\"fx\">C.E.</span> 之水平距離；最適保險費 <span class=\"fx\">Q</span> 為 <span class=\"fx\">M<sub>0</sub></span> 與 <span class=\"fx\">C.E.</span> 之水平距離(p.269)。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">M</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">U(M)</text><path d=\"M80 220 Q200 80 380 45\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></path><text x=\"386\" y=\"46\" font-size=\"12\" fill=\"#1f3a5f\">U(M) 凹</text><line x1=\"110\" y1=\"200\" x2=\"360\" y2=\"55\" stroke=\"#b5542e\" stroke-width=\"1.6\"></line><text x=\"250\" y=\"120\" font-size=\"10\" fill=\"#b5542e\">弦=EU</text><circle cx=\"110\" cy=\"200\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"86\" y=\"215\" font-size=\"10\" fill=\"#1e7d32\">M1</text><circle cx=\"360\" cy=\"55\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"356\" y=\"72\" font-size=\"10\" fill=\"#1e7d32\">M2</text><circle cx=\"235\" cy=\"127\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"242\" y=\"124\" font-size=\"10\" fill=\"#6b4e8e\">EM=M0</text><line x1=\"235\" y1=\"127\" x2=\"235\" y2=\"230\" stroke=\"#6b4e8e\" stroke-dasharray=\"3 3\"></line></svg><p class=\"figcap\">風險趨避：U 凹，EU 低於 U(EM)，CE<em。(p.262)< p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 9.1</strong>： (p.264)：效用函數 <span class=\"fx\">U(w)=-e<sup>-2w</sup></span>，求 (1) <span class=\"fx\">R<sub>a</sub>(w)</span>、(2) <span class=\"fx\">R<sub>r</sub>(w)</span>、(3) 財富增加時 <span class=\"fx\">R<sub>a</sub>(w)</span> 如何變化。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：對 <span class=\"fx\">U</span> 取一階、二階導代入 Arrow-Pratt 公式計算（詳解見書末 QR）。</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 9.2</strong>： (p.265)：工作選擇——(1) 固定薪資 31,000 元<br>(2) 低薪 1 萬機率 0.6、高薪 62,500 機率 0.4。甲 <span class=\"fx\">U(I)=I<sup>0.5</sup></span>、乙 <span class=\"fx\">U(I)=I<sup>2</sup></span>、丙 <span class=\"fx\">U(I)=2I</span>，問三人風險態度與各自選擇。要點：分別算固定案與期望案的效用再比較，<span class=\"fx\">I<sup>0.5</sup></span> 為趨避、<span class=\"fx\">I<sup>2</sup></span> 為喜好、<span class=\"fx\">2I</span> 為中立。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 9.3</strong>： (p.266)：成績 A 機率 0.2（得 NT$500）、C 機率 0.6（無所得）、F 機率 0.2（賠 NT$300）；現有財富 NT$400、$U(w)=\\sqrt{w}$，求期望效用與確定等值。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 9.4</strong>： (p.270)：任任買 100 萬透天厝，<span class=\"fx\">U=√(Y)</span>；(1) 25% 火災燒毀之期望效用<br>(2) 繳 40 萬保費得完全理賠，會不會買<br>(3) 最多願意付多少保費避災。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li><li class=\"probitem\"><div class=\"pq\"><strong>例題 9.5</strong>： (p.271，台大財金)：現有 1400 萬、有 <span class=\"fx\">P</span> 機率損失 800 萬、<span class=\"fx\">U=\\ln C</span>，保險金額不得為負、不得高於 800 萬，每萬投保保費 0.4 萬。(1) <span class=\"fx\">P=0.25</span> 投保金額？<br>(2) <span class=\"fx\">P=0.35</span> 投保金額？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>三種風險態度的判斷（效用函數凹/直/凸、<span class=\"fx\">EU</span> 與 <span class=\"fx\">U(EM)</span> 大小）。</li><li><span class=\"fx\">C.E.</span>、<span class=\"fx\">ρ=EM-C.E.</span>、<span class=\"fx\">U(EM-ρ)=EU</span> 的定義與圖形位置。</li><li>Arrow-Pratt 絕對/相對風險趨避量度公式（必考代入計算，如例 9.1）。</li><li>非公平賭局：風險趨避者「大利才玩、小利不玩」；風險喜好者「小不利仍玩、大不利才不玩」。</li><li>保險：公平保費 <span class=\"fx\">r=P</span> 買全險 <span class=\"fx\">q=L</span>；不公平保費（有利润 <span class=\"fx\">r>P</span>）買部分險 <span clas
