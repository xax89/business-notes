><span class=\"fx\">A</span></th><th><span class=\"fx\">B</span></th></tr></thead>\n<tbody>\n<tr><td><span class=\"fx\">X</span></td><td>20</td><td>40</td></tr>\n<tr><td><span class=\"fx\">Y</span></td><td>40</td><td>50</td></tr>\n</tbody></table></div>\n<p><strong>1. <span class=\"fx\">A</span> 國生產可能線</strong>：<span class=\"fx\">\\bar F=20X<sub>A</sub>+40Y<sub>A</sub></span>，故 <span class=\"fx\">MRT<sub>XY</sub>=\\dfrac∂\\bar F/∂ X<sub>A</sub>∂\\bar F/∂ Y<sub>A</sub>=\\dfrac12</span>；代表 <span class=\"fx\">A</span> 國增加一單位 <span class=\"fx\">X</span> 生產的機會成本為 <span class=\"fx\">\\dfrac12</span> 單位 <span class=\"fx\">Y</span>，且增加一單位 <span class=\"fx\">Y</span> 生產的機會成本為 2 單位 <span class=\"fx\">X</span>(p.621)。</p>\n<p><strong>2. <span class=\"fx\">B</span> 國生產可能線</strong>：<span class=\"fx\">\\bar F=40X<sub>B</sub>+50Y<sub>B</sub></span>，故 <span class=\"fx\">MRT<sub>XY</sub>=\\dfrac∂\\bar F/∂ X<sub>B</sub>∂\\bar F/∂ Y<sub>B</sub>=\\dfrac45</span>；代表 <span class=\"fx\">B</span> 國增加一單位 <span class=\"fx\">X</span> 生產的機會成本為 <span class=\"fx\">\\dfrac45</span> 單位 <span class=\"fx\">Y</span>，且增加一單位 <span class=\"fx\">Y</span> 生產的機會成本為 <span class=\"fx\">\\dfrac54</span> 單位 <span class=\"fx\">X</span>(p.622)。</p>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>(1) <span class=\"fx\">A</span> 國會專業生產 <span class=\"fx\">X</span> 出口交換 <span class=\"fx\">Y</span>；但若 TOT=\\dfrac{1}{3}<\\dfrac{1}{2}，貿易後一單位 <span class=\"fx\">X</span> 只能換得 <span class=\"fx\">\\dfrac13</span> 單位 <span class=\"fx\">Y</span>，<span class=\"fx\">A</span> 國便無誘因專業化生產 <span class=\"fx\">X</span> 出口——故 <span class=\"fx\">TOT</span> 必須大於 <span class=\"fx\">\\dfrac12</span> 才行。</li>\n<li>(2) <span class=\"fx\">B</span> 國會專業生產 <span class=\"fx\">Y</span> 出口交換 <span class=\"fx\">X</span>；但若 TOT=1>\\dfrac{4}{5}，貿易後一單位 <span class=\"fx\">Y</span> 只能換得 1 單位 <span class=\"fx\">X</span>（而不貿易時一單位 <span class=\"fx\">X</span> 可換 <span class=\"fx\">\\dfrac45</span> 單位 <span class=\"fx\">Y</span>、一單位 <span class=\"fx\">Y</span> 可換 <span class=\"fx\">\\dfrac54=1.2</span> 單位 <span class=\"fx\">X</span>），<span class=\"fx\">B</span> 國便無誘因專業化生產 <span class=\"fx\">Y</span> 出口——故 <span class=\"fx\">TOT</span> 必須小於 <span class=\"fx\">\\dfrac45</span> 才行。</li>\n<li>(3) 綜上，最後均衡的貿易條件必介於兩國貿易前相對價格比之間：</li></ul></div>\n<p>\\dfrac{P_X^A}{P_Y^A}=\\dfrac{C_X l_{AX}}{C_Y l_{AY}}=\\dfrac{l_{AX}}{l_{AY}}<tot<\\dfrac{p_x^b}{p_y^b}=\\dfrac{c_x l_{bx}}{c_y l_{by}}=\"\\dfrac{l_{BX}}{l_{BY}}</p\">\n<p>以上討論假設 <span class=\"fx\">C<sub>X</sub>=C<sub>Y</sub></span>(p.622)。</p>\n<h4 class=\"sub3\">（五）其他非關稅貿易障礙(p.622–623)</h4>\n<p><strong>1. 反傾銷稅 Antidumping Duties(p.622)</strong>：當發生國外廠商對本國傾銷時，雖對國內消費者有利，但對國內生產者不利。本國政府遂對該商品實施反傾銷措施，藉由對該商品課徵租稅，降低該商品在國內市場的競爭力。</p>\n<p><strong>2. 對銷稅／平衡稅 Countervailing Duties(p.623)</strong>：或稱平衡稅，定義為抵銷（某政府）對一商品的製造、生產、出口所提供的直接或間接補貼或獎勵而設定的特別稅。</p>\n<ol><li>當一國發現其進口商品的出口國對該商品採取出口補貼措施，造成出口國商品在該國競爭力提高時，進口國就對該進口商品課徵租稅，稱為對銷或平衡稅。</li>\n<li>對傾銷課徵的稅稱之為反傾銷稅；反制出口補貼的稅則稱為平衡稅(p.623)。</li></ol>\n<h4 class=\"sub3\">（四）區域整合型態(p.623)</h4>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:28\"><col style=\"width:36\"><col style=\"width:36\"></colgroup>\n<thead><tr><th>型態</th><th>名稱</th><th>內容（逐級遞進）</th></tr></thead>\n<tbody>\n<tr><td>1</td><td>優惠貿易區 Preferential trade area</td><td>會員國之間彼此降低關稅稅率與貿易障礙，但對非會員國各自維持較高的貿易障礙。</td></tr>\n<tr><td>2</td><td>自由貿易區 Free trade area</td><td>區域內國家間彼此取消關稅並進行自由貿易；對區域外國家，各自設定關稅障礙。</td></tr>\n<tr><td>3</td><td>關稅同盟 Custom Union</td><td>對外採取共同的關稅稅率，但會員國之間採取自由貿易。</td></tr>\n<tr><td>4</td><td>共同市場／單一市場 Common market / Single market</td><td>除去商品貿易障礙，還容許生產要素在會員國間可以自由移動。</td></tr>\n<tr><td>5</td><td>經濟同盟 Economic Union</td><td>由共同市場推廣至會員國間採行一致的財政、貿易等經濟政策，甚至使用共同貨幣。</td></tr>\n</tbody></table></div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點（Ch20 總覽）</div>\n<ul><li>小國 vs 大國：大國獨有「貿易條件效果」（關稅為正、出口補貼為負）；小國最適關稅＝0。</li><li>關稅福利四分法：消費者剩餘減少、生產者剩餘增加、政府關稅收入、無謂損失（消費扭曲＋生產扭曲兩三角）。</li><li>出口補貼：小國亦有兩扭曲損失；大國再額外加上貿易條件惡化，必然更不利。</li><li>配額租的歸屬：配額（本國拿）vs VER（外國拿，故 VER 最傷進口國）。</li><li>完全競爭下關稅＝配額（等價）；不完全競爭或考慮動態調整則不等價。</li></ul>\n</div>\n\n</main>\n</div>\n<button id=\"topBtn\" aria-label=\"回到頂部\"><svg width=\"20\" height=\"20\" viewbox=\"0 0 24 24\" fill=\"none\" stroke=\"white\" stroke-width=\"2.4\"><path d=\"M12 19V5M5 12l7-7 7 7\"></path></svg></button>\n"}]};

function getProgressState(){
  let mc={};try{mc=JSON.parse(localStorage.getItem("mc_learned_v1")||"{}")}catch(e){}
  let dn={};try{dn=JSON.parse(localStorage.getItem("macro_done_v1")||"{}")}catch(e){}
  return {mc,dn};
}
function chapterProgress(n){
  const {mc,dn}=getProgressState();
  const secs=CH_SECTIONS[n]||[];
  let total=0,done=0;
  secs.forEach(sec=>{
    const keys=[...sec.body.matchAll(/data-mc="([^"]+)"/g)].map(m=>m[1]);
    total+=keys.length;done+=keys.filter(k=>mc[k]).length;
  });
  const probs=CH_PROBLEMS[n]||[];
  total+=probs.length;done+=probs.filter((_,i)=>dn[n+"-"+(i+1)]).length;
  return {done,total,pct:total?Math.round(done/total*100):0};
}

function refreshProgress(n){
  const {mc}=getProgressState();
  const secs=CH_SECTIONS[n]||[];
  const strip=document.querySelector(".progress-strip");
  const label=document.querySelector(".progress-label");
  if(strip&&label){
    const secMc=secs.map(x=>[...x.body.matchAll(/data-mc="([^"]+)"/g)].map(m=>m[1]));
    strip.innerHTML=secMc.map(a=>`<i class="${a.length?(a.every(k=>mc[k])?'done':''):'na'}"></i>`).join("");
    const t=secMc.filter(a=>a.length).length,d=secMc.filter(a=>a.length&&a.every(k=>mc[k])).length;
    label.textContent="本章方法卡小節已完成 "+d+" / "+t+(t?"（"+Math.round(d/t*100)+"%）":"（本章無方法卡）");
  }
  const probProg=document.getElementById("probProgress");
  if(probProg){
    const {dn}=getProgressState();
    const probs=CH_PROBLEMS[n]||[];
    probProg.textContent="（已做 "+probs.filter((_,i)=>dn[n+"-"+(i+1)]).length+" / "+probs.length+"）";
  }
  const tag=document.querySelector('.nav-chapter[data-ch="'+n+'"] .tag');
  if(tag){const pct=chapterProgress(n).pct;tag.textContent=pct>=100?"✓ 100%":pct+"%";}
}

      if(ch.done){renderChapter(ch.n);window.scrollTo({top:0,behavior:"smooth"});closeNav();}
      else{toast("第 "+ch.n+" 章尚未建置");}
    });
  });
  sb.querySelectorAll(".nav-sub").forEach(b=>{
    b.addEventListener("click",()=>{
      const ch=BOOK[+b.dataset.ch-1];
      if(!ch.done){toast("第 "+ch.n+" 章尚未建置");return;}
      closeNav();
      if(currentChapter!==+b.dataset.ch)renderChapter(+b.dataset.ch);
      const el=document.getElementById("sec-"+b.dataset.sec);
      if(!el)return;
      if(!el.classList.contains("open")){const h=el.querySelector(".section-head");if(h)h.click();}
      setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),60);
    });
  });
}

function renderChapter(n){
  currentChapter=n;
  renderSidebar();
  const book=BOOK[n-1];
  const sections=CH_SECTIONS[n]||[];
  const problems=CH_PROBLEMS[n]||[];
  const c=document.getElementById("chapterContent");
  const favStoreKey="micro_fav_v1";
  let favState={};try{favState=JSON.parse(localStorage.getItem(favStoreKey)||"{}")}catch(e){}
  let doneState={};try{doneState=JSON.parse(localStorage.getItem("macro_done_v1")||"{}")}catch(e){}
  const favPool={};
  let h=`<div class="chapter-head">
    <span class="kicker">第 ${n} 章</span>
    <h1>第${n}章 ${esc(book.title)}</h1>
    <div class="chpage">${book.page}</div>

  </div>`;
  sections.forEach((s,i)=>{
    h+=`<section class="section" id="sec-${s.id}">
      <div class="section-head" onclick="toggleSec(this)">
        <span class="sec-num">${s.id}</span><span>${esc(s.title)}</span>

      <div class="section-body">${s.body}</div>
    </section>`;
  });
  h+=`<div class="chapter-head" style="margin-top:26px"><h1 style="font-size:22px">例題演練 <span class="prob-progress" id="probProgress"></span></h1><p>先自己作答，再點「顯示答案」核對。</p></div>`;
  problems.forEach((p,i)=>{
    const fk=n+"-"+(i+1);
    favPool[fk]={t:"第 "+n+" 章 · 例題 "+(i+1),q:p.q+(p.opts.length?`<div class="opts">${p.opts.map(o=>`<div>${o}</div>`).join("")}</div>`:""),a:p.ans};
    const isFav=!!favState[fk];
    const isDone=!!doneState[fk];
    h+=`<div class="problem" id="prob-${n}-${i+1}">
      <div class="p-head"><button class="done-btn ${isDone?"on":""}" data-done="${fk}" title="標記已做過">${isDone?"☑ 做過":"☐ 做過"}</button><span>例題 ${i+1}</span><button class="fav ${isFav?"on":""}" data-fav="${fk}">${isFav?"★ 已收藏":"☆ 收藏"}</button></div>
      <div class="p-body"><p>${p.q}</p>${p.opts.length?`<div class="opts">${p.opts.map(o=>`<div>${o}</div>`).join("")}</div>`:""}
      <button class="ans-btn" onclick="toggleAns(this)">顯示答案</button>
      <div class="ans"><span class="a-label">解答</span>：${p.ans}</div></div>
    </div>`;
  });
  h+=`<div class="chapter-head" style="margin-top:26px"><h1 style="font-size:22px">本章術語</h1><p>本章出現的術語：打勾＝已學會、★重點、✎筆記。全書術語總表在左側「術語複習表」。</p></div>
  <div id="chGlossRoot"></div>`;
  c.innerHTML=h;

  glossMode="chapter";glossChapter=n;
  renderGlossary();

  // 例題收藏（錯題收集，存本機，與題庫頁共用 micro_fav_v1）
  c.querySelectorAll(".fav").forEach(b=>{
    b.addEventListener("click",()=>{
      const k=b.dataset.fav;
      if(favState[k]){delete favState[k];}else{favState[k]=favPool[k];}
      try{localStorage.setItem(favStoreKey,JSON.stringify(favState));}catch(e){}
      const on=!!favState[k];
      b.classList.toggle("on",on);
      b.textContent=on?"★ 已收藏":"☆ 收藏";
    });
  });

  // 例題做過標記（存 macro_done_v1）
  refreshProgress(n);
  c.querySelectorAll(".done-btn").forEach(b=>{
    b.addEventListener("click",()=>{
      const k=b.dataset.done;
      if(doneState[k]){delete doneState[k];}else{doneState[k]=true;}
      try{localStorage.setItem("macro_done_v1",JSON.stringify(doneState));}catch(e){}
      const on=!!doneState[k];
      b.classList.toggle("on",on);
      b.textContent=on?"☑ 做過":"☐ 做過";
      refreshProgress(n);
    });
  });

  // 術語點擊（文內：課文名詞＋專有名詞都可開知識卡）
  c.querySelectorAll(".term,.proper").forEach(t=>{
    if(!t.dataset.term)return;
    t.addEventListener("click",e=>{e.stopPropagation();openTerm(t.dataset.term);});
  });
  // 方法學習卡打勾（學會標記，存本機；學會＝刪除線＋黯淡）
  const mcKey="mc_learned_v1";
  let mcState={};try{mcState=JSON.parse(localStorage.getItem(mcKey)||"{}")}catch(e){}
  c.querySelectorAll(".method-card input[type=checkbox]").forEach(cb=>{
    const k=cb.dataset.mc;
    const card=cb.closest(".method-card");
    const apply=()=>card.classList.toggle("learned",cb.checked);
    cb.checked=!!mcState[k];
    apply();
    cb.addEventListener("change",()=>{mcState[k]=cb.checked;localStorage.setItem(mcKey,JSON.stringify(mcState));apply();refreshProgress(n);});
  });
  // 套用已存高亮
  applyHighlights();
}

  renderGlossary();
}
function glossCatsForMode(){
  if(glossMode==="full")return GLOSS_CATS;
  const names=CH_TERMS_CATS[glossChapter]||[];
  return GLOSS_CATS.filter(c=>names.includes(c.name));
}
function renderGlossary(){
  const root=document.getElementById(glossMode==="full"?"glossFullRoot":"chGlossRoot");
  if(!root)return;
  const learned=GLS.get("micro-gloss-learned",[]);
  const starred=GLS.get("micro-gloss-star",[]);
  const notes=GLS.get("micro-gloss-notes",{});
  const cats=glossCatsForMode();
  const allKeys=cats.flatMap(c=>c.keys).filter(k=>TERMS[k]);
  const total=allKeys.length;
  const done=allKeys.filter(k=>learned.includes(k)).length;

  let h=`<div class="gloss-toolbar">
    <div class="gloss-cats">`;
  if(glossMode==="full"){
    h+=`<button class="gloss-cat-btn ${glossCat==="all"?"active":""}" data-cat="all">全部（${total}）</button>
      ${cats.map(c=>`<button class="gloss-cat-btn ${glossCat===c.name?"active":""}" data-cat="${esc(c.name)}">${esc(c.name)}（${c.keys.filter(k=>TERMS[k]).length}）</button>`).join("")}`;
  }else{
    h+=`<span class="gloss-cat-label">本章術語 · ${cats.map(c=>esc(c.name)).join(" ／ ")}</span>`;
  }
  h+=`</div>
    <div class="gloss-data-actions">
      <button class="toolbtn ${glossOnlyUnlearned?"active":""}" id="onlyUnlearned" title="只看未學會">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </button>
      <button class="toolbtn" id="exportGloss" title="匯出備份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="toolbtn" id="importGloss" title="匯入備份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0 4 4m-4-4-4 4M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>
  </div>
  <div class="gloss-progress">
    <div class="bar"><div class="fill" style="width:${total?done/total*100:0}%"></div></div>
    <div class="label">已學會 ${done} / ${total}</div>
  </div>`;

  cats.forEach(cat=>{
    if(glossMode==="full"&&glossCat!=="all"&&glossCat!==cat.name)return;
    const items=cat.keys.filter(k=>TERMS[k]);
    if(!items.length)return;
    const catDone=items.filter(k=>learned.includes(k)).length;
    h+=`<div class="gloss-group" data-gname="${esc(cat.name)}">
      <h3>${esc(cat.name)}（${catDone}/${items.length}）</h3>
      ${items.map(k=>{
        const [en,zh,def]=TERMS[k];
        const isLearned=learned.includes(k), isStarred=starred.includes(k);
        const note=notes[k]||"";
        if(glossOnlyUnlearned&&isLearned)return "";
        const isProper=PROPER_TERMS.has(k);
        return `<div class="gloss-item ${isLearned?"done":""} ${isStarred?"starred":""}" data-key="${esc(k)}">
          <button class="gloss-check ${isLearned?"done":""}" onclick="toggleLearn(&quot;${escA(k)}&quot;)" title="標記已學會">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 13 4 4L19 7"/></svg>
          </button>
          <div class="gloss-main">
            <div class="gloss-en${isProper?" proper":""}">${esc(en)}<span class="gloss-zh${isProper?" proper":""}">${esc(zh)}</span></div>
            <div class="gloss-def">${esc(def)}</div>
            <div class="gloss-note ${note?"show":""}" data-note="wrap-${esc(k)}">
              <textarea placeholder="寫下你自己的重點…" onchange="saveNote('${esc(k)}',this.value)">${esc(note)}</textarea>
            </div>
          </div>
          <div class="gloss-actions">
            <button class="gloss-btn ${isStarred?"active":""}" onclick="toggleStar(&quot;${escA(k)}&quot;)" title="重點畫記">★ 重點</button>
            <button class="gloss-btn ${note?"active":""}" onclick="toggleNote(&quot;${escA(k)}&quot;)" title="個人筆記">✎ 筆記</button>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  });

  root.innerHTML=h;
  if(glossMode==="full"){
    root.querySelectorAll(".gloss-cat-btn").forEach(b=>{
      b.addEventListener("click",()=>{glossCat=b.dataset.cat;renderGlossary();});
    });
  }
  document.getElementById("onlyUnlearned").addEventListener("click",e=>{
    glossOnlyUnlearned=!glossOnlyUnlearned;
    e.currentTarget.classList.toggle("active",glossOnlyUnlearned);
    renderGlossary();
  });
  document.getElementById("exportGloss").addEventListener("click",exportGloss);
  document.getElementById("importGloss").addEventListener("click",()=>{
    const inp=document.createElement("input");
    inp.type="file";inp.accept=".json";
    inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importGloss(r.result);r.readAsText(f);};
    inp.click();
  });
}
function toggleLearn(k){
  let l=GLS.get("micro-gloss-learned",[]);
  l=l.includes(k)?l.filter(x=>x!==k):[...l,k];
  GLS.set("micro-gloss-learned",l);
  renderGlossary();
}
function toggleStar(k){
  let s=GLS.get("micro-gloss-star",[]);
  s=s.includes(k)?s.filter(x=>x!==k):[...s,k];
  GLS.set("micro-gloss-star",s);
  renderGlossary();
}
function toggleNote(k){
  const wrap=document.querySelector(`[data-note="wrap-${k}"]`);
  if(wrap)wrap.classList.toggle("show");
}
function saveNote(k,v){
  const notes=GLS.get("micro-gloss-notes",{});
  notes[k]=v;
  GLS.set("micro-gloss-notes",notes);
  renderGlossary();
}
function exportGloss(){
  const data={learned:GLS.get("micro-gloss-learned",[]),star:GLS.get("micro-gloss-star",[]),notes:GLS.get("micro-gloss-notes",{})};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="總經術語備份.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已匯出備份");
}
function importGloss(jsonStr){
  try{
    const d=JSON.parse(jsonStr);
    if(d.learned&&Array.isArray(d.learned)){
      const cur=GLS.get("micro-gloss-learned",[]);
      GLS.set("micro-gloss-learned",[...new Set([...cur,...d.learned])]);
    }
    if(d.star&&Array.isArray(d.star)){
      const cur=GLS.get("micro-gloss-star",[]);
      GLS.set("micro-gloss-star",[...new Set([...cur,...d.star])]);
    }
    if(d.notes&&typeof d.notes==="object"){
      const cur=GLS.get("micro-gloss-notes",{});
      GLS.set("micro-gloss-notes",{...cur,...d.notes});
    }
    toast("已匯入並合併備份");
    renderGlossary();
  }catch(e){toast("備份檔案格式錯誤");}
}

/* ===== 全書搜尋 ===== */
const searchInput=document.getElementById("searchInput");
const searchPanel=document.getElementById("searchPanel");
function stripHtml(t){return String(t||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();}
function buildSearchIndex(){
  const idx=[];
  BOOK.forEach(ch=>{
    if(!ch.done)return;
    const n=ch.n;
    idx.push({type:"ch",n,title:ch.title,text:ch.title});
    (CH_SECTIONS[n]||[]).forEach(sec=>{
      idx.push({type:"sec",n,id:sec.id,title:sec.title,text:sec.title+" "+stripHtml(sec.body)});
    });
    (CH_PROBLEMS[n]||[]).forEach((p,i)=>{
      idx.push({type:"prob",n,no:i+1,text:stripHtml(p.q)+" "+stripHtml(p.ans||"")});
    });
  });
  Object.keys(TERMS).forEach(k=>{
    const [en,zh,def]=TERMS[k];
    idx.push({type:"term",key:k,en,zh,def,text:en+" "+zh+" "+def});
  });
  return idx;
}
const SEARCH_IDX=buildSearchIndex();
searchInput.addEventListener("input",()=>{
  const kw=searchInput.value.trim().toLowerCase();
  if(!kw){searchPanel.style.display="none";return;}
  const hits=SEARCH_IDX.filter(x=>x.text.toLowerCase().includes(kw)).slice(0,40);
  if(!hits.length){
    searchPanel.innerHTML=`<div class="sp-empty">找不到「${esc(kw)}」相關內容，試試其他關鍵字。</div>`;
    searchPanel.style.display="block";return;
  }
  searchPanel.innerHTML=hits.map(h=>{
    if(h.type==="ch")return `<button class="sp-item" data-act="ch" data-n="${h.n}"><span class="sp-tag">第${h.n}章</span><b>${esc(h.title)}</b><span class="sp-snip">整章內容</span></button>`;
    if(h.type==="sec")return `<button class="sp-item" data-act="sec" data-n="${h.n}" data-id="${esc(h.id)}"><span class="sp-tag">第${h.n}章·小節</span><b>${esc(h.title)}</b><span class="sp-snip">${esc(h.text.slice(0,70))}</span></button>`;
    if(h.type==="prob")return `<button class="sp-item" data-act="prob" data-n="${h.n}" data-no="${h.no}"><span class="sp-tag">第${h.n}章·例題${h.no}</span><span class="sp-snip">${esc(h.text.slice(0,80))}</span></button>`;
    return `<button class="sp-item" data-act="term" data-key="${esc(h.key)}"><span class="sp-tag">術語</span><b>${esc(h.en)} ${esc(h.zh)}</b><span class="sp-snip">${esc(h.def.slice(0,60))}</span></button>`;
  }).join("")+`<div class="sp-count">找到 ${hits.length} 筆相關內容</div>`;
  searchPanel.style.display="block";
});
searchPanel.addEventListener("click",e=>{
  const item=e.target.closest(".sp-item");
  if(!item)return;
  const act=item.dataset.act;
  searchPanel.style.display="none";
  searchInput.value="";
  if(act==="ch"){
    renderChapter(+item.dataset.n);
    window.scrollTo({top:0,behavior:"smooth"});
  }else if(act==="sec"){
    renderChapter(+item.dataset.n);
    setTimeout(()=>{
      const el=document.getElementById("sec-"+item.dataset.id);
      if(el){el.classList.add("open");el.scrollIntoView({behavior:"smooth",block:"start"});}
    },60);
  }else if(act==="prob"){
    renderChapter(+item.dataset.n);
    setTimeout(()=>{
      const el=document.getElementById("prob-"+item.dataset.n+"-"+item.dataset.no);
      if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
    },60);
  }else if(act==="term"){
    openTerm(item.dataset.key);
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){searchPanel.style.display="none";searchInput.blur();}
});


/* ===== 重點標記 ===== */
let hlEnabled=true;
function getHls(){try{return JSON.parse(localStorage.getItem("micro-hl")||"[]")}catch(e){return[]}}
function saveHls(h){localStorage.setItem("micro-hl",JSON.stringify(h))}

document.addEventListener("mouseup",e=>{
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed)return;
  const txt=sel.toString().trim();
  if(txt.length<2||txt.length>300)return;
  // 檢查是否點在工具列/按鈕上
  if(e.target.closest(".toolbtn,.ans-btn,.flip-card,.term,.section-head"))return;
  const range=sel.getRangeAt(0);
  const el=range.startContainer.parentElement;
  if(!el.closest(".section-body,.problem"))return;
  const hls=getHls();
  if(hls.some(h=>h.txt===txt))return;
  hls.push({txt,time:Date.now()});
  saveHls(hls);
  applyHighlights();
  toast("已加入重點標記（點黃色文字可移除）");
});

function applyHighlights(){
  const hls=getHls();
  document.querySelectorAll(".section-body .userhl,.problem .userhl").forEach(el=>el.outerHTML=el.textContent);
  if(!hlEnabled)return;
  hls.forEach(h=>{
    document.querySelectorAll(".section-body p,.section-body .note,.section-body .warn,.problem .p-body").forEach(block=>{
      const text=block.textContent;
      if(!text.includes(h.txt))return;
      if(block.querySelector(".userhl"))return;
      const idx=text.indexOf(h.txt);
      const frag=document.createDocumentFragment();
      frag.appendChild(document.createTextNode(text.slice(0,idx)));
      const m=document.createElement("mark");
      m.className="userhl";m.textContent=h.txt;
      m.addEventListener("click",()=>{
        const arr=getHls().filter(x=>x.txt!==h.txt);
        saveHls(arr);applyHighlights();toast("已移除重點標記");
      });
      frag.appendChild(m);
      frag.appendChild(document.createTextNode(text.slice(idx+h.txt.length)));
      block.replaceChildren(frag);
    });
  });
}

document.getElementById("hlToggle").addEventListener("click",e=>{
  hlEnabled=!hlEnabled;
  e.currentTarget.classList.toggle("active",hlEnabled);
  applyHighlights();
  toast(hlEnabled?"重點標記已顯示":"重點標記已隱藏");
});

/* ===== toast ===== */
function toast(msg){
  let t=document.getElementById("toast");
  if(!t){
    t=document.createElement("div");
    t.id="toast";
    t.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#26303b;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.2);opacity:0;transition:opacity .25s;pointer-events:none";
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity="1";
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.style.opacity="0",1800);
}

function toggleProb(btn){

/* ===== 例題收藏（與題庫頁共用 micro_fav_v1，MutationObserver 掛載） ===== */
(function(){
  var KEY='micro_fav_v1';
  function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){return {};}}
  function save(o){localStorage.setItem(KEY,JSON.stringify(o));}
  function bind(){
    var fav=load();
    document.querySelectorAll('.probitem').forEach(function(it){
      if(it.querySelector('.favbtn'))return;
      var strong=it.querySelector('.pq strong');
      if(!strong)return;
      var m=strong.textContent.match(/例題\s*([\d.]+)/);
      var id=m?('prob-'+m[1].replace('.','-')):null;
      if(!id)return;
      var btn=document.createElement('button');
      btn.type='button';btn.className='favbtn'+(fav[id]?' on':'');btn.textContent=fav[id]?'★ 已收藏':'☆ 收藏';
      btn.title='收藏此題';
      btn.addEventListener('click',function(){
        if(fav[id]){delete fav[id];btn.className='favbtn';btn.textContent='☆ 收藏';}
        else{
          fav[id]={t:strong.textContent.replace(/[：:].*$/,''),q:it.querySelector('.pq')?it.querySelector('.pq').innerText:'',a:it.querySelector('.pans')?it.querySelector('.pans').innerText.replace(/^書中解法要點：?/,''):''};
          btn.className='favbtn on';btn.textContent='★ 已收藏';
        }
        save(fav);
      });
      var pq=it.querySelector('.pq');
      if(pq)pq.appendChild(btn);
    });
  }
  bind();
  var cc=document.getElementById('chapterContent');
  if(cc){
    new MutationObserver(function(){bind();}).observe(cc,{childList:true,subtree:true});
  }
})();
/* ===== 名詞懸浮字義（查 TERMS，事件委派） ===== */
(function(){
  var idx={};
  if(typeof TERMS!=='undefined'){
    Object.keys(TERMS).forEach(function(k){
      var e=TERMS[k];
      if(e[1])idx[e[1]]=k;
      if(e[2])idx[e[2]]=k;
    });
  }
  var tip=document.createElement('div');
  tip.className='gtip';
  tip.innerHTML='<div class="gt-en"></div><div class="gt-def"></div>';
  document.body.appendChild(tip);
  var enEl=tip.querySelector('.gt-en'), defEl=tip.querySelector('.gt-def');
  var curEl=null;
  function lookup(key){
    var k=key.replace(/[（(].*?[)）]/g,'').trim();
    if(idx[k])return TERMS[idx[k]];
    var hit=null;
    for(var kk in idx){ if(idx.hasOwnProperty(kk)&&kk.length>=2&&(k.indexOf(kk)>-1||kk.indexOf(k)>-1)){hit=TERMS[idx[kk]];break;} }
    return hit;
  }
  function showFor(el){
    var key=el.textContent.trim();
    var hit=lookup(key);
    if(!hit)return;
    var isProper=el.classList.contains('proper');
    var col=isProper?'#7b2cbf':'#1e7d32';
    enEl.textContent=key+(hit[1]?'  '+hit[1]:'');
    enEl.style.color=col;
    defEl.textContent=hit[2]||'';
    tip.style.display='block';
    var r=el.getBoundingClientRect();
    var x=Math.min(Math.max(8,r.left),window.innerWidth-350);
    var y=r.bottom+8;
    tip.style.left=x+'px';tip.style.top=y+'px';
    var tr=tip.getBoundingClientRect();
    if(tr.bottom>window.innerHeight){tip.style.top=(r.top-tr.height-8)+'px';}
  }
  document.addEventListener('mouseover',function(e){
    var el=e.target.closest?e.target.closest('.term,.proper'):null;
    if(!el)return;
    curEl=el;
    showFor(el);
  });
  document.addEventListener('mouseout',function(e){
    var el=e.target.closest?e.target.closest('.term,.proper'):null;
    if(el&&el===curEl){tip.style.display='none';curEl=null;}
  });
  document.addEventListener('click',function(e){
    var el=e.target.closest?e.target.closest('.term,.proper'):null;
    if(el)showFor(el);
  });
})();

/* ===== 側欄 scroll spy ===== */
(function(){
  function update(){
    var secs=document.querySelectorAll('.section');
    var cur=null, vp=window.innerHeight*0.35;
    secs.forEach(function(s){var r=s.getBoundingClientRect();if(r.top<=vp&&r.bottom>0)cur=s.id;});
    if(!cur&&secs.length){var last=secs[secs.length-1];if(last.getBoundingClientRect().top<vp)cur=last.id;}
    document.querySelectorAll('.nav-sub.active').forEach(function(a){a.classList.remove('active');});
    if(cur)document.querySelectorAll('.nav-sub').forEach(function(a){if(a.dataset.sec===cur.replace('sec-',''))a.classList.add('active');});
  }
  window.addEventListener('scroll',update,{passive:true});
  window.addEventListener('resize',update);
  setTimeout(update,400);
})();
