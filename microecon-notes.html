iv>\n      <div class=\"mc-ex\"><b>例子：</b>蛛網模型中，供給彈性小於需求彈性時收斂（穩定），反之發散（不穩定）。</div>\n    </div>\n  </div>\n<h4 class=\"cmp\">概念比較</h4>\n<div class=\"tblwrap\"><table>\n<caption>超額需求與超額供給：價格失衡時的兩種狀態</caption>\n<colgroup><col style=\"width:24%\"><col style=\"width:38%\"><col style=\"width:38%\"></colgroup>\n<thead><tr><th>比較項目</th><th>超額需求 ED／短缺（Shortage）</th><th>超額供給 ES／過剩（Surplus）</th></tr></thead>\n<tbody>\n<tr><td>發生條件</td><td>價格 <b>低於</b> 均衡價格</td><td>價格 <b>高於</b> 均衡價格</td></tr>\n<tr><td>市場狀態</td><td>需求量 ＞ 供給量（供不應求）</td><td>供給量 ＞ 需求量（供過於求）</td></tr>\n<tr><td>價格調整</td><td>價格 <b>上升</b> 回到均衡</td><td>價格 <b>下降</b> 回到均衡</td></tr>\n<tr><td>數量調整</td><td>需求量減少、供給量增加</td><td>需求量增加、供給量減少</td></tr>\n</tbody></table></div><div class=\"tblwrap\"><table>\n<caption>供需移動法則：外生變數改變對均衡的影響</caption>\n<colgroup><col style=\"width:34%\"><col style=\"width:33%\"><col style=\"width:33%\"></colgroup>\n<thead><tr><th>移動情況</th><th>均衡價格 P*</th><th>均衡數量 Q*</th></tr></thead>\n<tbody>\n<tr><td>需求右移（供給不動）</td><td><b>上升</b></td><td><b>上升</b></td></tr>\n<tr><td>需求左移（供給不動）</td><td><b>下降</b></td><td><b>下降</b></td></tr>\n<tr><td>供給右移（需求不動）</td><td><b>下降</b></td><td><b>上升</b></td></tr>\n<tr><td>供給左移（需求不動）</td><td><b>上升</b></td><td><b>下降</b></td></tr>\n<tr><td>供需同時右移</td><td>不一定（視移動幅度）</td><td><b>一定上升</b></td></tr>\n<tr><td>供需同時左移</td><td>不一定（視移動幅度）</td><td><b>一定下降</b></td></tr>\n</tbody></table></div><div class=\"tblwrap\"><table>\n<caption>經濟學分析方法：靜態、比較靜態與動態分析</caption>\n<colgroup><col style=\"width:22%\"><col style=\"width:39%\"><col style=\"width:39%\"></colgroup>\n<thead><tr><th>比較項目</th><th>靜態分析（Static）</th><th>比較靜態分析（Comparative static）</th></tr></thead>\n<tbody>\n<tr><td>分析對象</td><td>某個特定均衡狀態下的內生變數</td><td>外生變數改變前後、兩種均衡的比較</td></tr>\n<tr><td>是否看調整過程</td><td>否，只看均衡點本身</td><td>否，只看舊均衡→新均衡</td></tr>\n<tr><td>典型問題</td><td>在既有供需下，均衡價格與數量為何？</td><td>需求右移後，新均衡價格與數量為何？</td></tr>\n</tbody></table>\n<table>\n<caption>動態分析（Dynamic）</caption>\n<colgroup><col style=\"width:22%\"><col style=\"width:78%\"></colgroup>\n<tbody><tr><td>分析對象</td><td>由舊均衡移動到新均衡時，變數<b>隨時間的調整路徑</b></td></tr>\n<tr><td>著重</td><td>(1) 內生變數隨時間的調整路徑；(2) 比較靜態的合理性（均衡點是否穩定）</td></tr></tbody></table></div><div class=\"tblwrap\"><table>\n<caption>部分均衡 vs 一般均衡：分析範圍的廣度</caption>\n<colgroup><col style=\"width:22%\"><col style=\"width:39%\"><col style=\"width:39%\"></colgroup>\n<thead><tr><th>比較項目</th><th>部分均衡分析（Partial equilibrium）</th><th>一般均衡分析（General equilibrium）</th></tr></thead>\n<tbody>\n<tr><td>分析範圍</td><td>只觀察經濟體系中的某一部分</td><td>考慮所有部門與所有變數之間的關係</td></tr>\n<tr><td>基本假設</td><td>其他情況不變（其他市場不受影響）</td><td>每個部門同時達到均衡</td></tr>\n<tr><td>應用領域</td><td>個體經濟學多數分析</td><td>總體經濟學多數分析</td></tr>\n</tbody></table></div>\ncallout formula\"><div class=\"clabel\">公式</div>\n<ul><li>供需函數與均衡條件：供給 <span class=\"fx\">Q<sup>s</sup>=f(P<sup>s</sup>;P<sub>Y</sub>,σ\\ldots)</span>，需求 <span class=\"fx\">Q<sup>d</sup>=f(P<sup>d</sup>;P<sub>Y</sub>,M\\ldots)</span>，均衡時：</li></ul>\n<p><span class=\"fx\">P<sup>*</sup>=P<sup>s</sup>=P<sup>d</sup>,\\qquad Q<sup>*</sup>=Q<sup>s</sup>=Q<sup>d</sup></span></p>\n<p>(p.67)</p>\n<ul><li><strong>線性供需模型（一般式）</strong>：<span class=\"fx\">Q<sub>d</sub>=a-bP</span>，<span class=\"fx\">Q<sub>s</sub>=c+dP</span>，均衡求解：</li></ul>\n<p><span class=\"fx\">Q<sub>d</sub>=Q<sub>s</sub>⇒ a-bP=c+dP</span></p>\n<p><span class=\"fx\">P<sup>*</sup>=(a-c)/(b+d)>0,\\qquad Q<sup>*</sup>=(ad+bc)/(b+d)>0 if ad>bc</span></p>\n<p>(p.75)</p>\n<ul><li><strong>需求外生移動對均衡的比較靜態</strong>：</li></ul>\n<p><span class=\"fx\">(∂ P<sup>*</sup>)/(∂ a)=(1)/(b+d)>0;\\qquad (∂ Q<sup>*</sup>)/(∂ a)=(d)/(b+d)>0</span></p>\n<p>(p.75)</p>\n<ul><li><strong>供給外生移動對均衡的比較靜態</strong>：</li></ul>\n<p><span class=\"fx\">(∂ P<sup>*</sup>)/(∂ c)=(-1)/(b+d)<0;\\qquad (∂ Q<sup>*</sup>)/(∂ c)=(b)/(b+d)>0</span></p>\n<p>(p.75)</p>\n<ul><li><strong>特殊均衡模型</strong>：<span class=\"fx\">Q<sup>d</sup>=a-bP</span>，<span class=\"fx\">Q<sup>s</sup>=-c+dP</span>（<span class=\"fx\">a,b,c,d\\gt 0</span>），均衡求解：</li></ul>\n<p><span class=\"fx\">Q<sup>d</sup>=Q<sub>s</sub>⇒ a-bP=-c+dP</span></p>\n<p><span class=\"fx\">P<sup>*</sup>=(a+c)/(b+d)>0,\\qquad Q<sup>*</sup>=(ad-bc)/(b+d)≥ 0</span></p>\n<p>(p.70)</p>\n<ul><li>情況1：<span class=\"fx\">ad-bc>0⇒ a/b>c/d</span>，存在正數量內點均衡。(p.71)</li><li>情況2：<span class=\"fx\">ad-bc=0⇒ a/b=c/d</span>，供需線交在縱軸上（<span class=\"fx\">Q=0</span>），<span class=\"fx\">P<sup>*</sup>=(a+c)/(b+d)</span>。(p.71)</li><li>情況3：<span class=\"fx\">ad-bc<0⇒ a/b<c d< span>，有行無市（供需雖存在但均衡數量為負，不存在交易）。(p.71)</li></ul>\n</div>\n<div class=\"\n<div class=\" callout key\"><div class=\"clabel\">重點與結論</div>\n<ul>\n<li>定義中「其他情況不變」隱含除了本身商品價格與數量以外的外生變數皆不改變，亦即均衡點 <span class=\"fx\">E</span> 必須建立在同一條供給與需求線上。(p.67)</li>\n<li>當價格為 P<span class=\"fx\">′′</span></span>（高於 <span class=\"fx\">P<sup>*</sup></span>），供給量（<span class=\"fx\">B</span> 點）大於需求量（<span class=\"fx\">A</span> 點），出現供過於求，價格逐漸下降，需求量增加（<span class=\"fx\">A→ E</span>），供給量減少（<span class=\"fx\">B→ E</span>），直到回到均衡。(p.68)</li>\n<li>當價格為 P<span class=\"fx\">′</span>（低於 <span class=\"fx\">P<sup>*</sup></span>），供給量（<span class=\"fx\">C</span> 點）小於需求量（<span class=\"fx\">D</span> 點），出現供不應求，價格逐漸上升，需求量減少（<span class=\"fx\">D→ E</span>），供給量增加（<span class=\"fx\">C→ E</span>），直到回到均衡。(p.68)</li>\n<li>若政府或外力讓價格停留在 P<span class=\"fx\">′</span> 或 P<span class=\"fx\">′′</span>，此時市場均衡數量會是 <span class=\"fx\">Q<sub>1</sub></span>（短邊原則）。(p.68)</li>\n<li>一個能有效解釋現實與預測未來的模型必須具備三條件：(1)均衡解存在（Existence）；(2)均衡解具有唯一性（Uniqueness）；(3)均衡解具穩定性（Stability）。(p.69)</li>\n<li><strong>市場上所有的交易都會發生在均衡點嗎？</strong> 不一定。只要消費者的願付價格大於生產者的願收價格，市場交易就有可能發生。只要交易數量是 <span class=\"fx\">Q<sup>*</sup></span> 的左邊，交易都可能發生。探討 <span class=\"fx\">E</span> 點的意義在於判斷未來數量與價格的走勢。(p.69)</li>\n<li><strong>經濟學分析方法分類</strong>：</li>\n<li>比較靜態（Comparative static）分析：外生變數改變後，探討變化前後兩種不同均衡狀態的內生變數情況。(p.72)</li>\n<li>動態（Dynamic）分析：討論由某個均衡移動到另一個新均衡時，變數隨時間歷程的變動；著重(1)內生變數隨時間的調整路徑；(2)比較靜態存在的合理性（均衡點是否為穩定均衡）。(p.72)</li>\n<li>需求外生移動、供給不動：需求右移→均衡價格與數量皆上升；需求左移→皆下降。(p.72)</li>\n<li>供給外生移動、需求不動：供給右移→均衡價格下降、數量上升；供給左移→價格上升、數量下降。(p.73)</li>\n<li>供需同時移動：供需同時右移→均衡數量一定上升；同時左移→一定下降；但對價格的影響需視移動幅度大小而定（價格不一定）。(p.73)</li>\n</ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 420 330\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:460px;height:auto;display:block;margin:8px auto;\">\n<defs><marker id=\"ax\" viewbox=\"0 0 10 10\" refx=\"8\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"#26303c\"></path></marker></defs>\n<line x1=\"40\" y1=\"290\" x2=\"400\" y2=\"290\" stroke=\"#26303c\" stroke-width=\"1.6\" marker-end=\"url(#ax)\"></line>\n<line x1=\"40\" y1=\"290\" x2=\"40\" y2=\"18\" stroke=\"#26303c\" stroke-width=\"1.6\" marker-end=\"url(#ax)\"></line>\n<text x=\"392\" y=\"306\" font-size=\"13\" fill=\"#26303c\" font-weight=\"700\" text-anchor=\"middle\">Q</text>\n<text x=\"30\" y=\"26\" font-size=\"13\" fill=\"#26303c\" font-weight=\"700\" text-anchor=\"middle\">P</text>\n<line x1=\"60\" y1=\"250\" x2=\"350\" y2=\"70\" stroke=\"#1e7d32\" stroke-width=\"2.2\"></line>\n<text x=\"358\" y=\"66\" font-size=\"13\" font-weight=\"700\" fill=\"#1e7d32\">D</text>\n<line x1=\"70\" y1=\"70\" x2=\"340\" y2=\"250\" stroke=\"#b5542e\" stroke-width=\"2.2\"></line>\n<text x=\"352\" y=\"266\" font-size=\"13\" font-weight=\"700\" fill=\"#b5542e\">S</text>\n<circle cx=\"205\" cy=\"160\" r=\"4\" fill=\"#26303c\"></circle>\n<text x=\"214\" y=\"152\" font-size=\"13\" font-weight=\"700\" fill=\"#26303c\">E</text>\n<line x1=\"205\" y1=\"160\" x2=\"40\" y2=\"160\" stroke=\"#26303c\" stroke-width=\"1\" stroke-dasharray=\"4 3\"></line>\n<line x1=\"205\" y1=\"160\" x2=\"205\" y2=\"290\" stroke=\"#26303c\" stroke-width=\"1\" stroke-dasharray=\"4 3\"></line>\n<text x=\"30\" y=\"154\" font-size=\"12\" fill=\"#26303c\" font-weight=\"700\" text-anchor=\"end\">P*</text>\n<text x=\"208\" y=\"306\" font-size=\"12\" fill=\"#26303c\" font-weight=\"700\" text-anchor=\"middle\">Q*</text>\n<text x=\"300\" y=\"315\" font-size=\"11.5\" fill=\"#6f6555\">均衡：兩線交點 E（P*, Q*）</text>\n</svg>\n<p>供給線 S（正斜率）與需求線 D（負斜率）的交點 E 決定均衡價格 P* 與均衡數量 Q*。(p.67)</p>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 360\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;max-width:480px;height:auto;display:block;margin:8px auto;\">\n<defs><marker id=\"ay\" viewbox=\"0 0 10 10\" refx=\"8\" refy=\"5\" markerwidth=\"7\" markerheight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"#26303c\"></path></marker></defs>\n<line x1=\"40\" y1=\"320\" x2=\"420\" y2=\"320\" stroke=\"#26303c\" stroke-width=\"1.6\" marker-end=\"url(#ay)\"></line>\n<line x1=\"40\" y1=\"320\" x2=\"40\" y2=\"18\" stroke=\"#26303c\" stroke-width=\"1.6\" marker-end=\"url(#ay)\"></line>\n<text x=\"412\" y=\"338\" font-size=\"13\" fill=\"#26303c\" font-weight=\"700\" text-anchor=\"middle\">Q</text>\n<text x=\"30\" y=\"26\" font-size=\"13\" fill=\"#26303c\" font-weight=\"700\" text-anchor=\"middle\">P</text>\n<line x1=\"60\" y1=\"270\" x2=\"360\" y2=\"70\" stroke=\"#1e7d32\" stroke-width=\"2.2\"></line>\n<text x=\"368\" y=\"66\" font-size=\"13\" font-weight=\"700\" fill=\"#1e7d32\">D</text>\n<line x1=\"70\" y1=\"70\" x2=\"350\" y2=\"270\" stroke=\"#b5542e\" stroke-width=\"2.2\"></line>\n<text x=\"360\" y=\"286\" font-size=\"13\" font-weight=\"700\" fill=\"#b5542e\">S</text>\n<circle cx=\"210\" cy=\"170\" r=\"4\" fill=\"#26303c\"></circle>\n<text x=\"219\" y=\"162\" font-size=\"13\" font-weight=\"700\" fill=\"#26303c\">E</text>\n<line x1=\"210\" y1=\"170\" x2=\"40\" y2=\"170\" stroke=\"#26303c\" stroke-width=\"1\" stroke-dasharray=\"4 3\"></line>\n<text x=\"30\" y=\"164\" font-size=\"12\" fill=\"#26303c\" font-weight=\"700\" text-anchor=\"end\">P*</text>\n\n<line x1=\"40\" y1=\"90\" x2=\"380\" y2=\"90\" stroke=\"#b5542e\" stroke-width=\"1.3\" stroke-dasharray=\"6 3\"></line>\n<text x=\"376\" y=\"82\" font-size=\"12\" fill=\"#b5542e\" font-weight=\"700\">P″</text>\n<circle cx=\"130\" cy=\"90\" r=\"3.2\" fill=\"#26303c\"></circle><text x=\"138\" y=\"84\" font-size=\"11.5\" fill=\"#26303c\">A（需求點）</text>\n<circle cx=\"300\" cy=\"90\" r=\"3.2\" fill=\"#26303c\"></circle><text x=\"308\" y=\"84\" font-size=\"11.5\" fill=\"#26303c\">B（供給點）</text>\n<line x1=\"130\" y1=\"80\" x2=\"300\" y2=\"80\" stroke=\"#26303c\" stroke-width=\"1.4\"></line>\n<text x=\"215\" y=\"74\" font-size=\"11.5\" fill=\"#26303c\" font-weight=\"700\" text-anchor=\"middle\">超額供給 ES（過剩）</text>\n\n<line x1=\"40\" y1=\"252\" x2=\"380\" y2=\"252\" stroke=\"#1e7d32\" stroke-width=\"1.3\" stroke-dasharray=\"6 3\"></line>\n<text x=\"376\" y=\"244\" font-size=\"12\" fill=\"#1e7d32\" font-weight=\"700\">P′</text>\n<circle cx=\"110\" cy=\"252\" r=\"3.2\" fill=\"#26303c\"></circle><text x=\"60\" y=\"272\" font-size=\"11.5\" fill=\"#26303c\">C（供給點）</text>\n<circle cx=\"310\" cy=\"252\" r=\"3.2\" fill=\"#26303c\"></circle><text x=\"318\" y=\"266\" font-size=\"11.5\" fill=\"#26303c\">D（需求點）</text>\n<line x1=\"110\" y1=\"262\" x2=\"310\" y2=\"262\" stroke=\"#26303c\" stroke-width=\"1.4\"></line>\n<text x=\"210\" y=\"288\" font-size=\"11.5\" fill=\"#26303c\" font-weight=\"700\" text-anchor=\"middle\">超額需求 ED（短缺）</text>\n\n<text x=\"150\" y=\"130\" font-size=\"11.5\" fill=\"#b5542e\">↓ 價格下跌</text>\n<text x=\"140\" y=\"215\" font-size=\"11.5\" fill=\"#1e7d32\">↑ 價格上升</text>\n</svg>\n<p>價格高於 P*：超額供給（A–B 段）→ 價格下跌；價格低於 P*：超額需求（C–D 段）→ 價格上升，直到回到 E。(p.68)</p>\n</div>\ncallout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.1（中興財金）</strong>： 需求 <span class=\"fx\">P=40-4Q</span>，供給 <span class=\"fx\">P=4+2Q</span><br>(1)求均衡數量與價格<br>(2)若價格為12，均衡數量為何？<br>(3)若需求者為20人、供給者為10人，求均衡價格與數量。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(1)令 <span class=\"fx\">40-4Q=4+2Q</span> 得 <span class=\"fx\">Q<sup>*</sup>=6</span>，<span class=\"fx\">P<sup>*</sup>=16</span>；(2) <span class=\"fx\">P=12⇒ Q<sup>d</sup>=7</span><br>(3)個人供需加總為市場供需。（詳解見書末 QR）(p.68)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.2（清大科管）</strong>： <span class=\"fx\">Q<sub>d</sub>=a-bP+cY</span>，<span class=\"fx\">Q<sub>s</sub>=d+eP-fP<sub>m</sub></span>，<span class=\"fx\">P</span> 為價格、<span class=\"fx\">Y</span> 為所得、<span class=\"fx\">P<sub>m</sub></span> 為要素價格<br>(1)指出內生與外生變數<br>(2)求內生變數均衡。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：令 <span class=\"fx\">a-bP+cY=d+eP-fP<sub>m</sub></span>，得 <span class=\"fx\">P<sup>*</sup>=(a-d+cY+fP<sub>m</sub>)/(b+e)</span>，<span class=\"fx\">Q<sup>*</sup>=(ae+cd+bdP<sub>m</sub>-bfP<sub>m</sub>)/(b+e)</span>。（詳解見書末 QR）(p.70)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.3</strong>： 披薩供需表（P=10,8,6,4,2,0 對應需求量 0,10,20,30,40,125；供給量 40,30,20,10,0,0）<br>(1)求均衡<br>(2)若供給在每價格三倍化會如何？<br>(3)若價格定在$4會如何？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：由表找出需求量=供給量之點；供給移動後重新比對。（詳解見書末 QR）(p.70)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.4</strong>： 高品質鑽石大量進入市場，對鑽石戒指市場的影響。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：鑽石供給增加→供給線右移→現行價格下出現過剩→價格下跌→需求量增加、供給量減少，新均衡為較低價格與較高數量。答案選(B)。（詳解見書末 QR）(p.74)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.5（台大國企）</strong>： 印新英文教科書固定成本為零；若就讀大學學生減少、紙張變便宜、作者版稅減少、二手書銷售增加，均衡價格如何變化？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：需求減少（學生減少、二手書增加）+供給增加（成本下降）→價格下跌。答案選(B)。（詳解見書末 QR）(p.74)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.6（110成大國企）</strong>： 培根為培根起司堡的重要生產要素，培根價格大跌，對培根起司堡市場的影響。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：要素價格下降→供給增加→供給線右移→價格下降、數量增加。答案選(D)。（詳解見書末 QR）(p.74–75)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.7</strong>： 奶精與咖啡為互補品，茶與咖啡為替代品；技術進步使咖啡供給增加，討論三市場影響。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：咖啡供給增加→咖啡價格下跌、數量增加；互補品奶精需求增加；替代品茶需求減少。（詳解見書末 QR）(p.75)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.8（中央企管）</strong>： <span class=\"fx\">Q<sub>d</sub>=a-bP</span>，<span class=\"fx\">Q<sub>s</sub>=-c+dP</span>，判斷各參數變動對均衡價格影響。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：由 <span class=\"fx\">P<sup>*</sup>=(a+c)/(b+d)</span> 可知 <span class=\"fx\">a</span> 提高→<span class=\"fx\">P<sup>*</sup></span> 上升；<span class=\"fx\">b</span> 提高→<span class=\"fx\">P<sup>*</sup></span> 下降；<span class=\"fx\">c</span> 提高→<span class=\"fx\">P<sup>*</sup></span> 上升；<span class=\"fx\">d</span> 提高→<span class=\"fx\">P<sup>*</sup></span> 下降。答案選(A)。（詳解見書末 QR）(p.75)</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>超額需求/超額供給的定義與價格調整方向（短缺→漲價；過剩→跌價）。</li><li>穩定均衡的意義與短邊原則（short-side principle）：價格受限時交易量由較短的一方決定。</li><li>線性供需模型均衡解公式 <span class=\"fx\">P<sup>*</sup>=(a-c)/(b+d)</span>、<span class=\"fx\">Q<sup>*</sup>=(ad+bc)/(b+d)</span> 及其比較靜態（<span class=\"fx\">∂ P<sup>*</sup>/∂ a</span>、<span class=\"fx\">∂ Q<sup>*</sup>/∂ c</span> 等正負號）。</li><li>特殊均衡三情形（<span class=\"fx\">ad-bc></span>、<span class=\"fx\">=</span>、<span class=\"fx\"><0</span>）的圖形與經濟意義。</li><li>供需移動的不確定性：<span class=\"hl\">同時移動時數量方向可定</span>、價格方向不一定（反之亦然）。</li><li>對應原理（Correspondence Principle）為常考名詞解釋。</li><li>部分均衡 vs. 一般均衡的區分。</li></ul>\n</div>\n"}, {"id": "4.2", "title": "消費者與生產者剩餘及社會福利分析（印刷頁 76–77）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc151\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">消費者剩餘（Consumer's Surplus, C.S.）</div><div class=\"mc-body\"><div class=\"mc-formula\">其他情況不變，在給定消費數量下，消費者心中最高願付價格與實際付出價格之間的差額。</div><div class=\"mc-detail\">其他情況不變，在給定消費數量下，消費者心中最高願付價格與實際付出價格之間的差額。消費至 <span class=\"fx\">Q<sup>*</sup></span> 的消費者剩餘總額為 <span class=\"fx\">aEP<sup>*</sup></span>。(p.76)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc152\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">生產者剩餘（Producer's Surplus, P.S.）</div><div class=\"mc-body\"><div class=\"mc-formula\">其他情況不變，在給定生產數量下，生產者收入與實際投入成本之間的差額。</div><div class=\"mc-detail\">其他情況不變，在給定生產數量下，生產者收入與實際投入成本之間的差額。生產至 <span class=\"fx\">Q<sup>*</sup></span> 的生產者剩餘總額為 <span class=\"fx\">P<sup>*</sup>EO</span>。(p.76)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc153\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">社會福利（Social welfare, S.W.）</div><div class=\"mc-body\"><div class=\"mc-formula\">社會福利（Social welfare, S.W.）</div><div class=\"mc-detail\"></div></div></div>\n<p class=\"def-note\">沒有政府介入：S.W.=C.S.+P.S.（Total Surplus）。</p>\n<p class=\"def-note\">有政府介入：S.W.=C.S.+P.S.+(總稅收 T−總補貼 S)。(p.76)</p>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc154\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">經濟租（Economic rent）</div><div class=\"mc-body\"><div class=\"mc-formula\">生產者剩餘又稱經濟租；若供給線水平（完全彈性），則經濟租為零。</div><div class=\"mc-detail\">生產者剩餘又稱經濟租；若供給線水平（完全彈性），則經濟租為零。(p.76, p.77)</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>社會福利最大點：在沒有市場失靈與政府介入的前提下，供需相交處為社會福利極大點。(p.76)</li><li>消費者剩餘積分形式（線性需求 <span class=\"fx\">P<sup>d</sup>=a-bQ</span>）：</li></ul>\n<p><span class=\"fx\">Δ C.S.=∫<sub>Q<sub>1</sub></sub><sup>Q<sub>2</sub></sup>1/PdP</span></p>\n<p>(p.76 手寫附註)</p>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>「剩餘」表示交易雙方對於交易的結果感到「交易比不交易好」。市場價格與本身最高願付價格（消費者）及最低願收價格（生產者）不同所撿到的好處，即為剩餘。(p.76)</li><li>經濟租的產生是由於供給線傾向於缺乏彈性（例題4.10）。(p.77)</li><li>在要素市場中若供給完全無彈性（垂直線），對要素需求增加將提高經濟租但不提高機會成本（例題4.11）。(p.77)</li></ul>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"90\" y1=\"230\" x2=\"380\" y2=\"200\" stroke=\"#b5542e\" stroke-width=\"2.2\"></line><text x=\"386\" y=\"200\" font-size=\"11\" fill=\"#b5542e\">S</text><line x1=\"90\" y1=\"50\" x2=\"380\" y2=\"190\" stroke=\"#1e7d32\" stroke-width=\"2.2\"></line><text x=\"386\" y=\"186\" font-size=\"11\" fill=\"#1e7d32\">D</text><polygon points=\"160,95 300,165 160,165\" fill=\"rgba(30,125,50,0.22)\"></polygon><text x=\"180\" y=\"120\" font-size=\"10\" fill=\"#1e7d32\">CS</text><polygon points=\"100,225 160,165 300,165\" fill=\"rgba(181,84,46,0.22)\"></polygon><text x=\"130\" y=\"200\" font-size=\"10\" fill=\"#b5542e\">PS</text><circle cx=\"230\" cy=\"165\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"238\" y=\"162\" font-size=\"10\" fill=\"#6b4e8e\">E(P*,Q*)</text></svg><p class=\"figcap\">消費者剩餘 aEP*（D 下、P* 上）；生產者剩餘 P*EO（S 上、P* 下）。(p.76)</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.9（中興財金）</strong>： 需求 <span class=\"fx\">P=40-4Q</span>，供給 <span class=\"fx\">P=4+2Q</span><br>(1)農民總收入與生產者剩餘？<br>(2)消費者剩餘？<br>(3)颱風後供給變 <span class=\"fx\">P=5+3Q</span>，農民總收入？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：先求均衡 <span class=\"fx\">Q<sup>*</sup>=6,P<sup>*</sup>=16</span>；總收入 <span class=\"fx\">=P<sup>*</sup>× Q<sup>*</sup></span>；CS 為需求線縱軸截點至 <span class=\"fx\">P<sup>*</sup></span> 之三角形；PS 為供給線縱軸截點至 <span class=\"fx\">P<sup>*</sup></span> 之三角形。（詳解見書末 QR）(p.77)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.10</strong>： 經濟租的產生是由於供給線傾向於？<div class=\"opts\"><div>(A) 缺乏彈性</div><div>(B) 負斜率</div><div>(C) 彈性小於無窮大</div><div>(D) 水平線</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"hl\">供給越缺乏彈性</span>（越陡），生產者剩餘（經濟租）越大。（詳解見書末 QR）(p.77)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.11</strong>： 要素市場供給完全無彈性，對要素需求增加將？<div class=\"opts\"><div>(A) 提高機會成本但不提經濟租</div><div>(B) 提高經濟租但不提機會成本</div><div>(C) 兩者皆提高</div><div>(D) 兩者皆不提</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：供給垂直（固定數量），需求增加只提高價格（經濟租），數量不變故機會成本不變。答案選(B)。（詳解見書末 QR）(p.77)</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>消費者剩餘（<span class=\"fx\">aEP<sup>*</sup></span>）與生產者剩餘（<span class=\"fx\">P<sup>*</sup>EO</span>）的面積辨識。</li><li>社會福利 S.W.=CS+PS（無政府）；有政府時需加回稅收、扣除補貼。</li><li>經濟租（Economic Rent）= 生產者剩餘的觀念；供給越無彈性，經濟租越大。</li></ul>\n</div>\n</div>"}, {"id": "4.3", "title": "政府介入對社會福利的影響（印刷頁 78–83）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc149\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">無謂損失（Deadweight Loss, D.L.）/超額負擔（Excess Burden）</div><div class=\"mc-body\"><div class=\"mc-formula\">因為生產量低於競爭均衡產量而損失的社會福利。</div><div class=\"mc-detail\">因為生產量低於競爭均衡產量而損失的社會福利。若經濟社會中無市場失靈且政府不干預，<span class=\"hl\">市場機能可使社會福利達到最大</span>。(p.78)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc150\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">政府介入的手段</div><div class=\"mc-body\"><div class=\"mc-formula\">政府介入的手段</div><div class=\"mc-detail\"></div></div></div>\n<p class=\"def-note\">課稅：(1)定額稅（Lump sum tax）<span class=\"fx\">T=\\barT</span>；(2)從量稅（Exercise tax/Specific tax）<span class=\"fx\">T=tQ</span>，每單位商品付 <span class=\"fx\">t</span> 元；(3)從價稅（Advalorem tax）<span class=\"fx\">T=tPQ</span>，每塊錢付 <span class=\"fx\">t\\%</span>。(p.78)</p>\n<p class=\"def-note\">補貼：(1)定額補貼 <span class=\"fx\">S=\\barS</span>；(2)從量補貼 <span class=\"fx\">S=sQ</span>，每單位獲 <span class=\"fx\">s</span> 元；(3)從價補貼 <span class=\"fx\">T=sPQ</span>，每塊錢獲 <span class=\"fx\">s\\%</span>。(p.78)</p>\n<p class=\"def-note\">本章重點：政府課徵<strong>從量稅</strong>或使用<strong>從量補貼</strong>的情況。(p.78)</p>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li><strong>對消費者課從量稅</strong>：生產者面對的需求線垂直下移 <span class=\"fx\">t</span> 的距離：</li></ul>\n<p><span class=\"fx\">P<sub>t</sub><sup>d</sup>=P<sup>d</sup>(Q<sup>d</sup>)-t</span></p>\n<p>(p.78)</p>\n<ul><li><strong>對生產者課從量稅</strong>：消費者面對的供給線垂直上移 <span class=\"fx\">t</span> 的距離：</li></ul>\n<p><span class=\"fx\">P<sub>t</sub><sup>s</sup>=P<sup>s</sup>(Q<sup>s</sup>)+t</span></p>\n<p>(p.79)</p>\n<ul><li><strong>對消費者從量補貼</strong>：生產者面對的需求線垂直上移 <span class=\"fx\">s</span>：</li></ul>\n<p><span class=\"fx\">P<sub>s</sub><sup>d</sup>=P<sup>d</sup>(Q<sup>d</sup>)+s</span></p>\n<p>(p.79)</p>\n<ul><li><strong>對生產者從量補貼</strong>：消費者面對的供給線垂直下移 <span class=\"fx\">s</span>：</li></ul>\n<p><span class=\"fx\">P<sub>s</sub><sup>s</sup>=P<sup>s</sup>(Q<sup>s</sup>)-s</span></p>\n<p>(p.79)</p>\n<ul><li><strong>無謂損失公式（從量稅）</strong>：</li></ul>\n<p><span class=\"fx\">D.L.=t\\timesQ<sup>*</sup>-Q<sub>t</sub>/2</span></p>\n<p>(p.80)</p>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong>重要提醒</strong>：課稅與補貼皆不會改變消費者與生產者本身的供給線或需求線；但會改變對方所面對的供給線與需求線。(p.80)</li><li>課稅與補貼需要將函數化為以 <span class=\"fx\">P</span> 為應變數的函數型態才可進行加總。(p.80)</li><li><strong>從量稅對福利的影響（對消費者或對生產者課稅皆然）</strong>：</li><li>價格：消費者付出上升，生產者收入下降；數量下降。</li><li>消費者剩餘下降、生產者剩餘下降、社會福利下降。</li><li>政府稅收總額上升（= <span class=\"fx\">P<sub>t</sub><sup>d</sup> · bc · P<sub>t</sub><sup>s</sup></span> 長方形面積）。</li><li>無謂損失上升（<span class=\"fx\">\\triangle bcE</span>）。(p.80–81)</li><li><strong>從量補貼對福利的影響（對消費者或對生產者補貼皆然）</strong>：</li><li>價格：消費者付出下降，生產者收入上升；數量上升。</li><li>消費者剩餘上升、生產者剩餘上升。</li><li>社會福利下降（aEO−bEc 或 aEO−bcE），因為政府補貼支出大於剩餘增加。</li><li>無謂損失上升（<span class=\"fx\">\\triangle bcE</span>）。(p.81–82)</li><li><strong>關鍵結論</strong>：<span class=\"hl\">無論課稅或補貼的對象是消費者或生產者</span>，對於社會福利及無謂損失的影響都<strong>一樣</strong>。(p.82)</li></ul>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"90\" y1=\"230\" x2=\"380\" y2=\"200\" stroke=\"#b5542e\" stroke-width=\"2.2\"></line><text x=\"386\" y=\"200\" font-size=\"11\" fill=\"#b5542e\">S</text><line x1=\"90\" y1=\"50\" x2=\"380\" y2=\"190\" stroke=\"#1e7d32\" stroke-width=\"2.2\"></line><text x=\"386\" y=\"186\" font-size=\"11\" fill=\"#1e7d32\">D</text><line x1=\"90\" y1=\"80\" x2=\"380\" y2=\"220\" stroke=\"#6c7684\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"></line><text x=\"300\" y=\"215\" font-size=\"10\" fill=\"#6c7684\">D−t</text><circle cx=\"230\" cy=\"165\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"180\" y=\"160\" font-size=\"10\" fill=\"#1e7d32\">E*</text><polygon points=\"150,120 200,145 150,150\" fill=\"rgba(107,78,142,0.3)\"></polygon><text x=\"118\" y=\"118\" font-size=\"9\" fill=\"#6b4e8e\">生產扭曲</text><polygon points=\"250,145 300,170 250,160\" fill=\"rgba(107,78,142,0.3)\"></polygon><text x=\"256\" y=\"185\" font-size=\"9\" fill=\"#6b4e8e\">消費扭曲</text></svg><p class=\"figcap\">從量稅使 D 下移 t；稅收移轉，兩個三角形為消費/生產扭曲的無謂損失。(p.82)</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.12（經典題）</strong>： 菸草市場 <span class=\"fx\">Q<sub>d</sub>=100-2P</span>，<span class=\"fx\">Q<sub>s</sub>=P-20</span>，政府對消費者從量稅 <span class=\"fx\">3</span> 元<br>(1)下列何者正確？<div class=\"opts\"><div>(A) 消費者實付$43</div><div>(B) 生產者實收$38</div><div>(C) 新均衡數量20</div><div>(D) 每單位消費者稅負$3<br>(2)何者正確？</div><div>(A) CS損失$40</div><div>(B) PS損失$60</div><div>(C) 稅收$54</div><div>(D) DL=$6</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：原均衡 $Q_d=Q_s\\Rightarrow P=40,Q=20；對消費者課稅P_t^d=P^s\\Rightarrow 50-\\frac{1}{2}Q-3=20+Q\\Rightarrow Q=18，P_t^d=41，P_t^s=38$；CS損失、PS損失、稅收=3×18=54、DL=1/2×3×(20-18)=3。答案：(1)(B) (2)(C)。（詳解見書末 QR）(p.83)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.13</strong>： 產品 <span class=\"fx\">X</span> 完全競爭市場，需求 <span class=\"fx\">P=120-Q</span>，供給 <span class=\"fx\">P=Q</span>。政府對消費者每購1單位補貼10元。求社會福利變化。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：原均衡 <span class=\"fx\">Q<sup>*</sup>=60,P<sup>*</sup>=60</span>；補貼後需求線上移10元（<span class=\"fx\">P=130-Q</span>），新均衡 Q=65<span class=\"mpunct\">,</span>P=65；CS、PS、政府支出、SW 逐一計算，DL=25。（詳解見書末 QR）(p.83)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.14</strong>： 課稅的無謂損失等於？<div class=\"opts\"><div>(A) 總稅收</div><div>(B) CS與PS因稅的損失</div><div>(C) 總稅收加上CS與PS損失</div><div>(D) CS與PS損失減去總稅收</div><div>(E) 以上皆非</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：DL = CS損失 + PS損失 - 政府稅收。答案選(D)。（詳解見書末 QR）(p.83)</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>從量稅的圖形移動方向：對消費者課稅→需求線下移 <span class=\"fx\">t</span>；對生產者課稅→供給線上移 <span class=\"fx\">t</span>。</li><li><strong>課稅對象不影響最終福利結果</strong>（對消費者或生產者課稅，CS/PS/SW/DL 的變化完全相同）——必考觀念。</li><li>無謂損失公式 <span class=\"fx\">DL=1/2· t·(Q<sup>*</sup>-Q<sub>t</sub>)</span>。</li><li>政府稅收 = 稅後價差 × 稅後數量。</li><li>補貼的無謂損失同樣為三角形，社會福利淨下降。</li></ul>\n</div>\n</div>"}, {"id": "4.4", "title": "政府介入市場的其他手段（印刷頁 84–89）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc147\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">價格上限（Price ceiling）</div><div class=\"mc-body\"><div class=\"mc-formula\">其他情況不變，價格被人為管制在均衡價格之下。</div><div class=\"mc-detail\">其他情況不變，價格被人為管制在均衡價格之下。因此會使市場出現超額需求。價格上限的管制必須<strong>低於</strong>真正的市場價格才會有效。(p.84)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc148\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">價格下限（Price floor）</div><div class=\"mc-body\"><div class=\"mc-formula\">其他情況不變，價格被人為管制在均衡價格之上。</div><div class=\"mc-detail\">其他情況不變，價格被人為管制在均衡價格之上。因此會使市場出現超額供給。價格下限必須<strong>高於</strong>真正的市場價格才會有效（常見於農產品市場、勞動市場）。(p.84)</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>價格上限下，依短邊原則，市場均衡數量為 <span class=\"fx\">Q<sub>s</sub></span>（供給量），而非 <span class=\"fx\">Q<sub>d</sub></span>。(p.84)</li><li>價格下限下，依短邊原則，市場均衡數量為 <span class=\"fx\">Q<sub>d</sub></span>（需求量），而非 <span class=\"fx\">Q<sub>s</sub></span>。(p.85)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong>價格上限</strong>：通常實施目的為壓抑過高的市場價格以保護消費者。但管制後消費者剩餘增加與否無法確定（取決於矩形轉移面積與三角形損失的相對大小），但<strong>生產者剩餘一定下降</strong>。(p.84)</li><li><strong>價格下限</strong>：通常實施目的為拉高通過低的市場價格以保護生產者。但管制後生產者剩餘增加與否無法確定，但<strong>消費者剩餘一定下降</strong>。(p.85)</li><li><strong>出現超額需求的解決方法</strong>：</li></ul>\n<ol><li><strong>排隊（Waiting）</strong>：例如演唱會門票開賣前排隊。優點：可將資源分配給最需要的人（無法忍受排隊者自動退出）；缺點：時間成本損失。(p.85)</li><li><strong>轉售（Resale）</strong>：例如黃牛。優點：可節省時間成本、轉換成黃牛收入；無法忍受黃牛開價的人自動退出。(p.85)</li><li><strong>抽籤</strong>：優點：每個消費者有相同機率抽中；缺點：可能造成資源配置低落下（非最想要的人得到商品）。(p.85)</li><li><strong>尋租行為（Rent-seeking behavior）</strong>：經濟個體為了賺取經濟租，利用既有利益或不正當行為以取得特權，例如走後門。(p.85)</li><li><strong>建立甄選制度</strong>：如大學聯考、轉學考、研究所考試。(p.86)</li></ol>\n<ul><li><strong>出現超額供給的解決方法</strong>：</li></ul>\n<ol><li><strong>保證價格收購制</strong>：政府保證以某 <span class=\"fx\">\\barP</span> 價格收購市場上之超額供給量。政府設定價格下限並在此價格下保證收購所有超額供給。(p.87)</li><li><strong>價差補貼制</strong>：政府設定價格下限，希望生產者所生產的數量全數售出，因此補貼為了全數售出的差額。生產者以 <span class=\"fx\">\\barP</span> 生產 <span class=\"fx\">\\barQ</span>，消費者只願付 <span class=\"fx\">P<sup>*</sup></span>，政府每單位補助 <span class=\"fx\">\\overlinePP<sup>*</sup></span>。(p.87–88)</li><li><strong>直接津貼</strong>：政府設定一個價格，先讓市場自由運作，但若市場均衡價格低於此價格，再依照差價補貼給生產者。此方法無謂損失為 0。(p.88)</li></ol>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"90\" y1=\"230\" x2=\"380\" y2=\"200\" stroke=\"#b5542e\" stroke-width=\"2.2\"></line><text x=\"386\" y=\"200\" font-size=\"11\" fill=\"#b5542e\">S</text><line x1=\"90\" y1=\"50\" x2=\"380\" y2=\"190\" stroke=\"#1e7d32\" stroke-width=\"2.2\"></line><text x=\"386\" y=\"186\" font-size=\"11\" fill=\"#1e7d32\">D</text><circle cx=\"230\" cy=\"165\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"238\" y=\"162\" font-size=\"10\" fill=\"#6b4e8e\">E(P*,Q*)</text><line x1=\"60\" y1=\"120\" x2=\"410\" y2=\"120\" stroke=\"#c89632\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"></line><text x=\"330\" y=\"114\" font-size=\"10\" fill=\"#c89632\">P̄ 價格上限</text><line x1=\"150\" y1=\"120\" x2=\"150\" y2=\"175\" stroke=\"#2b251d\" stroke-width=\"1.2\"></line><text x=\"120\" y=\"190\" font-size=\"9\" fill=\"#b5542e\">Qs</text><line x1=\"310\" y1=\"120\" x2=\"310\" y2=\"140\" stroke=\"#2b251d\" stroke-width=\"1.2\"></line><text x=\"316\" y=\"135\" font-size=\"9\" fill=\"#1e7d32\">Qd</text><text x=\"200\" y=\"112\" font-size=\"9\" fill=\"#c89632\">超額需求 Qd>Qs</text></svg><p class=\"figcap\">價格上限 P̄<p*：供給量 qs、需求量 qd，qd>Qs 超額需求。(p.85)</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.15</strong>： 需求 P=10−0.5Q，供給 <span class=\"fx\">Q=5+3P</span>，政府規定市場價格為2，市場會發生什麼事？提供三種解決方式並分析福利。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：原均衡 <span class=\"fx\">P≈7.86,Q≈28.57</span>；價格上限2低於均衡→超額需求；三法為排隊、轉售、抽籤。（詳解見書末 QR）(p.87)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.16（110中山財管）</strong>： 兩個勞動市場，原工資皆$9，就業量125與75。市場1工會化後工資$12，25人退出（就業100）；市場2增加25人（就業100），工資降為$6。求社會淨福利損失。另：高雄路邊停車位需求 $Q=140-P$，政府訂價<span class=\"fx\">20</span>（P=20），供給 Q=50，若每個需求者有相同機率找到停車位，消費者剩餘為何？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：由供需變動計算兩市場福利變化加總；停車位題先求需求量與消費者剩餘再按機率折減。（詳解見書末 QR）(p.87)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.17</strong>： 其他條件相同，何種情況下具拘束力的價格下限造成較少的過剩？<div class=\"opts\"><div>(A) 供需皆無彈性</div><div>(B) 供需皆有彈性</div><div>(C) 供給有彈性、需求無彈性</div><div>(D) 供給無彈性、需求有彈性</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：供需越無彈性（越陡），價格偏離均衡時數量變動越小，過剩量越小。答案選(A)。（詳解見書末 QR）(p.88)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.18（台大財金，較難）</strong>： 蜂蜜供給 <span class=\"fx\">Q<sub>s</sub>=P</span>，需求 <span class=\"fx\">Q<sub>d</sub>=120-P</span><br>(1)求均衡價格、數量、CS、PS、社會總剩餘<br>(2)價格下限$80，政府收購所有過剩，求CS、PS、政府支出、社會總剩餘<br>(3)政府對農民補貼價差至$80<br>(4)消基會要求補貼消費者使均衡價格達$80<br>(5)何政策有效達保障農民目標？何者較有效率？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：原均衡 $P=60,Q=60$<br>(2)價格下限80→供給80、需求40，政府收購40單位<br>(3)價差補貼<br>(4)對需求補貼使需求線上移。（詳解見書末 QR）(p.89)</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>價格上限/下限的定義、有效性條件（必須偏離均衡價格）、對超額供需的影響。</li><li>價格上限保護消費者但 CS 不一定增加；價格下限保護生產者但 PS 不一定增加——必考陷阱題。</li><li>排隊、轉售（黃牛）、抽籤、尋租的福利比較（排隊有時間成本浪費；轉售為零和；抽籤有配置低效）。</li><li>保證價格收購制、價差補貼制、直接津貼三種價格下限配套的福利面積辨識。</li><li>直接津貼的 DL=0（因為不改變交易量）為常考結論。</li></ul>\n</div>\n</div>"}, {"id": "4.5", "title": "羅西法則與租稅轉嫁（印刷頁 90–96）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc142\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">羅西法則（Ramsey Rule）/倒需求彈性法則</div><div class=\"mc-body\"><div class=\"mc-formula\">其目的在於希望任何財貨在課稅後所造成的無謂損失是相同的；故需求彈性較大的商品應課低稅率，需求彈性較小的商品應課高稅率。</div><div class=\"mc-detail\">其目的在於希望任何財貨在課稅後所造成的無謂損失是相同的；故需求彈性較大的商品應課低稅率，需求彈性較小的商品應課高稅率。(p.90)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc143\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">租稅轉嫁（Tax Shifting）</div><div class=\"mc-body\"><div class=\"mc-formula\">納稅人將所繳的稅轉移給其他人負擔的經濟行為。</div><div class=\"mc-detail\">納稅人將所繳的稅轉移給其他人負擔的經濟行為。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc144\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">租稅歸宿（Tax Incidence）</div><div class=\"mc-body\"><div class=\"mc-formula\">租稅經過市場均衡後最終形成實際負擔的結果。</div><div class=\"mc-detail\">租稅經過市場均衡後最終形成實際負擔的結果。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc145\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">法定歸宿（Statutory Incidence）</div><div class=\"mc-body\"><div class=\"mc-formula\">在法律上所規定的納税義務人，也就是租稅的實際繳納者。</div><div class=\"mc-detail\">在法律上所規定的納税義務人，也就是租稅的實際繳納者。(p.91)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc146\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">經濟歸宿（Economic Incidence）</div><div class=\"mc-body\"><div class=\"mc-formula\">租稅實際的負擔者（bear the burden）。</div><div class=\"mc-detail\">租稅實際的負擔者（bear the burden）。真正繳納租稅的人未必是實際負擔者，因為課稅會改變商品的市場價格，透過價格改變將租稅造成的私人所得分配變化轉嫁出去。(p.92)</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li><strong>羅西法則數理推導</strong>：假設需求 <span class=\"fx\">P<sup>d</sup>=a-bQ</span>，供給 <span class=\"fx\">P<sup>s</sup>=-c+dQ</span>，對消費者課 <span class=\"fx\">t</span> 元從量稅：</li><li>課税前：<span class=\"fx\">Q<sup>*</sup>=(a+c)/(b+d)</span></li><li>課稅後：<span class=\"fx\">Q<sub>t</sub>=(a+c-t)/(b+d)</span></li><li>無謂損失：</li></ul>\n<p><span class=\"fx\">D.L.=bcE=t\\timesQ<sup>*</sup>-Q<sub>t</sub>/2=(t<sup>2</sup>)/(2(b+d))</span></p>\n<p>(p.91)</p>\n<ul><li><strong>租稅歸宿（每單位稅負）</strong>：</li><li>消費者負擔之單位稅收：</li></ul>\n<p><span class=\"fx\">\\overlineP<sub>t</sub><sup>d*</sup>P<sup>*</sup>=(E<sup>s</sup>)/(E<sup>s</sup>+E<sup>d</sup>)× t</span></p>\n<ul><li>生產者負擔之單位稅收：</li></ul>\n<p><span class=\"fx\">\\overlineP<sup>*</sup>P<sub>t</sub><sup>s*</sup>=(E<sup>d</sup>)/(E<sup>s</sup>+E<sup>d</sup>)× t</span></p>\n<p>(p.92)</p>\n<ul><li><strong>數理推導</strong>：課稅後 <span class=\"fx\">P<sub>t</sub><sup>s</sup>=(ad-bc-td)/(b+d)</span>，<span class=\"fx\">P<sub>t</sub><sup>d</sup>=(ad-bc+tb)/(b+d)</span>，消費者負擔 <span class=\"fx\">=(tb)/(b+d)=(E<sup>s</sup>)/(E<sup>d</sup>+E<sup>s</sup>)t</span>，生產者負擔 <span class=\"fx\">=(E<sup>d</sup>)/(E<sup>d</sup>+E<sup>s</sup>)t</span>。(p.93)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>相同的從量稅率對需求彈性相對大的 <span class=\"fx\">D<sub>1</sub></span> 造成的無謂損失大於需求彈性相對小的 <span class=\"fx\">D<sub>2</sub></span>。因此若要讓無謂損失相同，必須對需求彈性大者課低稅率、小者課高稅率。(p.90)</li><li>由 <span class=\"fx\">D.L.=(t<sup>2</sup>)/(2(b+d))</span> 可知：當 <span class=\"fx\">b</span> 或 <span class=\"fx\">d</span> 越大（供需線越陡，彈性越小），課稅的無謂損失越小。故對彈性小的財貨應予較高稅率；反之則較低稅率。(p.91)</li><li><strong>供給彈性與歸宿</strong>：供給彈性越大（供給線越平坦），生產者負擔的稅越少，消費者負擔的租稅越多；供給彈性越小（越陡）則相反。(p.94)</li><li><strong>供給彈性極端</strong>：</li><li>供給彈性無窮大（供給線水平）：生產者不負擔租稅，由消費者負擔所有的稅。</li><li>供給彈性為0（供給線垂直）：生產者負擔所有的稅，消費者不負擔。(p.94)</li><li><strong>需求彈性與歸宿</strong>：需求彈性越大（需求線越平坦），消費者負擔的稅越少，生產者負擔的租稅越多；需求彈性越小（越陡）則相反。(p.95)</li><li><strong>需求彈性極端</strong>：</li><li>需求彈性無窮大（需求線水平）：消費者不負擔租稅，由生產者負擔所有的稅。</li><li>需求彈性為0（需求線垂直）：消費者負擔所有的稅，生產者不負擔。(p.95)</li><li><strong>口訣</strong>：<strong>弹性小的一方（較無彈性）負擔較多的稅。</strong>(p.91 手寫附註)</li></ul>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Q</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">P</text><line x1=\"90\" y1=\"230\" x2=\"380\" y2=\"200\" stroke=\"#b5542e\" stroke-width=\"2.2\"></line><line x1=\"90\" y1=\"220\" x2=\"380\" y2=\"190\" stroke=\"#c89632\" stroke-width=\"1.4\" stroke-dasharray=\"4 3\"></line><line x1=\"90\" y1=\"50\" x2=\"380\" y2=\"180\" stroke=\"#1e7d32\" stroke-width=\"1.8\"></line><text x=\"386\" y=\"178\" font-size=\"10\" fill=\"#1e7d32\">D1 富彈性(平)</text><line x1=\"120\" y1=\"50\" x2=\"300\" y2=\"210\" stroke=\"#6b4e8e\" stroke-width=\"1.8\"></line><text x=\"306\" y=\"205\" font-size=\"10\" fill=\"#6b4e8e\">D2 缺彈性(陡)</text><circle cx=\"230\" cy=\"195\" r=\"3\" fill=\"#2b251d\"></circle><text x=\"238\" y=\"192\" font-size=\"9\">原均衡</text><text x=\"100\" y=\"80\" font-size=\"9\" fill=\"#1e7d32\">同稅率：富彈性→DL較大</text></svg><p class=\"figcap\">羅西法則：需求彈性大者無謂損失 DL 較大，故應對富彈性財課較低稅。(p.90)</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.19</strong>： 課稅的無謂損失何時最大？<div class=\"opts\"><div>(A) 供給有彈性、需求無彈性</div><div>(B) 供需皆有彈性</div><div>(C) 供給無彈性、需求有彈性</div><div>(D) 供需皆無彈性</div><div>(E) 以上皆非</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：供需皆有彈性時，課稅造成數量變動最大，DL 最大。答案選(B)。（詳解見書末 QR）(p.90)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.20（109台大商研）</strong>： 網球鞋市場供給水平、需求線性負斜率。政府對每雙鞋課稅 <span class=\"fx\">t</span>，不對其他財貨課稅。考慮將稅加倍：<div class=\"opts\"><div>(A) DL 正好變兩倍</div><div>(B) DL 超過兩倍</div><div>(C) DL 不到兩倍</div><div>(D) 須知道需求線斜率</div><div>(E) 皆非</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">DL=1/2t·Δ Q</span>，若 <span class=\"fx\">t</span> 加倍則 <span class=\"fx\">Δ Q</span> 也加倍（線性下），故 DL 變 <span class=\"fx\">4</span> 倍（超過兩倍）。答案選(B)。（詳解見書末 QR）(p.93)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.21</strong>： 作圖說明供給既定下，需求線越陡峭（需求越無彈性），政府對供給者每單位課 <span class=\"fx\">T</span> 元，消費者稅負比例越高。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：需求越陡（<span class=\"fx\">E<sup>d</sup></span> 越小），<span class=\"fx\">(E<sup>s</sup>)/(E<sup>s</sup>+E<sup>d</sup>)</span> 越大，消費者負擔比例越高。（詳解見書末 QR）(p.96)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 4.22</strong>： 電力需求完全無彈性，對電力課稅將？<div class=\"opts\"><div>(A) 生產者與消費者平均分摊</div><div>(B) 全由生產者付</div><div>(C) 全由消費者付</div><div>(D) 兩者不等額分摊</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：需求完全無彈性（垂直），消費者負擔全部稅。答案選(C)。（詳解見書末 QR）(p.96)</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><strong>羅西法則（Ramsey Rule）</strong>：倒需求彈性法則；彈性小者課高稅、彈性大者課低稅，使各財貨 DL 相等。</li><li><strong><span class=\"fx\">DL=(t<sup>2</sup>)/(2(b+d))</span></strong>：DL 與稅率平方成正比；線性下稅加倍則 DL 變四倍（例題4.20 觀念）。</li><li><strong>租稅歸宿公式</strong>：</li></ul>\n<p><span class=\"fx\">消費者負擔=(E<sup>s</sup>)/(E<sup>s</sup>+E<sup>d</sup>) t,\\qquad 生產者負擔=(E<sup>d</sup>)/(E<sup>s</sup>+E<sup>d</sup>) t</span></p>\n<ul><li><strong>彈性口訣</strong>：相對無彈性（較陡）的一方負擔較多稅；水平線（彈性無窮）一方完全不負擔；垂直線（彈性0）一方完全負擔。</li><li>法定歸宿 vs. 經濟歸宿的區分為名詞解釋常考。</li></ul>\n</div>\n</div>"}], "5": [{"id": "5.1", "title": "前言（印刷頁 99–100）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc137\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">偏好（Preference）</div><div class=\"mc-body\"><div class=\"mc-formula\">消費者對兩組商品所做的二元排列（Binary order），意即每次只比較兩組商品，並由之中選出較喜歡的該組商品。</div><div class=\"mc-detail\">消費者對兩組商品所做的二元排列（Binary order），意即每次只比較兩組商品，並由之中選出較喜歡的該組商品。(p.99)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc138\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">商品籃（A basket of commodities）</div><div class=\"mc-body\"><div class=\"mc-formula\">消費者消費的商品組合。</div><div class=\"mc-detail\">消費者消費的商品組合。最常見表示方式為 (X<span class=\"mpunct\">,</span>Y)=(2<span class=\"mpunct\">,</span>3)，代表消費者消費 2 個 <span class=\"fx\">X</span> 與 3 個 <span class=\"fx\">Y</span>。商品籃可以是多種商品組合，也可以只有一種。(p.99)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc139\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">效用（Utility）</div><div class=\"mc-body\"><div class=\"mc-formula\">消費者消費某項商品時候的滿足程度。</div><div class=\"mc-detail\">消費者消費某項商品時候的滿足程度。(p.99)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc140\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">基數效用分析法（Cardinal Utility Analysis）</div><div class=\"mc-body\"><div class=\"mc-formula\">假設滿足感是「客觀」的，以效用作為度量滿足感的單位，既然是客觀就可測度、可比較，不同人消費商品所得效用也能加總。</div><div class=\"mc-detail\">假設滿足感是「客觀」的，以效用作為度量滿足感的單位，既然是客觀就可測度、可比較，不同人消費商品所得效用也能加總。第五章所學。(p.100)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc141\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">序列效用分析法（Ordinal Utility Analysis）</div><div class=\"mc-body\"><div class=\"mc-formula\">承認效用是「主觀」的，由「偏好關係」出發，僅能用來排列而無法數理分析；透過效用函數描述偏好關係，但效用值本身不代表意義，只能在同一個消費者排序，不同消費者的效用值不能加總。</div><div class=\"mc-detail\">承認效用是「主觀」的，由「偏好關係」出發，僅能用來排列而無法數理分析；透過效用函數描述偏好關係，但效用值本身不代表意義，只能在同一個消費者排序，不同消費者的效用值不能加總。第六章至第八章所學。(p.100)</div></div></div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>消費者為什麼消費？為了從眾多商品組合中「選擇」一項來「消費」，消費當中得到「滿足感」。若該商品帶來的滿足感越大，對該商品需求越旺盛。(p.99)</li><li>對不同人來說，滿足感如同「如人飲水」，是經濟個體的主觀感受，無法客觀分析也沒有度量衡。經濟學家起初假設效用為客觀（基數效用）來解決計算問題，但後來發現沒有儀器可真正測量效用值大小，於是重新承認其為主觀，由偏好關係出發，並透過效用函數來做數理分析。(p.100)</li><li>消費者要滿足「願意」且「能夠」兩項條件才能構成商品需求。經濟學家最基本的模型就是消費者如何在一定的預算與資源限制下追求自身滿足程度最大的商品組合。(p.99)</li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>基數效用 vs. 序列效用的差異：基數可測量、可加總（人際可比）；序列僅可排序、不可加總。</li><li>效用函數（Utility Function）的意義：描述偏好關係的數學函數。</li><li>本章為基數效用（數列效用）分析；Ch6–8 為序列效用分析。</li></ul>\n</div>\n</div>"}, {"id": "5.2", "title": "總效用與邊際效用（印刷頁 101–103）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc133\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">效用（Utility）</div><div class=\"mc-body\"><div class=\"mc-formula\">財貨的消費帶給消費者的主觀滿足程度。</div><div class=\"mc-detail\">財貨的消費帶給消費者的主觀滿足程度。(p.101)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc134\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">總效用（Total Utility, TU）</div><div class=\"mc-body\"><div class=\"mc-formula\">其他情況不變，對於特定數量財貨的消費，消費者所感到的滿足程度總和。</div><div class=\"mc-detail\">其他情況不變，對於特定數量財貨的消費，消費者所感到的滿足程度總和。</div></div></div>\n<p class=\"def-note\">消費一項商品：<span class=\"fx\">TU(x)=f(x)=6x-x<sup>2</sup></span>。</p>\n<p class=\"def-note\">消費兩項（或以上）：<span class=\"fx\">TU(x,y)=f(x,y)=x<sup>2</sup>y</span>。(p.101)</p>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc135\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">邊際效用（Marginal Utility, MU）</div><div class=\"mc-body\"><div class=\"mc-formula\">其他情況不變，額外增加一單位財貨的消費，對於消費者滿足程度帶來的增加額。</div><div class=\"mc-detail\">其他情況不變，額外增加一單位財貨的消費，對於消費者滿足程度帶來的增加額。(p.101)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc136\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">邊際效用遞減法則（Law of Diminishing Marginal Utility）</div><div class=\"mc-body\"><div class=\"mc-formula\">其他情況不變，消費者對某財貨消費持續增加會使得其邊際效用隨著消費量增加而遞減。</div><div class=\"mc-detail\">其他情況不變，消費者對某財貨消費持續增加會使得其邊際效用隨著消費量增加而遞減。(p.101)</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>邊際效用：</li></ul>\n<p><span class=\"fx\">MU(Q)=\\begincases\\dfracΔ TUΔ Q & 若資料為離散型\\\\[6pt]\\dfracdTUdQ & 若資料為連續型\\endcases</span></p>\n<p>(p.101)</p>\n<ul><li>兩財貨下之偏微分：</li></ul>\n<p><span class=\"fx\">MU<sub>x</sub>=(∂ U)/(∂ x),\\qquad MU<sub>y</sub>=(∂ U)/(∂ y)</span></p>\n<p>(p.101)</p>\n<ul><li>總效用與邊際效用的關係：</li></ul>\n<p><span class=\"fx\">TU(Q)=\\begincases\\displaystyle∑<sub>i=1</sub><sup>Q<sup>*</sup></sup>MU<sub>i</sub> & 若資料為離散型\\\\[6pt]\\displaystyle∫<sub>0</sub><sup>Q<sup>*</sup></sup>MU dt & 若資料為連續型\\endcases</span></p>\n<p>(p.101)</p>\n<ul><li>邊際效用遞減法則：</li></ul>\n<p><span class=\"fx\">(Δ MU)/(Δ X)=(dMU)/(dX)=MU'<0</span></p>\n<p>(p.101)</p>\n<ul><li>在連續可微分函數下，<span class=\"fx\">MU=(dTU)/(dX)</span>，即邊際效用為總效用曲線上任一點切線斜率；由 <span class=\"fx\">MU'=dMU/dX\\lt 0</span>，總效用曲線為一斜率遞減的曲線。(p.101)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>由表格分析可知：總效用隨財貨消費量上升而上升，但到達一定程度後會隨消費數量增加而下降；邊際效用則隨消費數量下降。(p.102)</li><li>以 <span class=\"fx\">Q<sup>*</sup></span> 為分界：</li><li><span class=\"fx\">Q\\lt Q<sup>*</sup></span>：隨 <span class=\"fx\">Q</span> 上升 <span class=\"fx\">TU</span> 上升，<span class=\"fx\">MU>0</span>，此時財貨為<strong>喜好品（Goods）</strong>。</li><li><span class=\"fx\">Q=Q<sup>*</sup></span>：<span class=\"fx\">TU</span> 達最大值，<span class=\"fx\">MU=0</span>，此時財貨為<strong>中性品（Neutral）</strong>。</li><li><span class=\"fx\">Q>Q<sup>*</sup></span>：隨 <span class=\"fx\">Q</span> 上升 <span class=\"fx\">TU</span> 下降，<span class=\"fx\">MU<0</span>，此時財貨為<strong>厭惡品（Bads）</strong>。(p.103)</li><li>若是理性經濟個體，當邊際效用為負時消費該商品數量越多會造成滿足程度越低，消費者會拒絕消費該商品。這必須建立在邊際效用隨消費量增加而持續遞減的前提假設下，且消費數量存在一個極限值（消費到 <span class=\"fx\">MU=0</span> 時停止）。(p.103)</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><text x=\"220\" y=\"18\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6c7684\">上：TU 倒 U</text><path d=\"M80 120 Q200 40 360 110\" fill=\"none\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></path><text x=\"366\" y=\"112\" font-size=\"12\" fill=\"#1f3a5f\">TU</text><circle cx=\"220\" cy=\"70\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"228\" y=\"66\" font-size=\"10\" fill=\"#b5542e\">Q*</text><line x1=\"60\" y1=\"150\" x2=\"410\" y2=\"150\" stroke=\"#ccc\" stroke-width=\"1\"></line><text x=\"220\" y=\"166\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6c7684\">下：MU 負斜率，Q* 處 MU=0</text><line x1=\"80\" y1=\"178\" x2=\"380\" y2=\"250\" stroke=\"#b5542e\" stroke-width=\"2.2\"></line><text x=\"386\" y=\"248\" font-size=\"12\" fill=\"#b5542e\">MU</text><circle cx=\"220\" cy=\"208\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"228\" y=\"204\" font-size=\"10\" fill=\"#b5542e\">MU=0</text></svg><p class=\"figcap\">TU 上升段 MU>0、高峰處 MU=0、下降段 MU<0。(p.102)</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 5.1（100政大商管）</strong>： Mary 發現每多請一小時家教，邊際效用會遞減。若 Mary 繼續請家教直到成績開始退步，此時 MU 為？<div class=\"opts\"><div>(A) 正但上升變慢</div><div>(B) 零</div><div>(C) 負</div><div>(D) 不可測</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：成績開始退步時表示再多消費一單位帶來負的滿足，<span class=\"fx\">MU<0</span>。答案選(C)。（詳解見書末 QR）(p.103)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 5.2（政大商管）</strong>： 邊際效用遞減法則意謂？<div class=\"opts\"><div>(A) 某財貨 MU 為負</div><div>(B) 某財貨 TU 也遞減</div><div>(C) TU 的變動率遞減</div><div>(D) MU 的變動率遞減</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：MU 遞減指 MU 隨數量增加而下降，即 TU 的變動率（=MU）遞減。答案選(C)。（詳解見書末 QR）(p.103)</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><span class=\"fx\">MU=Δ TU/Δ Q</span>（離散）或 <span class=\"fx\">dTU/dQ</span>（連續）。</li><li><span class=\"fx\">TU=∑ MU<sub>i</sub></span>（離散加總）或 <span class=\"fx\">∫ MU dt</span>（連續積分）。</li><li>邊際效用遞減 <span class=\"fx\">MU'\\lt 0</span>；TU 曲線為凹向原點（斜率遞減）。</li><li>Goods/Neutral/Bads 的區分：<span class=\"fx\">MU>0</span>、<span class=\"fx\">MU=0</span>、<span class=\"fx\">MU<0</span>。</li><li>例題5.2 觀念：MU 遞減 ≠ MU 為負；TU 仍可上升只是上升速度變慢。</li></ul>\n</div>\n</div>"}, {"id": "5.3", "title": "消費者均衡（印刷頁 104–107）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc130\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">消費者均衡</div><div class=\"mc-body\"><div class=\"mc-formula\">消費者在預算限制下達到效用最大的條件。</div><div class=\"mc-detail\">消費者在預算限制下達到效用最大的條件。花最後一塊錢在每個財貨的邊際效用都必須相同才能達到消費者均衡。(p.104)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc131\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">邊際效用均等法則</div><div class=\"mc-body\"><div class=\"mc-formula\">上述均衡方程式又稱邊際效用均等法則。</div><div class=\"mc-detail\">上述均衡方程式又稱邊際效用均等法則。(p.104)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc132\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">貨幣的邊際效用（<span class=\"fx\">MU<sub>m</sub></span>）</div><div class=\"mc-body\"><div class=\"mc-formula\">增加一單位的貨幣持有量，使得總效用增加的幅度。</div><div class=\"mc-detail\">增加一單位的貨幣持有量，使得總效用增加的幅度。在分析過程中其扮演著將貨幣轉換為效用的角色。(p.104 腳註)</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>多財貨下消費者均衡條件：</li></ul>\n<p><span class=\"fx\">(MU<sub>X<sub>1</sub></sub>)/(P<sub>1</sub>)=(MU<sub>X<sub>2</sub></sub>)/(P<sub>2</sub>)=\\cdots=(MU<sub>X<sub>i</sub></sub>)/(P<sub>i</sub>)=\\cdots=(MU<sub>X<sub>n</sub></sub>)/(P<sub>n</sub>)=MU<sub>m</sub></span></p>\n<p>其中 <span class=\"fx\">M</span> 為預算限制，<span class=\"fx\">MU<sub>m</sub></span> 為貨幣的邊際效用。(p.104)</p>\n<ul><li>兩財貨（<span class=\"fx\">X</span> 與 <span class=\"fx\">Y</span>）簡化式：</li></ul>\n<p><span class=\"fx\">(MU<sub>X</sub>)/(P<sub>X</sub>)=(MU<sub>Y</sub>)/(P<sub>Y</sub>)=MU<sub>m</sub></span></p>\n<p>(p.104)</p>\n<ul><li>若只有 <span class=\"fx\">X</span> 財貨可以消費：多消費一單位 <span class=\"fx\">X</span> 的利得為 <span class=\"fx\">MU<sub>X</sub></span>，代價為 <span class=\"fx\">P<sub>X</sub>· MU<sub>m</sub></span>，均衡時：</li></ul>\n<p><span class=\"fx\">(MU<sub>X</sub>)/(P<sub>X</sub>)=MU<sub>m</sub></span></p>\n<p>(p.104)</p>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong>不均衡分析</strong>（假設消費兩項財貨，價格與貨幣邊際效用皆給定）：</li></ul>\n<ol><li>若 <span class=\"fx\">(MU<sub>X</sub>)/(P<sub>X</sub>)>(MU<sub>Y</sub>)/(P<sub>Y</sub>)</span>：一塊錢花在 <span class=\"fx\">X</span> 上的邊際效用大於花在 <span class=\"fx\">Y</span> 上，消費者會<strong>多消費 <span class=\"fx\">X</span>、少消費 <span class=\"fx\">Y</span></strong>。(p.105)</li><li>若 <span class=\"fx\">(MU<sub>X</sub>)/(P<sub>X</sub>)<(MU<sub>Y</sub>)/(P<sub>Y</sub>)</span>：一塊錢花在 <span class=\"fx\">X</span> 上的邊際效用小於花在 <span class=\"fx\">Y</span> 上，消費者會<strong>少消費 <span class=\"fx\">X</span>、多消費 <span class=\"fx\">Y</span></strong>。(p.105)</li><li>若 <span class=\"fx\">(MU<sub>X</sub>)/(P<sub>X</sub>)>MU<sub>m</sub></span>，即 <span class=\"fx\">MU<sub>X</sub>>P<sub>X</sub> MU<sub>m</sub></span>：多消費一單位 <span class=\"fx\">X</span> 的利得大於代價，消費者會選擇將所得多用於消費 <span class=\"fx\">X</span>。(p.105)</li><li>若 <span class=\"fx\">(MU<sub>X</sub>)/(P<sub>X</sub>)\\lt MU<sub>m</sub></span>，即 <span class=\"fx\">MU<sub>X</sub>\\lt P<sub>X</sub> MU<sub>m</sub></span>：多消費一單位 <span class=\"fx\">X</span> 的利得小於代價，消費者會少消費 <span class=\"fx\">X</span>。(p.105)</li></ol>\n<ul><li>當 <span class=\"fx\">(MU<sub>X</sub>)/(P<sub>X</sub>)=(MU<sub>Y</sub>)/(P<sub>Y</sub>)=MU<sub>m</sub></span> 時，代表一塊錢無論花在 <span class=\"fx\">X</span> 或 <span class=\"fx\">Y</span> 上所得到的邊際效用都一樣，消費者沒有誘因調整消費型態，故達到均衡。(p.104)</li><li>因為 <span class=\"fx\">MU</span> 遞減：多買 <span class=\"fx\">X⇒ MU<sub>X</sub>\\downarrow</span>；少買 <span class=\"fx\">Y⇒ MU<sub>Y</sub>\\uparrow</span>，直到兩者相等為止。(p.105 手寫附註)</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<div class=\"formula\"><div class=\"f-label\">邊際效用均等法則（無圖，列式判斷）</div><span class=\"fx\">\\frac{MU_X}{P_X}=\\frac{MU_Y}{P_Y}=\\cdots=\\lambda</span><div class=\"f-detail\">以邊際效用均等法則判斷消費者是否處於均衡、應增減何財；本節為數學條件式，無供需圖形。(p.105)</div></div></div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 5.3</strong>： Sarah 只消費草莓與奶油，花光所有所得。最後一盤草莓 MU=200，最後一品脫奶油 MU=200。草莓每盤$1，奶油每品脫$2。追求效用極大，Sarah 應？<div class=\"opts\"><div>(A) 多買草莓少買奶油</div><div>(B) 少買草莓多買奶油</div><div>(C) 不改變</div><div>(D) 在均衡點絕不買奶油</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">(MU<sub>S</sub>)/(P<sub>S</sub>)=200/1=200>200/2=100=(MU<sub>C</sub>)/(P<sub>C</sub>)</span>，故應多買草莓（使 MU 下降）、少買奶油（使 MU 上升）。答案選(A)。（詳解見書末 QR）(p.105)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 5.4</strong>： Keesha 只消費珍珠奶茶與漢堡。在消費者均衡下，下列何者正確？<div class=\"opts\"><div>(A) 每種財貨 MU 相同</div><div>(B) 每種財貨每元的 MU 相同</div><div>(C) 若比較喜歡漢堡，漢堡每元 MU 較高</div><div>(D) 若比較喜歡漢堡，珍珠奶茶每元 MU 較高</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：均衡條件為每元邊際效用相等 <span class=\"fx\">(MU<sub>b</sub>)/(P<sub>b</sub>)=(MU<sub>t</sub>)/(P<sub>t</sub>)</span>，而非 MU 本身相等。答案選(B)。（詳解見書末 QR）(p.106)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 5.5</strong>： Ben 買襯衫與鞋子，MU<span class=\"fx\">襯衫</span>​=12，MU<span class=\"fx\">鞋子</span>​=3；$P_{襯衫}=\\<span class=\"fx\">8</span>，$P_{鞋子}=\\<span class=\"fx\">2</span>。可推論？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">12/8=1.5</span>，<span class=\"fx\">3/2=1.5</span>，兩者相等，Ben 已處於均衡，沒有過度花在任何一項。（詳解見書末 QR）(p.106)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 5.6（台大國企）</strong>： Sally 消費蘋果與香蕉，表格給出各數量下 TU。蘋果 <span class=\"fx\">2</span>/個，香蕉 <span class=\"fx\">1</span>/條，所得 <span class=\"fx\">9</span><br>(1)忽略 <span class=\"fx\">MU<sub>m</sub></span>，依消費順序求最適消費組合<br>(2)若 <span class=\"fx\">MU<sub>m</sub>=3.5</span>，求最適組合。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：先計算各單位 <span class=\"fx\">MU/P</span>，由大到小排序，依序選購直到所得用完。（詳解見書末 QR）(p.106)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 5.7</strong>： 消費者面對 <span class=\"fx\">A,B,C</span> 三種財貨，表格給出各單位 MU。貨幣所得26元，<span class=\"fx\">P<sub>A</sub>=3</span>、<span class=\"fx\">P<sub>B</sub>=2</span>、<span class=\"fx\">P<sub>C</sub>=1</span>，求最適消費組合下之總效用。<div class=\"opts\"><div>(A) 251</div><div>(B) 262</div><div>(C) 274</div><div>(D) 283</div><div>(E) 以上皆非</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：計算各單位 <span class=\"fx\">MU/P</span> 後由大到小選購，總花費≤26。（詳解見書末 QR）(p.107)</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><strong>邊際效用均等法則 <span class=\"fx\">(MU<sub>X</sub>)/(P<sub>X</sub>)=(MU<sub>Y</sub>)/(P<sub>Y</sub>)=MU<sub>m</sub></span></strong> 為本章最核心公式，必考。</li><li>不均衡時的調整方向：<span class=\"fx\">(MU<sub>i</sub>)/(P<sub>i</sub>)</span> 大者應多買（使其 MU 因遞減而下降），小者應少買。</li><li>注意是「每元邊際效用」相等，而非 MU 本身相等（例題5.4 陷阱）。</li><li>表格題（例題5.6、5.7）：計算 <span class=\"fx\">MU/P</span>，由大到小排序選購。</li></ul>\n</div>\n</div>"}, {"id": "5.4", "title": "需求曲線的求導（印刷頁 108–110）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc129\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">需求價格/邊際利益（Marginal Benefit, <span class=\"fx\">MB<sub>X</sub></span>）</div><div class=\"mc-body\"><div class=\"mc-formula\"><span class=\"fx\">(MU<sub>X</sub>)/(MU<sub>m</sub>)</span> 為消費者的需求價格或最高願付價格，亦即 <span class=\"fx\">X</span> 物品邊際效用的貨幣值。</div><div class=\"mc-detail\"><span class=\"fx\">(MU<sub>X</sub>)/(MU<sub>m</sub>)</span> 為消費者的需求價格或最高願付價格，亦即 <span class=\"fx\">X</span> 物品邊際效用的貨幣值。(p.109)</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li><strong>假設</strong>：</li></ul>\n<ol><li>貨幣的邊際效用變化幅度很小，因此可視為常數給定。</li><li>邊際效用遞減法則成立。(p.108)</li></ol>\n<ul><li><strong>預算線之設定</strong>：假設只消費 <span class=\"fx\">X</span> 與 <span class=\"fx\">Y</span> 兩項財貨，價格與所得分別為 <span class=\"fx\">P<sub>X</sub></span>、<span class=\"fx\">P<sub>Y</sub></span> 與 <span class=\"fx\">M</span>：</li></ul>\n<p><span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y</span></p>\n<p>(p.108)</p>\n<ul><li><strong>根據邊際效用均等法則</strong>：</li></ul>\n<p><span class=\"fx\">(MU<sub>X</sub>)/(P<sub>X</sub>)=(MU<sub>Y</sub>)/(P<sub>Y</sub>)=MU<sub>m</sub></span></p>\n<p>將焦點著重至 <span class=\"fx\">X</span> 財貨上（除 <span class=\"fx\">X</span> 外財貨皆以貨幣支出方式表示），可縮減為：</p>\n<p><span class=\"fx\">(MU<sub>X</sub>)/(P<sub>X</sub>)=MU<sub>m</sub></span></p>\n<p>移項後得：</p>\n<p><span class=\"fx\">P<sub>X</sub>=(MU<sub>X</sub>)/(MU<sub>m</sub>)</span></p>\n<p>(p.108)</p>\n<ul><li><strong>需求價格</strong>：</li></ul>\n<p><span class=\"fx\">(MU<sub>X</sub>)/(MU<sub>m</sub>)=P<sub>X</sub><sup>d</sup>=MB<sub>X</sub></span></p>\n<p>(p.109)</p>\n<ul><li><strong>需求曲線為負斜率的數學推導</strong>：令 <span class=\"fx\">c≡(1)/(MU<sub>m</sub>)\\inConstant</span>：</li></ul>\n<p><span class=\"fx\">P<sup>d</sup>(X)=(MU<sub>X</sub>(X))/(MU<sub>m</sub>)=c· MU<sub>X</sub>(X)</span></p>\n<p><span class=\"fx\">\\therefore(dP<sub>X</sub>)/(dX)=c(dMU<sub>X</sub>(X))/(dX)=c MU'<sub>X</sub>(X)=-c |MU'<sub>X</sub>(X)|<0</span></p>\n<p>(p.109)</p>\n<ul><li><strong>需求價格彈性</strong>：</li></ul>\n<p><span class=\"fx\">E<sup>d</sup>=-(dX)/(dP<sub>X</sub>)\\timesP<sub>X</sub>/X=-(1)/((dP<sub>X</sub>)/(dX))\\timesP<sub>X</sub>/X=(1)/(c |MU'<sub>X</sub>(X)|)\\timesc MU<sub>X</sub>(X)/X=(MU<sub>X</sub>(X))/(|MU'<sub>X</sub>(X)| X)</span></p>\n<p>(p.109)</p>\n<ul><li>故若 <span class=\"fx\">|MU'<sub>X</sub>(X)|=|(dMU<sub>X</sub>(X))/(dX)|</span> 大，意即邊際效用遞減速度越快，彈性越小。(p.110)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>找出給定不同數量下的最高願付價格並連線，就得到需求線或需求表。(p.109)</li><li>在貨幣邊際效用 <span class=\"fx\">MU<sub>m</sub></span> 假設為常數的前提下，增加 <span class=\"fx\">X</span> 的消費量，只要邊際效用 <span class=\"fx\">MU<sub>X</sub></span> 遞減，消費者願意支付的價格 <span class=\"fx\">P<sub>X</sub></span> 就會做同比例下降；此方法可導出 <span class=\"fx\">X</span> 的需求量與其價格間反向變動的關係。換言之，邊際效用遞減與負斜率需求線之結果是一致的。(p.109)</li><li>若商品的邊際效用遞減速度很快，則表示需求曲線的斜率亦會較陡（或說需求彈性會相對較小）。(p.109)</li><li><strong>結論</strong>：</li></ul>\n<ol><li>當貨幣的邊際效用為 1，需求曲線和邊際效用曲線重合。</li><li>由於需求曲線是根據邊際效用均等法則導出，故需求曲線上每一點皆滿足邊際效用均等法則，且滿足消費者均衡。</li><li>需求曲線是在給定貨幣的邊際效用下導出，又因為邊際效用遞減，故需求曲線為負斜率。</li><li>需求曲線是負斜率，並不保證邊際效用遞減。</li><li>邊際效用遞減速度越快，商品需求彈性越小。(p.110)</li></ol>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><text x=\"115\" y=\"20\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6c7684\">左：MU_X(X)</text><line x1=\"60\" y1=\"40\" x2=\"200\" y2=\"230\" stroke=\"#b5542e\" stroke-width=\"2.2\"></line><circle cx=\"110\" cy=\"130\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"66\" y=\"120\" font-size=\"10\" fill=\"#1e7d32\">X0</text><circle cx=\"160\" cy=\"190\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"150\" y=\"205\" font-size=\"10\" fill=\"#1e7d32\">X1</text><text x=\"225\" y=\"135\" font-size=\"14\" fill=\"#6c7684\">÷MU_m</text><text x=\"330\" y=\"20\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6c7684\">右：P^d=MU_X/MU_m</text><line x1=\"250\" y1=\"40\" x2=\"390\" y2=\"230\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></line><text x=\"396\" y=\"228\" font-size=\"12\" fill=\"#1f3a5f\">D</text></svg><p class=\"figcap\">MU_m 固定時需求線＝MU 線除以常數，負斜率。</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 5.8</strong>： 給定貨幣邊際效用為 2，某甲對 <span class=\"fx\">X</span> 財貨的邊際效用表如下（X=1<span class=\"mpunct\">,</span>2<span class=\"mpunct\">,</span>3<span class=\"mpunct\">,</span>4<span class=\"mpunct\">,</span>5 對應 <span class=\"fx\">MU<sub>X</sub>=20,18,14,8,0</span>），請繪製某甲對 <span class=\"fx\">X</span> 財貨的需求曲線。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：由 <span class=\"fx\">P<sub>X</sub>=MU<sub>X</sub>/MU<sub>m</sub>=MU<sub>X</sub>/2</span>，得各單位願付價格為 10, 9, 7, 4, 0。（詳解見書末 QR）(p.110)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 5.9</strong>： 若邊際效用隨消費增加而急劇變化（sharply change），則？<div class=\"opts\"><div>(A) 該財貨需求無彈性</div><div>(B) 供給無彈性</div><div>(C) 供為有彈性</div><div>(D) 需求有彈性</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：∣MU<span class=\"fx\">′</span>∣ 大表示 MU 遞減快→需求曲線陡→需求無彈性。答案選(A)。（詳解見書末 QR）(p.110)</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><strong><span class=\"fx\">P<sub>X</sub>=(MU<sub>X</sub>)/(MU<sub>m</sub>)</span></strong>：需求價格 = 邊際效用的貨幣表達。</li><li><span class=\"fx\">MU<sub>m</sub>=1</span> 時，需求線與 MU 線重合。</li><li><span class=\"fx\">E<sup>d</sup>=(MU<sub>X</sub>)/(|MU'<sub>X</sub>|· X)</span>：MU 遞減越快（∣MU<span class=\"fx\">′</span>∣ 大）→ 需求越無彈性。</li><li>邊際效用遞減法則解釋了需求法則（負斜率需求線）。</li></ul>\n</div>\n</div>"}, {"id": "5.5", "title": "鑽石與水的矛盾（印刷頁 111–112）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc126\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">價格（Price）</div><div class=\"mc-body\"><div class=\"mc-formula\">消費者為了換取商品而願意付出的代價。</div><div class=\"mc-detail\">消費者為了換取商品而願意付出的代價。(p.111)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc127\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">價值（Value）</div><div class=\"mc-body\"><div class=\"mc-formula\">針對人類生存而言是否具有意義。</div><div class=\"mc-detail\">針對人類生存而言是否具有意義。(p.111)</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc128\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">鑽石與水的矛盾/價值的矛盾（Paradox of Value）</div><div class=\"mc-body\"><div class=\"mc-formula\">水是人類生活必需品但價格很低，且水能交換到的財貨數量很少；鑽石雖非人類所必須，但價格如此昂貴，且鑽石能交換非常多的財貨。</div><div class=\"mc-detail\">水是人類生活必需品但價格很低，且水能交換到的財貨數量很少；鑽石雖非人類所必須，但價格如此昂貴，且鑽石能交換非常多的財貨。(p.111)</div></div></div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong>提出者</strong>：亞當·斯密（Adam Smith）。(p.111)</li><li><strong>理論內容</strong>：水與鑽石之間存在價值的矛盾。由表格可知：</li></ul>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:16.67%\"><col style=\"width:16.67%\"><col style=\"width:16.67%\"><col style=\"width:16.67%\"><col style=\"width:16.67%\"><col style=\"width:16.67%\"></colgroup><thead><tr><th></th><th>數量</th><th>效用</th><th>邊際效用</th><th>用途</th><th>價格</th></tr></thead><tbody><tr><td>水</td><td>多</td><td>高</td><td>低</td><td>多</td><td>低</td></tr><tr><td>鑽石</td><td>少</td><td>低</td><td>高</td><td>少</td><td>高</td></tr></tbody></table></div>\n<p>(p.111)</p>\n<ul><li><strong>核心結論</strong>：</li><li><strong>價格的高低取決於邊際效用的高低</strong>（財貨價格為邊際效用決定，而非總效用）。</li><li><strong>價值的高低取決於總效用的高低</strong>。</li><li>因為鑽石數量相對水來得少，所以帶給消費者的邊際效用很高，因此鑽石的價格較貴；但因為水的數量相對鑽石多，所以帶給消費者的總效用很高，因此水的使用價值很高。(p.111)</li></ul>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">X</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Y</text><line x1=\"60\" y1=\"140\" x2=\"410\" y2=\"140\" stroke=\"#ccc\" stroke-width=\"1\" stroke-dasharray=\"4 3\"></line><line x1=\"180\" y1=\"230\" x2=\"180\" y2=\"30\" stroke=\"#ccc\" stroke-width=\"1\" stroke-dasharray=\"4 3\"></line><circle cx=\"140\" cy=\"140\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"110\" y=\"132\" font-size=\"10\" fill=\"#1e7d32\">B(XB,YB)</text><circle cx=\"180\" cy=\"140\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"186\" y=\"132\" font-size=\"10\" fill=\"#1e7d32\">C(XC,YC)</text><circle cx=\"180\" cy=\"90\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"186\" y=\"86\" font-size=\"10\" fill=\"#b5542e\">D(B正上方)</text><circle cx=\"260\" cy=\"140\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"266\" y=\"136\" font-size=\"10\" fill=\"#6b4e8e\">A(C正右方)</text></svg><p class=\"figcap\">字典性偏好：X 優先，X 相同才比 Y；無異曲線退化為點，違反連續性。(p.116)</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 5.10</strong>： 以經濟學的觀點，水的價格何以較鑽石低？<div class=\"opts\"><div>(A) 水的總效用低於鑽石</div><div>(B) 水生產成本低</div><div>(C) 水的邊際效用低於鑽石的邊際效用</div><div>(D) 水的邊際成本低</div><div>(E) 水平均成本低</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：價格由邊際效用決定，水數量多→MU 低→價格低。答案選(C)。（詳解見書末 QR）(p.112)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 5.11</strong>： 水的價格很便宜，鑽石價格很貴，是因為水的總效用小而鑽石的總效用大——此說法是否正確？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：錯。正確說法是水的邊際效用少（數量多），鑽石的邊際效用高（數量少）；反而是水的總效用大、鑽石的總效用小。（詳解見書末 QR）(p.112)</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><strong>價格由邊際效用決定，價值（使用價值）由總效用決定</strong>——本章最重要結論，必考。</li><li>亞當·斯密提出「價值的矛盾（Paradox of Value）」。</li><li>例題5.11 為典型錯誤命題判斷：便宜的水 ≠ 總效用小；反而是總效用大、邊際效用小。</li></ul>\n</div>\n</div>"}], "6": [{"id": "6.1", "title": "消費者偏好基本公理（印刷頁115–118）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc123\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">消費集合（Consumption set, <span class=\"fx\">S</span>）</div><div class=\"mc-body\"><div class=\"mc-formula\">消費者面對所有可能「商品<span class=\"fx\">X</span>」與「商品<span class=\"fx\">Y</span>」之消費組合的集合：</div><div class=\"mc-detail\">消費者面對所有可能「商品<span class=\"fx\">X</span>」與「商品<span class=\"fx\">Y</span>」之消費組合的集合：</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc124\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">偏好（Preference）</div><div class=\"mc-body\"><div class=\"mc-formula\">消費者對任意兩組商品所做的主觀二元排列（Binary order），每次只比較兩組商品並選出較喜歡者。</div><div class=\"mc-detail\">消費者對任意兩組商品所做的主觀二元排列（Binary order），每次只比較兩組商品並選出較喜歡者(p.115)。</div></div></div>\n<p class=\"def-note\">偏好符號(p.115)：</p>\n<p class=\"def-note\"><span class=\"fx\">\\succ</span>：優於（<span class=\"fx\">A\\succ B</span>，或 <span class=\"fx\">A\\succsim B</span> 且 <span class=\"fx\">A∼ B</span>），英文 <span class=\"fx\">A</span> is strictly preferred to <span class=\"fx\">B</span>。</p>\n<p class=\"def-note\"><span class=\"fx\">\\succsim</span>：弱優於（<span class=\"fx\">A\\succsim B</span>，<span class=\"fx\">A</span> is weakly preferred to <span class=\"fx\">B</span>）。</p>\n<p class=\"def-note\"><span class=\"fx\">∼</span>：無異（<span class=\"fx\">A∼ B</span>，<span class=\"fx\">A</span> is indifference to <span class=\"fx\">B</span>）。</p>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc125\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">數列效用 vs 序列效用之比較(p.115)</div><div class=\"mc-body\"><div class=\"mc-formula\">數列效用 vs 序列效用之比較(p.115)</div><div class=\"mc-detail\"></div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>字典性偏好（Lexicographic preference）定義（違反連續性的特例）(p.116)：</li></ul>\n<p><span class=\"fx\">A\\succ B if X<sub>A</sub>>X<sub>B</sub></span></p>\n<p><span class=\"fx\">A\\succ B if X<sub>A</sub>=X<sub>B</sub>\\ 且\\ Y<sub>A</sub>>Y<sub>B</sub></span></p>\n<p>（消費者先比 <span class=\"fx\">X</span>，<span class=\"fx\">X</span> 相同才比 <span class=\"fx\">Y</span>）</p>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論（六大公理）</div>\n<p>> 書 p.115：理性消費者必須符合<strong>三項公理（一定成立）</strong>＋<strong>三項假設（可視情況不成立）</strong>。</p>\n<ol><li><strong>完整性（Completeness）</strong>：任意兩組商品可比較，<span class=\"fx\">A\\succ B</span>、<span class=\"fx\">A∼ B</span>、<span class=\"fx\">A\\prec B</span> 必居其一；消費者不會無法抉擇(p.116)。</li><li><strong>反射性（Reflexivity）</strong>：任一組商品和它本身無差異，<span class=\"fx\">A∼ A</span>、<span class=\"fx\">B∼ B</span>(p.116)。</li><li><strong>遞移性（Transitivity）</strong>：若 <span class=\"fx\">A</span> 不劣於 <span class=\"fx\">B</span> 且 <span class=\"fx\">B</span> 不劣於 <span class=\"fx\">C</span>，則 <span class=\"fx\">A</span> 必不劣於 <span class=\"fx\">C</span>。</li></ol>\n<ul><li>(1)~(3) 成立即可進行「理性選擇」分析；此三條為<strong>保障消費者做出最佳選擇</strong>的公理(p.116)。</li></ul>\n<ol><li><strong>連續性（Continuity）且可微分（Differentiable）</strong>：若 <span class=\"fx\">A</span> 優於 <span class=\"fx\">B</span>，必可找到與 <span class=\"fx\">A</span> 足夠接近的 <span class=\"fx\">C</span> 也嚴格優於 <span class=\"fx\">B</span>（<span class=\"fx\">A\\succ B</span> 且 <span class=\"fx\">A∼ C⇒ C\\succ B</span>）。代表商品可無限細分、商品籃組合緊密連接。</li></ol>\n<ul><li><strong>字典性偏好違反連續性</strong>：<span class=\"fx\">B</span> 點與 <span class=\"fx\">D</span> 點 <span class=\"fx\">X</span> 相同而 <span class=\"fx\">Y<sub>D</sub>>Y<sub>B</sub></span>，故 <span class=\"fx\">D\\succ B</span>；依連續性應存在夠接近 <span class=\"fx\">B</span> 的 <span class=\"fx\">C</span> 使 <span class=\"fx\">D\\succ C</span>，但 <span class=\"fx\">C</span> 點 <span class=\"fx\">X</span> 量大於 <span class=\"fx\">B</span>、<span class=\"fx\">D</span>，故 <span class=\"fx\">C\\succ B</span> 且 <span class=\"fx\">C\\succ D</span>，矛盾。故字典性偏好違反連續性，每個點效用值都不同(p.116–117)。</li><li>若滿足(1)~(3)，必可找到實數函數描述偏好；再加上(4)連續可微分假設，即可找到「效用函數」(p.117)。</li></ul>\n<ol><li><strong>單調性（Monotonicity）</strong>(p.117)：</li></ol>\n<ul><li><strong>弱單調性</strong>：若 <span class=\"fx\">X≥ X<sub>1</sub></span> 且 <span class=\"fx\">Y≥ Y<sub>1</sub></span>，則 <span class=\"fx\">(X,Y)\\succsim(X<sub>1</sub>,Y<sub>1</sub>)</span>，增加一點東西至少和原來一樣好（<span class=\"fx\">MU≥ 0</span>）。</li><li><strong>強單調性</strong>：若 <span class=\"fx\">X>X<sub>1</sub></span> 且 <span class=\"fx\">Y>Y<sub>1</sub></span>，則 <span class=\"fx\">(X,Y)\\succ(X<sub>1</sub>,Y<sub>1</sub>)</span>（<span class=\"fx\">MU>0</span>）。</li><li>單調性成立代表<strong>無飽和點（Non-satiation）</strong>；消費組合超出飽和點總效用會下降。正常分析假設不存在飽和點。</li><li>幾何意義：<span class=\"fx\">A</span> 點右上方（東北方）為較優區，左下方（西南方）為較劣區。無異曲線必從西北畫到東南，故<strong>無異曲線為負斜率</strong>。</li></ul>\n<ol><li><strong>凸性（Convexity）</strong>(p.118)：任意兩組商品線性組合至少不劣於其中任一商品。</li></ol>\n<ul><li><strong>嚴格凸性（Strict convexity）</strong>：若 <span class=\"fx\">A∼ B</span>，則 <span class=\"fx\">tA+(1-t)B\\succ A</span>（或 <span class=\"fx\">B</span>），其中 <span class=\"fx\">0\\lt t\\lt 1</span>。</li><li>tA+(1−t)B=C 為 <span class=\"fx\">A,B</span> 加權平均（線性組合），落於 <span class=\"fx\">\\overlineAB</span> 連線上；<span class=\"fx\">t=\\tfrac12</span> 時 <span class=\"fx\">C</span> 為中點。</li><li>經濟意涵：<strong>Averages are preferred to extremes（平均優於極端）</strong>，消費者喜好多樣化。</li><li><strong>凸性（Convexity，非嚴格）</strong>：若 <span class=\"fx\">A∼ B</span>，則 <span class=\"fx\">tA+(1-t)B\\succsim A</span>（或 <span class=\"fx\">B</span>），其中 <span class=\"fx\">0≤ t≤ 1</span>。</li><li>主要差別：嚴格凸性下消費者必同時消費 <span class=\"fx\">X,Y</span>；（非嚴格）凸性下消費者可能只消費其中一種。</li></ul>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div><svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">X</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Y</text><line x1=\"60\" y1=\"140\" x2=\"410\" y2=\"140\" stroke=\"#ccc\" stroke-width=\"1\" stroke-dasharray=\"4 3\"></line><line x1=\"180\" y1=\"230\" x2=\"180\" y2=\"30\" stroke=\"#ccc\" stroke-width=\"1\" stroke-dasharray=\"4 3\"></line><circle cx=\"140\" cy=\"140\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"108\" y=\"132\" font-size=\"10\" fill=\"#1e7d32\">B</text><circle cx=\"180\" cy=\"140\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"186\" y=\"132\" font-size=\"10\" fill=\"#1e7d32\">C</text><circle cx=\"180\" cy=\"90\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"186\" y=\"86\" font-size=\"10\" fill=\"#b5542e\">D(B此上方)</text><circle cx=\"260\" cy=\"140\" r=\"3.5\" fill=\"#6b4e8e\"></circle><text x=\"266\" y=\"136\" font-size=\"10\" fill=\"#6b4e8e\">A(C此右方)</text></svg><p class=\"figcap\">字典性偏好：X 優先，X 相同才比 Y；無異曲線退化為點，違反連續性。(p.116)</p></div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>三大公理（完整、反射、遞移）為「理性」必要條件；三大假設（連續可微、單調、凸性）為數學工具鋪路。</li><li>字典性偏好為「違反連續性」標準例題；其無異曲線不存在（每個點效用都不同）。</li><li>嚴格凸 ⇔ 平均優於極端 ⇔ 喜愛多樣化，保證內部解。</li></ul>\n</div>\n</div>"}, {"id": "6.2", "title": "效用函數（Utility function）（印刷頁119–124）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc120\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">效用函數</div><div class=\"mc-body\"><div class=\"mc-formula\">刻劃消費者偏好結構的函數形式。</div><div class=\"mc-detail\">刻劃消費者偏好結構的函數形式。唯有偏好滿足 6.1(1)~(4) 假設，才可找到連續可微分的實數函數描述偏好(p.119)。</div></div></div>\n<p class=\"def-note\">效用函數滿足性質(p.119)：</p>\n<p class=\"def-note\"><span class=\"fx\">(X<sub>1</sub>,Y<sub>1</sub>)\\succ(X<sub>2</sub>,Y<sub>2</sub>)\\Leftrightarrow U(X<sub>1</sub>,Y<sub>1</sub>)>U(X<sub>2</sub>,Y<sub>2</sub>)</span></p>\n<p class=\"def-note\"><span class=\"fx\">(X<sub>1</sub>,Y<sub>1</sub>)∼(X<sub>2</sub>,Y<sub>2</sub>)\\Leftrightarrow U(X<sub>1</sub>,Y<sub>1</sub>)=U(X<sub>2</sub>,Y<sub>2</sub>)</span></p>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc121\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">良好偏好（Well-behaved preferences）</div><div class=\"mc-body\"><div class=\"mc-formula\">若偏好滿足六大公理，代表具有嚴格凸性質，可用<strong class=\"term\">嚴格準凹函數（Strictly quasi-concave function）</strong>描述。</div><div class=\"mc-detail\">若偏好滿足六大公理，代表具有嚴格凸性質，可用<strong class=\"term\">嚴格準凹函數（Strictly quasi-concave function）</strong>描述(p.119)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc122\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">無異曲線（Indifference curve）</div><div class=\"mc-body\"><div class=\"mc-formula\">對消費者而言「效用相同」的所有商品組合集合，即效用函數投射至 <span class=\"fx\">XY</span> 平面：</div><div class=\"mc-detail\">對消費者而言「效用相同」的所有商品組合集合，即效用函數投射至 <span class=\"fx\">XY</span> 平面：</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>無異曲線全微分(p.120)：</li></ul>\n<p><span class=\"fx\">\\barU=U(X,Y),\\qquad d\\barU=(∂ U)/(∂ X)dX+(∂ U)/(∂ Y)dY=0</span></p>\n<p><span class=\"fx\">⇒ -MU<sub>Y</sub> dY=MU<sub>X</sub> dX⇒ (dY)/(dX)\\biggr|<sub>IC</sub>=-(MU<sub>X</sub>)/(MU<sub>Y</sub>)<0</span></p>\n<ul><li><strong>邊際替代率（MRS, Marginal Rate of Substitution）</strong>(p.121)：在其他情況不變（給定效用水準不變）下，增加一單位 <span class=\"fx\">X</span> 的消費主觀上願意犧牲多少 <span class=\"fx\">Y</span> 單位的消費。</li></ul>\n<p><span class=\"fx\">MRS<sub>X(for Y)</sub>=-(dY)/(dX)=(MU<sub>X</sub>)/(MU<sub>Y</sub>)</span></p>\n<ul><li>MRS 即無異曲線切線斜率加負號，為消費者面對兩項財貨的<strong>主觀交換比率</strong>。</li><li>MRS 越大，代表給定效用水準下增加 1 單位 <span class=\"fx\">X</span> 主觀上願意放棄越多 <span class=\"fx\">Y</span>，代表消費者越偏好 <span class=\"fx\">X</span>。</li><li><strong>MRS 遞減（凸向原點）</strong>(p.121)：</li></ul>\n<p><span class=\"fx\">(dMRS)/(dX)<0</span></p>\n<p>隨著 <span class=\"fx\">X</span> 增加，為維持效用不變而主觀上願意放棄的 <span class=\"fx\">Y</span> 數量下降。</p>\n<ul><li>MRS 對 <span class=\"fx\">X</span> 微分推導(p.121–122)：</li></ul>\n<p><span class=\"fx\">MRS=(U<sub>X</sub>[X,Y(X)])/(U<sub>Y</sub>[X,Y(X)])</span></p>\n<p><span class=\"fx\">(dMRS)/(dX)=(U<sub>XX</sub>U<sub>Y</sub><sup>2</sup>-2U<sub>XY</sub>U<sub>X</sub>U<sub>Y</sub>+U<sub>YY</sub>U<sub>X</sub><sup>2</sup>)/(U<sub>Y</sub><sup>3</sup>)</span></p>\n<p>其中 <span class=\"fx\">\\dfracdYdX=-\\dfracU<sub>X</sub>[X,Y(X)]U<sub>Y</sub>[X,Y(X)]</span>，<span class=\"fx\">U<sub>XY</sub>=U<sub>YX</sub></span>。</p>\n<ul><li>嚴格凸條件(p.122)：在單調性下 <span class=\"fx\">U<sub>X</sub>>0,U<sub>Y</sub>>0</span>，故正負關鍵為</li></ul>\n<p><span class=\"fx\">U<sub>XX</sub>U<sub>Y</sub><sup>2</sup>-2U<sub>XY</sub>U<sub>X</sub>U<sub>Y</sub>+U<sub>YY</sub>U<sub>X</sub><sup>2</sup><0\\qquad\\cdots(*)</span></p>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li><strong>邊際效用遞減 ≠ MRS 遞減</strong>(p.122)：</li><li>邊際效用遞減只能
