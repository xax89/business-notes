確保 <span class=\"fx\">U<sub>XX</sub><0</span>、<span class=\"fx\">U<sub>YY</sub><0</span>，但 <span class=\"fx\">U<sub>XY</sub></span> 正負不確定，無法保證 <span class=\"fx\">(*)</span> 成立。</li><li>只要 <span class=\"fx\">-2U<sub>XY</sub>U<sub>X</sub>U<sub>Y</sub></span> 為負且夠大，即使邊際效用遞增（<span class=\"fx\">U<sub>XX</sub>>0,U<sub>YY</sub>>0</span>），<span class=\"fx\">(*)</span> 仍可能成立。</li><li><strong>故邊際效用遞減既不是 MRS 遞減的充分條件，也不是必要條件，兩者沒有隱含關係。</strong></li><li><strong>嚴格凸 vs 凸性之無異曲線</strong>(p.122)：嚴格凸 → 無異曲線必凸向原點；凸性（非嚴格）→ 允許無異曲線存在直線段（<span class=\"fx\">A,B</span> 線性組合 <span class=\"fx\">C</span> 仍落在原無異曲線上）。</li><li><strong>反證法證明良好偏好下無異曲線必凸向原點</strong>(p.123)：假設無異曲線凹向原點且滿足良好偏好。①由單調性，因 <span class=\"fx\">U<sub>0</sub></span> 在 <span class=\"fx\">U<sub>1</sub></span> 東北方，故 <span class=\"fx\">U<sub>0</sub>>U<sub>1</sub></span>；②由嚴格凸性，<span class=\"fx\">C</span> 為 <span class=\"fx\">A,B</span> 線性組合，故 <span class=\"fx\">U<sub>1</sub>>U<sub>0</sub></span>；①②矛盾，故必凸向原點。</li><li><strong>無異曲線四大特性（良好偏）下</strong>(p.120–123)：</li></ul>\n<ol><li>負斜率（兩財皆為喜好品時）。</li><li>凸向原點（MRS 遞減）。</li><li>越往東北方效用水準越高（<span class=\"fx\">U''\\gt U'\\gt U</span>）。</li><li>同人同一時期任兩條無異曲線不相交（反證：若 <span class=\"fx\">U<sub>0</sub>,U<sub>1</sub></span> 交於 <span class=\"fx\">A</span>，<span class=\"fx\">U<sub>0</sub>(A)=U<sub>0</sub>(B)</span> 且 <span class=\"fx\">U<sub>0</sub>(A)=U<sub>1</sub>(C)</span> <span class=\"fx\">⇒ U<sub>0</sub>(B)=U<sub>1</sub>(C)</span>；但單調性 <span class=\"fx\">U<sub>0</sub>(B)>U<sub>1</sub>(C)</span>，矛盾）。</li></ol>\n</div>\n<div class=\"callout fig\"><div class=\"clabel\">圖形概念</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><defs><marker id=\"ar\" markerwidth=\"8\" markerheight=\"8\" refx=\"6\" refy=\"3\" orient=\"auto\"><path d=\"M0 0L6 3L0 6z\" fill=\"#b5542e\"></path></marker></defs><line x1=\"80\" y1=\"220\" x2=\"380\" y2=\"60\" stroke=\"#1f3a5f\" stroke-width=\"2.2\"></line><text x=\"386\" y=\"62\" font-size=\"11\" fill=\"#1f3a5f\">預算線 M=P_X X+P_Y Y</text><path d=\"M110 50 Q160 120 360 195\" fill=\"none\" stroke=\"#b5542e\" stroke-width=\"2\"></path><text x=\"366\" y=\"196\" font-size=\"11\" fill=\"#b5542e\">U*</text><circle cx=\"220\" cy=\"130\" r=\"4\" fill=\"#1e7d32\"></circle><text x=\"230\" y=\"126\" font-size=\"11\" fill=\"#1e7d32\">E*(X*,Y*)</text><text x=\"90\" y=\"90\" font-size=\"10\" fill=\"#6c7684\">切點：MRS=P_X/P_Y</text></svg><p class=\"figcap\">預算線與最高可達無異曲線相切，滿足 MRS=P_X/P_Y。角解則在軸上。</p>\n</div>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.1</strong>： 有關邊際替代率之敘述何者正確？<div class=\"opts\"><div>(A) 邊際效用遞減表示邊際替代率遞減</div><div>(B) 刻畫消費者對商品的主觀取捨換比</div><div>(C) 邊際替代率遞減表示邊際效用遞減</div><div>(D) 邊際替代率遞減隱含無異曲線凹向原點</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：正解為 (B)。MRS 即主觀交換比率；(A)(C) 邊際效用遞減與 MRS 遞減無隱含關係；(D) MRS 遞減隱含凸向原點而非凹。（詳解見書末 QR） (p.124)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.2</strong>： Which of the following statements is false?<div class=\"opts\"><div>(A) 無異曲線負斜率時凸向原點</div><div>(B) 消費者喜好多於少時無異曲線負斜率</div><div>(C) X,Y 邊際效用皆正時無異曲線負斜率</div><div>(D) 邊際效用遞減時無異曲線凸向原點</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(D) 為 false——邊際效用遞減不必然保證 MRS 遞減（交叉偏微分 <span class=\"fx\">U<sub>XY</sub></span> 不確定）。（詳解見書末 QR） (p.124)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.3</strong>： 三個市場籃子（Cheese, Crackers）：<span class=\"fx\">A=(5,8)</span>、<span class=\"fx\">B=(15,6)</span>、<span class=\"fx\">C=(10,7)</span>。若 <span class=\"fx\">A,B</span> 在同一無異曲線且 MRS 遞減，則：<div class=\"opts\"><div>(A) <span class=\"fx\">C</span> 優於 <span class=\"fx\">A,B</span></div><div>(B) <span class=\"fx\">A,B</span> 皆優於 <span class=\"fx\">C</span></div><div>(C) <span class=\"fx\">C</span> 與 <span class=\"fx\">A,B</span> 同無異</div><div>(D) A或B正確但非C。【中山企管、政大企管】</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">C=(10,7)</span> 為 <span class=\"fx\">A=(5,8)</span> 與 <span class=\"fx\">B=(15,6)</span> 的線性組合（<span class=\"fx\">t=\\tfrac12</span>）；MRS 遞減（嚴格凸）下線性組合應優於端點，故 <span class=\"fx\">C\\succ A∼ B</span>。（詳解見書末 QR） (p.124)</div></li></ul>\n</div>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>MRS 定義式 <span class=\"fx\">MRS=\\dfracMU<sub>X</sub>MU<sub>Y</sub></span> 與無異曲線斜率 <span class=\"fx\">-\\dfracMU<sub>X</sub>MU<sub>Y</sub></span> 的關係必考。</li><li>邊際效用遞減與 MRS 遞減「無隱含關係」為研究所高頻觀念題（例6.1、6.2）。</li><li>無異曲線四大特性（負斜率、凸向原點、東北效用水準高、不相交）須能反證。</li></ul>\n</div>\n</div>"}, {"id": "6.3", "title": "常用偏好結構與預算線（印刷頁125–145）", "body": "\n<h4 class=\"sub3\">一、常用偏好結構</h4>\n<h5 class=\"sub4\">（一）Cobb-Douglas（柯布-道格拉斯）型(p.125–126)</h5>\n<p>##### 定義與公式</p>\n<ul><li>函數型態：</li></ul>\n<p><span class=\"fx\">U=AX^α Y^β;\\qquad A,α,β>0\\inconstant</span></p>\n<ul><li>邊際效用(p.125)：</li></ul>\n<p><span class=\"fx\">MU<sub>X</sub>=(∂ U)/(∂ X)=Aα X<sup>α-1</sup>Y^β>0,\\qquad MU<sub>Y</sub>=(∂ U)/(∂ Y)=Aβ X^α Y<sup>β-1</sup>>0</span></p>\n<ul><li>無異曲線斜率(p.125)：</li></ul>\n<p><span class=\"fx\">\\barU=AX^α Y^β, d\\barU=Aα X<sup>α-1</sup>Y^β dX+Aβ X^α Y<sup>β-1</sup>dY</span></p>\n<p><span class=\"fx\">\\therefore\\left.(dY)/(dX)|_\\barU=-(Aα X<sup>α-1</sup>Y^β)/(Aβ X^α Y<sup>β-1</sup>)=-(α Y)/(β X)<0</span></p>\n<ul><li>邊際替代率(p.125)：</li></ul>\n<p><span class=\"fx\">MRS=-\\left.(dY)/(dX)|_\\barU=(MU<sub>X</sub>)/(MU<sub>Y</sub>)=(α Y)/(β X)</span></p>\n<ul><li>MRS 是否遞減(p.125)：</li></ul>\n<p><span class=\"fx\">(dMRS)/(dX)=(α/β)(\\frac\\dfracdYdXX-YX<sup>2</sup>)=(α/β)(\\frac-(\\dfracαβ)(\\dfracYX)X-YX<sup>2</sup>)<0</span></p>\n<p>注意：MRS 在同一條無異曲線上衡量，<span class=\"fx\">Y</span> 受 <span class=\"fx\">X</span> 影響（沿曲線變動），微分時必須對 <span class=\"fx\">Y</span> 微分。Cobb-Douglas 滿足良好偏好。</p>\n<p>##### 重點與結論</p>\n<ul><li><strong>同位（位似、齊序）偏好（Homothetic Preference）</strong>(p.126)：由原點任射一條射線 <span class=\"fx\">Y=ω X</span>（<span class=\"fx\">ω>0</span>），該射線與無異曲線所有交點之 MRS 皆相同：</li></ul>\n<p><span class=\"fx\">MRS=(α ω X)/(β X)=αω/β</span></p>\n<p>只要在同一條原點出發射線上，該射線與無異曲線所有交點 MRS 皆相同。</p>\n<p>##### 圖形概念</p>\n<ul><li>座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；負斜率凸向原點無異曲線 <span class=\"fx\">U=AX^α Y^β</span>。</li><li>二圖：通過原點射線 <span class=\"fx\">Y=ω X</span> 交無異曲線 <span class=\"fx\">U<sub>1</sub>=AX^α Y^β</span> 於 <span class=\"fx\">A(X<sub>A</sub>,ω X<sub>A</sub>)</span>、交 <span class=\"fx\">U<sub>2</sub>=AX^α Y^β</span> 於 <span class=\"fx\">B(X<sub>B</sub>,ω X<sub>B</sub>)</span>；兩點 MRS 同為 <span class=\"fx\">\\dfracαωβ</span>。</li></ul>\n<h5 class=\"sub4\">（二）Leontief（里昂鐵夫，完全互補）型(p.126–128)</h5>\n<p>##### 定義與公式</p>\n<ul><li>意義：<span class=\"fx\">α</span> 單位的 <span class=\"fx\">X</span> 必須搭配 <span class=\"fx\">β</span> 單位的 <span class=\"fx\">Y</span> 一起消費（如一碗滷肉飯配一碗豬腦湯）。</li><li>函數型態(p.126)：</li></ul>\n<p><span class=\"fx\">U=\\minX/α,Y/β 或 U=\\min\\β X,α Y\\;\\qquadα,β>0\\inconstant</span></p>\n<p>其中 <span class=\"fx\">\\min\\·\\</span> 為選 <span class=\"fx\">\\·\\</span> 中最小者作為效用值。</p>\n<ul><li>以 <span class=\"fx\">\\barU=\\min(X,Y)</span> 為例（<span class=\"fx\">α=β=1</span>）(p.127)：拐點在 <span class=\"fx\">X=Y</span>；<span class=\"fx\">X<sub>A</sub>=1</span> 固定時，無論 <span class=\"fx\">Y≥ 1</span> 多少，效用值皆為 <span class=\"fx\">U<sub>0</sub>=1</span>。</li><li>通式拐點軌跡(p.127)：<span class=\"fx\">X</span> 與 <span class=\"fx\">Y</span> 必須同時以 <span class=\"fx\">α:β</span> 比例變化效用才會改變：</li></ul>\n<p><span class=\"fx\">X:Y=α:β ⇒ Y=β/αX</span></p>\n<p>##### 重點與結論</p>\n<ul><li>無異曲線為<strong>直角型或 <span class=\"fx\">L</span> 型</strong>（水平段＋垂直段），拐點落在 <span class=\"fx\">Y=\\dfracβαX</span> 射線上。</li><li><span class=\"fx\">X</span> 固定增加而 <span class=\"fx\">Y</span> 不變時效用不變（水平段）；<span class=\"fx\">Y</span> 固定增加而 <span class=\"fx\">X</span> 不變時效用不變（垂直段）。</li><li><strong>不滿足嚴格凸</strong>(p.128)：<span class=\"fx\">MRS</span> 無法定義（拐點處尖折）；在同一 <span class=\"fx\">L</span> 型無異曲線上取 <span class=\"fx\">C,D</span> 兩點，其加權中點 <span class=\"fx\">E</span> 仍落在原無異曲線上（效用未嚴格大於端點），故里昂鐵夫並非嚴格凸（但為凸性）。</li></ul>\n<p>##### 圖形概念</p>\n<ul><li>座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；<span class=\"fx\">U<sub>0</sub>=\\min(X,Y)</span> 為 <span class=\"fx\">L</span> 形，拐點在 <span class=\"fx\">X=Y</span>；<span class=\"fx\">U<sub>1</sub></span> 在 <span class=\"fx\">U<sub>0</sub></span> 東北方（拐點 <span class=\"fx\">X=2,Y=2</span>）。</li><li>通式：<span class=\"fx\">Y=\\dfracβαX</span> 為拐點射線；<span class=\"fx\">U=\\min\\X/α,Y/β\\</span> 與 <span class=\"fx\">U'=\\min\\X/α,Y/β\\</span> 為兩個 <span class=\"fx\">L</span> 型，拐點皆在該射線上。</li><li>嚴格凸檢查：<span class=\"fx\">C,E,D</span> 三點同在水平段上，<span class=\"fx\">E</span> 為 <span class=\"fx\">C,D</span> 中點但未優於 <span class=\"fx\">C,D</span>。</li></ul>\n<h5 class=\"sub4\">（三）Linear（直線、完全替代）型(p.128–129)</h5>\n<p>##### 定義與公式</p>\n<ul><li>意義：對消費者而言，<span class=\"fx\">α</span> 單位的 <span class=\"fx\">X</span> 必須與 <span class=\"fx\">β</span> 單位的 <span class=\"fx\">Y</span> 完全相同（如 5 單位傳說對決 = 3 單位經濟課本）。</li><li>函數型態(p.128)：</li></ul>\n<p><span class=\"fx\">U=X/α+Y/β 或 U=β X+α Y;\\qquadα,β>0\\inconstant</span></p>\n<ul><li>邊際效用(p.129)：</li></ul>\n<p><span class=\"fx\">MU<sub>X</sub>=(∂ U)/(∂ X)=1/α>0,\\qquad MU<sub>Y</sub>=(∂ U)/(∂ Y)=1/β>0</span></p>\n<ul><li>無異曲線斜率(p.129)：</li></ul>\n<p><span class=\"fx\">d\\barU=1/αdX+1/βdY=0 ⇒ \\left.(dY)/(dX)|_\\barU=-β/α<0</span></p>\n<ul><li>邊際替代率(p.129)：</li></ul>\n<p><span class=\"fx\">MRS=-\\left.(dY)/(dX)|_\\barU=(MU<sub>X</sub>)/(MU<sub>Y</sub>)=β/α</span></p>\n<ul><li>MRS 遞減(p.129)：</li></ul>\n<p><span class=\"fx\">(dMRS)/(dX)=0</span></p>\n<p>故 Linear 型<strong>不滿足良好偏好</strong>（無異曲線為直線，MRS 固定）。</p>\n<p>##### 圖形概念</p>\n<ul><li>座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；無異曲線為負斜率直線，縱軸截距 <span class=\"fx\">β\\barU</span>、橫軸截距 <span class=\"fx\">α\\barU</span>，斜率 <span class=\"fx\">-\\dfracβα</span>。</li></ul>\n<h5 class=\"sub4\">（四）Quasi-Linear（準線、似線）型(p.129–130)</h5>\n<p>##### 定義與公式</p>\n<ul><li>意義：當消費財貨中有一個商品支出比例很低，或出現非必要性財貨時。</li><li>函數型態(p.129)：由非線性與線性部分組成：</li></ul>\n<p><span class=\"fx\">U=α f(X)+β Y;\\qquadα,β>0\\inconstant</span></p>\n<p>例如 <span class=\"fx\">U=5\\ln X+Y</span>、<span class=\"fx\">U=5√(X)+3Y</span>、<span class=\"fx\">U=3X+Y<sup>2</sup></span>。</p>\n<ul><li>邊際效用(p.129)：</li></ul>\n<p><span class=\"fx\">MU<sub>X</sub>=(∂ U)/(∂ X)=α f'(x)\\gtrless 0,\\qquad MU<sub>Y</sub>=(∂ U)/(∂ Y)=β>0</span></p>\n<p>線性部分必滿足單調性；非線性部分須假設為喜好品 <span class=\"fx\">f'(X)\\gt 0</span>。</p>\n<ul><li>無異曲線斜率(p.129)：</li></ul>\n<p><span class=\"fx\">d\\barU=α f'(X)dX+β dY=0 ⇒ \\left.(dY)/(dX)|_\\barU=-α/βf'(X)<0</span></p>\n<ul><li>邊際替代率(p.129)：</li></ul>\n<p><span class=\"fx\">MRS=-\\left.(dY)/(dX)|_\\barU=(MU<sub>X</sub>)/(MU<sub>Y</sub>)=α/βf'(X)</span></p>\n<ul><li>MRS 遞減(p.130)：</li></ul>\n<p><span class=\"fx\">(dMRS)/(dX)=(α/β)(df'(X))/(dX)\\gtrless 0</span></p>\n<p>當非線性部分邊際效用為正且邊際效用遞減（<span class=\"fx\">f'(X)\\gt 0</span>、<span class=\"fx\">f''(X)\\lt 0</span>）時，才有嚴格凸特性。</p>\n<p>##### 重點與結論</p>\n<ul><li><strong>MRS 僅受非線性財貨數量影響</strong>：在給定 <span class=\"fx\">X</span> 下，無異曲線在 <span class=\"fx\">X</span> 處切線斜率無論 <span class=\"fx\">Y</span> 為何皆相同。</li><li>無異曲線為<strong>垂直平移</strong>關係（同一 <span class=\"fx\">X</span> 高度，斜率相同）。</li><li>若非線性部分反函數存在，橫軸截距為 <span class=\"fx\">f<sup>-1</sup>(\\dfrac\\barUα)</span>、縱軸截距 <span class=\"fx\">\\dfrac\\barUβ</span>。</li></ul>\n<p>##### 圖形概念</p>\n<ul><li>上圖：單條無異曲線 <span class=\"fx\">\\barU=α f(X)+β Y</span>，縱截距 <span class=\"fx\">\\dfrac\\barUβ</span>、橫截距 <span class=\"fx\">f<sup>-1</sup>(\\dfrac\\barUα)</span>。</li><li>下圖：兩條無異曲線 <span class=\"fx\">\\barU=α f(X)+β Y<sub>0</sub></span>、<span class=\"fx\">\\widehatU=α f(X)+β Y<sub>1</sub></span>，在同一垂直線 <span class=\"fx\">X</span> 上切點 <span class=\"fx\">(X,Y<sub>0</sub>)</span>、<span class=\"fx\">(X,Y<sub>1</sub>)</span> 切線斜率相同（垂直平移）。</li></ul>\n<h4 class=\"sub3\">二、其他偏好結構</h4>\n<h5 class=\"sub4\">（一）同心圓型態(p.131–133)</h5>\n<p>##### 定義與公式</p>\n<ul><li>意義：財貨消費在某個範圍內為喜好品，超過該範圍則為厭惡品。</li><li>函數型態(p.131)：</li></ul>\n<p><span class=\"fx\">U=A-(X-\\hatx)<sup>2</sup>-(Y-\\haty)<sup>2</sup>;\\qquad A,\\hatx,\\haty>0\\inconstant</span></p>\n<ul><li>邊際效用(p.131)：</li></ul>\n<p><span class=\"fx\">(∂ U)/(∂ X)=MU<sub>X</sub>=-2(X-\\hatx)</span></p>\n<ul><li><span class=\"fx\">X<\\hatx</span>：<span class=\"fx\">MU<sub>X</sub>>0</span>，<span class=\"fx\">X</span> 為喜好品；<span class=\"fx\">X=\\hatx</span>：<span class=\"fx\">MU<sub>X</sub>=0</span>，中性品；<span class=\"fx\">X>\\hatx</span>：<span class=\"fx\">MU<sub>X</sub><0</span>，厭惡品。</li><li><span class=\"fx\">Y</span> 部分同理：<span class=\"fx\">Y<\\haty</span> 喜好品、<span class=\"fx\">Y=\\haty</span> 中性品、<span class=\"fx\">Y>\\haty</span> 厭惡品。</li><li>四區域斜率(p.132)：</li><li>區域 I（<span class=\"fx\">X<\\hatx,Y<\\haty</span>）：兩喜好品，<span class=\"fx\">dY/dX=-MU<sub>X</sub>/MU<sub>Y</sub><0</span>，負斜率。</li><li>區域 II（<span class=\"fx\">X>\\hatx,Y<\\haty</span>）：<span class=\"fx\">X</span> 厭惡品、<span class=\"fx\">Y</span> 喜好品，<span class=\"fx\">dY/dX=-MU<sub>X</sub>/MU<sub>Y</sub>>0</span>，正斜率。</li><li>區域 III（<span class=\"fx\">X>\\hatx,Y>\\haty</span>）：兩厭惡品，<span class=\"fx\">dY/dX<0</span>，負斜率。</li><li>區域 IV（<span class=\"fx\">X<\\hatx,Y>\\haty</span>）：<span class=\"fx\">X</span> 喜好品、<span class=\"fx\">Y</span> 厭惡品，<span class=\"fx\">dY/dX>0</span>，正斜率。</li><li>極樂點（Bliss point）：<span class=\"fx\">X=\\hatx</span> 且 <span class=\"fx\">Y=\\haty</span> 時 <span class=\"fx\">U=A</span> 最大；越往內圈效用越大（<span class=\"fx\">U<sub>1</sub>>U<sub>0</sub></span>）。</li></ul>\n<p>##### 圖形概念</p>\n<ul><li>座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；同心圓環繞中心 <span class=\"fx\">(\\hatx,\\haty)</span>（極樂點）；水平虛線 <span class=\"fx\">Y=\\haty</span>、垂直虛線 <span class=\"fx\">X=\\hatx</span> 分四區域；各區域標喜好品（goods）/厭惡品（bads）；箭頭指向極樂點（效用增進方向）。</li><li>應用（兩軸一好一壞）：無異曲線為正斜率，箭頭指向「好」財方向。</li><li><strong>兩軸其中一軸為中性品</strong>(p.133)：</li><li><span class=\"fx\">Y</span> 為中性品（<span class=\"fx\">MU<sub>Y</sub>=0</span>）：<span class=\"fx\">dY/dX=-MU<sub>X</sub>/0→-∞</span>，無異曲線垂直；<span class=\"fx\">X</span> 為喜好品時水平右移效用升，<span class=\"fx\">X</span> 為厭惡品時水平左移效用升。</li><li><span class=\"fx\">X</span> 為中性品（<span class=\"fx\">MU<sub>X</sub>=0</span>）：<span class=\"fx\">dY/dX=-0/MU<sub>Y</sub>=0</span>，無異曲線水平；<span class=\"fx\">Y</span> 為喜好品時垂直上移效用升，<span class=\"fx\">Y</span> 為厭惡品時垂直下移效用升。</li></ul>\n<h5 class=\"sub4\">（二）滿足單調性但不滿足凸性假設(p.133–134)</h5>\n<ul><li>若不滿足凸性，任意兩點加權平均點之效用低於原先兩點：</li></ul>\n<p><span class=\"fx\">tA+(1-t)B=C\\prec A (或 B)</span></p>\n<ul><li>消費者不喜歡多樣化而只喜歡消費其中一項財貨，常有違反邊際效用遞減「越吃越想吃」現象（如毒品）。</li><li>常見例子：<span class=\"fx\">U=X<sup>2</sup>+Y<sup>2</sup></span>；無異曲線凹向原點（MRS 遞增），但仍越往東北方效用越高（滿足單調性）。</li></ul>\n<p>##### 圖形概念</p>\n<ul><li>座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；凹向原點無異曲線 <span class=\"fx\">U</span>、U<span class=\"fx\">′</span>（U<span class=\"fx\">′</span> 在東北）；<span class=\"fx\">A</span> 在左上、<span class=\"fx\">B</span> 在右下、<span class=\"fx\">C</span> 在 <span class=\"fx\">\\overlineAB</span> 中點；<span class=\"fx\">C</span> 落於更低無異曲線上。</li></ul>\n<h5 class=\"sub4\">（三）相加可分型（Additive separability）的偏好(p.134)</h5>\n<ul><li>效用函數長相：</li></ul>\n<p><span class=\"fx\">U=∑<sub>i=1</sub><sup>n</sup> u<sub>i</sub>(x<sub>i</sub>)</span></p>\n<p>其中 <span class=\"fx\">u<sub>i</sub>(x<sub>i</sub>)</span> 表消費第 <span class=\"fx\">i</span> 個財貨 <span class=\"fx\">x<sub>i</sub></span> 單位所得效用值，例如 <span class=\"fx\">U=√(X<sub>1</sub>)+√(X<sub>2</sub>)</span>。</p>\n<ul><li>不同財貨間偏微分必為零：</li></ul>\n<p><span class=\"fx\">(∂)/(∂ x<sub>j</sub>)[(∂ u<sub>i</sub>)/(∂ x<sub>i</sub>)]=0;\\qquad∀ i≠ j</span></p>\n<ul><li>若所有 <span class=\"fx\">u<sub>i</sub>(x<sub>i</sub>)</span> 一階微分為正、二階微分為負，則偏好滿足嚴格凸性。</li><li>假設 U(X<span class=\"mpunct\">,</span>Y)=U(X)+U(Y)，則 <span class=\"fx\">MRS=\\dfracU<sub>X</sub>(X)U<sub>Y</sub>(Y)</span>；代入 MRS 遞減條件，若 <span class=\"fx\">U<sub>XX</sub><0,U<sub>YY</sub><0</span> 即滿足嚴格凸。</li></ul>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.4</strong>： Alicia 吃素不吃牛肉（beef 不提供效用），喜愛 potatoes。橫軸畫 beef、縱軸畫 potatoes，無異曲線將：<div class=\"opts\"><div>(A) 斜率向下</div><div>(B) 垂直直線</div><div>(C) 斜率向上</div><div>(D) 水平直線</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：beef 為中性品（<span class=\"fx\">MU<sub>X</sub>=0</span>），無異曲線水平（<span class=\"fx\">dY/dX=-0/MU<sub>Y</sub>=0</span>），正解 (D)。（詳解見書末 QR） (p.134)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.5</strong>： 請繪製下列敘述之無異曲線：(1)一個蘿萄一個坑<br>(2)看到經濟統計就想吐<br>(3)找零時五元和一元一樣<br>(4)電池沒電 iPhone 不能用<br>(5)給再多錢也不吃蟲<br>(6)橫軸榴槤縱軸汽水，某甲：①兩者皆討厭 ②汽水喝五罐後會想吐 ③榴槤越吃越多不論汽水喝幾罐效用皆越來越高<br>(7)自掃門前雪莫管他人瓦上霜<br>(8)愛美不怕流鼻水。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：各小題對應完全互補、厭惡品、完全替代、中性品、邊際效用遞減轉折等圖形。（詳解見書末 QR） (p.135)</div></li></ul>\n</div>\n<h4 class=\"sub3\">（四）單調遞增轉換與效用函數(p.135–137)</h4>\n<ul><li>數列效用 vs 序列效用差異：數列效用中 <span class=\"fx\">U(X<sub>1</sub>,Y<sub>1</sub>)=10\\lt U(X<sub>2</sub>,Y<sub>2</sub>)=100</span>，可推知 <span class=\"fx\">(X<sub>2</sub>,Y<sub>2</sub>)</span> 比 <span class=\"fx\">(X<sub>1</sub>,Y<sub>1</sub>)</span> 好十倍；序列效用中數字大小無意義，僅能排序。</li><li>若存在另一消費者 <span class=\"fx\">V</span> 且 <span class=\"fx\">V(X<sub>1</sub>,Y<sub>1</sub>)=200\\lt V(X<sub>2</sub>,Y<sub>2</sub>)=2000</span>，雖效用值不同，但 <span class=\"fx\">V</span> 與 <span class=\"fx\">U</span> 表現<strong>同樣偏好結構</strong>。</li><li>一個偏好結構可由超過一個（其實可有無窮多個）效用函數描述。</li><li><strong>特色</strong>(p.137)：(1)偏好順序相同<br>(2)無異曲線形狀相同；(3)MRS 相同<br>(4)在所得、價格水準相同下，效用極大化之均衡消費量相同<br>(5)效用值不同（no one cares）。</li></ul>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.6</strong>： 下列何者偏好結構與 <span class=\"fx\">U=X^α Y^β</span>（<span class=\"fx\">α>0,β>0</span>）相同？(1)<span class=\"fx\">V<sub>1</sub>=X^α Y^β+1</span> (2)<span class=\"fx\">V<sub>2</sub>=α\\ln X+β\\ln Y</span> (3)<span class=\"fx\">V<sub>3</sub>=√(X^α Y^β)</span> (4)<span class=\"fx\">V<sub>4</sub>=α X+β Y</span>。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：單調遞增轉換（<span class=\"fx\">V=f[U],f'\\gt 0</span>）不改變偏好結構；(1)(2)(3) 皆為 <span class=\"fx\">U</span> 的單調遞增轉換，(4) 為線性函數不同。（詳解見書末 QR） (p.137)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.7</strong>： 請證明當 V(X<span class=\"mpunct\">,</span>Y)=f[U(X<span class=\"mpunct\">,</span>Y)] 且 <span class=\"fx\">\\dfrac∂ V∂ U=\\dfrac∂ f∂ U>0</span> 時，<span class=\"fx\">V</span> 與 <span class=\"fx\">U</span> 的 MRS 相同。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：鏈鎖法則 <span class=\"fx\">V<sub>X</sub>=f'U<sub>X</sub></span>、<span class=\"fx\">V<sub>Y</sub>=f'U<sub>Y</sub></span>，故 <span class=\"fx\">MRS<sub>V</sub>=V<sub>X</sub>/V<sub>Y</sub>=U<sub>X</sub>/U<sub>Y</sub>=MRS<sub>U</sub></span>。（詳解見書末 QR） (p.137)</div></li></ul>\n</div>\n<h4 class=\"sub3\">四、預算限制線（Budget constraint line）(p.137–145)</h4>\n<h5 class=\"sub4\">定義</h5>\n<ul><li><strong>預算限制線（Budget constraint line）</strong>：又稱消費可能曲線/前緣（Consumption possibility curve/Frontier）。其他情況不變，消費者在所得 <span class=\"fx\">M</span> 及財貨價格 <span class=\"fx\">(P<sub>X</sub>,P<sub>Y</sub>)</span> 給定下，可能消費 <span class=\"fx\">X,Y</span> 的兩種財貨組合軌跡(p.137)：</li></ul>\n<p><span class=\"fx\">M≥ P<sub>X</sub> X+P<sub>Y</sub> Y</span></p>\n<ul><li><span class=\"fx\">N</span> 種商品時：</li></ul>\n<p><span class=\"fx\">M≥∑<sub>i=0</sub><sup>n</sup> P<sub>i</sub> X<sub>i</sub></span></p>\n<h5 class=\"sub4\">公式</h5>\n<ul><li><strong>絕對價格（Absolute price）</strong>：商品價格以貨幣價值衡量（如一張簽名照 500 美金）。</li><li><strong>相對價格（Relative price）</strong>：某商品可換取其他商品數量的比例；以 <span class=\"fx\">Y</span> 商品表示的 <span class=\"fx\">X</span> 價格為 <span class=\"fx\">\\dfracP<sub>X</sub>P<sub>Y</sub></span>(p.138)。</li><li>預算線斜率(p.138)：</li></ul>\n<p><span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y,\\qquad dM=P<sub>X</sub>dX+P<sub>Y</sub>dY=0 (M 外生給定)</span></p>\n<p><span class=\"fx\">\\therefore\\left.(dY)/(dX)|<sub>BC</sub>=-(P<sub>X</sub>)/(P<sub>Y</sub>)<0</span></p>\n<ul><li>經濟意涵：所得固定下，增加一單位 <span class=\"fx\">X</span> 消費必須放棄 <span class=\"fx\">\\dfracP<sub>X</sub>P<sub>Y</sub></span> 的 <span class=\"fx\">Y</span> 數量，即消費 <span class=\"fx\">X</span> 的機會成本，為消費者面對 <span class=\"fx\">X</span> 與 <span class=\"fx\">Y</span> 的<strong>客觀交換比率</strong>。</li><li>截距：橫軸 <span class=\"fx\">\\dfracMP<sub>X</sub></span>、縱軸 <span class=\"fx\">\\dfracMP<sub>Y</sub></span>。</li></ul>\n<h5 class=\"sub4\">重點與結論（比較靜態分析）</h5>\n<ol><li><strong><span class=\"fx\">X</span> 價格上升（下降）</strong>：預算線變陡（平坦），且內移（外移）；縱軸截距不變，橫軸截距由 <span class=\"fx\">\\dfracMP<sub>X</sub></span> 縮小至 <span class=\"fx\">\\dfracMP<sub>X</sub>'</span>（<span class=\"fx\">P<sub>X</sub>'>P<sub>X</sub></span>）(p.139)。</li><li><strong><span class=\"fx\">Y</span> 價格上升（下降）</strong>：預算線變平坦（陡），且內移（外移）；橫軸截距不變，縱軸截距變動(p.140)。</li><li><strong><span class=\"fx\">M</span> 上升（下降）</strong>：預算線<strong>平行外移（內移）</strong>；預算線越往外移代表所得水準越高(p.140)。</li><li>消費點在預算線下方時所得未完全花光；預算線下方三角形面積內任一點為消費可能集合（Consumption possibility set）。</li></ol>\n<h5 class=\"sub4\">圖形概念</h5>\n<ul><li>基本預算線：座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；連接 <span class=\"fx\">(0,M/P<sub>Y</sub>)</span> 與 <span class=\"fx\">(M/P<sub>X</sub>,0)</span> 之負斜率直線 <span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y</span>，斜率標 <span class=\"fx\">-\\dfracP<sub>X</sub>P<sub>Y</sub></span>；線上標「剛好花完」、線下斜線區域標「錢有剩」（消費可能集合）。</li><li><span class=\"fx\">P<sub>X</sub></span> 變動：縱軸截距不變，三條預算線由陡到平對應 <span class=\"fx\">P<sub>X</sub>'\\lt P<sub>X</sub>\\lt P<sub>X</sub>''</span>，箭頭示 <span class=\"fx\">P<sub>X</sub></span> 下降時預算線外移（逆時針轉）。</li><li><span class=\"fx\">P<sub>Y</sub></span> 變動：橫軸截距不變；<span class=\"fx\">P<sub>Y</sub>\\uparrow</span> 箭頭向下（縱截距下移）、<span class=\"fx\">P<sub>Y</sub>\\downarrow</span> 箭頭向上（縱截距上移）。</li><li><span class=\"fx\">M</span> 變動：三條平行預算線，<span class=\"fx\">M''\\lt M\\lt M'</span>，截距同比例變動。</li></ul>\n<h4 class=\"sub3\">五、其他情況的預算線</h4>\n<h5 class=\"sub4\">（一）打折型態(p.140–141)</h5>\n<ol><li><strong>溯及既往</strong>：財貨買到一定數量，所有財貨價格一致降價。例如 <span class=\"fx\">X</span> 買超過 <span class=\"fx\">\\barX</span> 個時，全數都降價 <span class=\"fx\">a</span> 元：</li></ol>\n<p><span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y if\\ X≤\\barX</span></p>\n<p><span class=\"fx\">M=(P<sub>X</sub>-a)X+P<sub>Y</sub>Y if\\ X>\\barX</span></p>\n<p>幾何：預算線在 <span class=\"fx\">\\barX</span> 處折點，右段斜率變平（<span class=\"fx\">-(P<sub>X</sub>-a)/P<sub>Y</sub></span>），縱軸截距不變。</p>\n<ol><li><strong>不溯及既往</strong>：財貨買到一定數量，超過的財貨價格一致降價：</li></ol>\n<p><span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y if\\ X≤\\barX</span></p>\n<p><span class=\"fx\">M=P<sub>X</sub>\\barX+(P<sub>X</sub>-a)(X-\\barX)+P<sub>Y</sub>Y if\\ X>\\barX</span></p>\n<p>幾何：折點在 <span class=\"fx\">\\barX</span>，右段斜率 <span class=\"fx\">-(P<sub>X</sub>-a)/P<sub>Y</sub></span> 變平；橫軸截距為 <span class=\"fx\">\\dfracMP<sub>X</sub>-a</span>。</p>\n<h5 class=\"sub4\">（二）限制消費數量（Rationing）(p.142)</h5>\n<ul><li>若消費者被限制只能消費到 <span class=\"fx\">\\barX</span>，則：</li></ul>\n<p><span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y,\\qquad X≤\\barX</span></p>\n<ul><li>幾何：預算線在 <span class=\"fx\">X=\\barX</span> 處垂直截斷，形成垂直邊界；消費可能集合不包括 <span class=\"fx\">X>\\barX</span> 區域。</li></ul>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.8</strong>： 任任帶 12 元買蘋果 <span class=\"fx\">X</span>、香蕉 <span class=\"fx\">Y</span>，<span class=\"fx\">P<sub>X</sub>=2</span>、<span class=\"fx\">P<sub>Y</sub>=1</span>：(1)只要蘋果買超過三個，則全部蘋果變為一個 1 元<br>(2)只要蘋果買超過三個，則超過部分一個變 1 元<br>(3)若蘋果價格固定 2 元，但因林林限制最多只能買 3 顆蘋果。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：(1)為溯及既往（折點後斜率變平，橫截距變 12）<br>(2)為不溯及既往（折點後超過部分降價）<br>(3)為 Rationing（<span class=\"fx\">X≤ 3</span> 垂直截斷）。（詳解見書末 QR） (p.142)</div></li></ul>\n</div>\n<h5 class=\"sub4\">（三）時間限制(p.142–143)</h5>\n<ul><li>意義：除預算限制外，消費者面對其他限制（如吃飯時間限制）。</li><li>方程式：消費一單位 <span class=\"fx\">X,Y</span> 分別需 <span class=\"fx\">t<sub>X</sub>,t<sub>Y</sub></span>，總可用時間 <span class=\"fx\">T</span>：</li></ul>\n<p><span class=\"fx\">t<sub>X</sub>X+t<sub>Y</sub>Y=T</span></p>\n<p>全微分：<span class=\"fx\">t<sub>X</sub>dX+t<sub>Y</sub>dY=dT=0</span>，故</p>\n<p><span class=\"fx\">\\left.(dY)/(dX)|<sub>BC</sub>=-(t<sub>X</sub>)/(t<sub>Y</sub>)</span></p>\n<p>時間給定下，多消費 1 單位 <span class=\"fx\">X</span> 必須犧牲 <span class=\"fx\">\\dfract<sub>X</sub>t<sub>Y</sub></span> 單位 <span class=\"fx\">Y</span>。</p>\n<ul><li>與所得預算線合併：消費可能集合為 <span class=\"fx\">(\\dfracMP<sub>Y</sub>)E(\\dfracTt<sub>X</sub>)O</span> 區域面積（同時滿足所得與時間限制）。</li></ul>\n<p>##### 圖形概念</p>\n<ul><li>座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；所得預算線 <span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y</span>（縱截距 <span class=\"fx\">M/P<sub>Y</sub></span>、橫截距 <span class=\"fx\">M/P<sub>X</sub></span>，斜率 <span class=\"fx\">-P<sub>X</sub>/P<sub>Y</sub></span>）；時間預算線 <span class=\"fx\">t<sub>X</sub>X+t<sub>Y</sub>Y=T</span>（縱截距 <span class=\"fx\">T/t<sub>Y</sub></span>、橫截距 <span class=\"fx\">T/t<sub>X</sub></span>，斜率 <span class=\"fx\">-t<sub>X</sub>/t<sub>Y</sub></span>）；兩線交於 <span class=\"fx\">E</span> 點；可行區域為兩線所圍較小三角形。</li></ul>\n<h5 class=\"sub4\">（四）標準化商品（Numeraire）(p.143–144)</h5>\n<ul><li>意義：若分析重點為 <span class=\"fx\">X</span> 商品，透過轉換將除 <span class=\"fx\">X</span> 外所有商品轉換為貨幣支出。</li><li>操作：</li></ul>\n<p><span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y ⇒ (M)/(P<sub>Y</sub>)=(P<sub>X</sub>)/(P<sub>Y</sub>)X+Y</span></p>\n<p><span class=\"fx\">m=\\overlineP<sub>X</sub>X+Y;\\qquad \\overlinem=(M)/(P<sub>Y</sub>), \\overlineP<sub>X</sub>=(P<sub>X</sub>)/(P<sub>Y</sub>)</span></p>\n<p>轉換後 <span class=\"fx\">Y</span> 價格為 1 元，<span class=\"fx\">Y</span> 視為除 <span class=\"fx\">X</span> 外所有商品貨幣支出額。</p>\n<ul><li>幾何：預算線縱截距 <span class=\"fx\">\\barm</span>、橫截距 <span class=\"fx\">\\barm/\\overlineP<sub>X</sub></span>，斜率 <span class=\"fx\">-\\overlineP<sub>X</sub>=-P<sub>X</sub>/P<sub>Y</sub></span>；消費到 <span class=\"fx\">X<sup>*</sup></span> 時，<span class=\"fx\">Y<sup>*</sup></span> 高度表剩餘貨幣持有量，<span class=\"fx\">YY<sup>*</sup></span> 線段為消費 <span class=\"fx\">X<sup>*</sup></span> 支出的貨幣金額。</li></ul>\n<h5 class=\"sub4\">（五）原賦（Endowment）型(p.144–145)</h5>\n<ul><li>意義：消費者並非擁有所得，而是擁有一定數量商品 <span class=\"fx\">(x<sub>0</sub>,y<sub>0</sub>)</span>，透過販售原賦取得預算再購買。</li><li>預算限制：</li></ul>\n<p><span class=\"fx\">P<sub>X</sub>x<sub>0</sub>+P<sub>Y</sub>y<sub>0</sub>=P<sub>X</sub>X+P<sub>Y</sub>Y</span></p>\n<ul><li>幾何：縱截距 <span class=\"fx\">\\dfracP<sub>X</sub>x<sub>0</sub>+P<sub>Y</sub>y<sub>0</sub>P<sub>Y</sub></span>、橫截距 <span class=\"fx\">\\dfracP<sub>X</sub>x<sub>0</sub>+P<sub>Y</sub>y<sub>0</sub>P<sub>X</sub></span>；預算線<strong>必通過原賦點 <span class=\"fx\">(x<sub>0</sub>,y<sub>0</sub>)</span></strong>；價格變動時預算線固定繞原賦點旋轉。</li></ul>\n<p>##### 圖形概念</p>\n<ul><li>座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；預算線連接兩截距，必通過原賦點 <span class=\"fx\">(x<sub>0</sub>,y<sub>0</sub>)</span>（虛線座標標示）；斜率 <span class=\"fx\">-P<sub>X</sub>/P<sub>Y</sub></span>。</li></ul>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li>四大效用函數（Cobb-Douglas、Leontief、Linear、Quasi-Linear）的函數型態、<span class=\"fx\">MU<sub>X</sub>,MU<sub>Y</sub></span>、<span class=\"fx\">MRS</span>、無異曲線形狀、是否滿足良好偏好，為必考比較題。</li><li>Cobb-Douglas 為同位偏好（Homothetic）；Leontief 為 L 型拐點在 <span class=\"fx\">Y=β X/α</span>；Linear 為直線 MRS 固定；Quasi-Linear 垂直平移。</li><li>預算線比較靜態（價格變動轉折點、所得平行移動）、溯及既往/不溯及既往折點、Rationing 垂直截斷、時間限制、Endowment 通過原賦點旋轉——圖形判讀高頻。</li></ul>\n</div>\n</div>"}, {"id": "6.4", "title": "消費者均衡與計算（印刷頁146–163）", "body": "\n<p class=\"def-note\">其他情況不變，在給定預算限制、財貨價格及偏好結構下，使得消費者效用水準達到最高的財貨組合點(p.146)。</p>\n<h4 class=\"sub3\">一、消費者均衡的導求</h4>\n<h5 class=\"sub4\">（一）數理分析(p.146–147)</h5>\n<ul><li>假設偏好滿足 6.2 公理，只消費 <span class=\"fx\">X,Y</span>：</li></ul>\n<p><span class=\"fx\">\\max_\\X,Y\\ U=U(X,Y)\\qquads.t. M=P<sub>X</sub>X+P<sub>Y</sub>Y</span></p>\n<p>預算限制由不等式變等式，代表效用函數具有區域無餍足性（Local nonsatiation），消費者會將所得全數用盡。</p>\n<ul><li><strong>拉格爾茲函數</strong>：</li></ul>\n<p><span class=\"fx\">\\mathcalL=U(X,Y)+λ(M-P<sub>X</sub>X-P<sub>Y</sub>Y),\\qquadλ 為貨幣之邊際效用</span></p>\n<ul><li><strong class=\"term\">一階必要條件（FOC, First Order Condition）</strong>(p.146)：</li></ul>\n<p><span class=\"fx\">\\frac∂\\mathcalL∂ X=\\mathcalL<sub>X</sub>=(∂ U)/(∂ X)-λ P<sub>X</sub>=0⇒ MU<sub>X</sub>(X,Y)=λ P<sub>X</sub></span></p>\n<p><span class=\"fx\">\\frac∂\\mathcalL∂ Y=\\mathcalL<sub>Y</sub>=(∂ U)/(∂ Y)-λ P<sub>Y</sub>=0⇒ MU<sub>Y</sub>(X,Y)=λ P<sub>Y</sub></span></p>\n<p><span class=\"fx\">\\frac∂\\mathcalL∂λ=\\mathcalL_λ=M-P<sub>X</sub>X-P<sub>Y</sub>Y=0</span></p>\n<ul><li>兩式聯立得均衡條件：</li></ul>\n<p><span class=\"fx\">(MU<sub>X</sub>(X,Y))/(MU<sub>Y</sub>(X,Y))=MRS<sub>XY</sub>=(P<sub>X</sub>)/(P<sub>Y</sub>)\\qquad(p.146)</span></p>\n<p>滿足預算限制且良好偏好下，均衡出現在無異曲線與預算線相切位置。</p>\n<ul><li><strong>二階充分條件（SOC, Second Order Condition）——鑲邊海賽矩陣</strong>(p.147)：</li></ul>\n<p><span class=\"fx\">\\barH=\\beginbmatrix\\dfrac∂\\mathcalL<sub>X</sub>∂ X&\\dfrac∂\\mathcalL<sub>X</sub>∂ Y&\\dfrac∂\\mathcalL<sub>X</sub>∂λ\\\\[6pt]\\dfrac∂\\mathcalL<sub>Y</sub>∂ X&\\dfrac∂\\mathcalL<sub>Y</sub>∂ Y&\\dfrac∂\\mathcalL<sub>Y</sub>∂λ\\\\[6pt]\\dfrac∂\\mathcalL_λ∂ X&\\dfrac∂\\mathcalL_λ∂ Y&\\dfrac∂\\mathcalL_λ∂λ\\endbmatrix=\\beginbmatrixU<sub>XX</sub>&U<sub>XY</sub>&-P<sub>X</sub>\\\\U<sub>YX</sub>&U<sub>YY</sub>&-P<sub>Y</sub>\\\\-P<sub>X</sub>&-P<sub>Y</sub>&0\\endbmatrix</span></p>\n<p>兩內生變數且一限制式下，極大值要求鑲邊海賽矩陣為負定矩陣，<span class=\"fx\">|\\barH|>0</span>：</p>\n<p><span class=\"fx\">|\\barH|=P<sub>X</sub>P<sub>Y</sub>U<sub>XY</sub>+P<sub>X</sub>P<sub>Y</sub>U<sub>YX</sub>-P<sub>X</sub><sup>2</sup>U<sub>YY</sub>-P<sub>Y</sub><sup>2</sup>U<sub>XX</sub>>0</span></p>\n<p>代入 FOC（<span class=\"fx\">P<sub>X</sub>=U<sub>X</sub>/λ</span>、<span class=\"fx\">P<sub>Y</sub>=U<sub>Y</sub>/λ</span>）：</p>\n<p><span class=\"fx\">|\\barH|=(1)/(λ<sup>2</sup>)[2U<sub>X</sub>U<sub>Y</sub>U<sub>XY</sub>-U<sub>X</sub><sup>2</sup>U<sub>YY</sub>-U<sub>Y</sub><sup>2</sup>U<sub>XX</sub>]>0</span></p>\n<p>影響正負關鍵為 <span class=\"fx\">U<sub>X</sub>U<sub>Y</sub>U<sub>XY</sub>-U<sub>X</sub><sup>2</sup>U<sub>YY</sub>-U<sub>Y</sub><sup>2</sup>U<sub>XX</sub></span>，對應 6.2 嚴格凸條件：</p>\n<p><span class=\"fx\">(dMRS)/(dX)=(1)/(U<sub>Y</sub><sup>3</sup>)[U<sub>X</sub><sup>2</sup>U<sub>YY</sub>-2U<sub>X</sub>U<sub>Y</sub>U<sub>XY</sub>+U<sub>Y</sub><sup>2</sup>U<sub>XX</sub>]<0</span></p>\n<p>良好偏好下上式成立，<span class=\"fx\">|\\barH|>0</span>，拉格爾茲法求解滿足效用極大。</p>\n<ul><li>最後將 <span class=\"fx\">MRS<sub>XY</sub>(X,Y)=\\dfracP<sub>X</sub>P<sub>Y</sub></span> 整理成 <span class=\"fx\">Y=f(\\dfracP<sub>X</sub>P<sub>Y</sub>,X)</span> 代入 <span class=\"fx\">\\dfrac∂\\mathcalL∂λ=0</span>，可解出 <span class=\"fx\">(X<sup>*</sup>,Y<sup>*</sup>,λ<sup>*</sup>)</span>。<span class=\"fx\">X<sup>*</sup>,Y<sup>*</sup></span> 又稱<strong class=\"term\">普通需求函數（Ordinary demand）/馬歇爾需求函數（Marshallian demand）/未受補償需求函數（Uncompensated demand function）</strong>(p.147)。</li></ul>\n<h5 class=\"sub4\">（二）幾何分析(p.148)</h5>\n<ul><li>良好偏好下均衡發生在 <span class=\"fx\">MRS<sub>XY</sub>=\\dfracP<sub>X</sub>P<sub>Y</sub></span> 處，即無異曲線與預算線相切。</li></ul>\n<p>##### 圖形概念</p>\n<ul><li>座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；預算線 <span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y</span>（負斜率 <span class=\"fx\">-P<sub>X</sub>/P<sub>Y</sub></span>）；無異曲線 U<span class=\"fx\">′</span>=U(X<span class=\"mpunct\">,</span>Y) 切預算線於 E<span class=\"fx\">′</span>（較低效用）、<span class=\"fx\">U<sup>*</sup>=U(X,Y)</span> 切預算線於 <span class=\"fx\">E<sup>*</sup>(X<sup>*</sup>,Y<sup>*</sup>)</span>（最適）；<span class=\"fx\">A</span> 點在高效用無異曲線上但超出預算線（買不到）；<span class=\"fx\">B</span> 點在預算線上但效用低（未最適）。</li></ul>\n<h5 class=\"sub4\">（三）不均衡分析(p.148)</h5>\n<ol><li>若 <span class=\"fx\">MRS<sub>XY</sub>=\\dfracMU<sub>X</sub>MU<sub>Y</sub>>\\dfracP<sub>X</sub>P<sub>Y</sub>⇒\\dfracMU<sub>X</sub>P<sub>X</sub>>\\dfracMU<sub>Y</sub>P<sub>Y</sub></span>：消費者為多消費 1 單位 <span class=\"fx\">X</span> 主觀願意放棄的 <span class=\"fx\">Y</span> 數量大於客觀上必須放棄的 <span class=\"fx\">Y</span> 數量，故應<strong>多消費 <span class=\"fx\">X</span> 或少消費 <span class=\"fx\">Y</span></strong>（如圖 <span class=\"fx\">A</span> 點）。</li><li>若 <span class=\"fx\">MRS<sub>XY</sub>=\\dfracMU<sub>X</sub>MU<sub>Y</sub><\\dfracP<sub>X</sub>P<sub>Y</sub>⇒\\dfracMU<sub>X</sub>P<sub>X</sub><\\dfracMU<sub>Y</sub>P<sub>Y</sub></span>：主觀願意放棄的 <span class=\"fx\">Y</span> 小於客觀必須放棄的 <span class=\"fx\">Y</span>，故應<strong>少消費 <span class=\"fx\">X</span> 或多消費 <span class=\"fx\">Y</span></strong>（如圖 <span class=\"fx\">B</span> 點）。</li></ol>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.9</strong>： 某消費者 MRS=2:1（願意放棄 2 杯啤酒換 1 塊牛排）；牛排 \\1、啤酒\\<span class=\"fx\">0.25</span>。為提高效用應：<div class=\"opts\"><div>(A) 多牛排少啤酒</div><div>(B) 多啤酒少牛排</div><div>(C) 兩者皆少</div><div>(D) 兩者皆多</div></div></div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">MRS=2</span>，<span class=\"fx\">P<sub>X</sub>/P<sub>Y</sub>=1/0.25=4</span>（牛排為 <span class=\"fx\">X</span>）；<span class=\"fx\">MRS\\lt P<sub>X</sub>/P<sub>Y</sub></span>，代表 <span class=\"fx\">\\dfracMU<sub>牛排</sub>P<sub>牛排</sub>\\lt \\dfracMU<sub>啤酒</sub>P<sub>啤酒</sub></span>，應多消費啤酒少牛排。（詳解見書末 QR） (p.148)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.10</strong>： Micky 收入 $30，cheese 價格 $2（<span class=\"fx\">x</span> 軸），cookie 價格 $1（<span class=\"fx\">y</span> 軸），無異曲線凸向原點。預算線上某點 ∣MRS∣=3。應多買 cheese 少 cookies，或少 cheese 多 cookies，還是不變？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">MRS=3>P<sub>X</sub>/P<sub>Y</sub>=2/1=2</span>，應多消費 <span class=\"fx\">X</span>（cheese）少 <span class=\"fx\">Y</span>（cookies）。（詳解見書末 QR） (p.149)</div></li></ul>\n</div>\n<h4 class=\"sub3\">二、非良好偏好下之均衡求解(p.149–151)</h4>\n<ul><li>良好偏好下均衡為內部解（Interior solution）；偏好不滿足良好偏好時可能出現<strong class=\"term\">角隅解（Corner solution）</strong>，此時 <span class=\"fx\">MRS=P<sub>X</sub>/P<sub>Y</sub></span> 可能無法解或解出效用極小。</li></ul>\n<h5 class=\"sub4\">（一）消費商品為喜好品，但為嚴格凹性偏好</h5>\n<ol><li><strong>均衡為縱軸角解</strong>：無異曲線與預算線相切點 E<span class=\"fx\">′</span> 並非效用極大，消費點移至 <span class=\"fx\">E<sup>*</sup></span>，全數消費 <span class=\"fx\">Y</span>：</li></ol>\n<p><span class=\"fx\">E<sup>*</sup>=(0,(M)/(P<sub>Y</sub>))</span></p>\n<ol><li><strong>均衡為橫軸角解</strong>：相切點 E<span class=\"fx\">′</span> 並非效用極大，全數消費 <span class=\"fx\">X</span>：</li></ol>\n<p><span class=\"fx\">E<sup>*</sup>=((M)/(P<sub>X</sub>),0)</span></p>\n<p>##### 圖形概念</p>\n<ul><li>縱軸角解：座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；預算線 <span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y</span>；凹向原點無異曲線 U<span class=\"fx\">′</span> 切預算線於 E<span class=\"fx\">′</span>(X<span class=\"fx\">′</span><span class=\"mpunct\">,</span>Y<span class=\"fx\">′</span>)（切點效用較低），更高效用無異曲線 <span class=\"fx\">U<sup>*</sup></span> 與預算線交於縱軸 <span class=\"fx\">(0,M/P<sub>Y</sub>)=E<sup>*</sup></span>。</li><li>橫軸角解：類似但 <span class=\"fx\">U<sup>*</sup></span> 交預算線於橫軸 <span class=\"fx\">(M/P<sub>X</sub>,0)=E<sup>*</sup></span>。</li></ul>\n<h5 class=\"sub4\">（二）同心圓型態(p.150–151)</h5>\n<ol><li><strong>若所得買得起極樂點</strong>：預算多於極樂點支出，消費者只會消費極樂點 <span class=\"fx\">E<sup>*</sup>=(\\hatx,\\haty)</span>，剩餘所得不會用於支出。</li><li><strong>若所得買不起極樂點</strong>：均衡在預算線與最高可達無異曲線切點 <span class=\"fx\">E<sup>*</sup></span>，消費量小於極樂點。</li></ol>\n<p>##### 圖形概念</p>\n<ul><li>座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；同心圓繞極樂點 Bliss point <span class=\"fx\">(\\hatx,\\haty)</span>；預算線 <span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y</span>。狀況一：預算線外圈穿過同心圓，<span class=\"fx\">E<sup>*</sup></span> 即極樂點（預算線穿過極樂點東北）。狀況二：預算線外圈在極樂點西南，<span class=\"fx\">E<sup>*</sup></span> 為預算線與某圈切點，<span class=\"fx\">X<sup>*</sup><\\hatx</span>、<span class=\"fx\">Y<sup>*</sup><\\haty</span>。</li></ul>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.11</strong>： 預算限制 <span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y</span>，<span class=\"fx\">P<sub>X</sub>=5,P<sub>Y</sub>=5,M</span> 為所得；效用函數 <span class=\"fx\">U(X,Y)=20X-2X<sup>2</sup>+8Y-Y<sup>2</sup></span><br>(1)若 <span class=\"fx\">M=30</span>，最適消費組合？<br>(2)若 <span class=\"fx\">M=60</span>，最適消費組合？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：此為同心圓型（極樂點在 <span class=\"fx\">U<sub>X</sub>=20-4X=0⇒ X=5</span>、<span class=\"fx\">U<sub>Y</sub>=8-2Y=0⇒ Y=4</span>）。<span class=\"fx\">M=30</span> 買不起極樂點（買極樂點需 <span class=\"fx\">5×5+5×4=45</span>），求切點；<span class=\"fx\">M=60</span> 買得起極樂點，直接消費 <span class=\"fx\">(5,4)</span>。（詳解見書末 QR） (p.151)</div></li></ul>\n</div>\n<h4 class=\"sub3\">三、各種效用函數之消費者均衡分析</h4>\n<h5 class=\"sub4\">（一）科布-道格拉斯型(p.151–153)</h5>\n<p>##### 均衡求解</p>\n<ul><li>良好偏好，直接用拉格爾茲法：</li></ul>\n<p><span class=\"fx\">\\max_\\X,Y\\U=AX^α Y^β\\qquads.t.\\ M=P<sub>X</sub>X+P<sub>Y</sub>Y</span></p>\n<p><span class=\"fx\">\\mathcalL=AX^α Y^β+λ(M-P<sub>X</sub>X-P<sub>Y</sub>Y)</span></p>\n<p><span class=\"fx\">\\mathcalL<sub>X</sub>=α AX<sup>α-1</sup>Y^β-λ P<sub>X</sub>=0⇒β AX<sup>α-1</sup>Y^β=λ P<sub>X</sub> \\cdots①</span></p>\n<p><span class=\"fx\">\\mathcalL<sub>Y</sub>=β AX^α Y<sup>β-1</sup>-λ P<sub>Y</sub>=0⇒β AX^α Y<sup>β-1</sup>=λ P<sub>Y</sub> \\cdots②</span></p>\n<p><span class=\"fx\">\\mathcalL_λ=M-P<sub>X</sub>X-P<sub>Y</sub>Y=0 \\cdots③</span></p>\n<ul><li>①/②：</li></ul>\n<p><span class=\"fx\">(α X<sup>α-1</sup>Y^β)/(β X^α Y<sup>β-1</sup>)=(α Y)/(β X)=(P<sub>X</sub>)/(P<sub>Y</sub>) ⇒ Y=(β P<sub>X</sub>)/(α P<sub>Y</sub>)X</span></p>\n<p>代入③：</p>\n<p><span class=\"fx\">M-P<sub>X</sub>X-P<sub>Y</sub>((β P<sub>X</sub>)/(α P<sub>Y</sub>)X)=0</span></p>\n<ul><li><strong class=\"term\">馬歇爾需求函數（普通需求函數）</strong>(p.152)：</li></ul>\n<p><span class=\"fx\">X<sub>M</sub><sup>d</sup>(P<sub>X</sub>;P<sub>Y</sub>,M)=(α)/(α+β)×(M)/(P<sub>X</sub>)</span></p>\n<p><span class=\"fx\">Y<sub>M</sub><sup>d</sup>(P<sub>Y</sub>;P<sub>X</sub>,M)=(β)/(α+β)×(M)/(P<sub>Y</sub>)</span></p>\n<p>##### 馬歇爾需求函數特性</p>\n<ol><li><strong class=\"term\">單一值函數（Single-valued function）</strong>：給定一組特定 <span class=\"fx\">(P<sub>X0</sub>,M<sub>0</sub>,P<sub>Y0</sub>)</span> 只對應一個 <span class=\"fx\">X</span> 或 <span class=\"fx\">Y</span> 值；良好偏好下無異曲線凸向原點，與預算線相切點唯一。</li><li><strong class=\"term\">零階齊次（Homogeneous of degree 0）</strong>：所有商品價格與所得同時同比例變化，需求量不變：</li></ol>\n<p><span class=\"fx\">X<sup>d'</sup>=(α)/(α+β)×(λ M)/(λ P<sub>X</sub>)=λ<sup>0</sup>(α)/(α+β)×(M)/(P<sub>X</sub>)=X<sup>d</sup></span></p>\n<p>（預算線在所有價格所得同乘 <span class=\"fx\">λ</span> 時不變，故均衡量不變）</p>\n<p>##### <span class=\"fx\">X</span> 之馬歇爾需求函數相關討論(p.153)</p>\n<ul><li>取對數全微分：<span class=\"fx\">d\\ln X=d\\ln M-d\\ln P<sub>X</sub>+0 d\\ln P<sub>Y</sub></span></li><li>(1) <strong><span class=\"fx\">X</span> 之需求彈性</strong>：</li></ul>\n<p><span class=\"fx\">E<sub>X</sub><sup>d</sup>=-(d\\ln X)/(d\\ln P<sub>X</sub>)=1</span></p>\n<p>單一彈性；<span class=\"fx\">P<sub>X</sub></span> 變動時花費在 <span class=\"fx\">X</span> 支出不變：</p>\n<p><span class=\"fx\">TE<sub>X</sub>=P<sub>X</sub>X<sup>d</sup>=P<sub>X</sub>×(α)/(α+β)×(M)/(P<sub>X</sub>)=(α M)/(α+β)</span></p>\n<ul><li>(2) <strong><span class=\"fx\">X</span> 與 <span class=\"fx\">Y</span> 之交叉彈性</strong>：</li></ul>\n<p><span class=\"fx\">E<sub>XY</sub><sup>d</sup>=(d\\ln X)/(d\\ln P<sub>Y</sub>)=0</span></p>\n<p><span class=\"fx\">X</span> 與 <span class=\"fx\">Y</span> 互為需求上的無關品。</p>\n<ul><li>(3) <strong><span class=\"fx\">X</span> 之所得彈性</strong>：</li></ul>\n<p><span class=\"fx\">η<sub>X</sub><sup>d</sup>=(d\\ln X)/(d\\ln M)=1</span></p>\n<p><span class=\"fx\">X</span> 為正常財且為 <span class=\"fx\">\\dfracαα+β</span> 地位財；所得變動時花費在 <span class=\"fx\">X</span> 比例不變：</p>\n<p><span class=\"fx\">α<sub>X</sub>=P<sub>X</sub>X/M=(α)/(α+β)</span></p>\n<ul><li>(4) 需求函數 0 階齊次下，需求彈性 = 所得彈性 + 交叉彈性加總：</li></ul>\n<p><span class=\"fx\">E<sub>X</sub><sup>d</sup>=1=η<sub>X</sub><sup>d</sup>+E<sub>XY</sub><sup>d</sup></span></p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.12</strong>： <span class=\"fx\">P<sub>X</sub>=5</span>、<span class=\"fx\">P<sub>Y</sub>=10</span>、所得 500 元，效用 <span class=\"fx\">U=XY</span>，求均衡消費組合並導出 <span class=\"fx\">X</span> 財需求方程式。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">MRS<sub>XY</sub>=Y/X=P<sub>X</sub>/P<sub>Y</sub>=5/10=1/2</span>，故 <span class=\"fx\">Y=\\tfrac12 X</span>；代入 <span class=\"fx\">500=5X+10Y</span> 得 <span class=\"fx\">X<sup>*</sup>=50,Y<sup>*</sup>=25</span>。（詳解見書末 QR） (p.153)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.13</strong>： Paul 效用 <span class=\"fx\">U<sub>P</sub>=G<sup>0.5</sup>M<sup>0.5</sup></span>（打電玩 <span class=\"fx\">G</span>、看電影 <span class=\"fx\">M</span>），所得 200 元，<span class=\"fx\">P<sub>G</sub>=5</span>、<span class=\"fx\">P<sub>M</sub>=20</span><br>(1)效用極大化時最適選擇？<br>(2)電影價格上漲是否提高打電玩時數？<br>(3)兩財支出比例？<br>(4)所得增一倍購買量增加多少？<br>(5)所得與價格同增一倍購買量增多少？<br>(6)求 Paul 對打電玩之價格彈性、所得彈性與交叉彈性<br>(7)若 John 效用 <span class=\"fx\">U<sub>J</sub>=√(10+U<sub>P</sub>)</span>，John 與 Paul 是否有相同偏好？所得與價格相同下消費量會相同嗎？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：Cobb-Douglas <span class=\"fx\">α=β=0.5</span>，<span class=\"fx\">G<sup>*</sup>=\\tfracM2P<sub>G</sub>=20</span>、<span class=\"fx\">M<sup>*</sup>=\\tfracM2P<sub>M</sub>=5</span>；同位偏好下價格變動支出比例固定；<span class=\"fx\">√(10+U<sub>P</sub>)</span> 為 <span class=\"fx\">U<sub>P</sub></span> 的單調遞增轉換（<span class=\"fx\">f'\\gt 0</span>），偏好結構相同、消費量相同。（詳解見書末 QR） (p.154)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.14</strong>： 甲效用 <span class=\"fx\">U=\\tfrac12\\ln X+\\tfrac12\\ln Y</span>，原擁有 <span class=\"fx\">(80,50)</span>，價格 <span class=\"fx\">(10,10)</span><br>(1)效用極大化下消費量？<br>(2)甲對第一種財為淨供給者或淨需求者？<br>(3)若價格變 <span class=\"fx\">(20,40)</span>，甲的福利上升或下降？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：Endowment 型預算 <span class=\"fx\">10·80+10·50=1300=10X+10Y</span>；最適消費 <span class=\"fx\">X=Y=65</span>；原賦 <span class=\"fx\">X=80>65</span> 為淨供給者。（詳解見書末 QR） (p.154)</div></li></ul>\n</div>\n<h5 class=\"sub4\">（二）里昂鐵夫型(p.154–156)</h5>\n<p>##### 均衡求解</p>\n<ul><li>不滿足良好偏好，無法用拉格爾茲法；<span class=\"fx\">X,Y</span> 為互補且互補比例為分母參數：</li></ul>\n<p><span class=\"fx\">\\max_\\X,Y\\U=\\minX/α,Y/β\\qquads.t.\\ M=P<sub>X</sub>X+P<sub>Y</sub>Y</span></p>\n<ul><li>由 <span class=\"fx\">U=\\min\\X/α,Y/β\\</span>，最適時必在拐點 <span class=\"fx\">X/α=Y/β</span>：</li></ul>\n<p><span class=\"fx\">X/α=Y/β ⇒ Y=β/αX</span></p>\n<p>代入限制式：</p>\n<p><span class=\"fx\">X<sub>M</sub><sup>*</sup>=\\fracMP<sub>X</sub>+P<sub>Y</sub>×\\dfracβα=(α M)/(α P<sub>X</sub>+β P<sub>Y</sub>)</span></p>\n<p><span class=\"fx\">Y<sub>M</sub><sup>*</sup>=\\fracMP<sub>X</sub>×\\dfracαβ+P<sub>Y</sub>=(β M)/(α P<sub>X</sub>+β P<sub>Y</sub>)</span></p>\n<p>##### 圖形概念</p>\n<ul><li>座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；<span class=\"fx\">L</span> 型無異曲線 <span class=\"fx\">U<sup>*</sup>=\\min\\X/α,Y/β\\</span>，拐點射線 <span class=\"fx\">X/α=Y/β</span>（即 <span class=\"fx\">Y=β X/α</span>）；預算線 <span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y</span> 與拐點射線交於 <span class=\"fx\">E<sup>*</sup>(X<sup>*</sup>,Y<sup>*</sup>)</span>。</li></ul>\n<p>##### <span class=\"fx\">X</span> 之馬歇爾需求函數相關討論</p>\n<ul><li>整理 <span class=\"fx\">X<sup>*</sup>=α M(α P<sub>X</sub>+β P<sub>Y</sub>)<sup>-1</sup></span>（為 <span class=\"fx\">P<sub>X</sub>,P<sub>Y</sub>,M</span> 的零階齊次函數）。</li><li>(1) <strong><span class=\"fx\">X</span> 之需求彈性</strong>：</li></ul>\n<p><span class=\"fx\">E<sub>X</sub><sup>d</sup>=-(∂ X<sup>d</sup>)/(∂ P<sub>X</sub>)\\timesP<sub>X</sub>/X=α M(α P<sub>X</sub>+β P<sub>Y</sub>)<sup>-2</sup>×(P<sub>X</sub>)/(α M(α P<sub>X</sub>+β P<sub>Y</sub>)<sup>-1</sup>)=(α P<sub>X</sub>)/(α P<sub>X</sub>+β P<sub>Y</sub>)<1</span></p>\n<p>需求彈性小於 1，價格上升時消費在該財支出金額增加。</p>\n<ul><li>(2) <strong><span class=\"fx\">X</span> 與 <span class=\"fx\">Y</span> 之交叉彈性</strong>：</li></ul>\n<p><span class=\"fx\">E<sub>XY</sub><sup>d</sup>=(∂ X<sup>d</sup>)/(∂ P<sub>Y</sub>)\\timesP<sub>Y</sub>/X=-α M(α P<sub>X</sub>+β P<sub>Y</sub>)<sup>-2</sup>×(P<sub>Y</sub>)/(α M(α P<sub>X</sub>+β P<sub>Y</sub>)<sup>-1</sup>)=(-β P<sub>Y</sub>)/(α P<sub>X</sub>+β P<sub>Y</sub>)<0</span></p>\n<p><span class=\"fx\">X</span> 與 <span class=\"fx\">Y</span> 互為需求上的互補品。</p>\n<ul><li>(3) <strong><span class=\"fx\">X</span> 之所得彈性</strong>：</li></ul>\n<p><span class=\"fx\">η<sub>X</sub><sup>d</sup>=(∂ X<sup>d</sup>)/(∂ M)\\timesM/X=α(α P<sub>X</sub>+β P<sub>Y</sub>)<sup>-1</sup>×(M)/(α M(α P<sub>X</sub>+β P<sub>Y</sub>)<sup>-1</sup>)=1</span></p>\n<p><span class=\"fx\">X</span> 為正常財且為地位財。</p>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.15</strong>： Micky 收入 \\30，cheese \\2（<span class=\"fx\">x</span> 軸）、cookie $1（<span class=\"fx\">y</span> 軸），喜歡 1 unit cheese 配 exactly 1 cookie。求效用極大選擇。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">U=\\min(X,Y)</span>，拐點 <span class=\"fx\">X=Y</span>；代入 <span class=\"fx\">30=2X+Y=3X</span> 得 <span class=\"fx\">X<sup>*</sup>=10,Y<sup>*</sup>=10</span>。（詳解見書末 QR） (p.156)</div></li></ul>\n</div>\n<h5 class=\"sub4\">（三）直線型（完全替代）(p.156–157)</h5>\n<p>##### 均衡求解</p>\n<ul><li>完全替代型，消費者只會全數消費 <span class=\"fx\">X</span> 或 <span class=\"fx\">Y</span>，須比較 <span class=\"fx\">MRS</span> 與預算線斜率：</li></ul>\n<p><span class=\"fx\">\\max_\\X,Y\\U=X/α+Y/β\\qquads.t.\\ M=P<sub>X</sub>X+P<sub>Y</sub>Y</span></p>\n<ul><li>(1) 若 <span class=\"fx\">MRS<sub>XY</sub>=\\dfracβα>\\dfracP<sub>X</sub>P<sub>Y</sub></span>：全數消費 <span class=\"fx\">X</span>，為橫軸角隅解：</li></ul>\n<p><span class=\"fx\">X<sup>*</sup>=(M)/(P<sub>X</sub>),\\qquad Y<sup>*</sup>=0</span></p>\n<ul><li>(2) 若 <span class=\"fx\">MRS<sub>XY</sub>=\\dfracβα<\\dfracP<sub>X</sub>P<sub>Y</sub></span>：全數消費 <span class=\"fx\">Y</span>，為縱軸角隅解：</li></ul>\n<p><span class=\"fx\">Y<sup>*</sup>=(M)/(P<sub>Y</sub>),\\qquad X<sup>*</sup>=0</span></p>\n<ul><li>(3) 若 <span class=\"fx\">MRS<sub>XY</sub>=\\dfracβα=\\dfracP<sub>X</sub>P<sub>Y</sub></span>：無異曲線與預算線重合時效用最大，為<strong>複數解</strong>：</li></ul>\n<p><span class=\"fx\">X<sup>*</sup>∈[0,(M)/(P<sub>X</sub>)];\\qquad Y<sup>*</sup>∈[(M)/(P<sub>Y</sub>),0]</span></p>\n<ul><li>(4) 雖為完全替代，並不代表消費者只買較便宜商品，須視 <span class=\"fx\">MRS</span> 與預算線斜率絕對值而定；但若 <span class=\"fx\">α=β</span>（<span class=\"fx\">X,Y</span> 一樣好），則只會全數買較便宜者。</li></ul>\n<p>##### 圖形概念</p>\n<ul><li>狀況(1)：座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；預算線 <span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y</span>；無異曲線 <span class=\"fx\">U<sup>*</sup>=X/α+Y/β</span> 斜率 <span class=\"fx\">-β/α</span> 比預算線 <span class=\"fx\">-P<sub>X</sub>/P<sub>Y</sub></span> 平（<span class=\"fx\">MRS>P<sub>X</sub>/P<sub>Y</sub></span>），最高效用交於橫軸 <span class=\"fx\">E<sup>*</sup>(M/P<sub>X</sub>,0)</span>。</li><li>狀況(2)：無異曲線較陡（<span class=\"fx\">MRS\\lt P<sub>X</sub>/P<sub>Y</sub></span>），最高效用交於縱軸 <span class=\"fx\">E<sup>*</sup>(0,M/P<sub>Y</sub>)</span>。</li><li>狀況(3)：無異曲線與預算線重合 <span class=\"fx\">-P<sub>X</sub>/P<sub>Y</sub>=-β/α</span>，整條預算線皆最適。</li></ul>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.16</strong>： 消費者對 <span class=\"fx\">X,Y</span> 為完全替代偏好，2 units <span class=\"fx\">X</span> 等於 1 unit <span class=\"fx\">Y</span>；P_X=\\1,P_Y=\\<span class=\"fx\">3</span>，所得 $60。如何配置？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：$MRS=2/1=2$（<span class=\"fx\">X</span> 為 <span class=\"fx\">Y</span> 的 2 倍好），<span class=\"fx\">P<sub>X</sub>/P<sub>Y</sub>=1/3</span>；<span class=\"fx\">MRS>P<sub>X</sub>/P<sub>Y</sub></span>，全數買 <span class=\"fx\">X</span>：<span class=\"fx\">X<sup>*</sup>=60,Y<sup>*</sup>=0</span>。（詳解見書末 QR） (p.158)</div></li><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.17</strong>： <span class=\"fx\">P<sub>X</sub>=5,P<sub>Y</sub>=10,M=500</span>，效用 <span class=\"fx\">U=2X+10Y</span>，求均衡消費組合並導出 <span class=\"fx\">X</span> 財需求方程式。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">MRS=MU<sub>X</sub>/MU<sub>Y</sub>=2/10=1/5</span>，<span class=\"fx\">P<sub>X</sub>/P<sub>Y</sub>=5/10=1/2</span>；<span class=\"fx\">MRS\\lt P<sub>X</sub>/P<sub>Y</sub></span>，全數買 <span class=\"fx\">Y</span>：<span class=\"fx\">X<sup>*</sup>=0,Y<sup>*</sup>=50</span>。（詳解見書末 QR） (p.158)</div></li></ul>\n</div>\n<h5 class=\"sub4\">（四）準線型(p.158–162)</h5>\n<p>##### 一般型態</p>\n<ul><li>假設非線性部分具邊際效用遞減：<span class=\"fx\">f'(X)\\gt 0,f''(X)\\lt 0</span>：</li></ul>\n<p><span class=\"fx\">\\max_\\X,Y\\U=α f(X)+β Y\\qquads.t.\\ M=P<sub>X</sub>X+P<sub>Y</sub>Y</span></p>\n<p><span class=\"fx\">\\mathcalL=α f(X)+β Y+λ(M-P<sub>X</sub>X-P<sub>Y</sub>Y)</span></p>\n<p><span class=\"fx\">\\mathcalL<sub>X</sub>=α f'(X)-λ P<sub>X</sub>=0⇒α f'(X)=λ P<sub>X</sub></span></p>\n<p><span class=\"fx\">\\mathcalL<sub>Y</sub>=β-λ P<sub>Y</sub>=0⇒β=λ P<sub>Y</sub></span></p>\n<p><span class=\"fx\">\\mathcalL_λ=M-P<sub>X</sub>X-P<sub>Y</sub>Y=0</span></p>\n<ul><li>整理：</li></ul>\n<p><span class=\"fx\">f'(X)=(β P<sub>X</sub>)/(α P<sub>Y</sub>)=(β/α)((P<sub>X</sub>)/(P<sub>Y</sub>))</span></p>\n<p>##### 討論</p>\n<ol><li><strong>非線性部分為所得中性財</strong>：<span class=\"fx\">f'(X)=\\dfracβ P<sub>X</sub>α P<sub>Y</sub></span> 中只有 <span class=\"fx\">X</span> 一個內生變數，可直接解出 <span class=\"fx\">X<sup>*</sup></span>，不受 <span class=\"fx\">M</span> 影響。</li></ol>\n<ul><li>全微分證明(p.159)：</li></ul>\n<p><span class=\"fx\">f''(X)dX=-|f''(X)|dX<sup>*</sup>=(β/α)((P<sub>Y</sub>dP<sub>X</sub>-P<sub>X</sub>dP<sub>Y</sub>)/(P<sub>Y</sub><sup>2</sup>))</span></p>\n<p><span class=\"fx\">-|f''(X)|dX<sup>*</sup>=(β/α)((1)/(P<sub>Y</sub>))dP<sub>X</sub>-(β/α)((P<sub>X</sub>)/(P<sub>Y</sub><sup>2</sup>))dP<sub>Y</sub>+0 dM</span></p>\n<p><span class=\"fx\">(dX<sup>*</sup>)/(dP<sub>X</sub>)=-\\frac(\\dfracβα)(\\dfrac1P<sub>Y</sub>)|f''(X)|<0; (dX<sup>*</sup>)/(dP<sub>Y</sub>)=\\frac(\\dfracβα)(\\dfracP<sub>X</sub>P<sub>Y</sub><sup>2</sup>)|f''(X)|<0; (dX<sup>*</sup>)/(dM)=0</span></p>\n<ul><li>故 <span class=\"fx\">X</span> 不受所得影響，為<strong>所得中性財</strong>。</li></ul>\n<ol><li>非線性部分不受所得影響，<span class=\"fx\">P<sub>X</sub>,P<sub>Y</sub></span> 給定下透過 <span class=\"fx\">f'(X)=β P<sub>X</sub>/(α P<sub>Y</sub>)</span> 求 <span class=\"fx\">X<sup>*</sup></span>。</li></ol>\n<ul><li>若目前所得水準買不起該 <span class=\"fx\">X<sup>*</sup></span>，消費者可能將所得全數用於 <span class=\"fx\">X</span> 或 <span class=\"fx\">Y</span>（角解）：</li><li>無異曲線較陡（消費者較喜愛 <span class=\"fx\">X</span>）：<span class=\"fx\">X</span> 消費在 X<span class=\"fx\">′</span> 處；若預算線僅在 <span class=\"fx\">M<sup>*</sup></span>，則全數買 <span class=\"fx\">X</span>。</li><li>無異曲線較平（消費者較喜愛 <span class=\"fx\">Y</span>）：<span class=\"fx\">X</span> 消費在 X<span class=\"fx\">′</span> 處；若預算線僅在 <span class=\"fx\">M<sup>*</sup></span>，則全數買 <span class=\"fx\">Y</span>。</li></ul>\n<ol><li><strong>若確定內部解</strong>，<span class=\"fx\">U=α f(X)+β Y</span> 的無異曲線會隨著線性部分消費變化而<strong>垂直（水平）移動</strong>：<span class=\"fx\">X</span> 為所得中性財，所得上漲時 <span class=\"fx\">X</span> 消費量不變；無異曲線垂直上移與新預算線相切，新均衡 <span class=\"fx\">E<sub>1</sub></span> 在原均衡 <span class=\"fx\">E<sub>0</sub></span> 垂直上方。</li></ol>\n<p>##### 圖形概念</p>\n<ul><li>無異曲線較陡：預算線 <span class=\"fx\">M'=P<sub>X</sub>X+P<sub>Y</sub>Y</span> 切無異曲線 U<span class=\"fx\">′</span> 於 E<span class=\"fx\">′</span>（較高預算）；較低預算 <span class=\"fx\">M''=P<sub>X</sub>X+P<sub>Y</sub>Y</span> 與軸交於 <span class=\"fx\">E<sup>*</sup>(X<sup>*</sup>,0)</span> 角解（全買 <span class=\"fx\">X</span>）。</li><li>無異曲線較平：較低預算時角解為 <span class=\"fx\">E<sup>*</sup>(0,Y<sup>*</sup>)</span>（全買 <span class=\"fx\">Y</span>）。</li><li>垂直平移：兩條平行預算線 <span class=\"fx\">\\bar M=P<sub>X</sub>X+P<sub>Y</sub>Y</span>、<span class=\"fx\">\\widehat M=P<sub>X</sub>X+P<sub>Y</sub>Y</span>；無異曲線 <span class=\"fx\">\\bar U=α f(X)+β Y<sub>0</sub></span> 切 <span class=\"fx\">\\bar M</span> 於 <span class=\"fx\">E<sub>0</sub>(X,Y<sub>0</sub>)</span>；<span class=\"fx\">\\widehat U=α f(X)+β Y<sub>1</sub></span> 切 <span class=\"fx\">\\widehat M</span> 於 <span class=\"fx\">E<sub>1</sub>(X,Y<sub>1</sub>)</span>；兩均衡在同一垂直線 <span class=\"fx\">X</span> 上。</li></ul>\n<p>##### 特殊形態：<span class=\"fx\">U=α\\ln X+β Y</span>(p.161)</p>\n<ul><li>均衡求解：</li></ul>\n<p><span class=\"fx\">\\mathcalL=α\\ln X+β Y+λ(M-P<sub>X</sub>X-P<sub>Y</sub>Y)</span></p>\n<p><span class=\"fx\">\\mathcalL<sub>X</sub>=α/X-λ P<sub>X</sub>=0⇒α/X=λ P<sub>X</sub></span></p>\n<p><span class=\"fx\">\\mathcalL<sub>Y</sub>=β-λ P<sub>Y</sub>=0⇒β=λ P<sub>Y</sub></span></p>\n<p>整理：</p>\n<p><span class=\"fx\">1/X=(β P<sub>X</sub>)/(α P<sub>Y</sub>)=(β/α)((P<sub>X</sub>)/(P<sub>Y</sub>))</span></p>\n<p><span class=\"fx\">X<sub>M</sub><sup>*</sup>=(α/β)((P<sub>Y</sub>)/(P<sub>X</sub>)),\\qquad Y<sub>M</sub><sup>*</sup>=(M)/(P<sub>Y</sub>)-α/β</span></p>\n<ul><li>討論：</li></ul>\n<ol><li><span class=\"fx\">Y<sub>M</sub><sup>*</sup>>0</span> 須滿足 <span class=\"fx\">M>\\dfracαβP<sub>Y</sub></span>。</li><li>消費者必須消費到 <span class=\"fx\">(\\dfracαβ)(\\dfracP<sub>Y</sub>P<sub>X</sub>)</span> 的 <span class=\"fx\">X</span>；此數量 <span class=\"fx\">X</span> 所需所得為：</li></ol>\n<p><span class=\"fx\">TE<sub>X</sub>=P<sub>X</sub>(α/β)((P<sub>Y</sub>)/(P<sub>X</sub>))=α/βP<sub>Y</sub></span></p>\n<p>所得至少 <span class=\"fx\">\\dfracαβP<sub>Y</sub></span> 才夠買該 <span class=\"fx\">X</span>。</p>\n<ol><li>結論：在未足夠購買 <span class=\"fx\">(\\dfracαβ)(\\dfracP<sub>Y</sub>P<sub>X</sub>)</span> 數量 <span class=\"fx\">X</span> 之前，<span class=\"fx\">X</span> 對消費者為<strong>必要性財貨</strong>；超過該數量後 <span class=\"fx\">X</span> 變非必要性財貨，反之 <span class=\"fx\">Y</span> 為必要性財貨。</li></ol>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.18</strong>： 張效用 <span class=\"fx\">U(X,Y)=\\ln X+0.2Y</span>，預算 100 元<br>(1)若 <span class=\"fx\">P<sub>X</sub>=10,P<sub>Y</sub>=15</span>，均衡消費？<br>(2)若 <span class=\"fx\">P<sub>X</sub>=10,P<sub>Y</sub>=25</span>，均衡消費？</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：<span class=\"fx\">MRS=MU<sub>X</sub>/MU<sub>Y</sub>=(1/X)/0.2=5/X=P<sub>X</sub>/P<sub>Y</sub></span>；(1)<span class=\"fx\">5/X=10/15=2/3⇒ X=7.5</span>，代入 <span class=\"fx\">100=10X+15Y</span> 得 <span class=\"fx\">Y=25/3</span>；(2)<span class=\"fx\">5/X=10/25=2/5⇒ X=12.5</span>，但 <span class=\"fx\">10·12.5=125>100</span>，故角解 <span class=\"fx\">X=10,Y<sup>*</sup>=0</span>。（詳解見書末 QR） (p.162)</div></li></ul>\n</div>\n<h5 class=\"sub4\">（五）不滿足嚴格凸性偏好型態(p.162–163)</h5>\n<ul><li><span class=\"fx\">V'(X)\\gt 0,V''(X)\\gt 0</span>（非線性部分邊際效用遞增）：</li></ul>\n<p><span class=\"fx\">\\max_\\X,Y\\U=α V(X)+β Y\\qquads.t.\\ M=P<sub>X</sub>X+P<sub>Y</sub>Y</span></p>\n<p>因不滿足嚴格凸，必須比較 <span class=\"fx\">MRS</span> 與預算線：</p>\n<ol><li>若 <span class=\"fx\">MRS=\\dfracαβV'(X)>\\dfracP<sub>X</sub>P<sub>Y</sub></span>：全數消費 <span class=\"fx\">X</span>、不消費 <span class=\"fx\">Y</span>：</li></ol>\n<p><span class=\"fx\">X<sub>M</sub><sup>*</sup>=(M)/(P<sub>X</sub>),\\qquad Y<sup>*</sup>=0</span></p>\n<ol><li>若 <span class=\"fx\">MRS=\\dfracαβV'(X)<\\dfracP<sub>X</sub>P<sub>Y</sub></span>：全數消費 <span class=\"fx\">Y</span>、不消費 <span class=\"fx\">X</span>：</li></ol>\n<p><span class=\"fx\">X<sub>M</sub><sup>*</sup>=0,\\qquad Y<sup>*</sup>=(M)/(P<sub>Y</sub>)</span></p>\n<ol><li>若 <span class=\"fx\">MRS=\\dfracαβV'(X)=\\dfracP<sub>X</sub>P<sub>Y</sub></span>：可全數消費 <span class=\"fx\">X</span> 或全數消費 <span class=\"fx\">Y</span>：</li></ol>\n<p><span class=\"fx\">X<sub>M</sub><sup>*</sup>=(M)/(P<sub>X</sub>),Y<sup>*</sup>=0 或 X<sub>M</sub><sup>*</sup>=0,Y<sup>*</sup>=(M)/(P<sub>Y</sub>)</span></p>\n<p>##### 圖形概念</p>\n<ul><li>狀況①：座標軸 <span class=\"fx\">X</span> 橫、<span class=\"fx\">Y</span> 縱；凹向原點無異曲線 <span class=\"fx\">U<sup>*</sup>=α V(X)+β Y</span>，最高效用交預算線於橫軸 <span class=\"fx\">E<sup>*</sup>(M/P<sub>X</sub>,0)</span>。</li><li>狀況②：最高效用交預算線於縱軸 <span class=\"fx\">E<sup>*</sup>(0,M/P<sub>Y</sub>)</span>。</li><li>狀況③：無異曲線同時與預算線交於兩軸端點 <span class=\"fx\">E<sup>*</sup>(0,Y<sup>*</sup>)</span> 與 <span class=\"fx\">E<sup>*</sup>(X<sup>*</sup>,0)</span>，兩端皆最適。</li></ul>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><strong><span class=\"fx\">MRS=P<sub>X</sub>/P<sub>Y</sub></span> 相切條件</strong>＋拉格爾茲 FOC（<span class=\"fx\">MU<sub>X</sub>=λ P<sub>X</sub></span>、<span class=\"fx\">MU<sub>Y</sub>=λ P<sub>Y</sub></span>）必考。</li><li><strong>不均衡調整方向</strong>：<span class=\"fx\">MRS>P<sub>X</sub>/P<sub>Y</sub></span> → 多買 <span class=\"fx\">X</span>；<span class=\"fx\">MRS\\lt P<sub>X</sub>/P<sub>Y</sub></span> → 多買 <span class=\"fx\">Y</span>（例6.9、6.10）。</li><li>各效用函數最適解公式務必背熟：</li><li>Cobb-Douglas：<span class=\"fx\">X<sup>*</sup>=\\dfracα M(α+β)P<sub>X</sub></span>、<span class=\"fx\">Y<sup>*</sup>=\\dfracβ M(α+β)P<sub>Y</sub></span>。</li><li>Leontief：<span class=\"fx\">X<sup>*</sup>=\\dfracα Mα P<sub>X</sub>+β P<sub>Y</sub></span>、<span class=\"fx\">Y<sup>*</sup>=\\dfracβ Mα P<sub>X</sub>+β P<sub>Y</sub></span>（拐點條件 <span class=\"fx\">X/α=Y/β</span>）。</li><li>Linear：比較 <span class=\"fx\">MRS=β/α</span> 與 <span class=\"fx\">P<sub>X</sub>/P<sub>Y</sub></span> → 角解或複數解。</li><li>Quasi-Linear：<span class=\"fx\">f'(X)=β P<sub>X</sub>/(α P<sub>Y</sub>)</span>，<span class=\"fx\">X</span> 為所得中性財；<span class=\"fx\">U=α\\ln X+β Y</span> 時 <span class=\"fx\">X<sup>*</sup>=\\dfracα P<sub>Y</sub>β P<sub>X</sub></span>（與 <span class=\"fx\">M</span> 無關）。</li><li>角解（Corner solution）發生時機：嚴格凹偏好、完全替代、完全互補拐點、同心圓買得起極樂點、準線性所得不足。</li><li>Cobb-Douglas 需求彈性=1、交叉彈性=0、所得彈性=1（地位財）；Leontief 需求彈性<1、交叉彈性<0（互補）、所得彈性=1。</li></ul>\n</div>\n</div>"}, {"id": "6.5", "title": "對偶性理論（Dual theory）（印刷頁164–168）", "body": "\n<h4 class=\"sub3\">一、意義</h4>\n<ul><li>同樣問題由兩個不同角度看，結果仍然相同，則稱這兩個問題具有<strong>對偶性（Duality）</strong>(p.164)。</li><li>消費者除了在給定預算限制下極大化效用外，也能在給定效用水準下極小化支出。</li></ul>\n<h4 class=\"sub3\">二、結構（對偶性框架圖，p.164）</h4>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:33.33%\"><col style=\"width:33.33%\"><col style=\"width:33.33%\"></colgroup><thead><tr><th></th><th>效用極大化（Primal）</th><th>支出極小化（Dual）</th></tr></thead><tbody><tr><td>問題</td><td><span class=\"fx\">\\max<sub>(X,Y)</sub>U=U(X,Y)</span> s.t. <span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y</span></td><td><span class=\"fx\">\\min<sub>(X,Y)</sub>E=P<sub>X</sub>X+P<sub>Y</sub>Y</span> s.t. <span class=\"fx\">\\bar U=U(X,Y)</span></td></tr><tr><td>解</td><td>馬歇爾需求函數 <span class=\"fx\">X<sub>M</sub><sup>*</sup>=X(P<sub>X</sub>,P<sub>Y</sub>,M)</span>、<span class=\"fx\">Y<sub>M</sub><sup>*</sup>=Y(P<sub>X</sub>,P<sub>Y</sub>,M)</span></td><td>希克斯需求函數 <span class=\"fx\">X<sub>H</sub><sup>*</sup>=X<sub>H</sub>(P<sub>X</sub>,P<sub>Y</sub>,\\bar U)</span>、<span class=\"fx\">Y<sub>H</sub><sup>*</sup>=Y<sub>H</sub>(P<sub>X</sub>,P<sub>Y</sub>,\\bar U)</span></td></tr><tr><td>代回目標式</td><td>間接效用函數 <span class=\"fx\">V=V(P<sub>X</sub>,P<sub>Y</sub>,M)</span></td><td>支出函數 <span class=\"fx\">E=E(P<sub>X</sub>,P<sub>Y</sub>,\\bar U)</span></td></tr><tr><td>還原定理</td><td><strong>Roy's identity</strong>：<span class=\"fx\">X<sub>M</sub><sup>*</sup>=-\\dfrac∂ V/∂ P<sub>X</sub>∂ V/∂ M</span></td><td><strong>Shephard's Lemma</strong>：<span class=\"fx\">X<sub>H</sub><sup>*</sup>=\\dfrac∂ E∂ P<sub>X</sub></span></td></tr></tbody></table></div>\n<ul><li>間接效用函數與支出函數互為反函數。</li></ul>\n<h4 class=\"sub3\">三、說明</h4>\n<h5 class=\"sub4\">（一）間接效用函數（Indirect utility function）(p.165)</h5>\n<ul><li>透過極大化效用操作，得 <span class=\"fx\">X<sub>M</sub><sup>*</sup>=X(P<sub>X</sub>,P<sub>Y</sub>,M)</span>、<span class=\"fx\">Y<sub>M</sub><sup>*</sup>=Y(P<sub>X</sub>,P<sub>Y</sub>,M)</span>，代回 <span class=\"fx\">U=U(X,Y)</span>：</li></ul>\n<p><span class=\"fx\">Maximum Utility=U(X<sub>M</sub><sup>*</sup>,Y<sub>M</sub><sup>*</sup>)=V(P<sub>X</sub>,P<sub>Y</sub>,M)</span></p>\n<ul><li>效用值除直接受 <span class=\"fx\">X,Y</span> 消費量影響外，也「間接」受商品價格及所得影響，故稱<strong>間接效用函數</strong>。</li><li>利用 <strong>Roy's identity</strong> 可將間接效用函數還原回馬歇爾需求函數。</li></ul>\n<h5 class=\"sub4\">（二）支出函數（Expenditure function）(p.165)</h5>\n<ul><li>透過極小化支出操作，得希克斯需求函數（受補償需求函數）<span class=\"fx\">X<sub>H</sub><sup>*</sup>=X<sub>H</sub>(P<sub>X</sub>,P<sub>Y</sub>,U)</span>、<span class=\"fx\">Y<sub>H</sub><sup>*</sup>=Y<sub>H</sub>(P<sub>X</sub>,P<sub>Y</sub>,U)</span>，代回目標式：</li></ul>\n<p><span class=\"fx\">Minimal Expenditure=P<sub>X</sub>X<sub>H</sub><sup>*</sup>+P<sub>Y</sub>Y<sub>H</sub><sup>*</sup>=E(P<sub>X</sub>,P<sub>Y</sub>,U)</span></p>\n<ul><li>給定商品價格與效用水準下，消費者達到支出最小的函數關係。支出函數與間接效用函數互為反函數；兩者都受商品價格影響，但所給限制不同（一為所得 <span class=\"fx\">M</span>、一為效用 <span class=\"fx\">\\bar U</span>）。</li><li>利用 <strong>Shephard 定理（Shephard's Lemma）</strong> 將支出函數還原回希克斯需求函數。</li></ul>\n<div class=\"callout eg\"><div class=\"clabel\">例題摘要</div>\n<ul><li class=\"probitem\"><div class=\"pq\"><strong>例題 6.19</strong>： A 先生只喜歡 2 份琴酒（gin <span class=\"fx\">g</span>）配 1 份苦艾酒（vermouth <span class=\"fx\">v</span>）的比例，效用 <span class=\"fx\">U(m)=U(g,v)=\\min(g/2,v)</span><br>(1)推導 <span class=\"fx\">g,v</span> 需求函數（以價格 <span class=\"fx\">p,q</span> 及所得 <span class=\"fx\">I</span> 表示）<br>(2)求支出函數（以價格 <span class=\"fx\">p,q</span> 及固定效用 <span class=\"fx\">V</span> 表示）。</div>\n<button type=\"button\" class=\"pbtn\" onclick=\"toggleProb(this)\">顯示解答</button>\n<div class=\"pans\"><strong>書中解法要點</strong>：Leontief 拐點 <span class=\"fx\">g/2=v</span>，代入預算 <span class=\"fx\">I=pg+qv</span> 得需求 <span class=\"fx\">g<sup>*</sup>=2I/(2p+q)</span>、<span class=\"fx\">v<sup>*</sup>=I/(2p+q)</span>；支出函數 <span class=\"fx\">E(p,q,V)=p· 2V+q· V=(2p+q)V</span>。（詳解見書末 QR） (p.166)</div></li></ul>\n</div>\n<h4 class=\"sub3\">四、性質與推論</h4>\n<h5 class=\"sub4\">（一）對偶性相關性質(p.166)</h5>\n<ol><li><strong>對偶性的性質</strong>：</li><li>間接效用函數與支出函數互為反函數。</li><li><span class=\"fx\">V[P<sub>X</sub>,P<sub>Y</sub>,E(P<sub>X</sub>,P<sub>Y</sub>,U)]=U</span>；<span class=\"fx\">E[P<sub>X</sub>,P<sub>Y</sub>,V(P<sub>X</sub>,P<sub>Y</sub>,M)]=M</span>。</li><li>將馬歇爾需求函數中所得以支出函數取代可得受補償需求函數：</li></ol>\n<p><span class=\"fx\">X<sub>M</sub>[P<sub>X</sub>,P<sub>Y</sub>,E(P<sub>X</sub>,P<sub>Y</sub>,U)]=X<sub>H</sub>(P<sub>X</sub>,P<sub>Y</sub>,U)</span></p>\n<ol><li>將受補償需求函數中效用以間接效用函數取代可得馬歇爾需求函數：</li></ol>\n<p><span class=\"fx\">X<sub>H</sub>[P<sub>X</sub>,P<sub>Y</sub>,V(P<sub>X</sub>,P<sub>Y</sub>,M)]=X<sub>M</sub>(P<sub>X</sub>,P<sub>Y</sub>,M)</span></p>\n<h5 class=\"sub4\">（二）間接效用函數相關性質(p.166–167)</h5>\n<ol><li>間接效用函數的性質：</li><li><span class=\"fx\">V(*)</span> 為所有價格的<strong>非遞增函數</strong>（價格上升效用下降）。</li><li><span class=\"fx\">V(*)</span> 為所有價格與所得的<strong>非遞減函數</strong>（所得上升效用上升）。</li><li><span class=\"fx\">V(*)</span> 為所有價格與所得的<strong>零階齊次函數</strong>。</li><li><span class=\"fx\">V(*)</span> 為所有價格的<strong>準凸函數（Quasi-convex）</strong>。</li><li><strong><span class=\"fx\">λ</span> 為所得邊際效用之證明</strong>(p.166–167)：</li></ol>\n<ul><li>由 <span class=\"fx\">V=V[X<sub>M</sub>(P<sub>X</sub>,P<sub>Y</sub>,M),Y<sub>M</sub>(P<sub>X</sub>,P<sub>Y</sub>,M)]</span>，對所得偏微分：</li></ul>\n<p><span class=\"fx\">(∂ V)/(∂ M)=(∂ V)/(∂ X<sub>M</sub>)×(∂ X)/(∂ M)+(∂ V)/(∂ Y<sub>M</sub>)×(∂ Y)/(∂ M)</span></p>\n<ul><li>因 <span class=\"fx\">V=U</span>，<span class=\"fx\">\\dfrac∂ V∂ X<sub>M</sub>=\\dfrac∂ U∂ X<sub>M</sub>=U<sub>X</sub>=λ P<sub>X</sub></span>，<span class=\"fx\">\\dfrac∂ V∂ Y<sub>M</sub>=U<sub>Y</sub>=λ P<sub>Y</sub></span>：</li></ul>\n<p><span class=\"fx\">(∂ V)/(∂ M)=λ P<sub>X</sub>(∂ X)/(∂ M)+λ P<sub>Y</sub>(∂ Y)/(∂ M)=λ(P<sub>X</sub>(∂ X)/(∂ M)+P<sub>Y</sub>(∂ Y)/(∂ M))</span></p>\n<ul><li>預算線 <span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y</span> 對 <span class=\"fx\">M</span> 微分：<span class=\"fx\">1=P<sub>X</sub>\\dfrac∂ X∂ M+P<sub>Y</sub>\\dfrac∂ Y∂ M</span>，故</li></ul>\n<p><span class=\"fx\">(∂ V)/(∂ M)=MU<sub>M</sub>=λ</span></p>\n<ol><li><strong>Roy's identity</strong>(p.167)：</li></ol>\n<ul><li><span class=\"fx\">V=V[X<sub>M</sub>(P<sub>X</sub>,P<sub>Y</sub>,M),Y<sub>M</sub>(P<sub>X</sub>,P<sub>Y</sub>,M)]</span> 對 <span class=\"fx\">P<sub>X</sub></span> 偏微分：</li></ul>\n<p><span class=\"fx\">(∂ V)/(∂ P<sub>X</sub>)=(∂ V)/(∂ X<sub>M</sub>)×(∂ X)/(∂ P<sub>X</sub>)+(∂ V)/(∂ Y<sub>M</sub>)×(∂ Y)/(∂ P<sub>X</sub>)=λ P<sub>X</sub>(∂ X)/(∂ P<sub>X</sub>)+λ P<sub>Y</sub>(∂ Y)/(∂ P<sub>X</sub>)=λ(P<sub>X</sub>(∂ X)/(∂ P<sub>X</sub>)+P<sub>Y</sub>(∂ Y)/(∂ P<sub>X</sub>))</span></p>\n<ul><li>預算線 <span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y</span> 對 <span class=\"fx\">P<sub>X</sub></span> 偏微分：</li></ul>\n<p><span class=\"fx\">0=X+P<sub>X</sub>(∂ X)/(∂ P<sub>X</sub>)+P<sub>Y</sub>(∂ Y)/(∂ P<sub>X</sub>) ⇒ X=-(P<sub>X</sub>(∂ X)/(∂ P<sub>X</sub>)+P<sub>Y</sub>(∂ Y)/(∂ P<sub>X</sub>))</span></p>\n<ul><li>代入：</li></ul>\n<p><span class=\"fx\">(∂ V)/(∂ P<sub>X</sub>)=λ(-X) ⇒ X=-1/λ(∂ V)/(∂ P<sub>X</sub>)=-(∂ V/∂ P<sub>X</sub>)/(∂ V/∂ M)</span></p>\n<ul><li>即 <strong>Roy's identity</strong>：</li></ul>\n<p><span class=\"fx\">X<sub>M</sub><sup>*</sup>=-(∂ V/∂ P<sub>X</sub>)/(∂ V/∂ M)</span></p>\n<h5 class=\"sub4\">（三）支出函數相關性質(p.168)</h5>\n<ol><li>支出函數的性質：</li><li><span class=\"fx\">E(*)</span> 為所有價格的<strong>凹且非遞減函數</strong>（凹函數於價格）。</li><li><span class=\"fx\">E(*)</span> 為所有價格<strong>一階齊次函數</strong>（價格同比例上漲，支出同比例上漲）。</li><li><strong>Shephard's Lemma</strong>(p.168)：</li></ol>\n<ul><li>模型：</li></ul>\n<p><span class=\"fx\">\\min_\\X,Y\\E=P<sub>X</sub>X+P<sub>Y</sub>Y\\qquads.t.\\ \\bar U=U(X,Y)</span></p>\n<p><span class=\"fx\">\\mathcalL=P<sub>X</sub>X+P<sub>Y</sub>Y+λ[\\bar U-U(X,Y)]</span></p>\n<p><span class=\"fx\">\\frac∂\\mathcalL∂ X=P<sub>X</sub>-λ(∂ U(X,Y))/(∂ X)=0⇒ P<sub>X</sub>=λ MU<sub>X</sub>(X,Y)</span></p>\n<p><span class=\"fx\">\\frac∂\\mathcalL∂ Y=P<sub>Y</sub>-λ(∂ U(X,Y))/(∂ Y)=0⇒ P<sub>Y</sub>=λ MU<sub>Y</sub>(X,Y)</span></p>\n<p><span class=\"fx\">\\frac∂\\mathcalL∂λ=\\bar U-U(X,Y)=0</span></p>\n<ul><li>解出均衡 <span class=\"fx\">X<sub>H</sub><sup>*</sup>=X<sub>H</sub>(P<sub>X</sub>,P<sub>Y</sub>,\\bar U)</span>、<span class=\"fx\">Y<sub>H</sub><sup>*</sup>=Y<sub>H</sub>(P<sub>X</sub>,P<sub>Y</sub>,\\bar U)</span>，代回得支出函數：</li></ul>\n<p><span class=\"fx\">E=P<sub>X</sub>X<sub>H</sub><sup>*</sup>+P<sub>Y</sub>Y<sub>H</sub><sup>*</sup>=P<sub>X</sub>X<sub>H</sub>(P<sub>X</sub>,P<sub>Y</sub>,\\bar U)+P<sub>Y</sub>Y<sub>H</sub>(P<sub>X</sub>,P<sub>Y</sub>,\\bar U)</span></p>\n<ul><li><strong>Shephard's Lemma 證明</strong>：</li></ul>\n<p><span class=\"fx\">(∂ E)/(∂ P<sub>X</sub>)=X<sub>H</sub>(P<sub>X</sub>,P<sub>Y</sub>,\\bar U)+P<sub>X</sub>(∂ X<sub>H</sub>)/(∂ P<sub>X</sub>)+P<sub>Y</sub>(∂ Y<sub>H</sub>)/(∂ P<sub>X</sub>)</span></p>\n<p>其中 <span class=\"fx\">\\·\\</span> 部份因 <span class=\"fx\">X<sub>H</sub><sup>*</sup>,Y<sub>H</sub><sup>*</sup></span> 受限制 <span class=\"fx\">\\bar U=U(X,Y)</span> 求解，故 <span class=\"fx\">\\bar U=U[X<sub>H</sub>(P<sub>X</sub>,P<sub>Y</sub>,\\bar U),Y<sub>H</sub>(P<sub>X</sub>,P<sub>Y</sub>,\\bar U)]</span> 對 <span class=\"fx\">P<sub>X</sub></span> 微分：</p>\n<p><span class=\"fx\">(∂\\bar U)/(∂ P<sub>X</sub>)=(∂ U)/(∂ X<sub>H</sub>)×(∂ X<sub>H</sub>)/(∂ P<sub>X</sub>)+(∂ U)/(∂ Y<sub>H</sub>)×(∂ Y<sub>H</sub>)/(∂ P<sub>X</sub>)=0</span></p>\n<p>兩側同乘 <span class=\"fx\">λ</span>：</p>\n<p><span class=\"fx\">0=λ MU<sub>X</sub>(∂ X<sub>H</sub>)/(∂ P<sub>X</sub>)+λ MU<sub>Y</sub>(∂ Y<sub>H</sub>)/(∂ P<sub>X</sub>)</span></p>\n<p>代入 <span class=\"fx\">P<sub>X</sub>=λ MU<sub>X</sub></span>、<span class=\"fx\">P<sub>Y</sub>=λ MU<sub>Y</sub></span>：</p>\n<p><span class=\"fx\">0=P<sub>X</sub>(∂ X<sub>H</sub>)/(∂ P<sub>X</sub>)+P<sub>Y</sub>(∂ Y<sub>H</sub>)/(∂ P<sub>Y</sub>)=\\·\\</span></p>\n<p>故得 <strong>Shephard's Lemma</strong>：</p>\n<p><span class=\"fx\">(∂ E)/(∂ P<sub>X</sub>)=X<sub>H</sub>(P<sub>X</sub>,P<sub>Y</sub>,\\bar U)</span></p>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">X</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Y</text><line x1=\"90\" y1=\"60\" x2=\"360\" y2=\"200\" stroke=\"#1f3a5f\" stroke-width=\"1.8\"></line><text x=\"366\" y=\"198\" font-size=\"10\" fill=\"#1f3a5f\">U*(Primal)</text><line x1=\"90\" y1=\"110\" x2=\"360\" y2=\"220\" stroke=\"#6b4e8e\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"></line><text x=\"300\" y=\"225\" font-size=\"10\" fill=\"#6b4e8e\">Ū(Dual 固定)</text><line x1=\"110\" y1=\"70\" x2=\"330\" y2=\"180\" stroke=\"#1e7d32\" stroke-width=\"1.6\"></line><circle cx=\"200\" cy=\"120\" r=\"3.5\" fill=\"#b5542e\"></circle><text x=\"160\" y=\"112\" font-size=\"10\" fill=\"#b5542e\">E*(Primal 效用極大)</text><circle cx=\"230\" cy=\"150\" r=\"3.5\" fill=\"#1e7d32\"></circle><text x=\"236\" y=\"148\" font-size=\"10\" fill=\"#1e7d32\">E*(Dual 支出極小)</text></svg><p class=\"figcap\">Primal：預算線固定推高 U 得 Marshall 需求；Dual：U 固定壓低支出得 Hicks 需求。(p.130)</p>\n<div class=\"callout exam\"><div class=\"clabel\">考試重點</div>\n<ul><li><strong>對偶性四個等式</strong>必背：<span class=\"fx\">V[P<sub>X</sub>,P<sub>Y</sub>,E(·)]=U</span>、<span class=\"fx\">E[P<sub>X</sub>,P<sub>Y</sub>,V(·)]=M</span>、<span class=\"fx\">X<sub>M</sub>[E(·)]=X<sub>H</sub>(·)</span>、<span class=\"fx\">X<sub>H</sub>[V(·)]=X<sub>M</sub>(·)</span>。</li><li><strong>Roy's identity</strong>：<span class=\"fx\">X<sub>M</sub><sup>*</sup>=-\\dfrac∂ V/∂ P<sub>X</sub>∂ V/∂ M</span>（負號！）；<span class=\"fx\">∂ V/∂ M=λ</span>（所得邊際效用）。</li><li><strong>Shephard's Lemma</strong>：<span class=\"fx\">∂ E/∂ P<sub>X</sub>=X<sub>H</sub></span>（無負號，直接偏微分得希克斯需求量）。</li><li>間接效用函數性質：價格非遞增、所得非遞減、零階齊次、準凸；支出函數性質：價格凹且非遞減、一階齊次。</li><li>馬歇爾需求（未受補償，含所得效果）vs 希克斯需求（受補償，固定效用）的差別與互換。</li></ul>\n</div>\n</div>"}, {"id": "6.6", "title": "全章考試總複習清單", "body": "\n<ol><li><strong>偏好六大公理</strong>：完整、反射、遞移（三公理）；連續可微、單調、凸性（三假設）；字典性偏好違反連續性。</li><li><strong>效用函數與無異曲線</strong>：<span class=\"fx\">MRS=MU<sub>X</sub>/MU<sub>Y</sub></span>、無異曲線負斜率、凸向原點（MRS 遞減）、不相交、東北效用高。</li><li><strong>邊際效用遞減 ≠ MRS 遞減</strong>（無隱含關係）——高頻觀念題。</li><li><strong>四大效用函數比較</strong>：</li></ol>\n<div class=\"tblwrap\"><table><colgroup><col style=\"width:14.29%\"><col style=\"width:14.29%\"><col style=\"width:14.29%\"><col style=\"width:14.29%\"><col style=\"width:14.29%\"><col style=\"width:14.29%\"><col style=\"width:14.29%\"></colgroup><thead><tr><th>函數</th><th><span class=\"fx\">U</span></th><th><span class=\"fx\">MU<sub>X</sub></span></th><th><span class=\"fx\">MU<sub>Y</sub></span></th><th><span class=\"fx\">MRS</span></th><th>無異曲線</th><th>良好偏好？</th></tr></thead><tbody><tr><td>Cobb-Douglas</td><td><span class=\"fx\">AX^α Y^β</span></td><td><span class=\"fx\">Aα X<sup>α-1</sup>Y^β</span></td><td><span class=\"fx\">Aβ X^α Y<sup>β-1</sup></span></td><td><span class=\"fx\">α Y/β X</span></td><td>凸向原點</td><td>是（同位）</td></tr><tr><td><strong class=\"proper\">Leontief</strong></td><td><span class=\"fx\">\\min\\X/α,Y/β\\</span></td><td>—</td><td>—</td><td>拐點處不存在</td><td>L 型直角</td><td>否（非嚴格凸）</td></tr><tr><td>Linear</td><td><span class=\"fx\">X/α+Y/β</span></td><td><span class=\"fx\">1/α</span></td><td><span class=\"fx\">1/β</span></td><td><span class=\"fx\">β/α</span>（固定）</td><td>直線</td><td>否</td></tr><tr><td>Quasi-Linear</td><td><span class=\"fx\">α f(X)+β Y</span></td><td><span class=\"fx\">α f'(X)</span></td><td><span class=\"fx\">β</span></td><td><span class=\"fx\">α f'(X)/β</span></td><td>垂直平移</td><td>視 f<span class=\"fx\">′′</span> 而定</td></tr></tbody></table></div>\n<ol><li><strong>預算線</strong>：<span class=\"fx\">M=P<sub>X</sub>X+P<sub>Y</sub>Y</span>，斜率 <span class=\"fx\">-P<sub>X</sub>/P<sub>Y</sub></span>；價格變動轉折、所得平行移動；打折（溯及/不溯及既往）、Rationing、時間限制、Numeraire、Endowment。</li><li><strong>均衡條件</strong>：<span class=\"fx\">MRS=P<sub>X</sub>/P<sub>Y</sub></span>（內部解相切）；拉格爾茲 FOC <span class=\"fx\">MU<sub>X</sub>=λ P<sub>X</sub>,MU<sub>Y</sub>=λ P<sub>Y</sub></span>；SOC <span class=\"fx\">|\\bar H|>0</span>。</li><li><strong>不均衡調整</strong>：<span class=\"fx\">MRS>P<sub>X</sub>/P<sub>Y</sub></span> 多買 <span class=\"fx\">X</span>；<span class=\"fx\">MRS\\lt P<sub>X</sub>/P<sub>Y</sub></span> 多買 <span class=\"fx\">Y</span>。</li><li><strong>角解</strong>：嚴格凹偏好、完全替代、完全互補拐點、同心圓極樂點、準線性所得不足。</li><li><strong>各函數最適解公式</strong>（見 6.4）。</li><li><strong>對偶性</strong>：效用極大↔支出極小；間接效用函數 <span class=\"fx\">V(P<sub>X</sub>,P<sub>Y</sub>,M)</span>↔支出函數 <span class=\"fx\">E(P<sub>X</sub>,P<sub>Y</sub>,\\bar U)</span>；馬歇爾需求↔希克斯需求；Roy's identity↔Shephard's Lemma。</li></ol>\n</div>"}], "7": [{"id": "7.1", "title": "替代效果與所得效果（印刷頁 171–181）", "body": "\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc110\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">價格效果（Price effect）</div><div class=\"mc-body\"><div class=\"mc-formula\">商品價格改變後使得消費者消費量改變的效果；可分解為替代效果與所得效果。</div><div class=\"mc-detail\">商品價格改變後使得消費者消費量改變的效果；可分解為替代效果與所得效果(p.170–171)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc111\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">替代效果（Substitution effect, SE）</div><div class=\"mc-body\"><div class=\"mc-formula\">商品的相對價格改變後，消費者會增加相對價格下降的財貨消費、並減少相對價格上升的財貨消費。</div><div class=\"mc-detail\">商品的相對價格改變後，消費者會增加相對價格下降的財貨消費、並減少相對價格上升的財貨消費。較嚴謹的定義：消費者在相對價格改變後，扣除或補償因為價格改變造成實質所得改變的部分，剩下純粹由價格變動引起商品消費量變動的效果(p.171)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc112\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">所得效果（Income effect, IE）</div><div class=\"mc-body\"><div class=\"mc-formula\">在商品相對價格不變（常指變化後的商品相對價格）下，因為實質所得或購買力改變引起消費量變動的效果。</div><div class=\"mc-detail\">在商品相對價格不變（常指變化後的商品相對價格）下，因為實質所得或購買力改變引起消費量變動的效果(p.171)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc113\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">總效果（Total effect）</div><div class=\"mc-body\"><div class=\"mc-formula\">包含替代效果與所得效果，即價格效果。</div><div class=\"mc-detail\">包含替代效果與所得效果，即價格效果(p.171)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc114\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">Hicks 替代效果定義</div><div class=\"mc-body\"><div class=\"mc-formula\">當商品相對價格改變後，扣除或補償實質所得因相對價格變化而改變的部分、並<strong>維持在原效用水準</strong>下，消費者會以相對價格低的商品來取代相對價格高的商品之需求量變動。</div><div class=\"mc-detail\">當商品相對價格改變後，扣除或補償實質所得因相對價格變化而改變的部分、並<strong>維持在原效用水準</strong>下，消費者會以相對價格低的商品來取代相對價格高的商品之需求量變動(p.171)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc115\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">補償變量（Compensated variation, CV）</div><div class=\"mc-body\"><div class=\"mc-formula\">當財貨價格發生變動時，為了使消費者維持在<strong>原效用水準</strong>上，所需增加或減少的名目所得額。</div><div class=\"mc-detail\">當財貨價格發生變動時，為了使消費者維持在<strong>原效用水準</strong>上，所需增加或減少的名目所得額(p.171)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc116\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">Slutsky 替代效果定義</div><div class=\"mc-body\"><div class=\"mc-formula\">商品相對價格改變後，扣除或補償實質所得因相對價格變化而改變的部分、並<strong>維持在原購買組合下</strong>，消費者會以相對價格低的商品來取代相對價格高的商品之需求量變動。</div><div class=\"mc-detail\">商品相對價格改變後，扣除或補償實質所得因相對價格變化而改變的部分、並<strong>維持在原購買組合下</strong>，消費者會以相對價格低的商品來取代相對價格高的商品之需求量變動(p.173)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc117\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">成本差額（Cost difference, CD）</div><div class=\"mc-body\"><div class=\"mc-formula\">當財貨價格發生改變時，為使消費者仍維持在<strong class=\"term\">原來的購買組合（價格尚未改變前）</strong>，所需增加或減少的名目所得額。</div><div class=\"mc-detail\">當財貨價格發生改變時，為使消費者仍維持在<strong class=\"term\">原來的購買組合（價格尚未改變前）</strong>，所需增加或減少的名目所得額(p.173)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc118\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">相等變量（Equivalence variation, EV）</div><div class=\"mc-body\"><div class=\"mc-formula\">當價格改變之後，在<strong>改變前的價格水準</strong>之下，使得消費者能夠感受到與價格改變後的相同滿足感，必須增減的名目所得值。</div><div class=\"mc-detail\">當價格改變之後，在<strong>改變前的價格水準</strong>之下，使得消費者能夠感受到與價格改變後的相同滿足感，必須增減的名目所得值(p.177)。</div></div></div>\n<div class=\"method-card\"><label class=\"mc-check\" title=\"已學會\"><input type=\"checkbox\" data-mc=\"mc119\"><span class=\"mc-lbl\">學會</span></label><div class=\"mc-left\">消費者剩餘（Consumer Surplus, CS）</div><div class=\"mc-body\"><div class=\"mc-formula\">消費者最高願付價格與實際支付價格之間差額的總和；此時需求線為馬歇爾需求線。</div><div class=\"mc-detail\">消費者最高願付價格與實際支付價格之間差額的總和；此時需求線為馬歇爾需求線(p.178)。</div></div></div>\n<div class=\"callout formula\"><div class=\"clabel\">公式</div>\n<ul><li>價格效果分解：PE=SE+IE(p.171)</li><li>CD 公式（X 價格上升至 <span class=\"fx\">P<sub>X</sub>'</span>，原均衡點為 <span class=\"fx\">A(X<sub>A</sub>,Y<sub>A</sub>)</span>）：<span class=\"fx\">P<sub>X</sub>' X<sub>A</sub> + P<sub>Y</sub> Y<sub>A</sub> = M + CD ⇒ CD = M - P<sub>X</sub>' X<sub>A</sub> - P<sub>Y</sub> Y<sub>A</sub></span>(p.174)</li><li>消費者剩餘：<span class=\"fx\">WTP = ∫<sub>0</sub><sup>X<sup>*</sup></sup> P<sub>X</sub><sup>dM</sup>(X) dX</span>；<span class=\"fx\">TE = P<sub>X</sub><sup>*</sup> X<sup>*</sup></span>；<span class=\"fx\">CS = ∫<sub>0</sub><sup>X<sup>*</sup></sup> P<sub>X</sub><sup>dM</sup>(X) dX - P<sub>X</sub><sup>*</sup> X<sup>*</sup></span>(p.179)</li><li>消費者剩餘變動（價格由 <span class=\"fx\">P<sub>X</sub><sup>*</sup></span> 跌至 <span class=\"fx\">P<sub>X</sub>'</span>）：<span class=\"fx\">Δ CS = ∫<sub>P<sub>X</sub>'</sub><sup>P<sub>X</sub><sup>*</sup></sup> X<sub>M</sub>(P<sub>X</sub>; P<sub>Y</sub>, M) dP<sub>X</sub></span>(p.179)</li><li>例題 7.12 實作（<span class=\"fx\">U=ab</span>，<span class=\"fx\">P<sub>a</sub>=P<sub>b</sub>=10</span>，<span class=\"fx\">M=100</span>，<span class=\"fx\">P<sub>a</sub></span> 升至 20 求 <span class=\"fx\">EV</span>）：新均衡 <span class=\"fx\">a<sup>*</sup>=100/(2×20)=2.5</span>、<span class=\"fx\">b<sup>*</sup>=100/(2×10)=5</span>、<span class=\"fx\">U<sup>*</sup>=12.5</span>；支出函數 <span class=\"fx\">E=2√(P<sub>a</sub> P<sub>b</sub> U)=2√(10×10×12.5)=70.71</span>；∣EV∣=∣70.71−100∣=29.29(p.181)</li></ul>\n</div>\n<div class=\"callout key\"><div class=\"clabel\">重點與結論</div>\n<ul><li>依史勒斯基方程式：<strong>替代效果必定與價格變動為負（向關係）</strong>；所得效果需細分——正常財為負（向關係）、劣等財為正（向關係）(p.180)。</li><li>當單純只有名目所得發生改變時，不會出現替代效果(p.180)。</li><li>CV 與 EV 皆以貨幣變動量衡量消費者福利變動（序列效用分析中效用值本身無序數意義，不適合作福利衡量）(p.180)。</li></ul>\n</div>\n<svg viewbox=\"0 0 440 280\" class=\"figsvg\"><line x1=\"60\" y1=\"230\" x2=\"410\" y2=\"230\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><line x1=\"60\" y1=\"230\" x2=\"60\" y2=\"30\" stroke=\"#2b251d\" stroke-width=\"1.4\"></line><text x=\"406\" y=\"246\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">X</text><text x=\"54\" y=\"42\" font-size=\"12\" font-style=\"italic\" text-anchor=\"end\">Y</text><line x1=\"110\" y1=\"60\" x2=\"330\" y2=\"2
