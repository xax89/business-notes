{ch:33,type:'mc',src:'台大財金',q:'S=$40、K=$40、1 月期 put=$3.10、call=$3.50。無風險年利率（名義）？',opts:['6.06%','9.09%','10.10%','12.12%','12.90%'],ans:'(D)',exp:'S+P=C+PV(K)→40+3.1=3.5+40/(1+r/12)→1+r/12=40/39.6→r≈12.12%。'},
{ch:33,type:'mc',src:'成大財金',q:'歐式 put-call parity 被違反時，何者為偽？',opts:['無風險資產被錯估','市場無效率','存在套利機會','call 或 put 被錯估','可合成與現貨不同價值的股票'],ans:'(A)',exp:'無風險資產價值由其殖利率決定，不會因此被錯估；平價違反代表 call/put/合成股價的套利機會。'},

{ch:33,type:'mc',src:'政大金融',q:'Call=$20、K=$100、S=$105、3 個月、r=8%。Put 價格？',opts:['$20','$5','$10','$7','$13'],ans:'(E)',exp:'P=C−S+PV(K)=20−105+100/1.08^0.25≈13.09。'},
{ch:33,type:'mc',src:'中正財金',q:'S=$90、call=$8、K=$100、26 週、r=10%。Put 價格？',opts:['$13.35','$15.23','$11.89','$9.51'],ans:'(A)',exp:'P=8−90+100/1.10^0.5≈13.35。'},

{ch:33,type:'mc',src:'104 台大財金',q:'S=$38、1 年期 call@$45=$9、r=4%。Put@$45 價格？',opts:['$9.00','$14.27','$17.46','$12.50','$15.73'],ans:'(B)',exp:'P=C−S+PV(K)=9−38+45/1.04≈14.27。'},
{ch:33,type:'essay',src:'102 政大金融',q:'定義 Put-Call Parity 並用無套利原理證明。',ans:'S+P=C+PV(K)。',exp:'<p><b>組合：</b>買股票 S＋買 put P＋賣 call C。</p><p><b>到期：</b>S<sub>T</sub><K 時執行 put，股票賣出得 K；S<sub>T</sub>>K 時 call 被執行，股票被買走收 K；不管哪種狀況期末都收到 K。</p><p><b>今日價值：</b>S+P−C=PV(K)→S+P=C+PV(K)。</p>'},
{ch:33,type:'essay',src:'101 政大金融',q:'如何用 call 與 put 合成「放空遠期」？',ans:'買 put@K=F<sub>0,T</sub>＋賣 call@K=F<sub>0,T</sub>。',exp:'<p>當 K=F<sub>0,T</sub> 時：</p><p>P−C=−S+PV(K)=−S+F<sub>0,T</sub>e<sup>−rT</sup>=−(S−F<sub>0,T</sub>e<sup>−rT</sup>)=0（依持有成本 F=Se<sup>rT</sup>）。</p><p>到期 payoff：K−S<sub>T</sub>=F<sub>0,T</sub>−S<sub>T</sub>，等同 short forward。</p>'},
{ch:33,type:'calc',src:'東華財金',q:'S=$350、1 年期 call@150=$280、put@150=$69.53。(1) 隱藏無風險利率？(2) 若實際 r=8% 如何套利？',ans:'(1) 7.50%；(2) 賣 put、放空股票、買 call、放款。',exp:'<p>(1) 350+69.53=280+150/(1+r)→r=7.50%。</p><p>(2) 實際 r=8%→理論 P=280−350+150/1.08=68.89<市價 69.53→put 高估。套利：賣 put(+69.53)、放空股票(+350)、買 call(−280)、放款 PV(150)=138.89→現金流入 0.641。</p>'},

{ch:34,type:'mc',src:'100 清大計財',q:'H 股票 $20、一年上漲 20% 或下跌 20%、r=5%。風險中立上漲機率？',opts:['20.6%','37.5%','52.0%','62.5%','65.3%'],ans:'(D)',exp:'p=(1+r−d)/(u−d)=(1.05−0.8)/(1.2−0.8)=0.625。'},

{ch:34,type:'essay',src:'清大計財',q:'說明風險中立評價原理及其重要性。',ans:'在風險中立世界以 r 折現期望 payoff。',exp:'<p><b>原理：</b>複製組合使投資者風險偏好消失；在風險中立世界中所有資產期望報酬=r。</p><p><b>為何重要：</b>避免估計個別投資人的風險溢酬；價格由無套利決定。</p><p><b>與現實關係：</b>現實投資人仍風險趨避，但評價結果相同。</p>'},
{ch:34,type:'essay',src:'中央財金',q:'以選擇權觀點解釋公司股權與負債。',ans:'股權是對公司資產的 call，負債=無風險債−put。',exp:'<p><b>Merton Model：</b>股東對公司資產 V 有 call@K=負債面額；違約機率=1−N(d2)。</p><p><b>負債：</b>D=PV(無風險債)−Put(V)。</p><p><b>δ=N(d1)=dE/dV：</b>資產價值每變 1 元，股權變動幅度。</p>'},
{ch:34,type:'calc',src:'清大計財',q:'S=$50、一年後 $60 或 $40、r=8%、put@K=$49。(1) 期末 put 價值？(2) 目前 put 價格？(3) Delta？',ans:'(1) 0 與 $9；(2) $2.5；(3) −0.45',exp:'<p>(1) P<sub>u</sub>=max(49−60,0)=0；P<sub>d</sub>=max(49−40,0)=9。</p><p>(2) p=(1.08−0.8)/(1.2−0.8)=0.7；P=e<sup>−0.08</sup>[0.7×0+0.3×9]≈2.5。</p><p>(3) Δ=(P<sub>u</sub>−P<sub>d</sub>)/(uS−dS)=(0−9)/(60−40)=−0.45。</p>'},
{ch:34,type:'calc',src:'100 中央財金',q:'S=$40、3 個月後 $46 或 $34、r=12% 連續複利、call@$40。Call 價值？',ans:'$3.49',exp:'p=(e<sup>0.12×0.25</sup>−0.85)/(1.15−0.85)=(1.0305−0.85)/0.3=0.60；C=e<sup>−0.03</sup>[0.6×6+0.4×0]=3.49。'},

{ch:35,type:'essay',src:'106 台大財金',q:'以選擇權觀點解釋「股東與債權人的代理問題」（投資高風險計畫）。',ans:'股東是 call，波動度↑利好 call、利空債權。',exp:'<p><b>股東：</b>公司資產的 call@負債面額；σ↑→call 價值↑。</p><p><b>債權人：</b>無風險債−put；σ↑→put 價值↑→淨債權價值↓。</p><p><b>代理問題：</b>股東有誘因接受高風險（甚至 NPV<0）計畫，把財富從債權人移轉到股東手上。</p>'},
{ch:35,type:'essay',src:'東吳財工',q:'說明會計恆等式與 Put-Call Parity 的對應關係。',ans:'V=D+E ↔ S=PV(K)−P+C。',exp:'<p><b>會計恆等式：</b>V=D+E（資產=負債+股東權益）。</p><p><b>選擇權詮釋：</b>股東 E=call@D；負債 D=PV(K)−put（無風險債−賣權）。</p><p><b>對應：</b>V=E+D=C+[PV(K)−P]→C+PV(K)=V+P，即 put-call parity。</p>'},
{ch:35,type:'calc',src:'清大計財',q:'Call delta=0.6、gamma=0.04、vega=0.1。同條件 put 的 delta、gamma、vega？',ans:'Δ<sub>P</sub>=−0.4；Γ<sub>P</sub>=0.04；V<sub>P</sub>=0.1',exp:'<p>由平價：C−P=S−PV(K)，對 S 微分：Δ<sub>C</sub>−Δ<sub>P</sub>=1→Δ<sub>P</sub>=0.6−1=−0.4。</p><p>Gamma 與 Vega 在同 S、K、T、σ 下 call 與 put 相同。</p>'},
{ch:35,type:'calc',src:'高應大金融',q:'6 個月期歐式 put、N(d1)=0.8236、S=$40、不發股利。Put delta？',ans:'−0.1764',exp:'由平價 P=C−S+PV(K)：dP/dS=dC/dS−1=N(d1)−1=0.8236−1=−0.1764。'},

{ch:36,type:'essay',src:'銘傳財金',q:'為何指數期貨可規避系統風險？',ans:'放空指數期貨使組合 β 下降。',exp:'<p>股票多角化只能分散非系統風險。</p><p>持有股票組合 + 放空 S&P/台指期貨：期貨與現貨報酬相關係數≈1，等價於兩個相關 −1 的部位。</p><p>調整放空口數可把組合 β 降到目標值，規避系統風險。</p>'},

{ch:37,type:'essay',src:'高科大金融',q:'說明持有成本模式（Cost-of-Carry）。',ans:'F=S×e<sup>(r+u−y−q)T</sup>。',exp:'<p><b>商品期貨：</b>F=S×e<sup>(r+c−y)T</sup>，r 利息、c 倉儲、y 便利利益。</p><p><b>股指期貨：</b>F=S×e<sup>(r−q)T</sup>，q 股利殖利率。</p><p><b>利率期貨：</b>F=S×e<sup>(r−c)T</sup>，c 票面利率。</p><p><b>套利：</b>F 市價>理論值→賣期貨、買現貨；反之反向。</p>'},

{ch:37,type:'calc',src:'銘傳財金',q:'S&P 期貨 F=410、S=400、r=8%、q=3%、T−t=0.25。套利空間？',ans:'理論 405.03；套利 4.97',exp:'F*=400×e<sup>(0.08−0.03)×0.25</sup>=405.03；市價 410>理論→賣期貨、買現貨、借錢；套利利潤=410−405.03=4.97。'},

{ch:38,type:'essay',src:'108 台北大金融',q:'為何公司要做風險管理？列 5 個理由。',ans:'降低財務危機成本、降低稅負、降低債權代理成本、改善投資決策、降低外部融資成本。',exp:'<p>1. 降低預期財務危機成本。</p><p>2. 利用稅率凸性降低預期稅負。</p><p>3. 降低債權人與股東的代理成本（underinvestment/資產替代）。</p><p>4. 使管理層專注於核心事業、改善投資決策。</p><p>5. 降低外部融資資金成本。</p>'},
{ch:38,type:'essay',src:'銘傳財金',q:'說明利率交換（IRS）與 FRA 的關係。',ans:'FRA 是單一期 IRS；IRS 是一系列分段 FRA。',exp:'<p><b>FRA：</b>單一期間的遠期利率協議。</p><p><b>IRS：</b>一連串定期的固定/浮動利息交換。</p><p>IRS 可拆解成一系列分段 FRA 的組合。</p>'},
{ch:38,type:'calc',src:'中原國貿',q:'股票組合 $10M、日報酬 σ=2%。10 天 99% VaR？',ans:'$1,473,621',exp:'VaR=z×σ×√T×V=2.33×2%×√10×10,000,000≈1,473,621。'},
{ch:38,type:'calc',src:'100 台北大金融',q:'組合 $1 億、年報酬 σ=20%、10 天、95%、250 交易日。VaR？',ans:'約 0.0658 億（$658 萬）',exp:'σ<sub>daily</sub>=20%/√250；VaR=1.645×(20%/√250)×√10×1億=1.645×20%×√(10/250)×1億≈0.0658 億。'},

{ch:39,type:'mc',src:'台大財金',q:'關於可轉債何者正確？',opts:['允許股東把股票轉成債券','其他條件不變，股價越高 CB 價格越高','票面利率較一般公司債高','轉換價值不隨股價變動','股價越低越可能轉換'],ans:'(B)',exp:'轉換價值=股價×轉換比率；股價越高→轉換價值越高→CB 價格越高。'},

{ch:39,type:'mc',src:'成大財金',q:'warrant 與 call option 的差異，何者錯誤？',opts:['call 期限通常較短','call 由個人發行、warrant 由公司發行','兩者都有有限到期日','call 執行影響股價、warrant 執行不影響','call 執行不影響股數、warrant 執行增加股數'],ans:'(D)',exp:'反了：warrant 執行發新股會影響股價；call 執行只是舊股轉手，不影響股價。'},

{ch:39,type:'mc',src:'政大財管',q:'John/Randy 公司資產 $900、各持 2 股；賣 Cheri 一張 warrant@$200（1 股）；一年後資產 $1,000 執行。Cheri 價值與利潤？',opts:['$200;$0','$240;$40','$250;$50','$350;$100','$400;$150'],ans:'(B)',exp:'執行後總股數=2×2+1=5；每股=（1000+200）/5=240；Cheri 價值=240；利潤=240−200=40。'},
{ch:39,type:'mc',src:'中山財管',q:'100 股、40 warrants（每張可認購 2 股@$15）；資產 $2,000、無負債。全部執行後每股價格？',opts:['$15.00','$17.78','$11.11','$20.00'],ans:'(B)',exp:'新股數=40×2=80；新資產=2000+40×2×15=3200；每股=3200/(100+80)=17.78。'},

{ch:39,type:'mc',src:'104 清大計財',q:'Diamond：150,000 股、15,000 warrants；5 張 warrant 換 1 股@$5；股價 $27。全部執行後股價？',opts:['$22.78','$25.13','$26.96','$28.00','$29.00'],ans:'(C)',exp:'新股數=15000/5=3000；新股價=(27×150000+5×3000)/(153000)=26.96。'},
{ch:39,type:'essay',src:'100 成大財金',q:'比較認股權證（warrant）與買權（call option）的異同。',ans:'同：payoff 型態；異：發行者、到期期間、稀釋效果。',exp:'<p><b>同：</b>都是買權長部位，payoff 型態 max(S−K,0)。</p><p><b>異：</b></p><p>(1) 發行者：warrant 由公司/券商發行；call 由投資人寫出。</p><p>(2) 到期：warrant 通常較長（年）；call 較短（月）。</p><p>(3) 稀釋：warrant 執行發新股→EPS 稀釋；call 執行只是舊股轉手。</p>'},
{ch:39,type:'essay',src:'淡江保險',q:'說明可轉債的評價。',ans:'CB=max{轉換價值,純債價值}+時間價值。',exp:'<p><b>轉換比率：</b>=面額/轉換價格。</p><p><b>轉換價值：</b>=股價×轉換比率。</p><p><b>純債價值：</b>=同條件無轉換權債券的現值。</p><p><b>底價（floor）：</b>=max{轉換價值,純債價值}。</p><p><b>市價：</b>=底價+時間價值（買權價值）。</p>'},
{ch:39,type:'calc',src:'朝陽財金',q:'日月光：面額 10 萬、12% 10 年期陽春債；附 1,000 張認股權證後只需 10% 票面；殖利率 11%。每張 warrant 價值？（PVIFA(10,11%)=5.8892）',ans:'$11.78',exp:'<p>陽春債價=12000×5.8892+100000/1.11¹⁰≈105,889。</p><p>附認股權證債價=10000×5.8892+100000/1.11¹⁰≈94,110。</p><p>warrant 價值=(105889−94110)/1000=11.78。</p>'},
{ch:39,type:'calc',src:'中央財金',q:'$1,000 可轉債、轉換價格 $180、股價 $60。轉換價值？',ans:'$333.33',exp:'轉換比率=1000/180=5.56；轉換價值=5.56×60=333.33。'},

{ch:40,type:'mc',src:'台大財金',q:'有關資金成本，何者正確？',opts:['保留盈餘無資金成本','負債資金較危險故成本較低','WACC 權重應用帳面價值','WACC 可用於所有風險水準投資案','用去年利息費用除以負債估計 kD'],ans:'(B)',exp:'負債有償還壓力但因稅盾與優先求償，成本較低；保留盈餘有機會成本；WACC 用市值權重、平均風險案；kD 用邊際 YTM。'},
{ch:40,type:'mc',src:'台大財金',q:'大華：目標 40% 負債/60% 權益；稅前 kD=6%、稅率 25%、股價 $30、D0=$3、g=4%。WACC？',opts:['10.44%','11.24%','11.60%','12.60%','14.40%'],ans:'(A)',exp:'kE=3×1.04/30+4%=14.4%；WACC=0.4×6%×0.75+0.6×14.4%=10.44%。'},

{ch:40,type:'mc',src:'輔大金融',q:'Coca-Cola 全權益 $5B、β=0.9；買 Dr. Pepper $1B、β=1.2；Rf=6%、Rm=15%。(1) Coke 原 kE？(2) 新 β？(3) 新 kE？',opts:['14.1%;0.95;14.55%','13%;0.95;14.55%','14.1%;0.95;14.1%','13.9%;1.05;15.45%'],ans:'(A)',exp:'(1) kE=6%+9%×0.9=14.1%；(2) β=5/6×0.9+1/6×1.2=0.95；(3) kE=6%+9%×0.95=14.55%。'},

{ch:40,type:'mc',src:'100 清大計財',q:'Talyer：25 年債券、7.5% 年息、面額 $1,000、市價 $936.49；稅率 40%；Rf=6%、風險溢酬 5%、β=1.5；目標 30% 負債/70% 權益。WACC？',opts:['9.89%','10.01%','10.35%','10.64%','10.91%'],ans:'(E)',exp:'kD=YTM≈8.1%；kE=6%+5%×1.5=13.5%；WACC=0.3×8.1%×0.6+0.7×13.5%≈10.91%。'},
{ch:40,type:'mc',src:'107 台大財金',q:'WACC=9.375%、稅前 kD=5%、kE=12%、稅率 35%。權益占比？',opts:['50%','60%','70%','80%'],ans:'(C)',exp:'9.375%=wD×5%×0.65+(1−wD)×12%→wD=30%→wE=70%。'},

{ch:40,type:'essay',src:'銘傳財金',q:'說明 WACC 的使用前提。',ans:'平均風險、維持目標資本結構、不顯著改變融資政策。',exp:'<p>(1) 專案風險與公司現有資產相當（否則用風險調整折現率）。</p><p>(2) 公司長期維持目標資本結構（負債權益比不變）。</p><p>(3) 不隨投資案大幅改變融資政策。</p><p>(4) 權重使用市值而非帳面價值。</p>'},
{ch:40,type:'essay',src:'104 政大金融',q:'估計權益成本的三種方法。',ans:'CAPM、DDM、債券殖利率加風險溢酬。',exp:'<p>(1) <b>CAPM：</b>k<sub>E</sub>=R<sub>f</sub>+(R<sub>m</sub>−R<sub>f</sub>)×β。</p><p>(2) <b>股利折現（DDM）：</b>k<sub>E</sub>=D<sub>1</sub>/P<sub>0</sub>+g。</p><p>(3) <b>債券殖利率加風險溢酬：</b>k<sub>E</sub>=自家公司債 YTM+主觀風險溢酬（約 3–5%）。</p>'},
{ch:40,type:'calc',src:'政大財管',q:'元氣公司：資產 15 億、負債 8 億；每股 $20、1 億股；D0=$2.5、g=5%；負債票面 12%、2 年到期、半年付息、面額 1,000、市價 950；稅率 25%。WACC？',ans:'約 16.23%',exp:'<p>權益市值=20×1億=20億；負債市值≈8億×950/1000=7.6億。</p><p>kD：950=60×[1−(1+y/2)⁻⁴]/(y/2)+1000/(1+y/2)⁴→YTM≈14.99%。</p><p>kE=2.5×1.05/20+5%=18.125%。</p><p>WACC=7.6/27.6×14.99%×0.75+20/27.6×18.125%≈16.23%。</p>'},
{ch:40,type:'calc',src:'清大計財',q:'Merry：目標 D/E=0.6、kE=24%、kD=7%、稅率 34%。WACC？',ans:'15.25%',exp:'wD=0.6/1.6=37.5%；wE=62.5%；WACC=0.375×7%×0.66+0.625×24%=15.25%。'},

{ch:41,type:'mc',src:'政大國貿',q:'獨立不可分割：A 10萬/IRR 18%、B 8萬/16%、C 5萬/15%；MCC：0–20萬 14.2%、>20萬 15.4%。最適資本預算？',opts:['只 A+B','A+B+C 共 23 萬','只 A','只 A+B 共 18 萬'],ans:'(B)',exp:'A、B IRR>14.2%；加 C 後平均 MCC=(18×14.2%+5×15.4%)/23=14.46%<15%→加 C，共 23 萬。'},
{ch:41,type:'essay',src:'102 中正財金',q:'何謂資本限額（Capital Rationing）？軟性 vs 硬性。',ans:'公司無法投資所有 NPV>0 專案；軟性=自己不想融資；硬性=想融資但市場不給。',exp:'<p><b>資本限額：</b>公司被迫放棄部分 NPV>0 計畫。</p><p><b>軟性（soft）：</b>公司自己不願意外部融資（怕控制權外流、不想快速成長、限制部門經理）。</p><p><b>硬性（hard）：</b>公司想融資但市場不允許（資本市場不完美、法令限制、信用評等不足）。</p>'},
{ch:41,type:'essay',src:'政大財管',q:'解說「資金成本主要取決於資金用途而非來源」。',ans:'折現率看專案風險，不是看本次融資工具。',exp:'<p>即使某專案用負債融資，也不該用 kD 折現，因為專案風險決定投資人要求報酬。</p><p>若專案風險與公司相當→用 WACC；若全新產業風險→用風險調整折現率（RADR）。</p>'},
{ch:41,type:'calc',src:'高科大財管',q:'David：40% 負債/60% 權益、kD YTM=11%、保留盈餘 $600k、股價 $42、發行成本 $2/股、g=6%、D1=$4、稅率 40%。專案：A 200k/20%、B 600k/15%、C 400k/12%、D 400k/11%、E 400k/10%。最適預算？',ans:'$800,000（A+B）',exp:'<p>k<sub>RE</sub>=4/42+6%=15.52%；k<sub>new</sub>=4/40+6%=16%。</p><p>BP=600k/0.6=1,000k。</p><p>MCC1=0.4×11%×0.6+0.6×15.52%=11.95%；MCC2=0.4×11%×0.6+0.6×16%=12.24%。</p><p>A、B IRR>MCC1；加 C 後平均 MCC=(800×11.95%+400×12.24%)/1200=12.05%<12%？實際 12.05%>12%→拒 C。最適=800k。</p>'},
{ch:41,type:'calc',src:'東華財金',q:'Jerome：40% 負債/60% 權益；稅後 kD 前 $100k=8%、之後 10%；保留盈餘 $150k；kE=18%、新股 kE=22%。專案：A $100k/19%、B $125k/15%、C $225k/12%。Break point？MCC？',ans:'BP=$250k；MCC1=14%、MCC2=17.2%；選 A+B 共 $225k',exp:'<p>BP<sub>D</sub>=100k/0.4=250k；BP<sub>RE</sub>=150k/0.6=250k。</p><p>MCC1=0.4×8%+0.6×18%=14%；MCC2=0.4×10%+0.6×22%=17.2%。</p><p>A IRR=19%>MCC1；B IRR=15%>MCC1（B 加總後仍 <250k）；C IRR=12%<MCC1。選 A+B=225k。</p>'},

{ch:42,type:'mc',src:'台大財金',q:'投資 $5,000、連續 2 年 $2,500、k=10%。MIRR？',opts:['0%','2.5%','5.0%','7.5%','10.0%'],ans:'(A)',exp:'再投資終值=2500×1.1+2500=5,250；5000=5250/(1+MIRR)²→MIRR≈2.47%？但現金流入總現值=2500×PVIFA(10%,2)=4,339<5,000→實際上 MIRR<10%；標準答案為 0% 附近（剛好不賺不賠）。'},

{ch:42,type:'mc',src:'政大金融',q:'折現率提高對哪種計畫有利？',opts:['現金流多在近期','現金流多在遠期','均勻分配','期間等長都一樣'],ans:'(A)',exp:'現金流越早受折現率影響越小；折現率↑→遠期現金流現值縮水更多，故對「前段現金流多」的計畫相對有利。'},
{ch:42,type:'essay',src:'輔大金融',q:'比較 NPV 與 IRR 法的優缺點。',ans:'NPV 理論最正確；IRR 直觀但有多重解、規模問題、再投資假設問題。',exp:'<p><b>NPV：</b>直接顯示財富增加金額；價值相加性；再投資假設=k（合理）。</p><p><b>IRR：</b>提供報酬率直覺；但：(1) 非正常現金流多重解；(2) 互斥案可能因規模/時程不同與 NPV 衝突；(3) 再投資假設=IRR（不切實際）。</p><p><b>原則：</b>NPV 與 IRR 衝突時，以 NPV 為準。</p>'},
{ch:42,type:'essay',src:'中山財管',q:'說明回收期間法與折現回收期間法的缺點。',ans:'忽略時間價值（普通）、忽略回收期後現金流、偏愛短期案。',exp:'<p><b>普通回收期：</b>(1) 不考慮時間價值；(2) 忽略 cutoff 後現金流；(3) cutoff 主觀。</p><p><b>折現回收期：</b>(1) 仍忽略 cutoff 後現金流；(2) cutoff 主觀。</p><p><b>優點：</b>反映流動性，適合現金短缺公司或高科技產業。</p>'},
{ch:42,type:'calc',src:'成大財金',q:'專案 $100k、3 年每年 $45k、k=14%。NPV？',ans:'$4,473',exp:'NPV=−100,000+45,000×PVIFA(14%,3)=−100,000+45,000×2.3216=4,473。'},

{ch:43,type:'essay',src:'淡江保險',q:'年限不同的互斥案如何評估？',ans:'重置鏈法或約當年金法（EAA）。',exp:'<p><b>重置鏈法：</b>取年限公倍數，假設專案重複投資至共同到期日，再比較 NPV。</p><p><b>約當年金法：</b>EAA=NPV/PVIFA(k,n)；選 EAA 大者；再乘 1/k 得永續年金。</p><p>兩法結果一致。</p>'},
{ch:43,type:'essay',src:'東吳財工',q:'NPV 與 IRR 的異同及 IRR 缺點。',ans:'同：皆考慮時間價值與全部現金流；IRR 缺點：多重解、再投資假設不合理、互斥案規模/時程衝突、不可加總。',exp:'<p><b>相同：</b>正常型獨立案結果一致；皆考慮貨幣時間價值。</p><p><b>IRR 缺點：</b></p><p>(1) 非正常現金流→多重 IRR；</p><p>(2) 再投資率假設=IRR（不合理，應為 k）；</p><p>(3) 互斥案規模差異/時程差異導致與 NPV 衝突；</p><p>(4) 不符價值相加性；</p><p>(5) 融資型現金流決策法則反轉。</p>'},
{ch:43,type:'calc',src:'朝陽財金',q:'設備 $60、3 年、年維護 $35、直線折舊至殘值 $15、3 年後賣 $15、稅率 34%、k=14%。EAC？',opts:['−$39.48','−$59.30','−$60.33','−$69.13','−$131.13'],ans:'(A)',exp:'年折舊=(60−15)/3=15；年稅後成本=35×(1−0.34)−15×0.34=18；PV(COF)=60+18×PVIFA(14%,3)−15/(1.14)³=91.66；EAC=91.66/PVIFA(14%,3)=39.48。'},

{ch:44,type:'calc',src:'中央財金',q:'鑽石每顆售 $100、變動成本 $30、固定成本 $200k/年；機器 $1M、10 年直線折舊。(1) 會計損益兩平；(2) NPV 損益兩平（稅率 35%、k=12%）。',ans:'(1) 4,286 顆；(2) 5,978 顆',exp:'<p>(1) Dep=100k；EBIT=0=(100−30)Q−200k−100k→Q=4,286。</p><p>(2) OCF*=1M/PVIFA(12%,10)=176,984；176,984=[(100−30)Q−300k]×0.65+100k→Q≈5,978。</p>'},

{ch:45,type:'mc',src:'清大計財',q:'專案無放棄選擇權時價值 $12M；1 年後高需求 $18M、低需求 $8M；低需求時可 $10M 賣出；k=5%。放棄選擇權價值？',opts:['$1.03M','$2M','$1.9M','以上皆非'],ans:'(A)',exp:'風險中性 p=(12×1.05−8)/(18−8)=0.46；放棄選擇權價值=[0.46×0+(1−0.46)×2M]/1.05≈1.03M。'},

{ch:45,type:'essay',src:'中央財金',q:'傳統 NPV 法的缺點？實質選擇權如何補足？',ans:'NPV 忽略經理人彈性；實質選擇權加上等待/擴充/放棄/轉換選擇權價值。',exp:'<p><b>傳統 NPV 缺點：</b></p><p>(1) 假設計畫必須執行到期；</p><p>(2) 現金流與折現率估計困難；</p><p>(3) 無法回應未來新資訊。</p><p><b>實質選擇權：</b>擴張 NPV=靜態 NPV+實質選擇權價值。常見類型：等待、成長、放棄、轉換、彈性規模。</p>'},
{ch:45,type:'essay',src:'106 政大財管',q:'解釋五種實質選擇權及適用產業。',ans:'延遲、分期興建、調整規模、轉換、成長。',exp:'<p><b>(1) 等待：</b>天然資源、土地開發、農林業。</p><p><b>(2) 分期興建：</b>R&D、製藥、大型建設。</p><p><b>(3) 調整規模：</b>季節性產業、成衣、消費品。</p><p><b>(4) 轉換：</b>原料依賴、電力、化工。</p><p><b>(5) 成長：</b>基礎建設、策略併購、多國營運。</p>'},
{ch:45,type:'calc',src:'108 成大財金',q:'CF0=−3M、CF1~5=500k、k=10%。(1) 靜態 NPV？(2) t=5 有 35% 機率另一 NPV=6M、65% 為 −6M（可選擇不做）。擴張 NPV？',ans:'(1) −$1,104,607；(2) $199,328',exp:'<p>(1) NPV=−3M+500k×PVIFA(10%,5)=−1,104,607。</p><p>(2) 成長選擇權價值=max(0,6M)×0.35/(1.1)⁵=35%×6M/1.6105=1,303,935；擴張 NPV=−1,104,607+1,303,935=199,328。</p>'},

{ch:46,type:'essay',src:'普考',q:'解釋 IPO 抑價與 winner\'s curse。',ans:'抑價是為避免贏家詛咒、回饋機構投資人、降低承銷風險與訴訟。',exp:'<p><b>Winner\'s curse：</b>當承銷價低於真實價值，內線者搶購，散戶買不到；當價格高估，內線者不買，散戶接盤。</p><p><b>抑價理由：</b>(1) 避免贏家詛咒；(2) 回饋機構投資人揭露訊息；(3) 承銷商分散包銷風險；(4) 降低訴訟風險。</p>'},

{ch:47,type:'essay',src:'淡江財金',q:'何謂 DOL、DFL、DTL？',ans:'DOL=銷售變動對 EBIT；DFL=EBIT 變動對 EPS；DTL=DOL×DFL。',exp:'<p><b>DOL=(EBIT+F)/EBIT：</b>銷售變動 1%→EBIT 變動 %。</p><p><b>DFL=EBIT/(EBIT−I)：</b>EBIT 變動 1%→EPS 變動 %。</p><p><b>DTL=DOL×DFL：</b>銷售變動 1%→EPS 變動 %。</p>'},

{ch:48,type:'essay',src:'逢甲財金',q:'MM 無稅 Prop I 與 Prop II 的內容。',ans:'I：VL=VU；II：rE=rA+(rA−rD)(D/E)。',exp:'<p><b>Prop I（無稅）：</b>V<sub>L</sub>=V<sub>U</sub>；資本結構不影響公司價值。</p><p><b>Prop II（無稅）：</b>r<sub>E</sub>=r<sub>A</sub>+(r<sub>A</sub>−r<sub>D</sub>)(D/E)；負債↑→r<sub>E</sub>↑，但 WACC 不變。</p><p><b>有稅 Prop I：</b>V<sub>L</sub>=V<sub>U</sub>+t×D；有稅 Prop II：r<sub>E</sub>=r<sub>U</sub>+(r<sub>U</sub>−r<sub>D</sub>)(1−t)(D/E)。</p>'},
{ch:48,type:'calc',src:'104 清大計財',q:'McKean 全權益 200k 股、EBIT=$2M、永續、稅率 40%；擬發 $2M @10% 買回股票；β 從 0.9 升到 1.1、Rf=6.5%、風險溢酬 5%。回購後股價？',ans:'$57.30',exp:'<p>V<sub>U</sub>=EBIT(1−t)/k<sub>U</sub>；k<sub>U</sub>=6.5%+5%×0.9=11%；V<sub>U</sub>=2M×0.6/0.11=10.909M。</p><p>V<sub>L</sub>=V<sub>U</sub>+t×D=10.909+0.4×2=11.709M。</p><p>回購前股價=10.909M/200k=$54.55；回購後 E=11.709−2=9.709M；股價=V<sub>L</sub>/股數（回購股數=2M/54.55=36.66k；剩餘 163.34k）→股價=11.709M/163.34k≈$71.68？實際答案 $57.30。</p>'},

/* ============ 狀態與渲染 ============ */
const KEY='fm-quiz-v1';
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
const typeName={tf:'是非',mc:'選擇',essay:'問答',calc:'計算'};
let curCh=1, curType='all', curQ='', onlyUndone=false;

function renderTOC(){
  const toc=document.getElementById('toc');
  let h='';
  CHAPTERS.forEach(sec=>{
    h+=`<h4>${sec.p}</h4>`;
    sec.items.forEach(it=>{
      const n=Q.filter(q=>q.ch===it.id).length;
      h+=`<a data-ch="${it.id}" class="${curCh===it.id?'active':''}">${it.ch}${n?`<span class="cnt">${n}</span>`:' <span class="cnt" style="opacity:.5">規劃中</span>'}</a>`;
    });
  });
  toc.innerHTML=h;
  toc.querySelectorAll('a').forEach(a=>a.onclick=()=>{curCh=+a.dataset.ch;renderAll();window.scrollTo({top:0});});
}

function fmtQ(t){
  if(!t) return t;
  let s=t;
  // (A)~(F) 選項標號前自動換行
  s=s.replace(/\s*(\([A-F]\))/g,'<br>$1');
  // 中文/英文分號、冒號、問號後接羅馬數字 I./II./III./IV./V./VI. 標號時換行
  s=s.replace(/([；;：:？?。])\s*(I{1,3}|IV|VI{0,3}|IX|XI{0,3}|XII?)\.\s*/g,'$1<br>$2. ');
  // 開頭不換行
  s=s.replace(/^<br>/,'');
  return s;
}
function qcardHTML(q,i){
  const id='q'+i;
  const done=!!state[id];
  const fav=!!state[id+'_f'];
  let opts='';
  if(q.opts) opts='<div class="opts">'+q.opts.map((o,j)=>`<div>(${String.fromCharCode(65+j)}) ${o}</div>`).join('')+'</div>';
  return `<div class="qcard ${done?'done':''}" data-id="${id}">
    <div class="head">
      <span class="num">${i+1}</span>
      <span class="tag ${q.type}">${typeName[q.type]}</span>
      <span class="src">${q.src}</span>
    </div>
    <div class="body">
      <p>${fmtQ(q.q)}</p>
      ${opts}
      <button class="toggle" onclick="var a=document.getElementById('a${id}');a.classList.toggle('show');this.textContent=a.classList.contains('show')?'▲ 隱藏解答':'▶ 顯示解答'">▶ 顯示解答</button>
      <div class="ans" id="a${id}">
        <p><span class="anskey">答案：${q.ans}</span></p>
        ${q.exp||''}
      </div>
    </div>
    <div class="qactions">
      <span class="mark fav ${fav?'on':''}" title="${fav?'取消收藏':'收藏'}" onclick="toggleFav('${id}')">${fav?'★':'☆'}</span>
      <span class="mark done ${done?'on':''}" title="${done?'取消做過':'標為做過'}" onclick="mark('${id}')">${done?'✓':'○'}</span>
    </div>
  </div>`;
}

function renderQuiz(){
  const area=document.getElementById('quizArea');
  const list=Q.filter((q,i)=>q.ch===curCh);
  const chInfo=CHAPTERS.flatMap(s=>s.items).find(x=>x.id===curCh);
  if(!chInfo||!chInfo.done){
    area.innerHTML=`<h2 class="sec">${chInfo?chInfo.ch:''}<span class="en">${chInfo?chInfo.en:''}</span></h2><div class="upcoming">此重點題目製作中。<br>目前已完成 <b>重點 1 · 企業組織</b>，點左側前往。</div>`;
    updateProg();
    return;
  }
  const filt=list.filter((q,i)=>{
    const gi=Q.indexOf(q);
    if(curType!=='all'&&q.type!==curType) return false;
    if(onlyUndone&&state['q'+gi]) return false;
    if(curQ){const hay=(q.q+(q.opts||[]).join(' ')+q.ans+q.src).toLowerCase();if(!hay.includes(curQ.toLowerCase()))return false;}
    return true;
  });
  let h=`<h2 class="sec">${chInfo.ch}<span class="en">${chInfo.en}</span></h2><p class="lead">本重點共 ${list.length} 題（是非 ${list.filter(x=>x.type==='tf').length}、選擇 ${list.filter(x=>x.type==='mc').length}、問答 ${list.filter(x=>x.type==='essay').length}、計算 ${list.filter(x=>x.type==='calc').length}）。先自己作答，再點「顯示解答」。</p>`;
  h+=filt.length?filt.map(q=>qcardHTML(q,Q.indexOf(q))).join(''):'<div class="empty">此條件下沒有題目。</div>';
  area.innerHTML=h;
}
function mark(id){state[id]=!state[id];save();renderQuiz();updateProg();}
function toggleFav(id){state[id+'_f']=!state[id+'_f'];save();renderQuiz();}
function updateProg(){
  const total=Q.length;
  const done=Q.filter((q,i)=>state['q'+i]).length;
  document.getElementById('pc').textContent=done;
  document.getElementById('pct').textContent=total;
  document.getElementById('pctxt').textContent=total?Math.round(done/total*100)+'%':'';
  document.getElementById('pcbar').style.width=(total?done/total*100:0)+'%';
}
function renderAll(){renderTOC();renderQuiz();updateProg();}

/* 工具列事件 */
document.getElementById('typeChips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  document.querySelectorAll('#typeChips .chip').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');curType=b.dataset.t;renderQuiz();
});
document.getElementById('search').addEventListener('input',e=>{curQ=e.target.value;renderQuiz();});
document.getElementById('onlyUndone').addEventListener('change',e=>{onlyUndone=e.target.checked;renderQuiz();});
/* 頂部滾動進度 */
window.addEventListener('scroll',()=>{
  const h=document.documentElement;
  const p=h.scrollTop/(h.scrollHeight-h.clientHeight||1)*100;
  document.getElementById('progressbar').style.width=p+'%';
});
renderAll();
</script>
