<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>財務管理實戰 題庫 · 張翔</title>

<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
<style>
:root{
  --paper:#f5efe2; --card:#fffdf6; --ink:#2b2a26; --ink-soft:#55524a;
  --line:#ddd2ba; --accent:#9a3b2e; --accent-soft:#f0e2dc;
  --teal:#2f5d62; --teal-soft:#e2ecec; --gold:#b8860b;
  --sidebar:280px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Noto Serif TC",serif;background:var(--paper);color:var(--ink);line-height:1.8;font-size:16px}
#progressbar{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;z-index:100;transition:width .2s}

/* 標頭 */
header.mast{background:#2b2a26;color:#f5efe2;padding:34px 24px 26px;border-bottom:4px solid var(--accent)}
.mast-inner{max-width:1180px;margin:0 auto}
.mast .kicker{font-family:"Noto Sans TC";font-size:12.5px;letter-spacing:.22em;opacity:.7;text-transform:uppercase}
.mast h1{font-size:28px;font-weight:900;margin:6px 0 4px;letter-spacing:.03em}
.mast .sub{font-family:"Noto Sans TC";font-size:14px;opacity:.78}
.mast .meta{margin-top:10px;font-family:"Noto Sans TC";font-size:12.5px;opacity:.6}

/* 版面 */
.layout{max-width:1180px;margin:0 auto;display:flex;gap:30px;padding:24px 24px 90px}
nav.toc{width:var(--sidebar);flex-shrink:0;position:sticky;top:18px;align-self:flex-start;max-height:calc(100vh - 36px);overflow:auto;font-family:"Noto Sans TC";font-size:13.5px}
nav.toc h4{font-size:11.5px;letter-spacing:.15em;color:var(--ink-soft);margin:14px 0 5px;text-transform:uppercase}
nav.toc a{display:block;color:var(--ink);text-decoration:none;padding:4px 10px;border-left:2px solid transparent;border-radius:0 4px 4px 0;cursor:pointer}
nav.toc a:hover{background:var(--accent-soft)}
nav.toc a.active{background:var(--accent-soft);border-left-color:var(--accent);font-weight:500}
nav.toc a.lvl2{padding-left:22px;font-size:12.5px;color:var(--ink-soft)}
nav.toc .cnt{float:right;font-size:11px;color:var(--ink-soft)}

main{flex:1;min-width:0}

/* 工具列 */
.toolbar{position:sticky;top:0;z-index:20;background:var(--paper);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.toolbar .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:"Noto Sans TC";font-size:12.5px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 13px;cursor:pointer;color:var(--ink-soft)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.tf.on{background:var(--teal);border-color:var(--teal)}
.chip.mc.on{background:var(--accent);border-color:var(--accent)}
.chip.essay.on{background:#6b4f7a;border-color:#6b4f7a}
.chip.calc.on{background:var(--gold);border-color:var(--gold)}
.search{flex:1;min-width:150px;font-family:"Noto Sans TC";font-size:13px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.search:focus{outline:2px solid var(--accent-soft)}

h2.sec{font-size:24px;font-weight:900;margin:8px 0 4px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
h2.sec .en{display:block;font-size:12.5px;font-family:"Noto Sans TC";font-weight:400;color:var(--ink-soft);letter-spacing:.12em;margin-top:3px}
.lead{font-size:14.5px;color:var(--ink-soft);margin:6px 0 16px}

/* 題卡 */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:14px 0;overflow:hidden;transition:border-color .15s}
.qcard.done{border-color:var(--teal)}
.qcard .head{padding:14px 18px 8px;display:flex;align-items:baseline;gap:10px}
.qcard .num{font-family:"Noto Sans TC";font-weight:700;color:var(--accent);flex-shrink:0}
.tag{font-family:"Noto Sans TC";font-size:11px;padding:2px 9px;border-radius:4px;color:#fff;flex-shrink:0}
.tag.tf{background:var(--teal)} .tag.mc{background:var(--accent)} .tag.essay{background:#6b4f7a} .tag.calc{background:var(--gold)}
.src{margin-left:auto;font-family:"Noto Sans TC";font-size:11.5px;color:var(--ink-soft);flex-shrink:0}
.qcard .body{padding:0 18px;font-size:15px}
.qcard .body p{margin:6px 0}
.opts{font-family:"Noto Sans TC";font-size:14px;color:var(--ink-soft);margin:8px 0 4px}
.opts div{padding:3px 0 3px 4px}
.toggle{font-family:"Noto Sans TC";font-size:13px;cursor:pointer;background:var(--ink);color:var(--paper);border:none;padding:9px 18px;width:100%;text-align:left;margin-top:10px}
.toggle:hover{background:#44413a}
.ans{display:none;padding:14px 18px;border-top:1px solid var(--line);font-size:14.5px;background:#fbf7ee}
.ans.show{display:block}
.ans .anskey{color:var(--accent);font-weight:700}
.ans p{margin:6px 0}
.qactions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:0 18px 16px}
.mark{font-family:"Noto Serif TC",serif;font-size:16px;line-height:1;cursor:pointer;border:1.5px solid var(--line);background:#fbf7ee;border-radius:10px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-soft);user-select:none;transition:all .18s ease;box-shadow:0 1px 0 rgba(120,80,40,.06)}
.mark:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(120,80,40,.12)}
.mark:active{transform:translateY(0);box-shadow:0 1px 0 rgba(120,80,40,.06)}
.mark.done{border-color:#c8b89a;color:#9a8a6a}
.mark.done.on{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 3px 10px rgba(47,93,98,.35)}
.mark.fav{border-color:#c8b89a;color:#9a8a6a}
.mark.fav.on{background:var(--gold);color:#fff;border-color:var(--gold);box-shadow:0 3px 10px rgba(180,130,40,.35)}
.empty{padding:40px;text-align:center;color:var(--ink-soft);font-family:"Noto Sans TC"}
.upcoming{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--ink-soft);font-family:"Noto Sans TC";font-size:14px}

.progress-wrap{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:2px solid var(--line);padding:9px 24px;font-family:"Noto Sans TC";font-size:12.5px;z-index:50}
.progress-wrap .bar{height:7px;background:#e5dcc6;border-radius:4px;overflow:hidden;margin-top:5px}
.progress-wrap .bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
footer{max-width:1180px;margin:0 auto;padding:18px 24px;font-family:"Noto Sans TC";font-size:12px;color:var(--ink-soft)}
@media(max-width:860px){
  .layout{flex-direction:column}
  nav.toc{width:100%;position:static;max-height:none}
  .mast h1{font-size:22px}
}
</style>
</head>

{ch:1,type:'mc',src:'高大金融',q:'Which statement concerning a partnership is CORRECT？',opts:['A partnership is designed to protect owners\' personal assets','The profits of a partnership are taxed twice','In a general partnership all partners have limited liability','In a limited partnership all partners run the business with unlimited liability','The advantages and disadvantages of a partnership are similar to those of a proprietorship'],ans:'(E)',exp:'合夥非以保護業主個人財產為目的、無雙重課稅；一般合夥人均負無限責任；有限合夥中至少一人負無限責任。其優劣與獨資大致相同。'},
{ch:1,type:'mc',src:'102 中正財金',q:'Ethical behavior by management is most consistent with the goal of shareholder value maximization through：',opts:['Improved capital structure','Enhanced reputation value','Increased managerial benefits','Higher dividend payments'],ans:'(B)',exp:'符合社會道德與 CSR 的行為看似增加成本，但可提升企業聲譽、增加消費者好感與銷售，長期與極大化股東價值一致。'},
{ch:1,type:'mc',src:'106 成大財金',q:'Which of the following statements is CORRECT？',opts:['In most corporations the CFO ranks above the CEO','By law the chairman of the board must also be the CEO','The board is the highest-ranking body; the CEO works under the board and can be removed by it, but cannot remove the board. One person may hold both CEO and chairman','The CFO generally reports to the controller','The CFO is not responsible for the validity of financial statements'],ans:'(C)',exp:'CFO 位階在 CEO 之下；CEO 與董事長未必要同一人；主計長（controller）是 CFO 的下屬，故財會業務也是 CFO 應負責的項目。'},

/* ---- 重點1 問答 ---- */
{ch:1,type:'essay',src:'淡江財金',q:'What are the alternative forms of business organization？What are their advantages and disadvantages？',ans:'三種主要型態：獨資、合夥、公司。',exp:'<p><b>(1) 獨資 sole proprietorship：</b>一人出資，盈虧自負。<br>優：組織成本低、成立易、管制少、利益獨享、只課綜所稅、權責單純。<br>缺：企業生命有限、不易籌大資金、負無限清償責任、所有權移轉困難。</p><p><b>(2) 合夥 partnership：</b>二人以上合資。<br>優：成本低、成立易、只課綜所稅、可聚集較多人才。<br>缺：生命有限、負無限責任、所有權移轉難、不易籌大資金。</p><p><b>(3) 公司 corporation：</b>依公司法成立的法人，所有權與經營權分離。<br>優：資源多、所有權易轉移、永續存在、股東有限責任、易募大資金。<br>缺：法令限制多、發行成本高、設立程序複雜、存在代理問題。</p>'},
{ch:1,type:'essay',src:'東華財金',q:'朋友在花經營室內高爾夫練習場五年、現為獨資，欲跨區擴張需要增資。(1) 是否建議變更組織型態？應採何種？(2) 相對於獨資的優點？(3) 缺點？(4) 若維持獨資的優缺點？(5) 緩和公司代理衝突的機制？',ans:'建議改採「公司（corporation）」。',exp:'<p>(2) 公司優點：有限責任降低股東風險、所有權易轉換、永續存在、易募大資金。</p><p>(3) 公司缺點：受較嚴格法令規範、設立程序複雜、有代理問題與控制權議題、證券發行成本較高。</p><p>(4) 維持獨資：優點是保有經營主導權、不被其他股東分利或竊取技術、管制少；缺點是資金有限難擴張、企業生命繫於業主、負無限清償責任。</p><p>(5) 緩和代理問題的機制詳見第 2 章（重點 3–5）。</p>'},
{ch:1,type:'essay',src:'普考',q:'許多公司想上市募集資金擴充，對未上市前之股東有利嗎？為何政府一方面鼓勵上市、一方面又嚴格把關上市與監督市場？',ans:'有利有弊；政府把關為解決資訊不對稱。',exp:'<p><b>對原始股東：</b>有利——上市提高能見度與股票流動性、降低原始股東流動性風險，且利於募集資金、降低融資成本、提升公司價值。不利——引入外部資金帶來經營權外流、營運須聽新股東意見，且公開發行須受嚴格資訊揭露規範、增加經營成本。</p><p><b>政府把關：</b>原始股東與投資大眾間存在資訊不對稱（information asymmetry），外部人難知真實營運、內部人有隱瞞資訊的誘因；政府嚴格審核與監督即在防止此弊端。</p>'},
{ch:1,type:'essay',src:'101 台北大金融',q:'公司營運狀況大好時，哪一類資金供給者受益最大？（特別股股東／普通股股東／長期債權人／短期債權人）',ans:'普通股股東。',exp:'<p>債權人與特別股股東握有「優先求償權」，利息與特別股股利相對固定；普通股股東是「剩餘求償權」。公司營運大好時，扣除固定利息、稅與特別股股利後，剩餘全歸普通股股東（普通股股利、保留盈餘），故受益最大。</p><p>普通股股東權利：公司控制權、優先認股權、盈餘分配權、剩餘財產分配權（清算時須先償債與特別股股東）。</p>'},

/* ---- 重點1 計算 ---- */
{ch:1,type:'calc',src:'101 台大財金',q:'A 公司一年後結束營業清算，資產僅有一不動產：景氣好（機率 60%）時價值 110 億，不好（機率 40%）時 80 億。負債只有一年後到期、面額 100 億之貼現債券。無風險中立、無稅與交易成本，年化無風險利率 5%。求：(1) 企業價值；(2) 貼現債券價值；(3) 股東權益價值。',ans:'(1) 93.33 億　(2) 87.62 億　(3) 5.71 億',exp:'<p>(1) 企業價值 V₀ = (110×0.6 + 80×0.4) / (1+5%) = 98 / 1.05 ≈ <b>93.33 億</b>。</p><p>(2) 公司債有違約風險：好景氣時還 100，不好時只還 80。V<sub>bond</sub> = (100×0.6 + 80×0.4) / 1.05 = 92 / 1.05 ≈ <b>87.62 億</b>。</p><p>(3) 股東有限責任、有剩餘求償權：好景氣時股東得 110−100=10，不好時得 0。V<sub>equity</sub> = (10×0.6 + 0×0.4) / 1.05 = 6 / 1.05 ≈ <b>5.71 億</b>。</p><p>觀念：V₀ = V<sub>debt</sub> + V<sub>equity</sub>（93.33 ≈ 87.62 + 5.71）。</p>'},

/* ---- 重點2 公司理財概論 ---- */
{ch:2,type:'tf',src:'政大財管',q:'「公司價值極大化」「股東權益帳面價值極大化」與「股價極大化」三個目標是相通的。',ans:'False',exp:'公司價值=內含價值（FCF 折現）；帳面價值=淨值（股本+資本公積+保留盈餘），二者不同。效率市場下「股價極大化」才≈內含價值極大化。'},
{ch:2,type:'tf',src:'台大財金',q:'財務管理主要目的在追求企業收入、稅後淨利及 EPS 極大化。',ans:'False',exp:'主要目的應在追求「目前每股股價」極大化；收入、淨利、EPS 極大化皆非適當目標。'},
{ch:2,type:'mc',src:'成大財金',q:'The primary goal of financial management is to',opts:['maximize current dividends per share','maximize current value per share of existing stock','avoid financial distress','minimize operational costs','maintain steady growth in sales'],ans:'(B)',exp:'財管主要目的＝極大現有股東目前每股價值（股價）。'},
{ch:2,type:'mc',src:'中央財金',q:'Shareholders\' wealth maximization is better than profit maximization because it',opts:['increases future cash flows without risk','is not better','considers both time value of money and risk','keeps the firm from going bankrupt'],ans:'(C)',exp:'股東財富極大化考量了貨幣時間價值與現金流量的風險；利潤極大化未考慮這兩者。'},
{ch:2,type:'mc',src:'東吳國貿',q:'The primary emphasis of the financial manager is the use of',opts:['accrued earnings','cash flow','organization charts','profit incentives'],ans:'(B)',exp:'因貨幣有時間價值，財務決策應注重現金流量的大小與時點。'},
{ch:2,type:'mc',src:'東華財金',q:'Managers should be concerned with cash flows rather than profits because cash flows recognize',opts:['more revenue than profits','the risk of and when cash flows occur','the risk and size of profit','less variability than accounting profit'],ans:'(B)',exp:'企業價值取決於現金流折現，折現同時考慮時間點（貨幣時間價值）與風險（風險調整折現率）。'},
{ch:2,type:'mc',src:'105 政大財管',q:'Which best represents the objective of a publicly listed company？',opts:['Maximize earnings','Maximize market shares','Maximize stock price','Maximize shares outstanding'],ans:'(C)',exp:'上市櫃公司目標＝極大化股價。'},
{ch:2,type:'mc',src:'107 清大計財',q:'Which regarding cost-benefit analysis is NOT correct？',opts:['第一步是辨認成本與效益','無競爭市場時，可用單向（one-sided）價格決定確切現金價值','競爭價格讓我們不必考慮決策者偏好就能算價值','多數商品與金融資產有競爭市場'],ans:'(B)',exp:'單向（片面）價格只能以此價買入、無法以此賣出，不能用來算準確現金價值。'},
{ch:2,type:'mc',src:'107 清大計財',q:'麥當勞：大麥克 $2.68、大杯可樂 $1.45、大薯 $1.13；滿餐（三者組合）售 $4.59。有無套利機會？',opts:['有：買滿餐再拆售三樣，賺 $0.67','無套利機會','有：買三樣再賣滿餐，賺 $1.34','有：買三樣再賣滿餐，賺 $0.67'],ans:'(A)',exp:'單買三樣 $2.68+1.45+1.13=$5.26 > 滿餐 $4.59，故「買滿餐、拆賣三樣」套利，利潤 $5.26−$4.59=$0.67。'},
{ch:2,type:'mc',src:'107 中正財金',q:'Which is false？',opts:['負債、權益等有價證券的相對比例構成資本結構','最常見是全權益或負債+權益融資','專案 NPV 代表新投資者因該專案創造的價值','公司對外籌資時須選擇發行哪種證券'],ans:'(C)',exp:'專案 NPV 由全體股東（原股東＋新加入股東）共享，非僅新投資者。'},
{ch:2,type:'mc',src:'107 中央財金',q:'下列哪個陳述正確？',opts:['財管終極目標是極大化市場占有率','流動性管理在最佳化長期資產','資本預算（如 NPV）用於評估投資決策','債權人承擔資訊不對稱的最終成本'],ans:'(C)',exp:'(A)目標為公司價值極大化；(B)流動性管理是短期資產管理；(D)股東承擔資訊不對稱最終成本。'},
{ch:2,type:'essay',src:'淡江財金',q:'(1) 財務管理追求的目標是什麼？(2) 為何追求利潤極大化是錯誤目標？',ans:'(1) 公司價值極大化＝股東財富極大化＝效率市場下股價極大化。',exp:'<p>(1) 由 V=D+E，負債求償權固定下，公司價值極大化＝股東財富極大化；效率市場下＝股價極大化。</p><p>(2) 利潤極大化之誤：①可窗飾（window dressing），如刪減投資短期增利但傷及未來股價；②未考慮貨幣時間價值；③未考量風險（風險↑→折現率↑→公司價值↓）。</p>'},
{ch:2,type:'essay',src:'中央財金',q:'「只要 EPS 上升，公司價值就上升。」請評論。（Comment）',ans:'不必然。',exp:'<p>EPS 依應計基礎（accrual）計算，與真實現金流不同；公司價值由未來 FCF 以 WACC 折現決定。EPS 升若伴隨更高風險（要求報酬 ka↑），價值未必升。EPS 也可由減少流通股數而人為灌水；又 ROE<k 時，高 EPS 股反而股價可能更低（NPVGO<0）。</p>'},
{ch:2,type:'essay',src:'RWJJ 習題',q:'極大化股價的目標會與企業倫理、顧客員工安全、環境、社會公益衝突嗎？',ans:'長期不衝突。',exp:'<p>提升員工安全、產品品質、環保公益短期增成本，但長期建立聲譽（reputation）與消費者信心，反而提升股價。不道德/違法拉抬股價僅能短期欺瞞，長期必傷股價。正確目標是「股價基本價值（內含價值）」極大化，市價短期會偏離、長期回歸。</p>'},

/* ---- 重點3 權益代理問題 ---- */
{ch:3,type:'tf',src:'100 清大財金',q:'The problem of asymmetric information occurs when investors know more about the firm than the managers do.',ans:'False',exp:'訊息不對稱是經理人（內部人 insider）比外部投資人（outsider）知道更多。'},
{ch:3,type:'mc',src:'中山財管',q:'何者最符合代理問題的精髓？',opts:['管理者以個人私利取捨，只要不觸法便無可規範','財務管理人最適目標是極大化預期現金流量','股東與經理人間有代理問題，股東與債權人間也同樣存在','以上皆非'],ans:'(C)',exp:'股東-經理人（權益代理）與股東-債權人（負債代理）皆有代理問題。'},
{ch:3,type:'mc',src:'中原國貿',q:'Which situation is most apt to create an agency problem？',opts:['員工因卓越貢獻加薪','加班完成專案給雙倍薪','部門一年無事故給經理人獎金','經理人因去年雇用最多新人而領紅利'],ans:'(D)',exp:'單純因「雇用最多員工」給紅利，經理人可能雇用不合宜員工、無法創造價值，造成代理問題。'},
{ch:3,type:'mc',src:'東吳國貿',q:'The conflict between owners and non-owner managers is',opts:['the agency problem','incompatibility','serious only when profits decline','little importance in large U.S. firms'],ans:'(A)',exp:'所有人與非所有人經理人目標衝突＝代理問題。'},
{ch:3,type:'mc',src:'中央財金',q:'Managers are encouraged to act in shareholders\' interests by',opts:['股東選出董事會再選任經理人','被他公司接管的威脅','薪資與公司績效連結的酬勞契約','以上皆是'],ans:'(E)',exp:'解權益代理：解僱威脅、接管威脅、薪資報償制度，皆有效。'},
{ch:3,type:'mc',src:'中正財金',q:'何者讓股東與管理者的潛在代理問題較嚴重？',opts:['董事會有相當比例外部獨立董事','持股分散、小股東眾多','持股集中、大股東持股近九成','完善的公司治理制度'],ans:'(B)',exp:'持股分散時，較少持股即可取得經營權，經營者與多數小股東利益衝突更嚴重（搭便車）。'},
{ch:3,type:'mc',src:'成大財金',q:'Which help convince managers to work for stockholders？I. 股價連結的酬勞；II. 員工認股選擇權；III. 被接管威脅；IV. 委託書戰爭威脅',opts:['I、II only','III、IV only','I、II、III only','I、III、IV only','I、II、III、IV'],ans:'(E)',exp:'四者皆是：酬勞制度、ESO、接管威脅、委託書戰爭（proxy fight）都能誘使經理人為股東服務。'},
{ch:3,type:'mc',src:'銘傳財金',q:'(a) 經理人用垃圾債與貸款買下公司、槓桿極高；(b) 外部人徵求股東在年會投票同意。各稱為？',opts:['(a) LBO；(b) 公開收購 tender offer','(a) 毒藥丸；(b) 委託書戰爭','(a) 綠郵 greenmail；(b) 經理人認股權','(a) LBO；(b) 委託書戰爭 proxy fight'],ans:'(D)',exp:'高舉債買下公司＝融資買下（LBO/MBO）；外部股東徵求委託席次撤換經營階層＝委託書戰爭。'},
{ch:3,type:'mc',src:'100 政大財管',q:'An agency problem can be alleviated by',opts:['要求所有組織都是獨資','讓經理人利益與股東利益一致的酬勞設計','要求經理人承擔超過其偏好的風險','(A)(B)'],ans:'(B)',exp:'好的激勵契約讓經理人在追求自身利益時同時成就股東財富。（完全消除靠獨資，但不實際）'},
{ch:3,type:'mc',src:'100 政大財管',q:'小股東認為經營階層未追求價值極大化，最適反應是？',opts:['參加年會投票反對','提出議案表決','發起委託書戰爭撤換經營階層','賣掉持股'],ans:'(D)',exp:'小股東持股太少、無力影響決策，最理性反應是「用腳投票」賣出持股。'},
{ch:3,type:'mc',src:'100 師大管研',q:'以每季獲利成長給財務誘因的酬勞計畫，可能造成代理問題，因為',opts:['經理人不受私利驅使','董事會居功','短期而非長期利潤成為焦點','投資人要求穩定利潤'],ans:'(C)',exp:'以「每季」獲利為誘因，經理人會短視近利、做出犧牲長期的決策。'},
{ch:3,type:'mc',src:'101 台大財金',q:'何者為解決企業代理問題之道？',opts:['不計代價消弭一切經理人私利行為','設計鼓勵與監督制度應考量成本效益','為消弭私利，高階主管應由大股東親自擔任','因無法完全消弭，公司不該花任何成本遏止'],ans:'(B)',exp:'監督與激勵應衡平成本效益，以免傷及股東價值；大股東未必有管理專才；適度監控仍值得做。'},
{ch:3,type:'mc',src:'103 政大財管',q:'所有權與經營權分離下，代理成本由高至低排序：I.獨資；II.公司；III.一般合夥',opts:['I,II,III','II,I,III','III,II,I','II,III,I'],ans:'(D)',exp:'公司所有權經營權最分離→代理成本最高；獨資不分離→最低；一般合夥居中（仍可能傷及其他合夥人）。'},
{ch:3,type:'mc',src:'105 交大財金',q:'The free cash flow hypothesis states',opts:['FCF 多的公司應多發股利以降低財務危機風險','FCF 多的公司應發新股逼經理人認真工作','發債須按期還本付息，減少經理人浪費資源的空間','以上皆是'],ans:'(C)',exp:'Jensen：發債需固定付息，壓縮自由現金流量，減少經理人亂投資/特權消費的空間，降低權益代理成本。'},
{ch:3,type:'mc',src:'106 台大財金',q:'給經理人 ESO 時，履約價通常訂為？',opts:['給予日當天的股價','給予日一年後預期股價','到期日預期股價','經理人受雇日股價'],ans:'(A)',exp:'ESO 履約價一般訂為「授予日當天」的股價（backdating 即把履約價偷偷訂在更早更低的股價，已遭沙賓法案禁止）。'},
{ch:3,type:'mc',src:'106 中正財金',q:'Which motivates managers to act in shareholders\' interest？',opts:['債券限制條款','被接管威脅','董事會施壓','(B)(C)'],ans:'(D)',exp:'接管威脅與解雇威脅緩解權益代理；債券條款是緩解負債代理。'},
{ch:3,type:'mc',src:'107 中央財金',q:'皇統科技案：董事會股票質押比 40%、董事長 43.83%。股票質押指的是＿於銀行貸款時以＿持股作為抵押。',opts:['公司，董事個人','董事，董事個人','董事，公司','公司，公司'],ans:'(B)',exp:'董事質押＝董事以「自己持有」的股權為標的、為自己的債務設質押（非公司持股）。'},
{ch:3,type:'mc',src:'107 中山財管',q:'下列何者「不屬於」資本預算相關的代理問題？I. 減少努力；II. 特權消費；III. 打造帝國；IV. 鞏固職位的投資；V. 規避風險',opts:['I、II only','I、II、IV only','I、II、III、IV only','I、II、III、IV、V'],ans:'(A)',exp:'工作怠惰、特權消費是「日常」代理問題，與特定資本預算案無直接關聯；後三者（打造帝國、鞏固職位投資、規避風險）才是投資決策上的扭曲。'},
{ch:3,type:'essay',src:'政大財管',q:'(1) 何謂股東與經理人間的代理問題？有哪些型態？(2) 政府與財務面如何解決？',ans:'型態：怠惰、特權消費、MBO、過度投資、次佳投資；對策：酬勞/解雇/接管/勞動市場/降 FCF。',exp:'<p>(1) 型態：①工作怠惰 shirking；②特權消費 perquisites；③管理買下 MBO（打壓股價圖利）；④過度投資 empire building；⑤次佳投資（為保工作放棄高風險高報酬案）。</p><p>(2) 對策：酬勞制度（ESO、紅利、績效配股）、解雇威脅、接管威脅、外部經理人勞動市場、降低 FCF（多舉債、多發股利/庫藏股）。政府可透過稅法獎勵、降低併購門檻協助。</p>'},
{ch:3,type:'essay',src:'政大金融',q:'以代理問題觀點，解釋為何經理人偏好的舉債水準低於最適水準。',ans:'舉債少→每期利息壓力小、留存更多 FCF 供經理人自由運用。',exp:'<p>經理人少舉債，每期固定利息支出少、償債壓力輕，且留下更多自由現金流量供其掌控資源；同時降低公司倒閉、自己丟飯碗的風險。故其偏好槓桿低於股東最適水準。</p>'},
{ch:3,type:'essay',src:'台北大金融',q:'解釋：(1) 逆選擇 adverse selection；(2) 道德危險 moral hazard；(3) 員工認股選擇權 ESO；(4) 代理問題。',ans:'契約前隱藏資訊 vs 契約後隱藏行動。',exp:'<p>(1) 逆選擇（Akerlof 1970）：契約「發生前」，資訊優勢方握有隱藏資訊，導致市場充斥劣品、良品無法交易。</p><p>(2) 道德危險：契約「簽訂後」，資訊優勢方採取對方無法觀察的隱藏行動，損及對方。</p><p>(3) ESO：員工可於特定期間以特定價格買進股票的權利；股價上漲享資本利得、下跌可不行使，使員工利益與公司績效連動。</p><p>(4) 代理問題：主理人與代理人目標不一致、在資訊不對稱下無法完全監控，代理人因而做出損及主理人的行為。</p>'},

/* ---- 重點4 負債代理問題 ---- */
{ch:4,type:'mc',src:'元智財企',q:'（單複選）何者可能是代理問題？(A) 交際費浮濫；(B) 高級套房豪華裝修；(C) 過度投資於特定（為鞏固職位/安全）計畫；(D) 高階誘因酬勞契約；(E) 資產替代。',ans:'(A)(B)(C)(E)',exp:'(D) 誘因契約是解決代理問題的機制本身、非問題本身。(A)(B) 特權消費、(C) 過度/鞏固職位投資、(E) 資產替代皆屬代理問題。'},
{ch:4,type:'mc',src:'銘傳財金',q:'銘傳公司淨值 5000 萬、負債 5000 萬、年利率 20%。A 案：好 8000/壞 14000；B 案：好 2000/壞 20000（好壞機率各 0.5）。股東極大化下選哪案？債權人期望報酬率？',opts:['投資 B，報酬率 20%','投資 B，報酬率 −20%','投資 A，報酬率 15%','投資 A，報酬率 −15%'],ans:'(B)',exp:'一年後應還本息 5000×1.2=6000。股東：A 案 E=(2000+8000)/2=5000；B 案 E=(0+14000)/2=7000→選 B。債權人：B 案 E(V)=(2000+6000)/2=4000，報酬率=(4000−5000)/5000=−20%。'},
{ch:4,type:'mc',src:'高大金融/清大計財',q:'Which is most correct？',opts:['公司比獨資稅負有利','公司股東負無限責任','大公司因規大而管制較少','降低被接管威脅會提高經理人為股東服務的意願','債券限制條款旨在降低股東與債權人潛在衝突'],ans:'(E)',exp:'債券條款（covenants）用來降低負債代理問題。其餘：公司有雙重課稅、股東有限責任、大公司管制更多、降低接管威脅反而使經理人更不顧股東。'},
{ch:4,type:'mc',src:'成大/中正財金',q:'高槓桿公司的股東可能願意接受 NPV 為負的計畫，若',opts:['提高公司資產報酬的標準差','降低資產報酬變異數','降低公司風險','使現金流多樣化','降低違約風險'],ans:'(A)',exp:'資產替代（asset substitution）：股東視股權為買權，提高資產波動度雖 NPV<0 仍可使股權價值上升，由債權人承擔下行風險。'},
{ch:4,type:'mc',src:'101 中正財金',q:'＿問題使新 NPV>0 計畫難以融資，因新增利益歸舊債權人而非出資的股東。',opts:['agency cost','financial slack','asset substitution','debt overhang'],ans:'(D)',exp:'債務積壓（debt overhang）：新投資增加的價值只夠償債、股東分不到，故放棄 NPV>0 計畫。'},
{ch:4,type:'mc',src:'101 中山財管',q:'何種情況下「極大化公司價值」≠「極大化股東財富」？',opts:['發行新債影響舊債價值','發債提高倒閉機率','公司首次發債','改變資本結構時股權 β 改變'],ans:'(A)',exp:'新債提高財務風險、稀釋舊債權（claim dilution），傷及舊債價值；公司價值一增一減未必提升，故不等於股東財富極大化。'},
{ch:4,type:'mc',src:'102 中正財金',q:'Which is incorrect about covenants？',opts:['加入更多條款會提高借款成本','一旦發債，股東有誘因以舉債人利益換取多發股利','條款可限制再舉債水準與最低營運資金','若條款降低負 NPV 行為，其減省的借款成本可超過彈性損失'],ans:'(A)',exp:'加入更多限制條款可降低債權人疑慮，反而「壓低」借款成本，不是提高。'},
{ch:4,type:'mc',src:'108 交大/中正財金',q:'破產間接成本之一是經理人愛冒大風險。此策略下：',opts:['公司會選使公司期望價值最大的案','債權人選高風險案將價值移轉給股東','股東選高風險案將債權人價值移轉給自己','公司永遠選低風險案'],ans:'(C)',exp:'股東選擇高風險計畫，成功獨享高報酬、失敗由債權人與股東共同承擔，此即資產替代、將債權人價值移轉給股東。'},
{ch:4,type:'calc',src:'中原國貿',q:'Alice 公司一年後清算，須付債權人 $500。低波動案：壞 $500/好 $700；高波動案：壞 $100/好 $800（好壞各 0.5）。(1) 兩案下公司期望價值？(2) 兩案下股東期望價值？(3) 股東偏好哪案？(4) 若債權人加契約：選高波動案時須多付 Y，求使股東兩案無異的 Y。',ans:'(1) 低 600、高 450；(2) 低 100、高 150；(3) 高波動；(4) Y=600',exp:'<p>(1) 低：(500+700)/2=600；高：(100+800)/2=450 → 低波動極大化公司價值。</p><p>(2) 股東對 $500 求償權以上有剩餘：低案 E=(0+200)/2=100；高案 E=(0+300)/2=150。</p><p>(3) 股東選高波動案（股東期望 150>100），此為資產替代。</p><p>(4) 高波動案須付 Y，好時股東得 800−Y：令 100=(800−Y)/2 → Y=600。</p>'},
{ch:4,type:'essay',src:'中山財管',q:'說明股東-經理人、債權人-股東兩種代理問題，並各提解決方法。',ans:'權益代理 vs 負債代理。',exp:'<p><b>權益代理（股東-經理人）：</b>怠惰、特權消費、過度投資、次佳投資。解法：酬勞連結績效（ESO）、解雇/接管威脅、降低 FCF（多舉債、多發股利）。</p><p><b>負債代理（股東-債權人）：</b>①資產替代（投資高風險案）；②投資不足/debt overhang（NPV>0 但利益只夠還債，股東拒絕）；③榨取資產（舉債發股利）；④債權稀釋（發同順位新債）。解法：限制條款、提高借款利率、發可轉債/附認股權公司債。</p>'},

/* ---- 重點5 代理成本與公司治理 ---- */
{ch:5,type:'mc',src:'台大財金',q:'有關代理成本，何者為誤？',opts:['股東-經理人間權益代理成本可藉發給認股權降低','股東-債權人間債權代理成本與舉債比率呈反向關係','一邊發股利一邊發新股，可藉承銷監督經理人並降低代理成本','管理人力市場運作也能降低代理問題'],ans:'(B)',exp:'債權代理成本與舉債比率應呈「正向」關係（舉債越多、負債代理越嚴重），非反向。'},
{ch:5,type:'mc',src:'102 台大財金',q:'有關代理成本，何者為誤？',opts:['為減少代理成本，管理階層最好由大股東親自擔任','與經理人簽黃金降落傘可減少其抗拒併購的代理成本','一邊發股利一邊發新股可藉承銷監督經理人','自由現金流量假說：以股利減少經理人錯誤投資的代理成本'],ans:'(B)',exp:'依經理人鞏固假說，黃金降落傘等反併購條款會降低經理人被取代的威脅，反而使代理問題更嚴重。'},
{ch:5,type:'mc',src:'東吳國貿',q:'何者可歸類為企業的「代理成本」？(A) 監督稽核重大投資的費用；(B) 設計合宜組織架構的費用；(C) 因架構限制而無法及時反應市場的機會成本；(D) 總經理固定薪外的認股權。',opts:['(A)(B)','(A)(B)(C)','(C)(D)','以上皆是'],ans:'(D)',exp:'(A)(B) 監控成本、(C) 機會成本（剩餘損失）、(D) 報償機制成本，皆屬代理成本。'},
{ch:5,type:'mc',src:'清大計財',q:'Although dividends reduce funds available to pay bondholders, they can reduce agency costs by',opts:['定期發放','與債權人共享股利','降低自由現金流以減少特權消費','確定只有登記股東領股利'],ans:'(C)',exp:'多發股利降低 FCF，避免經理人拿閒置資金從事特權消費，降低權益代理成本。'},
{ch:5,type:'mc',src:'成大財金',q:'Agency costs refer to',opts:['一輩子發給股東的股利總額','違約與破產的成本','被雙重課稅的所得','股東與管理階層利益衝突所生的成本','付給債權人的利息總額'],ans:'(D)',exp:'代理成本＝為解決股東與管理階層（或關係人間）利益衝突所生的直接＋間接成本。'},
{ch:5,type:'mc',src:'朝陽財金',q:'Jensen & Meckling 的代理成本不含下列何者？',opts:['主理人的監督支出','代理人的保證（ bonding ）支出','剩餘損失','風險溢酬'],ans:'(D)',exp:'J&M 代理成本＝監督成本＋保證成本＋剩餘損失；風險溢酬不是。'},
{ch:5,type:'mc',src:'政大/成大財金',q:'何者為代理成本？I. 放棄會增加股東權益市值的投資機會；II. 對現有股東發股利；III. 購買提高每股價值的新設備；IV. 聘外部查帳員驗證財報',opts:['II、III','I、III','I、IV','II、IV','I、II、IV'],ans:'(C)',exp:'I 經理人為保工作放棄 NPV>0 案（間接代理成本）；IV 外部審計是直接監督成本。II、III 為正常財務行為。'},
{ch:5,type:'mc',src:'中正財金',q:'Shareholder agency costs include',opts:['監督管理行動的支出','經理人薪資','管理限制所生的機會成本','(A)(C)','以上皆是'],ans:'(D)',exp:'監督支出與機會成本皆屬；一般薪資（非績效紅利）不算代理成本。'},
{ch:5,type:'mc',src:'政大金融',q:'關於代理成本，何者正確？I. 經理人為降低公司風險而放棄股東希望的投資，為間接成本；II. 經理人擔心飯碗仍採有利股價的風險投資，為間接成本；III. 經理人購買業主認為必要的資產，為直接成本；IV. 股東花錢監督經理人，為直接成本',opts:['I only','I、IV','IV only','I、III'],ans:'(B)',exp:'I（次佳投資）與 IV（主理人監督）正確；II、III 是經理人為股東利益的正常作為，無代理成本。'},
{ch:5,type:'mc',src:'政大金融',q:'Corporate securities are contingent claims because',opts:['不直接對公司求償','公司可能被收購','其價值導自公司總價值','帳面價值可能為負'],ans:'(C)',exp:'股票與債券都是或有求償權（contingent claims），價值取決於公司總價值。'},
{ch:5,type:'mc',src:'中正/清大/成大財金',q:'股東採取大風險、過度發股利等自利策略，會導致',opts:['債權人不聞不問','正的代理成本：債權人加諸各種限制與契約，損及公司價值','投資同風險等級計畫','從事規模擴張計畫','代理成本下降'],ans:'(B)',exp:'股東自利→債權人提高監督與限制條款、提高利率→代理成本上升、公司價值受損。'},
{ch:5,type:'mc',src:'100 中正財金',q:'A risk-averse manager would',opts:['採極大股東財富的案','持續接受高於公司風險等級的案','持續接受遠低於公司期望風險的案','只接高風險案'],ans:'(C)',exp:'風險趨避的經理人為保工作，傾向低風險、低報酬的次佳投資決策。'},

{ch:9,type:'calc',src:'朝陽財金',q:'$100 存款、名目年利率 12%，求 5 年後終值：(1) 年複利；(2) 半年；(3) 季；(4) 月；(5) 日；(6) 連續複利。',ans:'(1)176.23 (2)179.08 (3)180.61 (4)181.67 (5)182.19 (6)182.21',exp:'<p>(1) 100×1.12^5=176.23</p><p>(2) 100×(1.06)^10=179.08</p><p>(3) 100×(1.03)^20=180.61</p><p>(4) 100×(1+0.12/12)^60=181.67</p><p>(5) 100×(1+0.12/365)^1825≈182.19</p><p>(6) 100×e^(0.12×5)=182.21</p><p>口訣：複利愈頻繁，FV 愈高；連續複利為上限。</p>'},
{ch:9,type:'calc',src:'淡江財金',q:'汽車現金售價 36 萬，分 30 個月月底等額支付 13,949.33 元。求牌告年利率 APR 與實際年利率 EAR。',ans:'APR=12%；EAR=12.68%',exp:'<p>360,000=13,949.33×PVIFA(r,30)，解出月利率 r=1%。</p><p>APR=1%×12=12%；EAR=(1+1%)^12−1=12.6825%。</p>'},
{ch:9,type:'calc',src:'政大金融',q:'信用卡 APR 18%（月利率 1.5%），求有效年利率。',ans:'19.56%',exp:'EAR=(1+1.5%)^12−1=19.5618%。'},

{ch:9,type:'calc',src:'104 政大財管',q:'學貸（利息不可抵扣）EAR 5.5%；房貸（利息可抵扣）APR 6% 月複利，稅率 15%。應選哪一筆？',ans:'選房貸（稅後 EAR 5.24% < 5.5%）',exp:'<p>房貸稅前 EAR=(1+6%/12)^12−1=6.168%。</p><p>稅後 EAR=6.168%×(1−15%)=5.243% < 學貸 5.5%，故選房貸。</p>'},
{ch:9,type:'calc',src:'105 台大財金',q:'五家銀行：(1)9% 年複利；(2)9% 月複利；(3)8.8% 日複利；(4)8.8% 季複利；(5)9% 季複利。應選哪家？',ans:'Bank 2（9% 月複利，EAR 9.38%）',exp:'<p>(1)9.00%；(2)(1+9%/12)^12−1=9.38%；(3)(1+8.8%/365)^365−1=9.20%；(4)(1+8.8%/4)^4−1=9.09%；(5)(1+9%/4)^4−1=9.31%。</p><p>Bank 2 的 EAR 最高。</p>'},
{ch:9,type:'calc',src:'107 台大財金',q:'$10,000 存 CD 五年，報價 4.5%：(1) 若為 EAR，五年後本利和？(2) 若為月複利 APR，五年後？',ans:'(1) $12,461.82；(2) $12,517.96',exp:'<p>(1) FV=10,000×1.045^5=12,461.82。</p><p>(2) FV=10,000×(1+4.5%/12)^60=12,517.96。</p>'},
{ch:9,type:'calc',src:'108 台大財金',q:'每兩年收 $3,500、共 20 年（10 次），第一次在兩年後，折現率 6%，現值？',ans:'$19,487.73',exp:'<p>有效兩年折現率=(1.06)²−1=12.36%。</p><p>PV=3,500×PVIFA(12.36%,10)=19,487.73。</p>'},

{ch:10,type:'essay',src:'政大金融',q:'名詞解釋：(1) Maturity premium；(2) Liquidity premium；(3) LIBOR；(4) YTM；(5) Country risk；(6) TIPS。',ans:'六個利率風險溢酬與市場名詞。',exp:'<p><b>(1) 到期風險溢酬：</b>到期期間越長，債券價格受利率波動影響越大，投資人要求的補償。</p><p><b>(2) 流動性溢酬：</b>資產愈難迅速以接近內含價值變現，投資人要求的補償。</p><p><b>(3) LIBOR：</b>倫敦銀行同業拆款利率，國際浮動利率常用基準。</p><p><b>(4) YTM：</b>買入持有至到期的年均報酬率，假設票息以同樣 YTM 再投資。</p><p><b>(5) 國家風險：</b>因政治經濟事件（戰亂、政變等）使該國投資風險上升。</p><p><b>(6) TIPS：</b>抗通膨國庫券，面額隨 CPI 調整，票息與償還金額隨通膨增加，鎖定實質殖利率。</p>'},
{ch:10,type:'calc',src:'中央財金',q:'兩年期年利率 12%、一年期 11%，求一年後的一年期遠期利率。',ans:'13.01%',exp:'<p>(1.12)²=(1.11)(1+f₁,₂)</p><p>f₁,₂=(1.12)²/1.11−1=13.01%。</p>'},
{ch:10,type:'calc',src:'中央財金',q:'承上題，兩年期債券流動性溢酬 0.4%，重新估計遠期利率。',ans:'13.82%',exp:'<p>含流動性溢酬：(1+12.4%)²=(1.11)(1+f₁,₂)</p><p>f₁,₂=(1.124)²/1.11−1=13.82%。</p>'},
{ch:10,type:'calc',src:'中央財金',q:'三年期利率 12%、兩年期 9%，求兩年後的一年期遠期利率。',ans:'18.25%',exp:'<p>(1.12)³=(1.09)²(1+f₂,₃)</p><p>f₂,₃=(1.12)³/(1.09)²−1=18.25%。</p>'},
{ch:10,type:'calc',src:'105 政大金融',q:'Mary 一年前以 98.50 買入 6.5% 票息債，最近以 99.25 賣出，計算報酬率 7.4%。今年物價指數 118.5、去年 115.9，求實質報酬率。',ans:'5.04%',exp:'<p>名目報酬 7.4%，通膨=118.5/115.9−1=2.24%。</p><p>實質報酬=(1.074)/(1+2.24%)−1=5.04%。</p>'},

{ch:11,type:'mc',src:'104 中山財管',q:'（單複選）何者正確？(A) YTM>票面利率則市價<面額；(B) YTM<票面利率則市價>面額；(C) 正斜率 YC 隱含愈久預期通膨愈低；(D) 偏好習慣理論認為水平 YC 隱含未來短天期利率不變；(E) 市場分割理論認為長期利率由長期供需決定。',opts:['(A)(B)','(A)(B)(E)','(A)(C)(D)','(B)(D)(E)','(A)(B)(C)(E)'],ans:'(B)',exp:'(C) 正斜率隱含預期通膨愈高；(D) 非偏好習慣理論標準敘述。'},
{ch:11,type:'mc',src:'106 成大財金',q:'何者為真？',opts:['負斜率 YC 與預期理論不一致','YC 形狀只取決於未來通膨預期','純預期理論下負斜率 YC 隱含未來利率下降','正斜率 YC 必隱含期限風險溢酬為正且通膨為零','YC 只能上升或下降，不能先升後降'],ans:'(C)',exp:'純預期理論：負斜率＝市場預期未來利率走低。'},
{ch:11,type:'mc',src:'107 中正財金',q:'何者會提高經濟體利率水準？',opts:['家戶儲蓄占所得比例提高','廠商擴張計畫增加、資金需求上升','預期通膨下降','以上皆非'],ans:'(B)',exp:'資金需求增加→可貸資金需求右移→利率上升。'},
{ch:11,type:'essay',src:'100 高大金融',q:'解釋利率期限結構的主要理論。',ans:'四大理論：純預期、流動性偏好、偏好習慣、市場區隔。',exp:'<p><b>(1) 純粹預期理論：</b>長期利率＝目前及未來短期利率的幾何平均；投資人風險中立，YC 形狀反映未來利率/通膨預期。</p><p><b>(2) 流動性偏好理論：</b>長期利率＝短期利率幾何平均＋流動性（期限）溢酬；長債利率風險高，投資人要求補償，故 YC 通常正斜率。</p><p><b>(3) 偏好習慣理論：</b>長期利率＝預期＋偏好改變的溢酬；投資人有習慣期限，除非其他期限提供足夠溢酬才會移動。</p><p><b>(4) 市場區隔理論：</b>長短期債券市場完全區隔，各自供需決定各自利率；長短期利率不可替代。</p>'},
{ch:11,type:'calc',src:'高第一風管',q:'3 年期零息公債價格 $816.2979、2 年期 $881.6593。預期理論下，市場預期第 3 年初的 1 年期零息債價格為何？',ans:'$925.87',exp:'<p>r₀,₃=(1000/816.2979)^(1/3)−1=7%；r₀,₂=(1000/881.6593)^(1/2)−1=6.5%。</p><p>(1.07)³=(1.065)²(1+f₂,₃) → f₂,₃=8.01%。</p><p>第 3 年初 1 年期零息債價格=1000/1.0801=$925.87。</p>'},
{ch:11,type:'calc',src:'102 政大金融',q:'純預期理論下，已知 YTM：1 年 6%、2 年 5.5%、3 年 5.07%、4 年 6%。求各期 short rate。',ans:'r₁=6%；r₂=5%；r₃=4.22%；r₄=8.84%',exp:'<p>r₁=6%。</p><p>(1.055)²=(1.06)(1+r₂) → r₂=5.00%。</p><p>(1.0507)³=(1.055)²(1+r₃) → r₃=4.22%。</p><p>(1.06)⁴=(1.0507)³(1+r₄) → r₄=8.84%。</p>'},

{ch:12,type:'calc',src:'東華財金',q:'Kenney：2001 銷售 $7,000M、營業成本 $3,000M、利息 $200M、稅率 40%。2002 銷售+10%、成本隨銷售同比例、利息不變、配 50% 股利。2002 保留盈餘增加數？',ans:'$1,260M',exp:'<p>2002：銷售=7,700；營業成本=3,300；EBIT=4,400；利息=200；EBT=4,200；稅=1,680；NI=2,520。</p><p>保留盈餘增加=2,520×(1−50%)=$1,260M。</p>'},

{ch:13,type:'mc',src:'高大金管',q:'流向股東的現金流定義為？',opts:['利息−淨舉債','流動負債−股東權益','固定資產−長期負債','股利−淨新股發行','流動資產−流動負債'],ans:'(D)',exp:'流向股東=股利−淨新股發行（含庫藏股買回）。'},
{ch:13,type:'mc',src:'101 中正財金',q:'OCF $950,000、折舊 $100,000、NWC 增加 $80,000、淨固定資產增加 $600,000。FCF？',opts:['$150,000','$260,000','$170,000','$270,000'],ans:'(C)',exp:'FCF=OCF−(淨固定資產增加+折舊)−ΔNWC=950,000−(600,000+100,000)−80,000=170,000。'},
{ch:13,type:'mc',src:'102 台大財金',q:'有關現金流量分析，何者有誤？',opts:['現金流量代表流動性','充足現金流可抵禦經濟波動','不論理由，現金總額增加即代表改善','高負債企業現金流比盈餘更能象徵償債能力','股價與 FCF 的關係比會計盈餘更密切'],ans:'(C)',exp:'若現金增加來自賣資產或舉債增資，未必代表本業改善。'},
{ch:13,type:'mc',src:'102 中正財金',q:'Alpha 預期明年淨利 $24M、FCF $27M、邊際稅率 40%。EBIT？',opts:['$43M','$40M','$45M','$60M'],ans:'(A)',exp:'FCF=NI+利息(1−t)（無投資與 NWC 變動假設）；27=24+I×0.6→I=5；NI=(EBIT−I)(1−t)→24=(EBIT−5)×0.6→EBIT=43。'},
{ch:13,type:'mc',src:'107 政大財管',q:'公司淨利為正，OCF？',opts:['忽略折舊與稅','不受折舊影響','稅率下降時上升','等於淨利減折舊'],ans:'(C)',exp:'OCF=EBIT(1−t)+折舊；稅率下降→(1−t)↑→OCF↑。'},
{ch:13,type:'mc',src:'107 清大計財',q:'淨利 $290M、折舊 $100M、資本支出 $150M、無利息、NWC 增加 $30M。FCF？',opts:['$10M','$210M','$270M','$570M'],ans:'(B)',exp:'FCF=EBIT(1−t)+折舊−資本支出−ΔNWC=290+100−150−30=210M。'},
{ch:13,type:'mc',src:'108 清大計財',q:'專案增加銷售 $60,000、現金費用 $51,000、成本 $40,000 直線折舊 4 年、稅率 35%。稅盾法 OCF？',opts:['$5,850','$8,650','$9,350','$9,700','$10,350'],ans:'(C)',exp:'Dep=40,000/4=10,000；OCF=(60,000−51,000−10,000)(1−35%)+10,000=−1,000×0.65+10,000=9,350。'},
{ch:13,type:'calc',src:'高科大財管',q:'寶英 EBIT $10,000、稅負 $2,000、折舊 $1,200、必要資本支出 $3,200。FCF？',ans:'$6,000',exp:'FCF=EBIT−稅+折舊−資本支出=10,000−2,000+1,200−3,200=6,000。'},
{ch:13,type:'calc',src:'100 淡江財金',q:'Acer：銷售 $220,000、營業成本（不含折舊）$140,500、折舊 $9,250、負債 $35,250 利率 6.75%、稅率 35%；新購固定資產 $15,250、NWC 投資 $6,850。FCF？',ans:'$32,812.5',exp:'<p>EBIT=220,000−140,500−9,250=70,250。</p><p>FCF=EBIT(1−t)+折舊−資本支出−ΔNWC=70,250×0.65+9,250−15,250−6,850=32,812.5。</p>'},
{ch:13,type:'calc',src:'104 交大財金',q:'銷售 $500,000、COGS $300,000、管理費 $20,000、折舊 $20,000、利息 $40,000、購設備 $10,000、NWC 不變、稅率 35%。求 EBIT、NI、CFO。',ans:'EBIT=$160,000；NI=$78,000；CFO=$98,000',exp:'<p>EBIT=500,000−300,000−20,000−20,000=160,000。</p><p>NI=(160,000−40,000)×0.65=78,000。</p><p>CFO=NI+折舊=78,000+20,000=98,000（會計報表口徑）。</p>'},

/* ---- 重點14 財務比率分析 ---- */
{ch:14,type:'mc',src:'中原國貿',q:'應收帳款期間 42 天、應付帳款期間 54 天、存貨週轉 5.2 次/年。營業循環天數？',opts:['42','58','84','112'],ans:'(D)',exp:'營業循環=存貨天數+應收天數=365/5.2+42=70.2+42=112.2 天。'},
{ch:14,type:'mc',src:'台大財金',q:'COGS $3,600,000、期初存貨 $800,000、期末存貨 $1,000,000、應收 $1,600,000、應付 $950,000、銷貨 $4,800,000。現金循環天數（365 天）？',opts:['80','90','120','180','210'],ans:'(C)',exp:'存貨天數=365/[(3,600,000/900,000)]=91.25；應收天數=365/(4,800,000/1,600,000)=121.67；應付天數=365/(3,600,000/950,000)=96.32；CCC=91.25+121.67−96.32≈116.6（約 120 天）。'},
{ch:14,type:'mc',src:'政大財管',q:'存貨期間 221 天、應付期間 180 天、現金循環 79 天。營業循環？',opts:['155','162','238','245','259'],ans:'(E)',exp:'營業循環=現金循環+應付期間=79+180=259 天。'},
{ch:14,type:'mc',src:'清大計財',q:'速動比率定義？',opts:['流動資產/流動負債','現金+流動負債/流動資產','流動負債/流動資產','(流動資產−存貨)/流動負債','(流動資產−存貨−流動負債)'],ans:'(D)',exp:'速動比率=(流動資產−存貨)/流動負債。'},
{ch:14,type:'mc',src:'中山財管',q:'存貨銷售期間 5 天、COGS $4,380、NWC $80、流動資產 $400。速動比率？',opts:['5.000','1.790','1.063','2.40'],ans:'(C)',exp:'存貨=4,380×5/365=60；CL=CA−NWC=400−80=320；速動=(400−60)/320=1.063。'},
{ch:14,type:'mc',src:'中山財管',q:'衡量企業短期償債能力的最佳指標？',opts:['流動比率','EPS','本益比','權益乘數'],ans:'(A)',exp:'流動比率、速動比率、現金比率為短期償債指標。'},
{ch:14,type:'mc',src:'中山財管',q:'將短期應付票據轉為長期應付票據，會導致？',opts:['NWC 與流動比率皆減少','NWC 增加、流動比率下降','NWC 減少、流動比率提高','NWC 與流動比率皆提高'],ans:'(D)',exp:'流動負債減少→流動比率↑、NWC(=CA−CL)↑。'},
{ch:14,type:'mc',src:'元智財金',q:'新專案需：存貨+25,000、應收+10,000、機器+30,000、應付+15,000。NWC 淨效果？',opts:['−$5,000','+$5,000','+$20,000','+$50,000','+$80,000'],ans:'(C)',exp:'ΔNWC=(25,000+10,000)−15,000=20,000（機器為固定資產不影響 NWC）。'},
{ch:14,type:'mc',src:'元智財金',q:'流動資產 $1,000,000、流動負債 $250,000。用現金還 $100,000 應付帳款後？',opts:['流動比率下降','NWC 增至 $500,000','NWC 不變','流動比率增至 6.0','速動比率下降'],ans:'(C)(D)',exp:'新流動比率=(900,000)/(150,000)=6；NWC=900,000−150,000=750,000（原 750,000），不變。'},
{ch:14,type:'mc',src:'元智財金',q:'去年 ROE 30%、今年盈餘相同但 ROE 降為 20%。權益變化？',opts:['減少 10%','減少 50%','增加 10%','增加 50%','以上皆非'],ans:'(D)',exp:'ROE=NI/E；NI 不變、ROE 從 30% 降到 20%→E 變為原 1.5 倍（增加 50%）。'},
{ch:14,type:'mc',src:'中山財管',q:'XYZ：Quick $80、存貨 $36、流動負債 $45、銷售 $235、毛利 $58、營業費用 $29、利息 $9。賺得利息倍數（TIE）？',opts:['6.44','3.22','2.22','1.78','1.55','4.33'],ans:'(B)',exp:'EBIT=毛利−營業費用=58−29=29；TIE=29/9=3.22。'},
{ch:14,type:'mc',src:'東吳國貿',q:'期初存貨 $600,000、期末 $1,000,000、本期進貨 $12,400,000。存貨轉換期（360 天）？',opts:['18','24','36','48'],ans:'(B)',exp:'COGS=600,000+12,400,000−1,000,000=12,000,000；平均存貨=800,000；存貨週轉=15；天數=360/15=24。'},
{ch:14,type:'mc',src:'台大財金',q:'長期負債 $2,000,000、業主權益 $1,500,000、固定及其他資產 $3,600,000、存貨 $700,000、流動資產 $1,600,000。速動比率？',opts:['1.67','1.23','0.82','0.53','0.45'],ans:'(D)',exp:'CL=總資產−長期負債−權益=(1,600,000+3,600,000)−2,000,000−1,500,000=1,700,000；速動=(1,600,000−700,000)/1,700,000=0.53。'},
{ch:14,type:'mc',src:'政大金融',q:'流動比率>1，用現金償還應付帳款，結果？',opts:['NWC 增加','NWC 減少','流動比率增加','流動比率減少','以上皆非'],ans:'(C)',exp:'CA、CL 同額減少；因流動比率>1，減相同金額後比率上升；NWC 不變。'},
{ch:14,type:'mc',src:'中央財金',q:'哪個科目增加會提高流動比率但不影響速動比率？',opts:['應付帳款','現金','存貨','應收帳款','固定資產'],ans:'(C)',exp:'存貨是流動資產但非速動資產；存貨增加→流動比率↑、速動比率不變。'},
{ch:14,type:'mc',src:'中正財金',q:'流動負債 $250、流動比率 1.2、速動比率 0.8。存貨水準？',opts:['$45','$100','$120','$130'],ans:'(B)',exp:'CA=1.2×250=300；(300−存貨)/250=0.8→存貨=100。'},
{ch:14,type:'mc',src:'104 交大財金',q:'資產週轉率去年 4 次，今年銷售+50%、平均總資產+20%。今年資產週轉率？',opts:['1.6','3.2','5','10'],ans:'(C)',exp:'新週轉=4×(1.5)/(1.2)=5。'},
{ch:14,type:'mc',src:'107 成大財金',q:'HD 與 LD 同稅率、銷售、總資產、基本獲利能力，HD 負債比率較高。何者正確？',opts:['HD 權益乘數較小','HD 淨利較多','HD 繳稅較多','HD ROE 較低','HD TIE 較低'],ans:'(E)',exp:'HD 負債多→利息費用高→EBIT/利息=TIE 較低；同時稅盾多繳稅少、ROE 較高。'},
{ch:14,type:'mc',src:'107 中正財金',q:'營業循環與現金循環的差異在於？',opts:['無差異','應收帳款天數','應付帳款天數','存貨天數'],ans:'(C)',exp:'現金循環=營業循環−應付帳款天數。'},
{ch:14,type:'essay',src:'106 交大財金',q:'財務比率分析有哪些限制？',ans:'四項限制：集團企業、通膨、會計差異、無絕對標準。',exp:'<p><b>(1) 集團企業：</b>跨產業集團無適當同業基準。</p><p><b>(2) 通貨膨脹：</b>長期比較時歷史成本會扭曲比率。</p><p><b>(3) 會計差異：</b>不同折舊/存貨方法（FIFO vs LIFO）使數字不可比。</p><p><b>(4) 無絕對標準：</b>比率高低無絕對善惡，需同業與趨勢分析；另須注意窗飾（window dressing）。</p>'},
{ch:14,type:'calc',src:'高第一金融',q:'F 公司：期初存貨 $150,000、期末 $250,000；期初應收 $700,000、期末 $900,000；期初應付 $270,000、期末 $250,000；COGS $2,500,000、銷貨 $7,200,000（360 天）。現金轉換循環？',ans:'31.36 天',exp:'<p>存貨天數=360/[2,500,000/200,000]=28.8；應收天數=360/[7,200,000/800,000]=40；應付天數=360/[2,500,000/260,000]=37.44。</p><p>CCC=28.8+40−37.44=31.36 天。</p>'},
{ch:14,type:'calc',src:'中央財金',q:'Depositors 銀行權益/資產=7.5%、Newton 銀行=6%，ROA 皆為 0.85%。兩家銀行的權益乘數？',ans:'Depositors=13.33；Newton=16.67',exp:'權益乘數=總資產/權益=1/(權益/資產)；Dep=1/0.075=13.33；Newton=1/0.06=16.67。'},
{ch:14,type:'calc',src:'108 交大財金',q:'TIE=2、稅額 $1M、利息 $1.5M、權益 $1.5M。ROE？',ans:'33.33%',exp:'<p>EBIT=TIE×I=2×1.5M=3M。</p><p>NI=EBIT−I−稅=3M−1.5M−1M=0.5M。</p><p>ROE=0.5M/1.5M=33.33%。</p>'},

/* ---- 重點15 投資價值比率與杜邦分析 ---- */
{ch:15,type:'mc',src:'高大金管',q:'P/E=18、ROE=13%。M/B ratio？',opts:['0.64','0.92','2.34','1.56','以上皆非'],ans:'(C)',exp:'M/B = P/E × ROE = 18 × 13% = 2.34。'},
{ch:15,type:'mc',src:'中原國貿',q:'M/B=3.5、NI=$84,000、每股淨值 $20.16、流通 50,000 股。P/E？',opts:['21','27','42','49'],ans:'(C)',exp:'股價=3.5×20.16=70.56；EPS=84,000/50,000=1.68；P/E=70.56/1.68=42。'},
{ch:15,type:'mc',src:'中山財管',q:'杜邦方程式三部分？',opts:['營運效率、資產使用效率、獲利力','財務槓桿、營運效率、資產使用效率','權益乘數、淨利率、總資產週轉率','D/E、資本密集率、淨利率'],ans:'(B)(C)',exp:'三階杜邦：ROE=淨利率(營運效率)×總資產週轉率(資產使用效率)×權益乘數(財務槓桿)。'},
{ch:15,type:'mc',src:'清大計財',q:'關於 EVA，何者錯誤？',opts:['EVA 與股東財富創造直接連結','落實得當可成為公司治理機制','EVA 不能當外部績效衡量因股價不可預測','EVA 可做為績效薪酬的關鍵變數'],ans:'(C)',exp:'EVA=EBIT(1−t)−投入資本×WACC，已扣除股東資金成本；可內部衡量，亦可外部揭露。'},
{ch:15,type:'mc',src:'元智財金',q:'銷售 $4M、淨利率 5%。ROA 從 10% 提到 12%，資產應減少多少？',opts:['$240,000','$333,333','$400,000','$516,167'],ans:'(B)',exp:'原資產=(5%×4M)/10%=2M；新資產=(5%×4M)/12%=1.667M；減少 333,333。'},
{ch:15,type:'mc',src:'政大金融',q:'流通 100,000 股、權益帳面 $3,000,000、M/B=3.5。每股市價？',opts:['$8.57','$30','$85.7','$105','$115'],ans:'(D)',exp:'每股帳面=3,000,000/100,000=30；市價=30×3.5=105。'},
{ch:15,type:'mc',src:'政大金融',q:'Midget：淨利率 4%、ROE 18%、D/E=0.8。總資產週轉率？',opts:['2.500','5.625','2.000','10.125'],ans:'(A)',exp:'權益乘數=1+D/E=1.8；ROE=PM×AT×EM→18%=4%×AT×1.8→AT=2.5。'},
{ch:15,type:'mc',src:'中正財金',q:'D/A=0.4、總資產週轉=3.5、ROE=12%。淨利率？',opts:['2.06%','5.37%','8.39%','12.44%'],ans:'(A)',exp:'權益乘數=1/(1−0.4)=1.667；ROE=PM×3.5×1.667=12%→PM=2.06%。'},
{ch:15,type:'mc',src:'高大金管',q:'若利率低於 ROA，增加負債會使 ROE？',opts:['上升','不變','下降','不一定'],ans:'(A)',exp:'正槓桿：ROA>稅後負債成本時，增加 D/E 可放大 ROE。'},
{ch:15,type:'mc',src:'中正財金',q:'EBIT=$3M、營業資金(投入資本)=$2M、WACC=14.5%、稅率 25%。EVA？',opts:['$985,000','$1,320,000','$1,750,500','$1,960,000'],ans:'(D)',exp:'EVA=EBIT(1−t)−IC×WACC=3M×0.75−2M×0.145=2.25M−0.29M=1.96M。'},
{ch:15,type:'mc',src:'中正財金',q:'EBIT=$1M、利息 $200,000、稅率 34%、流通 100,000 股。EPS？',opts:['$2.72','$3.40','$5.28','$6.60'],ans:'(C)',exp:'NI=(1M−200K)(1−0.34)=528,000；EPS=528,000/100,000=5.28。'},
{ch:15,type:'mc',src:'南華財金',q:'Tobin\'s q 定義？',opts:['權益市價/權益帳面','NCF/EBIT','(資產市價+估計商譽)/資產帳面','資產市價/資產重置價值'],ans:'(D)',exp:'Tobin q=公司資產市價/重置成本；q 低易成為併購標的。'},
{ch:15,type:'mc',src:'102 政大財管',q:'Uranus：銷售 $400,000、固定資產 $100,000、EBIT $36,000、利率 10%、稅率 40%。緊縮政策(CA=15%銷售) vs 寬鬆政策(CA=25%銷售) 的 ROE 差異？',opts:['0%','6.2%','5.4%','1.6%','3.8%'],ans:'(C)',exp:'緊縮：E=(100K+60K)×50%=80K、I=8K、NI=16.8K、ROE=21%；寬鬆：E=(100K+100K)×50%=100K、I=10K、NI=15.6K、ROE=15.6%；差距 5.4%。'},
{ch:15,type:'mc',src:'102 中正財金',q:'DEF：總資本 $10M、NI $3M、資金成本 20%。剩餘利益？',opts:['$1M','$1.4M','$2.4M','$5M'],ans:'(A)',exp:'剩餘利益=NI−資本×cost=3M−10M×20%=1M。'},
{ch:15,type:'mc',src:'105 清大計財',q:'A、B 皆有 $2M 資產、$400K EBIT、稅率 40%。A：D/A=50%、利率 12%；B：D/A=30%、利率 10%。ROE 差？',opts:['1.25%','1.91%','2.23%','2.64%','2.86%'],ans:'(C)',exp:'A：I=0.12M、NI=0.168M、E=1M、ROE=16.8%；B：I=0.06M、NI=0.204M、E=1.4M、ROE=14.57%；差 2.23%。'},
{ch:15,type:'mc',src:'106 成大財金',q:'HD、LD 同總資產、銷售、營業成本、稅率、利率；HD 負債比率高。何者正確？',opts:['LD ROE 較高','LD BEP 較高','HD BEP 較高','若利率>BEP，HD ROE 較高','若利率<BEP，HD ROE 較高'],ans:'(E)',exp:'BEP 不受資本結構影響；正槓桿下(BEP>kd)，負債越多 ROE 越高。'},
{ch:15,type:'essay',src:'台北大金融 101',q:'當負債/資產比率增加時，ROE 變動方向為何？',ans:'不一定，視 ROA 與稅後負債成本而定。',exp:'<p>ROE = ROA + [ROA − k<sub>D</sub>(1−t)] × D/E。</p><p>若 ROA > k<sub>D</sub>(1−t)（正槓桿），加舉債使 ROE ↑。</p><p>若 ROA < k<sub>D</sub>(1−t)（負槓桿），加舉債使 ROE ↓。</p>'},
{ch:15,type:'essay',src:'淡江財金',q:'解釋 EVA（經濟附加價值）。',ans:'EVA=EBIT(1−t)−投入資本×WACC',exp:'<p>EVA 同時扣除負債與股東的稅後資金成本，衡量「超額經濟利潤」。</p><p>公式：EVA = EBIT(1−t) − Invested Capital × WACC = Capital × (ROIC − WACC)。</p><p>EVA>0 才真正為股東創造價值；EVA<0 即使會計有盈餘也毀損價值。</p>'},
{ch:15,type:'calc',src:'淡江財金',q:'Beta=1.3、D0=$2、g=8%、ROA=10%、D/A=20%、股價 $36。ROE？',ans:'12.5%',exp:'權益乘數=1/(1−0.2)=1.25；ROE=ROA×(A/E)=10%×1.25=12.5%。'},
{ch:15,type:'calc',src:'101 政大金融',q:'ROA=14%、負債利率 9%、負債占資產 70%。預期 ROE？（未給稅率，設 t=0）',ans:'25.67%',exp:'ROE=ROA+[ROA−k<sub>D</sub>]×D/E=14%+(14%−9%)×(0.7/0.3)=14%+11.67%=25.67%。'},

/* ---- 重點16 財務預測與成長率估算 ---- */
{ch:16,type:'mc',src:'台大財金',q:'中山：總資產 $1,200M、自發性負債 $360M；去年銷售 $2,000M、今年 $2,500M、PM=4%、股利支付率 30%。外部資金需求？',opts:['不需要外部資金','120M','165M','140M','45M'],ans:'(D)',exp:'g=25%；EFN=1,200×25%−360×25%−4%×2,500×(1−30%)=300−90−70=140M。'},
{ch:16,type:'mc',src:'成大財金',q:'永續成長率（sustainable growth）定義？',opts:['不發股利下的最低成長率','維持權益乘數下的最低成長率','完全不對外融資的最大成長率','不發新股、維持 D/E 不變的最大成長率','無負債上限的最大成長率'],ans:'(D)',exp:'不對外發新股、維持 D/E 固定，僅靠保留盈餘+等比例舉債可達的最大成長率。'},
{ch:16,type:'mc',src:'成大財金',q:'內部成長率（internal growth）定義？',opts:['不發股利下的最低成長率','維持權益乘數下的最低成長率','完全不對外融資的最大成長率','不發新股、維持 D/E 不變的最大成長率','無負債上限的最大成長率'],ans:'(C)',exp:'完全不對外融資，僅靠保留盈餘支應投資的最大成長率。'},
{ch:16,type:'mc',src:'高大金管',q:'TSMC：銷售 $400、成本 $200、稅 $50、NI $150、股利 $90；資產 $1,200、負債 $600、權益 $600。資產成本隨銷售，負債不隨。明年銷售 $480，維持固定 payout。EFN？',opts:['$60','$240','$168','$132','以上皆非'],ans:'(C)',exp:'g=20%；EFN=1,200×20%−150×(480/400)×(1−90/150)=240−180×0.4=168。'},
{ch:16,type:'mc',src:'成大財金',q:'何種行動會降低外部資金需求？',opts:['提高股利支付率','降低淨利率','縮短應收帳款收現期間','提高預期銷售成長','減少應計負債'],ans:'(C)',exp:'縮短 DSO→應收帳款下降→所需營運資金下降→EFN 下降。'},
{ch:16,type:'mc',src:'朝陽財金',q:'payout=40%、g*=8.5%、資本密集率=1.1、D/E=0.5。淨利率？',opts:['5.4%','7.9%','9.6%','11.9%','14.4%'],ans:'(C)',exp:'8.5%=ROE×0.6/(1−ROE×0.6)→ROE=13.06%；ROE=PM×(1/1.1)×1.5→PM=9.6%。'},
{ch:16,type:'mc',src:'103 政大金融',q:'NI $2.5M、現金股利 $1.5M、ROE=20%。永續成長率？',opts:['3.0%','5.4%','7.2%','8.0%'],ans:'(D)',exp:'b=1−1.5/2.5=0.4；g*=ROE×b=20%×0.4=8%（BMA 定義）。'},
{ch:16,type:'mc',src:'108 政大財管',q:'永續成長率何者正確？',opts:['假設完全無外部融資','D/E 可變下的最大成長','需新增外部負債與權益','假設 payout=0','無負債公司時等於內部成長率'],ans:'(E)',exp:'當 D=0 時 A/E=1，ROE=ROA，故 g*=g<sub>i</sub>。'},
{ch:16,type:'essay',src:'政大財管',q:'銷售成長率、股利支付率、邊際利潤率如何影響外部資金需求（EFN）？',ans:'g↑、d↑→EFN↑；PM↑→EFN↓。',exp:'<p><b>銷售成長率 g：</b>g 越高，所需資產與自發性負債增加越多，EFN 上升。</p><p><b>邊際利潤 PM：</b>PM 越高，保留盈餘越多，EFN 下降。</p><p><b>股利支付率 d：</b>d 越高，保留盈餘越少，EFN 上升。</p><p>其他：資產占銷售比、自發性負債占銷售比、閒置產能皆影響。</p>'},
{ch:16,type:'essay',src:'政大財管',q:'何謂永續成長率？對經營與融資策略的意義？',ans:'不發新股、維持 D/E 固定下可達的最大成長率。',exp:'<p><b>公式：</b>g* = ROE×b / (1−ROE×b)。</p><p><b>意義：</b>若實際成長率持續 > g*，公司必須發新股或提高 D/E（增加財務風險）；若實際成長率 < g*，則有閒置資金可還債、回購或提高股利。</p><p>提升 g* 的四個槓桿：提高淨利率、提高資產週轉率、提高財務槓桿、降低股利支付率。</p>'},
{ch:16,type:'calc',src:'108 政大金融',q:'Plank\'s：NI $2,000、銷售 $50,000、股利 $500、總資產 $100,000，其中 $40,000 來自負債。(1) 永續成長率？(2) 明年不舉新債，最大成長率？',ans:'(1) g*=2.5%；(2) g<sub>i</sub>=1.5%',exp:'<p>(1) E=100K−40K=60K；ROE=2,000/60,000=3.33%；b=1−500/2,000=0.75；g*=3.33%×0.75=2.5%（BMA）。</p><p>(2) ROA=2,000/100,000=2%；g<sub>i</sub>=2%×0.75=1.5%。</p>'},

/* ---- 重點17 報酬與風險的衡量 ---- */
{ch:17,type:'mc',src:'清大計財',q:'從無風險投資轉到風險性投資所多賺的報酬稱為？',opts:['幾何平均報酬','通膨貼水','風險貼水','時間貼水','算數平均報酬'],ans:'(C)',exp:'風險溢酬=風險性資產預期報酬−無風險利率；風險越高要求溢酬越大。'},
{ch:17,type:'mc',src:'102 台大財金',q:'退休基金期初 $500,000，第一年賺 15%、第二年賺 10%；第二年初再投入 $300,000。金額加權與時間加權報酬？',opts:['11.7%/12.5%','11.3%/11.7%','11.3%/12.1%','11.7%/12.1%','12.1%/12.5%'],ans:'(E)',exp:'時間加權=√(1.15)(1.10)−1=12.47%；金額加權(IRR)約 12.06%（選項取 12.1%/12.5%）。'},
{ch:17,type:'mc',src:'朝陽財金',q:'三景氣：機率 0.2/0.5/0.3；X 報酬 −20%/18%/50%；Y 報酬 −15%/20%/10%。E(R<sub>X</sub>)、E(R<sub>Y</sub>)？',opts:['18%/5%','18%/12%','20%/11%','20%/10%'],ans:'(D)',exp:'E(X)=−4%+9%+15%=20%；E(Y)=−3%+10%+3%=10%。'},
{ch:17,type:'mc',src:'輔大金融',q:'兩股票相關係數定義？',opts:['σ<sub>A</sub>/σ<sub>B</sub>','σ<sub>B</sub>/Cov(A,B)','Cov(A,B)/(σ<sub>A</sub>σ<sub>B</sub>)','(Var(A)+Var(B))/Cov(A,B)'],ans:'(C)',exp:'ρ<sub>AB</sub>=Cov(A,B)/(σ<sub>A</sub>σ<sub>B</sub>)，介於 −1 到 1。'},
{ch:17,type:'mc',src:'中正財金',q:'1994 年虧 15%、1995 年賺 15%。兩年總報酬？',opts:['0%','正','負','不一定'],ans:'(C)',exp:'(1−15%)(1+15%)−1=−2.25%，虧損。'},
{ch:17,type:'mc',src:'政大金融',q:'五年總報酬：0%、7%、−2%、10%、12%。五年財富變化？',opts:['29%','27%','5.8%','5.4%'],ans:'(A)',exp:'(1.0)(1.07)(0.98)(1.10)(1.12)−1=29.19%。'},
{ch:17,type:'mc',src:'成大財金',q:'N 檔股票的投資組合風險包含？',opts:['N²−1 項共變異數','N 項變異數','N²−N 項共變異數','N² 項共變異數'],ans:'(B)(C)',exp:'共 N 項變異數、N(N−1) 項共變異數（對稱矩陣共 N² 項）。'},
{ch:17,type:'mc',src:'成大財金',q:'A、B 相關係數 −1、權重各 1/2，Var(A)=0.36、Var(B)=0.49。組合標準差？',opts:['0.0','0.05','0.10','0.15','以上皆非'],ans:'(B)',exp:'σ<sub>p</sub>=|0.5σ<sub>A</sub>−0.5σ<sub>B</sub>|=|0.3−0.35|=0.05。'},
{ch:17,type:'mc',src:'100 中正財金',q:'John 有 $1,000，可借錢。無風險利率 4%、最適投資組合預期報酬 10%。希望組合報酬 12%，應借多少？',opts:['$100','$200','$333.33','$666.67'],ans:'(C)',exp:'12%=w×10%+(1−w)×4%→w=1.333；借 $1,000×0.333=$333.33。'},
{ch:17,type:'mc',src:'101 成大財金',q:'五年報酬 5%、8%、−12%、15%、21%。算數平均與持有期間報酬？',opts:['4.5%/6.5%','7.4%/38.9%','7.4%/7.76%','7.4%/76.73%'],ans:'(B)',exp:'算數平均=(5+8−12+15+21)/5=7.4%；HPR=1.05×1.08×0.88×1.15×1.21−1=38.86%。'},
{ch:17,type:'mc',src:'101 高大金管',q:'借入 35% 自有資金投資股票，無風險利率 3%、股市預期 12%。組合預期報酬？',opts:['15.15%','17.25%','8.85%','15.00%','11.15%'],ans:'(A)',exp:'E(R<sub>p</sub>)=−0.35×3%+1.35×12%=−1.05%+16.2%=15.15%。'},
{ch:17,type:'mc',src:'107 清大計財',q:'30% IBM、70% MSFT；σ<sub>IBM</sub>=35%、σ<sub>MSFT</sub>=30%、ρ=0.5。組合標準差？',opts:['23.61%','27.78%','25.72%','31.56%'],ans:'(B)',exp:'Cov=0.5×0.35×0.30=0.0525；σ<sub>p</sub>=√(0.09×0.1225+0.49×0.09+2×0.3×0.7×0.0525)=27.78%。'},
{ch:17,type:'mc',src:'高大金管',q:'30% 無風險資產、70% 風險性資產(σ=20%)。組合標準差？',opts:['18%','14%','21%','6%'],ans:'(B)',exp:'σ<sub>p</sub>=0.7×20%=14%（無風險資產無變異數亦無共變）。'},
{ch:17,type:'mc',src:'104 台大財金',q:'年初 $36 買 1 股，年底收 $2 股利再以 $30 買 1 股；第二年底收 $2 股利、以 $36.45 賣 2 股。金額加權報酬？',opts:['10.31%','6.81%','10.50%','13.93%','12.35%'],ans:'(E)',exp:'IRR：0=−36+(−30+2)/(1+r)+(36.45×2+2×2)/(1+r)²→r≈12.35%。'},
{ch:17,type:'mc',src:'108 中正財金',q:'$9,800 買面額 $10,000、2 個月到期 T-bill。名目 APR？',opts:['2.04%','12%','12.24%','12.89%'],ans:'(C)',exp:'APR=(200/9,800)×(12/2)=12.24%。'},
{ch:17,type:'essay',src:'淡江財金',q:'何謂風險？列出至少三種衡量風險的方法。',ans:'風險=實際報酬偏離預期的程度。',exp:'<p><b>風險：</b>未來實際報酬偏離預期報酬的不確定性；上方風險（賺超過預期）與下方風險（賠超過預期）。</p><p><b>衡量方法：</b></p><p>(1) <b>標準差/變異數：</b>總風險，含系統與非系統風險。</p><p>(2) <b>Beta：</b>系統風險，相對市場的敏感度。</p><p>(3) <b>VaR：</b>特定信賴水準下的最大可能損失。</p><p>(4) <b>變異係數 CV=σ/E(R)：</b>單位報酬的風險，用於不同標的比較。</p>'},
{ch:17,type:'calc',src:'台大財金',q:'面額 $10,000 國庫券市價 $9,700、90 天到期。有效年報酬率(EAR)與名目年報酬率(APR)？（365 天）',ans:'EAR=13.15%；APR=12.54%',exp:'<p>90 天報酬=300/9,700=3.0928%。</p><p>EAR=(1.030928)<sup>365/90</sup>−1=13.15%。</p><p>APR=3.0928%×(365/90)=12.54%。</p>'},

/* ---- 重點18 投資組合理論 ---- */
{ch:18,type:'mc',src:'清大計財',q:'效率前緣(efficient set)定義？',opts:['給定風險下最高報酬','給定報酬下最低風險','整體最低風險','(A)(B) 皆是','(A)(C) 皆是'],ans:'(D)',exp:'效率前緣上的投組同時滿足：同風險下最高報酬、同報酬下最低風險。'},
{ch:18,type:'mc',src:'成大財金',q:'何者支配其他投資？A: E=15%, Var=0.20；B: E=10%, Var=0.20；C: E=10%, Var=0.25；D: E=15%, Var=0.25',opts:['A','B','C','D','皆不支配'],ans:'(A)',exp:'A 與 B 風險相同但 A 報酬高；A 與 D 報酬相同但 A 風險低；A 支配 B、C、D。'},
{ch:18,type:'mc',src:'清大計財',q:'A E(R)=20%、B E(R)=12%；Var(A)=3Var(B)、ρ=0。最小變異投資組合預期報酬？',opts:['16%','14%','12%','20%'],ans:'(B)',exp:'W<sub>A</sub>=σ<sub>B</sub>²/(σ<sub>A</sub>²+σ<sub>B</sub>²)=1/(3+1)=0.25；E(R<sub>p</sub>)=0.25×20%+0.75×12%=14%。'},
{ch:18,type:'mc',src:'台大財金',q:'連接無風險利率與最適風險投資組合的直線稱為？',opts:['證券市場線 SML','資本配置線 CAL','無異曲線','投資者效用線','特徵線'],ans:'(B)',exp:'CAL：y=R<sub>f</sub>+[E(R<sub>T</sub>)−R<sub>f</sub>]/σ<sub>T</sub>×σ；斜率最大的 CAL 即 CML。'},
{ch:18,type:'mc',src:'台大財金',q:'A E(R)=13%、σ=19%；B E(R)=10%、σ=16%；ρ=−1。無風險投資組合報酬？',opts:['11.71%','11.62%','11.37%','11.50%','11.29%'],ans:'(C)',exp:'W<sub>A</sub>=16/(19+16)=0.457；E=0.457×13%+0.543×10%=11.37%。'},
{ch:18,type:'mc',src:'中正財金',q:'U=E(r)−½Aσ²，A=4。A: E=12%,σ=30%；B: E=15%,σ=50%；C: E=21%,σ=16%；D: E=24%,σ=21%。風險趨避者選？',opts:['A','B','C','D'],ans:'(C)',exp:'U<sub>A</sub>=−0.06；U<sub>B</sub>=−0.35；U<sub>C</sub>=0.159；U<sub>D</sub>=0.152。C 效用最高。'},
{ch:18,type:'mc',src:'成大會研',q:'分離定理(separation theorem)將哪兩種決策分開？',opts:['消費/融資','借錢/貸出','投資/融資','風險/報酬','買股票/買債券'],ans:'(C)',exp:'投資決策(選切點組合)與融資決策(在 R<sub>f</sub> 與切點間配置)分開。'},
{ch:18,type:'mc',src:'成大會研',q:'分離定理的意義？',opts:['區分市場風險與非市場風險','區分可分散與不可分散風險','區分系統與非系統風險','區分風險性與無風險資產','不論風險趨避程度，投資人都應持有相同的風險性資產組合'],ans:'(E)',exp:'两資金分離：所有投資人都持有切點組合 T，再依風險偏好決定 T 與 R<sub>f</sub> 的比例。'},
{ch:18,type:'mc',src:'103 台大財金',q:'Apple 股票與其賣權報酬 ρ=−1；σ<sub>Apple</sub>=20%、σ<sub>put</sub>=60%。無風險投資組合權重？',opts:['(0.25,0.75)','(0.75,0.25)','(−0.25,1.25)','(1.25,0.25)','(0.5,0.5)'],ans:'(B)',exp:'W<sub>A</sub>=σ<sub>p</sub>/(σ<sub>A</sub>+σ<sub>p</sub>)=0.6/0.8=0.75；W<sub>p</sub>=0.25。'},
{ch:18,type:'mc',src:'107 中正財金',q:'兩風險資產組合無多角化效果，表示兩者報酬？',opts:['報酬太低','完全反向','波動過大','完全同步(ρ=+1)'],ans:'(D)',exp:'ρ=+1 時，σ<sub>p</sub>=w<sub>1</sub>σ<sub>1</sub>+w<sub>2</sub>σ<sub>2</sub>，無分散效果。'},
{ch:18,type:'essay',src:'成大財金',q:'以 Markowitz 模型說明投資人如何找出最適投資組合？需要哪些資訊？',ans:'效率前緣+無異曲線切點；有無風險資產時為 CML 與無異曲線切點。',exp:'<p><b>無風險資產：</b>需要：(1) 各資產 E(R)；(2) 變異數/共變異數矩陣；(3) 投資人風險趨避係數 A。</p><p>步驟：(a) 求出效率前緣；(b) 投資人無異曲線與效率前緣相切即最適。</p><p><b>有無風險資產：</b>加入 R<sub>f</sub>，由 R<sub>f</sub> 畫切線到效率前緣(切點組合 T)，形成 CML；無異曲線與 CML 切點即最適。</p>'},
{ch:18,type:'calc',src:'淡江財金',q:'A: E(R)=12%、σ=8%；B: E(R)=8%、σ=6%；ρ=0；R<sub>f</sub>=7%。切點投資組合 T 中 A、B 的權重？',ans:'W<sub>A</sub>=73.77%、W<sub>B</sub>=26.23%',exp:'<p>切點公式：</p><p>W<sub>A</sub>=[(E<sub>A</sub>−R<sub>f</sub>)σ<sub>B</sub>²−(E<sub>B</sub>−R<sub>f</sub>)σ<sub>A</sub>σ<sub>B</sub>ρ] / [(E<sub>A</sub>−R<sub>f</sub>)σ<sub>B</sub>²+(E<sub>B</sub>−R<sub>f</sub>)σ<sub>A</sub>²−(E<sub>A</sub>+E<sub>B</sub>−2R<sub>f</sub>)σ<sub>A</sub>σ<sub>B</sub>ρ]</p><p>ρ=0 下：W<sub>A</sub>=(0.05×0.0036)/(0.05×0.0036+0.01×0.0064)=0.00018/0.000244=0.738。</p>'},

/* ---- 重點19 多角化效果 ---- */
{ch:19,type:'mc',src:'清大計財',q:'充分多角化投資組合的變異數？',opts:['等於波動最大股票的變異數','可能小於風險最小股票的變異數','必須大於或等於最小股票變異數','等於個別變異數加權平均','等於算數平均'],ans:'(B)',exp:'ρ<0 時可能「後彎」，組合變異數小於任何單一資產；n→∞ 時趨近平均共變異數（系統風險）。'},
{ch:19,type:'mc',src:'中山財管',q:'有關投資組合，何者錯誤？',opts:['以平均數-變異數分析為基礎','相關係數越高，多角化效果越好','股票數目越多，多角化效果越好','以上皆正確'],ans:'(B)',exp:'相關係數越接近 −1，多角化效果越好；越接近 +1 越差。'},
{ch:19,type:'mc',src:'清大計財',q:'何者為系統風險？',opts:['木材價格大跌','航空公司飛行員罷工','聯準會升息','颶風觀光區','民眾拒吃速食'],ans:'(C)',exp:'總體經濟因素（利率、通膨、景氣、戰爭）影響全體市場，無法分散。'},
{ch:19,type:'mc',src:'成大財金',q:'何者為可分散(非系統)風險？',opts:['電價上漲','紡織公司員工投票罷工','政府訂定全國安全標準','政府降公司稅','全國團體健保成本上升'],ans:'(B)',exp:'單一公司罷工為公司特有風險；其他選項為總體法規/產業面，影響全體。'},
{ch:19,type:'mc',src:'逢甲財金',q:'包含大量股票的充分多角化組合？',opts:['加權平均預期報酬趨近 0','加權平均 Beta 趨近 0','加權平均異質風險趨近 0','加權平均系統風險趨近 0','組合報酬等於無風險利率'],ans:'(C)',exp:'非系統(異質)風險被分散殆盡；系統風險與 Beta 仍存。'},
{ch:19,type:'mc',src:'中正財金',q:'加入新資產以達最大分散效果，應選與原組合相關係數？',opts:['−1.0','−0.5','0','+1.0'],ans:'(A)',exp:'ρ=−1 時分散效果最大，理論上可建構無風險組合。'},
{ch:19,type:'mc',src:'成大財金',q:'多角化的主要目的？',opts:['提高報酬與風險','消除所有風險','消除公司特有風險','消除系統風險','同時降低報酬與風險'],ans:'(C)',exp:'多角化只能分散非系統風險（公司特有風險），無法消除市場風險。'},
{ch:19,type:'mc',src:'中正財金',q:'投資組合中證券數目增加時？',opts:['組合變異數下降','組合變異數越取決於平均共變異數','組合變異數越取決於平均期望報酬','組合變異數越取決於平均變異數','(A)(B) 皆是'],ans:'(E)',exp:'個別變異數項被 1/N 消除；N(N−1)/N²≈1，共變異數項留存。'},
{ch:19,type:'mc',src:'109 台大財金',q:'等權重大量股票組合，個別 σ=0.4、兩兩相關係數=0.1。組合波動度？',opts:['12.6%','1.6%','13.8%','15.3%','6.7%'],ans:'(A)',exp:'σ<sub>p</sub>≈√(ρσ²)=√(0.1×0.16)=0.1265=12.6%。'},
{ch:19,type:'essay',src:'淡江國貿',q:'增加股票數目能否將投資組合風險降為 0？',ans:'不能，僅能分散非系統風險，系統風險仍存。',exp:'<p>增加持股可消除非系統風險（公司特有），但無法消除系統風險（總體經濟因素）。</p><p>ρ=−1 的兩資產理論上可建構無風險組合，但現實市場難找完全負相關標的。</p><p>若要完全避險，需以衍生性商品（期貨、選擇權）與現貨反向操作。</p>'},
{ch:19,type:'essay',src:'106 政大金融',q:'為什麼多角化能降低風險？',ans:'ρ<1 時，σ<sub>p</sub> < w<sub>1</sub>σ<sub>1</sub>+w<sub>2</sub>σ<sub>2</sub>。',exp:'<p>兩資產組合變異數：</p><p>σ<sub>p</sub>² = w<sub>1</sub>²σ<sub>1</sub>² + w<sub>2</sub>²σ<sub>2</sub>² + 2w<sub>1</sub>w<sub>2</sub>ρ<sub>12</sub>σ<sub>1</sub>σ<sub>2</sub></p><p>當 ρ<sub>12</sub>&lt;1，跨項小於 2w<sub>1</sub>w<sub>2</sub>σ<sub>1</sub>σ<sub>2</sub>，故 σ<sub>p</sub> &lt; w<sub>1</sub>σ<sub>1</sub>+w<sub>2</sub>σ<sub>2</sub>。</p><p>ρ 越接近 −1，分散效果越好；N 增加時個別變異數項趨近於 0。</p>'},

{ch:20,type:'mc',src:'淡江財金',q:'含風險與無風險資產的效率前緣稱為？',opts:['efficient set','market set','security market line','capital market line'],ans:'(D)',exp:'加入無風險資產後，效率前緣為由 R<sub>f</sub> 切風險性資產效率前緣的直線，即 CML。'},
{ch:20,type:'mc',src:'清大計財',q:'CAPM 中預期報酬與 beta 的關係？',opts:['負向非線性','負向線性','正向線性','正向非線性'],ans:'(C)',exp:'E(R<sub>i</sub>)=R<sub>f</sub>+β<sub>i</sub>[E(R<sub>M</sub>)−R<sub>f</sub>]，與 β 正向線性。'},
{ch:20,type:'mc',src:'中山財管',q:'倫飛零股利，現價 $40，R<sub>f</sub>=5%、市場報酬 10%。明年股價 $42 才落在 SML 上，β=？',opts:['0.22','−0.90','4.5','0'],ans:'(A)',exp:'要求報酬=(42−40)/40=5%；5%=5%+β×5%→β=0.22。'},
{ch:20,type:'mc',src:'成大財金',q:'Nuvo β=0.86、E(R)=10.5%；R<sub>f</sub>=3.2%、R<sub>M</sub>=11.2%。何者正確？',opts:['Nuvo 落在 SML 下方','Nuvo 股價低估','CAPM 要求報酬 9.88%','Nuvo 系統風險大於市場','Nuvo 正確訂價'],ans:'(B)(C)',exp:'要求報酬=3.2%+(11.2%−3.2%)×0.86=10.08%（選項 9.88% 為近似）；E(R)=10.5%>要求→低估。'},
{ch:20,type:'mc',src:'朝陽財金',q:'權益基金風險溢酬 10%、β=1.4；T-bill 6%。客戶 $60K 進基金、$40K 進 T-bill。組合報酬與 β？',opts:['8.4% / 0.84','8.4% / 1.40','12% / 0.84','12% / 1.40'],ans:'(C)',exp:'基金 E(R)=6%+10%=16%；組合 E(R)=0.6×16%+0.4×6%=12%；β=0.6×1.4+0.4×0=0.84。'},
{ch:20,type:'mc',src:'元智財金',q:'公司權益 β=0.8、負債 β=0.3；E 市值 $160M、D 市值 $40M。資產 β？',opts:['0.7','0.8','1.1','皆非'],ans:'(A)',exp:'β<sub>asset</sub>=(D/V)β<sub>D</sub>+(E/V)β<sub>E</sub>=0.2×0.3+0.8×0.8=0.7。'},
{ch:20,type:'mc',src:'高大金管',q:'Stock X β=0.6、Y β=1.4。何者正確？',opts:['Y 必有較高 E(R) 與 σ','50/50 組合 E(R) 超過市場','市場風險溢酬下降兩股要求報酬皆降，但 Y 降幅較大','通膨上升兩股要求報酬降相同幅度'],ans:'(C)',exp:'ΔE(R)=β×Δ[E(R<sub>M</sub>)−R<sub>f</sub>]；Y β 大，降幅大。'},
{ch:20,type:'mc',src:'中正財金',q:'要求報酬 15%、市場 10%、β=2。平均股票報酬上升 30%（R<sub>f</sub> 不變），新要求報酬？',opts:['+20%','+30%','+40%','+50%','+60%'],ans:'(C)',exp:'15%=R<sub>f</sub>+5%×2→R<sub>f</sub>=5%；新 R<sub>M</sub>=13%；新 k=5%+(13%−5%)×2=21%；+40%。'},
{ch:20,type:'mc',src:'台大財金',q:'A(β=1.5,$4K)、B(β=1.2,$2K)、C(β=1.6,$3K)、D(β=1.4,$1K)。R<sub>f</sub>=5%、R<sub>M</sub>=11%，組合報酬？',opts:['10.06%','8.87%','16.87%','15.02%','13.76%'],ans:'(E)',exp:'β<sub>p</sub>=0.4×1.5+0.2×1.2+0.3×1.6+0.1×1.4=1.46；E(R)=5%+6%×1.46=13.76%。'},
{ch:20,type:'mc',src:'台大財金',q:'預期通膨升高時，SML 如何變動？',opts:['風險溢酬升高','β 全部升高','斜率變陡','所有股票要求報酬提高'],ans:'(D)',exp:'通膨↑→R<sub>f</sub>↑、SML 平行上移、斜率與 β 不變，所有要求報酬等幅上升。'},
{ch:20,type:'mc',src:'中正財金',q:'A、B 兩證券：A 要求報酬 30%、β=2；B 要求 25%、β=1.5。R<sub>f</sub>、R<sub>M</sub>？',opts:['15%/5%','15%/10%','20%/5%','20%/10%'],ans:'(D)',exp:'聯立：30%=R<sub>f</sub>+2(R<sub>M</sub>−R<sub>f</sub>)；25%=R<sub>f</sub>+1.5(R<sub>M</sub>−R<sub>f</sub>)→R<sub>M</sub>=20%、R<sub>f</sub>=10%。'},
{ch:20,type:'mc',src:'中正財金',q:'Oakdale β=0.7、要求報酬 15%、市場風險溢酬 5%。通膨升 2%、β 增加 50%，新要求報酬？',opts:['13.5%','22.8%','18.75%','15.25%','17.0%'],ans:'(C)',exp:'原 R<sub>f</sub>=15%−5%×0.7=11.5%；新 k=(11.5%+2%)+5%×(0.7×1.5)=18.75%。'},
{ch:20,type:'mc',src:'政大財管',q:'投資 E(R)=17%、R<sub>f</sub>=9%、β=1.8、E(R)=26%。',opts:['好投資因報酬高於市場','NPV<0','NPV>0','需更多資訊'],ans:'(C)',exp:'要求報酬=9%+(17%−9%)×1.8=23.4%<26%，股價低估、NPV>0。'},
{ch:20,type:'mc',src:'中正財金',q:'市場報酬 12%、變異數 0.25、R<sub>f</sub>=8%。A、B 共變數分別 0.20、0.30，E(R) 皆 12.2%。如何操作？',opts:['買 A 賣 B','賣 A 買 B','無差異','皆賣出','皆買進'],ans:'(A)',exp:'β<sub>A</sub>=0.20/0.25=0.8、k<sub>A</sub>=8%+4%×0.8=11.2%<12.2%（低估）；β<sub>B</sub>=0.30/0.25=1.2、k<sub>B</sub>=12.8%>12.2%（高估）。'},
{ch:20,type:'mc',src:'中正財金',q:'已持有股票 β=0.74。現拿 40% 財富買市場指數基金，新組合 β？',opts:['0.80','0.84','0.90','0.60','0.45'],ans:'(B)',exp:'β<sub>p</sub>=0.6×0.74+0.4×1=0.844。'},
{ch:20,type:'mc',src:'101 中正財金',q:'SafeBet σ=25%、市場 σ=10%、ρ=0.4。當市場漲 1%，SafeBet 平均？',opts:['漲 0.4%','跌 0.4%','漲 1%','漲 2.5%'],ans:'(C)',exp:'β=ρσ<sub>i</sub>/σ<sub>M</sub>=0.4×0.25/0.10=1；市場漲 1% 則 SafeBet 漲 1%。'},
{ch:20,type:'mc',src:'101 中正財金',q:'E(R<sub>M</sub>)=14%、R<sub>f</sub>=5%、σ<sub>M</sub>=27%。CML 斜率（風險的市場價格）？',opts:['1.57','0.70','0.52','0.33'],ans:'(D)',exp:'斜率=(14%−5%)/27%=0.333。'},
{ch:20,type:'mc',src:'102 台大財金',q:'明年現金流量 $2M、σ=$300K；R<sub>M</sub>=12%、R<sub>f</sub>=6%、σ<sub>M</sub>=5%、ρ=0.5。CAPM 下現值？',opts:['$1,878,302','$1,820,000','$1,785,714','$1,716,981','$1,685,000'],ans:'(D)',exp:'β=ρσ<sub>CF</sub>/(CF<sub>0</sub>σ<sub>M</sub>)；代入 CAPM 解 CF<sub>0</sub>=$1,716,981。'},
{ch:20,type:'mc',src:'103 台大財金',q:'買 $20 股票，明年股利 $1.5、售價 $23；β=1.5、R<sub>f</sub>=6%、R<sub>M</sub>=18%。異常報酬？',opts:['−1.5%','−3.5%','2.5%','4.5%','6.5%'],ans:'(A)',exp:'要求報酬=6%+12%×1.5=24%；實際=(1.5+23−20)/20=22.5%；α=−1.5%。'},
{ch:20,type:'mc',src:'104 清大計財',q:'β=1.8 股票加 T-bill，使組合 β=1。T-bill 占比？',opts:['25%','44%','50%','62%','78%'],ans:'(B)',exp:'1=(1−w)×1.8+w×0→w=1−1/1.8=44.4%。'},
{ch:20,type:'mc',src:'104 成大財金',q:'負 β 資產的預期報酬？',opts:['必為正','高於 R<sub>f</sub>','低於 R<sub>f</sub>','等於市場'],ans:'(C)',exp:'E(R)=R<sub>f</sub>+(R<sub>M</sub>−R<sub>f</sub>)β；β<0→E(R)<R<sub>f</sub>（避險效果）。'},
{ch:20,type:'essay',src:'朝陽財金',q:'「CAPM 正確，市場必有效率」；「市場有效率，CAPM 必正確」，評論。',ans:'第一句對，第二句錯。',exp:'<p><b>第一句：</b>CAPM 描述均衡下資產報酬與系統風險的關係；若市場無效率，價格無法反映風險，CAPM 不成立。</p><p><b>第二句：</b>市場效率只要求價格反映資訊；但 CAPM 還需常態分配、單期、同質性預期等假設，這些不見得成立。故市場效率不蘊涵 CAPM 正確。</p>'},
{ch:20,type:'essay',src:'政大金融',q:'何謂分離定理（Separation Theorem）？對投資人最適風險資產組合的意義？',ans:'投資決策與融資決策分離；所有人皆持市場投資組合。',exp:'<p>存在無風險借貸時，由 R<sub>f</sub> 切效率前緣得切點組合 T（均衡即市場組合 M）。</p><p>所有投資人在風險資產部分都持有 M，再依風險偏好在 R<sub>f</sub> 與 M 間配置（借或貸）。</p><p>意義：(1) 選股與個別風險偏好無關；(2) 基金經理人只需建構 M；(3) 財務經理人不需顧及股東風險偏好，只追求 NPV>0。</p>'},
{ch:20,type:'essay',src:'104 台大財金',q:'CML 與 SML 的主要差異？',ans:'CML 橫軸為總風險 σ，SML 橫軸為系統風險 β。',exp:'<p><b>CML：</b>R<sub>f</sub> 與市場組合 M 的資本配置線；橫軸為總風險 σ；僅效率組合在線上。</p><p><b>SML：</b>CAPM 的結果；橫軸為系統風險 β；均衡下所有資產（含個股）都在線上。</p><p><b>關係：</b>CML 上的組合必在 SML 上；SML 上的資產不一定在 CML 上。</p>'},
{ch:20,type:'calc',src:'108 交大財金',q:'T-bill 3%、市場風險溢酬 7%。β=1.2 股票，E(R)=13%。(1) 要求報酬？(2) 高估或低估？',ans:'(1) 11.4%；(2) 低估',exp:'<p>(1) k=3%+7%×1.2=11.4%。</p><p>(2) E(R)=13%>k=11.4%，股價被低估，應買進；SML 上方。</p>'},

/* ---- 重點21 CAPM 實證與延伸 ---- */
{ch:21,type:'mc',src:'成大財金',q:'以「組合超額報酬/標準差」衡量風險與報酬取捨的指標？',opts:['Sharpe','Treynor','Jensen','Appraisal ratio'],ans:'(A)',exp:'Sharpe=(E(R<sub>p</sub>)−R<sub>f</sub>)/σ<sub>p</sub>，分母為總風險。'},
{ch:21,type:'mc',src:'政大金融',q:'Security A E(R)=0.10、β=1.1；R<sub>M</sub>=0.08、R<sub>f</sub>=0.05。α=？',opts:['3.2%','−2.7%','1.7%','5.5%'],ans:'(C)',exp:'α=10%−[5%+(8%−5%)×1.1]=10%−8.3%=1.7%。'},
{ch:21,type:'mc',src:'政大金融',q:'R<sub>f</sub>=6%。Fund A(24%,σ=30%,β=1.5)、B(12%,σ=10%,β=0.5)、C(22%,σ=20%,β=1.0)、S&P(18%,σ=16%,β=1)。最高 Sharpe？',opts:['A','B','C','A、B 平手','A、C 平手'],ans:'(C)',exp:'Sharpe<sub>A</sub>=(24−6)/30=0.6；B=(12−6)/10=0.6；C=(22−6)/20=0.8（最高）。'},

{ch:21,type:'mc',src:'108 政大財管',q:'R<sub>f</sub>=5%；A(15%,σ=30%,β=1.05)、B(25%,σ=35%,β=1.6)、C(20%,σ=25%,β=1.1)、S&P(15%,σ=20%)。已充分多角化，選哪個？',opts:['A','B','C','S&P'],ans:'(C)',exp:'Treynor：A=(15−5)/1.05=9.52%；B=(25−5)/1.6=12.5%；C=(20−5)/1.1=13.64%（最高）。'},
{ch:21,type:'essay',src:'朝陽財金',q:'Roll 對 CAPM 的批判（Roll\'s critique）為何？',ans:'無法找到真正市場組合，故 CAPM 不可檢定。',exp:'<p>(1) 真實世界沒有真正的市場組合（應含所有風險資產：股票、債券、房地產、人力資本）。</p><p>(2) 用任何代理變數（如加權股價指數）檢定，只是檢定該代理變數是否有效率，不是檢定 CAPM。</p><p>(3) 不同代理變數會得到不同結果，稱為「基準誤差」(benchmark error)。</p><p>(4) Roll 主張 CAPM 本質上不可檢定。</p>'},
{ch:21,type:'essay',src:'106 清大計財',q:'CML、SML、特徵線（Characteristics Line）三者差異？',ans:'橫軸分別為總風險 σ、系統風險 β、市場報酬 R<sub>M</sub>。',exp:'<p><b>CML：</b>E(R<sub>p</sub>)=R<sub>f</sub>+(E(R<sub>M</sub>)−R<sub>f</sub>)/σ<sub>M</sub>×σ<sub>p</sub>；橫軸為總風險 σ；僅效率組合在線上；斜率為市場風險價格。</p><p><b>SML：</b>E(R<sub>i</sub>)=R<sub>f</sub>+β<sub>i</sub>[E(R<sub>M</sub>)−R<sub>f</sub>]；橫軸為系統風險 β；均衡下所有資產皆在線上。</p><p><b>特徵線：</b>R<sub>i,t</sub>=α<sub>i</sub>+β<sub>i</sub>R<sub>M,t</sub>+ε<sub>i,t</sub>；橫軸為市場報酬；斜率即為 β；α 為 Jensen\'s α。</p>'},
{ch:21,type:'calc',src:'銘傳財金',q:'R<sub>f</sub>=6%。Fund A(13.6%,σ=40%,β=1.1)、B(13.1%,σ=25%,β=1.0)、C(12.4%,σ=30%,β=1.3)。Sharpe 最高與 Treynor 最高？',ans:'Sharpe=B(0.284)；Treynor=B(0.071)',exp:'<p>Sharpe：A=(13.6−6)/40=0.19；B=(13.1−6)/25=0.284；C=(12.4−6)/30=0.213。</p><p>Treynor：A=(13.6−6)/1.1=6.91%；B=(13.1−6)/1.0=7.1%；C=(12.4−6)/1.3=4.92%。</p>'},
{ch:21,type:'calc',src:'107 政大金融',q:'充分多角化組合 β=1.25、σ=20%。市場組合 σ=？',ans:'16%',exp:'充分多角化→非系統風險=0；σ<sub>p</sub>²=β²σ<sub>M</sub>²→0.04=1.5625×σ<sub>M</sub>²→σ<sub>M</sub>=16%。'},

{ch:22,type:'mc',src:'中山財管',q:'CAPM 與 APT 的主要差異？',opts:['CAPM 建立在風險-報酬優越性；APT 建立在無套利條件','CAPM 需多數小交易重回均衡；APT 少數大額套利即可','APT 對價格的含意較強','以上皆是'],ans:'(D)',exp:'CAPM 是均衡模型（所有投資人微調組合）；APT 是無套利模型（少數套利者大額交易即可歸均衡）。'},
{ch:22,type:'mc',src:'中山財管',q:'Fama-French 對 CAPM 的挑戰為何？',opts:['平均報酬與 P/E、M/B 負相關','P/E 與 M/B 只是眾多因子之二','1941–1990 報酬與 β 關係薄弱、1963–1990 無關係','(A)(C) 皆是','(B)(C) 皆是'],ans:'(D)',exp:'Fama-French 發現單一市場 β 解釋力不足，需加入規模(SMB)與價值(HML)因子。'},

{ch:22,type:'mc',src:'台大財金',q:'有關 CAPM 與 APT，何者有誤？',opts:['APT 多因子；CAPM 單因子','APT 不需假設報酬常態分配','APT 不需市場組合在效率前緣','APT 只是 CAPM 的特例'],ans:'(D)',exp:'CAPM 是均衡模型；APT 是無套利模型，無誰是特例。'},

{ch:22,type:'mc',src:'104 台大財金',q:'Factor 1 溢酬 6%、Factor 2 溢酬 4%、R<sub>f</sub>=4%。Stock A E(R)=16%、β<sub>1</sub>=1.3，β<sub>2</sub>=？',opts:['0.875','1.050','0.050','2.050','0.375'],ans:'(B)',exp:'16%=4%+1.3×6%+β<sub>2</sub>×4%→β<sub>2</sub>=1.05。'},
{ch:22,type:'mc',src:'105 台大財金',q:'E(R)=10.89%、β<sub>1</sub>=0.9、β<sub>2</sub>=1.1；Factor 1 溢酬 3.2%、R<sub>f</sub>=3.5%。Factor 2 風險溢酬？',opts:['9.26%','3%','4.1%','0.6%','4.51%'],ans:'(C)',exp:'10.89%=3.5%+0.9×3.2%+1.1×λ<sub>2</sub>→λ<sub>2</sub>=4.1%。'},

{ch:22,type:'mc',src:'107 中正財金',q:'單因子 APT，負的因子 β。該證券？',opts:['必有正報酬','E(R)>R<sub>f</sub>','實際報酬可正可負可零','E(R)=市場報酬'],ans:'(C)',exp:'β<0→E(R)<R<sub>f</sub>（避險效果）；但實際報酬仍受誤差項影響，可正可負。'},
{ch:22,type:'essay',src:'朝陽財金',q:'CAPM 與 APT 的差異？',ans:'單因子 vs 多因子；均衡模型 vs 無套利模型。',exp:'<p><b>(1) 因子數：</b>CAPM 單一市場因子；APT 多個系統風險因子。</p><p><b>(2) 理論基礎：</b>CAPM 建立在平均數-變異數效用與均衡；APT 建立在無套利條件。</p><p><b>(3) 假設：</b>CAPM 需報酬常態分配、市場組合效率；APT 不需常態分配、不需市場組合。</p><p><b>(4) 回歸均衡：</b>CAPM 需多數投資人微調；APT 少數套利者大額交易即可。</p><p><b>(5) 因子認定：</b>APT 因子需實證決定；CAPM 即市場組合。</p>'},
{ch:22,type:'essay',src:'106 台大財金',q:'CAPM 與 Fama-French 三因子模型的差異？',ans:'CAPM 單因子理論模型；FF 三因子實證模型。',exp:'<p><b>CAPM：</b>理論模型，僅以市場 β 決定預期報酬，需同質性預期、完美市場等假設。</p><p><b>FF 三因子：</b>實證模型，除市場溢酬 (R<sub>M</sub>−R<sub>f</sub>) 外，加入：</p><p>· SMB（Small Minus Big）：小規模公司減大規模公司報酬（規模效應）。</p><p>· HML（High Minus Low）：高帳市值比減低帳市值比（價值效應）。</p><p>實證上 FF 三因子解釋力優於單因子 CAPM。</p>'},
{ch:22,type:'calc',src:'103 台北大金融',q:'三因子 APT：GNP 溢酬 7%、能源價格 −1%、長期利率 4%。某股票對 GNP 與長期利率 β=1.2，對能源 β=−2.3。R<sub>f</sub>=5%，E(R)=？',ans:'20.5%',exp:'E(R)=5%+1.2×7%+(−2.3)×(−1%)+1.2×4%=5%+8.4%+2.3%+4.8%=20.5%。'},
{ch:22,type:'calc',src:'政大金融',q:'一因子 APT：充分多角化組合 A β=1.0、E(R)=19%；B β=1.5、E(R)=24%。無套利空間下 R<sub>f</sub>？',ans:'9%',exp:'聯立：19%=R<sub>f</sub>+1.0λ；24%=R<sub>f</sub>+1.5λ→λ=10%、R<sub>f</sub>=9%。'},

{ch:23,type:'mc',src:'105 政大金融',q:'XYZ 公告 EPS 增 15%，但市場預期增 10%，之後五個交易日股價逐日上漲。這是？',opts:['不效率市場','投機','效率市場'],ans:'(A)',exp:'好消息應一次反應完畢；連續五日慢慢漲代表反應不足，違反半強式效率。'},
{ch:23,type:'mc',src:'107 政大財管',q:'依 EMH，何者正確？I. 專業投資人長期無利可圖 II. 每支股票皆有支撐/壓力 III. 用已公開財報預測股價，基本分析終將失敗 IV. 主動型基金多無法打敗大盤，故被動策略勝出',opts:['I、III','II、IV','III、IV','I、IV'],ans:'(C)',exp:'I 錯（可賺正常報酬）；II 錯（技術分析無效）；III、IV 正確。'},
{ch:23,type:'essay',src:'成大財金',q:'評論「只有當足夠多投資人認為市場不效率時，市場才會有效率。」',ans:'效率市場矛盾（Paradox of EMH）。',exp:'<p>若所有人都相信市場效率，就沒有人願意花資源分析證券，市場反而失去效率。</p><p>事實上，正是一群認為市場不效率的套利者，積極尋找錯誤訂價並交易，才使價格迅速反映資訊，造就了效率。</p><p>這就是 Grossman-Stiglitz 的效率市場矛盾：「免費的午餐」（超額報酬）必須存在，以補償分析者花費的資訊成本。</p>'},
{ch:23,type:'essay',src:'成大財金',q:'說明三種形式的市場效率及其對證券分析師的意義。',ans:'弱式/半強式/強式，對應歷史/公開/所有資訊。',exp:'<p><b>弱式：</b>股價反映所有歷史資訊→技術分析無效；基本分析仍可能有用。</p><p><b>半強式：</b>股價反映所有公開資訊→技術分析、基本分析皆無效；只有內線交易可能獲利。</p><p><b>強式：</b>股價反映所有資訊（含內線）→任何分析都無效，連內線交易都無法獲利。</p><p><b>關係：</b>強式⊃半強式⊃弱式；強式成立則半強、弱式必成立；反之不必然。</p>'},
{ch:23,type:'essay',src:'淡江財金',q:'何謂隨機漫步假說？與 EMH 的關係？對證券分析的意義？',ans:'P<sub>t</sub>=P<sub>t−1</sub>+ε<sub>t</sub>，ε 為 iid。',exp:'<p><b>隨機漫步：</b>股價變動由不可預測的新資訊決定，前後期報酬無關。</p><p><b>關係：</b>隨機漫步是弱式效率的充分表現；EMH 三形式皆隱含隨機漫步。</p><p><b>意義：</b>技術分析無效；投資人應根據風險偏好分散投資，並用基本分析評估真實價值；長期只能賺取正常（風險調整後）報酬。</p>'},
{ch:23,type:'essay',src:'台大財金',q:'何謂事件研究法？與市場效率的關係？',ans:'檢定事件前後 CAR，判斷股價反應速度。',exp:'<p><b>步驟：</b>(1) 定義事件日；(2) 估計正常報酬；(3) 計算異常報酬 AR 與累積異常報酬 CAR；(4) 統計檢定。</p><p><b>判讀：</b>若 CAR 在事件日一次跳升後趨平穩→半強式效率；若事件日後持續漂移→反應不足/過度反應，違反半強式。</p>'},

{ch:24,type:'mc',src:'中山財管',q:'行為財務學對 EMH 的主要批評？',opts:['投資人永遠理性','套利者風險趨避','投資人同質性預期','投資人有系統性行為偏誤','市場均衡存在'],ans:'(D)',exp:'行為財務學認為人們有固定偏誤（過度自信、损失趨避等），使價格持續偏離基本價值。'},
{ch:24,type:'mc',src:'成大財金',q:'投資人避免不尋常決策，因為不好結果會特別後悔。此為？',opts:['過度自信 Overconfidence','避免後悔 Regret Avoidance','代表性 Heuristic','心理帳戶 Mental Accounting'],ans:'(B)',exp:'Regret avoidance：與眾不同的決策若失敗，後悔特別強烈，因此傾向從眾。'},
{ch:24,type:'mc',src:'政大財管',q:'CEO 持續在高股價時併購，績效事後不如預期。此為？',opts:['避免後悔','家鄉偏誤','過度自信 Overconfidence','處置效果','保守偏誤'],ans:'(C)',exp:'Overconfidence：CEO 高估自己判斷能力，導致併購案過度溢價。'},
{ch:24,type:'mc',src:'中山財管',q:'投資人將過高比例資金放在本國資產。此為？',opts:['處置效果','錨定效果','過度反應','家鄉偏誤 Home Bias'],ans:'(D)',exp:'Home Bias：因資訊不對稱、熟悉度、法規限制，投資人超配本國資產。'},
{ch:24,type:'mc',src:'政大財管',q:'投資人接受新資訊後改變信念過於緩慢。此為？',opts:['過度反應','代表性偏誤','保守偏誤 Conservatism','心理帳戶'],ans:'(C)',exp:'Conservatism：對新資訊反應不足，造成動量效果（反應不足後續續漲）。'},
{ch:24,type:'mc',src:'成大財金',q:'12 月賣出帳面損失股節稅，1 月重回股市。此為？',opts:['週末效應','月份效應','日內效應','元月效應 January Effect'],ans:'(D)',exp:'January effect：小公司股價在 1 月異常上漲，節稅賣壓 12 月後解除。'},

{ch:24,type:'mc',src:'政大財管',q:'Tversky-Kahneman 展望理論認為人們？',opts:['獲利時風險趨避、損失時風險愛好','獲利時風險愛好、損失時風險趨避','皆風險趨避','皆風險愛好'],ans:'(A)',exp:'S 形價值函數：獲利凹函數（趨避）、損失凸函數（愛好）；損失趨避。'},
{ch:24,type:'mc',src:'政大財管',q:'獲利時過早賣出、虧損時惜售。此為？',opts:['Disposition Effect','House Money','Endowment Effect','Recency Bias'],ans:'(A)',exp:'處置效果：急售獲利、長抱損失，違反理性（應停損）。'},
{ch:24,type:'essay',src:'政大金融',q:'舉三個財務金融上的市場異常（anomaly），並說明違反何種效率。',ans:'元月效應、規模效應、本益比效應。',exp:'<p><b>(1) 元月效應：</b>小公司 1 月報酬異常偏高→違反弱式/半強式效率。</p><p><b>(2) 規模效應：</b>風險調整後小公司報酬高於大公司→違反半強式效率。</p><p><b>(3) P/E 效應：</b>低 P/E 股風險調整報酬高於高 P/E 股→違反半強式效率。</p><p>其他：週末效應、動量效果、帳市值比效應、IPO 長期偏弱、SEOs 後續弱勢。</p>'},
{ch:24,type:'essay',src:'政大財管',q:'解釋 Efficient Market Paradox（效率市場悖論）。',ans:'Grossman-Stiglitz：取得訊息需成本，故完全效率不存在。',exp:'<p>若市場完全效率，取得訊息無利可圖，沒有人願意花成本研究。</p><p>但若所有人都不研究，價格就不會反映訊息，市場反而不效率。</p><p>因此現實市場必然存在少量「訊息套利利潤」，以補償分析者花費的資訊成本。</p><p>這也解釋了為何主動型基金經理人仍存在，且部分能獲得超額報酬。</p>'},

{ch:25,type:'essay',src:'台大財金',q:'開放型基金與封閉型基金的比較？',ans:'開放型隨時申購贖回、按 NAV；封閉型固定規模、市價可能折溢價。',exp:'<p><b>開放型：</b>(1) 隨時依 NAV 申購贖回；(2) 每天單一淨值；(3) 無折溢價；(4) 有現金流入流出壓力，長期績效通常較差。</p><p><b>封閉型：</b>(1) 發行單位數固定，上市後集中市場交易；(2) 每天有市價與 NAV 兩種報價；(3) 市價可能折價或溢價；(4) 無贖回壓力，經理人可長期布局。</p>'},
{ch:25,type:'essay',src:'清大計財',q:'投資 ETF 的優點？',ans:'被動追蹤指數、低費用、盤中交易、分散風險、透明度高。',exp:'<p>(1) 兼具股票（盤中交易）與共同基金（分散、NAV）特性。</p><p>(2) 管理費遠低於主動式共同基金。</p><p>(3) 被動追蹤指數，持股透明。</p><p>(4) 一檔 ETF 等於投資一籃子標的，分散非系統風險。</p><p>(5) 涵蓋全球股票、債券、商品、不動產、匯率等多元資產。</p>'},
{ch:25,type:'calc',src:'高科大金融',q:'指數含 A(50 股×$2)、B(10 股×$10)；價格加權指數基期 $6、價值加權指數基期 100。A 股價漲到 $4，新指數值？',ans:'價格加權=7；價值加權=150',exp:'<p>價格加權：新指數=(4+10)/2=7。</p><p>價值加權：新指數=[(4×50+10×10)/(2×50+10×10)]×100=(300/200)×100=150。</p>'},

{ch:26,type:'mc',src:'107 成大財金',q:'Kotomin：1,000,000 股@$90，增資 $8M@$80。新股數/每幾權/權值/除權價？',opts:['100,000 / 8 / $1.38 / $88.62','100,000 / 9 / $1.05 / $88.95','100,000 / 10 / $0.91 / $89.09','120,000 / 8 / $1.05 / $88.95'],ans:'(C)',exp:'新股=8M/80=100,000；權數=1,000,000/100,000=10；除權價=(90×1M+80×0.1M)/1.1M=89.09；權值=90−89.09=0.91。'},

{ch:26,type:'essay',src:'暨南財金',q:'說明原股東認購（rights offering）的細節與認購權價值。',ans:'依持股比例優先認購；權值=除權前股價−除權參考價。',exp:'<p><b>目的：</b>(1) 維持原股東控制權；(2) 保護股權價值免於稀釋。</p><p><b>機制：</b>原股東每股配 1 權；每 N 張權利可以認購 1 股新股（認購價通常低於市價）。</p><p><b>除權參考價：</b>P<sub>ex</sub>=(N×P<sub>pre</sub>+P<sub>sub</sub>)/(N+1)。</p><p><b>權值：</b>R=P<sub>pre</sub>−P<sub>ex</sub>。</p><p>原股東可認購、賣出權利或任其失效；在完美市場下三種方式財富相同。</p>'},
{ch:26,type:'essay',src:'104 政大金融',q:'為何小股東偏好累積投票制？',ans:'可集中票數保障少數派席次。',exp:'<p><b>直接投票制：</b>每股每席可投 1 票，票必須分散給各候選人；大股東只要過半股數即可全數當選。</p><p><b>累積投票制：</b>每股可投「持股×應選人數」票，可集中投給少數候選人；小股東團結配票仍可取得部分席次。</p><p><b>當選門檻：</b>少數派股數 ≥ (總股數×席次)/(應選+1)+1 即可保 1 席。</p>'},
{ch:26,type:'calc',src:'103 政大金融',q:'Image Storage：1,000,000 股、現價 $50，發行 500,000 新股@$47。每張認購權價值？',ans:'$1',exp:'除權參考價=(1,000,000×50+500,000×47)/1,500,000=49；權值=50−49=1。'},
{ch:26,type:'calc',src:'102 交大財金',q:'TouchOne：3.6M 股@$22，增資 $18M@$20。(1) 除權價？(2) 權值？',ans:'P<sub>ex</sub>=$21.6；R=$0.4',exp:'<p>新股數=18M/20=900,000。</p><p>除權價=(3.6M×22+900K×20)/4.5M=(79.2M+18M)/4.5M=21.6。</p><p>權值=22−21.6=0.4。</p>'},
{ch:26,type:'calc',src:'中原財金',q:'大明公司 1,000 萬股，少數派 230 萬股，應選 7 席董事，採累積投票。少數派配票正確至少當選幾席？',ans:'至少 1 席',exp:'當選所需股數=(總股數×席次)/(應選+1)+1=(10M×1)/8+1=1,250,001；230 萬股可保障 1 席（依公式 y=(2,300,000×8−1)/10,000,000≈1.84）。'},

/* ---- 重點27 股利折現模型與 NPVGO ---- */
{ch:27,type:'mc',src:'政大財管',q:'Marison 明年股利 $5、payout=50%、g=8%、k=13%。PVGO？',opts:['$76.92','$62.50','$38.46','$23.08'],ans:'(D)',exp:'P=5/(0.13−0.08)=100；EPS=5/0.5=10；零成長價值=10/0.13=76.92；PVGO=100−76.92=23.08。'},
{ch:27,type:'mc',src:'清大計財',q:'James River 固定每年 $1.5 股利。股價評價方式？',opts:['毫無價值','等於 $1.5 一年後現值','視為永續年金','g=3% 成長','$15'],ans:'(C)',exp:'零成長 DDM：P=D/k=1.5/k，為永續年金。'},
{ch:27,type:'mc',src:'高大金管',q:'NUK 過去三年股利 $1.40、$1.75、$2.00，未來維持固定。k=12%，最高願意付？',opts:['$10','$13.33','$16.67','$18.88','$20'],ans:'(C)',exp:'零成長 P=D/k=2.00/0.12=16.67。'},
{ch:27,type:'mc',src:'高大金管',q:'PVGO（成長機會現值）等於？',opts:['股價與零成長價值之差','ROE=k 時為零','有利投資機會的 NPV 總和','以上皆是'],ans:'(D)',exp:'P=EPS/k+PVGO；ROE=k 時投資無超額報酬，PVGO=0。'},
{ch:27,type:'mc',src:'成大財金',q:'β 上升時，股價？',opts:['不變','上升','下降','資訊不足'],ans:'(C)',exp:'β↑→k↑（CAPM）→P=D/(k−g)↓。'},
{ch:27,type:'mc',src:'中正財金',q:'Company B 去年 $1 股利，未來 payout=40%、ROE=10%、k=12%。股價？',opts:['$12.50','$13.00','$16.67','$17.67'],ans:'(D)',exp:'g=ROE×b=10%×60%=6%；P=1×1.06/(0.12−0.06)=17.67。'},
{ch:27,type:'mc',src:'中正財金',q:'ABC：D<sub>0</sub>=$2、g=5%、β=1.5、R<sub>M</sub>=15%、R<sub>f</sub>=7%。β 升到 1.75，股價不變的新 g？',opts:['8.85%','18.53%','6.76%','5.88%'],ans:'(C)',exp:'k<sub>old</sub>=7%+8%×1.5=19%；P=2×1.05/(0.19−0.05)=15；k<sub>new</sub>=7%+8%×1.75=21%；15=2×(1+g)/(0.21−g)→g=6.76%。'},
{ch:27,type:'mc',src:'政大財管',q:'Risky Electronics 無股利、$40；R<sub>f</sub>=5%、R<sub>M</sub>=10%。預期下一期 $42，β=？',opts:['0.22','−0.90','4.5','0.0','以上皆非'],ans:'(D)',exp:'k=(42−40)/40=5%=R<sub>f</sub>；由 CAPM：5%=5%+5%β→β=0。'},
{ch:27,type:'mc',src:'台大財金',q:'貝他 1.5、$20、g=10%、R<sub>f</sub>=8%、D<sub>0</sub>=$2.5。市場風險溢酬？',opts:['10.50%','12.00%','14.41%','15.23%','17.00%'],ans:'(A)',exp:'k=2.5×1.10/20+10%=23.75%；23.75%=8%+(R<sub>M</sub>−R<sub>f</sub>)×1.5→溢酬=10.5%。'},
{ch:27,type:'mc',src:'中正財金',q:'固定 payout=0.15、ROE=20%。何者正確？',opts:['保留 80% 盈餘','保留盈餘使帳面權益增加 17%','每股付 15 分股利','盈餘每年成長 17%'],ans:'(D)',exp:'g=ROE×b=20%×85%=17%；盈餘以 17% 成長。'},
{ch:27,type:'mc',src:'102 政大財管',q:'特別股未來都不發股利成長，可用何種評價公式？',opts:['g>k 時用','股利不預期成長時用','股利成長非常數時用','投資人不打算賣出時用','公司把所有盈餘發放時用'],ans:'(B)',exp:'零成長 DDM 即永續年金：P=D/k。'},
{ch:27,type:'mc',src:'103 成大財金',q:'Lory：NI $127K、股利 $38,100、權益 $1,587,500；100K 股@$11.625。要求報酬率？',opts:['4.2%','6%','9%','14%'],ans:'(C)',exp:'ROE=127K/1,587.5K=8%；b=1−38.1/127=70%；g=8%×70%=5.6%；k=0.381×1.056/11.625+5.6%≈9%。'},
{ch:27,type:'mc',src:'104 交大財金',q:'Clouding：k=18%、D<sub>0</sub>=$2、股價 $57。固定 g？',opts:['5.0%','8.50%','14.0%','28.5%'],ans:'(C)',exp:'57=2×(1+g)/(0.18−g)→g=14%。'},
{ch:27,type:'mc',src:'107 台大財金',q:'XYZ：明年 EPS=$3、ROE=16%、k=12%、payout=40%。內含價值？',opts:['$32.14','$30.00','$10.00','$50.00'],ans:'(D)',exp:'g=16%×60%=9.6%；D<sub>1</sub>=3×40%=1.2；P=1.2/(0.12−0.096)=50。'},
{ch:27,type:'mc',src:'108 中正財金',q:'FL 上週付 $1 股利，未來每年 5% 成長。k=14%，股價？',opts:['$7.14','$7.50','$11.11','$11.67'],ans:'(D)',exp:'P=1×1.05/(0.14−0.05)=11.67。'},
{ch:27,type:'essay',src:'文化國貿',q:'說明戈登模式（Gordon Model）。',ans:'P=D<sub>1</sub>/(k−g)，固定成長 DDM。',exp:'<p><b>公式：</b>P<sub>0</sub>=D<sub>1</sub>/(k−g)=D<sub>0</sub>(1+g)/(k−g)。</p><p><b>假設：</b>(1) 股利永續固定成長；(2) g 為常數；(3) k>g；(4) 公司永續經營。</p><p><b>三因子：</b>D<sub>1</sub>（明年股利）、k（要求報酬率）、g（股利成長率）。</p><p><b>g：</b>g=ROE×b，b 為盈餘保留率。</p>'},
{ch:27,type:'essay',src:'政大金融 104',q:'說明 NPVGO 模型：股價=零成長價值+成長機會現值。',ans:'P=EPS/k+PVGO；ROE>k 時 PVGO>0。',exp:'<p><b>公式：</b>P<sub>0</sub>=EPS<sub>1</sub>/k+PVGO。</p><p><b>零成長價值：</b>公司把所有盈餘發放，g=0，P=EPS/k。</p><p><b>PVGO：</b>未來投資機會的 NPV 折現。</p><p><b>關鍵：</b>ROE>k 時保留盈餘創造價值，PVGO>0；ROE<k 時成長反而毀損價值，PVGO<0。</p>'},
{ch:27,type:'calc',src:'中央財金',q:'Sarro：永續盈餘 $1M（100K 股，EPS=$10）；Date 1 投資 $1M 於新行銷案，永續增加 EPS $2.10（ROI=21%），k=10%。(1) 接受前股價？(2) 接受後股價？',ans:'(1) $100；(2) $110',exp:'<p>(1) 零成長 P=10/0.10=100。</p><p>(2) 新案 NPV=−1M+210K/0.10=1.1M；每股 NPVGO=1.1M/100K=11；P=100+10=110。</p>'},
{ch:27,type:'calc',src:'台北大金融 102',q:'台積電 ROE=20%、EPS=$6、D<sub>0</sub>=$3.6、k=11%。(1) 固定 g 下股價？(2) 全部發放下股價？(3) 差異稱為？(4) 何種條件下 (1)>(2)？',ans:'(1) $129.6；(2) $54.55；(3) PVGO；(4) ROE>k',exp:'<p>(1) b=40%、g=20%×40%=8%；P=3.6×1.08/(0.11−0.08)=129.6。</p><p>(2) b=0、g=0；P=6/0.11=54.55。</p><p>(3) PVGO=129.6−54.55=75.05。</p><p>(4) ROE(20%)>k(11%) 時，保留盈餘創造正 NPV。</p>'},
{ch:27,type:'calc',src:'106 政大金融',q:'股票現價 $50、預期 EPS=$6、k=20%。PVGO？',ans:'$20',exp:'零成長價值=EPS/k=6/0.20=30；PVGO=50−30=20。'},
{ch:27,type:'calc',src:'104 交大財金',q:'下年 EPS=$10、b=35%、ROE=20%、k=15%。固定成長下，(1) 現價？(2) 下一期預期股價？',ans:'(1) $81.25；(2) $86.94',exp:'<p>(1) D<sub>1</sub>=10×(1−0.35)=6.5；g=20%×0.35=7%；P=6.5/(0.15−0.07)=81.25。</p><p>(2) P<sub>1</sub>=P<sub>0</sub>×(1+g)=81.25×1.07=86.94。</p>'},

/* ---- 重點28 其他普通股評價模式 ---- */
{ch:28,type:'mc',src:'成大財金',q:'何者會使本益比偏高？I. 產業前景黯淡 II. 公司成長前景佳 III. 目前盈餘偏低 IV. 投資人評價負面',opts:['I、II','II、III','II、IV','I、III'],ans:'(B)',exp:'成長前景佳→g 高；目前盈餘低→EPS<sub>1</sub> 暫時性低，皆推高 P/E。'},
{ch:28,type:'mc',src:'東吳國貿',q:'哪種普通股評價法因考量預期盈餘而較佳？',opts:['清算價值','帳面價值','P/E 乘數法','利息現值'],ans:'(C)',exp:'P<sub>0</sub>=E(EPS<sub>1</sub>)×合理 P/E，納入未來盈餘預期。'},
{ch:28,type:'mc',src:'中山財管',q:'公司想最大化股價，何種情況下應把盈餘盡量發放為股利？',opts:['投資人不在乎報酬形式','未來 g 低於歷史','仍有正現金流','未來 ROE 低於市場折現率'],ans:'(D)',exp:'ROE<k 時保留盈餘創造負 NPVGO，應發放股利。'},
{ch:28,type:'mc',src:'政大金融',q:'XYZ：k=20%、ROE=13%、EPS<sub>1</sub>=$3.60、plowback=50%。P/E？',opts:['9.09','8.33','7.69','11.11','以上皆非'],ans:'(E)',exp:'g=13%×50%=6.5%；P/E=(1−50%)/(20%−6.5%)=3.70。'},
{ch:28,type:'mc',src:'中山財管',q:'分析師預估市場 EPS=$43.50、P/E=26、payout=65%。市場指數值？',opts:['396','735','1,131','1,866'],ans:'(C)',exp:'指數值=P/E×EPS=26×43.5=1,131。'},
{ch:28,type:'mc',src:'政大金融',q:'關於基金風格，何者正確？',opts:['低 P/E 積極型、高 P/E 成長型','高 P/E 積極型、低 P/E 成長型','低 P/E 價值型、高 P/E 成長型','高 P/E 價值型、低 P/E 成長型'],ans:'(C)',exp:'低 P/E=價值型；高 P/E=成長型。'},
{ch:28,type:'mc',src:'中山財管',q:'P/E 與成長率、折現率、風險的關係？',opts:['正、正、負','負、正、正','正、負、負','負、負、正'],ans:'(C)',exp:'P/E=d/(k−g)；g↑→P/E↑；k↑→P/E↓；風險↑→k↑→P/E↓。'},
{ch:28,type:'mc',src:'台大財金',q:'XYZ 全權益公司、100% 發放股利、EPS 固定 $10、P/E=13。k=？',opts:['7.7%','8.25%','10%','13%','14%'],ans:'(A)',exp:'g=0；P/E=1/k=13→k=1/13=7.69%。'},
{ch:28,type:'mc',src:'台大財金',q:'何者會降低 P/E？',opts:['大幅降低財務槓桿','長期 ROE 提高','通膨預期升到兩位數','T-bill 利率下降'],ans:'(C)',exp:'通膨↑→k↑→P/E↓。'},
{ch:28,type:'mc',src:'100 清大計財',q:'FTE（Flow-to-Equity）法？',opts:['以 WACC 折現全體現金流','規模擴張折扣法','以 k<sub>E</sub> 折現流向股東的槓桿現金流','股東的股利與資本利得','以 WACC 折現無槓桿現金流'],ans:'(C)',exp:'FTE 法：FCFE 以權益資金成本 k<sub>E</sub> 折現。'},
{ch:28,type:'mc',src:'101 中正財金',q:'FCF 評價法？',opts:['股價=所有 FCF 現值','股價=企業價值減負債與特別股','企業價值=以 k<sub>E</sub> 折現 FCF','股價=FCF×WACC'],ans:'(B)',exp:'先以 WACC 折現 FCF 得企業價值 EV；再扣負債、特別股得股權價值。'},
{ch:28,type:'mc',src:'108 成大財金',q:'Leak：Y1 FCF=−$50、Y2=$100、WACC=11%、Y2 後 g=5%。Y0 營運價值？',opts:['$1,456M','$1,529M','$1,606M','$1,686M','$1,770M'],ans:'(A)',exp:'V=−50/1.11+100/1.11²+[100×1.05/(0.11−0.05)]/1.11²=1,456。'},
{ch:28,type:'essay',src:'台科大財金',q:'何謂自由現金流量（FCF）？如何用 FCF 評估公司價值？優缺點？',ans:'OCF−必要投資；以 WACC 折現得企業價值。',exp:'<p><b>定義：</b>FCF=EBIT(1−t)+折舊−資本支出−ΔNWC；公司可自由分配給債權人與股東的現金。</p><p><b>評價：</b>EV=ΣFCF<sub>t</sub>/(1+WACC)<sup>t</sup>；股權價值=EV−負債−特別股。</p><p><b>優點：</b>反映公司真正價值來源；WACC 已考慮風險與時間價值。</p><p><b>缺點：</b>FCF 不易估計；WACC 受未來資本結構與風險影響。</p>'},
{ch:28,type:'essay',src:'台大財金',q:'P/E 與 (1) 風險、(2) 成長率、(3) 股利發放率的關係？',ans:'風險負向、成長率正向、股利發放率不一定。',exp:'<p><b>(1) 風險：</b>風險↑→k↑→P/E↓（負向）。</p><p><b>(2) 成長率：</b>g↑→P/E↑（正向）。</p><p><b>(3) 股利發放率 d：</b>視 ROE 與 k 相對大小：</p><p>· ROE>k：d↑→保留率↓→g↓→P/E↓（負向）。</p><p>· ROE=k：P/E 不變。</p><p>· ROE<k：d↑→P/E↑（正向）。</p>'},
{ch:28,type:'calc',src:'淡江財金',q:'XYZ：EBIT=$20M、資本支出+ΔNWC=$7.5M、折舊=$4M、全權益、t=30%、k=12%、g=8%。(1) 股權價值？(2) 利率 9% 時，最多借多少還能維持 NI≥0？',ans:'(1) $262.5M；(2) $222.22M',exp:'<p>(1) FCF=20×(1−0.30)+4−7.5=10.5M；VE=10.5/(0.12−0.08)=262.5M。</p><p>(2) (20M−I)×(1−0.30)≥0→I≤20M→D≤20M/0.09=$222.22M。</p>'},
{ch:28,type:'calc',src:'淡江財金',q:'ABC：P/E<sub>0</sub>=15、payout=30%、g=10%。(1) Gordon 隱含 k<sub>E</sub>？(2) k=25% 時 P/E？(3) k=15%、g=8% 時 P/E？',ans:'(1) 12.2%；(2) 2.2；(3) 4.63',exp:'<p>(1) k=0.3×(1+0.1)/15+0.1=12.2%。</p><p>(2) P/E=0.3×1.1/(0.25−0.10)=2.2。</p><p>(3) P/E=0.3×1.08/(0.15−0.08)=4.63。</p>'},

{ch:29,type:'mc',src:'高大亞太',q:'關於可贖回債券，何者正確？I. 必按面額贖回 II. 利率下降時會被贖回 III. 持有人或發行人皆可要求 IV. 要求報酬高於不可贖回',opts:['I、II','II、IV','II、III','I、II、III'],ans:'(B)',exp:'可贖回權對發行人有利，故要求報酬較高；利率下降時發行人會贖回高息舊債。'},
{ch:29,type:'mc',src:'元智財金',q:'債券附認股權證（warrants）作為 sweetener 會？',opts:['降低債券價值','提高債券價值','增加風險','提高要求報酬'],ans:'(B)',exp:'認股權證是買權，增加債券價值、降低要求報酬。'},
{ch:29,type:'mc',src:'台大財金',q:'低利率時，純粹債券與可贖回債券價格關係？',opts:['純粹債券 > 可贖回債券','純粹債券 < 可贖回債券','皆相同','可贖回不變'],ans:'(A)',exp:'低利率時純粹債券價格可無限上升；可贖回受贖回價上限。'},

{ch:29,type:'essay',src:'淡江國貿',q:'償債基金的兩種方式？利率上升/下降時公司選哪種？',ans:'(1) 公開市場買回；(2) 依面額抽籤贖回。利率上升選 (1)；利率下降選 (2)。',exp:'<p><b>兩種方式：</b>(1) 公開市場買回；(2) 依面額抽籤贖回。</p><p><b>利率上升：</b>債券市價下跌，公開市場買回較便宜→選 (1)。</p><p><b>利率下降：</b>債券市價上漲，依面額贖回較便宜→選 (2)。</p>'},
{ch:29,type:'essay',src:'政大財管',q:'何謂墮落天使（Fallen Angels）？',ans:'原投資等級被降為投機等級的債券。',exp:'<p>墮落天使：原本為投資等級（BBB 以上）的公司債，因公司財務惡化被信用評等機構調降評等，淪為投機等級（BB 以下）的債券。</p><p>與「垃圾債券」差異：垃圾債券泛指所有投機等級債券（含一開始就高槓桿發行的）；墮落天使是「由好變壞」的子集。</p>'},
{ch:29,type:'essay',src:'106 清大計財',q:'債券何時平價發行？浮動利率債券應折價/平價/溢價發行？',ans:'票面利率=市場 YTM 時平價；浮動利率債始終平價。',exp:'<p><b>平價發行條件：</b>票面利率=市場要求殖利率。</p><p><b>浮動利率債：</b>票面利率隨指標（如 LIBOR）調整，故市價始終貼近平價。</p><p><b>折價：</b>票面利率<市場 YTM。</p><p><b>溢價：</b>票面利率>市場 YTM。</p>'},

{ch:30,type:'mc',src:'政大國貿',q:'15 年期半年付息、$1,324.23、EAR=8.16%（半年 4%）。每年付多少？',opts:['$64.81','$56.37','$117.50','$132.19'],ans:'(C)',exp:'1,324.23=C×[1−1.04⁻³⁰]/0.04+1000/1.04³⁰→半年 C≈58.75→年息 117.50。'},
{ch:30,type:'mc',src:'成大財金',q:'4 年期、10% 年息、$1,000、YTM=12%。當期收益率（current yield）？',opts:['9.39%','10.00%','10.65%','12.00%'],ans:'(C)',exp:'P=100×[1−1.12⁻⁴]/0.12+1000/1.12⁴=939.25；CY=100/939.25=10.65%。'},
{ch:30,type:'mc',src:'中正財金',q:'YTM<CR 時，債券為 __，市場利率上升會 __。',opts:['折價；減小折價','折價；增加折價','溢價；減小溢價','溢價；增加溢價'],ans:'(C)',exp:'YTM<CR→溢價；利率↑→價格↓→溢價縮小。'},
{ch:30,type:'mc',src:'RWJJ',q:'零息債 $463.34、$1,000、25 年。第一年隱含利息？',opts:['$9.08','$12.56','$14.48','$21.47','$31.25'],ans:'(C)',exp:'YTM=(1000/463.34)^(1/25)−1=3.125%；第一年利息=463.34×3.125%=14.48。'},
{ch:30,type:'mc',src:'100 清大計財',q:'5 年期、7% 半年付息、市價 $951.58。YTM（APR）？',opts:['7.0%','7.5%','7.8%','8.2%','8.6%'],ans:'(D)',exp:'半年息 35、10 期；解 951.58=35×[1−(1+r)⁻¹⁰]/r+1000/(1+r)¹⁰→r≈4.1%→APR≈8.2%。'},
{ch:30,type:'mc',src:'104 清大計財',q:'12 年期、9% 半年付息、$1,000、YTM=7%、3 年後可贖回@$1,045。YTC？',opts:['4.43%','4.62%','4.82%','4.91%','4.99%'],ans:'(B)',exp:'先算 P=1,160.58；再解 P=45×[1−(1+r)⁻⁶]/r+1045/(1+r)⁶→r≈2.31%→YTC≈4.62%。'},
{ch:30,type:'mc',src:'105 清大計財',q:'Trunk Line：好時賺 $60、付債權人 $35；壞時賺 $30、付 $20；機率各半、利率 10%。債權人願意付？',opts:['$25.00','$27.50','$29.55','$32.50','$35.00'],ans:'(A)',exp:'期望現金流=0.5×35+0.5×20=27.5；P=27.5/1.10=25。'},
{ch:30,type:'mc',src:'107 清大計財',q:'5 年期、4.7% 半年息、信用利差 1.2%、新 T-note 5.1% 平價。公司債價格？',opts:['$932.28','$1200','$1305.19','$745.82'],ans:'(A)',exp:'YTM=5.1%+1.2%=6.3%（半年 3.15%、10 期）；P=23.5×[1−1.0315⁻¹⁰]/0.0315+1000/1.0315¹⁰≈932.28。'},
{ch:30,type:'essay',src:'成大財金',q:'何謂 YTC？為何溢價債投資人更關注 YTC？',ans:'持有至贖回日的平均年報酬率；溢價債容易被贖回。',exp:'<p><b>YTC：</b>持有到第一個贖回日的 IRR，假設利息以 YTC 再投資。</p><p><b>為何關注：</b>溢價債 CR>市場利率；利率下跌時公司會贖回高息舊債，投資人被迫提前收回資金，實際報酬接近 YTC 而非 YTM。</p><p><b>折價債：</b>CR<YTM，公司不會贖回，投資人關注 YTM。</p>'},
{ch:30,type:'essay',src:'淡江財金',q:'說明 YTM 隱含「利息以 YTM 再投資」的假設。',ans:'P(1+y)^n = C(1+y)^(n-1)+...+M。',exp:'<p>將債券評價式兩邊同乘 (1+y)<sup>n</sup>：</p><p>P(1+y)<sup>n</sup> = C(1+y)<sup>n-1</sup> + C(1+y)<sup>n-2</sup> + ... + M。</p><p>左式代表期初 P 以 y 投資 n 期；右式代表每期 C 都以 y 再投資到期末。</p><p>若實際再投資利率≠y，實際複利報酬≠YTM。</p>'},
{ch:30,type:'calc',src:'逢甲財金',q:'IBM：8% 半年付息、$1,000、20 年、要求 8%。債券現值？',ans:'$1,000',exp:'CR=YTM=8%→平價發行，不論付息次數，價格皆等於面額 $1,000。'},

{ch:30,type:'calc',src:'中央財金',q:'Risky：1 年期、12% 票息、$1,000、違約機率 10%、違約時償付 70%。(1) 平價發行下預期報酬？(2) YTM？',ans:'(1) 7.8%；(2) 12%',exp:'<p>(1) E(R)=0.9×12%+0.1×(700/1000−1)=10.8%−3%=7.8%。</p><p>(2) YTM 不考慮違約，平價發行 YTM=CR=12%。</p>'},

{ch:31,type:'essay',src:'東吳財工',q:'說明 Macaulay Duration、Modified Duration、Dollar Duration 三者關係。',ans:'Dmod=DMac/(1+y)；Dollar=Dmod×P。',exp:'<p><b>Macaulay D：</b>現金流加權平均回收年數。</p><p><b>Modified D：</b>Dmod=DMac/(1+y)，利率變動 1% 時價格變動百分比。</p><p><b>Dollar Duration：</b>Dollar=Dmod×P，利率變動時價格變動金額。</p>'},
{ch:31,type:'essay',src:'成大財金',q:'何謂利率風險與再投資風險？',ans:'價格風險與再投資風險。',exp:'<p><b>利率風險（價格風險）：</b>利率變動→中途出售債券時價格波動。</p><p><b>再投資風險：</b>收到的票息再投資時，市場利率變動影響再投資報酬。</p><p><b>免疫：</b>存續期=投資期間時兩者互抵。</p>'},
{ch:31,type:'calc',src:'台大財金',q:'GM 債券：12 年、10% 半年付息、YTM=9.5%、DMac=5.7、凸性=48；YTM 上升 2%。價格變化？',ans:'−9.92%',exp:'dP/P≈−DMac/(1+y)×Δy+½×C×Δy²=−5.7/1.095×0.02+0.5×48×0.02²≈−9.92%。'},
{ch:31,type:'calc',src:'高科大金融',q:'浮動利率債 6 年到期、半年付息、水平利率 6%。存續期？',ans:'0.5 年',exp:'浮動利率債重設息日後存續期僅剩到下次付息的間隔=0.5 年。'},

{ch:32,type:'mc',src:'台大財金',q:'多頭價差：買 call@25（權利金 4）＋賣 call@40（權利金 2.5）；到期股價 50。淨獲利？',opts:['8.5','13.5','15.0','16.5','23.5'],ans:'(B)',exp:'[(50−25)−4]−[(50−40)−2.5]=21−7.5=13.5。'},

{ch:32,type:'mc',src:'104 清大計財',q:'買 call@25（$1.5）＋put@25（$0.7）；到期股價 $24.60。合約 100 股損益？',opts:['−$180','−$140','−$100','$0','$180'],ans:'(A)',exp:'Call 損益=100×(0−1.5)=−150；Put=100×(25−24.6−0.7)=−30；合計 −180。'},
{ch:32,type:'mc',src:'107 清大計財',q:'Put@60、權利金 $10、股價 $64。何時獲利？',opts:['股價<60','股價<64','股價<54','股價<50'],ans:'(D)',exp:'損益兩平=K−p=60−10=50；股價<50 才獲利。'},
{ch:32,type:'essay',src:'政大金融',q:'為何 call 賣方與 put 買方都希望股價下跌，但兩部位不同？',ans:'獲利結構與最大損益不同。',exp:'<p>兩者方向相同，但：</p><p><b>Call 賣方：</b>最大獲利=權利金；理論損失無限。</p><p><b>Put 買方：</b>最大損失=權利金；最大獲利=K（股價跌至 0）。</p><p>風險/報酬結構不對稱。</p>'},
{ch:32,type:'essay',src:'成大財金',q:'說明「提前履約美式 call 永不最適」的條件與例外。',ans:'不發股利時永不提前履約；高股利時除息前可能。',exp:'<p><b>直覺：</b>提前履約＝放棄時間價值＋早付履約價損失水時間。</p><p><b>結論：</b>不發股利的美式 call 不會提前履約，C<sub>美</sub>=C<sub>歐</sub>。</p><p><b>例外：</b>標的即將發放高現金股利，除息前股價跳水，可能提前履約賺股利。</p>'},
{ch:32,type:'calc',src:'清大計財',q:'3 月期 call@25=$2；3 月期 put@20=$3。Long strangle 損益兩平點？',ans:'$15 與 $30',exp:'利潤=max(S−25,0)+max(20−S,0)−5；S>25 時 S−25−5=0→S=30；S<20 時 20−S−5=0→S=15。'},
