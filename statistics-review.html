an class='f-label'>BN</span> E(X)=μ<sub>X</sub>，Var(X)=σ<sub>X</sub>²，Corr(X,Y)=ρ；邊際皆常態；條件分配亦為常態：E(Y|X=x)=μ<sub>Y</sub>+ρ(σ<sub>Y</sub>/σ<sub>X</sub>)(x−μ<sub>X</sub>)</div><div class='note'>ρ=0 ⇔ <span class=\"term\" data-term=\"independence\">獨立</span>（雙向）；線性組合仍為多元常態。</div>"}]}], "7": [{"id": "7.1", "title": "抽樣調查", "pg": "p.305", "body": "<p>本節「<b class=\"concept\">抽樣調查</b>」主題涵蓋下列 2 個小節：抽樣調查之基本概念、抽樣調查之抽樣誤差。概念與公式詳見各小節。</p>", "children": [{"id": "7.1.1", "title": "抽樣調查之基本概念", "pg": "p.305", "body": "<p><b class='concept'>母體分配</b>（population distribution）是整筆母體資料形成的機率分配；隨機樣本 X₁,…,X<sub>n</sub> 來自同一母體且<b class='concept'><span class=\"term\" data-term=\"independence\">獨立</span>同分配</b>（iid）。</p><p><b class='concept'><span class=\"term\" data-term=\"sampling-distribution\">抽樣分配</span></b>（sampling distribution）定義為樣本統計量 T(X₁,…,X<sub>n</sub>) 的機率分配。三大統計量：X̄、S²、p̂。</p><div class='formula'><span class='f-label'>抽樣分配</span> 統計量 T 為隨機樣本之函數，故為<span class=\"term\" data-term=\"random-variable\">隨機變數</span>；求其分配即為本章主軸。</div>"}, {"id": "7.1.2", "title": "抽樣調查之抽樣誤差", "pg": "p.309", "body": "<p>抽樣調查誤差分兩類：</p><ol class='nlist'><li><b class='concept'>抽樣誤差</b>（sampling error）：樣本不具代表性所致，無法避免但可控制與衡量（誤差界限）；只有普查可完全消除。</li><li><b class='concept'>非抽樣誤差</b>（nonsampling error）：測量、回應、不回應、選擇偏誤（含存活偏誤）等，普查也可能發生。</li></ol><div class='note'>後續的誤差界限、型一/型二錯誤只涵蓋隨機抽樣誤差，不含非抽樣誤差。</div>"}]}, {"id": "7.2", "title": "抽樣方法", "pg": "p.311", "body": "<p>本節「<b class=\"concept\">抽樣方法</b>」主題涵蓋下列 2 個小節：隨機抽樣方法、非隨機抽樣方法。概念與公式詳見各小節。</p>", "children": [{"id": "7.2.1", "title": "隨機抽樣方法", "pg": "p.311", "body": "<p><b class='concept'>隨機抽樣方法</b>（機率抽樣）：每個個體以已知機率入樣，可推導<span class=\"term\" data-term=\"sampling-distribution\">抽樣分配</span>。</p><ul><li><b class='concept'>簡單隨機抽樣</b>（SRS）：每個體機率相同；</li><li><b class='concept'>系統抽樣</b>：每隔 N/n 抽一個；</li><li><b class='concept'>分層抽樣</b>：層內同質、層間異質，含比例/Neyman/最適配置；</li><li><b class='concept'>群集抽樣</b>：群內異質、群間同質，再抽群。</li></ul><div class='note'>n/N&lt;5% 可視為無限母體；否則須做有限母體校正（fpc）。</div>"}, {"id": "7.2.2", "title": "非隨機抽樣方法", "pg": "p.314", "body": "<p><b class='concept'>非隨機抽樣方法</b>（非機率抽樣）：入樣與否由主觀決定，無法以機率理論推導<span class=\"term\" data-term=\"sampling-distribution\">抽樣分配</span>。</p><ul><li><b class='concept'>便利抽樣</b>：怎麼方便怎麼抽；</li><li><b class='concept'>雪球抽樣</b>：透過受訪者介紹擴散；</li><li><b class='concept'>判斷（立意）抽樣</b>：專家主觀選樣；</li><li><b class='concept'>配額抽樣</b>：按母體特徵比例配額。</li></ul><div class='warn'>推論統計公式建立在「隨機抽樣」上；用非隨機樣本下強烈結論需非常小心。</div>"}]}, {"id": "7.3", "title": "四大常用抽樣分配", "pg": "p.315", "body": "<p>本節「<b class=\"concept\">四大常用抽樣分配</b>」主題涵蓋下列 4 個小節：標準常態分配、卡方分配、Student's t 分配、Snedecor's F 分配。概念與公式詳見各小節。</p>", "children": [{"id": "7.3.1", "title": "標準常態分配", "pg": "p.315", "body": "<p><b class='concept'>標準<span class=\"term\" data-term=\"normal-distribution\">常態分配</span></b> Z~N(0,1)：pdf <b class='sym'>φ(z)=1/√(2π)·e<sup>−z²/2</sup></b>，cdf Φ(z) 無封閉解。</p><div class='formula'><span class='f-label'>N(0,1)</span> E(Z)=0；Var(Z)=1；M(t)=e<sup>t²/2</sup>；偏態=0，峰態=3</div><div class='note'>任何常態變數皆可標準化為 Z；Z²~χ²(1)。</div>"}, {"id": "7.3.2", "title": "卡方分配", "pg": "p.316", "body": "<p><b class='concept'>卡方分配</b> X~χ²(v)，是母數 α=v/2、β=2 的 Gamma 分配，僅定義於 x&gt;0：</p><div class='formula'><span class='f-label'>χ²(v)</span> E(X)=v；Var(X)=2v；右偏、高狹峰；M(t)=(1−2t)<sup>−v/2</sup></div><p>Z~N(0,1) ⇒ Z²~χ²(1)；<span class=\"term\" data-term=\"independence\">獨立</span> χ² 具有可加性；v≥50 時可常態近似。</p>"}, {"id": "7.3.3", "title": "Student's t 分配", "pg": "p.318", "body": "<p><b class='proper'>Gosset</b> 提出的 <b class='concept'>Student's t 分配</b>：T=Z/√(χ²(v)/v)，Z 與 χ²(v) <span class=\"term\" data-term=\"independence\">獨立</span>，T~t(v)：</p><div class='formula'><span class='f-label'>t(v)</span> E(T)=0；Var(T)=v/(v−2)（v&gt;2）；對稱、高瘦於常態；v→∞ 時趨近 N(0,1)</div><div class='note'>t(1) 即標準柯西分配；用於小樣本、母體<span class=\"term\" data-term=\"variance\">變異數</span>未知的平均數推論。</div>"}, {"id": "7.3.4", "title": "Snedecor's F 分配", "pg": "p.320", "body": "<p><b class='proper'>Snedecor</b> 的 <b class='concept'>F 分配</b>：F=[χ²(v₁)/v₁]/[χ²(v₂)/v₂]，兩<span class=\"term\" data-term=\"independence\">獨立</span>卡方相除，F~F(v₁,v₂)：</p><div class='formula'><span class='f-label'>F(v₁,v₂)</span> E(F)=v₂/(v₂−2)（v₂&gt;2）；右偏；值域 &gt;0</div><p>用於兩母體<span class=\"term\" data-term=\"variance\">變異數</span>比的檢定；T²~F(1,v)；1/F(v₁,v₂)~F(v₂,v₁)。</p>"}]}, {"id": "7.4", "title": "常態母體下之抽樣分配", "pg": "p.324", "body": "<p>本節「<b class=\"concept\">常態母體下之抽樣分配</b>」主題涵蓋下列 4 個小節：樣本平均數之抽樣分配（σ² 已知）、樣本變異數 S² 之抽樣分配、樣本平均數之抽樣分配（σ² 未知）、兩獨立常態母體下之抽樣分配。概念與公式詳見各小節。</p>", "children": [{"id": "7.4.1", "title": "樣本平均數之抽樣分配（σ² 已知）", "pg": "p.324", "body": "<p>X₁,…,X<sub>n</sub>~N(μ,σ²)（σ² 已知）下，由常態線性組合可加性：</p><div class='formula'><span class='f-label'>X̄（σ² 已知）</span> X̄~N(μ,σ²/n)；故 Z=(X̄−μ)/(σ/√n)~N(0,1)</div><div class='note'>不需大樣本、不需 CLT，任意 n 都成立；這是 Z 檢定的基礎。</div>"}, {"id": "7.4.2", "title": "樣本變異數 S² 之抽樣分配", "pg": "p.324", "body": "<p>常態母體下，樣本<span class=\"term\" data-term=\"variance\">變異數</span>的<span class=\"term\" data-term=\"sampling-distribution\">抽樣分配</span>：</p><div class='formula'><span class='f-label'>S²</span> μ 已知：nS′²/σ²~χ²(n)；μ 未知：(n−1)S²/σ²~χ²(n−1)</div><p>其中 S²=Σ(X<sub>i</sub>−X̄)²/(n−1)。且常態下 X̄ 與 S² <b class='concept'>相互<span class=\"term\" data-term=\"independence\">獨立</span></b>。</p>"}, {"id": "7.4.3", "title": "樣本平均數之抽樣分配（σ² 未知）", "pg": "p.326", "body": "<p>常態母體、σ² <b class='concept'>未知</b>時，以 S 取代 σ：</p><div class='formula'><span class='f-label'>X̄（σ² 未知）</span> (X̄−μ)/(S/√n) ~ t(n−1)</div><p>由 Z~N(0,1) 與 (n−1)S²/σ²~χ²(n−1) <span class=\"term\" data-term=\"independence\">獨立</span>相除而得；自由度 n−1。</p><div class='note'>是 t 檢定的核心；只要母體常態即成立，不要求大樣本。</div>"}, {"id": "7.4.4", "title": "兩獨立常態母體下之抽樣分配", "pg": "p.328", "body": "<p>兩<span class=\"term\" data-term=\"independence\">獨立</span>常態母體下，<span class=\"term\" data-term=\"variance\">變異數</span>比的<span class=\"term\" data-term=\"sampling-distribution\">抽樣分配</span>：</p><div class='formula'><span class='f-label'>兩母體</span> μ₁,μ₂ 已知：(S₁′²/σ₁²)/(S₂′²/σ₂²)~F(n₁,n₂)；未知：(S₁²/σ₁²)/(S₂²/σ₂²)~F(n₁−1,n₂−1)</div><p>用於檢定兩母體變異數是否相等；平均數差 (X̄−Ȳ) 之分配視 σ 是否已知分別用 Z 或 t。</p>"}]}, {"id": "7.5", "title": "大樣本之統計量性質", "pg": "p.334", "body": "<p>本節「<b class=\"concept\">大樣本之統計量性質</b>」主題涵蓋下列 3 個小節：大數法則、中央極限定理、樣本比例 p 之抽樣分配。概念與公式詳見各小節。</p>", "children": [{"id": "7.5.1", "title": "大數法則", "pg": "p.334", "body": "<p><b class='concept'><span class=\"term\" data-term=\"lln\">大數法則</span></b>（LLN）：不論母體為何，n→∞ 時 X̄ 收斂到 μ。</p><div class='formula'><span class='f-label'>WLLN</span> X<sub>n</sub>~(μ,σ²) ⇒ X̄ →<sup>P</sup> μ；即 P(|X̄−μ|&lt;ε)→1</div><p>由 Chebyshev 不等式證明：Var(X̄)=σ²/n→0。樣本比例 p̂ →<sup>P</sup> p。</p><div class='note'>「收斂到一點」與 CLT「收斂到<span class=\"term\" data-term=\"normal-distribution\">常態分配</span>」並存，差別在 X̄ 被乘以 √n。</div>"}, {"id": "7.5.2", "title": "中央極限定理", "pg": "p.335", "body": "<p><b class='concept'><span class=\"term\" data-term=\"clt\">中央極限定理</span></b>（CLT）：任意母體、n 夠大時，標準化後的 X̄ 漸近 N(0,1)：</p><div class='formula'><span class='f-label'>CLT</span> √n(X̄−μ)/σ →<sup>d</sup> N(0,1)；反標準化得 X̄ ~<sup>a</sup> N(μ,σ²/n)</div><p>樣本和版本：(ΣX<sub>i</sub>−nμ)/√(nσ²)→<sup>d</sup>N(0,1)。</p><div class='note'>不需母體常態，但需大樣本；「n≥30」只是粗略經驗法則，收斂速度隨母體形狀而異。</div>"}, {"id": "7.5.3", "title": "樣本比例 p 之抽樣分配", "pg": "p.339", "body": "<p>樣本比例 p̂ 即 Bernoulli 母體的 X̄，母體平均 p、<span class=\"term\" data-term=\"variance\">變異數</span> p(1−p)：</p><div class='formula'><span class='f-label'>p̂ 的抽樣分配</span> √n(p̂−p)/√(p(1−p)) →<sup>d</sup> N(0,1)；故 p̂ ~<sup>a</sup> N(p, p(1−p)/n)</div><div class='note'>WLLN 給 p̂→<sup>P</sup> p；CLT 給 p̂ 的漸近常態，是民調信賴區間與檢定的基礎。</div>"}]}, {"id": "7.6", "title": "順序統計量", "pg": "p.342", "body": "<p>將樣本排序得 X₍₁₎≤…≤X₍ₙ₎，即<span class=\"term\" data-term=\"Order Statistics\">順序統計量</span>；Y₁=min、Y_n=max。</p><div class=\"formula\"><span class=\"f-label\">極值 cdf/pdf</span><span class=\"sym\">f_{Y₁}(y)=n[1-F(y)]^{n-1}f(y)</span>、<span class=\"sym\">f_{Y_n}(y)=n[F(y)]^{n-1}f(y)</span></div><div class=\"formula\"><span class=\"f-label\">第 i 順序統計量</span><span class=\"sym\">f_{Y_i}(y)=n!/[(i-1)!(n-i)!]·F(y)^{i-1}[1-F(y)]^{n-i}f(y)</span></div><div class=\"note\"><b>重點：</b>U(0,1) 下 X₍ᵢ₎~Beta(i,n+1-i)；串聯系統壽命=min、並聯=max。樣本中位數（n 奇數）即 X_{((n+1)/2)}。</div>"}], "8": [{"id": "8.1", "title": "求導點估計量", "pg": "p.350", "body": "<p>本節「<b class=\"concept\">求導點估計量</b>」主題涵蓋下列 3 個小節：最大概似法、動差法、其他點估計方法。概念與公式詳見各小節。</p>", "children": [{"id": "8.1.1", "title": "最大概似法", "pg": "p.350", "body": "<p><span class=\"term\" data-term=\"MLE\">最大概似估計量</span> θ̂_MLE 使 L(θ) 最大；因微分對數較易，取 <span class=\"term\" data-term=\"LogLikelihood\">對數概似</span> ℓ(θ)=ln L(θ)，解 f.o.c. ∂ℓ/∂θ=0，再檢查 s.o.c.<div class=\"formula\"><span class=\"f-label\">MLE 步驟</span>① L(θ)=∏f(xᵢ;θ)　② ℓ=ln L　③ ∂ℓ/∂θ=0 求 θ*　④ ∂²ℓ/∂θ²&lt;0</div></p><div class=\"warn\"><b>注意：</b>常態母體 σ² 之 MLE 為 (1/n)Σ(Xᵢ−X̄)²，本身低估（偏誤）；自由度修正為 S² 後才不偏。若 μ 已知，則 (1/n)Σ(Xᵢ−μ)² 即不偏，不必修正。</div><p>均勻 U(0,θ) 之 MLE 為 <b class=\"sym\">X₍ₙ₎=max{Xᵢ}</b>；離散母數（如超幾何之 N）不可微分，以兩面逼近法求。由 <span class=\"term\" data-term=\"InvarianceMLE\">MLE 不動性</span>，g(θ) 之 MLE=g(θ̂_MLE)。</p>"}, {"id": "8.1.2", "title": "動差法", "pg": "p.360", "body": "<p><span class=\"term\" data-term=\"MME\">動差法估計量</span>採<span class=\"term\" data-term=\"MethodofAnalogy\">類比法</span>：令第 r 階母體原動差 μᵣ=E(Xʳ) 等於第 r 階樣本原動差 mᵣ=(1/n)ΣXᵢʳ 求解。單母數令 μ₁=m₁（即 E(X)=X̄）；兩母數再聯立 μ₂=m₂。</p><div class=\"note\"><b>重點：</b>動差法的理論基礎為大數法則（LLN），n→∞ 時樣本動差收斂至母體動差，故 MME 必具一致性。許多分配（Bernoulli、Poisson、常態）之 MME 與 MLE 相同，但 U(0,θ) 之 MME=2X̄ 而 MLE=X₍ₙ₎。</div><p><span class=\"term\" data-term=\"LSE\">最小平方法</span>找使 SSE=Σ(Xᵢ−θ̂)² 最小者，用於線性模型；<span class=\"term\" data-term=\"BayesianEstimator\">貝氏估計量</span> θ̂=E(θ|X)，結合事前分配與樣本經貝氏定理得事後分配。</p>"}, {"id": "8.1.3", "title": "其他點估計方法", "pg": "p.364", "body": "<p>除 MLE、MME 外，<span class=\"term\" data-term=\"LSE\">最小平方法估計量</span>（LSE）找使<span class=\"term\" data-term=\"SSE\">誤差平方和</span> <b class=\"sym\">Σ(Xᵢ−θ)²</b> 最小之 θ，廣用於線性模型（見第 12 章迴歸）。</p><p><span class=\"term\" data-term=\"BayesianEstimator\">貝氏估計量</span>視母數 θ 為隨機變數：研究者先有<span class=\"concept\">事前分配</span> <b class=\"sym\">f_θ(θ)</b>，引入樣本後以貝氏定理得<span class=\"concept\">事後分配</span> <b class=\"sym\">f(θ|X₁,…,Xₙ)</b>，貝氏估計即事後平均 <b class=\"sym\">θ̂_B=E(θ|X₁,…,Xₙ)</b>。古典學派視 θ 為固定未知常數，貝氏學派視其為帶事前信念之隨機變數，二者典範不同。</p>"}]}, {"id": "8.2", "title": "評估點估計量表現的準則", "pg": "p.365", "body": "<p>本節「<b class=\"concept\">評估點估計量表現的準則</b>」主題涵蓋下列 6 個小節：不偏性、準確度與精確度、有效性、絕對有效估計量與其替代品、一致性、充份性。概念與公式詳見各小節。</p>", "children": [{"id": "8.2.1", "title": "不偏性", "pg": "p.365", "body": "<p>若 <b class=\"sym\">E(θ̂)=θ</b> 則 θ̂ 為<span class=\"term\" data-term=\"Unbiasedness\">不偏估計量</span>，直覺為「平均而言估計正確」。<span class=\"term\" data-term=\"Bias\">偏誤</span> Bias(θ̂)=E(θ̂)−θ；>0 高估、&lt;0 低估。</p><div class=\"warn\"><b>陷阱：</b>不偏性在「非線性轉換」下不具不動性——θ̂ 不偏，1/θ̂、√θ̂ 未必不偏；故 S² 為 σ² 不偏，S=√S² 卻是 σ 之偏誤估計量。</div><div class=\"formula\"><span class=\"f-label\">X̄ 與 S² 之不偏性（任意母體）</span>E(X̄)=μ；E(S²)=σ²，S²=1/(n−1)Σ(Xᵢ−X̄)²</div><p><span class=\"term\" data-term=\"ConsistencyMeaning\">漸近不偏性</span>指 lim E(θ̂)=θ；不偏必漸近不偏，逆不真。MLE 在正規條件下具漸近不偏性。</p>"}, {"id": "8.2.2", "title": "準確度與精確度", "pg": "p.371", "body": "<p>以打靶類比：<span class=\"term\" data-term=\"Accuracy\">準確度</span>（效度）是平均彈著點與靶心距離，以 |Bias| 衡量；<span class=\"term\" data-term=\"Precision\">精確度</span>（信度）是彈著點彼此分散度，以 Var 或 <span class=\"term\" data-term=\"StandardError\">標準誤</span>衡量。</p><div class=\"note\"><b>重點：</b>不偏估計量即「準確度完美」者。樣本數 n 增加通常提升精確度：Var(X̄)=σ²/n、SE(X̄)=σ/√n 皆隨 n 遞減。</div>"}, {"id": "8.2.3", "title": "有效性", "pg": "p.373", "body": "<p><span class=\"term\" data-term=\"MSE\">平均平方誤差</span>綜合準確度與精確度：<div class=\"formula\"><span class=\"f-label\">MSE 分解</span>MSE(θ̂)=Var(θ̂)+[Bias(θ̂)]²</div> 兩估計量比較時，MSE 較小者為<span class=\"term\" data-term=\"RelativeEfficiency\">相對有效</span>。</p><p>數學上不存在「對任意母數值 MSE 永遠最小」的絕對有效估計量，故限縮範圍找最佳者：在所有不偏估計量中變異數最小者為 <span class=\"term\" data-term=\"UMVUE\">UMVUE</span>（最佳不偏 BUE）；在所有線性不偏估計量中變異數最小者為 <span class=\"term\" data-term=\"BLUE\">BLUE</span>。</p><div class=\"formula\"><span class=\"f-label\">Cramér–Rao 下界</span>Var(θ̂)≥1/[n·I₁(θ)]，I₁(θ) 為<span class=\"term\" data-term=\"FisherInformation\">費雪訊息</span>；若某不偏估計量 Var 恰等於 CRLB，即為 UMVUE。</div><div class=\"warn\"><b>注意：</b>UMVUE 需知母體分配形式；BLUE 不需要。有趣的是 σ² 之 MLE 雖偏誤，其 MSE 卻小於自由度修正的 S²——追求不偏性的代價是損失一點有效性。</div>"}, {"id": "8.2.4", "title": "絕對有效估計量與其替代品", "pg": "p.377", "body": "<p>對任意母數值 θ∈Θ 都 MSE 最小的「絕對有效估計量」在數學上不存在，因 MSE 隨 θ 而變。故限縮範圍找最佳者。</p><div class=\"formula\"><span class=\"f-label\">兩種替代品</span>所有不偏估計量中 Var 最小＝<span class=\"term\" data-term=\"UMVUE\">UMVUE</span>（最佳不偏 BUE）；所有線性不偏估計量中 Var 最小＝<span class=\"term\" data-term=\"BLUE\">BLUE</span>。</div><div class=\"formula\"><span class=\"f-label\">Cramér–Rao 下界</span><b class=\"sym\">Var(θ̂)≥1/[n·I₁(θ)]</b>，I₁(θ) 為<span class=\"term\" data-term=\"FisherInformation\">費雪訊息</span>。求 UMVUE 另可經 <b class=\"proper\">Rao–Blackwell</b>＋<b class=\"proper\">Lehmann–Scheffé</b> 定理，由完備充份統計量調整而得。</div><div class=\"warn\"><b>注意：</b>UMVUE 只在「不偏估計量」中 Var 最小，不能排除某偏誤估計量 MSE 更小而擊敗它。</div>"}, {"id": "8.2.5", "title": "一致性", "pg": "p.383", "body": "<p><span class=\"term\" data-term=\"Consistency\">一致性</span>指 n→∞ 時 <b class=\"sym\">plim θ̂=θ</b>，即對任意 ε>0，P(|θ̂−θ|≥ε)→1 趨近 0，為機率收斂概念、大樣本性質。</p><div class=\"formula\"><span class=\"f-label\">MSE 一致性（充分非必要）</span>lim MSE(θ̂)=0 ⇒ θ̂ 為一致性估計量；含 lim E(θ̂)=θ 且 lim Var(θ̂)=0。</div><div class=\"note\"><b>重點：</b>弱大數法則保證 X̄ 為 μ 之一致性估計量；MLE、MME 在正規條件下皆一致。一致性具不動性（g(θ̂) 一致估計 g(θ)），且不偏性與一致性互不隸屬。</div>"}, {"id": "8.2.6", "title": "充份性", "pg": "p.390", "body": "<p><span class=\"term\" data-term=\"SufficientStatistic\">充份統計量</span> T 指：給定 T 後，樣本之條件分配與母數 θ 無關——T 已保有樣本中關於 θ 的全部攸關資訊，不必再回頭看原始樣本。<span class=\"term\" data-term=\"SufficiencyPrinciple\">充份性原則</span>由 <b class=\"proper\">Ronald Fisher</b> 揭櫫。</p><div class=\"formula\"><span class=\"f-label\">分解定理 Factorization Theorem</span>f(x₁,…,xₙ;θ)=g(T;θ)·h(x₁,…,xₙ) 為 T 充份之充要條件。</div><div class=\"warn\"><b>注意：</b>MLE 必為充份統計量之某函數（通常滿足充份性），MME 則未必。充份統計量不唯一，一對一函數轉換仍充份。</div>"}]}], "9": [{"id": "9.1", "title": "區間估計概論", "pg": "p.395", "body": "<p>本節「<b class=\"concept\">區間估計概論</b>」主題涵蓋下列 1 個小節：樞紐量與信賴區間。概念與公式詳見各小節。</p>", "children": [{"id": "9.1.1", "title": "樞紐量與信賴區間", "pg": "p.396", "body": "<p>對隨機區間 [L,U]，若 <b class=\"sym\">P(L&lt;θ&lt;U)=1−α</b>，則為 θ 之 <span class=\"term\" data-term=\"ConfidenceInterval\">(1−α)100% 信賴區間</span>；(1−α) 為<span class=\"term\" data-term=\"ConfidenceLevel\">信心水準</span>，L、U 分別為信賴下、上界。L、U 為樣本函數，故為隨機變數。</p><p><span class=\"term\" data-term=\"PivotalQuantity\">樞紐量</span> Q(X;θ) 為樣本與待估母數之函數，其分配不含任何未知母數（僅含 θ）。建構步驟：</p><ol class=\"nlist\"><li>求 θ 之點估計量 θ̂</li><li>以 θ̂ 為基礎求樞紐量 Q(θ̂;θ) 及其分配</li><li>寫 <b class=\"sym\">1−α=P(q_L&lt;Q&lt;q_U)=P(L&lt;θ&lt;U)</b></li><li>解出 θ 之 C.I. [L,U]</li></ol><div class=\"note\"><b>兩難：</b>區間越窄越精準、信心越高越好，但二者互為消長，無法同時達成。</div>"}]}, {"id": "9.2", "title": "單一母體之區間估計", "pg": "p.397", "body": "<p>本節「<b class=\"concept\">單一母體之區間估計</b>」主題涵蓋下列 3 個小節：單一母體期望值 μ 之區間估計、單一母體變異數 σ² 之區間估計、單一母體比例 p 之區間估計。概念與公式詳見各小節。</p>", "children": [{"id": "9.2.1", "title": "單一母體期望值 μ 之區間估計", "pg": "p.397", "body": "<p>求單一母體 <b class=\"sym\">μ</b> 之 (1−α)100% C.I.，通式為「點估計量 ± 尾點 × SE」。</p><div class=\"formula\"><span class=\"f-label\">Case I 常態、σ² 已知</span><b class=\"sym\">X̄ ± z_{α/2}·σ/√n</b></div><div class=\"formula\"><span class=\"f-label\">Case II 常態、σ² 未知</span><b class=\"sym\">X̄ ± t_{α/2}(n−1)·S/√n</b>，自由度 n−1</div><div class=\"formula\"><span class=\"f-label\">Case III 非常態/未知（大樣本）</span>中央極限定理 <b class=\"sym\">X̄ ± z_{α/2}·S/√n</b></div><p>標準誤 <span class=\"term\" data-term=\"StandardError\">SE(X̄)</span>=σ/√n 或 S/√n；σ 未知時以 S 代入。因 <b class=\"sym\">t_{α/2}(ν)&gt;z_{α/2}</b>，只要 σ² 未知不論常態與否，一律採 t 尾點為較保守作法。</p>"}, {"id": "9.2.2", "title": "單一母體變異數 σ² 之區間估計", "pg": "p.401", "body": "<p>常態母體下求 σ² 之 (1−α)100% C.I.，樞紐量服 <span class=\"term\" data-term=\"ChiSquareCI\">χ² 分配</span>。</p><div class=\"formula\"><span class=\"f-label\">Case I μ 已知</span><b class=\"sym\">n·S'²/σ² ~ χ²(n)</b>，S'²=Σ(Xᵢ−μ)²/n</div><div class=\"formula\"><span class=\"f-label\">Case II μ 未知</span><b class=\"sym\">(n−1)S²/σ² ~ χ²(n−1)</b></div><div class=\"formula\"><span class=\"f-label\">σ² 之 C.I.</span><b class=\"sym\">[(n−1)S²/χ²_{α/2}(n−1), (n−1)S²/χ²_{1−α/2}(n−1)]</b></div><p>因 χ² 分配右偏且不對稱，下界用 χ²_{α/2}、上界用 χ²_{1−α/2}。欲求 σ 之 C.I.，把上下界分別開根號即可。</p>"}, {"id": "9.2.3", "title": "單一母體比例 p 之區間估計", "pg": "p.403", "body": "<p>母體 Bernoulli、大樣本下求 <b class=\"sym\">p</b> 之 (1−α)100% C.I.，由中央極限定理 <span class=\"term\" data-term=\"ProportionCI\">p̂ ~ N(p, p(1−p)/n)</span>。</p><div class=\"formula\"><span class=\"f-label\">標準化樞紐量</span><b class=\"sym\">(p̂−p)/√(p̂(1−p̂)/n) ~ N(0,1)</b></div><div class=\"formula\"><span class=\"f-label\">p 之 C.I.</span><b class=\"sym\">p̂ ± z_{α/2}·√(p̂(1−p̂)/n)</b></div><div class=\"note\"><b>SE 之版本：</b>Var(p̂)=p(1−p)/n 之不偏估計須除以 n−1，故部分教本採 <b class=\"sym\">p̂ ± z_{α/2}·√[p̂(1−p̂)/(n−1)]</b>。</div>"}]}, {"id": "9.3", "title": "信賴區間的一些特殊課題", "pg": "p.405", "body": "<p>本節「<b class=\"concept\">信賴區間的一些特殊課題</b>」主題涵蓋下列 5 個小節：有限母體校正、單邊信賴區間、影響信賴區間寬度之因素、信賴區間之意義、預測區間。概念與公式詳見各小節。</p>", "children": [{"id": "9.3.1", "title": "有限母體校正", "pg": "p.405", "body": "<p>抽樣調查採「抽出不放回」，有限母體 N 下樣本不再 iid，須作<span class=\"term\" data-term=\"FinitePopulationCorrection\">有限母體校正 fpc</span>。</p><div class=\"formula\"><span class=\"f-label\">有限母體下</span><b class=\"sym\">Var(X̄)=σ²/n·(N−n)/(N−1)</b>；<b class=\"sym\">Var(p̂)=p(1−p)/n·(N−n)/(N−1)</b></div><p>校正因子 (N−n)/(N−1) 只乘在變異數（標準誤）上，不影響期望值 E(X̄)=μ、E(p̂)=p。此即超幾何相對二項多乘的 fpc 因子。</p><div class=\"note\"><b>實務：</b>當 n/N &lt; 5%，因子接近 1 可省略校正；n/N ≥ 5% 不宜省略。題目未給 N 則視為無限母體。</div>"}, {"id": "9.3.2", "title": "單邊信賴區間", "pg": "p.406", "body": "<p><span class=\"term\" data-term=\"OneSidedCI\">單邊信賴區間</span>只用一個尾點，估計「下界」或「上界」。</p><div class=\"formula\"><span class=\"f-label\">單邊下界</span><b class=\"sym\">[L,∞)，P(θ&gt;L)=1−α</b></div><div class=\"formula\"><span class=\"f-label\">單邊上界</span><b class=\"sym\">(−∞,U]，P(θ&lt;U)=1−α</b></div><p>以 μ 為例：雙尾用 <b class=\"sym\">X̄ ± z_{α/2}·σ/√n</b>；單邊下界用 <b class=\"sym\">X̄−z_α·σ/√n</b>，單邊上界用 <b class=\"sym\">X̄+z_α·σ/√n</b>——把雙尾的 α/2 改為單尾的 α。σ² 之單邊 C.I. 同理只取一側 χ² 尾點。</p>"}, {"id": "9.3.3", "title": "影響信賴區間寬度之因素", "pg": "p.407", "body": "<p>以 μ 為例，<b class=\"sym\">X̄ ± z_{α/2}·σ/√n</b> 的直覺解讀：有 (1−α)100% 信心誤差不超過 <span class=\"term\" data-term=\"MarginOfError\">誤差界限 E</span>=z_{α/2}·σ/√n；區間寬度=2E。</p><div class=\"formula\"><span class=\"f-label\">三因素</span>信心水準 (1−α)↑ ⇒ E↑、寬度↑；樣本 n↑ ⇒ SE↓、寬度↓；σ 或 S↑ ⇒ SE↑、寬度↑</div><p>比例問題同理：E=z_{α/2}·√[p̂(1−p̂)/n]，寬度=2E。欲同時縮小寬度又維持高信心，唯一辦法是增加樣本數 n。</p>"}, {"id": "9.3.4", "title": "信賴區間之意義", "pg": "p.408", "body": "<p>已實現區間 [50.2,54.3] 中，μ 與上下界皆為常數，常數是否落在常數範圍只有是/否，故<b class=\"concept\">不能</b>說 <b class=\"sym\">P(50.2&lt;μ&lt;54.3)=0.95</b>。</p><div class=\"formula\"><span class=\"f-label\">正確寫法</span><b class=\"sym\">P(X̄−z·σ/√n &lt; μ &lt; X̄+z·σ/√n)=0.95</b>——X̄ 為隨機變數才可談機率</div><p>重複抽 n=25 樣本千百次，每次得不同區間，其中 95% 的區間真的罩住 μ。故正確解讀為：「我們有 95% <b class=\"concept\">信心</b>，此區間會包含真實 μ」——信心來自這套建區間方法本身的覆蓋率。</p>"}, {"id": "9.3.5", "title": "預測區間", "pg": "p.409", "body": "<p><span class=\"term\" data-term=\"PredictionInterval\">預測區間 P.I.</span> 用樣本資訊估「未來尚未抽取」的單一觀察值 <b class=\"sym\">X_{n+1}</b>，而非估 μ。</p><div class=\"formula\"><span class=\"f-label\">Case II 常態、σ² 未知</span><b class=\"sym\">X̄ ± t_{α/2}(n−1)·S·√(1+1/n)</b></div><p>相較 μ 的 C.I. 多了「<b class=\"sym\">1+</b>」：因未來觀察值模型 <b class=\"sym\">X_{n+1}=μ+ε_{n+1}</b>，其變異除估 μ 的抽樣誤差 σ²/n 外，又多一個別觀察值離差 σ²，Var(X̄−X_{n+1})=σ²(1+1/n)。故 P.I. 恆比 C.I. 寬。</p>"}]}, {"id": "9.4", "title": "兩母體之區間估計", "pg": "p.413", "body": "<p>本節「<b class=\"concept\">兩母體之區間估計</b>」主題涵蓋下列 4 個小節：兩獨立母體期望值差 μ₁−μ₂ 之區間估計、兩相依母體差的期望值 之區間估計、兩獨立母體變異數比例之區間估計、兩獨立母體比例差 p₁−p₂ 之區間估計。概念與公式詳見各小節。</p>", "children": [{"id": "9.4.1", "title": "兩獨立母體期望值差 μ₁−μ₂ 之區間估計", "pg": "p.413", "body": "<p>求兩獨立母體 <b class=\"sym\">μ₁−μ₂</b> 之 C.I.，點估計量為 X̄−Ȳ。</p><div class=\"formula\"><span class=\"f-label\">Case I 變異數皆已知</span><b class=\"sym\">(X̄−Ȳ) ± z_{α/2}·√(σ₁²/n₁+σ₂²/n₂)</b></div><div class=\"formula\"><span class=\"f-label\">Case II 未知且相等（同質）</span>混合 <span class=\"term\" data-term=\"PooledVariance\">S_p²</span>，<b class=\"sym\">± t_{α/2}(n₁+n₂−2)·S_p·√(1/n₁+1/n₂)</b></div><div class=\"formula\"><span class=\"f-label\">Case III 未知不相等</span><span class=\"term\" data-term=\"Welchdf\">Welch</span> t，自由度 df=<b class=\"sym\">(S₁²/n₁+S₂²/n₂)²/[(S₁²/n₁)²/(n₁−1)+(S₂²/n₂)²/(n₂−1)]</b></div><p>Case IV 兩組皆大樣本時由 CLT 用 z。σ 未知時先作 F 檢定判斷同質再選 Case II/III。</p>"}, {"id": "9.4.2", "title": "兩相依母體差的期望值 之區間估計", "pg": "p.418", "body": "<p><span class=\"term\" data-term=\"PairedSample\">成對樣本</span>兩兩相減 <b class=\"sym\">Dᵢ=Xᵢ−Yᵢ</b>（m 對），把差視為單一母體處理。<b class=\"sym\">μ_D=μ₁−μ₂</b>，<b class=\"sym\">σ_D²=σ₁²+σ₂²−2σ₁σ₂ρ_XY</b>。因設計成正相關，σ_D² 小於獨立設計，SE 更小。</p><div class=\"formula\"><span class=\"f-label\">Case I 差為常態</span><b class=\"sym\">D̄ ± t_{α/2}(m−1)·S_D/√m</b></div><div class=\"formula\"><span class=\"f-label\">Case II 大樣本</span><b class=\"sym\">D̄ ± z_{α/2}·S_D/√m</b></div><p>成對設計是相對較佳的實驗設計：同一人/車前後測，可消去個體差異帶來的干擾。</p>"}, {"id": "9.4.3", "title": "兩獨立母體變異數比例之區間估計", "pg": "p.421", "body": "<p>常態母體下求兩獨立母體變異數比 <b class=\"sym\">σ₁²/σ₂²</b> 之 C.I.，用 <span class=\"term\" data-term=\"Ftest\">F 分配</span>。</p><div class=\"formula\"><span class=\"f-label\">Case II μ 皆未知</span><b class=\"sym\">(S₁²/S₂²)/(σ₁²/σ₂²) ~ F(n₁−1,n₂−1)</b></div><div class=\"formula\"><span class=\"f-label\">σ₁²/σ₂² 之 C.I.</span><b class=\"sym\">[(S₁²/S₂²)/F_{α/2}(n₁−1,n₂−1), (S₁²/S₂²)/F_{1−α/2}(n₁−1,n₂−1)]</b></div><p>一般 F 表無下尾點，須用倒數關係 <b class=\"sym\">F_{1−α/2}(n₁−1,n₂−1)=1/F_{α/2}(n₂−1,n₁−1)</b>。</p>"}, {"id": "9.4.4", "title": "兩獨立母體比例差 p₁−p₂ 之區間估計", "pg": "p.424", "body": "<p>兩獨立 Bernoulli 母體、大樣本下求 <b class=\"sym\">p₁−p₂</b> 之 C.I.，由 CLT 兩樣本個別近似常態。</p><div class=\"formula\"><span class=\"f-label\">p₁−p₂ 之 C.I.</span><b class=\"sym\">(p̂₁−p̂₂) ± z_{α/2}·√[p̂₁(1−p̂₁)/n₁ + p̂₂(1−p̂₂)/n₂]</b></div><p>標準誤中分母體比例 p₁、p₂ 未知，各以樣本比例 p̂₁、p̂₂ 代入，依 <b class=\"proper\">Slutsky</b> 定理大樣本下分配不變。結構仍為「點估計量 ± 尾點 × SE」。</p>"}]}, {"id": "9.5", "title": "樣本數問題", "pg": "p.426", "body": "<p>本節「<b class=\"concept\">樣本數問題</b>」主題涵蓋下列 2 個小節：單一母體之樣本數問題、兩獨立母體之樣本數問題。概念與公式詳見各小節。</p>", "children": [{"id": "9.5.1", "title": "單一母體之樣本數問題", "pg": "p.426", "body": "<p><span class=\"term\" data-term=\"SampleSizeDetermination\">樣本數問題</span>：給定信心水準與誤差界限 E，反解 n；一律<b class=\"concept\">無條件進位</b>。</p><div class=\"formula\"><span class=\"f-label\">估 μ</span><b class=\"sym\">E=z_{α/2}·σ/√n ⇒ n=z²_{α/2}·σ²/E²</b></div><p>σ² 未知時：用過去 S²，或以 <b class=\"sym\">σ≈R/4</b>（R 為全距）估算。</p><div class=\"formula\"><span class=\"f-label\">估 p</span><b class=\"sym\">E=z_{α/2}·√(p(1−p)/n) ⇒ n=z²_{α/2}·p(1−p)/E²</b></div><p>p 未知時取 <b class=\"sym\">p=0.5</b> 使 p(1−p) 最大，最保守。95%、E=3% 時 n≈1068。</p>"}, {"id": "9.5.2", "title": "兩獨立母體之樣本數問題", "pg": "p.428", "body": "<p>兩獨立母體樣本數須設 <b class=\"sym\">n₁=n₂=m</b>，否則 m₁、m₂ 可互相消長而有無限多解。</p><div class=\"formula\"><span class=\"f-label\">估 μ₁−μ₂</span><b class=\"sym\">m=z²_{α/2}·(σ₁²+σ₂²)/E²</b>，變異數未知用 S₁²、S₂² 代入</div><div class=\"formula\"><span class=\"f-label\">估 p₁−p₂</span><b class=\"sym\">m=z²_{α/2}·[p₁(1−p₁)+p₂(1−p₂)]/E²</b></div><p>p₁、p₂ 無過去經驗時各取 0.5 最保守。有限母體時另乘 fpc 修正。</p>"}]}], "10": [{"id": "10.1", "title": "假說檢定概論", "pg": "p.431", "body": "<p>本節「<b class=\"concept\">假說檢定概論</b>」主題涵蓋下列 4 個小節：建立統計假說之準則、檢定錯誤與顯著水準、檢定統計量與拒絕域、允收抽樣。概念與公式詳見各小節。</p>", "children": [{"id": "10.1.1", "title": "建立統計假說之準則", "pg": "p.432", "body": "<p><span class=\"term\" data-term=\"NullHypothesis\">虛無假說 H₀</span> 與<span class=\"term\" data-term=\"AlternativeHypothesis\">對立假說 Hₐ</span> 互斥。建立準則：</p><ol class=\"nlist\"><li>H₀ 含等號（=、≥、≤），Hₐ 不含</li><li>無足夠證據不能推翻者放 H₀（先推定為真、佔優勢）</li><li>研究者欲證成者放 Hₐ（負舉證責任）</li><li>犯錯成本高者設為型一錯誤（由 H₀/Hₐ 設定達成）</li></ol><p>三種設定：雙尾 H₀:θ=θ₀；右尾 Hₐ:θ&gt;θ₀；左尾 Hₐ:θ&lt;θ₀。<b class=\"concept\">簡單假說</b>指定單一值，<b class=\"concept\">複合假說</b>指定一範圍。注意：T₀∉RR 只能說「不拒絕」H₀，不能說「接受」。</p>"}, {"id": "10.1.2", "title": "檢定錯誤與顯著水準", "pg": "p.434", "body": "<p><span class=\"term\" data-term=\"TypeIError\">型一誤差</span>：H₀ 真卻誤拒，機率 α（<span class=\"term\" data-term=\"SignificanceLevel\">顯著水準</span>）；<span class=\"term\" data-term=\"TypeIIError\">型二誤差</span>：Hₐ 真卻誤不拒，機率 β。α+β≠1。</p><div class=\"formula\"><span class=\"f-label\">決策表</span>H₀ 真：拒絕=型一(α)、不拒=正確(1−α)；Hₐ 真：拒絕=檢定力(<span class=\"term\" data-term=\"Power\">1−β</span>)、不拒=型二(β)</div><div class=\"note\"><b>兩難：</b>n 固定時移動臨界值 k，α 與 β 互為消長，無法同時下降；唯一同時降低二者之道是增加樣本數 n。給定 α 可由 <span class=\"term\" data-term=\"NeymanPearsonLemma\">尼曼—皮爾森引理</span>找最強力檢定。</div><p><span class=\"term\" data-term=\"TestStatistic\">檢定統計量</span>在 H₀ 為真下的抽樣分配決定<span class=\"term\" data-term=\"RejectionRegion\">拒絕域 RR</span>；RR 與接受域交界為<span class=\"term\" data-term=\"CriticalValue\">臨界值</span> k。<span class=\"term\" data-term=\"ProducerRisk\">允收抽樣</span>中 α 為生產者風險、β 為消費者風險。</p><div class=\"fig\"><svg viewBox=\"0 0 720 150\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"12\" fill=\"#2b251d\"><rect x=\"40\" y=\"20\" width=\"300\" height=\"50\" rx=\"8\" fill=\"#cfe0d2\" stroke=\"#3a7d44\"/><text x=\"190\" y=\"50\" text-anchor=\"middle\">H₀ 為真 → 不拒絕：正確</text><rect x=\"380\" y=\"20\" width=\"300\" height=\"50\" rx=\"8\" fill=\"#f3d9c8\" stroke=\"#b5542e\"/><text x=\"530\" y=\"45\" text-anchor=\"middle\">H₀ 為真 → 拒絕：型一誤差 α</text><rect x=\"40\" y=\"85\" width=\"300\" height=\"50\" rx=\"8\" fill=\"#fbeae2\" stroke=\"#b5542e\"/><text x=\"190\" y=\"110\" text-anchor=\"middle\">H₀ 為假 → 不拒絕：型二誤差 β</text><rect x=\"380\" y=\"85\" width=\"300\" height=\"50\" rx=\"8\" fill=\"#cfe0d2\" stroke=\"#3a7d44\"/><text x=\"530\" y=\"110\" text-anchor=\"middle\">H₀ 為假 → 拒絕：檢定力 1−β</text></svg><div class=\"figcap\">圖 11：假說檢定的四種判決：正確／型一 α／型二 β／檢定力 1−β</div></div>"}, {"id": "10.1.3", "title": "檢定統計量與拒絕域", "pg": "p.435", "body": "<p><span class=\"term\" data-term=\"TestStatistic\">檢定統計量</span> T(X) 是用作假說檢定的樣本統計量；在 H₀ 為真下找出其抽樣分配，才能定 <span class=\"term\" data-term=\"RejectionRegion\">拒絕域 RR</span>（又稱臨界域、危險域）。</p><div class=\"formula\"><span class=\"f-label\">三方向</span>右尾 RR={T≥k}；左尾 RR={T≤k}；雙尾 RR={T≤k′ 或 T≥k″}</div><p>RR 之餘集合為接受域；RR 與接受域交接點為<span class=\"term\" data-term=\"CriticalValue\">臨界值</span> k（或 c）。很多情況檢定統計量＝把 H₀ 的母數值代入樞紐量。</p>"}, {"id": "10.1.4", "title": "允收抽樣", "pg": "p.436", "body": "<p><span class=\"term\" data-term=\"AcceptanceSampling\">允收抽樣</span>因成本或破壞性檢驗不能全檢，用抽樣決定整批原料/成品是否允收，為品質管制工具。</p><div class=\"formula\"><span class=\"f-label\">兩品質水準</span><span class=\"term\" data-term=\"AQL\">AQL</span> 可接受品質水準（希望極大機率允收）；<span class=\"term\" data-term=\"LTPD\">LTPD/RQL</span> 批量容許不良率（希望極大機率拒收）</div><p>本質即假說檢定：H₀: 良品批（如 p=1%）vs Hₐ: 劣品批（如 p=5%）。型一錯誤不利供應商，稱<span class=\"term\" data-term=\"ProducerRisk\">生產者風險 α</span>；型二錯誤不利消費者，稱<span class=\"term\" data-term=\"ConsumerRisk\">消費者風險 β</span>。</p>"}]}, {"id": "10.2", "title": "單一母體之假說檢定", "pg": "p.437", "body": "<p>本節「<b class=\"concept\">單一母體之假說檢定</b>」主題涵蓋下列 3 個小節：單一母體期望值 μ 之假說檢定、單一母體變異數 σ² 之假說檢定、單一母體比例 p 之假說檢定。概念與公式詳見各小節。</p>", "children": [{"id": "10.2.1", "title": "單一母體期望值 μ 之假說檢定", "pg": "p.437", "body": "<p>單一母體 μ 之檢定（以雙尾為例）：</p><ol class=\"nlist\"><li>H₀:μ=μ₀ vs Hₐ:μ≠μ₀</li><li>定顯著水準 α</li><li>檢定統計量：Case I σ 已知 <b class=\"sym\">Z=(X̄−μ₀)/(σ/√n)~N(0,1)</b>；Case II σ 未知 <b class=\"sym\">T=(X̄−μ₀)/(S/√n)~t(n−1)</b>；Case III 大樣本 CLT 用 Z</li><li>RR={|Z|≥z_{α/2}} 或 {|T|≥t_{α/2}(n−1)}</li><li>計算觀察值 Z₀ 或 T₀</li><li>T₀∈RR 則拒絕 H₀，否則不拒絕</li></ol><p>有限母體 n/N≥5% 時標準誤乘 fpc。σ 未知時不論常態與否一律用 t 為保守作法。</p>"}, {"id": "10.2.2", "title": "單一母體變異數 σ² 之假說檢定", "pg": "p.441", "body": "<p>單一母體 σ² 之檢定（常態母體，雙尾）：</p><ol class=\"nlist\"><li>H₀:σ²=σ₀² vs Hₐ:σ²≠σ₀²</li><li>定顯著水準 α</li><li>檢定統計量：Case II μ 未知 <b class=\"sym\">χ²=(n−1)S²/σ₀² ~ χ²(n−1)</b>；μ 已知則 <b class=\"sym\">nS'²/σ₀² ~ χ²(n)</b></li><li>RR={χ²≤χ²_{1−α/2}(n−1) 或 χ²≥χ²_{α/2}(n−1)}</li><li>計算觀察值 χ²₀</li><li>χ²₀∈RR 則拒絕 H₀</li></ol><p>因 χ² 分配不對稱，雙尾拒絕域左右各取一個臨界值；右尾檢定只取上方臨界值。</p>"}, {"id": "10.2.3", "title": "單一母體比例 p 之假說檢定", "pg": "p.443", "body": "<p>單一母體 p 之檢定（Bernoulli、大樣本 np₀≥5 且 n(1−p₀)≥5）：</p><ol class=\"nlist\"><li>H₀:p=p₀ vs Hₐ:p≠p₀</li><li>定顯著水準 α</li><li>檢定統計量 <b class=\"sym\">Z=(p̂−p₀)/√[p₀(1−p₀)/n] ~ N(0,1)</b></li><li>RR={|Z|≥z_{α/2}}</li><li>計算觀察值 Z₀</li><li>Z₀∈RR 則拒絕 H₀</li></ol><div class=\"note\"><b>注意：</b>檢定分母用 H₀ 下的 p₀，而非 p̂（與區間估計不同）。小樣本時改以樣本和 S~B(n,p) 計 p-value 作<span class=\"term\" data-term=\"sign_test\">符號檢定</span>。</div>"}]}, {"id": "10.3", "title": "假說檢定的其他等價方法", "pg": "p.445", "body": "<p>本節「<b class=\"concept\">假說檢定的其他等價方法</b>」主題涵蓋下列 2 個小節：信賴區間法假說檢定、p 值法假說檢定。概念與公式詳見各小節。</p>", "children": [{"id": "10.3.1", "title": "信賴區間法假說檢定", "pg": "p.445", "body": "<p>區間估計與假說檢定有<span class=\"term\" data-term=\"Duality\">對偶性</span>：把臨界值法的拒絕域改寫，即得信賴區間。</p><ol class=\"nlist\"><li>建立假說 H₀:θ=θ₀ vs Hₐ:θ≠θ₀</li><li>定顯著水準 α</li><li>求 θ 之 (1−α)100% 信賴區間 [L,U]</li><li>若 θ₀∉[L,U] 則拒絕 H₀；若 θ₀∈[L,U] 則不拒絕</li></ol><p>單尾檢定配單邊 C.I.：右尾用單邊下界 [L,∞)，左尾用單邊上界 (−∞,U]。兩母體：檢 μ₁−μ₂ 看 0 是否落在 C.I.，檢 σ₁²/σ₂² 看 1 是否落在 C.I.。</p>"}, {"id": "10.3.2", "title": "p 值法假說檢定", "pg": "p.446", "body": "<p><span class=\"term\" data-term=\"PValue\">p-value</span>：觀念定義為「能拒絕 H₀ 的最小顯著水準」；操作定義為「檢定統計量觀察值 T₀ 在 H₀ 為真下的尾機率（雙尾再 ×2）」。</p><p>直觀：H₀ 真時抽得這組或更極端樣本的機率，又稱樣本觀察的顯著水準。步驟：</p><ol class=\"nlist\"><li>建立假說、定 α</li><li>找檢定統計量及其 H₀ 下分配</li><li>計算 T₀</li><li>求 p-value（尾機率，雙尾 ×2）</li><li>p≤α 則拒絕 H₀；p&gt;α 則不拒絕</li></ol><p>p 愈小樣本愈極端、愈傾向拒絕。離散型統計量難湊恰當臨界值時，p-value 法尤佳。</p>"}]}, {"id": "10.4", "title": "兩母體之假說檢定", "pg": "p.448", "body": "<p>本節「<b class=\"concept\">兩母體之假說檢定</b>」主題涵蓋下列 4 個小節：兩獨立母體期望值差之假說檢定、兩相依母體期望值差之假說檢定、兩獨立母體變異數之假說檢定、兩獨立母體比例差之假說檢定。概念與公式詳見各小節。</p>", "children": [{"id": "10.4.1", "title": "兩獨立母體期望值差之假說檢定", "pg": "p.448", "body": "<p>兩獨立母體 μ₁−μ₂ 差之檢定，H₀:μ₁−μ₂=c（c=0 即檢定兩平均相等）：</p><ol class=\"nlist\"><li>H₀:μ₁−μ₂=c vs Hₐ:μ₁−μ₂≠c</li><li>定 α</li><li>檢定統計量：Case I 變異數已知 <b class=\"sym\">Z=(X̄−Ȳ−c)/√(σ₁²/n₁+σ₂²/n₂)</b>；Case II 相等 <b class=\"sym\">T=(X̄−Ȳ−c)/(S_p√(1/n₁+1/n₂))~t(n₁+n₂−2)</b>；Case III 不等用 <span class=\"term\" data-term=\"Welchdf\">Welch</span> t；Case IV 大樣本 Z</li><li>RR={|Z|≥z_{α/2}} 或 {|T|≥t_{α/2}}</li><li>計算觀察值</li><li>落 RR 則拒絕 H₀</li></ol><p>σ 未知時先作 F 檢定判斷同質再選 Case II/III。</p>"}, {"id": "10.4.2", "title": "兩相依母體期望值差之假說檢定", "pg": "p.452", "body": "<p>兩相依母體先成對相減 Dᵢ=Xᵢ−Yᵢ，H₀:μ_D=c：</p><ol class=\"nlist\"><li>H₀:μ_D=c vs Hₐ:μ_D≠c</li><li>定 α</li><li>檢定統計量：Case I 差為常態 <b class=\"sym\">T=(D̄−c)/(S_D/√m)~t(m−1)</b>；Case II 大樣本 <b class=\"sym\">Z=(D̄−c)/(S_D/√m)~N(0,1)</b></li><li>RR={|T|≥t_{α/2}(m−1)} 或 {|Z|≥z_{α/2}}</li><li>計算觀察值</li><li>落 RR 則拒絕 H₀</li></ol><p>差非常態且小樣本時，改採<span class=\"term\" data-term=\"sign_test\">符號檢定</span>或 <span class=\"term\" data-term=\"wilcoxon_signed\">Wilcoxon 符號等級檢定</span>。</p>"}, {"id": "10.4.3", "title": "兩獨立母體變異數之假說檢定", "pg": "p.455", "body": "<p>兩獨立常態母體變異數比之檢定，H₀:σ₁²=σ₂²：</p><ol class=\"nlist\"><li>H₀:σ₁²=σ₂² vs Hₐ:σ₁²≠σ₂²</li><li>定 α</li><li>檢定統計量 <b class=\"sym\">F=S₁²/S₂² ~ F(n₁−1,n₂−1)</b>（μ 未知）；μ 已知時自由度為 (n₁,n₂)</li><li>RR={F≤F_{1−α/2} 或 F≥F_{α/2}}</li><li>計算觀察值 F₀</li><li>落 RR 則拒絕 H₀</li></ol><div class=\"note\"><b>簡化：</b>多數教本令 <b class=\"sym\">F=max{S₁²,S₂²}/min{S₁²,S₂²}</b>，分子放變異數大者，即可只查右尾 F 表。</div>"}, {"id": "10.4.4", "title": "兩獨立母體比例差之假說檢定", "pg": "p.457", "body": "<p>兩獨立 Bernoulli 母體比例差之檢定，H₀:p₁−p₂=c：</p><ol class=\"nlist\"><li>H₀:p₁−p₂=c vs Hₐ:p₁−p₂≠c</li><li>定 α</li><li>檢定統計量：c≠0 時 <b class=\"sym\">Z=(p̂₁−p̂₂−c)/√[p̂₁(1−p̂₁)/n₁+p̂₂(1−p̂₂)/n₂]</b></li><li>RR={|Z|≥z_{α/2}}</li><li>計算觀察值 Z₀</li><li>落 RR 則拒絕 H₀</li></ol><div class=\"note\"><b>c=0（檢定 p₁=p₂）特例：</b>分母改用混合比例 <b class=\"sym\">p̂=(ΣXᵢ+ΣYⱼ)/(n₁+n₂)</b>，Z=(p̂₁−p̂₂)/√[p̂(1−p̂)(1/n₁+1/n₂)]。</div>"}]}, {"id": "10.5", "title": "假說檢定的進階問題", "pg": "p.460", "body": "<p>本節「<b class=\"concept\">假說檢定的進階問題</b>」主題涵蓋下列 3 個小節：求 α、β 與檢定力問題、假說檢定的樣本數問題、檢定力函數與作業特性函數。概念與公式詳見各小節。</p>", "children": [{"id": "10.5.1", "title": "求 α、β 與檢定力問題", "pg": "p.460", "body": "<p><b class=\"sym\">α=P(拒絕 H₀|H₀ 真)</b>（型一）；<b class=\"sym\">β=P(不拒絕 H₀|Hₐ 真)</b>（型二）；<span class=\"term\" data-term=\"Power\">檢定力 Power=1−β</span>。</p><p>給定 n 固定時，移動臨界值 k 只會讓 α 與 β 互為消長，無法同時下降；增加 n 才有更多資訊，使 α、β 同時下降、檢定力上升。</p><div class=\"formula\"><span class=\"f-label\">求 β</span>把真實母數值（如 μ=μₐ）代入拒絕域，計算「不落入 RR」之機率；α 則在 H₀ 母數值下計算「落入 RR」之機率。</div>"}, {"id": "10.5.2", "title": "假說檢定的樣本數問題", "pg": "p.462", "body": "<p>給定 α 與 β 反解樣本數 n，策略是令「H₀ 下的臨界值」＝「Hₐ 下的臨界值」。</p><div class=\"formula\"><span class=\"f-label\">雙尾檢定</span><b class=\"sym\">n=(z_{α/2}+z_β)²σ²/(μ₀−μₐ)²</b></div><div class=\"formula\"><span class=\"f-label\">單尾檢定</span><b class=\"sym\">n=(z_α+z_β)²σ²/(μ₀−μₐ)²</b></div><p>求得 n 一律無條件進位，才能保證型一誤差 ≤α、型二誤差 ≤β。比例檢定之 n 把 σ² 換為 p₀(1−p₀)。</p>"}, {"id": "10.5.3", "title": "檢定力函數與作業特性函數", "pg": "p.464", "body": "<p><span class=\"term\" data-term=\"PowerFunction\">檢定力函數 PF(θ)</span>=P(拒絕 H₀|θ)：θ∈H₀ 時=α；θ∈Hₐ 時=1−β=power。繪出即檢定力曲線 PC。</p><p><span class=\"term\" data-term=\"OCFunction\">作業特性函數 OCF(θ)</span>=P(不拒絕 H₀|θ)：θ∈H₀ 時=1−α；θ∈Hₐ 時=β。繪出即作業特性曲線 OCC。</p><div class=\"note\"><b>錯誤曲線 EC：</b>取 PC 在 H₀ 段（型一 α）與 OCC 在 Hₐ 段（型二 β）合併，即為錯誤曲線。n 增加時整體曲線外移、檢定力上升。</div>"}]}], "11": [{"id": "11.1", "title": "變異數分析概論", "pg": "p.467", "body": "<p>本節「<b class=\"concept\">變異數分析概論</b>」主題涵蓋下列 2 個小節：多個獨立母體期望值之檢定、實驗設計概論。概念與公式詳見各小節。</p>", "children": [{"id": "11.1.1", "title": "多個獨立母體期望值之檢定", "pg": "p.467", "body": "<p><span class=\"term\" data-term=\"ANOVA\">變異數分析 ANOVA</span> 由 <b class=\"proper\">R. A. Fisher</b> 於 1925 年《研究工作者的統計方法》建立，用以檢定 k 個獨立母體平均數是否相等：</p><div class=\"formula\"><span class=\"f-label\">假說</span>H₀:μ₁=μ₂=…=μ_k；Hₐ:μ₁,μ₂,…,μ_k 不完全相等</div><p>若改拆成 C(k,2) 次兩兩 t 檢定，不僅繁瑣，更使整體型一誤差率膨脹：<b class=\"sym\">α_ew=1−(1−α_pc)^C ≥ α_pc</b>。<span class=\"term\" data-term=\"EER\">α_ew 為全實驗錯誤率 EER</span>、α_pc 為單一比較錯誤率。ANOVA 一次檢定即可避免此膨脹。</p>"}, {"id": "11.1.2", "title": "實驗設計概論", "pg": "p.468", "body": "<p><b class=\"proper\">Fisher</b> 1935 年《實驗設計》賦予 ANOVA 實驗設計意義。<span class=\"term\" data-term=\"ExperimentalDesign\">實驗設計 DOE</span> 目的在有系統地安排實驗，釐清因子是否影響反應變數。</p><p>關鍵名詞：實驗單位、反應變數、<span class=\"term\" data-term=\"Factor\">因子</span>（類別型自變數）、水準（因子內類別）、處理（水準組合）。</p><div class=\"note\"><b>三大原則：</b><span class=\"term\" data-term=\"Blocking\">重複、隨機化、區集化</span>。隨機化處理「未知不可控」干擾，區集化處理「已知可控」干擾；<span class=\"term\" data-term=\"FactorialDesign\">要因設計</span>操弄所有水準組合，可同時檢定主效果與交互作用。</div>"}]}, {"id": "11.2", "title": "一因子變異數分析完全隨機化設計", "pg": "p.471", "body": "<p>本節「<b class=\"concept\">一因子變異數分析完全隨機化設計</b>」主題涵蓋下列 2 個小節：One-way ANOVA CRD 基本模型、One-way ANOVA CRD 檢定步驟。概念與公式詳見各小節。</p>", "children": [{"id": "11.2.1", "title": "One-way ANOVA CRD 基本模型", "pg": "p.471", "body": "<p><span class=\"term\" data-term=\"CRD\">完全隨機化設計 CRD</span>：隨機分配 n 個實驗單位到 k 個處理，模型 <b class=\"sym\">Yᵢⱼ=μ+αᵢ+εᵢⱼ=μᵢ+εᵢⱼ</b>，αᵢ=μᵢ−μ 為處理效應、Σαᵢ=0。</p><p>假設：εᵢⱼ~N(0,σ²)，即 E(ε)=0、同質變異數、獨立、常態（固定效果模式）。</p><div class=\"formula\"><span class=\"f-label\">平方和分解</span><b class=\"sym\">SSTO=SSTR+SSE</b>；MSTR=SSTR/(k−1)，<span class=\"term\" data-term=\"SSE\">MSE=SSE/(n−k)</span></div><div class=\"formula\"><span class=\"f-label\">抽樣分配（H₀ 下）</span><b class=\"sym\">F=MSTR/MSE ~ F(k−1,n−k)</b>；(n−k)MSE/σ² ~ χ²(n−k)</div>"}, {"id": "11.2.2", "title": "One-way ANOVA CRD 檢定步驟", "pg": "p.476", "body": "<p>One-way ANOVA CRD 檢定步驟：</p><ol class=\"nlist\"><li>H₀:無處理效應（αᵢ 全為 0）/ μ₁=…=μ_k；Hₐ:效應存在</li><li>定 α</li><li>檢定統計量 <b class=\"sym\">F=MSTR/MSE ~ F(k−1,n−k)</b></li><li>RR={F≥F_α(k−1,n−k)}（一律右尾）</li><li>計算 F₀=MSTR/MSE</li><li>F₀∈RR 則拒絕 H₀</li></ol><div class=\"formula\"><span class=\"f-label\">平方和</span>SSTO=ΣΣY²−CT；SSTR=Σnᵢ(Yᵢ.−Y..)²；SSE=SSTO−SSTR。E(MSE)=σ²、E(MSTR)=σ²+Σnᵢαᵢ²/(k−1)，故右尾。k=2 時 ANOVA 的 F=t²，與兩母體混合 t 檢定等價。</div>"}]}, {"id": "11.3", "title": "變異數分析之特殊課題", "pg": "p.484", "body": "<p>本節「<b class=\"concept\">變異數分析之特殊課題</b>」主題涵蓋下列 4 個小節：變異數分析模型中的區間估計、聯立信賴區間、多重比較、模型診斷。概念與公式詳見各小節。</p>", "children": [{"id": "11.3.1", "title": "變異數分析模型中的區間估計", "pg": "p.484", "body": "<p>ANOVA 模型中的區間估計：</p><div class=\"formula\"><span class=\"f-label\">σ² 之 C.I.</span><b class=\"sym\">[(n−k)MSE/χ²_{α/2}(n−k), (n−k)MSE/χ²_{1−α/2}(n−k)]</b></div><div class=\"formula\"><span class=\"f-label\">單一 μᵢ 之 C.I.</span><b class=\"sym\">Yᵢ. ± t_{α/2}(n−k)·√(MSE/nᵢ)</b></div><div class=\"formula\"><span class=\"f-label\">μᵢ−μⱼ 單一 C.I.</span><b class=\"sym\">(Yᵢ.−Yⱼ.) ± t_{α/2}(n−k)·√[MSE(1/nᵢ+1/nⱼ)]</b></div><p>此「單一 C.I.」一次只求一組 i、j，誤差用 MSE 取代混合樣本變異數。</p>"}, {"id": "11.3.2", "title": "聯立信賴區間", "pg": "p.487", "body": "<p><span class=\"term\" data-term=\"SimultaneousCI\">聯立信賴區間</span>同時求全部 C(k,2) 組兩兩 μᵢ−μⱼ。若各組各別取 (1−α)，整體聯立信心只剩 <b class=\"sym\">(1−α)^C &lt; (1−α)</b>（如 k=3 各別 95%，整體僅 85.7%）。</p><div class=\"formula\"><span class=\"f-label\"><span class=\"term\" data-term=\"Bonferroni\">Bonferroni 修正</span></span>各別改用 (1−α/C)，整體 ≥1−α；缺點 k 大時區間過長</div><div class=\"formula\"><span class=\"f-label\">另兩法</span><span class=\"term\" data-term=\"ScheffeMethod\">Scheffe 法</span>（可推廣至線性對照）、<span class=\"term\" data-term=\"TukeyHSD\">Tukey 法</span>（需各組 n 相同，查 studentized range q 表）</div>"}, {"id": "11.3.3", "title": "多重比較", "pg": "p.488", "body": "<p>拒絕 H₀ 後，以<span class=\"term\" data-term=\"MultipleComparison\">多重比較</span>探究各母體相對大小。C(k,2) 次比較會使 <b class=\"sym\">α_ew=1−(1−α_pc)^C ≥ α_pc</b>，不可直接重複用兩母體 t 檢定。</p><div class=\"formula\"><span class=\"f-label\"><span class=\"term\" data-term=\"TukeyHSD\">Tukey HSD</span></span><b class=\"sym\">HSD=q_α(k,n−k)·√[MSE/2·(1/nᵢ+1/nⱼ)]</b>；|Yᵢ.−Yⱼ.|≥HSD 即顯著，樣本不等時用 Tukey–Kramer</div><div class=\"formula\"><span class=\"f-label\">Fisher LSD</span><b class=\"sym\">LSD=t_{α/2}(n−k)·√[MSE(1/nᵢ+1/nⱼ)]</b>；|差|≥LSD 即拒絕，本質是單一 C.I.，會膨脹整體型一誤差</div><p>另可配 Bonferroni、Scheffe 聯立 C.I. 後以 C.I. 法檢定。</p>"}, {"id": "11.3.4", "title": "模型診斷", "pg": "p.491", "body": "<p><span class=\"term\" data-term=\"ModelDiagnostics\">模型診斷</span>在套 ANOVA 前檢查常態、同質變異數、獨立三大假設。</p><p><b>同質變異數診斷：</b>Bartlett 檢定（χ²）、Hartley 檢定（H=max Sᵢ²/min Sᵢ²，須各組 n 相同）、修正 Levene 檢定（對偏常態 robust，先轉成絕對離差 MAD 再作 ANOVA）。</p><p><b>常態性診斷：</b>常態機率圖（Q-Q 圖）、χ² 適合度、K-S、Lilliefors、Shapiro–Wilk。</p><div class=\"note\"><b>補救：</b>異質變異數→變異數穩定化轉換；非常態→改無母數法，CRD 用 <span class=\"term\" data-term=\"kruskal_wallis\">Kruskal–Wallis</span>、RBD 用 <span class=\"term\" data-term=\"friedman\">Friedman</span>（仍需同質變異數）。</div>"}]}, {"id": "11.4", "title": "一因子變異數分析隨機區集化設計", "pg": "p.496", "body": "<p>本節「<b class=\"concept\">一因子變異數分析隨機區集化設計</b>」主題涵蓋下列 2 個小節：One-way ANOVA RBD 基本模型、One-way ANOVA RBD 檢定步驟。概念與公式詳見各小節。</p>", "children": [{"id": "11.4.1", "title": "One-way ANOVA RBD 基本模型", "pg": "p.496", "body": "<p><span class=\"term\" data-term=\"RBD\">隨機區集化設計 RBD</span>：k 個處理、b 個區集，n=kb，每處理在每區集各做一次。模型 <b class=\"sym\">Yᵢⱼ=μ+αᵢ+βⱼ+εᵢⱼ</b>，βⱼ 為區集效應，Σαᵢ=Σβⱼ=0。</p><p>假設同 CRD（ε~N(0,σ²)、同質、獨立、常態）。把區集視為第二因子，RBD 即不重複 two-way ANOVA。因有 βⱼ，可視為 k 個相依母體平均數是否相等之檢定。</p><div class=\"formula\"><span class=\"f-label\">平方和分解</span><b class=\"sym\">SSTO=SSTR+SSB+SSE</b>；MSE df=(k−1)(b−1)。F₁=MSTR/MSE~F(k−1,(k−1)(b−1))；F₂=MSB/MSE~F(b−1,(k−1)(b−1))</div>"}, {"id": "11.4.2", "title": "One-way ANOVA RBD 檢定步驟", "pg": "p.500", "body": "<p>RBD 分別檢定處理效應與區集效應：</p><ol class=\"nlist\"><li>處理：H₀:αᵢ=0（各處理平均相等）；區集：H₀:βⱼ=0（各區集平均相等）</li><li>定 α</li><li>處理檢定統計量 <b class=\"sym\">F₁=MSTR/MSE ~ F(k−1,(k−1)(b−1))</b>；區集 <b class=\"sym\">F₂=MSB/MSE ~ F(b−1,(k−1)(b−1))</b></li><li>RR={F≥F_α(df₁,df₂)}（皆右尾）</li><li>計算 F₁₀、F₂₀</li><li>落 RR 則拒絕對應 H₀</li></ol><div class=\"formula\"><span class=\"f-label\">平方和</span>SSTR=bΣ(Yᵢ.−Y..)²；SSB=kΣ(Y.ⱼ−Y..)²；SSE=SSTO−SSTR−SSB。處理與區集完全對稱，二者有無顯著互不相關。</div>"}]}, {"id": "11.5", "title": "一因子變異數分析拉丁方格設計", "pg": "p.505", "body": "<p>本節「<b class=\"concept\">一因子變異數分析拉丁方格設計</b>」主題涵蓋下列 1 個小節：One-way ANOVA LSD 基本模型。概念與公式詳見各小節。</p>", "children": [{"id": "11.5.1", "title": "One-way ANOVA LSD 基本模型", "pg": "p.505", "body": "<p><span class=\"term\" data-term=\"LSDdesign\">拉丁方格設計 LSD</span>：p 個處理，另有列區集、行區集各 p 個水準，只做 n=p² 次實驗，以「跑馬燈」方式均衡配置，使每列、每行都涵蓋全部處理。</p><div class=\"formula\"><span class=\"f-label\">模型</span><b class=\"sym\">Yᵢⱼₖ=μ+αᵢ+βⱼ+γₖ+εᵢⱼₖ</b>，βⱼ 列區集效應、γₖ 行區集效應</div><div class=\"formula\"><span class=\"f-label\">平方和</span><b class=\"sym\">SSTO=SSTR+SSR+SSC+SSE</b>，誤差 df=(p−1)(p−2)；三個 F 各以 MSE 為分母</div><p>優點：一次同時控制兩個干擾變數、省實驗；缺點：無法研究交互作用，n 小而檢定力低。</p>"}]}, {"id": "11.6", "title": "二因子變異數分析", "pg": "p.508", "body": "<p>本節「<b class=\"concept\">二因子變異數分析</b>」主題涵蓋下列 3 個小節：Two-way ANOVA 基本模型、Two-way ANOVA 檢定步驟、Two-way ANOVA 圖解交互作用效應。概念與公式詳見各小節。</p>", "children": [{"id": "11.6.1", "title": "Two-way ANOVA 基本模型", "pg": "p.508", "body": "<p><span class=\"term\" data-term=\"TwoWayANOVA\">二因子變異數分析</span>：A 因子 a 水準、B 因子 b 水準，每格重複 r 次，n=abr。模型 <b class=\"sym\">Yᵢⱼₖ=μ+αᵢ+βⱼ+(αβ)ᵢⱼ+εᵢⱼₖ</b>，(αβ)ᵢⱼ 為<span class=\"term\" data-term=\"Interaction\">交互作用</span>效應；Σαᵢ=Σβⱼ=Σⱼ(αβ)ᵢⱼ=Σᵢ(αβ)ᵢⱼ=0。</p><p>此時「處理」=兩因子水準之組合，不再等同單一水準。</p><div class=\"formula\"><span class=\"f-label\">平方和分解</span><b class=\"sym\">SSTO=SSA+SSB+SSAB+SSE</b>；MSA=SSA/(a−1)、MSB=SSB/(b−1)、MSAB=SSAB/((a−1)(b−1))、MSE=SSE/[ab(r−1)]</div>"}, {"id": "11.6.2", "title": "Two-way ANOVA 檢定步驟", "pg": "p.512", "body": "<p>Two-way ANOVA 三個 F 檢定：</p><ol class=\"nlist\"><li>A 因子：H₀:αᵢ=0；<b class=\"sym\">F₁=MSA/MSE~F(a−1,ab(r−1))</b></li><li>B 因子：H₀:βⱼ=0；<b class=\"sym\">F₂=MSB/MSE~F(b−1,ab(r−1))</b></li><li>交互作用：H₀:(αβ)ᵢⱼ=0；<b class=\"sym\">F₃=MSAB/MSE~F((a−1)(b−1),ab(r−1))</b></li><li>各定 α，RR={F≥F_α}（右尾）</li><li>計算 F₁₀、F₂₀、F₃₀</li><li>落 RR 則拒絕對應 H₀</li></ol><div class=\"warn\"><b>順序：</b>必先檢交互作用；若顯著，主效果內涵變複雜，應改看處理平均 Yᵢⱼ.，不可只比主效果。</div>"}, {"id": "11.6.3", "title": "Two-way ANOVA 圖解交互作用效應", "pg": "p.517", "body": "<p>用<span class=\"term\" data-term=\"InteractionPlot\">處理平均圖（交互作用圖）</span>圖解兩因子交互作用：一因子水準為橫軸、反應平均為縱軸，另一因子各畫一條折線。</p><div class=\"formula\"><span class=\"f-label\">判讀</span>線段「接近平行」→ 無交互作用；線段「不平行」（未必要交叉）→ 有交互作用</div><p>分析 Two-way ANOVA 時務必先看交互作用 F 檢定：若存在顯著交互作用，主效果的解讀會被扭曲，應著重分析各處理格平均 Yᵢⱼ. 及交互作用圖，再決定如何解讀兩因子效果。</p>"}]}, {"id": "11.7", "title": "三因子變異數分析", "pg": "p.519", "body": "<p>三因子（A、B、C）模型除主效果外，含三個二階交互作用（A×B、A×C、B×C）與一個三階交互作用（A×B×C），共 8 個 F 檢定項，誤差自由度為 abc(r−1)。平方和恆等式 SSTO=SSA+SSB+SSC+SSAB+SSAC+SSBC+SSABC+SSE。</p>"}], "12": [{"id": "12.1", "title": "相關分析", "pg": "p.521", "body": "<p>本節「<b class=\"concept\">相關分析</b>」主題涵蓋下列 2 個小節：母體相關分析、樣本相關分析。概念與公式詳見各小節。</p>", "children": [{"id": "12.1.1", "title": "母體相關分析", "pg": "p.521", "body": "<p><span class=\"term\" data-term=\"pop_corr\">母體相關係數</span>用來衡量兩屬量隨機變數 X 與 Y 之間的<b class=\"concept\">直線線性相關程度</b>。必先掌握 X、Y 的聯合分配 f<sub>xy</sub>(x,y)（母體分配），才能求出真實的母體參數。先定義<span class=\"term\" data-term=\"pop_cov\">母體共變異數</span> <b class=\"sym\">σ<sub>xy</sub>=Cov(X,Y)=E[(X−μ<sub>x</sub>)(Y−μ<sub>y</sub>)]</b>，再除以兩標準差標準化得 <b class=\"sym\">ρ<sub>xy</sub>=σ<sub>xy</sub>/(σ<sub>x</sub>σ<sub>y</sub>)</b>。</p><p>計算步驟為：f<sub>xy</sub>→E(X)、E(Y)、E(X²)、E(Y²)、E(XY)→Var(X)、Var(Y)、Cov(X,Y)→<b class=\"sym\">ρ<sub>xy</sub></b>。性質為 −1≤<b class=\"sym\">ρ</b>≤1：正號表正相關、負號表負相關，|ρ| 愈大線性關係愈強。</p>"}, {"id": "12.1.2", "title": "樣本相關分析", "pg": "p.522", "body": "<p>母體 σ<sub>xy</sub>、ρ<sub>xy</sub> 通常未知，只能以 n 筆成對樣本 (X<sub>i</sub>,Y<sub>i</sub>) 估計。先定義三個常用平方和 <b class=\"sym\">S<sub>xx</sub>=Σ(X<sub>i</sub>−X̄)²</b>、<b class=\"sym\">S<sub>yy</sub>=Σ(Y<sub>i</sub>−Ȳ)²</b>、<b class=\"sym\">S<sub>xy</sub>=Σ(X<sub>i</sub>−X̄)(Y<sub>i</sub>−Ȳ)</b>。</p><p>樣本共變異數 s<sub>xy</sub>=S<sub>xy</sub>/(n−1)，再以<span class=\"term\" data-term=\"pearson_r\"><b class=\"proper\">Pearson</b> 乘積動差相關係數</span>估計 ρ：<b class=\"sym\">r<sub>xy</sub>=S<sub>xy</sub>/√(S<sub>xx</sub>S<sub>yy</sub>)</b>，−1≤r≤1。僅適用兩變數皆為 interval/ratio 尺度。</p><div class=\"warn\"><b>注意：</b>相關不必然因果，強烈相關可能來自<span class=\"term\" data-term=\"lurking\">潛在變數</span> Z 的共同反應；因果須靠理論先驗推衍，不能由統計數據建立。</div>"}]}, {"id": "12.2", "title": "簡單線性迴歸分析", "pg": "p.526", "body": "<p>本節「<b class=\"concept\">簡單線性迴歸分析</b>」主題涵蓋下列 6 個小節：簡單線性迴歸分析概論、簡單線性迴歸之模型與假設、簡單線性迴歸之點估計與抽樣分配、簡單線性迴歸中的統計推論、判定係數與整體 F 檢定、殘差性質。概念與公式詳見各小節。</p>", "children": [{"id": "12.2.1", "title": "簡單線性迴歸分析概論", "pg": "p.526", "body": "<p><span class=\"term\" data-term=\"regression\">迴歸分析</span>由 <b class=\"proper\">Francis Galton</b> 1886 年研究身高遺傳時提出，發現子女身高有「向平均迴歸」現象。與 ANOVA 同處理解釋變數 X 對反應變數 Y 的影響；差異在於 ANOVA 的 X 是類別（因子），迴歸的 X 是屬量（如廣告費、肥料用量），而 Y 皆為屬量。</p><p>相較<span class=\"term\" data-term=\"pop_corr\">相關分析</span>無方向性，迴歸具方向性：把 X 設為<span class=\"concept\">解釋變數（自變數）</span>、Y 設為<span class=\"concept\">被解釋變數（依變數）</span>，探討 Y 的變化能否由 X 解釋。引入屬質解釋變數時須用<span class=\"term\" data-term=\"dummy\">虛擬變數</span>，結果與 ANOVA 等價。</p>"}, {"id": "12.2.2", "title": "簡單線性迴歸之模型與假設", "pg": "p.527", "body": "<p><span class=\"term\" data-term=\"slr_model\">簡單線性迴歸模型</span>（一個解釋變數）：<b class=\"sym\">Y<sub>i</sub>=β₀+β₁X<sub>i</sub>+ε<sub>i</sub>=E(Y)+ε<sub>i</sub></b>。母體迴歸式 PRF 為 E(Y)=β₀+β₁X；樣本迴歸式 SRF 為 Ŷ=b̂₀+b̂₁X，殘差 e<sub>i</sub>=Y<sub>i</sub>−Ŷ<sub>i</sub>。</p><div class=\"note\"><b>六大古典假設：</b><ol class=\"nlist\"><li>Y 與 X 為模型設定之線性關係；</li><li>X 非隨機且至少取兩個不同值（S<sub>xx</sub>&gt;0）；</li><li>E(ε<sub>i</sub>)=0；</li><li><span class=\"term\" data-term=\"homo\">同質變異數</span> Var(ε<sub>i</sub>)=σ²；</li><li>序列獨立 Cov(ε<sub>i</sub>,ε<sub>j</sub>)=0；</li><li>常態性 ε~N(0,σ²)。</li></ol>綜合得 Y<sub>i</sub>~N(β₀+β₁X<sub>i</sub>,σ²)。</div>"}, {"id": "12.2.3", "title": "簡單線性迴歸之點估計與抽樣分配", "pg": "p.529", "body": "<p>採<span class=\"term\" data-term=\"ols\">最小平方法 OLS</span>，使殘差平方和 SSE=Σe<sub>i</sub>² 最小，一階條件形成<span class=\"term\" data-term=\"normal_eq\">正規方程組</span>，解得 <b class=\"sym\">b̂₁=S<sub>xy</sub>/S<sub>xx</sub></b>、<b class=\"sym\">b̂₀=Ȳ−b̂₁X̄</b>；求解不需常態假設。正規方程組隱含 Σe<sub>i</sub>=0、Σe<sub>i</sub>X<sub>i</sub>=0，故樣本迴歸式必過 (X̄,Ȳ)。</p><p>常態假設下 <span class=\"term\" data-term=\"mle\">MLE</span> 與 OLS 相同。<b class=\"proper\">Gauss-Markov</b> 定理：b̂₀、b̂₁ 為線性、不偏，且是<span class=\"term\" data-term=\"blue\">最佳線性不偏估計量 BLUE</span>。抽樣分配：b̂₁~N(β₁,σ²/S<sub>xx</sub>)、b̂₀~N(β₀,σ²(1/n+X̄²/S<sub>xx</sub>))，且 (n−2)MSE/σ²~χ²(n−2)，<b class=\"sym\">MSE=SSE/(n−2)</b> 為 σ² 之不偏估計。</p>"}, {"id": "12.2.4", "title": "簡單線性迴歸中的統計推論", "pg": "p.537", "body": "<p>σ² 未知下以 MSE 取代建樞紐量。斜率 β₁ 之 (1−α)100% 信賴區間：<b class=\"sym\">b̂₁±t<sub>α/2</sub>(n−2)√(MSE/S<sub>xx</sub>)</b>；截距 β₀ 為 b̂₀±t<sub>α/2</sub>(n−2)√(MSE(1/n+X̄²/S<sub>xx</sub>))。X=x₀ 下 E(Y) 的信賴區間，與新 Y 的<span class=\"term\" data-term=\"ci_pi\">預測區間</span>後者較寬（多出 1+1/n 項）。</p><p>假說檢定以 <b class=\"sym\">T=(b̂₁−0)/SE(b̂₁)~t(n−2)</b>，稱 <b class=\"sym\">t-ratio</b>；最重要為 H₀:β₁=0（X 對 Y 無解釋力）vs Hₐ:β₁≠0。ρ=0 的檢定 T=r√(n−2)/√(1−r²)~t(n−2)；檢定 ρ≠0 須用 <span class=\"term\" data-term=\"fishers_z\">Fisher Z 轉換</span>（n≥25）。</p>"}, {"id": "12.2.5", "title": "判定係數與整體 F 檢定", "pg": "p.546", "body": "<p><span class=\"term\" data-term=\"anova_decomp\">平方和分解</span>：<b class=\"sym\">SSTO=SSR+SSE</b>，分別為總、迴歸（可解釋）、誤差平方和。<span class=\"term\" data-term=\"r_squared\">判定係數</span> <b class=\"sym\">R²=SSR/SSTO</b>，0≤R²≤1，衡量 Y 變異中可被 X 線性解釋的比例；簡單迴歸 r=±√R²、複相關係數 R=|r|。</p><p>MSR=SSR/1、MSE=SSE/(n−2)，整體 <b class=\"sym\">F=MSR/MSE~F(1,n−2)</b>，右尾檢定 H₀:迴歸式無解釋力（=β₁=0=ρ=0），與 β₁ 的 t 檢定、ρ=0 檢定<span class=\"concept\">三者等價</span>，F=t²；亦可寫 F=(n−2)R²/(1−R²)。</p>"}, {"id": "12.2.6", "title": "殘差性質", "pg": "p.551", "body": "<div class=\"note\"><b>殘差 e<sub>i</sub>=Y<sub>i</sub>−Ŷ<sub>i</sub> 的代數性質（由正規方程組而來）：</b><ol class=\"nlist\"><li>Σe<sub>i</sub>=0，故殘差平均 ē=0；</li><li>ΣY<sub>i</sub>=ΣŶ<sub>i</sub>，故 Ȳ=Ŷ̄；</li><li>ΣX<sub>i</sub>e<sub>i</sub>=0（殘差與解釋變數相乘和為 0）；</li><li>ΣŶ<sub>i</sub>e<sub>i</sub>=0（殘差與配適值正交）。</li></ol></div><p>由此導出<b class=\"concept\">平方和恆等式</b> SSTO=SSR+SSE：把每筆 Y<sub>i</sub>−Ȳ 拆成 (Ŷ<sub>i</sub>−Ȳ)+(Y<sub>i</sub>−Ŷ<sub>i</sub>)，交叉項 Σ(Ŷ<sub>i</sub>−Ȳ)e<sub>i</sub>=0 而得。殘差圖亦用來診斷後續違反古典假設的問題。</p>"}]}, {"id": "12.3", "title": "簡單線性迴歸的特殊課題", "pg": "p.553", "body": "<p>本節「<b class=\"concept\">簡單線性迴歸的特殊課題</b>」主題涵蓋下列 5 個小節：資料之比例因子與平移、正迴歸與逆迴歸、離差形式與標準化形式、特殊函數型式、無截距模型與無斜率模型。概念與公式詳見各小節。</p>", "children": [{"id": "12.3.1", "title": "資料之比例因子與平移", "pg": "p.553", "body": "<p><b class=\"concept\">比例因子</b>：令 Y*=aY、X*=bX，代入 Ŷ=b̂₀+b̂₁X 得新斜率 <b class=\"sym\">b̂₁*=(a/b)b̂₁</b>、新截距 <b class=\"sym\">b̂₀*=a·b̂₀</b>。</p><p><b class=\"concept\">平移</b>：令 Y*=Y+c、X*=X+d，則 Ŷ*=Ŷ+c=b̂₀+b̂₁(X*−d)+c，新斜率 <b class=\"sym\">b̂₁*=b̂₁</b>（斜率不變）、新截距 <b class=\"sym\">b̂₀*=b̂₀+c−b̂₁d</b>。提醒：相關係數與 R² 在線性變換下不變。</p>"}, {"id": "12.3.2", "title": "正迴歸與逆迴歸", "pg": "p.553", "body": "<p>同一筆資料，以 Y 對 X 跑迴歸得 <b class=\"sym\">Ŷ=b̂₀+b̂₁X</b>；改以 X 對 Y 跑逆迴歸得 X̂=â₀+â₁Y。兩條並非同一直線，只有 R²=1 時才完全重合。</p><p>正、逆斜率之乘積恰為判定係數：<b class=\"sym\">b̂₁·â₁=S<sub>xy</sub>²/(S<sub>xx</sub>S<sub>yy</sub>)=R²=r²</b>。故正、逆迴歸具有相同 R²；由 b̂₁=r·(S<sub>y</sub>/S<sub>x</sub>) 可反解 r=±√(b̂₁·â₁)。</p>"}, {"id": "12.3.3", "title": "離差形式與標準化形式", "pg": "p.553", "body": "<p>由 b̂₀=Ȳ−b̂₁X̄ 代入迴歸式，得<b class=\"concept\">離差形式</b>：<b class=\"sym\">Ŷ−Ȳ=b̂₁(X−X̄)</b>，直觀呈現迴歸線過 (X̄,Ȳ)。</p><p>兩側除以標準差，得<b class=\"concept\">標準化形式</b>：<b class=\"sym\">(Ŷ−Ȳ)/S<sub>y</sub>=r·(X−X̄)/S<sub>x</sub></b>，即以 z 分數表示時斜率即相關係數 r。意義：X 變動一個標準差，Y 平均變動 r 個標準差。</p>"}, {"id": "12.3.4", "title": "特殊函數型式", "pg": "p.554", "body": "<p>只要<b class=\"concept\">迴歸係數是線性的</b>，即可用線性迴歸處理非線性 X：如 <b class=\"sym\">Y=β₀+β₁X²+ε</b>、<b class=\"sym\">Y=β₀+β₁√X+ε</b>、<b class=\"sym\">Y=β₀+β₁(1/X)+ε</b>，先把 X 轉換成新變數再跑 OLS。</p><p>連係數也非線性者，可<b class=\"concept\">可線性化</b>：<b class=\"sym\">Y=β₀X^β₁·ε</b> 取對數得 lnY=lnβ₀+(lnβ₁)lnX+lnε；<b class=\"sym\">Y=β₀β₁^X·ε</b> 取對數得 lnY=lnβ₀+(lnβ₁)X+lnε，化為線性後估計再還原。</p>"}, {"id": "12.3.5", "title": "無截距模型與無斜率模型", "pg": "p.555", "body": "<p><b class=\"concept\">無截距模型</b>（已知 β₀=0）：Y=β₁X+ε，OLS 為 b̂₁=ΣXY/ΣX²，過原點而不再過 (X̄,Ȳ)；此時 Σe 不為 0、SSTO≠SSR+SSE，故 R² 可能超出 0~1，意義不大。</p><p><b class=\"concept\">無斜率模型</b>（已知 β₁=0）：Y=β₀+ε，OLS 為 b̂₀=Ȳ，E(b̂₀)=β₀、Var(b̂₀)=σ²/n；此即證明樣本平均數 Ȳ 是 E(Y) 的 BLUE。</p>"}]}, {"id": "12.4", "title": "多元線性迴歸分析", "pg": "p.556", "body": "<p>本節「<b class=\"concept\">多元線性迴歸分析</b>」主題涵蓋下列 4 個小節：多元線性迴歸之模型與假設、多元線性迴歸中的區間估計與假說檢定、整體 F 檢定、判定係數與調整判定係數、偏 F 檢定、偏判定係數與偏相關係數。概念與公式詳見各小節。</p>", "children": [{"id": "12.4.1", "title": "多元線性迴歸之模型與假設", "pg": "p.556", "body": "<p><span class=\"term\" data-term=\"slr_model\">複迴歸模型</span>有 k−1 個解釋變數：<b class=\"sym\">Y<sub>i</sub>=β₀+β₁X<sub>i1</sub>+…+β<sub>k−1</sub>X<sub>i,k−1</sub>+ε<sub>i</sub></b>，母體迴歸式 E(Y)=β₀+β₁X₁+…。除沿用簡單模型六假設（線性、X 非隨機、Eε=0、<span class=\"term\" data-term=\"homo\">同質變異數</span>、序列獨立、常態）外，新增第七假設：<b class=\"concept\">解釋變數間無完全線性相依</b>。</p><p>OLS 以矩陣解 <b class=\"sym\">b̂=(X′X)⁻¹X′Y</b>；僅兩個自變數時有公式解。抽樣分配：b̂<sub>j</sub>~N(β<sub>j</sub>,Var(b̂<sub>j</sub>))、(n−k)MSE/σ²~χ²(n−k)，<b class=\"sym\">MSE=SSE/(n−k)</b>。</p>"}, {"id": "12.4.2", "title": "多元線性迴歸中的區間估計與假說檢定", "pg": "p.558", "body": "<p>各迴歸係數 β<sub>j</sub>（j=0,…,k−1）之 (1−α)100% 信賴區間為 <b class=\"sym\">b̂<sub>j</sub>±t<sub>α/2</sub>(n−k)·SE(b̂<sub>j</sub>)</b>。</p><p>個別係數檢定 H₀:β<sub>j</sub>=b 對 Hₐ:β<sub>j</sub>≠b，統計量 <b class=\"sym\">T=(b̂<sub>j</sub>−b)/SE(b̂<sub>j</sub>)~t(n−k)</b>。最重要者 H₀:β<sub>j</sub>=0（控制其他變數後 X<sub>j</sub> 對 Y 無解釋力），其 t 統計量稱 <b class=\"sym\">t-ratio</b>；拒絕代表在已含其他變數下，X<sub>j</sub> 仍有邊際解釋力。</p>"}, {"id": "12.4.3", "title": "整體 F 檢定、判定係數與調整判定係數", "pg": "p.560", "body": "<p><b class=\"concept\">整體 F 檢定</b>檢定全部斜率同時為 0：H₀:β₁=…=β<sub>k−1</sub>=0 vs Hₐ:不全為 0，<b class=\"sym\">F=MSR/MSE~F(k−1,n−k)</b>，右尾拒絕。ANOVA 表中迴歸 df=k−1、誤差 df=n−k。</p><p><span class=\"term\" data-term=\"r_squared\">R²</span>=SSR/SSTO 的缺陷：多加變數只會使 SSE 下降、R² 上升。故定義<span class=\"term\" data-term=\"adj_r2\">調整判定係數</span> <b class=\"sym\">R̄²=1−[SSE/(n−k)]/[SSTO/(n−1)]</b>，R̄²≤R²，R² 很小時可能為負；|t<sub>j</sub>|&gt;1 才使 R̄² 上升。F 亦可寫成 (n−k)R²/[(k−1)(1−R²)]。</p>"}, {"id": "12.4.4", "title": "偏 F 檢定、偏判定係數與偏相關係數", "pg": "p.564", "body": "<p><span class=\"term\" data-term=\"partial_f\">偏 F 檢定</span>同時檢定多個（非全部）係數為 0，比較完整模型 f 與縮減模型 r：<b class=\"sym\">F=[(SSE<sub>r</sub>−SSE<sub>f</sub>)/m]/[SSE<sub>f</sub>/(n−k)]~F(m,n−k)</b>，m 為被移除變數個數。</p><p><b class=\"concept\">偏判定係數</b> R²<sub>加入Xj|其餘</sub>=(SSE<sub>r</sub>−SSE<sub>f</sub>)/SSE<sub>r</sub>，衡量加入 X<sub>j</sub> 後殘差下降比例。<span class=\"term\" data-term=\"partial_r\">偏相關係數</span> r<sub>Yj|其餘</sub>=sign(b̂<sub>j</sub>)√(偏 R²)，在控制其他變數後衡量 X<sub>j</sub> 與 Y 的淨相關；個別 t-ratio 與偏 F 有 t²=F 關係。</p>"}]}, {"id": "12.5", "title": "迴歸分析之進階課題", "pg": "p.567", "body": "<p>本節「<b class=\"concept\">迴歸分析之進階課題</b>」主題涵蓋下列 1 個小節：違反古典假設的一些問題。概念與公式詳見各小節。</p>", "children": [{"id": "12.5.1", "title": "違反古典假設的一些問題", "pg": "p.567", "body": "<p>各古典假設被違背時：<b class=\"concept\">模型設定錯誤</b>——繪殘差圖、做 lack-of-fit 檢定（SSTO=SSTR+SSLF+SSPE）。<b class=\"concept\">異質變異數</b>——係數仍不偏一致但非 BLUE，標準誤失真致 t、F 檢定失效，改採 GLS/WLS。<b class=\"concept\">自我相關</b>——時間序列常見，以 <b class=\"proper\">Durbin-Watson</b> 檢一階相關，改採準差分或落後變數。</p><p><b class=\"concept\">共線性</b>——完全共線時係數無法估計；高度共線時 SE(b̂<sub>j</sub>) 膨脹、t 值傾向不顯著（R² 大卻各係數不顯著），但仍 BLUE、且不影響預測。</p>"}]}, {"id": "12.6", "title": "虛擬變數", "pg": "p.569", "body": "<p>本節「<b class=\"concept\">虛擬變數</b>」主題涵蓋下列 3 個小節：複製一因子 ANOVA 模型、複製多因子 ANOVA 模型、虛擬變數與連續變數並用。概念與公式詳見各小節。</p>", "children": [{"id": "12.6.1", "title": "複製一因子 ANOVA 模型", "pg": "p.569", "body": "<p><span class=\"term\" data-term=\"dummy\">虛擬變數</span> D 取 0/1，把屬質解釋變數量化。一個 m 類的類別變數只設 <b class=\"sym\">m−1</b> 個虛擬變數，否則陷入「虛擬變數陷阱」（完全共線）。被省略的一類為<span class=\"concept\">基準類</span>，截距 β₀ 即基準類平均，各係數為<span class=\"concept\">截距差異</span>。</p><p>例：性別 Y=β₀+β₁M+ε，M=1 男、0 女。E(Y|M=1)=β₀+β₁（男平均）、E(Y|M=0)=β₀（女平均）；整體 F 檢定 H₀:β₁=0 即檢定兩性平均所得是否有差異，完全複製一因子 ANOVA。</p>"}, {"id": "12.6.2", "title": "複製多因子 ANOVA 模型", "pg": "p.571", "body": "<p>同時引入多個類別變數，各類別分別設 (m−1) 個虛擬變數，即複製多因子 ANOVA。例：性別（2 類設 1 個 M）×人種（3 類設 2 個 C₁,C₂），另加入交互項 M·C₁、M·C₂。</p><div class=\"note\"><b>偏 F 檢定分工：</b><ol class=\"nlist\"><li>H₀:β<sub>M</sub>=0 → 檢定性別因子主效果；</li><li>H₀:β<sub>C1</sub>=β<sub>C2</sub>=0 → 檢定人種因子主效果；</li><li>H₀:β<sub>交互1</sub>=β<sub>交互2</sub>=0 → 檢定兩因子交互作用。</li></ol>無重複實驗的二因子或 RBD 設計因自由度不足，不能放交互項。</div>"}, {"id": "12.6.3", "title": "虛擬變數與連續變數並用", "pg": "p.572", "body": "<p>類別變數與屬量變數同時入模型，稱<span class=\"term\" data-term=\"ancova\">共變異數分析 ANCOVA</span>。例：性別 M 與所得 X 解釋消費 Y，三種模式：</p><div class=\"note\"><ol class=\"nlist\"><li>僅截距不同：Y=β₀+β₁X+β₂M（兩線平行）；</li><li>僅斜率不同：Y=β₀+β₁X+β₃(MX)（交於一點）；</li><li>截距斜率皆不同：Y=β₀+β₁X+β₂M+β₃(MX)。</li></ol></div><p>檢定模式三可得四結論：β₂=β₃=0 為重合迴歸；β₂≠0、β₃=0 為平行；β₂=0、β₃≠0 為共點；皆不為零則截距斜率皆異。</p>"}]}], "13": [{"id": "13.1", "title": "單一母體多項分配之檢定", "pg": "p.576", "body": "<p>本節「<b class=\"concept\">單一母體多項分配之檢定</b>」主題涵蓋下列 2 個小節：卡方適合度檢定、卡方母體適合度檢定。概念與公式詳見各小節。</p>", "children": [{"id": "13.1.1", "title": "卡方適合度檢定", "pg": "p.576", "body": "<p><span class=\"term\" data-term=\"gof\">卡方適合度檢定</span>檢定多項母體：H₀:p₁=p₁*,…,p<sub>r</sub>=p<sub>r</sub>* vs Hₐ:不完全符合。觀察次數 O<sub>i</sub>、期望次數 E<sub>i</sub>=np<sub>i</sub>*，統計量 <b class=\"sym\">χ²=Σ(O<sub>i</sub>−E<sub>i</sub>)²/E<sub>i</sub>~χ²(r−1)</b>，右尾拒絕。</p><div class=\"warn\"><b>限制：</b>需大樣本（n→∞ 極限分配）；每格 E<sub>i</sub>≥5，不足則合併鄰組；df=1 時做 <span class=\"term\" data-term=\"yates\">Yates 連續校正</span> (|O−E|−0.5)²/E。單一比例檢定（r=2）與 Z 檢定等價，χ²=Z²。</div>"}, {"id": "13.1.2", "title": "卡方母體適合度檢定", "pg": "p.579", "body": "<p>檢定樣本是否抽自某特定母體分配：H₀:資料來自 f(x) vs Hₐ:非來自 f(x)。分兩種：母數「完全設定」（如 N(μ=10,σ²=200)）或「未完全設定」（如 N(μ,σ²)）。</p><p>先把資料切成 r 組，用 H₀ 分配算各組理論機率 p<sub>i</sub> 與 E<sub>i</sub>=np<sub>i</sub>，再跑<span class=\"term\" data-term=\"gof\">卡方適合度檢定</span>。<b class=\"concept\">自由度修正</b>：若用樣本估計了 q 個母數，則 <b class=\"sym\">df=r−1−q</b>。常見應用：檢定是否為 Poisson、二項、常態分配。</p>"}]}, {"id": "13.2", "title": "多個母體多項分配之檢定", "pg": "p.581", "body": "<p>本節「<b class=\"concept\">多個母體多項分配之檢定</b>」主題涵蓋下列 1 個小節：卡方齊一性檢定。概念與公式詳見各小節。</p>", "children": [{"id": "13.2.1", "title": "卡方齊一性檢定", "pg": "p.581", "body": "<p><span class=\"term\" data-term=\"homogeneity\">齊一性檢定</span>由 k 個獨立母體各抽 n<sub>j</sub> 筆，檢定在 r 個類別上分配是否齊一：H₀:k 母體分配齊一 vs Hₐ:不齊一。期望次數 <b class=\"sym\">E<sub>ij</sub>=R<sub>i</sub>C<sub>j</sub>/n</b>（橫列和×直行和÷總和），統計量 <b class=\"sym\">χ²=ΣΣ(O<sub>ij</sub>−E<sub>ij</sub>)²/E<sub>ij</sub>~χ²((r−1)(k−1))</b>。</p><p>同樣要求各 E<sub>ij</sub>≥5、df=1 時做 Yates 校正。k 個母體比例是否全相等（r=2）即本檢定特例，與 Z 檢定等價 χ²=Z²。</p>"}]}, {"id": "13.3", "title": "列聯表", "pg": "p.586", "body": "<p>本節「<b class=\"concept\">列聯表</b>」主題涵蓋下列 2 個小節：獨立性檢定、類別變數之相關係數。概念與公式詳見各小節。</p>", "children": [{"id": "13.3.1", "title": "獨立性檢定", "pg": "p.586", "body": "<p>單一母體抽出 n 筆，依兩類別變數 A（a 類）、B（b 類）交叉成 a×b <span class=\"term\" data-term=\"contingency\">列聯表</span>，<span class=\"term\" data-term=\"independence\">獨立性檢定</span> H₀:A、B 獨立 vs Hₐ:不獨立。獨立下聯合機率=邊際機率相乘，故 <b class=\"sym\">E<sub>ij</sub>=R<sub>i</sub>C<sub>j</sub>/n</b>，統計量 <b class=\"sym\">χ²~χ²((a−1)(b−1))</b>。</p><p>與齊一性公式完全相同，但抽樣設計不同：獨立性只抽一個母體、檢「兩變數有關否」；齊一性抽 k 個母體、檢「各母體比例同否」。要求 E<sub>ij</sub>≥5，df=1 時 Yates 校正。</p>"}, {"id": "13.3.2", "title": "類別變數之相關係數", "pg": "p.588", "body": "<p>兩類別變數不適用 <b class=\"proper\">Pearson</b> 積差相關，改用：</p><div class=\"note\"><ol class=\"nlist\"><li>2×2 表用 <span class=\"term\" data-term=\"phi\">phi 係數</span> <b class=\"sym\">φ=√(χ²/n)</b>；</li><li>a×b 表用 <span class=\"term\" data-term=\"cramers_v\">Cramer′s V</span> <b class=\"sym\">V=√[χ²/(n·min(a−1,b−1))]</b>；</li><li><span class=\"term\" data-term=\"cont_coef\">Pearson 列聯係數</span> <b class=\"sym\">C=√[χ²/(n+χ²)]</b>。</li></ol>三者皆由 χ² 改寫，值愈大關聯愈強；phi 不需 Yates 校正。</div>"}]}, {"id": "13.4", "title": "卡方檢定的其他應用", "pg": "p.590", "body": "<p>本節「<b class=\"concept\">卡方檢定的其他應用</b>」主題涵蓋下列 1 個小節：McNemar 檢定。概念與公式詳見各小節。</p>", "children": [{"id": "13.4.1", "title": "McNemar 檢定", "pg": "p.590", "body": "<p><span class=\"term\" data-term=\"mcnemar\">McNemar 檢定</span>檢定兩<b class=\"concept\">相關（成對）母體</b>比例 p₁=p₂。2×2 表中一致格 A、D 不變動，關鍵在不一致格 B（前後互換成功↔失敗）與 C。</p><p>H₀:p₁=p₂ 下期望 B、C 應相等，統計量 <b class=\"sym\">χ²=(B−C)²/(B+C)~χ²(1)</b>；開平方得 <b class=\"sym\">Z=(B−C)/√(B+C)~N(0,1)</b>，可用於單尾。考慮連續校正時代入 (|B−C|−1)。適用競選前後支持度、購買意向追蹤調查等成對設計。</p>"}]}, {"id": "13.5", "title": "其他母體適合度檢定", "pg": "p.593", "body": "<p>本節「<b class=\"concept\">其他母體適合度檢定</b>」主題涵蓋下列 2 個小節：Kolmogorov-Smirnov 檢定、Lilliefors 檢定。概念與公式詳見各小節。</p>", "children": [{"id": "13.5.1", "title": "Kolmogorov-Smirnov 檢定", "pg": "p.593", "body": "<p><span class=\"term\" data-term=\"ks_test\">K-S 檢定</span>比較 H₀ 母體理論 cdf F(x) 與樣本相對累加次數 S(x)，取最大絕對差：<b class=\"sym\">T=max|F(x)−S(x)|</b>，查 K-S 表 RR={T≥KS<sub>α/2</sub>(n)}。</p><p>不同於卡方適合度：K-S <b class=\"concept\">須完全設定母數</b>（如 λ=1.2 的 Poisson），且<b class=\"concept\">不需大樣本</b>、保留順序資訊，小樣本檢定力優於卡方。例：n=100 時 T₀=0.1226 &lt; KS₀.₀₂₅=0.136，不拒絕 H₀。</p>"}, {"id": "13.5.2", "title": "Lilliefors 檢定", "pg": "p.595", "body": "<p><b class=\"proper\">Lilliefors</b> 1967 年修改 K-S 檢定，使其能檢定<b class=\"concept\">母數未完全設定</b>的常態適合度——H₀ 只需設「資料來自常態 N(μ,σ²)」，毋須指定 μ、σ，先以樣本 X̄、S 估計。</p><p>運作原理與步驟與 <span class=\"term\" data-term=\"ks_test\">K-S 檢定</span>完全相同（仍算 max|F−S|），惟臨界值須查專用的 <b class=\"sym\">Lilliefors 表</b>而非 K-S 表。常態適合度亦可用 <span class=\"term\" data-term=\"jb_sw\">Jarque-Bera 與 Shapiro-Wilk</span> 檢定。</p>"}]}], "14": [{"id": "14.1", "title": "非母數統計方法概論", "pg": "p.597", "body": "<p><span class=\"term\" data-term=\"nonparametric\">非母數統計方法</span>（nonparametric statistics，又譯無母數）最大的特色是<b class=\"concept\">分配自由化 distribution-free</b>——不必假設母體為任何特定分配，對任意母體皆適用。它不是「沒有母數」，而是<b class=\"concept\">不經由母數</b>來做推論。</p>\n<p>母數方法（如 t 檢定、ANOVA）通常假設母體常態；雖對常態稍有偏離仍算<b class=\"concept\">穩健 robust</b>，但這只保證型一錯誤率不大，<b class=\"sym\">不保證檢定力</b>。若母體為肥尾（指數、對數常態、卡方）或有嚴重離群值，母數方法檢定力就差，此時改用非母數方法反而檢定力較強。</p>\n<div class=\"note\"><b>Conover（1999）定義：</b>一方法屬於下列三類之一即為非母數方法：\n<ol class=\"nlist\"><li>應用於<b class=\"concept\">名義尺度</b>資料（如第 13 章卡方檢定）。</li><li>應用於<b class=\"concept\">順序尺度／等級 rank</b>資料。</li><li>應用於等距／比例資料，但不對母體分配作任何假設（分配自由化）。</li></ol></div>\n<p>常見對應關係（右側皆為其母數版）：</p>\n<table><colgroup><col style=\"width:40%\"><col style=\"width:35%\"><col style=\"width:25%\"></colgroup>\n<tr><th>非母數方法</th><th>對應母數方法</th><th>資料</th></tr>\n<tr><td><span class=\"term\" data-term=\"spearman\">Spearman / Kendall</span></td><td>Pearson 相關</td><td>等級／有離群</td></tr>\n<tr><td><span class=\"term\" data-term=\"wilcoxon_signed\">Wilcoxon 符號等級</span></td><td>單一樣本 t</td><td>非常態、偏態</td></tr>\n<tr><td><span class=\"term\" data-term=\"mannwhitney\">Mann-Whitney U</span></td><td>兩獨立母體 t</td><td>非常態</td></tr>\n<tr><td><span class=\"term\" data-term=\"kruskal_wallis\">Kruskal-Wallis</span></td><td>單因子 ANOVA(CRD)</td><td>非常態</td></tr>\n<tr><td><span class=\"term\" data-term=\"friedman\">Friedman</span></td><td>隨機區集 ANOVA(RBD)</td><td>非常態</td></tr>\n<tr><td><span class=\"term\" data-term=\"runs_test\">連檢定</span></td><td>—（無對應母數）</td><td>成敗序列</td></tr></table>\n<div class=\"warn\"><b>為何用：</b>母數方法前提假設多（常態、同質變異數）、適用範圍窄；非母數方法前提少、適用廣，小樣本／順序資料／極端值多時特別好用。代價是<b class=\"sym\">檢定力略低</b>——若母數假設成立，母數方法仍較強。</div>"}, {"id": "14.2", "title": "等級相關", "pg": "p.600", "body": "<p>本節「<b class=\"concept\">等級相關</b>」主題涵蓋下列 2 個小節：Spearman 等級相關係數、Kendall 等級相關係數。概念與公式詳見各小節。</p>", "children": [{"id": "14.2.1", "title": "Spearman 等級相關係數", "pg": "p.600", "body": "<p>先將 X、Y 各自排序轉等級 R(X<sub>i</sub>)、R(Y<sub>i</sub>)，再計其相關，不易受離群值干擾。無平分等級時：</p><div class=\"formula\"><span class=\"f-label\">Spearman 速算</span>r<sub>s</sub> = 1 − 6Σd² ÷ [ n(n² − 1) ]，d = R(Xi) − R(Yi)</div><div class=\"note\"><b>範例（n=6，無平分）：</b>R(X)=1..6；R(Y)=2,1,4,3,6,5。d=−1,+1,−1,+1,−1,+1，Σd²=6，r<sub>s</sub>=1−36/210=<b class=\"sym\">0.829</b>。H0：ρ<sub>s</sub>=0；α=0.05。n=6 查 Spearman 臨界值約 0.887；|0.829|&lt;0.887，<b class=\"sym\">不拒絕 H0</b>。有 <span class=\"term\" data-term=\"ties\">平分等級</span>時速算公式失效，須用定義式。</div>"}, {"id": "14.2.2", "title": "Kendall 等級相關係數", "pg": "p.602", "body": "<p><b class=\"proper\">Kendall</b>'s τ 把 n 筆成對資料兩兩比較（共 C(n,2) 組）：X<sub>i</sub>−X<sub>j</sub> 與 Y<sub>i</sub>−Y<sub>j</sub> 同號為<b class=\"concept\">同序 concordant</b> N<sub>c</sub>、異號為<b class=\"concept\">反序 discordant</b> N<sub>d</sub>。</p><div class=\"formula\"><span class=\"f-label\">Kendall τ</span>τ = (N<sub>c</sub> − N<sub>d</sub>) ÷ C(n,2)</div><div class=\"note\"><b>解讀：</b>τ∈[−1,1]，表示「任取兩筆觀察，同向勝反向的比例」。與 Spearman r<sub>s</sub> 同測單調關係，τ 的統計意義更直接，但小樣本計算量大。</div>"}]}, {"id": "14.3", "title": "單一母體之非母數檢定", "pg": "p.603", "body": "<p>本節「<b class=\"concept\">單一母體之非母數檢定</b>」主題涵蓋下列 2 個小節：符號檢定、Wilcoxon 符號等級檢定。概念與公式詳見各小節。</p>", "children": [{"id": "14.3.1", "title": "符號檢定", "pg": "p.603", "body": "<p>統計量 <b class=\"sym\">S = N(+)</b>（大於 η<sub>0</sub> 的個數），H0 下 S ~ <b class=\"sym\">B(n, 0.5)</b>。</p><div class=\"note\"><b>範例（n=10）：</b>檢定中位數 η=80。樣本 75,82,78,90,85,70,88,95,79,83。減 80 後正號 6、負號 4，S=<b class=\"sym\">6</b>。雙尾 p=2·P(S≥6|B(10,0.5))=2×0.377=<b class=\"sym\">0.754</b> &gt;0.05，<b class=\"sym\">不拒絕 H0</b>。</div>"}, {"id": "14.3.2", "title": "Wilcoxon 符號等級檢定", "pg": "p.603", "body": "<p>算 D<sub>i</sub>=X<sub>i</sub>−η<sub>0</sub>，對 |D<sub>i</sub>| 給等級（同分取平均），正、負差等級和 W<sup>+</sup>、W<sup>−</sup>，統計量 <b class=\"sym\">W=min(W<sup>+</sup>,W<sup>−</sup>)</b>，一律左尾拒絕。</p><div class=\"note\"><b>範例（同資料）：</b>W<sup>+</sup>=37.5、W<sup>−</sup>=17.5，W=<b class=\"sym\">17.5</b>。n=10 雙尾 0.05 臨界值約 8；17.5&gt;8，<b class=\"sym\">不拒絕 H0</b>。大樣本(n≥15)：Z=[W−n(n+1)/4]/√[n(n+1)(2n+1)/24]~N(0,1)。比符號檢定多用大小資訊、檢定力較高。</div>"}]}, {"id": "14.4", "title": "兩相依母體之非母數檢定", "pg": "p.605", "body": "<p>本節「<b class=\"concept\">兩相依母體之非母數檢定</b>」主題涵蓋下列 2 個小節：配對符號檢定、Wilcoxon 配對符號等級檢定。概念與公式詳見各小節。</p>", "children": [{"id": "14.4.1", "title": "配對符號檢定", "pg": "p.605", "body": "<p>只看 D<sub>i</sub>=X<sub>i</sub>−Y<sub>i</sub> 的正負號，S=N(+)，H0：兩分配位置相同時 S~B(n,0.5)。最簡單、最不挑假設，但只用「方向」不用「大小」。</p>"}, {"id": "14.4.2", "title": "Wilcoxon 配對符號等級檢定", "pg": "p.606", "body": "<p>對 |D<sub>i</sub>| 給等級後取 W=min(W<sup>+</sup>,W<sup>−</sup>)。</p><div class=\"note\"><b>範例（n=8 前後測）：</b>D=+2,−1,+1,+1,−1,+1,+1,−2。|D| 六個 1（平均等級 3.5）、兩個 2（平均 7.5）。W<sup>+</sup>=7.5+5×3.5=21.5；W<sup>−</sup>=2×3.5+7.5=14.5；W=<b class=\"sym\">14.5</b>。n=8 雙尾 0.05 臨界值約 3；14.5&gt;3，<b class=\"sym\">不拒絕 H0</b>。</div>"}]}, {"id": "14.5", "title": "兩獨立母體之非母數檢定", "pg": "p.609", "body": "<p>本節「<b class=\"concept\">兩獨立母體之非母數檢定</b>」主題涵蓋下列 2 個小節：Wilcoxon 等級和檢定、Mann-Whitney U 檢定。概念與公式詳見各小節。</p>", "children": [{"id": "14.5.1", "title": "Wilcoxon 等級和檢定", "pg": "p.609", "body": "<p><b class=\"proper\">Wilcoxon</b> 等級和檢定是兩獨立母體位置檢定：把 n<sub>1</sub>+n<sub>2</sub> 筆資料混合排序改等級，取樣本數較小者之等級和 W<sub>1</sub> 為統計量。小樣本查等級和表；n<sub>1</sub>、n<sub>2</sub> 皆 ≥10 時用常態近似。</p>"}, {"id": "14.5.2", "title": "Mann-Whitney U 檢定", "pg": "p.610", "body": "<div class=\"formula\"><span class=\"f-label\">Mann-Whitney U</span>U<sub>1</sub>=n<sub>1</sub>n<sub>2</sub>+n<sub>1</sub>(n<sub>1</sub>+1)/2−W<sub>1</sub>；U=min(U<sub>1</sub>,U<sub>2</sub>)</div><div class=\"note\"><b>範例（n<sub>1</sub>=4,n<sub>2</sub>=5）：</b>A=10,12,14,15；B=2,4,5,7,9。混合排序後 B 佔等級 1–5、A 佔 6–9。W<sub>A</sub>=30；U<sub>A</sub>=20+10−30=<b class=\"sym\">0</b>。雙尾 0.05 臨界值約 1；U=0≤1，<b class=\"sym\">拒絕 H0</b>（兩組位置不同）。仍須假設兩分配形狀類似。</div>"}]}, {"id": "14.6", "title": "多個獨立母體之非母數檢定", "pg": "p.611", "body": "<p>本節「<b class=\"concept\">多個獨立母體之非母數檢定</b>」主題涵蓋下列 1 個小節：Kruskal-Wallis 檢定。概念與公式詳見各小節。</p>", "children": [{"id": "14.6.1", "title": "Kruskal-Wallis 檢定", "pg": "p.611", "body": "<p><span class=\"term\" data-term=\"kw\">Kruskal-Wallis 檢定</span>（<b class=\"proper\">Kruskal</b>、<b class=\"proper\">Wallis</b>）是 One-way ANOVA(CRD) 的<b class=\"concept\">無母數版</b>，不需常態假設但仍需同質變異，檢定 k 個獨立母體分配位置（中位數）是否相同。</p><p>步驟：把全部 n 筆混合排序改等級，記第 j 組等級和 R<sub>j</sub>、組內數 n<sub>j</sub>。統計量 <b class=\"sym\">H=[12/(n(n+1))]ΣR<sub>j</sub>²/n<sub>j</sub>−3(n+1)~χ²(k−1)</b>，右尾拒絕。</p><div class=\"note\"><b>沿用例（k=3、各組 n<sub>j</sub>=3、n=9，α=0.05）：</b>A:5,8,10；B:12,14,15；C:18,20,22，無結，等級 1–9，R=(6,15,24)。H=12/(9·10)·(6²/3+15²/3+24²/3)−3·10=0.1333×279−30=<b class=\"sym\">7.2</b>；χ²(2) 臨界值 5.991，7.2&gt;5.991，<b class=\"sym\">拒絕 H₀</b>。</div>"}]}, {"id": "14.7", "title": "多個相依母體之非母數檢定", "pg": "p.612", "body": "<p>本節「<b class=\"concept\">多個相依母體之非母數檢定</b>」主題涵蓋下列 1 個小節：Friedman 檢定。概念與公式詳見各小節。</p>", "children": [{"id": "14.7.1", "title": "Friedman 檢定", "pg": "p.612", "body": "<p><b class=\"proper\">Friedman</b> 檢定是 One-way ANOVA(RBD) 的<b class=\"concept\">無母數版</b>，檢定 k 個相依母體（區集設計）處理位置是否相同。先在每個區集 block 內部把 k 個處理排序給等級，再把各處理跨區集等級加總 R<sub>j</sub>。</p><p>統計量 <b class=\"sym\">χ²<sub>r</sub>=[12/(bk(k+1))]ΣR<sub>j</sub>²−3b(k+1)~χ²(k−1)</b>。</p><div class=\"note\"><b>沿用例（k=3 處理 A/B/C、b=4 區集，α=0.05）：</b>各區集內排序得 R<sub>A</sub>=5、R<sub>B</sub>=8、R<sub>C</sub>=11。χ²<sub>r</sub>=12/(4·3·4)·(25+64+121)−3·4·4=0.25×210−48=<b class=\"sym\">4.5</b>；χ²(2) 臨界值 5.991，4.5&lt;5.991，<b class=\"sym\">不拒絕 H₀</b>。</div>"}]}, {"id": "14.8", "title": "隨機性檢定", "pg": "p.614", "body": "<p>本節「<b class=\"concept\">隨機性檢定</b>」主題涵蓋下列 1 個小節：連檢定。概念與公式詳見各小節。</p>", "children": [{"id": "14.8.1", "title": "連檢定", "pg": "p.614", "body": "<p><span class=\"term\" data-term=\"runs_test\">連檢定 runs test</span>檢定一組成敗（類別）序列的<b class=\"concept\">出現順序是否隨機</b>：H₀:隨機 vs Hₐ:不隨機。一「連 run」=連續相同符號的一段；連數 R 太少＝有趨勢/聚集，太多＝有規律/週期。</p><p>大樣本（n₁,n₂&gt;10）常態近似：<b class=\"sym\">μ<sub>R</sub>=2n₁n₂/(n₁+n₂)+1</b>，<b class=\"sym\">σ<sub>R</sub>=√[2n₁n₂(2n₁n₂−n₁−n₂)/(n₁+n₂)²(n₁+n₂−1)]</b>，Z=(R−μ<sub>R</sub>)/σ<sub>R</sub>~N(0,1)，<b class=\"concept\">一律雙尾</b> |Z|&gt;1.96 拒絕。</p><div class=\"note\"><b>沿用例：</b>序列「++−−++−+−−++−−+−++−−」，n₁=n₂=10，數得 R=<b class=\"sym\">12</b>；μ<sub>R</sub>=2·10·10/20+1=<b class=\"sym\">11</b>、σ<sub>R</sub>=<b class=\"sym\">2.176</b>；Z=(12−11)/2.176=<b class=\"sym\">0.459</b>，|Z|&lt;1.96，<b class=\"sym\">不拒絕 H₀</b>。</div>"}]}], "15": [{"id": "15.1", "title": "統計決策理論", "pg": "p.615", "body": "<p>本節「<b class=\"concept\">統計決策理論</b>」主題涵蓋下列 2 個小節：不確定狀況下的決策制定、資訊價值。概念與公式詳見各小節。</p>", "children": [{"id": "15.1.1", "title": "不確定狀況下的決策制定", "pg": "p.616", "body": "<p>不確定下決策含四元素：決策者、策略 D<sub>i</sub>、自然狀態 S<sub>j</sub>（不可控）、報酬 O<sub>ij</sub>。可列收益表或畫<span class=\"term\" data-term=\"decision_tree\">決策樹</span>：方形□表決策節點、圓形○表狀態節點。</p><p>無機率準則有 maximax（大中取大）、maximin（小中取大）、Hurwicz（樂觀係數加權）、minimax regret、Laplace（等機率 EP）。有事先機率 P(S<sub>j</sub>) 時，計 <b class=\"sym\">EMV(D<sub>i</sub>)=ΣO<sub>ij</sub>P(S<sub>j</sub>)</b>，選 <b class=\"sym\">max EMV</b> 為最適策略 D*；更講效用者則用期望效用 EU=Σu(O<sub>ij</sub>)P(S<sub>j</sub>)。</p>"}, {"id": "15.1.2", "title": "資訊價值", "pg": "p.620", "body": "<p><span class=\"term\" data-term=\"eppi_evpi\">完美訊息</span>下，決策者預知何種 S<sub>j</sub> 會發生而永遠選最佳行動，期望收益 <b class=\"sym\">EPPI=Σ<sub>j</sub>max<sub>i</sub>{O<sub>ij</sub>}P(S<sub>j</sub>)</b>。完美訊息的期望價值為 <b class=\"sym\">EVPI=EPPI−EMV(D*)</b>，即願付最高價格購買完美訊息。</p><p>樣本訊息 I<sub>k</sub> 不完美：以 <span class=\"term\" data-term=\"bayes_post\">貝氏定理</span>把事前機率 P(S<sub>j</sub>) 與 P(I<sub>k</sub>|S<sub>j</sub>) 更新為事後機率 P(S<sub>j</sub>|I<sub>k</sub>)，逐訊息選最適後再按 P(I<sub>k</sub>) 加權得 EPSI；<b class=\"sym\">EVSI=EPSI−EMV(D*)</b>，訊息效率=EVSI/EVPI×100%。</p>"}]}, {"id": "15.2", "title": "時間序列分析", "pg": "p.625", "body": "<p>本節「<b class=\"concept\">時間序列分析</b>」主題涵蓋下列 3 個小節：時間序列分析概論、平滑技術與趨勢預測、編製季節指數。概念與公式詳見各小節。</p>", "children": [{"id": "15.2.1", "title": "時間序列分析概論", "pg": "p.625", "body": "<p><span class=\"term\" data-term=\"ts_components\">時間序列</span>追蹤單一變數隨時間演變，重點在拆解成份並預測。四成份：<b class=\"sym\">T</b> 長期趨勢（大方向）、<b class=\"sym\">C</b> 循環變動（一年以上景氣循環）、<b class=\"sym\">S</b> 季節變動（一年內規律）、<b class=\"sym\">I</b> 不規則變動（不可預測隨機事件）。</p><p>兩種模型：相加 <b class=\"sym\">Y=T+C+S+I</b>、相乘 <b class=\"sym\">Y=T·C·S·I</b>，後者常用。分析目的在以平滑技術消除波動、抽出趨勢線，並據以預測。</p>"}, {"id": "15.2.2", "title": "平滑技術與趨勢預測", "pg": "p.626", "body": "<p><b class=\"concept\">移動平均法 MA</b>：取最近 k 期算術平均 <b class=\"sym\">MA<sub>t</sub>=(Y<sub>t</sub>+…+Y<sub>t−k+1</sub>)/k</b> 預測 Y<sub>t+1</sub>，亦可加權(WMA)。</p><p><b class=\"concept\">指數平滑法</b>：無趨勢 <b class=\"sym\">S<sub>t</sub>=αY<sub>t</sub>+(1−α)S<sub>t−1</sub></b>、F<sub>t+1</sub>=S<sub>t</sub>，α 越大越重當期、平滑效果越小；含趨勢者用 Holt 法，另對趨勢 T<sub>t</sub> 以 β 平滑。線性趨勢法則對 t 跑迴歸 Ŷ=b̂₀+b̂₁t。以 <span class=\"term\" data-term=\"rmse_mad\">RMSE、MAD</span> 客觀選參數、評準確度。</p>"}, {"id": "15.2.3", "title": "編製季節指數", "pg": "p.631", "body": "<p>採相乘模型 Y=T·S·I 編製<span class=\"term\" data-term=\"seasonal_index\">季節指數</span>，流程：</p><div class=\"note\"><ol class=\"nlist\"><li>算四季移動平均，再兩兩平均得<b class=\"concept\">中央移動平均</b>（=T）；</li><li>Y/中央MA=S×I（季節不規則成份）；</li><li>各季 SI 跨年平均後調整，使四季指數合計=4；</li><li><span class=\"term\" data-term=\"deseason\">去季節化</span> Y*=Y/S=T×I，對 Y* 配線性趨勢；</li><li>預測 F<sub>t+1</sub>=T̂<sub>t+1</sub>·S<sub>t+1</sub>。</li></ol></div><p>例：以 2015 Q1 為 t=1，Y*=22.156+0.8443t，2018 Q2（t=14）趨勢 33.976×Q2 指數 1.0437≈35.46。</p>"}]}, {"id": "15.3", "title": "指數", "pg": "p.635", "body": "<p>本節「<b class=\"concept\">指數</b>」主題涵蓋下列 3 個小節：物價指數、物量指數、價值指數。概念與公式詳見各小節。</p>", "children": [{"id": "15.3.1", "title": "物價指數", "pg": "p.635", "body": "<p>物價指數衡量多種商品價格在基期(0)與計算期(t)間變化。<span class=\"term\" data-term=\"laspeyres\">拉氏 LPI</span>（基期量 Q₀ 加權）：<b class=\"sym\">LPI=Σ(P<sub>t</sub>Q₀)/Σ(P₀Q₀)×100</b>，基期固定利跨年比較，但物價上漲時用量縮小的商品權重仍高，易<span class=\"concept\">高估通膨</span>。</p><p><span class=\"term\" data-term=\"paasche\">派氏 PPI</span>（計算期量 Q<sub>t</sub> 加權）：<b class=\"sym\">PPI=Σ(P<sub>t</sub>Q<sub>t</sub>)/Σ(P₀Q<sub>t</sub>)×100</b>，反向易低估、計算較繁。<span class=\"term\" data-term=\"fisher\">費氏理想指數</span> <b class=\"sym\">FPI=√(LPI·PPI)</b> 取幾何平均修正一高一低。</p>"}, {"id": "15.3.2", "title": "物量指數", "pg": "p.636", "body": "<p><span class=\"term\" data-term=\"value_index\">物量指數</span>關注多種商品<b class=\"concept\">交易量</b>在基期與計算期間的變化（對應工業生產指數 IIP、貿易量指數等），與物價指數關注「價」相對。</p><p>同樣分三式：<b class=\"sym\">拉氏物量 LQI=Σ(Q<sub>t</sub>P₀)/Σ(Q₀P₀)×100</b>（基期價加權）、<b class=\"sym\">派氏物量 PQI=Σ(Q<sub>t</sub>P<sub>t</sub>)/Σ(Q₀P<sub>t</sub>)×100</b>（計算期價加權），以及 <b class=\"sym\">費氏理想 FQI=√(LQI·PQI)</b>。</p>"}, {"id": "15.3.3", "title": "價值指數", "pg": "p.637", "body": "<p><span class=\"term\" data-term=\"value_index\">價值指數</span>表現總交易價值的變化，同時涵蓋「價格」與「數量」兩者，無需另加權：<b class=\"sym\">VI=Σ(Q<sub>t</sub>P<sub>t</sub>)/Σ(Q₀P₀)×100</b>。</p><p>常見者如進出口貿易總值指數。其變動可分解為價（物價指數）與量（物量指數）的乘積效果；分析時須區分價、量、價值三類指數，避免混用。</p>"}]}]};
const CH_PROBLEMS = {"1": [{"q": "「The process of analyzing sample data in order to draw conclusions about the characteristics of a population」稱為下列何者？(a) descriptive statistics (b) statistical inference (c) data analysis (d) data summarization", "opts": ["(a) descriptive statistics", "(b) statistical inference", "(c) data analysis", "(d) data summarization"], "ans": "(b) statistical inference——由樣本資料推論母體特徵，正是統計推論的定義。"}, {"q": "問卷題目「非常贊成、贊成、中立、不贊成、非常不贊成」的量測尺度為何？(a)類別 (b)名目 (c)順序 (d)等距 (e)比例", "opts": ["(a)類別", "(b)名目", "(c)順序", "(d)等距", "(e)比例"], "ans": "(c) 順序尺度——可比較贊成程度高低，但「贊成多少」的差距無法衡量。"}, {"q": "試指出下列變數的測量尺度：(1)婚姻狀況（已婚=1,未婚=2,離婚=3,分居=4）；(2)薪資（元）；(3)學歷（高中=1…研究所=4）。", "opts": [], "ans": "(1) 名義尺度（編號只是分類）；(2) 比例尺度（有自然零點、可乘除）；(3) 順序尺度（只有高低次序）。"}], "2": [{"q": "基金經理人稱過去三年報酬率為 25%、−45%、90%，平均 23% 勝過大盤。你同意嗎？", "opts": [], "ans": "不同意。算術平均 23% 會高估；應用幾何平均：√(1.25×0.55×1.90)−1 ≈ 1.093−1 = 9.3%，並未擊敗大盤。"}, {"q": "甲生統計 66 分（全班平均 50、SD 11），微積分 82 分（全班平均 73、SD 9），同一批考生，哪一科表現較傑出？", "opts": [], "ans": "算 z 分數：統計 z=(66−50)/11≈1.45；微積分 z=(82−73)/9=1。甲生在統計學相對表現較傑出。"}, {"q": "BMW 10 位業務上月銷車：15,23,4,19,18,10,10,8,28,19。求第 40 百分位數與上下四分位數。", "opts": [], "ans": "排序：4,8,10,10,15,18,19,19,23,28。i=10×0.4=4 為整數，P40=(X₍₄₎+X₍₅₎)/2=(10+15)/2=12.5；Q1=P25=X₍₃₎=10；Q3=P75=X₍₈₎=19。"}], "3": [{"q": "若 P(B)=0.30、P(A|B)=0.40、P(B|A)=0.50，求 P(A)。", "opts": [], "ans": "由乘法規則 P(A∩B)=P(A|B)P(B)=0.4×0.3=0.12；又 P(A∩B)=P(B|A)P(A)=0.5·P(A)，故 P(A)=0.12/0.5=0.24。"}, {"q": "Monty Hall 問題：三扇門一車二羊，你選一門後主持人開一扇有羊的門，問「換門」與「不換門」哪個中車機率高？", "opts": ["換門", "不換門"], "ans": "換門中車機率 2/3，不換僅 1/3，故應換門；若以丟銅板混合決定，機率回到 1/2。"}, {"q": "擲兩顆公正骰子，點數和為 8 的機率？點數和為 2 的機率？", "opts": [], "ans": "樣本空間共 36 點。和為 8 的有利點：(2,6),(3,5),(4,4),(5,3),(6,2) 共 5 個，機率 5/36；和為 2 只有 (1,1)，機率 1/36。"}], "4": [{"q": "設 X 為連續型隨機變數，pdf f(x)=c·x，0≤x≤2。求使 f(x) 為合法 pdf 之常數 c。", "opts": ["(a) c=1/2", "(b) c=1", "(c) c=2", "(d) 不存在這樣的 c"], "ans": "(a) c=1/2——由 ∫₀² cx dx = c·(x²/2)|₀²=2c=1 得 c=1/2。"}, {"q": "令 f(x)=c(2x-1)，x=1,2,…,10 為 pmf。求 c 並驗證性質。", "opts": ["(a) c=1/100", "(b) c=1/55", "(c) c=1/10", "(d) c=1/110"], "ans": "(a) c=1/100——Σ_{x=1}^{10}(2x-1)=100=10²，故 1=100c。"}, {"q": "已知 E(X)=17、E(X²)=298，求 P(10&lt;X&lt;24) 之下界（用 Chebyshev）。", "opts": ["(a) 至少 0.75", "(b) 至少 0.81", "(c) 至少 0.5", "(d) 至少 0.9"], "ans": "(b) 至少 0.81——Var(X)=298-289=9，σ=3；10&lt;X&lt;24 即 |X-17|&lt;7=kσ ⇒ k=7/3，1-1/k²=1-9/49=40/49≈0.816。"}, {"q": "某工廠每週生產量 X 為非負隨機變數、E(X)=500。用 Markov 不等式估 P(X≥1000)。", "opts": ["(a) ≤0.25", "(b) ≤0.5", "(c) ≤0.1", "(d) ≥0.5"], "ans": "(b) ≤0.5——P(X≥1000)≤E(X)/1000=500/1000=0.5。"}], "5": [{"q": "Cov(X,Y)=0 時，下列何者正確？", "opts": ["(a) X 與 Y 必獨立", "(b) X 與 Y 必不獨立", "(c) 零相關不保證獨立", "(d) ρ_XY=±1"], "ans": "(c) 零相關不保證獨立；獨立 ⇒ Cov=0 但逆不真。"}, {"q": "設 E(Y|X=x)=2-2x、E(X|Y=y)=5-1.5y，求 ρ_XY。", "opts": ["(a) ρ=1", "(b) ρ=-1", "(c) ρ=√3/2", "(d) ρ=0"], "ans": "(b) ρ=-1——兩條迴歸斜率 b_1=ρσ_Y/σ_X=-2、b_1'=ρσ_X/σ_Y=-1.5，相乘得 ρ²=3、同號皆負，聯立書上解得 ρ=-1。"}, {"q": "Var(X)=9、Var(Y)=2、Var(Z)=4、Cov(X,Y)=-2。求 Var(3X-2Y+Z+6)。", "opts": ["(a) 35", "(b) 49", "(c) 25", "(d) 37"], "ans": "(a) 35（依書上共變異數矩陣展開：9·9+4·2+1·4+2(3)(-2)Cov(X,Y)+…，詳見範例 5.26）。"}], "6": [{"q": "X~Poi(λ=0.5)、Y~Poi(λ=1.5) 且獨立，求 P(X+Y=3)。", "opts": ["(a) 4e^{-2}/3", "(b) 2e^{-2}", "(c) e^{-2}", "(d) 3e^{-2}"], "ans": "(a) 由再生性 X+Y~Poi(2)，P=e^{-2}·2³/3!=8e^{-2}/6=4e^{-2}/3。"}, {"q": "X~N(180,10²)，每盒取 6 罐，求每盒總重量 Y=ΣX_i 超過 1080 之機率趨近。", "opts": ["(a) Y~N(1080,600)", "(b) Y~N(1080,60)", "(c) Y~N(1080,3600)", "(d) Y~N(180,600)"], "ans": "(a) Y~N(1080,600)——E(Y)=6·180=1080、Var(Y)=6·100=600（獨立）。"}, {"q": "f(x)=0.125e^{-0.125x}, x≥0，此為何種分配？求其 E(X)。", "opts": ["(a) Exp(β=8)、E=8", "(b) Exp(β=0.125)、E=0.125", "(c) Gamma(2,8)", "(d) 常態"], "ans": "(a) Exp(β=8)、E(X)=8——f(x)=(1/β)e^{-x/β}，1/β=0.125 ⇒ β=8。"}], "7": [{"q": "X₁,…,X_n iid~N(μ,σ²)，σ² 未知。(X̄-μ)/(S/√n) 服從何分配？", "opts": ["(a) N(0,1)", "(b) χ²(n)", "(c) t(n-1)", "(d) F(n-1,n-1)"], "ans": "(c) t(n-1)——常態母體、σ 未知下用樣本標準差，為自由度 n-1 之 t。"}, {"q": "母體任意分配、均值 μ、變異數 σ²，樣本數 n 很大時 X̄ 的分配為何？", "opts": ["(a) 確切常態", "(b) 漸近常態 N(μ,σ²/n)", "(c) 卡方", "(d) 均勻"], "ans": "(b) 漸近常態 N(μ,σ²/n)——由中央極限定理，不需母體常態假設。"}, {"q": "三零件壽命獨立且皆 Exp(β=3)，串聯系統（取 min）壽命服從？", "opts": ["(a) Exp(β=1)", "(b) Exp(β=9)", "(c) Gamma(3,3)", "(d) 常態"], "ans": "(a) Exp(β=1)——min 的 cdf=1-[1-e^{-x/β}]³，P(min&gt;t)=[e^{-t/3}]³=e^{-t}，即 Exp(β=1)。"}], "8": [{"q": "設 X₁,…,Xₙ~Ber(p)，母體比例 p 之 MLE 為何？", "opts": ["(a) p̂=X̄", "(b) p̂=中位數", "(c) p̂=1/X̄", "(d) p̂=S²"], "ans": "(a) p̂=X̄。Bernoulli 之 MLE 與 MME 相同，皆為樣本平均，且為 p 之不偏估計量。"}, {"q": "常態母體 N(μ,σ²) 之 σ² 的 MLE 為 (1/n)Σ(Xᵢ−X̄)²，下列敘述何者正確？", "opts": ["(a) 它是 σ² 之不偏估計量", "(b) 它低估 σ²，經自由度修正為 S² 後才不偏", "(c) 它是 UMVUE", "(d) 它與 S² 的 MSE 相等"], "ans": "(b)。MLE 除以 n 為低估；改除以 n−1（自由度修正）得 S²，E(S²)=σ²。但就 MSE 有效性而言，MLE 反而略優。"}, {"q": "關於不偏性與一致性，下列何者正確？", "opts": ["(a) 不偏估計量必一致", "(b) 一致估計量必不偏", "(c) 二者互不隸屬", "(d) S 是 σ 之不偏估計量"], "ans": "(c)。不偏性與一致性互無隸屬；又因非線性轉換不具不動性，S=√S² 並非 σ 之不偏估計量。"}, {"q": "何謂 MLE 之不動性（invariance property）？", "opts": ["(a) MLE 必為不偏", "(b) 若 θ̂_MLE 為 θ 之 MLE，則 g(θ) 之 MLE 為 g(θ̂_MLE)", "(c) MLE 必一致", "(d) MLE 與 MME 永遠相同"], "ans": "(b)。g(·) 為任意函數，函數轉換後之 MLE 直接代入，例如 σ=√σ² 之 MLE=√σ̂²_MLE。"}], "9": [{"q": "95% 信賴區間 (50.2, 54.3) 之正確解讀為何？", "opts": ["(a) μ 落於此區間的機率為 0.95", "(b) 95% 的樣本平均數落在此區間", "(c) 我們有 95% 信心此區間含 μ，因它是做對的 95% 區間之一", "(d) 以上皆對"], "ans": "(c)。μ 為常數、已實現區間亦為常數，無機率可言；信心來自建構區間的方法本身。"}, {"q": "母體常態、σ² 未知，小樣本求 μ 之 95% C.I. 應使用哪個分配？", "opts": ["(a) Z~N(0,1)", "(b) t(n−1)", "(c) χ²(n−1)", "(d) F(n−1,n−1)"], "ans": "(b)。樞紐量 T=(X̄−μ)/(S/√n)~t(n−1)，故 C.I.=X̄±t_{0.025}(n−1)·S/√n。"}, {"q": "欲估計母體比例 p，無任何先驗資訊，95% 信心、誤差界限 E=±3%，所需樣本數約為？", "opts": ["(a) 384", "(b) 1068", "(c) 2000", "(d) 50"], "ans": "(b) 約 1068。取 p=0.5 最保守，n=(1.96)²·0.25/(0.03)²≈1067.1，無條件進位。"}, {"q": "關於預測區間 P.I.，下列何者正確？", "opts": ["(a) 它估計母數 μ", "(b) 它估計未來觀察值 X_{n+1}，公式比 C.I. 多「1+」項", "(c) 它永遠比 C.I. 窄", "(d) 它用 F 分配"], "ans": "(b)。P.I. 對未來觀察值，需另加個別觀察值的離差變異 σ²，故 SE 為 S√(1+1/n)，區間比 C.I. 寬。"}], "10": [{"q": "在 H₀:μ=μ₀ vs Hₐ:μ≠μ₀ 之雙尾檢定中，下列何者為型一誤差？", "opts": ["(a) H₀ 真卻拒絕 H₀", "(b) Hₐ 真卻不拒絕 H₀", "(c) H₀ 真卻不拒絕 H₀", "(d) Hₐ 真卻拒絕 H₀"], "ans": "(a)。型一誤差=棄真，機率 α；型二誤差=取偽，機率 β；Hₐ 真下成功拒絕=檢定力 1−β。"}, {"q": "若某檢定在 α=0.05 下拒絕 H₀（p-value=0.03），下列何者正確？", "opts": ["(a) α=0.10 時應不拒絕", "(b) α=0.01 時應拒絕", "(c) α=0.10 時拒絕、α=0.01 時不拒絕", "(d) 結論與 α 無關"], "ans": "(c)。p=0.03≤0.10 拒絕，但 0.03>0.01 不拒絕。p-value 法決策：p≤α 則拒絕。"}, {"q": "假說檢定的六個標準步驟順序為何？", "opts": ["(a) 算 T₀→定 α→建假說→找統計量→定 RR→決策", "(b) 建假說→定 α→找檢定統計量及分配→定拒絕域 RR→算觀察值 T₀→決策法則", "(c) 定 RR→建假說→算 T₀→決策", "(d) 建假說→算 T₀→定 α→找分配"], "ans": "(b)。標準流程：H₀/Hₐ→α→T 與其 H₀ 下分配→RR→T₀→T₀∈RR 則拒絕。"}, {"q": "樣本數 n 固定時，降低 α 通常會導致？", "opts": ["(a) β 下降、檢定力上升", "(b) β 上升、檢定力下降", "(c) α 與 β 同時下降", "(d) 無影響"], "ans": "(b)。n 固定下 α、β 互為消長；欲同時下降唯有增加 n。"}], "11": [{"q": "One-way ANOVA CRD 之檢定統計量 F=MSTR/MSE 的拒絕域為何？", "opts": ["(a) 左尾 F≤…", "(b) 雙尾", "(c) 一律右尾 F≥F_α(k−1,n−k)", "(d) 不拒絕域為 F 越大越好"], "ans": "(c)。SSTR 相對 SSE 越大代表處理效果越顯著，MSTR 越大、F 越大，故一律右尾拒絕。"}, {"q": "ANOVA 的平方和分解恆等式為何？", "opts": ["(a) SSTO=SSTR−SSE", "(b) SSTO=SSTR+SSE", "(c) SSTO=SSB+SSE", "(d) SSTR=SSTO+SSE"], "ans": "(b)。總平方和=處理（組間）平方和+誤差（組內）平方和；RBD 再加上區集平方和 SSB。"}, {"q": "為何 k>2 時不宜直接進行 C(k,2) 次兩兩 t 檢定？", "opts": ["(a) 計算太慢", "(b) 整體型一誤差率 α_eer 會膨脹", "(c) 自由度不足", "(d) 常態假設不成立"], "ans": "(b)。α_eer=1−(1−α_pc)^C≫α_pc，故需 ANOVA 整體檢定；事後多重比較用 Bonferroni/Scheffé/Tukey 控制聯立誤差率。"}, {"q": "Two-way ANOVA 中，分析時應先檢定哪一項？", "opts": ["(a) A 因子主效果", "(b) B 因子主效果", "(c) 交互作用效果 F_AB", "(d) 隨機選一個"], "ans": "(c)。先檢定交互作用；若顯著，主效果內涵變複雜，應改看處理平均 Y̅ᵢⱼ. 而非單純比較主效果。"}], "12": [{"q": "範例12.8：估計簡單迴歸式 Y=a+bXi+ei，n=12，Σ(Yi−Ȳ)²=1000，Σ(Xi−X̄)²=3，R²=0.25。求 b 的估計量標準差。", "opts": [], "ans": "SSE=(1−R²)·SSTO=0.75×1000=750；MSE=SSE/(n−2)=75。SE(β̂1)=√(MSE/Sxx)=√(75/3)=5。"}, {"q": "範例12.12：直線迴歸式 Y=15+2.5X，X 標準差 10、Y 標準差 25。求 X 與 Y 之樣本相關係數。", "opts": [], "ans": "β̂1=r·(sy/sx)，故 r=β̂1·sx/sy=2.5×10/25=1。完全正相關。"}, {"q": "範例12.11：n=20，X̄=1000、Ȳ=1200，Sx=40、Sy=50，r=0.9。求 β1 的最小平方估計值。", "opts": [], "ans": "β̂1=r·Sy/Sx=0.9×50/40=1.125。"}, {"q": "簡單線性迴歸中，E(Y) 的信賴區間與單一新 Y 的預測區間何者較寬？為什麼？", "opts": ["信賴區間較寬", "預測區間較寬", "兩者相同", "視 R² 而定"], "ans": "預測區間較寬。信賴區間估 E(Y) 平均，預測區間多含一個新誤差項 σ²，方差多 1 倍項，故更寬。"}],
