const CH_SECTIONS = {"1": [{"id": "1.1", "title": "統計學是什麼？", "body": "<p>數據資料（<span class=\"term\" data-term=\"Data\">資料</span>）充斥日常生活，<span class=\"term\" data-term=\"Statistics\">統計學</span>研究如何從雜亂數據中粹煉資訊或知識，作為研究者下結論、做決策的依據。</p>\n<p>研究對象稱為個體或元素；個體身上可能取不同值的特性稱為<span class=\"term\" data-term=\"Variable\">變數</span>；對變數測量或觀察所得的「值」即資料。</p>\n<div class=\"note\"><b>重點：</b>決策支援的鏈條：<ol class=\"nlist\"><li>數據資料（data）</li><li>資訊（information）</li><li>知識（knowledge）</li><li>制定決策（decision-making）</li></ol></div>\n<p>從龐大資料庫挖掘趨勢、型態、分群與關聯，稱為資料挖掘（data mining）；過度操弄資料所得的錯誤結論，被戲稱為資料釣魚（data dredging）。</p>\n<div class=\"warn\"><b>陷阱：</b>變數的「值」不一定是數，也可以是文字或符號（如姓名、性別）。</div><div class=\"fig\"><svg viewBox=\"0 0 720 90\" xmlns=\"http://www.w3.org/2000/svg\"><defs><marker id=\"ar\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L7,3 L0,6 z\" fill=\"#6f6555\"/></marker></defs><rect x=\"10\" y=\"28\" width=\"120\" height=\"40\" rx=\"8\" fill=\"#eef3f4\" stroke=\"#2c6e9e\"/><text x=\"70\" y=\"52\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2b251d\">母體 Population</text><rect x=\"175\" y=\"28\" width=\"120\" height=\"40\" rx=\"8\" fill=\"#fbeae2\" stroke=\"#b5542e\"/><text x=\"235\" y=\"52\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2b251d\">抽樣</text><rect x=\"340\" y=\"28\" width=\"120\" height=\"40\" rx=\"8\" fill=\"#eef3f4\" stroke=\"#2c6e9e\"/><text x=\"400\" y=\"52\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2b251d\">樣本 Sample</text><rect x=\"505\" y=\"28\" width=\"120\" height=\"40\" rx=\"8\" fill=\"#fbeae2\" stroke=\"#b5542e\"/><text x=\"565\" y=\"52\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2b251d\">統計推論</text><line x1=\"130\" y1=\"48\" x2=\"172\" y2=\"48\" stroke=\"#6f6555\" marker-end=\"url(#ar)\"/><line x1=\"295\" y1=\"48\" x2=\"337\" y2=\"48\" stroke=\"#6f6555\" marker-end=\"url(#ar)\"/><line x1=\"460\" y1=\"48\" x2=\"502\" y2=\"48\" stroke=\"#6f6555\" marker-end=\"url(#ar)\"/><path d=\"M565,68 q0,22 -220,22 t-320,-22\" fill=\"none\" stroke=\"#3a7d44\" stroke-dasharray=\"4,3\" marker-end=\"url(#ar)\"/><text x=\"360\" y=\"86\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3a7d44\">估計／假說檢定 → 回到母體母數</text></svg><div class=\"figcap\">圖 1：母體 → 抽樣 → 樣本 → 統計推論 → 推估母體母數</div></div>", "pg": "p.019–021"}, {"id": "1.1.2", "title": "母體與樣本", "body": "<p>研究對象的整個群體稱為<span class=\"term\" data-term=\"Population\">母體</span>，大小記為 <b class=\"sym\">N</b>；母體太大、無法普查或具破壞性實驗時，只抽取其中一部分，此子集合即<span class=\"term\" data-term=\"Sample\">樣本</span>，大小記為 <b class=\"sym\">n</b>。</p>\n<div class=\"note\"><b>重點：</b><span class=\"term\" data-term=\"Parameter\">母數（參數）</span> vs <span class=\"term\" data-term=\"Statistic\">統計量</span>：<ol class=\"nlist\"><li>母數描述母體特徵，是固定而未知的常數，通用希臘字母。</li><li>統計量描述樣本特徵，隨每次抽樣而變動。</li></ol></div>\n<p>研究母數的兩大方法：</p>\n<ol class=\"nlist\"><li><span class=\"term\" data-term=\"Census\">普查</span>（對母體全體）</li><li>抽樣調查</li></ol>\n<p>普查有三大困難：</p>\n<ol class=\"nlist\"><li>成本太高</li><li>無限／概念性母體無法列舉</li><li>破壞性實驗不能全做</li></ol>\n<p><span class=\"term\" data-term=\"StatisticalInference\">統計推論</span>主要包含兩種工具：</p>\n<ol class=\"nlist\"><li><span class=\"term\" data-term=\"Estimation\">估計</span>（點估計、區間估計）</li><li><span class=\"term\" data-term=\"HypothesisTesting\">假說檢定</span></li></ol>\n<p>唯有<span class=\"term\" data-term=\"RandomSample\">隨機樣本</span>才有代表性，故機率論是推論統計學的基石。</p>\n<div class=\"warn\"><b>易錯：</b>隨機樣本才有可掌握的機率規律；非隨機樣本主觀任意，無法做推論。</div><div class=\"note\"><b>本章註：</b><b class=\"proper\">何大一（David Ho）</b>以雞尾酒療法治療 HIV 的臨床新藥試驗，即典型的<b class=\"concept\">臨床母體</b>：把「所有符合條件的患者」視為母體、實際受試者為樣本。</div>", "pg": "p.022–026"}, {"id": "1.1.3", "title": "統計學之分類", "body": "<p>依處理問題區分：<span class=\"term\" data-term=\"DescriptiveStatistics\">敘述統計學</span>研究如何把雜亂資料整理成易讀形式；<span class=\"term\" data-term=\"InferentialStatistics\">推論統計學</span>研究如何由樣本推論母體。</p>\n<p>依功能區分：</p>\n<ol class=\"nlist\"><li>數理統計學：研究理論本身的數學推導。</li><li>應用統計學：把工具用到各領域（商用、生物統計、計量經濟、工程統計等）。</li></ol>\n<p>依是否假設母體分配區分：</p>\n<ol class=\"nlist\"><li>母數統計學：常假設常態或大樣本，推論平均數、變異數等母數。</li><li>非母數統計學：又稱無母數或分配自由化方法，不對分配形式設限。</li></ol>\n<div class=\"note\"><b>重點：</b>普查只需敘述統計；母體太大、普查做不到，才需要推論統計。</div><div class=\"note\"><b>本章註：</b>現代統計學由 <b class=\"proper\">Karl Pearson</b> 與 <b class=\"proper\">R. A. Fisher</b> 奠基；實驗經濟學之父 <b class=\"proper\">Vernon L. Smith</b>（諾貝爾經濟學獎）即以統計方法設計人為實驗。進階方法可參考 <b class=\"proper\">Hastie、Tibshirani、Friedman《The Elements of Statistical Learning》</b>。</div>", "pg": "p.026–027"}, {"id": "1.2.1", "title": "變數的測量尺度", "body": "<p><b class=\"proper\">Stevens（1946）</b>依資訊含量把測量尺度由低到高分為四級：</p>\n<table><colgroup><col style=\"width:18%\"><col style=\"width:42%\"><col style=\"width:40%\"></colgroup><tr><th>尺度</th><th>功能</th><th>實例／可做運算</th></tr><tr><td><span class=\"term\" data-term=\"NominalScale\">名義尺度</span></td><td>只辨識分類，數字只是分類號</td><td>性別、血型、背號；無運算</td></tr><tr><td><span class=\"term\" data-term=\"OrdinalScale\">順序尺度</span></td><td>可比較優劣順序</td><td>名次、滿意度等第；&gt;、&lt;</td></tr><tr><td><span class=\"term\" data-term=\"IntervalScale\">等距尺度</span></td><td>可算差距大小，無自然零點</td><td>攝氏溫度、IQ；+、−</td></tr><tr><td><span class=\"term\" data-term=\"RatioScale\">比例尺度</span></td><td>有自然零點，可作乘除</td><td>身高、體重、薪資；+、−、×、÷</td></tr></table>\n<div class=\"warn\"><b>易錯：</b>溫度攝氏／華氏是等距尺度，絕對溫度 K 才是比例尺度；存在「自然零點」是比例尺度的關鍵。</div><div class=\"fig\"><svg viewBox=\"0 0 720 150\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"60\" y=\"94\" width=\"130\" height=\"26\" fill=\"#e8dfc8\" stroke=\"#6f6555\"/><text x=\"125\" y=\"86\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">{name}</text><rect x=\"210\" y=\"68\" width=\"130\" height=\"52\" fill=\"#d7e6e0\" stroke=\"#6f6555\"/><text x=\"275\" y=\"60\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">{name}</text><rect x=\"360\" y=\"42\" width=\"130\" height=\"78\" fill=\"#f3d9c8\" stroke=\"#6f6555\"/><text x=\"425\" y=\"34\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">{name}</text><rect x=\"510\" y=\"16\" width=\"130\" height=\"104\" fill=\"#cfe0d2\" stroke=\"#6f6555\"/><text x=\"575\" y=\"8\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">{name}</text><text x=\"360\" y=\"145\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6f6555\">資訊含量遞增 →</text></svg><div class=\"figcap\">圖 2：測量尺度四階，由低到高資訊含量遞增</div></div>", "pg": "p.028–029"}, {"id": "1.2.2", "title": "資料之分類", "body": "<p>依性質分：<span class=\"term\" data-term=\"QualitativeData\">屬質資料</span>（類別資料，必為離散）與<span class=\"term\" data-term=\"QuantitativeData\">屬量資料</span>，後者再分：</p>\n<ol class=\"nlist\"><li><span class=\"term\" data-term=\"DiscreteData\">離散型資料</span></li><li><span class=\"term\" data-term=\"ContinuousData\">連續型資料</span></li></ol>\n<p>依來源與涵蓋範圍分：</p>\n<ol class=\"nlist\"><li>原始資料（自行調查蒐集）／次級資料（取自他人整理）</li><li>普查資料（母體資料）／抽樣資料（樣本資料）</li></ol>\n<p>依型態分：</p>\n<ol class=\"nlist\"><li>橫斷面資料（某時點多個體）</li><li>時間序列資料（單一個體隨時間）</li><li>追蹤資料（panel data，多個體隨時間）</li></ol>\n<div class=\"note\"><b>重點：</b>屬質資料即使以數字呈現（如學號、郵遞區號），那個數字也只是分類號，沒有數量意義。</div><div class=\"fig\"><svg viewBox=\"0 0 720 150\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"300\" y=\"10\" width=\"120\" height=\"34\" rx=\"7\" fill=\"#eef3f4\" stroke=\"#2c6e9e\"/><text x=\"360\" y=\"31\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">資料 Data</text><line x1=\"360\" y1=\"44\" x2=\"200\" y2=\"70\" stroke=\"#6f6555\"/><line x1=\"360\" y1=\"44\" x2=\"520\" y2=\"70\" stroke=\"#6f6555\"/><rect x=\"120\" y=\"70\" width=\"160\" height=\"32\" rx=\"7\" fill=\"#fbeae2\" stroke=\"#b5542e\"/><text x=\"200\" y=\"90\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">屬質（類別）</text><rect x=\"440\" y=\"70\" width=\"160\" height=\"32\" rx=\"7\" fill=\"#eef3f4\" stroke=\"#2c6e9e\"/><text x=\"520\" y=\"90\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">屬量（數值）</text><line x1=\"520\" y1=\"102\" x2=\"430\" y2=\"124\" stroke=\"#6f6555\"/><line x1=\"520\" y1=\"102\" x2=\"610\" y2=\"124\" stroke=\"#6f6555\"/><text x=\"430\" y=\"138\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3a7d44\">離散型</text><text x=\"610\" y=\"138\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3a7d44\">連續型</text></svg><div class=\"figcap\">圖 3：資料分類樹：屬質／屬量 → 離散／連續</div></div>", "pg": "p.030–032"}], "2": [{"id": "2.1", "title": "次數分配", "body": "<p>敘述統計旨在整理、陳示與解釋龐大資料。<span class=\"term\" data-term=\"FrequencyDistribution\">次數分配</span>指資料在各分組中出現次數的分配情形，通常編成<span class=\"term\" data-term=\"FrequencyTable\">次數分配表</span>。</p>\n<p>屬質資料常用的圖形：</p>\n<ol class=\"nlist\"><li><span class=\"term\" data-term=\"BarChart\">長條圖</span>（組間留間隔）</li><li><span class=\"term\" data-term=\"PieChart\">圓餅圖</span>（扇形角度＝360°×相對次數）</li><li><span class=\"term\" data-term=\"ParetoChart\">柏雷托圖</span>（排序並疊加累加次數）</li></ol>\n<p>屬量連續資料分組原則為互斥且週延：先求全距 R＝最大值−最小值，再定組數 k 與組距 h，使 R ≈ k×h。</p>\n<div class=\"formula\"><span class=\"f-label\">Sturges 法則</span>k = 1 + log₂N = 1 + 3.322·log₁₀N</div>\n<p>組界由組限上下各加減半個基本單位而得；組中點＝（上組限＋下組限）／2。屬量資料可用<span class=\"term\" data-term=\"Histogram\">直方圖</span>與<span class=\"term\" data-term=\"Ogive\">肩形圖</span>：相對次數折線對應 pdf、相對累加次數折線對應 cdf。</p>\n<div class=\"warn\"><b>陷阱：</b>長條圖組間要留間隔；直方圖組間相鄰不留空隙，兩者不可混用。</div><div class=\"fig\"><svg viewBox=\"0 0 720 170\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"10\" fill=\"#2b251d\"><g><line x1=\"20\" y1=\"140\" x2=\"160\" y2=\"140\" stroke=\"#6f6555\"/><rect x=\"35\" y=\"90\" width=\"20\" height=\"50\" fill=\"#2c6e9e\"/><rect x=\"65\" y=\"70\" width=\"20\" height=\"70\" fill=\"#2c6e9e\"/><rect x=\"95\" y=\"105\" width=\"20\" height=\"35\" fill=\"#2c6e9e\"/><rect x=\"125\" y=\"55\" width=\"20\" height=\"85\" fill=\"#2c6e9e\"/><text x=\"90\" y=\"160\" text-anchor=\"middle\">長條圖（留間隔）</text></g><g><line x1=\"200\" y1=\"140\" x2=\"340\" y2=\"140\" stroke=\"#6f6555\"/><rect x=\"205\" y=\"95\" width=\"30\" height=\"45\" fill=\"#b5542e\"/><rect x=\"235\" y=\"75\" width=\"30\" height=\"65\" fill=\"#b5542e\"/><rect x=\"265\" y=\"105\" width=\"30\" height=\"35\" fill=\"#b5542e\"/><rect x=\"295\" y=\"118\" width=\"30\" height=\"22\" fill=\"#b5542e\"/><text x=\"270\" y=\"160\" text-anchor=\"middle\">直方圖（相鄰）</text></g><g><circle cx=\"430\" cy=\"95\" r=\"40\" fill=\"none\"/><path d=\"M430,95 L430,55 A40,40 0 0 1 464,115 z\" fill=\"#2c6e9e\"/><path d=\"M430,95 L464,115 A40,40 0 0 1 405,127 z\" fill=\"#b5542e\"/><path d=\"M430,95 L405,127 A40,40 0 0 1 430,55 z\" fill=\"#3a7d44\"/><text x=\"430\" y=\"155\" text-anchor=\"middle\">圓餅圖</text></g><g><line x1=\"560\" y1=\"140\" x2=\"700\" y2=\"140\" stroke=\"#6f6555\"/><polyline points=\"565,135 590,120 615,95 640,70 665,58 690,55\" fill=\"none\" stroke=\"#3a7d44\" stroke-width=\"2\"/><text x=\"630\" y=\"160\" text-anchor=\"middle\">肩形圖（累加）</text></g></svg><div class=\"figcap\">圖 4：屬質／屬量資料常用圖形比較</div></div>", "pg": "p.034–042"}, {"id": "2.2", "title": "中央趨勢量數", "body": "<p>中央趨勢量數用一個數摘要「資料中心在哪」：</p>\n<ol class=\"nlist\"><li><span class=\"term\" data-term=\"ArithmeticMean\">算術平均數</span>：母體 <b class=\"sym\">μ</b>=(1/N)ΣXi、樣本 <b class=\"sym\">x̄</b>=(1/n)ΣXi，即資料重心；分組資料假設各組落在組中點。</li><li><span class=\"term\" data-term=\"Median\">中位數</span> me：排序後最中央的數，對離群值穩健（robust）。</li><li><span class=\"term\" data-term=\"Mode\">眾數</span> mo：出現次數最多者；名義尺度只能用眾數。</li></ol>\n<div class=\"note\"><b>重點：</b>對稱分配 <b class=\"sym\">μ</b>＝me＝mo；右偏（正偏）<b class=\"sym\">μ</b>≥me≥mo；左偏（負偏）mo≥me≥<b class=\"sym\">μ</b>。</div>\n<p>其他平均：</p>\n<ol class=\"nlist\"><li><span class=\"term\" data-term=\"TrimmedMean\">截尾平均數</span>：刪去前後各 100p% 再平均（建議 p＝0.1～0.2）。</li><li><span class=\"term\" data-term=\"GeometricMean\">幾何平均數</span>：適用成長率／報酬率。</li><li><span class=\"term\" data-term=\"HarmonicMean\">調和平均數</span>：適用等距離求平均速度或等金額求平均價格。</li></ol>\n<p>算術平均是 0% 截尾平均，中位數是 50% 截尾平均。</p><div class=\"fig\"><svg viewBox=\"0 0 720 150\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"10\" fill=\"#2b251d\"><path d=\"M40,120 Q110,120 120,60 Q130,20 140,60 Q150,120 220,120\" fill=\"#eef3f4\" stroke=\"#2c6e9e\"/><line x1=\"130\" y1=\"30\" x2=\"130\" y2=\"120\" stroke=\"#3a7d44\"/><text x=\"130\" y=\"24\" text-anchor=\"middle\">mean=median=mode</text><path d=\"M380,120 Q430,118 455,80 Q475,40 490,90 Q510,120 660,120\" fill=\"#fbeae2\" stroke=\"#b5542e\"/><line x1=\"455\" y1=\"45\" x2=\"455\" y2=\"120\" stroke=\"#3a7d44\"/><text x=\"455\" y=\"40\" text-anchor=\"middle\">mode</text><line x1=\"480\" y1=\"60\" x2=\"480\" y2=\"120\" stroke=\"#2c6e9e\"/><text x=\"480\" y=\"56\" text-anchor=\"middle\">median</text><line x1=\"510\" y1=\"80\" x2=\"510\" y2=\"120\" stroke=\"#b5542e\"/><text x=\"520\" y=\"84\" text-anchor=\"start\">mean（右偏靠右）</text></svg><div class=\"figcap\">圖 5：對稱分配三者重合；右偏（正偏）mode &lt; median &lt; mean</div></div>", "pg": "p.043–053"}, {"id": "2.3", "title": "位置量數", "body": "<p>位置量數回答「某個相對位置是多少」，不一定在中央。<span class=\"term\" data-term=\"Percentile\">第 r 百分位數</span> Pr 表示有 r% 資料小於等於它，作法是把排序資料切 99 刀成 100 等份。</p>\n<p>計算位置 i＝n×r／100：</p>\n<ol class=\"nlist\"><li>若 i 為整數，Pr 取 X(i) 與 X(i+1) 之間。</li><li>若不為整數，Pr＝X(⌈i⌉)。</li></ol>\n<p><span class=\"term\" data-term=\"Quartile\">四分位數</span>把資料切 3 刀成 4 等份：<b class=\"sym\">Q1</b>＝P25、Q2＝P50＝D5＝me、Q3＝P75；十分位數則切成 10 等份。</p>\n<div class=\"note\"><b>重點：</b><b class=\"sym\">Q2</b> 就是中位數，故很少單獨稱「第 2 四分位數」。</div>", "pg": "p.054–058"}, {"id": "2.4", "title": "分散趨勢量數", "body": "<p>分散趨勢量數摘要「資料多散」：</p>\n<ol class=\"nlist\"><li><span class=\"term\" data-term=\"Variance\">變異數</span>：母體 <b class=\"sym\">σ²</b>＝(1/N)Σ(Xi−μ)²；樣本 S²＝(1/(n−1))Σ(Xi−<b class=\"sym\">x̄</b>)²。</li><li><span class=\"term\" data-term=\"StandardDeviation\">標準差</span>：σ＝√<b class=\"sym\">σ²</b>、S＝√S²，把單位還原成與原資料相同。</li></ol>\n<div class=\"warn\"><b>易錯：</b>樣本變異數除以 n−1 而非 n——用 <b class=\"sym\">x̄</b> 估 μ 損失一個自由度，如此 <b class=\"sym\">S²</b> 才是 <b class=\"sym\">σ²</b> 的不偏估計量。</div>\n<p>標準差具平移不變性：Yi＝Xi+b 時 Sy＝Sx；Yi＝aXi 時 Sy＝|a|·Sx。</p>\n<ol class=\"nlist\"><li><span class=\"term\" data-term=\"CoefficientOfVariation\">變異係數</span> <b class=\"sym\">CV</b>＝(S/<b class=\"sym\">x̄</b>)×100%：無單位，用來比較尺度或單位不同的兩筆資料。</li><li><span class=\"term\" data-term=\"Range\">全距</span> R＝X(n)−X(1)：極易受離群值影響；經驗上 S ≈ R/4。</li></ol>", "pg": "p.059–067"}, {"id": "2.5", "title": "其他量數與課題", "body": "<p><span class=\"term\" data-term=\"ZScore\">z 分數</span>（標準分數）衡量單一資料點在整筆資料中的相對位置：zi＝(Xi−<b class=\"sym\">μ</b>)/σ 或 (Xi−<b class=\"sym\">x̄</b>)/S。</p>\n<p>若分配接近鐘形，有<span class=\"term\" data-term=\"EmpiricalRule\">經驗法則</span>（68-95-99.7）：</p>\n<ol class=\"nlist\"><li>約 68% 資料落在 <b class=\"sym\">μ</b>±σ 內。</li><li>約 95% 落在 <b class=\"sym\">μ</b>±2σ 內。</li><li>約 99.7% 落在 <b class=\"sym\">μ</b>±3σ 內。</li></ol>\n<p><span class=\"term\" data-term=\"Outlier\">離群值</span>是異常過大或過小的數據，分析前應先檢視資料可靠性。</p>\n<div class=\"note\"><b>重點：</b>z 分數本質上就是後面機率論的「標準化」動作。</div>", "pg": "p.068–070"}, {"id": "2.6", "title": "分配形狀量數", "body": "<p>形狀量數關心兩件事：<span class=\"term\" data-term=\"Skewness\">偏態</span>（對稱與否）與<span class=\"term\" data-term=\"Kurtosis\">峰態</span>（中央群聚與尾部厚薄）。</p>\n<p><span class=\"term\" data-term=\"SampleMoment\">動差體系</span>由 <b class=\"proper\">Karl Pearson</b> 創：原動差以原點為基準，主動差以平均數為基準。</p>\n<ol class=\"nlist\"><li>一階動差含中央趨勢。</li><li>二階含分散。</li><li>三階含偏態。</li><li>四階含峰態。</li></ol>\n<div class=\"note\"><b>重點：</b>偏態係數 a3：&gt;0 右偏（正偏）、=0 對稱、&lt;0 左偏（負偏）；Pearson 法 sk＝3(<b class=\"sym\">x̄</b>−me)/S。</div>\n<p>峰態係數 a4：&gt;3 高狹峰（leptokurtic，肥尾）、=3 常態峰（mesokurtic）、&lt;3 低闊峰（platykurtic，瘦尾）；超額峰態＝a4−3。</p>", "pg": "p.071–077"}, {"id": "2.7", "title": "探測性資料分析（EDA）", "body": "<p>EDA 由 <b class=\"proper\">John Tukey</b> 提倡，以簡單計算與簡易圖形快速呈現分配的位置與形狀。</p>\n<p><span class=\"term\" data-term=\"FiveNumberSummary\">五數字摘要</span>：</p>\n<ol class=\"nlist\"><li>最小值</li><li><b class=\"sym\">Q1</b></li><li>中位數 me</li><li><b class=\"sym\">Q3</b></li><li>最大值</li></ol>\n<p>兩兩之間各含約 25% 資料，相鄰差距小代表該處密度大。</p>\n<p><span class=\"term\" data-term=\"BoxPlot\">盒鬚圖</span>以 <b class=\"sym\">Q1</b>、Q3 畫盒（盒寬即 <span class=\"term\" data-term=\"IQR\"><b class=\"sym\">IQR</b></span>＝<b class=\"sym\">Q3</b>−<b class=\"sym\">Q1</b>），盒中畫中位數；由 <b class=\"sym\">Q1</b>、Q3 各延伸：</p>\n<ol class=\"nlist\"><li>1.5×<b class=\"sym\">IQR</b> 為內籬。</li><li>3×<b class=\"sym\">IQR</b> 為外籬。</li></ol>\n<div class=\"warn\"><b>陷阱：</b>內籬與外籬之間者為溫和（嫌疑）離群值，外籬之外者為嚴重離群值。</div><div class=\"fig\"><svg viewBox=\"0 0 720 120\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"10\" fill=\"#2b251d\"><line x1=\"40\" y1=\"60\" x2=\"680\" y2=\"60\" stroke=\"#6f6555\"/><rect x=\"230\" y=\"35\" width=\"200\" height=\"50\" fill=\"#eef3f4\" stroke=\"#2c6e9e\"/><line x1=\"330\" y1=\"35\" x2=\"330\" y2=\"85\" stroke=\"#b5542e\" stroke-width=\"2\"/><line x1=\"120\" y1=\"45\" x2=\"120\" y2=\"75\" stroke=\"#6f6555\"/><line x1=\"120\" y1=\"60\" x2=\"230\" y2=\"60\" stroke=\"#6f6555\"/><line x1=\"590\" y1=\"45\" x2=\"590\" y2=\"75\" stroke=\"#6f6555\"/><line x1=\"430\" y1=\"60\" x2=\"590\" y2=\"60\" stroke=\"#6f6555\"/><circle cx=\"650\" cy=\"60\" r=\"4\" fill=\"none\" stroke=\"#b5542e\"/><circle cx=\"70\" cy=\"60\" r=\"4\" fill=\"none\" stroke=\"#b5542e\"/><text x=\"230\" y=\"100\" text-anchor=\"middle\">Q1</text><text x=\"330\" y=\"100\" text-anchor=\"middle\">Q2 中位數</text><text x=\"430\" y=\"100\" text-anchor=\"middle\">Q3</text><text x=\"120\" y=\"115\" text-anchor=\"middle\">內籬 1.5IQR</text><text x=\"590\" y=\"115\" text-anchor=\"middle\">內籬</text><text x=\"650\" y=\"30\" text-anchor=\"middle\" fill=\"#b5542e\">離群點</text></svg><div class=\"figcap\">圖 6：盒鬚圖：Q1–Q3 畫盒、Q2 居中，鬚長 1.5×IQR，圈為離群點</div></div>", "pg": "p.078–082"}], "3": [{"id": "3.1", "title": "基本概念與機率定義", "body": "<p><span class=\"term\" data-term=\"RandomExperiment\">隨機實驗</span>的所有可能結果構成<span class=\"term\" data-term=\"SampleSpace\">樣本空間 S</span>，其中每個結果是<span class=\"term\" data-term=\"SamplePoint\">樣本點</span>。S 分為：</p>\n<ol class=\"nlist\"><li>有限、可數無限（皆屬離散）。</li><li>不可數無限（連續）。</li></ol>\n<p>S 的子集合稱為<span class=\"term\" data-term=\"Event\">事件</span>，實際結果落於事件之內即事件發生。<span class=\"term\" data-term=\"MutuallyExclusive\">互斥事件</span>指交集為空集、不能同時發生。</p>\n<p>三種直觀的機率定義：</p>\n<table><colgroup><col style=\"width:22%\"><col style=\"width:48%\"><col style=\"width:30%\"></colgroup><tr><th>定義</th><th>內容</th><th>限制</th></tr><tr><td><span class=\"term\" data-term=\"ClassicalProbability\">古典機率</span></td><td>P(A) = 有利樣本點數 ÷ 總樣本點數</td><td>有限且等可能</td></tr><tr><td><span class=\"term\" data-term=\"RelativeFrequencyProbability\">相對次數機率</span></td><td>實驗次數趨無限時 A 發生比例之極限</td><td>無法重複無限次</td></tr><tr><td><span class=\"term\" data-term=\"SubjectiveProbability\">主觀機率</span></td><td>個人依證據與知識的相信程度</td><td>無客觀標準</td></tr></table>\n<div class=\"note\"><b>重點：</b>古典定義要求每個樣本點「等可能」，這是它常被誤用的地方。</div>", "pg": "p.083–089"}, {"id": "3.2", "title": "公設化機率定義", "body": "<p>俄國數學家 <b class=\"proper\">Kolmogorov</b>（1933）為機率論公設化。<span class=\"term\" data-term=\"KolmogorovAxioms\">柯氏三公設</span>：</p>\n<ol class=\"nlist\"><li>非負性 P(A)≥0。</li><li>正規性 P(S)＝1。</li><li>可數可加性：兩兩互斥事件聯集的機率等於個別機率之和。</li></ol>\n<p>滿足三公設的集合函數即<span class=\"term\" data-term=\"ProbabilityMeasure\">機率測度</span>。</p>\n<div class=\"formula\"><span class=\"f-label\">核心推論</span>P(A′)＝1 − P(A)；0 ≤ P(A) ≤ 1；P(∅)＝0</div>\n<p><span class=\"term\" data-term=\"AdditionRule\">加法規則</span>：P(A∪B)＝P(A)+P(B)−P(A∩B)；互斥時簡化為 P(A)+P(B)。恰一個發生的<span class=\"term\" data-term=\"SymmetricDifference\">對稱差</span>：P(A△B)＝P(A)+P(B)−2P(A∩B)。</p>\n<p>若 A⊂B 則 P(A)≤P(B)。另有 <b class=\"proper\">Boole</b> 不等式 P(A∪B)≤P(A)+P(B)，與 <b class=\"proper\">Bonferroni</b> 不等式 P(A∩B)≥1−P(A′)−P(B′)。</p>\n<div class=\"warn\"><b>易錯：</b>P(∅)＝0，但機率為 0 的事件不一定是空事件（連續樣本空間中單點機率即為 0）。</div><div class=\"fig\"><svg viewBox=\"0 0 720 150\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"10\" fill=\"#2b251d\"><rect x=\"20\" y=\"15\" width=\"160\" height=\"120\" fill=\"#fff\" stroke=\"#6f6555\"/><text x=\"30\" y=\"30\">S</text><circle cx=\"100\" cy=\"80\" r=\"38\" fill=\"#cfe0d2\" stroke=\"#3a7d44\"/><text x=\"100\" y=\"84\" text-anchor=\"middle\">A</text><text x=\"100\" y=\"142\" text-anchor=\"middle\">A′ 為斜線外</text><circle cx=\"290\" cy=\"80\" r=\"34\" fill=\"#cfe0d2\" stroke=\"#3a7d44\"/><circle cx=\"330\" cy=\"80\" r=\"34\" fill=\"#f3d9c8\" stroke=\"#b5542e\"/><text x=\"310\" y=\"84\" text-anchor=\"middle\">A∩B</text><text x=\"310\" y=\"142\" text-anchor=\"middle\">交集（且）</text><circle cx=\"480\" cy=\"80\" r=\"34\" fill=\"#cfe0d2\" stroke=\"#3a7d44\"/><circle cx=\"520\" cy=\"80\" r=\"34\" fill=\"#f3d9c8\" stroke=\"#b5542e\"/><text x=\"500\" y=\"84\" text-anchor=\"middle\">A∪B</text><text x=\"500\" y=\"142\" text-anchor=\"middle\">聯集（或）</text><circle cx=\"640\" cy=\"80\" r=\"32\" fill=\"#cfe0d2\" stroke=\"#3a7d44\"/><circle cx=\"685\" cy=\"80\" r=\"32\" fill=\"none\" stroke=\"#b5542e\"/><text x=\"662\" y=\"142\" text-anchor=\"middle\">互斥（不相交）</text></svg><div class=\"figcap\">圖 7：事件的集合關係：餘集、交集、聯集、互斥</div></div>", "pg": "p.090–097"}, {"id": "3.3", "title": "條件機率與獨立事件", "body": "<p>若 P(B)&gt;0，<span class=\"term\" data-term=\"ConditionalProbability\">條件機率</span> P(A|B)＝P(A∩B)/P(B)，可把 B 視為縮小後的新樣本空間。</p>\n<div class=\"formula\"><span class=\"f-label\">乘法規則</span>P(A∩B) = P(A|B)·P(B) = P(B|A)·P(A)</div>\n<p>聯集是「或」用加法、交集是「且」用乘法。列聯表中：交集機率稱<span class=\"term\" data-term=\"JointProbability\">聯合機率</span>，邊緣上單一事件的機率稱<span class=\"term\" data-term=\"MarginalProbability\">邊際機率</span>。</p>\n<p>兩事件<span class=\"term\" data-term=\"IndependentEvents\">獨立</span>若且唯若 P(A∩B)＝P(A)P(B)（等價於 P(A|B)＝P(A)）；否則稱<span class=\"term\" data-term=\"DependentEvents\">相依事件</span>。獨立與互斥是完全不同的概念：互斥是集合概念，獨立則牽涉機率。</p>\n<p>三事件的獨立層級：</p>\n<ol class=\"nlist\"><li><span class=\"term\" data-term=\"PairwiseIndependence\">成對獨立</span>：任兩兩皆獨立。</li><li><span class=\"term\" data-term=\"MutualIndependence\">完全獨立</span>：還要求三者交集機率等於個別機率連乘。</li></ol>\n<p>完全獨立蘊含成對獨立，反之不然。</p>\n<div class=\"warn\"><b>陷阱：</b><span class=\"term\" data-term=\"GamblersFallacy\">賭徒謬誤</span>——以為獨立事件連開同邊後下一次會傾向相反，這是對「獨立」的誤解。</div>", "pg": "p.098–110"}, {"id": "3.4", "title": "全機率定理與貝氏定理", "body": "<p>一組<span class=\"term\" data-term=\"Partition\">分割</span>同時滿足兩兩互斥與集體包含（聯集＝S）；A 與 A′ 是最簡單的一組分割。</p>\n<div class=\"formula\"><span class=\"f-label\">全機率定理</span>P(B) = Σᵢ P(B|Aᵢ)·P(Aᵢ)，A₁,…,Aₙ 為一組分割</div>\n<p><span class=\"term\" data-term=\"BayesRule\">貝氏定理</span>把「事前」與「事後」條件機率連起來：</p>\n<div class=\"formula\"><span class=\"f-label\">Bayes</span>P(Aₖ|B) = P(B|Aₖ)·P(Aₖ) ÷ Σᵢ P(B|Aᵢ)·P(Aᵢ)</div>\n<p>分母就是全機率定理。貝氏定理用於「已知結果、反推原因」，經典應如 <b class=\"proper\">Monty Hall</b> 問題：</p>\n<ol class=\"nlist\"><li>換門策略中車機率為 2/3。</li><li>不換僅 1/3。</li></ol>\n<div class=\"note\"><b>重點：</b>貝氏定理＝條件機率定義＋乘法規則＋全機率定理，沒有新東西。</div><div class=\"fig\"><svg viewBox=\"0 0 720 160\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"11\" fill=\"#2b251d\"><circle cx=\"60\" cy=\"80\" r=\"26\" fill=\"#eef3f4\" stroke=\"#2c6e9e\"/><text x=\"60\" y=\"84\" text-anchor=\"middle\">事前</text><line x1=\"86\" y1=\"70\" x2=\"260\" y2=\"40\" stroke=\"#6f6555\"/><line x1=\"86\" y1=\"90\" x2=\"260\" y2=\"120\" stroke=\"#6f6555\"/><rect x=\"260\" y=\"22\" width=\"120\" height=\"34\" rx=\"6\" fill=\"#fbeae2\" stroke=\"#b5542e\"/><text x=\"320\" y=\"43\" text-anchor=\"middle\">A₁</text><rect x=\"260\" y=\"102\" width=\"120\" height=\"34\" rx=\"6\" fill=\"#fbeae2\" stroke=\"#b5542e\"/><text x=\"320\" y=\"123\" text-anchor=\"middle\">A₂</text><line x1=\"380\" y1=\"39\" x2=\"560\" y2=\"60\" stroke=\"#6f6555\"/><line x1=\"380\" y1=\"39\" x2=\"560\" y2=\"90\" stroke=\"#6f6555\"/><line x1=\"380\" y1=\"119\" x2=\"560\" y2=\"90\" stroke=\"#6f6555\"/><line x1=\"380\" y1=\"119\" x2=\"560\" y2=\"60\" stroke=\"#6f6555\"/><text x=\"470\" y=\"55\" text-anchor=\"middle\">P(B|A₁)</text><text x=\"470\" y=\"105\" text-anchor=\"middle\">P(B|A₂)</text><rect x=\"560\" y=\"60\" width=\"130\" height=\"34\" rx=\"6\" fill=\"#eef3f4\" stroke=\"#2c6e9e\"/><text x=\"625\" y=\"81\" text-anchor=\"middle\">事後 P(A|B)</text></svg><div class=\"figcap\">圖 8：貝氏樹：事前機率 × 條件機率 → 聯集機率 → 事後機率</div></div>", "pg": "p.111–120"}], "4": [{"id": "4.1", "title": "隨機變數與機率函數", "pg": "p.121–140", "body": "<p><span class=\"term\" data-term=\"Random Variable\">隨機變數</span> X 為定義在樣本空間 S 上之實值函數 X:S→R，把每個樣本點對應成實數，以便引入<span class=\"term\" data-term=\"PDF\">微積分</span>研究機率。大寫 X 表隨機變數本身，小寫 x 表其某特定實現值；允許一對一或多對一，但不允許一對多。X 所有可能值的集合即<span class=\"term\" data-term=\"Range of a RV\">值域</span> R_X，又稱支撐集。</p><p>依值域分類：<span class=\"term\" data-term=\"Discrete RV\">離散型隨機變數</span>之值域為有限或可數無限；<span class=\"term\" data-term=\"Continuous RV\">連續型隨機變數</span>之值域為不可數無限。</p><div class=\"formula\"><span class=\"f-label\">pmf（離散）</span><span class=\"sym\">f_X(x)=P(X=x)</span>，滿足 <span class=\"sym\">0≤f_X(x)≤1</span>、<span class=\"sym\">Σ f_X(x)=1</span></div><div class=\"formula\"><span class=\"f-label\">cdf</span><span class=\"sym\">F_X(x)=P(X≤x)</span>；離散為右連續階梯函數、連續為連續函數</div><div class=\"formula\"><span class=\"f-label\">pdf（連續）</span><span class=\"sym\">f_X(x)=F_X'(x)=dF_X(x)/dx</span>，<span class=\"sym\">∫f_X(x)dx=1</span>；pdf 非機率，可大於 1</div><div class=\"note\"><b>重點：</b>離散型在單點有機率，故「等不等很有關係」；連續型 P(X=a)=0，故有無等號無關緊要。P(a<X≤b)=F_X(b)-F_X(a)。</div><p><span class=\"term\" data-term=\"Mixed Type RV\">混合型隨機變數</span>一部分離散、一部分連續，其 cdf 可分解為 <span class=\"sym\">F_X(x)=aF_d(x)+(1-a)F_c(x)</span>，0<a<1，分別以離散與連續手法處理。</p><div class=\"warn\">分辨離散/連續：看值域 R_X，或看 cdf——離散是階梯函數、連續是連續函數。</div>"}, {"id": "4.2", "title": "期望值、變異數與標準差", "pg": "p.141–151", "body": "<p><span class=\"term\" data-term=\"Expected Value\">期望值</span> μ=E(X) 即母體平均數，是一階動差；<span class=\"term\" data-term=\"Variance\">變異數</span> σ²=Var(X) 是二階中央動差，衡量分散。二者皆為固定母體參數，且要求 E|X|<∞（絕對收斂）始存在。</p><div class=\"formula\"><span class=\"f-label\">期望值</span>離散 <span class=\"sym\">E(X)=Σ x f_X(x)</span>；連續 <span class=\"sym\">E(X)=∫ x f_X(x)dx</span></div><div class=\"formula\"><span class=\"f-label\">變異數</span><span class=\"sym\">Var(X)=E[(X-μ)²]=E(X²)-[E(X)]²</span></div><div class=\"formula\"><span class=\"f-label\">標準差</span><span class=\"sym\">σ=SD(X)=√Var(X)</span></div><div class=\"formula\"><span class=\"f-label\">懶惰統計學家法則</span><span class=\"sym\">E[g(X)]=Σ g(x)f_X(x)=∫g(x)f_X(x)dx</span></div><div class=\"note\"><b>重點：</b>期望值具線性 <span class=\"sym\">E(aX+b)=aE(X)+b</span>，常數可提出；但 <span class=\"sym\">E(X²)≠[E(X)]²</span>、<span class=\"sym\">E(eˣ)≠e^{E(X)}</span>。Var(aX+b)=a²Var(X)、Var(c)=0。</div><p>期望值所在位置使平均平方離差 E[(X-a)²] 最小（a*=μ）。不知機率函數時，可於 X=μ 處對 g(X) 作 Taylor 展開近似求 E[g(X)]、Var[g(X)]≈[g'(μ)]²σ²。</p><div class=\"concept\">公平賭局 fair game：期望所得為 0 的賭局；人通常為風險嫌惡者，須有風險溢酬才願參加。</div>"}, {"id": "4.3", "title": "中位數、眾數與分位數", "pg": "p.152–157", "body": "<p>本節用母體機率函數求<span class=\"term\" data-term=\"Median\">母體中位數</span>、<span class=\"term\" data-term=\"Mode\">母體眾數</span>與<span class=\"term\" data-term=\"Percentile\">母體百分位數</span>，對照第 2 章的樣本版本。</p><div class=\"formula\"><span class=\"f-label\">中位數 m</span>連續型 <span class=\"sym\">P(X≤m)=P(X≥m)=0.5</span>；中位數使平均絕對離差 E|X-a| 最小</div><div class=\"formula\"><span class=\"f-label\">百分位數 P_r</span><span class=\"sym\">P(X≤P_r)=r/100</span>；中位數即 P₅₀，四分位 Q₁=P₂₅、Q₃=P₇₅</div><div class=\"formula\"><span class=\"f-label\">眾數 m_o</span><span class=\"sym\">m_o=argmax f_X(x)</span>，使 pmf/pdf 最大之 x</div><div class=\"note\"><b>重點：</b>中位數、百分位數常常不唯一；多個眾數稱多峰分配。單峰對稱分配通常 μ=m=m_o。</div>"}, {"id": "4.4", "title": "動差與動差生成函數", "pg": "p.158–170", "body": "<p><span class=\"term\" data-term=\"Population Moment\">母體動差</span>分三體系：原動差 μ_r'=E(Xʳ)、主動差（中央動差）M_r=E[(X-μ)ʳ]、階乘動差 E[X(X-1)…(X-r+1)]。一階主動差 M₁=0。</p><div class=\"formula\"><span class=\"f-label\">mgf</span><span class=\"sym\">M_X(t)=E(e^{tX})=Σe^{tx}f_X(x)=∫e^{tx}f_X(x)dx</span>，且 <span class=\"sym\">M_X(0)=1</span></div><div class=\"formula\"><span class=\"f-label\">由 mgf 生動差</span><span class=\"sym\">E(Xʳ)=M_X^{(r)}(t)|_{t=0}</span></div><div class=\"formula\"><span class=\"f-label\">線性轉換</span><span class=\"sym\">Y=aX+b ⇒ M_Y(t)=e^{bt}M_X(at)</span></div><div class=\"note\"><b>重點：</b><span class=\"term\" data-term=\"Uniqueness Theorem of MGF\">mgf 唯一性定理</span>——兩隨機變數 mgf 相同，則機率函數相同；mgf 與機率函數一對一，是辨認分配的利器。</div><p><span class=\"term\" data-term=\"Skewness\">偏態係數</span> α₃=M₃/σ³、<span class=\"term\" data-term=\"Kurtosis\">峰態係數</span> α₄=M₄/σ⁴；α₄>3 高狹峰、=3 常態峰、<3 低闊峰。</p><div class=\"concept\">mgf 最大缺憾是可能不存在；此時改用<span class=\"term\" data-term=\"Characteristic Function\">特徵函數</span> φ_X(t)=E(e^{itX})，對任意分配都存在且具唯一性。對數 mgf 得累積量生成函數 K_X(t)=ln M_X(t)。<span class=\"term\" data-term=\"PGF\">機率生成函數</span> G_X(t)=E(t^X) 則以 t=1 代入產生階乘動差。</div>"}, {"id": "4.5", "title": "不等式", "pg": "p.171–178", "body": "<p>當不知機率分配形狀、僅掌握前幾階動差時，可用三大不等式估出機率的 bound。</p><div class=\"formula\"><span class=\"f-label\">馬可夫不等式</span>X 非負，∀a&gt;0：<span class=\"sym\">P(X≥a)≤E(X)/a</span></div><div class=\"formula\"><span class=\"f-label\">柴比雪夫不等式</span>∀k&gt;0：<span class=\"sym\">P(|X-μ|&lt;kσ)≥1-1/k²</span>，反向 P(|X-μ|≥kσ)≤1/k²</div><div class=\"formula\"><span class=\"f-label\">Jensen 不等式</span>凸函數 g：<span class=\"sym\">g(E(X))≤E[g(X)]</span>；凹函數反向</div><div class=\"note\"><b>重點：</b>Chebyshev 對任意分配成立，夾在 μ 左右各 k 倍 σ 內的機率至少 1-1/k²，常由 Markov 推得。單邊版本即 Cantelli 不等式。</div><div class=\"concept\">Jensen 不等式在不確定經濟學的意義：風險嫌惡者的效用函數為凹，故 u(E(X))≥E[u(X)]——「平均優於極端」，寧取穩定平均利得。紀念 <b class=\"proper\">Andrey Markov</b>、<b class=\"proper\">Pafnuty Chebyshev</b>。</div>"}], "5": [{"id": "5.1", "title": "二元隨機變數之機率函數", "pg": "p.179–192", "body": "<p>把第 4 章單變數概念擴至多變數。聯合函數描述 (X,Y) 同時取值的機率；<span class=\"term\" data-term=\"Marginal PMF\">邊際函數</span>由聯合函數消去一變數而得。</p><div class=\"formula\"><span class=\"f-label\">聯合 pmf</span><span class=\"sym\">f_XY(x,y)=P(X=x,Y=y)</span>；邊際 <span class=\"sym\">f_X(x)=Σ_y f_XY(x,y)</span></div><div class=\"formula\"><span class=\"f-label\">聯合 pdf</span><span class=\"sym\">f_XY(x,y)=∂²F_XY(x,y)/∂x∂y</span>，<span class=\"sym\">∫∫f_XY=1</span>，可大於 1</div><div class=\"formula\"><span class=\"f-label\">邊際 pdf</span><span class=\"sym\">f_X(x)=∫f_XY(x,y)dy</span>、<span class=\"sym\">f_Y(y)=∫f_XY(x,y)dx</span></div><div class=\"note\"><b>重點：</b>二元期望值 E[g(X,Y)]=ΣΣg(x,y)f_XY(x,y)=∫∫g(x,y)f_XY(x,y)dxdy（懶惰統計學家法則的多變數版）。</div><div class=\"concept\">當聯合值域在平面上「不為矩形」（x,y 範圍相互糾結），積分上下限須特別小心，先畫出支援域再定界。</div>"}, {"id": "5.2", "title": "條件機率函數與獨立隨機變數", "pg": "p.193–202", "body": "<p><span class=\"term\" data-term=\"Conditional PMF\">條件機率函數</span>即把原始定義中的邊際機率函數換成聯合：<span class=\"sym\">f_{X|Y}(x|y)=f_XY(x,y)/f_Y(y)</span>。</p><div class=\"note\"><b>重點：</b><span class=\"term\" data-term=\"Independence\">獨立</span> X⊥Y ⇔ <span class=\"sym\">f_XY(x,y)=f_X(x)f_Y(y)</span> 對所有 (x,y) 成立；獨立 ⇒ E(XY)=E(X)E(Y)，但逆不真。</div><div class=\"formula\"><span class=\"f-label\">獨立隨機變數函數之獨立</span>X⊥Y ⇒ g(X)⊥h(Y)；mgf 上 <span class=\"sym\">M_{X+Y}(t)=M_X(t)M_Y(t)</span></div><div class=\"warn\">「零相關」不等於「獨立」：Cov(X,Y)=0 不代表 X⊥Y，僅表示無線性關係。</div>"}, {"id": "5.3", "title": "條件期望值與條件變異數", "pg": "p.203–216", "body": "<p>條件期望值、條件變異數即在「樣本空間縮小」下計算，把邊際函數換成條件函數。</p><div class=\"formula\"><span class=\"f-label\">雙重期望值定理</span><span class=\"sym\">E(X)=E[E(X|Y)]</span>，又稱疊代期望值定理</div><div class=\"formula\"><span class=\"f-label\">變異數分解式</span><span class=\"sym\">Var(X)=E[Var(X|Y)]+Var[E(X|Y)]</span></div><div class=\"note\"><b>重點：</b>獨立 ⇒ E(X|Y=y)=E(X)、Var(X|Y=y)=Var(X)；但 E(X|Y)=E(X)（<span class=\"term\" data-term=\"Independence in Expectation\">在期望值上獨立</span>）不保證獨立。</div><p>有趣恆等式：<span class=\"sym\">E(X|X)=X</span>、<span class=\"sym\">Var(X|X)=0</span>。<span class=\"term\" data-term=\"Truncated Distribution\">截尾分配</span> f(x|a&lt;X≤b)=f(x)/P(a&lt;X≤b)，是自我條件的特例。</p>"}, {"id": "5.4", "title": "共變異數與相關係數", "pg": "p.217–235", "body": "<p><span class=\"term\" data-term=\"Covariance\">共變異數</span>衡量兩變數共變方向；<span class=\"term\" data-term=\"Correlation Coefficient\">相關係數</span>將其標準化。</p><div class=\"formula\"><span class=\"f-label\">共變異數</span><span class=\"sym\">Cov(X,Y)=E[(X-μ_X)(Y-μ_Y)]=E(XY)-E(X)E(Y)</span></div><div class=\"formula\"><span class=\"f-label\">相關係數</span><span class=\"sym\">ρ_XY=Cov(X,Y)/(σ_Xσ_Y)</span>，<span class=\"sym\">-1≤ρ_XY≤1</span></div><div class=\"formula\"><span class=\"f-label\">變數線性組合變異數</span><span class=\"sym\">Var(Σa_iX_i)=Σa_i²Var(X_i)+2ΣΣa_ia_jCov(X_i,X_j)</span></div><div class=\"note\"><b>重點：</b>Cov(X,X)=Var(X)；平移不變 Cov(X+c,Y+d)=Cov(X,Y)；獨立⇒Cov=0（逆不真）。ρ=±1 ⇔ Y=a+bX（機率 1）。</div><p><span class=\"term\" data-term=\"Linear Regression Line\">母體線性迴歸線</span>：<span class=\"sym\">E(Y|X=x)=β₀+β₁x</span>，斜率 <span class=\"sym\">β₁=ρ_XY σ_Y/σ_X</span>、截距 <span class=\"sym\">β₀=μ_Y-β₁μ_X</span>。ρ 的範圍由<span class=\"term\" data-term=\"Cauchy-Schwarz Inequality\">柯西—舒瓦茲不等式</span>保證。</p>"}, {"id": "5.5", "title": "隨機變數之變數轉換", "pg": "p.236–246", "body": "<p>轉換基本格式：已知 X 之機率函數、Y=g(X)，求 Y 之機率函數。抽樣分配本質即此。</p><div class=\"note\"><b>重點：</b>離散型用<b>列表法</b>逐個對應；連續型用 <b>cdf 法</b>（先 F_Y(y)=P(g(X)≤y) 再微分）或 <b>Jacobian 法</b>。</div><div class=\"formula\"><span class=\"f-label\">Jacobian 法（一轉一）</span><span class=\"sym\">f_Y(y)=f_X(g⁻¹(y))·|dx/dy|</span></div><div class=\"formula\"><span class=\"f-label\">二轉二 Jacobian</span><span class=\"sym\">f_UV(u,v)=f_XY(h₁,h₂)·|J|</span>，<span class=\"sym\">|J|=|∂(x,y)/∂(u,v)|</span></div><div class=\"concept\">經典結果：Z~N(0,1) 則 Z²~χ²(1)；獨立常態的平方和為卡方。聯合 mgf 法亦可經由唯一性辨認轉換後分配。</div>"}], "6": [{"id": "6.1", "title": "常用離散型機率分配模型", "pg": "p.248–277", "body": "<p>一個分配模型是一整個「分配族」：pmf/pdf 形式相同，僅母數數值不同。認識一分配要掌握：描述的現象、值域、母數意義、pmf、E(X)、Var(X)、mgf 與特殊性質。</p><div class=\"formula\"><span class=\"f-label\">伯努利分配 Ber(p)</span><span class=\"sym\">f(x)=p^x(1-p)^{1-x}, x=0,1</span>；<span class=\"sym\">E(X)=p</span>、<span class=\"sym\">Var(X)=p(1-p)=pq</span>、<span class=\"sym\">M(t)=pe^t+q</span></div><div class=\"formula\"><span class=\"f-label\">二項式分配 B(n,p)</span><span class=\"sym\">f(x)=C(n,x)p^x q^{n-x}</span>；<span class=\"sym\">E(X)=np</span>、<span class=\"sym\">Var(X)=npq</span>、<span class=\"sym\">M(t)=(pe^t+q)^n</span></div><div class=\"note\"><b>重點：</b>二項具<span class=\"term\" data-term=\"Reproductive Property\">再生性</span>：X~B(n₁,p)、Y~B(n₂,p) 獨立 ⇒ X+Y~B(n₁+n₂,p)；Ber(p)=B(1,p)。p=0.5 對稱，否則偏態。</div><div class=\"formula\"><span class=\"f-label\">幾何分配 Geo(p)</span><span class=\"sym\">f(x)=p q^{x-1}, x=1,2,…</span>；<span class=\"sym\">E(X)=1/p</span>、<span class=\"sym\">Var(X)=q/p²</span>、<span class=\"sym\">M(t)=pe^t/(1-qe^t)</span></div><div class=\"note\"><b>重點：</b>幾何分配具<span class=\"term\" data-term=\"Memoryless Property\">無記憶性</span> P(X&gt;a+b|X&gt;a)=P(X&gt;b)。</div><div class=\"formula\"><span class=\"f-label\">負二項分配 NB(r,p)</span><span class=\"sym\">f(x)=C(x-1,r-1)p^r q^{x-r}</span>；<span class=\"sym\">E(X)=r/p</span>、<span class=\"sym\">Var(X)=rq/p²</span>；Geo(p)=NB(1,p)</div><div class=\"formula\"><span class=\"f-label\">超幾何 Hyper(N,K,n)</span><span class=\"sym\">f(x)=C(K,x)C(N-K,n-x)/C(N,n)</span>；<span class=\"sym\">E(X)=nK/N</span>、<span class=\"sym\">Var(X)=n·(K/N)(1-K/N)·(N-n)/(N-1)</span></div><div class=\"note\"><b>重點：</b>抽出不放回。當 n/N&lt;5% 視為無限母體，以 B(n,p=K/N) 近似。</div><div class=\"formula\"><span class=\"f-label\">卜瓦松 Poi(λ)</span><span class=\"sym\">f(x)=e^{-λ}λ^x/x!</span>；<span class=\"sym\">E(X)=λ</span>、<span class=\"sym\">Var(X)=λ</span>、<span class=\"sym\">M(t)=e^{λ(e^t-1)}</span></div><div class=\"note\"><b>重點：</b>卜瓦松描述<span class=\"term\" data-term=\"Poisson Process\">卜瓦松過程</span>中偶發事件次數；具再生性 Poi(λ₁)+Poi(λ₂)=Poi(λ₁+λ₂)。n≥100 且 np≤10 時可用 Poi(np) 近似二項。</div><div class=\"formula\"><span class=\"f-label\">離散均勻（1..N）</span><span class=\"sym\">f(x)=1/N</span>；<span class=\"sym\">E(X)=(1+N)/2</span>、<span class=\"sym\">Var(X)=(N²-1)/12</span></div>"}, {"id": "6.2", "title": "常用連續型機率分配模型", "pg": "p.278–312", "body": "<div class=\"formula\"><span class=\"f-label\">均勻 U(a,b)</span><span class=\"sym\">f(x)=1/(b-a)</span>；<span class=\"sym\">E(X)=(a+b)/2</span>、<span class=\"sym\">Var(X)=(b-a)²/12</span>；U(0,1) 為基準</div><div class=\"note\"><b>重點：</b>萬流齊一：若 Y~U(0,1)，則 X=g⁻¹(Y) 之 cdf 即 g(x)（逆轉換抽樣）。</div><div class=\"formula\"><span class=\"f-label\">常態 N(μ,σ²)</span><span class=\"sym\">f(x)=1/(√(2π)σ)·e^{-(x-μ)²/(2σ²)}</span>；<span class=\"sym\">E(X)=μ</span>、<span class=\"sym\">Var(X)=σ²</span>、<span class=\"sym\">M(t)=e^{μt+σ²t²/2}</span></div><div class=\"note\"><b>重點：</b>以 μ 對稱、反曲點在 μ±σ；標準化 Z=(X-μ)/σ~N(0,1)。獨立正態之線性組合仍常態。常態峰 α₄=3、偏態 α₃=0。</div><div class=\"formula\"><span class=\"f-label\">伽馬 Gamma(α,β)</span><span class=\"sym\">f(x)=x^{α-1}e^{-x/β}/(β^αΓ(α))</span>；<span class=\"sym\">E(X)=αβ</span>、<span class=\"sym\">Var(X)=αβ²</span>、<span class=\"sym\">M(t)=(1-βt)^{-α}</span></div><div class=\"note\"><b>重點：</b>右偏、具再生性：Gamma(α₁,β)+Gamma(α₂,β)=Gamma(α₁+α₂,β)。α 為正整數時即<span class=\"term\" data-term=\"Erlang Distribution\">艾爾朗分配</span>。</div><div class=\"formula\"><span class=\"f-label\">指數 Exp(β)</span><span class=\"sym\">f(x)=(1/β)e^{-x/β}</span>、<span class=\"sym\">F(x)=1-e^{-x/β}</span>；<span class=\"sym\">E(X)=β</span>、<span class=\"sym\">Var(X)=β²</span>、<span class=\"sym\">M(t)=(1-βt)^{-1}</span></div><div class=\"note\"><b>重點：</b>Exp(β)=Gamma(α=1,β)，描述等待/壽命時間；具無記憶性 (X-a|X&gt;a)~Exp(β)。n 個獨立 Exp(β) 之和為 Gamma(n,β)。</div><div class=\"concept\">其他：<span class=\"term\" data-term=\"Beta Distribution\">貝它分配 Beta(a,b)</span> E(X)=a/(a+b)；<span class=\"term\" data-term=\"Cauchy Distribution\">柯西分配</span> E、Var、mgf 皆不存在；<span class=\"term\" data-term=\"Weibull Distribution\">韋伯分配</span> γ=1 為指數、γ=2 為瑞利；<span class=\"term\" data-term=\"Pareto Distribution\">柏瑞托分配</span>；<span class=\"term\" data-term=\"Lognormal Distribution\">對數常態分配</span>。</div><p><span class=\"term\" data-term=\"Reliability Function\">可靠度函數</span> R(t)=1-F(t)；<span class=\"term\" data-term=\"Hazard Function\">危險函數</span> h(t)=f(t)/R(t) 為瞬時故障率。</p>"}, {"id": "6.3", "title": "常用多變數機率分配模型", "pg": "p.313–322", "body": "<div class=\"formula\"><span class=\"f-label\">三項式 Tri(n,p₁,p₂)</span><span class=\"sym\">f(x,y)=n!/(x!y!(n-x-y)!)·p₁^x p₂^y(1-p₁-p₂)^{n-x-y}</span></div><p><span class=\"term\" data-term=\"Bivariate Hypergeometric\">雙變數超幾何分配</span>：有限母體分三類、抽出不放回抽 n 個，邊際為超幾何、條件亦為超幾何。</p><div class=\"formula\"><span class=\"f-label\">二元常態 BN(μ_X,μ_Y,σ_X²,σ_Y²,ρ)</span>五母數；邊際為常態、條件分配亦為常態</div><div class=\"note\"><b>重點：</b>二元常態中 ρ=0 ⇔ 獨立（雙向）；任意線性組合仍為常態，可擴至多變常態 MN(μ,Σ)。</div>"}], "7": [{"id": "7.1", "title": "抽樣調查之基本概念與抽樣誤差", "pg": "p.323–328", "body": "<p>母體資料轉換為母體分配；<span class=\"term\" data-term=\"Random Sample\">隨機樣本</span> X₁,…,X_n 即 n 個<span class=\"term\" data-term=\"iid\">獨立同分配(iid)</span>於母體分配之隨機變數。<span class=\"term\" data-term=\"Sampling Distribution\">抽樣分配</span>定義為樣本統計量之機率分配。</p><div class=\"note\"><b>重點：</b>抽樣分配問題格式：已知 X₁,…,X_n~母體分配，求統計量（如 X̄）之機率分配，本質是第 5 章的隨機變數轉換。</div><p><span class=\"term\" data-term=\"Sampling Error\">抽樣誤差</span>是樣本代表性不足造成，隨機抽樣仍不可避免但可衡量；<span class=\"term\" data-term=\"Nonsampling Error\">非抽樣誤差</span>來自測量、抄錄等失誤。普查成本高、抽樣調查成本低且時效佳。</p>"}, {"id": "7.2", "title": "抽樣方法", "pg": "p.329–332", "body": "<p><span class=\"term\" data-term=\"Probability Sampling\">隨機（機率）抽樣</span>每個體以已知機率入樣，可推導抽樣分配；<span class=\"term\" data-term=\"Nonprobability Sampling\">非隨機抽樣</span>主觀決定，無法。</p><ol class=\"nlist\"><li><span class=\"term\" data-term=\"Simple Random Sampling\">簡單隨機抽樣 SRS</span>：每個體機率均等。</li><li>分層抽樣：層內同質、層間異質；比例配置 n_i=nN_i/N，另有尼曼配置。</li><li>系統抽樣、<span class=\"term\" data-term=\"Cluster Sampling\">群集抽樣</span>（一階段/兩階段）。</li><li>非隨機：便利抽樣、雪球抽樣、配額抽樣。</li></ol>"}, {"id": "7.3", "title": "四大常用抽樣分配", "pg": "p.333–341", "body": "<div class=\"formula\"><span class=\"f-label\">標準常態</span>Z~N(0,1)，φ(z)=1/√(2π)·e^{-z²/2}</div><div class=\"formula\"><span class=\"f-label\">卡方 χ²(v)</span>即 Gamma(α=v/2,β=2)；<span class=\"sym\">E(X)=v</span>、<span class=\"sym\">Var(X)=2v</span>；右偏</div><div class=\"formula\"><span class=\"f-label\">Student's t</span>T=Z/√(χ²_v/v)~t(v)；對稱、<span class=\"sym\">E(T)=0</span>、<span class=\"sym\">Var(T)=v/(v-2)</span>，v→∞ 趨 N(0,1)</div><div class=\"formula\"><span class=\"f-label\">F 分配</span>F=(χ²_v₁/v₁)/(χ²_v₂/v₂)~F(v₁,v₂)，右偏</div><div class=\"note\"><b>重點：</b>彼此關係：Z²~χ²(1)；T~t(v) ⇒ T²~F(1,v)；F(v₁,v₂) 與 F(v₂,v₁) 互倒；F(v₁,∞)·v₁~χ²(v₁)。</div><div class=\"concept\">卡方為 <b class=\"proper\">Karl Pearson</b> 提出；t 分配為 <b class=\"proper\">William Gosset</b> 1908 年以 Student 筆名發表；F 分配為 <b class=\"proper\">R. A. Fisher</b> 建構 ANOVA 時創造、<b class=\"proper\">Snedecor</b> 推廣。</div>"}, {"id": "7.4", "title": "常態母體下之抽樣分配", "pg": "p.342–351", "body": "<p>X₁,…,X_n iid~N(μ,σ²)，可得漂亮結果。</p><div class=\"formula\"><span class=\"f-label\">σ² 已知</span><span class=\"sym\">X̄~N(μ,σ²/n)</span>、<span class=\"sym\">(X̄-μ)/(σ/√n)~N(0,1)</span></div><div class=\"formula\"><span class=\"f-label\">σ² 未知</span><span class=\"sym\">(n-1)S²/σ²~χ²(n-1)</span>、<span class=\"sym\">(X̄-μ)/(S/√n)~t(n-1)</span></div><div class=\"note\"><b>重點：</b>常態母體下 X̄ 與 S² 相互獨立（Basu/Cochran 定理）。兩獨立常態母體：(S₁²/σ₁²)/(S₂²/σ₂²)~F(n₁-1,n₂-1)。</div>"}, {"id": "7.5", "title": "大樣本之統計量性質", "pg": "p.352–359", "body": "<div class=\"formula\"><span class=\"f-label\">大數法則 LLN</span>n→∞ 時 <span class=\"sym\">X̄ →p μ</span>（機率收斂）；伯努利版本 p̂→p</div><div class=\"formula\"><span class=\"f-label\">中央極限定理 CLT</span><span class=\"sym\">√n(X̄-μ)/σ ~· N(0,1)</span>（n 夠大）</div><div class=\"formula\"><span class=\"f-label\">樣本比例</span><span class=\"sym\">p̂~· N(p, p(1-p)/n)</span>；Bernoulli 母體大樣本條件 np≥5 且 nq≥5</div><div class=\"note\"><b>重點：</b>CLT 對任意母體分配成立、要求大樣本；與定理 7.7（常態母體、任意 n）結論相同但前提不同。X̄~·N(μ,σ²/n)。</div><div class=\"fig\"><svg viewBox=\"0 0 720 140\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"10\" fill=\"#2b251d\"><path d=\"M30,110 Q60,40 90,110 Q110,70 130,110 Q145,85 160,110\" fill=\"none\" stroke=\"#b5542e\"/><text x=\"95\" y=\"130\" text-anchor=\"middle\">母體（任意形狀）</text><line x1=\"180\" y1=\"80\" x2=\"240\" y2=\"80\" stroke=\"#6f6555\" marker-end=\"url(#ar)\"/><rect x=\"250\" y=\"55\" width=\"90\" height=\"50\" rx=\"7\" fill=\"#fbeae2\" stroke=\"#b5542e\"/><text x=\"295\" y=\"84\" text-anchor=\"middle\">抽樣計算 x̄</text><line x1=\"360\" y1=\"80\" x2=\"420\" y2=\"80\" stroke=\"#6f6555\"/><path d=\"M430,110 Q520,110 525,40 Q530,110 620,110\" fill=\"#cfe0d2\" stroke=\"#3a7d44\"/><text x=\"525\" y=\"130\" text-anchor=\"middle\">x̄ 的抽樣分配（趨常態）</text></svg><div class=\"figcap\">圖 9：CLT——無論母體形狀，樣本平均數 x̄ 的分配趨近常態</div></div>"}, {"id": "7.6", "title": "順序統計量", "pg": "p.360–366", "body": "<p>將樣本排序得 X₍₁₎≤…≤X₍ₙ₎，即<span class=\"term\" data-term=\"Order Statistics\">順序統計量</span>；Y₁=min、Y_n=max。</p><div class=\"formula\"><span class=\"f-label\">極值 cdf/pdf</span><span class=\"sym\">f_{Y₁}(y)=n[1-F(y)]^{n-1}f(y)</span>、<span class=\"sym\">f_{Y_n}(y)=n[F(y)]^{n-1}f(y)</span></div><div class=\"formula\"><span class=\"f-label\">第 i 順序統計量</span><span class=\"sym\">f_{Y_i}(y)=n!/[(i-1)!(n-i)!]·F(y)^{i-1}[1-F(y)]^{n-i}f(y)</span></div><div class=\"note\"><b>重點：</b>U(0,1) 下 X₍ᵢ₎~Beta(i,n+1-i)；串聯系統壽命=min、並聯=max。樣本中位數（n 奇數）即 X_{((n+1)/2)}。</div>"}], "8": [{"id": "8.1", "title": "求導點估計量：估計量、估計值與概似函數", "pg": "p.350–351", "body": "<p><span class=\"term\" data-term=\"Estimator\">估計量</span> θ̂ 為隨機樣本 X₁,…,Xₙ 的函數組合，故為<b class=\"concept\">隨機變數</b>；代入一組實際樣本數值得觀察值，稱為<span class=\"term\" data-term=\"Estimate\">估計值</span>。本章兩大課題：(1) 如何求導母數之點估計量；(2) 如何評估其表現。</p><div class=\"note\"><b>重點：</b>求導估計量四大方法為 最大概似法、動差法、最小平方法、貝氏估計法；評估準則有不偏性、有效性、一致性、充份性。</div><p><span class=\"term\" data-term=\"LikelihoodFunction\">概似函數</span> L(θ)=∏ᵢ f(xᵢ;θ)，解讀為「在不同 θ 下抽到這組觀察樣本的可能性」。</p>"}, {"id": "8.1.1", "title": "最大概似法（MLE）與其不動性", "pg": "p.351–358", "body": "<p><span class=\"term\" data-term=\"MLE\">最大概似估計量</span> θ̂_MLE 使 L(θ) 最大；因微分對數較易，取 <span class=\"term\" data-term=\"LogLikelihood\">對數概似</span> ℓ(θ)=ln L(θ)，解 f.o.c. ∂ℓ/∂θ=0，再檢查 s.o.c.<div class=\"formula\"><span class=\"f-label\">MLE 步驟</span>① L(θ)=∏f(xᵢ;θ)　② ℓ=ln L　③ ∂ℓ/∂θ=0 求 θ*　④ ∂²ℓ/∂θ²<0</div></p><div class=\"warn\"><b>注意：</b>常態母體 σ² 之 MLE 為 (1/n)Σ(Xᵢ−X̄)²，本身低估（偏誤）；自由度修正為 S² 後才不偏。若 μ 已知，則 (1/n)Σ(Xᵢ−μ)² 即不偏，不必修正。</div><p>均勻 U(0,θ) 之 MLE 為 <b class=\"sym\">X₍ₙ₎=max{Xᵢ}</b>；離散母數（如超幾何之 N）不可微分，以兩面逼近法求。由 <span class=\"term\" data-term=\"InvarianceMLE\">MLE 不動性</span>，g(θ) 之 MLE=g(θ̂_MLE)。</p>"}, {"id": "8.1.2", "title": "動差法（MME）與其他估計方法", "pg": "p.359–363", "body": "<p><span class=\"term\" data-term=\"MME\">動差法估計量</span>採<span class=\"term\" data-term=\"MethodofAnalogy\">類比法</span>：令第 r 階母體原動差 μᵣ=E(Xʳ) 等於第 r 階樣本原動差 mᵣ=(1/n)ΣXᵢʳ 求解。單母數令 μ₁=m₁（即 E(X)=X̄）；兩母數再聯立 μ₂=m₂。</p><div class=\"note\"><b>重點：</b>動差法的理論基礎為大數法則（LLN），n→∞ 時樣本動差收斂至母體動差，故 MME 必具一致性。許多分配（Bernoulli、Poisson、常態）之 MME 與 MLE 相同，但 U(0,θ) 之 MME=2X̄ 而 MLE=X₍ₙ₎。</div><p><span class=\"term\" data-term=\"LSE\">最小平方法</span>找使 SSE=Σ(Xᵢ−θ̂)² 最小者，用於線性模型；<span class=\"term\" data-term=\"BayesianEstimator\">貝氏估計量</span> θ̂=E(θ|X)，結合事前分配與樣本經貝氏定理得事後分配。</p>"}, {"id": "8.2.1", "title": "不偏性與偏誤", "pg": "p.364–370", "body": "<p>若 <b class=\"sym\">E(θ̂)=θ</b> 則 θ̂ 為<span class=\"term\" data-term=\"Unbiasedness\">不偏估計量</span>，直覺為「平均而言估計正確」。<span class=\"term\" data-term=\"Bias\">偏誤</span> Bias(θ̂)=E(θ̂)−θ；>0 高估、<0 低估。</p><div class=\"warn\"><b>陷阱：</b>不偏性在「非線性轉換」下不具不動性——θ̂ 不偏，1/θ̂、√θ̂ 未必不偏；故 S² 為 σ² 不偏，S=√S² 卻是 σ 之偏誤估計量。</div><div class=\"formula\"><span class=\"f-label\">X̄ 與 S² 之不偏性（任意母體）</span>E(X̄)=μ；E(S²)=σ²，S²=1/(n−1)Σ(Xᵢ−X̄)²</div><p><span class=\"term\" data-term=\"ConsistencyMeaning\">漸近不偏性</span>指 lim E(θ̂)=θ；不偏必漸近不偏，逆不真。MLE 在正規條件下具漸近不偏性。</p>"}, {"id": "8.2.2", "title": "準確度、精確度與標準誤", "pg": "p.370–372", "body": "<p>以打靶類比：<span class=\"term\" data-term=\"Accuracy\">準確度</span>（效度）是平均彈著點與靶心距離，以 |Bias| 衡量；<span class=\"term\" data-term=\"Precision\">精確度</span>（信度）是彈著點彼此分散度，以 Var 或 <span class=\"term\" data-term=\"StandardError\">標準誤</span>衡量。</p><div class=\"note\"><b>重點：</b>不偏估計量即「準確度完美」者。樣本數 n 增加通常提升精確度：Var(X̄)=σ²/n、SE(X̄)=σ/√n 皆隨 n 遞減。</div>"}, {"id": "8.2.3", "title": "有效性：MSE、相對有效性、UMVUE 與 BLUE", "pg": "p.372–381", "body": "<p><span class=\"term\" data-term=\"MSE\">平均平方誤差</span>綜合準確度與精確度：<div class=\"formula\"><span class=\"f-label\">MSE 分解</span>MSE(θ̂)=Var(θ̂)+[Bias(θ̂)]²</div> 兩估計量比較時，MSE 較小者為<span class=\"term\" data-term=\"RelativeEfficiency\">相對有效</span>。</p><p>數學上不存在「對任意母數值 MSE 永遠最小」的絕對有效估計量，故限縮範圍找最佳者：在所有不偏估計量中變異數最小者為 <span class=\"term\" data-term=\"UMVUE\">UMVUE</span>（最佳不偏 BUE）；在所有線性不偏估計量中變異數最小者為 <span class=\"term\" data-term=\"BLUE\">BLUE</span>。</p><div class=\"formula\"><span class=\"f-label\">Cramér–Rao 下界</span>Var(θ̂)≥1/[n·I₁(θ)]，I₁(θ) 為<span class=\"term\" data-term=\"FisherInformation\">費雪訊息</span>；若某不偏估計量 Var 恰等於 CRLB，即為 UMVUE。</div><div class=\"warn\"><b>注意：</b>UMVUE 需知母體分配形式；BLUE 不需要。有趣的是 σ² 之 MLE 雖偏誤，其 MSE 卻小於自由度修正的 S²——追求不偏性的代價是損失一點有效性。</div>"}, {"id": "8.2.5", "title": "一致性", "pg": "p.382–389", "body": "<p><span class=\"term\" data-term=\"Consistency\">一致性</span>指 n→∞ 時 <b class=\"sym\">plim θ̂=θ</b>，即對任意 ε>0，P(|θ̂−θ|≥ε)→1 趨近 0，為機率收斂概念、大樣本性質。</p><div class=\"formula\"><span class=\"f-label\">MSE 一致性（充分非必要）</span>lim MSE(θ̂)=0 ⇒ θ̂ 為一致性估計量；含 lim E(θ̂)=θ 且 lim Var(θ̂)=0。</div><div class=\"note\"><b>重點：</b>弱大數法則保證 X̄ 為 μ 之一致性估計量；MLE、MME 在正規條件下皆一致。一致性具不動性（g(θ̂) 一致估計 g(θ)），且不偏性與一致性互不隸屬。</div>"}, {"id": "8.2.6", "title": "充份性與分解定理", "pg": "p.389–393", "body": "<p><span class=\"term\" data-term=\"SufficientStatistic\">充份統計量</span> T 指：給定 T 後，樣本之條件分配與母數 θ 無關——T 已保有樣本中關於 θ 的全部攸關資訊，不必再回頭看原始樣本。<span class=\"term\" data-term=\"SufficiencyPrinciple\">充份性原則</span>由 <b class=\"proper\">Ronald Fisher</b> 揭櫫。</p><div class=\"formula\"><span class=\"f-label\">分解定理 Factorization Theorem</span>f(x₁,…,xₙ;θ)=g(T;θ)·h(x₁,…,xₙ) 為 T 充份之充要條件。</div><div class=\"warn\"><b>注意：</b>MLE 必為充份統計量之某函數（通常滿足充份性），MME 則未必。充份統計量不唯一，一對一函數轉換仍充份。</div>"}], "9": [{"id": "9.1", "title": "區間估計概論：樞紐量與信賴區間", "pg": "p.395–397", "body": "<p><span class=\"term\" data-term=\"ConfidenceInterval\">信賴區間</span>概念由 <b class=\"proper\">Jerzy Neyman</b> 於 1934 年創建。隨機區間 [L,U] 滿足 <b class=\"sym\">P(L<θ<U)=1−α</b>，(1−α) 為<span class=\"term\" data-term=\"ConfidenceLevel\">信心水準</span>，L、U 為信賴下、上界。</p><div class=\"note\"><b>重點：</b>寬度越窄越精準、信心水準越大越好，但二者為 trade-off，無法同時達成。</div><div class=\"formula\"><span class=\"f-label\">建構 C.I. 步驟（樞紐量法）</span>① 求點估計量 θ̂　② 求樞紐量 Q(θ̂;θ) 及其分配　③ 1−α=P(q_L<Q<q_U)　④ 反解得 [L,U]</div><p><span class=\"term\" data-term=\"PivotalQuantity\">樞紐量</span> Q(θ̂;θ) 只能含待估母數一個未知數，其分配通常為 N(0,1)、χ²、t 或 F 四大抽樣分配之一。</p><div class=\"fig\"><svg viewBox=\"0 0 720 160\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"10\" fill=\"#2b251d\"><line x1=\"40\" y1=\"20\" x2=\"40\" y2=\"150\" stroke=\"#3a7d44\" stroke-width=\"2\"/><text x=\"40\" y=\"14\" text-anchor=\"middle\" fill=\"#3a7d44\">母體 μ</text><line x1=\"60\" y1=\"30\" x2=\"60\" y2=\"30\" stroke=\"#2c6e9e\"/><circle cx=\"85\" cy=\"30\" r=\"2\" fill=\"#2c6e9e\"/><line x1=\"60\" y1=\"44\" x2=\"100\" y2=\"44\" stroke=\"#2c6e9e\"/><circle cx=\"103\" cy=\"44\" r=\"2\" fill=\"#2c6e9e\"/><line x1=\"60\" y1=\"58\" x2=\"140\" y2=\"58\" stroke=\"#2c6e9e\"/><circle cx=\"121\" cy=\"58\" r=\"2\" fill=\"#2c6e9e\"/><line x1=\"60\" y1=\"72\" x2=\"60\" y2=\"72\" stroke=\"#2c6e9e\"/><circle cx=\"139\" cy=\"72\" r=\"2\" fill=\"#2c6e9e\"/><line x1=\"60\" y1=\"86\" x2=\"100\" y2=\"86\" stroke=\"#b5542e\"/><circle cx=\"157\" cy=\"86\" r=\"2\" fill=\"#b5542e\"/><line x1=\"60\" y1=\"100\" x2=\"140\" y2=\"100\" stroke=\"#2c6e9e\"/><circle cx=\"175\" cy=\"100\" r=\"2\" fill=\"#2c6e9e\"/><line x1=\"60\" y1=\"114\" x2=\"60\" y2=\"114\" stroke=\"#2c6e9e\"/><circle cx=\"193\" cy=\"114\" r=\"2\" fill=\"#2c6e9e\"/><line x1=\"60\" y1=\"128\" x2=\"100\" y2=\"128\" stroke=\"#2c6e9e\"/><circle cx=\"211\" cy=\"128\" r=\"2\" fill=\"#2c6e9e\"/><line x1=\"60\" y1=\"142\" x2=\"140\" y2=\"142\" stroke=\"#2c6e9e\"/><circle cx=\"229\" cy=\"142\" r=\"2\" fill=\"#2c6e9e\"/><text x=\"360\" y=\"150\" text-anchor=\"middle\">重複抽樣 100 次 → 約 95 條信賴區間蓋住 μ（橘為未蓋住）</text></svg><div class=\"figcap\">圖 10：信賴區間的長頻率解釋：多數區間涵蓋真正的 μ</div></div>"}, {"id": "9.2", "title": "單一母體之區間估計", "pg": "p.397–403", "body": "<p>μ 之 C.I. 分三 Case：<b class=\"sym\">常態 σ² 已知</b>用 Z；<b class=\"sym\">常態 σ² 未知</b>用 t(n−1)；<b class=\"sym\">非常態/未知分配</b>需大樣本，由 CLT 用 Z。通式為 點估計量 ± 尾點 × SE。</p><div class=\"formula\"><span class=\"f-label\">μ 之 C.I.（Case II：σ² 未知）</span>X̄ ± t_{α/2}(n−1)·S/√n</div><p>σ² 之 C.I.（常態母體）樞紐量 <b class=\"sym\">(n−1)S²/σ²~χ²(n−1)</b>；開根號即得 σ 之 C.I.。母體比例 p 之 C.I. 需大樣本：<b class=\"sym\">p̂±z_{α/2}√(p̂(1−p̂)/n)</b>。</p>"}, {"id": "9.3", "title": "信賴區間的特殊課題", "pg": "p.404–412", "body": "<p><span class=\"term\" data-term=\"FinitePopulationCorrection\">有限母體校正</span>：抽出不放回且 n/N≥5% 時，SE 乘 √[(N−n)/(N−1)]；n/N<5% 可省略。<span class=\"term\" data-term=\"OneSidedCI\">單邊信賴區間</span> [L,∞) 或 (−∞,U] 用於單尾。</p><div class=\"note\"><b>重點：</b>影響 C.I. 寬度三因素——信心水準(1−α)↑則 E↑、樣本數 n↑則 E↓、母體標準差 σ↑則 E↑。<span class=\"term\" data-term=\"MarginOfError\">誤差界限</span> E=z_{α/2}·SE(X̄)，C.I. 寬度=2E。</div><div class=\"warn\"><b>正確解讀：</b>母數為常數，已實現的區間 [50.2,54.3] 不能說「μ 落在其中的機率為 0.95」；應說「我們有 95% 信心，此區間是那套方法下做對的 95% 區間之一」。</div><p><span class=\"term\" data-term=\"PredictionInterval\">預測區間 P.I.</span> 估計未來觀察值 X_{n+1}，公式比 μ 之 C.I. 多一個「1+」：X̄±t·S√(1+1/n)。</p>"}, {"id": "9.4", "title": "兩母體之區間估計", "pg": "p.413–425", "body": "<p>兩獨立母體 μ₁−μ₂：σ² 已知用 Z；未知且相等（<span class=\"term\" data-term=\"PooledVariance\">同質變異數</span>）用 <b class=\"sym\">t(n₁+n₂−2)</b> 配 <span class=\"term\" data-term=\"PooledVariance\">混合變異數 S_p²</span>；未知且不相等用 <span class=\"term\" data-term=\"Welchdf\">Welch t</span>；大樣本用 Z。</p><p><span class=\"term\" data-term=\"PairedSample\">成對樣本</span>（相依母體）先取差 Dᵢ=Xᵢ−Yᵢ，再視為單一母體：D̄±t·S_D/√m。兩獨立母體變異數比 σ₁²/σ₂² 用 <b class=\"sym\">F</b> 分配，需查 F 尾點倒數關係 F_{1−α/2}(ν₁,ν₂)=1/F_{α/2}(ν₂,ν₁)。比例差 p₁−p₂ 大樣本用 Z。</p>"}, {"id": "9.5", "title": "樣本數問題", "pg": "p.426–429", "body": "<p><span class=\"term\" data-term=\"SampleSizeDetermination\">樣本數決定</span>：在給定信心水準與誤差界限 E 下反解 n，計算後無條件進位。<div class=\"formula\"><span class=\"f-label\">單一母體均值</span>n=(z_{α/2}σ/E)²；單一比例 n=(z_{α/2})²p(1−p)/E²</div></p><div class=\"note\"><b>重點：</b>σ 未知時以過去經驗或 (R/4)² 估算；p 無先驗時取 p=0.5（使 p(1−p) 最大）最保守。95% 信心、E=±3% 時 n≈1068。兩母體需設 n₁=n₂ 才有唯一解。</div>"}], "10": [{"id": "10.1", "title": "假說檢定概論", "pg": "p.431–436", "body": "<p><span class=\"term\" data-term=\"HypothesisTesting\">假說檢定</span>依樣本證據判定統計假說真偽。<span class=\"term\" data-term=\"NullHypothesis\">虛無假說 H₀</span>先推定為真、應含等號、代表現況；<span class=\"term\" data-term=\"AlternativeHypothesis\">對立假說 Hₐ</span>負舉證責任、代表新狀態。犯錯成本高者設為型一誤差。</p><div class=\"note\"><b>哲學基礎：</b>「大膽假設，小心求證」。T₀∉RR 只能說「不拒絕 H₀」，不能說「接受 H₀」。拒絕 H₀ 稱統計上顯著。</div><div class=\"warn\"><b>三種設定：</b>雙尾 Hₐ:θ≠θ₀；右尾 Hₐ:θ>θ₀；左尾 Hₐ:θ<θ₀。指定單一數值為簡單假說，指定範圍為複合假說。</div>"}, {"id": "10.1.2", "title": "檢定錯誤、顯著水準與檢定力", "pg": "p.434–436", "body": "<p><span class=\"term\" data-term=\"TypeIError\">型一誤差</span>：H₀ 真卻誤拒，機率 α（<span class=\"term\" data-term=\"SignificanceLevel\">顯著水準</span>）；<span class=\"term\" data-term=\"TypeIIError\">型二誤差</span>：Hₐ 真卻誤不拒，機率 β。α+β≠1。</p><div class=\"formula\"><span class=\"f-label\">決策表</span>H₀ 真：拒絕=型一(α)、不拒=正確(1−α)；Hₐ 真：拒絕=檢定力(<span class=\"term\" data-term=\"Power\">1−β</span>)、不拒=型二(β)</div><div class=\"note\"><b>兩難：</b>n 固定時移動臨界值 k，α 與 β 互為消長，無法同時下降；唯一同時降低二者之道是增加樣本數 n。給定 α 可由 <span class=\"term\" data-term=\"NeymanPearsonLemma\">尼曼—皮爾森引理</span>找最強力檢定。</div><p><span class=\"term\" data-term=\"TestStatistic\">檢定統計量</span>在 H₀ 為真下的抽樣分配決定<span class=\"term\" data-term=\"RejectionRegion\">拒絕域 RR</span>；RR 與接受域交界為<span class=\"term\" data-term=\"CriticalValue\">臨界值</span> k。<span class=\"term\" data-term=\"ProducerRisk\">允收抽樣</span>中 α 為生產者風險、β 為消費者風險。</p><div class=\"fig\"><svg viewBox=\"0 0 720 150\" xmlns=\"http://www.w3.org/2000/svg\" font-size=\"12\" fill=\"#2b251d\"><rect x=\"40\" y=\"20\" width=\"300\" height=\"50\" rx=\"8\" fill=\"#cfe0d2\" stroke=\"#3a7d44\"/><text x=\"190\" y=\"50\" text-anchor=\"middle\">H₀ 為真 → 不拒絕：正確</text><rect x=\"380\" y=\"20\" width=\"300\" height=\"50\" rx=\"8\" fill=\"#f3d9c8\" stroke=\"#b5542e\"/><text x=\"530\" y=\"45\" text-anchor=\"middle\">H₀ 為真 → 拒絕：型一誤差 α</text><rect x=\"40\" y=\"85\" width=\"300\" height=\"50\" rx=\"8\" fill=\"#fbeae2\" stroke=\"#b5542e\"/><text x=\"190\" y=\"110\" text-anchor=\"middle\">H₀ 為假 → 不拒絕：型二誤差 β</text><rect x=\"380\" y=\"85\" width=\"300\" height=\"50\" rx=\"8\" fill=\"#cfe0d2\" stroke=\"#3a7d44\"/><text x=\"530\" y=\"110\" text-anchor=\"middle\">H₀ 為假 → 拒絕：檢定力 1−β</text></svg><div class=\"figcap\">圖 11：假說檢定的四種判決：正確／型一 α／型二 β／檢定力 1−β</div></div>"}, {"id": "10.2", "title": "單一母體之假說檢定（完整步驟）", "pg": "p.437–444", "body": "<div class=\"note\"><b>六步驟（以 μ 為例）：</b><ol class=\"nlist\"><li>建立假說 H₀:μ=μ₀ vs Hₐ:μ≠μ₀</li><li>決定顯著水準 α</li><li>找檢定統計量及其在 H₀ 為真下的抽樣分配：Z=(X̄−μ₀)/(σ/√n)~N(0,1) 或 T=(X̄−μ₀)/(S/√n)~t(n−1)</li><li>找拒絕域 RR：雙尾 RR={|Z|≥z_{α/2}}</li><li>計算觀察值 Z₀</li><li><span class=\"term\" data-term=\"DecisionRule\">決策法則</span>：Z₀∈RR 則拒絕 H₀，否則不拒絕</li></ol></div><p>σ² 未知用 t(n−1)；非常態大樣本用 Z(CLT)。σ² 之檢定用 <b class=\"sym\">χ²</b> 統計量 (n−1)S²/σ₀²~χ²(n−1)；比例 p 大樣本用 Z=(p̂−p₀)/√(p₀(1−p₀)/n)。</p><div class=\"warn\"><b>注意：</b>檢定比例時分母用 H₀ 下的 p₀（SE=√p₀(1−p₀)/n），與 C.I. 中用 p̂ 不同。小樣本（np₀<5）改用二項分配算 p-value（符號檢定）。</div>"}, {"id": "10.3", "title": "假說檢定的三種等價方法", "pg": "p.445–447", "body": "<p>三種方法結論必一致：(1) <b class=\"sym\">臨界值法</b>（六步驟）；(2) <span class=\"term\" data-term=\"Duality\">信賴區間法</span>；(3) <span class=\"term\" data-term=\"PValue\">p 值法</span>。</p><div class=\"note\"><b>C.I. 法決策：</b>求 θ 之 (1−α)100% C.I.；若虛無值 θ₀∉[L,U] 則拒絕 H₀，否則不拒絕。兩母體比對「0 是否落在差之 C.I.」。</div><div class=\"formula\"><span class=\"f-label\">p 值法</span>p-value=H₀ 為真下檢定統計量取到 T₀ 或更極端值的尾機率（雙尾×2）；若 p-value≤α 則拒絕 H₀。p 值愈小證據愈強。</div>"}, {"id": "10.4", "title": "兩母體之假說檢定", "pg": "p.448–459", "body": "<p>兩獨立母體 μ₁−μ₂：σ² 已知用 Z；未知且相等（同質）用 t(n₁+n₂−2) 配混合變異數；不相等用 Welch t；大樣本用 Z。<span class=\"term\" data-term=\"PairedSample\">成對樣本</span>用 D̄±、T=(D̄−c)/(S_D/√m)~t(m−1)。</p><p>兩母體變異數比用 <b class=\"sym\">F</b> 檢定 F=S₁²/S₂²~F(n₁−1,n₂−1)，建議以大者除以小者。比例差 p₁−p₂：c≠0 用 Z；c=0 時採混合比例 p̂=(ΣX+ΣY)/(n₁+n₂) 計算 SE。</p>"}, {"id": "10.5", "title": "進階問題：α/β、檢定力、樣本數與曲線", "pg": "p.460–466", "body": "<p>給定 Hₐ 下的特定母數值可算 β 與檢定力；增加 n 可使 α、β 同時下降。假說檢定樣本數公式由「臨界值等式」解得，雙尾 n=(z_{α/2}+z_β)²σ²/(μ₀−μₐ)²，無條件進位。</p><div class=\"formula\"><span class=\"f-label\">檢定力/OC 函數</span><span class=\"term\" data-term=\"PowerFunction\">PF(θ)=P(拒絕 H₀|θ)</span>；<span class=\"term\" data-term=\"OCFunction\">OCF(θ)=P(不拒絕 H₀|θ)</span>，二者互為補數；繪成檢定力曲線 PC 與作業特性曲線 OCC。</div>"}], "11": [{"id": "11.1", "title": "變異數分析概論與實驗設計", "pg": "p.467–470", "body": "<p><span class=\"term\" data-term=\"ANOVA\">變異數分析 ANOVA</span>由 <b class=\"proper\">Ronald Fisher</b> 建立，檢定 k 個獨立母體平均數是否全相等：H₀:μ₁=…=μₖ vs Hₐ:不全相等。若拆成 C(k,2) 次兩兩 t 檢定，會使整體型一誤差率膨脹 α_eer=1−(1−α_pc)^C。</p><p><span class=\"term\" data-term=\"ExperimentalDesign\">實驗設計 DOE</span>：<span class=\"term\" data-term=\"Factor\">因子</span>為類別型自變數，其類別稱<span class=\"concept\">水準</span>，水準組合稱<span class=\"term\" data-term=\"Treatment\">處理</span>。三原則：<b class=\"sym\">重複、隨機化、區集化</b>——隨機化處理未知不可控干擾，區集化處理已知可控干擾。</p>"}, {"id": "11.2", "title": "一因子 ANOVA 完全隨機化設計（CRD）", "pg": "p.471–483", "body": "<p><span class=\"term\" data-term=\"CRD\">完全隨機化設計</span>模型 Yᵢⱼ=μ+αᵢ+εᵢⱼ，εᵢⱼ~N(0,σ²)；假設為誤差平均 0、同質變異數、獨立性、常態性。<div class=\"formula\"><span class=\"f-label\">平方和分解</span><span class=\"term\" data-term=\"SSTO\">SSTO</span>=<span class=\"term\" data-term=\"SSTR\">SSTR</span>+<span class=\"term\" data-term=\"SSE\">SSE</span>；MSTR=SSTR/(k−1)，MSE=SSE/(n−k)。</div></p><div class=\"formula\"><span class=\"f-label\">F 檢定</span><span class=\"term\" data-term=\"Ftest\">F=MSTR/MSE~F(k−1,n−k)</span>，RR={F≥F_α}，一律右尾。E(MSE)=σ²；E(MSTR)≥σ²，H₀ 真時等於 σ²。</div><div class=\"note\"><b>重點：</b>k=2 時 ANOVA 的 F 檢定與兩獨立母體 t 檢定等價，且 T²=F。ANOVA 表：變異來源／SS／df／MS／F。</div>"}, {"id": "11.3", "title": "ANOVA 之特殊課題", "pg": "p.484–495", "body": "<p>σ² 之 C.I. 樞紐量 (n−k)MSE/σ²~χ²(n−k)；單一處理平均 μᵢ 之 C.I. 用 t(n−k)；μᵢ−μⱼ 之單一 C.I. 用 t(n−k)·√[MSE(1/nᵢ+1/nⱼ)]。</p><div class=\"note\"><b>多重比較：</b>拒絕整體 H₀ 後需兩兩比較。<span class=\"term\" data-term=\"EER\">整體型一誤差率會膨脹</span>，故需<span class=\"term\" data-term=\"MultipleComparison\">聯立方法</span>：<span class=\"term\" data-term=\"Bonferroni\">Bonferroni</span>、<span class=\"term\" data-term=\"ScheffeMethod\">Scheffé</span>、<span class=\"term\" data-term=\"TukeyHSD\">Tukey HSD</span>。</div><p><span class=\"term\" data-term=\"ModelDiagnostics\">模型診斷</span>：同質變異數用 Bartlett、Hartley、修正 Levene 檢定；常態性用常態機率圖（Q-Q 圖）。假設不滿足時做變異數穩定化轉換或改用無母數方法（Kruskal-Wallis）。</p>"}, {"id": "11.4", "title": "一因子 ANOVA 隨機區集化設計（RBD）", "pg": "p.496–504", "body": "<p><span class=\"term\" data-term=\"RBD\">隨機區集化設計</span>考慮因子 k 個處理、外加 b 個<span class=\"term\" data-term=\"Blocking\">區集</span>，模型 Yᵢⱼ=μ+αᵢ+βⱼ+εᵢⱼ，n=k×b。平方和分解：<b class=\"sym\">SSTO=SSTR+SSB+SSE</b>。</p><div class=\"formula\"><span class=\"f-label\">兩個 F 檢定</span>處理：F=MSTR/MSE~F(k−1,(k−1)(b−1))；區集：F=MSB/MSE~F(b−1,(k−1)(b−1))。誤差 df=(k−1)(b−1)。</div><div class=\"note\"><b>重點：</b>處理與區集對稱，兩者效果之檢定相互獨立；RBD 可視為不重複實驗的二因子 ANOVA。</div>"}, {"id": "11.5", "title": "一因子 ANOVA 拉丁方格設計（LSD）", "pg": "p.505–507", "body": "<p><span class=\"term\" data-term=\"LSDdesign\">拉丁方格設計</span>同時控制列區集與行區集兩個干擾因子，因子有 p 個處理，以 n=p² 次實驗均衡配置。</p><div class=\"formula\"><span class=\"f-label\">平方和分解</span>SSTO=SSTR+SSR+SSC+SSE；誤差 df=(p−1)(p−2)。處理、列、行各自以 F=MS/MSE 右尾檢定。</div><div class=\"warn\"><b>取捨：</b>LSD 節省實驗成本，缺點是無法研究因子與區集間的交互作用，且樣本數少降低檢定力。</div>"}, {"id": "11.6", "title": "二因子變異數分析（Two-way ANOVA）", "pg": "p.508–518", "body": "<p><span class=\"term\" data-term=\"FactorialDesign\">因子設計</span>中 A 因子 a 水準、B 因子 b 水準，全部 a×b 組合皆實驗，每格 r 個重複，n=abr。模型 Yᵢⱼₖ=μ+αᵢ+βⱼ+(αβ)ᵢⱼ+εᵢⱼₖ，含<span class=\"term\" data-term=\"Interaction\">交互作用效果</span>。</p><div class=\"formula\"><span class=\"f-label\">平方和分解與三個 F</span>SSTO=SSA+SSB+SSAB+SSE；F_A=MSA/MSE、F_B=MSB/MSE、F_AB=MSAB/MSE，皆右尾。</div><div class=\"note\"><b>重點：</b>應先檢定交互作用 F_AB；若交互作用顯著，主效果內涵變複雜，須改看處理平均 Y̅ᵢⱼ.。交互作用圖中線段平行表無交互作用，不平行（未必要交叉）表有交互作用。</div>"}, {"id": "11.7", "title": "三因子變異數分析", "pg": "p.519–520", "body": "<p>三因子（A、B、C）模型除主效果外，含三個二階交互作用（A×B、A×C、B×C）與一個三階交互作用（A×B×C），共 8 個 F 檢定項，誤差自由度為 abc(r−1)。平方和恆等式 SSTO=SSA+SSB+SSC+SSAB+SSAC+SSBC+SSABC+SSE。</p>"}], "12": [{"id": "12.1", "title": "相關分析", "pg": "p.521–525", "body": "<p>相關分析衡量兩個屬量變數 X、Y 的<b class='concept'>直線線性相關程度</b>，無方向性。母體相關係數 <b class='sym'>ρ=Cov(X,Y)/(σxσy)</b> 須知聯合分配，實務以樣本 <span class='term' data-term='sample_corr'>r</span> 估計。</p><div class='formula'><span class='f-label'>Pearson 積差相關係數</span> <b class='sym'>rxy=Sxy/√(Sxx·Syy)</b></div><ul><li>r=+1 完全正相關；r=−1 完全負相關；r=0 無線性相關。</li><li>兩變數相關不必然因果，可能由 <span class='term' data-term='lurking'>潛在變數 Z</span> 造成共同反應；因果須靠理論建立。</li></ul><div class='note'>統計關係再強也無法建立因果：<i>'our ideas of causation must come from outside statistics, ultimately from some theory or other'</i>——<b class='proper'>Kendall and Stuart</b> (1961)。</div>"}, {"id": "12.2", "title": "簡單線性迴歸分析", "pg": "p.526–552", "body": "<p><span class='term' data-term='regression'>迴歸</span>由 <b class='proper'>Francis Galton</b> 1886 年研究身高「向平均迴歸」發展而來。模型 <b class='sym'>Y=β0+β1X+ε</b>，古典假設 <b class='sym'>ε~N(0,σ²)</b>：E(ε)=0、同質變異數、序列獨立、常態。</p><div class='formula'><span class='f-label'>最小平方估計量(OLS)</span> <b class='sym'>β̂1=Sxy/Sxx</b>，<b class='sym'>β̂0=Ȳ−β̂1X̄</b></div><ul><li>樣本迴歸線必過 (X̄,Ȳ)；殘差和為 0、殘差與 X 乘積和為 0。</li><li>常態下 OLS 與 <span class='term' data-term='mle'>MLE</span> 相同；由 <b class='proper'>Gauss-Markov</b> 定理為 <span class='term' data-term='blue'>BLUE</span>。</li><li>推論：β1、β0、E(Y) 與單一新 Y 之信賴/預測區間皆用 t(n−2)；<span class='term' data-term='ci_pi'>預測區間</span>比信賴區間多 1 倍 σ² 項而較寬。</li></ul><div class='formula'><span class='f-label'>判定係數</span> <b class='sym'>R²=SSR/SSTO</b>，平方和分解 <b class='sym'>SSTO=SSR+SSE</b>；整體 F=<b class='sym'>MSR/MSE~F(1,n−2)</b></div>"}, {"id": "12.3", "title": "簡單線性迴歸的特殊課題", "pg": "p.553–555", "body": "<ul><li><b class='concept'>比例與平移</b>：Y*=aY 使斜率縮小 a 倍；加常數平移只動截距。</li><li><b class='concept'>正迴歸與逆迴歸</b>：Y 對 X 與 X 對 Y 跑出的線不同，僅 R²=1 時重合；兩斜率相乘恰為 R²。</li><li><b class='concept'>非線性可線性化</b>：Y=β0+β1X²、Y=β0X^β1e^ε 等，只要迴歸係數線性即可用 OLS。</li><li><b class='concept'>無截距/無斜率模型</b>：前者不過 (X̄,Ȳ)，後者即樣本平均數為 E(Y) 之 BLUE。</li></ul>"}, {"id": "12.4", "title": "多元線性迴歸分析", "pg": "p.556–566", "body": "<p>模型 <b class='sym'>Y=β0+β1X1+...+βk−1Xk−1+ε</b>，額外假設解釋變數間無完全線性相依。以矩陣 <b class='sym'>β̂=(X'X)⁻¹X'y</b> 求解。</p><ul><li>抽樣分配：β̂j~N(βj,σ²·cjj)、(n−k)MSE/σ²~χ²(n−k)。</li><li>個別係數 t 檢定、<span class='term' data-term='partial_f'>偏 F 檢定</span>同時檢定多個係數；另有偏判定係數、偏相關係數。</li></ul>"}, {"id": "12.5", "title": "迴歸分析之進階課題", "pg": "p.567–568", "body": "<ul><li>模型設定錯誤：繪殘差圖、缺適性檢定判斷。</li><li><span class='term' data-term='hetero'>異質變異數</span>：改採 GLS/WLS。</li><li><span class='term' data-term='autocorr'>自我相關</span>：時間序列常見，以 <b class='proper'>Durbin-Watson</b> 檢定一階自我相關。</li><li><span class='term' data-term='multicol'>共線性</span>：R² 大而各 t 值不顯著；不破壞 BLUE，亦不影響純預測。</li></ul>"}, {"id": "12.6", "title": "虛擬變數", "pg": "p.569–574", "body": "<p>屬質解釋變數（性別、季節）以 <span class='term' data-term='dummy'>虛擬變數 D</span> 量化為 0/1。一 m 類類別變數只設 m−1 個虛擬變數，否則陷入<b class='concept'>虛擬變數陷阱</b>（完全共線）。加入虛擬變數的迴歸與單因子 ANOVA 等價。</p>"}], "13": [{"id": "13.1", "title": "單一母體多項分配之檢定", "pg": "p.575–582", "body": "<p><span class='term' data-term='chisq_stat'>卡方統計量</span>由 <b class='proper'>Karl Pearson</b> 1900 年提出，處理類別變數資料，為大樣本極限分配。</p><div class='formula'><span class='f-label'>適合度檢定</span> <b class='sym'>χ²=Σ(Oi−Ei)²/Ei</b>，H0:pj=pj*，拒絕域 χ²≥χα(r−1)</div><ul><li>要求各格 <b class='sym'>Ei≥5</b>，否則合併鄰組；Cochran 經驗法則：無 Ei&lt;1 且 Ei&lt;5 比例 ≤20%。</li><li>df=1 時用 <span class='term' data-term='yates'>Yates 連續校正</span>。母數未完全設定時每估一個母數損失一 df。</li></ul>"}, {"id": "13.2", "title": "多個母體多項分配之檢定（齊一性）", "pg": "p.581–584", "body": "<p><span class='term' data-term='homogeneity'>齊一性檢定</span>檢定由 k 個獨立母體抽出的樣本，在某類別變數上的比例是否相同：H0:k 個母體分配齊一。與單一比例 z 檢定等價（χ²=Z²）。</p>"}, {"id": "13.3", "title": "列聯表", "pg": "p.585–589", "body": "<p>a×b <span class='term' data-term='contingency'>列聯表</span>中，橫列與直行邊際固定下自由格僅 (a−1)(b−1) 個，故 <b class='sym'>df=(a−1)(b−1)</b>。期望次數 Eij=Ri·Cj/n。</p><ul><li><span class='term' data-term='independence'>獨立性檢定</span>：單一母體依兩變數分類，檢定兩變數是否獨立；格式、統計量、df 與齊一性相同，但抽樣設計不同。</li><li>關聯強度：2×2 用 <span class='term' data-term='phi'>phi</span>；a×b 用 <span class='term' data-term='cramers_v'>Cramer's V</span> 或 <span class='term' data-term='cont_coef'>Pearson 列聯係數 C</span>。</li></ul>"}, {"id": "13.4", "title": "卡方檢定的其他應用", "pg": "p.590–592", "body": "<p><span class='term' data-term='mcnemar'>McNemar 檢定</span>處理兩相關(成對)母體比例 p1=p2。關心不一致格 B、C，H0 下二者期望相等，統計量 <b class='sym'>χ²=(B−C)²/(B+C)~χ²(1)</b>；開根號得 Z 可做單尾。</p>"}, {"id": "13.5", "title": "其他母體適合度檢定", "pg": "p.593–595", "body": "<p><span class='term' data-term='ks_test'>K-S 檢定</span>比較理論 cdf F(x) 與樣本累加次數 S(x)，<b class='sym'>T=max|F(x)−S(x)|</b>；小樣本即可用、保留順序資訊，檢定力優於卡方，但須完全設定母數。</p><p><span class='term' data-term='lilliefors'>Lilliefors 檢定</span>修改 K-S，適用母數未設定的常態適合度檢定，查 Lilliefors 專表。另有 <span class='term' data-term='jb_sw'>Jarque-Bera、Shapiro-Wilk</span>。</p>"}], "14": [{"id": "14.1", "title": "非母數統計方法概論", "pg": "p.597–599", "body": "<p>母數方法假設母體分配已知僅少數母數未知；<span class='term' data-term='nonparametric'>非母數統計</span>具<b class='concept'>分配自由化 distribution-free</b>特性，不預設特定分配。母數方法前提（尤其常態）不滿足時，改用無母數方法以維持檢定力。</p><table><colgroup><col style='width:30%'/><col style='width:35%'/><col style='width:35%'/></colgroup><tr><th>比較</th><th>母數方法</th><th>非母數方法</th></tr><tr><td>推論對象</td><td>μ、σ² 等母數</td><td>分配形態或位置本身</td></tr><tr><td>適用變數</td><td>屬量變數為主</td><td>等級/順序為主</td></tr></table>"}, {"id": "14.2", "title": "等級相關", "pg": "p.600–602", "body": "<p>Pearson r 易受離群值影響，<b class='proper'>Spearman</b> 1904 改將 X、Y 各自排序轉等級。</p><div class='formula'><span class='f-label'>Spearman 等級相關</span> 無平分等級時 <b class='sym'>rs=1−6Σd²/[n(n²−1)]</b>，d=R(Xi)−R(Yi)</div><p><span class='term' data-term='kendall'>Kendall's tau</span>=(Nc−Nd)/C(n,2)，兩兩比對同序(concordant)與反序(discordant)。檢定 H0:ρs=0，小樣本查表，大樣本 t 或 Z 近似。</p>"}, {"id": "14.3", "title": "單一母體之非母數檢定", "pg": "p.603–604", "body": "<ul><li><span class='term' data-term='sign_test'>符號檢定</span>：H0:η=η0，以大於 η0 個數 N(+)~Bin(n,½)；大樣本 Z=(S−n/2)/√(n/4)。</li><li><span class='term' data-term='wilcoxon_signed'>Wilcoxon 符號等級檢定</span>：依 |Xi−η0| 給等級，W=min(W+,W−)，一律左尾拒絕；比符號檢定多用差的大小資訊。</li></ul>"}, {"id": "14.4", "title": "兩相依母體之非母數檢定", "pg": "p.605–608", "body": "<p>配對資料先求 Di=Xi−Yi，再做配對符號檢定或 Wilcoxon 配對符號等級檢定；後者處理成對位置差異，大樣本常態平均 n(n+1)/4、方差 n(n+1)(2n+1)/24。</p>"}, {"id": "14.5", "title": "兩獨立母體之非母數檢定", "pg": "p.609", "body": "<p><span class='term' data-term='rank_sum'>Wilcoxon 等級和檢定</span>與 <span class='term' data-term='mannwhitney'>Mann-Whitney U 檢定</span>等價：將 n1+n2 筆資料混合排序改等級，取樣本數較小者之等級和 W；大樣本常態近似。</p>"}, {"id": "14.6", "title": "多個獨立母體之非母數檢定", "pg": "p.611", "body": "<p><span class='term' data-term='kw'>Kruskal-Wallis 檢定</span>為單因子變異數分析(CRD)的無母數版，混合排序：<b class='sym'>H=[12/(n(n+1))]ΣRi²/ni−3(n+1)</b>，大樣本 ~χ²(k−1)。</p>"}, {"id": "14.7", "title": "多個相依母體之非母數檢定", "pg": "p.612–613", "body": "<p><span class='term' data-term='friedman'>Friedman 檢定</span>為隨機集區設計(RBD)的無母數版：在每個區集 block 內部排序給等級，比較各處理等級和。</p>"}, {"id": "14.8", "title": "隨機性檢定", "pg": "p.614", "body": "<p><span class='term' data-term='runs_test'>連檢定 runs test</span>檢定一成敗序列的出現順序是否隨機：H0:序列隨機。連數 R 太少或太多皆拒絕隨機；大樣本 R 常態近似，一律雙尾拒絕。</p>"}], "15": [{"id": "15.1", "title": "統計決策理論", "pg": "p.615–624", "body": "<p>面對諸策略 Di 與自然狀態 Sj，報酬 Oij。<span class='term' data-term='decision_tree'>決策樹</span>以□表決策節點、○表狀態節點。</p><p>無機率準則：<span class='term' data-term='criteria'>maximax、maximin、Hurwicz、minimax regret、Laplace(EP)</span>。有機率時：</p><div class='formula'><span class='f-label'>EMV</span> <b class='sym'>EMV(Dj)=ΣOij·P(Si)</b>；<span class='f-label'>EVPI</span> <b class='sym'>EVPI=EPPI−EMV(D*)</b></div><ul><li><b class='sym'>EPPI=Σmax{Oij}P(Si)</b>，完美訊息下的期望收益。</li><li>樣本訊息經 <span class='term' data-term='bayes_post'>貝氏定理</span>更新事後機率，EVSI=EPSI−EMV(D*)，效率=EVSI/EVPI。</li></ul>"}, {"id": "15.2", "title": "時間序列分析", "pg": "p.625–630", "body": "<p>時間序列四成份：<span class='term' data-term='ts_components'>長期趨勢 T、循環 C、季節 S、不規則 I</span>；相加 Y=T+C+S+I 或相乘 Y=T·C·S·I，後者常用。</p><ul><li><span class='term' data-term='ma'>移動平均法 MA</span>：最近 k 期算術平均預測下一期。</li><li><span class='term' data-term='exp_smooth'>指數平滑法</span> St=αYt+(1−α)St−1；Holt 法另加趨勢項。</li><li>預測準確度：<span class='term' data-term='rmse_mad'>RMSE、MAD</span>。</li><li><span class='term' data-term='seasonal_index'>季節指數</span>：由中央移動平均得 T，Y/T=S·I 平均後使四季和為 4；<span class='term' data-term='deseason'>去季節化</span> Y*=Y/S 後配趨勢，預測 F=T×S。</li></ul>"}, {"id": "15.3", "title": "指數", "pg": "p.635–639", "body": "<p>指數衡量多種商品價格或數量在基期(0)與計算期(t)間的變動。</p><div class='formula'><span class='f-label'>拉氏物價指數</span> <b class='sym'>LPI=Σ(PtQ0)/Σ(P0Q0)×100</b>（基期量加權，易高估通膨）</div><div class='formula'><span class='f-label'>派氏物價指數</span> <b class='sym'>PPI=Σ(PtQt)/Σ(P0Qt)×100</b>（計算期量加權，易低估）</div><div class='formula'><span class='f-label'>費氏理想指數</span> <b class='sym'>FPI=√(LPI·PPI)</b>（<b class='proper'>Irving Fisher</b> 幾何平均）</div><p>物量指數對應 LQI、PQI；價值指數 <b class='sym'>VI=Σ(PtQt)/Σ(P0Q0)×100</b>，同時涵蓋價與量。</p>"}]};
const CH_PROBLEMS = {"1": [{"q": "「The process of analyzing sample data in order to draw conclusions about the characteristics of a population」稱為下列何者？(a) descriptive statistics (b) statistical inference (c) data analysis (d) data summarization", "opts": ["(a) descriptive statistics", "(b) statistical inference", "(c) data analysis", "(d) data summarization"], "ans": "(b) statistical inference——由樣本資料推論母體特徵，正是統計推論的定義。"}, {"q": "問卷題目「非常贊成、贊成、中立、不贊成、非常不贊成」的量測尺度為何？(a)類別 (b)名目 (c)順序 (d)等距 (e)比例", "opts": ["(a)類別", "(b)名目", "(c)順序", "(d)等距", "(e)比例"], "ans": "(c) 順序尺度——可比較贊成程度高低，但「贊成多少」的差距無法衡量。"}, {"q": "試指出下列變數的測量尺度：(1)婚姻狀況（已婚=1,未婚=2,離婚=3,分居=4）；(2)薪資（元）；(3)學歷（高中=1…研究所=4）。", "opts": [], "ans": "(1) 名義尺度（編號只是分類）；(2) 比例尺度（有自然零點、可乘除）；(3) 順序尺度（只有高低次序）。"}], "2": [{"q": "基金經理人稱過去三年報酬率為 25%、−45%、90%，平均 23% 勝過大盤。你同意嗎？", "opts": [], "ans": "不同意。算術平均 23% 會高估；應用幾何平均：√(1.25×0.55×1.90)−1 ≈ 1.093−1 = 9.3%，並未擊敗大盤。"}, {"q": "甲生統計 66 分（全班平均 50、SD 11），微積分 82 分（全班平均 73、SD 9），同一批考生，哪一科表現較傑出？", "opts": [], "ans": "算 z 分數：統計 z=(66−50)/11≈1.45；微積分 z=(82−73)/9=1。甲生在統計學相對表現較傑出。"}, {"q": "BMW 10 位業務上月銷車：15,23,4,19,18,10,10,8,28,19。求第 40 百分位數與上下四分位數。", "opts": [], "ans": "排序：4,8,10,10,15,18,19,19,23,28。i=10×0.4=4 為整數，P40=(X₍₄₎+X₍₅₎)/2=(10+15)/2=12.5；Q1=P25=X₍₃₎=10；Q3=P75=X₍₈₎=19。"}], "3": [{"q": "若 P(B)=0.30、P(A|B)=0.40、P(B|A)=0.50，求 P(A)。", "opts": [], "ans": "由乘法規則 P(A∩B)=P(A|B)P(B)=0.4×0.3=0.12；又 P(A∩B)=P(B|A)P(A)=0.5·P(A)，故 P(A)=0.12/0.5=0.24。"}, {"q": "Monty Hall 問題：三扇門一車二羊，你選一門後主持人開一扇有羊的門，問「換門」與「不換門」哪個中車機率高？", "opts": ["換門", "不換門"], "ans": "換門中車機率 2/3，不換僅 1/3，故應換門；若以丟銅板混合決定，機率回到 1/2。"}, {"q": "擲兩顆公正骰子，點數和為 8 的機率？點數和為 2 的機率？", "opts": [], "ans": "樣本空間共 36 點。和為 8 的有利點：(2,6),(3,5),(4,4),(5,3),(6,2) 共 5 個，機率 5/36；和為 2 只有 (1,1)，機率 1/36。"}], "4": [{"q": "設 X 為連續型隨機變數，pdf f(x)=c·x，0≤x≤2。求使 f(x) 為合法 pdf 之常數 c。", "opts": ["(a) c=1/2", "(b) c=1", "(c) c=2", "(d) 不存在這樣的 c"], "ans": "(a) c=1/2——由 ∫₀² cx dx = c·(x²/2)|₀²=2c=1 得 c=1/2。"}, {"q": "令 f(x)=c(2x-1)，x=1,2,…,10 為 pmf。求 c 並驗證性質。", "opts": ["(a) c=1/100", "(b) c=1/55", "(c) c=1/10", "(d) c=1/110"], "ans": "(a) c=1/100——Σ_{x=1}^{10}(2x-1)=100=10²，故 1=100c。"}, {"q": "已知 E(X)=17、E(X²)=298，求 P(10<X<24) 之下界（用 Chebyshev）。", "opts": ["(a) 至少 0.75", "(b) 至少 0.81", "(c) 至少 0.5", "(d) 至少 0.9"], "ans": "(b) 至少 0.81——Var(X)=298-289=9，σ=3；10<X<24 即 |X-17|<7=kσ ⇒ k=7/3，1-1/k²=1-9/49=40/49≈0.816。"}, {"q": "某工廠每週生產量 X 為非負隨機變數、E(X)=500。用 Markov 不等式估 P(X≥1000)。", "opts": ["(a) ≤0.25", "(b) ≤0.5", "(c) ≤0.1", "(d) ≥0.5"], "ans": "(b) ≤0.5——P(X≥1000)≤E(X)/1000=500/1000=0.5。"}], "5": [{"q": "Cov(X,Y)=0 時，下列何者正確？", "opts": ["(a) X 與 Y 必獨立", "(b) X 與 Y 必不獨立", "(c) 零相關不保證獨立", "(d) ρ_XY=±1"], "ans": "(c) 零相關不保證獨立；獨立 ⇒ Cov=0 但逆不真。"}, {"q": "設 E(Y|X=x)=2-2x、E(X|Y=y)=5-1.5y，求 ρ_XY。", "opts": ["(a) ρ=1", "(b) ρ=-1", "(c) ρ=√3/2", "(d) ρ=0"], "ans": "(b) ρ=-1——兩條迴歸斜率 b_1=ρσ_Y/σ_X=-2、b_1'=ρσ_X/σ_Y=-1.5，相乘得 ρ²=3、同號皆負，聯立書上解得 ρ=-1。"}, {"q": "Var(X)=9、Var(Y)=2、Var(Z)=4、Cov(X,Y)=-2。求 Var(3X-2Y+Z+6)。", "opts": ["(a) 35", "(b) 49", "(c) 25", "(d) 37"], "ans": "(a) 35（依書上共變異數矩陣展開：9·9+4·2+1·4+2(3)(-2)Cov(X,Y)+…，詳見範例 5.26）。"}], "6": [{"q": "X~Poi(λ=0.5)、Y~Poi(λ=1.5) 且獨立，求 P(X+Y=3)。", "opts": ["(a) 4e^{-2}/3", "(b) 2e^{-2}", "(c) e^{-2}", "(d) 3e^{-2}"], "ans": "(a) 由再生性 X+Y~Poi(2)，P=e^{-2}·2³/3!=8e^{-2}/6=4e^{-2}/3。"}, {"q": "X~N(180,10²)，每盒取 6 罐，求每盒總重量 Y=ΣX_i 超過 1080 之機率趨近。", "opts": ["(a) Y~N(1080,600)", "(b) Y~N(1080,60)", "(c) Y~N(1080,3600)", "(d) Y~N(180,600)"], "ans": "(a) Y~N(1080,600)——E(Y)=6·180=1080、Var(Y)=6·100=600（獨立）。"}, {"q": "f(x)=0.125e^{-0.125x}, x≥0，此為何種分配？求其 E(X)。", "opts": ["(a) Exp(β=8)、E=8", "(b) Exp(β=0.125)、E=0.125", "(c) Gamma(2,8)", "(d) 常態"], "ans": "(a) Exp(β=8)、E(X)=8——f(x)=(1/β)e^{-x/β}，1/β=0.125 ⇒ β=8。"}], "7": [{"q": "X₁,…,X_n iid~N(μ,σ²)，σ² 未知。(X̄-μ)/(S/√n) 服從何分配？", "opts": ["(a) N(0,1)", "(b) χ²(n)", "(c) t(n-1)", "(d) F(n-1,n-1)"], "ans": "(c) t(n-1)——常態母體、σ 未知下用樣本標準差，為自由度 n-1 之 t。"}, {"q": "母體任意分配、均值 μ、變異數 σ²，樣本數 n 很大時 X̄ 的分配為何？", "opts": ["(a) 確切常態", "(b) 漸近常態 N(μ,σ²/n)", "(c) 卡方", "(d) 均勻"], "ans": "(b) 漸近常態 N(μ,σ²/n)——由中央極限定理，不需母體常態假設。"}, {"q": "三零件壽命獨立且皆 Exp(β=3)，串聯系統（取 min）壽命服從？", "opts": ["(a) Exp(β=1)", "(b) Exp(β=9)", "(c) Gamma(3,3)", "(d) 常態"], "ans": "(a) Exp(β=1)——min 的 cdf=1-[1-e^{-x/β}]³，P(min&gt;t)=[e^{-t/3}]³=e^{-t}，即 Exp(β=1)。"}], "8": [{"q": "設 X₁,…,Xₙ~Ber(p)，母體比例 p 之 MLE 為何？", "opts": ["(a) p̂=X̄", "(b) p̂=中位數", "(c) p̂=1/X̄", "(d) p̂=S²"], "ans": "(a) p̂=X̄。Bernoulli 之 MLE 與 MME 相同，皆為樣本平均，且為 p 之不偏估計量。"}, {"q": "常態母體 N(μ,σ²) 之 σ² 的 MLE 為 (1/n)Σ(Xᵢ−X̄)²，下列敘述何者正確？", "opts": ["(a) 它是 σ² 之不偏估計量", "(b) 它低估 σ²，經自由度修正為 S² 後才不偏", "(c) 它是 UMVUE", "(d) 它與 S² 的 MSE 相等"], "ans": "(b)。MLE 除以 n 為低估；改除以 n−1（自由度修正）得 S²，E(S²)=σ²。但就 MSE 有效性而言，MLE 反而略優。"}, {"q": "關於不偏性與一致性，下列何者正確？", "opts": ["(a) 不偏估計量必一致", "(b) 一致估計量必不偏", "(c) 二者互不隸屬", "(d) S 是 σ 之不偏估計量"], "ans": "(c)。不偏性與一致性互無隸屬；又因非線性轉換不具不動性，S=√S² 並非 σ 之不偏估計量。"}, {"q": "何謂 MLE 之不動性（invariance property）？", "opts": ["(a) MLE 必為不偏", "(b) 若 θ̂_MLE 為 θ 之 MLE，則 g(θ) 之 MLE 為 g(θ̂_MLE)", "(c) MLE 必一致", "(d) MLE 與 MME 永遠相同"], "ans": "(b)。g(·) 為任意函數，函數轉換後之 MLE 直接代入，例如 σ=√σ² 之 MLE=√σ̂²_MLE。"}], "9": [{"q": "95% 信賴區間 (50.2, 54.3) 之正確解讀為何？", "opts": ["(a) μ 落於此區間的機率為 0.95", "(b) 95% 的樣本平均數落在此區間", "(c) 我們有 95% 信心此區間含 μ，因它是做對的 95% 區間之一", "(d) 以上皆對"], "ans": "(c)。μ 為常數、已實現區間亦為常數，無機率可言；信心來自建構區間的方法本身。"}, {"q": "母體常態、σ² 未知，小樣本求 μ 之 95% C.I. 應使用哪個分配？", "opts": ["(a) Z~N(0,1)", "(b) t(n−1)", "(c) χ²(n−1)", "(d) F(n−1,n−1)"], "ans": "(b)。樞紐量 T=(X̄−μ)/(S/√n)~t(n−1)，故 C.I.=X̄±t_{0.025}(n−1)·S/√n。"}, {"q": "欲估計母體比例 p，無任何先驗資訊，95% 信心、誤差界限 E=±3%，所需樣本數約為？", "opts": ["(a) 384", "(b) 1068", "(c) 2000", "(d) 50"], "ans": "(b) 約 1068。取 p=0.5 最保守，n=(1.96)²·0.25/(0.03)²≈1067.1，無條件進位。"}, {"q": "關於預測區間 P.I.，下列何者正確？", "opts": ["(a) 它估計母數 μ", "(b) 它估計未來觀察值 X_{n+1}，公式比 C.I. 多「1+」項", "(c) 它永遠比 C.I. 窄", "(d) 它用 F 分配"], "ans": "(b)。P.I. 對未來觀察值，需另加個別觀察值的離差變異 σ²，故 SE 為 S√(1+1/n)，區間比 C.I. 寬。"}], "10": [{"q": "在 H₀:μ=μ₀ vs Hₐ:μ≠μ₀ 之雙尾檢定中，下列何者為型一誤差？", "opts": ["(a) H₀ 真卻拒絕 H₀", "(b) Hₐ 真卻不拒絕 H₀", "(c) H₀ 真卻不拒絕 H₀", "(d) Hₐ 真卻拒絕 H₀"], "ans": "(a)。型一誤差=棄真，機率 α；型二誤差=取偽，機率 β；Hₐ 真下成功拒絕=檢定力 1−β。"}, {"q": "若某檢定在 α=0.05 下拒絕 H₀（p-value=0.03），下列何者正確？", "opts": ["(a) α=0.10 時應不拒絕", "(b) α=0.01 時應拒絕", "(c) α=0.10 時拒絕、α=0.01 時不拒絕", "(d) 結論與 α 無關"], "ans": "(c)。p=0.03≤0.10 拒絕，但 0.03>0.01 不拒絕。p-value 法決策：p≤α 則拒絕。"}, {"q": "假說檢定的六個標準步驟順序為何？", "opts": ["(a) 算 T₀→定 α→建假說→找統計量→定 RR→決策", "(b) 建假說→定 α→找檢定統計量及分配→定拒絕域 RR→算觀察值 T₀→決策法則", "(c) 定 RR→建假說→算 T₀→決策", "(d) 建假說→算 T₀→定 α→找分配"], "ans": "(b)。標準流程：H₀/Hₐ→α→T 與其 H₀ 下分配→RR→T₀→T₀∈RR 則拒絕。"}, {"q": "樣本數 n 固定時，降低 α 通常會導致？", "opts": ["(a) β 下降、檢定力上升", "(b) β 上升、檢定力下降", "(c) α 與 β 同時下降", "(d) 無影響"], "ans": "(b)。n 固定下 α、β 互為消長；欲同時下降唯有增加 n。"}], "11": [{"q": "One-way ANOVA CRD 之檢定統計量 F=MSTR/MSE 的拒絕域為何？", "opts": ["(a) 左尾 F≤…", "(b) 雙尾", "(c) 一律右尾 F≥F_α(k−1,n−k)", "(d) 不拒絕域為 F 越大越好"], "ans": "(c)。SSTR 相對 SSE 越大代表處理效果越顯著，MSTR 越大、F 越大，故一律右尾拒絕。"}, {"q": "ANOVA 的平方和分解恆等式為何？", "opts": ["(a) SSTO=SSTR−SSE", "(b) SSTO=SSTR+SSE", "(c) SSTO=SSB+SSE", "(d) SSTR=SSTO+SSE"], "ans": "(b)。總平方和=處理（組間）平方和+誤差（組內）平方和；RBD 再加上區集平方和 SSB。"}, {"q": "為何 k>2 時不宜直接進行 C(k,2) 次兩兩 t 檢定？", "opts": ["(a) 計算太慢", "(b) 整體型一誤差率 α_eer 會膨脹", "(c) 自由度不足", "(d) 常態假設不成立"], "ans": "(b)。α_eer=1−(1−α_pc)^C≫α_pc，故需 ANOVA 整體檢定；事後多重比較用 Bonferroni/Scheffé/Tukey 控制聯立誤差率。"}, {"q": "Two-way ANOVA 中，分析時應先檢定哪一項？", "opts": ["(a) A 因子主效果", "(b) B 因子主效果", "(c) 交互作用效果 F_AB", "(d) 隨機選一個"], "ans": "(c)。先檢定交互作用；若顯著，主效果內涵變複雜，應改看處理平均 Y̅ᵢⱼ. 而非單純比較主效果。"}], "12": [{"q": "範例12.8：估計簡單迴歸式 Y=a+bXi+ei，n=12，Σ(Yi−Ȳ)²=1000，Σ(Xi−X̄)²=3，R²=0.25。求 b 的估計量標準差。", "opts": [], "ans": "SSE=(1−R²)·SSTO=0.75×1000=750；MSE=SSE/(n−2)=75。SE(β̂1)=√(MSE/Sxx)=√(75/3)=5。"}, {"q": "範例12.12：直線迴歸式 Y=15+2.5X，X 標準差 10、Y 標準差 25。求 X 與 Y 之樣本相關係數。", "opts": [], "ans": "β̂1=r·(sy/sx)，故 r=β̂1·sx/sy=2.5×10/25=1。完全正相關。"}, {"q": "範例12.11：n=20，X̄=1000、Ȳ=1200，Sx=40、Sy=50，r=0.9。求 β1 的最小平方估計值。", "opts": [], "ans": "β̂1=r·Sy/Sx=0.9×50/40=1.125。"}, {"q": "簡單線性迴歸中，E(Y) 的信賴區間與單一新 Y 的預測區間何者較寬？為什麼？", "opts": ["信賴區間較寬", "預測區間較寬", "兩者相同", "視 R² 而定"], "ans": "預測區間較寬。信賴區間估 E(Y) 平均，預測區間多含一個新誤差項 σ²，方差多 1 倍項，故更寬。"}], "13": [{"q": "範例13.12：500 位客戶分三收入級別評價經紀人，列聯表欲檢定 rating 與 income 是否獨立（α=0.10）。說明假說、df 與統計量形式。", "opts": [], "ans": "H0:rating 與 income 獨立；Ha:不獨立。a=3 列、b=3 行，df=(3−1)(3−1)=4。χ²=ΣΣ(Oij−Eij)²/Eij，Eij=Ri·Cj/n；若 χ²≥χ²0.10(4) 則拒絕 H0。"}, {"q": "範例13.15：競選前後訪問 200 人，前 A 後 A=101、前 A 後 B=9、前 B 後 A=27、前 B 後 B=63。檢定支持度有無改變。", "opts": [], "ans": "McNemar 檢定：B=9、C=27。χ²=(B−C)²/(B+C)=(9−27)²/36=9。df=1，χ²0.05(1)=3.84，9>3.84 拒絕 H0，支持度顯著改變。"}, {"q": "範例13.17：以 K-S 檢定資料是否抽自 λ=1.2 之 Poisson，算出 T=max|F(x)−S(x)|=0.1226，臨界值 1.36/√100=0.136。結論為何？", "opts": ["拒絕 H0", "不拒絕 H0", "兩尾拒絕", "無法判斷"], "ans": "不拒絕 H0（0.1226<0.136），資料並未顯著異於 λ=1.2 的 Poisson 分配。"}], "14": [{"q": "範例14.1：10 天降雨量與車禍數，不能假設常態，欲檢定二者線性關係。應用何種等級相關？檢定統計量？", "opts": ["Pearson r", "Spearman rs", "Kendall's tau", "符號檢定"], "ans": "Spearman 等級相關係數 rs。先將兩變數各自排序給等級，無平分時 rs=1−6Σd²/[n(n²−1)]；小樣本查 Spearman 表檢定 H0:ρs=0。"}, {"q": "範例14.7：十對 A、B 輪胎磨耗里程，以兩母體符號檢定檢定 μA>μB（α=0.10）。說明作法。", "opts": [], "ans": "求每對差 D=A−B，計正號個數 S=N(+)。H0:p=½ 下 S~Bin(10,½)；右尾小樣本直接算 p-value，若 p-value<0.10 拒絕 H0。"}, {"q": "範例14.11：三種薪資制度共 18 位業務員，α=0.01 檢定制度是否為激勵因素。應用何檢定？其為哪個母數檢定的無母數版？", "opts": ["Friedman", "Kruskal-Wallis", "Wilcoxon 符號等級", "連檢定"], "ans": "Kruskal-Wallis 檢定，為單因子變異數分析(CRD)的無母數版。將 18 筆混合排序，H=[12/(18·19)]ΣRi²/ni−3·19，大樣本比 χ²(2)。"}, {"q": "連檢定(runs test)的 H0 為何？一律採何種尾巴拒絕？", "opts": ["H0:序列非隨機；左尾", "H0:序列隨機；雙尾", "H0:中位數相等；右尾", "H0:獨立；左尾"], "ans": "H0:序列具有隨機性。連數 R 太少或太多皆偏離隨機，故一律雙尾拒絕。"}], "15": [{"q": "範例15.1：三自然狀態機率 P(S1)=0.2、P(S2)=0.5、P(S3)=0.3。EMV(A1)=200、A2=255、A3=235、A4=215、A5=165；EPPI=310。求 EMV 最適與 EVPI。", "opts": [], "ans": "EMV 最大為 A2=255（最適策略 D*）。EVPI=EPPI−EMV(D*)=310−255=55。"}, {"q": "範例15.3：7 週時間序列值 24,13,20,12,19,23,15。(1)3 週移動平均與 (2)α=0.2 指數平滑各預測第 8 週。概念差異？", "opts": [], "ans": "3 週 MA 第 8 週預測=(19+23+15)/3=19。指數平滑 F8=αY7+(1−α)F7，遞迴遞推。MA 對最近 k 期等權；指數平滑以遞減幾何權數加權全部歷史。"}, {"q": "範例15.8：以 1980 為基期，1999 年 LPI=130.56、PPI=130.67、LQI=94.46、PQI=94.53、VI=123.43。求費氏理想物價指數與物量指數。", "opts": [], "ans": "FPI=√(130.56×130.67)=130.61；FQI=√(94.46×94.53)=94.49。物價漲約 30.6%，物量跌約 5.5%，總價值漲 23.43%。"}]};
