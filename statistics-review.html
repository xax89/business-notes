<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提綱挈領 學統計｜互動複習</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Georgia,serif' fill='white' text-anchor='middle'%3E%E2%88%91%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fs:16px;
  --paper:#f6f0e2;
  --ink:#2b251d;
  --panel:#fffdf6;
  --line:#e4d9bf;
  --muted:#6f6555;
  --nav-bg:#f1e9d5;
  --nav-ink:#4a4234;
  --nav-hover:#e7dcc0;
  --nav-active:#3c6e8f;
  --accent:#b5542e;
  --accent-soft:#fbeae2;
  --teal:#2c6e9e;
  --teal-soft:#eef3f4;
  --green:#1e7d32;
  --hl:#ffe94a;
  --radius:12px;
  --blue:#2c6e9e;--green2:#3a7d44;--orange:#c06a24;--purple:#6b4e8e;--brown:#8a5a3b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Serif TC","PMingLiU","PingFang TC",serif;
  font-size:var(--fs);
  background:var(--paper);
  color:var(--ink);
  line-height:1.8;
  display:flex;
  min-height:100vh;
}
body.dark{
  --paper:#16130d;--ink:#e6e0d2;--panel:#201c14;--line:#3a3325;
  --muted:#a0937a;--nav-bg:#1f1a10;--nav-ink:#cfc4ad;--nav-hover:#332b1b;
  --nav-active:#4a8ab5;--accent:#e08a55;--accent-soft:#2f2014;
  --teal:#5f9fc0;--teal-soft:#14242e;--green:#5cb56e;--hl:#5a4a1e;
  --blue:#5f9fc0;--green2:#5cb56e;--orange:#d98a4a;--purple:#9b7fc0;--brown:#b08a5a;
}
/* ===== 側邊目錄（兩層） ===== */
.sidebar{
  width:280px;flex-shrink:0;background:var(--nav-bg);color:var(--nav-ink);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 18px 40px;
  border-right:1px solid var(--line);
}
.sidebar .brand{font-weight:700;font-size:15px;letter-spacing:.02em;line-height:1.4;margin-bottom:4px;color:var(--ink)}
.sidebar .brand .t2{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.nav-chapter{
  display:flex;align-items:center;gap:8px;width:100%;padding:4px 10px;border-radius:6px;
  cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);
  border:none;background:none;text-align:left;margin-top:8px;font-family:inherit;line-height:1.45;
}
.nav-chapter:hover{background:var(--nav-hover)}
.nav-chapter.active{background:var(--nav-active);color:#fff}
.nav-chapter .num{font-size:11px;font-weight:600;opacity:.65;width:26px;flex-shrink:0}
.nav-chapter.active .num{opacity:.9}
.nav-chapter .tag{margin-left:auto;font-size:10px;opacity:.55;letter-spacing:.05em;font-weight:400}
.nav-chapter .tag.done{color:var(--green2);opacity:1}
.nav-ch{position:relative}
.nav-ch .nav-subs{display:none;padding:2px 0 6px}
.nav-ch.open .nav-subs{display:block}
.nav-chapter .chev{width:13px;height:13px;margin-left:6px;flex-shrink:0;opacity:.5;transition:transform .2s}
.nav-ch.open .nav-chapter .chev{transform:rotate(90deg);opacity:.9}
.nav-sub .sub-num{color:var(--accent);font-weight:700;margin-right:3px}
.nav-sub:hover .sub-num{color:inherit}
.nav-sub{
  display:block;width:100%;padding:3px 10px 3px 34px;border-radius:6px;
  cursor:pointer;font-size:12.5px;color:var(--muted);border:none;background:none;text-align:left;font-family:inherit;line-height:1.45;
}
.nav-sub:hover{background:var(--nav-hover);color:var(--ink)}
.nav-sub.lv2{padding-left:52px;font-size:12px}
.nav-sub.lv1{font-weight:600;color:var(--ink)}
.nav-sub.active{color:var(--nav-active);font-weight:700}
.nav-gloss{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:6px;margin-top:10px;
  cursor:pointer;font-size:13.5px;font-weight:700;color:#8a6d1a;border:1.5px dashed #d9b84a;background:#fffaf0;
  text-align:left;font-family:inherit;line-height:1.45;transition:all .15s;
}
.nav-gloss:hover{border-color:#c9a227;color:#c9a227;background:#fff6dd}
.nav-gloss svg{width:15px;height:15px;flex-shrink:0}
.nav-gloss.active{background:#c9a227;color:#fff;border-style:solid}
.search-panel{
  position:fixed;top:66px;left:50%;transform:translateX(-50%);width:min(680px,92vw);max-height:62vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.16);z-index:60;
}
.search-panel .sp-item{display:block;width:100%;text-align:left;padding:10px 16px;border:none;border-bottom:1px solid var(--line);background:none;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);line-height:1.5}
.search-panel .sp-item:hover{background:var(--nav-hover)}
.search-panel .sp-tag{display:inline-block;font-size:11px;color:var(--teal);font-weight:700;margin-right:8px;letter-spacing:.03em;white-space:nowrap}
.search-panel .sp-item b{display:block;font-size:13.5px;margin:2px 0}
.search-panel .sp-snip{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-panel .sp-count{padding:8px 16px;font-size:12px;color:var(--muted);text-align:center}
.search-panel .sp-empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:13.5px}
body.dark .search-panel{background:#26221a;border-color:#4a4234}
/* ===== 主內容 ===== */
.main{flex:1;min-width:0;padding:28px 34px 80px}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);padding:10px 0 14px;margin-bottom:18px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.searchbox{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.searchbox svg{width:16px;height:16px;opacity:.45;flex-shrink:0}
.searchbox input{border:none;outline:none;background:none;font-size:14px;width:100%;color:var(--ink);font-family:inherit}
.toolbtn{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit;transition:all .15s;
}
.toolbtn:hover{border-color:var(--teal);color:var(--teal)}
.toolbtn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.toolbtn svg{width:15px;height:15px}
/* 章頭 */
.chapter-head{border-left:8px solid var(--teal);padding:6px 0 10px 18px;margin:30px 0 18px}
.chapter-head .kicker{display:inline-block;font-size:12px;letter-spacing:.15em;color:var(--teal);font-family:"Noto Sans TC",sans-serif;font-weight:600}
.chapter-head h1{font-family:"Noto Serif TC",serif;font-size:27px;line-height:1.25;margin:2px 0 4px}
.chapter-head p{color:var(--muted);font-size:14.5px;max-width:760px;margin-top:6px}
/* 小節 */
.section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.section-head{
  display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none;
  font-family:"Noto Serif TC",serif;font-size:19px;font-weight:600;border-bottom:2px solid transparent;transition:border-color .15s;
}
.section.open .section-head{border-bottom-color:var(--teal)}
.section-head .sec-num{color:var(--teal);font-size:12.5px;font-weight:700;font-family:"Noto Sans TC",sans-serif;letter-spacing:.08em;flex-shrink:0}
.section-head .chev{width:18px;height:18px;margin-left:auto;transition:transform .2s;flex-shrink:0}
.section.open .section-head .chev{transform:rotate(180deg)}
.section-body{display:none;padding:4px 20px 18px}
.section.open .section-body{display:block}
.section.lvl1>.section-body{margin-left:10px;border-left:2px solid var(--line);padding-left:14px}
.section.lvl1{margin-top:10px}
.section.lvl1>.section-head{background:var(--accent-soft);border-radius:10px}
.section-body p{margin:10px 0;font-size:14.8px}
.section-body ul{margin:8px 0;padding-left:24px}
.section-body li{margin:3px 0}
/* callout 盒子（參考章節筆記風格） */
.section-body .note{background:#fdf0c2;border-left:4px solid #d9a514;padding:12px 16px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.section-body .note::before{content:"重點與結論";display:block;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#8a6d1a;margin-bottom:4px}
.section-body .warn{background:var(--accent-soft);border-left:4px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.section-body .warn::before{content:"考試重點";display:block;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin-bottom:4px}
.section-body .src{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
.section-body .src summary{cursor:pointer;font-size:12.5px;color:var(--teal)}
.section-body .src pre{white-space:pre-wrap;font-family:"Noto Serif TC",serif;font-size:13px;color:var(--muted);margin-top:8px;max-height:280px;overflow-y:auto}
/* 公式卡 */
.formula{background:#fbf4e6;border:1px dashed #c9b88f;border-radius:8px;padding:14px 18px;margin:12px 0;font-size:15.5px;text-align:center;font-family:"Noto Serif TC",serif}
.formula .f-label{display:block;font-size:11.5px;color:#9a6a1f;letter-spacing:.08em;margin-bottom:4px;font-family:"Noto Sans TC",sans-serif;font-weight:700}
.formula .f-note{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-family:"Noto Sans TC",sans-serif}
/* 術語 */
.term{color:var(--green);font-weight:700;cursor:pointer;border-bottom:1.5px dashed color-mix(in srgb,var(--green) 55%,transparent);border-radius:3px;padding:0 2px;transition:all .15s}
.term:hover{background:var(--green);color:#fff;border-bottom:none}
/* 專有名詞（人名／事件）深紫粗體 */
.proper{color:#7b2cbf;font-weight:700;cursor:pointer;border-bottom:1.5px dashed color-mix(in srgb,#7b2cbf 50%,transparent);border-radius:3px;padding:0 2px;transition:background .15s}
.proper:hover{background:#7b2cbf;color:#fff;border-bottom:none}
body.dark .proper{color:#b39ddb}
body.dark .proper:hover{background:#b39ddb;color:#1a1420}
/* 例題 */
.problem{background:#eae6da;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:14px 0}
.problem .p-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;color:var(--teal);margin-bottom:8px}
.problem .p-body{font-size:14.5px}
.problem .opts{margin:10px 0 4px;display:grid;gap:6px}
.problem .opts div{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.8px;background:var(--panel)}
body.dark .problem{background:#26221a}
.ans-btn{
  margin-top:12px;display:inline-flex;align-items:center;gap:8px;background:none;border:1.5px solid var(--teal);
  color:var(--teal);border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .15s;
}
.ans-btn:hover{background:var(--teal);color:#fff}
.fav{
  margin-left:auto;background:none;border:1.5px solid var(--line);color:var(--muted);border-radius:8px;
  padding:3px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;
}
.fav:hover{border-color:#c9a227;color:#c9a227}
.fav.on{border-color:#c9a227;background:#fffaf0;color:#c9a227;font-weight:700}
body.dark .fav.on{background:#3a3320}
.ans{display:none;margin-top:12px;background:var(--teal-soft);border-radius:8px;padding:12px 16px;font-size:14px}
.ans.show{display:block}
.ans .a-label{font-weight:700;color:var(--teal);font-size:13px}
.ans ul{margin:6px 0 2px;padding-left:22px}
.ans li{margin:3px 0}
.ans b{font-weight:700}
/* 術語卡區 */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin:16px 0}
.flip-card{perspective:900px;height:150px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);padding:12px;text-align:center}
.flip-front{background:var(--panel)}
.flip-front .en{font-size:16px;font-weight:700;color:var(--teal);word-break:break-word}
.flip-front .zh{font-size:13px;color:var(--muted)}
.flip-back{background:var(--teal);color:#fff;transform:rotateY(180deg)}
.flip-back .def{font-size:13px;line-height:1.6}
.flip-hint{font-size:11px;opacity:.5;margin-top:4px}
/* ===== 術語表（列表形式） ===== */
.gloss-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.gloss-cats{display:flex;gap:6px;flex-wrap:wrap}
.gloss-cat-btn{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 13px;font-size:12.5px;cursor:pointer;color:var(--muted);transition:all .15s}
.gloss-cat-btn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.gloss-progress{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.gloss-progress .bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.gloss-progress .fill{height:100%;background:var(--teal);width:0%;transition:width .3s}
.gloss-progress .label{font-size:13px;color:var(--muted);white-space:nowrap}
.gloss-group{margin-bottom:16px}
.gloss-group h3{font-size:14px;color:var(--teal);margin:14px 0 8px;padding-left:10px;border-left:3px solid var(--teal);letter-spacing:.04em}
.gloss-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:8px 0;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s}
.gloss-item.starred{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gloss-check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;cursor:pointer;display:grid;place-items:center;margin-top:2px;transition:all .15s;background:none;padding:0}
.gloss-check svg{width:14px;height:14px;display:none;color:#fff}
.gloss-check.done{background:var(--teal);border-color:var(--teal)}
.gloss-check.done svg{display:block}
.gloss-item.done .gloss-en{text-decoration:line-through;opacity:.55}
.gloss-main{flex:1;min-width:0}
.gloss-en{font-weight:700;color:var(--green);font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gloss-zh{font-size:15px;color:var(--green);font-weight:700;margin-left:2px}
.gloss-def{font-size:13.5px;margin-top:4px;line-height:1.8}
.gloss-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.gloss-btn{border:1px solid var(--line);background:none;border-radius:7px;padding:3px 10px;font-size:11.5px;cursor:pointer;color:var(--muted);transition:all .15s}
.gloss-btn:hover{color:var(--teal);border-color:var(--teal)}
.gloss-btn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.gloss-note{display:none;margin-top:8px}
.gloss-note.show{display:block}
.gloss-note textarea{width:100%;min-height:56px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--paper);color:var(--ink);font-family:inherit;resize:vertical}
.gloss-note textarea:focus{outline:none;border-color:var(--teal)}
.gloss-data-actions{display:flex;gap:8px;margin-left:auto}
/* 搜尋高亮 */
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
mark.hl{background:var(--hl)}
/* 重點高亮（使用者標記） */
.userhl{background:var(--hl);border-radius:3px;cursor:pointer;box-shadow:0 0 0 2px var(--hl)}
/* 畫記模式 */
body.marking{cursor:crosshair}
body.marking .section-body p,body.marking .section-body li,body.marking .section-body .note,body.marking .section-body .warn,body.marking .problem .p-body{cursor:crosshair;border-radius:3px;transition:box-shadow .12s}
body.marking .section-body p:hover,body.marking .section-body li:hover,body.marking .section-body .note:hover,body.marking .section-body .warn:hover,body.marking .problem .p-body:hover{box-shadow:0 0 0 2px rgba(255,233,74,.45);background:rgba(255,233,74,.12)}
/* 進度條 */
.progress-strip{display:flex;gap:6px;margin:14px 0 6px}
.progress-strip i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress-strip i.done{background:var(--teal)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--teal-soft);color:var(--teal);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:500}
/* 提示條 */
.banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px;padding:14px 18px;font-size:13.5px;color:var(--ink);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:18px;height:18px;flex-shrink:0;color:var(--accent);margin-top:2px}
/* 空狀態 */
.empty{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
.empty.show{display:block}
.empty .big{font-size:40px;margin-bottom:10px}
.chpage{font-size:12.5px;color:var(--muted);font-family:"Noto Sans TC",sans-serif}
.chapter-head .ch-points{margin:10px 0 0;padding-left:22px;font-size:14.5px;color:var(--ink)}
.chapter-head .ch-points li{margin:3px 0}
/* 方法學習卡（左打勾＋方法名＋公式說明，底下例子） */
.method-card{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;margin:12px 0;background:var(--panel);overflow:hidden;transition:opacity .2s}
.method-card .mc-check{width:64px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--panel)}
.method-card .mc-check input{width:19px;height:19px;accent-color:var(--green);cursor:pointer}
.method-card .mc-check .mc-lbl{font-size:11px;color:var(--muted)}
.method-card .mc-check:has(input:checked){background:#eef7ec}
.method-card .mc-check:has(input:checked) .mc-lbl{color:var(--green);font-weight:700}
.method-card .mc-left{width:34px;flex-shrink:0;background:var(--teal-soft);border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:8px 2px;font-family:"Noto Sans TC",sans-serif;font-weight:700;color:var(--teal);font-size:13px;text-align:center;line-height:1.4;writing-mode:vertical-rl;letter-spacing:.08em}
.method-card .mc-body{flex:1;padding:12px 16px;font-size:14px;min-width:0}
.method-card .mc-formula{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--ink)}
.method-card .mc-detail{font-size:13px;color:var(--muted)}
.method-card .mc-ex{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px}
/* 學會：刪除線＋黯淡 */
.method-card.learned{opacity:.55}
.method-card.learned .mc-formula,.method-card.learned .mc-detail,.method-card.learned .mc-ex{text-decoration:line-through;text-decoration-thickness:1.5px}
/* 標題式學習卡（標題橫排） */
.method-card.mc-title .mc-left{writing-mode:initial;width:auto;min-width:96px;padding:10px 8px;font-size:13px}
body.dark .method-card .mc-check:has(input:checked){background:#16241a}
@media (max-width:900px){
  .method-card{flex-wrap:wrap}
  .method-card .mc-check{width:56px;border-right:1px solid var(--line);border-bottom:none;flex-direction:column;padding:6px}

機化設計", "11.3 ANOVA之特殊課題", "11.4 一因子ANOVA隨機區集化設計", "11.5 一因子ANOVA拉丁方格設計", "11.6 二因子變異數分析", "11.7 三因子變異數分析"], "points": ["ANOVA 由 Ronald Fisher 建立，用以檢定 k 個母體平均數是否全相等。", "平方和分解 SSTO=SSTR+SSE；檢定統計量 F=MSTR/MSE，一律右尾。", "實驗設計三原則：重複、隨機化、區集化；因子的類別稱水準，水準組合稱處理。", "完全隨機化設計 CRD、隨機區集化設計 RBD、拉丁方格設計 LSD 為一因子三種配置。", "兩因子因子設計可同時檢定主效果與交互作用效果；交互作用圖平行即無交互作用。", "多重比較需控制整體型一誤差率，常用 Bonferroni、Scheffé、Tukey（HSD）等聯立方法。"], "ready": true}, {"n": 12, "title": "相關分析與線性迴歸", "subs": ["相關分析", "簡單線性迴歸", "多元線性迴歸", "虛擬變數"], "points": ["相關分析衡量兩屬量變數的線性相關程度，無方向性；迴歸分析有方向性，以 X 解釋 Y。", "最小平方法（OLS）求殘差平方和最小，常態下與 MLE 相同；樣本迴歸線必過 (X̄,Ȳ)。", "判定係數 R²=SSR/SSTO 衡量模型解釋力；簡單迴歸中 r²=R²。", "信賴區間估的是 E(Y) 平均數，預測區間估的是單一筆新 Y，後者較寬。"], "ready": true}, {"n": 13, "title": "卡方檢定與適合度檢定", "subs": ["適合度檢定", "齊一性檢定", "列聯表獨立性", "其他適合度檢定"], "points": ["卡方統計量由 Karl Pearson 於 1900 年提出，處理類別變數資料，為大樣本極限分配。", "適合度檢定單一多項母體；齊一性檢定 k 個母體比例是否相同；獨立性檢定兩類別變數是否獨立。", "列聯表自由度為 (a−1)(b−1)，格子期望次數 Eij 應 ≥5；df=1 時需 Yates 連續校正。", "K-S、Lilliefors 以累積分配函數最大落差檢定母體適合度，小樣本優於卡方。"], "ready": true}, {"n": 14, "title": "其他非母數統計方法", "subs": ["等級相關", "符號與等級檢定", "Mann-Whitney/Kruskal-Wallis/Friedman", "連檢定"], "points": ["非母數統計（無母數）不需假設母體分配為特定形式，具分配自由化（distribution-free）特性。", "Spearman 等級相關 rs 把資料轉等級後計算，比 Pearson r 更不受離群值影響。", "符號檢定、Wilcoxon 符號等級檢定檢定母體中位數位置；後者利用|差|之等級和。", "Wilcoxon 等級和（Mann-Whitney U）檢定兩獨立母體；Kruskal-Wallis 為 CRD 無母數版；Friedman 為 RBD 無母數版；連檢定檢定序列隨機性。"], "ready": true}, {"n": 15, "title": "統計決策理論、時間序列與指數", "subs": ["決策理論", "時間序列分析", "統計指數"], "points": ["不確定下的準則有 maximax、maximin、Hurwicz、minimax regret 與 Laplace；有機率時用 EMV。", "EVPI = EPPI − EMV(D*)，衡量完美訊息的期望價值；EVSI = EPSI − EMV(D*)。", "時間序列四成份：長期趨勢 T、循環 C、季節 S、不規則 I；有相加與相乘兩種模型。", "拉氏指數以基期數量加權（易高估通膨），派氏以計算期數量加權（易低估），費氏取兩者幾何平均。"], "ready": true}];

之隨機變數 X₁,…,X_n。"], "Sampling Error": ["Sampling Error", "抽樣誤差", "樣本代表性不足所造成的誤差，隨機抽樣仍不可避免但可衡量。"], "Nonsampling Error": ["Nonsampling Error", "非抽樣誤差", "測量、蒐集、抄寫、處理過程中之人為或儀器失準誤差。"], "Probability Sampling": ["Probability Sampling", "隨機抽樣方法", "母體每個體以已知機率被納入樣本，可據以推導抽樣分配。"], "Simple Random Sampling": ["Simple Random Sampling", "簡單隨機抽樣", "母體每個體被抽中機率均等的抽樣方式 SRS。"], "Stratified Sampling": ["Stratified Sampling", "分層抽樣", "先分層（層內同質、層間異質）再各層抽樣，如比例配置、尼曼配置。"], "Cluster Sampling": ["Cluster Sampling", "群集抽樣", "將母體分群後抽群，分一階段與兩階段群集抽樣。"], "Nonprobability Sampling": ["Nonprobability Sampling", "非隨機抽樣方法", "如便利抽樣、雪球抽樣，主觀決定樣本，無法推導抽樣分配。"], "Chi-square Dist": ["Chi-squared Distribution", "卡方分配", "Z₁²+…+Z_v² 之分配 χ²(v)，常用於變異數抽樣分配。"], "Student t Distribution": ["Student's t Distribution", "司徒頓 t 分配", "T=Z/√(χ²_v/v)~t(v)，對稱、尾部較常態厚，v→∞ 趨近標準常態。"], "F Distribution": ["Snedecor's F Distribution", "F 分配", "F=(χ²_v₁/v₁)/(χ²_v₂/v₂)，右偏，常用於兩變異數比例之檢定。"], "Central Limit Theorem": ["Central Limit Theorem", "中央極限定理 CLT", "任意母體下，大樣本時 √n(X̄-μ)/σ 漸近標準常態。"], "Law of Large Numbers": ["Law of Large Numbers", "大數法則 LLN", "n→∞ 時樣本平均數 X̄ 機率收斂至母體平均數 μ。"], "Sample Proportion": ["Sample Proportion", "樣本比例", "p̂=成功次數/n，Bernoulli 母體之樣本平均數，大樣本漸近常態。"], "Order Statistics": ["Order Statistics", "順序統計量", "將樣本由小到大排序 X₍₁₎≤…≤X₍ₙ₎ 所得之統計量。"], "iid": ["Independent and Identically Distributed", "獨立同分配 iid", "樣本觀測值彼此獨立且來自同一母體分配。"], "Estimator": ["Estimator", "估計量", "用以估計母數 θ 之樣本統計量 θ̂(X₁,…,Xₙ)，為隨機變數；代入實際樣本數值得估計值 estimate。"], "Estimate": ["Estimate", "估計值", "將一組實際隨機樣本數值代入估計量所得的觀察值，為一個固定數字。"], "LikelihoodFunction": ["Likelihood Function", "概似函數", "L(θ)=∏ f(xᵢ;θ)，表在不同母數值 θ 下抽到這組觀察樣本的可能性。"], "MLE": ["Maximum Likelihood Estimator", "最大概似估計量", "找 θ̂ 使概似函數 L(θ)（或對數概似 ℓ(θ)=ln L(θ)）最大；具不動性。"], "LogLikelihood": ["Log-Likelihood Function", "對數概似函數", "ℓ(θ)=ln L(θ)；因對數為嚴格遞增，最大化 ℓ 與最大化 L 等價且微分較易。"], "InvarianceMLE": ["Invariance Property of MLE", "MLE 不動性", "若 θ̂_MLE 為 θ 之 MLE，則 g(θ) 之 MLE 為 g(θ̂_MLE)，g 為任意函數。"], "MME": ["Method of Moments Estimator", "動差法估計量", "以類比法令第 r 階母體動差 μᵣ=E(Xʳ) 等於第 r 階樣本動差 mᵣ=(1/n)ΣXᵢʳ 求解。"], "MethodofAnalogy": ["Method of Analogy", "類比法", "動差法之理論基礎，認為樣本動差與母體動差具類似統計性質，由大數法則保證一致性。"], "LSE": ["Least Square Estimator", "最小平方法估計量", "找估計量使誤差平方和 SSE=Σ(Xᵢ−θ̂)² 最小，廣用於線性模型。"], "BayesianEstimator": ["Bayesian Estimator", "貝氏估計量", "將母數視為隨機變數，結合事前分配與樣本經貝氏定理得事後分配，取其期望值 E(θ|X)。"], "Unbiasedness": ["Unbiasedness", "不偏性", "若 E(θ̂)=θ 則 θ̂ 為不偏估計量；直覺為「平均而言估計正確」。"], "Bias": ["Bias", "偏誤", "Bias(θ̂)=E(θ̂)−θ；>0 高估、&lt;0 低估、=0 不偏。"], "DegreesOfFreedomCorrection": ["Degrees of Freedom Correction", "自由度修正", "將分母由 n 改為 n−1，使 MLE 的樣本變異數成為 σ² 之不偏估計量 S²。"], "ConsistencyMeaning": ["Asymptotic Unbiasedness", "漸近不偏性", "若 lim E(θ̂)=θ 則為漸近不偏；不偏必漸近不偏，逆不真。"], "Accuracy": ["Accuracy", "準確度", "重複估計下「平均彈著點」與靶心（真值）的接近程度，以 |Bias| 衡量。"], "Precision": ["Precision", "精確度", "重複估計下各彈著點彼此的分散程度，以 Var 或標準誤衡量。"], "StandardError": ["Standard Error", "標準誤", "樣本統計量抽樣分配之標準差，SE(θ̂)=SD(θ̂)=√Var(θ̂)。"], "MSE": ["Mean Squared Error", "平均平方誤差", "MSE(θ̂)=E[(θ̂−θ)²]=Var(θ̂)+[Bias(θ̂)]²，綜合精確度與準確度。"], "RelativeEfficiency": ["Relative Efficiency", "相對有效性", "兩估計量 MSE 之比；MSE 較小者相對有效。"], "UMVUE": ["Uniformly Minimum Variance Unbiased Estimator", "均勻最小變異不偏估計量", "所有不偏估計量中變異數最小者（又稱最佳不偏估計量 BUE）。"], "BLUE": ["Best Linear Unbiased Estimator", "最佳線性不偏估計量", "所有線性不偏估計量中變異數最小者；樣本平均數 X̄ 即 μ 之 BLUE。"], "CRLB": ["Cramér-Rao Lower Bound", "克拉瑪—勞下界", "不偏估計量變異數之下界 Var(θ̂)≥1/[n·I₁(θ)]；I₁ 為費雪訊息。"], "FisherInformation": ["Fisher Information", "費雪訊息", "I₁(θ)=−E[∂²ln f(x;θ)/∂θ²]，衡量樣本對母數的資訊量。"], "Consistency": ["Consistency", "一致性", "n→∞ 時 plim θ̂=θ，即對任意 ε>0 有 P(|θ̂−θ|&lt;ε)→1；大樣本性質。"], "MSEConsistency": ["MSE Consistency", "MSE 一致性", "若 lim MSE(θ̂)=0（含漸近不偏且 Var→0）則為一致性估計量。"], "SufficientStatistic": ["Sufficient Statistic", "充份統計量", "給定該統計量下，樣本條件分配與母數 θ 無關，已含樣本中關於 θ 之全部攸關資訊。"], "FactorizationTheorem": ["Factorization Theorem", "分解定理", "θ̂ 為充份統計量之充要條件：聯合機率 f(x₁,…,xₙ;θ)=g(θ̂;θ)·h(x₁,…,xₙ)。"], "SufficiencyPrinciple": ["Sufficiency Principle", "充份性原則", "Ronald Fisher 揭櫫：推論母數應先從充份統計量下手，不充份者幾乎不用考慮。"], "IntervalEstimator": ["Interval Estimator", "區間估計量", "由隨機樣本組合出的隨機區間 [L,U]，用以區間估計母數；已算出的具體數字 [50.2,54.3] 則為區間估計值。"], "RandomInterval": ["Random Interval", "隨機區間", "信賴上下界 L、U 皆為隨機樣本之函數，故 [L,U] 為隨機區間，可對其討論機率。"], "ConfidenceInterval": ["Confidence Interval", "信賴區間", "隨機區間 [L,U] 滿足 P(L&lt;θ&lt;U)=1−α；L、U 分別為信賴下、上界。"], "ConfidenceLevel": ["Confidence Level", "信心水準", "(1−α)100%，又稱信賴係數；越大越有信心區間含真值，但區間越寬。"], "PivotalQuantity": ["Pivotal Quantity", "樞紐量", "隨機樣本與待估母數之函數 Q(θ̂;θ)，其分配不含任何未知母數，為建構 C.I. 之工具。"], "MarginOfError": ["Margin of Error", "誤差界限", "E=z_{α/2}·SE(點估計量)；C.I. 寬度=2E。"], "FinitePopulationCorrection": ["Finite Population Correction", "有限母體校正", "抽出不放回且 n/N 較大時，變異數乘校正因子 (N−n)/(N−1)；n/N&lt;5% 可省略。"], "OneSidedCI": ["One-Sided Confidence Interval", "單邊信賴區間", "[L,∞) 為單邊下界 C.I.，(−∞,U] 為單邊上界 C.I.，分別用於單尾檢定。"], "PredictionInterval": ["Prediction Interval", "預測區間", "以現有樣本對未來（尚未抽取）觀察值 X_{n+1} 作區間預測，比 μ 之 C.I. 多「1+」變異項。"], "PooledVariance": ["Pooled Variance", "混合變異數", "同質變異數假設下 S_p²=[(n₁−1)S₁²+(n₂−1)S₂²]/(n₁+n₂−2)，共同估計 σ²。"], "Homoscedasticity": ["Homoscedasticity", "同質變異數", "k 個母體（處理）內部變異數皆相等 σ₁²=…=σₖ²，為 ANOVA 與兩母體 t 檢定之假設。"], "Heteroscedasticity": ["Heteroscedasticity", "異質變異數", "母體變異數不相等；兩平均差此時改用 Welch 自由度。"], "Welchdf": ["Welch's Degrees of Freedom", "Welch 自由度", "異質變異數下兩母體平均差 t 檢定之自由度，常非整數，四捨五入查表。"], "PairedSample": ["Paired Sample", "成對樣本", "相依母體中成對觀察，先取差 Dᵢ=Xᵢ−Yᵢ 再視為單一母體處理。"], "SampleSizeDetermination": ["Sample Size Determination", "樣本數決定", "給定 E 與信心水準反解 n；n=(z_{α/2}σ/E)²，無條件進位。"], "SlutskyTheorem": ["Slutsky's Theorem", "史拉斯基定理", "大樣本下以 S 代入未知 σ、以 p̂ 代入未知 p 後，標準化統計量仍漸近 N(0,1)。"], "ConfidenceIntervalMeaning": ["Meaning of Confidence Interval", "信賴區間之意義", "母數為常數，已實現區間無機率可言；應說「有 1−α 信心」此區間屬做對的那 95% 之一。"], "FDistribution": ["F Distribution", "F 分配", "兩獨立卡方除以各自自由度之比；用於變異數比之 C.I. 與 ANOVA F 檢定，尾點有倒數關係。"], "NullHypothesis": ["Null Hypothesis", "虛無假說 H₀", "先推定為真、處優勢地位之假說，應含等號；代表現況/原始狀態。"], "AlternativeHypothesis": ["Alternative Hypothesis", "對立假說 Hₐ", "研究者欲透過證據支持者，負舉證責任，代表新狀態。"], "TypeIError": ["Type I Error", "型一誤差", "H₀ 為真卻錯誤拒絕；發生機率 α（α 風險），即顯著水準。"], "TypeIIError": ["Type II Error", "型二誤差", "Hₐ 為真卻錯誤不拒絕 H₀；發生機率 β（β 風險）。"], "SignificanceLevel": ["Significance Level", "顯著水準", "型一誤差之最大機率 α，常取 0.05 或 0.1；又稱檢定大小 size。"], "Power": ["Power", "檢定力", "Hₐ 為真下成功拒絕 H₀ 之機率，Power=1−β。"], "TestStatistic": ["Test Statistic", "檢定統計量", "H₀ 為真下其抽樣分配已知的樣本函數 T，觀察值 T₀ 據以決策。"], "RejectionRegion": ["Rejection Region", "拒絕域", "使我們拒絕 H₀ 之 T 的範圍 RR（又稱臨界域/危險域）；其餘為接受域。"], "CriticalValue": ["Critical Value", "臨界值", "拒絕域與接受域之交界 k，右尾 T≥k、左尾 T≤k、雙尾兩個臨界值。"], "DecisionRule": ["Decision Rule", "決策法則", "若 T₀∈RR 則拒絕 H₀；若 T₀∉RR 則不拒絕 H₀。"], "PValue": ["p-value", "p 值", "給定觀察值 T₀ 下能拒絕 H₀ 之最小顯著水準；操作上即 H₀ 為真下之尾機率。"], "Duality": ["Duality", "對偶性", "信賴區間與假說檢定之對應：虛無值落在 C.I. 外即拒絕 H₀。"], "OneSidedTest": ["One-Sided Test", "單尾檢定", "右尾 Hₐ:θ>θ₀ 或左尾 Hₐ:θ&lt;θ₀，拒絕域在單一尾部。"], "TwoSidedTest": ["Two-Sided Test", "雙尾檢定", "Hₐ:θ≠θ₀，拒絕域分兩尾；簡單/複合假說之分。"], "ProducerRisk": ["Producer's Risk", "生產者風險", "允收抽樣中 α 風險（好批被拒收）；相對地 β 風險為消費者風險。"], "PowerFunction": ["Power Function", "檢定力函數", "PF(θ)=P(拒絕 H₀|θ)，繪成檢定力曲線 PC。"], "OCFunction": ["Operating Characteristic Function", "作業特性函數", "OCF(θ)=P(不拒絕 H₀|θ)，與檢定力函數互為補數。"], "NeymanPearsonLemma": ["Neyman-Pearson Lemma", "尼曼—皮爾森引理", "給定 α 下尋找檢定力最強（β 最小）之最強力檢定的定理。"], "ANOVA": ["Analysis of Variance", "變異數分析", "由 Ronald Fisher 建立，檢定 k 個獨立母體平均數 μ₁,…,μₖ 是否全相等。"], "Factor": ["Factor", "因子", "影響反應變數之類別型自變數（控制變數）；其類別稱水準 level。"], "Treatment": ["Treatment", "處理", "因子各水準之組合；單因子中一個水準即一種處理。"], "ExperimentalDesign": ["Design of Experiments", "實驗設計", "有系統安排實驗以釐清因子對反應變數之因果關係，三原則：重複、隨機化、區集化。"], "CRD": ["Completely Randomized Design", "完全隨機化設計", "一因子設計，將 n 個實驗單位隨機分配至 k 個處理。"], "SSTO": ["Total Sum of Squares", "總平方和", "SSTO=ΣΣ(Yᵢⱼ−Ȳ..)²，分解為 SSTR+SSE。"], "SSTR": ["Treatment Sum of Squares", "處理（組間）平方和", "SSTR=Σnᵢ(Ȳᵢ.−Ȳ..)²，反應因處理不同造成的變異。"], "SSE": ["Error Sum of Squares", "誤差（組內）平方和", "SSE=ΣΣ(Yᵢⱼ−Ȳᵢ.)²，反應非關處理之個體差異。"], "MSEanova": ["Mean Square Error", "誤差平均平方", "MSE=SSE/(n−k)，為 σ² 之不偏估計量。"], "Ftest": ["F test", "F 檢定", "F=MSTR/MSE~F(k−1,n−k)，一律右尾拒絕；k=2 時 t²=F。"], "RBD": ["Randomized Block Design", "隨機區集化設計", "以區集控制已知且可控的干擾因子，每處理在每區集內實驗一次。"], "Blocking": ["Blocking", "區集化", "把可控干擾因子各水準設為一個區集，比較處理時移除該因子效應。"], "LSDdesign": ["Latin Square Design", "拉丁方格設計", "同時控制列區集與行區集兩個干擾因子，以 n=p² 次實驗均衡配置。"], "FactorialDesign": ["Factorial Design", "因子設計", "每個因子所有水準組合皆實驗，可同時檢定主效果與交互作用。"], "Interaction": ["Interaction Effect", "交互作用效果", "一因子效果依另一因子水準而改變；交互作用圖線段不平行即存在。"], "MultipleComparison": ["Multiple Comparison", "多重比較", "拒絕整體 H₀ 後兩兩比較母體平均，需控制整體型一誤差率。"], "Bonferroni": ["Bonferroni Correction", "邦弗洛尼修正", "各別 C.I. 改用 (1−α/m) 信心水準，使聯立信心水準≥1−α。"], "TukeyHSD": ["Tukey's HSD", "杜奇真實顯著差異", "HSD=q_α(k,n−k)√(MSE/2·(1/nᵢ+1/nⱼ))，查 studentized range 表。"], "ScheffeMethod": ["Scheffé's Method", "薛費法", "適用所有可能線性對照與兩兩比較的聯立信賴區間法。"], "ModelDiagnostics": ["Model Adequacy Checking", "模型診斷", "檢查同質變異數（Bartlett、Hartley、修正 Levene）與常態性（常態機率圖等）假設。"], "EER": ["Experimentwise Error Rate", "全實驗錯誤率", "同時進行多個兩兩比較時整體的聯立型一誤差率，會隨比較次數膨脹。"], "FixedEffectModel": ["Fixed Effect Model", "固定效果模型", "處理效果 αᵢ 為固定常數；相對者為隨機效果模型。"], "pop_cov": ["pop_cov", "母體共變異數", "Cov(X,Y)=E[(X−μx)(Y−μy)]，衡量兩隨機變數共同變動的方向與幅度。"], "pop_corr": ["pop_corr", "母體相關係數 ρ", "ρxy=Cov(X,Y)/(σx σy)，介於 −1 與 1 之間，衡量母體兩變數線性相關程度。"], "sample_corr": ["sample_corr", "樣本相關係數 r", "rxy=Sxy/√(Sxx·Syy)，為 ρxy 的點估計，又稱 Pearson 積差相關係數。"], "pearson_r": ["pearson_r", "Pearson 乘積動差相關係數", "<b class='proper'>Karl Pearson</b> 提出，適用於兩屬量變數，極易受離群值影響。"], "lurking": ["lurking", "潛在變數（lurking variable）", "未列入分析的隱藏變數 Z，使 X 與 Y 對其共同反應，造成假性相關。"], "causation": ["causation", "相關≠因果", "統計關係再強也無法建立因果，因果關係須靠理論先驗推衍，非由數據邏輯導出。"], "regression": ["regression", "迴歸（regression）", "<b class='proper'>Francis Galton</b> 1886 年研究身高遺傳時提出，發現子女身高有「向平均迴歸」現象。"], "slr_model": ["slr_model", "簡單線性迴歸模型", "<b class='sym'>Y=β0+β1X+ε</b>，一個解釋變數 X 與一個反應變數 Y 的線性關係。"], "prf": ["prf", "母體迴歸方程式 PRF", "E(Y)=β0+β1X，給定 X 下 Y 的平均數；β0、β1 為未知母數。"], "srf": ["srf", "樣本迴歸方程式 SRF", "Ŷ=β̂0+β̂1X，為 PRF 的樣本估計，殘差 ei=Yi−Ŷi。"], "error_term": ["error_term", "誤差項（干擾項）", "ε，模型中 Y 偏離 E(Y) 的隨機部份，古典假設 ε~N(0,σ²)。"], "ols": ["ols", "最小平方法 OLS", "<span class='f-label'>最小平方法</span>使殘差平方和 SSE=Σe² 最小，得 β̂1=Sxy/Sxx、β̂0=Ȳ−β̂1X̄；求解不需常態假設。"], "normal_eq": ["normal_eq", "正規方程組", "最小平方一階條件形成的聯立方程 Σ(Y−β̂0−β̂1Xi)=0 與 Σ(Y−β̂0−β̂1Xi)Xi=0。"], "mle": ["mle", "最大概似估計 MLE", "使概似函數最大的估計量；常態假設下與 OLS 相同，求取需常態假設。"], "blue": ["blue", "BLUE（最佳線性不偏估計量）", "<b class='proper'>Gauss-Markov</b> 定理下，OLS 估計量為所有線性不偏估計中方差最小者。"], "homo": ["homo", "同質變異數 homoscedasticity", "各誤差項變異數相等 Var(εi)=σ²，無論 X 為何；違背即為異質變異數。"], "hetero": ["hetero", "異質變異數 heteroscedasticity", "係數仍不偏但非 BLUE，標準誤估計有誤，t、F 檢定失效，改採 GLS/WLS。"], "autocorr": ["autocorr", "自我相關 autocorrelation", "誤差項間序列相關，時間序列常見；以 <b class='proper'>Durbin-Watson</b> 檢定一階自我相關。"], "multicol": ["multicol", "共線性 multicollinearity", "解釋變數間高度線性相依，使 SE(β̂j) 膨脹、t 值傾向不顯著，但不影響 Gauss-Markov 與預測。"], "ci_pi": ["ci_pi", "信賴區間 vs 預測區間", "信賴區間估 E(Y) 之平均；預測區間估單一筆新 Y，後者多出 1 倍 σ² 項而較寬。"], "r_squared": ["r_squared", "判定係數 R²", "R²=SSR/SSTO，Y 變異中可被模型解釋的比例；簡單迴歸 r=±√R²，複相關係數 R=|r|。"], "anova_decomp": ["anova_decomp", "平方和分解 SSTO=SSR+SSE", "總平方和=迴歸(可解釋)平方和+誤差平方和；MSR/MSE~F(1,n−2) 為整體 F 檢定。"], "partial_f": ["partial_f", "偏 F 檢定", "同時檢定多個（非全部）迴歸係數是否同時為 0，比較完整模型與縮減模型 SSE。"], "dummy": ["dummy", "虛擬變數 dummy variable", "將屬質解釋變數量化為 0/1；一 m 類類別變數只設 m−1 個虛擬變數，否則陷入虛擬變數陷阱（完全共線）。"], "fishers_z": ["fishers_z", "Fisher Z 轉換", "大樣本(n≥25)下對 r 作 ½ln[(1+r)/(1−r)] 轉換以建 ρ 信賴區間。"], "chisq_stat": ["chisq_stat", "卡方統計量 χ²", "<span class='f-label'>Pearson 卡方</span>χ²=Σ(Oi−Ei)²/Ei，<b class='proper'>Karl Pearson</b> 1900 年提出，大樣本下趨近卡方分配。"], "cat_var": ["cat_var", "類別變數/多項母體", "名目或順序尺度變數；母體依類別分組即多項母體，卡方檢定處理之。"], "gof": ["gof", "卡方適合度檢定", "檢定 H0:p1=p1*,...,pr=pr*；df=r−1(或減估計母數數)，要求各格 Ei≥5。"], "yates": ["yates", "Yates 連續校正", "格子為離散而 χ² 為連續，df=1 時以 (|O−E|−0.5)²/E 校正。"], "homogeneity": ["homogeneity", "卡方齊一性檢定", "檢定 k 個獨立母體在某類別變數上的分配比例是否相同（樣本抽自 k 個母體）。"], "independence": ["independence", "卡方獨立性檢定", const CH_SECTIONS = {"1": [{"id": "1.1", "title": "統計學是什麼？", "pg": "p.1", "body": "<p>本節「<b class=\"concept\">統計學是什麼？</b>」主題涵蓋下列 3 個小節：統計學的定義、母體與樣本、統計學之分類。概念與公式詳見各小節。</p>", "children": [{"id": "1.1.1", "title": "統計學的定義", "pg": "p.1", "body": "<p><span class=\"term\" data-term=\"Statistics\">統計學</span>（statistics）是研究如何從雜亂無章的數據資料中，粹煉出有用的<span class=\"term\" data-term=\"Information\">資訊</span>（information）或<span class=\"concept\">知識</span>（knowledge）的學問，以利研究者作成結論、並成為決策依據。</p><p>研究對象稱<span class=\"concept\">個體</span>（individuals）或<span class=\"concept\">元素</span>（elements），可以是人、動物，也可以是國家、公司等抽象事物；個體所具的特性稱<span class=\"term\" data-term=\"Variable\">變數</span>（variable），其「值」不一定是數，也可以是文字或符號。</p>"}, {"id": "1.1.2", "title": "母體與樣本", "pg": "p.4", "body": "<p>研究對象的整個群體稱為<span class=\"term\" data-term=\"Population\">母體</span>，大小記為 <b class=\"sym\">N</b>；母體太大、無法普查或具破壞性實驗時，只抽取其中一部分，此子集合即<span class=\"term\" data-term=\"Sample\">樣本</span>，大小記為 <b class=\"sym\">n</b>。</p>\n<div class=\"note\"><b>重點：</b><span class=\"term\" data-term=\"Parameter\">母數（參數）</span> vs <span class=\"term\" data-term=\"Statistic\">統計量</span>：<ol class=\"nlist\"><li>母數描述母體特徵，是固定而未知的常數，通用希臘字母。</li><li>統計量描述樣本特徵，隨每次抽樣而變動。</li></ol></div>\n<p>研究母數的兩大方法：</p>\n<ol class=\"nlist\"><li><span class=\"term\" data-term=\"Census\">普查</span>（對母體全體）</li><li>抽樣調查</li></ol>\n<p>普查有三大困難：</p>\n<ol class=\"nlist\"><li>成本太高</li><li>無限／概念性母體無法列舉</li><li>破壞性實驗不能全做</li></ol>\n<p><span class=\"term\" data-term=\"StatisticalInference\">統計推論</span>主要包含兩種工具：</p>\n<ol class=\"nlist\"><li><span class=\"term\" data-term=\"Estimation\">估計</span>（點估計、區間估計）</li><li><span class=\"term\" data-term=\"HypothesisTesting\">假說檢定</span></li></ol>\n<p>唯有<span class=\"term\" data-term=\"RandomSample\">隨機樣本</span>才有代表性，故機率論是推論統計學的基石。</p>\n<div class=\"warn\"><b>易錯：</b>隨機樣本才有可掌握的機率規律；非隨機樣本主觀任意，無法做推論。</div><div class=\"note\"><b>本章註：</b><b class=\"proper\">何大一（David Ho）</b>以雞尾酒療法治療 HIV 的臨床新藥試驗，即典型的<b class=\"concept\">臨床母體</b>：把「所有符合條件的患者」視為母體、實際受試者為樣本。</div>"}, {"id": "1.1.3", "title": "統計學之分類", "pg": "p.7", "body": "<p>依處理問題區分：<span class=\"term\" data-term=\"DescriptiveStatistics\">敘述統計學</span>研究如何把雜亂資料整理成易讀形式；<span class=\"term\" data-term=\"InferentialStatistics\">推論統計學</span>研究如何由樣本推論母體。</p>\n<p>依功能區分：</p>\n<ol class=\"nlist\"><li>數理統計學：研究理論本身的數學推導。</li><li>應用統計學：把工具用到各領域（商用、生物統計、計量經濟、工程統計等）。</li></ol>\n<p>依是否假設母體分配區分：</p>\n<ol class=\"nlist\"><li>母數統計學：常假設常態或大樣本，推論平均數、變異數等母數。</li><li>非母數統計學：又稱無母數或分配自由化方法，不對分配形式設限。</li></ol>\n<div class=\"note\"><b>重點：</b>普查只需敘述統計；母體太大、普查做不到，才需要推論統計。</div><div class=\"note\"><b>本章註：</b>現代統計學由 <b class=\"proper\">Karl Pearson</b> 與 <b class=\"proper\">R. A. Fisher</b> 奠基；實驗經濟學之父 <b class=\"proper\">Vernon L. Smith</b>（諾貝爾經濟學獎）即以統計方法設計人為實驗。進階方法可參考 <b class=\"proper\">Hastie、Tibshirani、Friedman《The Elements of Statistical Learning》</b>。</div>"}]}, {"id": "1.2", "title": "變數的測量尺度與資料的種類", "pg": "p.10", "body": "<p>本節「<b class=\"concept\">變數的測量尺度與資料的種類</b>」主題涵蓋下列 2 個小節：變數的測量尺度、資料之分類。概念與公式詳見各小節。</p>", "children": [{"id": "1.2.1", "title": "變數的測量尺度", "pg": "p.10", "body": "<p><b class=\"proper\">Stevens（1946）</b>依資訊含量把測量尺度由低到高分為四級：</p>\n<table><colgroup><col style=\"width:18%\"><col style=\"width:42%\"><col style=\"width:40%\"></colgroup><tr><th>尺度</th><th>功能</th><th>實例／可做運算</th></tr><tr><td><span class=\"term\" data-term=\"NominalScale\">名義尺度</span></td><td>只辨識分類，數字只是分類號</td><td>性別、血型、背號；無運算</td></tr><tr><td><span class=\"term\" data-term=\"OrdinalScale\">順序尺度</span></td><td>可比較優劣順序</td><td>名次、滿意度等第；&gt;、&lt;</td></tr><tr><td><span class=\"term\" data-term=\"IntervalScale\">等距尺度</span></td><td>可算差距大小，無自然零點</td><td>攝氏溫度、IQ；+、−</td></tr><tr><td><span class=\"term\" data-term=\"RatioScale\">比例尺度</span></td><td>有自然零點，可作乘除</td><td>身高、體重、薪資；+、−、×、÷</td></tr></table>\n<div class=\"warn\"><b>易錯：</b>溫度攝氏／華氏是等距尺度，絕對溫度 K 才是比例尺度；存在「自然零點」是比例尺度的關鍵。</div><div class=\"fig\"><svg viewBox=\"0 0 720 150\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"60\" y=\"94\" width=\"130\" height=\"26\" fill=\"#e8dfc8\" stroke=\"#6f6555\"/><text x=\"125\" y=\"86\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">{name}</text><rect x=\"210\" y=\"68\" width=\"130\" height=\"52\" fill=\"#d7e6e0\" stroke=\"#6f6555\"/><text x=\"275\" y=\"60\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">{name}</text><rect x=\"360\" y=\"42\" width=\"130\" height=\"78\" fill=\"#f3d9c8\" stroke=\"#6f6555\"/><text x=\"425\" y=\"34\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">{name}</text><rect x=\"510\" y=\"16\" width=\"130\" height=\"104\" fill=\"#cfe0d2\" stroke=\"#6f6555\"/><text x=\"575\" y=\"8\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">{name}</text><text x=\"360\" y=\"145\" text-anchor=\"middle\" font-size=\"11\" fill=\"#6f6555\">資訊含量遞增 →</text></svg><div class=\"figcap\">圖 2：測量尺度四階，由低到高資訊含量遞增</div></div>"}, {"id": "1.2.2", "title": "資料之分類", "pg": "p.12", "body": "<p>依性質分：<span class=\"term\" data-term=\"QualitativeData\">屬質資料</span>（類別資料，必為離散）與<span class=\"term\" data-term=\"QuantitativeData\">屬量資料</span>，後者再分：</p>\n<ol class=\"nlist\"><li><span class=\"term\" data-term=\"DiscreteData\">離散型資料</span></li><li><span class=\"term\" data-term=\"ContinuousData\">連續型資料</span></li></ol>\n<p>依來源與涵蓋範圍分：</p>\n<ol class=\"nlist\"><li>原始資料（自行調查蒐集）／次級資料（取自他人整理）</li><li>普查資料（母體資料）／抽樣資料（樣本資料）</li></ol>\n<p>依型態分：</p>\n<ol class=\"nlist\"><li>橫斷面資料（某時點多個體）</li><li>時間序列資料（單一個體隨時間）</li><li>追蹤資料（panel data，多個體隨時間）</li></ol>\n<div class=\"note\"><b>重點：</b>屬質資料即使以數字呈現（如學號、郵遞區號），那個數字也只是分類號，沒有數量意義。</div><div class=\"fig\"><svg viewBox=\"0 0 720 150\" xmlns=\"http://www.w3.org/2000/svg\"><rect x=\"300\" y=\"10\" width=\"120\" height=\"34\" rx=\"7\" fill=\"#eef3f4\" stroke=\"#2c6e9e\"/><text x=\"360\" y=\"31\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">資料 Data</text><line x1=\"360\" y1=\"44\" x2=\"200\" y2=\"70\" stroke=\"#6f6555\"/><line x1=\"360\" y1=\"44\" x2=\"520\" y2=\"70\" stroke=\"#6f6555\"/><rect x=\"120\" y=\"70\" width=\"160\" height=\"32\" rx=\"7\" fill=\"#fbeae2\" stroke=\"#b5542e\"/><text x=\"200\" y=\"90\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">屬質（類別）</text><rect x=\"440\" y=\"70\" width=\"160\" height=\"32\" rx=\"7\" fill=\"#eef3f4\" stroke=\"#2c6e9e\"/><text x=\"520\" y=\"90\" text-anchor=\"middle\" font-size=\"12\" fill=\"#2b251d\">屬量（數值）</text><line x1=\"520\" y1=\"102\" x2=\"430\" y2=\"124\" stroke=\"#6f6555\"/><line x1=\"520\" y1=\"102\" x2=\"610\" y2=\"124\" stroke=\"#6f6555\"/><text x=\"430\" y=\"138\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3a7d44\">離散型</text><text x=\"610\" y=\"138\" text-anchor=\"middle\" font-size=\"11\" fill=\"#3a7d44\">連續型</text></svg><div class=\"figcap\">圖 3：資料分類樹：屬質／屬量 → 離散／連續</div></div>"}]}], "2": [{"id": "2.1", "title": "次數分配", "pg": "p.16", "body": "<p>本節「<b class=\"concept\">次數分配</b>」主題涵蓋下列 3 個小節：屬質資料次數分配表的編製、屬量資料次數分配表的編製、累加次數與相對次數。概念與公式詳見各小節。</p>", "children": [{"id": "2.1.1", "title": "屬質資料次數分配表的編製", "pg": "p.16", "body": "<p><span class=\"concept\">屬質資料</span>（qualitative data，即名義、順序尺度）次數分配表編製步驟：①按類別分組，太小的組合併；②以正字劃記次數；③計算各組次數；④以表格或圖形陳示。</p><ol class=\"nlist\"><li><span class=\"term\" data-term=\"Bar Chart\">長條圖</span>（bar chart）：以長條高度表各類次數，組間須留間隔。</li><li><span class=\"term\" data-term=\"Pie Chart\">圓餅圖</span>（pie chart）：扇形角＝360°×該類相對次數。</li><li><span class=\"term\" data-term=\"Pareto Chart\">柏雷托圖</span>（Pareto chart）：依次數由大到小排序並疊加累加次數線，「其他」組永遠置末。</li></ol>"}, {"id": "2.1.2", "title": "屬量資料次數分配表的編製", "pg": "p.19", "body": "<p><span class=\"concept\">屬量連續資料</span>分組原則：<b class=\"concept\">互斥</b>（mutually exclusive）與<b class=\"concept\">週延</b>（exhaustive）。步驟：排序求全距 <b class=\"sym\">R=X₍ₙ₎−X₍₁₎</b>；定組數 <b class=\"sym\">k</b> 與組距 <b class=\"sym\">h</b>，使 <b class=\"sym\">R≈k×h</b>；再定組限與組界（上/下組界＝上/下組限±半個基本單位），組中點＝(上組限+下組限)/2。</p><div class=\"formula\"><span class=\"f-label\">Sturges 法則</span>建議組數 <b class=\"sym\">k≈1+3.322log₁₀N</b>，h 最好為 5 或 10 的倍數</div><p>適用圖形：<span class=\"term\" data-term=\"Histogram\">直方圖</span>（組間緊密相連以表連續性）、<span class=\"term\" data-term=\"Frequency Polygon\">次數多邊圖</span>（組中點標點後連線，前後各延伸一組）。</p>"}, {"id": "2.1.3", "title": "累加次數與相對次數", "pg": "p.20", "body": "<p><b class=\"concept\">累加次數</b>分以下累加（較常用）與以上累加兩種，對應<span class=\"term\" data-term=\"Ogive\">肩形圖</span>（ogive）；以上、以下肩形圖之交點恰為<b class=\"concept\">中位數</b>。</p><div class=\"formula\"><span class=\"f-label\">相對次數</span><b class=\"sym\">fᵢ/n</b>，即古典機率「相對次數定義」的雛形</div><p>相對次數折線圖對應日後的 pdf；相對累加次數肩形圖對應 cdf。</p>"}]}, {"id": "2.2", "title": "中央趨勢量數", "pg": "p.25", "body": "<p>本節「<b class=\"concept\">中央趨勢量數</b>」主題涵蓋下列 5 個小節：算術平均數、中位數、眾數、截尾平均數、其他中央趨勢量數。概念與公式詳見各小節。</p>", "children": [{"id": "2.2.1", "title": "算術平均數", "pg": "p.25", "body": "<p>定義 2.1：<span class=\"term\" data-term=\"Arithmetic Mean\">算術平均數</span>母體 <b class=\"sym\">μ=(1/N)ΣXᵢ</b>、樣本 <b class=\"sym\">X̄=(1/n)ΣXᵢ</b>，即資料重心。分組資料採集中分配假設：<b class=\"sym\">X̄=Σmᵢfᵢ/Σfᵢ</b>。</p><div class=\"formula\"><span class=\"f-label\">基本性質</span><b class=\"sym\">Σ(Xᵢ−X̄)=0</b>；<b class=\"sym\">Y=X+b⇒Ȳ=X̄+b</b>；<b class=\"sym\">Y=aX⇒Ȳ=aX̄</b>；使離差平方和最小</div><div class=\"warn\">極易受離群值影響，僅適等距、比例尺度；高度偏斜分配不宜用平均數代表中央。</div>"}, {"id": "2.2.2", "title": "中位數", "pg": "p.28", "body": "<p>定義 2.2：<span class=\"term\" data-term=\"Median\">中位數</span>（median）為排序後最中央的數，一半資料≤它、一半≥它，記母體 <b class=\"sym\">η</b>、樣本 <b class=\"sym\">mₑ</b>。n 奇數取第 (n+1)/2 筆；偶數取第 n/2 與 n/2+1 筆平均。分組資料由中位數組內插估計。</p><div class=\"note\"><b>重點：</b>中位數使絕對離差和最小，平移不變、縮放成正比；對離群值<b class=\"concept\">強健</b>（robust），適順序尺度以上。</div>"}, {"id": "2.2.3", "title": "眾數", "pg": "p.29", "body": "<p>定義 2.3：<span class=\"term\" data-term=\"Mode\">眾數</span>（mode）為出現次數最多者，記 <b class=\"sym\">mₒ</b>；可能唯一、多個或不存在，遂有單峰、雙峰、多峰分配。</p><div class=\"formula\"><span class=\"f-label\">三量數關係</span>對稱 <b class=\"sym\">μ=η=mₒ</b>；右偏 <b class=\"sym\">μ≥η≥mₒ</b>；左偏 <b class=\"sym\">mₒ≥η≥μ</b></div><p>分組眾數有 King 插補法、Czuber 法與 <b class=\"proper\">Karl Pearson</b> 經驗式 <b class=\"sym\">mₒ≈3mₑ−2X̄</b>。名義尺度僅能用眾數。</p>"}, {"id": "2.2.4", "title": "截尾平均數", "pg": "p.31", "body": "<p><span class=\"term\" data-term=\"Trimmed Mean\">截尾平均數</span>（trimmed mean）：排序後前後各截去 100p% 再平均，<b class=\"sym\">X̄_tr=[X_(⌈pn⌉+1)+…+X_(n−⌈pn⌉)]/(n−2⌈pn⌉)</b>，實際共截去 2p 比例，建議 p 取 0.1–0.2。</p><p>例 n=200、p=0.2 即刪前後各 40 筆、餘 120 筆平均。算術平均＝0% 截尾平均；中位數＝50% 截尾平均。</p>"}, {"id": "2.2.5", "title": "其他中央趨勢量數", "pg": "p.33", "body": "<p><span class=\"term\" data-term=\"Geometric Mean\">幾何平均數</span> <b class=\"sym\">m_G=(ΠXᵢ)^(1/N)</b>，用於報酬率、成長率等比率平均（須先轉毛報酬率再減 1）；資料含 0 或負數不適用。</p><p><span class=\"term\" data-term=\"Harmonic Mean\">調和平均數</span> <b class=\"sym\">m_H=N/Σ(1/Xᵢ)</b>，用於等距離求平均速度、等金額求平均價格。</p><div class=\"formula\"><span class=\"f-label\">算幾不等式</span>資料皆正時 <b class=\"sym\">μ≥m_G≥m_H</b>，僅全相等時取等</div>"}]}, {"id": "2.3", "title": "位置量數", "pg": "p.36", "body": "<p>本節「<b class=\"concept\">位置量數</b>」主題涵蓋下列 3 個小節：百分位數、十分位數、四分位數。概念與公式詳見各小節。</p>", "children": [{"id": "2.3.1", "title": "百分位數", "pg": "p.36", "body": "<p>定義 2.6：第 r 個<span class=\"term\" data-term=\"Percentile\">百分位數</span> <b class=\"sym\">P_r</b>——有 r% 資料≤P_r、(100−r)% 資料≥P_r。排序後令位置 <b class=\"sym\">i=n×r/100</b>：i 整數取第 i 與 i+1 筆平均，否則取第 ⌈i⌉ 筆。</p><p>另一常見演算法令 <b class=\"sym\">j=(n+1)r/100</b> 做線性內插；分組資料以百分位數組內插估計。</p>"}, {"id": "2.3.2", "title": "十分位數", "pg": "p.37", "body": "<p><span class=\"term\" data-term=\"Decile\">十分位數</span>（decile）把排序資料切 9 刀成 10 等份，記 <b class=\"sym\">D₁,…,D₉</b>，<b class=\"sym\">Dᵢ=P_{10i}</b>；其中 <b class=\"sym\">D₅=P₅₀=mₑ</b>。<b class=\"sym\">D₁=P₁₀</b>、<b class=\"sym\">D₉=P₉₀</b>，可用於描述前 10%、後 10% 等位置。</p>"}, {"id": "2.3.3", "title": "四分位數", "pg": "p.38", "body": "<p><span class=\"term\" data-term=\"Quartile\">四分位數</span>（quartile）切 3 刀成 4 等份：<b class=\"sym\">Q₁=P₂₅</b>（下四分位）、<b class=\"sym\">Q₂=D₅=P₅₀=mₑ</b>、<b class=\"sym\">Q₃=P₇₅</b>（上四分位）。Q₂ 一詞罕用，因即中位數。無論原始或分組資料，十分位、四分位皆可視為對應百分位數直接求算。</p>"}]}, {"id": "2.4", "title": "分散趨勢量數", "pg": "p.41", "body": "<p>本節「<b class=\"concept\">分散趨勢量數</b>」主題涵蓋下列 4 個小節：變異數、標準差、變異係數、其他分散趨勢量數。概念與公式詳見各小節。</p>", "children": [{"id": "2.4.1", "title": "變異數", "pg": "p.41", "body": "<p>定義 2.7：母體<span class=\"term\" data-term=\"Variance\">變異數</span> <b class=\"sym\">σ²=(1/N)Σ(Xᵢ−μ)²=(1/N)ΣXᵢ²−μ²</b>；樣本 <b class=\"sym\">S²=(1/(n−1))Σ(Xᵢ−X̄)²</b>。</p><div class=\"note\"><b>重點：</b>樣本除 n−1 是因 X̄ 取代 μ 損失一個自由度（df=n−1），使 S² 為 σ² 的不偏估計。</div><div class=\"formula\"><span class=\"f-label\">基本性質</span><b class=\"sym\">Y=X+b⇒σ_Y²=σ_X²</b>（平移不變）；<b class=\"sym\">Y=aX⇒σ_Y²=a²σ_X²</b></div>"}, {"id": "2.4.2", "title": "標準差", "pg": "p.44", "body": "<p>定義 2.8：<span class=\"term\" data-term=\"Standard Deviation\">標準差</span> <b class=\"sym\">σ=√σ²</b>、<b class=\"sym\">S=√S²</b>，把變異數開根號以還原與原資料相同的單位。性質同變異數：平移不變、<b class=\"sym\">Y=aX⇒σ_Y=|a|σ_X</b>。例：資料 4,8,10,10,15,18,19,19,23,28 的 σ²=49.24，σ≈7.02。</p>"}, {"id": "2.4.3", "title": "變異係數", "pg": "p.46", "body": "<p>定義 2.9：<span class=\"term\" data-term=\"Coefficient of Variation\">變異係數</span> <b class=\"sym\">CV=(σ/μ)×100%</b>（母體）或 <b class=\"sym\">CV=(S/X̄)×100%</b>（樣本）。</p><p>為無單位的<b class=\"concept\">相對</b>分散指標，用於比較尺度差距過大或單位不同的兩筆資料（如大象 vs 螞蟻體重）。</p>"}, {"id": "2.4.4", "title": "其他分散趨勢量數", "pg": "p.46", "body": "<p><span class=\"term\" data-term=\"Range\">全距</span> <b class=\"sym\">R=X_(n)−X_(1)</b>，僅用最大、最小兩點，易受離群值影響；經驗上 <b class=\"sym\">S≈R/4</b>。</p><p><span class=\"term\" data-term=\"Interquartile Range\">四分位距</span> <b class=\"sym\">IQR=Q₃−Q₁</b>，強健；鐘形分配 <b class=\"sym\">IQR≈1.35σ</b>。四分位差 <b class=\"sym\">QD=IQR/2</b>。<span class=\"term\" data-term=\"Mean Absolute Deviation\">平均絕對差</span> <b class=\"sym\">MAD=(1/n)Σ|Xᵢ−X̄|</b>，較不受離群值影響但代數性質差。</p>"}]}, {"id": "2.5", "title": "其他量數與課題", "pg": "p.50", "body": "<p>本節「<b class=\"concept\">其他量數與課題</b>」主題涵蓋下列 3 個小節：z 分數、鐘形分配的經驗法則、偵測離群值。概念與公式詳見各小節。</p>", "children": [{"id": "2.5.1", "title": "z 分數", "pg": "p.50", "body": "<p>定義 2.10：<span class=\"term\" data-term=\"Z-score\">z 分數</span>為單一觀察值的相對位置 <b class=\"sym\">zᵢ=(Xᵢ−μ)/σ</b>（母體）或 <b class=\"sym\">zᵢ=(Xᵢ−X̄)/S</b>（樣本）。</p><p>z=2 表該點在平均數右 2 倍標準差處；<b class=\"sym\">z&lt;0</b> 表小於平均。用於跨資料集比較個別觀察值，即機率論的標準化。例：統計 66(μ=50,σ=11) z=1.45；微積分 82(μ=73,σ=9) z=1.0，故統計表現較傑出。</p>"}, {"id": "2.5.2", "title": "鐘形分配的經驗法則", "pg": "p.51", "body": "<p>對鐘形（常態）分配有<span class=\"term\" data-term=\"Empirical Rule\">經驗法則</span>（68-95-99.7 法則）：約 68% 資料落於 <b class=\"sym\">μ±σ</b>；約 95% 落於 <b class=\"sym\">μ±2σ</b>；約 99.7% 落於 <b class=\"sym\">μ±3σ</b>。此即三標準差法則，源自常態分配機率表。</p>"}, {"id": "2.5.3", "title": "偵測離群值", "pg": "p.51", "body": "<p><span class=\"term\" data-term=\"Outlier\">離群值</span>（outlier）為異常過大或過小值，可能源自調查、測量或登記誤差。</p><ol class=\"nlist\"><li>z 分數小於 −3 或大於 3。</li><li>盒鬚圖法：小於 <b class=\"sym\">Q₁−1.5·IQR</b> 或大於 <b class=\"sym\">Q₃+1.5·IQR</b>。</li></ol>"}]}, {"id": "2.6", "title": "分配形狀量數", "pg": "p.53", "body": "<p>本節「<b class=\"concept\">分配形狀量數</b>」主題涵蓋下列 3 個小節：動差體系、樣本偏態係數、樣本峰態係數。概念與公式詳見各小節。</p>", "children": [{"id": "2.6.1", "title": "動差體系", "pg": "p.53", "body": "<p>定義 2.11：第 r 階樣本<span class=\"term\" data-term=\"Sample Moment\">動差</span>——原動差 <b class=\"sym\">mᵣ'=(1/n)ΣXᵢʳ</b>；主動差 <b class=\"sym\">mᵣ=(1/n)Σ(Xᵢ−X̄)ʳ</b>。</p><div class=\"note\"><b>重點：</b><b class=\"proper\">Karl Pearson</b> 創此體系——一階表位置、二階表分散、三階表偏態、四階表峰態。可用原動差轉主動差：<b class=\"sym\">m₂=m₂'−(m₁')²</b>、<b class=\"sym\">m₃=m₃'−3m₂'m₁'+2(m₁')³</b>。</div>"}, {"id": "2.6.2", "title": "樣本偏態係數", "pg": "p.55", "body": "<p>定義 2.13：動差法<span class=\"term\" data-term=\"Skewness\">樣本偏態係數</span> <b class=\"sym\">a₃=m₃/S³</b>。因離差取三次方保留正負號：</p><div class=\"formula\"><span class=\"f-label\">判讀</span><b class=\"sym\">a₃&gt;0</b> 右偏（正偏，右尾長）；<b class=\"sym\">a₃=0</b> 對稱；<b class=\"sym\">a₃&lt;0</b> 左偏（負偏）</div><p>另 <b class=\"proper\">Pearson</b> 法 <b class=\"sym\">sk_p=3(X̄−mₑ)/S</b> 或 <b class=\"sym\">(X̄−mₒ)/S</b>。</p>"}, {"id": "2.6.3", "title": "樣本峰態係數", "pg": "p.56", "body": "<p>定義 2.15：<span class=\"term\" data-term=\"Kurtosis\">樣本峰態係數</span> <b class=\"sym\">a₄=m₄/S⁴</b>；超額峰態 <b class=\"sym\">γ₂=a₄−3</b>。以常態為基準：</p><div class=\"formula\"><span class=\"f-label\">三類峰態</span><b class=\"sym\">a₄&gt;3</b> 高狹峰 leptokurtic（肥尾）；<b class=\"sym\">a₄=3</b> 常態峰 mesokurtic；<b class=\"sym\">a₄&lt;3</b> 低闊峰 platykurtic（瘦尾）</div>"}]}, {"id": "2.7", "title": "探測性資料分析", "pg": "p.60", "body": "<p>本節「<b class=\"concept\">探測性資料分析</b>」主題涵蓋下列 3 個小節：五數字摘要、盒鬚圖、莖葉圖。概念與公式詳見各小節。</p>", "children": [{"id": "2.7.1", "title": "五數字摘要", "pg": "p.60", "body": "<p><span class=\"term\" data-term=\"Five-number Summary\">五數字摘要</span>（five-number summary）：<b class=\"sym\">X_(1)</b>、<b class=\"sym\">Q₁</b>、<b class=\"sym\">mₑ</b>、<b class=\"sym\">Q₃</b>、<b class=\"sym\">X_(n)</b>。</p><p>兩兩之間各含約 25% 資料；相鄰數字接近處密度大、差距大處密度小，可約略看出分配位置與形狀。</p>"}, {"id": "2.7.2", "title": "盒鬚圖", "pg": "p.60", "body": "<p>由 <b class=\"proper\">John Tukey</b> 創，<span class=\"term\" data-term=\"Boxplot\">盒鬚圖</span>（boxplot）為五數字摘要的圖形化：以 Q₁、Q₃ 畫盒（盒寬＝IQR），中線畫 mₑ。</p><ol class=\"nlist\"><li>Q₁ 下延 1.5·IQR、Q₃ 上延 1.5·IQR 為<b class=\"concept\">內籬</b>；延 3·IQR 為<b class=\"concept\">外籬</b>。</li><li>內外籬間為溫和離群值（*），外籬外為嚴重離群值（○）；鬚線畫到內籬內最近端點。</li><li>多組資料並排、同一量尺比較，稱並排盒形圖。</li></ol>"}, {"id": "2.7.3", "title": "莖葉圖", "pg": "p.62", "body": "<p><span class=\"term\" data-term=\"Stem-and-Leaf\">莖葉圖</span>（stem-and-leaf display）形似直方圖，但保留原始數值與排序，且易繪。葉過長可分為伸展莖葉圖；資料筆數過多則不適用。兩筆資料比較時用背靠背莖葉圖。</p>"}]}], "3": [{"id": "3.1", "title": "基本概念與機率定義", "pg": "p.65", "body": "<p>本節「<b class=\"concept\">基本概念與機率定義</b>」主題涵蓋下列 2 個小節：隨機實驗、機率定義。概念與公式詳見各小節。</p>", "children": [{"id": "3.1.1", "title": "隨機實驗", "pg": "p.66", "body": "<p>定義 3.1：<span class=\"term\" data-term=\"Random Experiment\">隨機實驗</span>四特性——執行前可列出所有可能結果、結果不能事先預測、可相同條件重複、大量重複後呈現隨機規律。每次執行稱一次試驗。</p><p>定義 3.2：所有可能結果集合為<span class=\"term\" data-term=\"Sample Space\">樣本空間</span> S，元素為樣本點；分離散與連續兩類。定義 3.3：<span class=\"term\" data-term=\"Event\">事件</span> A 為 S 的子集合，出現結果 ω∈A 稱 A 發生。<span class=\"term\" data-term=\"Mutually Exclusive\">互斥事件</span> <b class=\"sym\">A∩B=∅</b>，純集合概念不需機率。另有確定事件 S、虛無事件 ∅、基本事件。</p>"}, {"id": "3.1.2", "title": "機率定義", "pg": "p.68", "body": "<p>三種機率定義：</p><ol class=\"nlist\"><li><span class=\"term\" data-term=\"Classical Probability\">古典（先天）機率</span> <b class=\"sym\">P(A)=N(A)/N(S)</b>，假設樣本點等可能且有限。</li><li><span class=\"term\" data-term=\"Relative Frequency Probability\">相對次數（客觀/經驗/統計式）機率</span> <b class=\"sym\">P(A)=lim_{n→∞}n_A/n</b>，可處理無限樣本空間但未必收斂。</li><li><span class=\"term\" data-term=\"Subjective Probability\">主觀（個人）機率</span>為依證據對事件發生的相信程度，可用於不可重複場合但無客觀標準。</li></ol>"}]}, {"id": "3.2", "title": "公設化機率定義", "pg": "p.72", "body": "<p>本節「<b class=\"concept\">公設化機率定義</b>」主題涵蓋下列 2 個小節：Kolmogorov 公設化機率、重要機率定理。概念與公式詳見各小節。</p>", "children": [{"id": "3.2.1", "title": "Kolmogorov 公設化機率", "pg": "p.72", "body": "<p>定義 3.8：<b class=\"proper\">Kolmogorov</b> <span class=\"term\" data-term=\"Kolmogorov Axioms\">三公設</span>——</p><div class=\"formula\"><span class=\"f-label\">三公設</span>①<b class=\"sym\">P(A)≥0</b>；②<b class=\"sym\">P(S)=1</b>；③可數可加性：兩兩互斥 <b class=\"sym\">P(∪Aᵢ)=ΣP(Aᵢ)</b></div><p>樣本空間有限時退化成有限可加性。滿足三公設的集合函數 P(·) 稱<span class=\"term\" data-term=\"Probability Measure\">機率測度</span>，整個機率論體系由此演繹而來。</p>"}, {"id": "3.2.2", "title": "重要機率定理", "pg": "p.74", "body": "<p>由三公設推出：餘集 <b class=\"sym\">P(A')=1−P(A)</b>；<b class=\"sym\">0≤P(A)≤1</b>；<b class=\"sym\">P(∅)=0</b>（反不真：機率 0 未必是虛無事件）。子集性：<b class=\"sym\">A⊂B⇒P(A)≤P(B)</b>。</p><div class=\"formula\"><span class=\"f-label\">加法規則</span><b class=\"sym\">P(A∪B)=P(A)+P(B)−P(A∩B)</b>；互斥時退化成相加</div><div class=\"formula\"><span class=\"f-label\">Boole 不等式</span><b class=\"sym\">P(A∪B)≤P(A)+P(B)</b>，等號於互斥時成立；多事件版即排容原理的上界</div>"}]}, {"id": "3.3", "title": "條件機率與獨立事件", "pg": "p.80", "body": "<p>本節「<b class=\"concept\">條件機率與獨立事件</b>」主題涵蓋下列 2 個小節：條件機率之定義、獨立事件。概念與公式詳見各小節。</p>", "children": [{"id": "3.3.1", "title": "條件機率之定義", "pg": "p.80", "body": "<p>定義 3.20：若 <b class=\"sym\">P(B)&gt;0</b>，<span class=\"term\" data-term=\"Conditional Probability\">條件機率</span> <b class=\"sym\">P(A|B)=P(A∩B)/P(B)</b>；即把 B 視為縮小後的新樣本空間。同理 <b class=\"sym\">P(B|A)=P(A∩B)/P(A)</b>。</p><div class=\"note\"><b>重點：</b>非條件機率可視為 <b class=\"sym\">P(A)=P(A|S)</b>。聯合機率出現在列聯表格子、邊際機率在邊緣。</div>"}, {"id": "3.3.2", "title": "獨立事件", "pg": "p.85", "body": "<p>定義 3.24：<span class=\"term\" data-term=\"Independence\">獨立</span> A⊥B 有三等價式：<b class=\"sym\">P(A|B)=P(A)</b>、<b class=\"sym\">P(B|A)=P(B)</b>、<b class=\"sym\">P(A∩B)=P(A)P(B)</b>。</p><div class=\"warn\">獨立用機率定義，與純集合概念的互斥完全不同——互斥且 P(A),P(B)&gt;0 時反而相依。A 恆與 S、∅ 獨立。賭徒謬誤即誤把獨立當成平均數還原。</div>"}]}, {"id": "3.4", "title": "全機率定理與貝氏定理", "pg": "p.93", "body": "<p>本節「<b class=\"concept\">全機率定理與貝氏定理</b>」主題涵蓋下列 2 個小節：分割、全機率定理與機率樹、貝氏定理。概念與公式詳見各小節。</p>", "children": [{"id": "3.4.1", "title": "分割、全機率定理與機率樹", "pg": "p.93", "body": "<p>定義 3.27：A₁,…,Aₙ 為 S 的<span class=\"term\" data-term=\"Partition\">分割</span>，若兩兩互斥且集體包含 <b class=\"sym\">∪Aᵢ=S</b>；最簡單分割為 A 與 A'。</p><div class=\"formula\"><span class=\"f-label\">全機率定理</span><b class=\"sym\">P(B)=ΣP(Aᵢ∩B)=ΣP(B|Aᵢ)P(Aᵢ)</b></div><p>可用<span class=\"term\" data-term=\"Probability Tree\">機率樹</span>（tree diagram）逐層分支呈現。</p>"}, {"id": "3.4.2", "title": "貝氏定理", "pg": "p.97", "body": "<p>定理 3.29：<span class=\"term\" data-term=\"Bayes Theorem\">貝氏定理</span> <b class=\"sym\">P(A_k|B)=P(B|A_k)P(A_k)/ΣP(B|A_i)P(A_i)</b>，分母即全機率。</p><div class=\"note\"><b>重點：</b><b class=\"sym\">P(A_k)</b> 為<b class=\"concept\">事前機率</b>，求得的 <b class=\"sym\">P(A_k|B)</b> 為<b class=\"concept\">事後機率</b>——看到新證據 B 後重新調整各分割假設的機率。紀念 <b class=\"proper\">Thomas Bayes</b>。</div>"}]}], "4": [{"id": "4.1", "title": "隨機變數與機率函數", "pg": "p.103", "body": "<p>本節「<b class=\"concept\">隨機變數與機率函數</b>」主題涵蓋下列 4 個小節：隨機變數之定義、離散型隨機變數之機率函數、連續型隨機變數之機率函數、混合型隨機變數之機率函數。概念與公式詳見各小節。</p>", "children": [{"id": "4.1.1", "title": "隨機變數之定義", "pg": "p.103", "body": "<p><b class='concept'><span class=\"term\" data-term=\"random-variable\">隨機變數</span></b>（random variable）是將樣本空間 Ω 的每一個「結果」對應到一個實數的函數，記為 <b class='sym'>X(ω)</b>。它把機率問題轉化為可計算的數量問題，是<b class='concept'>隨機現象數量化</b>的工具。</p><p>隨機變數依其值域分為：<b class='concept'>離散型</b>（discrete）值域為可數集合，如擲骰點數；<b class='concept'>連續型</b>（continuous）值域為區間，如身高、時間；以及<b class='concept'>混合型</b>（mixed）。</p><div class='note'>隨機變數本身是「函數」，但因其輸出不確定，故稱「隨機」。後面所有分配、<span class=\"term\" data-term=\"expected-value\">期望值</span>、<span class=\"term\" data-term=\"variance\">變異數</span>皆圍繞它展開。</div>"}, {"id": "4.1.2", "title": "離散型隨機變數之機率函數", "pg": "p.106", "body": "<p>離散型<span class=\"term\" data-term=\"random-variable\">隨機變數</span> <b class='sym'>X</b> 的<b class='concept'><span class=\"term\" data-term=\"pmf\">機率質量函數</span></b>（probability mass function, pmf）定義為 <b class='sym'>f(x)=P(X=x)</b>，滿足：</p><ol class='nlist'><li><b class='sym'>f(x)≥0</b>，對所有 <b class='sym'>x∈R<sub>X</sub></b>；</li><li><b class='sym'>Σ f(x)=1</b>，對所有可能值加總。</li></ol><p>其<b class='concept'>累積分配函數</b>（cdf）為 <b class='sym'>F(x)=P(X≤x)=Σ<sub>t≤x</sub> f(t)</b>，為階梯函數，在每個可能值處上升。</p><div class='formula'><span class='f-label'>pmf 基本性質</span> f(x)=P(X=x)≥0；Σ<sub>x</sub> f(x)=1；F(x)=Σ<sub>t≤x</sub> f(t)</div>"}, {"id": "4.1.3", "title": "連續型隨機變數之機率函數", "pg": "p.108", "body": "<p>連續型<span class=\"term\" data-term=\"random-variable\">隨機變數</span> <b class='sym'>X</b> 的<b class='concept'><span class=\"term\" data-term=\"pdf\">機率密度函數</span></b>（probability density function, pdf）<b class='sym'>f(x)</b> 滿足：</p><ol class='nlist'><li><b class='sym'>f(x)≥0</b>；</li><li><b class='sym'>∫ f(x)dx=1</b>（全域積分為 1）。</li></ol><p>其機率為密度曲線下的面積：<b class='sym'>P(a≤X≤b)=∫<sub>a</sub><sup>b</sup> f(x)dx</b>，cdf 為 <b class='sym'>F(x)=∫<sub>-∞</sub><sup>x</sup> f(t)dt</b>。</p><div class='warn'>連續型隨機變數在任一單點的機率為 0：P(X=c)=0，故「&lt;」與「≤」在計算機率時沒有差異；<b class='sym'>f(x)</b> 是密度而非機率，可大於 1。</div>"}, {"id": "4.1.4", "title": "混合型隨機變數之機率函數", "pg": "p.110", "body": "<p><b class='concept'>混合型<span class=\"term\" data-term=\"random-variable\">隨機變數</span></b>（mixed-type random variable）同時具有離散與連續成分：其 cdf 既有<b class='concept'>連續段落</b>，又在某些點上有<b class='concept'>跳躍</b>（躍升量＝該點的離散機率）。</p><p>典型例子為「截尾後的等待時間」：在 0 點有一個點機率（故障在保固內立即發生），其右則為連續的密度函數。</p><div class='formula'><span class='f-label'>混合型 cdf</span> F(x) 在離散點 c 的躍升量為 F(c)−F(c⁻)=P(X=c)；其餘區間以密度積分表達。</div>"}]}, {"id": "4.2", "title": "期望值、變異數與標準差", "pg": "p.112", "body": "<p>本節「<b class=\"concept\">期望值、變異數與標準差</b>」主題涵蓋下列 3 個小節：期望值、變異數與標準差、期望值與變異數的近似求算。概念與公式詳見各小節。</p>", "children": [{"id": "4.2.1", "title": "期望值", "pg": "p.112", "body": "<p><span class=\"term\" data-term=\"random-variable\">隨機變數</span> <b class='sym'>X</b> 的<b class='concept'><span class=\"term\" data-term=\"expected-value\">期望值</span></b>（expected value，又稱平均數、平均數）定義為其可能值的機率加權和，反映分配的<b class='concept'>中心位置</b>。</p><div class='formula'><span class='f-label'>期望值定義</span> 離散：E(X)=Σ x·f(x)；連續：E(X)=∫ x·f(x)dx</div><p><b class='concept'>隨機變數函數的期望值</b>（勞動大力法則）：<b class='sym'>E[g(X)]=Σ g(x)f(x)</b>（離散）或 <b class='sym'>∫ g(x)f(x)dx</b>（連續），無需先求 g(X) 的分配。</p><div class='note'>性質：E(aX+b)=aE(X)+b；E(X+Y)=E(X)+E(Y)（無需<span class=\"term\" data-term=\"independence\">獨立</span>）。</div>"}, {"id": "4.2.2", "title": "變異數與標準差", "pg": "p.118", "body": "<p><b class='concept'><span class=\"term\" data-term=\"variance\">變異數</span></b>（variance）衡量<span class=\"term\" data-term=\"random-variable\">隨機變數</span>圍繞其<span class=\"term\" data-term=\"expected-value\">期望值</span>的<b class='concept'>離散程度</b>，定義為「偏離平方的期望值」：</p><div class='formula'><span class='f-label'>變異數</span> Var(X)=E[(X−E(X))²]=E(X²)−[E(X)]²</div><p><b class='concept'><span class=\"term\" data-term=\"standard-deviation\">標準差</span></b>（standard deviation）<b class='sym'>σ=√Var(X)</b>，與 X 同單位。</p><div class='note'>性質：Var(aX+b)=a²Var(X)（加常數不變）；Var(X)≥0；若 X 為常數則 Var=0。E(X²) 稱二級原動差。</div>"}, {"id": "4.2.3", "title": "期望值與變異數的近似求算", "pg": "p.125", "body": "<p>當 <b class='sym'>g(X)</b> 非線性、直接積分困難時，可對 <b class='sym'>g(X)</b> 在 <b class='sym'>μ=E(X)</b> 處做<b class='concept'>一階泰勒展開</b>求近似：</p><div class='formula'><span class='f-label'>delta method 近似</span> E[g(X)]≈g(μ)；Var[g(X)]≈[g′(μ)]²·Var(X)</div><p>此為<b class='concept'>近似求算</b>（delta method）的核心：用一階導數把非線性函數局部線性化。</p><div class='warn'>近似只在 X 集中於 μ 附近（<span class=\"term\" data-term=\"variance\">變異數</span>小）時可靠；展開點須取在 X 的<span class=\"term\" data-term=\"expected-value\">期望值</span>附近，否則誤差很大。</div>"}]}, {"id": "4.3", "title": "中位數、眾數與分位數", "pg": "p.130", "body": "<p>本節「<b class=\"concept\">中位數、眾數與分位數</b>」主題涵蓋下列 3 個小節：中位數、分位數、眾數。概念與公式詳見各小節。</p>", "children": [{"id": "4.3.1", "title": "中位數", "pg": "p.130", "body": "<p><b class='concept'>中位數</b>（median）<b class='sym'>m</b> 是把機率分配「切成兩半」的值，滿足 <b class='sym'>P(X≤m)≥1/2</b> 且 <b class='sym'>P(X≥m)≥1/2</b>，即 <b class='sym'>F(m)=1/2</b>。</p><p>中位數是一種<b class='concept'>位置量數</b>，對極端值（outlier）不敏感；相對於<span class=\"term\" data-term=\"expected-value\">期望值</span>，它更能代表「典型值」。</p><div class='note'>對稱分配且期望值存在時，中位數＝期望值；右偏分配時中位數&lt;期望值；左偏則反之。</div>"}, {"id": "4.3.2", "title": "分位數", "pg": "p.133", "body": "<p><b class='concept'>分位數</b>（quantile）<b class='sym'>x<sub>p</sub></b> 滿足 <b class='sym'>F(x<sub>p</sub>)=p</b>，即 P(X≤x<sub>p</sub>)=p。p=0.25、0.5、0.75 分別為<b class='concept'>第一、二、三分位數</b>（Q1、Q2、Q3）。</p><p><b class='concept'>四分位距</b>（IQR）=Q3−Q1，是抗干擾的離散量數，常用於偵測離群值。</p><div class='formula'><span class='f-label'>分位數定義</span> F(x<sub>p</sub>)=P(X≤x<sub>p</sub>)=p；中位數即 p=1/2 之分位數。</div>"}, {"id": "4.3.3", "title": "眾數", "pg": "p.136", "body": "<p><b class='concept'>眾數</b>（mode）<b class='sym'>m₀</b> 是使機率（密度）達到<b class='concept'>最大值</b>的<span class=\"term\" data-term=\"random-variable\">隨機變數</span>值。</p><ul><li>離散型：使 <b class='sym'>f(x)</b> 最大的 x；</li><li>連續型：解 <b class='sym'>f′(x)=0</b>（取最大值之點）。</li></ul><div class='note'>一個分配可有多個眾數（雙峰、多峰）。對稱單峰分配，眾數＝中位數＝<span class=\"term\" data-term=\"expected-value\">期望值</span>；右偏時眾數&lt;中位數&lt;期望值。</div>"}]}, {"id": "4.4", "title": "動差與動差生成函數", "pg": "p.140", "body": "<p>本節「<b class=\"concept\">動差與動差生成函數</b>」主題涵蓋下列 3 個小節：動差體系、動差生成函數與機率生成函數、其他生成函數。概念與公式詳見各小節。</p>", "children": [{"id": "4.4.1", "title": "動差體系", "pg": "p.140", "body": "<p><b class='concept'>動差</b>（moments）是描述分配形狀的一套系統量數。<b class='concept'>k 級原動差</b>定義為 <b class='sym'>μ′<sub>k</sub>=E(X<sup>k</sup>)</b>；<b class='concept'>k 級主動差</b>（對中心動差）為 <b class='sym'>μ<sub>k</sub>=E[(X−μ)<sup>k</sup>]</b>。</p><div class='formula'><span class='f-label'>常用動差</span> μ′₁=E(X)=μ（一級原動差即<span class=\"term\" data-term=\"expected-value\">期望值</span>）；μ₂=Var(X)（二級主動差即<span class=\"term\" data-term=\"variance\">變異數</span>）；μ₃、μ₄ 用於偏態與峰態。</div><p><b class='concept'>偏態係數</b> γ₃=μ₃/σ³（=0 對稱、&gt;0 右偏）；<b class='concept'>峰態係數</b> γ₄=μ₄/σ⁴（=3 常態峰、&gt;3 高狹峰）。</p>"}, {"id": "4.4.2", "title": "動差生成函數與機率生成函數", "pg": "p.144", "body": "<p><b class='concept'><span class=\"term\" data-term=\"mgf\">動差生成函數</span></b>（moment generating function, mgf）定義為 <b class='sym'>M(t)=E(e<sup>tX</sup>)</b>，在 t=0 附近存在時唯一決定分配。</p><div class='formula'><span class='f-label'>mgf 與動差</span> M(t)=Σ μ′<sub>k</sub>t<sup>k</sup>/k!；μ′<sub>k</sub>=M<sup>(k)</sup>(0)</div><p><b class='concept'>機率生成函數</b>（probability generating function, pgf）<b class='sym'>G(s)=E(s<sup>X</sup>)=Σ s<sup>x</sup>f(x)</b>，僅用於非負整數離散型。</p><div class='note'>mgf 性質：M<sub>aX+b</sub>(t)=e<sup>bt</sup>M(at)；<span class=\"term\" data-term=\"independence\">獨立</span>變數和的 mgf 為各自 mgf 相乘。mgf 唯一 → 反推分配。</div>"}, {"id": "4.4.3", "title": "其他生成函數", "pg": "p.149", "body": "<p>除 mgf、pgf 外，常用的「生成函數」還有：</p><ul><li><b class='concept'>累積<span class=\"term\" data-term=\"mgf\">動差生成函數</span></b>（cumulant）<b class='sym'>K(t)=ln M(t)</b>，其導數給出累積量數 κ<sub>k</sub>；</li><li><b class='concept'>特徵函數</b>（characteristic function）<b class='sym'>φ(t)=E(e<sup>itX</sup>)</b>，對所有分配皆存在，是唯一且完備的分配刻劃工具。</li></ul><div class='note'>mgf 可能不存在（如柯西分配），此時改用特徵函數；特徵函數與分配一對一對應。</div>"}]}, {"id": "4.5", "title": "不等式", "pg": "p.153", "body": "<p>本節「<b class=\"concept\">不等式</b>」主題涵蓋下列 3 個小節：Markov 不等式、Chebyshev 不等式、Jensen 不等式。概念與公式詳見各小節。</p>", "children": [{"id": "4.5.1", "title": "Markov 不等式", "pg": "p.153", "body": "<p><b class='proper'>Markov</b> 不等式給出非負<span class=\"term\" data-term=\"random-variable\">隨機變數</span>「遠離 0」的機率上限：</p><div class='formula'><span class='f-label'>Markov 不等式</span> X≥0 時，P(X≥a) ≤ E(X)/a，對任意 a&gt;0。</div><p>它僅需知道<span class=\"term\" data-term=\"expected-value\">期望值</span>，不需知道完整分配，是最基本的<b class='concept'>機率界限</b>。</p><div class='note'>只適用 X 為非負隨機變數；是推導 Chebyshev 不等式與<span class=\"term\" data-term=\"lln\">大數法則</span>的起點。</div>"}, {"id": "4.5.2", "title": "Chebyshev 不等式", "pg": "p.154", "body": "<p><b class='proper'>Chebyshev</b> 不等式把偏離<span class=\"term\" data-term=\"expected-value\">期望值</span>的機率用<span class=\"term\" data-term=\"variance\">變異數</span>控制住，適用於<b class='concept'>任意分配</b>：</p><div class='formula'><span class='f-label'>Chebyshev 不等式</span> P(|X−μ|≥kσ) ≤ 1/k²；或 P(|X−μ|&lt;kσ) ≥ 1−1/k²。</div><p>它告訴我們：不論分配形狀，大部分機率集中在期望值附近的 k 個<span class=\"term\" data-term=\"standard-deviation\">標準差</span>內。</p><div class='note'>是弱<span class=\"term\" data-term=\"lln\">大數法則</span>的證明工具；不需<span class=\"term\" data-term=\"independence\">獨立</span>、不需特定分配，只要期望值與變異數有限即可。</div>"}, {"id": "4.5.3", "title": "Jensen 不等式", "pg": "p.158", "body": "<p><b class='proper'>Jensen</b> 不等式描述<b class='concept'>凸/凹函數</b>作用在<span class=\"term\" data-term=\"random-variable\">隨機變數</span>上的方向性：</p><div class='formula'><span class='f-label'>Jensen 不等式</span> g 為凸函數時，E[g(X)] ≥ g(E(X))；g 為凹函數時反向。</div><p>例如 ln 為凹函數，故 E[ln X] ≤ ln E(X)；平方為凸函數，故 E(X²)≥[E(X)]²（即 Var(X)≥0）。</p><div class='note'>是風險趨避、效用函數與資訊理論中的核心不等式。</div>"}]}], "5": [{"id": "5.1", "title": "多元隨機變數之機率函數與期望值", "pg": "p.161", "body": "<p>本節「<b class=\"concept\">多元隨機變數之機率函數與期望值</b>」主題涵蓋下列 3 個小節：二元離散型隨機變數之機率函數、二元連續型隨機變數之機率函數、多元隨機變數之期望值。概念與公式詳見各小節。</p>", "children": [{"id": "5.1.1", "title": "二元離散型隨機變數之機率函數", "pg": "p.161", "body": "<p>二元離散型<span class=\"term\" data-term=\"random-variable\">隨機變數</span> (X,Y) 的<b class='concept'>聯合 pmf</b> <b class='sym'>f(x,y)=P(X=x,Y=y)</b>，滿足 f(x,y)≥0 且 ΣΣ f(x,y)=1。</p><p><b class='concept'>邊際 pmf</b>：f<sub>X</sub>(x)=Σ<sub>y</sub> f(x,y)，f<sub>Y</sub>(y)=Σ<sub>x</sub> f(x,y)。</p><div class='formula'><span class='f-label'>聯合 pmf</span> f(x,y)=P(X=x,Y=y)；邊際：f<sub>X</sub>(x)=Σ<sub>y</sub> f(x,y)</div><div class='note'>聯合 pmf 通常以列聯表呈現；將某一欄（列）全部加總即得另一變數的邊際分配。</div>"}, {"id": "5.1.2", "title": "二元連續型隨機變數之機率函數", "pg": "p.164", "body": "<p>二元連續型<span class=\"term\" data-term=\"random-variable\">隨機變數</span> (X,Y) 的<b class='concept'>聯合 pdf</b> <b class='sym'>f(x,y)</b> 滿足 f(x,y)≥0 且 ∫∫ f(x,y)dxdy=1，機率為曲面下的體積。</p><p><b class='concept'>邊際 pdf</b>：f<sub>X</sub>(x)=∫ f(x,y)dy，f<sub>Y</sub>(y)=∫ f(x,y)dx。</p><div class='formula'><span class='f-label'>聯合 pdf</span> P((X,Y)∈A)=∫∫<sub>A</sub> f(x,y)dxdy；邊際 f<sub>X</sub>(x)=∫ f(x,y)dy</div>"}, {"id": "5.1.3", "title": "多元隨機變數之期望值", "pg": "p.172", "body": "<p>二元函數 g(X,Y) 的<span class=\"term\" data-term=\"expected-value\">期望值</span>為 <b class='sym'>E[g(X,Y)]=ΣΣ g(x,y)f(x,y)</b>（離散）或 <b class='sym'>∫∫ g(x,y)f(x,y)dxdy</b>（連續）。</p><p>基本性質：<b class='sym'>E(aX+bY+c)=aE(X)+bE(Y)+c</b>，加法性<b class='concept'>無需<span class=\"term\" data-term=\"independence\">獨立</span></b>。</p><div class='formula'><span class='f-label'>聯合期望值</span> E[g(X,Y)]=∫∫ g(x,y)f(x,y)dxdy；E(X+Y)=E(X)+E(Y)</div><p>獨立時 E[XY]=E(X)E(Y)，此為乘法律的關鍵。</p>"}]}, {"id": "5.2", "title": "條件機率函數與獨立隨機變數", "pg": "p.176", "body": "<p>本節「<b class=\"concept\">條件機率函數與獨立隨機變數</b>」主題涵蓋下列 2 個小節：條件機率函數、獨立隨機變數。概念與公式詳見各小節。</p>", "children": [{"id": "5.2.1", "title": "條件機率函數", "pg": "p.176", "body": "<p>給定 Y=y 下，X 的<b class='concept'>條件機率函數</b>定義為：</p><div class='formula'><span class='f-label'>條件 pmf/pdf</span> f(x|y)=f(x,y)/f<sub>Y</sub>(y)，其中 f<sub>Y</sub>(y)&gt;0</div><p>條件分配仍是一個「合法」的機率函數（機率和/積為 1）；條件 pdf 由聯合 pdf 除以條件變數的邊際 pdf 得到。</p><div class='note'>乘法律：f(x,y)=f(x|y)f<sub>Y</sub>(y)=f(y|x)f<sub>X</sub>(x)。</div>"}, {"id": "5.2.2", "title": "獨立隨機變數", "pg": "p.179", "body": "<p>X、Y <b class='concept'><span class=\"term\" data-term=\"independence\">獨立</span></b>（independent）若聯合分配可分解為邊際分配乘積：</p><div class='formula'><span class='f-label'>獨立性</span> f(x,y)=f<sub>X</sub>(x)·f<sub>Y</sub>(y)（等價於 f(x|y)=f<sub>X</sub>(x)）</div><p>獨立時 E[XY]=E(X)E(Y)、Cov=0，且條件分配＝邊際分配。</p><div class='warn'>「Cov=0」只是獨立的必要條件，非充分；兩獨立常態才構成二元常態，反之邊際皆常態不代表聯合為二元常態。</div>"}]}, {"id": "5.3", "title": "條件期望值與條件變異數", "pg": "p.185", "body": "<p>本節「<b class=\"concept\">條件期望值與條件變異數</b>」主題涵蓋下列 3 個小節：條件期望值與條件變異數之定義、雙重期望值定理、截尾機率分配。概念與公式詳見各小節。</p>", "children": [{"id": "5.3.1", "title": "條件期望值與條件變異數之定義", "pg": "p.185", "body": "<p>給定 Y=y 下，X 的<b class='concept'>條件<span class=\"term\" data-term=\"expected-value\">期望值</span></b>為條件分配的平均：<b class='sym'>E(X|y)=E(X|Y=y)=Σ x·f(x|y)</b>。</p><p><b class='concept'>條件<span class=\"term\" data-term=\"variance\">變異數</span></b>為 <b class='sym'>Var(X|y)=E[(X−E(X|Y=y))²|y]=E(X²|y)−[E(X|y)]²</b>。</p><div class='formula'><span class='f-label'>條件 E、Var</span> E(X|Y=y) 隨 y 而變，視為 Y 的函數 E(X|Y)；Var(X|Y) 亦同。</div>"}, {"id": "5.3.2", "title": "雙重期望值定理", "pg": "p.189", "body": "<p><b class='concept'>雙重<span class=\"term\" data-term=\"expected-value\">期望值</span>定理</b>（law of iterated expectation）給出「條件期望再期望」的簡化：</p><div class='formula'><span class='f-label'>雙重期望</span> E(X)=E[ E(X|Y) ]</div><p><b class='concept'>條件<span class=\"term\" data-term=\"variance\">變異數</span>分解定理</b>（law of total variance）：</p><div class='formula'><span class='f-label'>變異數分解</span> Var(X)=E[Var(X|Y)] + Var[E(X|Y)]</div><div class='note'>第一項是「條件內變異」，第二項是「條件期望之間的變異」，常用於解釋隨機效果與階層模型。</div>"}, {"id": "5.3.3", "title": "截尾機率分配", "pg": "p.196", "body": "<p><b class='concept'>截尾分配</b>（truncated distribution）是把原分配限制在某子集 A 內（條件於 X∈A）後重新正規化的分配：</p><div class='formula'><span class='f-label'>截尾 pdf</span> f<sub>T</sub>(x)=f(x)/P(X∈A)，x∈A；其餘為 0</div><p>常用在「只觀察到某區間之內」的資料，例如存活分析、截迴歸。</p><div class='warn'>注意區分「截尾」（truncation，丟掉區域外之樣本）與「設限」（censoring，保留但不精確）。</div>"}]}, {"id": "5.4", "title": "共變異數與相關係數", "pg": "p.199", "body": "<p>本節「<b class=\"concept\">共變異數與相關係數</b>」主題涵蓋下列 4 個小節：共變異數、多元隨機變數之變異數、相關係數、母體線性迴歸方程式。概念與公式詳見各小節。</p>", "children": [{"id": "5.4.1", "title": "共變異數", "pg": "p.199", "body": "<p><b class='concept'>共<span class=\"term\" data-term=\"variance\">變異數</span></b>（covariance）衡量 X、Y <b class='concept'>同向/反向線性共變</b>的程度：</p><div class='formula'><span class='f-label'>Cov(X,Y)</span> Cov(X,Y)=E[(X−μ<sub>X</sub>)(Y−μ<sub>Y</sub>)]=E(XY)−E(X)E(Y)</div><p>性質：Cov(X,X)=Var(X)；Cov(aX,bY)=ab·Cov(X,Y)；Cov(X+Y,Z)=Cov(X,Z)+Cov(Y,Z)。</p><div class='note'>X、Y <span class=\"term\" data-term=\"independence\">獨立</span> ⇒ Cov(X,Y)=0；反之不真（獨立 ⇒ 不相關，不相關 ⇏ 獨立）。</div>"}, {"id": "5.4.2", "title": "多元隨機變數之變異數", "pg": "p.204", "body": "<p>多個<span class=\"term\" data-term=\"random-variable\">隨機變數</span><b class='concept'>線性組合</b>的<span class=\"term\" data-term=\"variance\">變異數</span>：</p><div class='formula'><span class='f-label'>Var(Σ a<sub>i</sub>X<sub>i</sub>)</span> Var(Σ a<sub>i</sub>X<sub>i</sub>)=Σ a<sub>i</sub>²Var(X<sub>i</sub>) + 2Σ<sub>i&lt;j</sub> a<sub>i</sub>a<sub>j</sub>Cov(X<sub>i</sub>,X<sub>j</sub>)</div><p><span class=\"term\" data-term=\"independence\">獨立</span>時<span class=\"term\" data-term=\"covariance\">共變異數</span>項消失，只剩<b class='concept'>變異數可加性</b> Var(Σ X<sub>i</sub>)=Σ Var(X<sub>i</sub>)。</p><div class='note'>Var(X−Y)=Var(X)+Var(Y)−2Cov(X,Y)；加常數不改變變異數。</div>"}, {"id": "5.4.3", "title": "相關係數", "pg": "p.206", "body": "<p><b class='concept'><span class=\"term\" data-term=\"correlation\">相關係數</span></b>（correlation coefficient）將共<span class=\"term\" data-term=\"variance\">變異數</span>標準化，得到介於 −1 與 1 的無單位指標：</p><div class='formula'><span class='f-label'>ρ</span> ρ(X,Y)=Cov(X,Y)/(σ<sub>X</sub>σ<sub>Y</sub>)</div><p>|ρ|=1 表完全線性關係；ρ=0 表<b class='concept'>無線性相關</b>。樣本相關係數記為 r。</p><div class='warn'>相關係數只衡量線性關係；ρ=0 不代表<span class=\"term\" data-term=\"independence\">獨立</span>（可能有非線性關係）；也不表因果。</div>"}, {"id": "5.4.4", "title": "母體線性迴歸方程式", "pg": "p.214", "body": "<p>給定 X 時，Y 的<b class='concept'>母體線性迴歸方程式</b>為以 X 的線性函數預測 Y，使<b class='concept'>均方誤差最小</b>：</p><div class='formula'><span class='f-label'>母體迴歸線</span> E(Y|X=x)≈μ<sub>Y</sub> + ρ(σ<sub>Y</sub>/σ<sub>X</sub>)(x−μ<sub>X</sub>)</div><p>斜率為 ρσ<sub>Y</sub>/σ<sub>X</sub>，過點 (μ<sub>X</sub>,μ<sub>Y</sub>)；解釋 X 每變一單位時 Y 的平均變動。</p><div class='note'>對二元<span class=\"term\" data-term=\"normal-distribution\">常態分配</span>，條件期望恰為此直線；一般分配下它是「最佳線性預測」。</div>"}]}, {"id": "5.5", "title": "隨機變數之變數轉換", "pg": "p.218", "body": "<p>本節「<b class=\"concept\">隨機變數之變數轉換</b>」主題涵蓋下列 3 個小節：離散型隨機變數之變數轉換、連續型隨機變數之變數轉換、隨機變數之二對二變數轉換。概念與公式詳見各小節。</p>", "children": [{"id": "5.5.1", "title": "離散型隨機變數之變數轉換", "pg": "p.218", "body": "<p>離散型<span class=\"term\" data-term=\"random-variable\">隨機變數</span>轉換 <b class='sym'>Y=g(X)</b>：逐點映射，把 X 的可能值帶入 g，並<b class='concept'>合併相同 y 值的機率</b>：</p><div class='formula'><span class='f-label'>離散轉換</span> f<sub>Y</sub>(y)=Σ<sub>{x:g(x)=y}</sub> f<sub>X</sub>(x)</div><div class='note'>若 g 為一對一，直接替換變數；若為多對一，須把對應到同一 y 的各 x 機率相加。</div>"}, {"id": "5.5.2", "title": "連續型隨機變數之變數轉換", "pg": "p.221", "body": "<p>連續型<span class=\"term\" data-term=\"random-variable\">隨機變數</span>一對一轉換 <b class='sym'>Y=g(X)</b>（g 嚴格單調可微）：</p><div class='formula'><span class='f-label'>變數變換法</span> f<sub>Y</sub>(y)=f<sub>X</sub>(h(y))·|dh(y)/dy|，其中 h=g⁻¹</div><p>「雅可比」|dh/dy| 是把 dx 換成 dy 的比例因子；單調上升取正、下降取絕對值。</p><div class='note'>也可先求 cdf F<sub>Y</sub>(y)=P(Y≤y)=P(h(y) 之反函数事件)，再微分得 pdf。</div>"}, {"id": "5.5.3", "title": "隨機變數之二對二變數轉換", "pg": "p.224", "body": "<p>二對二轉換 (X,Y)→(U,V)，雅可比矩陣行列式為：</p><div class='formula'><span class='f-label'>二對二變換</span> f<sub>U,V</sub>(u,v)=f<sub>X,Y</sub>(x(u,v),y(u,v))·|J|，J=∂(x,y)/∂(u,v)</div><p>|J| 為反函數雅可比行列式的絕對值。</p><div class='note'>此技術用於推導 t、F 分配、以及和/差分配；n 對 n 轉換可類推。</div>"}]}], "6": [{"id": "6.1", "title": "常用離散型機率分配模型", "pg": "p.230", "body": "<p>本節「<b class=\"concept\">常用離散型機率分配模型</b>」主題涵蓋下列 7 個小節：伯努利分配、二項式分配、幾何分配、負二項式分配、超幾何分配、Poisson 分配、離散均勻分配。概念與公式詳見各小節。</p>", "children": [{"id": "6.1.1", "title": "伯努利分配", "pg": "p.230", "body": "<p><b class='concept'>伯努利分配</b>（Bernoulli）描述一次成敗試驗：X=1 表成功（機率 p）、X=0 表失敗（機率 1−p）。</p><div class='formula'><span class='f-label'>Ber(p)</span> f(x)=p<sup>x</sup>(1−p)<sup>1−x</sup>, x=0,1；E(X)=p；Var(X)=p(1−p)</div><div class='note'>是所有離散成敗模型的基石；樣本比例 p̂ 即 Bernoulli 試驗的樣本平均。</div>"}, {"id": "6.1.2", "title": "二項式分配", "pg": "p.232", "body": "<p><b class='concept'>二項式分配</b>（binomial）記 n 次<span class=\"term\" data-term=\"independence\">獨立</span> Bernoulli 試驗中的成功次數：</p><div class='formula'><span class='f-label'>B(n,p)</span> f(x)=C(n,x)p<sup>x</sup>(1−p)<sup>n−x</sup>, x=0..n；E(X)=np；Var(X)=np(1−p)</div><p>可加性：獨立 B(n₁,p)、B(n₂,p) 之和為 B(n₁+n₂,p)。</p><div class='note'>n 大時可用常態近似（需連續校正）或 Poisson 近似（p 很小）。</div>"}, {"id": "6.1.3", "title": "幾何分配", "pg": "p.237", "body": "<p><b class='concept'>幾何分配</b>（geometric）記「第一次成功前的失敗次數」或「第一次成功所需試驗次數」：</p><div class='formula'><span class='f-label'>Geo(p)</span> f(x)=p(1−p)<sup>x</sup>, x=0,1,2,…（失敗次數版）；E(X)=(1−p)/p；Var(X)=(1−p)/p²</div><div class='note'>具有<b class='concept'><span class=\"term\" data-term=\"memoryless\">無記憶性</span></b>：已失敗 r 次的條件下，剩餘等待次數的分配不變。</div>"}, {"id": "6.1.4", "title": "負二項式分配", "pg": "p.241", "body": "<p><b class='concept'>負二項式分配</b>（negative binomial）記「累積到第 r 次成功所需的失敗次數」：</p><div class='formula'><span class='f-label'>NB(r,p)</span> f(x)=C(r+x−1,x)p<sup>r</sup>(1−p)<sup>x</sup>；E(X)=r(1−p)/p；Var(X)=r(1−p)/p²</div><p>r=1 時退化為幾何分配；r 個<span class=\"term\" data-term=\"independence\">獨立</span>幾何<span class=\"term\" data-term=\"random-variable\">隨機變數</span>相加為 NB(r,p)。</p>"}, {"id": "6.1.5", "title": "超幾何分配", "pg": "p.246", "body": "<p><b class='concept'>超幾何分配</b>（hypergeometric）：有限母體 N 中有 K 個「成功」，抽出不放回 n 個，X 為其中成功數：</p><div class='formula'><span class='f-label'>Hyper(N,K,n)</span> f(x)=C(K,x)C(N−K,n−x)/C(N,n)；E(X)=nK/N；Var(X)=n(K/N)(1−K/N)·(N−n)/(N−1)</div><div class='note'>比二項式多出「有限母體校正項」(N−n)/(N−1)；N 很大時趨近二項式。</div>"}, {"id": "6.1.6", "title": "Poisson 分配", "pg": "p.252", "body": "<p><b class='concept'>Poisson 分配</b>記單位時間/區域內罕見事件的發生次數：</p><div class='formula'><span class='f-label'>Poi(λ)</span> f(x)=e<sup>−λ</sup>λ<sup>x</sup>/x!, x=0,1,…；E(X)=λ；Var(X)=λ；M(t)=e<sup>λ(e<sup>t</sup>−1)</sup></div><p>可加性：<span class=\"term\" data-term=\"independence\">獨立</span> Poi(λ₁)、Poi(λ₂) 之和為 Poi(λ₁+λ₂)。</p><div class='note'>是二項式在 n 大、p 小、np=λ 固定下的極限；與指數/Gamma 有對偶關係。</div>"}, {"id": "6.1.7", "title": "離散均勻分配", "pg": "p.258", "body": "<p><b class='concept'>離散均勻分配</b>：X 在 {1,2,…,N} 上等機率取值：</p><div class='formula'><span class='f-label'>DU(N)</span> f(x)=1/N, x=1..N；E(X)=(N+1)/2；Var(X)=(N²−1)/12</div><div class='note'>公正骰子即 DU(6)；是離散版的均勻分配。</div>"}]}, {"id": "6.2", "title": "常用連續型機率分配模型", "pg": "p.260", "body": "<p>本節「<b class=\"concept\">常用連續型機率分配模型</b>」主題涵蓋下列 6 個小節：均勻分配、常態分配、伽馬分配、指數分配、其他連續型常用分配、可靠度函數與危險函數。概念與公式詳見各小節。</p>", "children": [{"id": "6.2.1", "title": "均勻分配", "pg": "p.260", "body": "<p><b class='concept'>均勻分配</b>（continuous uniform）記 X 在 [a,b] 上等密度分布：</p><div class='formula'><span class='f-label'>U(a,b)</span> f(x)=1/(b−a), a≤x≤b；E(X)=(a+b)/2；Var(X)=(b−a)²/12</div><p>cdf 為 F(x)=(x−a)/(b−a)；標準均勻 U(0,1) 是亂數模擬的基礎。</p>"}, {"id": "6.2.2", "title": "常態分配", "pg": "p.266", "body": "<p><b class='proper'>Gauss</b> <span class=\"term\" data-term=\"normal-distribution\">常態分配</span>是最重要的連續分配，記 X~N(μ,σ²)：</p><div class='formula'><span class='f-label'>N(μ,σ²)</span> f(x)=1/(σ√(2π))·e<sup>−(x−μ)²/(2σ²)</sup>；E(X)=μ；Var(X)=σ²；M(t)=e<sup>μt+σ²t²/2</sup></div><p><b class='concept'>標準化</b> Z=(X−μ)/σ~N(0,1)；線性組合仍為常態；68–95–99.7 經驗法則。</p>"}, {"id": "6.2.3", "title": "伽馬分配", "pg": "p.277", "body": "<p><b class='concept'>伽馬分配</b>記 Poisson 過程中第 α 個事件的等待時間，X~Gamma(α,β)：</p><div class='formula'><span class='f-label'>Gamma(α,β)</span> f(x)=x<sup>α−1</sup>e<sup>−x/β</sup>/(β<sup>α</sup>Γ(α)), x&gt;0；E(X)=αβ；Var(X)=αβ²；M(t)=(1−βt)<sup>−α</sup></div><p>可加性：同 β 之<span class=\"term\" data-term=\"independence\">獨立</span> Gamma 相加仍為 Gamma；α=1 即指數分配。</p>"}, {"id": "6.2.4", "title": "指數分配", "pg": "p.282", "body": "<p><b class='concept'>指數分配</b>描述兩相鄰事件的等待/間隔時間，X~Exp(β)：</p><div class='formula'><span class='f-label'>Exp(β)</span> f(x)=(1/β)e<sup>−x/β</sup>, x≥0；E(X)=β；Var(X)=β²；M(t)=(1−βt)<sup>−1</sup></div><div class='note'>具有<b class='concept'><span class=\"term\" data-term=\"memoryless\">無記憶性</span></b>：P(X&gt;a+b|X&gt;a)=P(X&gt;b)；是 α=1 的 Gamma；危險率為常數 1/β。</div>"}, {"id": "6.2.5", "title": "其他連續型常用分配", "pg": "p.289", "body": "<p>其他常見連續分配：</p><ul><li><b class='concept'>Beta</b>(α,β)：定義於 [0,1]，E(X)=α/(α+β)；</li><li><b class='concept'>對數常態</b> LogN(μ,σ²)：lnY~N(μ,σ²)，E(Y)=e<sup>μ+σ²/2</sup>；</li><li><b class='concept'>Weibull</b>(α,β)：常用於壽命/可靠性，f(x)=(α/β)(x/β)<sup>α−1</sup>e<sup>−(x/β)<sup>α</sup></sup>。</li></ul><div class='note'>另有平移指數、Laplace、Pareto、Logistic、Cauchy（E、Var 不存在）等。</div>"}, {"id": "6.2.6", "title": "可靠度函數與危險函數", "pg": "p.293", "body": "<p><b class='concept'>可靠度函數</b> R(t)=P(X≥t)=1−F(t)，表零件在 t 時點仍未故障的機率。</p><p><b class='concept'>危險函數</b>（hazard rate）h(t)=f(t)/R(t)，表在 t 時尚未壞的條件下「瞬間故障」的機率密度。</p><div class='formula'><span class='f-label'>h(t)</span> h(t)=f(t)/(1−F(t))=−d ln R(t)/dt</div><div class='note'>指數分配的 h(t) 為常數；Weibull 的 h(t) 可隨時間遞增或遞減。</div>"}]}, {"id": "6.3", "title": "常用多變數機率分配模型", "pg": "p.295", "body": "<p>本節「<b class=\"concept\">常用多變數機率分配模型</b>」主題涵蓋下列 3 個小節：三項式分配、雙變數超幾何分配、二元常態分配。概念與公式詳見各小節。</p>", "children": [{"id": "6.3.1", "title": "三項式分配", "pg": "p.295", "body": "<p><b class='concept'>三項式分配</b>（trinomial）：n 次試驗有三種結果，X、Y 分別為前兩種結果次數：</p><div class='formula'><span class='f-label'>Tri(n,p₁,p₂)</span> f(x,y)=n!/(x!y!(n−x−y)!) p₁<sup>x</sup>p₂<sup>y</sup>(1−p₁−p₂)<sup>n−x−y</sup>；E(X)=np₁；Var(X)=np₁(1−p₁)；Cov(X,Y)=−np₁p₂</div><div class='note'>邊際 X~B(n,p₁)；X+Y~B(n,p₁+p₂)；是多項式分配的三維特例。</div>"}, {"id": "6.3.2", "title": "雙變數超幾何分配", "pg": "p.296", "body": "<p><b class='concept'>雙變數超幾何分配</b>：有限母體 N 中有 K₁、K₂ 分屬兩類，抽出不放回 n 個，X、Y 分別為各類數：</p><div class='formula'><span class='f-label'>BiHyper(N,K₁,K₂,n)</span> f(x,y)=[C(K₁,x)C(K₂,y)C(N−K₁−K₂,n−x−y)]/C(N,n)；E(X)=nK₁/N</div><p>邊際 X~Hyper(N,K₁,n)；N 很大時近似三項式。</p>"}, {"id": "6.3.3", "title": "二元常態分配", "pg": "p.300", "body": "<p><b class='concept'>二元<span class=\"term\" data-term=\"normal-distribution\">常態分配</span></b>（bivariate normal）(X,Y)~BN(μ<sub>X</sub>,μ<sub>Y</sub>,σ<sub>X</sub>²,σ<sub>Y</sub>²,ρ)，具立體鐘形：</p><div class='formula'><sp
