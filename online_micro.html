<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微觀人性 學個經｜互動複習</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Georgia,serif' fill='white' text-anchor='middle'%3E%E2%88%91%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fs:16px;
  --paper:#f6f0e2;
  --ink:#2b251d;
  --panel:#fffdf6;
  --line:#e4d9bf;
  --muted:#6f6555;
  --nav-bg:#f1e9d5;
  --nav-ink:#4a4234;
  --nav-hover:#e7dcc0;
  --nav-active:#3c6e8f;
  --accent:#b5542e;
  --accent-soft:#fbeae2;
  --teal:#2c6e9e;
  --teal-soft:#eef3f4;
  --green:#1e7d32;
  --hl:#ffe94a;
  --radius:12px;
  --blue:#2c6e9e;--green2:#3a7d44;--orange:#c06a24;--purple:#6b4e8e;--brown:#8a5a3b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Serif TC","PMingLiU","PingFang TC",serif;
  font-size:var(--fs);
  background:var(--paper);
  color:var(--ink);
  line-height:1.8;
  display:flex;
  min-height:100vh;
}
body.dark{
  --paper:#16130d;--ink:#e6e0d2;--panel:#201c14;--line:#3a3325;
  --muted:#a0937a;--nav-bg:#1f1a10;--nav-ink:#cfc4ad;--nav-hover:#332b1b;
  --nav-active:#4a8ab5;--accent:#e08a55;--accent-soft:#2f2014;
  --teal:#5f9fc0;--teal-soft:#14242e;--green:#5cb56e;--hl:#5a4a1e;
  --blue:#5f9fc0;--green2:#5cb56e;--orange:#d98a4a;--purple:#9b7fc0;--brown:#b08a5a;
}
/* ===== 側邊目錄（兩層） ===== */
.sidebar{
  width:280px;flex-shrink:0;background:var(--nav-bg);color:var(--nav-ink);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 18px 40px;
  border-right:1px solid var(--line);
}
.sidebar .brand{font-weight:700;font-size:15px;letter-spacing:.02em;line-height:1.4;margin-bottom:4px;color:var(--ink)}
.sidebar .brand .t2{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.nav-chapter{
  display:flex;align-items:center;gap:8px;width:100%;padding:4px 10px;border-radius:6px;
  cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);
  border:none;background:none;text-align:left;margin-top:8px;font-family:inherit;line-height:1.45;
}
.nav-chapter:hover{background:var(--nav-hover)}
.nav-chapter.active{background:var(--nav-active);color:#fff}
.nav-chapter .num{font-size:11px;font-weight:600;opacity:.65;width:26px;flex-shrink:0}
.nav-chapter.active .num{opacity:.9}
.nav-chapter .tag{margin-left:auto;font-size:10px;opacity:.55;letter-spacing:.05em;font-weight:400}
.nav-chapter .tag.done{color:var(--green2);opacity:1}
.nav-sub{
  display:block;width:100%;padding:3px 10px 3px 34px;border-radius:6px;
  cursor:pointer;font-size:12.5px;color:var(--muted);border:none;background:none;text-align:left;font-family:inherit;line-height:1.45;
}
.nav-sub:hover{background:var(--nav-hover);color:var(--ink)}
.nav-sub.active{color:var(--nav-active);font-weight:700}
.nav-gloss{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:6px;margin-top:10px;
  cursor:pointer;font-size:13.5px;font-weight:700;color:#8a6d1a;border:1.5px dashed #d9b84a;background:#fffaf0;
  text-align:left;font-family:inherit;line-height:1.45;transition:all .15s;
}
.nav-gloss:hover{border-color:#c9a227;color:#c9a227;background:#fff6dd}
.nav-gloss svg{width:15px;height:15px;flex-shrink:0}
.nav-gloss.active{background:#c9a227;color:#fff;border-style:solid}
.search-panel{
  position:fixed;top:66px;left:50%;transform:translateX(-50%);width:min(680px,92vw);max-height:62vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.16);z-index:60;
}
.search-panel .sp-item{display:block;width:100%;text-align:left;padding:10px 16px;border:none;border-bottom:1px solid var(--line);background:none;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);line-height:1.5}
.search-panel .sp-item:hover{background:var(--nav-hover)}
.search-panel .sp-tag{display:inline-block;font-size:11px;color:var(--teal);font-weight:700;margin-right:8px;letter-spacing:.03em;white-space:nowrap}
.search-panel .sp-item b{display:block;font-size:13.5px;margin:2px 0}
.search-panel .sp-snip{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-panel .sp-count{padding:8px 16px;font-size:12px;color:var(--muted);text-align:center}
.search-panel .sp-empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:13.5px}
body.dark .search-panel{background:#26221a;border-color:#4a4234}
/* ===== 主內容 ===== */
.main{flex:1;min-width:0;padding:28px 34px 80px}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);padding:10px 0 14px;margin-bottom:18px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.searchbox{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.searchbox svg{width:16px;height:16px;opacity:.45;flex-shrink:0}
.searchbox input{border:none;outline:none;background:none;font-size:14px;width:100%;color:var(--ink);font-family:inherit}
.toolbtn{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit;transition:all .15s;
}
.toolbtn:hover{border-color:var(--teal);color:var(--teal)}
.toolbtn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.toolbtn svg{width:15px;height:15px}
/* 章頭 */
.chapter-head{border-left:8px solid var(--teal);padding:6px 0 10px 18px;margin:30px 0 18px}
.chapter-head .kicker{display:inline-block;font-size:12px;letter-spacing:.15em;color:var(--teal);font-family:"Noto Sans TC",sans-serif;font-weight:600}
.chapter-head h1{font-family:"Noto Serif TC",serif;font-size:27px;line-height:1.25;margin:2px 0 4px}
.chapter-head p{color:var(--muted);font-size:14.5px;max-width:760px;margin-top:6px}
/* 小節 */
.section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.section-head{
  display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none;
  font-family:"Noto Serif TC",serif;font-size:19px;font-weight:600;border-bottom:2px solid transparent;transition:border-color .15s;
}
.section.open .section-head{border-bottom-color:var(--teal)}
.section-head .sec-num{color:var(--teal);font-size:12.5px;font-weight:700;font-family:"Noto Sans TC",sans-serif;letter-spacing:.08em;flex-shrink:0}
.section-head .chev{width:18px;height:18px;margin-left:auto;transition:transform .2s;flex-shrink:0}
.section.open .section-head .chev{transform:rotate(180deg)}
.section-body{display:none;padding:4px 20px 18px}
.section.open .section-body{display:block}
.section-body p{margin:10px 0;font-size:14.8px}
.section-body ul{margin:8px 0;padding-left:24px}
.section-body li{margin:3px 0}
/* callout 盒子（參考章節筆記風格） */
.section-body .note{background:#fdf0c2;border-left:4px solid #d9a514;padding:12px 16px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.section-body .note::before{content:"重點與結論";display:block;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#8a6d1a;margin-bottom:4px}
.section-body .warn{background:var(--accent-soft);border-left:4px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.section-body .warn::before{content:"考試重點";display:block;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin-bottom:4px}
.section-body .src{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
.section-body .src summary{cursor:pointer;font-size:12.5px;color:var(--teal)}
.section-body .src pre{white-space:pre-wrap;font-family:"Noto Serif TC",serif;font-size:13px;color:var(--muted);margin-top:8px;max-height:280px;overflow-y:auto}
/* 公式卡 */
.formula{background:#fbf4e6;border:1px dashed #c9b88f;border-radius:8px;padding:14px 18px;margin:12px 0;font-size:15.5px;text-align:center;font-family:"Noto Serif TC",serif}
.formula .f-label{display:block;font-size:11.5px;color:#9a6a1f;letter-spacing:.08em;margin-bottom:4px;font-family:"Noto Sans TC",sans-serif;font-weight:700}
.formula .f-note{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-family:"Noto Sans TC",sans-serif}
/* 術語 */
.term{color:var(--green);font-weight:700;cursor:pointer;border-bottom:1.5px dashed color-mix(in srgb,var(--green) 55%,transparent);border-radius:3px;padding:0 2px;transition:all .15s}
.term:hover{background:var(--green);color:#fff;border-bottom:none}
/* 專有名詞（人名／事件）深紫粗體 */
.proper{color:#7b2cbf;font-weight:700;cursor:pointer;border-bottom:1.5px dashed color-mix(in srgb,#7b2cbf 50%,transparent);border-radius:3px;padding:0 2px;transition:background .15s}
.proper:hover{background:#7b2cbf;color:#fff;border-bottom:none}
body.dark .proper{color:#b39ddb}
body.dark .proper:hover{background:#b39ddb;color:#1a1420}
/* 術語列表與知識卡：人物/書名類紫色粗體 */
#termModalEn{color:var(--green)}
#termModalEn.proper,#termModalZh.proper{color:#7b2cbf}
body.dark #termModalEn.proper,body.dark #termModalZh.proper{color:#b39ddb}
#termModalDef .proper{color:#7b2cbf;font-weight:700;border-bottom:1.5px dashed color-mix(in srgb,#7b2cbf 50%,transparent)}
body.dark #termModalDef .proper{color:#b39ddb}
.gloss-en.proper,.gloss-zh.proper{color:#7b2cbf}
body.dark .gloss-en.proper,body.dark .gloss-zh.proper{color:#b39ddb}
/* 例題 */
.problem{background:#eae6da;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:14px 0}
.problem .p-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;color:var(--teal);margin-bottom:8px}
.problem .p-body{font-size:14.5px}
.problem .opts{margin:10px 0 4px;display:grid;gap:6px}
.problem .opts div{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.8px;background:var(--panel)}
.opts .opt{cursor:pointer;transition:all .15s}
.opts .opt:hover{border-color:var(--teal);background:var(--teal-soft)}
.opts .opt.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.opts .opt.right{border-color:#1e7d32;background:#e7f3e4;color:#1e7d32;font-weight:700}
.opts .opt.wrong{border-color:#c0392b;background:#fbeaea;color:#c0392b;font-weight:700}
.opts[data-locked="1"] .opt{pointer-events:none;cursor:default}
.prob-fb{margin-top:10px;font-size:14px;font-weight:700}
.fb-ok{color:#1e7d32}
.fb-no{color:#c0392b}
body.dark .problem{background:#26221a}
.ans-btn{
  margin-top:12px;display:inline-flex;align-items:center;gap:8px;background:none;border:1.5px solid var(--teal);
  color:var(--teal);border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .15s;
}
.ans-btn:hover{background:var(--teal);color:#fff}
.fav{
  margin-left:auto;background:none;border:1.5px solid var(--line);color:var(--muted);border-radius:8px;
  padding:3px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;
}
.fav:hover{border-color:#c9a227;color:#c9a227}
.fav.on{border-color:#c9a227;background:#fffaf0;color:#c9a227;font-weight:700}
body.dark .fav.on{background:#3a3320}
.ans{display:none;margin-top:12px;background:var(--teal-soft);border-radius:8px;padding:12px 16px;font-size:14px}
.ans.show{display:block}
.ans .a-label{font-weight:700;color:var(--teal);font-size:13px}
.ans ul{margin:6px 0 2px;padding-left:22px}
.ans li{margin:3px 0}
.ans b{font-weight:700}
/* 術語卡區 */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin:16px 0}
.flip-card{perspective:900px;height:150px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);padding:12px;text-align:center}
.flip-front{background:var(--panel)}
.flip-front .en{font-size:16px;font-weight:700;color:var(--teal);word-break:break-word}
.flip-front .zh{font-size:13px;color:var(--muted)}
.flip-back{background:var(--teal);color:#fff;transform:rotateY(180deg)}
.flip-back .def{font-size:13px;line-height:1.6}
.flip-hint{font-size:11px;opacity:.5;margin-top:4px}
/* ===== 術語表（列表形式） ===== */
.gloss-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.gloss-cats{display:flex;gap:6px;flex-wrap:wrap}
.gloss-cat-btn{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 13px;font-size:12.5px;cursor:pointer;color:var(--muted);transition:all .15s}
.gloss-cat-btn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.gloss-progress{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.gloss-progress .bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.gloss-progress .fill{height:100%;background:var(--teal);width:0%;transition:width .3s}
.gloss-progress .label{font-size:13px;color:var(--muted);white-space:nowrap}
.gloss-group{margin-bottom:16px}
.gloss-group h3{font-size:14px;color:var(--teal);margin:14px 0 8px;padding-left:10px;border-left:3px solid var(--teal);letter-spacing:.04em}
.gloss-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:8px 0;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s}
.gloss-item.starred{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gloss-check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;cursor:pointer;display:grid;place-items:center;margin-top:2px;transition:all .15s;background:none;padding:0}
.gloss-check svg{width:14px;height:14px;display:none;color:#fff}
.gloss-check.done{background:var(--teal);border-color:var(--teal)}
.gloss-check.done svg{display:block}
.gloss-item.done .gloss-en{text-decoration:line-through;opacity:.55}
.gloss-main{flex:1;min-width:0}
.gloss-en{font-weight:700;color:var(--green);font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gloss-zh{font-size:15px;color:var(--green);font-weight:700;margin-left:2px}
.gloss-def{font-size:13.5px;margin-top:4px;line-height:1.8}
.gloss-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.gloss-btn{border:1px solid var(--line);background:none;border-radius:7px;padding:3px 10px;font-size:11.5px;cursor:pointer;color:var(--muted);transition:all .15s}
.gloss-btn:hover{color:var(--teal);border-color:var(--teal)}
.gloss-btn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.gloss-note{display:none;margin-top:8px}
.gloss-note.show{display:block}
.gloss-note textarea{width:100%;min-height:56px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--paper);color:var(--ink);font-family:inherit;resize:vertical}
.gloss-note textarea:focus{outline:none;border-color:var(--teal)}
.gloss-data-actions{display:flex;gap:8px;margin-left:auto}
/* 搜尋高亮 */
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
mark.hl{background:var(--hl)}
/* 重點高亮（使用者標記） */
.userhl{background:var(--hl);border-radius:3px;cursor:pointer;box-shadow:0 0 0 2px var(--hl)}
/* 畫記模式 */
body.marking{cursor:crosshair}
body.marking .section-body p,body.marking .section-body li,body.marking .section-body .note,body.marking .section-body .warn,body.marking .problem .p-body{cursor:crosshair;border-radius:3px;transition:box-shadow .12s}
body.marking .section-body p:hover,body.marking .section-body li:hover,body.marking .section-body .note:hover,body.marking .section-body .warn:hover,body.marking .problem .p-body:hover{box-shadow:0 0 0 2px rgba(255,233,74,.45);background:rgba(255,233,74,.12)}
/* 進度條 */
.progress-strip{display:flex;gap:6px;margin:14px 0 6px}
.progress-strip i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress-strip i.done{background:var(--teal)}
.progress-strip i.na{background:none;border:1px dashed var(--line);height:3px}
.progress-label{font-size:12px;color:var(--muted);margin-top:4px}
.p-head .done-btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted);font-family:inherit;flex-shrink:0;transition:all .15s}
.p-head .done-btn:hover{border-color:var(--green);color:var(--green)}
.p-head .done-btn.on{background:#e3f0e3;border-color:var(--green);color:var(--green);font-weight:700}
body.dark .p-head .done-btn.on{background:#1d2b1d}
.prob-progress{font-size:13px;font-weight:600;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--teal-soft);color:var(--teal);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:500}
/* 提示條 */
.banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px;padding:14px 18px;font-size:13.5px;color:var(--ink);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:18px;height:18px;flex-shrink:0;color:var(--accent);margin-top:2px}
/* 空狀態 */
.empty{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
.empty.show{display:block}
.empty .big{font-size:40px;margin-bottom:10px}
.chpage{font-size:12.5px;color:var(--muted);font-family:"Noto Sans TC",sans-serif}
.chapter-head .ch-points{margin:10px 0 0;padding-left:22px;font-size:14.5px;color:var(--ink)}
.chapter-head .ch-points li{margin:3px 0}
/* 方法學習卡（左打勾＋方法名＋公式說明，底下例子） */
.method-card{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;margin:12px 0;background:var(--panel);overflow:hidden;transition:opacity .2s}
.method-card .mc-check{width:64px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--panel)}
.method-card .mc-check input{width:19px;height:19px;accent-color:var(--green);cursor:pointer}
.method-card .mc-check .mc-lbl{font-size:11px;color:var(--muted)}
.method-card .mc-check:has(input:checked){background:#eef7ec}
.method-card .mc-check:has(input:checked) .mc-lbl{color:var(--green);font-weight:700}

<script>
/* ===== 資料：全書章節結構 ===== */
const BOOK = [
  {n:1, title:"經濟學概論", subs:["1.1 進入經濟學的世界","1.2 經濟學的意義","1.3 經濟問題","1.4 經濟學的分類與模型建構","1.5 經濟學的邏輯謬誤","1.6 經濟活動循環流轉"], done:true, points:["經濟學＝以稀少性資源做選擇的科學；稀少性→選擇→抵換","理性：以最有效率方式追求一致性目標；經濟財具稀少性、自由財無","三大問題（3W）：生產什麼、如何生產、為誰生產","集權式（單一決策者）vs 市場經濟（供需互動）","個體經濟學（價格理論、個別單位）vs 總體經濟學（所得理論、整體）","實證（what it is）vs 規範（what it should be）","三種謬誤：合成推理（個體→總體）、分離推理（總體→個體）、因果推理（先後≠因果）","循環流轉：家戶供給要素取得所得→商品市場消費；家戶支出=廠商收入=家戶所得"]},
  {n:2, title:"需求", subs:["2.1 需求函數與市場需求","2.2 需求價格彈性","2.3 需求價格彈性對消費者支出的影響","2.4 交叉彈性","2.5 需求量與所得的關係","2.6 影響需求價格彈性的因素"], done:true, points:["需求的成立：願意＋能夠，且其他情況不變（流量變數）","需求法則：價格與需求量反向變動；需求量變動＝線上點移動，需求變動＝整條線移動","市場需求＝個別需求水平加總；違反需求法則：炫耀性財貨與季芬財","需求價格彈性：點彈性、弧彈性（中點法）、幾何彈性（直線五區段）","總支出與彈性：|ε|>1 反向、=1 不變、<1 同向","交叉彈性：>0 替代、<0 互補、=0 無關；所得彈性：>0 正常（必需/地位/奢侈）、<0 劣等、=0 中性","恩格爾法則與加總定理；影響彈性六因素"]},
  {n:3, title:"供給", subs:["3.1 供給函數與市場供給","3.2 供給價格彈性與其他相關彈性"], done:true, points:["供給定義：特定期間＋其他情況不變＋願意且能夠；供給法則：價格與供給量同向","供給量變動＝線上點移動；供給變動＝整條線移動（技術、要素價格、預期、相關財價格、人數）","生產上互補品（聯產品）與替代品（要素搶奪）區分","供給價格彈性：點／弧彈性；直線五型（縱軸&gt;1、橫軸&lt;1、原點=1、垂直=0、水平=∞）","影響供給彈性：投入用途、成本敏感度、技術、規模、時間、保存容易度、定義範圍"]},
  {n:4, title:"市場均衡分析", subs:["4.1 市場均衡","4.2 消費者與生產者剩餘及社會福利分析","4.3 政府介入對社會福利的影響","4.4 政府介入市場的其他手段","4.5 羅西法則與租稅轉嫁"], done:true, points:["市場均衡＝供給量＝需求量（市場結清）；ED/ES 由價格機能調整回均衡","比較靜態：需求右移P↑Q↑、供給右移P↓Q↑；供需同移→數量確定價格看幅度","CS=需求線下價格線上、PS=價格線下供給線上；SW=CS+PS","從量稅：對消費者課稅需求線下移、對生產者課稅供給線上移；課稅補貼都會造成DWL","價格上限→超額需求、價格下限→超額供給；管制對象剩餘一增一減不確定","羅西法則：彈性大課低稅、彈性小課高稅；租稅轉嫁＝彈性小的一方負擔多"]},
  {n:5, title:"數列效用分析", subs:["5.1 前言","5.2 總效用與邊際效用","5.3 消費者均衡","5.4 需求曲線的求導","5.5 鑽石與水的矛盾"], done:true, points:["數列效用可度量可比較；序列效用只排序（無異曲線分析）","TU 上升後下降、MU 遞減；MU>0 喜好品、=0 中性品、<0 厭惡品","消費者均衡＝邊際效用均等法則：MUx/Px = MUy/Py = MUm","需求曲線由 P = MU/MUm 導出；MU 遞減越快需求彈性越小","鑽石與水：價格由邊際效用決定、價值由總效用決定"]},
  {n:6, title:"消費者行為理論", subs:["6.1 消費者偏好基本公理","6.2 效用函數","6.3 常用偏好結構與預算線","6.4 消費者均衡與計算","6.5 對偶性理論","6.6 全章考試總複習清單"], done:true, points:["六大公理：完整、反射、遞移（公理）＋連續、單調、凸（假設）","良好偏好→無異曲線凸向原點、內部解唯一；MRS = MUx/MUy","四大效用函數：Cobb-Douglas、Leontief、Linear、Quasi-linear","預算線斜率 −Px/Py；均衡 MRS = Px/Py（相切）；角隅解比較 MRS 與價格比","對偶：效用極大↔支出極小；Roy 恆等式 ↔ Shephard 定理"]},
  {n:7, title:"比較靜態與需求函數", subs:["7.1 替代效果與所得效果","7.2 普通與受補償需求曲線","7.3 所得與價格消費曲線","7.4 史勒斯基方程式"], done:true, points:["價格效果 = 替代效果 + 所得效果；Hicks（維持效用/CV）vs Slutsky（維持原購買組合/CD）","受補償需求曲線只含 SE 永遠負斜率；馬歇爾需求含 SE＋IE","正常財 IE 與價格反向；劣等財反向抵銷；季芬財 IE &gt; SE（需求線正斜率）","ICC 只含 IE、PCC 含 SE＋IE；PCC 垂直 ⟺ 劣等財","史勒斯基方程式：∂x/∂P = ∂xh/∂P − x·∂x/∂M"]},
  {n:8, title:"消費者行為理論的應用", subs:["8.1 補貼或課稅對消費者之影響","8.2 勞動與休閒的選擇","8.3 跨期消費理論","8.4 顯示性偏好理論","8.5 皮氏與拉氏指數"], done:true, points:["相同補貼金額下消費者偏好所得補貼、政策面偏好從量補貼","休閒的價格＝工資率；後彎勞動供給需休閒為正常財且 IE &gt; SE","跨期預算線 c₁+c₂/(1+r)=y₁+y₂/(1+r)；均衡 MRS=1+r；Euler 方程式","顯示性偏好由選擇反推偏好；WARP 一致性、SARP 加遞移性","拉氏指數高估、皮氏低估生活成本；支出指數比較判斷福利"]},

"Demand":["Demand","需求","消費者在特定期間內、其他情況不變下，對某商品在給定不同價格之下，願意且能夠購買的商品數量之關係。"],
"Quantity demanded":["Quantity demanded","需求量","其他情況不變，給定某價格下消費者願意且能夠購買的數量；為需求曲線上的點。"],
"Demand function":["Demand function","需求函數","其他情況不變，價格與消費者願意且能消費數量間的關係：Q<sub>d</sub> = f(P；其他變數)。"],
"Inverse demand function":["Inverse demand function","逆需求函數","給定數量下消費者願付的最高價格：P = g(Q)；又稱需求價格。"],
"Demand schedule":["Demand schedule","需求表","價格與數量間不連續關係的表格。"],
"Market demand":["Market demand","市場需求","特定市場、特定時間內所有購買者在各價格下購買數量的組合；為個別需求之水平加總。"],
"Law of demand":["Law of demand","需求法則","其他情況不變，價格與需求量呈反向變動：價格↑需求量↓。"],
"Reservation price":["Reservation price","保留價格","消費者願意支付的最高價格（買者保留價格）。"],
"Substitution goods":["Substitution goods","替代品","一商品價格上漲使另一商品需求量增加的兩商品關係；交叉彈性＞0。"],
"Complementary goods":["Complementary goods","互補品","一商品價格上漲使另一商品需求量減少的兩商品關係；交叉彈性＜0。"],
"Unrelated goods":["Unrelated goods","無關品","一商品價格變動不影響另一商品需求的兩商品關係；交叉彈性＝0。"],
"Normal goods":["Normal goods","正常財","所得增加時需求量增加的財貨（所得彈性＞0）。"],
"Inferior goods":["Inferior goods","劣等財","所得增加時需求量減少的財貨（所得彈性＜0）。"],
"Neutral goods":["Neutral goods","中性財","需求量不受所得變動影響的財貨（所得彈性＝0）。"],
"Bandwagon effect":["Bandwagon effect","隨波逐流效果（正的網路外部性）","商品消費人數增加影響個別消費者需求線的效果；使市場需求線更平坦。"],
"Snob effect":["Snob effect","標新立異效果（負的網路外部性）","消費者為標新立異而減少購買；使市場需求線更陡峭。"],
"Conspicuous goods":["Conspicuous goods","炫耀性財貨","又稱韋伯倫財（Veblen goods），以高價格炫耀品味與地位，價格越高需求量越多，違反需求法則。"],
"Giffen goods":["Giffen goods","季芬財","同時滿足「劣等財」與「不符合需求法則」的財貨，常見於經濟落後地區之主食。"],
"Elasticity":["Elasticity","彈性","外在環境改變時，經濟個體調整內在資源配置方向的能力。"],
"Price elasticity of demand":["Price elasticity of demand","需求價格彈性","價格變動百分之一引起需求量變動百分之幾；公式前加負號或取絕對值消除負號。"],
"Point elasticity":["Point elasticity","點彈性","函數在某一點的彈性（價格變化極小時）：ε = (dQ/dP)(P/Q)。"],
"Arc elasticity":["Arc elasticity","弧彈性（中點法）","僅有兩筆資料時，取兩點中點計算的彈性：ε = (ΔQ/ΔP)×(中點P/中點Q)。"],
"Unitary elasticity":["Unitary elasticity","單一彈性","彈性絕對值等於 1；價格與需求量同幅度變動（直線需求之中點）。"],
"Elastic":["Elastic","富於彈性","彈性絕對值大於 1；價格小幅變動引起需求量大幅度變動。"],
"Inelastic":["Inelastic","缺乏彈性","彈性絕對值小於 1；價格大幅變動只引起需求量小幅度變動。"],
"Perfectly elastic":["Perfectly elastic","完全彈性","彈性為無限大（水平需求線）；價格略升需求量歸零。"],
"Perfectly inelastic":["Perfectly inelastic","完全缺乏彈性","彈性為 0（垂直需求線）；價格變動需求量不變。"],
"Total expenditure":["Total expenditure","總支出","價格乘數量：TE = P × Q；其變動方向取決於需求價格彈性大小。"],
"Cross elasticity":["Cross elasticity","交叉彈性","Y 財貨價格變動百分之一引起 X 財貨需求量變動百分之幾：ε<sub>xy</sub> = (ΔQ<sub>x</sub>/Q<sub>x</sub>)/(ΔP<sub>y</sub>/P<sub>y</sub>)。"],
"Income elasticity":["Income elasticity","所得彈性","所得變動百分之一引起需求量變動百分之幾：ε<sub>M</sub> = (ΔQ/Q)/(ΔM/M)。"],
"Engel curve":["Engel curve","恩格爾曲線","其他情況不變，表現消費者所得與需求量關係的函數；以需求量為自變數、所得為應變數。"],
"Engel's law":["Engel's law","恩格爾法則","其他情況不變，所得增加時，必需品支出比例下降、奢侈品支出比例增加。"],
"Engel aggregation condition":["Engel aggregation condition","恩格爾加總定理","各商品支出比例乘以本身所得彈性之加總等於 1。"],
"Necessity":["Necessity","必需品","所得彈性介於 0 與 1 之間的正常財：需求量變動百分比小於所得變動百分比。"],
"Luxury goods":["Luxury goods","奢侈品","所得彈性大於 1 的正常財：需求量變動百分比大於所得變動百分比。"],
"Status goods":["Status goods","地位財","所得彈性等於 1 的正常財：需求量變動百分比等於所得變動百分比。"],
"Flow":["Flow","流量","兩特定時間點之間衡量的變數（如需求、所得），須定義期間長短。"],
"Supply":["Supply","供給","生產者在特定期間內、其他情況不變下，對某生產商品在給定不同價格之下，願意且能夠提供的商品數量之關係。"],
"Quantity supplied":["Quantity supplied","供給量","其他情況不變，給定某價格下生產者願意且能夠供給的數量；為供給曲線上的點。"],
"Supply function":["Supply function","供給函數","其他情況不變，價格與生產者願意且能供給數量間的關係：Q<sub>s</sub> = f(P；技術、要素價格、預期)。"],
"Inverse supply function":["Inverse supply function","逆供給函數","給定數量下生產者願收的最低價格：P = g(Q)；又稱供給價格（賣者保留價格）。"],
"Supply schedule":["Supply schedule","供給表","價格與供給量間不連續關係的表格。"],
"Market supply":["Market supply","市場供給","特定時期內、各種可能價格下所有生產者願意且能供給的數量；為個別廠商供給之水平加總。"],
"Law of supply":["Law of supply","供給法則","其他情況不變，價格與供給量呈同向變動：價格↑供給量↑；不會出現違反供給法則的商品。"],
"Joint products":["Joint products","聯產品（生產上互補品）","同生產要素且同生產過程同時生產出的商品；一商品價格↑另一商品供給↑。"],
"Supply elasticity":["Supply elasticity","供給價格彈性","商品價格變動百分之一引起供給量變動百分之幾：ε<sub>s</sub> = (ΔQ/Q)/(ΔP/P)。"],
"Cross elasticity of supply":["Cross elasticity of supply","供給交叉彈性","其他商品價格變動百分之一引起本商品供給量變動百分之幾；&gt;0 生產替代品、&lt;0 生產互補品。"],
"Cost elasticity of supply":["Cost elasticity of supply","供給的成本彈性","成本變動百分之一引起供給量變動百分之幾。"],
"Production substitutes":["Production substitutes","生產上替代品","同生產要素但不同生產過程、生產時搶奪要素的商品；一商品價格↑另一商品供給↓。"],
"Equilibrium":["Equilibrium","均衡","沒有外力干擾下目前的情況可以一直維持下去的狀態；市場供需兩股力量平衡點。"],
"Market clearing":["Market clearing","市場結清","供需平衡使市場上不存在多餘的買者與賣者：供給量＝需求量。"],
"Excess demand":["Excess demand","超額需求（短缺）","價格低於均衡時需求大於供給的狀態，價格機能使價格上升。"],
"Excess supply":["Excess supply","超額供給（過剩）","價格高於均衡時供給大於需求的狀態，價格機能使價格下降。"],
"Price mechanism":["Price mechanism","價格機能","透過價格變動使市場回到均衡的機制；即亞當斯密所說「看不見的手」。"],
"Stable equilibrium":["Stable equilibrium","穩定均衡","市場偏離均衡時在沒有外力干擾下會自動回到的均衡。"],
"Comparative static":["Comparative static","比較靜態分析","外生變數改變後比較變化前與變化後兩種不同均衡狀態的內生變數。"],
"Dynamic analysis":["Dynamic analysis","動態分析","討論由某均衡移動到另一新均衡時變數隨時間歷程的變動（如蛛網理論）。"],
"Correspondence principle":["Correspondence principle","對應原理","薩繆爾森提出：比較靜態結果與動態結果須一致，模型才稱穩定。"],
"Partial equilibrium":["Partial equilibrium","部分均衡分析","其他情況不變下只就經濟體系某一特定部分進行分析；個體經濟多數採用。"],
"General equilibrium":["General equilibrium","一般均衡分析","考慮所有部門與變數之間關係、使每一部門都達到均衡的分析；總體經濟多數採用。"],
"Consumer surplus":["Consumer surplus","消費者剩餘 (CS)","給定消費數量下消費者最高願付價格與實際付出價格之間的差額。"],
"Producer surplus":["Producer surplus","生產者剩餘 (PS)","給定生產數量下生產者收入與實際投入成本之間的差額。"],
"Social welfare":["Social welfare","社會福利 (SW)","無政府介入：SW = CS + PS；有政府介入另加稅收、減補貼與無謂損失。"],
"Deadweight loss":["Deadweight loss","無謂損失 (DWL)","又稱超額負擔；因生產量低於競爭均衡產量而損失的社會福利。"],
"Lump sum tax":["Lump sum tax","定額稅","固定收取一筆的稅收，不隨數量改變。"],
"Excise tax":["Excise tax","從量稅","每單位商品課徵固定 t 元的稅；T = t·Q。"],
"Ad valorem tax":["Ad valorem tax","從價稅","每塊錢課徵 t% 的稅；T = t·PQ。"],
"Price ceiling":["Price ceiling","價格上限","價格被管制在均衡價格之下造成超額需求；須低於市場價格才有效。"],
"Price floor":["Price floor","價格下限","價格被管制在均衡價格之上造成超額供給；須高於市場價格才有效。"],
"Rent-seeking":["Rent-seeking","尋租行為","經濟個體為了賺取經濟租，利用既有利益或不正當行為取得特權。"],
"Ramsey rule":["Ramsey rule","羅西法則（倒需求彈性法則）","使各財貨課稅後無謂損失相同：需求彈性大的商品課低稅率、彈性小的課高稅率。"],
"Tax incidence":["Tax incidence","租稅歸宿","租稅經市場均衡後最終形成的實際負擔；法定歸宿≠經濟歸宿。"],
"Utility":["Utility","效用","消費某項商品時的滿足程度；數列效用視為可度量，序列效用僅能排序。"],
"Total utility":["Total utility","總效用 (TU)","其他情況不變，特定數量財貨消費帶來的滿足程度總和。"],
"Marginal utility":["Marginal utility","邊際效用 (MU)","其他情況不變，額外增加一單位財貨消費帶來的滿足程度增加額；MU = dTU/dQ。"],
"Law of diminishing marginal utility":["Law of diminishing marginal utility","邊際效用遞減法則","消費持續增加使邊際效用隨之遞減；總效用曲線為斜率遞減的曲線。"],
"Consumer equilibrium":["Consumer equilibrium","消費者均衡","預算限制下效用最大的條件：MU<sub>x</sub>/P<sub>x</sub> = MU<sub>y</sub>/P<sub>y</sub> = MU<sub>m</sub>（邊際效用均等法則）。"],
"Marginal utility of money":["Marginal utility of money","貨幣的邊際效用 (MU<sub>m</sub>)","增加一單位貨幣持有量使總效用增加的幅度；扮演將貨幣轉換為效用的角色。"],
"Paradox of value":["Paradox of value","價值的矛盾（鑽石與水的矛盾）","亞當斯密提出：水總效用高但價格低、鑽石總效用低但價格高；價格由邊際效用決定、價值由總效用決定。"],
"Cardinal utility":["Cardinal utility","數列效用分析","效用可以衡量運算、數字有意義、跨人可比較；使用邊際效用分析法。"],
"Ordinal utility":["Ordinal utility","序列效用分析","效用為主觀只能排序、值本身無意義；使用無異曲線分析法。"],
"Preference":["Preference","偏好","消費者對任意兩組商品的主觀二元排列；符號 ≻、≽、∼。"],
"Completeness":["Completeness","完整性","任意兩組商品皆可比較，不會出現無法抉擇的情況。"],
"Reflexivity":["Reflexivity","反射性","任一商品組合與它本身無異：A∼A。"],
"Transitivity":["Transitivity","遞移性","A≽B 且 B≽C → A≽C。"],
"Continuity":["Continuity","連續性","A≻B 則可找到夠接近 A 的 C 使 C≻B；商品可無限細分。字典性偏好違反之。"],
"Monotonicity":["Monotonicity","單調性","多一點東西至少一樣好（MU ≥ 0）；無飽和點。"],
"Convexity":["Convexity","凸性","兩商品線性組合至少不劣於原組合；嚴格凸＝平均優於極端。"],
"Lexicographic preference":["Lexicographic preference","字典性偏好","先比 x 數量、x 相同才比 y；違反連續性，每個點效用值皆不同。"],
"Utility function":["Utility function","效用函數","刻劃偏好結構的函數；A≻B ⟺ U(A) &gt; U(B)。"],
"Well-behaved preferences":["Well-behaved preferences","良好偏好","滿足六大基本公理（嚴格凸＋單調）的偏好；可用嚴格擬凹函數描述。"],
"Indifference curve":["Indifference curve","無異曲線","效用相同之商品組合的軌跡；負斜率、凸向原點、越東北效用越高、不相交。"],
"Marginal rate of substitution":["Marginal rate of substitution","邊際替代率 (MRS)","給定效用水準下願意犧牲 Y 換取一單位 X 的主觀比例；MRS<sub>xy</sub> = MU<sub>x</sub>/MU<sub>y</sub>。"],
"Positive monotonic transformation":["Positive monotonic transformation","單調遞增轉換","V = f(U) 且 f′&gt;0：偏好排序、無異曲線形狀、MRS、均衡消費量不變，僅效用值改變。"],
"Cobb-Douglas":["Cobb-Douglas","柯布-道格拉斯 (U = X<sup>α</sup>Y<sup>β</sup>)","良好偏好、位似偏好；MRS = αY/βX；支出比例固定。"],
"Leontief":["Leontief","里昂鐵夫（完全互補）(U = min(aX, bY))","固定比例消費、L 型無異曲線；MRS 無法定義；不滿足嚴格凸。"],
"Perfect substitutes":["Perfect substitutes","完全替代（Linear 型）(U = aX + bY)","直線無異曲線、MRS 固定；均衡為角隅解。"],
"Quasi-linear":["Quasi-linear","準線型 (U = v(X) + Y)","非線性＋線性部分；非線性財貨為所得中性財。"],
"Homothetic preferences":["Homothetic preferences","位似偏好","原點射出線與無異曲線所有交點的 MRS 相同；Cobb-Douglas 屬之。"],
"Budget constraint line":["Budget constraint line","預算限制線","P<sub>x</sub>x + P<sub>y</sub>y = M；斜率 −P<sub>x</sub>/P<sub>y</sub>＝消費 X 的機會成本。"],
"Consumption possibility set":["Consumption possibility set","消費可能集合","預算線下方三角形內消費者負擔得起的組合。"],
"Relative price":["Relative price","相對價格","某商品可換取其他商品數量的比例；如 P<sub>x</sub>/P<sub>y</sub>。"],
"Numeraire":["Numeraire","標準化商品","以某商品為標準（價格設為 1）衡量其他商品；常用於簡化分析。"],
"Endowment":["Endowment","原賦","消費者持有的一定數量商品 (x₀, y₀)；賣出原賦形成預算線（過原賦點）。"],
"Marshallian demand":["Marshallian demand","馬歇爾需求（普通需求）","效用極大化解出的需求函數 x(P,M)；未受補償需求。"],
"Hicksian demand":["Hicksian demand","希克斯需求（受補償需求）","支出極小化解出的需求函數 x(P,Ū)。"],
"Interior solution":["Interior solution","內部解","均衡時同時消費兩種商品（良好偏好下）。"],
"Corner solution":["Corner solution","角隅解","均衡時只消費單一商品；比較 MRS 與價格比決定。"],
"Indirect utility function":["Indirect utility function","間接效用函數 (V(P,M))","將馬歇爾需求代入效用函數；價格非遞增、所得非遞減、零階齊次。"],
"Expenditure function":["Expenditure function","支出函數 (E(P,Ū))","給定價格與效用水準的最小支出；價格凹且非遞減、一階齊次。"],
"Roy's identity":["Roy's identity","Roy 恆等式","由間接效用函數還原馬歇爾需求：x = −(∂V/∂P<sub>x</sub>)/(∂V/∂M)。"],
"Shephard's lemma":["Shephard's lemma","Shephard 定理","由支出函數還原希克斯需求：x = ∂E/∂P<sub>x</sub>。"],
"Substitution effect":["Substitution effect","替代效果 (SE)","相對價格改變後，扣除實質所得變動部分，純由相對價格引起的消費量變動（實質所得不變）。"],
"Income effect":["Income effect","所得效果 (IE)","相對價格不變下，實質所得（購買力）改變引起的消費量變動。"],
"Price effect":["Price effect","價格效果","替代效果＋所得效果（總效果）。"],
"Compensated variation":["Compensated variation","補償變量 (CV)","Hicks 定義：新價格下維持原效用水準所需增減的名目所得。"],
"Cost difference":["Cost difference","成本差額 (CD)","Slutsky 定義：維持原購買組合所需增減的名目所得。"],
"Equivalent variation":["Equivalent variation","相等變量 (EV)","舊價格下達到價格改變後新效用水準所需增減的名目所得。"],
"Consumer surplus":["Consumer surplus","消費者剩餘 (CS)","最高願付價格與實際支付價格差額的總和；福利變動衡量工具。"],
"Ordinary demand curve":["Ordinary demand curve","普通需求曲線","馬歇爾需求線：其他價格與所得固定下導出，包含替代與所得效果。"],
"Compensated demand curve":["Compensated demand curve","受補償需求曲線","希克斯需求線：效用（實質所得）不變下導出，只有替代效果、永遠負斜率。"],
"Giffen paradox":["Giffen paradox","季芬矛盾","所得效果力道大到使總需求量與價格同向變動；季芬財必為劣等財。"],
"Income consumption curve":["Income consumption curve","所得消費曲線 (ICC)","各所得水準下消費者均衡點移動的軌跡（所得擴張線）；只含所得效果。"],
"Price consumption curve":["Price consumption curve","價格消費曲線 (PCC)","各相對價格下消費者均衡點移動的軌跡；含替代與所得效果。"],
"Engel curve":["Engel curve","恩格爾曲線","所得與特定商品消費量的關係；由 ICC 對應導出。"],

    <li><b>特定期間內</b> → <span class="term" data-term="Demand">需求</span>為<span class="term" data-term="Flow">流量（flow）</span>變數；期間長短改變會影響<span class="term" data-term="Quantity demanded">需求量</span></li>
    <li><b>其他情況不變（Ceteris paribus）</b> → <span class="term" data-term="Exogenous variables">外生變數</span>不變，才能討論價格—數量的關係</li>
    <li><b>願意</b>（主觀慾望）＋<b>能夠</b>（客觀購買力）→ 兩者兼具才形成<span class="term" data-term="Demand">需求</span></li>
  </ul>
  <div class="warn">考試重點：日常生活「想要」≠<span class="term" data-term="Economics">經濟學</span>「<span class="term" data-term="Demand">需求</span>」——缺購買力只是慾望，不是<span class="term" data-term="Demand">需求</span>。</div>
  <p><b><span class="term" data-term="Quantity demanded">需求量（Quantity demanded）</span></b>：其他情況不變，給定某價格下願意且能購買的數量（<span class="term" data-term="Demand">需求</span>曲線上的<b>點</b>）。<b><span class="term" data-term="Demand">需求</span></b>＝各價格下<span class="term" data-term="Quantity demanded">需求量</span>之集合（整條<b>線</b>）。</p>
  <div class="method-card mc-title" data-mc="law-demand">
    <div class="mc-check"><input type="checkbox" id="mc-ch2-1" data-mc="law-demand"><label for="mc-ch2-1" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Law of demand">需求法則</span></div>
    <div class="mc-body">
      <div class="mc-formula">其他情況不變：價格↑ → <span class="term" data-term="Quantity demanded">需求量</span>↓；價格↓ → <span class="term" data-term="Quantity demanded">需求量</span>↑（反向變動，dQ/dP < 0）</div>
      <div class="mc-detail"><span class="term" data-term="Demand function">需求函數</span>：Q<sub>d</sub> = f(P；其他財貨價格、<span class="term" data-term="Preference">偏好</span>、所得、預期)；分號（;）右邊為<span class="term" data-term="Exogenous variables">外生變數</span>、當作既定常數。例：Q<sub>d</sub> = 12 − 2P。</div>
      <div class="mc-ex">例子：蘋果每顆 30 元買 5 顆、50 元買 2 顆 → 價格越高<span class="term" data-term="Quantity demanded">需求量</span>越低。</div>
    </div>
  </div>
  <p><b><span class="term" data-term="Demand">需求</span>價格（<span class="term" data-term="Inverse demand function">逆需求函數</span>）</b>：給定數量下消費者願付的最高價格＝買者的<span class="term" data-term="Reservation price">保留價格</span>（Buyer's <span class="term" data-term="Reservation price">reservation price</span>）。例：P = 6 − Q/2。</p>
  <p><b><span class="term" data-term="Demand schedule">需求表（Demand schedule）</span></b>：價格與數量間的不連續關係表。</p>
  <div class="method-card mc-title" data-mc="market-demand">
    <div class="mc-check"><input type="checkbox" id="mc-ch2-2" data-mc="market-demand"><label for="mc-ch2-2" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Market demand">市場需求</span>＝水平加總</div>
    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Market demand">市場需求</span>＝個別<span class="term" data-term="Demand">需求</span>的水平加總：固定縱軸（價格）值，將橫軸（數量）值相加</div>
      <div class="mc-detail">水平加總適用<span class="term" data-term="Private good">私有財</span>；垂直加總（固定橫軸加縱軸）適用<span class="term" data-term="Public good">公共財</span>、<span class="term" data-term="Externality">外部性</span>、課稅、補貼。<span class="term" data-term="Market demand">市場需求</span>曲線在最高<span class="term" data-term="Reservation price">保留價格</span>處起折。</div>
      <div class="mc-ex">例子：市場只有 A、B 兩人，A <span class="term" data-term="Demand">需求</span> Q<sub>a</sub>=10−P、B <span class="term" data-term="Demand">需求</span> Q<sub>b</sub>=20−2P → 市場 Q = 30−3P。</div>
    </div>
  </div>
  <div class="svgfig">
    <figcaption><span class="term" data-term="Market demand">市場需求</span>＝個別<span class="term" data-term="Demand">需求</span>水平加總（固定價格下數量相加）。</figcaption>
    <svg viewBox="0 0 460 190" role="img" aria-label="市場需求水平加總">
      <text x="10" y="20" class="boxl">市場1</text><text x="175" y="20" class="boxl">市場2</text><text x="340" y="20" class="boxl"><tspan class="term" data-term="Market demand">市場需求</tspan></text>
      <g class="ax"><line x1="30" y1="150" x2="150" y2="150"/><line x1="30" y1="150" x2="30" y2="20"/><line x1="30" y1="150" x2="150" y2="40" class="curve"/></g>
      <g class="ax"><line x1="195" y1="150" x2="315" y2="150"/><line x1="195" y1="150" x2="195" y2="20"/><line x1="195" y1="150" x2="315" y2="60" class="curve"/></g>
      <g class="ax"><line x1="360" y1="150" x2="460" y2="150"/><line x1="360" y1="150" x2="360" y2="20"/><line x1="360" y1="150" x2="460" y2="30" class="curve"/></g>
    </svg>
  </div>
  <p><b><span class="term" data-term="Quantity demanded">需求量</span>變動 vs <span class="term" data-term="Demand">需求</span>變動</b>：</p>
  <div class="tblwrap"><table><colgroup><col style="width:20%"><col style="width:40%"><col style="width:40%"></colgroup>
    <thead><tr><th></th><th><span class="term" data-term="Quantity demanded">需求量</span>變動</th><th><span class="term" data-term="Demand">需求</span>變動</th></tr></thead>
    <tbody>
      <tr><td>原因</td><td>商品本身價格變動（<span class="term" data-term="Endogenous variables">內生變數</span>）</td><td>本身價格以外因素變動（<span class="term" data-term="Exogenous variables">外生變數</span>）</td></tr>
      <tr><td>圖形</td><td>同一條線上點的移動（Movement）</td><td>整條線移動（Shift）</td></tr>
    </tbody>
  </table></div>
  <p><b><span class="term" data-term="Demand">需求</span>變動因素</b>：</p>
  <ul>
    <li><b>其他財貨價格</b>：<span class="term" data-term="Substitution goods">替代品</span>價格↑ → 本商品<span class="term" data-term="Demand">需求</span>↑（線右移）；<span class="term" data-term="Complementary goods">互補品</span>價格↑ → 本商品<span class="term" data-term="Demand">需求</span>↓（線左移）；<span class="term" data-term="Unrelated goods">無關品</span>不變</li>
    <li><b>所得</b>：<span class="term" data-term="Normal goods">正常財</span>所得↑→右移；<span class="term" data-term="Inferior goods">劣等財</span>所得↑→左移；<span class="term" data-term="Neutral goods">中性財</span>不變</li>
    <li><b><span class="term" data-term="Preference">偏好</span></b>增強 → 右移；<b>預期</b>未來價格↑或所得↑ → 提前消費 → 右移</li>
    <li><b>消費者人數</b>↑ → <span class="term" data-term="Market demand">市場需求</span>右移</li>
    <li><b><span class="term" data-term="Network externality">網路外部性</span></b>：正（<span class="term" data-term="Bandwagon effect">隨波逐流</span>）→ <span class="term" data-term="Demand">需求</span>線更平坦；負（<span class="term" data-term="Snob effect">標新立異</span>）→ 更陡峭</li>
  </ul>
  <div class="warn">考試重點：本身價格 → 點的移動；所得／<span class="term" data-term="Preference">偏好</span>／相關財價格／預期／人數 → 線的移動。</div>
  <p><b>違反<span class="term" data-term="Law of demand">需求法則</span>的財貨</b>：</p>
  <div class="tblwrap"><table><colgroup><col style="width:24%"><col style="width:38%"><col style="width:38%"></colgroup>
    <thead><tr><th></th><th><span class="term" data-term="Conspicuous goods">炫耀性財貨</span>（Veblen goods）</th><th><span class="term" data-term="Giffen goods">季芬財（Giffen goods）</span></th></tr></thead>
    <tbody>
      <tr><td>特性</td><td>以高價格炫耀品味與地位，價格越高<span class="term" data-term="Utility">效用</span>越高、<span class="term" data-term="Quantity demanded">需求量</span>越多</td><td><span class="term" data-term="Inferior goods">劣等財</span>＋不符<span class="term" data-term="Law of demand">需求法則</span>（價格↑<span class="term" data-term="Quantity demanded">需求量</span>↑）</td></tr>
      <tr><td>常見</td><td>名牌精品、高價品</td><td>經濟落後地區的主食（如窮人主食）</td></tr>
    </tbody>
  </table></div>`
},
{
  id:"2.2", title:"需求價格彈性",
  body:`
  <p><span class="term" data-term="Elasticity">彈性（Elasticity）</span>：外在環境改變時，經濟個體調整資源配置方向的能力。<b><span class="term" data-term="Price elasticity of demand">需求價格彈性</span></b>：價格變動 1% 引起<span class="term" data-term="Quantity demanded">需求量</span>變動幾%。</p>
  <div class="method-card mc-title" data-mc="price-elasticity">
    <div class="mc-check"><input type="checkbox" id="mc-ch2-3" data-mc="price-elasticity"><label for="mc-ch2-3" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Point elasticity">點彈性</span></div>
    <div class="mc-body">
      <div class="mc-formula">ε = (dQ/dP)·(P/Q)　（取絕對值）；對數<span class="term" data-term="Elasticity">彈性</span>：ε = d ln Q / d ln P</div>
      <div class="mc-detail"><span class="term" data-term="Point elasticity">點彈性</span>＝函數在某一點的<span class="term" data-term="Elasticity">彈性</span>（價格變化極小）；<span class="term" data-term="Elasticity">彈性</span>已消除單位，單位改變不影響<span class="term" data-term="Elasticity">彈性</span>大小。直線<span class="term" data-term="Demand">需求</span>上任一<span class="term" data-term="Point elasticity">點彈性</span>受「斜率」與「點位置」影響。</div>
      <div class="mc-ex">例子：Q = 10 − 5P，P=1、Q=5 → ε = |(−5)×(1/5)| = 1。</div>
    </div>
  </div>
  <div class="method-card mc-title" data-mc="arc-elasticity">
    <div class="mc-check"><input type="checkbox" id="mc-ch2-4" data-mc="arc-elasticity"><label for="mc-ch2-4" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Arc elasticity">弧彈性（中點法）</span></div>
    <div class="mc-body">
      <div class="mc-formula">ε = [(Q₂−Q₁)/((Q₁+Q₂)/2)] ÷ [(P₂−P₁)/((P₁+P₂)/2)]</div>
      <div class="mc-detail">只有兩筆資料時使用；兩點取中點（相加除以二）消除方向性，又稱中點法（mid-point method）。</div>
      <div class="mc-ex">例子：P 由 0.75→1.00、Q 由 300→200 → ε = (−100/250)/(0.25/0.875) = 1.4。</div>
    </div>
  </div>
  <p><b>幾何<span class="term" data-term="Elasticity">彈性</span></b>（直線型<span class="term" data-term="Demand">需求</span>曲線的五個區段）：</p>
  <div class="tblwrap"><table><colgroup><col style="width:26%"><col style="width:20%"><col style="width:54%"></colgroup>
    <thead><tr><th>位置</th><th><span class="term" data-term="Elasticity">彈性</span>值</th><th>名稱與意義</th></tr></thead>
    <tbody>
      <tr><td>縱軸截距（最高價）</td><td>∞</td><td><span class="term" data-term="Perfectly elastic">完全彈性（Perfectly elastic）</span></td></tr>
      <tr><td>中點以上</td><td>> 1</td><td><span class="term" data-term="Elastic">富於彈性（Elastic）</span>：價格小幅變動→<span class="term" data-term="Quantity demanded">需求量</span>大幅變動</td></tr>
      <tr><td>中點</td><td>= 1</td><td><span class="term" data-term="Unitary elasticity">單一彈性</span>（Unitary）：價格與<span class="term" data-term="Quantity demanded">需求量</span>同幅度變動</td></tr>
      <tr><td>中點以下</td><td>< 1</td><td><span class="term" data-term="Inelastic">缺乏彈性（Inelastic）</span>：價格大幅變動→<span class="term" data-term="Quantity demanded">需求量</span>小幅變動</td></tr>
      <tr><td>橫軸截距（最低價）</td><td>0</td><td><span class="term" data-term="Perfectly inelastic">完全缺乏彈性（Perfectly inelastic）</span>：數量不變</td></tr>
    </tbody>
  </table></div>
  <div class="svgfig">
    <figcaption>直線<span class="term" data-term="Demand">需求</span>曲線的<span class="term" data-term="Elasticity">彈性</span>區段：中點以上<span class="term" data-term="Elastic">富於彈性</span>、中點<span class="term" data-term="Unitary elasticity">單一彈性</span>、中點以下<span class="term" data-term="Inelastic">缺乏彈性</span>。</figcaption>
    <svg viewBox="0 0 300 220" role="img" aria-label="需求彈性區段">
      <line x1="40" y1="190" x2="280" y2="190" class="ax"/><line x1="40" y1="190" x2="40" y2="15" class="ax"/>
      <line x1="40" y1="30" x2="270" y2="190" class="curve"/>
      <text x="52" y="24" class="boxl">P</text><text x="272" y="206" class="boxl">Q</text>
      <circle cx="155" cy="110" r="4" class="dot"/><text x="163" y="104" class="axl">中點 ε=1</text>
      <text x="60" y="60" class="axl">ε>1 <tspan class="term" data-term="Elastic">富於彈性</tspan></text><text x="120" y="160" class="axl">ε<1 <tspan class="term" data-term="Inelastic">缺乏彈性</tspan></text>
    </svg>
  </div>
  <p><b>個別<span class="term" data-term="Demand">需求</span>與<span class="term" data-term="Market demand">市場需求</span>之關係</b>：<span class="term" data-term="Market demand">市場需求</span>價格<span class="term" data-term="Elasticity">彈性</span>＝個別<span class="term" data-term="Price elasticity of demand">需求價格彈性</span>之加權平均，權重為各別<span class="term" data-term="Quantity demanded">需求量</span>占<span class="term" data-term="Market demand">市場需求</span>之比例。</p>`
},
{
  id:"2.3", title:"需求價格彈性對消費者支出的影響",
  body:`
  <p><b><span class="term" data-term="Total expenditure">總支出</span>（<span class="term" data-term="Total expenditure">Total expenditure</span>, TE）＝ P × Q</b>；價格變動對支出的影響取決於<span class="term" data-term="Elasticity">彈性</span>大小：</p>
  <div class="method-card mc-title" data-mc="expenditure">
    <div class="mc-check"><input type="checkbox" id="mc-ch2-5" data-mc="expenditure"><label for="mc-ch2-5" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Total expenditure">總支出</span>與<span class="term" data-term="Elasticity">彈性</span></div>
    <div class="mc-body">
      <div class="mc-formula">|ε|>1：價格↑→支出↓（反向）；|ε|=1：支出不變；|ε|<1：價格↑→支出↑（同向）</div>
      <div class="mc-detail"><span class="term" data-term="Elasticity">彈性</span>大（>1）適合薄利多銷；<span class="term" data-term="Elasticity">彈性</span>小（<1）降價反而使收入下降。</div>
      <div class="mc-ex">例子：穀賤傷農——糧食<span class="term" data-term="Elasticity">彈性</span>小，豐收價格↓→農民收入↓。</div>
    </div>
  </div>
  <p><b>應用</b>：</p>
  <ul>
    <li><b>以價制量</b>：<span class="term" data-term="Elasticity">彈性</span>大的商品，政府課稅提高價格可有效減少數量</li>
    <li><b>以量制價</b>：<span class="term" data-term="Elasticity">彈性</span>小的商品，限制數量可達到提高<span class="term" data-term="Price effect">價格效果</span></li>
    <li><b>薄利多銷</b>：<span class="term" data-term="Elasticity">彈性</span> > 1 的商品降價 → 總收入增加</li>
    <li><b>特級品外銷、次級品內銷</b>：外銷加運費價格上升，特級品<span class="term" data-term="Elasticity">彈性</span>小收入增加；次級品到處都是、<span class="term" data-term="Elasticity">彈性</span>大，留在本地降價收入增加</li>
  </ul>`
},
{
  id:"2.4", title:"交叉彈性",
  body:`
  <div class="method-card mc-title" data-mc="cross-elasticity">
    <div class="mc-check"><input type="checkbox" id="mc-ch2-6" data-mc="cross-elasticity"><label for="mc-ch2-6" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Cross elasticity">交叉彈性</span></div>
    <div class="mc-body">
      <div class="mc-formula">ε<sub>xy</sub> = (ΔQ<sub>x</sub>/Q<sub>x</sub>) ÷ (ΔP<sub>y</sub>/P<sub>y</sub>)＝X 財<span class="term" data-term="Quantity demanded">需求量</span>變動% ÷ Y 財價格變動%</div>
      <div class="mc-detail">衡量 Y 財價格變動 1% 引起 X 財<span class="term" data-term="Quantity demanded">需求量</span>變動幾%。</div>
      <div class="mc-ex">例子：火車票價 800→1000 元，機票量 1000→1500 張 → ε<sub>xy</sub> = (500/1250)/(200/900) = 1.8。</div>
    </div>
  </div>
  <div class="tblwrap"><table><colgroup><col style="width:24%"><col style="width:38%"><col style="width:38%"></colgroup>
    <thead><tr><th><span class="term" data-term="Cross elasticity">交叉彈性</span></th><th>財貨關係</th><th>意義</th></tr></thead>
    <tbody>
      <tr><td>ε<sub>xy</sub> > 0</td><td><span class="term" data-term="Substitution goods">替代品</span>（Substitutes）</td><td>Y 價格↑ → X <span class="term" data-term="Demand">需求</span>↑</td></tr>
      <tr><td>ε<sub>xy</sub> < 0</td><td><span class="term" data-term="Complementary goods">互補品</span>（Complements）</td><td>Y 價格↑ → X <span class="term" data-term="Demand">需求</span>↓</td></tr>
      <tr><td>ε<sub>xy</sub> = 0</td><td><span class="term" data-term="Unrelated goods">無關品</span>（Independents）</td><td>Y 價格變動不影響 X</td></tr>
    </tbody>
  </table></div>
  <div class="warn">考試重點：<span class="term" data-term="Cross elasticity">交叉彈性</span>看「Y 價格」對「X 數量」；符號正負決定替代／互補／無關。</div>`
},
{
  id:"2.5", title:"需求量與所得的關係",
  body:`
  <div class="method-card mc-title" data-mc="income-elasticity">
    <div class="mc-check"><input type="checkbox" id="mc-ch2-7" data-mc="income-elasticity"><label for="mc-ch2-7" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Income elasticity">所得彈性</span></div>
    <div class="mc-body">
      <div class="mc-formula">ε<sub>M</sub> = (ΔQ/Q) ÷ (ΔM/M)＝<span class="term" data-term="Quantity demanded">需求量</span>變動% ÷ 所得變動%</div>
      <div class="mc-detail">所得變動 1% 引起<span class="term" data-term="Quantity demanded">需求量</span>變動幾%。</div>
      <div class="mc-ex">例子：麵包 20→30 條、所得 20000→30000 → ε<sub>M</sub> = (10/25)/(10000/25000) = 1。</div>
    </div>
  </div>
  <div class="tblwrap"><table><colgroup><col style="width:26%"><col style="width:34%"><col style="width:40%"></colgroup>
    <thead><tr><th><span class="term" data-term="Income elasticity">所得彈性</span></th><th>財貨性質</th><th>特性</th></tr></thead>
    <tbody>
      <tr><td>ε<sub>M</sub> > 0</td><td><span class="term" data-term="Normal goods">正常財（Normal goods）</span></td><td>所得↑ → <span class="term" data-term="Demand">需求</span>↑</td></tr>

      <tr><td>ε<sub>M</sub> > 1</td><td><span class="term" data-term="Luxury goods">奢侈品（Luxury goods）</span></td><td><span class="term" data-term="Quantity demanded">需求量</span>變動% > 所得變動%</td></tr>

  <p><b><span class="term" data-term="Engel curve">恩格爾曲線（Engel curve）</span></b>：其他情況不變，表現消費者所得與<span class="term" data-term="Quantity demanded">需求量</span>關係的函數；以<span class="term" data-term="Quantity demanded">需求量</span>為自變數、所得為應變數。</p>

  <div class="warn">考試重點：生產上<span class="term" data-term="Complementary goods">互補品</span>（聯產品）看「同生產過程」；<span class="term" data-term="Production substitutes">生產上替代品</span>看「同要素、要素搶奪」。生產互補／替代 ≠ 消費互補／替代。</div>`
},
{
  id:"3.2", title:"供給價格彈性與其他相關彈性",
  body:`
  <p><b><span class="term" data-term="Supply elasticity">供給價格彈性（Supply elasticity）</span></b>：其他情況不變，商品價格變動 1% 引起<span class="term" data-term="Quantity supplied">供給量</span>變動幾%。</p>
  <div class="method-card mc-title" data-mc="supply-elasticity">
    <div class="mc-check"><input type="checkbox" id="mc-ch3-3" data-mc="supply-elasticity"><label for="mc-ch3-3" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Point elasticity">點彈性</span>＋弧<span class="term" data-term="Elasticity">彈性</span></div>
    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Point elasticity">點彈性</span>：ε<sub>s</sub> = (dQ/dP)·(P/Q)；<span class="term" data-term="Arc elasticity">弧彈性（中點法）</span>：ε<sub>s</sub> = (ΔQ/ΔP)×(中點 P/中點 Q)</div>
      <div class="mc-detail">與<span class="term" data-term="Demand">需求</span><span class="term" data-term="Elasticity">彈性</span>同公式結構；<span class="term" data-term="Supply">供給</span>線正斜率，<span class="term" data-term="Elasticity">彈性</span>為正，不需加絕對值。</div>
      <div class="mc-ex">例子：Q<sub>s</sub> = −12 + 2P，P=10、Q=8 → ε<sub>s</sub> = 2×(10/8) = 2.5。</div>
    </div>
  </div>
  <p><b><span class="term" data-term="Supply">供給</span>幾何<span class="term" data-term="Elasticity">彈性</span></b>（直線型<span class="term" data-term="Supply">供給</span>曲線）：</p>
  <div class="tblwrap"><table><colgroup><col style="width:30%"><col style="width:20%"><col style="width:50%"></colgroup>
    <thead><tr><th>直線型態</th><th><span class="term" data-term="Elasticity">彈性</span>值</th><th>特性</th></tr></thead>
    <tbody>
      <tr><td>縱軸出發直線</td><td>> 1</td><td><span class="term" data-term="Elastic">富於彈性</span>；隨<span class="term" data-term="Quantity supplied">供給量</span>增加<span class="term" data-term="Elasticity">彈性</span>變小</td></tr>
      <tr><td>橫軸出發直線</td><td>< 1</td><td><span class="term" data-term="Inelastic">缺乏彈性</span>；隨<span class="term" data-term="Quantity supplied">供給量</span>增加<span class="term" data-term="Elasticity">彈性</span>變大</td></tr>
      <tr><td>原點出發直線</td><td>= 1</td><td><span class="term" data-term="Unitary elasticity">單一彈性</span>；<span class="term" data-term="Elasticity">彈性</span>不隨<span class="term" data-term="Quantity supplied">供給量</span>改變</td></tr>
      <tr><td>垂直線</td><td>= 0</td><td><span class="term" data-term="Perfectly inelastic">完全缺乏彈性</span>（零<span class="term" data-term="Elasticity">彈性</span>）</td></tr>
      <tr><td>水平線</td><td>= ∞</td><td><span class="term" data-term="Perfectly elastic">完全彈性</span>（<span class="term" data-term="Elasticity">彈性</span>無限大）</td></tr>
    </tbody>
  </table></div>
  <p><b><span class="term" data-term="Cross elasticity of supply">供給交叉彈性</span></b>：其他商品價格變動 1% 引起本商品<span class="term" data-term="Quantity supplied">供給量</span>變動幾%。ε<sub>xy</sub> > 0 → <span class="term" data-term="Production substitutes">生產上替代品</span>；< 0 → 生產上<span class="term" data-term="Complementary goods">互補品</span>；= 0 → <span class="term" data-term="Unrelated goods">無關品</span>。</p>
  <div class="method-card mc-title" data-mc="supply-elasticity-factors">
    <div class="mc-check"><input type="checkbox" id="mc-ch3-4" data-mc="supply-elasticity-factors"><label for="mc-ch3-4" class="mc-lbl">學會</label></div>
    <div class="mc-left">影響<span class="term" data-term="Supply">供給</span><span class="term" data-term="Elasticity">彈性</span>的因素</div>
    <div class="mc-body">
      <div class="mc-formula">投入用途多、成本敏感度低、技術高、規模大、時間長、易保存、定義範圍小 → <span class="term" data-term="Supply">供給</span><span class="term" data-term="Elasticity">彈性</span>大</div>
      <div class="mc-detail">成本隨產量敏感度越大 → <span class="term" data-term="Supply">供給</span>線越陡 → <span class="term" data-term="Elasticity">彈性</span>越小；時間越長生產者可調整越多 → <span class="term" data-term="Elasticity">彈性</span>越大。</div>
      <div class="mc-ex">例子：蔬果不易保存、短期難以增產 → <span class="term" data-term="Supply">供給</span><span class="term" data-term="Elasticity">彈性</span>小；工業製品易保存、時間長可擴廠 → <span class="term" data-term="Elasticity">彈性</span>大。</div>
    </div>
  </div>
  <p><b><span class="term" data-term="Cost elasticity of supply">供給的成本彈性</span></b>：成本變動 1% 引起<span class="term" data-term="Quantity supplied">供給量</span>變動幾%。</p>
  <div class="warn">考試重點：<span class="term" data-term="Demand">需求</span>與<span class="term" data-term="Supply">供給</span><span class="term" data-term="Elasticity">彈性</span>共同口訣——<span class="term" data-term="Substitution goods">替代品</span>越多<span class="term" data-term="Elasticity">彈性</span>越大、時間越長<span class="term" data-term="Elasticity">彈性</span>越大；<span class="term" data-term="Supply">供給</span>另記「技術越高、規模越大、越易保存」<span class="term" data-term="Elasticity">彈性</span>越大。</div>`
},
];

  <p><b>分析方法分類</b>：</p>

  <p><span class="proper">薩繆爾森（Paul Samuelson）</span>提出<b><span class="term" data-term="Correspondence principle">對應原理</span></b>：比較靜態結果須與動態結果一致，<span class="term" data-term="Model">模型</span>才稱穩定。另按範圍分<b>部分<span class="term" data-term="Equilibrium">均衡</span></b>（個經多數）與<b>一般<span class="term" data-term="Equilibrium">均衡</span></b>（總經多數）。</p>

    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Demand">需求</span>右移 → P↑、Q↑；<span class="term" data-term="Supply">供給</span>右移 → P↓、Q↑；供需同向移動 → Q 方向確定、P 看幅度</div>
      <div class="mc-detail">數理：Q<sub>d</sub> = a − bP、Q<sub>s</sub> = −c + dP → P* = (a+c)/(b+d)、Q* = (ad−bc)/(b+d)。<span class="term" data-term="Demand">需求</span>外生參數 a↑ → P*、Q* 皆升；<span class="term" data-term="Supply">供給</span>參數 c↑ → P* 降、Q* 升。</div>

  </div>

  <p><b><span class="term" data-term="Consumer surplus">消費者剩餘（Consumer's surplus, CS）</span></b>：其他情況不變，給定消費數量下，消費者心中最高願付價格與實際付出價格之間的差額。</p>
  <p><b><span class="term" data-term="Producer surplus">生產者剩餘（Producer's surplus, PS）</span></b>：其他情況不變，給定生產數量下，生產者收入與實際投入成本之間的差額。</p>

    <text x="330" y="55" font-size="13" fill="#2f5d62">D</text>
    <line x1="60" y1="60" x2="360" y2="250" stroke="#b0561f" stroke-width="2.4"/>
    <text x="330" y="258" font-size="13" fill="#b0561f">S</text>
    <circle cx="210" cy="155" r="4" fill="#b45309"/>
    <line x1="40" y1="155" x2="210" y2="155" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
    <line x1="210" y1="155" x2="210" y2="270" stroke="#b45309" stroke-width="1.2" stroke-dasharray="4 3"/>
    <polygon points="60,250 210,155 60,155" fill="#2f5d62" opacity="0.25"/>
    <polygon points="60,155 210,155 210,60" fill="#b0561f" opacity="0.25"/>
    <text x="78" y="215" font-size="13" fill="#2f5d62">CS</text>
    <text x="120" y="105" font-size="13" fill="#b0561f">PS</text>
    <text x="6" y="150" font-size="13" fill="#b45309">P*</text>
  </svg>
  </div>
  <p><b>社會福利（<span class="term" data-term="Social welfare">Social welfare</span>, SW）</b>：無政府介入下 SW = CS + PS；有政府介入下 SW = CS + PS + 稅收 − 補貼 − <span class="term" data-term="Deadweight loss">無謂損失</span>。</p>
  <p><b>經濟租</b>：<span class="term" data-term="Supply">供給</span><span class="term" data-term="Inelastic">缺乏彈性</span>時產生的剩餘（如球星薪水、獨特土地）。</p>
  <div class="method-card mc-title" data-mc="surplus-area">
    <div class="mc-check"><input type="checkbox" id="mc-ch4-2" data-mc="surplus-area"><label for="mc-ch4-2" class="mc-lbl">學會</label></div>
    <div class="mc-left">剩餘＝三角形面積</div>
    <div class="mc-body">
      <div class="mc-formula">CS = 最高願付 − 實付 = <span class="term" data-term="Demand">需求</span>線下、價格線上之面積；PS = 收入 − 成本 = 價格線下、<span class="term" data-term="Supply">供給</span>線上之面積</div>
      <div class="mc-detail">SW = CS + PS（無政府）；計算用三角形面積公式（底 × 高 ÷ 2）。</div>
      <div class="mc-ex">例子：<span class="term" data-term="Demand">需求</span> P = 100 − 2Q、<span class="term" data-term="Supply">供給</span> P = 20，<span class="term" data-term="Equilibrium">均衡</span> Q = 40 → CS = (100−20)×40÷2 = 1600；PS = 0（水平<span class="term" data-term="Supply">供給</span>線無剩餘）。</div>
    </div>
  </div>
  <div class="warn">考試重點：經濟租的產生由於<span class="term" data-term="Supply">供給</span>線傾向<span class="term" data-term="Inelastic">缺乏彈性</span>（例題 4.10）。</div>`
},
{
  id:"4.3", title:"政府介入對社會福利的影響",
  body:`
  <p>若市場無失靈且政府不干預，可達社會福利最大；政府介入會產生<b><span class="term" data-term="Deadweight loss">無謂損失（Deadweight loss, DWL）</span></b>＝超額負擔＝因生產量低於<span class="term" data-term="Competitive equilibrium">競爭均衡</span>產量而損失的社會福利。</p>
  <p><b>政府介入手段</b>：</p>
  <div class="tblwrap"><table><colgroup><col style="width:22%"><col style="width:39%"><col style="width:39%"></colgroup>
    <thead><tr><th>類型</th><th>課稅</th><th>補貼</th></tr></thead>
    <tbody>
      <tr><td>定額</td><td>固定收取一筆：T = t̄</td><td>固定補貼一筆：S = s̄</td></tr>
      <tr><td>從量</td><td>每單位付 t 元：T = t·Q</td><td>每單位獲 s 元：S = s·Q</td></tr>
      <tr><td>從價</td><td>每塊錢付 t% ：T = t·PQ</td><td>每塊錢獲 s% ：S = s·PQ</td></tr>
    </tbody>
  </table></div>
  <div class="method-card mc-title" data-mc="excise-tax">
    <div class="mc-check"><input type="checkbox" id="mc-ch4-3" data-mc="excise-tax"><label for="mc-ch4-3" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Specific tax">從量稅</span>與補貼</div>
    <div class="mc-body">
      <div class="mc-formula">對消費者課<span class="term" data-term="Specific tax">從量稅</span> → <span class="term" data-term="Demand">需求</span>線垂直下移 t；對生產者課<span class="term" data-term="Specific tax">從量稅</span> → <span class="term" data-term="Supply">供給</span>線垂直上移 t。補貼方向相反</div>
      <div class="mc-detail">稅/補貼不改變課徵對象本身的供需線，但改變對方看到的線；計算時須將函數化為 P = f(Q) 形式。無論課稅或補貼對象是消費者或生產者，對社會福利與<span class="term" data-term="Deadweight loss">無謂損失</span>的影響都一樣。</div>
      <div class="mc-ex">例子：<span class="term" data-term="Demand">需求</span> P = 100 − 2Q、<span class="term" data-term="Supply">供給</span> P = 20 + Q，課<span class="term" data-term="Specific tax">從量稅</span> t = 6 → 新<span class="term" data-term="Equilibrium">均衡</span> Q 降、消費者付的價格升、生產者收到的價格降。</div>
    </div>
  </div>
  <p><b>福利分析結果</b>：</p>
  <div class="tblwrap"><table><colgroup><col style="width:26%"><col style="width:37%"><col style="width:37%"></colgroup>
    <thead><tr><th>項目</th><th>課<span class="term" data-term="Specific tax">從量稅</span>後</th><th>從量補貼後</th></tr></thead>
    <tbody>
      <tr><td><span class="term" data-term="Equilibrium">均衡</span>數量</td><td>下降</td><td>上升</td></tr>
      <tr><td>消費者剩餘</td><td>下降</td><td>上升</td></tr>
      <tr><td>生產者剩餘</td><td>下降</td><td>上升</td></tr>
      <tr><td>社會福利</td><td>下降（產生 DWL）</td><td>下降（產生 DWL）</td></tr>
      <tr><td>政府收支</td><td>稅收上升</td><td>補貼支出上升</td></tr>
    </tbody>
  </table></div>
  <div class="warn">考試重點：DWL 的定義——(A) 總稅收 (B) 因稅造成的生產者＋消費者剩餘損失 (C) 稅收＋剩餘損失 (D) 剩餘損失 − 稅收 → 答案為 (B)。</div>`
},
{
  id:"4.4", title:"政府介入市場的其他手段",
  body:`
  <p>政府除課稅與補貼外，可用價格管制或數量管制介入市場。</p>
  <p><b><span class="term" data-term="Price ceiling">價格上限（Price ceiling）</span></b>：價格被管制在<span class="term" data-term="Equilibrium">均衡</span>價格之下 → 超額<span class="term" data-term="Demand">需求</span>。須低於市場價格才有效。用意在壓抑過高價格保護消費者，但生產者剩餘一定下降、消費者剩餘增減不確定。</p>
  <p><b><span class="term" data-term="Price floor">價格下限（Price floor）</span></b>：價格被管制在<span class="term" data-term="Equilibrium">均衡</span>價格之上 → 超額<span class="term" data-term="Supply">供給</span>。須高於市場價格才有效。常見於農產品、勞動市場（工會、勞基法）。用意在拉高價格保護生產者，但消費者剩餘一定下降、生產者剩餘增減不確定。</p>
  <p><b>超額<span class="term" data-term="Demand">需求</span>的解決方式</b>：</p>
  <ul>
    <li><b>排隊</b>：時間成本分配資源（時間成本高的自動退出）；缺點是浪費時間</li>
    <li><b>轉售（黃牛）</b>：溢價分配資源、節省時間成本轉為黃牛收入</li>
    <li><b>抽籤</b>：人人機會均等；但可能資源配置低落（非最需要的人得到）</li>
    <li><b><span class="term" data-term="Rent-seeking">尋租行為（Rent-seeking）</span></b>：利用既有利益或不正當行為取得特權（走後門）</li>
    <li><b>甄選制度</b>：大學聯考、研究所考試等</li>
  </ul>
  <p><b>超額<span class="term" data-term="Supply">供給</span>的解決方式</b>：</p>
  <ul>
    <li><b>保證價格收購制</b>：政府設定<span class="term" data-term="Price floor">價格下限</span>，保證收購市場上所有超額<span class="term" data-term="Supply">供給</span></li>
    <li><b>價差補貼制</b>：政府設定<span class="term" data-term="Price floor">價格下限</span>並補貼使全數售出的差額（直接補貼：市場自由運作，價格低於設定價時補差價）</li>
  </ul>
  <div class="warn">考試重點：面對<span class="term" data-term="Price ceiling">價格上限</span>，市場<span class="term" data-term="Equilibrium">均衡</span>數量依「短邊原則」（<span class="term" data-term="Quantity supplied">供給量</span>）決定。</div>`
},
{
  id:"4.5", title:"羅西法則與租稅轉嫁",
  body:`
  <p><b><span class="term" data-term="Ramsey rule">羅西法則（Ramsey rule）</span></b>＝倒<span class="term" data-term="Demand">需求</span><span class="term" data-term="Elasticity">彈性</span>法則：希望任何財貨課稅後造成的<span class="term" data-term="Deadweight loss">無謂損失</span>相同 → <span class="term" data-term="Demand">需求</span><span class="term" data-term="Elasticity">彈性</span>大的商品課低稅率、<span class="term" data-term="Demand">需求</span><span class="term" data-term="Elasticity">彈性</span>小的課高稅率。</p>
  <div class="method-card mc-title" data-mc="tax-incidence">
    <div class="mc-check"><input type="checkbox" id="mc-ch4-4" data-mc="tax-incidence"><label for="mc-ch4-4" class="mc-lbl">學會</label></div>
    <div class="mc-left">租稅轉嫁</div>
    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Supply">供給</span><span class="term" data-term="Elasticity">彈性</span>越大 → 生產者負擔越少、消費者負擔越多；<span class="term" data-term="Demand">需求</span><span class="term" data-term="Elasticity">彈性</span>越大 → 消費者負擔越少、生產者負擔越多</div>
      <div class="mc-detail">極端：<span class="term" data-term="Supply">供給</span>水平線（<span class="term" data-term="Elasticity">彈性</span>∞）→ 生產者不負擔；<span class="term" data-term="Supply">供給</span>垂直線（<span class="term" data-term="Elasticity">彈性</span> 0）→ 生產者負擔全部。<span class="term" data-term="Demand">需求</span>水平線 → 消費者不負擔；<span class="term" data-term="Demand">需求</span>垂直線 → 消費者負擔全部。法定歸宿（誰繳稅）≠ 經濟歸宿（誰實際負擔）。</div>
      <div class="mc-ex">例子：香菸<span class="term" data-term="Demand">需求</span><span class="term" data-term="Inelastic">缺乏彈性</span> → 課稅後消費者負擔大部分稅額。</div>
    </div>
  </div>
  <p><b>數理結論</b>：DWL 隨<span class="term" data-term="Demand">需求</span>線與<span class="term" data-term="Supply">供給</span>線斜率（a、d）變大而變小——<span class="term" data-term="Elasticity">彈性</span>越小，課稅的<span class="term" data-term="Deadweight loss">無謂損失</span>越小，故應對<span class="term" data-term="Elasticity">彈性</span>小的商品課較高稅率。</p>
  <div class="warn">考試重點：租稅轉嫁口訣——「<span class="term" data-term="Elasticity">彈性</span>小的一方負擔多」；雙倍課稅造成的 DWL 會「超過」雙倍（例題 4.20，因 DWL ∝ t²）。</div>`
},
];

  <p>面對資源稀少，消費者如何選擇？<span class="term" data-term="Rationality">理性</span>消費者依「<span class="term" data-term="Preference">偏好</span>」排序商品組合。<span class="term" data-term="Preference">偏好（Preference）</span>＝消費者對任意兩組商品的主觀二元排列（每次只比兩組，選出較喜歡的）。符號：≻ 嚴格優於、≽ 弱優於、∼ 無異於。</p>

  <p><b><span class="term" data-term="Budget constraint line">預算限制線（Budget constraint line）</span></b>：所得與價格給定下可消費的財貨組合軌跡。</p>

{

      <div class="mc-detail">幾何：<span class="term" data-term="Indifference curve">無異曲線</span>與預算線相切。用拉格朗日法求解：L = U(x,y) + λ(M − P<sub>x</sub>x − P<sub>y</sub>y)，一階條件即 MRS = 價格比；二階條件（<span class="term" data-term="Well-behaved preferences">良好偏好</span>）保證為極大值。解得的<span class="term" data-term="Demand function">需求函數</span>稱馬歇爾<span class="term" data-term="Demand">需求</span>（普通<span class="term" data-term="Demand">需求</span>、未受補償<span class="term" data-term="Demand">需求</span>）。</div>

  <p><b>不<span class="term" data-term="Equilibrium">均衡</span>調整</b>：若 MRS<sub>xy</sub> > P<sub>x</sub>/P<sub>y</sub>（主觀願放棄的 Y 多於客觀必須放棄的）→ 多消費 X；反之少消費 X。</p>
  <p><b><span class="term" data-term="Corner solution">角隅解（Corner solution）</span></b>：<span class="term" data-term="Preference">偏好</span>不滿足<span class="term" data-term="Well-behaved preferences">良好偏好</span>時，<span class="term" data-term="Equilibrium">均衡</span>可能只在消費單一商品（如嚴格凹<span class="term" data-term="Preference">偏好</span>、Linear 型）；Linear 型須比較 MRS 與價格比：MRS > P<sub>x</sub>/P<sub>y</sub> → 全消費 X；MRS < → 全消費 Y；相等 → 複數<span class="term" data-term="Equilibrium">均衡</span>。<span class="term" data-term="Leontief">Leontief</span> 型<span class="term" data-term="Equilibrium">均衡</span>在轉折點（固定比例）。</p>

    </tbody>
  </table></div>
  <div class="warn">考試重點：<span class="term" data-term="Cobb-Douglas">Cobb-Douglas</span> <span class="term" data-term="Demand function">需求函數</span>零階齊次；x 自身價格<span class="term" data-term="Elasticity">彈性</span> = −1、<span class="term" data-term="Income elasticity">所得彈性</span> = 1、<span class="term" data-term="Cross elasticity">交叉彈性</span> = 0（與 y <span class="term" data-term="Demand">需求</span>上無關）。</div>`
},
{
  id:"6.5", title:"對偶性理論",
  body:`
  <p><b>對偶性（Duality）</b>：同一個問題從兩個不同角度看，結果相同。消費者問題＝<span class="term" data-term="Utility">效用</span>極大化 vs 支出極小化。</p>
  <div class="tblwrap"><table><colgroup><col style="width:50%"><col style="width:50%"></colgroup>
    <thead><tr><th><span class="term" data-term="Utility">效用</span>極大化</th><th>支出極小化</th></tr></thead>
    <tbody>
      <tr><td>max U(x,y)　s.t. P<sub>x</sub>x + P<sub>y</sub>y = M</td><td>min P<sub>x</sub>x + P<sub>y</sub>y　s.t. U(x,y) = Ū</td></tr>
      <tr><td>解出馬歇爾<span class="term" data-term="Demand">需求</span> x(P,M)、y(P,M)</td><td>解出希克斯<span class="term" data-term="Demand">需求</span> x(P,Ū)、y(P,Ū)</td></tr>
      <tr><td>代入目標 → <b><span class="term" data-term="Indirect utility function">間接效用函數</span></b> V(P,M)</td><td>代入目標 → <b><span class="term" data-term="Expenditure function">支出函數</span></b> E(P,Ū)</td></tr>
      <tr><td><span class="term" data-term="Roy's identity">Roy 恆等式</span>：x = −(∂V/∂P<sub>x</sub>)/(∂V/∂M)</td><td><span class="term" data-term="Shephard's lemma">Shephard 定理</span>：x = ∂E/∂P<sub>x</sub></td></tr>
    </tbody>
  </table></div>
  <div class="method-card mc-title" data-mc="duality">
    <div class="mc-check"><input type="checkbox" id="mc-ch6-4" data-mc="duality"><label for="mc-ch6-4" class="mc-lbl">學會</label></div>
    <div class="mc-left">對偶性</div>
    <div class="mc-body">
      <div class="mc-formula">V(P,M) 與 E(P,Ū) 互為反函數；x(P, E(P,Ū)) = x<sup>h</sup>(P,Ū)；x<sup>h</sup>(P, V(P,M)) = x(P,M)</div>
      <div class="mc-detail">間接<span class="term" data-term="Utility function">效用函數</span>性質：價格非遞增、所得非遞減、零階齊次、價格準凸；支出函數性質：價格凹且非遞減、一階齊次。λ（拉格朗日乘數）＝所得邊際<span class="term" data-term="Utility">效用</span>。</div>
      <div class="mc-ex">例子：U = min(g/2, v)（兩份琴酒配一份苦艾酒）→ <span class="term" data-term="Demand">需求</span> g = 2M/(2P<sub>g</sub>+P<sub>v</sub>)、v = M/(2P<sub>g</sub>+P<sub>v</sub>)；支出函數 E = Ū(2P<sub>g</sub>+P<sub>v</sub>)。</div>
    </div>
  </div>`
},
{
  id:"6.6", title:"全章考試總複習清單",
  body:`
  <ul>
    <li>六大公理：完整、反射、遞移、連續、單調、凸（前三個是公理、後三個是假設）</li>
    <li><span class="term" data-term="Well-behaved preferences">良好偏好</span>＝嚴格凸＋<span class="term" data-term="Monotonicity">單調性</span> → <span class="term" data-term="Indifference curve">無異曲線</span>凸向原點、<span class="term" data-term="Interior solution">內部解</span>唯一</li>
    <li>MRS = MU<sub>x</sub>/MU<sub>y</sub>；MRS 遞減與邊際<span class="term" data-term="Utility">效用</span>遞減無必然關係</li>
    <li>四大<span class="term" data-term="Utility function">效用函數</span>：<span class="term" data-term="Cobb-Douglas">Cobb-Douglas</span>（位似）、<span class="term" data-term="Leontief">Leontief</span>（互補）、Linear（替代）、<span class="term" data-term="Quasi-linear">Quasi-linear</span>（所得<span class="term" data-term="Neutral goods">中性財</span>）</li>
    <li>預算線斜率 = −P<sub>x</sub>/P<sub>y</sub>；價格變動轉動、所得變動平移</li>
    <li><span class="term" data-term="Equilibrium">均衡</span>：MRS = P<sub>x</sub>/P<sub>y</sub>；<span class="term" data-term="Corner solution">角隅解</span>比較 MRS 與價格比</li>
    <li>對偶：<span class="term" data-term="Utility">效用</span>極大 ↔ 支出極小；<span class="term" data-term="Roy's identity">Roy 恆等式</span> ↔ <span class="term" data-term="Shephard's lemma">Shephard 定理</span></li>
  </ul>`
},
];

const CH7_SECTIONS = [
{
  id:"7.1", title:"替代效果與所得效果",
  body:`
  <p><b><span class="term" data-term="Price effect">價格效果（Price effect）</span></b>＝替代效果＋所得效果（總效果）。</p>
  <div class="method-card mc-title" data-mc="se-ie">
    <div class="mc-check"><input type="checkbox" id="mc-ch7-1" data-mc="se-ie"><label for="mc-ch7-1" class="mc-lbl">學會</label></div>
    <div class="mc-left">替代與所得效果</div>
    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Price effect">價格效果</span> = 替代效果（SE）＋ 所得效果（IE）</div>
      <div class="mc-detail"><b>替代效果</b>：<span class="term" data-term="Relative price">相對價格</span>改變後，扣除實質所得變動部分，純由<span class="term" data-term="Relative price">相對價格</span>引起的消費量變動（維持實質所得不變）。<b>所得效果</b>：<span class="term" data-term="Relative price">相對價格</span>不變下，實質所得（購買力）改變引起的消費量變動。</div>
      <div class="mc-ex">例子：牛肉價格上漲 → 替代效果：改買雞肉（相對變便宜）；所得效果：變窮、所有消費減少。</div>
    </div>
  </div>
  <div class="tblwrap"><table><colgroup><col style="width:30%"><col style="width:70%"></colgroup>
    <thead><tr><th>實質所得不變的定義</th><th>說明</th></tr></thead>
    <tbody>
      <tr><td><b>Hicks 替代效果</b></td><td>維持在原<span class="term" data-term="Utility">效用</span>水準；所需增減的名目所得＝<b>補償變量（<span class="term" data-term="Compensated variation">Compensated variation</span>, CV）</b></td></tr>
      <tr><td><b>Slutsky 替代效果</b></td><td>維持在原購買組合；所需增減的名目所得＝<b>成本差額（<span class="term" data-term="Cost difference">Cost difference</span>, CD）</b></td></tr>
      <tr><td><b>相等變量（EV）</b></td><td>價格改變前價格水準下，讓消費者感受與價格改變後相同滿足感所需增減的所得</td></tr>
    </tbody>
  </table></div>
  <p><b>福利衡量</b>：序列<span class="term" data-term="Utility">效用</span>下<span class="term" data-term="Utility">效用</span>值僅能排序，故用貨幣變化量（CV、EV、消費者剩餘）衡量福利變動。消費者剩餘（CS）＝最高願付價格與實際支付價格差額的總和；價格由 P₀ 降至 P₁ 時 ΔCS 為梯形面積。</p>
  <div class="warn">考試重點：單純名目所得改變不產生替代效果；CV 是「新價格下維持舊<span class="term" data-term="Utility">效用</span>」需增減的所得，EV 是「舊價格下達到新<span class="term" data-term="Utility">效用</span>」需增減的所得。</div>`
},
{
  id:"7.2", title:"普通與受補償需求曲線",
  body:`
  <p><b><span class="term" data-term="Ordinary demand curve">普通需求曲線</span>（馬歇爾<span class="term" data-term="Demand">需求</span>線）</b>：其他財貨價格與所得固定下導出——包含替代效果與所得效果；又稱未<span class="term" data-term="Compensated demand curve">受補償需求曲線</span>。</p>
  <p><b><span class="term" data-term="Compensated demand curve">受補償需求曲線</span>（希克斯<span class="term" data-term="Demand">需求</span>線）</b>：其他財貨價格不變且實質所得（<span class="term" data-term="Utility">效用</span>）不變下導出——只有替代效果；又稱補償<span class="term" data-term="Demand">需求</span>曲線。</p>
  <div class="tblwrap"><table><colgroup><col style="width:26%"><col style="width:37%"><col style="width:37%"></colgroup>
    <thead><tr><th>財貨性質</th><th>替代效果（SE）</th><th>所得效果（IE）</th></tr></thead>
    <tbody>
      <tr><td><b><span class="term" data-term="Normal goods">正常財</span></b></td><td>與價格反向</td><td>與價格反向（同向加強）</td></tr>
      <tr><td><b><span class="term" data-term="Inferior goods">劣等財</span></b></td><td>與價格反向</td><td>與價格同向（反向抵銷）</td></tr>
      <tr><td><b><span class="term" data-term="Giffen goods">季芬財</span>（Giffen）</b></td><td>與價格反向</td><td>與價格同向且幅度大於 SE → <span class="term" data-term="Demand">需求</span>曲線正斜率</td></tr>
      <tr><td><b>所得<span class="term" data-term="Neutral goods">中性財</span></b></td><td>與價格反向</td><td>無所得效果 → <span class="term" data-term="Demand">需求</span>曲線必負斜率</td></tr>
    </tbody>
  </table></div>
  <p><b><span class="term" data-term="Giffen paradox">季芬矛盾（Giffen paradox）</span></b>：所得效果力道大到使總<span class="term" data-term="Quantity demanded">需求量</span>與價格同向變動。<span class="term" data-term="Giffen goods">季芬財</span>必為<span class="term" data-term="Inferior goods">劣等財</span>，但<span class="term" data-term="Inferior goods">劣等財</span>未必是<span class="term" data-term="Giffen goods">季芬財</span>。</p>
  <div class="warn">考試重點：<span class="term" data-term="Compensated demand curve">受補償需求曲線</span>永遠負斜率；馬歇爾<span class="term" data-term="Demand">需求</span>曲線只有在商品非<span class="term" data-term="Inferior goods">劣等財</span>時才保證負斜率。<span class="term" data-term="Normal goods">正常財</span>價格下降時，<span class="term" data-term="Ordinary demand curve">普通需求曲線</span>的增加量 > <span class="term" data-term="Compensated demand curve">受補償需求曲線</span>（例題 7.13）。</div>`
},
{
  id:"7.3", title:"所得與價格消費曲線",
  body:`
  <p><b>所得消費曲線（ICC）</b>（又稱所得<span class="term" data-term="Expansion path">擴張線</span>）：其他情況不變，各所得水準下<span class="term" data-term="Consumer equilibrium">消費者均衡</span>點移動的軌跡；僅反應所得效果。</p>
  <p><b>價格消費曲線（PCC）</b>：其他情況不變，財貨<span class="term" data-term="Relative price">相對價格</span>改變時<span class="term" data-term="Consumer equilibrium">消費者均衡</span>移動的軌跡；反應替代與所得效果。</p>
  <div class="tblwrap"><table><colgroup><col style="width:24%"><col style="width:38%"><col style="width:38%"></colgroup>
    <thead><tr><th>曲線形狀</th><th>ICC 含義</th><th>PCC 含義</th></tr></thead>
    <tbody>
      <tr><td>正斜率</td><td>兩財貨皆<span class="term" data-term="Normal goods">正常財</span></td><td>兩財貨互補且 X <span class="term" data-term="Demand">需求</span><span class="term" data-term="Elasticity">彈性</span> < 1</td></tr>
      <tr><td>水平線</td><td>—</td><td>兩財貨無關且 X <span class="term" data-term="Demand">需求</span><span class="term" data-term="Elasticity">彈性</span> = 1</td></tr>
      <tr><td>負斜率</td><td>其中一財貨為<span class="term" data-term="Inferior goods">劣等財</span>（另一必為<span class="term" data-term="Luxury goods">奢侈品</span>，<span class="term" data-term="Engel aggregation">恩格爾加總定理</span>）</td><td>兩財貨替代且 X <span class="term" data-term="Demand">需求</span><span class="term" data-term="Elasticity">彈性</span> > 1</td></tr>
      <tr><td>垂直線</td><td>—</td><td>X 必為<span class="term" data-term="Inferior goods">劣等財</span>（<span class="term" data-term="Demand">需求</span>曲線垂直、<span class="term" data-term="Elasticity">彈性</span> = 0）</td></tr>
      <tr><td>原點射出射線</td><td>兩財貨<span class="term" data-term="Income elasticity">所得彈性</span> = 1（如 <span class="term" data-term="Cobb-Douglas">Cobb-Douglas</span>）</td><td>—</td></tr>
    </tbody>
  </table></div>
  <p><b>Engel 曲線</b>：ICC 上每點對應所得與 X 消費量的關係（將馬歇爾<span class="term" data-term="Demand">需求</span>整理成 M = f(x)）。</p>
  <div class="warn">考試重點：ICC/PCC 上每一點皆滿足<span class="term" data-term="Consumer equilibrium">消費者均衡</span>；PCC 垂直 ⟺ X 為<span class="term" data-term="Inferior goods">劣等財</span>且<span class="term" data-term="Demand">需求</span>曲線垂直。</div>`
},
{
  id:"7.4", title:"史勒斯基方程式",
  body:`
  <p><b>史勒斯基方程式（Slutsky equation）</b>：把<span class="term" data-term="Price effect">價格效果</span>分解為替代效果與所得效果。</p>
  <div class="method-card mc-title" data-mc="slutsky">
    <div class="mc-check"><input type="checkbox" id="mc-ch7-2" data-mc="slutsky"><label for="mc-ch7-2" class="mc-lbl">學會</label></div>
    <div class="mc-left">史勒斯基方程式</div>
    <div class="mc-body">
      <div class="mc-formula">∂x/∂P<sub>x</sub> = ∂x<sup>h</sup>/∂P<sub>x</sub> − x·(∂x/∂M)（總效果 = 替代效果 − x·所得效果）</div>
      <div class="mc-detail">受補償<span class="term" data-term="Demand">需求</span>線斜率永遠為負；只要商品非<span class="term" data-term="Inferior goods">劣等財</span>，普通<span class="term" data-term="Demand">需求</span>線必為負斜率。<span class="term" data-term="Giffen goods">季芬財</span>＝<span class="term" data-term="Inferior goods">劣等財</span>且所得效果力道超過替代效果；但所得效果要強，該商品消費量必須大（乘上 x），而消費量大的商品（如房屋）通常不會是<span class="term" data-term="Inferior goods">劣等財</span>，故現實中<span class="term" data-term="Giffen goods">季芬財</span>罕見。</div>
      <div class="mc-ex">例子：價格上升 1 元（dP > 0）→ 維持購買原數量 x₀ 需多花 x₀·dP，實質所得下降 x₀·dP（故所得項帶負號）。</div>
    </div>
  </div>
  <p><b>總效果與淨效果</b>：毛（總）效果包含替代與所得效果；淨效果只含替代效果（受補償<span class="term" data-term="Demand">需求</span>線部分）。</p>
  <div class="warn">考試重點：替代效果必與價格反向；<span class="term" data-term="Normal goods">正常財</span>的所得效果與價格反向（加強 SE），<span class="term" data-term="Inferior goods">劣等財</span>與價格同向（抵銷 SE），<span class="term" data-term="Giffen goods">季芬財</span>的 IE 大於 SE。</div>`
},
];

const CH8_SECTIONS = [
{
  id:"8.1", title:"補貼或課稅對消費者之影響",
  body:`
  <p>政府介入消費決策的兩種工具：<b>補貼</b>（降價或給所得）與<b>課稅</b>（加價或扣所得），操作上數學與幾何相反。</p>
  <div class="tblwrap"><table><colgroup><col style="width:22%"><col style="width:40%"><col style="width:38%"></colgroup>
    <thead><tr><th>方式</th><th>作法</th><th>預算線效果</th></tr></thead>
    <tbody>
      <tr><td><b>從量補貼</b></td><td>每單位補貼 S 元 → 實際支付價 (P−S)</td><td>價格下降 → 預算線變平坦外移</td></tr>
