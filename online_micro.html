    <div class="mc-body">
      <div class="mc-formula">相同補貼金額下：消費者<span class="term" data-term="Preference">偏好</span> 所得補貼 > 從量補貼；政策制定者<span class="term" data-term="Preference">偏好</span> 從量補貼（目標財消費增加多）</div>
      <div class="mc-detail">所得補貼不改變<span class="term" data-term="Relative price">相對價格</span>，<span class="term" data-term="Utility">效用</span>提升較大；從量補貼直接壓低目標財價格，能保證該財消費量增加。</div>
      <div class="mc-ex">例子：牛肉補貼 100 元——從量補貼：牛肉變便宜、多買牛肉；所得補貼：預算線外移、<span class="term" data-term="Utility">效用</span>更高但可能拿去買別的。</div>
    </div>
  </div>
  <div class="warn">考試重點：消費者自身<span class="term" data-term="Preference">偏好</span>所得補貼（<span class="term" data-term="Utility">效用</span>較高）；若政策目的是增加特定財貨消費，從量補貼較有效。補貼金額＝(P 前 − P 後)×消費量。</div>`
},
{
  id:"8.2", title:"勞動與休閒的選擇",
  body:`
  <p>家戶在商品市場是消費者、在<span class="term" data-term="Factor market">要素市場</span>是<span class="term" data-term="Supply">供給</span>者。<span class="term" data-term="Utility">效用</span>取決於<b>消費 C</b> 與<b>休閒 l</b>：U = U(C, l)。<span class="term" data-term="Time endowment">時間稟賦</span>為 T，工作時間 N，故 l + N = T。</p>
  <div class="method-card mc-title" data-mc="labor">
    <div class="mc-check"><input type="checkbox" id="mc-ch8-2" data-mc="labor"><label for="mc-ch8-2" class="mc-lbl">學會</label></div>
    <div class="mc-left">勞動<span class="term" data-term="Supply">供給</span></div>
    <div class="mc-body">
      <div class="mc-formula">MRS<sub>lC</sub> = w/P（休閒的價格＝工資率）；預算線：M + wT = PC + wl</div>
      <div class="mc-detail"><span class="term" data-term="Full income">全額所得（full income）</span>＝<span class="term" data-term="Time endowment">時間稟賦</span>價值 wT＋非勞動所得 M。工資上升：替代效果使工作增加、休閒減少；所得效果（休閒為<span class="term" data-term="Normal goods">正常財</span>）使休閒增加、工作減少。<b><span class="term" data-term="Backward bending labor supply">後彎勞動供給曲線</span></b>需兩個條件：休閒為<span class="term" data-term="Normal goods">正常財</span>＋SE 幅度小於 IE。</div>
      <div class="mc-ex">例子：低薪時加薪 → SE>IE → 多工作（正斜率）；高薪時再加薪 → IE>SE → 少工作（後彎）。</div>
    </div>
  </div>
  <p><b>對勞動課比例稅</b>：稅後工資 (1−t)w → 預算線變平坦；休閒為<span class="term" data-term="Normal goods">正常財</span>時工作減少。</p>
  <div class="warn">考試重點：勞動<span class="term" data-term="Supply">供給</span>曲線後彎 = 工資上升但工作時間下降（違反<span class="term" data-term="Law of supply">供給法則</span>），條件是休閒為<span class="term" data-term="Normal goods">正常財</span>且 IE>SE；若休閒為<span class="term" data-term="Inferior goods">劣等財</span>則勞動<span class="term" data-term="Supply">供給</span>曲線必正斜率。</div>`
},
{
  id:"8.3", title:"跨期消費理論",
  body:`
  <p>兩期<span class="term" data-term="Model">模型</span>：第 1、2 期所得 (y₁,y₂)、消費 (c₁,c₂)。消費者選擇儲蓄或借款以極大化跨期<span class="term" data-term="Utility">效用</span>。</p>
  <div class="method-card mc-title" data-mc="intertemporal">
    <div class="mc-check"><input type="checkbox" id="mc-ch8-3" data-mc="intertemporal"><label for="mc-ch8-3" class="mc-lbl">學會</label></div>
    <div class="mc-left">跨期決策</div>
    <div class="mc-body">
      <div class="mc-formula">實質<span class="term" data-term="Intertemporal budget constraint">跨期預算線</span>：c₁ + c₂/(1+r) = y₁ + y₂/(1+r)；<span class="term" data-term="Equilibrium">均衡</span>：MRS = 1+r；Euler 方程式：u'(c₁) = (1+r)/(1+ρ)·u'(c₂)</div>
      <div class="mc-detail">斜率 −(1+r)：多消費 1 單位現在，須犧牲 (1+r) 單位未來。<span class="term" data-term="Time preference">時間偏好</span>率 ρ 為未來<span class="term" data-term="Utility">效用</span>的折現率（主觀利率）。利率上升：借款者第一期消費下降、儲蓄增加（可能轉為存款者）；存款者效果依 SE 與 IE 相對力道而定。</div>
      <div class="mc-ex">例子：ρ=r → u'(c₁)=u'(c₂) → c₁=c₂（<span class="term" data-term="Consumption smoothing">消費平滑</span>）；ρ<r → 第一期消費少、多儲蓄。</div>
    </div>
  </div>
  <p><b>時間可分型</b>：U = u(c₁) + βu(c₂)，β=1/(1+ρ) 為<span class="term" data-term="Discount factor">折現因子</span>，<span class="term" data-term="Time preference">時間偏好</span>率為外生常數。<b><span class="term" data-term="Consumption smoothing">消費平滑（Consumption smoothing）</span></b>：ρ=r 時各期消費相等。</p>
  <div class="warn">考試重點：借款者利率上升必減少第一期消費（SE＋IE 同向）；存款者利率上升的效果不確定（SE 與 IE 反向）。<span class="term" data-term="Time preference">時間偏好</span>率高 → <span class="term" data-term="Preference">偏好</span>現在消費。</div>`
},
{
  id:"8.4", title:"顯示性偏好理論",
  body:`
  <p><b>顯示性<span class="term" data-term="Preference">偏好</span></b>（<span class="proper">Paul Samuelson</span>，1938）：由市場上消費者的實際選擇反推<span class="term" data-term="Preference">偏好</span>，不需探討<span class="term" data-term="Utility function">效用函數</span>。若在既定價格所得下買得起 B 卻選擇 A，則 A 顯示性<span class="term" data-term="Preference">偏好</span>於 B。</p>
  <div class="tblwrap"><table><colgroup><col style="width:26%"><col style="width:74%"></colgroup>
    <thead><tr><th>公理</th><th>內容</th></tr></thead>
    <tbody>
      <tr><td><b><span class="term" data-term="Direct revealed preference">直接顯示性偏好</span></b></td><td>P·A ≥ P·B 且選擇 A → A <span class="term" data-term="Direct revealed preference">直接顯示性偏好</span>於 B</td></tr>
      <tr><td><b><span class="term" data-term="Indirect revealed preference">間接顯示性偏好</span></b></td><td>A 直接<span class="term" data-term="Preference">偏好</span>於 B、B 直接<span class="term" data-term="Preference">偏好</span>於 C → A 間接<span class="term" data-term="Preference">偏好</span>於 C（<span class="term" data-term="Transitivity">遞移性</span>）</td></tr>
      <tr><td><b><span class="term" data-term="WARP">WARP</span> 弱公理</b></td><td>若 A <span class="term" data-term="Direct revealed preference">直接顯示性偏好</span>於 B（A≠B），則不可能 B 也<span class="term" data-term="Direct revealed preference">直接顯示性偏好</span>於 A（<span class="term" data-term="Preference">偏好</span>一致性）</td></tr>
      <tr><td><b><span class="term" data-term="SARP">SARP</span> 強公理</b></td><td>（<span class="proper">Hendrik Houthakker</span>，1950）若 A 直接或<span class="term" data-term="Indirect revealed preference">間接顯示性偏好</span>於 B，則不可能 B 直接或<span class="term" data-term="Indirect revealed preference">間接顯示性偏好</span>於 A；滿足 <span class="term" data-term="SARP">SARP</span> ⟺ 行為可由<span class="term" data-term="Well-behaved preferences">良好偏好</span>導出</td></tr>
    </tbody>
  </table></div>
  <div class="method-card mc-title" data-mc="sarp">
    <div class="mc-check"><input type="checkbox" id="mc-ch8-4" data-mc="sarp"><label for="mc-ch8-4" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="SARP">SARP</span> 驗證</div>
    <div class="mc-body">
      <div class="mc-formula">支出矩陣：列＝不同價格、行＝不同消費組合；對角線為真正選擇的支出</div>
      <div class="mc-detail">每列比較各支出與對角線，較低或相等者標 ※（<span class="term" data-term="Direct revealed preference">直接顯示性偏好</span>），再檢查間接顯示性標 (※)。若第 i 行第 j 列有 ※ 而第 j 行第 i 列也有 ※ → 違反 <span class="term" data-term="SARP">SARP</span>。</div>
      <div class="mc-ex">例子：兩期兩組合若互為「買得起卻沒選」→ <span class="term" data-term="Preference">偏好</span>不一致，違反 <span class="term" data-term="WARP">WARP</span>。</div>
    </div>
  </div>
  <div class="warn">考試重點：選擇≠<span class="term" data-term="Preference">偏好</span>（可能只是比較便宜）；<span class="term" data-term="WARP">WARP</span> 檢驗直接<span class="term" data-term="Preference">偏好</span>一致性，<span class="term" data-term="SARP">SARP</span> 加上<span class="term" data-term="Transitivity">遞移性</span>檢驗間接<span class="term" data-term="Preference">偏好</span>。</div>`
},
{
  id:"8.5", title:"皮氏與拉氏指數",
  body:`
  <p><b>生活標準</b>＝任意選定的一個<span class="term" data-term="Utility">效用</span>水準；<b>生活成本</b>＝維持該生活水準所需的最低貨幣支出。</p>
  <div class="method-card mc-title" data-mc="index">
    <div class="mc-check"><input type="checkbox" id="mc-ch8-5" data-mc="index"><label for="mc-ch8-5" class="mc-lbl">學會</label></div>
    <div class="mc-left">物價指數</div>
    <div class="mc-body">
      <div class="mc-formula">真實物價指數 TPI = E(P₁, U₀)/E(P₀, U₀)；拉氏 L = P₁·x₀/P₀·x₀；皮氏 Pa = P₁·x₁/P₀·x₁</div>
      <div class="mc-detail"><span class="term" data-term="Laspeyres index">拉氏指數</span>用基期數量為權重 → <b>高估</b>生活成本；<span class="term" data-term="Paasche index">皮氏指數</span>用當期數量為權重 → <b>低估</b>生活成本。<span class="term" data-term="Expenditure index">支出指數</span> EI = 當期<span class="term" data-term="Total expenditure">總支出</span>/基期<span class="term" data-term="Total expenditure">總支出</span>。</div>
      <div class="mc-ex">例子：若 EI > TPI → 所得上升幅度大於生活成本 → 福利提高；L > EI → 生活水準上升。</div>
    </div>
  </div>
  <div class="tblwrap"><table><colgroup><col style="width:30%"><col style="width:35%"><col style="width:35%"></colgroup>
    <thead><tr><th>指數</th><th>權重</th><th>特性</th></tr></thead>
    <tbody>
      <tr><td><b><span class="term" data-term="Laspeyres index">拉氏指數</span>（Laspeyres）</b></td><td>基期數量 x₀</td><td>高估生活成本（L ≥ TPI 維持 U₀）</td></tr>
      <tr><td><b><span class="term" data-term="Paasche index">皮氏指數</span>（Paasche）</b></td><td>當期數量 x₁</td><td>低估生活成本（Pa ≤ TPI 維持 U₁）</td></tr>
      <tr><td><b><span class="term" data-term="Expenditure index">支出指數</span>（EI）</b></td><td>當期實際支出/基期實際支出</td><td>反映所得變化；EI>TPI → 福利上升</td></tr>
    </tbody>
  </table></div>
  <div class="warn">考試重點：拉氏高估、皮氏低估；L > EI 表示生活水準上升（消費得起基期組合），Pa < EI 表示生活水準下降。</div>`
},
];

const CH9_SECTIONS = [
{
  id:"9.1", title:"賭局與期望效用",
  body:`
  <p><b><span class="term" data-term="Risk">風險（Risk）</span></b>：出象未知但發生機率已知；<b><span class="term" data-term="Uncertainty">不確定性（Uncertainty）</span></b>：出象與機率皆未知。</p>
  <p><b><span class="term" data-term="Fair game">公平賭局（Fair game）</span></b>：期望貨幣利潤為零（EMV = 原始持有量）。<b><span class="term" data-term="St. Petersburg paradox">聖彼得堡矛盾（St. Petersburg paradox）</span></b>（<span class="proper">Nicolas Bernoulli</span>）：賭局的期望報酬無窮大，卻少有人願付出高代價參加——因為消費者追求<span class="term" data-term="Utility">效用</span>極大化而非貨幣極大化，必須以<span class="term" data-term="Utility">效用</span>衡量。</p>
  <div class="method-card mc-title" data-mc="eu">
    <div class="mc-check"><input type="checkbox" id="mc-ch9-1" data-mc="eu"><label for="mc-ch9-1" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Expected utility">期望效用</span></div>
    <div class="mc-body">
      <div class="mc-formula">賭局 L = (p, x; q, y) → E[U(L)] = p·u(x) + q·u(y)</div>
      <div class="mc-detail">由 <span class="proper">Von Neumann</span> 與 <span class="proper">Morgenstern</span> 發展（1940 年代）。狀態獨立假設；<span class="term" data-term="Utility function">效用函數</span>的單調遞增非線性轉換不保<span class="term" data-term="Preference">偏好</span>一致，但<b>單調遞增線性轉換（positive affine）</b>保有相同<span class="term" data-term="Preference">偏好</span>結構。</div>
      <div class="mc-ex">例子：擲硬幣贏得 4 元（機率 1/2）或輸 2 元（機率 1/2）→ EMV = 0.5×4 + 0.5×(−2) = 1 > 0 為有利賭局。</div>
    </div>
  </div>
  <div class="warn">考試重點：決策依據是<span class="term" data-term="Expected utility">期望效用</span>而非期望貨幣值；<span class="term" data-term="Expected utility">期望效用</span>函數只允許正仿射轉換。</div>`
},
{
  id:"9.2", title:"面對風險下之決策",
  body:`
  <div class="tblwrap"><table><colgroup><col style="width:24%"><col style="width:38%"><col style="width:38%"></colgroup>
    <thead><tr><th><span class="term" data-term="Risk">風險</span>態度</th><th><span class="term" data-term="Utility function">效用函數</span></th><th>行為</th></tr></thead>
    <tbody>
      <tr><td><b><span class="term" data-term="Risk averse">風險趨避</span>者</b></td><td>凹函數（u''<0），邊際<span class="term" data-term="Utility">效用</span>遞減</td><td>不參加<span class="term" data-term="Fair game">公平賭局</span>；願付<span class="term" data-term="Risk premium">風險溢價</span>換取確定</td></tr>
      <tr><td><b><span class="term" data-term="Risk lover">風險喜好</span>者</b></td><td>凸函數（u''>0）</td><td>參加<span class="term" data-term="Fair game">公平賭局</span>；<span class="term" data-term="Risk premium">風險溢價</span>為負</td></tr>
      <tr><td><b><span class="term" data-term="Risk neutral">風險中立</span>者</b></td><td>線性（u''=0）</td><td>參加與否無差異；<span class="term" data-term="Risk premium">風險溢價</span> = 0</td></tr>
    </tbody>
  </table></div>
  <p><b>確定性等值（<span class="term" data-term="Certainty equivalence">Certainty equivalence</span>, CE）</b>：確定所得下<span class="term" data-term="Utility">效用</span>等於賭局<span class="term" data-term="Expected utility">期望效用</span>的所得水準。E[U] = U(CE)。<b><span class="term" data-term="Risk premium">風險溢價</span>（<span class="term" data-term="Risk premium">Risk premium</span>, π）</b>＝EMV − CE：為避免<span class="term" data-term="Risk">風險</span>願付出的最大財富值（<span class="term" data-term="Risk">風險</span>的成本）。</p>
  <div class="method-card mc-title" data-mc="risk">
    <div class="mc-check"><input type="checkbox" id="mc-ch9-2" data-mc="risk"><label for="mc-ch9-2" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Risk">風險</span>衡量</div>
    <div class="mc-body">
      <div class="mc-formula">絕對<span class="term" data-term="Risk averse">風險趨避</span> R<sub>A</sub>(w) = −u''(w)/u'(w)；相對<span class="term" data-term="Risk averse">風險趨避</span> R<sub>R</sub>(w) = −w·u''(w)/u'(w)</div>
      <div class="mc-detail"><span class="proper">Arrow-Pratt</span> 量度：R<sub>A</sub> 衡量絕對<span class="term" data-term="Risk averse">風險趨避</span>程度；R<sub>R</sub> 為所得邊際<span class="term" data-term="Utility">效用</span>的<span class="term" data-term="Income elasticity">所得彈性</span>。保險：最適保險金額 α 滿足 u(w₀−πα) = p·u(w₀−L+α−πα) + (1−p)u(w₀−πα)；公平保費（保費率=損失機率）下保<span class="term" data-term="Full insurance">全險</span>。</div>
      <div class="mc-ex">例子：u(w) = −e^(−aw) → R<sub>A</sub> = a（常數）；u(w) = ln w → R<sub>R</sub> = 1（常數）。</div>
    </div>
  </div>
  <p><b><span class="term" data-term="Friedman-Savage proposition">Friedman-Savage 命題</span></b>：<span class="term" data-term="Utility function">效用函數</span>在低所得為凹、中所得為凸、高所得又為凹（兩個反曲點），故一般人可能同時買保險（規避<span class="term" data-term="Risk">風險</span>）又買彩券（喜好<span class="term" data-term="Risk">風險</span>）。</p>
  <div class="warn">考試重點：<span class="term" data-term="Risk averse">風險趨避</span>者在小有利賭局可能不參加、大利才參加；<span class="term" data-term="Risk lover">風險喜好</span>者在小不利賭局仍參加、大不利才退出。公平保費（費率＝機率）下<span class="term" data-term="Risk averse">風險趨避</span>者買<b><span class="term" data-term="Full insurance">全險</span></b>；保費率偏高時買部分險。</div>`
},
];

const CH10_SECTIONS = [

{
  id:"10.2", title:"生產函數",
  body:`
  <p><b><span class="term" data-term="Factors of production">生產要素（Factors of production）</span></b>：<span class="term">固定投入</span>（市場變化時投入量無法立即改變）、<span class="term">變動投入</span>（可立即改變）；四類要素＝土地（自然資源）、資本（實體／金融）、勞動、企業家精神。<b>中間財不算是<span class="term" data-term="Factors of production">生產要素</span></b>（如橡膠、鋼板）。</p>
  <p><b>短期（Short run）</b>：同時存在固定與變動要素；<b>長期（Long run）</b>：只有變動要素。此與曆法時間無關，視廠商性質而定（飲料店 vs 晶圓廠）。</p>
  <div class="method-card mc-title" data-mc="pf">

      <div class="mc-detail">CRS（固定）f(λL,λK)=λQ ⇔ 一階<span class="term" data-term="Homogeneous function">齊次函數</span>；IRS（遞增）> λQ；DRS（遞減）< λQ。<span class="term" data-term="Cobb-Douglas">Cobb-Douglas</span> Q=AL<sup>α</sup>K<sup>β</sup>：α+β=1→CRS、>1→IRS、<1→DRS。IRS/DRS 不保證齊次；CRS ⇔ 一階齊次。</div>
      <div class="mc-ex">例子：Q = L<sup>0.5</sup>K<sup>0.5</sup>（指數和=1）→ 固定<span class="term" data-term="Returns to scale">規模報酬</span>；Q = 4+5L（常數項）→ λ>1 時 f(λL)<λQ → <span class="term" data-term="Returns to scale">規模報酬</span>遞減。</div>
    </div>
  </div>
  <p><b><span class="term" data-term="Returns to scale">規模報酬（Returns to scale）</span></b>：所有要素同比變動（長期技術分析）；<b>邊際報酬</b>：單一要素變動（短期必然現象）。兩者為不同期間的概念。</p>
  <div class="warn">考試重點：CRS 與一階齊次為<b>若且唯若</b>；IRS、DRS 不能保證<span class="term" data-term="Homogeneous function">齊次函數</span>。</div>`
},
{
  id:"10.3", title:"短期生產結構",
  body:`
  <p>短期資本固定：Q = f(L, K̄) = TP。三種產量：<span class="term">總產量 TP</span>（最大產量，先凸向橫軸到反曲點、達最高點後負斜率）；<span class="term">平均產量 AP = TP/L</span>（原點射線斜率）；<span class="term">邊際產量 MP = ΔTP/ΔL</span>（切線斜率）。</p>
  <div class="method-card mc-title" data-mc="tp">
    <div class="mc-check"><input type="checkbox" id="mc-ch10-2" data-mc="tp"><label for="mc-ch10-2" class="mc-lbl">學會</label></div>
    <div class="mc-left">TP / AP / MP</div>
    <div class="mc-body">
      <div class="mc-formula">AP = TP/L（射線斜率）；MP = dTP/dL（切線斜率）；MP>AP ⇔ AP 遞增；MP<AP ⇔ AP 遞減；MP=AP 時 AP 最大</div>
      <div class="mc-detail">反曲點 → MP 最大；射線變切線 → AP 最大；水平切線 → MP=0、TP 最大。邊際量高於平均量時平均量遞增（相交不相切）。</div>
      <div class="mc-ex">例子：Q = 60L − 10L² → AP = 60 − 10L、MP = 60 − 20L；AP 最大在 L=3（MP=AP）。</div>
    </div>
  </div>
  <p><b><span class="term" data-term="Law of diminishing marginal returns">邊際報酬遞減法則（Law of diminishing marginal returns）</span></b>＝變比法則：技術固定、短期存在固定要素下，變動要素投入超過某一水準後 MP 遞減。</p>
  <p><b><span class="term" data-term="Output elasticity">要素產量彈性（Output elasticity）</span></b>：要素投入增加 1% 造成產量變動 %；勞動<span class="term" data-term="Elasticity">彈性</span> e<sub>L</sub> = MP<sub>L</sub>·L/Q、資本<span class="term" data-term="Elasticity">彈性</span> e<sub>K</sub> = MP<sub>K</sub>·K/Q。互補／替代／無關要素以 ∂MP<sub>L</sub>/∂K 之正負零判斷。</p>
  <div class="tblwrap"><table><colgroup><col style="width:16%"><col style="width:28%"><col style="width:28%"><col style="width:28%"></colgroup>
    <thead><tr><th>生產階段</th><th>MP<sub>L</sub></th><th>MP<sub>K</sub></th><th>廠商行為</th></tr></thead>
    <tbody>
      <tr><td>第一階段</td><td>>0（AP 遞增）</td><td><0</td><td>不會用資本生產</td></tr>
      <tr><td><b>第二階段（合理）</b></td><td>>0（AP 最高點至 MP=0）</td><td>>0</td><td>勞動資本皆投入</td></tr>
      <tr><td>第三階段</td><td><0</td><td>>0</td><td>勞動不投入（<span class="term" data-term="Disguised unemployment">隱藏性失業</span>）</td></tr>
    </tbody>
  </table></div>
  <p><b>粗耕</b>（資本密集，地廣人稀，極大化 AP<sub>L</sub> 於 MP=0 處）；<b>精耕</b>（勞動密集，地狹人稠，極大化 AP<sub>K</sub> 於 MP<sub>L</sub>=0 處）。</p>
  <p><b>邊際生產力付酬法則</b>：<span class="term" data-term="Perfect competition">完全競爭</span>下 w = P·MP<sub>L</sub>、r = P·MP<sub>K</sub>——要素實質報酬取決於邊際生產力。<b><span class="term" data-term="Euler's theorem">尤拉定理（Euler's theorem）</span></b>：一階<span class="term" data-term="Homogeneous function">齊次函數</span> Q = MP<sub>L</sub>·L + MP<sub>K</sub>·K，產量完全分配給勞動與資本（<span class="term" data-term="Marginal productivity theory of distribution">邊際生產力分配理論</span>）。</p>
  <div class="warn">考試重點：合理生產階段為第二階段（AP 最高點到 MP=0）；MP=0 時 TP 最大；AP 最大時 MP=AP（其他要素 MP 未必為零）。</div>`
},
{
  id:"10.4", title:"長期生產結構",
  body:`
  <p><b>良好技術假設</b>：<span class="term" data-term="Monotonicity">單調性</span>（增加任一要素投入使產量增加，MP>0）＋<span class="term" data-term="Convexity">凸性</span>（嚴格準凹）。</p>
  <p><span class="term">等產量線（Isoquant）</span>：其他情況不變下，達到特定產量所需要素組合的軌跡。特性：凸向原點（MRTS 遞減）、任兩條不相交、越向東北產量越高。<b>與<span class="term" data-term="Indifference curve">無異曲線</span>差異</b>：定義空間不同（要素 vs 商品）、數列 vs 序列（<span class="term" data-term="Isoquant">等產量線</span>產量值有意義）。</p>
  <div class="method-card mc-title" data-mc="iso">
    <div class="mc-check"><input type="checkbox" id="mc-ch10-3" data-mc="iso"><label for="mc-ch10-3" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Isocost curve">等成本線</span>與<span class="term" data-term="Production equilibrium">生產者均衡</span></div>
    <div class="mc-body">
      <div class="mc-formula">C = wL + rK；<span class="term" data-term="Equilibrium">均衡</span>：MRTS<sub>LK</sub> = MP<sub>L</sub>/MP<sub>K</sub> = w/r（邊際生產力均等法則）</div>
      <div class="mc-detail">花在每種要素的最後一塊錢回收的邊際產出相等：MP<sub>L</sub>/w = MP<sub>K</sub>/r。若 MRTS > w/r → 增加勞動、減少資本；反之亦然。<span class="term" data-term="Isocost curve">等成本線</span>越往外成本越高。</div>
      <div class="mc-ex">例子：Q = √(KL)，w=2、r=1 → MRTS = K/L = w/r = 2 → K=2L；Q=100 時 L=100/√2≈70.7、K≈141.4。</div>
    </div>
  </div>
  <div class="tblwrap"><table><colgroup><col style="width:22%"><col style="width:26%"><col style="width:26%"><col style="width:26%"></colgroup>
    <thead><tr><th><span class="term" data-term="Production function">生產函數</span></th><th>形式</th><th>替代性</th><th>σ（替代<span class="term" data-term="Elasticity">彈性</span>）</th></tr></thead>
    <tbody>
      <tr><td><span class="term" data-term="Cobb-Douglas">Cobb-Douglas</span></td><td>Q = AL<sup>α</sup>K<sup>β</sup></td><td>不完全替代</td><td>σ = 1</td></tr>
      <tr><td>Linear（直線）</td><td>Q = aL + bK</td><td>完全替代</td><td>σ = ∞</td></tr>
      <tr><td><span class="term" data-term="Leontief">Leontief</span>（李昂鐵夫）</td><td>Q = min(L/a, K/b)</td><td>完全互補</td><td>σ = 0</td></tr>
      <tr><td>Stone-Geary</td><td>Q = (L−L̄)<sup>α</sup>(K−K̄)<sup>β</sup></td><td>良好技術</td><td>—</td></tr>
      <tr><td>CES</td><td>Q = A[δL<sup>−ρ</sup> + (1−δ)K<sup>−ρ</sup>]<sup>−1/ρ</sup></td><td>固定替代<span class="term" data-term="Elasticity">彈性</span></td><td>σ = 1/(1+ρ)</td></tr>
    </tbody>
  </table></div>
  <p><b><span class="term" data-term="Production equilibrium">生產者均衡（Production equilibrium）</span></b>：給定成本下產量最大、或給定產量下成本最小，發生在<span class="term" data-term="Isoquant">等產量線</span>與<span class="term" data-term="Isocost curve">等成本線</span>相切點。</p>
  <div class="warn">考試重點：<span class="term" data-term="Equilibrium">均衡</span>條件 MRTS = w/r（而非 MP<sub>L</sub>=MP<sub>K</sub>）；CES 中 ρ→0 趨近 <span class="term" data-term="Cobb-Douglas">Cobb-Douglas</span>、ρ→∞ 趨近 <span class="term" data-term="Leontief">Leontief</span>。</div>`
},
{
  id:"10.5", title:"擴張線",
  body:`
  <p><span class="term">擴張線（Expansion path）</span>：其他情況不變，生產規模變化時<span class="term" data-term="Production equilibrium">生產者均衡</span>點移動的軌跡（以 K 為 L 的函數）。線上每一點皆符合<span class="term" data-term="Production equilibrium">生產者均衡</span>＝給定產量下最小總成本的要素組合。</p>
  <div class="method-card mc-title" data-mc="exp">
    <div class="mc-check"><input type="checkbox" id="mc-ch10-4" data-mc="exp"><label for="mc-ch10-4" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Expansion path">擴張線</span></div>
    <div class="mc-body">
      <div class="mc-formula">齊序（homothetic）<span class="term" data-term="Production function">生產函數</span> → <span class="term" data-term="Expansion path">擴張線</span>為原點出發之射線；<span class="term" data-term="Cobb-Douglas">Cobb-Douglas</span>：K = (βw/αr)·L</div>
      <div class="mc-detail">一階<span class="term" data-term="Homogeneous function">齊次函數</span>單調轉換而得的<span class="term" data-term="Homothetic function">齊序函數</span>，MRTS 只受 K/L 比例影響；原點射線與各<span class="term" data-term="Isoquant">等產量線</span>交點之 MRTS 相同。<span class="term" data-term="Inada condition">Inada 條件</span>：要素趨近 0 時 MP→∞、趨近 ∞ 時 MP→0（非必要假設但簡化分析）。</div>
      <div class="mc-ex">例子：Q = L<sup>0.4</sup>K<sup>0.6</sup>（α+β=1）→ <span class="term" data-term="Expansion path">擴張線</span> K = (0.6w/0.4r)L，為原點射線。</div>
    </div>
  </div>`
},
{
  id:"10.6", title:"替代彈性",
  body:`
  <p><span class="term">替代彈性（Elasticity of substitution, σ）</span>：給定產量下，MRTS 變動 1% 時要素比例 K/L 變動 %；衡量要素間替代的難易度，σ 越大<span class="term" data-term="Isoquant">等產量線</span>越平滑。σ = d ln(K/L) / d ln|MRTS|。</p>
  <p><b><span class="term" data-term="Elasticity of productivity">生產力彈性（Elasticity of productivity）</span></b>：所有要素投入變動 1% 使產量變動 %。一階<span class="term" data-term="Homogeneous function">齊次函數</span>之<span class="term" data-term="Elasticity of productivity">生產力彈性</span> = 1（= 齊次次數）；CES：σ = 1/(1+ρ)。</p>
  <p><b>Hicks 技術進步</b>：<span class="term">勞動節約型</span>（資本多用型，MP<sub>K</sub> 相對增加、斜率變平，勞動使用量減少）；<span class="term">資本節約型</span>（勞動多用型，MP<sub>L</sub> 相對增加、斜率變陡，資本使用量減少）。技術進步來源：R&D、發明、管理進步、互補要素、制度變革。</p>
  <div class="warn">考試重點：CD → σ=1；Linear → σ=∞；<span class="term" data-term="Leontief">Leontief</span> → σ=0；CES → σ=1/(1+ρ)。</div>`
},
{
  id:"10.7", title:"成本結構理論",
  body:`
  <p>往後所稱成本皆為<b><span class="term" data-term="Economic cost">經濟成本</span></b>＝<span class="term" data-term="Opportunity cost">機會成本</span>概念，包含：<span class="term">外顯成本（Explicit cost）</span>＝會計成本（使用外在要素、顯現在會計帳上）；<span class="term">內含成本（Implicit cost）</span>＝隱藏成本（使用自有要素、犧牲其他用途，不顯現在帳上）。</p>
  <div class="method-card mc-title" data-mc="ecost">
    <div class="mc-check"><input type="checkbox" id="mc-ch10-5" data-mc="ecost"><label for="mc-ch10-5" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Economic cost">經濟成本</span>與<span class="term" data-term="Economic profit">經濟利潤</span></div>
    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Economic profit">經濟利潤</span> = 收入 − <span class="term" data-term="Opportunity cost">機會成本</span> = <span class="term" data-term="Accounting profit">會計利潤</span> − <span class="term" data-term="Implicit cost">內含成本</span>；<span class="term" data-term="Normal profit">正常利潤</span>：<span class="term" data-term="Economic profit">經濟利潤</span> = 0（<span class="term" data-term="Accounting profit">會計利潤</span> = <span class="term" data-term="Implicit cost">內含成本</span>）</div>
      <div class="mc-detail"><span class="term" data-term="Opportunity cost">機會成本</span> = <span class="term" data-term="Explicit cost">外顯成本</span> + <span class="term" data-term="Implicit cost">內含成本</span>；為<b>事前</b>概念（影響決策）。<b><span class="term" data-term="Sunk cost">沉沒成本（Sunk cost）</span></b>：已支付且無論如何無法回收之成本，<b>事後</b>概念、不影響決策。<span class="term" data-term="Pure rent">純粹租（Pure rent）</span>：收入 = 生產者剩餘、<span class="term" data-term="Supply">供給</span>曲線垂直。</div>
      <div class="mc-ex">例子：放棄月薪 50,000 開麵店，月收入 60,000、支出 33,000 → <span class="term" data-term="Accounting profit">會計利潤</span> 27,000、<span class="term" data-term="Economic profit">經濟利潤</span> = 27,000 − 50,000 = −23,000（損失）。</div>
    </div>
  </div>
  <p><span class="term" data-term="Opportunity cost">機會成本</span>由 <span class="proper">李嘉圖（Ricardo）</span>提出；<span class="term" data-term="Explicit cost">外顯成本</span>為零時，<span class="term" data-term="Opportunity cost">機會成本</span> = <span class="term" data-term="Implicit cost">內含成本</span>。</p>
  <div class="warn">考試重點：<span class="term" data-term="Economic profit">經濟利潤</span>必定小於<span class="term" data-term="Accounting profit">會計利潤</span>；<span class="term" data-term="Accounting profit">會計利潤</span>為負 → <span class="term" data-term="Economic profit">經濟利潤</span>必為負；<span class="term" data-term="Normal profit">正常利潤</span>不是利潤為零，而是<span class="term" data-term="Economic profit">經濟利潤</span>為零。</div>`
},
{
  id:"10.8", title:"短期成本結構",
  body:`
  <p>短期資本固定：<span class="term">STC = TVC + TFC</span>（總變動＋總固定）。TVC 隨產量改變、TFC 為常數；<b><span class="term" data-term="Quasifixed cost">準固定成本（Quasifixed cost）</span></b>：開始生產才支付（如消防設備）。</p>
  <div class="method-card mc-title" data-mc="scost">
    <div class="mc-check"><input type="checkbox" id="mc-ch10-6" data-mc="scost"><label for="mc-ch10-6" class="mc-lbl">學會</label></div>
    <div class="mc-left">短期成本</div>
    <div class="mc-body">
      <div class="mc-formula">SAC = AVC + AFC；SMC = dSTC/dQ；AVC = w/AP<sub>L</sub>；SMC = w/MP<sub>L</sub></div>
      <div class="mc-detail">SMC 通過 SAC 與 AVC 的最低點；SAC 最低點在 AVC 最低點之後（AFC 遞減使差距縮小）。AP 最高 → AVC 最低；MP 最高 → SMC 最低。TVC 為 TP 之鏡像（縱橫軸互換）。</div>
      <div class="mc-ex">例子：Q = 10√L、K̄=100、w=5、r=10 → L = Q²/100 → STC = 5·Q²/100 + 1000 = Q²/20 + 1000。</div>
    </div>
  </div>
  <p><b><span class="term" data-term="Conditional factor demand">有條件要素需求（Conditional factor demand）</span></b>：給定產量下成本極小的要素<span class="term" data-term="Quantity demanded">需求量</span> L(Q, K̄)、K(Q, K̄)；產量上升 → 勞動<span class="term" data-term="Demand">需求</span>增加；資本增加 → 勞動<span class="term" data-term="Demand">需求</span>減少。</p>
  <div class="warn">考試重點：SMC < SAC ⇔ SAC 遞減；SMC = SAC 時 SAC 極小；AVC 水平線時 SMC 必水平；AVC 最低點時 SAC 尚未達最低（AFC 仍遞減）。</div>`
},
{
  id:"10.9", title:"長期成本結構",
  body:`
  <p>長期所有要素可調整：LTC(Q) = w·L(Q,w,r) + r·K(Q,w,r)，由長期<span class="term" data-term="Conditional factor demand">有條件要素需求</span>導出。</p>
  <div class="method-card mc-title" data-mc="lcost">
    <div class="mc-check"><input type="checkbox" id="mc-ch10-7" data-mc="lcost"><label for="mc-ch10-7" class="mc-lbl">學會</label></div>
    <div class="mc-left">長期成本（<span class="term" data-term="Envelope curve">包絡線</span>）</div>
    <div class="mc-body">
      <div class="mc-formula">LTC 為所有 STC 的<span class="term" data-term="Envelope curve">包絡線</span>；LAC 為所有 SAC 的<span class="term" data-term="Envelope curve">包絡線</span>；LAC ≤ SAC</div>
      <div class="mc-detail">長期每個產量可自由選擇要素組合 → 成本不高於任何短期成本。LMC 通過 LAC 最低點。<span class="term" data-term="Envelope curve">包絡線（Envelope curve）</span>＝每個產量下最小短期成本的集合。</div>
      <div class="mc-ex">例子：短期資本固定 K₀ 只能選 L₁；長期可自由調整至成本最小的 L* → 長期成本 ≤ 短期成本。</div>
    </div>
  </div>
  <div class="warn">考試重點：長期平均成本曲線是短期平均成本曲線的<span class="term" data-term="Envelope curve">包絡線</span>，且任何產量下 LAC 不高於 SAC。</div>`
},
{
  id:"10.10", title:"規模經濟",
  body:`
  <p><b>內部<span class="term" data-term="Economies of scale">規模經濟</span>（Internal <span class="term" data-term="Economies of scale">economies of scale</span>）</b>：生產規模擴大、廠商內部有利因素使平均成本降低——產量上升 LAC 下降（沿曲線移動）。</p>
  <p><b><span class="term" data-term="External economies of scale">外部規模經濟（External economies of scale）</span></b>：LAC 整條往下移動。常見原因：技術進步、要素價格下跌、<b>學習效果（Learning effect）</b>（<span class="term" data-term="Learning curve">學習曲線</span>：累積產量提升經驗與效率、每單位投入時間減少、平均成本下降）。<b>外部規模不經濟</b>：LAC 整條上移。</p>
  <div class="method-card mc-title" data-mc="scope">
    <div class="mc-check"><input type="checkbox" id="mc-ch10-8" data-mc="scope"><label for="mc-ch10-8" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Economies of scope">範疇經濟</span></div>
    <div class="mc-body">
      <div class="mc-formula">SC = [C(X)+C(Y)−C(X,Y)] / C(X,Y)；SC>0 <span class="term" data-term="Economies of scope">範疇經濟</span>、SC<0 範疇不經濟</div>
      <div class="mc-detail">單一廠商同時生產兩種產品之總成本，低於各別廠商生產之成本總和。衡量多角化的成本優勢。</div>
      <div class="mc-ex">例子：一家廠商同時生產蘋果派與蘋果醬，成本低於兩家廠商分別生產 → SC>0，存在<span class="term" data-term="Economies of scope">範疇經濟</span>。</div>
    </div>
  </div>
  <p><b><span class="term" data-term="Economies of scale">規模經濟</span>與<span class="term" data-term="Returns to scale">規模報酬</span></b>：CRS ⇔ LAC 固定（此時 LAC=LMC）；IRS → LAC 遞減（<span class="term" data-term="Economies of scale">規模經濟</span>）——反向推論不一定成立；LAC 出現規模不經濟 → <span class="term" data-term="Production function">生產函數</span>必為<span class="term" data-term="Returns to scale">規模報酬</span>遞減。</p>
  <p><b><span class="term" data-term="Homogeneous function">齊次函數</span>與規模<span class="term" data-term="Elasticity">彈性</span></b>：k 階齊次之規模<span class="term" data-term="Elasticity">彈性</span> ε=k。ε>1 → LAC 隨產量遞減（<span class="term" data-term="Economies of scale">規模經濟</span>）；ε=1 → <span class="term" data-term="Minimum efficient scale">最小效率規模</span>（LAC 常數）；ε<1 → 規模不經濟（LAC 遞增）。</p>
  <div class="warn">考試重點：<span class="term" data-term="Economies of scale">規模經濟</span>看 LAC 走勢（成本面）、<span class="term" data-term="Returns to scale">規模報酬</span>看<span class="term" data-term="Production function">生產函數</span>（生產面）；CRS ⇔ LAC 固定為若且唯若，其餘反向不一定。</div>`
},
{
  id:"10.11", title:"要素價格與成本結構",
  body:`
  <p><b><span class="term" data-term="Factors of production">生產要素</span>的種類</b>：<span class="term">正常要素</span>（產量增加 → 要素<span class="term" data-term="Demand">需求</span>增加）、<span class="term">中性要素</span>（<span class="term" data-term="Demand">需求</span>不變）、<span class="term">劣等要素</span>（<span class="term" data-term="Demand">需求</span>下降）。</p>
  <div class="method-card mc-title" data-mc="shephard">
    <div class="mc-check"><input type="checkbox" id="mc-ch10-9" data-mc="shephard"><label for="mc-ch10-9" class="mc-lbl">學會</label></div>
    <div class="mc-left">要素價格與成本（Shephard）</div>
    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Shephard's lemma">Shephard's lemma</span>：∂C/∂w = L、∂C/∂r = K；要素價格↑ → LAC 上移</div>
      <div class="mc-detail">對 MC 之影響（楊氏定理＋Shephard）：<span class="term" data-term="Normal factor">正常要素</span>價格↑ → MC 上移；<span class="term" data-term="Neutral factor">中性要素</span> → MC 不變；<span class="term" data-term="Inferior factor">劣等要素</span> → MC 下移。無論何種要素，價格上升 LAC 必上移。</div>
      <div class="mc-ex">例子：工資率上升 → <span class="term" data-term="Isocost curve">等成本線</span>外移、總成本上升 → LAC 上移；若勞動為<span class="term" data-term="Normal factor">正常要素</span>，SMC 也上移。</div>
    </div>
  </div>
  <div class="method-card mc-title" data-mc="profit">
    <div class="mc-check"><input type="checkbox" id="mc-ch10-10" data-mc="profit"><label for="mc-ch10-10" class="mc-lbl">學會</label></div>
    <div class="mc-left">利潤極大化兩階段</div>
    <div class="mc-body">
      <div class="mc-formula">第一階段 Min C=wL+rK s.t. Q=f(L,K) → C(Q)；第二階段 Max π=PQ−C(Q) → P=MC；<span class="term" data-term="Hotelling lemma">Hotelling lemma</span>：∂π/∂P = q</div>
      <div class="mc-detail">利潤極大 ⇒ 成本極小（必滿足 MRTS=w/r），但成本極小不一定利潤極大。合併兩階段可得<span class="term" data-term="Unconditional factor demand">無條件要素需求</span> L(P,w,r)、K(P,w,r) 與<span class="term" data-term="Indirect profit function">間接利潤函數</span> π(P,w,r)。</div>
      <div class="mc-ex">例子：<span class="term" data-term="Perfect competition">完全競爭</span> P=12、w=3、q=ln L → MPL=1/L → P·MPL=12/L=3 → L=4；50 家廠商產業僱用 200 人。</div>
    </div>
  </div>
  <div class="warn">考試重點：要素價格上升 LAC 必上移；<span class="term" data-term="Inferior factor">劣等要素</span>價格上升 MC 反而下移（正常/中性/劣等對 MC 的影響不同）。</div>`
},
{
  id:"10.12", title:"附錄 廠商行為",
  body:`
  <p><b>成本極小化</b>：Min C=wL+rK s.t. Q=f(L,K)，拉格朗日求解得條件要素<span class="term" data-term="Demand">需求</span> L(Q,w,r)、K(Q,w,r)；帶回目標函數得成本函數 C(Q)。</p>
  <p><b><span class="term" data-term="Shephard's lemma">Shephard's lemma</span></b>：∂C/∂w = L(Q,w,r)、∂C/∂r = K(Q,w,r)——成本函數對要素價格偏微分等於該要素的有條件<span class="term" data-term="Demand">需求</span>。</p>
  <p><b>利潤極大化</b>：Max π = PQ − C(Q)（或直接對 L、K 求解），一階條件 P·MP<sub>L</sub>=w、P·MP<sub>K</sub>=r；<span class="term" data-term="Unconditional factor demand">無條件要素需求</span>帶回得<span class="term" data-term="Indirect profit function">間接利潤函數</span>；<b><span class="term" data-term="Hotelling lemma">Hotelling lemma</span></b>：∂π/∂P = q（<span class="term" data-term="Supply">供給</span>曲線）、∂π/∂w = −L。</p>
  <p><b>兩階段合一</b>：利潤極大 ⇒ 成本極小（MRTS=w/r 同時滿足）；反之不成立。</p>`
},
];

const CH10_PROBLEMS = [
{
  q:"下列生產函數各存在何種規模報酬？(1) Q = L<sup>0.5</sup>K<sup>0.5</sup> (2) Q = 2L√K (3) Q = 4 + 5L (4) Q = 4√L + 5√K (5) Q = L − K （書本例題 10.1）",
  opts:["(A) 全為固定規模報酬","(B) (1)固定 (2)遞增 (3)遞減 (4)遞減 (5)固定","(C) (1)固定 (2)遞減 (3)遞增 (4)固定 (5)遞減","(D) (1)遞增 (2)固定 (3)遞減 (4)遞增 (5)固定"],

    </div>
  </div>
  <p><b>經濟效率（Economic efficiency）＝<span class="term" data-term="Pareto efficiency">柏拉圖效率（Pareto efficiency）</span></b>：資源配置已達無法在無人受害下讓有人得利的境界。<span class="term" data-term="Perfect competition">完全競爭</span><span class="term" data-term="Equilibrium">均衡</span>滿足 P=LMC → 社會福利最大。<b><span class="term" data-term="Technical efficiency">技術效率</span></b>：以最少要素投入組合生產特定產量；經濟效率必定<span class="term" data-term="Technical efficiency">技術效率</span>，反之不一定。</p>
  <div class="warn">考試重點：長期<span class="term" data-term="Equilibrium">均衡</span>時 P = LAC = LMC 在 LAC 最低點（<span class="term" data-term="Minimum efficient scale">最小效率規模</span>）；廠商賺<span class="term" data-term="Normal profit">正常利潤</span>、無超額利潤；P=LMC 為社會福利最大條件。</div>`
},
{
  id:"11.5", title:"長期供給曲線與產業供給曲線",
  body:`
  <p>產業＝生產<span class="term" data-term="Homogeneous products">同質商品</span>的廠商集合（市場的<span class="term" data-term="Supply">供給</span>面）；市場＝<span class="term" data-term="Homogeneous products">同質商品</span>的買方與賣方集合。長期產業<span class="term" data-term="Supply">供給</span>線不能簡單水平加總——需考慮要素價格、技術水準、廠商家數三個層次。</p>
  <div class="tblwrap"><table><colgroup><col style="width:26%"><col style="width:26%"><col style="width:24%"><col style="width:24%"></colgroup>
    <thead><tr><th>產業類型</th><th>定義</th><th>長期<span class="term" data-term="Supply">供給</span>線</th><th>原因</th></tr></thead>
    <tbody>
      <tr><td><b><span class="term" data-term="Constant cost industry">固定成本產業</span></b></td><td>LAC 不隨產業規模變化</td><td>水平</td><td>要素價格不變</td></tr>
      <tr><td><b><span class="term" data-term="Increasing cost industry">遞增成本產業</span></b></td><td>LAC 隨產業規模擴大上移（外部不經濟）</td><td>正斜率</td><td>要素價格上升</td></tr>
      <tr><td><b><span class="term" data-term="Decreasing cost industry">遞減成本產業</span></b></td><td>LAC 隨產業規模擴大下移（外部經濟）</td><td>負斜率</td><td>要素價格下跌</td></tr>
    </tbody>
  </table></div>
  <p><span class="term" data-term="Demand">需求</span>增加 → 短期價格上升、出現超額利潤 → 吸引廠商進入 → 長期回到 LAC 最低點、<span class="term" data-term="Normal profit">正常利潤</span>；連結前後長期<span class="term" data-term="Equilibrium">均衡</span>點即得產業長期<span class="term" data-term="Supply">供給</span>線。</p>
  <div class="warn">考試重點：正斜率長期<span class="term" data-term="Supply">供給</span>線 = 成本遞增產業（外部不經濟）；負斜率 = 成本遞減產業（外部經濟）；水平 = <span class="term" data-term="Constant cost industry">固定成本產業</span>。</div>`
},
{
  id:"11.6", title:"政府對完全競爭廠商的管制",
  body:`
  <p>假設<span class="term" data-term="Normal factor">正常要素</span>＋<span class="term" data-term="Constant cost industry">固定成本產業</span>，焦點在課稅。三種稅：<span class="term">定額稅（Lump sum tax）</span>、<span class="term">從量稅（Specific commodity tax）</span>（每單位固定稅額）、<span class="term">從價稅（Ad valorem tax）</span>（按價格比例）。</p>
  <div class="method-card mc-title" data-mc="tax">
    <div class="mc-check"><input type="checkbox" id="mc-ch11-4" data-mc="tax"><label for="mc-ch11-4" class="mc-lbl">學會</label></div>
    <div class="mc-left">課稅效果</div>
    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Lump sum tax">定額稅</span>：SAC 上移、SMC 不變（短期產量不變、廠商獨自負擔）；長期完全轉嫁。<span class="term" data-term="Specific tax">從量稅</span>：SAC 與 SMC 同幅上移（短期價格上升、部分轉嫁）；長期完全轉嫁。<span class="term" data-term="Ad valorem tax">從價稅</span>：<span class="term" data-term="Demand">需求</span>線旋轉下移。</div>
      <div class="mc-detail">短期：<span class="term" data-term="Lump sum tax">定額稅</span>下<span class="term" data-term="Market supply">市場供給</span>不變、價格不變、廠商虧損 → 廠商退出；<span class="term" data-term="Specific tax">從量稅</span>下價格上升、部分稅負依供需<span class="term" data-term="Elasticity">彈性</span>分配。長期：廠商退出至零利潤，稅完全轉嫁給消費者（價格上升幅度 = 稅額）。</div>
      <div class="mc-ex">例子：對廠商課<span class="term" data-term="Lump sum tax">定額稅</span> T → SAC 上移 T/q、SMC 不變 → 短期 P、Q 不變，廠商虧 T；長期廠商退出、P 上升 T 等幅。</div>
    </div>
  </div>
  <div class="warn">考試重點：<span class="term" data-term="Lump sum tax">定額稅</span>不改變 SMC（不影響邊際決策）；<span class="term" data-term="Specific tax">從量稅</span>使 SMC 垂直上移稅額；長期<span class="term" data-term="Equilibrium">均衡</span>稅負完全轉嫁消費者。</div>`
},
];

  body:`
  <p><span class="term">獨占（Monopoly）</span>：市場上只有一位生產者，面對眾多無法影響價格的消費者。<span class="term" data-term="Monopoly">獨占</span>與否應由商品是否容易被替代判斷，而非廠商數量。</p>
  <div class="tblwrap"><table><colgroup><col style="width:50%"><col style="width:50%"></colgroup>
    <thead><tr><th><span class="term" data-term="Monopoly">獨占</span>廠商</th><th><span class="term" data-term="Perfect competition">完全競爭</span>廠商</th></tr></thead>
    <tbody>
      <tr><td>此廠商代表整體產業</td><td>此廠商對整體產業毫無影響力</td></tr>
      <tr><td><span class="term" data-term="Price maker">價格決定者（Price maker）</span></td><td><span class="term" data-term="Price taker">價格接受者（Price taker）</span></td></tr>
      <tr><td>面對負斜率<span class="term" data-term="Demand">需求</span>線＝<span class="term" data-term="Market demand">市場需求</span>線</td><td>面對水平<span class="term" data-term="Demand">需求</span>線</td></tr>

},
{
  id:"12.2", title:"獨占廠商的均衡",
  body:`
  <p><span class="term" data-term="Monopoly">獨占</span>廠商追求利潤極大：MR = MC（且 MR' < MC'）。短期虧損不得超過 TFC；長期因<span class="term" data-term="Entry barrier">進入障礙</span>可保有超額利潤。</p>
  <div class="method-card mc-title" data-mc="mr">
    <div class="mc-check"><input type="checkbox" id="mc-ch12-1" data-mc="mr"><label for="mc-ch12-1" class="mc-lbl">學會</label></div>
    <div class="mc-left">MR 與<span class="term" data-term="Demand">需求</span><span class="term" data-term="Elasticity">彈性</span></div>
    <div class="mc-body">
      <div class="mc-formula">MR = P(1 − 1/|ε<sub>d</sub>|)；直線<span class="term" data-term="Demand">需求</span>下 MR 與<span class="term" data-term="Demand">需求</span>線同截距、斜率為兩倍</div>
      <div class="mc-detail">|ε|>1 → MR>0 增產增收；|ε|=1 → MR=0 收入最高；|ε|<1 → MR<0。故無差別取價之<span class="term" data-term="Monopoly">獨占</span>廠商在<span class="term" data-term="Demand">需求</span><span class="term" data-term="Elasticity">彈性</span>大於 1 處生產。</div>
      <div class="mc-ex">例子：<span class="term" data-term="Demand">需求</span> P = 80 − 4Q → MR = 80 − 8Q（截距同、斜率兩倍）。</div>
    </div>
  </div>
  <div class="method-card mc-title" data-mc="meq">
    <div class="mc-check"><input type="checkbox" id="mc-ch12-2" data-mc="meq"><label for="mc-ch12-2" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Monopoly">獨占</span><span class="term" data-term="Equilibrium">均衡</span>與加成訂價</div>
    <div class="mc-body">
      <div class="mc-formula">MR = MC 決定 Q*；代入<span class="term" data-term="Demand">需求</span>線得 P*；P = MC / (1 − 1/|ε|)（加成訂價 <span class="term" data-term="Markup pricing">Markup pricing</span>）</div>
      <div class="mc-detail"><span class="term" data-term="Monopoly">獨占</span>廠商同時決定價格與數量（皆<span class="term" data-term="Endogenous variables">內生變數</span>）→ <b>不存在<span class="term" data-term="Supply">供給</span>曲線</b>（無法在價格給定下對應單一<span class="term" data-term="Quantity supplied">供給量</span>）。<span class="term" data-term="Multi-plant monopoly">多工廠獨占</span>：MR = MC<sub>1</sub> = MC<sub>2</sub>。與<span class="term" data-term="Perfect competition">完全競爭</span>比較：<span class="term" data-term="Perfect competition">完全競爭</span> P=MC、<span class="term" data-term="Monopoly">獨占</span> P>MC → 產量較少、價格較高、有<span class="term" data-term="Deadweight loss">無謂損失</span>。</div>
      <div class="mc-ex">例子：C = 100 + 16Q、P = 80 − 4Q → MR = 80 − 8Q = MC = 16 → Q = 8、P = 48；利潤 = 384 − 228 = 156。</div>
    </div>
  </div>
  <div class="warn">考試重點：<span class="term" data-term="Monopoly">獨占</span>無<span class="term" data-term="Supply">供給</span>曲線（價格與數量同時決定）；<span class="term" data-term="Monopoly">獨占</span>在 |ε|>1 處生產；P > MC 造成社會福利損失。</div>`
},
{
  id:"12.3", title:"差別取價",
  body:`
  <p><span class="term">差別取價</span>：對同一產品按不同消費者、消費量或市場收取不同價格；目的在剝奪消費者剩餘（非因成本不同）。條件：廠商為<span class="term" data-term="Price maker">價格決定者</span>（負斜率<span class="term" data-term="Demand">需求</span>線）、能防止消費者轉售、消費者<span class="term" data-term="Demand">需求</span>不同。</p>
  <div class="method-card mc-title" data-mc="pd">
    <div class="mc-check"><input type="checkbox" id="mc-ch12-3" data-mc="pd"><label for="mc-ch12-3" class="mc-lbl">學會</label></div>
    <div class="mc-left">三級差別取價</div>
    <div class="mc-body">
      <div class="mc-formula">第一級（<span class="term" data-term="Perfect price discrimination">完全差別取價</span>）：每人每單位收願付價格，MR = P(Q) = MC；第二級（<span class="term" data-term="Quantity discrimination">數量差別取價</span>）：按數量區間定價；第三級（市場分割）：MR<sub>1</sub> = MR<sub>2</sub> = MC</div>
      <div class="mc-detail">第一級：CS=0、PS 最大、P=MC 具經濟效率、只有數量無<span class="term" data-term="Equilibrium">均衡</span>價格；第二級區段越細越接近第一級；第三級：<span class="term" data-term="Demand">需求</span><span class="term" data-term="Elasticity">彈性</span>大的市場價格越低（P<sub>1</sub>(1−1/|ε<sub>1</sub>|) = P<sub>2</sub>(1−1/|ε<sub>2</sub>|)）。<span class="term" data-term="Uniform pricing">統一訂價</span>利潤較低但省交易成本。</div>
      <div class="mc-ex">例子：都市<span class="term" data-term="Demand">需求</span><span class="term" data-term="Elasticity">彈性</span> −3、鄉村 −2，都市訂價 450 → 450×(1−1/3) = P×(1−1/2) → P = 600。</div>
    </div>
  </div>
  <div class="warn">考試重點：第一級差別取價 P=MC 具經濟效率但所得分配極度不平均（CS=0）；第三級差別取價<span class="term" data-term="Elasticity">彈性</span>大者價低。</div>`
},
{
  id:"12.4", title:"壟斷力的測量",
  body:`
  <p><b><span class="term" data-term="Lerner index">勒納指標（Lerner index）</span></b>：L = (P − MC)/P = 1/|ε|；<span class="term" data-term="Demand">需求</span><span class="term" data-term="Elasticity">彈性</span>越小（越無<span class="term" data-term="Elasticity">彈性</span>），壟斷力越大。<b><span class="term" data-term="Bain index">班恩指標（Bain index）</span></b>：以平均成本取代邊際成本：B = (P − AC)/P（因 MC 資料難估計）。</p>
  <p><b><span class="term" data-term="Concentration rate">市場集中度（Concentration rate）</span></b>：前幾大廠商銷售額占產業總銷售額比例（四家廠商集中度、八家廠商集中度）。<b><span class="term" data-term="Herfindahl index">赫氏指標（Herfindahl index）</span></b>：H = Σ(市占率)²×10000，介於 0～10000；值越大壟斷力越大。</p>
  <div class="warn">考試重點：Lerner 指標 = 1/|ε|；Herfindahl 為市占率平方加總（如 30²+25²+20²+15²+5²+5² = 2200）。</div>`
},
{
  id:"12.5", title:"政府對獨占廠商的管制",
  body:`
  <p>三種訂價法（<span class="term" data-term="Natural monopoly">自然獨占</span>、AC 遞減、MC 固定常數）：</p>
  <div class="method-card mc-title" data-mc="reg">
    <div class="mc-check"><input type="checkbox" id="mc-ch12-4" data-mc="reg"><label for="mc-ch12-4" class="mc-lbl">學會</label></div>
    <div class="mc-left">管制訂價法</div>
    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Monopoly">獨占</span>訂價法：MR = MC（利潤最大）；<span class="term" data-term="Average cost pricing">平均成本訂價法</span>：P = AC（<span class="term" data-term="Normal profit">正常利潤</span>）；<span class="term" data-term="Marginal cost pricing">邊際成本訂價法</span>：P = MC（福利最大、<span class="term" data-term="Deadweight loss">無謂損失</span>=0）</div>
      <div class="mc-detail"><span class="term" data-term="Monopoly">獨占</span>訂價：價高量少、有<span class="term" data-term="Deadweight loss">無謂損失</span>。邊際成本訂價：福利最大但<span class="term" data-term="Natural monopoly">自然獨占</span>虧損、廠商可能<span class="term" data-term="Cheating">欺騙</span>成本結構（常搭配兩階段訂價收入場費）。平均成本訂價：廠商獲<span class="term" data-term="Normal profit">正常利潤</span>、<span class="term" data-term="Deadweight loss">無謂損失</span>介於兩者間；三法皆可能產生技術無效率與 <span class="term" data-term="X-inefficiency">X 無效率</span>（<span class="term" data-term="X-inefficiency">X-inefficiency</span>：生產不效率使 AC 高於<span class="term" data-term="Perfect competition">完全競爭</span>水準）。</div>
      <div class="mc-ex">例子：<span class="term" data-term="Natural monopoly">自然獨占</span>採邊際成本訂價 → 虧損；政府常輔以補貼或兩階段訂價解決。</div>
    </div>
  </div>
  <p><b>對<span class="term" data-term="Monopoly">獨占</span>廠商課<span class="term" data-term="Lump sum tax">定額稅</span></b>：AC 上移、MC 不變 → 價格與數量不變、利潤下降 → 稅負完全由生產者負擔。</p>
  <div class="warn">考試重點：非<span class="term" data-term="Natural monopoly">自然獨占</span>管制宜採邊際成本訂價（P=MC、<span class="term" data-term="Demand">需求</span>與 MC 交點）；<span class="term" data-term="Natural monopoly">自然獨占</span> MC 訂價會虧損故需補貼；<span class="term" data-term="Lump sum tax">定額稅</span>不改變<span class="term" data-term="Monopoly">獨占</span> P、Q。</div>`
},
];

  <div class="method-card mc-title" data-mc="stack">
    <div class="mc-check"><input type="checkbox" id="mc-ch13-2" data-mc="stack"><label for="mc-ch13-2" class="mc-lbl">學會</label></div>
    <div class="mc-left">史塔伯克求解</div>
    <div class="mc-body">
      <div class="mc-formula">領導者將追隨者<span class="term" data-term="Reaction function">反應函數</span>代入自身利潤函數求極大；<span class="term" data-term="Equilibrium">均衡</span>＝領導者產量代入追隨者<span class="term" data-term="Reaction function">反應函數</span></div>
      <div class="mc-detail">若兩廠皆自認領導者 → 史塔伯克失衡（不穩定）。跟隨者「硬幹」與領導者生產相同產量時利潤更低（兩敗俱傷），故<span class="term" data-term="Rationality">理性</span>跟隨者會依<span class="term" data-term="Reaction function">反應函數</span>生產；領導者的產量決策是「可信的威脅」。</div>
      <div class="mc-ex">例子：P = 150 − Q、MC = 30 → 領導者 q₁ = 60、追隨者 q₂ = 30、P = 60；π₁ = 1800 > π₂ = 900。</div>
    </div>
  </div>`
},
{
  id:"13.4", title:"卡特爾（Cartel）模型",
  body:`
  <p><span class="term">卡特爾</span>：廠商公開或秘密結合以降低競爭、增加利潤；如工會、OPEC。美國有<span class="term" data-term="Antitrust law">反托拉斯法（Antitrust law）</span>、台灣有公平交易法禁止聯合壟斷。</p>
  <div class="method-card mc-title" data-mc="cartel">
    <div class="mc-check"><input type="checkbox" id="mc-ch13-3" data-mc="cartel"><label for="mc-ch13-3" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Cartel">卡特爾</span>決策</div>
    <div class="mc-body">
      <div class="mc-formula">ΣMC 水平加總 → 聯合利潤極大 MR = ΣMC 決定總產量與統一價格 → 按各廠 MC 分配配額</div>
      <div class="mc-detail">組織內成員如<span class="term" data-term="Price taker">價格接受者</span>（P=MC 才是個別利潤極大），但配額下個別產量小於 P=MC 產量 → 各廠皆有<span class="term" data-term="Cheating">欺騙（Cheating）</span>誘因：單獨<span class="term" data-term="Cheating">欺騙</span>獲利更高，所有人皆<span class="term" data-term="Cheating">欺騙</span>則價格崩跌、全體虧損。故<span class="term" data-term="Cartel">卡特爾</span>長期無法維持。</div>
      <div class="mc-ex">例子：P = 110 − 0.5(Q₁+Q₂)、MC=10 → MR = 110 − Q = 10 → Q = 100、P = 60、每家 50、利潤 2500。</div>
    </div>
  </div>`
},
{
  id:"13.5", title:"貝銓（Bertrand）模型",
  body:`
  <p>焦點轉為價格競爭。<span class="term" data-term="Homogeneous products">同質商品</span>：消費者只向低價者購買 → 削價競爭直到 P = MC（邊際成本）。</p>
  <div class="method-card mc-title" data-mc="bertrand">
    <div class="mc-check"><input type="checkbox" id="mc-ch13-4" data-mc="bertrand"><label for="mc-ch13-4" class="mc-lbl">學會</label></div>
    <div class="mc-left">貝銓<span class="term" data-term="Equilibrium">均衡</span></div>
    <div class="mc-body">
      <div class="mc-formula">同質、成本相同：P₁ = P₂ = MC（<span class="term" data-term="Equilibrium">均衡</span>＝<span class="term" data-term="Perfect competition">完全競爭</span>結果）；成本不同：低 MC 廠商訂價略低於對手 MC <span class="term" data-term="Monopoly">獨占</span>市場</div>
      <div class="mc-detail"><b><span class="term" data-term="Bertrand paradox">貝銓矛盾（Bertrand paradox）</span></b>：只有兩家廠商的價格<span class="term" data-term="Competitive equilibrium">競爭均衡</span>竟與<span class="term" data-term="Perfect competition">完全競爭</span>相同，但少數廠商要有競爭性卻困難。<span class="term" data-term="Differentiated products">異質商品</span>：<span class="term" data-term="Demand">需求</span>互相依存（<span class="term" data-term="Substitution goods">替代品</span>），由利潤函數對價格微分得價格<span class="term" data-term="Reaction function">反應函數</span>，聯立求解貝銓<span class="term" data-term="Equilibrium">均衡</span>價格。</div>
      <div class="mc-ex">例子：A、B 邊際成本 5 與 9 → B 訂價略低於 9（如 8.99）<span class="term" data-term="Monopoly">獨占</span>市場，<span class="term" data-term="Equilibrium">均衡</span>價格約 9。</div>
    </div>
  </div>`
},
{
  id:"13.6", title:"價格領袖模型",
  body:`
  <p>優勢廠商礙於法令無法排除競爭者，訂一個能與跟隨廠商共存的價格（無形勾結，如電視業、報紙）。跟隨廠商如<span class="term" data-term="Perfect competition">完全競爭</span>者為<span class="term" data-term="Price taker">價格接受者</span>。</p>
  <div class="method-card mc-title" data-mc="lead">
    <div class="mc-check"><input type="checkbox" id="mc-ch13-5" data-mc="lead"><label for="mc-ch13-5" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Price leadership">價格領袖</span>求解</div>
    <div class="mc-body">
      <div class="mc-formula">剩餘<span class="term" data-term="Demand">需求</span> D_L = <span class="term" data-term="Market demand">市場需求</span> D − 跟隨廠商<span class="term" data-term="Supply">供給</span> S_f；由 MR_L = MC_L 決定領導者產量 → 代回剩餘<span class="term" data-term="Demand">需求</span>得價格 → 跟隨廠商依該價格<span class="term" data-term="Supply">供給</span></div>
      <div class="mc-detail">價格太高跟隨廠商無生產空間、太低領導廠商無生產空間，故價格介於兩者之間。此<span class="term" data-term="Model">模型</span>為動態賽局之應用。</div>
      <div class="mc-ex">例子：<span class="term" data-term="Market demand">市場需求</span> Q=250−P、小廠<span class="term" data-term="Supply">供給</span> Q_s=230+9P、領導者 MC=0 → 剩餘<span class="term" data-term="Demand">需求</span> Q_d=20−10P、MR=2−0.2Q=0 → Q=10、P=1。</div>
    </div>
  </div>`
},
{
  id:"13.7", title:"Sweezy 模型（拗折需求曲線模型）",
  body:`
  <p>假設：產品同質、廠商間「跟跌不跟漲」。降價時對手跟降（<span class="term" data-term="Quantity demanded">需求量</span>增加不如預期）、漲價時對手不跟漲（<span class="term" data-term="Quantity demanded">需求量</span>下降比預期多）→ <span class="term" data-term="Demand">需求</span>線在現行價格處拗折，MR 斷成兩段出現缺口。</p>
  <div class="method-card mc-title" data-mc="sweezy">
    <div class="mc-check"><input type="checkbox" id="mc-ch13-6" data-mc="sweezy"><label for="mc-ch13-6" class="mc-lbl">學會</label></div>
    <div class="mc-left">拗折<span class="term" data-term="Demand">需求</span></div>
    <div class="mc-body">
      <div class="mc-formula">MC 在 MR 斷裂缺口內 → P、Q 不變（唯一不滿足 MR=MC 的<span class="term" data-term="Equilibrium">均衡</span><span class="term" data-term="Model">模型</span>）</div>
      <div class="mc-detail"><b><span class="term" data-term="Price rigidity">價格僵固性（Price rigidity）</span></b>：成本上升若 MC 仍在缺口內，廠商自行吸收成本不調價；<span class="term" data-term="Demand">需求</span>變化若 MC 仍在缺口內，產量改變但價格不變。缺點：無法解釋初始<span class="term" data-term="Equilibrium">均衡</span>價格與數量如何決定。</div>
      <div class="mc-ex">例子：成本上升使 MC 上移但仍在 MR 缺口內 → 價格不變、廠商吸收成本。</div>
    </div>
  </div>`
},
{
  id:"13.8", title:"賽局理論（Game Theory）",
  body:`
  <p><span class="term">賽局理論</span>：研究並詮釋<span class="term" data-term="Strategy">策略</span>交互運作的關係。要素：<b><span class="term" data-term="Player">參賽者（Player）</span>、<span class="term" data-term="Strategy">策略（Strategy）</span>、<span class="term" data-term="Payoff">報償（Payoff）</span>、出象（Outcome）</b>。</p>
  <p><b>種類</b>：依行動順序分靜態（同時決策，如庫諾/貝銓）與動態（先後決策，如<span class="term" data-term="Price leadership">價格領袖</span>/史塔伯克）；依報酬分零和（勝者所得＝輸者所失）與非零和；合作賽局（<span class="term" data-term="Cartel">卡特爾</span>）。</p>
  <p><b>表示法</b>：<span class="term" data-term="Normal form">標準型</span>（<span class="term" data-term="Payoff">報償</span>矩陣）；<span class="term" data-term="Extensive form">延展型</span>（賽局樹，可顯示先後順序與<span class="term" data-term="Information set">資訊集合</span>）。</p>
  <div class="method-card mc-title" data-mc="game">
    <div class="mc-check"><input type="checkbox" id="mc-ch13-7" data-mc="game"><label for="mc-ch13-7" class="mc-lbl">學會</label></div>
    <div class="mc-left">Nash <span class="term" data-term="Equilibrium">均衡</span>與求解</div>
    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Dominant strategy">優勢策略</span>：不論對手<span class="term" data-term="Strategy">策略</span>皆最優；Nash <span class="term" data-term="Equilibrium">均衡</span>：給定對手<span class="term" data-term="Strategy">策略</span>下無人想改變；動態賽局用<span class="term" data-term="Backward induction">逆推求解</span>（SPNE）</div>
      <div class="mc-detail"><span class="term" data-term="Dominant strategy">優勢策略</span><span class="term" data-term="Equilibrium">均衡</span>必為 Nash <span class="term" data-term="Equilibrium">均衡</span>，反之不一定。<span class="term" data-term="Prisoner's dilemma">囚犯困境</span>：雙方皆招供為 Nash <span class="term" data-term="Equilibrium">均衡</span>，但（不招、不招）對雙方最好——自利動機與缺乏互信導致對雙方最不利的結果。<span class="term" data-term="Backward induction">逆推求解</span>：由賽局樹末端往前，刪除不可信威脅。<span class="term" data-term="Pure strategy">純粹策略</span>下 Nash <span class="term" data-term="Equilibrium">均衡</span>可能不存在；<span class="term" data-term="Mixed strategy">混合策略</span>下必有 Nash <span class="term" data-term="Equilibrium">均衡</span>。<span class="term" data-term="Zero-sum game">零和賽局</span>可用<span class="term" data-term="Maxmin">小中取大（maxmin）</span>/大中取小（minimax）。</div>
      <div class="mc-ex">例子：<span class="term" data-term="Prisoner's dilemma">囚犯困境</span>——隔離偵訊下招供為<span class="term" data-term="Dominant strategy">優勢策略</span> → <span class="term" data-term="Equilibrium">均衡</span>（招供、招供）＝(−6,−6)，劣於（不招、不招）＝(−1,−1)。</div>
    </div>
  </div>
  <div class="warn">考試重點：<span class="term" data-term="Dominant strategy">優勢策略</span>一定 Nash 但 Nash 不一定是<span class="term" data-term="Dominant strategy">優勢策略</span>；Nash 可有多個；動態賽局用逆推求 SPNE 消除不可信威脅。</div>`
},
];

      <div class="mc-detail"><b><span class="term" data-term="Monopsonistic exploitation">專買性剝削（Monopsonistic exploitation）</span></b>：要素<span class="term" data-term="Monopsony">獨買</span>時 VMP > w（VMP−MFC 段）。<b><span class="term" data-term="Monopolistic exploitation">專賣性剝削（Monopolistic exploitation）</span></b>：商品<span class="term" data-term="Monopoly">獨占</span>時 VMP > MRP（P−MR 段）。<span class="term" data-term="Factor market">要素市場</span>不<span class="term" data-term="Perfect competition">完全競爭</span>時 MRP 非要素<span class="term" data-term="Demand">需求</span>線。<b><span class="term" data-term="Bilateral monopoly">雙邊獨占（Bilateral monopoly）</span></b>：工會（賣方）與廠商（買方）議價，<span class="term" data-term="Equilibrium">均衡</span>工資取決於相對議價能力。</div>
      <div class="mc-ex">例子：廠商為勞動唯一買主、商品市場<span class="term" data-term="Perfect competition">完全競爭</span> → <span class="term" data-term="Equilibrium">均衡</span> w=VMP 之對應雇用量偏低 → <span class="term" data-term="Monopsonistic exploitation">專買性剝削</span>。</div>
    </div>
  </div>
  <div class="warn">考試重點：商品競爭要素競爭時廠商要素<span class="term" data-term="Demand">需求</span>線＝VMP 最高點以下之 VMP 線（負斜率，無 Giffen 要素）；MRP 恆為要素<span class="term" data-term="Demand">需求</span>線的前提是<span class="term" data-term="Factor market">要素市場</span><span class="term" data-term="Perfect competition">完全競爭</span>。</div>`
},
{
  id:"15.4", title:"成本最小與利潤最大條件式",
  body:`
  <p>一般化<span class="term" data-term="Model">模型</span>：Max π = P(Q)·Q − w(L)·L，其中 Q = Q(L)、w = w(L)。F.O.C.：</p>
  <div class="method-card mc-title" data-mc="gen">
    <div class="mc-check"><input type="checkbox" id="mc-ch15-4" data-mc="gen"><label for="mc-ch15-4" class="mc-lbl">學會</label></div>
    <div class="mc-left">一般化條件</div>
    <div class="mc-body">
      <div class="mc-formula">MR × MP<sub>L</sub> = MFC<sub>L</sub>，即 MRP<sub>L</sub> = MFC<sub>L</sub></div>
      <div class="mc-detail">四種市場組合皆收斂於此一般式：商品競爭（MR=P）＋要素競爭（MFC=w）→ P·MP=w；商品<span class="term" data-term="Monopoly">獨占</span>（MR<P）＋要素<span class="term" data-term="Monopsony">獨買</span>（MFC>w）→ MR·MP=MFC。此為 15.3 四種情況之一般化。</div>
      <div class="mc-ex">例子：<span class="term" data-term="Perfect competition">完全競爭</span>商品與勞動市場 → VMP = P·MP = w 即廠商勞動雇用條件。</div>
    </div>
  </div>`
},
{
  id:"15.5", title:"最低工資的影響",
  body:`
  <p><b>勞動市場<span class="term" data-term="Perfect competition">完全競爭</span></b>：設定有效<span class="term" data-term="Minimum wage">最低工資</span>（高於<span class="term" data-term="Equilibrium">均衡</span>）→ 勞動<span class="term" data-term="Demand">需求</span>減少、<span class="term" data-term="Supply">供給</span>增加 → 超額<span class="term" data-term="Supply">供給</span> → <b><span class="term" data-term="Involuntary unemployment">非自願失業</span></b>（失業率提高）。</p>
  <p><b>勞動市場不<span class="term" data-term="Perfect competition">完全競爭</span></b>：廠商原以 MFC=MRP 決策（雇用較少、工資較低）；政府規定<span class="term" data-term="Minimum wage">最低工資</span>使廠商變成工資接受者（以 w=MRP 決策）→ 就業量上升。</p>
  <p>低技術勞工或年輕勞工較趨近<span class="term" data-term="Perfect competition">完全競爭</span>，故<span class="term" data-term="Minimum wage">最低工資</span>或工會力量對其影響較大。<b><span class="term" data-term="Compensation differential">補償性工資差異（Compensation differential）</span></b>：工作條件不同（夜班、危險）使相同能力者得到不同報酬。</p>
  <div class="warn">考試重點：<span class="term" data-term="Perfect competition">完全競爭</span>下<span class="term" data-term="Minimum wage">最低工資</span>造成失業；<span class="term" data-term="Monopsony">獨買</span>下<span class="term" data-term="Minimum wage">最低工資</span>可能提高就業；補償性差異解釋相同能力者的工資差距。</div>`
},
];

const CH16_SECTIONS = [
{
  id:"16.1", title:"前言",
  body:`
  <p><span class="term">部分均衡分析（Partial equilibrium analysis）</span>：僅考慮特定市場<span class="term" data-term="Equilibrium">均衡</span>、忽略市場間關聯；<span class="term">一般均衡分析（General equilibrium analysis）</span>：同時考慮不同市場的相互影響。市場關聯緊密時須用一般<span class="term" data-term="Equilibrium">均衡</span>。</p>
  <p><span class="term">交換經濟（Exchange economy）</span>：不含生產活動，僅討論分配與交換。交換的動機：慾望雙重巧合（Double coincidence of wants）——雙方對彼此商品有互補<span class="term" data-term="Preference">偏好</span>即有交換誘因。</p>
  <div class="warn">考試重點：部分<span class="term" data-term="Equilibrium">均衡</span>只觀單一市場；一般<span class="term" data-term="Equilibrium">均衡</span>同時考慮所有市場的相互影響。</div>`
},
{
  id:"16.2", title:"交換經濟",
  body:`
  <p>基本概念：<b><span class="term" data-term="Endowment">原賦</span>配置</b>（交易前持有）、<b>可行配置</b>（財貨總和等於<span class="term" data-term="Endowment">原賦</span>總和）、<b>最終配置</b>（交易後）、<b>互惠區</b>（雙方<span class="term" data-term="Indifference curve">無異曲線</span>圍成、可雙贏的區域）、<b><span class="term" data-term="Contract curve">契約線（Contract curve）</span></b>（滿足交換效率的點連線）、<b>交易核</b>（互惠區中的<span class="term" data-term="Contract curve">契約線</span>）。</p>
  <div class="method-card mc-title" data-mc="xchange">
    <div class="mc-check"><input type="checkbox" id="mc-ch16-1" data-mc="xchange"><label for="mc-ch16-1" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Pareto optimum">柏拉圖最適</span></div>
    <div class="mc-body">
      <div class="mc-formula">MRS<sub>A</sub> = MRS<sub>B</sub>（交換效率）→ 雙方無誘因再交換</div>
      <div class="mc-detail"><b><span class="term" data-term="Pareto optimum">柏拉圖最適（Pareto optimum）</span></b>：無法在無人受害下使有人得利。<b><span class="term" data-term="Pareto improvement">柏拉圖改善（Pareto improvement）</span></b>：至少一人變好且無人變差。<span class="term" data-term="Equilibrium">均衡</span>點落在<span class="term" data-term="Contract curve">契約線</span>上。</div>
      <div class="mc-ex">例子：30 餅乾分給 30 學生——任何全部分完的配置皆為 Pareto efficient。</div>
    </div>
  </div>
  <div class="method-card mc-title" data-mc="walras">
    <div class="mc-check"><input type="checkbox" id="mc-ch16-2" data-mc="walras"><label for="mc-ch16-2" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Competitive equilibrium">競爭均衡</span></div>
    <div class="mc-body">
      <div class="mc-formula">存在<span class="term" data-term="Equilibrium">均衡</span><span class="term" data-term="Relative price">相對價格</span> P<sub>x</sub>/P<sub>y</sub> = MRS<sub>A</sub> = MRS<sub>B</sub> 使兩<span class="term" data-term="Market clearing">市場結清</span>；<span class="term" data-term="Walras' law">瓦拉斯法則</span>：ΣP<sub>i</sub>·超額<span class="term" data-term="Demand">需求</span><sub>i</sub> = 0</div>
      <div class="mc-detail"><b><span class="term" data-term="Walrasian equilibrium">瓦拉斯均衡（Walrasian equilibrium）</span></b>：透過叫價調整（tâtonnement）使所有市場無超額供需。<b><span class="term" data-term="Walras' law">瓦拉斯法則（Walras' law）</span></b>：n 個市場中若 n−1 個結清，最後一個必結清。</div>
      <div class="mc-ex">例子：若商品市場已<span class="term" data-term="Equilibrium">均衡</span>，則<span class="term" data-term="Factor market">要素市場</span>必<span class="term" data-term="Equilibrium">均衡</span>（兩大市場之一結清即全部結清）。</div>
    </div>
  </div>
  <div class="method-card mc-title" data-mc="welfare">
    <div class="mc-check"><input type="checkbox" id="mc-ch16-3" data-mc="welfare"><label for="mc-ch16-3" class="mc-lbl">學會</label></div>
    <div class="mc-left">福利兩定理</div>
    <div class="mc-body">
      <div class="mc-formula">第一定理：<span class="term" data-term="Competitive equilibrium">競爭均衡</span> → <span class="term" data-term="Pareto optimum">柏拉圖最適</span>；第二定理：適當重分配 → <span class="term" data-term="Contract curve">契約線</span>上任何點可成為<span class="term" data-term="Competitive equilibrium">競爭均衡</span></div>
      <div class="mc-detail">第一定理即 <span class="proper">亞當·斯密</span>「看不見的手」：自利行為使整體達效率。第二定理需消費者<span class="term" data-term="Preference">偏好</span>嚴格凸；<span class="term" data-term="Contract curve">契約線</span>上任何點只是「可能」成為<span class="term" data-term="Equilibrium">均衡</span>，非「必定」。</div>
      <div class="mc-ex">例子：政府先重分配<span class="term" data-term="Endowment">原賦</span>，再由市場自由運作 → 可達社會<span class="term" data-term="Preference">偏好</span>之<span class="term" data-term="Pareto optimum">柏拉圖最適</span>點。</div>
    </div>
  </div>
  <p><b><span class="term" data-term="Utility">效用</span>可能曲線（UPF）</b>：<span class="term" data-term="Contract curve">契約線</span>上各點對應的 (U<sub>A</sub>, U<sub>B</sub>) <span class="term" data-term="Utility">效用</span>組合軌跡。</p>`
},
{
  id:"16.3", title:"生產經濟",
  body:`
  <p><span class="term" data-term="Model">模型</span>：兩種要素（L、K）生產兩種商品（X、Y）。<b>生產效率</b>：MRTS<sub>x</sub> = MRTS<sub>y</sub>（生產<span class="term" data-term="Contract curve">契約線</span>）。</p>
  <p><span class="term">生產可能曲線（PPC）</span>：給定資源與技術下可生產的最大財貨組合軌跡。線上點＝<span class="term" data-term="Technical efficiency">技術效率</span>點（資源全利用、X 與 Y 有<span class="term" data-term="Trade-off">抵換</span>）；內部點＝技術不效率；外部點＝技術不可能。<b>邊際轉換率（MRT）</b>＝PPC 斜率＝MC<sub>x</sub>/MC<sub>y</sub>＝生產 X 的<span class="term" data-term="Opportunity cost">機會成本</span>。PPC 凹向原點＝<span class="term" data-term="Opportunity cost">機會成本</span>遞增；直線＝固定；凸向原點＝遞減。</p>
  <p><b>最適產出</b>：等收益線（iso-revenue，斜率 −P<sub>x</sub>/P<sub>y</sub>）與 PPC 相切 → <b>MRT = P<sub>x</sub>/P<sub>y</sub></b>，同時達<span class="term" data-term="Technical efficiency">技術效率</span>與收益最大。</p>
  <div class="warn">考試重點：MRT = MC_x/MC_y；最適產出 MRT = <span class="term" data-term="Relative price">相對價格</span>；技術進步使 PPC 外移（單方技術進步沿軸外移、中性進步整體外移）。</div>`
},
{
  id:"16.4", title:"全面均衡分析",
  body:`
  <p><b>全面（配置）效率</b>三條件同時滿足：<span class="term" data-term="Technical efficiency">技術效率</span>（MRTS<sub>x</sub>=MRTS<sub>y</sub>）＋交換效率（MRS<sub>A</sub>=MRS<sub>B</sub>）＋商品混合效率（<b>MRS = MRT</b>）。<span class="term" data-term="Perfect competition">完全競爭</span>下<span class="term" data-term="Relative price">相對價格</span>使三者一致：MRS<sub>A</sub> = MRS<sub>B</sub> = MRT = P<sub>x</sub>/P<sub>y</sub>。</p>
  <p><b>總<span class="term" data-term="Utility">效用</span>可能曲線（GUPF）</b>：符合交換與生產效率的所有<span class="term" data-term="Utility">效用</span>組合軌跡（UPF 的包絡），線上每點滿足全面效率。</p>
  <p><b>社會選擇理論</b>——社會福利函數的設定準則：</p>
  <ul>
    <li><b>公平主義</b>：消費量均等（箱子中點）或<span class="term" data-term="Utility">效用</span>均等（GUPF 與 45° 線交點）</li>
    <li><b><span class="term" data-term="Rawlsian criterion">羅氏準則</span>（Rawlsian）</b>：使社會最弱勢者<span class="term" data-term="Utility">效用</span>最高（max-min）</li>
    <li><b>古典<span class="term" data-term="Utilitarian">功利主義（Utilitarian）</span></b>：<span class="proper">邊沁</span>提出，最多數人的最大幸福（<span class="term" data-term="Utility">效用</span>總和最大，切線斜率 −1）</li>
    <li><b>柏拉圖準則</b>：往右上移動為增進；無法比較的移動不算</li>
    <li><b>卡洛多準則（Kaldor）</b>：獲利者補償損失者後仍較好即可</li>
    <li><b>柏克遜-森謬爾森社會福利函數</b>：W = W(U<sub>A</sub>, U<sub>B</sub>)；<span class="term" data-term="Equilibrium">均衡</span>於社會<span class="term" data-term="Indifference curve">無異曲線</span>與 GUPF 相切處</li>
  </ul>
  <div class="method-card mc-title" data-mc="arrow">
    <div class="mc-check"><input type="checkbox" id="mc-ch16-4" data-mc="arrow"><label for="mc-ch16-4" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Arrow's impossibility theorem">亞羅不可能定理</span></div>
    <div class="mc-body">
      <div class="mc-formula">無限制原則＋柏拉圖原則＋獨立性＋非獨裁 → 無法同時滿足（社會<span class="term" data-term="Preference">偏好</span>必違反其一）</div>
      <div class="mc-detail"><span class="proper">亞羅（Kenneth Arrow）</span>證明：不存在同時滿足四條件的社會<span class="term" data-term="Preference">偏好</span>決定機制。多數決投票可能違反<span class="term" data-term="Transitivity">遞移性</span> → <b><span class="term" data-term="Voting paradox">投票矛盾（Voting paradox）</span>／孔多塞矛盾</b>：A>B、B>C 但 C>A（循環多數）。</div>
      <div class="mc-ex">例子：甲 A>B>C、乙 B>C>A、丙 C>A>B → 多數決 A>B、B>C、C>A，無法形成社會<span class="term" data-term="Preference">偏好</span>。</div>
    </div>
  </div>
  <div class="warn">考試重點：全面效率 MRS_A = MRS_B = MRT；社會福利函數四大設定（公平/羅氏/功利/卡洛多）；亞羅四條件與<span class="term" data-term="Voting paradox">投票矛盾</span>。</div>`
},
];

const CH17_SECTIONS = [
{
  id:"17.1", title:"前言",
  body:`
  <p><span class="term">市場失靈（Market failure）</span>：市場自由運作下<span class="term" data-term="Pareto optimum">柏拉圖最適</span>三條件（交換／生產／全面效率）任一無法成立，<span class="term" data-term="Price mechanism">價格機能</span>無法充分發揮。兩大成因：市場並非<span class="term" data-term="Perfect competition">完全競爭</span>（買賣議價力不同）、某些市場不存在（不完全市場，如污染權）。<b><span class="term" data-term="Government failure">政府失靈（Government failure）</span></b>：政府與市場一樣非全能全知，介入也可能失敗。</p>
  <div class="warn">考試重點：<span class="term" data-term="Market failure">市場失靈</span>＝不<span class="term" data-term="Perfect competition">完全競爭</span>＋不完全市場（<span class="term" data-term="Asymmetric information">資訊不對稱</span>、<span class="term" data-term="Externality">外部性</span>）；福利第一定理假設極嚴格。</div>`
},
{
  id:"17.2", title:"外部性",
  body:`
  <p><span class="term">外部性（Externality）</span>：一個經濟個體的行為直接影響他人福利（非透過價格機制傳遞），受影響第三者無須付費或無法求償。要點：至少牽涉兩個經濟個體（生產者對生產者／消費者等）；<b>正<span class="term" data-term="Externality">外部性</span>＝<span class="term" data-term="External benefit">外部利益</span></b>（如預防針、蜂農與果農）；<b>負<span class="term" data-term="Externality">外部性</span>＝<span class="term" data-term="External cost">外部成本</span></b>（如二手菸、廢水、道路擁擠）。</p>
  <ul>
    <li><b><span class="term" data-term="Pecuniary externality">金融外部性</span>（Pecuniary）</b>：透過市場<span class="term" data-term="Price mechanism">價格機能</span>調整造成所得移轉（<span class="proper">韋勒 Viner</span> 提出）</li>
    <li><b><span class="term" data-term="Technological externality">技術外部性</span></b>：未透過<span class="term" data-term="Price mechanism">價格機能</span>、直接影響他人<span class="term" data-term="Utility">效用</span>或生產（<span class="term" data-term="Market failure">市場失靈</span>的主因）</li>
    <li><b><span class="term" data-term="Network externality">網路外部性</span></b>：消費人數影響個別消費者<span class="term" data-term="Demand">需求</span>線；特性＝標準化＋內鎖效果（Lock-in effect）</li>
  </ul>
  <div class="method-card mc-title" data-mc="extern">
    <div class="mc-check"><input type="checkbox" id="mc-ch17-1" data-mc="extern"><label for="mc-ch17-1" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Externality">外部性</span>決策</div>
    <div class="mc-body">
      <div class="mc-formula">社會最適：MSB = MSC；個人決策：MPB = MPC。MSB = MPB + MEB；MSC = MPC + MEC</div>
      <div class="mc-detail"><b>負<span class="term" data-term="Externality">外部性</span></b>：個人產量 > 社會最適（生產過多）；<b>正<span class="term" data-term="Externality">外部性</span></b>：個人產量 < 社會最適（生產過少）。個人不將<span class="term" data-term="Externality">外部性</span>納入決策 → <span class="term" data-term="Market failure">市場失靈</span>。</div>
      <div class="mc-ex">例子：污染廠商只以 MPC 決策 → 產量過多，社會應以 MSC（含 MEC）決定較低產量。</div>
    </div>
  </div>
  <div class="warn">考試重點：負<span class="term" data-term="Externality">外部性</span>→生產過多、正<span class="term" data-term="Externality">外部性</span>→生產過少；<span class="term" data-term="Externality">外部性</span>透過<span class="term" data-term="Price mechanism">價格機能</span>傳遞的（<span class="term" data-term="Pecuniary externality">金融外部性</span>）不造成<span class="term" data-term="Market failure">市場失靈</span>。</div>`
},
{
  id:"17.3", title:"外部性的糾正方式",
  body:`
  <p>糾正目標：將<span class="term" data-term="Externality">外部性</span>糾正到社會可容忍範圍（非完全消除）。主要方式：</p>
  <div class="method-card mc-title" data-mc="correct">
    <div class="mc-check"><input type="checkbox" id="mc-ch17-2" data-mc="correct"><label for="mc-ch17-2" class="mc-lbl">學會</label></div>
    <div class="mc-left">糾正方式</div>
    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Pigouvian tax">皮古稅</span> t = MEC（社會最適產量處）；管制＝直接規定污染量；<span class="term" data-term="Tradable emission permits">可交易排放許可證</span>＝市場定價</div>
      <div class="mc-detail"><b><span class="term" data-term="Pigouvian tax">皮古稅（Pigouvian tax）</span></b>：<span class="proper">皮古（A.C. Pigou）</span>提出，向污染方課徵每單位<span class="term" data-term="External cost">外部成本</span>之稅（正<span class="term" data-term="Externality">外部性</span>則為皮古補貼）。<b>直接管制</b>：方便直接但無誘因機制、需正確估計。<b><span class="term" data-term="Tradable emission permits">可交易排放許可證</span></b>：政府定總量、廠商可交易配額；<span class="term" data-term="Equilibrium">均衡</span>價格出現於廠商邊際收益相等處（MB₁=MB₂），資訊不完全下較管制有效率。</div>
      <div class="mc-ex">例子：<span class="term" data-term="External cost">外部成本</span> $10/單位 → 課 $10 <span class="term" data-term="Pigouvian tax">皮古稅</span>使私人成本=社會成本 → 產量回到社會最適。</div>
    </div>
  </div>
  <div class="method-card mc-title" data-mc="coase">
    <div class="mc-check"><input type="checkbox" id="mc-ch17-3" data-mc="coase"><label for="mc-ch17-3" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Coase theorem">寇斯定理</span></div>
    <div class="mc-body">
      <div class="mc-formula">交易成本為零＋<span class="term" data-term="Property rights">財產權</span>界定明確 → 雙方協商即可達經濟效率（無須政府干預）</div>
      <div class="mc-detail"><span class="proper">寇斯（R.H. Coase）</span>批評<span class="term" data-term="Pigouvian tax">皮古稅</span>非必要。<span class="term" data-term="Externality">外部性</span>具<b>相互性</b>（<span class="term" data-term="Property rights">財產權</span>歸屬問題）。弱<span class="term" data-term="Coase theorem">寇斯定理</span>：協商<span class="term" data-term="Equilibrium">均衡</span>必效率；強<span class="term" data-term="Coase theorem">寇斯定理</span>（<span class="proper">史提格勒</span>提出）：無論<span class="term" data-term="Property rights">財產權</span>歸屬，<span class="term" data-term="Equilibrium">均衡</span>相同——需假設無所得效果才成立。<span class="term" data-term="Property rights">財產權</span>歸屬影響所得分配。</div>
      <div class="mc-ex">例子：養豬場 vs 遊樂園——水權判給任一方，協商後皆達社會最適養豬量（結果相同、分配不同）。</div>
    </div>
  </div>
  <div class="warn">考試重點：<span class="term" data-term="Pigouvian tax">皮古稅</span>＝MEC 最適量處；污染稅 vs 管制（稅有誘因機制較有效）；<span class="term" data-term="Coase theorem">寇斯定理</span>兩要件＋強弱寇斯區別。</div>`
},
{
  id:"17.4", title:"公共財",
  body:`
  <p>財貨四分類（依<span class="term" data-term="Rival">敵對性</span>與<span class="term" data-term="Excludability">排他性</span>）：</p>
  <table class="cmp"><colgroup><col style="width:34%"><col style="width:33%"><col style="width:33%"></colgroup>
    <tr><th>特性</th><th><span class="term" data-term="Rival">敵對性（Rival）</span></th><th><span class="term" data-term="Nonrival">非敵對性（Nonrival）</span></th></tr>
    <tr><td><b><span class="term" data-term="Excludability">排他性</span></b></td><td><span class="term" data-term="Private good">私有財</span>（衣物、汽車）</td><td><span class="term" data-term="Quasi-public good">準公共財</span>／俱樂部財（電影院、健身房）</td></tr>
    <tr><td><b>無<span class="term" data-term="Excludability">排他性</span></b></td><td>共有財（公海漁場）</td><td>純<span class="term" data-term="Public good">公共財</span>（國防、路燈）</td></tr>

  <p><b>出口<span class="term" data-term="Supply">供給</span>線（超額<span class="term" data-term="Supply">供給</span>線）</b>：S<sub>x</sub> = S<sub>x</sub><sup>s</sup>(P) − D<sub>x</sub><sup>d</sup>(P)：國際價格高於國內<span class="term" data-term="Equilibrium">均衡</span>價時，本國出現超額<span class="term" data-term="Supply">供給</span> → 出口。</p>`
},
{
  id:"20.3", title:"部分均衡的自由貿易模型",
  body:`
  <div class="method-card mc-title" data-mc="smtrade">
    <div class="mc-check"><input type="checkbox" id="mc-ch20-1" data-mc="smtrade"><label for="mc-ch20-1" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Small country">小國</span>貿易<span class="term" data-term="Model">模型</span></div>
    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Small country">小國</span>進口：世界<span class="term" data-term="Supply">供給</span>線水平（P<sub>x</sub>*）→ 進口量 = <span class="term" data-term="Quantity demanded">需求量</span> − <span class="term" data-term="Quantity supplied">供給量</span>；<span class="term" data-term="Small country">小國</span>出口：世界<span class="term" data-term="Demand">需求</span>線水平 → 出口量 = <span class="term" data-term="Quantity supplied">供給量</span> − <span class="term" data-term="Quantity demanded">需求量</span></div>
      <div class="mc-detail">進口國開放貿易：價格下降 → CS 上升、PS 下降 → 社會福利增加（<span class="term" data-term="Gains from trade">貿易利得</span>）。出口國開放貿易：價格上升 → PS 上升、CS 下降 → 社會福利增加。<span class="term" data-term="Large country">大國</span>：超額<span class="term" data-term="Demand">需求</span>線與超額<span class="term" data-term="Supply">供給</span>線交點決定世界<span class="term" data-term="Equilibrium">均衡</span>價格。</div>
      <div class="mc-ex">例子：P*=10、<span class="term" data-term="Demand">需求</span> Q=800−20P（Q=600）、<span class="term" data-term="Supply">供給</span> Q=100+10P（Q=200）→ 進口 400。</div>
    </div>
  </div>`
},
{
  id:"20.4", title:"進口關稅",
  body:`
  <p><b><span class="term" data-term="Specific tax">從量稅（Specific tax）</span></b>：每單位課 t 元（P = P*+t）；<b><span class="term" data-term="Ad valorem tax">從價稅（Ad valorem tax）</span></b>：依價格課 τ 比例（P = (1+τ)P*）。</p>
  <div class="method-card mc-title" data-mc="tariff">
    <div class="mc-check"><input type="checkbox" id="mc-ch20-2" data-mc="tariff"><label for="mc-ch20-2" class="mc-lbl">學會</label></div>
    <div class="mc-left">進口關稅</div>
    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Small country">小國</span>：課稅後價格 P*+t 全由本國負擔 → 福利必降，DWL＝消費扭曲＋生產扭曲；<span class="term" data-term="Large country">大國</span>：世界價格下降→貿易條件改善→福利變化不確定（△SW = 貿易條件利益 − 扭曲損失）</div>
      <div class="mc-detail"><b><span class="term" data-term="Consumption distortion loss">消費扭曲損失</span></b>：價格上升減少消費之 CS 損失；<b><span class="term" data-term="Production distortion loss">生產扭曲損失</span></b>：國內廠商高成本生產之損失。<b><span class="term" data-term="Optimum tariff">最適關稅</span></b>：<span class="term" data-term="Large country">大國</span>福利最大之稅率；<b><span class="term" data-term="Prohibitive tariff">禁止性關稅</span></b>：使貿易量歸零之稅率（福利回到<span class="term" data-term="Autarky">自給自足</span>）。<span class="term" data-term="Small country">小國</span><span class="term" data-term="Optimum tariff">最適關稅</span> = 0（自由貿易最佳）。</div>
      <div class="mc-ex">例子：<span class="term" data-term="Small country">小國</span>進口蘋果 P*=10，<span class="term" data-term="Demand">需求</span> Q=400−10P、<span class="term" data-term="Supply">供給</span> Q=50+5P：自由進口 200；課稅使進口=50 → P=20、t=10、關稅收入 500、DWL=750。</div>
    </div>
  </div>`
},
{
  id:"20.5", title:"出口補貼",
  body:`
  <div class="method-card mc-title" data-mc="subsidy">
    <div class="mc-check"><input type="checkbox" id="mc-ch20-3" data-mc="subsidy"><label for="mc-ch20-3" class="mc-lbl">學會</label></div>
    <div class="mc-left"><span class="term" data-term="Export subsidy">出口補貼</span></div>
    <div class="mc-body">
      <div class="mc-formula"><span class="term" data-term="Small country">小國</span>：出口商實收 P*+s、世界價格不變 → 補貼好處全由本國吸收 → 福利必降；<span class="term" data-term="Large country">大國</span>：世界價格下降 → 貿易條件惡化 → 福利必降（必輸之賭）</div>
      <div class="mc-detail">補貼後國內價格上升 → 消費扭曲＋<span class="term" data-term="Production distortion loss">生產扭曲損失</span>；<span class="term" data-term="Large country">大國</span>再因世界價格下跌多一層貿易條件惡化損失。福利 = CS+PS−補貼支出 → 下降。</div>
      <div class="mc-ex">例子：本國出口花生，補貼 s=2 → 本國生產者收 7、外國消費者付 5 → 本國福利下降。</div>
    </div>
  </div>
  <div class="warn">考試重點：<span class="term" data-term="Export subsidy">出口補貼</span>（不論大<span class="term" data-term="Small country">小國</span>）福利必降；進口關稅只有<span class="term" data-term="Small country">小國</span>必降、<span class="term" data-term="Large country">大國</span>不確定。</div>`
},
{
  id:"20.6", title:"進口配額與自動出口設限",
  body:`
  <div class="method-card mc-title" data-mc="quota">
    <div class="mc-check"><input type="checkbox" id="mc-ch20-4" data-mc="quota"><label for="mc-ch20-4" class="mc-lbl">學會</label></div>
    <div class="mc-left">配額 vs VER</div>
    <div class="mc-body">
      <div class="mc-formula">配額：政府直接限制進口數量 → 國內價格上升、世界價格下降 → 出現<span class="term" data-term="Quota rent">配額租</span> =（國內價−世界價）×配額量；VER：出口國自願設限 → <span class="term" data-term="Quota rent">配額租</span>歸外國</div>
      <div class="mc-detail"><b><span class="term" data-term="Quota rent">配額租（Quota rent）</span></b>：配額下國內外價差之利潤；歸本國（廠商/政府）→ 福利效果似<span class="term" data-term="Large country">大國</span>關稅；歸外國（VER）→ 進口國福利必降（△SW = −dce）。<b><span class="term" data-term="Rent seeking">競租行為（Rent seeking）</span></b>：爭奪<span class="term" data-term="Quota rent">配額租</span>造成資源浪費。VER 屬 WTO 灰色地帶（1970–80 美國要求日本汽車設限）。</div>
      <div class="mc-ex">例子：冷氣<span class="term" data-term="Demand">需求</span> Q=800−20P、國內<span class="term" data-term="Supply">供給</span> Q=100+10P、國外每台 10 元無限供應：自由進口 400；配額 100 → P=20、<span class="term" data-term="Quota rent">配額租</span> = (20−10)×100 = 1000。</div>
    </div>
  </div>`
},
{
  id:"20.7", title:"關稅與配額等價分析",
  body:`
  <p><b>等價（Equivalence of tariff and quota）</b>：<span class="term" data-term="Perfect competition">完全競爭</span>市場＋靜態分析下，配額量設定為關稅下之進口量 → 兩者國內外價格、產量、福利變化相同。</p>
  <p><b>不等價情況</b>：<ul><li><span class="term" data-term="Demand">需求</span>變化：配額下<span class="term" data-term="Demand">需求</span>增加 → 國內價格上升更高（關稅下價格固定）</li><li>非<span class="term" data-term="Perfect competition">完全競爭</span>：關稅壓制<span class="term" data-term="Monopoly">獨占</span>廠商訂價（有上限）、配額用完後<span class="term" data-term="Monopoly">獨占</span>力恢復 → 關稅福利較高</li></ul></p>
  <p><b><span class="term" data-term="Dumping">傾銷（Dumping）</span></b>：低於成本或國內售價大量外銷 → 課<b><span class="term" data-term="Antidumping duties">反傾銷稅</span></b>；反制<span class="term" data-term="Export subsidy">出口補貼</span>課<b><span class="term" data-term="Countervailing duties">平衡稅（對銷稅）</span></b>。<b>保護<span class="term" data-term="Infant industry">幼稚產業（Infant industry）</span></b>三條件：具發展潛力、只能短期、成長益處大於保護成本。</p>
  <p><b>區域整合型態</b>（由淺入深）：<span class="term" data-term="Preferential trade area">優惠貿易區</span> → <span class="term" data-term="Free trade area">自由貿易區</span> → <span class="term" data-term="Customs union">關稅同盟</span>（對外共同關稅）→ <span class="term" data-term="Common market">共同市場</span>（要素自由移動）→ <span class="term" data-term="Economic union">經濟同盟</span>（一致財政貨幣政策）。</p>
  <div class="warn">考試重點：關稅 vs 配額等價需「<span class="term" data-term="Perfect competition">完全競爭</span>＋靜態」；<span class="term" data-term="Quota rent">配額租</span>歸屬決定福利；TOT = 出口價格／進口價格。</div>`
},
];
