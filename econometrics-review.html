<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>計量經濟分析（Greene 第6版）｜互動複習</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Georgia,serif' fill='white' text-anchor='middle'%3E%E2%88%91%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fs:16px;
  --paper:#f6f0e2;
  --ink:#2b251d;
  --panel:#fffdf6;
  --line:#e4d9bf;
  --muted:#6f6555;
  --nav-bg:#f1e9d5;
  --nav-ink:#4a4234;
  --nav-hover:#e7dcc0;
  --nav-active:#3c6e8f;
  --accent:#b5542e;
  --accent-soft:#fbeae2;
  --teal:#2c6e9e;
  --teal-soft:#eef3f4;
  --green:#1e7d32;
  --hl:#ffe94a;
  --radius:12px;
  --blue:#2c6e9e;--green2:#3a7d44;--orange:#c06a24;--purple:#6b4e8e;--brown:#8a5a3b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Serif TC","PMingLiU","PingFang TC",serif;
  font-size:var(--fs);
  background:var(--paper);
  color:var(--ink);
  line-height:1.8;
  display:flex;
  min-height:100vh;
}
body.dark{
  --paper:#16130d;--ink:#e6e0d2;--panel:#201c14;--line:#3a3325;
  --muted:#a0937a;--nav-bg:#1f1a10;--nav-ink:#cfc4ad;--nav-hover:#332b1b;
  --nav-active:#4a8ab5;--accent:#e08a55;--accent-soft:#2f2014;
  --teal:#5f9fc0;--teal-soft:#14242e;--green:#5cb56e;--hl:#5a4a1e;
  --blue:#5f9fc0;--green2:#5cb56e;--orange:#d98a4a;--purple:#9b7fc0;--brown:#b08a5a;
}
/* ===== 側邊目錄（兩層） ===== */
.sidebar{
  width:280px;flex-shrink:0;background:var(--nav-bg);color:var(--nav-ink);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 18px 40px;
  border-right:1px solid var(--line);
}
.sidebar .brand{font-weight:700;font-size:15px;letter-spacing:.02em;line-height:1.4;margin-bottom:4px;color:var(--ink)}
.sidebar .brand .t2{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.nav-chapter{
  display:flex;align-items:center;gap:8px;width:100%;padding:4px 10px;border-radius:6px;
  cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);
  border:none;background:none;text-align:left;margin-top:8px;font-family:inherit;line-height:1.45;
}
.nav-chapter:hover{background:var(--nav-hover)}
.nav-chapter.active{background:var(--nav-active);color:#fff}
.nav-chapter .num{font-size:11px;font-weight:600;opacity:.65;width:26px;flex-shrink:0}
.nav-chapter.active .num{opacity:.9}
.nav-chapter .tag{margin-left:auto;font-size:10px;opacity:.55;letter-spacing:.05em;font-weight:400}
.nav-chapter .tag.done{color:var(--green2);opacity:1}
.nav-sub{
  display:block;width:100%;padding:3px 10px 3px 34px;border-radius:6px;
  cursor:pointer;font-size:12.5px;color:var(--muted);border:none;background:none;text-align:left;font-family:inherit;line-height:1.45;
}
.nav-sub:hover{background:var(--nav-hover);color:var(--ink)}
.nav-sub.active{color:var(--nav-active);font-weight:700}
.nav-gloss{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:6px;margin-top:10px;
  cursor:pointer;font-size:13.5px;font-weight:700;color:#8a6d1a;border:1.5px dashed #d9b84a;background:#fffaf0;
  text-align:left;font-family:inherit;line-height:1.45;transition:all .15s;
}
.nav-gloss:hover{border-color:#c9a227;color:#c9a227;background:#fff6dd}
.nav-gloss svg{width:15px;height:15px;flex-shrink:0}
.nav-gloss.active{background:#c9a227;color:#fff;border-style:solid}
.search-panel{
  position:fixed;top:66px;left:50%;transform:translateX(-50%);width:min(680px,92vw);max-height:62vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.16);z-index:60;
}
.search-panel .sp-item{display:block;width:100%;text-align:left;padding:10px 16px;border:none;border-bottom:1px solid var(--line);background:none;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);line-height:1.5}
.search-panel .sp-item:hover{background:var(--nav-hover)}
.search-panel .sp-tag{display:inline-block;font-size:11px;color:var(--teal);font-weight:700;margin-right:8px;letter-spacing:.03em;white-space:nowrap}
.search-panel .sp-item b{display:block;font-size:13.5px;margin:2px 0}
.search-panel .sp-snip{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-panel .sp-count{padding:8px 16px;font-size:12px;color:var(--muted);text-align:center}
.search-panel .sp-empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:13.5px}
body.dark .search-panel{background:#26221a;border-color:#4a4234}
/* ===== 主內容 ===== */
.main{flex:1;min-width:0;padding:28px 34px 80px}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);padding:10px 0 14px;margin-bottom:18px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.searchbox{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.searchbox svg{width:16px;height:16px;opacity:.45;flex-shrink:0}
.searchbox input{border:none;outline:none;background:none;font-size:14px;width:100%;color:var(--ink);font-family:inherit}
.toolbtn{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit;transition:all .15s;
}
.toolbtn:hover{border-color:var(--teal);color:var(--teal)}
.toolbtn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.toolbtn svg{width:15px;height:15px}
/* 章頭 */
.chapter-head{border-left:8px solid var(--teal);padding:6px 0 10px 18px;margin:30px 0 18px}
.chapter-head .kicker{display:inline-block;font-size:12px;letter-spacing:.15em;color:var(--teal);font-family:"Noto Sans TC",sans-serif;font-weight:600}
.chapter-head h1{font-family:"Noto Serif TC",serif;font-size:27px;line-height:1.25;margin:2px 0 4px}
.chapter-head p{color:var(--muted);font-size:14.5px;max-width:760px;margin-top:6px}
/* 小節 */
.section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.section-head{
  display:flex;align-items:center;gap:12px;padding:14px 28px;cursor:pointer;user-select:none;
  font-family:"Noto Serif TC",serif;font-size:19px;font-weight:600;border-bottom:2px solid transparent;transition:border-color .15s;
}
.section.open .section-head{border-bottom-color:var(--teal)}
.section-head .sec-num{color:var(--teal);font-size:12.5px;font-weight:700;font-family:"Noto Sans TC",sans-serif;letter-spacing:.08em;flex-shrink:0}
.section-head .chev{width:18px;height:18px;margin-left:auto;transition:transform .2s;flex-shrink:0}
.section.open .section-head .chev{transform:rotate(180deg)}
.section-body{display:none;padding:4px 28px 18px}
.section.open .section-body{display:block}
.section-body p{margin:10px 0;font-size:14.8px}
.section-body ul{margin:8px 0;padding-left:24px}
.section-body li{margin:3px 0}
/* callout 盒子（參考章節筆記風格） */
.section-body .note{background:#fdf0c2;border-left:4px solid #d9a514;padding:12px 16px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.section-body .note::before{content:"重點與結論";display:block;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#8a6d1a;margin-bottom:4px}
.section-body .warn{background:var(--accent-soft);border-left:4px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.section-body .warn::before{content:"考試重點";display:block;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin-bottom:4px}
.section-body .src{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
.section-body .src summary{cursor:pointer;font-size:12.5px;color:var(--teal)}
.section-body .src pre{white-space:pre-wrap;font-family:"Noto Serif TC",serif;font-size:13px;color:var(--muted);margin-top:8px;max-height:280px;overflow-y:auto}
/* 公式卡 */
.formula{background:#fbf4e6;border:1px dashed #c9b88f;border-radius:8px;padding:14px 18px;margin:12px 0;font-size:15.5px;text-align:center;font-family:"Noto Serif TC",serif}
.formula .f-label{display:block;font-size:11.5px;color:#9a6a1f;letter-spacing:.08em;margin-bottom:4px;font-family:"Noto Sans TC",sans-serif;font-weight:700}
.formula .f-note{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-family:"Noto Sans TC",sans-serif}
/* 術語 */
.term{color:var(--green);font-weight:700;cursor:pointer;border-bottom:1.5px dashed color-mix(in srgb,var(--green) 55%,transparent);border-radius:3px;padding:0 2px;transition:all .15s}
.term:hover{background:var(--green);color:#fff;border-bottom:none}
/* 專有名詞（人名／事件）深紫粗體 */
.proper{color:#7b2cbf;font-weight:700;cursor:pointer;border-bottom:1.5px dashed color-mix(in srgb,#7b2cbf 50%,transparent);border-radius:3px;padding:0 2px;transition:background .15s}
.proper:hover{background:#7b2cbf;color:#fff;border-bottom:none}
body.dark .proper{color:#b39ddb}
body.dark .proper:hover{background:#b39ddb;color:#1a1420}
/* 術語列表與知識卡：人物/書名類紫色粗體 */
#termModalEn{color:var(--green)}
#termModalEn.proper,#termModalZh.proper{color:#7b2cbf}
body.dark #termModalEn.proper,body.dark #termModalZh.proper{color:#b39ddb}
#termModalDef .proper{color:#7b2cbf;font-weight:700;border-bottom:1.5px dashed color-mix(in srgb,#7b2cbf 50%,transparent)}
body.dark #termModalDef .proper{color:#b39ddb}
.gloss-en.proper,.gloss-zh.proper{color:#7b2cbf}
body.dark .gloss-en.proper,body.dark .gloss-zh.proper{color:#b39ddb}
/* 例題 */
.problem{background:#eae6da;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:14px 0}
.problem .p-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;color:var(--teal);margin-bottom:8px}
.problem .p-body{font-size:14.5px}
.problem .opts{margin:10px 0 4px;display:grid;gap:6px}
.problem .opts div{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.8px;background:var(--panel)}
.opts .opt{cursor:pointer;transition:all .15s}
.opts .opt:hover{border-color:var(--teal);background:var(--teal-soft)}
.opts .opt.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.opts .opt.right{border-color:#1e7d32;background:#e7f3e4;color:#1e7d32;font-weight:700}
.opts .opt.wrong{border-color:#c0392b;background:#fbeaea;color:#c0392b;font-weight:700}
.opts[data-locked="1"] .opt{pointer-events:none;cursor:default}
.prob-fb{margin-top:10px;font-size:14px;font-weight:700}
.fb-ok{color:#1e7d32}
.fb-no{color:#c0392b}
body.dark .problem{background:#26221a}
.ans-btn{
  margin-top:12px;display:inline-flex;align-items:center;gap:8px;background:none;border:1.5px solid var(--teal);
  color:var(--teal);border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .15s;
}
.ans-btn:hover{background:var(--teal);color:#fff}
.fav{
  margin-left:auto;background:none;border:1.5px solid var(--line);color:var(--muted);border-radius:8px;
  padding:3px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;
}
.fav:hover{border-color:#c9a227;color:#c9a227}
.fav.on{border-color:#c9a227;background:#fffaf0;color:#c9a227;font-weight:700}
body.dark .fav.on{background:#3a3320}
.ans{display:none;margin-top:12px;background:var(--teal-soft);border-radius:8px;padding:12px 16px;font-size:14px}
.ans.show{display:block}
.ans .a-label{font-weight:700;color:var(--teal);font-size:13px}
.ans ul{margin:6px 0 2px;padding-left:22px}
.ans li{margin:3px 0}
.ans b{font-weight:700}
/* 術語卡區 */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin:16px 0}
.flip-card{perspective:900px;height:150px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);padding:12px;text-align:center}
.flip-front{background:var(--panel)}
.flip-front .en{font-size:16px;font-weight:700;color:var(--teal);word-break:break-word}
.flip-front .zh{font-size:13px;color:var(--muted)}
.flip-back{background:var(--teal);color:#fff;transform:rotateY(180deg)}
.flip-back .def{font-size:13px;line-height:1.6}
.flip-hint{font-size:11px;opacity:.5;margin-top:4px}
/* ===== 術語表（列表形式） ===== */
.gloss-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.gloss-cats{display:flex;gap:6px;flex-wrap:wrap}
.gloss-cat-btn{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 13px;font-size:12.5px;cursor:pointer;color:var(--muted);transition:all .15s}
.gloss-cat-btn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.gloss-progress{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.gloss-progress .bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.gloss-progress .fill{height:100%;background:var(--teal);width:0%;transition:width .3s}
.gloss-progress .label{font-size:13px;color:var(--muted);white-space:nowrap}
.gloss-group{margin-bottom:16px}
.gloss-group h3{font-size:14px;color:var(--teal);margin:14px 0 8px;padding-left:10px;border-left:3px solid var(--teal);letter-spacing:.04em}
.gloss-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:8px 0;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s}
.gloss-item.starred{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gloss-check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;cursor:pointer;display:grid;place-items:center;margin-top:2px;transition:all .15s;background:none;padding:0}
.gloss-check svg{width:14px;height:14px;display:none;color:#fff}
.gloss-check.done{background:var(--teal);border-color:var(--teal)}
.gloss-check.done svg{display:block}
.gloss-item.done .gloss-en{text-decoration:line-through;opacity:.55}
.gloss-main{flex:1;min-width:0}
.gloss-en{font-weight:700;color:var(--green);font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gloss-zh{font-size:15px;color:var(--green);font-weight:700;margin-left:2px}
.gloss-def{font-size:13.5px;margin-top:4px;line-height:1.8}
.gloss-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.gloss-btn{border:1px solid var(--line);background:none;border-radius:7px;padding:3px 10px;font-size:11.5px;cursor:pointer;color:var(--muted);transition:all .15s}
.gloss-btn:hover{color:var(--teal);border-color:var(--teal)}
.gloss-btn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.gloss-note{display:none;margin-top:8px}
.gloss-note.show{display:block}
.gloss-note textarea{width:100%;min-height:56px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--paper);color:var(--ink);font-family:inherit;resize:vertical}
.gloss-note textarea:focus{outline:none;border-color:var(--teal)}
.gloss-data-actions{display:flex;gap:8px;margin-left:auto}
/* 搜尋高亮 */
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
mark.hl{background:var(--hl)}
/* 重點高亮（使用者標記） */
.userhl{background:var(--hl);border-radius:3px;cursor:pointer;box-shadow:0 0 0 2px var(--hl)}
/* 畫記模式 */
body.marking{cursor:crosshair}
body.marking .section-body p,body.marking .section-body li,body.marking .section-body .note,body.marking .section-body .warn,body.marking .problem .p-body{cursor:crosshair;border-radius:3px;transition:box-shadow .12s}
body.marking .section-body p:hover,body.marking .section-body li:hover,body.marking .section-body .note:hover,body.marking .section-body .warn:hover,body.marking .problem .p-body:hover{box-shadow:0 0 0 2px rgba(255,233,74,.45);background:rgba(255,233,74,.12)}
/* 進度條 */
.progress-strip{display:flex;gap:6px;margin:14px 0 6px}
.progress-strip i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress-strip i.done{background:var(--teal)}
.progress-strip i.na{background:none;border:1px dashed var(--line);height:3px}
.progress-label{font-size:12px;color:var(--muted);margin-top:4px}
.p-head .done-btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted);font-family:inherit;flex-shrink:0;transition:all .15s}
.p-head .done-btn:hover{border-color:var(--green);color:var(--green)}
.p-head .done-btn.on{background:#e3f0e3;border-color:var(--green);color:var(--green);font-weight:700}
body.dark .p-head .done-btn.on{background:#1d2b1d}
.prob-progress{font-size:13px;font-weight:600;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--teal-soft);color:var(--teal);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:500}
/* 提示條 */
.banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px;padding:14px 18px;font-size:13.5px;color:var(--ink);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:18px;height:18px;flex-shrink:0;color:var(--accent);margin-top:2px}
/* 空狀態 */
.empty{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
.empty.show{display:block}
.empty .big{font-size:40px;margin-bottom:10px}
.chpage{font-size:12.5px;color:var(--muted);font-family:"Noto Sans TC",sans-serif}
.chapter-head .ch-points{margin:10px 0 0;padding-left:22px;font-size:14.5px;color:var(--ink)}
.chapter-head .ch-points li{margin:3px 0}
/* 方法學習卡（左打勾＋方法名＋公式說明，底下例子） */
.method-card{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;margin:12px 0;background:var(--panel);overflow:hidden;transition:opacity .2s}
.method-card .mc-check{width:64px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--panel)}
.method-card .mc-check input{width:19px;height:19px;accent-color:var(--green);cursor:pointer}
.method-card .mc-check .mc-lbl{font-size:11px;color:var(--muted)}
.method-card .mc-check:has(input:checked){background:#eef7ec}
.method-card .mc-check:has(input:checked) .mc-lbl{color:var(--green);font-weight:700}

<script>
/* ===== 資料：全書章節結構 ===== */
const BOOK = [
  {n:1, title:"計量經濟學與經濟模型", subs:["1.1 計量經濟學的本質與方法論","1.2 經濟理論與計量模型","1.3 資料的類型與結構","1.4 因果關係與相關性","1.5 計量分析的步驟"], done:true, points:["計量經濟學＝結合經濟理論、數理統計與經濟資料，以估計、檢定經濟關係並做預測","方法論：先驗理論→模型設定→資料蒐集→估計→檢定→解釋與預測","計量模型是數學模型的隨機化版本：加入誤差項 ε","資料類型：橫斷面(cross-section)、時間序列(time series)、追蹤/縱橫面(panel)","因果關係 vs 相關性：計量經濟旨在推斷因果，而非僅描述相關","迴歸分析：探討依變數 y 與解釋變數 x 之間的統計關係","計量經濟學的三大任務：結構分析、預測、政策評估"]},
  {n:2, title:"簡單線性迴歸模型", subs:["2.1 簡單線性迴歸的設定","2.2 普通最小平方法 OLS","2.3 OLS 估計量的推導","2.4 擬合優度 R²","2.5 範例：消費函數"], done:true, points:["簡單線性迴歸模型：y = β₀ + β₁x + u","OLS 原理：最小化殘差平方和 Σe²","β̂₁ = Σ(xi-x̄)(yi-ȳ) / Σ(xi-x̄)²","β̂₀ = ȳ - β̂₁x̄","殘差 e = y - ŷ = y - (β̂₀ + β̂₁x)","R² = ESS/TSS = 1 - RSS/TSS，介於 0 與 1 之間","R² 解釋：x 解釋了 y 變異的百分比","OLS 的幾何意義：y 對 x 的投影","最小平方法的直覺：找一條線使觀測點到直線的垂直距離平方和最小"]},
  {n:3, title:"多元線性迴歸模型", subs:["3.1 多元迴歸的設定","3.2 OLS 的矩陣表示","3.3 偏迴歸係數的意義","3.4 擬合優度與調整 R²","3.5 虛擬變數"], done:true, points:["多元線性迴歸：y = β₀ + β₁x₁ + β₂x₂ + ... + βkxk + u","矩陣形式：y = Xβ + u，X 為 n×(k+1) 矩陣","OLS 估計量：β̂ = (X'X)⁻¹X'y","偏迴歸係數 βⱼ：控制其他變數不變下，xⱼ 對 y 的邊際效果","R² 隨解釋變數增加只增不減；調整 R² 懲罰變數個數","調整 R² = 1 - (RSS/(n-k-1)) / (TSS/(n-1))","虛擬變數(dummy variable)：0/1 變數，表達質性特徵","虛擬變數陷阱：若有 m 個類別，只能放 m-1 個虛擬變數","迴歸係數的個體經濟解讀：邊際效果"]},
  {n:4, title:"古典假設與 OLS 性質", subs:["4.1 古典線性迴歸模型的假設","4.2 OLS 估計式的小樣本性質","4.3 OLS 的大樣本性質","4.4 遺漏變數偏誤","4.5 多餘變數的效果"], done:true, points:["古典假設五項：線性、隨機抽樣、不完全共線、條件零平均、同變異數","高斯-馬可夫定理：OLS 是 BLUE","遺漏變數偏誤的兩個必要條件","多餘變數：不偏但無效率"]},
  {n:5, title:"區間估計與假設檢定", subs:["5.1 常態分配假設與小樣本理論","5.2 單一係數的 t 檢定","5.3 信賴區間","5.4 聯合假設檢定與 F 檢定","5.5 預測與預測區間"], done:true, points:["t 統計量自由度 = n-k-1","F 檢定：聯合假設檢定","整體 F 檢定：所有係數同時為零","預測區間比信賴區間寬"]},
  {n:6, title:"函數形式與模型設定", subs:["6.1 對數線性模型","6.2 多項式模型與交互項","6.3 Chow 檢定與結構改變","6.4 模型設定誤差","6.5 模型選擇準則"], done:true, points:["雙對數模型係數是彈性","半對數模型係數是半彈性","交互項：邊際效果取決於另一變數水準","AIC/BIC 模型選擇準則，越小越好"]},
  {n:7, title:"虛擬變數與虛擬因變數", subs:["7.1 虛擬解釋變數","7.2 虛擬因變數與 LPM","7.3 Logit 與 Probit 模型","7.4 多類別與有序因變數模型","7.5 計數因變數模型"], done:true, points:["虛擬變數陷阱：m 個類別只能放 m-1 個","LPM 的問題：機率可能超出 [0,1]、必然有異變數","Logit/Probit 解決二元因變數問題","Poisson/負二項解決計數資料問題"]},
  {n:8, title:"異變數", subs:["8.1 異變數的意義與後果","8.2 異變數的偵測","8.3 加權最小平方法 WLS","8.4 穩健標準誤","8.5 常見異變數型態"], done:true, points:["異變數後果：不偏但無效率、標準誤估計錯誤","BP 檢定、White 檢定偵測異變數","WLS：知道異變數形式時的解決方法","穩健標準誤：不知道形式時最實用的方法"]},
  {n:9, title:"自我相關", subs:["9.1 自我相關的意義與後果","9.2 自我相關的偵測","9.3 解決自我相關的方法","9.4 自我相關的來源"], done:true, points:["自我相關後果：不偏但無效率、標準誤估計錯誤","DW 統計量 ≈ 2(1-ρ̂)","Newey-West 穩健標準誤修正自我相關","自我相關主要出現在時間序列資料"]},
  {n:10, title:"隨機解釋變數與測量誤差", subs:["10.1 嚴格外生性假設","10.2 隨機解釋變數的問題","10.3 測量誤差的後果","10.4 聯立方程式偏誤"], done:true, points:["內生性三來源：遺漏變數、測量誤差、聯立偏誤","解釋變數測量誤差：向零偏誤、不一致","依變數測量誤差：不要緊，只增加變異數"]},
  {n:11, title:"工具變數與兩段最小平方法", subs:["11.1 工具變數的概念","11.2 兩段最小平方法 2SLS","11.3 弱工具變數","11.4 過度認定檢定","11.5 Hausman 檢定"], done:true, points:["工具變數兩條件：相關 + 排他性","2SLS：第一階段 x 對 z 迴歸，第二階段 y 對 x̂ 迴歸","弱工具變數：第一階段 F<10","Hausman 檢定：檢定是否存在內生性"]},
  {n:12, title:"追蹤資料模型", subs:["12.1 追蹤資料的結構","12.2 混合最小平方法 Pooled OLS","12.3 固定效果模型 Fixed Effects","12.4 隨機效果模型 Random Effects","12.5 虛擬變數法 LSDV"], done:true, points:["FE：控制不隨時間改變的未觀測異質性","RE：假設個體效果和解釋變數不相關","Hausman 檢定選擇 FE vs RE","FE 無法估計不隨時間改變的變數效果"]},
  {n:13, title:"時間序列模型", subs:["13.1 時間序列資料的特性","13.2 平穩性 Stationarity","13.3 自我相關函數 ACF 與 PACF","13.4 ARMA 與 ARIMA 模型","13.5 波動率模型 ARCH/GARCH"], done:true, points:["平穩性是時間序列分析的核心","虛假迴歸：非平穩序列迴歸會偽顯著","ARMA/ARIMA 建模平穩序列","ARCH/GARCH 建模波動率聚集"]},
  {n:14, title:"自我選擇與效果模型", subs:["14.1 隨機控制實驗 RCT","14.2 差異中的差異 DiD","14.3 傾向得分匹配 PSM","14.4 斷點迴歸 RD"], done:true, points:["RCT 是因果推斷黃金標準","DiD：平行趨勢假設","PSM 只能解決可觀察變數的選擇偏誤","RD：利用門檻斷點估計因果效果"]},
  {n:15, title:"最大概似估計 MLE", subs:["15.1 概似函數的概念","15.2 MLE 的性質","15.3 三大檢定：概似比、Wald、LM","15.4 MLE 的應用"], done:true, points:["MLE：選擇參數使得觀察到資料的機率最大","MLE 三大性質：一致、漸近常態、漸近有效","LRT/Wald/LM 三大檢定漸近等價","Logit/Probit/Poisson 都是 MLE 估計"]},
  {n:16, title:"一般化動車法 GMM", subs:["16.1 動機條件與 GMM","16.2 GMM 的直覺","16.3 過度認定檢定","16.4 GMM 的應用：動態追蹤模型"], done:true, points:["GMM 只需要動機條件，不需要完整分配","OLS/IV 都是 GMM 的特例","Hansen J 檢定：工具變數外生性檢定","Arellano-Bond：動態追蹤模型的 GMM 估計"]},
];
/* ===== 術語資料（點擊卡片時顯示） ===== */
const TERMS = {
"Econometrics":["Econometrics","計量經濟學","結合經濟理論、數理統計與經濟資料，對經濟關係進行估計、檢定與預測的學科。"],
"Econometric model":["Econometric model","計量模型","將經濟理論的數學模型加上隨機誤差項，形成可估計的統計模型。"],
"Cross-sectional data":["Cross-sectional data","橫斷面資料","在同一時間點上，對多個個體（個人、廠商、國家等）觀察所得的資料。"],

{

  <h3 style="margin-top:16px;font-size:16px;font-weight:600;">1.3.1 從經濟理論到計量模型</h3>
  <p>經濟理論通常是用數學函數來表示的，例如需求理論：需求量是價格的函數 Qd = f(P)。</p>
  <p>但現實世界不是這麼完美的——除了價格之外，還有很多其他因素會影響需求量（所得、偏好、替代品價格等），而且這些影響通常是隨機的、不確定的。</p>
  <p>所以我們需要加入一個<b>誤差項</b> (error term) 來代表所有我們沒有觀察到的影響：</p>
  <div class="formula"><span class="f-label">母體迴歸函數 PRF</span>y = β₀ + β₁x + u</div>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">1.3.2 母體迴歸函數 vs 樣本迴歸函數</h3>
  <p>這是計量經濟學最基礎的一組概念，一定要搞清楚：</p>

  <div class="tblwrap">
    <table>
      <thead>
        <tr><th></th><th>母體迴歸函數 (PRF)</th><th>樣本迴歸函數 (SRF)</th></tr>
      </thead>
      <tbody>
        <tr><td><b>代表</b></td><td>整個母體的真實關係</td><td>你手上這份樣本估計出來的關係</td></tr>
        <tr><td><b>公式</b></td><td>y = β₀ + β₁x + u</td><td>ŷ = β̂₀ + β̂₁x</td></tr>
        <tr><td><b>β 是什麼</b></td><td>真實的母數（未知的常數）</td><td>估計值（隨機變數）</td></tr>
        <tr><td><b>u 是什麼</b></td><td>母體誤差項（真實存在）</td><td>殘差 ê = y - ŷ（估計出來的）</td></tr>
        <tr><td><b>我們知道嗎</b></td><td>永遠不知道真實值（這就是為什麼要估計）</td><td>可以算出來</td></tr>
      </tbody>
    </table>
  </div>

  <div class="method-card mc-title" data-mc="prf-srf">
    <div class="mc-check"><input type="checkbox" id="mc-ch1-3" data-mc="prf-srf"><label for="mc-ch1-3" class="mc-lbl">學會</label></div>

    <div class="mc-body">
      <div class="mc-formula">PRF 是「真相」，SRF 是「我們看到的影子」</div>
      <div class="mc-detail">你永遠看不到 PRF 長什麼樣子，只能透過樣本估計出 SRF，然後猜測 PRF 大概是什麼。這就是「估計」和「推論」的本質。</div>
      <div class="mc-ex">數值範例：如果真實的 PRF 是 y = 2 + 0.5x + u，你抽了 100 筆樣本，估計出來的 SRF 可能是 ŷ = 1.8 + 0.52x。β̂₀=1.8 不是真實的 β₀=2，但很接近。</div>

  <p style="margin-top:16px;color:var(--muted);font-size:13px;"><b>前後章節關聯</b>：PRF/SRF 的區分是整個 OLS 理論的基礎。第 2-4 章都是在討論「從 SRF 推論 PRF」——也就是怎麼樣用樣本估計值來猜母體的真實值，以及這個猜測有多準。</p>`

{
  id:"1.5", title:"因果關係 vs 相關關係",
  body:`
  <p>這是計量經濟學最容易搞混、也最重要的一組概念。很多人以為「兩個變數有相關，就是有因果關係」——這是錯的！</p>

  <h3 style="margin-top:16px;font-size:16px;font-weight:600;">1.5.1 相關不等於因果</h3>
  <p>兩個變數 X 和 Y 有相關，可能有三種解釋：</p>
  <ol>
    <li><b>X 造成 Y</b>：真的是因果關係（你想要的）</li>
    <li><b>Y 造成 X</b>：反向因果（因果關係反過來了）</li>
    <li><b>Z 同時造成 X 和 Y</b>：第三變數效果（偽相關 / 混淆變數）</li>
  </ol>

  <div class="method-card mc-title" data-mc="causation">
    <div class="mc-check"><input type="checkbox" id="mc-ch1-5" data-mc="causation"><label for="mc-ch1-5" class="mc-lbl">學會</label></div>
    <div class="mc-left">經典範例：冰淇淋和溺水</div>
    <div class="mc-body">
      <div class="mc-formula">冰淇淋賣得越多 → 溺水的人越多 → 所以冰淇淋會造成溺水？</div>
      <div class="mc-detail">當然不是！真正的原因是「夏天氣溫高」：天熱的時候，冰淇淋賣得多，去游泳的人也多，所以溺水的人也多。「天氣」就是第三變數 Z。</div>
      <div class="mc-ex">這就是為什麼需要控制變數——如果不控制天氣，你會以為冰淇淋和溺水有因果關係，但其實都是天氣的效果。</div>
    </div>
  </div>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">1.5.2 怎麼判斷有沒有因果關係？</h3>
  <p>要建立因果關係，需要滿足三個條件：</p>
  <ol>
    <li><b>時間順序</b>：X 發生在 Y 之前</li>
    <li><b>共變性</b>：X 改變時，Y 也會跟著改變</li>
    <li><b>排除其他解釋</b>：沒有其他變數 Z 可以同時解釋 X 和 Y</li>
  </ol>
  <p>第三個條件最難滿足，也是計量經濟學（特別是實用計量）大部分章節在處理的問題。</p>

  <p style="margin-top:16px;color:var(--muted);font-size:13px;"><b>前後章節關聯</b>：因果推斷是現代計量經濟學的核心。第 10 章講內生性問題（為什麼 OLS 估計不出因果效果）；第 11 章講工具變數；第 12 章講追蹤資料固定效果；第 14 章講實驗和擬實驗方法（RCT、DiD、PSM、RD）。</p>`

  <p>簡單線性迴歸模型 (Simple Linear Regression Model) 是最基礎的計量模型——只有一個解釋變數 X，用來解釋依變數 Y 的變動。</p>

  <div class="formula"><span class="f-label">簡單線性迴歸模型</span>y = β₀ + β₁x + u</div>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">模型各部分的意義</h3>
  <ul>
    <li><b>y</b>：依變數 (dependent variable)、被解釋變數——你想要解釋的那個變數（例如：薪資）</li>
    <li><b>x</b>：解釋變數 (independent variable)、自變數——用來解釋 y 的那個變數（例如：教育年數）</li>
    <li><b>β₀</b>：截距項 (intercept)——當 x=0 時，y 的平均值</li>
    <li><b>β₁</b>：斜率係數 (slope coefficient)——x 每增加一單位，y 平均變動多少</li>
    <li><b>u</b>：誤差項 (error term)——所有我們沒有觀察到、但會影響 y 的因素</li>

{
  id:"2.2", title:"OLS 估計式的推導",
  body:`
  <p>普通最小平方法 (Ordinary Least Squares, OLS) 是最常用的估計方法。它的目標是：找到一條直線，讓所有樣本點到這條直線的「垂直距離平方和」最小。</p>

  <h3 style="margin-top:16px;font-size:16px;font-weight:600;">2.2.1 最小化殘差平方和</h3>
  <p>殘差 êᵢ = yᵢ - ŷᵢ = yᵢ - (β̂₀ + β̂₁xᵢ)，代表第 i 個樣本點到迴歸線的垂直距離。</p>
  <p>OLS 要最小化的目標函數是：</p>
  <div class="formula"><span class="f-label">殘差平方和 SSR</span>SSR = Σ êᵢ² = Σ (yᵢ - β̂₀ - β̂₁xᵢ)²</div>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">2.2.2 一階條件</h3>
  <p>對 β̂₀ 和 β̂₁ 分別做偏微分，令其等於 0：</p>
  <div class="formula">∂SSR/∂β̂₀ = -2 Σ (yᵢ - β̂₀ - β̂₁xᵢ) = 0</div>
  <div class="formula">∂SSR/∂β̂₁ = -2 Σ xᵢ(yᵢ - β̂₀ - β̂₁xᵢ) = 0</div>

  <p>解這兩個方程式，就可以得到 OLS 估計式：</p>
  <div class="formula"><span class="f-label">OLS 斜率估計式</span>β̂₁ = Σ (xᵢ - x̄)(yᵢ - ȳ) / Σ (xᵢ - x̄)²</div>
  <div class="formula"><span class="f-label">OLS 截距估計式</span>β̂₀ = ȳ - β̂₁x̄</div>

  <div class="method-card mc-title" data-mc="ols-formula">
    <div class="mc-check"><input type="checkbox" id="mc-ch2-0" data-mc="ols-formula"><label for="mc-ch2-0" class="mc-lbl">學會</label></div>
    <div class="mc-left">OLS 公式的直覺</div>
    <div class="mc-body">
      <div class="mc-formula">β̂₁ = Cov(x,y) / Var(x)</div>
      <div class="mc-detail">分子是 x 和 y 的共變異數（兩者一起變動的程度），分母是 x 的變異數（x 自己變動的程度）。<br>所以 β̂₁ 就是：x 每變動一單位，y 平均跟著變動多少。</div>
      <div class="mc-ex">數值範例：如果 Cov(x,y) = 10，Var(x) = 20，那 β̂₁ = 10/20 = 0.5。</div>
    </div>
  </div>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">2.2.3 OLS 的兩個代數性質</h3>
  <ol>
    <li><b>殘差和為 0</b>：Σ êᵢ = 0。這是從一階條件第一個式子直接得到的。</li>
    <li><b>殘差和 x 不相關</b>：Σ xᵢêᵢ = 0。這是從一階條件第二個式子直接得到的。</li>
  </ol>
  <p>這兩個性質很重要，後面推導 OLS 的性質時會用到。</p>

  <p style="margin-top:16px;color:var(--muted);font-size:13px;"><b>前後章節關聯</b>：OLS 估計式是整個計量經濟學的基礎。第 3 章會把它推廣到多元迴歸（矩陣形式）；第 4 章會討論在什麼假設下，OLS 估計式有良好的性質（不偏、BLUE）。</p>`

{
  id:"2.3", title:"擬合優度 R²",
  body:`
  <p>估計完迴歸線之後，你會想知道：這條線對數據的「解釋力」有多強？也就是說，y 的變動裡面，有多少比例是被 x 解釋掉的？</p>
  <p>這個問題的答案就是<b>判定係數 R²</b> (R-squared)。</p>

  <h3 style="margin-top:16px;font-size:16px;font-weight:600;">2.3.1 變異數分解</h3>
  <p>y 的總變動可以拆成兩部分：</p>
  <div class="formula"><span class="f-label">變異數分解</span>SST = SSE + SSR</div>
  <ul>
    <li><b>SST (Total Sum of Squares)</b> = Σ (yᵢ - ȳ)²：y 的總變異（y 偏離平均值多少）</li>
    <li><b>SSE (Explained Sum of Squares)</b> = Σ (ŷᵢ - ȳ)²：被模型解釋的變異（預測值偏離平均值多少）</li>
    <li><b>SSR (Residual Sum of Squares)</b> = Σ (yᵢ - ŷᵢ)²：沒有被模型解釋的變異（殘差）</li>
  </ul>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">2.3.2 R² 的定義</h3>
  <div class="formula"><span class="f-label">判定係數 R²</span>R² = SSE / SST = 1 - SSR / SST</div>

  <p>R² 的介於 0 和 1 之間：</p>
  <ul>
    <li><b>R² = 1</b>：模型完美擬合，所有樣本點都剛好在迴歸線上（SSR=0）</li>
    <li><b>R² = 0</b>：模型完全沒有解釋力，x 對 y 一點幫助都沒有（SSE=0）</li>
  </ul>

  <div class="method-card mc-title" data-mc="r2">
    <div class="mc-check"><input type="checkbox" id="mc-ch2-2" data-mc="r2"><label for="mc-ch2-2" class="mc-lbl">學會</label></div>
    <div class="mc-left">R² 的正確解讀</div>
    <div class="mc-body">
      <div class="mc-formula">R² = y 的總變異中，有多少比例被 x 解釋掉了</div>
      <div class="mc-detail">例如 R² = 0.3，意思是：y 的變動中，有 30% 可以被 x 解釋，剩下 70% 是其他因素造成的。</div>
      <div class="mc-ex">注意：R² 高不代表模型就是對的。即使 R² 很高，也可能有遺漏變數偏誤（第 4.4 節）。同樣，R² 低也不代表模型就沒用——有時候你只是想要估計某個因果效果，不需要解釋所有 y 的變動。</div>
    </div>
  </div>

  <div class="warn">考試重點：在因果推斷的研究中，R² 通常不是最重要的指標。很多頂級期刊的論文 R² 可能只有 0.1 或 0.2，但因為係數估計是因果效果，還是很有價值。不要把 R² 當成評斷模型好壞的唯一標準。</div>

  <p style="margin-top:16px;color:var(--muted);font-size:13px;"><b>前後章節關聯</b>：第 3 章會講「調整後 R²」——因為你放越多變數，R² 一定會越來越大（即使那些變數根本沒用），所以需要一個考慮自由度的指標。</p>`

  <div class="formula"><span class="f-label">OLS 估計式（矩陣形式）</span>β̂ = (X'X)⁻¹X'y</div>

  <h3 style="margin-top:16px;font-size:16px;font-weight:600;">推導概要</h3>
  <p>和簡單迴歸一樣，我們要最小化殘差平方和。用矩陣寫就是：</p>
  <div class="formula">SSR = ê'ê = (y - Xβ̂)'(y - Xβ̂)</div>
  <p>對 β̂ 做偏微分，令其等於 0：</p>
  <div class="formula">∂SSR/∂β̂ = -2X'(y - Xβ̂) = 0</div>
  <p>整理一下：</p>
  <div class="formula">X'Xβ̂ = X'y</div>
  <p>兩邊同乘 (X'X)⁻¹：</p>

    <div class="mc-body">
      <div class="mc-formula">β̂ = (X'X)⁻¹X'y</div>
      <div class="mc-detail">

{

  body:`
  <p>和簡單迴歸一樣，多元迴歸也可以算 R²：</p>
  <div class="formula">R² = 1 - SSR / SST</div>

  <h3 style="margin-top:16px;font-size:16px;font-weight:600;">問題：為什麼需要「調整後 R²」？</h3>
  <p>因為只要你多放一個解釋變數，R² 一定會變大——即使那個變數根本沒用。原因是：放越多變數，SSR 只會變小或不變（不可能變大），所以 R² = 1 - SSR/SST 只會變大或不變。</p>
  <p>這就造成一個誘因：為了讓 R² 看起來很高，你可以亂放一堆根本沒用的變數。這當然不是好事。</p>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">解決方法：調整後 R² (Adjusted R²)</h3>
  <p>調整後 R² 的公式：</p>
  <div class="formula"><span class="f-label">調整後 R²</span>R̄² = 1 - (SSR/(n-k-1)) / (SST/(n-1))</div>
  <p>和原本的 R² 差別在於：把「變數個數 k」考慮進去，用「自由度」來調整。</p>

  <div class="method-card mc-title" data-mc="adjusted-r2">
    <div class="mc-check"><input type="checkbox" id="mc-ch3-3" data-mc="adjusted-r2"><label for="mc-ch3-3" class="mc-lbl">學會</label></div>
    <div class="mc-left">調整後 R² 的性質</div>
    <div class="mc-body">
      <div class="mc-formula">
      1. R̄² ≤ R²（一定比較小或一樣）<br>
      2. 放一個「根本沒用」的變數（真實係數=0），R̄² 反而會變小<br>
      3. R̄² 可能是負的
      </div>
      <div class="mc-detail">
      重點是第 2 點：調整後 R² 會「懲罰」你放太多沒用的變數。所以它比較適合用來「選擇模型」——在一堆備選模型之間，選 R̄² 最高的那個。

{
  id:"3.5", title:"多重共線性 (Multicollinearity)",
  body:`
  <p>古典假設 3 說的是「沒有<b>完全</b>共線」。但現實中，解釋變數之間通常會有「某種程度」的相關，只是不會完全共線而已。這就叫做「多重共線性」。</p>

  <h3 style="margin-top:16px;font-size:16px;font-weight:600;">3.5.1 什麼是多重共線性？</h3>
  <p>如果兩個或多個解釋變數之間高度相關，我們就說有多重共線性問題。</p>
  <p>注意：這不是「有沒有」的問題，而是「嚴不嚴重」的問題。解釋變數之間完全不相關的情況非常少見——多多少少都會有一點相關，這是正常的。只有當相關程度「太高」的時候，才會造成問題。</p>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">3.5.2 多重共線性會造成什麼問題？</h3>
  <p>如果多重共線性很嚴重，會發生以下狀況：</p>
  <ul>
    <li><b>係數估計很不穩定</b>：稍微改變一下樣本，係數估計值就會跳來跳去</li>
    <li><b>標準誤很大</b>：因為很難分別辨認出個別變數的個別效果</li>
    <li><b>t 檢定不顯著</b>：即使整體 F 檢定很顯著，個別變數的 t 檢定都不顯著</li>
  </ul>

  <div class="method-card mc-title" data-mc="multicollinearity">
    <div class="mc-check"><input type="checkbox" id="mc-ch3-4" data-mc="multicollinearity"><label for="mc-ch3-4" class="mc-lbl">學會</label></div>
    <div class="mc-left">怎麼診斷多重共線性？</div>
    <div class="mc-body">
      <div class="mc-formula">VIF (Variance Inflation Factor)</div>
      <div class="mc-detail">
      對每個解釋變數 xⱼ：<br>
      1. 把 xⱼ 對其他所有解釋變數跑迴歸，得到 Rⱼ²<br>
      2. 計算 VIFⱼ = 1 / (1 - Rⱼ²)
      </div>
      <div class="mc-ex">
      判斷標準：<br>
      • VIF < 5：完全沒問題<br>
      • 5 < VIF < 10：有點嚴重，要注意<br>
      • VIF > 10：非常嚴重，需要處理
      </div>
    </div>
  </div>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">3.5.3 怎麼解決多重共線性？</h3>
  <ol>
    <li><b>什麼都不做</b>：如果你的目的是「預測」，多重共線性不會影響預測的準確度，只是係數估計不準而已。</li>
    <li><b>刪掉一個變數</b>：把共線性最嚴重的那個變數從模型中拿掉。但這樣可能會造成遺漏變數偏誤。</li>
    <li><b>增加樣本數</b>：更多資料可以幫助你更精確地估計係數。</li>
    <li><b>合併變數</b>：把高度相關的幾個變數，用主成分分析或因素分析合成一個新變數。</li>
  </ol>

  <div class="warn">考試重點：多重共線性不是「模型設定錯誤」的問題，而是「資料資訊不足」的問題——你的樣本沒有足夠的資訊，讓你同時辨認出兩個高度相關變數的個別效果。這和遺漏變數偏誤是不同層次的問題。</div>

  <p style="margin-top:16px;color:var(--muted);font-size:13px;"><b>前後章節關聯</b>：多重共線性會讓你的估計比較不精確（無效率），但不會造成偏誤。這和第 8 章的異變數、第 9 章的自我相關是一樣的——它們都只影響效率，不影響不偏性。</p>`
}

/* ===== 第四章：古典假設與 OLS 性質（完整版） ===== */
const CH4_SECTIONS = [
{
  id:"4.1", title:"古典線性迴歸模型的假設",
  body:`
  <p>古典線性迴歸模型（<span class="term" data-term="CLRM">Classical Linear Regression Model, CLRM</span>）是計量經濟學的起點。OLS 估計式之所以具有「最佳線性不偏估計式」(BLUE) 的美稱，完全建立在以下五個古典假設之上。每個假設都不是隨便假設的——如果哪個假設被違反，OLS 的某個性質就會跟著崩壞。</p>

  <div class="method-card mc-title" data-mc="clrm-assumptions">
    <div class="mc-check"><input type="checkbox" id="mc-ch4-0" data-mc="clrm-assumptions"><label for="mc-ch4-0" class="mc-lbl">學會</label></div>
    <div class="mc-left">五個古典假設總整理</div>
    <div class="mc-body">
      <div class="mc-formula">線性 → 隨機抽樣 → 不完全共線 → 條件零平均 → 同變異數</div>
      <div class="mc-detail">前五個假設是小樣本推斷的基礎；加上「常態性假設」就可以做 t 檢定、F 檢定。</div>
    </div>
  </div>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">假設 1：線性 (Linearity)</h3>
  <p><b>形式化敘述</b>：母體迴歸函數是參數 β 的線性函數：</p>
  <div class="formula"><span class="f-label">線性假設</span>y = β₀ + β₁x₁ + β₂x₂ + ... + βₖxₖ + u</div>
  <p><b>解讀</b>：「線性」指的是對<b>參數 β</b> 線性，不是對 x 線性。像 y = β₀ + β₁x + β₂x² 或 ln(y) = β₀ + β₁x 都還是線性模型，因為 β₀、β₁、β₂ 都是一次方的。</p>
  <p><b>如果違反</b>：模型形式不對（例如實際是二次式，你卻用線性式），估計出來的 β 就沒有意義。</p>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">假設 2：隨機抽樣 (Random Sampling)</h3>
  <p><b>形式化敘述</b>：我們手上的 n 筆觀察值 {(x_i, y_i) : i=1,...,n} 是從母體中<b>獨立同分配 (i.i.d.)</b> 抽出來的。</p>
  <p><b>解讀</b>：每一筆觀察值之間互相獨立，而且都來自同一個母體分配。</p>
  <p><b>如果違反</b>：</p>
  <ul>
    <li>如果是時間序列資料，觀察值之間通常有自我相關（第 9 章），就違反了 i.i.d.</li>
    <li>如果是追蹤資料，同一個人不同時間的觀察值也不是獨立的（第 12 章）</li>
  </ul>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">假設 3：不完全共線 (No Perfect Collinearity)</h3>
  <p><b>形式化敘述</b>：解釋變數之間不存在完全的線性關係，而且沒有任何一個解釋變數是常數。</p>
  <p><b>解讀</b>：X 矩陣的各行（每個解釋變數）是線性獨立的，所以 X'X 是可逆的。</p>
  <div class="warn">常見的違反例子：虛擬變數陷阱（Dummy Variable Trap）——如果你有 m 個類別，卻放了 m 個虛擬變數，再加上截距項，就會產生完全共線。</div>
  <p><b>如果違反</b>：X'X 不可逆，OLS 估計式 β̂ = (X'X)⁻¹X'y 根本算不出來。</p>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">假設 4：條件零平均 (Zero Conditional Mean)</h3>
  <p><b>形式化敘述</b>：在給定所有解釋變數的條件下，誤差項 u 的平均值為 0：</p>
  <div class="formula"><span class="f-label">條件零平均</span>E(u | X₁, X₂, ..., Xₖ) = 0</div>
  <p><b>解讀</b>：這是<b>最關鍵</b>的一個假設，也是 OLS 不偏性的核心。它的意思是：誤差項裡面的東西，和我們放進模型的解釋變數都沒有關係。</p>
  <p><b>如果違反（內生性問題）</b>：OLS 估計式就會有偏誤，而且不一致。這是計量經濟學最頭痛的問題，解決方法包括工具變數（第 11 章）、追蹤資料固定效果（第 12 章）、實驗設計（第 14 章）等。</p>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">假設 5：同變異數 (Homoscedasticity)</h3>
  <p><b>形式化敘述</b>：在給定解釋變數的條件下，誤差項 u 的變異數是一個常數，不隨 X 改變：</p>
  <div class="formula"><span class="f-label">同變異數</span>Var(u | X₁, X₂, ..., Xₖ) = σ²</div>
  <p><b>解讀</b>：所有觀察值的誤差變異程度都一樣大，不會隨著 x 變大而變大或變小。</p>
  <p><b>如果違反（異變數，第 8 章）</b>：OLS 仍然是不偏的，但不再是 BLUE——變異數不是最小的，而且標準誤估計錯誤，導致 t 檢定、F 檢定都不可靠。</p>

  <div class="warn">考試重點：五個假設各自對應 OLS 的哪個性質？<br>
  • 假設 1-4 → 不偏性<br>
  • 假設 1-5 → BLUE（最佳線性不偏）<br>
  • 加上常態性假設 → 可以做 t/F 檢定</div>

  <p style="margin-top:16px;color:var(--muted);font-size:13px;"><b>前後章節關聯</b>：這些假設是後面所有章節的基礎。第 5 章的 t 檢定、F 檢定需要加上常態性假設；第 8 章講異變數如何違反假設 5；第 9 章講自我相關如何違反「獨立性」假設；第 10-11 章講內生性問題如何違反假設 4。</p>`

{
  id:"4.2", title:"OLS 估計式的小樣本性質",
  body:`
  <p>在五個古典假設下，OLS 估計式具有三個重要的小樣本性質：<b>不偏性、線性、最小變異數</b>。合起來就是著名的<b>高斯-馬可夫定理</b>——OLS 是 BLUE。</p>

  <h3 style="margin-top:16px;font-size:16px;font-weight:600;">4.2.1 不偏性 (Unbiasedness)</h3>
  <p><b>定義</b>：OLS 估計式的期望值等於真實母數 β：</p>
  <div class="formula"><span class="f-label">不偏性</span>E(β̂ | X) = β</div>

  <p><b>推導概要</b>：</p>
  <p>從 OLS 的定義出發：</p>
  <div class="formula">β̂ = (X'X)⁻¹X'y</div>
  <p>把 y = Xβ + u 代入：</p>
  <div class="formula">β̂ = (X'X)⁻¹X'(Xβ + u) = β + (X'X)⁻¹X'u</div>
  <p>對 X 取條件期望值：</p>
  <div class="formula">E(β̂ | X) = β + (X'X)⁻¹X'E(u | X) = β + 0 = β</div>
  <p>因為假設 4（條件零平均）告訴我們 E(u | X) = 0，所以最後一項消失了。</p>

  <div class="method-card mc-title" data-mc="unbiasedness">
    <div class="mc-check"><input type="checkbox" id="mc-ch4-2" data-mc="unbiasedness"><label for="mc-ch4-2" class="mc-lbl">學會</label></div>
    <div class="mc-left">不偏性的直覺</div>
    <div class="mc-body">
      <div class="mc-formula">如果重複抽樣很多次，每次都估計一次 β̂，這些 β̂ 的平均值會剛好等於真實的 β</div>
      <div class="mc-detail">注意：不偏性是「抽樣分配」的性質，不是說你這次估計出來的 β̂ 就等於真實的 β。</div>
      <div class="mc-ex">數值範例：如果真實的 β₁ = 0.5，你抽了 1000 個樣本，估計出 1000 個 β̂₁，這 1000 個數字的平均大約就是 0.5。</div>
    </div>
  </div>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">4.2.2 條件變異數矩陣</h3>
  <p>在同變異數和無自我相關的假設下，β̂ 的條件變異數矩陣是：</p>
  <div class="formula"><span class="f-label">條件變異數矩陣</span>Var(β̂ | X) = σ²(X'X)⁻¹</div>
  <p>其中 σ² 是誤差項的變異數，X'X 是解釋變數的交叉乘積矩陣。</p>

  <p><b>單一係數的變異數</b>：對於第 j 個係數 β̂ⱼ：</p>
  <div class="formula">Var(β̂ⱼ | X) = σ² / [SSTⱼ · (1 - Rⱼ²)]</div>
  <p>其中：</p>
  <ul>
    <li>SSTⱼ = Σ(x_ij - x̄ⱼ)² 是 xⱼ 的總變異</li>
    <li>Rⱼ² 是把 xⱼ 對其他所有解釋變數迴歸的 R²</li>
  </ul>

  <div class="warn">考試重點：從這個公式可以看出三件事：<br>
  1. 樣本數越大（SSTⱼ 越大），變異數越小，估計越精確<br>
  2. 解釋變數之間的共線性越嚴重（Rⱼ² 越接近 1），變異數越大，估計越不精確<br>
  3. 誤差變異數 σ² 越大，變異數越大</div>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">4.2.3 高斯-馬可夫定理 (Gauss-Markov Theorem)</h3>
  <p><b>定理敘述</b>：在五個古典假設下，OLS 估計式是<b>最佳線性不偏估計式 (Best Linear Unbiased Estimator, BLUE)</b>。</p>
  <p>「BLUE」三個字母各代表：</p>
  <ul>
    <li><b>B (Best)</b>：在所有線性不偏估計式中，OLS 的變異數最小（最有效率）</li>
    <li><b>L (Linear)</b>：β̂ 是 y 的線性函數</li>
    <li><b>U (Unbiased)</b>：E(β̂) = β</li>
    <li><b>E (Estimator)</b>：它是一個估計式（隨機變數）</li>
  </ul>

  <div class="method-card mc-title" data-mc="blues">
    <div class="mc-check"><input type="checkbox" id="mc-ch4-1" data-mc="blues"><label for="mc-ch4-1" class="mc-lbl">學會</label></div>
    <div class="mc-left">高斯-馬可夫定理的意義</div>
    <div class="mc-body">
      <div class="mc-formula">在所有「線性」且「不偏」的估計式中，OLS 是變異數最小的那一個</div>
      <div class="mc-detail">注意：BLUE 只跟「其他線性不偏估計式」比。如果放棄線性或不偏的要求，可能可以找到變異數更小的估計式（例如壓縮估計式）。</div>
    </div>
  </div>

  <p style="margin-top:16px;color:var(--muted);font-size:13px;"><b>前後章節關聯</b>：BLUE 是 OLS 在古典假設下的最高榮譽。第 8 章講異變數時，你會看到當同變異數假設被違反，OLS 就不再是 BLUE 了——此時 WLS 才是 BLUE。</p>`
},

{
  id:"4.3", title:"OLS 的大樣本性質",
  body:`
  <p>小樣本性質需要比較強的假設（特別是同變異數和無自我相關）。如果樣本數很大，我們可以放寬這些假設，只需要比較弱的條件，OLS 就會有很好的大樣本性質：<b>一致性、漸近常態、漸近有效</b>。</p>

  <h3 style="margin-top:16px;font-size:16px;font-weight:600;">4.3.1 一致性 (Consistency)</h3>
  <p><b>定義</b>：當樣本數 n 趨近無窮大時，β̂ 會機率收斂到真實的 β：</p>
  <div class="formula"><span class="f-label">一致性</span>plim(β̂) = β, 當 n → ∞</div>

  <p><b>和不偏性的差別</b>：</p>
  <ul>
    <li><b>不偏性</b>：不管樣本數多大或多小，E(β̂) 都等於 β</li>
    <li><b>一致性</b>：樣本數越大，β̂ 越接近 β；當 n→∞，β̂ 會剛好等於 β</li>
  </ul>
  <p>簡單說：不偏性是「平均來說準」，一致性是「樣本夠大就會越來越準」。</p>

  <div class="method-card mc-title" data-mc="consistency">
    <div class="mc-check"><input type="checkbox" id="mc-ch4-3" data-mc="consistency"><label for="mc-ch4-3" class="mc-lbl">學會</label></div>
    <div class="mc-left">一致性的直覺</div>
    <div class="mc-body">
      <div class="mc-formula">樣本數越大，估計值的抽樣分配越集中在真實值附近</div>
      <div class="mc-detail">如果你的估計式是不偏的，那它一定是一致的嗎？不一定！例如樣本變異數除以 n-2 是不偏的，但除以 n 的樣本變異數是一致的但不偏（小樣本時稍微低估）。</div>
    </div>
  </div>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">4.3.2 漸近常態 (Asymptotic Normality)</h3>
  <p><b>定義</b>：當樣本數 n 夠大時，√n(β̂ - β) 會趨近一個常態分配：</p>
  <div class="formula"><span class="f-label">漸近常態</span>√n(β̂ - β) → N(0, (σ²/SSTₓ))</div>
  <p>這就是中央極限定理在 OLS 上的應用——不管誤差項 u 原來是什麼分配，只要 n 夠大，β̂ 就會近似常態分配。</p>

  <div class="warn">考試重點：為什麼大樣本下不需要常態假設？<br>
  小樣本時，你需要 u 是常態分配，才能推導出 β̂ 是常態分配，才能用 t 分配、F 分配做檢定。<br>
  大樣本時，根據中央極限定理，不管 u 是什麼分配，√n(β̂ - β) 都會趨近常態分配，所以還是可以做 t 檢定、F 檢定，只是用的是常態分配的臨界值，而不是 t 分配的臨界值（當 n 很大時，兩者幾乎一樣）。</div>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">4.3.3 漸近有效性 (Asymptotic Efficiency)</h3>
  <p>在所有一致的估計式中，OLS 的漸近變異數是最小的（在某些規律條件下）。這是大樣本版本的 BLUE。</p>

  <p style="margin-top:16px;color:var(--muted);font-size:13px;"><b>前後章節關聯</b>：大樣本性質是時間序列和追蹤資料分析的基礎——因為時間序列資料通常不滿足 i.i.d. 假設，所以小樣本理論不適用，必須靠大樣本性質（一致性、漸近常態）來做推斷。</p>`
},

{
  id:"4.4", title:"遺漏變數偏誤",
  body:`
  <p>遺漏變數偏誤是計量經濟學最常見的問題之一，也是內生性的三大來源之一。它的意思是：如果你應該放進模型的解釋變數沒有放進去，OLS 估計出來的係數就會有偏誤。</p>

  <h3 style="margin-top:16px;font-size:16px;font-weight:600;">4.4.1 簡單線性迴歸的例子</h3>
  <p>假設真實的母體模型是：</p>
  <div class="formula">y = β₀ + β₁x₁ + β₂x₂ + u</div>
  <p>但是你不知道 x₂ 的存在（或者沒有 x₂ 的資料），所以你估計的是：</p>
  <div class="formula">y = β₀ + β₁x₁ + v</div>
  <p>其中 v = β₂x₂ + u，是一個「混合」了遺漏變數和真正誤差項的東西。</p>

  <p>如果你硬要估計 β̂₁，它的期望值會是：</p>
  <div class="formula"><span class="f-label">偏誤公式</span>E(β̂₁) = β₁ + β₂·δ₁</div>
  <p>其中 δ₁ 是把遺漏變數 x₂ 對 x₁ 迴歸的斜率係數：</p>
  <div class="formula">x₂ = δ₀ + δ₁x₁ + 其他</div>

  <div class="method-card mc-title" data-mc="ovb">
    <div class="mc-check"><input type="checkbox" id="mc-ch4-2" data-mc="ovb"><label for="mc-ch4-2" class="mc-lbl">學會</label></div>
    <div class="mc-left">遺漏變數偏誤的兩個必要條件</div>
    <div class="mc-body">
      <div class="mc-formula">只有同時滿足以下兩個條件，才會有遺漏變數偏誤</div>
      <div class="mc-detail">
      1. <b>β₂ ≠ 0</b>：遺漏變數 x₂ 對 y 有解釋力（和 y 有相關）<br>
      2. <b>δ₁ ≠ 0</b>：遺漏變數 x₂ 和模型中已有的解釋變數 x₁ 有相關
      </div>
      <div class="mc-ex">如果只有一個條件成立，就不會有偏誤。例如：x₂ 和 x₁ 完全不相關（δ₁=0），即使 x₂ 對 y 有影響，也不會造成 β̂₁ 的偏誤。</div>
    </div>
  </div>

  <h3 style="margin-top:20px;font-size:16px;font-weight:600;">4.4.2 偏誤的方向</h3>
  <p>遺漏變數造成的偏誤方向是 β₂·δ₁ 的符號：</p>
  <ul>
    <li>如果 β₂ 和 δ₁ 同號 → 偏誤是正的（β̂₁ 高估了 β₁）</li>
    <li>如果 β₂ 和 δ₁ 異號 → 偏誤是負的（β̂₁ 低估了 β₁）</li>
  </ul>

  <div class="method-card mc-title" data-mc="ovb-direction">
    <div class="mc-check"><input type="checkbox" id="mc-ch4-4" data-mc="ovb-direction"><label for="mc-ch4-4" class="mc-lbl">學會</label></div>
    <div class="mc-left">數值範例：教育對薪資的效果</div>
    <div class="mc-body">
      <div class="mc-formula">真實模型：log(wage) = β₀ + β₁·教育年數 + β₂·能力 + u</div>
      <div class="mc-detail">
      • β₂ > 0：能力越強的人，薪資越高<br>
      • δ₁ > 0：能力越強的人，通常受教育年數也越長<br>
      • 所以偏誤 β₂·δ₁ > 0
      </div>

    <li><b>測量誤差</b>：解釋變數的觀測值有誤差</li>
    <li><b>聯立方程式偏誤</b>：y 同時影響 x，導致 x 和 u 相關</li>
  </ol>
  <div class="warn">考試重點：內生性問題是計量經濟學最重要的主題之一——只要有內生性，OLS 就會有偏誤且不一致，必須使用工具變數法解決。</div>`

    <li><b>解釋變數的測量誤差</b>：x 的觀測值有誤差 → 導致 OLS 估計式不一致（向零偏誤）</li>
  </ol>
  <div class="formula"><span class="f-label">測量誤差偏誤</span>真實模型：y = βx* + u；觀測到的是 x = x* + e</div>

  <div class="warn">考試重點：依變數的測量誤差不要緊，解釋變數的測量誤差很嚴重——會造成 OLS 不一致。</div>`

  body:`
  <p>如果 x 和 y 是互相影響的（如供給和需求），就會產生<b>聯立方程式偏誤 (Simultaneity Bias)</b>。</p>
  <p>因為 y 同時影響 x，所以 x 和誤差項 u 是相關的，違反了嚴格外生性假設。</p>
  <div class="method-card mc-title" data-mc="simultaneity">
    <div class="mc-check"><input type="checkbox" id="mc-ch10-1" data-mc="simultaneity"><label for="mc-ch10-1" class="mc-lbl">學會</label></div>
    <div class="mc-left">聯立方程式偏誤的直覺</div>
    <div class="mc-body">
      <div class="mc-formula">y = βx + u，而 x = γy + v</div>

    </div>
  </div>`
}
];

function getProgressState(){

  let dn={};try{dn=JSON.parse(localStorage.getItem("ma_done_v1")||"{}")}catch(e){}

function chapterProgress(n){
  const {mc,dn}=getProgressState();
  const secs=CH_SECTIONS[n]||[];
  let total=0,done=0;
  secs.forEach(sec=>{
    const keys=[...sec.body.matchAll(/data-mc="([^"]+)"/g)].map(m=>m[1]);
    total+=keys.length;done+=keys.filter(k=>mc[k]).length;

}

  const probProg=document.getElementById("probProgress");
  if(probProg){
    const {dn}=getProgressState();
    const probs=CH_PROBLEMS[n]||[];
    probProg.textContent="（已做 "+probs.filter((_,i)=>dn[n+"-"+(i+1)]).length+" / "+probs.length+"）";
  }
  const tag=document.querySelector('.nav-chapter[data-ch="'+n+'"] .tag');
  if(tag){const pct=chapterProgress(n).pct;tag.textContent=pct>=100?"✓ 100%":pct+"%";}
}


function renderSidebar(){
  const sb=document.getElementById("sidebar");
  let html=`<div class="brand">管理會計<div class="t2">研究所複習 · Hilton &amp; Platt 第 1–16 章</div></div>
  <button class="nav-gloss" id="navGloss" title="統整全書術語，可篩選與打勾複習">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>術語複習表
  </button>`;
  BOOK.forEach(ch=>{
    html+=`<button class="nav-chapter ${ch.n===currentChapter?'active':''}" data-ch="${ch.n}">
      <span class="num">${ch.n}</span><span>${esc(ch.title)}</span>
      ${ch.done?`<span class="tag done">${chapterProgress(ch.n).pct>=100?"✓ 100%":chapterProgress(ch.n).pct+"%"}</span>`:'<span class="tag">待建</span>'}
    </button>`;
    if(ch.subs&&ch.subs.length){
      ch.subs.forEach(sub=>{
        const id=(typeof sub==="string")?sub.slice(0,3):sub.id;
        const title=(typeof sub==="string")?sub:sub.title;
        html+=`<button class="nav-sub" data-ch="${ch.n}" data-sec="${id}">${esc(title)}</button>`;
      });
    }
  });
  sb.innerHTML=html;
  const navGloss=sb.querySelector("#navGloss");
  if(navGloss)navGloss.addEventListener("click",()=>{renderGlossaryFull();window.scrollTo({top:0,behavior:"smooth"});closeNav();});
  sb.querySelectorAll(".nav-chapter").forEach(b=>{
    b.addEventListener("click",()=>{
      const ch=BOOK[+b.dataset.ch-1];
      if(ch.done){renderChapter(ch.n);window.scrollTo({top:0,behavior:"smooth"});closeNav();}
      else{toast("第 "+ch.n+" 章尚未建置");}
    });
  });
  sb.querySelectorAll(".nav-sub").forEach(b=>{
    b.addEventListener("click",()=>{
      const ch=BOOK[+b.dataset.ch-1];
      if(!ch.done){toast("第 "+ch.n+" 章尚未建置");return;}
      closeNav();
      if(currentChapter!==+b.dataset.ch)renderChapter(+b.dataset.ch);
      const el=document.getElementById("sec-"+b.dataset.sec);
      if(!el)return;
      if(!el.classList.contains("open")){const h=el.querySelector(".section-head");if(h)h.click();}
      setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"start"}),60);
    });
  });
}

function renderChapter(n){
  currentChapter=n;
  renderSidebar();
  const book=BOOK[n-1];
  const sections=CH_SECTIONS[n]||[];
  const problems=CH_PROBLEMS[n]||[];
  const c=document.getElementById("chapterContent");
  const favStoreKey="ma_fav_v1";
  let favState={};try{favState=JSON.parse(localStorage.getItem(favStoreKey)||"{}")}catch(e){}
  let doneState={};try{doneState=JSON.parse(localStorage.getItem("ma_done_v1")||"{}")}catch(e){}
  const favPool={};
  let h=`<div class="chapter-head">
    <span class="kicker">第 ${n} 章</span>
    <h1>第${n}章 ${esc(book.title)}</h1>
    <div class="chpage">管理會計（Hilton &amp; Platt）第 ${n} 章</div>
    <ul class="ch-points">
      ${book.points?book.points.map(p=>`<li>${esc(p)}</li>`).join(""):""}
    </ul>
    <div class="progress-strip">${(()=>{const{mc}=getProgressState();const secMc=sections.map(x=>[...x.body.matchAll(/data-mc="([^"]+)"/g)].map(m=>m[1]));return secMc.map(a=>`<i class="${a.length?(a.every(k=>mc[k])?'done':''):'na'}"></i>`).join("")})()}</div>
    <div class="progress-label">本章小節方法卡已學 ${(()=>{const{mc}=getProgressState();const secMc=sections.map(x=>[...x.body.matchAll(/data-mc="([^"]+)"/g)].map(m=>m[1]));const t=secMc.filter(a=>a.length).length,d=secMc.filter(a=>a.length&&a.every(k=>mc[k])).length;return "本章方法卡小節已完成 "+d+" / "+t+(t?"（"+Math.round(d/t*100)+"%）":"（本章無方法卡）")})()}</div>
  </div>`;
  sections.forEach((s,i)=>{
    h+=`<section class="section" id="sec-${s.id}">
      <div class="section-head" onclick="toggleSec(this)">
        <span class="sec-num">${s.id}</span><span>${esc(s.title)}</span>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="section-body">${s.body}</div>
    </section>`;
  });
  h+=`<div class="chapter-head" style="margin-top:26px"><h1 style="font-size:22px">例題演練 <span class="prob-progress" id="probProgress"></span></h1><p>先自己作答，再點「顯示答案」核對。</p></div>`;
  problems.forEach((p,i)=>{
    const fk=n+"-"+(i+1);
    favPool[fk]={t:"第 "+n+" 章 · 例題 "+(i+1),q:p.q+((p.opts&&p.opts.length)?`<div class="opts">${p.opts.map(o=>`<div>${o}</div>`).join("")}</div>`:""),a:p.ans||p.a};
    const isFav=!!favState[fk];
    const isDone=!!doneState[fk];
    h+=`<div class="problem" id="prob-${n}-${i+1}">
      <div class="p-head"><button class="done-btn ${isDone?"on":""}" data-done="${fk}" title="標記已做過">${isDone?"☑ 做過":"☐ 做過"}</button><span>例題 ${i+1}</span><button class="fav ${isFav?"on":""}" data-fav="${fk}">${isFav?"★ 已收藏":"☆ 收藏"}</button></div>
      <div class="p-body"><p>${p.q}</p>${(p.opts&&p.opts.length)?`<div class="opts" data-pid="${fk}" data-correct="${(()=>{const m=(p.ans||p.a).match(/^<b>\(([A-Da-d])\)/);return m?m[1].toUpperCase():"";})()}">${p.opts.map(o=>{const om=o.match(/^\(([A-Da-d])\)/);return `<div class="opt" data-ans="${om?om[1].toUpperCase():""}">${o}</div>`;}).join("")}</div>`:""}
      <div class="prob-fb"></div>
      <button class="ans-btn" onclick="toggleAns(this)">顯示答案</button>
      <div class="ans"><span class="a-label">解答</span>：${p.ans||p.a}</div></div>
    </div>`;
  });
  h+=`<div class="chapter-head" style="margin-top:26px"><h1 style="font-size:22px">本章術語</h1><p>本章出現的術語：打勾＝已學會、★重點、✎筆記。全書術語總表在左側「術語複習表」。</p></div>
  <div id="chGlossRoot"></div>`;
  c.innerHTML=h;

  glossMode="chapter";glossChapter=n;
  renderGlossary();

  // 例題收藏（錯題收集，存本機，與題庫頁共用 ma_fav_v1）
  c.querySelectorAll(".fav").forEach(b=>{
    b.addEventListener("click",()=>{
      const k=b.dataset.fav;
      if(favState[k]){delete favState[k];}else{favState[k]=favPool[k];}
      try{localStorage.setItem(favStoreKey,JSON.stringify(favState));}catch(e){}
      const on=!!favState[k];
      b.classList.toggle("on",on);
      b.textContent=on?"★ 已收藏":"☆ 收藏";
    });
  });

  // 例題做過標記（存 ma_done_v1）
  refreshProgress(n);
  c.querySelectorAll(".done-btn").forEach(b=>{
    b.addEventListener("click",()=>{
      const k=b.dataset.done;
      if(doneState[k]){delete doneState[k];}else{doneState[k]=true;}
      try{localStorage.setItem("ma_done_v1",JSON.stringify(doneState));}catch(e){}
      const on=!!doneState[k];
      b.classList.toggle("on",on);
      b.textContent=on?"☑ 做過":"☐ 做過";
      refreshProgress(n);
    });
  });

  // 例題點按作答：點選項 → 判對錯 → 自動做過、錯題自動收藏
  c.querySelectorAll(".opts").forEach(box=>{
    box.addEventListener("click",e=>{
      const opt=e.target.closest(".opt");
      if(!opt || box.dataset.locked) return;
      box.dataset.locked="1";
      const pid=box.dataset.pid, correct=box.dataset.correct;
      const picked=opt.dataset.ans;
      const isRight = !correct || (picked===correct);
      opt.classList.add("sel");
      if(isRight){ opt.classList.add("right"); }
      else{
        opt.classList.add("wrong");
        if(correct) box.querySelectorAll(".opt").forEach(o=>{ if(o.dataset.ans===correct) o.classList.add("right"); });
      }
      const fb=box.parentElement.querySelector(".prob-fb");
      if(fb) fb.innerHTML = isRight ? '<span class="fb-ok">✓ 答對了</span>' : `<span class="fb-no">✗ 答錯，正確答案是 ${correct}</span>`;
      // 自動標記做過
      if(!doneState[pid]){ doneState[pid]=true; try{localStorage.setItem("ma_done_v1",JSON.stringify(doneState));}catch(err){} refreshProgress(n); }
      const prob=box.closest(".problem");
      // 答錯自動進收藏
      if(!isRight && !favState[pid]){ favState[pid]=favPool[pid]; try{localStorage.setItem(favStoreKey,JSON.stringify(favState));}catch(err){} }
      // 同步按鈕狀態
      const db=prob.querySelector(".done-btn"); if(db){ db.classList.add("on"); db.textContent="☑ 做過"; }
      const favBtn=prob.querySelector(".fav"); if(favBtn && !isRight){ favBtn.classList.add("on"); favBtn.textContent="★ 已收藏"; }
      // 直接展開解答
      const ans=prob.querySelector(".ans"); if(ans) ans.style.display="block";
    });
  });

  // 術語點擊（文內：課文名詞＋專有名詞都可開知識卡）
  c.querySelectorAll(".term,.proper").forEach(t=>{
    if(!t.dataset.term)return;
    t.addEventListener("click",e=>{e.stopPropagation();openTerm(t.dataset.term);});
  });
  // 方法學習卡打勾（學會標記，存本機；學會＝刪除線＋黯淡）
  const mcKey="ma_mc_learned_v1";
  let mcState={};try{mcState=JSON.parse(localStorage.getItem(mcKey)||"{}")}catch(e){}
  c.querySelectorAll(".method-card input[type=checkbox]").forEach(cb=>{
    const k=cb.dataset.mc;
    const card=cb.closest(".method-card");
    const apply=()=>card.classList.toggle("learned",cb.checked);
    cb.checked=!!mcState[k];
    apply();
    cb.addEventListener("change",()=>{mcState[k]=cb.checked;localStorage.setItem(mcKey,JSON.stringify(mcState));apply();refreshProgress(n);});
  });
  // 套用已存高亮
  applyHighlights();
}

function toggleSec(head){
  const sec=head.parentElement;
  sec.classList.toggle("open");
}
function toggleAns(btn){
  const ans=btn.nextElementSibling;
  ans.classList.toggle("show");
  btn.textContent=ans.classList.contains("show")?"隱藏答案":"顯示答案";
}

  defEl.innerHTML=decorateDef(t[2]);

}

  10:["生產函數與要素","短期生產結構","長期生產結構","成本與利潤","短期與長期成本","規模經濟與範疇經濟","要素價格與利潤極大化"],
  11:["市場結構與完全競爭","短期與長期均衡","產業供給與政府課稅"],
  12:["獨占市場與進入障礙","獨占均衡與訂價","差別取價","政府管制"],
  13:["寡占模型","賽局理論"],
  14:["獨占性競爭市場"],
  15:["要素市場理論"],
  16:["一般均衡與福利經濟學"],
  17:["市場失靈與外部性"],
  18:["資訊經濟學"],
  19:["國際貿易理論"],
  20:["貿易政策"]
};
let glossMode="full", glossChapter=1;

let glossCat="all", glossOnlyUnlearned=false;

function renderGlossaryFull(){
  glossMode="full";
  currentChapter=0;
  renderSidebar();
  const c=document.getElementById("chapterContent");
  c.innerHTML=`<div class="chapter-head">
    <span class="kicker">全書複習</span>
    <h1>術語複習表</h1>
    <p>統整全書 ${Object.keys(TERMS).length} 個術語：打勾＝已學會、★重點、✎筆記。用分類按鈕與「只看未學會」篩選，進度自動統計，全部存在本機瀏覽器。</p>
  </div>
  <div id="glossFullRoot"></div>`;
  glossCat="all";
  renderGlossary();
}
function glossCatsForMode(){
  if(glossMode==="full")return GLOSS_CATS;
  const names=CH_TERMS_CATS[glossChapter]||[];
  return GLOSS_CATS.filter(c=>names.includes(c.name));
}
function renderGlossary(){
  const root=document.getElementById(glossMode==="full"?"glossFullRoot":"chGlossRoot");
  if(!root)return;
  const learned=GLS.get("micro-gloss-learned",[]);
  const starred=GLS.get("micro-gloss-star",[]);
  const notes=GLS.get("micro-gloss-notes",{});
  const cats=glossCatsForMode();
  const allKeys=cats.flatMap(c=>c.keys).filter(k=>TERMS[k]);
  const total=allKeys.length;
  const done=allKeys.filter(k=>learned.includes(k)).length;

  let h=`<div class="gloss-toolbar">
    <div class="gloss-cats">`;
  if(glossMode==="full"){
    h+=`<button class="gloss-cat-btn ${glossCat==="all"?"active":""}" data-cat="all">全部（${total}）</button>
      ${cats.map(c=>`<button class="gloss-cat-btn ${glossCat===c.name?"active":""}" data-cat="${esc(c.name)}">${esc(c.name)}（${c.keys.filter(k=>TERMS[k]).length}）</button>`).join("")}`;
  }else{
    h+=`<span class="gloss-cat-label">本章術語 · ${cats.map(c=>esc(c.name)).join(" ／ ")}</span>`;
  }
  h+=`</div>
    <div class="gloss-data-actions">
      <button class="toolbtn ${glossOnlyUnlearned?"active":""}" id="onlyUnlearned" title="只看未學會">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </button>
      <button class="toolbtn" id="exportGloss" title="匯出備份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="toolbtn" id="importGloss" title="匯入備份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0 4 4m-4-4-4 4M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>
  </div>
  <div class="gloss-progress">
    <div class="bar"><div class="fill" style="width:${total?done/total*100:0}%"></div></div>
    <div class="label">已學會 ${done} / ${total}</div>
  </div>`;

  cats.forEach(cat=>{
    if(glossMode==="full"&&glossCat!=="all"&&glossCat!==cat.name)return;
    const items=cat.keys.filter(k=>TERMS[k]);
    if(!items.length)return;
    const catDone=items.filter(k=>learned.includes(k)).length;
    h+=`<div class="gloss-group" data-gname="${esc(cat.name)}">
      <h3>${esc(cat.name)}（${catDone}/${items.length}）</h3>
      ${items.map(k=>{
        const [en,zh,def]=TERMS[k];
        const isLearned=learned.includes(k), isStarred=starred.includes(k);
        const note=notes[k]||"";
        if(glossOnlyUnlearned&&isLearned)return "";
        const isProper=PROPER_TERMS.has(k);
        return `<div class="gloss-item ${isLearned?"done":""} ${isStarred?"starred":""}" data-key="${esc(k)}">
          <button class="gloss-check ${isLearned?"done":""}" onclick="toggleLearn(&quot;${escA(k)}&quot;)" title="標記已學會">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 13 4 4L19 7"/></svg>
          </button>
          <div class="gloss-main">
            <div class="gloss-en${isProper?" proper":""}">${esc(en)}<span class="gloss-zh${isProper?" proper":""}">${esc(zh)}</span></div>
            <div class="gloss-def">${esc(def)}</div>
            <div class="gloss-note ${note?"show":""}" data-note="wrap-${esc(k)}">
              <textarea placeholder="寫下你自己的重點…" onchange="saveNote('${esc(k)}',this.value)">${esc(note)}</textarea>
            </div>
          </div>
          <div class="gloss-actions">
            <button class="gloss-btn ${isStarred?"active":""}" onclick="toggleStar(&quot;${escA(k)}&quot;)" title="重點畫記">★ 重點</button>
            <button class="gloss-btn ${note?"active":""}" onclick="toggleNote(&quot;${escA(k)}&quot;)" title="個人筆記">✎ 筆記</button>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  });

  root.innerHTML=h;
  if(glossMode==="full"){
    root.querySelectorAll(".gloss-cat-btn").forEach(b=>{
      b.addEventListener("click",()=>{glossCat=b.dataset.cat;renderGlossary();});
    });
  }
  document.getElementById("onlyUnlearned").addEventListener("click",e=>{
    glossOnlyUnlearned=!glossOnlyUnlearned;
    e.currentTarget.classList.toggle("active",glossOnlyUnlearned);
    renderGlossary();
  });
  document.getElementById("exportGloss").addEventListener("click",exportGloss);
  document.getElementById("importGloss").addEventListener("click",()=>{
    const inp=document.createElement("input");
    inp.type="file";inp.accept=".json";
    inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importGloss(r.result);r.readAsText(f);};
    inp.click();
  });
}
function toggleLearn(k){
  let l=GLS.get("micro-gloss-learned",[]);
  l=l.includes(k)?l.filter(x=>x!==k):[...l,k];
  GLS.set("micro-gloss-learned",l);
  renderGlossary();
}
function toggleStar(k){
  let s=GLS.get("micro-gloss-star",[]);
  s=s.includes(k)?s.filter(x=>x!==k):[...s,k];
  GLS.set("micro-gloss-star",s);
  renderGlossary();
}
function toggleNote(k){
  const wrap=document.querySelector(`[data-note="wrap-${k}"]`);
  if(wrap)wrap.classList.toggle("show");
}
function saveNote(k,v){
  const notes=GLS.get("micro-gloss-notes",{});
  notes[k]=v;
  GLS.set("micro-gloss-notes",notes);
  renderGlossary();
}
function exportGloss(){
  const data={learned:GLS.get("micro-gloss-learned",[]),star:GLS.get("micro-gloss-star",[]),notes:GLS.get("micro-gloss-notes",{})};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="總經術語備份.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已匯出備份");
}
function importGloss(jsonStr){
  try{
    const d=JSON.parse(jsonStr);
    if(d.learned&&Array.isArray(d.learned)){
      const cur=GLS.get("micro-gloss-learned",[]);
      GLS.set("micro-gloss-learned",[...new Set([...cur,...d.learned])]);
    }
    if(d.star&&Array.isArray(d.star)){
      const cur=GLS.get("micro-gloss-star",[]);
      GLS.set("micro-gloss-star",[...new Set([...cur,...d.star])]);
    }
    if(d.notes&&typeof d.notes==="object"){
      const cur=GLS.get("micro-gloss-notes",{});
      GLS.set("micro-gloss-notes",{...cur,...d.notes});
    }
    toast("已匯入並合併備份");
    renderGlossary();
  }catch(e){toast("備份檔案格式錯誤");}
}

/* ===== 全書搜尋 ===== */
const searchInput=document.getElementById("searchInput");
const searchPanel=document.getElementById("searchPanel");
function stripHtml(t){return String(t||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();}
function buildSearchIndex(){
  const idx=[];
  BOOK.forEach(ch=>{
    if(!ch.done)return;
    const n=ch.n;
    idx.push({type:"ch",n,title:ch.title,text:ch.title});
    (CH_SECTIONS[n]||[]).forEach(sec=>{
      idx.push({type:"sec",n,id:sec.id,title:sec.title,text:sec.title+" "+stripHtml(sec.body)});
    });
    (CH_PROBLEMS[n]||[]).forEach((p,i)=>{
      idx.push({type:"prob",n,no:i+1,text:stripHtml(p.q)+" "+stripHtml(p.ans||"")});
    });
  });
  Object.keys(TERMS).forEach(k=>{
    const [en,zh,def]=TERMS[k];
    idx.push({type:"term",key:k,en,zh,def,text:en+" "+zh+" "+def});
  });
  return idx;
}
const SEARCH_IDX=buildSearchIndex();
searchInput.addEventListener("input",()=>{
  const kw=searchInput.value.trim().toLowerCase();
  if(!kw){searchPanel.style.display="none";return;}
  const hits=SEARCH_IDX.filter(x=>x.text.toLowerCase().includes(kw)).slice(0,40);
  if(!hits.length){
    searchPanel.innerHTML=`<div class="sp-empty">找不到「${esc(kw)}」相關內容，試試其他關鍵字。</div>`;
    searchPanel.style.display="block";return;
  }
  searchPanel.innerHTML=hits.map(h=>{
    if(h.type==="ch")return `<button class="sp-item" data-act="ch" data-n="${h.n}"><span class="sp-tag">第${h.n}章</span><b>${esc(h.title)}</b><span class="sp-snip">整章內容</span></button>`;
    if(h.type==="sec")return `<button class="sp-item" data-act="sec" data-n="${h.n}" data-id="${esc(h.id)}"><span class="sp-tag">第${h.n}章·小節</span><b>${esc(h.title)}</b><span class="sp-snip">${esc(h.text.slice(0,70))}</span></button>`;
    if(h.type==="prob")return `<button class="sp-item" data-act="prob" data-n="${h.n}" data-no="${h.no}"><span class="sp-tag">第${h.n}章·例題${h.no}</span><span class="sp-snip">${esc(h.text.slice(0,80))}</span></button>`;
    return `<button class="sp-item" data-act="term" data-key="${esc(h.key)}"><span class="sp-tag">術語</span><b>${esc(h.en)} ${esc(h.zh)}</b><span class="sp-snip">${esc(h.def.slice(0,60))}</span></button>`;
  }).join("")+`<div class="sp-count">找到 ${hits.length} 筆相關內容</div>`;
  searchPanel.style.display="block";
});
searchPanel.addEventListener("click",e=>{
  const item=e.target.closest(".sp-item");
  if(!item)return;
  const act=item.dataset.act;
  searchPanel.style.display="none";
  searchInput.value="";
  if(act==="ch"){
    renderChapter(+item.dataset.n);
    window.scrollTo({top:0,behavior:"smooth"});
  }else if(act==="sec"){
    renderChapter(+item.dataset.n);
    setTimeout(()=>{
      const el=document.getElementById("sec-"+item.dataset.id);
      if(el){el.classList.add("open");el.scrollIntoView({behavior:"smooth",block:"start"});}
    },60);
  }else if(act==="prob"){
    renderChapter(+item.dataset.n);
    setTimeout(()=>{
      const el=document.getElementById("prob-"+item.dataset.n+"-"+item.dataset.no);
      if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
    },60);
  }else if(act==="term"){
    openTerm(item.dataset.key);
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){searchPanel.style.display="none";searchInput.blur();}
});


/* ===== 重點標記 ===== */
let hlEnabled=true;
function getHls(){try{return JSON.parse(localStorage.getItem("micro-hl")||"[]")}catch(e){return[]}}
function saveHls(h){localStorage.setItem("micro-hl",JSON.stringify(h))}

document.addEventListener("mouseup",e=>{
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed)return;
  const txt=sel.toString().trim();
  if(txt.length<2||txt.length>300)return;
  // 檢查是否點在工具列/按鈕上
  if(e.target.closest(".toolbtn,.ans-btn,.flip-card,.term,.section-head"))return;
  const range=sel.getRangeAt(0);
  const el=range.startContainer.parentElement;
  if(!el.closest(".section-body,.problem"))return;
  const hls=getHls();
  if(hls.some(h=>h.txt===txt))return;
  hls.push({txt,time:Date.now()});
  saveHls(hls);
  applyHighlights();
  toast("已加入重點標記（點黃色文字可移除）");
});

function applyHighlights(){
  const hls=getHls();
  document.querySelectorAll(".section-body .userhl,.problem .userhl").forEach(el=>el.outerHTML=el.textContent);
  if(!hlEnabled)return;
  hls.forEach(h=>{
    document.querySelectorAll(".section-body p,.section-body .note,.section-body .warn,.problem .p-body").forEach(block=>{
      const text=block.textContent;
      if(!text.includes(h.txt))return;
      if(block.querySelector(".userhl"))return;
      const idx=text.indexOf(h.txt);
      const frag=document.createDocumentFragment();
      frag.appendChild(document.createTextNode(text.slice(0,idx)));
      const m=document.createElement("mark");
      m.className="userhl";m.textContent=h.txt;
      m.addEventListener("click",()=>{
        const arr=getHls().filter(x=>x.txt!==h.txt);
        saveHls(arr);applyHighlights();toast("已移除重點標記");
      });
      frag.appendChild(m);
      frag.appendChild(document.createTextNode(text.slice(idx+h.txt.length)));
      block.replaceChildren(frag);
    });
  });
}

document.getElementById("hlToggle").addEventListener("click",e=>{
  hlEnabled=!hlEnabled;
  e.currentTarget.classList.toggle("active",hlEnabled);
  applyHighlights();
  toast(hlEnabled?"重點標記已顯示":"重點標記已隱藏");
});

/* ===== 畫記模式 / 深色 ===== */
let markMode=false;
const markBtn=document.getElementById("markToggle");
markBtn.addEventListener("click",e=>{
  markMode=!markMode;
  document.body.classList.toggle("marking",markMode);
  markBtn.classList.toggle("active",markMode);
  toast(markMode?"畫記模式開啟：點文字即可高亮（再點一次關閉並儲存）":"畫記模式已關閉，重點已儲存");
});
document.addEventListener("click",e=>{
  if(!markMode)return;
  if(e.target.closest(".toolbtn,.ans-btn,.term,.section-head"))return;
  if(e.target.closest(".userhl"))return;
  const el=e.target.closest(".section-body p,.section-body li,.section-body .note,.section-body .warn,.problem .p-body");
  if(!el)return;
  e.preventDefault();e.stopPropagation();
  const txt=el.textContent.trim();
  if(txt.length<2||txt.length>500){toast("這段太長，請改用拖選文字畫重點");return;}
  const hls=getHls();
  if(hls.some(h=>h.txt===txt))return;
  hls.push({txt,time:Date.now()});
  saveHls(hls);
  applyHighlights();
  toast("已加入重點標記（點黃色文字可移除）");
});
document.getElementById("darkToggle").addEventListener("click",e=>{
  document.body.classList.toggle("dark");
  e.currentTarget.classList.toggle("active",document.body.classList.contains("dark"));
});

/* ===== toast ===== */
function toast(msg){
  let t=document.getElementById("toast");
  if(!t){
    t=document.createElement("div");
    t.id="toast";
    t.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#26303b;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.2);opacity:0;transition:opacity .25s;pointer-events:none";
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity="1";
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.style.opacity="0",1800);
}

/* ===== 初始化 ===== */
renderSidebar();
renderChapter(1);
