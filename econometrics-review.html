<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>計量經濟分析（Greene 第6版）｜互動複習</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Georgia,serif' fill='white' text-anchor='middle'%3E%E2%88%91%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fs:16px;
  --paper:#f6f0e2;
  --ink:#2b251d;
  --panel:#fffdf6;
  --line:#e4d9bf;
  --muted:#6f6555;
  --nav-bg:#f1e9d5;
  --nav-ink:#4a4234;
  --nav-hover:#e7dcc0;
  --nav-active:#3c6e8f;
  --accent:#b5542e;
  --accent-soft:#fbeae2;
  --teal:#2c6e9e;
  --teal-soft:#eef3f4;
  --green:#1e7d32;
  --hl:#ffe94a;
  --radius:12px;
  --blue:#2c6e9e;--green2:#3a7d44;--orange:#c06a24;--purple:#6b4e8e;--brown:#8a5a3b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Noto Serif TC","PMingLiU","PingFang TC",serif;
  font-size:var(--fs);
  background:var(--paper);
  color:var(--ink);
  line-height:1.8;
  display:flex;
  min-height:100vh;
}
body.dark{
  --paper:#16130d;--ink:#e6e0d2;--panel:#201c14;--line:#3a3325;
  --muted:#a0937a;--nav-bg:#1f1a10;--nav-ink:#cfc4ad;--nav-hover:#332b1b;
  --nav-active:#4a8ab5;--accent:#e08a55;--accent-soft:#2f2014;
  --teal:#5f9fc0;--teal-soft:#14242e;--green:#5cb56e;--hl:#5a4a1e;
  --blue:#5f9fc0;--green2:#5cb56e;--orange:#d98a4a;--purple:#9b7fc0;--brown:#b08a5a;
}
/* ===== 側邊目錄（兩層） ===== */
.sidebar{
  width:280px;flex-shrink:0;background:var(--nav-bg);color:var(--nav-ink);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:26px 18px 40px;
  border-right:1px solid var(--line);
}
.sidebar .brand{font-weight:700;font-size:15px;letter-spacing:.02em;line-height:1.4;margin-bottom:4px;color:var(--ink)}
.sidebar .brand .t2{font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
.nav-chapter{
  display:flex;align-items:center;gap:8px;width:100%;padding:4px 10px;border-radius:6px;
  cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink);
  border:none;background:none;text-align:left;margin-top:8px;font-family:inherit;line-height:1.45;
}
.nav-chapter:hover{background:var(--nav-hover)}
.nav-chapter.active{background:var(--nav-active);color:#fff}
.nav-chapter .num{font-size:11px;font-weight:600;opacity:.65;width:26px;flex-shrink:0}
.nav-chapter.active .num{opacity:.9}
.nav-chapter .tag{margin-left:auto;font-size:10px;opacity:.55;letter-spacing:.05em;font-weight:400}
.nav-chapter .tag.done{color:var(--green2);opacity:1}
.nav-sub{
  display:block;width:100%;padding:3px 10px 3px 34px;border-radius:6px;
  cursor:pointer;font-size:12.5px;color:var(--muted);border:none;background:none;text-align:left;font-family:inherit;line-height:1.45;
}
.nav-sub:hover{background:var(--nav-hover);color:var(--ink)}
.nav-sub.active{color:var(--nav-active);font-weight:700}
.nav-gloss{
  display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border-radius:6px;margin-top:10px;
  cursor:pointer;font-size:13.5px;font-weight:700;color:#8a6d1a;border:1.5px dashed #d9b84a;background:#fffaf0;
  text-align:left;font-family:inherit;line-height:1.45;transition:all .15s;
}
.nav-gloss:hover{border-color:#c9a227;color:#c9a227;background:#fff6dd}
.nav-gloss svg{width:15px;height:15px;flex-shrink:0}
.nav-gloss.active{background:#c9a227;color:#fff;border-style:solid}
.search-panel{
  position:fixed;top:66px;left:50%;transform:translateX(-50%);width:min(680px,92vw);max-height:62vh;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.16);z-index:60;
}
.search-panel .sp-item{display:block;width:100%;text-align:left;padding:10px 16px;border:none;border-bottom:1px solid var(--line);background:none;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);line-height:1.5}
.search-panel .sp-item:hover{background:var(--nav-hover)}
.search-panel .sp-tag{display:inline-block;font-size:11px;color:var(--teal);font-weight:700;margin-right:8px;letter-spacing:.03em;white-space:nowrap}
.search-panel .sp-item b{display:block;font-size:13.5px;margin:2px 0}
.search-panel .sp-snip{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-panel .sp-count{padding:8px 16px;font-size:12px;color:var(--muted);text-align:center}
.search-panel .sp-empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:13.5px}
body.dark .search-panel{background:#26221a;border-color:#4a4234}
/* ===== 主內容 ===== */
.main{flex:1;min-width:0;padding:28px 34px 80px}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);padding:10px 0 14px;margin-bottom:18px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.searchbox{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.searchbox svg{width:16px;height:16px;opacity:.45;flex-shrink:0}
.searchbox input{border:none;outline:none;background:none;font-size:14px;width:100%;color:var(--ink);font-family:inherit}
.toolbtn{
  display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit;transition:all .15s;
}
.toolbtn:hover{border-color:var(--teal);color:var(--teal)}
.toolbtn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.toolbtn svg{width:15px;height:15px}
/* 章頭 */
.chapter-head{border-left:8px solid var(--teal);padding:6px 0 10px 18px;margin:30px 0 18px}
.chapter-head .kicker{display:inline-block;font-size:12px;letter-spacing:.15em;color:var(--teal);font-family:"Noto Sans TC",sans-serif;font-weight:600}
.chapter-head h1{font-family:"Noto Serif TC",serif;font-size:27px;line-height:1.25;margin:2px 0 4px}
.chapter-head p{color:var(--muted);font-size:14.5px;max-width:760px;margin-top:6px}
/* 小節 */
.section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
.section-head{
  display:flex;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;user-select:none;
  font-family:"Noto Serif TC",serif;font-size:19px;font-weight:600;border-bottom:2px solid transparent;transition:border-color .15s;
}
.section.open .section-head{border-bottom-color:var(--teal)}
.section-head .sec-num{color:var(--teal);font-size:12.5px;font-weight:700;font-family:"Noto Sans TC",sans-serif;letter-spacing:.08em;flex-shrink:0}
.section-head .chev{width:18px;height:18px;margin-left:auto;transition:transform .2s;flex-shrink:0}
.section.open .section-head .chev{transform:rotate(180deg)}
.section-body{display:none;padding:4px 20px 18px}
.section.open .section-body{display:block}
.section-body p{margin:10px 0;font-size:14.8px}
.section-body ul{margin:8px 0;padding-left:24px}
.section-body li{margin:3px 0}
/* callout 盒子（參考章節筆記風格） */
.section-body .note{background:#fdf0c2;border-left:4px solid #d9a514;padding:12px 16px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.section-body .note::before{content:"重點與結論";display:block;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:#8a6d1a;margin-bottom:4px}
.section-body .warn{background:var(--accent-soft);border-left:4px solid var(--accent);padding:12px 16px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.section-body .warn::before{content:"考試重點";display:block;font-family:"Noto Sans TC",sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--accent);margin-bottom:4px}
.section-body .src{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
.section-body .src summary{cursor:pointer;font-size:12.5px;color:var(--teal)}
.section-body .src pre{white-space:pre-wrap;font-family:"Noto Serif TC",serif;font-size:13px;color:var(--muted);margin-top:8px;max-height:280px;overflow-y:auto}
/* 公式卡 */
.formula{background:#fbf4e6;border:1px dashed #c9b88f;border-radius:8px;padding:14px 18px;margin:12px 0;font-size:15.5px;text-align:center;font-family:"Noto Serif TC",serif}
.formula .f-label{display:block;font-size:11.5px;color:#9a6a1f;letter-spacing:.08em;margin-bottom:4px;font-family:"Noto Sans TC",sans-serif;font-weight:700}
.formula .f-note{display:block;font-size:12px;color:var(--muted);margin-top:4px;font-family:"Noto Sans TC",sans-serif}
/* 術語 */
.term{color:var(--green);font-weight:700;cursor:pointer;border-bottom:1.5px dashed color-mix(in srgb,var(--green) 55%,transparent);border-radius:3px;padding:0 2px;transition:all .15s}
.term:hover{background:var(--green);color:#fff;border-bottom:none}
/* 專有名詞（人名／事件）深紫粗體 */
.proper{color:#7b2cbf;font-weight:700;cursor:pointer;border-bottom:1.5px dashed color-mix(in srgb,#7b2cbf 50%,transparent);border-radius:3px;padding:0 2px;transition:background .15s}
.proper:hover{background:#7b2cbf;color:#fff;border-bottom:none}
body.dark .proper{color:#b39ddb}
body.dark .proper:hover{background:#b39ddb;color:#1a1420}
/* 術語列表與知識卡：人物/書名類紫色粗體 */
#termModalEn{color:var(--green)}
#termModalEn.proper,#termModalZh.proper{color:#7b2cbf}
body.dark #termModalEn.proper,body.dark #termModalZh.proper{color:#b39ddb}
#termModalDef .proper{color:#7b2cbf;font-weight:700;border-bottom:1.5px dashed color-mix(in srgb,#7b2cbf 50%,transparent)}
body.dark #termModalDef .proper{color:#b39ddb}
.gloss-en.proper,.gloss-zh.proper{color:#7b2cbf}
body.dark .gloss-en.proper,body.dark .gloss-zh.proper{color:#b39ddb}
/* 例題 */
.problem{background:#eae6da;border:1px solid var(--line);border-radius:10px;padding:16px 20px;margin:14px 0}
.problem .p-head{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14.5px;color:var(--teal);margin-bottom:8px}
.problem .p-body{font-size:14.5px}
.problem .opts{margin:10px 0 4px;display:grid;gap:6px}
.problem .opts div{padding:7px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.8px;background:var(--panel)}
.opts .opt{cursor:pointer;transition:all .15s}
.opts .opt:hover{border-color:var(--teal);background:var(--teal-soft)}
.opts .opt.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.opts .opt.right{border-color:#1e7d32;background:#e7f3e4;color:#1e7d32;font-weight:700}
.opts .opt.wrong{border-color:#c0392b;background:#fbeaea;color:#c0392b;font-weight:700}
.opts[data-locked="1"] .opt{pointer-events:none;cursor:default}
.prob-fb{margin-top:10px;font-size:14px;font-weight:700}
.fb-ok{color:#1e7d32}
.fb-no{color:#c0392b}
body.dark .problem{background:#26221a}
.ans-btn{
  margin-top:12px;display:inline-flex;align-items:center;gap:8px;background:none;border:1.5px solid var(--teal);
  color:var(--teal);border-radius:8px;padding:7px 16px;font-size:13.5px;cursor:pointer;font-family:inherit;transition:all .15s;
}
.ans-btn:hover{background:var(--teal);color:#fff}
.fav{
  margin-left:auto;background:none;border:1.5px solid var(--line);color:var(--muted);border-radius:8px;
  padding:3px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;
}
.fav:hover{border-color:#c9a227;color:#c9a227}
.fav.on{border-color:#c9a227;background:#fffaf0;color:#c9a227;font-weight:700}
body.dark .fav.on{background:#3a3320}
.ans{display:none;margin-top:12px;background:var(--teal-soft);border-radius:8px;padding:12px 16px;font-size:14px}
.ans.show{display:block}
.ans .a-label{font-weight:700;color:var(--teal);font-size:13px}
.ans ul{margin:6px 0 2px;padding-left:22px}
.ans li{margin:3px 0}
.ans b{font-weight:700}
/* 術語卡區 */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin:16px 0}
.flip-card{perspective:900px;height:150px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip-card.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--line);padding:12px;text-align:center}
.flip-front{background:var(--panel)}
.flip-front .en{font-size:16px;font-weight:700;color:var(--teal);word-break:break-word}
.flip-front .zh{font-size:13px;color:var(--muted)}
.flip-back{background:var(--teal);color:#fff;transform:rotateY(180deg)}
.flip-back .def{font-size:13px;line-height:1.6}
.flip-hint{font-size:11px;opacity:.5;margin-top:4px}
/* ===== 術語表（列表形式） ===== */
.gloss-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.gloss-cats{display:flex;gap:6px;flex-wrap:wrap}
.gloss-cat-btn{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:4px 13px;font-size:12.5px;cursor:pointer;color:var(--muted);transition:all .15s}
.gloss-cat-btn.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.gloss-progress{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.gloss-progress .bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.gloss-progress .fill{height:100%;background:var(--teal);width:0%;transition:width .3s}
.gloss-progress .label{font-size:13px;color:var(--muted);white-space:nowrap}
.gloss-group{margin-bottom:16px}
.gloss-group h3{font-size:14px;color:var(--teal);margin:14px 0 8px;padding-left:10px;border-left:3px solid var(--teal);letter-spacing:.04em}
.gloss-item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:8px 0;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s}
.gloss-item.starred{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.gloss-check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;cursor:pointer;display:grid;place-items:center;margin-top:2px;transition:all .15s;background:none;padding:0}
.gloss-check svg{width:14px;height:14px;display:none;color:#fff}
.gloss-check.done{background:var(--teal);border-color:var(--teal)}
.gloss-check.done svg{display:block}
.gloss-item.done .gloss-en{text-decoration:line-through;opacity:.55}
.gloss-main{flex:1;min-width:0}
.gloss-en{font-weight:700;color:var(--green);font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gloss-zh{font-size:15px;color:var(--green);font-weight:700;margin-left:2px}
.gloss-def{font-size:13.5px;margin-top:4px;line-height:1.8}
.gloss-actions{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.gloss-btn{border:1px solid var(--line);background:none;border-radius:7px;padding:3px 10px;font-size:11.5px;cursor:pointer;color:var(--muted);transition:all .15s}
.gloss-btn:hover{color:var(--teal);border-color:var(--teal)}
.gloss-btn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.gloss-note{display:none;margin-top:8px}
.gloss-note.show{display:block}
.gloss-note textarea{width:100%;min-height:56px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--paper);color:var(--ink);font-family:inherit;resize:vertical}
.gloss-note textarea:focus{outline:none;border-color:var(--teal)}
.gloss-data-actions{display:flex;gap:8px;margin-left:auto}
/* 搜尋高亮 */
mark{background:var(--hl);color:inherit;border-radius:2px;padding:0 1px}
mark.hl{background:var(--hl)}
/* 重點高亮（使用者標記） */
.userhl{background:var(--hl);border-radius:3px;cursor:pointer;box-shadow:0 0 0 2px var(--hl)}
/* 畫記模式 */
body.marking{cursor:crosshair}
body.marking .section-body p,body.marking .section-body li,body.marking .section-body .note,body.marking .section-body .warn,body.marking .problem .p-body{cursor:crosshair;border-radius:3px;transition:box-shadow .12s}
body.marking .section-body p:hover,body.marking .section-body li:hover,body.marking .section-body .note:hover,body.marking .section-body .warn:hover,body.marking .problem .p-body:hover{box-shadow:0 0 0 2px rgba(255,233,74,.45);background:rgba(255,233,74,.12)}
/* 進度條 */
.progress-strip{display:flex;gap:6px;margin:14px 0 6px}
.progress-strip i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress-strip i.done{background:var(--teal)}
.progress-strip i.na{background:none;border:1px dashed var(--line);height:3px}
.progress-label{font-size:12px;color:var(--muted);margin-top:4px}
.p-head .done-btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted);font-family:inherit;flex-shrink:0;transition:all .15s}
.p-head .done-btn:hover{border-color:var(--green);color:var(--green)}
.p-head .done-btn.on{background:#e3f0e3;border-color:var(--green);color:var(--green);font-weight:700}
body.dark .p-head .done-btn.on{background:#1d2b1d}
.prob-progress{font-size:13px;font-weight:600;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--teal-soft);color:var(--teal);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:500}
/* 提示條 */
.banner{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:12px;padding:14px 18px;font-size:13.5px;color:var(--ink);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.banner svg{width:18px;height:18px;flex-shrink:0;color:var(--accent);margin-top:2px}
/* 空狀態 */
.empty{display:none;text-align:center;padding:60px 20px;color:var(--muted)}
.empty.show{display:block}
.empty .big{font-size:40px;margin-bottom:10px}
.chpage{font-size:12.5px;color:var(--muted);font-family:"Noto Sans TC",sans-serif}
.chapter-head .ch-points{margin:10px 0 0;padding-left:22px;font-size:14.5px;color:var(--ink)}
.chapter-head .ch-points li{margin:3px 0}
/* 方法學習卡（左打勾＋方法名＋公式說明，底下例子） */
.method-card{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;margin:12px 0;background:var(--panel);overflow:hidden;transition:opacity .2s}
.method-card .mc-check{width:64px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:var(--panel)}
.method-card .mc-check input{width:19px;height:19px;accent-color:var(--green);cursor:pointer}
.method-card .mc-check .mc-lbl{font-size:11px;color:var(--muted)}
.method-card .mc-check:has(input:checked){background:#eef7ec}
.method-card .mc-check:has(input:checked) .mc-lbl{color:var(--green);font-weight:700}

const BOOK = [
  {n:1, title:"計量經濟學與經濟模型", subs:["1.1 計量經濟學的本質與方法論","1.2 經濟理論與計量模型","1.3 資料的類型與結構","1.4 因果關係與相關性","1.5 計量分析的步驟"], done:true, points:["計量經濟學＝結合經濟理論、數理統計與經濟資料，以估計、檢定經濟關係並做預測","方法論：先驗理論→模型設定→資料蒐集→估計→檢定→解釋與預測","計量模型是數學模型的隨機化版本：加入誤差項 ε","資料類型：橫斷面(cross-section)、時間序列(time series)、追蹤/縱橫面(panel)","因果關係 vs 相關性：計量經濟旨在推斷因果，而非僅描述相關","迴歸分析：探討依變數 y 與解釋變數 x 之間的統計關係","計量經濟學的三大任務：結構分析、預測、政策評估"]},

/* ===== 第一章：計量經濟學與經濟模型 ===== */
const CH1_SECTIONS = [
{

  body:`
  <p><span class="term" data-term="Econometrics">計量經濟學（econometrics）</span>是結合經濟理論、數理統計與實際經濟資料，對經濟關係進行估計、檢定與預測的社會科學分支。它不是單純的統計學，而是將經濟理論轉化為可驗證的實證命題。</p>

  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))}

const CH_TERMS_CATS = {
  1:["基本概念","經濟學分類","模型建構","邏輯謬誤","循環流轉"],
  2:["需求基礎","財貨分類","網路外部性","彈性","所得與恩格爾"],
  3:["供給基礎","供給彈性"],
  4:["市場均衡","福利與政府介入"],
  5:["效用理論","消費者均衡"],
  6:["偏好與公理","效用函數與無異曲線","預算限制","消費者均衡","對偶性理論"],
  7:["替代與所得效果","需求曲線","消費曲線與方程式"],
  8:["政府介入與補貼","勞動供給","跨期消費","顯示性偏好","物價指數"],
  9:["不確定性與風險","風險態度與保險"],
  10:["生產函數與要素","短期生產結構","長期生產結構","成本與利潤","短期與長期成本","規模經濟與範疇經濟","要素價格與利潤極大化"],
  11:["市場結構與完全競爭","短期與長期均衡","產業供給與政府課稅"],
  12:["獨占市場與進入障礙","獨占均衡與訂價","差別取價","政府管制"],
  13:["寡占模型","賽局理論"],
  14:["獨占性競爭市場"],
  15:["要素市場理論"],
  16:["一般均衡與福利經濟學"],
  17:["市場失靈與外部性"],
  18:["資訊經濟學"],
  19:["國際貿易理論"],
  20:["貿易政策"]
};
let glossMode="full", glossChapter=1;

let glossCat="all", glossOnlyUnlearned=false;

function renderGlossaryFull(){
  glossMode="full";
  currentChapter=0;
  renderSidebar();
  const c=document.getElementById("chapterContent");
  c.innerHTML=`<div class="chapter-head">
    <span class="kicker">全書複習</span>
    <h1>術語複習表</h1>
    <p>統整全書 ${Object.keys(TERMS).length} 個術語：打勾＝已學會、★重點、✎筆記。用分類按鈕與「只看未學會」篩選，進度自動統計，全部存在本機瀏覽器。</p>
  </div>
  <div id="glossFullRoot"></div>`;
  glossCat="all";
  renderGlossary();
}
function glossCatsForMode(){
  if(glossMode==="full")return GLOSS_CATS;
  const names=CH_TERMS_CATS[glossChapter]||[];
  return GLOSS_CATS.filter(c=>names.includes(c.name));
}
function renderGlossary(){
  const root=document.getElementById(glossMode==="full"?"glossFullRoot":"chGlossRoot");
  if(!root)return;
  const learned=GLS.get("micro-gloss-learned",[]);
  const starred=GLS.get("micro-gloss-star",[]);
  const notes=GLS.get("micro-gloss-notes",{});
  const cats=glossCatsForMode();
  const allKeys=cats.flatMap(c=>c.keys).filter(k=>TERMS[k]);
  const total=allKeys.length;
  const done=allKeys.filter(k=>learned.includes(k)).length;

  let h=`<div class="gloss-toolbar">
    <div class="gloss-cats">`;
  if(glossMode==="full"){
    h+=`<button class="gloss-cat-btn ${glossCat==="all"?"active":""}" data-cat="all">全部（${total}）</button>
      ${cats.map(c=>`<button class="gloss-cat-btn ${glossCat===c.name?"active":""}" data-cat="${esc(c.name)}">${esc(c.name)}（${c.keys.filter(k=>TERMS[k]).length}）</button>`).join("")}`;
  }else{
    h+=`<span class="gloss-cat-label">本章術語 · ${cats.map(c=>esc(c.name)).join(" ／ ")}</span>`;
  }
  h+=`</div>
    <div class="gloss-data-actions">
      <button class="toolbtn ${glossOnlyUnlearned?"active":""}" id="onlyUnlearned" title="只看未學會">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      </button>
      <button class="toolbtn" id="exportGloss" title="匯出備份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      </button>
      <button class="toolbtn" id="importGloss" title="匯入備份">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0 4 4m-4-4-4 4M4 7V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>
  </div>
  <div class="gloss-progress">
    <div class="bar"><div class="fill" style="width:${total?done/total*100:0}%"></div></div>
    <div class="label">已學會 ${done} / ${total}</div>
  </div>`;

  cats.forEach(cat=>{
    if(glossMode==="full"&&glossCat!=="all"&&glossCat!==cat.name)return;
    const items=cat.keys.filter(k=>TERMS[k]);
    if(!items.length)return;
    const catDone=items.filter(k=>learned.includes(k)).length;
    h+=`<div class="gloss-group" data-gname="${esc(cat.name)}">
      <h3>${esc(cat.name)}（${catDone}/${items.length}）</h3>
      ${items.map(k=>{
        const [en,zh,def]=TERMS[k];
        const isLearned=learned.includes(k), isStarred=starred.includes(k);
        const note=notes[k]||"";
        if(glossOnlyUnlearned&&isLearned)return "";
        const isProper=PROPER_TERMS.has(k);
        return `<div class="gloss-item ${isLearned?"done":""} ${isStarred?"starred":""}" data-key="${esc(k)}">
          <button class="gloss-check ${isLearned?"done":""}" onclick="toggleLearn(&quot;${escA(k)}&quot;)" title="標記已學會">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 13 4 4L19 7"/></svg>
          </button>
          <div class="gloss-main">
            <div class="gloss-en${isProper?" proper":""}">${esc(en)}<span class="gloss-zh${isProper?" proper":""}">${esc(zh)}</span></div>
            <div class="gloss-def">${esc(def)}</div>
            <div class="gloss-note ${note?"show":""}" data-note="wrap-${esc(k)}">
              <textarea placeholder="寫下你自己的重點…" onchange="saveNote('${esc(k)}',this.value)">${esc(note)}</textarea>
            </div>
          </div>
          <div class="gloss-actions">
            <button class="gloss-btn ${isStarred?"active":""}" onclick="toggleStar(&quot;${escA(k)}&quot;)" title="重點畫記">★ 重點</button>
            <button class="gloss-btn ${note?"active":""}" onclick="toggleNote(&quot;${escA(k)}&quot;)" title="個人筆記">✎ 筆記</button>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  });

  root.innerHTML=h;
  if(glossMode==="full"){
    root.querySelectorAll(".gloss-cat-btn").forEach(b=>{
      b.addEventListener("click",()=>{glossCat=b.dataset.cat;renderGlossary();});
    });
  }
  document.getElementById("onlyUnlearned").addEventListener("click",e=>{
    glossOnlyUnlearned=!glossOnlyUnlearned;
    e.currentTarget.classList.toggle("active",glossOnlyUnlearned);
    renderGlossary();
  });
  document.getElementById("exportGloss").addEventListener("click",exportGloss);
  document.getElementById("importGloss").addEventListener("click",()=>{
    const inp=document.createElement("input");
    inp.type="file";inp.accept=".json";
    inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importGloss(r.result);r.readAsText(f);};
    inp.click();
  });
}
function toggleLearn(k){
  let l=GLS.get("micro-gloss-learned",[]);
  l=l.includes(k)?l.filter(x=>x!==k):[...l,k];
  GLS.set("micro-gloss-learned",l);
  renderGlossary();
}
function toggleStar(k){
  let s=GLS.get("micro-gloss-star",[]);
  s=s.includes(k)?s.filter(x=>x!==k):[...s,k];
  GLS.set("micro-gloss-star",s);
  renderGlossary();
}
function toggleNote(k){
  const wrap=document.querySelector(`[data-note="wrap-${k}"]`);
  if(wrap)wrap.classList.toggle("show");
}
function saveNote(k,v){
  const notes=GLS.get("micro-gloss-notes",{});
  notes[k]=v;
  GLS.set("micro-gloss-notes",notes);
  renderGlossary();
}
function exportGloss(){
  const data={learned:GLS.get("micro-gloss-learned",[]),star:GLS.get("micro-gloss-star",[]),notes:GLS.get("micro-gloss-notes",{})};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="總經術語備份.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已匯出備份");
}
function importGloss(jsonStr){
  try{
    const d=JSON.parse(jsonStr);
    if(d.learned&&Array.isArray(d.learned)){
      const cur=GLS.get("micro-gloss-learned",[]);
      GLS.set("micro-gloss-learned",[...new Set([...cur,...d.learned])]);
    }
    if(d.star&&Array.isArray(d.star)){
      const cur=GLS.get("micro-gloss-star",[]);
      GLS.set("micro-gloss-star",[...new Set([...cur,...d.star])]);
    }
    if(d.notes&&typeof d.notes==="object"){
      const cur=GLS.get("micro-gloss-notes",{});
      GLS.set("micro-gloss-notes",{...cur,...d.notes});
    }
    toast("已匯入並合併備份");
    renderGlossary();
  }catch(e){toast("備份檔案格式錯誤");}
}

/* ===== 全書搜尋 ===== */
const searchInput=document.getElementById("searchInput");
const searchPanel=document.getElementById("searchPanel");
function stripHtml(t){return String(t||"").replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();}
function buildSearchIndex(){
  const idx=[];
  BOOK.forEach(ch=>{
    if(!ch.done)return;
    const n=ch.n;
    idx.push({type:"ch",n,title:ch.title,text:ch.title});
    (CH_SECTIONS[n]||[]).forEach(sec=>{
      idx.push({type:"sec",n,id:sec.id,title:sec.title,text:sec.title+" "+stripHtml(sec.body)});
    });
    (CH_PROBLEMS[n]||[]).forEach((p,i)=>{
      idx.push({type:"prob",n,no:i+1,text:stripHtml(p.q)+" "+stripHtml(p.ans||"")});
    });
  });
  Object.keys(TERMS).forEach(k=>{
    const [en,zh,def]=TERMS[k];
    idx.push({type:"term",key:k,en,zh,def,text:en+" "+zh+" "+def});
  });
  return idx;
}
const SEARCH_IDX=buildSearchIndex();
searchInput.addEventListener("input",()=>{
  const kw=searchInput.value.trim().toLowerCase();
  if(!kw){searchPanel.style.display="none";return;}
  const hits=SEARCH_IDX.filter(x=>x.text.toLowerCase().includes(kw)).slice(0,40);
  if(!hits.length){
    searchPanel.innerHTML=`<div class="sp-empty">找不到「${esc(kw)}」相關內容，試試其他關鍵字。</div>`;
    searchPanel.style.display="block";return;
  }
  searchPanel.innerHTML=hits.map(h=>{
    if(h.type==="ch")return `<button class="sp-item" data-act="ch" data-n="${h.n}"><span class="sp-tag">第${h.n}章</span><b>${esc(h.title)}</b><span class="sp-snip">整章內容</span></button>`;
    if(h.type==="sec")return `<button class="sp-item" data-act="sec" data-n="${h.n}" data-id="${esc(h.id)}"><span class="sp-tag">第${h.n}章·小節</span><b>${esc(h.title)}</b><span class="sp-snip">${esc(h.text.slice(0,70))}</span></button>`;
    if(h.type==="prob")return `<button class="sp-item" data-act="prob" data-n="${h.n}" data-no="${h.no}"><span class="sp-tag">第${h.n}章·例題${h.no}</span><span class="sp-snip">${esc(h.text.slice(0,80))}</span></button>`;
    return `<button class="sp-item" data-act="term" data-key="${esc(h.key)}"><span class="sp-tag">術語</span><b>${esc(h.en)} ${esc(h.zh)}</b><span class="sp-snip">${esc(h.def.slice(0,60))}</span></button>`;
  }).join("")+`<div class="sp-count">找到 ${hits.length} 筆相關內容</div>`;
  searchPanel.style.display="block";
});
searchPanel.addEventListener("click",e=>{
  const item=e.target.closest(".sp-item");
  if(!item)return;
  const act=item.dataset.act;
  searchPanel.style.display="none";
  searchInput.value="";
  if(act==="ch"){
    renderChapter(+item.dataset.n);
    window.scrollTo({top:0,behavior:"smooth"});
  }else if(act==="sec"){
    renderChapter(+item.dataset.n);
    setTimeout(()=>{
      const el=document.getElementById("sec-"+item.dataset.id);
      if(el){el.classList.add("open");el.scrollIntoView({behavior:"smooth",block:"start"});}
    },60);
  }else if(act==="prob"){
    renderChapter(+item.dataset.n);
    setTimeout(()=>{
      const el=document.getElementById("prob-"+item.dataset.n+"-"+item.dataset.no);
      if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
    },60);
  }else if(act==="term"){
    openTerm(item.dataset.key);
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){searchPanel.style.display="none";searchInput.blur();}
});


/* ===== 重點標記 ===== */
let hlEnabled=true;
function getHls(){try{return JSON.parse(localStorage.getItem("micro-hl")||"[]")}catch(e){return[]}}
function saveHls(h){localStorage.setItem("micro-hl",JSON.stringify(h))}

document.addEventListener("mouseup",e=>{
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed)return;
  const txt=sel.toString().trim();
  if(txt.length<2||txt.length>300)return;
  // 檢查是否點在工具列/按鈕上
  if(e.target.closest(".toolbtn,.ans-btn,.flip-card,.term,.section-head"))return;
  const range=sel.getRangeAt(0);
  const el=range.startContainer.parentElement;
  if(!el.closest(".section-body,.problem"))return;
  const hls=getHls();
  if(hls.some(h=>h.txt===txt))return;
  hls.push({txt,time:Date.now()});
  saveHls(hls);
  applyHighlights();
  toast("已加入重點標記（點黃色文字可移除）");
});

function applyHighlights(){
  const hls=getHls();
  document.querySelectorAll(".section-body .userhl,.problem .userhl").forEach(el=>el.outerHTML=el.textContent);
  if(!hlEnabled)return;
  hls.forEach(h=>{
    document.querySelectorAll(".section-body p,.section-body .note,.section-body .warn,.problem .p-body").forEach(block=>{
      const text=block.textContent;
      if(!text.includes(h.txt))return;
      if(block.querySelector(".userhl"))return;
      const idx=text.indexOf(h.txt);
      const frag=document.createDocumentFragment();
      frag.appendChild(document.createTextNode(text.slice(0,idx)));
      const m=document.createElement("mark");
      m.className="userhl";m.textContent=h.txt;
      m.addEventListener("click",()=>{
        const arr=getHls().filter(x=>x.txt!==h.txt);
        saveHls(arr);applyHighlights();toast("已移除重點標記");
      });
      frag.appendChild(m);
      frag.appendChild(document.createTextNode(text.slice(idx+h.txt.length)));
      block.replaceChildren(frag);
    });
  });
}

document.getElementById("hlToggle").addEventListener("click",e=>{
  hlEnabled=!hlEnabled;
  e.currentTarget.classList.toggle("active",hlEnabled);
  applyHighlights();
  toast(hlEnabled?"重點標記已顯示":"重點標記已隱藏");
});

/* ===== 畫記模式 / 深色 ===== */
let markMode=false;
const markBtn=document.getElementById("markToggle");
markBtn.addEventListener("click",e=>{
  markMode=!markMode;
  document.body.classList.toggle("marking",markMode);
  markBtn.classList.toggle("active",markMode);
  toast(markMode?"畫記模式開啟：點文字即可高亮（再點一次關閉並儲存）":"畫記模式已關閉，重點已儲存");
});
document.addEventListener("click",e=>{
  if(!markMode)return;
  if(e.target.closest(".toolbtn,.ans-btn,.term,.section-head"))return;
  if(e.target.closest(".userhl"))return;
  const el=e.target.closest(".section-body p,.section-body li,.section-body .note,.section-body .warn,.problem .p-body");
  if(!el)return;
  e.preventDefault();e.stopPropagation();
  const txt=el.textContent.trim();
  if(txt.length<2||txt.length>500){toast("這段太長，請改用拖選文字畫重點");return;}
  const hls=getHls();
  if(hls.some(h=>h.txt===txt))return;
  hls.push({txt,time:Date.now()});
  saveHls(hls);
  applyHighlights();
  toast("已加入重點標記（點黃色文字可移除）");
});
document.getElementById("darkToggle").addEventListener("click",e=>{
  document.body.classList.toggle("dark");
  e.currentTarget.classList.toggle("active",document.body.classList.contains("dark"));
});

/* ===== toast ===== */
function toast(msg){
  let t=document.getElementById("toast");
  if(!t){
    t=document.createElement("div");
    t.id="toast";
    t.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#26303b;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.2);opacity:0;transition:opacity .25s;pointer-events:none";
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.opacity="1";
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>t.style.opacity="0",1800);
}

renderSidebar();
renderChapter(1);
